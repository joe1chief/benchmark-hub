name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI — Validate & Build Check"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual deployment reason"
        required: false
        default: "Manual deployment"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Resolve pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate benchmark data and README statistics
        id: benchmark-stats
        run: |
          python3 scripts/validate_benchmarks.py --html
          python3 scripts/update_readme_stats.py /tmp/benchmark-stats.env
          if ! git diff --exit-code -- README.md; then
            echo "::error file=README.md::Benchmark statistics are stale."
            exit 1
          fi
          source /tmp/benchmark-stats.env
          echo "benchmark_total=$BENCHMARK_TOTAL" >> "$GITHUB_OUTPUT"
          echo "benchmark_dims=$BENCHMARK_DIMS" >> "$GITHUB_OUTPUT"

      - name: Verify canonical HTML graph sources for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:build-process-source

      - name: Audit all HTML flowchart assets for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: pnpm audit:build-process

      - name: Validate HTML flowcharts for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:html-flowchart

      - name: Run full checks for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm exec tsc --noEmit
          pnpm test:build-process
          pnpm test:benchmark-ingestion

      - name: Build for GitHub Pages
        run: pnpm build:ghpages
        env:
          NODE_ENV: production

      - name: Deploy verified artifact to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-ghpages
          publish_branch: gh-pages
          commit_message: |
            chore(deploy): publish verified commit ${{ env.DEPLOY_SHA }}

            Triggered by: ${{ github.event_name }}
            Benchmarks: ${{ steps.benchmark-stats.outputs.benchmark_total }} total, ${{ steps.benchmark-stats.outputs.benchmark_dims }} dims
            Reason: ${{ inputs.reason || 'successful main CI' }}
          force_orphan: false
          enable_jekyll: false

      - name: Deployment summary
        run: |
          echo "## ✅ Verified deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${DEPLOY_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Benchmarks | ${{ steps.benchmark-stats.outputs.benchmark_total }} total |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dimensions | ${{ steps.benchmark-stats.outputs.benchmark_dims }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Live URL | https://joe1chief.github.io/llm-benchmark-costco/ |" >> "$GITHUB_STEP_SUMMARY"
