name: Optional Draw.io Export Fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawio-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drawio-fidelity-shards:
    name: Draw.io Export Fidelity (macOS) / shard ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Draw.io toolchain
        run: bash scripts/ci/install_drawio_toolchain_macos.sh

      - name: Audit legacy Draw.io export assets
        run: node scripts/benchmark_build_process/audit_build_process_assets.mjs

      - name: Diagnose representative PNG fidelity
        if: matrix.shard == 1
        run: bash scripts/ci/diagnose_drawio_png_macos.sh

      - name: Run Draw.io fidelity regression tests
        run: >-
          node --test --test-concurrency=1
          --test-shard=${{ matrix.shard }}/8
          scripts/benchmark_build_process/paper_review_site_a*.scoped.test.mjs

  drawio-fidelity:
    name: Draw.io Export Fidelity (macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: drawio-fidelity-shards
    if: ${{ always() }}
    steps:
      - name: Verify all macOS shards passed
        env:
          SHARD_RESULT: ${{ needs.drawio-fidelity-shards.result }}
        run: |
          test "$SHARD_RESULT" = "success"
          echo "✅ All macOS Draw.io fidelity shards passed" >> "$GITHUB_STEP_SUMMARY"

