meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentsBench 构建流程
  description: 与 MedicalAgentsBench 论文最新版对齐地展示八个医学问答源集的难度筛选、人工推理深度与有效性核验、MELD 污染筛查、862 题发布及准确率成本评测。
  legend: 实线箭头依次表示八个源数据集、低于 50% 模型正确率门槛、九个平衡子集、四名医学生审核、MELD、862 题和模型方法成本联合评测。
nodes:
  - id: sources
    label: |-
      汇集八个医学问答数据集
      MedQA、PubMedQA、MedMCQA
      MedBullets、MMLU、MMLU-Pro
      MedExQA 与 MedXpertQA
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: standardize
    label: |-
      统一多项选择题合同
      保留问题选项和正确答案
      统一数据集与题目标识
      MedXpert 分 R 与 U 子集
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: probe
    label: |-
      用多架构模型探测难度
      对每个候选题运行代表模型
      统计模型正确作答比例
      避免单一架构定义难度
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: hardgate
    label: |-
      执行困难候选门槛
      仅保留模型正确率低于 50%
      聚焦尚未饱和的临床推理
      排除明显简单题目
    type: decision
    size: xl
    position:
      x: 740
      'y': 40
  - id: sample
    label: |-
      平衡九个评测子集
      七个子集各取 100 题
      MedBullets 取 89 题
      MMLU 取 73 题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: depth
    label: |-
      核验多步推理深度
      四名临床阶段医学生
      使用五级推理深度量表
      记录离散推理和判断步骤
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: validity
    label: |-
      审核问题临床有效性
      标记错答案和上下文不足
      排除陈旧或临床无关知识
      共移除 21 个问题
    type: decision
    size: xl
    position:
      x: 1460
      'y': 40
  - id: meld
    label: |-
      使用 MELD 筛查污染
      问题文本去掉答案选项
      前半提示生成后半内容
      按 Levenshtein 相似度识别记忆
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      发布 MedicalAgentsBench
      最终包含 862 道困难题
      平均长度 147.4 tokens
      覆盖八源集九个子集
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: basemodels
    label: |-
      评测十个基础模型
      七个非推理基础模型
      三个内化推理模型
      使用统一提示和选择解析
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: methods
    label: |-
      评测九种外化推理方法
      CoT 与 Self-Consistency
      三种高级提示方法
      四种协作或搜索型 Agent
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: accuracy
    label: |-
      计算选择题准确率
      比较预测选项与答案索引
      按九个子集汇总结果
      再计算跨数据集平均值
    type: decision
    size: xl
    position:
      x: 500
      'y': 420
  - id: cost
    label: |-
      统计推理成本与耗时
      商业模型按 token 定价
      开源模型按托管价格估算
      记录样本完整交互耗时
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      发布能力成本联合分析
      对比内化与外化推理
      绘制准确率成本 Pareto 前沿
      报告模型方法互补效果
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: standardize
    type: primary
  - from: standardize
    to: probe
    type: primary
  - from: probe
    to: hardgate
    type: primary
  - from: hardgate
    to: sample
    type: primary
  - from: sample
    to: depth
    type: primary
  - from: depth
    to: validity
    type: primary
  - from: validity
    to: meld
    type: primary
  - from: meld
    to: release
    type: primary
  - from: release
    to: basemodels
    type: primary
  - from: basemodels
    to: methods
    type: primary
  - from: methods
    to: accuracy
    type: primary
  - from: accuracy
    to: cost
    type: primary
  - from: cost
    to: report
    type: primary
modules: []
