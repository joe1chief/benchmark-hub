meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedicalAgentsBench Construction and Evaluation
  description: >-
    Paper-v3-aligned workflow from eight medical QA sources through difficulty filtering, human and MELD
    verification, the 862-question release contract, and the released exact-choice, cost, and latency analysis.
  legend: >-
    Solid arrows show retained construction and evaluation flow. Labeled branches expose the below-50% hard gate,
    human validity exclusions, emitted-result denominator, and paper-to-release drift. Dashed arrows mark exclusions
    or evidence boundaries; the paper does not disclose a MELD cutoff, verification order, or replacement policy.
nodes:
  - id: sources
    label: |-
      Aggregate Eight Medical QA Sources
      MedQA · PubMedQA · MedMCQA · MedBullets
      MMLU · MMLU-Pro · MedExQA · MedXpertQA
      MedXpertQA Splits into R and U
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: standardize
    label: |-
      Standardize Multiple-choice Records
      Question · Option Map · Gold Index
      Preserve Dataset and Real-item IDs
      Three to Ten Answer Options
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: probe
    label: |-
      Probe Each Candidate across Models
      Use Multiple Model Architectures
      Count k Correct among N Tested
      Avoid One-model Difficulty Bias
    type: process
    size: xl
    position:
      x: 660
      'y': 40
  - id: hard_gate
    label: |-
      Is the Correct-model Fraction
      k / N Strictly below 50%?
    type: decision
    size: xl
    position:
      x: 980
      'y': 40
  - id: sample
    label: |-
      Sample Hard Candidates per Subset
      Maximum 100 from Each Subset
      Balance Nine Evaluation Subsets
      Preserve Source Diversity
    type: process
    size: xl
    position:
      x: 1300
      'y': 40
  - id: depth
    label: |-
      Annotate Reasoning Depth
      Four Clinical-year Medical Students
      Five Levels of Minimum Inference Steps
      Calibration + Overlap for Agreement
    type: user
    size: xl
    position:
      x: 1620
      'y': 40
  - id: human_review
    label: |-
      Review Question Validity
      Flag Wrong Gold · Poor Context
      Flag Outdated or Irrelevant Knowledge
      Any Flag Triggers Group Review
    type: process
    size: xl
    position:
      x: 1620
      'y': 380
  - id: validity_gate
    label: |-
      Do Fewer than Two Annotators
      Agree the Concern Is Valid?
    type: decision
    size: xl
    position:
      x: 1300
      'y': 380
  - id: meld
    label: |-
      Run MELD Contamination Screening
      Remove Options · Split Question in Half
      Generate the Unseen Second Half
      Compare by Levenshtein Similarity
    type: process
    size: xl
    position:
      x: 1620
      'y': 700
  - id: verification_merge
    label: |-
      Integrate Both Verification Controls
      Human Validity + MELD Evidence
      MELD Cutoff + Exclusions Undisclosed
      Final-count Reconciliation Undisclosed
    type: process
    size: xl
    position:
      x: 1300
      'y': 700
  - id: excluded
    label: |-
      Exclude from Paper Hard Set
      Easy Candidate or Validity Failure
      Twenty-one Human-review Exclusions
      5 Wrong · 5 Context · 11 Relevance
    type: terminal
    size: xl
    position:
      x: 980
      'y': 980
  - id: release
    label: |-
      Release Paper-v3 MedicalAgentsBench
      862 Questions · Mean 147.4 Tokens
      Seven Subsets × 100 + MedBullets 89
      + MMLU 73 across Nine Subsets
    type: database
    size: xl
    position:
      x: 980
      'y': 700
  - id: release_drift
    label: |-
      Pinned Public-release Drift
      Git v1.0 + HF/Zenodo Add AfriMedQA 32
      README Task Table Totals 894, Not 862
      Paper Gives No Reconciliation
    type: document
    size: xl
    position:
      x: 660
      'y': 980
  - id: evaluation
    label: |-
      Run Standardized Evaluations
      7 Base + 3 Internalized Models
      Nine Externalized Methods; Coverage Varies
      SPO/AFlow: GPT-4o-mini / GPT-4o Only
      Hard-set Agents · Three Runs
    type: process
    size: xl
    position:
      x: 660
      'y': 700
  - id: parser
    label: |-
      Extract One Option Label
      Method-specific JSON or LLM Parsers
      Reimplemented Agent Parsers Where Needed
      No Single Universal Parser Is Released
    type: process
    size: xl
    position:
      x: 340
      'y': 700
  - id: emitted_gate
    label: |-
      Did the Runner Emit a Result Row
      with realidx and predicted_answer?
    type: decision
    size: xl
    position:
      x: 20
      'y': 700
  - id: missing_boundary
    label: |-
      Method-specific Failure or Omission
      Global Scorer Does Not Restore Missing IDs
      No Fixed-862 Denominator Is Enforced
    type: terminal
    size: xl
    position:
      x: 20
      'y': 980
  - id: exact_score
    label: |-
      Score Exact Choice Equality
      Gold = answer_idx, Else answer
      Correct iff Gold Equals Prediction
      Item Score Is One or Zero
    type: process
    size: xl
    position:
      x: 20
      'y': 1260
  - id: aggregate
    label: |-
      Deduplicate First by realidx
      Accuracy = Mean over Retained Rows
      Macro-average the Nine Paper Subsets
      Report Mean ± Std over Three Runs
    type: process
    size: xl
    position:
      x: 340
      'y': 1260
  - id: cost_time
    label: |-
      Average Cost/Time on Retained Rows
      API Tokens or Published Hosting Rates
      Raw Time = Full-cycle Wall Clock
      Pareto Notebook Adjusts DeepSeek-V3
      Plotted Time = Raw Mean / 10
    type: process
    size: xl
    position:
      x: 660
      'y': 1260
  - id: report
    label: |-
      Publish Accuracy–Cost Results
      Pass@1 + Per-subset Accuracy
      Inference Cost + Adjusted Time Markers
      Empirical Pareto Frontier
    type: terminal
    size: xl
    position:
      x: 980
      'y': 1260
edges:
  - from: sources
    to: standardize
    type: primary
  - from: standardize
    to: probe
    type: primary
  - from: probe
    to: hard_gate
    type: primary
  - from: hard_gate
    to: sample
    type: primary
    label: Yes · k/N < 0.5
    labelPosition: end
  - from: hard_gate
    to: excluded
    type: optional
    label: No · at least 50% correct
    labelPosition: end
    waypoints:
      - x: 1080
        'y': 250
      - x: 1080
        'y': 900
  - from: sample
    to: depth
    type: primary
  - from: depth
    to: human_review
    type: primary
  - from: human_review
    to: validity_gate
    type: primary
  - from: validity_gate
    to: verification_merge
    type: primary
    label: Yes · retain
    labelPosition: end
  - from: validity_gate
    to: excluded
    type: optional
    label: No · two or more agree
    labelPosition: end
    waypoints:
      - x: 1400
        'y': 560
      - x: 1080
        'y': 560
  - from: depth
    to: meld
    type: primary
    waypoints:
      - x: 1740
        'y': 250
      - x: 1740
        'y': 620
  - from: meld
    to: verification_merge
    type: primary
  - from: verification_merge
    to: release
    type: primary
  - from: release
    to: release_drift
    type: optional
    label: Current artifact mismatch
    labelPosition: end
  - from: release
    to: evaluation
    type: primary
  - from: evaluation
    to: parser
    type: primary
  - from: parser
    to: emitted_gate
    type: primary
  - from: emitted_gate
    to: exact_score
    type: primary
    label: Yes · retained row
    labelPosition: end
  - from: emitted_gate
    to: missing_boundary
    type: optional
    label: No · not in scorer input
    labelPosition: end
  - from: exact_score
    to: aggregate
    type: primary
  - from: aggregate
    to: cost_time
    type: primary
  - from: cost_time
    to: report
    type: primary
modules: []
