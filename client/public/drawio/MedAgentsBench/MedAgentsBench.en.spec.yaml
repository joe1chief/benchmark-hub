meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentsBench Build Process
  description: >-
    Current MedicalAgentsBench paper-aligned difficulty filtering over eight medical QA sources, human reasoning-depth
    and validity review, MELD contamination screening, 862-item release, and joint accuracy-cost evaluation.
  legend: >-
    Solid arrows trace eight source datasets, a below-50% model-accuracy gate, nine balanced subsets, four
    medical-student reviewers, MELD, 862 questions, and model-method cost evaluation.
nodes:
  - id: sources
    label: |-
      Aggregate Eight Medical QA Sets
      MedQA · PubMedQA · MedMCQA
      MedBullets · MMLU · MMLU-Pro
      MedExQA and MedXpertQA
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: standardize
    label: |-
      Standardize Multiple-choice Data
      Preserve Question · Options · Gold
      Unify Dataset and Item Identifiers
      Split MedXpert into R and U
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: probe
    label: |-
      Probe Difficulty across Models
      Run Diverse Architectures per Item
      Measure the Fraction Correct
      Avoid One-model Difficulty Bias
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: hardgate
    label: |-
      Apply the Hard-candidate Gate
      Keep Items below 50% Correct
      Focus on Unsaturated Reasoning
      Remove Clearly Easy Questions
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: sample
    label: |-
      Balance Nine Evaluation Subsets
      Seven Subsets Keep 100 Each
      MedBullets Keeps 89
      MMLU Keeps 73
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: depth
    label: |-
      Validate Multi-step Reasoning
      Four Clinical-year Med Students
      Use a Five-level Depth Rubric
      Document Discrete Inference Steps
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: validity
    label: |-
      Review Clinical Validity
      Flag Wrong Gold and Poor Context
      Exclude Outdated · Irrelevant Items
      Remove 21 Questions in Total
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: meld
    label: |-
      Screen Contamination with MELD
      Exclude Answer Options from Text
      Prompt First Half · Generate Second
      Detect Memory by Levenshtein Match
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release MedicalAgentsBench
      Final Set Has 862 Hard Questions
      Average Length · 147.4 Tokens
      Eight Sources · Nine Subsets
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: basemodels
    label: |-
      Evaluate Ten Base Models
      Seven Non-reasoning Models
      Three Internalized Reasoners
      Use Unified Prompts and Parsing
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: methods
    label: |-
      Evaluate Nine Externalized Methods
      CoT and Self-Consistency
      Three Advanced Prompting Methods
      Four Collaborative or Search Agents
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: accuracy
    label: |-
      Calculate Choice Accuracy
      Compare Prediction with Gold Index
      Aggregate by Nine Subsets
      Average across Source Datasets
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: cost
    label: |-
      Measure Inference Cost and Time
      Price Commercial Models by Tokens
      Estimate Open Models by Hosting
      Time the Full Interaction Cycle
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Publish Accuracy–Cost Analysis
      Compare Internalized · Externalized
      Trace the Pareto Frontier
      Report Complementary Gains
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
