meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TVBench 构建与评测流程
  description: >-
    TVBench围绕三条反捷径要求构建：随机单帧不足以作答，问题与选项文本不能泄露答案，世界知识不能单独解题。作者定义10类任务：动作计数；物体打乱、物体计数与移动方向；动作定位与意外动作；动作序列、场景转换与第一视角序列；以及时间上相反的动作反义词。视频和标注改编自Perception
    Test、CLEVRER、STAR、MoVQA、Charades-STA、NTU
    RGB+D、FunQA与CSV。任务专用模板避免LLM措辞伪影，干扰项采用时间上可信的替代答案，适用任务平衡正确选项频率，并删除依赖世界知识的问题。最新论文版本包含2654组视频多选问答。评测按任务和整体计算选项精确准确率；纯文本与随机单帧模型应接近随机水平，乱序与倒放测试用于确认成功确实依赖时间顺序，而不是静态外观或答案先验。
  legend: >-
    来源：TVBench arXiv:2410.07752v3 Sections 4-5 and official daniel-cores/tvbench repository and FunAILab/TVBench dataset
    card。实线箭头表示论文或官方资料明确支持的主流程。
