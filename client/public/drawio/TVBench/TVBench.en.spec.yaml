  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TVBench Build and Evaluation Process
  description: >-
    TVBench is designed around three anti-shortcut requirements: a random single frame must be insufficient, question
    and answer text must not reveal the answer, and world knowledge must not solve the item. The authors define ten
    tasks: Action Count; Object Shuffle, Object Count, and Moving Direction; Action Localization and Unexpected Action;
    Action Sequence, Scene Transition, and Egocentric Sequence; plus temporally opposed Action Antonyms. Videos and
    annotations are adapted from Perception Test, CLEVRER, STAR, MoVQA, Charades-STA, NTU RGB+D, FunQA, and CSV.
    Task-specific templates avoid LLM wording artifacts. Distractors are temporally plausible alternatives,
    correct-option frequencies are balanced for applicable tasks, and world-knowledge questions are excluded. The latest
    paper release contains 2,654 video multiple-choice QA pairs. Evaluation uses exact choice accuracy by task and
    overall. Text-only and random-frame models should remain near chance; shuffled and reversed video tests verify that
    success depends on temporal order rather than static appearance or answer priors.
  legend: >-
    Source: TVBench arXiv:2410.07752v3 Sections 4-5 and official daniel-cores/tvbench repository and FunAILab/TVBench
    dataset card. Solid arrows show the main flow explicitly supported by the paper or official documentation.
