meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVista 构建流程
  description: 对齐论文第 3 版、发布数据与官方代码，展示 MathVista 从 31 个来源构建，到类型感知作答、混合答案抽取、确定性规范化、公开标签评分及论文与 README 隐藏测试边界的完整流程。
  legend: 实线表示保留的数据与评分路径；虚线表示排除、备用抽取、隐藏标签、实现漂移或错误结果路径。来源：arXiv:2310.02255v3、Git 53d5258、HF 2b6ad694。
nodes:
  - id: mathqa_sources
    label: |-
      汇集 9 个 MathQA 数据集
      GPS · 视觉 MWP · 大学 TQA
      保留多模态数学来源
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: mathqa_cap
    label: |-
      保留来源附带标注
      解法 · 程序 · 定理
      每个来源最多 400 题
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: mathqa_pool
    label: |-
      MathQA 数据池
      2,666 个样本
    type: database
    size: lg
    position:
      x: 580
      'y': 40
  - id: vqa_sources
    label: |-
      审查 70 多个 VQA 数据集
      保留 19 个公开来源
      搜索数学相关样本
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: heuristic
    label: |-
      是否命中启发式规则？
      数字答案或数量词
    type: decision
    size: xl
    position:
      x: 300
      'y': 260
  - id: math_reasoning
    label: |-
      是否需要数学推理？
      三名专家标注员
      多数投票 · Fleiss κ 0.775
    type: decision
    size: xl
    position:
      x: 580
      'y': 260
  - id: vqa_pool
    label: |-
      VQA 数学数据池
      每个来源最多 400 题
      2,739 个样本
    type: database
    size: xl
    position:
      x: 860
      'y': 260
  - id: excluded
    label: |-
      排除候选样本
      未命中规则或不涉及数学
    type: loss
    size: xl
    position:
      x: 860
      'y': 540
  - id: new_sources
    label: |-
      新建三个数据集
      IQTest 228 · FunctionQA 400
      PaperQA：论文 107 · 发布 108
    type: document
    size: xl
    position:
      x: 20
      'y': 620
  - id: new_review
    label: |-
      STEM 研究生人工标注
      逻辑 · 代数 · 科学推理
      严格人工复核
    type: user
    size: xl
    position:
      x: 300
      'y': 620
  - id: new_pool
    label: |-
      发布版新增数据池
      736 个样本
    type: database
    size: lg
    position:
      x: 580
      'y': 620
  - id: merge
    label: |-
      合并 31 个来源
      共 6,141 道题
      3,392 道选择题
      2,749 道自由回答题
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: metadata
    label: |-
      添加细粒度元数据
      5 类任务 · 7 类数学技能
      来源 · 语境 · 年级 · 语言
      人工复核 1K 题技能标签
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: release
    label: |-
      发布两个子集
      testmini：1,000 题公开标签
      test：5,141 题隐藏标签
      每来源先抽 ≥4 题再按比例抽样
    type: database
    size: xl
    position:
      x: 1700
      'y': 620
  - id: query
    label: |-
      构造类型感知 query
      任务提示 · 题干 · 选项
      可选图注与 OCR
      明确最终答案格式
    type: document
    size: xl
    position:
      x: 1700
      'y': 1040
  - id: infer
    label: |-
      生成模型响应
      输入图像与 query
      按 PID 保存原始响应
    type: process
    size: xl
    position:
      x: 1420
      'y': 1040
  - id: extract_route
    label: 能否直接抽取答案？
    type: decision
    size: xl
    position:
      x: 1140
      'y': 1040
  - id: direct_extract
    label: |-
      执行直接抽取规则
      精确选项文本 · 整数 · 浮点数
      可选“The answer is …”正则
    type: process
    size: xl
    position:
      x: 860
      'y': 940
  - id: llm_extract
    label: |-
      使用 LLM 抽取答案
      五个演示样本
      当前代码读取 AZURE_OPENAI_MODEL
      抽取异常时返回空字符串
    type: process
    size: xl
    position:
      x: 860
      'y': 1160
  - id: answer_contract
    label: 使用哪类答案合同？
    type: decision
    size: xl
    position:
      x: 580
      'y': 1040
  - id: mc_normalize
    label: |-
      规范化选择题答案
      “(A)”或字母映射到选项文本
      否则按 Levenshtein 取最近选项
    type: process
    size: xl
    position:
      x: 300
      'y': 940
  - id: free_normalize
    label: |-
      规范化自由回答
      整数：int(float)
      浮点：按 precision 四舍五入
      列表：转字符串
    type: process
    size: xl
    position:
      x: 300
      'y': 1160
  - id: scoring_scope
    label: 是否有标准答案标签？
    type: decision
    size: xl
    position:
      x: 580
      'y': 1380
  - id: local_compare
    label: |-
      执行安全精确相等比较
      预测字符串 = 标准字符串
      None 或不匹配均为 false
    type: process
    size: xl
    position:
      x: 860
      'y': 1320
  - id: hidden_submit
    label: |-
      论文中的隐藏测试计划
      5,141 题 test 标签不公开
      维护在线评测平台
    type: document
    size: xl
    position:
      x: 860
      'y': 1540
  - id: readme_drift
    label: |-
      当前 README（53d5258）
      将 test 结果文件邮件发给作者
      由作者生成 score 文件
      自动 CodaLab 仍在建设中
    type: document
    size: xl
    position:
      x: 1140
      'y': 1580
  - id: correct_check
    label: 是否精确匹配？
    type: decision
    size: lg
    position:
      x: 1140
      'y': 1320
  - id: correct
    label: 记录 true
    type: process
    size: lg
    position:
      x: 1420
      'y': 1240
  - id: incorrect
    label: 记录 false
    type: loss
    size: lg
    position:
      x: 1420
      'y': 1400
  - id: report
    label: |-
      报告准确率
      总体及九类元数据切片
      正确数 / 已评测结果行
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 1320
edges:
  - from: mathqa_sources
    to: mathqa_cap
    type: primary
    label: 9 个来源
    labelPosition: center
  - from: mathqa_cap
    to: mathqa_pool
    type: primary
    label: 限额后汇集
    labelPosition: center
  - from: mathqa_pool
    to: merge
    type: primary
    label: 2,666 个 MathQA
    labelPosition: center
    waypoints:
      - x: 700
        'y': 180
      - x: 1540
        'y': 180
  - from: vqa_sources
    to: heuristic
    type: primary
    label: 公开候选
    labelPosition: center
  - from: heuristic
    to: math_reasoning
    type: primary
    label: 是 · 4,949 个候选
    labelPosition: center
  - from: heuristic
    to: excluded
    type: optional
    label: 否 · 排除
    labelPosition: center
    waypoints:
      - x: 420
        'y': 520
      - x: 980
        'y': 520
  - from: math_reasoning
    to: vqa_pool
    type: primary
    label: 是 · 多数通过
    labelPosition: center
  - from: math_reasoning
    to: excluded
    type: optional
    label: 未获多数 · 拒绝
    labelPosition: center
  - from: vqa_pool
    to: merge
    type: primary
    label: 2,739 个 VQA
    labelPosition: center
  - from: new_sources
    to: new_review
    type: primary
    label: 论文正文共 735 项
    labelPosition: center
  - from: new_review
    to: new_pool
    type: primary
    label: 发布版已复核
    labelPosition: center
  - from: new_pool
    to: merge
    type: primary
    label: 发布版 736 项
    labelPosition: center
    waypoints:
      - x: 700
        'y': 820
      - x: 1540
        'y': 820
  - from: merge
    to: metadata
    type: primary
    label: 6,141 行
    labelPosition: center
  - from: metadata
    to: release
    type: primary
    label: 标准化记录
    labelPosition: center
  - from: release
    to: query
    type: primary
    label: 选定子集
    labelPosition: center
  - from: query
    to: infer
    type: primary
    label: 类型化提示
    labelPosition: center
  - from: infer
    to: extract_route
    type: primary
    label: 原始响应
    labelPosition: center
  - from: extract_route
    to: direct_extract
    type: primary
    label: 是 · 规则路径
    labelPosition: center
  - from: extract_route
    to: llm_extract
    type: optional
    label: 否 · 一般情形
    labelPosition: center
  - from: direct_extract
    to: answer_contract
    type: primary
    label: 已抽取值
    labelPosition: center
  - from: llm_extract
    to: answer_contract
    type: optional
    label: LLM 抽取值
    labelPosition: center
  - from: answer_contract
    to: mc_normalize
    type: primary
    label: 选择题
    labelPosition: center
  - from: answer_contract
    to: free_normalize
    type: primary
    label: 整数/浮点/列表
    labelPosition: center
  - from: mc_normalize
    to: scoring_scope
    type: primary
    label: 选项文本
    labelPosition: center
    waypoints:
      - x: 420
        'y': 1340
      - x: 700
        'y': 1340
  - from: free_normalize
    to: scoring_scope
    type: primary
    label: 类型化字符串/None
    labelPosition: center
    waypoints:
      - x: 420
        'y': 1360
      - x: 700
        'y': 1360
  - from: scoring_scope
    to: local_compare
    type: primary
    label: testmini · 公开
    labelPosition: center
  - from: scoring_scope
    to: hidden_submit
    type: optional
    label: test · 论文在线计划
    labelPosition: center
  - from: local_compare
    to: correct_check
    type: primary
    label: 布尔结果
    labelPosition: center
  - from: correct_check
    to: correct
    type: primary
    label: 是 · 相等
    labelPosition: center
  - from: correct_check
    to: incorrect
    type: optional
    label: 否 · 不等
    labelPosition: center
  - from: correct
    to: report
    type: primary
    label: 正确数加一
    labelPosition: center
  - from: incorrect
    to: report
    type: optional
    label: 仅计入分母
    labelPosition: center
  - from: hidden_submit
    to: readme_drift
    type: optional
    label: 固定版 README 漂移
    labelPosition: center
  - from: readme_drift
    to: report
    type: optional
    label: 作者生成 score 文件
    labelPosition: center
    waypoints:
      - x: 1260
        'y': 1740
      - x: 1820
        'y': 1700
modules: []
