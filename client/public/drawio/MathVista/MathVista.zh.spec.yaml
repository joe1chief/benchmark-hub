meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVista 构建流程
  description: 与论文及官方评测代码对齐地展示 MathVista 的多源视觉数学题汇集、标准化标注、双测试集发布与三阶段准确率评测。
  legend: 实线箭头依次表示 28 个既有数据集与 3 个新数据集汇集、元数据标注、6141 题发布、作答、答案抽取、规范化和准确率汇总。
nodes:
  - id: existing
    label: |-
      汇集 28 个既有数据集
      9 个数学问答数据集
      19 个通用视觉问答集
      覆盖多类视觉数学问题
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: newsets
    label: |-
      新建三个补充数据集
      IQTest：图形谜题逻辑
      FunctionQA：函数图代数
      PaperQA：论文图科学推理
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: curate
    label: |-
      预处理并筛选样本
      统一问题与配图内容
      清理既有来源数据
      为评测用途重新标注
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: consolidate
    label: |-
      合并 31 个来源
      共形成 6141 道题
      保留多样视觉上下文
      同时含选择与自由回答
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: taxonomy
    label: |-
      添加细粒度元数据
      五类任务与七类推理
      标注来源类别与图像语境
      记录年级语言及技能
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: format
    label: |-
      统一单题数据合同
      问题图像选项与答案
      记录单位精度和答案类型
      生成标准输入 query
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: split
    label: |-
      发布两个互斥子集
      testmini：1000 题公开答案
      test：5141 题隐藏答案
      标准评测使用完整 test
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: query
    label: |-
      构造类型感知提示
      融合任务说明与问题
      加入选项和相关元数据
      明确终答所需格式
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: infer
    label: |-
      运行基础模型作答
      输入视觉与文本上下文
      允许生成详细推理回复
      保存每题原始响应
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: extract
    label: |-
      抽取短格式最终答案
      先处理直接数值与选项
      一般情形使用 GPT-4 抽取
      200 题预研准确率超 99.5%
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: normalize
    label: |-
      按答案合同规范化
      选择题映射字母或选项
      整数与浮点按精度转换
      保留列表和文本格式
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: judge
    label: |-
      执行确定性正确性判断
      规范化预测对照标准答案
      每题记录 true 或 false
      空抽取按官方规则处理
    type: decision
    size: xl
    position:
      x: 500
      'y': 420
  - id: aggregate
    label: |-
      汇总总体准确率
      按任务与推理类型细分
      按来源语境年级和语言分析
      同时报告答案类型表现
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      发布 MathVista 结果
      形成统一模型排行榜
      对比模型与人类表现
      分析视觉感知和数学推理
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: existing
    to: newsets
    type: primary
  - from: newsets
    to: curate
    type: primary
  - from: curate
    to: consolidate
    type: primary
  - from: consolidate
    to: taxonomy
    type: primary
  - from: taxonomy
    to: format
    type: primary
  - from: format
    to: split
    type: primary
  - from: split
    to: query
    type: primary
  - from: query
    to: infer
    type: primary
  - from: infer
    to: extract
    type: primary
  - from: extract
    to: normalize
    type: primary
  - from: normalize
    to: judge
    type: primary
  - from: judge
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
