meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVista Build Process
  description: >-
    Paper-v3, released-data, and official-code-aligned construction from 31 sources, followed by type-aware response
    generation, hybrid answer extraction, deterministic normalization, public-label scoring, and the paper-versus-README
    hidden-test evaluation boundary.
  legend: >-
    Solid arrows are retained data and scoring paths. Dashed arrows are exclusions, alternate extraction, hidden-label,
    implementation-drift, or incorrect-result paths. Sources: arXiv:2310.02255v3, Git 53d5258, HF 2b6ad694.
nodes:
  - id: mathqa_sources
    label: |-
      Collect Nine MathQA Datasets
      GPS · Visual MWP · College TQA
      Preserve Multimodal Math Sources
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: mathqa_cap
    label: |-
      Preserve Source Annotations
      Solutions · Programs · Theorems
      Cap Each Source at 400
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: mathqa_pool
    label: |-
      MathQA Pool
      2,666 Examples
    type: database
    size: lg
    position:
      x: 580
      'y': 40
  - id: vqa_sources
    label: |-
      Review More Than 70 VQA Sets
      Keep 19 Public Sources
      Search for Math-related Items
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: heuristic
    label: |-
      Heuristic Match?
      Numeric Answer or Quantity Word
    type: decision
    size: xl
    position:
      x: 300
      'y': 260
  - id: math_reasoning
    label: |-
      Involves Math Reasoning?
      Three Expert Annotators
      Majority Vote · Fleiss κ 0.775
    type: decision
    size: xl
    position:
      x: 580
      'y': 260
  - id: vqa_pool
    label: |-
      VQA Math Pool
      Cap Each Source at 400
      2,739 Examples
    type: database
    size: xl
    position:
      x: 860
      'y': 260
  - id: excluded
    label: |-
      Exclude Candidate
      No Heuristic Match or No Math
    type: loss
    size: xl
    position:
      x: 860
      'y': 540
  - id: new_sources
    label: |-
      Create Three New Datasets
      IQTest 228 · FunctionQA 400
      PaperQA: Paper 107 · Release 108
    type: document
    size: xl
    position:
      x: 20
      'y': 620
  - id: new_review
    label: |-
      Graduate STEM Annotation
      Logical · Algebraic · Scientific
      Rigorous Manual Review
    type: user
    size: xl
    position:
      x: 300
      'y': 620
  - id: new_pool
    label: |-
      Released New-data Pool
      736 Examples
    type: database
    size: lg
    position:
      x: 580
      'y': 620
  - id: merge
    label: |-
      Consolidate 31 Sources
      6,141 Problems
      3,392 Multiple-choice
      2,749 Free-form
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: metadata
    label: |-
      Add Fine-grained Metadata
      5 Tasks · 7 Math Skills
      Source · Context · Grade · Language
      1K Manual Skill-label Check
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: release
    label: |-
      Release Two Splits
      testmini: 1,000 Public Labels
      test: 5,141 Hidden Labels
      Sample ≥4 per Source, Then Proportional
    type: database
    size: xl
    position:
      x: 1700
      'y': 620
  - id: query
    label: |-
      Build Type-aware Query
      Task Hint · Question · Choices
      Optional Caption and OCR
      Required Final-answer Format
    type: document
    size: xl
    position:
      x: 1700
      'y': 1040
  - id: infer
    label: |-
      Generate Model Response
      Image plus Query
      Save Raw Response by PID
    type: process
    size: xl
    position:
      x: 1420
      'y': 1040
  - id: extract_route
    label: Directly Extractable?
    type: decision
    size: xl
    position:
      x: 1140
      'y': 1040
  - id: direct_extract
    label: |-
      Apply Direct Rules
      Exact Choice Text · Integer · Float
      Optional “The answer is …” Regex
    type: process
    size: xl
    position:
      x: 860
      'y': 940
  - id: llm_extract
    label: |-
      LLM Answer Extraction
      Five Demonstrations
      Current Code Uses AZURE_OPENAI_MODEL
      Empty on Extraction Exception
    type: process
    size: xl
    position:
      x: 860
      'y': 1160
  - id: answer_contract
    label: Which Answer Contract?
    type: decision
    size: xl
    position:
      x: 580
      'y': 1040
  - id: mc_normalize
    label: |-
      Normalize Multiple-choice
      “(A)” or Letter → Option Text
      Else Nearest Choice by Levenshtein
    type: process
    size: xl
    position:
      x: 300
      'y': 940
  - id: free_normalize
    label: |-
      Normalize Free-form
      Integer: int(float)
      Float: Round to Precision
      List: String Form
    type: process
    size: xl
    position:
      x: 300
      'y': 1160
  - id: scoring_scope
    label: Gold Label Available?
    type: decision
    size: xl
    position:
      x: 580
      'y': 1380
  - id: local_compare
    label: |-
      Exact Safe Equality
      Prediction String = Gold String
      None or Mismatch Is False
    type: process
    size: xl
    position:
      x: 860
      'y': 1320
  - id: hidden_submit
    label: |-
      Paper Hidden-test Plan
      5,141 Test Labels Not Public
      Maintain an Online Evaluation Platform
    type: document
    size: xl
    position:
      x: 860
      'y': 1540
  - id: readme_drift
    label: |-
      Current README at 53d5258
      Email Test Result File to Authors
      Authors Generate the Score File
      Automatic CodaLab Under Construction
    type: document
    size: xl
    position:
      x: 1140
      'y': 1580
  - id: correct_check
    label: Exact Match?
    type: decision
    size: lg
    position:
      x: 1140
      'y': 1320
  - id: correct
    label: Record True
    type: process
    size: lg
    position:
      x: 1420
      'y': 1240
  - id: incorrect
    label: Record False
    type: loss
    size: lg
    position:
      x: 1420
      'y': 1400
  - id: report
    label: |-
      Report Accuracy
      Overall and Nine Metadata Keys
      Correct / Evaluated Result Rows
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 1320
