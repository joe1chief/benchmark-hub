meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVista Build Process
  description: >-
    Paper- and official-code-aligned multi-source visual-math collection, standardized annotation, two-split release,
    and three-stage accuracy evaluation for MathVista.
  legend: >-
    Solid arrows trace 28 existing and three new datasets, metadata annotation, the 6,141-item release, response
    generation, answer extraction, normalization, and accuracy aggregation.
nodes:
  - id: existing
    label: |-
      Gather 28 Existing Datasets
      Nine Math-targeted QA Sets
      Nineteen General VQA Sets
      Cover Diverse Visual Math
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: newsets
    label: |-
      Create Three New Datasets
      IQTest · Logical Figure Puzzles
      FunctionQA · Function Plots
      PaperQA · Scientific Figures
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: curate
    label: |-
      Preprocess and Filter Items
      Align Questions with Images
      Clean Existing-source Data
      Relabel for Evaluation
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: consolidate
    label: |-
      Consolidate 31 Sources
      Produce 6,141 Problems
      Preserve Visual Diversity
      Mix Choice and Free-form QA
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: taxonomy
    label: |-
      Add Fine-grained Metadata
      Five Tasks · Seven Skills
      Tag Source · Category · Context
      Record Grade · Language · Skill
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: format
    label: |-
      Standardize Each Record
      Question · Image · Choices · Answer
      Unit · Precision · Answer Type
      Generate the Input Query
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: split
    label: |-
      Release Two Disjoint Splits
      testmini · 1,000 Labeled Items
      test · 5,141 Hidden-label Items
      Use test for Standard Evaluation
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: query
    label: |-
      Build Type-aware Prompts
      Combine Task and Question
      Include Choices and Metadata
      State the Required Final Format
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: infer
    label: |-
      Generate Model Responses
      Input Visual and Text Context
      Allow Detailed Reasoning
      Store Each Raw Response
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: extract
    label: |-
      Extract a Short Final Answer
      First Handle Direct Values
      Use GPT-4 for General Cases
      Over 99.5% on a 200-item Study
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: normalize
    label: |-
      Normalize by Answer Contract
      Map Choice Letter or Text
      Convert Integer and Precision Float
      Preserve List and Text Formats
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: judge
    label: |-
      Apply Deterministic Correctness
      Compare Prediction with Gold
      Store true or false per Item
      Handle Empty Extractions Officially
    type: decision
    size: xl
    position:
      x: 500
      'y': 420
  - id: aggregate
    label: |-
      Aggregate Overall Accuracy
      Break Down Task and Skill
      Analyze Source · Context · Grade
      Report by Answer Type · Language
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Publish MathVista Results
      Maintain a Unified Leaderboard
      Compare Models with Humans
      Diagnose Perception · Reasoning
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: existing
    to: newsets
    type: primary
  - from: newsets
    to: curate
    type: primary
  - from: curate
    to: consolidate
    type: primary
  - from: consolidate
    to: taxonomy
    type: primary
  - from: taxonomy
    to: format
    type: primary
  - from: format
    to: split
    type: primary
  - from: split
    to: query
    type: primary
  - from: query
    to: infer
    type: primary
  - from: infer
    to: extract
    type: primary
  - from: extract
    to: normalize
    type: primary
  - from: normalize
    to: judge
    type: primary
  - from: judge
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
