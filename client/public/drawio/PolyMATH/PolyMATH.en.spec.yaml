  layout: horizontal
  routing: orthogonal
  title: PolyMATH Build and Evaluation Process
  description: >-
    Paper-aligned selection and expert leveling of 500 English mathematics problems, expert-calibrated translation into
    18 parallel languages, and difficulty-weighted evaluation over 9,000 instances.
  legend: >-
    PolyMATH contains 500 original English problems total, with 125 problems in each of four levels; translating the
    same problems into 18 languages yields 9,000 parallel instances.
