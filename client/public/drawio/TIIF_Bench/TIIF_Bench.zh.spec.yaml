meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TIIF-Bench 构建与评测流程
  description: >-
    TIIF-Bench先按语义分组既有基准提示，再让GPT-4o抽取对象、属性和关系对，形成10个维度专用概念池。36种组合策略构建组内的基础级和跨组的进阶级组合，再由GPT-4o生成自然指令。文本渲染提示来自Lex-Art；风格控制提示来自AIGC社区，并为五种宽高比配备人工核验的参考图；人工另策划100条真实设计师级提示。每条提示都扩写为语义相同的长版本。全量基准含5000条提示和12074个二元检查问题，平衡的TestMini含554条提示与1446个问题。评测时文本到图像模型生成图片，TIIF-Evaluator逐项回答属性专用是否问题，检查表准确率形成细粒度指令跟随分。文本渲染用OCR与全局归一化编辑距离，通过匈牙利匹配并惩罚遗漏/幻觉词；风格控制选择最接近宽高比的参考图，计算CSD与DINOv3相似度。结果按基础、进阶、设计师等级及短长鲁棒性报告。
  legend: >-
    来源：TIIF-Bench arXiv:2506.02161v3 Section 3 and Appendices A1-A3; official TIIF_Bench project page and released
    data。实线箭头表示论文或官方资料明确支持的主流程。
