meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TACO Build and Evaluation Process
  description: >-
    Paper-aligned collection, executable-solution filtering, semantic deduplication, unit-test augmentation,
    multidimensional annotation, and Pass@k evaluation of competition programming problems.
  legend: >-
    Read benchmark construction left-to-right, then model evaluation right-to-left; the release contains 25,443 training
    and 1,000 test problems with 1,539,152 verified Python 3 solutions.
nodes:
  - id: sources
    label: |-
      Seven Problem Sources
      Four Directly Crawled Platforms
      APPS + CodeContest + Description2code
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: parsers
    label: |-
      Platform-Specific Parsing
      Manually Sample Parser Outputs
      OCR Rare SVG Math + Crawl Tags
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: solution_gate
    label: |-
      Executable-Solution Gate
      Run Newly Crawled Solutions on Tests
      Convert Python 2 with 2to3; Drop Failures
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: normalize
    label: |-
      Normalize and Deduplicate
      MinHash + Jaccard Threshold 0.85
      AST Decommenting and Formatting
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      Unit-Test Augmentation
      GPT-4 Inputs + 30 Verified Solutions
      Keep Consensus Outputs Until at Least 200 Tests
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      TACO Release
      25,443 Train + 1,000 Test Problems
      1,539,152 Solutions; 36 Algorithms + 8 Skills
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Test Problem Input
      Statement + Constraints + Examples
      Standard-Input or Call-Based Format
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: sample
    label: |-
      Sample 200 Attempts per Problem
      top_p = 0.95
      Temperature 0.2 / 0.6 / 0.8 by Difficulty
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: postprocess
    label: |-
      Completion Post-Processing
      Truncate to a Complete Program
      Preserve Required Interface
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      Execute All Unit Tests
      Run in the Required I/O Mode
      Capture Compile, Runtime, and Output Failures
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: correctness
    label: |-
      Exact Correctness Gate
      Every Unit Test Must Pass
      Any Failure Rejects the Completion
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      TACO Results
      Pass@1 / Pass@10 / Pass@100
      By Difficulty and Programming Skill
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: parsers
    type: primary
  - from: parsers
    to: solution_gate
    type: primary
  - from: solution_gate
    to: normalize
    type: primary
  - from: normalize
    to: tests
    type: primary
  - from: tests
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: sample
    type: primary
  - from: sample
    to: postprocess
    type: primary
  - from: postprocess
    to: execute
    type: primary
  - from: execute
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
modules: []
