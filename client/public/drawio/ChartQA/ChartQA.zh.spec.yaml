meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQA 构建流程
  description: >-
    按论文对齐的 ChartQA 流程：从四个网站采集 20,882 张真实图表及元数据，分别进入人工问答和 T5 生成问答两条路径，
    各自经过明确质检并按精确规模切分训练、验证和测试集；模型结合图表图像与结构化表格生成答案，以精确匹配或数值 5% 容差评分。
  legend: 实线表示两条数据构建路径；人工与机器生成分支只在模型评测处合流。
nodes:
  - id: sources
    label: |-
      4 个网站来源
      20,882 张图表
    type: database
    size: large
    position:
      x: 40
      'y': 240
  - id: assets
    label: |-
      图像 + 元数据
      可用时含表格 / SVG
    type: document
    size: large
    position:
      x: 240
      'y': 240
  - id: human
    label: |-
      AMT 标注员
      每图编写 2 组问答
    type: user
    size: large
    position:
      x: 440
      'y': 60
  - id: human_focus
    label: |-
      视觉问题 +
      组合推理问题
    type: process
    size: large
    position:
      x: 640
      'y': 60
  - id: verify
    label: |-
      第二名标注员作答
      答案是否精确一致
    type: decision
    size: large
    position:
      x: 840
      'y': 60
  - id: resolve
    label: |-
      人工处理
      不一致答案
    type: process
    size: large
    position:
      x: 1040
      'y': 60
  - id: human_set
    label: |-
      ChartQA-H
      9,608 组问答
    type: database
    size: large
    position:
      x: 1240
      'y': 60
  - id: human_split
    label: |-
      人工集 训练 / 验证 / 测试
      7,398 / 960 / 1,250
    type: document
    size: large
    position:
      x: 1440
      'y': 60
  - id: summaries
    label: |-
      Statista 人工撰写的
      图表摘要
    type: document
    size: large
    position:
      x: 440
      'y': 420
  - id: answer_t5
    label: |-
      T5 抽取
      候选答案
    type: process
    size: large
    position:
      x: 640
      'y': 420
  - id: question_t5
    label: |-
      答案感知 T5
      生成问题
    type: process
    size: large
    position:
      x: 840
      'y': 420
  - id: filter
    label: |-
      答案是否存在于
      图表数据表
    type: decision
    size: large
    position:
      x: 1040
      'y': 420
  - id: machine_set
    label: |-
      ChartQA-M
      23,111 组问答
    type: database
    size: large
    position:
      x: 1240
      'y': 420
  - id: machine_split
    label: |-
      机器集 训练 / 验证 / 测试
      20,901 / 960 / 1,250
    type: document
    size: large
    position:
      x: 1440
      'y': 420
  - id: eval_input
    label: |-
      图表图像 + 问题
      金标 / OCR 表格
    type: database
    size: large
    position:
      x: 1640
      'y': 240
  - id: predict
    label: 生成答案
    type: process
    size: large
    position:
      x: 1840
      'y': 240
  - id: metric
    label: |-
      非数值精确匹配
      数值容差 ±5%
    type: terminal
    size: large
    position:
      x: 2040
      'y': 240
edges:
  - from: sources
    to: assets
    type: primary
  - from: assets
    to: human
    type: primary
  - from: human
    to: human_focus
    type: primary
  - from: human_focus
    to: verify
    type: primary
  - from: verify
    to: resolve
    type: primary
  - from: resolve
    to: human_set
    type: primary
  - from: human_set
    to: human_split
    type: primary
  - from: assets
    to: summaries
    type: primary
  - from: summaries
    to: answer_t5
    type: primary
  - from: answer_t5
    to: question_t5
    type: primary
  - from: question_t5
    to: filter
    type: primary
  - from: filter
    to: machine_set
    type: primary
  - from: machine_set
    to: machine_split
    type: primary
  - from: human_split
    to: eval_input
    type: primary
  - from: machine_split
    to: eval_input
    type: primary
  - from: eval_input
    to: predict
    type: primary
  - from: predict
    to: metric
    type: primary
modules: []
