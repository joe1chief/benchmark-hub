meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQA Build Process
  description: >-
    Paper-aligned ChartQA workflow: 20,882 real-world charts and metadata from four web sources feed separate human and
    T5-generated QA pipelines, each with explicit quality control and train/validation/test counts; chart images and
    structured tables support answer generation scored by exact or 5%-relaxed accuracy.
  legend: Solid arrows show the two dataset-construction paths; both branches merge only at model evaluation.
