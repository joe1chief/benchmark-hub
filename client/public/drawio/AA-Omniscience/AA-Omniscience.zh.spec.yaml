meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-Omniscience 构建与评测流程
  description: 按论文明确展示 GPT-5 生成、过滤与修订，人工验证，6,000 题全量评测集，以及另行按分布和模型性能对齐抽样的 600 题公开集。
  legend: 全量集进入评测主线；公开 600 题仅为代表性发布分支。
nodes:
  - id: sources
    label: |-
      选择权威信源
      第一方与公认权威来源
      优先当前且近期首次可答事实
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coverage
    label: |-
      定义经济相关覆盖
      6 个领域 • 42 个主题
      从商业到 STEM
    type: process
    size: xl
    position:
      x: 280
      'y': 100
  - id: generate
    label: |-
      GPT-5 生成问题
      每题基于信源事实
      要求精确短答案
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: filter
    label: |-
      GPT-5 过滤
      删除相似、歧义、过易
      或依赖信源上下文的问题
    type: process
    size: xl
    position:
      x: 760
      'y': 100
  - id: revise
    label: |-
      GPT-5 修订
      提升精确度与格式约束
      重新检查前沿模型难度
    type: process
    size: xl
    position:
      x: 1000
      'y': 100
  - id: manual_validation
    label: |-
      人工验证
      唯一且无歧义的正确答案
      困难 • 精确 • 自包含
    type: process
    size: xl
    position:
      x: 1240
      'y': 100
  - id: full_release
    label: |-
      全量评测集
      6,000 道问题
      评测主线实际消费的数据集
    type: database
    size: xl
    position:
      x: 1480
      'y': 100
  - id: public_sampling
    label: |-
      代表性抽样
      对齐领域 / 主题分布
      对齐模型性能分布
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: public_release
    label: |-
      公开发布
      600 题 • 10%
      代表性公开子集
    type: database
    size: xl
    position:
      x: 1960
      'y': 40
  - id: prompt
    label: |-
      闭卷评测提示
      全量题目 • 无上下文
      禁用工具，仅在确信时作答
    type: document
    size: xl
    position:
      x: 1720
      'y': 400
  - id: answer
    label: |-
      被测模型回答
      短答案或明确弃答
      单次遍历全部 6,000 题
    type: process
    size: xl
    position:
      x: 1960
      'y': 400
  - id: grade
    label: |-
      Gemini 2.5 Flash Preview
      对比问题、标准答案与预测
      按人工一致性选择推理裁判
    type: process
    size: xl
    position:
      x: 2200
      'y': 400
  - id: classes
    label: |-
      四分类判分
      正确 • 部分正确
      错误 • 未作答
    type: process
    size: xl
    position:
      x: 2440
      'y': 400
  - id: metrics
    label: |-
      可靠性指标
      OI = 100 ×（正确 − 错误）/ 总数
      准确率 • 幻觉率 • 运行成本
    type: process
    size: xl
    position:
      x: 2680
      'y': 400
  - id: report
    label: |-
      AA-Omniscience 结果
      总体 + 领域级可靠性
      主题级估计须使用全量集
    type: terminal
    size: xl
    position:
      x: 2920
      'y': 400
edges:
  - from: sources
    to: coverage
    type: primary
  - from: coverage
    to: generate
    type: primary
  - from: generate
    to: filter
    type: primary
  - from: filter
    to: revise
    type: primary
  - from: revise
    to: manual_validation
    type: primary
  - from: manual_validation
    to: full_release
    type: primary
  - from: full_release
    to: public_sampling
    type: secondary
  - from: public_sampling
    to: public_release
    type: secondary
  - from: full_release
    to: prompt
    type: primary
  - from: prompt
    to: answer
    type: primary
  - from: answer
    to: grade
    type: primary
  - from: grade
    to: classes
    type: primary
  - from: classes
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
