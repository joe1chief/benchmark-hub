ucination = i / (p + i + a)</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>Target-model cost; grader excluded</tspan></text></g></g></g></g><g data-cell-id="16"><g><rect x="2880" y="360" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2980,390.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>AA-Omniscience Results</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Overall + domain reliability</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Topic estimates require the full set</tspan></text></g></g></g></g><g data-cell-id="17"><g><path d="M 200 81 L 230.82 81" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 238.32 81 L 230.82 84.75 L 230.82 77.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="18"><g><path d="M 440 81 L 470.82 81" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 478.32 81 L 470.82 84.75 L 470.82 77.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="19"><g><path d="M 680 81 L 710.82 81" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 718.32 81 L 710.82 84.75 L 710.82 77.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stro