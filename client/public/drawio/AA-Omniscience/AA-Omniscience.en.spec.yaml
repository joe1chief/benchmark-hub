meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-Omniscience Build and Evaluation Process
  description: >-
    Paper-aligned construction with explicit GPT-5 generation, filtering, and revision, manual validation, a 6,000-item
    full evaluation set, and a separate distribution- and performance-aligned 600-item public sample.
  legend: The full set feeds evaluation; the public 600-item release is a representative publication branch only.
nodes:
  - id: sources
    label: |-
      Select Authoritative Sources
      First-party and recognized sources
      Prefer current, recently answerable facts
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coverage
    label: |-
      Define Economic Coverage
      6 domains • 42 topics
      Business to STEM
    type: process
    size: xl
    position:
      x: 280
      'y': 100
  - id: generate
    label: |-
      GPT-5 Question Generation
      Ground each item in source facts
      Require precise short answers
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: filter
    label: |-
      GPT-5 Filtering
      Remove similar, ambiguous,
      easy, or source-reliant items
    type: process
    size: xl
    position:
      x: 760
      'y': 100
  - id: revise
    label: |-
      GPT-5 Revision
      Improve precision and format
      Retest frontier-model difficulty
    type: process
    size: xl
    position:
      x: 1000
      'y': 100
  - id: manual_validation
    label: |-
      Manual Validation
      One unambiguous correct answer
      Difficult • precise • self-contained
    type: process
    size: xl
    position:
      x: 1240
      'y': 100
  - id: full_release
    label: |-
      Full Evaluation Set
      6,000 questions
      Main benchmark consumed by evaluation
    type: database
    size: xl
    position:
      x: 1480
      'y': 100
  - id: public_sampling
    label: |-
      Representative Sampling
      Align domain/topic distribution
      Align model-performance profile
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: public_release
    label: |-
      Public Release
      600 questions • 10%
      Representative publication subset
    type: database
    size: xl
    position:
      x: 1960
      'y': 40
  - id: prompt
    label: |-
      Closed-Book Prompt
      Full-set question • no context
      No tools; answer only if confident
    type: document
    size: xl
    position:
      x: 1720
      'y': 400
  - id: answer
    label: |-
      Target-Model Response
      Short answer or explicit abstention
      One pass over all 6,000 items
    type: process
    size: xl
    position:
      x: 1960
      'y': 400
  - id: grade
    label: |-
      Gemini 2.5 Flash Preview
      Compare question, gold, prediction
      Reasoning grader selected by alignment
    type: process
    size: xl
    position:
      x: 2200
      'y': 400
  - id: classes
    label: |-
      Four-Way Grade
      Correct • partially correct
      Incorrect • not attempted
    type: process
    size: xl
    position:
      x: 2440
      'y': 400
  - id: metrics
    label: |-
      Reliability Metrics
      OI = 100 × (correct − incorrect) / total
      Accuracy • hallucination rate • cost
    type: process
    size: xl
    position:
      x: 2680
      'y': 400
  - id: report
    label: |-
      AA-Omniscience Results
      Overall + domain reliability
      Topic estimates require the full set
    type: terminal
    size: xl
    position:
      x: 2920
      'y': 400
edges:
  - from: sources
    to: coverage
    type: primary
  - from: coverage
    to: generate
    type: primary
  - from: generate
    to: filter
    type: primary
  - from: filter
    to: revise
    type: primary
  - from: revise
    to: manual_validation
    type: primary
  - from: manual_validation
    to: full_release
    type: primary
  - from: full_release
    to: public_sampling
    type: secondary
  - from: public_sampling
    to: public_release
    type: secondary
  - from: full_release
    to: prompt
    type: primary
  - from: prompt
    to: answer
    type: primary
  - from: answer
    to: grade
    type: primary
  - from: grade
    to: classes
    type: primary
  - from: classes
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
