  - id: sources
    label: |-
      Authoritative sources
      first-party, primary, secondary
      up-to-date facts
    type: document
    size: xl
    position:
      x: 300
      'y': 160
  - id: generator
    label: |-
      Question generation agent
      derive factual questions
      from source passages
    type: process
    size: xl
    position:
      x: 560
      'y': 70
  - id: filters
    label: |-
      Filter and revise
      difficulty, ambiguity
      source reliance, precision
    type: decision
    size: xl
    position:
      x: 560
      'y': 250
