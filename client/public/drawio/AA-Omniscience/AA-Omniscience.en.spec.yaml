meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-Omniscience Build and Evaluation Process
  description: >-
    Paper-aligned source selection, agentic question curation, public/full-set boundary, closed-book answering, four-way
    grading, and knowledge-reliability scoring.
  legend: >-
    The top row builds the 6,000-question benchmark and its 600-question public subset; the bottom row reads
    right-to-left through no-tool evaluation and metric reporting.
nodes:
  - id: sources
    label: |-
      Select Authoritative Source Material
      First-Party and Recognized Primary / Secondary Sources
      Prefer Current Versions and Recent First-Answerable Dates
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coverage
    label: |-
      Define Economically Relevant Coverage
      6 Domains • 42 Topics
      Business, Humanities, Health, Law, Software, STEM
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: generate
    label: |-
      Automated Question-Generation Agent
      Ground Questions in Source Facts
      Require Short, Exact Answers and Stated Formats
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: curate
    label: |-
      Filter and Revise
      Remove Similar, Ambiguous, Easy, or Source-Reliant Items
      Test Difficulty against Models from Multiple Frontier Labs
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: validate
    label: |-
      Manual Review and Validation
      One Unambiguous Correct Answer
      Difficult • Precise • Self-Contained Context
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      AA-Omniscience Dataset
      Full Evaluation: 6,000 Questions
      Public: 600-Question Representative 10% Subset
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Closed-Book Evaluation Prompt
      Domain + Topic + One Question
      No Context or Tools; Answer Only if Confident
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: answer
    label: |-
      Target-Model Response
      Short Answer or Explicit Abstention
      One Pass over the Complete Evaluation Set
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: grade
    label: |-
      Gemini 2.5 Flash Preview (09-2025)
      Reasoning Grader Selected by Human Alignment
      Compare Question, Gold Target, and Prediction
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: classes
    label: |-
      Four-Way Classification
      Correct • Partially Correct
      Incorrect • Not Attempted
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Reliability Metrics
      OI = 100 × (Correct − Incorrect) / Total
      Accuracy • Hallucination Rate • Cost to Run
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      AA-Omniscience Results
      Overall and Domain-Level Reliability on the Full Set
      Public Subset Supports Overall, Not Topic-Level, Estimates
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: coverage
    type: primary
  - from: coverage
    to: generate
    type: primary
  - from: generate
    to: curate
    type: primary
  - from: curate
    to: validate
    type: primary
  - from: validate
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: answer
    type: primary
  - from: answer
    to: grade
    type: primary
  - from: grade
    to: classes
    type: primary
  - from: classes
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
