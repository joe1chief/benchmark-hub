meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CMB 构建流程
  description: >-
    对齐论文的 CMB 构建与评测流程：CMB-Exam 分支清洗并按分类划分 280,839 道中文医学考试题；CMB-Clin 将官方教材病例筛成 74 个多轮问诊病例、208
    个问题；两条分支分别采用准确率和专家对齐的四维临床评分。
  legend: 实线箭头表示 CMB-Exam、CMB-Clin 两条独立构建分支及各自评测协议。
nodes:
