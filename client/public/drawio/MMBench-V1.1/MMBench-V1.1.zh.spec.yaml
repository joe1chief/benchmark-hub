meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench v1.1 构建流程
  description: >-
    arXiv v4/v5 明确描述 MMBench v1.1：覆盖 20 个能力的 3,217 道逻辑题，在每种对齐语言中发布为 1,292 道 DEV 与 1,925 道 TEST。早期 2,974/2,948
    计数及可变测试金标资产放在主流程之外。
  legend: 实线表示 v1.1 的构建与评测生命周期；虚线仅连接早期版本、双语、字段、答案可见性或发布代码审计事实， 不改变逻辑题计分分母。
nodes:
  - id: taxonomy
    label: |-
      三级能力体系
      2 个 L1 / 6 个 L2
      20 个 L3 能力
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      作者冷启动样例
      每个 L3 能力
      10–20 道 MCQ
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      学生志愿者扩充
      超 80% 来自互联网
      约 20% 用公开验证集图像
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      图像多选题
      问题 + 可选提示
      2–4 个选项 + 答案
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      纯文本可答过滤
      正文：LLM 多数通过
      附录 B：3/3 + 人工
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      错题过滤
      5 个 VLM 均未答对
      CircularEval + 人工
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: curated
    label: |-
      MMBench v1.1
      3,217 道逻辑题
      每个 L3 至少 125 题
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: split
    label: |-
      英文 v1.1 文件
      DEV 1,292 / TEST 1,925
      名义比例 4:6
    type: database
    size: xl
    position:
      x: 1720
      'y': 280
  - id: prompt
    label: |-
      零样本开放式生成
      图像 + 可选提示
      英文问题 + 选项
    type: process
    size: xl
    position:
      x: 2000
      'y': 280
  - id: heuristic
    label: |-
      启发式方法
      抽出选项了吗
    type: decision
    size: xl
    position:
      x: 2280
      'y': 120
  - id: gpt
    label: |-
      论文回退
      gpt-4-0125
      匹配选项或 Z
    type: process
    size: xl
    position:
      x: 2280
      'y': 480
  - id: circular
    label: |-
      CircularEval
      循环轮换 N 个选项
      各轮全对才算正确
    type: process
    size: xl
    position:
      x: 2560
      'y': 280
  - id: score
    label: |-
      逻辑题准确率
      总体微平均 + L2/L3
      每道原题计一个 hit
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 280
  - id: version_audit
    label: |-
      早期版本
      v1–v3 正文：2,974
      v1.0 文件：2,948
    type: document
    size: xl
    position:
      x: 1440
      'y': 760
  - id: cn_audit
    label: |-
      中文 v1.1 对应版
      原题 ID 与图像对齐
      GPT-4 + 人工核验
    type: document
    size: xl
    position:
      x: 1720
      'y': 760
  - id: schema_audit
    label: |-
      v1.1 TSV 审计
      不含 source/comment
      原题 ID = index mod 1e6
    type: document
    size: xl
    position:
      x: 2000
      'y': 760
  - id: label_audit
    label: |-
      可变 TEST 端点
      论文称金标隐藏
      2026 实时文件含 answer
    type: document
    size: xl
    position:
      x: 2560
      'y': 760
  - id: code_audit
    label: |-
      发布代码注意项
      判题重试 3 次均失败
      随机有效选项或 Z
    type: document
    size: xl
    position:
      x: 2840
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: curated
    type: primary
  - from: wrong_qc
    to: curated
    type: primary
  - from: curated
    to: split
    type: primary
  - from: split
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 是
  - from: heuristic
    to: gpt
    type: primary
    label: 否
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: curated
    to: version_audit
    type: secondary
    style:
      dashed: true
  - from: split
    to: cn_audit
    type: secondary
    style:
      dashed: true
  - from: prompt
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: circular
    to: label_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
