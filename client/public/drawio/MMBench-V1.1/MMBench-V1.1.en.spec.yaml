meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench v1.1 Build Process
  description: >-
    arXiv v4/v5 explicitly describes MMBench v1.1: 3,217 logical questions across 20 abilities, released as 1,292 DEV
    and 1,925 TEST items in each aligned language. Earlier 2,974/2,948 counts and mutable test-label artifacts are kept
    outside the main lifecycle.
  legend: >-
    Solid arrows show the v1.1 construction and evaluation lifecycle. Dashed arrows attach earlier-version, bilingual,
    schema, label-visibility, or released-code audit facts and do not alter the logical-item denominator.
nodes:
  - id: taxonomy
    label: |-
      Three-level taxonomy
      2 L1 / 6 L2
      20 L3 abilities
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      Author seed set
      10–20 MCQs
      per L3 ability
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      Student volunteers
      >80% Internet
      ~20% public validation images
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      Image MCQs
      question + optional hint
      2–4 choices + answer
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      Text-only filter
      main: LLM majority
      Appendix B: 3 of 3 + human
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      Wrong-item filter
      none of 5 VLMs correct
      CircularEval + human
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: curated
    label: |-
      MMBench v1.1
      3,217 logical questions
      at least 125 per L3
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: split
    label: |-
      English v1.1 files
      DEV 1,292 / TEST 1,925
      nominal ratio 4:6
    type: database
    size: xl
    position:
      x: 1720
      'y': 280
  - id: prompt
    label: |-
      Zero-shot open generation
      image + optional hint
      English question + choices
    type: process
    size: xl
    position:
      x: 2000
      'y': 280
  - id: heuristic
    label: |-
      Choice parsed
      by heuristic?
    type: decision
    size: xl
    position:
      x: 2280
      'y': 120
  - id: gpt
    label: |-
      Paper fallback
      gpt-4-0125
      match option or Z
    type: process
    size: xl
    position:
      x: 2280
      'y': 480
  - id: circular
    label: |-
      CircularEval
      N circular rotations
      all passes must be correct
    type: process
    size: xl
    position:
      x: 2560
      'y': 280
  - id: score
    label: |-
      Logical-item accuracy
      micro overall + L2/L3
      one hit per base question
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 280
  - id: version_audit
    label: |-
      Earlier versions
      v1–v3 prose: 2,974
      v1.0 files: 2,948
    type: document
    size: xl
    position:
      x: 1440
      'y': 760
  - id: cn_audit
    label: |-
      Chinese v1.1 sibling
      aligned base IDs/images
      GPT-4 + human verification
    type: document
    size: xl
    position:
      x: 1720
      'y': 760
  - id: schema_audit
    label: |-
      v1.1 TSV audit
      source/comment omitted
      base id = index mod 1e6
    type: document
    size: xl
    position:
      x: 2000
      'y': 760
  - id: label_audit
    label: |-
      Mutable TEST endpoint
      paper says labels hidden
      live 2026 file includes answer
    type: document
    size: xl
    position:
      x: 2560
      'y': 760
  - id: code_audit
    label: |-
      Released-code caveat
      3 failed judge retries
      random valid choice or Z
    type: document
    size: xl
    position:
      x: 2840
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: curated
    type: primary
  - from: wrong_qc
    to: curated
    type: primary
  - from: curated
    to: split
    type: primary
  - from: split
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 'Yes'
  - from: heuristic
    to: gpt
    type: primary
    label: 'No'
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: curated
    to: version_audit
    type: secondary
    style:
      dashed: true
  - from: split
    to: cn_audit
    type: secondary
    style:
      dashed: true
  - from: prompt
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: circular
    to: label_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
