meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench v2 Build Process
  description: >-
    Paper-aligned five-step LongBench v2 collection pipeline: select one of six categories and 20 subtasks; upload
    personally read English documents; extract text and reject contexts below 8,192 words or overlapping prior
    submissions; draft a four-option question, answer, and evidence; reject questions solved by all three review LLMs;
    apply an expert checklist, answer check, and three-minute difficulty gate; revise at most five times; then tag
    difficulty and retain 503 multiple-choice questions for accuracy evaluation.
  legend: Solid arrows show accepted data; dotted branches show rejection or revision paths.
