meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench v2 Build and Evaluation Process
  description: >-
    Paper- and repository-aligned LongBench v2 workflow: define six categories and 20 subtasks; collect realistic long
    contexts through 97 English-proficient annotators and task-specific sources; normalize files and enforce length and
    overlap gates; author four-choice questions with answers and evidence; cycle through three 128k-context models and
    24 independent expert reviewers; label difficulty, audit quality, and release 503 English test MCQs; then run the
    paper's core zero-shot or two-call chain-of-thought evaluation and its separate retrieval/no-context analyses.
  legend: >-
    Solid arrows show accepted construction and core evaluation. Dashed arrows show auxiliary analyses. Dotted arrows
    show rejection or revision branches. The paper's main text and appendix describe the rewrite cap differently, so the
    diagram records a neutral rewrite-limit gate without inventing an off-by-one rule.
nodes:
  - id: taxonomy
    label: |-
      Task Taxonomy
      6 Categories • 20 Subtasks
    type: process
    size: xl
    position:
      x: 40
      'y': 40
  - id: sources
    label: |-
      Context Sources
      97 Annotators + Task-specific Data
      Personal Files • Prior Datasets
    type: database
    size: xl
    position:
      x: 280
      'y': 40
  - id: normalize
    label: |-
      Prepare Contexts
      Files → Plain Text
      PyMuPDF and Other Tools
    type: process
    size: xl
    position:
      x: 520
      'y': 40
  - id: length_gate
    label: |-
      Context Below
      8,192 Words?
    type: decision
    size: xl
    position:
      x: 760
      'y': 40
  - id: overlap_gate
    label: |-
      High Overlap with
      Earlier Annotations?
    type: decision
    size: xl
    position:
      x: 1000
      'y': 40
  - id: annotate
    label: |-
      Author English MCQ
      Question + A–D + Answer
      Supporting Evidence
    type: process
    size: xl
    position:
      x: 1240
      'y': 40
  - id: auto_review
    label: |-
      3 × 128k LLM Review
      GPT-4o-mini • GLM-4-Air
      GLM-4-Flash • Middle Truncate
    type: process
    size: xl
    position:
      x: 1480
      'y': 40
  - id: reject_short
    label: |-
      Reject
      Context Too Short
    type: terminal
    size: large
    position:
      x: 760
      'y': 220
  - id: reject_overlap
    label: |-
      Reject
      Excessive Overlap
    type: terminal
    size: large
    position:
      x: 1000
      'y': 220
  - id: auto_gate
    label: |-
      All 3 Models
      Answer Correctly?
    type: decision
    size: xl
    position:
      x: 1480
      'y': 360
  - id: expert_review
    label: |-
      24 Independent Experts
      Checklist → Timed Solve (15 min)
      Reveal Answer / Evidence → Verify
      Human Baseline = 53.7%
    type: user
    size: xl
    position:
      x: 1240
      'y': 360
  - id: manual_gate
    label: |-
      Revision Needed?
      Invalid / Wrong Answer
      or Correct within 3 min
    type: decision
    size: xl
    position:
      x: 1000
      'y': 360
  - id: difficulty
    label: |-
      Assign Difficulty
      Hard: ≥2 LLMs Miss
      AND Expert Needs >10 min
    type: process
    size: xl
    position:
      x: 760
      'y': 360
  - id: verify
    label: |-
      Author Final Audit
      70 Sample: 68 Correct
      67 Google-proof • Privacy/IP Check
    type: process
    size: xl
    position:
      x: 520
      'y': 360
  - id: final_set
    label: |-
      503 English Test MCQs
      Easy 192 • Hard 311
      Short 180 • Medium 215 • Long 108
    type: database
    size: xl
    position:
      x: 280
      'y': 360
  - id: eval_input
    label: |-
      Context + Question + A–D
      Middle-truncate only if
