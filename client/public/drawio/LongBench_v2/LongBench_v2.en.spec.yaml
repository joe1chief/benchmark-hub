    type: terminal
    size: large
    position:
      x: 1480
      'y': 600
  - id: core_eval
    label: |-
      Core Evaluation
      Zero-shot: 128 Tokens
      2-call CoT: 1024 → 128 • T=0.1
    type: process
    size: xl
    position:
      x: 280
      'y': 600
  - id: aux_eval
    label: |-
      Auxiliary Analyses
      RAG: 512-token Chunks + Top-N
      No Context: Memorization Check
    type: process
    size: xl
    position:
      x: 280
      'y': 800
  - id: parser
    label: |-
