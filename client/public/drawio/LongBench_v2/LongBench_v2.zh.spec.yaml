meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench v2 构建流程
  description: >-
    依据论文重绘的 LongBench v2 五步采集流程：从六大类、20 个子任务中选择任务，上传本人读过的英文文档， 转为文本并拒绝少于 8,192 词或与既有提交高度重合的上下文，标注四选一问题、答案和证据；若三个审核
    模型全部答对则退回修订，再由专家检查题目规范、答案正确性和三分钟难度门；最多修订五次，通过后标记 难度并形成 503 道选择题，以准确率评测。
  legend: 实线表示通过的数据；点线分支表示拒绝或修订路径。
nodes:
  - id: taxonomy
    label: 六大类20子任务
    type: process
    size: large
    position:
      x: 40
      'y': 220
  - id: upload
    label: 上传本人文档
    type: document
    size: large
    position:
      x: 240
      'y': 220
  - id: doc_gate
    label: 足够长且不重复？
    type: decision
    size: large
    position:
      x: 440
      'y': 220
  - id: reject_doc
    label: 拒绝上下文
    type: document
    size: large
    position:
      x: 440
      'y': 420
  - id: annotate
    label: 四选一题与证据
    type: process
    size: large
    position:
      x: 640
      'y': 220
  - id: auto_review
    label: 三模型审核
    type: process
    size: large
    position:
      x: 840
      'y': 220
  - id: auto_gate
    label: 三者全答对？
    type: decision
    size: large
    position:
      x: 1040
      'y': 220
  - id: expert
    label: 专家人工审核
    type: process
    size: large
    position:
      x: 1240
      'y': 220
  - id: manual_gate
    label: 合格且超过3分？
    type: decision
    size: large
    position:
      x: 1440
      'y': 220
  - id: revise
    label: 最多修改五次
    type: process
    size: large
    position:
      x: 1240
      'y': 440
  - id: discard
    label: 五次后仍失败则丢弃
    type: document
    size: large
    position:
      x: 1440
      'y': 600
  - id: difficulty
    label: 简单或困难
    type: process
    size: large
    position:
      x: 1640
      'y': 220
  - id: final_set
    label: 503道选择题
    type: document
    size: large
    position:
      x: 1840
      'y': 220
  - id: evaluate
    label: 模型评测
    type: process
    size: large
    position:
      x: 2040
      'y': 220
  - id: score
    label: 准确率
    type: terminal
    size: large
    position:
      x: 2240
      'y': 220
edges:
  - from: taxonomy
    to: upload
    type: primary
  - from: upload
    to: doc_gate
    type: primary
  - from: doc_gate
    to: reject_doc
    type: optional
  - from: doc_gate
