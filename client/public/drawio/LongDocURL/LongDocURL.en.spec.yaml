meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongDocURL Build Process
  description: >-
    Paper-aligned four-module LongDocURL pipeline: crawl about 200,000 CommonCrawl PDFs; filter English documents to
    50-150 pages; classify document type from sampled pages with GPT-4o and retain 396 documents; parse region-level
    text-type-bbox triples; generate QA pairs with multi-step task-specific prompts across 20 subtasks; verify task
    relevance, format, and faithfulness automatically; then recover correctable negatives, check original visual PDFs,
    and cross-check annotations before retaining 2,325 QA pairs and applying the three-stage accuracy protocol.
  legend: Solid arrows show accepted data; the lower branch carries machine-flagged samples into human recovery.
