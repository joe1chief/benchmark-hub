meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongDocURL 构建流程
  description: >-
    依据论文重绘的 LongDocURL 四模块流程：从 CommonCrawl 抓取约 20 万份 PDF，筛选 50 至 150 页的英文文档， 由 GPT-4o 根据抽样页面判断文档类型并保留 396
    份文档；解析区域级“文本-类型-边框”三元组，针对 20 个 子任务用多步提示生成问答；自动检查任务相关性、格式正确性和忠实性，再由人工恢复可修正负样本、对照原始 视觉 PDF 补充标注并交叉检查，最终保留 2,325
    组问答，按三阶段协议计算广义准确率。
  legend: 实线表示通过的数据；下方分支把机器标记样本送入人工恢复。
