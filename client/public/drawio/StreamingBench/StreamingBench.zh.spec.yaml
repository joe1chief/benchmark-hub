meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StreamingBench 构建与评测流程
  description: >-
    StreamingBench把流式视频理解划分为三大类18项任务：10项实时视觉任务、4项视听全源任务和4项上下文任务。作者人工筛选覆盖8类场景的900段YouTube视频。实时任务与主动输出任务先按1
    fps采帧并叠加时间戳，由GPT-4o每20帧生成描述，再生成带时间戳问答；全源任务和其余上下文任务由人工标注。复核者检查准确性、清晰度和相关性，修正歧义或错标样本，删除无需视频即可回答的问题，并打乱选项。论文报告4500组问答；主动输出共构建250题，论文版本实际评测50题。除主动输出外，模型只接收截至提问时间的视频前缀，顺序问答还加入历史问答。选择题按准确率计分；主动输出每秒轮询一次，模型确认时机后再输出关键词，与参考时间戳误差小于2秒才算正确。
  legend: >-
    来源：StreamingBench arXiv:2411.03628 Sections 3-4 and Appendix A; official THUNLP-MT/StreamingBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
