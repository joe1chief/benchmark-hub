meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StreamingBench Build and Evaluation Process
  description: >-
    StreamingBench defines 18 streaming-video tasks in three categories: ten real-time visual tasks, four omni-source
    audio-visual tasks, and four contextual tasks. The authors manually curate 900 YouTube videos across eight scenario
    categories. For real-time tasks and proactive output, frames are sampled at 1 fps, timestamps are overlaid, GPT-4o
    captions every 20 frames, and GPT-4o generates timestamped QA; humans annotate omni-source and the other contextual
    tasks. Reviewers check accuracy, clarity, and relevance, revise ambiguous or mislabeled items, discard questions
    answerable without video, and shuffle options. The paper reports 4,500 QA pairs; 250 proactive-output questions were
    built, while 50 were used in the reported version. Except for proactive output, models receive only the video prefix
    ending at the question timestamp; sequential QA also receives prior QA history. Multiple-choice accuracy is
    reported. Proactive output polls once per second, requests the keyword after a yes response, and counts answers
    within two seconds of the reference timestamp.
  legend: >-
    Source: StreamingBench arXiv:2411.03628 Sections 3-4 and Appendix A; official THUNLP-MT/StreamingBench repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
