meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BeyondAIME Build Process
  description: >-
    Paper-aligned construction and evaluation of the BeyondAIME advanced mathematics benchmark from the Seed1.5-Thinking
    technical report, arXiv:2504.13914v3.
  legend: >-
    The two disclosed source paths converge on three shared inclusion gates, then the 100-task release is evaluated with
    32 responses per task.
nodes:
  - id: aime_gap
    label: |-
      Find the AIME Gap
      Only 30 Problems per Year
      High Variance
      Weak Frontier Separation
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: original_design
    label: |-
      Specialists Create
      Original Problems
      Competition Formats
      Multi-Step Reasoning
    type: user
    size: xl
    position:
      x: 320
      'y': 60
  - id: adaptation
    label: |-
      Adapt Competition Problems
      Change Structure + Scenario
      Preserve Mathematical Depth
      Do Not Copy
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: duplication_gate
    label: |-
      No Direct Duplication
      Curated, Not Reused Verbatim
      Reduce Memorization
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: anti_guess
    label: |-
      Remove Simple-Answer Cues
      No Directly Given Simple Answer
      Require Real Reasoning
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: difficulty
    label: |-
      Keep Frontier Difficulty
      At Least Hardest AIME Level
      Curate the Final Set
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: answer_contract
    label: |-
      Apply the Released Answer Contract
      100 Problems • Integer Answers
      No Fixed Numerical Range Restriction
    type: document
    size: xl
    position:
      x: 1440
      'y': 180
  - id: release
    label: |-
      Release BeyondAIME
      100 Expert-Curated Problems
      Integer Answers • No Fixed Range
      Contamination Resistant
    type: database
    size: xl
    position:
      x: 1720
      'y': 180
  - id: model_eval
    label: |-
      Collect 32 Responses
      per Task and Model
      Score against Released Gold
      Retain All 32
    type: process
    size: xl
    position:
      x: 1440
      'y': 480
  - id: report
    label: |-
      BeyondAIME Accuracy
      Avg@32 per Task
      Frontier Model Comparison
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 480
edges:
  - from: aime_gap
    to: original_design
    type: primary
  - from: aime_gap
    to: adaptation
    type: primary
  - from: original_design
    to: duplication_gate
    type: primary
  - from: adaptation
    to: duplication_gate
    type: primary
  - from: duplication_gate
    to: anti_guess
    type: primary
  - from: anti_guess
    to: difficulty
    type: primary
  - from: difficulty
    to: answer_contract
    type: primary
  - from: answer_contract
    to: release
    type: primary
  - from: release
    to: model_eval
    type: primary
  - from: model_eval
    to: report
    type: primary
modules: []
