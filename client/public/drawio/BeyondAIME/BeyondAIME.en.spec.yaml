meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BeyondAIME Build Process
  description: >-
    Paper-aligned construction and evaluation of the BeyondAIME advanced mathematics benchmark from the Seed1.5-Thinking
    technical report, arXiv:2504.13914.
  legend: >-
    Solid arrows show the disclosed construction and Avg@32 evaluation path; dashed arrows return rejected items for
    specialist redesign without adding undocumented review stages.
nodes:
  - id: aime_gap
    label: |-
      Identify the AIME Evaluation Gap
      Only 30 Problems Released Annually
      High Variance and Weak Frontier Separation
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: original_design
    label: |-
      Mathematics Specialists Create Originals
      Draw on Established Competition Formats
      Target Advanced Multi-Step Reasoning
    type: user
    size: xl
    position:
      x: 320
      'y': 60
  - id: adaptation
    label: |-
      Systematically Adapt Competition Problems
      Structural Modification and Scenario Reconfiguration
      Preserve Mathematical Depth without Copying
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: duplication_gate
    label: |-
      Enforce No Direct Duplication
      Newly Curated rather than Reused Verbatim
      Reduce Memorization-Based Success
    type: decision
    size: xl
    position:
      x: 600
      'y': 220
  - id: anti_guess
    label: |-
      Remove Guessable Answer Shortcuts
      Correct Value Must Not Be Trivially Mentioned
      Require Proper Mathematical Reasoning
    type: decision
    size: xl
    position:
      x: 880
      'y': 220
  - id: difficulty
    label: |-
      Retain Frontier Difficulty
      Equal to or Harder than the Hardest AIME Items
      Filter and Curate the Final Challenge Set
    type: decision
    size: xl
    position:
      x: 1160
      'y': 220
  - id: answer_contract
    label: |-
      Normalize the Answer Contract
      Every Answer Is an Integer
      No Fixed Numerical Range Restriction
    type: document
    size: xl
    position:
      x: 1440
      'y': 220
  - id: release
    label: |-
      Release BeyondAIME
      100 Expert-Curated Problems
      Contamination-Resistant Advanced Mathematics
    type: database
    size: xl
    position:
      x: 1720
      'y': 220
  - id: model_eval
    label: |-
      Sample Each Model 32 Times per Problem
      Parse the Final Integer Answer
      Match against the Gold Integer
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: report
    label: |-
      Report BeyondAIME Accuracy
      Average Performance across 32 Responses
      Stable Comparison of Frontier Reasoning Models
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 220
edges:
  - from: aime_gap
    to: original_design
    type: primary
  - from: aime_gap
    to: adaptation
    type: primary
  - from: original_design
    to: duplication_gate
    type: primary
  - from: adaptation
    to: duplication_gate
    type: primary
  - from: duplication_gate
    to: adaptation
    type: optional
  - from: duplication_gate
    to: anti_guess
    type: primary
  - from: anti_guess
    to: adaptation
    type: optional
  - from: anti_guess
    to: difficulty
    type: primary
  - from: difficulty
    to: original_design
    type: optional
  - from: difficulty
    to: answer_contract
    type: primary
  - from: answer_contract
    to: release
    type: primary
  - from: release
    to: model_eval
    type: primary
  - from: model_eval
    to: report
    type: primary
modules: []
