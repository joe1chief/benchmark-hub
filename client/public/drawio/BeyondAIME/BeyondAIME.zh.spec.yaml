meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BeyondAIME 构建流程
  description: 严格对齐 Seed1.5-Thinking 技术报告 arXiv:2504.13914v3，展示 BeyondAIME 高级数学基准的构建与评测。
  legend: 论文披露的两类来源汇合到三个共享收录门槛，最终 100 题按每题 32 次响应进行评测。
nodes:
  - id: aime_gap
    label: |-
      识别 AIME 评测缺口
      每年仅发布 30 道题
      方差高且难以区分前沿模型
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: original_design
    label: |-
      数学专家创建原创题
      参考成熟竞赛题型
      面向高级多步推理
    type: user
    size: xl
    position:
      x: 320
      'y': 60
  - id: adaptation
    label: |-
      系统化改编竞赛问题
      结构修改与场景重构
      不照搬原题并保持数学深度
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: duplication_gate
    label: |-
      强制无直接重复
      全部为新整理而非逐字复用
      降低依靠记忆作答的机会
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: anti_guess
    label: |-
      排除直接给出简单答案的题目
      题面不能直接提供简单答案
      必须经过真正数学推理
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: difficulty
    label: |-
      保留前沿难度
      等于或难于最难 AIME 题
      过滤并整理最终挑战集
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: answer_contract
    label: |-
      应用发布答案合同
      100 道题 • 答案均为整数
      无固定数值范围限制
    type: document
    size: xl
    position:
      x: 1440
      'y': 180
  - id: release
    label: |-
      发布 BeyondAIME
      100 道专家整理的整数答案题
      无固定答案范围 • 抗污染
    type: database
    size: xl
    position:
      x: 1720
      'y': 180
  - id: model_eval
    label: |-
      每个模型每题收集 32 次响应
      按发布金标判定正确性
      保留全部 32 次评测响应
    type: process
    size: xl
    position:
      x: 1440
      'y': 480
  - id: report
    label: |-
      报告 BeyondAIME 准确率
      按每题 32 次响应计算 Avg@32
      稳定比较前沿推理模型
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 480
edges:
  - from: aime_gap
    to: original_design
    type: primary
  - from: aime_gap
    to: adaptation
    type: primary
  - from: original_design
    to: duplication_gate
    type: primary
  - from: adaptation
    to: duplication_gate
    type: primary
  - from: duplication_gate
    to: anti_guess
    type: primary
  - from: anti_guess
    to: difficulty
    type: primary
  - from: difficulty
    to: answer_contract
    type: primary
  - from: answer_contract
    to: release
    type: primary
  - from: release
    to: model_eval
    type: primary
  - from: model_eval
    to: report
    type: primary
modules: []
