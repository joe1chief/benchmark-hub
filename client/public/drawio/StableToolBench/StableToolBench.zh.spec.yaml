meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StableToolBench 构建与评测流程
  description: >-
    StableToolBench把ToolBench的1100条ToolEval2测试查询改造成稳定的虚拟API与评测环境。缓存由ToolBench训练集和复现实验测试集的API调用历史初始化，过滤无效记录并保留部分符合现实的异常；论文快照中筛后共有164980条记录。每次调用先查缓存，再尝试真实API，若不可用则由GPT-4-turbo依据API文档并参考最多5个缓存示例模拟响应；返回结果继续写入缓存。GPT-4-turbo、Gemini-Pro和Claude-2独立判断每条ToolBench查询，至少两者判为可解才保留，最终得到765题。模型通过虚拟服务器执行查询，GPT-4-turbo把答案判为已解决、不确定或未解决；Solvable
    Pass Rate分别计1、0.5或0，Solvable Win Rate在一方已解决另一方未解决时直接判胜，其余情况由GPT-4-turbo比较。
  legend: >-
    来源：StableToolBench arXiv:2403.07714 Sections 2-4 and Appendices D, F-H; official THUNLP-MT/StableToolBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
