meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CheXGenBench Build Process
  description: >-
    Current TMLR/arXiv v4 CheXGenBench flow: eleven T2I systems follow model-specific training branches, generate a
    fixed held-out MIMIC-CXR split, and undergo fidelity, privacy, classification, segmentation, and report-generation
    evaluation with the paper's current system and metric contract.
  legend: Solid arrows show model preparation and evaluation; dashed arrows carry the fixed data split to generation.
nodes:
  - id: models
    label: |-
      Select 11 T2I Architectures
      Established + Recent Diffusion/Transformer
      Include Domain-specific + Foundation Models
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: model_route
    label: |-
      Model Preparation Route
      Existing Domain Model or Foundation Model?
    type: decision
    size: xl
    position:
      x: 340
      'y': 120
  - id: domain_models
    label: |-
      Domain-specific Baselines
      RadEdit + LLM-CXR
      Evaluate Out-of-the-box without Modification
      Skip the Common Fine-tuning Path
    type: process
    size: xl
    position:
      x: 640
      'y': 40
  - id: training
    label: |-
      Fine-tune 9 Foundation Architectures
      Same 237,388 Samples for 20 Epochs
      <1B: Full Fine-tuning
      >1B: LoRA Rank 32 on QKV
    type: process
    size: xl
    position:
      x: 640
      'y': 280
  - id: data
    label: |-
      MIMIC-CXR Standard Splits
      Training Split: 237,388
      Held-out Test Prompts: 5,034
      Enhanced LLaVA-Rad Captions
    type: database
    size: xl
    position:
      x: 340
      'y': 520
  - id: generate
    label: |-
      Generate on Fixed Test Prompts
      Save Prompt + Synthetic Image Metadata
      Use the Identical 5,034-image Test Split
    type: process
    size: xl
    position:
      x: 940
      'y': 280
  - id: fidelity
    label: |-
      Fidelity + Mode Coverage
      RadDino FID/KID + PRDC
      BioViL-T Image–Text Alignment
      Overall + Pathology-conditional Analysis
    type: process
    size: xl
    position:
      x: 1240
      'y': 0
  - id: privacy
    label: |-
      Privacy + Patient Re-identification
      Nearest Training Image: Pixel Distance
      RadDino Latent Distance
      Siamese Re-ID: Average • Max • Count
    type: process
    size: xl
    position:
      x: 1240
      'y': 160
  - id: classification
    label: |-
      Classification Utility
      20K Real + 20K Synthetic; ResNet-50
      Train 20 Epochs; Test on 5,034 Real
      Accuracy • F1 • AUROC
    type: process
    size: xl
    position:
      x: 1240
      'y': 320
  - id: segmentation
    label: |-
      Segmentation Utility
      3,000 Real + 3,000 Synthetic Pairs
      Clavicle Masks from a 159-region Model
      Train U-Net; Report Held-out DICE
    type: process
    size: xl
    position:
      x: 1240
      'y': 480
  - id: rrg
    label: |-
      Radiology Report Generation Utility
      50K Real + 20K Synthetic
      Train LLaVA-Rad from Scratch
      BLEU • ROUGE-L • F1-RadGraph
      GREENScore • RaTEScore
    type: process
    size: xl
    position:
      x: 1240
      'y': 640
  - id: scorecard
    label: |-
      CheXGenBench 20+ Metric Scorecard
      Compare Fidelity • Privacy • Utility
      Expose Metric Disagreement + Model Trade-offs
    type: terminal
    size: xl
    position:
      x: 1840
      'y': 320
