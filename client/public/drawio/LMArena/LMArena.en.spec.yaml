meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LMArena / Chatbot Arena Build Process
  description: >-
    Paper-aligned live collection of anonymous multi-turn model battles, crowdsourced preferences, vote-quality
    controls, Bradley–Terry estimation, uncertainty-aware rankings, and adaptive model-pair sampling.
  legend: >-
    Counts are the arXiv:2403.04132 paper snapshot from January 2024. The live LMArena platform continues to add models
    and votes. The paper replaces the earlier online Elo display with Bradley–Terry coefficients.
nodes:
  - id: pool
    label: |-
      Maintain a Live Model Pool
      Open and Proprietary Chat Models
      Paper Snapshot: More Than 50 Models
      Add New Models Continuously
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: sample
    label: |-
      Sample Two Models Anonymously
      Hide Model Identity from the User
      Randomize Left and Right Placement
      Favor Uncertain Pairs through Active Sampling
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: prompt
    label: |-
      Crowdsource Free-form User Prompts
      No Preset Questions or Fixed Rubric
      Support Multi-turn Conversation
      Cover Real Usage and 100+ Languages
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: respond
    label: |-
      Generate Side-by-side Responses
      Send the Same Turns to Both Models
      Continue Until the User Can Judge
      Preserve Full Battle Conversations
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: vote
    label: |-
      Collect One Human Preference
      Left Better · Right Better
      Tie · Both Are Bad
      Reveal Identities Only after Voting
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: controls
    label: |-
      Apply Data-quality Controls
      Filter Model-identity Keywords
      Flag Unsafe Requests with Moderation
      Detect Anomalous Voting Users
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: corpus
    label: |-
      Build the Paper-snapshot Vote Corpus
      243,329 Battles · 90,051 Users
      50 Models · 149 Languages
      Pair Outcome plus Multi-turn Traces
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: validate
    label: |-
      Validate Crowd-vote Quality
      Blind Expert Relabeling on 160 Battles
      Permit External Fact Checking
      Observe 72–83% Crowd-expert Agreement
    type: user
    size: xl
    position:
      x: 1700
      'y': 380
  - id: win_matrix
    label: |-
      Estimate the Pairwise Win Matrix
      Account for Non-uniform Pair Sampling
      Treat Ties within Pairwise Feedback
      Target a Uniform Model-pair Distribution
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: rank
    label: |-
      Fit Bradley–Terry Scores
      Reweighted Maximum-likelihood Estimation
      Robust Sandwich Confidence Intervals
      Derive Uncertainty-aware Approximate Ranks
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: report
    label: |-
      Publish the Live LMArena Leaderboard
      Bradley–Terry Score · Win Rates · Rank
      Confidence Intervals and Battle Counts
      Refresh as New Human Votes Arrive
    type: terminal
    size: xl
    position:
      x: 860
      'y': 380
edges:
  - from: pool
    to: sample
    type: primary
  - from: sample
    to: prompt
    type: primary
  - from: prompt
    to: respond
    type: primary
  - from: respond
    to: vote
    type: primary
  - from: vote
    to: controls
    type: primary
  - from: controls
    to: corpus
    type: primary
  - from: corpus
    to: validate
    type: primary
  - from: validate
    to: win_matrix
    type: primary
  - from: win_matrix
    to: rank
    type: primary
  - from: rank
    to: report
    type: primary
modules: []
