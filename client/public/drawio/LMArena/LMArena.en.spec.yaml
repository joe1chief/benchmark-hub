meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LMArena / Chatbot Arena Build Process
  description: >-
    The upper lane reconstructs the arXiv:2403.04132v1 paper pipeline. Independent paper checks do not feed the ranking.
    The lower lane dates the renamed live platform's later methodology changes without projecting them back into the
    2024 paper.
  legend: >-
    Solid arrows are the paper ranking-data flow. Dashed arrows are validation or active-sampling feedback. Dotted
    arrows show dated live-method chronology. Table 1 reports 243,329 conversations; the ranking replay uses 213,576
    historical votes. Public releases are only a fraction of the full live corpus.
nodes:
  - id: paper_input
    label: |-
      Terms + Live User Prompt
      Accept Data-release Consent
      No Preset Question or Fixed Rubric
      Open-ended, Multi-turn Input
    type: user
    module: paper_core
    size: xl
    position:
      x: 32
      'y': 200
  - id: paper_pair
    label: |-
      Select an Anonymous Model Pair
      Paper Uses Non-uniform Sampling
      Favor Similar, Uncertain Pairs
      Pair Is Not a Uniform-random Baseline
    type: process
    module: paper_core
    size: xl
    position:
      x: 288
      'y': 200
  - id: paper_battle
    label: |-
      Side-by-side Model Battle
      Send the Same Turns to Both Models
      Hide Identities during the Battle
      Continue until the User Can Judge
    type: process
    module: paper_core
    size: xl
    position:
      x: 544
      'y': 200
  - id: paper_vote
    label: |-
      Record One Human Preference
      Model A · Model B · Tie · Both Bad
      Reveal Identities Only after Voting
      Store Both Conversations + Vote
    type: document
    module: paper_core
    size: xl
    position:
      x: 800
      'y': 200
  - id: paper_filter
    label: |-
      Exclude Identity Leakage
      Filter Model and Company Keywords
      Preserve Anonymous Ranking Data
      Paper's Stated Main Data Filter
    type: process
    module: paper_core
    size: xl
    position:
      x: 1056
      'y': 200
  - id: paper_corpus
    label: |-
      Paper Table 1 Snapshot
      2024-01-21 · 243,329 Conversations
      50 Models · 90,051 Users
      149 Languages · Mean 1.3 Turns
    type: database
    module: paper_core
    size: xl
    position:
      x: 1312
      'y': 200
  - id: paper_win_matrix
    label: |-
      IPW Win-matrix Estimate
      θ̂_T(a) = T⁻¹ Σₜ Hₜ 1{Aₜ=a}/Pₜ(a)
      Correct Non-uniform Pair Sampling
      Paper Ranking Replay: 213,576 Votes
    type: formula
    module: paper_core
    size: xl
    position:
      x: 1568
      'y': 200
  - id: paper_bt
    label: |-
      Reweighted Bradley-Terry MLE
      P(i≻j)=e^ξⁱ/(e^ξⁱ+e^ξʲ); ξ₁=0
      ξ̂ = argmin Σₜ P(Aₜ)⁻¹ ℓ(Hₜ,pξ(Aₜ))
      Target a Uniform Model-pair Distribution
    type: formula
    module: paper_core
    size: xl
    position:
      x: 1824
      'y': 200
  - id: paper_rank
    label: |-
      Sandwich Joint Confidence Set
      Multiplicity-aware Approximate Rank
      Rₘ = 1 + Σₘ′ 1{inf Cₘ′ > sup Cₘ}
      Do Not Sort Point Estimates Alone
    type: formula
    module: paper_core
    size: xl
    position:
      x: 2080
      'y': 200
  - id: paper_output
    label: |-
      Publish the Paper-era Ranking
      BT Coefficients · Win Matrix
      Confidence Intervals · Approximate Rank
      Earlier UI Elo Is Not This Estimator
    type: terminal
    module: paper_core
    size: xl
    position:
      x: 2336
      'y': 200
  - id: paper_active
    label: |-
      Active-sampling Feedback
      Pₜ(a) ∝ √(Σ̂ₜ,ₐₐ / nₜ(a))
      − √(Σ̂ₜ,ₐₐ / (nₜ(a)+1))
      Sample by Expected CI-width Reduction
    type: formula
    module: paper_core
    size: xl
    position:
      x: 336
      'y': -64
  - id: paper_unsafe
    label: |-
      Unsafe-content Flag Only
      OpenAI Moderation API
      3% of User Requests Flagged
      Paper Does Not State Rank Exclusion
    type: process
    module: paper_checks
    size: xl
    position:
      x: 544
      'y': 400
  - id: paper_expert
    label: |-
      Expert Validation Only
      160 Random Battles · Blind Labeling
      Graduate Students + External Fact Checks
      72.8–83.1% Crowd-expert Agreement
    type: user
    module: paper_checks
    size: xl
    position:
      x: 1312
      'y': 400
  - id: paper_anomaly
    label: |-
      Paper Anomaly Experiment Only
      25 Anomalous + 25 Normal IPs
      Fisher Test at 5 Random Checkpoints
      Not a Paper Ranking Input
    type: process
    module: paper_checks
    size: xl
    position:
      x: 1568
      'y': 400
  - id: live_style
    label: |-
      2024-08-29 → 2025-05-16
      Style Control → Text Default
      Tokens · Headers · Bold · Lists
      z_f = std((f_A−f_B)/(f_A+f_B))
      Contextual BT: β_A−β_B+zᵀγ
    type: formula
    module: live_changes
    size: xl
    position:
      x: 32
      'y': 720
  - id: live_ci_weight
    label: |-
      2025-07-23
      Online Bootstrap → CLT / M-estimator CI
      Frequency-based Pair Reweighting
      Arena-Rank Weight: Reciprocal of max{n_ab, 50}
      Distinct from Paper Propensity IPW
    type: process
    module: live_changes
    size: xl
    position:
      x: 400
      'y': 720
  - id: live_cleaning
    label: |-
      2025-07-14 → 2025-10-04
      Stronger Dedup + Identity-leak Checks
      Statistical Anomalous-user Filter
      Remove Model-vs-itself Rows
      Exact Dedup / Anomaly Algorithms Not Public
    type: process
    module: live_changes
    size: xl
    position:
      x: 768
      'y': 720
  - id: live_direct
    label: |-
      2026-03 → 2026-05-12
      10% of Direct Sessions Become Battles
      Exclude Skip; Keep Decisive A/B Votes
      Add is_direct_battle
      + same_org_indicator
      Exact Feature Encodings Not Public
    type: process
    module: live_changes
    size: xl
    position:
      x: 1504
      'y': 720
  - id: live_policy
    label: |-
      2026-04-30 Listing Policy
      Display Publicly Available Models
      Require Stable Rating + at Least 1,000 Votes
      At Least One Public Model per Battle
      At Least 20% Public-vs-public Battles
    type: process
    module: live_changes
    size: xl
    position:
      x: 1136
      'y': 720
  - id: live_current
    label: |-
      Renamed Live Arena Leaderboard
      BT / Contextual BT, Not Elo Updates
      Arena-Rank Scale: 1000 + 400β / ln(10)
      Dated Methods Must Not Rewrite Paper v1
    type: terminal
    module: live_changes
    size: xl
    position:
      x: 1872
      'y': 720
  - id: paper_units
    label: |-
      Do Not Merge the Paper Units
      Table 1: 243,329 Conversations
      Ranking Replay: 213,576 Votes
      Different Scope and Purpose
    type: document
    module: artifact_boundary
    size: xl
    position:
      x: 400
      'y': 960
  - id: public_artifacts
    label: |-
      Partial Public Artifacts
      140K Rev 6322995: 135,634 Text Rows
      Leaderboard Rev cc2d2cd: Aggregates Only
      Prompts CC-BY-4.0; Outputs Provider Terms
      Full Live Ranking Corpus Is Not Public
    type: document
    module: artifact_boundary
    size: xl
    position:
      x: 1136
      'y': 960
edges:
  - from: paper_input
    to: paper_pair
    type: primary
  - from: paper_pair
    to: paper_battle
    type: primary
  - from: paper_battle
    to: paper_vote
    type: primary
  - from: paper_vote
    to: paper_filter
    type: primary
  - from: paper_filter
    to: paper_corpus
    type: primary
  - from: paper_corpus
    to: paper_win_matrix
    type: primary
  - from: paper_win_matrix
    to: paper_bt
    type: primary
  - from: paper_bt
    to: paper_rank
    type: primary
  - from: paper_rank
    to: paper_output
    type: primary
  - from: paper_rank
    to: paper_active
    type: data
    waypoints:
      - x: 2080
        'y': 112
      - x: 464
        'y': 112
      - x: 464
        'y': -64
  - from: paper_active
    to: paper_pair
    type: data
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.74
      entryY: 0
  - from: paper_battle
    to: paper_unsafe
    type: optional
  - from: paper_corpus
    to: paper_expert
    type: data
  - from: paper_corpus
    to: paper_anomaly
    type: optional
  - from: live_style
    to: live_ci_weight
    type: optional
  - from: live_ci_weight
    to: live_cleaning
    type: optional
  - from: live_cleaning
    to: live_policy
    type: optional
  - from: live_policy
    to: live_direct
    type: optional
  - from: live_direct
    to: live_current
    type: optional
modules:
  - id: paper_core
    label: P-v1
    color: $primaryLight
  - id: paper_checks
    label: QA
    color: $secondaryLight
  - id: live_changes
    label: Live
    color: $accentLight
  - id: artifact_boundary
    label: Data
    color: $surface
