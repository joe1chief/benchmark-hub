meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StreamBench Build and Evaluation Process
  description: >-
    The video StreamBench in Seed1.5-VL is the benchmark introduced with StreamChat, not the namesake
    continuous-improvement language-agent benchmark. It draws candidate videos from EgoSchema and YouTube-8M, covers
    egocentric, web, work, and movie domains with 16 subtypes, uses a multimodal model to classify source categories,
    and has humans remove static or high-noise content. The final 306 videos total 24.8 hours and average 4.5 minutes.
    Annotators create six timestamped question types per video: object search, long-term memory, short-term memory,
    conversational interaction, video-grounded knowledge QA, and simple factual QA, each with paper-defined temporal
    constraints. Different workers check format diversity, clarity and video consistency, and remove sensitive topics.
    The release contains about 1.8K QA pairs in multi-round streaming dialogues. Models receive only the video prefix
    available at each query time and the prior dialogue. A LLaMA-3 judge reports semantic correctness score and
    accuracy; coherence is measured from score fluctuations across turns, and streaming systems also report request
    processing delay.
  legend: >-
    Source: StreamChat arXiv:2501.13468 Section 2, Section 4.1, and Appendix D; official hmxiong/StreamChat repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
