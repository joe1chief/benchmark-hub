meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StreamBench 构建与评测流程
  description: >-
    Seed1.5-VL中的视频StreamBench对应StreamChat论文引入的基准，不是同名的语言智能体持续改进基准。它从EgoSchema和YouTube-8M获取候选视频，覆盖第一视角、网络、工作和电影四大领域及16个子类，先用多模态模型按来源类别分类，再由人工删除静态或高噪声内容。最终306段视频总长24.8小时，平均4.5分钟。标注者为每段视频构建6类带时间戳的问题：目标搜索、长期记忆、短期记忆、对话交互、视频相关知识问答和简单事实问答，每类都有论文规定的时间约束。不同标注者检查格式多样性、表达清晰度与视频一致性，并移除敏感话题。最终约1.8K组问答组成多轮流式对话。模型在每次查询时只能使用当时已出现的视频前缀和既往对话；LLaMA-3评分器报告语义正确性得分与准确率，跨轮得分波动形成连贯性指标，流式系统另报告请求处理延迟。
  legend: >-
    来源：StreamChat arXiv:2501.13468 Section 2, Section 4.1, and Appendix D; official hmxiong/StreamChat
    repository。实线箭头表示论文或官方资料明确支持的主流程。
