meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MME 构建流程
  description: >-
    按论文对齐的 MME 流程：十个感知子任务与四个认知子任务使用不带原始标注的公开图像，以及新拍摄或生成的图像； 在 1,187 张图像上人工编写 2,374 组指令-答案，每图一题答案为“是”、一题为“否”，最终计算
    ACC、ACC+ 及感知/认知总分。
  legend: 实线先区分感知与认知图像来源，再合流到人工问答和统一评分流程。
nodes:
  - id: taxonomy
    label: 14 个子任务
    type: decision
    size: large
    position:
      x: 40
      'y': 240
  - id: perception
    label: |-
      感知 10 项
      识别 + OCR
    type: document
    size: large
    position:
      x: 240
      'y': 80
  - id: cognition
    label: |-
      认知 4 项
      推理 / 计算 / 文本 / 代码
    type: document
    size: large
    position:
      x: 240
      'y': 400
  - id: public_images
    label: |-
      COCO + 公开数据集
      仅使用图像
    type: database
    size: large
    position:
      x: 440
      'y': 80
  - id: new_images
    label: |-
      人工拍摄 +
      扩散模型生成图
    type: database
    size: large
    position:
      x: 440
      'y': 400
  - id: manual_qa
    label: |-
      全部问答人工编写
      不使用来源标注
    type: user
    size: large
    position:
      x: 640
      'y': 240
  - id: dataset
    label: |-
      1,187 张图像
      2,374 组问答
    type: database
    size: large
    position:
      x: 840
      'y': 240
  - id: pair_rule
    label: |-
      每图 2 个问题
      一题“是” + 一题“否”
    type: document
    size: large
    position:
      x: 1040
      'y': 240
  - id: prompt
    label: |-
      零样本提示
      “请回答是或否”
    type: process
    size: large
    position:
      x: 1240
      'y': 240
  - id: scoring
    label: 评分输出
    type: decision
    size: large
    position:
      x: 1440
      'y': 240
  - id: acc
    label: |-
      ACC
      按单题统计
    type: terminal
    size: large
    position:
      x: 1640
      'y': 80
  - id: acc_plus
    label: |-
      ACC+
      两题同时正确
    type: terminal
    size: large
    position:
      x: 1640
      'y': 240
  - id: totals
    label: |-
      子任务分 = ACC + ACC+
      感知 2000 / 认知 800
    type: terminal
    size: large
    position:
      x: 1640
      'y': 400
edges:
  - from: taxonomy
    to: perception
    type: primary
  - from: taxonomy
    to: cognition
    type: primary
  - from: perception
    to: public_images
    type: primary
  - from: cognition
    to: new_images
    type: primary
  - from: public_images
    to: manual_qa
    type: primary
  - from: new_images
    to: manual_qa
    type: primary
  - from: manual_qa
    to: dataset
    type: primary
  - from: dataset
    to: pair_rule
    type: primary
  - from: pair_rule
    to: prompt
    type: primary
  - from: prompt
    to: scoring
    type: primary
  - from: scoring
    to: acc
    type: primary
  - from: scoring
    to: acc_plus
    type: primary
  - from: scoring
    to: totals
    type: primary
modules: []
