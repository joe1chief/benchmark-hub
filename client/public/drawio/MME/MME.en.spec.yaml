      Two Adjacent Rows per Image
      Append Response as Fourth Tab Field
      Response Must Stay on One Line
    type: process
    size: xl
    position:
      x: 2256
      'y': 864
  - id: input_gate
    label: Valid Four-field, Two-row Chunks?
    type: decision
    size: xl
    position:
      x: 1712
      'y': 864
  - id: abort
    label: |-
      Abort Whole Scorer
      Unpack / Assertion Failure
      No Row-level Skip or Imputation
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 736
  - id: parse
    label: |-
      Parse Lowercased Response
      Exact yes / no Accepted
      Else Search First Four Characters
      Check yes before no · Else other
    type: process
    size: xl
    position:
      x: 1440
      'y': 864
  - id: parse_gate
    label: Parser Yields yes or no?
    type: decision
    size: xl
    position:
      x: 1168
      'y': 864
  - id: recognized
    label: |-
      Compare with Ground Truth
      Correct Label Increments Question Count
      Two Correct Labels Increment ACC+
    type: process
    size: xl
    position:
      x: 896
      'y': 736
  - id: other
    label: |-
      Treat other as Incorrect
      Keep in ACC and ACC+ Denominators
      Exclude from Precision / Recall / Confusion Counts
    type: process
    size: xl
    position:
      x: 896
      'y': 992
  - id: pair_metrics
    label: |-
      Compute Two Core Metrics
      ACC · Correct Questions / All Questions
      ACC+ · Both Correct / All Images
      Random Baselines · 50% and 25%
    type: process
    size: xl
    position:
      x: 624
      'y': 864
  - id: task_score
    label: |-
      Score Each Subtask
      100 × (ACC + ACC+)
      Full Score · 200
    type: process
    size: xl
    position:
      x: 352
      'y': 864
  - id: totals
    label: |-
      Report Separate Totals
      Perception · Sum of 10 · Full 2,000
      Cognition · Sum of Four · Full 800
      Denominators Follow Supplied Rows / Chunks
    type: terminal
    size: xl
    position:
      x: 80
      'y': 864
