meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MME Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the 14-subtask image collection and manual paired-question design from the paper, then separates the
    paper metric contract from the exact parser, failure, denominator, and aggregation behavior of the official tool.
  legend: >-
    Solid arrows trace data construction and scoring. Decision branches carry explicit condition outcomes. Unconnected
    cards preserve evidence gaps and the paper-to-public-release access boundary.
