meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MME Build Process
  description: >-
    Paper-aligned MME workflow: ten perception and four cognition subtasks use public images without source annotations
    plus newly photographed or generated images; all 2,374 instruction-answer pairs over 1,187 images are manually
    written as one yes and one no question per image, then scored by ACC, ACC+, and perception/cognition totals.
  legend: Solid arrows separate perception and cognition sourcing before a shared manual QA and scoring pipeline.
