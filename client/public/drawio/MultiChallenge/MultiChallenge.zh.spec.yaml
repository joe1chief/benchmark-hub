meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiChallenge 构建与评测流程
  description: 对齐论文展示 MMSE 多智能体候选生成、失败驱动停止、人工编辑加两层复核、实例级量表构建和多轮自动评测。
  legend: MultiChallenge 含 273 段英文对话，覆盖指令保持、推断记忆、可靠版本编辑和自洽性，每条最多十轮。
nodes:
  - id: goal
    label: |-
      定义真实多轮挑战
      指令遵循 · 上下文注意分配
      上下文内推理
      评测最终回答
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: categories
    label: |-
      设定四类挑战
      指令保持 · 推断记忆
      可靠版本编辑
      抵抗迎合的自洽性
    type: process
    size: xl
    position:
      x: 260
      'y': 230
  - id: inputs
    label: |-
      采样 MMSE 输入
      分层主题分类体系
      PersonaHub 用户画像
      五部分的类别评测配置
    type: database
    size: xl
    position:
      x: 500
      'y': 230
  - id: planner
    label: |-
      规划智能体创建蓝图
      组合主题 · 画像 · 判定标准
      设计隐蔽的失败策略
      编排对话过程
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: user
    label: |-
      用户智能体撰写每轮消息
      落实当前对话蓝图
      保持对话自然真实
      避免明显测试或诱导
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: responder
    label: |-
      采样回答智能体
      从六个前沿 LLM 中随机选择
      根据当前对话历史回答
      避免过拟合单一模型
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: monitor
    label: |-
      规划智能体监控每次回答
      检测对应类别的失败条件
      未失败则更新对话蓝图
      重复至失败或达到轮次上限
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: failure_gate
    label: |-
      是否在最大
      轮次之前
      发现失败？
    type: decision
    size: xl
    position:
      x: 1460
      'y': 500
  - id: discard
    label: |-
      丢弃候选
      达到上限仍未失败
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 500
  - id: human_review
    label: |-
      人工审核与编辑
      检查类别匹配和自然度
      运行全部六个前沿模型
      至少三个模型合理失败才保留
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: review_layers
    label: |-
      再进行两层复核
      复核人员与编辑人员完全不同
      修改或拒绝不合格数据
      两层均通过后才接收
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: release
    label: |-
      发布 273 段对话
      IR 69 · IM 113 · RVE 41 · SC 50
      平均五轮 · 最多十轮
      平均 1,231.7 个词
    type: database
    size: xl
    position:
      x: 740
      'y': 500
  - id: rubric
    label: |-
      编写实例级量表
      人工编写一个二元问题
      裁判只读取最终回答
      保证问题在裁判能力范围内
    type: process
    size: xl
    position:
      x: 500
      'y': 500
  - id: judge
    label: |-
      运行自动评测
      GPT-4o 或 Claude 担任裁判
      回答二元量表问题
      把每条实例判为通过或失败
    type: process
    size: xl
    position:
      x: 260
      'y': 500
  - id: report
    label: |-
      报告多轮对话准确率
      汇总总体与四类挑战
      比较前沿和开源模型
      人机裁判一致率 93.95%
    type: terminal
    size: xl
    position:
      x: 20
      'y': 500
edges:
  - from: goal
    to: categories
    type: primary
  - from: categories
    to: inputs
    type: primary
  - from: inputs
    to: planner
    type: primary
  - from: planner
    to: user
    type: primary
  - from: user
    to: responder
    type: primary
  - from: responder
    to: monitor
    type: primary
  - from: monitor
    to: failure_gate
    type: primary
  - from: failure_gate
    to: human_review
    type: primary
  - from: failure_gate
    to: discard
    type: primary
  - from: human_review
    to: review_layers
    type: primary
  - from: review_layers
    to: release
    type: primary
  - from: release
    to: rubric
    type: primary
  - from: rubric
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
