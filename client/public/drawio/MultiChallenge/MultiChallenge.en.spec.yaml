meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiChallenge Build and Evaluation Process
  description: >-
    Paper-aligned MMSE multi-agent candidate generation, failure-driven stopping, human editing and two additional
    review layers, instance-level rubric construction, and automatic multi-turn evaluation.
  legend: >-
    MultiChallenge contains 273 English conversations across instruction retention, inference memory, reliable versioned
    editing, and self-coherence, with at most ten turns per example.
nodes:
  - id: goal
    label: |-
      Define Realistic Multi-turn Challenges
      Instruction Following · Context Allocation
      In-context Reasoning
      Final-response Evaluation
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: categories
    label: |-
      Specify Four Challenge Categories
      Instruction Retention · Inference Memory
      Reliable Versioned Editing
      Self-coherence against Sycophancy
    type: process
    size: xl
    position:
      x: 260
      'y': 230
  - id: inputs
    label: |-
      Sample MMSE Inputs
      Hierarchical Topic Taxonomy
      PersonaHub User Persona
      Five-part Category Evaluation Config
    type: database
    size: xl
    position:
      x: 500
      'y': 230
  - id: planner
    label: |-
      Planner Creates a Blueprint
      Combine Topic · Persona · Criteria
      Design a Subtle Failure Strategy
      Orchestrate the Conversation
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: user
    label: |-
      User Agent Writes Each Turn
      Realize the Current Blueprint
      Keep the Dialogue Natural
      Avoid Obvious Testing or Gaslighting
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: responder
    label: |-
      Sample a Responder Agent
      Randomly Pick One of Six Frontier LLMs
      Answer from Current Conversation History
      Avoid Single-model Overfitting
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: monitor
    label: |-
      Planner Monitors Every Response
      Detect the Category Failure Condition
      Otherwise Update the Blueprint
      Repeat until Failure or Turn Limit
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: failure_gate
    label: |-
      Failure Found
      Before the Maximum
      Turn Limit?
    type: decision
    size: xl
    position:
      x: 1460
      'y': 500
  - id: discard
    label: |-
      Discard Candidate
      No Failure before Limit
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 500
  - id: human_review
    label: |-
      Human Review and Editing
      Check Category Fit and Naturalness
      Run All Six Frontier Models
      Require at Least Three Reasonable Failures
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: review_layers
    label: |-
      Apply Two More Review Layers
      Reviewer Pool Differs from Editors
      Edit or Reject Unsatisfactory Items
      Accept only after Both Layers Pass
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: release
    label: |-
      Release 273 Conversations
      IR 69 · IM 113 · RVE 41 · SC 50
      Average Five Turns · Maximum Ten
      Average 1,231.7 Words
    type: database
    size: xl
    position:
      x: 740
      'y': 500
  - id: rubric
    label: |-
      Write an Instance-level Rubric
      One Human-authored Binary Question
      Judge Uses Only the Final Response
      Keep the Question Judge-answerable
    type: process
    size: xl
    position:
      x: 500
      'y': 500
  - id: judge
    label: |-
      Run Automatic Evaluation
      GPT-4o or Claude as Judge
      Answer the Binary Rubric
      Convert Each Instance to Pass or Fail
    type: process
    size: xl
    position:
      x: 260
      'y': 500
  - id: report
    label: |-
      Report Multi-turn Accuracy
      Overall and Four Categories
      Compare Frontier and Open Models
      Human-judge Alignment 93.95 Percent
    type: terminal
    size: xl
    position:
      x: 20
      'y': 500
