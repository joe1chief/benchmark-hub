meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GraphWalks 构建流程
  description: 基于官方记录的操作语义、提示封装、标签修复、公开提取器边界和预期集合计分流程。
  legend: 官方未发布构建论文或图生成代码。虚线表示固定数据证据，实线仅采用 f338bb26 的当前发布记录和 README。
nodes:
  - id: evidence
    label: |-
      一手证据 · 无构建论文
      HF 数据卡/数据 f338bb26
      README + 已发布 Parquet 记录
    type: document
    size: xl
    position:
      x: 40
      'y': 320
  - id: graphs
    label: |-
      使用已发布的有向边表图
      10 字符节点 ID · 每节点度数至少 1
      图采样算法未公开
    type: database
    size: xl
    position:
      x: 300
      'y': 320
  - id: bfs
    label: |-
      BFS 操作定义
      仅返回目标深度节点
      排除起点/中间层/已访问节点
    type: process
    size: xl
    position:
      x: 560
      'y': 80
  - id: parents
    label: |-
      Parents 操作定义
      仅返回入边邻居
      排除目标节点自身
    type: process
    size: xl
    position:
      x: 560
      'y': 560
  - id: gold
    label: |-
      使用发布的 answer_nodes 集合
      标签生成/验证代码
      未公开
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: prompt
    label: |-
      串行化每条用户提示
      规则 + 四个固定示例
      边表 + 操作 + 输出契约
    type: process
    size: xl
    position:
      x: 1080
      'y': 320
  - id: schema
    label: |-
      固定版本实际字段
      prompt · answer_nodes
      prompt_chars · problem_type
      date_added
      README 表仍写旧 answer / 3-shot
    type: database
    size: xl
    position:
      x: 1340
      'y': 320
  - id: release
    label: |-
      发布两组上下文 Parquet
      训练集 1,150
      BFS 550 + parents 600
      较短文件 750 · 长文件 400
    type: database
    size: xl
    position:
      x: 1600
      'y': 320
  - id: repair
    label: |-
      应用 2026 正确性修复
      修正较短文件 24/400 条 parent 标签
      澄清 BFS 仅取精确深度
      24 条记录日期为 02-27-2026
    type: process
    size: xl
    position:
      x: 1860
      'y': 320
  - id: run
    label: |-
      要求模型逐步推理
      最后一行必须为
      Final Answer: [n1, n2, ...]
    type: process
    size: xl
    position:
      x: 1860
      'y': 640
  - id: parser
    label: |-
      公开提取器仅取最后一行
      匹配 Final Answer: [...]
      strip("[]") 会把前缀留在首项
      未发布官方修正版解析器
    type: process
    size: xl
    position:
      x: 1600
      'y': 640
  - id: metric
    label: |-
      公开的预期集合计分
      精确率 · 召回率 · F1
      空集/空集的 F1 = 1
      提取器缺陷影响可执行得分
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 640
edges:
  - from: evidence
    to: graphs
    type: data
  - from: graphs
    to: bfs
    type: primary
  - from: graphs
    to: parents
    type: primary
  - from: bfs
    to: gold
    type: primary
  - from: parents
    to: gold
    type: primary
  - from: gold
    to: prompt
    type: primary
  - from: prompt
    to: schema
    type: primary
  - from: schema
    to: release
    type: primary
  - from: release
    to: repair
    type: primary
  - from: repair
    to: run
    type: primary
  - from: run
    to: parser
    type: primary
  - from: parser
    to: metric
    type: primary
modules: []
