meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ReportBench 构建与评测流程
  description: >-
    ReportBench从2020年后的arXiv快照出发，筛选标题或摘要含survey/review的论文，核验发表与综述身份，解析LaTeX引用，并保留678篇专家综述及其参考文献表。流程在每篇综述的时间截止点下反向生成句子级、段落级和细节级研究提示，再做领域分类、分布平衡并抽样100项任务。生成报告不得引用源综述本身。评测比较检索文献与标准书目，抽取带引文和无引文陈述，前者对照原始来源，后者使用网页证据与多模型投票核验，最终报告引用覆盖或重合与陈述事实性。
  legend: >-
    来源：ReportBench arXiv:2508.15804 Sections 2.1-2.2 and Appendix, cross-checked against
    ByteDance-BandAI/ReportBench。实线箭头表示论文或官方资料明确支持的主流程。
