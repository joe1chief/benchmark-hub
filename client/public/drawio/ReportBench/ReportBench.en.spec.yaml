meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ReportBench Build and Evaluation Process
  description: >-
    ReportBench starts from a post-2020 arXiv snapshot, finds survey or review papers, verifies publication and survey
    status, parses LaTeX citations, and retains 678 expert-authored surveys with their bibliographies. It
    reverse-engineers sentence-, paragraph-, and detail-level research prompts under each survey's temporal cutoff,
    classifies domains, balances the distribution, and samples 100 tasks. Generated reports must not cite the source
    survey. Evaluation compares retrieved literature with the gold bibliography, extracts cited and uncited statements,
    checks cited claims against their sources, validates uncited claims with web evidence and multi-model voting, and
    reports citation coverage or overlap plus statement factuality.
  legend: >-
    Source: ReportBench arXiv:2508.15804 Sections 2.1-2.2 and Appendix, cross-checked against
    ByteDance-BandAI/ReportBench. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
