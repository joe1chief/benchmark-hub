meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CharacterEval Build Process
  description: >-
    ACL-paper-aligned construction and evaluation of 1,785 Chinese role-playing conversations and 11,376 examples for 77
    characters, using GPT-4 plot segmentation and dialogue extraction, ABAB and length filtering, human quality control,
    enriched character profiles, twelve subjective metrics, and MBTI personality back-testing.
  legend: Solid arrows show dataset construction and evaluation; dashed arrows carry human labels into CharacterRM.
nodes:
  - id: sources
    label: |-
      Collect Chinese Novels and Scripts
      Diverse Genres, Scenarios, and Leading Characters
      Preserve Fidelity to Original Source Material
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: principles
    label: |-
      Apply Four Collection Principles
      Source Fidelity • Distributional Diversity
      Multi-turn Dialogues • Human in the Loop
    type: document
    size: xl
    position:
      x: 340
      'y': 220
  - id: plot_division
    label: |-
      Use GPT-4 to Identify Plot Twists
      Segment Narrative Text at Semantic Boundaries
      Keep Each Chunk as a Complete Plot
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: extract
    label: |-
      Use GPT-4 to Extract Role-playing Dialogue
      Preserve Utterances, Behaviors, and Scenes
      Represent Responses as Behavior plus Utterance
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: filter
    label: |-
      Filter Dialogue Structure and Length
      Keep ABAB Two-character Exchanges until a Third Joins
      Retain Dialogues Exceeding Five Turns
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: human_qc
    label: |-
      Human Annotators Review Coherence and Quality
      Remove Broken or Low-quality Instances
      Preserve Authentic Multi-turn Character Interaction
    type: user
    size: xl
    position:
      x: 1540
      'y': 220
  - id: profiles
    label: |-
      Enrich Character Profiles
      Knowledge, Behavior, and Speaking Style from Baidu Baike
      Collect Character MBTI Labels for Back-testing
    type: database
    size: xl
    position:
      x: 1840
      'y': 80
  - id: release
    label: |-
      Release the Paper-version CharacterEval
      77 Characters • 1,785 Conversations
      11,376 Examples • Split by Examples, not Conversations
    type: database
    size: xl
    position:
      x: 1840
      'y': 340
  - id: model
    label: |-
      Run a Role-playing Conversational Agent
      Supply Character Profile and Multi-turn Context
      Generate Behavior and Utterance
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: human_labels
    label: |-
      Twelve Annotators Score Model Responses
      Sparse Subjective-metric Matrix • Five-point Scale
      Human Judgments for CharacterRM Training
    type: user
    size: xl
    position:
      x: 2440
      'y': 0
  - id: rm
    label: |-
      Train CharacterRM
      Baichuan2-13B-base Backbone
      Judge Twelve Subjective Metrics
    type: process
    size: xl
    position:
      x: 2740
      'y': 0
  - id: conversation
    label: |-
      Conversational Ability
      Fluency • Coherency • Consistency
    type: process
    size: xl
    position:
      x: 3040
      'y': 0
  - id: character
    label: |-
      Character Consistency
      Knowledge Exposure • Accuracy • Hallucination
      Persona Behavior • Persona Utterance
    type: process
    size: xl
    position:
      x: 3040
      'y': 160
  - id: attractiveness
    label: |-
      Role-playing Attractiveness
      Human-likeness • Communication Skills
      Expression Diversity • Empathy
    type: process
    size: xl
    position:
      x: 3040
      'y': 320
  - id: personality
    label: |-
      Personality Back-testing
      Psychological Interview and MBTI Classification
      Report MBTI Accuracy against Character Labels
    type: process
    size: xl
    position:
      x: 2740
      'y': 480
  - id: report
    label: |-
      Report Thirteen Metrics in Four Dimensions
      Compare General and Role-playing-specialized LLMs
      Analyze Quality across Conversation Turns
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
