meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CyScenarioBench 已公开的构建与评测流程
  description: 对齐可变的官方工作稿，展示事件抽象、攻击树形式化、全新环境构建、三级嵌套评测、实战度量及私有边界。
  legend: 实线对应官方工作稿第 3—4 节；虚线记录未公开的题量、划分、评分和执行框架边界。官方无独立论文、仓库或数据集。
nodes:
  - id: evidence_boundary
    label: |-
      官方工作稿日期 2025-12-05
      HTTP 最后修改 2026-07-16
      无独立论文、仓库或数据集
      获取于 2026-07-18；内容可能变化
    type: document
    size: xl
    position:
      x: 40
      'y': 230
  - id: incidents
    label: |-
      深入分析真实网络安全事件
      攻击者行动与结果
    type: database
    size: xl
    position:
      x: 320
      'y': 230
  - id: extract
    label: |-
      提取攻击者决策
      约束与环境条件
      保留行动依赖
    type: process
    size: xl
    position:
      x: 600
      'y': 230
  - id: tree
    label: |-
      形式化攻击树
      前置条件 · 依赖 · 分支
      标注能力要求与环境依赖
    type: document
    size: xl
    position:
      x: 880
      'y': 230
  - id: environment
    label: |-
      全新容器化网络拓扑
      真实操作系统与应用
      防御工具 · 语音 · 人物 · 网站
    type: process
    size: xl
    position:
      x: 1160
      'y': 230
  - id: novelty
    label: |-
      从零构建全新布局
      不使用公开 CTF 或挑战档案
      所有场景保持私有
    type: process
    size: xl
    position:
      x: 1440
      'y': 230
  - id: benchmark
    label: |-
      私有 CyScenarioBench 状态空间
      标注节点 + 环境依赖
      包含真实阻力与不确定性
    type: database
    size: xl
    position:
      x: 1720
      'y': 230
  - id: agent
    label: |-
      遍历动态受约束状态
      整合信息并更新计划
      行动 · 观察 · 适应 · 排障
    type: process
    size: xl
    position:
      x: 2000
      'y': 230
  - id: levels
    label: 三级嵌套评测
    type: decision
    size: xl
    position:
      x: 2280
      'y': 230
  - id: task
    label: |-
      任务级：单项原子能力
      不含序列或适应
    type: document
    size: xl
    position:
      x: 2560
      'y': 20
  - id: path
    label: |-
      路径级：一条攻击树分支
      规划 · 决策 · 长上下文
    type: document
    size: xl
    position:
      x: 2560
      'y': 230
  - id: campaign
    label: |-
      战役级：完整仿真
      多条路径 · 阻力 · 不确定性
      端到端适应与恢复
    type: document
    size: xl
    position:
      x: 2560
      'y': 440
  - id: metrics
    label: |-
      实战度量，不是评分公式
      分支决策 · 约束遵循
      上下文漂移 · 死路 · 排障
      策略偏离 · 不可能状态跳转
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 230
  - id: boundary
    label: |-
      无题量、划分、评分公式、
      公开执行框架或逐题输出
      官方称当前测量粒度仍较粗
    type: document
    size: xl
    position:
      x: 3120
      'y': 440
  - id: example_config
    label: |-
      下游示例：GPT-5.6 Sol（2026-06-26）
      该测试配置使用 11 个场景
      7/11 至少成功一次 · 尝试均值 28%
      非标准完整题库规模
    type: document
    size: xl
    position:
      x: 3120
      'y': 20
edges:
  - from: evidence_boundary
    to: incidents
    type: primary
  - from: incidents
    to: extract
    type: primary
  - from: extract
    to: tree
    type: primary
  - from: tree
    to: environment
    type: primary
  - from: environment
    to: novelty
    type: primary
  - from: novelty
    to: benchmark
    type: primary
  - from: benchmark
    to: agent
    type: primary
  - from: agent
    to: levels
    type: primary
  - from: levels
    to: task
    type: primary
    style:
      exitX: 1
      exitY: 0.2
      entryX: 0
      entryY: 0.5
  - from: levels
    to: path
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: levels
    to: campaign
    type: primary
    style:
      exitX: 1
      exitY: 0.8
      entryX: 0
      entryY: 0.5
  - from: task
    to: metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.2
  - from: path
    to: metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: campaign
    to: metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.8
  - from: metrics
    to: boundary
    type: optional
  - from: metrics
    to: example_config
    type: optional
modules: []
