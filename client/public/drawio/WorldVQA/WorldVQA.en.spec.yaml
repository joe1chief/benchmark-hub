meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldVQA Atomic-Knowledge Construction and Evaluation
  description: >-
    Ten expert annotators build atomic visual-knowledge items under isolation, coverage, granularity, and
    visual-reliability gates. For global expansion, regional labeling identifies underrepresented regions, GPT/Kimi
    association search proposes candidates, and human annotators curate the final additions. ISC deduplication against
    LAION/Common Crawl, five-model difficulty stratification, mandatory secondary review for Hard items, and parallel
    Gemini-3-Pro plus blind-human verification follow. The final 3,500 pairs are judged with GPT-oss-120b and reported
    with accuracy, attempt rate, CGA, and F-score; People is excluded from the eight-category overall.
  legend: >-
    Source: WorldVQA arXiv:2602.02537v1, Sections 2.1-2.6, Table 2, Section 3.1, Table 3, and Appendix A; official
    project https://worldvqa2026.github.io/WorldVQA/, repository https://github.com/MoonshotAI/WorldVQA/, and dataset
    https://huggingface.co/datasets/moonshotai/WorldVQA. Version pin: 3,500 pairs and nine categories.. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
