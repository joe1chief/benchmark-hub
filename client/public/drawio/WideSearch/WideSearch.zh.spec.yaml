meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WideSearch 任务构建校准与评测流程
  description: >-
    WideSearch从真实用户查询出发，由人工筛选、澄清并通过穷尽式网页搜索构建标准答案，同时记录完成时间、搜索查询、关键词和唯一页面数。流程先移除无工具语言模型可完整回答的问题，再移除人工耗时少于10分钟或唯一页面少于10个的任务。在最终验证循环中，商业智能体先为每个候选任务生成一个响应，自动评测器与人工专家分别对同一个响应评分。若自动评分与人工评分的相似度低于95%，则修订任务与标准答案标注并重复该流程。因此，95%表示评分者一致度，而不是响应与标准表的相似度。另在Section
    4.3中，论文对200个抽样响应进行独立验证，各评判模型与人工评测的一致度均不低于97.8%。论文最终集含200题，中英文各100题，覆盖18个主题。评测先解析Markdown表格与表头，按主键对齐行，再把单元格分流到精确、数值、日期、URL或GPT-4.1语义检查，报告整表完全正确的成功率以及行级和单元格级F1。多次运行使用Avg@N、成功率Pass@N与F1
    Max@N。
  legend: >-
    来源：WideSearch arXiv:2508.07999, Section 3.3 and Figure 3 for the five-stage construction pipeline. In 'Iterative
    Refinement and Validation,' the paper defines the 95 percent threshold as similarity between automated-evaluation
    and expert-human scores on the same commercial-agent response. Section 4.3 and Table 3 separately report at least
    97.8 percent automated-human consistency on 200 sampled responses. Sections 3.4-3.5 and Appendix D define the
    200-task bilingual composition, table parsing, primary-key alignment, hybrid cell scoring, and SR/Row-F1/Item-F1
    aggregation. Official repository: https://github.com/ByteDance-Seed/WideSearch.。实线箭头表示论文或官方资料明确支持的主流程。
