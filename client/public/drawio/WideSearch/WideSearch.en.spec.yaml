meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WideSearch Task Build, Calibration, and Evaluation
  description: >-
    WideSearch starts from real user queries that human annotators screen, clarify, and answer through exhaustive web
    search while recording completion time, search queries, keywords, and unique pages. It removes questions that a
    no-tool language model can answer completely, then removes tasks requiring less than ten minutes or fewer than ten
    unique pages. In the final validation loop, a commercial agent produces one response for each provisional task; the
    automated evaluator and human experts independently score that same response. If similarity between the automated
    and human scores is below 95 percent, the task and gold annotation are revised and the cycle repeats. Thus, 95
    percent measures scorer agreement, not response-to-gold similarity. Separately, Section 4.3 evaluates 200 sampled
    responses and reports at least 97.8 percent automated-human consistency across judge models. The final paper set has
    200 tasks, evenly split between English and Chinese across 18 topics. Evaluation parses the Markdown table and
    header, aligns rows by primary key, routes cells to exact, numeric, date, URL, or GPT-4.1 semantic checks, and
    reports perfect-table success rate plus row and item F1. Repeated runs use Avg@N, Pass@N for success rate, and Max@N
    for F1.
  legend: >-
    Source: WideSearch arXiv:2508.07999, Section 3.3 and Figure 3 for the five-stage construction pipeline. In
    'Iterative Refinement and Validation,' the paper defines the 95 percent threshold as similarity between
    automated-evaluation and expert-human scores on the same commercial-agent response. Section 4.3 and Table 3
    separately report at least 97.8 percent automated-human consistency on 200 sampled responses. Sections 3.4-3.5 and
    Appendix D define the 200-task bilingual composition, table parsing, primary-key alignment, hybrid cell scoring, and
    SR/Row-F1/Item-F1 aggregation. Official repository: https://github.com/ByteDance-Seed/WideSearch.. Solid arrows show
    the main flow explicitly supported by the paper or official documentation.
