meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles Bench Build Process
  description: >-
    Paper-aligned multi-view scene selection, question construction, and human quality control based on
    arXiv:2504.15280, with downstream evaluation shown as a separate branch.
  legend: >-
    Each item is a three-option multiple-choice question with one correct answer; paired questions test whether a model
    preserves cross-view correspondences under controlled transformations.
nodes:
  - id: source_pools
    label: |-
      Candidate Multi-View Sources
      Ego-Exo4D + EgoHumans
      Real-World Multi-Camera Activities
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: select_scenes
    label: |-
      Manual Scene Selection
      83 Ego-Exo4D + 7 EgoHumans
      90 Final Scenes
    type: user
    size: xl
    position:
      x: 320
      'y': 170
  - id: view_set
    label: |-
      Curate Each View Set
      Final 4–5 Spatially Dispersed Views
      Resize Images to 796 × 448
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: task_design
    label: |-
      Design Six Reasoning Tasks
      Count • Attribute • Distance • Direction
      Manipulation • Camera Pose
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: draft
    label: |-
      Five MLLM-Generated Task Categories
      Counting • Attribute • Distance
      Direction • Manipulation
      Three Questions per Task and Scene
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
    style:
      fontSize: 10
  - id: camera_template
    label: |-
      Camera Pose Estimation
      Dedicated Question Template
      One Question per Scene
    type: document
    size: xl
    position:
      x: 1160
      'y': 300
  - id: view_policy
    label: |-
      Apply Task-Specific View Policy
      All Views for Counting and Camera Pose
      Other Tasks Use Two Randomly Selected Views
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: human_review
    label: |-
      Eight STEM PhD Annotators Review All Items
      Remove Invalid Questions
      Refine Wording and Answer Choices
    type: user
    size: xl
    position:
      x: 1440
      'y': 500
  - id: mcq
    label: |-
      Enforce the MCQ Contract
      Three Answer Options
      Exactly One Correct Answer
    type: document
    size: xl
    position:
      x: 1160
      'y': 500
  - id: paired
    label: |-
      Construct Paired Questions
      Rephrase, Swap Orientation, or Change Views
      Preserve the Underlying Correspondence
    type: process
    size: xl
    position:
      x: 880
      'y': 500
  - id: final_qc
    label: |-
      Perform Final Human Quality Control
      Verify Visual Evidence and Single Answer
      85.3% Paired Coverage Excluding Counting
    type: user
    size: xl
    position:
      x: 600
      'y': 500
  - id: benchmark
    label: |-
      Release All-Angles Bench
      2,132 QA Pairs • 90 Scenes
      Six Multi-View Task Categories
    type: database
    size: xl
    position:
      x: 320
      'y': 500
  - id: model_eval
    label: |-
      Downstream Evaluation: 27 MLLMs
      Standard Multiple-Choice Prompting
      Parse One of Three Answer Options
    type: process
    size: xl
    position:
      x: 360
      'y': 760
  - id: accuracy
    label: |-
      Compute Accuracy
      Overall and by Task Category
      Compare Open and Proprietary Models
    type: process
    size: xl
    position:
      x: 720
      'y': 660
  - id: consistency
    label: |-
      Measure Paired Inconsistency
      Compare Answers to Corresponding Items
      Diagnose Cross-View Instability
    type: process
    size: xl
    position:
      x: 720
      'y': 860
  - id: human
    label: |-
      Downstream Human Reference
      Random 250-Question Subset
      Exclude Paired Questions
      Cover All Six Task Categories
    type: user
    size: xl
    position:
      x: 1080
      'y': 1060
  - id: report
    label: |-
      Report Downstream Model Results
      Accuracy • Paired Consistency
      Overall and Per-Task Performance
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 760
edges:
  - from: source_pools
    to: select_scenes
    type: primary
  - from: select_scenes
    to: view_set
    type: primary
  - from: view_set
    to: task_design
    type: primary
  - from: task_design
    to: draft
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: task_design
    to: camera_template
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: draft
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: camera_template
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: view_policy
    to: human_review
    type: primary
  - from: human_review
    to: mcq
    type: primary
  - from: mcq
    to: paired
    type: primary
  - from: paired
    to: final_qc
    type: primary
  - from: final_qc
    to: benchmark
    type: primary
  - from: benchmark
    to: model_eval
    type: secondary
    style:
      strokeColor: '#757575'
      strokeWidth: 1
      dashed: true
      dashPattern: 4 4
      endArrow: open
      endFill: false
    waypoints:
      - x: 324
        'y': 640
      - x: 364
        'y': 640
  - from: model_eval
    to: accuracy
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: model_eval
    to: consistency
    type: data
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: benchmark
    to: human
    type: secondary
    style:
      strokeColor: '#757575'
      strokeWidth: 1
      dashed: true
      dashPattern: 4 4
      endArrow: open
      endFill: false
    waypoints:
      - x: 160
        'y': 498
      - x: 160
        'y': 960
      - x: 1084
        'y': 960
  - from: accuracy
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: consistency
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
modules: []
