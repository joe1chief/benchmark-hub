meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles Bench Build Process
  description: >-
    Paper-v2 construction pipeline for multi-view scene selection, six-task question authoring, layered human quality
    control, and paired-question release. Model evaluation and the separate human study are shown only as downstream
    evidence.
  legend: >-
    Solid arrows are benchmark construction. Dashed branches begin only after the release and represent model or human
    evaluation, not data construction.
nodes:
  - id: source_pools
    label: |-
      Multi-View Source Pools
      Ego-Exo4D + EgoHumans
      Real-World Multi-Camera Activities
    type: database
    size: xl
    position:
      x: 40
      'y': 140
  - id: select_scenes
    label: |-
      Manual Scene Selection
      83 Ego-Exo4D + 7 EgoHumans
      90 Final Scenes
    type: user
    size: xl
    position:
      x: 320
      'y': 140
  - id: view_set
    label: |-
      Curate Each View Set
      Final 4–5 Dispersed Views
      Resize to 796 × 448
    type: process
    size: xl
    position:
      x: 600
      'y': 140
  - id: task_design
    label: |-
      Design Six Tasks
      Count • Attribute • Distance • Direction
      Manipulation • Camera Pose
    type: document
    size: xl
    position:
      x: 880
      'y': 140
  - id: mllm_questions
    label: |-
      GPT-4o Authors Five Task Types
      3 Questions per Type and Scene
      Count • Attribute • Distance
      Direction • Manipulation
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
    style:
      fontSize: 10
  - id: camera_template
    label: |-
      Camera-Pose Template
      Dedicated Construction Rule
      One Question per Scene
    type: document
    size: xl
    position:
      x: 1160
      'y': 260
  - id: view_policy
    label: |-
      Task-Specific View Policy
      All Views: Count + Camera Pose
      Two Random Views: Other Tasks
    type: process
    size: xl
    position:
      x: 1440
      'y': 150
  - id: first_review
    label: |-
      First Human Review
      8 STEM PhD Annotators
      Pilot Samples, Then Review All Items
    type: user
    size: xl
    position:
      x: 1440
      'y': 460
  - id: cross_check
    label: |-
      Cross-Check Every Annotation
      At Least One Other Annotator
      Group Discussion Resolves Disputes
    type: user
    size: xl
    position:
      x: 1160
      'y': 460
  - id: random_audit
    label: |-
      Periodic Random Audit
      Sample Reviewed Questions
      Correct Issues Before Release
    type: user
    size: xl
    position:
      x: 880
      'y': 460
  - id: mcq_contract
    label: |-
      Enforce MCQ Contract
      Three Answer Options
      Exactly One Correct Answer
    type: document
    size: xl
    position:
      x: 600
      'y': 460
  - id: paired
    label: |-
      Construct Paired Questions
      Rephrase • Change Orientation • Change Views
      Preserve Visual Correspondence
    type: process
    size: xl
    position:
      x: 320
      'y': 460
    style:
      fontSize: 10
  - id: final_qc
    label: |-
      Final Human Quality Control
      Verify Evidence and Single Answer
      85.3% Paired Coverage, Excluding Counting
    type: user
    size: xl
    position:
      x: 40
      'y': 460
    style:
      fontSize: 10
  - id: release
    label: |-
      Release All-Angles Bench
      2,132 QA Pairs • 90 Scenes
      Six Multi-View Tasks
    type: database
    size: xl
    position:
      x: 40
      'y': 760
  - id: eval_contract
    label: |-
      Downstream Model Evaluation
      VLMEvalKit • Greedy • Temperature 0
      Fixed MCQ Prompt with Option Letters
    type: process
    size: xl
    position:
      x: 340
      'y': 690
    style:
      fontSize: 10
  - id: answer_parser
    label: |-
      Extract the Final Option
      Qwen2.5-32B Parser
      Map Output to One Option Letter
    type: process
    size: xl
    position:
      x: 640
      'y': 690
  - id: accuracy
    label: |-
      Accuracy
      Overall and Per Task
      Direct MCQ Correctness
    type: terminal
    size: xl
    position:
      x: 940
      'y': 590
  - id: consistency
    label: |-
      Paired Consistency
      CC • WW • IC Outcomes
      Diagnose Cross-View Instability
    type: terminal
    size: xl
    position:
      x: 940
      'y': 790
  - id: human_subset
    label: |-
      Separate Human Study
      250 Questions • Exclude Paired Data
      Two Additional PhD Annotators
    type: user
    size: xl
    position:
      x: 640
      'y': 990
  - id: report
    label: |-
      Report Evaluation Evidence
      Accuracy • CC / WW / IC
      Model and Human Results Stay Separate
    type: terminal
    size: xl
    position:
      x: 1240
      'y': 690
edges:
  - from: source_pools
    to: select_scenes
    type: primary
  - from: select_scenes
    to: view_set
    type: primary
  - from: view_set
    to: task_design
    type: primary
  - from: task_design
    to: mllm_questions
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: task_design
    to: camera_template
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: mllm_questions
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: camera_template
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: view_policy
    to: first_review
    type: primary
  - from: first_review
    to: cross_check
    type: primary
  - from: cross_check
    to: random_audit
    type: primary
  - from: random_audit
    to: mcq_contract
    type: primary
  - from: mcq_contract
    to: paired
    type: primary
  - from: paired
    to: final_qc
    type: primary
  - from: final_qc
    to: release
    type: primary
  - from: release
    to: eval_contract
    type: secondary
    style:
      exitX: 1
      exitY: 0.35
      entryX: 0
      entryY: 0.5
  - from: eval_contract
    to: answer_parser
    type: secondary
  - from: answer_parser
    to: accuracy
    type: secondary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: answer_parser
    to: consistency
    type: secondary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: accuracy
    to: report
    type: secondary
  - from: consistency
    to: report
    type: secondary
  - from: release
    to: human_subset
    type: optional
    waypoints:
      - x: 180
        'y': 1040
      - x: 620
        'y': 1040
  - from: human_subset
    to: report
    type: optional
    waypoints:
      - x: 1100
        'y': 1040
      - x: 1100
        'y': 850
modules: []
