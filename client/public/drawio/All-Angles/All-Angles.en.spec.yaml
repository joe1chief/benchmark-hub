meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles Build Process
  description: >-
    Paper-aligned multi-view scene benchmark construction and evaluation workflow for All-Angles Bench, based on
    arXiv:2504.15280.
  legend: >-
    Solid arrows show scene selection, question annotation, paired-question construction, and model evaluation; dashed
    arrows mark human quality-control feedback.
nodes:
  - id: scenes
    label: |-
      Multi-view sources
      Ego-Exo4D and EgoHumans
      90 real-world scenes
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: tasks
    label: |-
      Six task categories
      counting, attributes, distance
      direction, manipulation, camera pose
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: draft_questions
    label: |-
      MLLM question drafts
      multi-view visual grounding
      category-specific templates
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotation
    label: |-
      Human annotation
      8 annotators inspect images
      remove invalid or unclear items
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: answer_check
    label: |-
      Answer and option review
      revise incorrect choices
      one correct MCQ answer
    type: decision
    size: xl
    position:
      x: 820
      'y': 70
  - id: paired
    label: |-
      Paired questions
      rephrase or swap view order
      preserve visual correspondence
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: dataset
    label: |-
      All-Angles Bench
      2,132 QA pairs
      85.3% paired counterparts
    type: document
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      Multi-view evaluation
      27 MLLMs
      250-question human subset
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: scenes
    to: tasks
    type: primary
  - from: tasks
    to: draft_questions
    type: primary
  - from: draft_questions
    to: annotation
    type: primary
  - from: annotation
    to: answer_check
    type: primary
  - from: answer_check
    to: paired
    type: primary
  - from: paired
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
  - from: answer_check
    to: annotation
    type: optional
    label: quality-control loop
modules: []
