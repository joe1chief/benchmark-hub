meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles Bench 构建流程
  description: 论文 v2 对齐的多视角场景筛选、六类问题构造、分层人工质检与配对问题发布流程；模型评测与独立人类实验只作为下游证据展示。
  legend: 实线表示基准构建；虚线分支仅在数据发布后开始，分别表示模型评测与人类实验，不属于数据构建。
nodes:
  - id: source_pools
    label: |-
      多视角来源池
      Ego-Exo4D + EgoHumans
      真实多相机活动场景
    type: database
    size: xl
    position:
      x: 40
      'y': 140
  - id: select_scenes
    label: |-
      人工筛选场景
      Ego-Exo4D 83 个 + EgoHumans 7 个
      共 90 个最终场景
    type: user
    size: xl
    position:
      x: 320
      'y': 140
  - id: view_set
    label: |-
      整理每组视角
      最终保留 4–5 个分散视图
      缩放至 796 × 448
    type: process
    size: xl
    position:
      x: 600
      'y': 140
  - id: task_design
    label: |-
      设计六类任务
      计数 • 属性 • 距离 • 方向
      物体操作 • 相机姿态
    type: document
    size: xl
    position:
      x: 880
      'y': 140
  - id: mllm_questions
    label: |-
      GPT-4o 生成五类任务
      每场景每类生成三题
      计数 • 属性 • 距离
      方向 • 物体操作
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
    style:
      fontSize: 10
  - id: camera_template
    label: |-
      相机姿态专用模板
      独立构造规则
      每场景生成一题
    type: document
    size: xl
    position:
      x: 1160
      'y': 260
  - id: view_policy
    label: |-
      按任务选择视角
      计数与相机姿态使用全部视角
      其余任务随机选择两个视角
    type: process
    size: xl
    position:
      x: 1440
      'y': 150
  - id: first_review
    label: |-
      首轮人工复核
      8 名 STEM 博士标注员
      先试标，再全量复核
    type: user
    size: xl
    position:
      x: 1440
      'y': 460
  - id: cross_check
    label: |-
      每条标注交叉复核
      至少由另一名标注员检查
      分歧通过小组讨论解决
    type: user
    size: xl
    position:
      x: 1160
      'y': 460
  - id: random_audit
    label: |-
      定期随机抽检
      抽查已复核问题
      发布前纠正问题
    type: user
    size: xl
    position:
      x: 880
      'y': 460
  - id: mcq_contract
    label: |-
      固化选择题合同
      三个答案选项
      仅有一个正确答案
    type: document
    size: xl
    position:
      x: 600
      'y': 460
  - id: paired
    label: |-
      构造配对问题
      改写 • 改变方向 • 改变视角
      保持视觉对应关系
    type: process
    size: xl
    position:
      x: 320
      'y': 460
    style:
      fontSize: 10
  - id: final_qc
    label: |-
      最终人工质检
      核验视觉证据与唯一答案
      配对覆盖率 85.3%，不含计数
    type: user
    size: xl
    position:
      x: 40
      'y': 460
    style:
      fontSize: 10
  - id: release
    label: |-
      发布 All-Angles Bench
      2,132 个问答对 • 90 个场景
      六类多视角任务
    type: database
    size: xl
    position:
      x: 40
      'y': 760
  - id: eval_contract
    label: |-
      下游模型评测
      VLMEvalKit • 贪心解码 • 温度 0
      固定选择题提示与选项字母
    type: process
    size: xl
    position:
      x: 340
      'y': 690
    style:
      fontSize: 10
  - id: answer_parser
    label: |-
      提取最终选项
      Qwen2.5-32B 解析器
      将输出映射为一个选项字母
    type: process
    size: xl
    position:
      x: 640
      'y': 690
  - id: accuracy
    label: |-
      准确率
      总体与逐任务统计
      直接选择题正确性
    type: terminal
    size: xl
    position:
      x: 940
      'y': 590
  - id: consistency
    label: |-
      配对一致性
      CC • WW • IC 三类结果
      诊断跨视角不稳定
    type: terminal
    size: xl
    position:
      x: 940
      'y': 790
  - id: human_subset
    label: |-
      独立人类实验
      250 题 • 排除配对数据
      另由两名博士标注员作答
    type: user
    size: xl
    position:
      x: 640
      'y': 990
  - id: report
    label: |-
      报告评测证据
      准确率 • CC / WW / IC
      模型与人类结果保持分离
    type: terminal
    size: xl
    position:
      x: 1240
      'y': 690
edges:
  - from: source_pools
    to: select_scenes
    type: primary
  - from: select_scenes
    to: view_set
    type: primary
  - from: view_set
    to: task_design
    type: primary
  - from: task_design
    to: mllm_questions
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: task_design
    to: camera_template
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: mllm_questions
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: camera_template
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: view_policy
    to: first_review
    type: primary
  - from: first_review
    to: cross_check
    type: primary
  - from: cross_check
    to: random_audit
    type: primary
  - from: random_audit
    to: mcq_contract
    type: primary
  - from: mcq_contract
    to: paired
    type: primary
  - from: paired
    to: final_qc
    type: primary
  - from: final_qc
    to: release
    type: primary
  - from: release
    to: eval_contract
    type: secondary
    style:
      exitX: 1
      exitY: 0.35
      entryX: 0
      entryY: 0.5
  - from: eval_contract
    to: answer_parser
    type: secondary
  - from: answer_parser
    to: accuracy
    type: secondary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: answer_parser
    to: consistency
    type: secondary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: accuracy
    to: report
    type: secondary
  - from: consistency
    to: report
    type: secondary
  - from: release
    to: human_subset
    type: optional
    waypoints:
      - x: 180
        'y': 1040
      - x: 620
        'y': 1040
  - from: human_subset
    to: report
    type: optional
    waypoints:
      - x: 1100
        'y': 1040
      - x: 1100
        'y': 850
modules: []
