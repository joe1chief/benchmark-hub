meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles Bench 构建流程
  description: 基于 arXiv:2504.15280 对齐的多视角场景筛选、问题构建与人工质检流程；下游评测以独立分支展示。
  legend: 每个样本都是三选一且只有一个正确答案；配对问题通过受控变换检验模型能否保持跨视角对应关系。
nodes:
  - id: source_pools
    label: |-
      候选多视角来源
      Ego-Exo4D + EgoHumans
      真实多相机活动场景
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: select_scenes
    label: |-
      人工筛选场景
      Ego-Exo4D 83 个 + EgoHumans 7 个
      共 90 个最终场景
    type: user
    size: xl
    position:
      x: 320
      'y': 170
  - id: view_set
    label: |-
      整理每组视角
      最终保留 4–5 个空间分散视图
      图像缩放至 796 × 448
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: task_design
    label: |-
      设计六类推理任务
      计数 • 属性 • 距离 • 方向
      物体操作 • 相机姿态
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: draft
    label: |-
      五类 MLLM 生成任务
      计数 • 属性 • 距离
      方向 • 物体操作
      每场景每任务三题
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
    style:
      fontSize: 10
  - id: camera_template
    label: |-
      相机姿态估计
      专用问题模板
      每场景一题
    type: document
    size: xl
    position:
      x: 1160
      'y': 300
  - id: view_policy
    label: |-
      应用任务特定视角策略
      计数与相机姿态使用全部视图
      其他任务随机选择两个视角
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: human_review
    label: |-
      八名 STEM 博士标注员全量复核
      移除无效问题
      优化措辞与答案选项
    type: user
    size: xl
    position:
      x: 1440
      'y': 500
  - id: mcq
    label: |-
      强制选择题合同
      三个答案选项
      且仅有一个正确答案
    type: document
    size: xl
    position:
      x: 1160
      'y': 500
  - id: paired
    label: |-
      构造配对问题
      改写、交换方位或更换视图
      保持底层对应关系不变
    type: process
    size: xl
    position:
      x: 880
      'y': 500
  - id: final_qc
    label: |-
      最终人工质检
      核验视觉证据与唯一答案
      除计数外配对覆盖率 85.3%
    type: user
    size: xl
    position:
      x: 600
      'y': 500
  - id: benchmark
    label: |-
      发布 All-Angles Bench
      2,132 个问答对 • 90 个场景
      六类多视角任务
    type: database
    size: xl
    position:
      x: 320
      'y': 500
  - id: model_eval
    label: |-
      下游评测：27 个 MLLM
      标准选择题提示
      解析三个答案选项之一
    type: process
    size: xl
    position:
      x: 360
      'y': 760
  - id: accuracy
    label: |-
      计算准确率
      总体与任务类别分项
      比较开源与闭源模型
    type: process
    size: xl
    position:
      x: 720
      'y': 660
  - id: consistency
    label: |-
      测量配对不一致率
      比较对应问题的答案
      诊断跨视角不稳定性
    type: process
    size: xl
    position:
      x: 720
      'y': 860
  - id: human
    label: |-
      下游人类参考
      随机抽取 250 题子集
      排除配对问题
      覆盖全部六类任务
    type: user
    size: xl
    position:
      x: 1080
      'y': 1060
  - id: report
    label: |-
      汇报下游模型结果
      准确率 • 配对一致性
      总体及分任务表现
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 760
edges:
  - from: source_pools
    to: select_scenes
    type: primary
  - from: select_scenes
    to: view_set
    type: primary
  - from: view_set
    to: task_design
    type: primary
  - from: task_design
    to: draft
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: task_design
    to: camera_template
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: draft
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: camera_template
    to: view_policy
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: view_policy
    to: human_review
    type: primary
  - from: human_review
    to: mcq
    type: primary
  - from: mcq
    to: paired
    type: primary
  - from: paired
    to: final_qc
    type: primary
  - from: final_qc
    to: benchmark
    type: primary
  - from: benchmark
    to: model_eval
    type: secondary
    style:
      strokeColor: '#757575'
      strokeWidth: 1
      dashed: true
      dashPattern: 4 4
      endArrow: open
      endFill: false
    waypoints:
      - x: 324
        'y': 640
      - x: 364
        'y': 640
  - from: model_eval
    to: accuracy
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: model_eval
    to: consistency
    type: data
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: benchmark
    to: human
    type: secondary
    style:
      strokeColor: '#757575'
      strokeWidth: 1
      dashed: true
      dashPattern: 4 4
      endArrow: open
      endFill: false
    waypoints:
      - x: 160
        'y': 498
      - x: 160
        'y': 960
      - x: 1084
        'y': 960
  - from: accuracy
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: consistency
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
modules: []
