meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisuLogic — Web Collection, Quality Control, and Evaluation
  description: >-
    VisuLogic uses Playwright to collect public web pages, cleans HTML noise, serializes candidates to JSONL, validates
    image existence and format, and deduplicates text by lexical overlap and images by perceptual hash. Every benchmark
    item then receives a full manual check and expert labels before assignment to six reasoning classes. The benchmark
    contains 1,000 four-choice questions. A separate same-domain candidate pool is processed with the same validation
    workflow and explicit non-overlap checks to produce a 4,296-item supplemental training set; it is not split from the
    1,000 benchmark items. Evaluation compares direct-image MLLMs, text-only LLMs given GPT-4o captions, humans, and
    random choice. Model branches are evaluated with Non-CoT, CoT, and Hint prompts; CoT is the default, while GPT-4o
    generates Hint text from the reference solution. Accuracy is reported.
  legend: >-
    Source: arXiv:2504.15279, Sections 3.1-3.3 (pp.4-5) and Section 4.1 (p.6).. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
