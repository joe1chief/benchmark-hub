meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisuLogic — 网页采集、质量控制与评测
  description: >-
    VisuLogic 用 Playwright 抓取公开网页，清理 HTML 噪声并序列化为
    JSONL，检查图像存在性与格式，再分别以词汇重叠和感知哈希去重文本与图像。正式基准样本随后接受完整人工检查和专家标注，再归入六类推理任务，最终形成1,000道四选题。另一个同领域独立候选池采用相同验证流程并显式检查不重叠，形成4,296道补充训练题；它并非从这1,000道基准题中切分。评测比较直接输入图像的
    MLLM、使用 GPT-4o 图像描述的纯文本 LLM、人类与随机基线；模型分支分别使用 Non-CoT、CoT 与 Hint 提示，其中 CoT 为默认，Hint 由 GPT-4o 根据参考解答生成。最终报告准确率。
  legend: 来源：arXiv:2504.15279, Sections 3.1-3.3 (pp.4-5) and Section 4.1 (p.6).。实线箭头表示论文或官方资料明确支持的主流程。
