meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SD-QA 构建与评测流程
  description: >-
    SD-QA在TyDi QA基础上增加超过6.8万条真人录制的语音问题，覆盖阿拉伯语、孟加拉语、英语、斯瓦希里语和韩语的24种语言变体与255名说话者。它直接使用各语言原生TyDi QA问题而非翻译题，把原TyDi
    QA开发集作为测试集，从训练集抽取开发题并从文本训练数据中移除这些题；不提供语音训练集。发布数据按语言、方言与划分组织录音、标准和ASR转录、说话者元数据、上下文及答案。评测包括以词错误率衡量ASR、以TyDi QA
    F1衡量段落选择和最小答案选择，以及跨方言和说话者群体的稳健性或公平性比较。
  legend: 来源：SD-QA arXiv:2109.12072 Sections 2-3 and official ffaisal93/SD-QA data and baseline layout。实线箭头表示论文或官方资料明确支持的主流程。
