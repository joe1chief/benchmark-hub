meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InfographicVQA 构建流程
  description: 与论文一致的 InfographicVQA 流程：超过 10,000 张网络图片经过两轮去重，由受训内部团队分两阶段标注，再过滤、划分，并用 ANLS 与严格准确率评测。
  legend: 实线表示收集、去重、两阶段标注、过滤、发布与模型评分；虚线表示人工参考评测。
nodes:
  - id: evidence
    label: |-
      主要证据与稳定发布入口
      arXiv:2104.12756v2
      WACV 2022 · DocVQA / RRC
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: search
    label: |-
      网络图片搜索
      Google + Bing 搜索“infographics”
      下载超过 10,000 张图片
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: phash
    label: |-
      感知哈希第一轮去重
      移除近 2,000 张重复图片
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: ocr_dedupe
    label: |-
      第二轮去重
      Amazon Textract OCR 文本词元
      按 Jaccard 相似度比较
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: pool
    label: |-
      标注候选池
      约 7,000 张多样信息图
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: workers
    label: |-
      放弃噪声超过 40% 的众包试点
      内部工具 + 90 分钟讲解 + 测验
      筛选 13 名可密切沟通的标注者
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: stage1
    label: |-
      第一阶段标注
      可拒绝不适合的图片
      创建问题与答案对
      超过 3 万题后停止
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: split
    label: |-
      按图片随机互斥划分
      约 80% / 10% / 10%
      训练 · 验证 · 测试
    type: database
    size: xl
    position:
      x: 1980
      'y': 40
  - id: stage2
    label: |-
      验证与测试集第二阶段
      由不同标注者独立作答
      不查看首个答案
      可标记“无法回答”
    type: user
    size: xl
    position:
      x: 1980
      'y': 320
  - id: types
    label: |-
      标注问答类型
      答案来源四类 · 证据五类
      操作：计数 / 排序 / 算术
    type: process
    size: xl
    position:
      x: 1700
      'y': 320
  - id: filter
    label: |-
      质量与答案规则
      移除 1.9% 无法回答题
      保留小写去重后的参考答案
      多片段答案接受任意排列
    type: process
    size: xl
    position:
      x: 1420
      'y': 320
  - id: dataset
    label: |-
      最终 InfographicVQA
      30,035 个问题 · 5,485 张图片
      来自 2,594 个网站域
      问题划分 23,946 / 2,801 / 3,288
      图片划分 4,406 / 500 / 579
    type: database
    size: xl
    position:
      x: 1140
      'y': 320
  - id: evaluate
    label: |-
      基于图片与问题执行 VQA
      使用 Textract OCR 文本与边界框
      输出抽取式、多片段或数值答案
    type: process
    size: xl
    position:
      x: 860
      'y': 320
  - id: metric
    label: |-
      主指标 ANLS + 严格准确率
      统一小写 · 多参考取最佳
      归一化编辑相似度阈值 0.5
    type: terminal
    size: xl
    position:
      x: 580
      'y': 320
  - id: human
    label: |-
      测试集人工参考
      志愿者回答全部测试问题
      ANLS 0.980 · 严格准确率 95.70
    type: user
    size: xl
    position:
      x: 1140
      'y': 580
  - id: artifact_boundary
    label: |-
      公开数据与指标边界
      数据与 OCR：DocVQA / RRC
      Amazon Textract OCR 标注
      确定性指标；无生成式裁判
    type: document
    size: xl
    position:
      x: 300
      'y': 320
edges:
  - from: evidence
    to: search
    type: data
  - from: search
    to: phash
    type: primary
  - from: phash
    to: ocr_dedupe
    type: primary
  - from: ocr_dedupe
    to: pool
    type: primary
  - from: pool
    to: workers
    type: primary
  - from: workers
    to: stage1
    type: primary
  - from: stage1
    to: split
    type: primary
  - from: split
    to: stage2
    type: primary
  - from: stage2
    to: types
    type: primary
  - from: types
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
  - from: evaluate
    to: metric
    type: primary
  - from: dataset
    to: human
    type: optional
  - from: human
    to: metric
    type: optional
    waypoints:
      - x: 820
        'y': 630
      - x: 820
        'y': 470
      - x: 680
        'y': 470
  - from: metric
    to: artifact_boundary
    type: data
modules: []
