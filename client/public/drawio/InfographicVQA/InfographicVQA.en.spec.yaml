meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InfographicVQA Build Process
  description: >-
    Paper-aligned InfographicVQA workflow: more than 10,000 web images are deduplicated twice, annotated by a trained
    internal pool in two stages, filtered, split, and evaluated with ANLS and exact accuracy.
  legend: >-
    Solid arrows show collection, deduplication, two-stage annotation, filtering, release, and model scoring. Dashed
    arrows show the human reference evaluation.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Stable Release
      arXiv:2104.12756v2 · WACV 2022
      DocVQA InfographicVQA / RRC
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: search
    label: |-
      Internet Image Search
      Google + Bing Query: “infographics”
      More Than 10,000 Downloads
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: phash
    label: |-
      Perceptual-hash Deduplication
      Remove Nearly 2,000 Duplicate Images
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: ocr_dedupe
    label: |-
      Second Deduplication
      Amazon Textract OCR Tokens
      Jaccard Similarity
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: pool
    label: |-
      Annotation Candidate Pool
      About 7,000 Diverse Infographics
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: workers
    label: |-
      Replace Noisy Crowd Pilot (>40%)
      Internal Tool + 90-minute Webinar + Quiz
      Select 13 Closely Supported Annotators
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: stage1
    label: |-
      Stage 1 Annotation
      Worker May Reject Unsuitable Image
      Create Question + Answer Pairs
      Stop After More Than 30k Questions
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: split
    label: |-
      Random Image-disjoint Splits
      Roughly 80% / 10% / 10%
      Train · Validation · Test
    type: database
    size: xl
    position:
      x: 1980
      'y': 40
  - id: stage2
    label: |-
      Stage 2 on Validation and Test
      Different Worker Answers Independently
      Cannot See the First Answer
      May Flag “Cannot Answer”
    type: user
    size: xl
    position:
      x: 1980
      'y': 320
  - id: types
    label: |-
      Assign QA Types
      Answer Source: 4 Types · Evidence: 5 Types
      Operations: Counting / Sorting / Arithmetic
    type: process
    size: xl
    position:
      x: 1700
      'y': 320
  - id: filter
    label: |-
      Quality and Answer Rules
      Remove 1.9% Cannot-answer Questions
      Keep Unique Lowercase References
      Accept Multi-span Permutations
    type: process
    size: xl
    position:
      x: 1420
      'y': 320
  - id: dataset
    label: |-
      Final InfographicVQA
      30,035 Questions · 5,485 Images
      2,594 Web Domains
      Question Split: 23,946 / 2,801 / 3,288
      Image Split: 4,406 / 500 / 579
    type: database
    size: xl
    position:
      x: 1140
      'y': 320
  - id: evaluate
    label: |-
      Run VQA on Image + Question
      Textract OCR Text and Bounding Boxes
      Extractive, Multi-span, or Numeric Answer
    type: process
    size: xl
    position:
      x: 860
      'y': 320
  - id: metric
    label: |-
      Primary ANLS + Exact Accuracy
      Lowercase · Best of References
      Normalized Edit Similarity Cutoff 0.5
    type: terminal
    size: xl
    position:
      x: 580
      'y': 320
  - id: human
    label: |-
      Human Test-set Reference
      Volunteers Answer Every Test Question
      ANLS 0.980 · Exact Accuracy 95.70
    type: user
    size: xl
    position:
      x: 1140
      'y': 580
  - id: artifact_boundary
    label: |-
      Public Data / Metric Boundary
      Data + OCR via DocVQA / RRC
      Amazon Textract OCR Annotations
      Deterministic Metrics; No Generative Judge
    type: document
    size: xl
    position:
      x: 300
      'y': 320
edges:
  - from: evidence
    to: search
    type: data
  - from: search
    to: phash
    type: primary
  - from: phash
    to: ocr_dedupe
    type: primary
  - from: ocr_dedupe
    to: pool
    type: primary
  - from: pool
    to: workers
    type: primary
  - from: workers
    to: stage1
    type: primary
  - from: stage1
    to: split
    type: primary
  - from: split
    to: stage2
    type: primary
  - from: stage2
    to: types
    type: primary
  - from: types
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
  - from: evaluate
    to: metric
    type: primary
  - from: dataset
    to: human
    type: optional
  - from: human
    to: metric
    type: optional
    waypoints:
      - x: 820
        'y': 630
      - x: 820
        'y': 470
      - x: 680
        'y': 470
  - from: metric
    to: artifact_boundary
    type: data
modules: []
