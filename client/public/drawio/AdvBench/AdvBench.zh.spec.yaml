meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvBench 构建与 GCG 攻击流程
  description: 对齐论文的两类 AdvBench 集合构建流程，以及单题、通用或迁移 GCG 评测流程。
  legend: 论文披露了种子数量与生成器设置。未说明的生成后过滤链只作为无连线注释呈现，不是必经流程阶段。
nodes:
  - id: seed_strings
    label: |-
      有害字符串种子
      人工编写 100 条
    type: database
    size: xl
    position:
      x: 40
      'y': 0
  - id: seed_behaviors
    label: |-
      有害行为种子
      人工编写 50 条
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: five_shot
    label: |-
      构造 5 个示例提示
      从种子中抽取示例
    type: document
    size: xl
    position:
      x: 280
      'y': 100
  - id: generator
    label: |-
      Wizard-Vicuna-30B-Uncensored
      每轮生成 10 条
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: filter_unknown
    label: |-
      论文未披露
      生成后过滤链
      仅作注释 • 无连线
    type: document
    size: xl
    position:
      x: 760
      'y': 260
  - id: release
    label: |-
      发布 AdvBench
      500 字符串 + 500 行为
    type: database
    size: xl
    position:
      x: 1000
      'y': 100
  - id: protocol
    label: |-
      选择攻击协议
      单题 • 通用 • 迁移
    type: process
    size: xl
    position:
      x: 1000
      'y': 440
  - id: aggregate_loss
    label: |-
      汇总目标损失
      跨所选提示与模型
    type: process
    size: xl
    position:
      x: 760
      'y': 440
  - id: gcg
    label: |-
      运行 GCG 搜索
      Top-k 256 • 批量 512
    type: process
    size: xl
    position:
      x: 520
      'y': 440
  - id: run
    label: |-
      运行被测模型
      500 步后保留最佳后缀
    type: process
    size: xl
    position:
      x: 280
      'y': 440
  - id: success_gate
    label: 采用哪条成功判定？
    type: decision
    size: xl
    position:
      x: 40
      'y': 440
  - id: string_score
    label: |-
      字符串成功
      精确目标文本出现
    type: process
    size: xl
    position:
      x: 280
      'y': 680
  - id: behavior_score
    label: |-
      行为成功
      尝试遵从指令
    type: process
    size: xl
    position:
      x: 280
      'y': 880
  - id: asr
    label: |-
      攻击成功率
      单题 • 通用 • 迁移
    type: process
    size: xl
    position:
      x: 520
      'y': 780
  - id: report
    label: |-
      报告鲁棒性
      ASR + 目标损失
    type: terminal
    size: xl
    position:
      x: 760
      'y': 780
edges:
  - from: seed_strings
    to: five_shot
    type: primary
  - from: seed_behaviors
    to: five_shot
    type: primary
  - from: five_shot
    to: generator
    type: primary
  - from: generator
    to: release
    type: primary
  - from: release
    to: protocol
    type: primary
  - from: protocol
    to: aggregate_loss
    type: primary
  - from: aggregate_loss
    to: gcg
    type: primary
  - from: gcg
    to: run
    type: primary
  - from: run
    to: success_gate
    type: primary
  - from: success_gate
    to: string_score
    type: primary
    label: 字符串
  - from: success_gate
    to: behavior_score
    type: primary
    label: 行为
    waypoints:
      - x: 120
        'y': 800
      - x: 120
        'y': 880
  - from: string_score
    to: asr
    type: primary
  - from: behavior_score
    to: asr
    type: primary
  - from: asr
    to: report
    type: primary
modules: []
