    label: |-
      Harmful-String Seeds
      100 written examples
    type: database
    size: xl
    position:
      x: 40
      'y': 0
  - id: seed_behaviors
    label: |-
      Harmful-Behavior Seeds
      50 written examples
    type: database
    size: xl
    position:
      x: 40
      'y': 200
