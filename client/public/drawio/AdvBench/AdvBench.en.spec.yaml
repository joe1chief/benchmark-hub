meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvBench Construction and GCG Evaluation Workflow
  description: >-
    Paper-aligned workflow for constructing the two AdvBench safety-attack settings, optimizing adversarial suffixes
    with Greedy Coordinate Gradient search, and measuring individual, universal, and cross-model attack success.
  legend: >-
    AdvBench contains two separate 500-item sets. Harmful Strings requires exact target-string elicitation; Harmful
    Behaviors asks whether a model attempts to comply rather than refusing. Attack Success Rate is the primary metric.
nodes:
  - id: threat
    label: |-
      Define the Guardrail-Bypass Threat Model
      Test Whether Aligned Models Can Be Induced
      to Produce Content They Normally Refuse
    type: process
    size: xl
    position:
      x: 40
      'y': 200
  - id: setting
    label: Construct Which AdvBench Setting?
    type: decision
    size: xl
    position:
      x: 320
      'y': 200
  - id: strings
    label: |-
      Curate 500 Harmful Strings
      Toxic, Threatening, Misleading, Discriminatory,
      Cybercrime, Dangerous, or Illegal Content
      3-44 LLaMA Tokens • Mean 16
    type: database
    size: xl
    position:
      x: 600
      'y': 20
  - id: behaviors
    label: |-
      Curate 500 Harmful Behaviors
      Formulate the Same Broad Themes as Instructions
      Success Means an Attempt to Comply, Not Refusal
    type: database
    size: xl
    position:
      x: 600
      'y': 380
  - id: objective
    label: |-
      Define the Optimization Target
      String: Exact Target Continuation
      Behavior: Affirmative Prefix Consistent with Compliance
    type: document
    size: xl
    position:
      x: 880
      'y': 200
  - id: suffix
    label: |-
      Initialize a 20-Token Adversarial Suffix
      Attach It to One or Multiple Prompts
      Aggregate Losses across Prompts and Models
    type: process
    size: xl
    position:
      x: 1160
      'y': 200
  - id: gcg
    label: |-
      Run Greedy Coordinate Gradient Search
      Gradient Top-k 256 • Candidate Batch 512
      Replace One Token with the Lowest-Loss Candidate
    type: process
    size: xl
    position:
      x: 1440
      'y': 200
  - id: protocol
    label: |-
      Select the Attack Protocol
      Individual: First 100 Items, One Model
      Universal: 25 Train + 100 Held-Out Behaviors
      Transfer: 25 Behaviors across 2 or 4 Source Models
    type: process
    size: xl
    position:
      x: 1720
      'y': 200
  - id: run
    label: |-
      Keep the Best Suffix after 500 Steps
      Run Victim Models with Their Default Chat Templates
      Evaluate White-Box and Black-Box Transfer
    type: process
    size: xl
    position:
      x: 1720
      'y': 620
  - id: judge
    label: Which Success Rule Applies?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 620
  - id: string_score
    label: |-
      Harmful-String Scoring
      Exact Target String Appears = Success
      Also Record Target Cross-Entropy Loss
    type: process
    size: xl
    position:
      x: 1160
      'y': 460
  - id: behavior_score
    label: |-
      Harmful-Behavior Scoring
      Judge a Reasonable Attempt to Execute the Instruction
      Human Review May Separate Compliance from Refusal
    type: user
    size: xl
    position:
      x: 1160
      'y': 780
  - id: asr
    label: |-
      Compute Attack Success Rate
      Individual ASR • Universal Train/Test ASR
      Transfer ASR on 388 Test Behaviors
    type: process
    size: xl
    position:
      x: 880
      'y': 620
  - id: compare
    label: |-
      Compare Attack Methods and Transfer
      PEZ • GBDA • AutoPrompt • GCG
      Source Models → Open and Proprietary Targets
    type: process
    size: xl
    position:
      x: 600
      'y': 620
  - id: report
    label: |-
      Report Robustness and Universality
      Higher ASR Means More Successful Guardrail Bypass
      Lower Target Loss Is Better for String Elicitation
    type: terminal
    size: xl
    position:
      x: 320
      'y': 620
edges:
  - from: threat
    to: setting
    type: primary
  - from: setting
    to: strings
    type: primary
  - from: setting
    to: behaviors
    type: primary
  - from: strings
    to: objective
    type: primary
  - from: behaviors
    to: objective
    type: primary
  - from: objective
    to: suffix
    type: primary
  - from: suffix
    to: gcg
    type: primary
  - from: gcg
    to: protocol
    type: primary
  - from: protocol
    to: run
    type: primary
  - from: run
    to: judge
    type: primary
  - from: judge
    to: string_score
    type: primary
  - from: judge
    to: behavior_score
    type: primary
  - from: string_score
    to: asr
    type: primary
  - from: behavior_score
    to: asr
    type: primary
  - from: asr
    to: compare
    type: primary
  - from: compare
    to: report
    type: primary
modules: []
