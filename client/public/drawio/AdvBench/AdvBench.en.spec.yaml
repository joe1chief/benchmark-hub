      Build 5-Shot Prompts
      Sample seed examples
    type: document
    size: xl
    position:
      x: 280
      'y': 100
  - id: generator
    label: |-
      Wizard-Vicuna-30B-Uncensored
      Generate 10 items per round
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: filter_unknown
