meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvBench Construction and GCG Attack Process
  description: Paper-aligned construction of the two AdvBench sets followed by individual, universal, or transfer GCG evaluation.
  legend: >-
    The paper discloses seed counts and generator settings. Its unspecified post-generation filter chain is shown only
    as an unconnected annotation, not a required pipeline stage.
nodes:
