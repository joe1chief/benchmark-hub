meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DARE-bench Build and Evaluation Process
  description: >-
    Paper-aligned Kaggle sourcing, task formulation, verifiable-ground-truth construction, sandboxed data-science
    execution, and variant-specific scoring.
  legend: >-
    Read benchmark construction left-to-right, then agent evaluation right-to-left; counts describe the paper's full
    6,300-task benchmark rather than the smaller license-filtered repository release.
nodes:
  - id: sources
    label: |-
      Kaggle Dataset Sourcing
      Open-License Tabular Data via Official API
      Web Descriptions + Column Previews
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: feasibility
    label: |-
      LLM Feasibility Analysis
      Detect Targets, Features, Types, and Frequency
      Keep Well-Posed Predictive Tasks
    type: decision
    size: xl
    position:
      x: 320
      'y': 100
  - id: families
    label: |-
      Six Task Variants
      Classification IF / MM; Regression IF / MM
      Time-Series XF / CF
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: postprocess
    label: |-
      Controlled Post-Processing
      Random Split; Chronological for Time Series
      20% IF Noise + Entity Checks / Resampling
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: ground_truth
    label: |-
      Verifiable Ground Truth
      IF: Sandboxed Reference Code + Fixed Seed
      MM / Time Series: Original Masked Labels
    type: decision
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Paper Benchmark: 6,300 Tasks
      5,948 Train + 352 Evaluation
      Class 2,468 / Regression 1,888 / Time Series 1,944
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: input
    label: |-
      Agent Task Input
      Question + Metadata + Train / Test Files
      Masked Targets + Code Sandbox Tool
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: agent
    label: |-
      Bounded Agent Loop
      Standard Evaluation: 5 Turns
      200 s Sandbox Maximum per Turn
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: execute
    label: |-
      Execute Data-Science Code
      Load / Clean / Fit / Predict
      Emit Row-Aligned Prediction File
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: route
    label: |-
      Variant-Specific Verifier
      IF Uses Simulated Reference Output
      MM / Time Series Use Masked Ground Truth
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: score
    label: |-
      Objective Scoring
      Class / Reg IF: Exact 0 or 1; Class MM: Macro-F1
      Regression + Time Series: Clipped R²; Average Targets
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      DARE-bench Results
      Six Variant Scores + Aggregate
      Reproducible Labels; No Judge Model
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: feasibility
    type: primary
  - from: feasibility
    to: families
    type: primary
  - from: families
    to: postprocess
    type: primary
  - from: postprocess
    to: ground_truth
    type: primary
  - from: ground_truth
    to: release
    type: primary
  - from: release
    to: input
    type: primary
  - from: input
    to: agent
    type: primary
  - from: agent
    to: execute
    type: primary
  - from: execute
    to: route
    type: primary
  - from: route
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
