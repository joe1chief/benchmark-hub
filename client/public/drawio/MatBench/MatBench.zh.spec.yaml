meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MatBench 构建流程
  description: 将原始 MatBench 的 13 项材料属性任务与固定嵌套交叉验证协议，同 Intern-S1 / OpenCompass 使用的四任务生成式 LLM 适配器明确分开，避免混淆两者的指标口径。
  legend: >-
    原始 MatBench 论文（arXiv:2005.00707）定义 13 项任务，报告 MAE 或 ROC-AUC；Intern-S1 的 OpenCompass 适配器选择其中四项，使用 LLM
    抽取/裁判，并转换为归一化综合分。
nodes:
  - id: sources
    label: |-
      汇集 10 个材料数据源
      包含 DFT 与实验数据
      光学、热学、电子与热力学
      拉伸与弹性属性
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: clean
    label: |-
      逐源标准化和清洗
      仅保留材料输入与一个目标值
      删除辅助元数据
      剔除非物理、稀有或无关记录
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: tasks
    label: |-
      定义 13 项 MatBench 任务
      10 项回归 · 3 项分类
      输入为成分或晶体结构
      每项 312–132,752 条样本
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: folds
    label: |-
      固定五个外层折
      随机种子 · 18012019
      80% 训练/验证 · 20% 测试
      分类任务采用分层划分
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: fit
    label: |-
      仅在各训练折内调参
      使用嵌套交叉验证
      在外层训练分区拟合
      预测对应留出测试分区
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: original_metrics
    label: |-
      使用原始任务指标
      回归 · 平均绝对误差
      分类 · ROC-AUC
      对五折结果取平均
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: baselines
    label: |-
      发布可复现参考结果
      Dummy · 随机森林
      Automatminer · CGCNN · MEGNet
      在相同外层折上比较
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 40
  - id: select_four
    label: |-
      Intern-S1 适配器选择 4 项任务
      钢材 · 实验带隙
      实验金属分类 · 玻璃形成
      使用 OpenCompass 任务文件
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: prompt
    label: |-
      构造零样本生成式提示
      插入每道材料问题
      要求模型输出自由文本
      保留数值或类别真值
    type: document
    size: xl
    position:
      x: 860
      'y': 420
  - id: parse
    label: |-
      按目标类型裁判回答
      数值 · 由 LLM 抽取浮点数
      分类 · 由 LLM 判断是否正确
      汇总任务级预测
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: adapter_metrics
    label: |-
      计算适配器任务得分
      数值任务 · MAE
      分类任务 · 准确率
      分别保留四项结果
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: aggregate
    label: |-
      形成 Intern-S1 综合分
      带隙 · (2 − MAE) / 2 × 100
      钢材 · (2000 − MAE) / 2000 × 100
      再合并两项分类准确率
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 420
edges:
  - from: sources
    to: clean
    type: primary
  - from: clean
    to: tasks
    type: primary
  - from: tasks
    to: folds
    type: primary
  - from: folds
    to: fit
    type: primary
  - from: fit
    to: original_metrics
    type: primary
  - from: original_metrics
    to: baselines
    type: primary
  - from: tasks
    to: select_four
    type: secondary
  - from: select_four
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: adapter_metrics
    type: primary
  - from: adapter_metrics
    to: aggregate
    type: primary
modules: []
