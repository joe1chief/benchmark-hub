  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EMMA 构建流程
  description: 固定版本还原 Enhanced MultiModal reAsoning，并分开既有题、RAVEN、专家新建和编程题轨道。
  legend: RAVEN 在过滤后补充数学题；编程题从零独立构建；论文与发布代码评测保持分离。
