meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EMMA 构建流程
  description: 对齐论文：双轨策展真正依赖视觉与文本联合推理的数学、物理、化学和编程任务。
  legend: 实线箭头将严格保留的已有问题与新编问题合并为专家核验基准。若三个 MLLM 中任一模型在仅看文本和图像描述的 10 次尝试中至少答对 5 次，该候选题即被移除。
nodes:
  - id: sources
    label: |-
      汇集已有多模态问题
      MathVista / Math-Vision / RAVEN
      OlympiadBench / EXAMS-V / MMMU
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: caption
    label: |-
      将视觉内容转为文本线索
      用 GPT-4o 描述每张候选图像
      原题文本与图像描述配对
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: filter
    label: |-
      严格视觉推理过滤
      Llama-3-70B · GPT-4o · Qwen2-72B
      各试 10 次；任一模型答对 ≥5 次即删除
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: taxonomy
    label: |-
      建立分学科技能分类体系
      检查保留题并定义细粒度标签
      GPT-4o 分配后由专家核验
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: expansion
    label: |-
      人工搜集 / 编写对齐任务
      物理：在线来源 · 化学：RDKit + 博士生
      编程：高级数据可视化生成
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: merge
    label: |-
      合并并核验双轨数据
      992 道严格过滤的已有问题
      1,796 道新构建问题
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: dataset
    label: |-
      EMMA 基准
      4 个学科共 2,788 题
      2,002 道选择题 · 786 道开放题 · 298 道多图题
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: labels
    label: |-
      附加细粒度技能标签
      领域专家标注或 GPT-4o 后专家核验
      使用简短且可直接核对的标准答案
    type: document
    size: xl
    position:
      x: 1860
      'y': 250
  - id: evaluation
    label: |-
      MLLM 零样本评测
      直接回答与思维链提示
      无需 MLLM 裁判的准确率
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: sources
    to: caption
    type: primary
  - from: caption
    to: filter
    type: primary
  - from: filter
    to: taxonomy
    type: primary
  - from: taxonomy
    to: expansion
    type: primary
  - from: expansion
    to: merge
    type: primary
  - from: merge
    to: dataset
    type: primary
  - from: dataset
    to: labels
    type: primary
  - from: labels
    to: evaluation
    type: primary
modules: []
