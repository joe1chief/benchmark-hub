meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EMMA Build Process
  description: Paper-aligned two-track curation of genuinely multimodal math, physics, chemistry, and coding reasoning tasks.
  legend: >-
    Solid arrows follow EMMA's retained-source and newly-authored tracks into one expert-verified benchmark. A candidate
    is discarded if any of three MLLMs answers it correctly in at least 5 of 10 caption-only trials.
nodes:
  - id: sources
    label: |-
      Gather existing multimodal problems
      MathVista / Math-Vision / RAVEN
      OlympiadBench / EXAMS-V / MMMU
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: caption
    label: |-
      Convert visual content to text cues
      caption every candidate image with GPT-4o
      pair original question text with captions
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: filter
    label: |-
      Strict visual-reasoning filter
      Llama-3-70B · GPT-4o · Qwen2-72B
      10 trials each; discard if any gets ≥5 correct
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: taxonomy
    label: |-
      Build subject-specific skill taxonomies
      inspect retained tasks and define labels
      GPT-4o assignment + expert verification
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: expansion
    label: |-
      Manually source / author aligned tasks
      physics: web sources · chemistry: RDKit + PhDs
      coding: advanced visualization creation
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: merge
    label: |-
      Merge and verify both tracks
      992 rigorously filtered source questions
      1,796 newly constructed questions
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: dataset
    label: |-
      EMMA benchmark
      2,788 questions across 4 subjects
      2,002 MCQ · 786 free-form · 298 multi-image
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: labels
    label: |-
      Attach fine-grained skill labels
      domain experts or GPT-4o then experts
      short checkable ground-truth answers
    type: document
    size: xl
    position:
      x: 1860
      'y': 250
  - id: evaluation
    label: |-
      Zero-shot MLLM evaluation
      direct and Chain-of-Thought prompts
      accuracy without an MLLM judge
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: sources
    to: caption
    type: primary
  - from: caption
    to: filter
    type: primary
  - from: filter
    to: taxonomy
    type: primary
  - from: taxonomy
    to: expansion
    type: primary
  - from: expansion
    to: merge
    type: primary
  - from: merge
    to: dataset
    type: primary
  - from: dataset
    to: labels
    type: primary
  - from: labels
    to: evaluation
    type: primary
modules: []
