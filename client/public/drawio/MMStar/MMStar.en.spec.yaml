meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMStar Build Process
  description: >-
    Paper-aligned MMStar workflow: 22,401 samples from six multimodal benchmarks are screened by eight text-only LLMs,
    stratified by 16 LVLMs, and reviewed by three experts for visual dependence and low leakage; 1,500 balanced samples
    are evaluated with accuracy, multimodal gain, and multimodal leakage.
  legend: Solid arrows show source filtering, difficulty stratification, expert curation, balanced selection, and evaluation.
nodes:
  - id: sources
    label: |-
      Six Source Benchmarks
      MMBench / SEED / MMMU
      ScienceQA / AI2D / MathVista
      22,401 Samples
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: text_probe
    label: |-
      Text-only Coarse Filter
      8 Strong LLMs; No Images
    type: process
    size: large
    position:
      x: 300
      'y': 220
  - id: text_gate
    label: |-
      Keep if LLM Hits ≤2
      22,401 → 11,607
    type: process
    size: large
    position:
      x: 560
      'y': 220
  - id: lvlm_probe
    label: |-
      16 LVLM Probe
      Easy 12–16 / Moderate 8–11
      Hard 4–7 / Tough 0–3 Hits
    type: process
    size: xl
    position:
      x: 820
      'y': 220
  - id: experts
    label: |-
      Three-expert Review
      Visual Dependency
      Minimal Leakage + Advanced Skill
      Capability Coverage
    type: user
    size: xl
    position:
      x: 1080
      'y': 220
  - id: dataset
    label: |-
      MMStar: 1,500 Samples
      6 Capabilities × 250
      Relatively Balanced 18 Axes
    type: database
    size: xl
    position:
      x: 1340
      'y': 220
  - id: image_run
    label: |-
      LVLM + Image
      Score S_v
    type: process
    size: large
    position:
      x: 1600
      'y': 40
  - id: text_run
    label: |-
      Same LVLM without Image
      Score S_wv
    type: process
    size: large
    position:
      x: 1600
      'y': 220
  - id: base_run
    label: |-
      LLM Base before Multimodal Training
      Score S_t
    type: process
    size: xl
    position:
      x: 1600
      'y': 400
  - id: metrics
    label: |-
      Accuracy + MG / ML
      MG = S_v − S_wv
      ML = max(0, S_wv − S_t)
    type: terminal
    size: xl
    position:
      x: 1880
      'y': 220
edges:
  - from: sources
    to: text_probe
    type: primary
  - from: text_probe
    to: text_gate
    type: primary
  - from: text_gate
    to: lvlm_probe
    type: primary
  - from: lvlm_probe
    to: experts
    type: primary
  - from: experts
    to: dataset
    type: primary
  - from: dataset
    to: image_run
    type: primary
  - from: dataset
    to: text_run
    type: primary
  - from: dataset
    to: base_run
    type: data
  - from: image_run
    to: metrics
    type: primary
  - from: text_run
    to: metrics
    type: primary
  - from: base_run
    to: metrics
    type: data
modules: []
