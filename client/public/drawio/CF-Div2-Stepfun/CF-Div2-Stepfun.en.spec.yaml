    Appendix-aligned construction of a fresh 53-problem Codeforces Div.2 benchmark with offline local grading, layered
    test generation, accepted/failed-submission validation, eight-sample evaluation, and competitive ratings.
  legend: >-
    Read the offline test-construction row left-to-right, then the grader validation and model evaluation row
    right-to-left.
