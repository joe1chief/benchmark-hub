meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenRCA 构建与评测流程
  description: 依据论文，将三个AIOps系统的故障经过四阶段流程校准为335个案例，再合成目标驱动查询并严格评判根因要素。
  legend: 案例只有在所有被要求的根因要素均匹配时才正确；论文抽样评测对故障时间采用一分钟容差。
nodes:
  - id: raw
    label: |-
      从AIOps挑战数据开始
      真实软件系统
      故障记录与遥测
      来源嘈杂且异构
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: select
    label: |-
      选择合格系统
      电信数据库
      银行系统
      在线市场系统
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: records
    label: |-
      保留初始故障池
      三个企业软件系统
      1,753条故障记录
      配套遥测数据
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: balance
    label: |-
      平衡数据集规模
      下采样较大系统
      缓解最高百倍差异
      保留412条记录
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: standardize
    label: |-
      标准化数据
      统一名称和模式
      重组遥测格式
      对齐跨系统标签
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: calibrate
    label: |-
      由三名工程师校准
      验证遥测可定位根因
      检查时间组件与原因
      复核每条候选记录
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: filter
    label: |-
      过滤不可用故障
      移除遥测缺失案例
      移除无法识别根因案例
      移除标签证据不一致案例
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: dataset
    label: |-
      形成OpenRCA数据
      335个故障案例
      68.5GB及523M行遥测
      去标识化指标日志追踪
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: goals
    label: |-
      定义七种RCA目标
      取时间组件原因的子集
      要求一个两个或三个要素
      结构化JSON答案
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: spec
    label: |-
      采样查询规格
      选择七种目标之一
      加入系统和30分钟窗口
      多故障时加入故障数量
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: synthesize
    label: |-
      合成自然语言查询
      使用GPT-4等LLM
      把规格转换为请求
      保持选定目标
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: verify
    label: |-
      人工核验查询
      查询与遥测配对
      附加结构化真值
      发布目标驱动任务
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: run
    label: |-
      运行RCA方法
      平衡抽样或Oracle抽样
      或控制器加Python执行器
      依次分析指标追踪日志
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: score
    label: |-
      严格评判根因准确率
      全部目标要素必须匹配
      每案例得一分或零分
      对335个故障取平均
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: raw
    to: select
    type: primary
  - from: select
    to: records
    type: primary
  - from: records
    to: balance
    type: primary
  - from: balance
    to: standardize
    type: primary
  - from: standardize
    to: calibrate
    type: primary
  - from: calibrate
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: goals
    type: primary
  - from: goals
    to: spec
    type: primary
  - from: spec
    to: synthesize
    type: primary
  - from: synthesize
    to: verify
    type: primary
  - from: verify
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
