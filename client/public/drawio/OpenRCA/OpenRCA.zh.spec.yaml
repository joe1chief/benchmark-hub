meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenRCA构建与评测
  description: 依据论文及实现，对齐335个故障案例、七种目标驱动查询、三类执行方法和严格评分。
  legend: 实线表示构建与评测；虚线隔离固定证据、仓库与论文版本、外部遥测访问、混合许可及严格分与部分分的实现边界。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      ICLR PDF 3cd926feb851
      Git c1bd4af7f635/c08d18bd45b1
      评分器 9a1c23513926
      任务规格 113bf4b60731
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: raw
    label: |-
      从AIOps挑战系列开始
      使用真实故障记录与遥测
      模式嘈杂且异构
      包含指标日志和依赖追踪
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: select
    label: |-
      选择合格系统
      电信数据库系统
      银行系统
      在线市场系统
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: records
    label: |-
      保留初始故障池
      来自三个企业软件系统
      共1,753条故障记录
      具有关联遥测证据
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: balance
    label: |-
      平衡数据集规模
      下采样较大的系统
      缓解最高百倍差异
      保留412条记录
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: standardize
    label: |-
      统一名称与模式
      重组遥测格式
      对齐跨系统标签
      准备进入校准的记录
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: calibrate
    label: |-
      由三名工程师校准
      检查每次故障附近遥测
      验证时间组件与原因
      使标签与可观察证据一致
    type: process
    size: xl
    position:
      x: 1220
      'y': 400
  - id: filter
    label: |-
      过滤不可用故障
      移除遥测缺失案例
      移除无法识别根因案例
      移除标签证据不一致案例
    type: process
    size: xl
    position:
      x: 980
      'y': 400
  - id: dataset
    label: |-
      形成OpenRCA数据集
      三个系统共335个故障案例
      68.5GB及523M行遥测
      去标识化指标日志和追踪
    type: database
    size: xl
    position:
      x: 740
      'y': 400
  - id: goals
    label: |-
      定义七种根因目标
      取时间组件原因的全部非空子集
      简单一项中等两项困难三项
      开放式结构化预测
    type: document
    size: xl
    position:
      x: 500
      'y': 400
  - id: spec
    label: |-
      采样查询规格
      选择七种目标之一
      加入系统及30分钟窗口
      多故障时包含故障数量
    type: process
    size: xl
    position:
      x: 260
      'y': 400
  - id: synthesize
    label: |-
      合成自然语言查询
      使用GPT-4等大模型
      把规格转换为请求
      保持所选根因目标
    type: process
    size: xl
    position:
      x: 20
      'y': 400
  - id: verify
    label: |-
      人工核验查询与真值
      把查询与遥测配对
      附加评分点
      每个故障发布一个目标驱动任务
    type: process
    size: xl
    position:
      x: 20
      'y': 800
  - id: query
    label: |-
      提供查询与遥测
      指定30分钟故障窗口
      要求相应根因要素
      采用类JSON结构化答案约定
    type: document
    size: xl
    position:
      x: 260
      'y': 800
  - id: run_gate
    label: |-
      评测方法
      平衡抽样 Oracle RCA智能体
    type: decision
    size: xl
    position:
      x: 500
      'y': 800
  - id: balanced
    label: |-
      平衡抽样
      全部遥测先降采样到一分钟
      仅对各指标文件中的KPI类型
      进行分层随机抽样
      重复三次并报告中位数
    type: process
    size: xl
    position:
      x: 740
      'y': 600
  - id: oracle
    label: |-
      Oracle抽样
      采用工程师识别的黄金指标
      近似抽样方法上界
      仍由大模型分析选中遥测
    type: process
    size: xl
    position:
      x: 740
      'y': 800
  - id: agent
    label: |-
      运行RCA智能体
      控制器规划遥测分析
      执行器编写并运行Python
      迭代分析指标追踪和日志
    type: process
    size: xl
    position:
      x: 740
      'y': 1000
  - id: parse
    label: |-
      解析类JSON预测
      要求包含被请求字段
      允许出现额外字段
      多故障采用排列匹配
    type: process
    size: xl
    position:
      x: 1020
      'y': 800
  - id: element_score
    label: |-
      评判被要求的要素
      组件和原因必须精确匹配
      时间允许正负一分钟误差
      实现还会记录部分得分
    type: process
    size: xl
    position:
      x: 1260
      'y': 800
  - id: strict
    label: |-
      应用论文严格准确率
      所有被要求要素均匹配才正确
      报告代码只统计得分等于1.0
      任一缺失或错误都会判错
    type: process
    size: xl
    position:
      x: 1260
      'y': 1080
  - id: report
    label: |-
      按难度和方法报告准确率
      分为简单中等困难目标组
      平均统计严格正确案例
      论文最佳RCA智能体结果为11.34%
    type: terminal
    size: xl
    position:
      x: 1020
      'y': 1080
  - id: version_boundary
    label: |-
      版本快照边界
      论文固定为ICLR 2025官方资产
      仓库HEAD固定为c1bd4af7f635
      GitHub没有带标签的发布版本
    type: document
    size: xl
    position:
      x: 740
      'y': 1160
  - id: access_boundary
    label: |-
      数据访问边界
      Git仓库中的dataset目录为空
      68.5GB遥测通过Google Drive链接
      本次未重新下载或复算行数
    type: document
    size: xl
    position:
      x: 500
      'y': 560
  - id: license_boundary
    label: |-
      开放性与许可边界
      仓库代码采用MIT许可
      遥测来源采用CC BY-NC 4.0
      论文称衍生物按相同条款分享
    type: document
    size: xl
    position:
      x: 260
      'y': 560
  - id: implementation_boundary
    label: |-
      指标实现边界
      评分器计算要素级部分比例
      官方严格报告筛选得分等于1.0
      部分诊断分须与主指标分开
    type: document
    size: xl
    position:
      x: 1260
      'y': 1360
