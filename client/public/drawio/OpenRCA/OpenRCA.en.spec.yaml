meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenRCA Build and Evaluation Process
  description: >-
    Paper-aligned four-stage construction of 335 calibrated failure cases from three AIOps systems, followed by
    goal-driven query synthesis and strict root-cause scoring.
  legend: >-
    A correct case must match every requested root-cause element. Time predictions receive a one-minute tolerance under
    the paper sampling evaluation.
nodes:
  - id: raw
    label: |-
      Start from AIOps Challenge Data
      Real-world Software Systems
      Failure Records plus Telemetry
      Noisy Heterogeneous Sources
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: select
    label: |-
      Select Qualified Systems
      Telecom Database
      Banking System
      Online Market System
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: records
    label: |-
      Retain Initial Failure Pool
      Three Enterprise Systems
      1,753 Failure Records
      Associated Telemetry
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: balance
    label: |-
      Balance Dataset Sizes
      Downsample Larger Systems
      Reduce Up to Hundred-fold Skew
      Keep 412 Records
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: standardize
    label: |-
      Standardize Data
      Unify Names and Schemas
      Reorganize Telemetry Formats
      Align Labels across Systems
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: calibrate
    label: |-
      Calibrate with Three Engineers
      Verify Root Cause from Telemetry
      Check Time Component and Reason
      Review Every Candidate Record
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: filter
    label: |-
      Filter Unusable Failures
      Remove Missing Telemetry
      Remove Unidentifiable Causes
      Remove Label-evidence Mismatches
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: dataset
    label: |-
      Finalize OpenRCA Data
      335 Failure Cases
      68.5 GB and 523M Telemetry Lines
      De-identified Metrics Logs Traces
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: goals
    label: |-
      Define Seven RCA Goals
      Use Subsets of Time Component Reason
      One Two or Three Required Elements
      Structured JSON Answers
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: spec
    label: |-
      Sample a Query Specification
      Choose One of Seven Goals
      Add System and Thirty-minute Window
      Include Failure Count When Multiple
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: synthesize
    label: |-
      Synthesize Natural-language Query
      Use an LLM such as GPT-4
      Convert the Specification to a Request
      Preserve the Selected Goal
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: verify
    label: |-
      Human-verify the Query
      Pair Query with Telemetry
      Attach Structured Ground Truth
      Release Goal-driven Task
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: run
    label: |-
      Run RCA Methods
      Balanced or Oracle Sampling
      Or Controller plus Python Executor
      Reason over Metric Trace and Log
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: score
    label: |-
      Score Strict Root-cause Accuracy
      All Requested Elements Must Match
      One Point or Zero Points per Case
      Average over 335 Failures
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: raw
    to: select
    type: primary
  - from: select
    to: records
    type: primary
  - from: records
    to: balance
    type: primary
  - from: balance
    to: standardize
    type: primary
  - from: standardize
    to: calibrate
    type: primary
  - from: calibrate
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: goals
    type: primary
  - from: goals
    to: spec
    type: primary
  - from: spec
    to: synthesize
    type: primary
  - from: synthesize
    to: verify
    type: primary
  - from: verify
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
