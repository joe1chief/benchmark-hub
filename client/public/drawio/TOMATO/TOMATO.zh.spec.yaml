meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TOMATO 构建与评测流程
  description: >-
    TOMATO先形式化三条视觉时间推理原则：多帧增益、帧序敏感性和帧信息差异。四名标注者进行试标，每人提出任务类型并为每类编写20组问答，再用GPT-4o检查三项原则指标，最终确定旋转、方向、速度与频率、形状与趋势、视觉线索和动作计数六类任务。人工收集171段Creative
    Commons YouTube源视频，通过倒放、拼接、变速或镜像编辑成398段反事实视频；再加入Music-AVQA、CLEVRER、TGIF-QA与Perception
    Test的214段视频，并自录或模拟生成805段基准专用视频。标注者编写并核验多选题，最终在1417段视频上形成1484题，覆盖人类中心、真实物体中心和模拟三类场景。评测通常采样16帧并精确解析选项，按六任务及总体报告准确率；同时比较单帧、乱序帧和人工挑选单帧条件，计算三项时间诊断指标，并分别报告人类看视频与看帧基线。
  legend: >-
    来源：TOMATO ICLR 2025 paper Sections 3-6 and Appendix G; official yale-nlp/TOMATO repository and
    dataset。实线箭头表示论文或官方资料明确支持的主流程。
