meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PathVQA Build and Evaluation Process
  description: >-
    Paper-aligned pathology image extraction, caption parsing, rule-based QA generation, manual proofreading,
    image-level splitting, and type-specific evaluation for PathVQA.
  legend: >-
    The paper's detailed statistics distinguish 16,465 open-ended questions from 16,334 balanced yes or no questions,
    despite the abstract's broader use of open-ended.
nodes:
  - id: step_1
    label: |-
      Collect Public Pathology Sources
      Textbook of Pathology
      Basic Pathology
      PEIR digital library
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Extract Textbook Assets
      PyPDF2 reads image XObjects
      PDFMiner reads text and location
      Preserve page coordinates
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Match Images and Captions
      Find Fig or Figure with regex
      Order items by page location
      Pair images and captions by order
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Crawl PEIR Image Pairs
      Requests downloads pages and images
      Beautiful Soup reads target tags
      Save captions with local files
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Clean Extracted Pairs
      Remove flowcharts and portraits
      Keep pathology images only
      Correct caption mismatches
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Parse Captions with CoreNLP
      Sentence split and tokenization
      POS and named entities
      Constituency and dependencies
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Simplify Long Sentences
      Rearrange subjects verbs and clauses
      Use syntactic transformation rules
      Avoid unsuitable adverbial clauses
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Generate Open Questions
      Tregex transforms captions
      What · where · when · whose · how
      How much or how many
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Generate Balanced Yes or No
      Invert subject and auxiliary
      Replace heads with same-POS phrases
      Produce 8,145 yes and 8,189 no
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Manually Proofread Every QA
      Fix spelling syntax and semantics
      Remove vague or short questions
      Strip extra symbols and articles
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Finalize PathVQA
      4,998 images · 32,799 QAs
      1,670 textbook · 3,328 PEIR
      Seven question categories
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Split by Image
      Train 2,499 images · 17,325 QAs
      Validation 1,499 · 9,462
      Test 1,000 · 6,012
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Run Pathology VQA Models
      Input one image and question
      Predict yes or no or free text
      Compare with reference answer
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Report Type-specific Metrics
      Yes or no Accuracy
      Open Exact Match and macro F1
      BLEU-1 · BLEU-2 · BLEU-3
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
