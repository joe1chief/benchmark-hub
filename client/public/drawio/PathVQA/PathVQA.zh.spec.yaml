  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PathVQA 构建与评测流程
  description: 对齐论文的病理图像提取、图注解析、规则问答生成、人工校对、图像级划分与分类评测流程。
  legend: 论文详细统计区分16465个开放式问题和16334个平衡的是非问题，避免沿用摘要对开放式问题的宽泛表述。
nodes:
