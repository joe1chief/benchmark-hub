meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PathVQA 构建与评测流程
  description: 按论文v1重构病理来源收集、图文抽取、语言学问题生成、逐题人工校对、图像级划分与分类评测流程， 并明确保留后续论文与发布版本的计数差异。
  legend: 实线表示论文披露的构建或评测阶段；虚线表示固定证据、发布计数差异、提示词可用性与版权边界， 不代表额外的基准步骤。
nodes:
  - id: source_evidence
    label: |-
      固定论文证据
      arXiv 2003.10286v1
      PDF cbfe071a8d80
      ACL 2021 · PDF 9760f1711cdb
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: clinical_gap
    label: |-
      解决医疗数据缺口
      公开病理图像稀缺
      病理学家缺少标注时间
      改用教材与数字图书馆
    type: document
    size: xl
    position:
      x: 280
      'y': 40
  - id: textbook_sources
    label: |-
      选择公开教材来源
      Textbook of Pathology
      Basic Pathology
      使用在线PDF版本
    type: database
    size: xl
    position:
      x: 540
      'y': 40
  - id: pdf_extract
    label: |-
      抽取PDF图像与文本
      PyPDF2读取图像XObject
      PDFMiner读取文本与位置
      保留页面坐标
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: caption_match
    label: |-
      匹配教材图注
      用正则查找Fig或Figure
      按页面位置排序
      依次配对图像与图注
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: peir_source
    label: |-
      选择在线图书馆
      病理教育信息资源库
      PEIR公开数字图书馆
      使用图像页面与图注
    type: database
    size: xl
    position:
      x: 540
      'y': 320
  - id: peir_crawl
    label: |-
      抓取PEIR图文对
      Requests下载页面与图像
      Beautiful Soup解析目标HTML标签
      图注随本地图像保存
    type: process
    size: xl
    position:
      x: 800
      'y': 320
  - id: clean_pairs
    label: |-
      清洗图像图注对
      移除非病理图像
      排除流程图与肖像
      修正图注错配
    type: process
    size: xl
    position:
      x: 1060
      'y': 320
  - id: corenlp
    label: |-
      使用CoreNLP解析图注
      分句与分词
      标注词性与命名实体
      生成成分与依存分析
    type: process
    size: xl
    position:
      x: 1320
      'y': 320
  - id: simplify
    label: |-
      简化长句
      重排主语、动词与从句
      应用论文引用的句法规则
      生成更短的陈述句
    type: process
    size: xl
    position:
      x: 1580
      'y': 320
  - id: question_transducer
    label: |-
      应用Tregex转换器
      按规则查询成分树
      分解主要动词
      执行主语与助动词倒装
    type: process
    size: xl
    position:
      x: 1840
      'y': 320
  - id: yesno_generation
    label: |-
      生成肯定问题
      倒装主语与助动词
      保留图注原命题
      原始答案对应yes
    type: process
    size: xl
    position:
      x: 2100
      'y': 120
  - id: negative_generation
    label: |-
      生成平衡的否定问题
      采样相同词性的短语
      从其他图注取替换项
      替换原问题中心词
    type: process
    size: xl
    position:
      x: 2360
      'y': 120
  - id: open_generation
    label: |-
      生成开放式问题
      what · where · when · whose · how
      how much或how many
      移除目标答案短语
    type: process
    size: xl
    position:
      x: 2100
      'y': 520
  - id: merge_qa
    label: |-
      合并生成的问答对
      汇总开放式与是非分支
      保留抽取出的答案短语
      每条数据绑定对应图像
    type: database
    size: xl
    position:
      x: 2360
      'y': 320
  - id: manual_review
    label: |-
      逐题人工校对
      修正拼写、句法与语义
      删除含糊或过短问题
      清理符号、空格与答案冠词
    type: process
    size: xl
    position:
      x: 2620
      'y': 320
  - id: paper_scope
    label: |-
      形成arXiv v1数据集
      4,998张图像 · 32,799个问答
      教材1,670张 · PEIR 3,328张
      开放题16,465 · 是非题16,334
    type: database
    size: xl
    position:
      x: 2880
      'y': 320
  - id: paper_split
    label: |-
      按图像随机划分
      比例0.5 · 0.3 · 0.2
      训练2,499图 · 17,325问答
      验证1,499 · 9,462 · 测试1,000 · 6,012
    type: database
    size: xl
    position:
      x: 3140
      'y': 320
  - id: vqa_models
    label: |-
      运行论文VQA基线
      输入一张图像与一个问题
      生成yes、no或自由文本
      与参考答案比较
    type: process
    size: xl
    position:
      x: 3400
      'y': 320
  - id: metric_gate
    label: |-
      判断问题类型
      二元yes或no
      开放式自由回答
      使用论文分类指标
    type: decision
    size: xl
    position:
      x: 3660
      'y': 320
  - id: binary_metrics
    label: |-
      评测二元问题
      使用精确yes或no准确率
      报告答对百分比
      与开放题分开统计
    type: process
    size: xl
    position:
      x: 3920
      'y': 120
  - id: open_metrics
    label: |-
      评测开放式答案
      精确匹配 · 宏平均F1
      BLEU-1 · BLEU-2 · BLEU-3
      比较词项与n元组
    type: process
    size: xl
    position:
      x: 3920
      'y': 520
  - id: report
    label: |-
      报告PathVQA结果
      分别保留二元与开放题指标
      保留官方图像级划分
      比较论文披露的VQA基线
    type: terminal
    size: xl
    position:
      x: 4180
      'y': 320
  - id: release_boundary
    label: |-
      论文计数边界
      arXiv v1记载32,799个问答
      ACL 2021记载32,795个
      两个版本不可互相替换
    type: document
    size: xl
    position:
      x: 2880
      'y': 760
  - id: mirror_boundary
    label: |-
      更新发布与镜像边界
      作者更新117e7f4ef88a：5,004 · 32,795
      镜像保留32,632问答与4,289图像
      HF 168583288333为社区镜像
    type: document
    size: xl
    position:
      x: 3140
      'y': 760
  - id: prompt_boundary
    label: |-
      评测复现边界
      未披露官方推理提示词
      未披露答案解析器或大模型裁判
      不猜测生成配置
    type: document
    size: xl
    position:
      x: 3400
      'y': 760
  - id: copyright_boundary
    label: |-
      许可与版权边界
      数据仓库声明MIT许可
      图像与图注版权仍归出版方
      作者与PEIR保留来源权利
    type: document
    size: xl
    position:
      x: 1060
      'y': 760
