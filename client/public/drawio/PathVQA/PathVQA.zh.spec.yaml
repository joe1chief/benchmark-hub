    label: |-
      收集公开病理学来源
      Textbook of Pathology
      Basic Pathology
      PEIR数字图书馆
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      提取教科书素材
      PyPDF2读取图像XObject
      PDFMiner读取文本与位置
      保留页面坐标
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      匹配图像与图注
      正则查找Fig或Figure
      按页面位置排序
      依序配对图像与图注
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      抓取PEIR图文对
      Requests下载页面与图像
      Beautiful Soup读取目标标签
      将图注与本地图像共同保存
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      清洗提取图文对
      移除流程图与人物肖像
      仅保留病理图像
      修正图像图注错配
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      用CoreNLP解析图注
      分句与分词
      词性与命名实体
      成分与依存句法
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      简化长句
      重排主语动词与从句
      使用句法转换规则
      避免不适合的状语从句
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      生成开放式问题
      Tregex转换图注
      what · where · when · whose · how
      how much或how many
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      生成平衡是非问题
      执行主语助动词倒装
      用同词性短语替换中心词
      形成8145个是与8189个否
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      人工校对每组问答
      修正拼写句法与语义
      移除含糊或过短问题
      清理多余符号与冠词
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      定稿PathVQA
      4998张图像 · 32799组问答
      教科书1670 · PEIR 3328
      共七类问题
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      按图像划分数据
      训练2499图 · 17325问答
      验证1499图 · 9462问答
      测试1000图 · 6012问答
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      运行病理视觉问答模型
      输入一张图像与问题
      预测是非或自由文本
      与参考答案比较
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      按类型报告指标
      是非题Accuracy
      开放题Exact Match与宏F1
      BLEU-1 · BLEU-2 · BLEU-3
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
