  title: RE-Bench Build and Evaluation Process
  description: >-
    Paper-aligned workflow for designing seven realistic open-ended machine-learning research engineering environments,
    baselining them with human experts, and comparing time-bounded AI agents.
  legend: >-
    RE-Bench v1 contains seven hand-crafted environments. Each has instructions, a scoring function, a starting
    solution, and a reference solution. The paper compares agent runs with 71 eight-hour attempts by 61 human experts.
