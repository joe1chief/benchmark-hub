meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RE-Bench 构建与评测流程
  description: >-
    基于固定来源重建 RE-Bench 环境创建、人类与智能体运行、单次运行分数选择、归一化，
    以及七个开放式 AI 研发环境上的 best-of-k 聚合。
  legend: >-
    实线表示论文披露的构建与评测；虚线表示固定证据、官方发布、MIT 许可和非约束性防污染请求边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2411.15114v2
      PDF 9d25c5ea6abf
      官方仓库 93b98062e55f
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: design_goals
    label: |-
      确定评测设计目标
      可行性 · 生态有效性
      抗饱和能力
      人类与智能体直接比较
    type: document
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: idea_sources
    label: |-
      产生环境设想
      与机器学习从业者讨论
      阅读相关文献
      METR 既往工作经验
    type: process
    size: xl
    position: { x: 500, y: 300 }
    style: { fontSize: 9 }
  - id: specification
    label: |-
      规格阶段
      撰写任务说明
      提出评分函数
      提出起始解
    type: document
    size: xl
    position: { x: 740, y: 300 }
  - id: spec_review
    label: |-
      评审并返工规格
      覆盖关键 AI 研发挑战
      人类可进步且上限足够高
      实现成本可接受
    type: process
    size: xl
    position: { x: 980, y: 300 }
    style: { fontSize: 9 }
  - id: implementation
    label: |-
      实现阶段
      构建完整评测环境
      加入内部高分参考解
      按要求持续返工
    type: process
    size: xl
    position: { x: 1220, y: 300 }
    style: { fontSize: 9 }
  - id: human_trials
    label: |-
      基线测试阶段
      组织人类专家试跑
      观察进展与上限
      识别实际运行问题
    type: user
    size: xl
    position: { x: 1460, y: 300 }
  - id: baseline_review
    label: |-
      重新评估环境
      保留 · 修订 · 丢弃
      经常进行显著调整
    type: process
    size: xl
    position: { x: 1700, y: 300 }
  - id: revision_loop
    label: |-
      未满足要求
      返回规格阶段
      开始下一轮修订
    type: process
    size: xl
    position: { x: 1460, y: 760 }
  - id: discarded
    label: |-
      丢弃失败候选
      超过 12 份规格
      超过 5 个完整实现
    type: terminal
    size: xl
    position: { x: 1700, y: 980 }
  - id: paper_suite
    label: |-
      RE-Bench V1 · 七个环境
      LLM Foundry · Triton 内核 · 嵌入修复
      Scaling Law · 受限架构 MLM
      GPT-2 问答 · Rust 编程题
      开放式机器学习研发任务
    type: database
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: environment_contract
    label: |-
      封装每个环境
      指令 + 资源 + 评分函数
      可见但较弱的起始解
      隐藏的高分参考解
    type: document
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: actor_gate
    label: |-
      在可比条件下运行
      采用墙钟时间预算
      每个环境最多使用 6 张 H100
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: human_runs
    label: |-
      人类专家基线
      71 次八小时尝试
      共 61 名不同专家
      使用相同环境条件
    type: user
    size: xl
    position: { x: 2660, y: 80 }
  - id: agent_runs
    label: |-
      AI 智能体尝试
      改变智能体设计与预算
      使用相同任务接口
    type: process
    size: xl
    position: { x: 2660, y: 520 }
  - id: task_work
    label: |-
      迭代完成开放式任务
      编辑文件 · 运行代码 · 实验
      运行过程中调用评分函数
      将分数与时间写入日志
    type: process
    size: xl
    position: { x: 2900, y: 300 }
    style: { fontSize: 9 }
  - id: score_gate
    label: |-
      选择单次运行原始分数
      常规环境与
      Scaling Law 环境分流
    type: process
    size: xl
    position: { x: 3140, y: 300 }
  - id: highest_log
    label: |-
      六个常规环境
      取运行结束前日志中
      记录的最高分
    type: process
    size: xl
    position: { x: 3380, y: 80 }
  - id: scaling_final
    label: |-
      Scaling Law 环境
      智能体无法看到所得分数
      仅最终提交计分
    type: process
    size: xl
    position: { x: 3380, y: 520 }
  - id: normalize
    label: |-
      对每个任务线性归一化
      原始 y · 起始 ys · 参考 yr
      yn = (y - ys) / (yr - ys)
      起始解 = 0 · 参考解 = 1
    type: process
    size: xl
    position: { x: 3620, y: 300 }
  - id: floor_score
    label: |-
      应用分数边界
      差于起始解时置为 0
      允许分数大于 1
    type: process
    size: xl
    position: { x: 4100, y: 300 }
  - id: normalized_score
    label: |-
      单次运行归一化分数
      可在七个环境之间
      进行比较
    type: database
    size: xl
    position: { x: 4340, y: 300 }
  - id: best_of_k
    label: |-
      构造 score@k 样本
      每个环境内对运行结果
      有放回抽取 k 次
    type: process
    size: xl
    position: { x: 4580, y: 300 }
  - id: selection_gate
    label: |-
      聚合抽取的 k 次运行
      分数可见任务与
      分数隐藏的 Scaling Law 分流
    type: process
    size: xl
    position: { x: 4820, y: 300 }
  - id: max_select
    label: |-
      常规环境
      从 k 次抽样运行中
      选择最高分
    type: process
    size: xl
    position: { x: 5060, y: 80 }
  - id: random_select
    label: |-
      Scaling Law 环境
      分数不可观察
      随机选择一次抽样运行
    type: process
    size: xl
    position: { x: 5060, y: 520 }
  - id: score_report
    label: |-
      报告 score@k
      对七个环境的归一化分数
      取平均
      比较人类与智能体
    type: terminal
    size: xl
    position: { x: 5300, y: 300 }
    style: { fontSize: 9 }
  - id: release_snapshot
    label: |-
      固定官方发布快照
      提交 93b98062e55f
      七个任务族
      suite_manifest 0f6205a46c61
    type: document
    size: xl
    position: { x: 1940, y: 1080 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      许可边界
      仓库使用 MIT
      LICENSE 0651c2b4111f
    type: document
    size: xl
    position: { x: 2180, y: 1320 }
    style: { fontSize: 9 }
  - id: contamination_boundary
    label: |-
      非约束性发布请求
      避免进入模型训练数据
      避免发布未保护的解答
      与 MIT 许可条款分开
    type: document
    size: xl
    position: { x: 1940, y: 1560 }
    style: { fontSize: 9 }
edges:
  - { from: source_evidence, to: design_goals, type: secondary, style: { dashed: true } }
  - { from: design_goals, to: idea_sources, type: primary }
  - { from: idea_sources, to: specification, type: primary }
  - { from: specification, to: spec_review, type: primary }
  - { from: spec_review, to: implementation, type: primary }
  - { from: implementation, to: human_trials, type: primary }
  - { from: human_trials, to: baseline_review, type: primary }
  - { from: baseline_review, to: paper_suite, type: primary }
  - { from: spec_review, to: revision_loop, type: primary }
  - { from: baseline_review, to: revision_loop, type: primary }
  - from: revision_loop
    to: specification
    type: primary
    style: { exitX: 0.5, exitY: 0, entryX: 0.5, entryY: 1 }
  - { from: spec_review, to: discarded, type: primary }
  - { from: baseline_review, to: discarded, type: primary }
  - { from: paper_suite, to: environment_contract, type: primary }
  - { from: environment_contract, to: actor_gate, type: primary }
  - { from: actor_gate, to: human_runs, type: primary }
  - { from: actor_gate, to: agent_runs, type: primary }
  - { from: human_runs, to: task_work, type: primary }
  - { from: agent_runs, to: task_work, type: primary }
  - { from: task_work, to: score_gate, type: primary }
  - { from: score_gate, to: highest_log, type: primary }
  - { from: score_gate, to: scaling_final, type: primary }
  - { from: highest_log, to: normalize, type: primary }
  - { from: scaling_final, to: normalize, type: primary }
  - { from: normalize, to: floor_score, type: primary }
  - { from: floor_score, to: normalized_score, type: primary }
  - { from: normalized_score, to: best_of_k, type: primary }
  - { from: best_of_k, to: selection_gate, type: primary }
  - { from: selection_gate, to: max_select, type: primary }
  - { from: selection_gate, to: random_select, type: primary }
  - { from: max_select, to: score_report, type: primary }
  - { from: random_select, to: score_report, type: primary }
  - { from: paper_suite, to: release_snapshot, type: secondary, style: { dashed: true } }
  - { from: release_snapshot, to: license_boundary, type: secondary, style: { dashed: true } }
  - { from: release_snapshot, to: contamination_boundary, type: secondary, style: { dashed: true } }
modules: []
