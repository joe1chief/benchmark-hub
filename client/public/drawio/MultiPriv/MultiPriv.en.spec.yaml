meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiPriv Build and Evaluation Process
  description: >-
    Paper-v3 construction of attribute-level privacy perception data and fully synthetic identity-linked profiles,
    followed by nine bilingual PPR tasks, output-aware verification, hierarchical risk metrics, and explicit
    partial-release boundaries.
  legend: >-
    The paper reports 1,119 images, 7,414 manually designed bilingual VQA pairs, 36 attributes, and 40 profiles. Solid
    arrows are the disclosed workflow; dashed arrows expose upstream-rights or official-snapshot availability
    boundaries.
nodes:
  - id: goal
    label: |-
      Define Visual and Cross-modal Privacy Risk
      Attribute Perception plus Identity Linkage
      Reconstruct Individual-level Profiles
      Text-only Leakage Is Out of Scope
    type: document
    size: xl
    position:
      x: 20
      'y': 270
  - id: taxonomy
    label: |-
      Define the Privacy Taxonomy
      Grounded in GDPR and CCPA
      Seven Categories · 36 Attributes
      Exclude Ambiguous or Poorly Defined Types
    type: process
    size: xl
    position:
      x: 260
      'y': 270
  - id: attribute_sources
    label: |-
      Assemble Attribute-level Evidence
      Filter Public Sources
      Augment with Synthesized Instances
      Cover Seven Categories in 1,119 Images
    type: database
    size: xl
    position:
      x: 500
      'y': 60
  - id: profile_seed
    label: |-
      Create 40 Fully Synthetic Individuals
      Build a Complete Textual Profile
      Identity · Finance · Health · Travel
      Store Detailed Profile in JSON
    type: process
    size: xl
    position:
      x: 500
      'y': 450
  - id: attribute_synthesis
    label: |-
      Synthesize Attribute-level Additions
      About 18% Generated with Doubao
      2% Fingerprints · 11% Identity Cards
      5% Medical · 2% Shopping Records
    type: process
    size: xl
    position:
      x: 740
      'y': 60
  - id: source_rights
    label: |-
      Mixed Upstream Rights Boundary
      CC and Apache plus No License
      All Rights Reserved and Custom Non-commercial
      Some Attribute Images Are Link-only
    type: document
    size: xl
    position:
      x: 740
      'y': 260
  - id: profile_links
    label: |-
      Establish Stable Attribute Links
      Match Reports and Licences to ID Records
      Align Relationships and Addresses
      Preserve Cross-record Identity Consistency
    type: process
    size: xl
    position:
      x: 740
      'y': 450
  - id: perception_tasks
    label: |-
      Design Four Perception Tasks
      Direct Identifier · Indirect Identifier
      Privacy Information Extraction
      Privacy Region Localization
    type: process
    size: xl
    position:
      x: 980
      'y': 60
  - id: profile_media
    label: |-
      Generate Individual-level Media
      Ten Images per Individual plus Profile JSON
      Photographs · Fingerprints · Records
      Doubao and Photoshop under Fixed Links
    type: process
    size: xl
    position:
      x: 980
      'y': 450
  - id: reasoning_tasks
    label: |-
      Design Five Reasoning Tasks
      Single-step Cross-validation · Single-step Reasoning
      Chained Reasoning · Re-identification and Linkability
      Cross-modal Association
    type: process
    size: xl
    position:
      x: 1220
      'y': 450
  - id: chained_guideline
    label: |-
      Author Chained-reasoning Items
      Define Multi-source Question
      Specify Verifiable Expected Steps
      Execute, Verify, then Assess Difficulty and Coverage
    type: user
    size: xl
    position:
      x: 1460
      'y': 560
  - id: benchmark
    label: |-
      Assemble the Bilingual Benchmark
      1,119 Images · 7,414 Manually Designed VQA Pairs
      40 Synthetic Profiles · Nine Tasks
      Chinese and English
    type: database
    size: xl
    position:
      x: 1700
      'y': 250
  - id: release_gap
    label: |-
      Official Snapshot Boundary
      GitHub 3fc53f39 · HF a364b842
      CC BY-NC-SA 4.0 · Update Pending
      30 Profiles · 663 Images · VQA and Evaluator Absent
    type: document
    size: xl
    position:
      x: 1700
      'y': 620
  - id: verification_gate
    label: |-
      Select Verification Path
      Absolute Ground Truth?
      Semantic Judgment?
    type: decision
    size: xl
    position:
      x: 2180
      'y': 250
  - id: deterministic
    label: |-
      Verify 93% of Evaluated Samples
      Deterministic Rule Matching
      Compare Output with Absolute Ground Truth
      Clear and Unambiguous Correct Answer
    type: process
    size: xl
    position:
      x: 2420
      'y': 80
  - id: hybrid
    label: |-
      Verify the Remaining 7%
      Qwen2.5-72B-Instruct then Human Review
      Cohen Kappa: 0.96 · 0.92 · 0.84
      Semantic and Intermediate-step Cases
    type: process
    size: xl
    position:
      x: 2420
      'y': 430
  - id: evaluate
    label: |-
      Evaluate More than 50 VLMs
      Original Prompts · No Explicit CoT
      Temperature 0
      Commercial and Open-source Models
    type: process
    size: xl
    position:
      x: 1940
      'y': 250
  - id: metrics
    label: |-
      Compute Hierarchical Risk Metrics
      F1 · IEA Exact Match · mIoU
      Accuracy · Completion Percentage
      Higher Scores Mean Greater Privacy Risk
    type: formula
    size: xl
    position:
      x: 2660
      'y': 100
  - id: refusal
    label: |-
      Separate Capability from Refusal
      Incorrect and Refusal Are Task Failures
      Not Successful Privacy Extraction
      Report Refusal Rates Separately
    type: document
    size: xl
    position:
      x: 2660
      'y': 420
  - id: report
    label: |-
      Report PPR Privacy-risk Profiles
      Perception and Reasoning Scores
      Chinese · English · Task · Attribute Breakdowns
      Overall and Answered-only Accuracy
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 260
