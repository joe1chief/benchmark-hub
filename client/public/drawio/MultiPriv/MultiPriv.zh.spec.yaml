    type: primary
  - from: profile_seed
    to: profile_links
    type: primary
  - from: profile_links
    to: synthetic_media
    type: primary
  - from: attribute_images
    to: perception_tasks
    type: primary
  - from: synthetic_media
    to: reasoning_tasks
    type: primary
  - from: perception_tasks
    to: release
    type: primary
  - from: reasoning_tasks
    to: release
    type: primary
  - from: release
    to: verification
    type: primary
  - from: verification
    to: evaluate
    type: primary
  - from: evaluate
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
