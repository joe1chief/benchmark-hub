meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiPriv 构建与评测流程
  description: 展示论文 v3 的属性级隐私感知数据与全合成身份关联档案构建，随后进入九项双语 PPR 任务、按输出类型核验、分层风险指标和公开快照边界。
  legend: 论文报告 1,119 张图像、7,414 条人工设计双语 VQA、36 个属性和 40 个档案。实线为论文披露流程， 虚线为上游权利或官方快照可用性边界。
nodes:
  - id: goal
    label: |-
      定义视觉与跨模态隐私风险
      属性感知加身份关联
      重建个体级隐私档案
      纯文本泄露不在范围内
    type: document
    size: xl
    position:
      x: 20
      'y': 270
  - id: taxonomy
    label: |-
      定义隐私分类体系
      依据 GDPR 与 CCPA
      七类 · 36 个属性
      排除含糊或定义不清的类型
    type: process
    size: xl
    position:
      x: 260
      'y': 270
  - id: attribute_sources
    label: |-
      汇集属性级证据
      筛选公开来源
      用合成实例扩充
      1,119 张图像覆盖七类属性
    type: database
    size: xl
    position:
      x: 500
      'y': 60
  - id: profile_seed
    label: |-
      创建 40 个全合成个体
      构建完整文本档案
      身份 · 财务 · 健康 · 出行
      详细档案保存为 JSON
    type: process
    size: xl
    position:
      x: 500
      'y': 450
  - id: attribute_synthesis
    label: |-
      合成属性级补充数据
      约 18% 由豆包生成
      指纹 2% · 身份证 11%
      医疗记录 5% · 购物记录 2%
    type: process
    size: xl
    position:
      x: 740
      'y': 60
  - id: source_rights
    label: |-
      上游权利混合边界
      含知识共享与 Apache，也有未声明许可
      另含保留全部权利与自定义非商业条款
      部分属性图像只能提供链接
    type: document
    size: xl
    position:
      x: 740
      'y': 260
  - id: profile_links
    label: |-
      建立稳定属性关联
      报告和证件与身份记录匹配
      对齐社会关系与地址
      保持跨记录身份一致
    type: process
    size: xl
    position:
      x: 740
      'y': 450
  - id: perception_tasks
    label: |-
      设计四项隐私感知任务
      直接标识符 · 间接标识符
      隐私信息抽取
      隐私区域定位
    type: process
    size: xl
    position:
      x: 980
      'y': 60
  - id: profile_media
    label: |-
      生成个体级多模态材料
      每个个体十张图像加档案 JSON
      照片 · 指纹 · 各类记录
      按既定关联使用豆包与 Photoshop
    type: process
    size: xl
    position:
      x: 980
      'y': 450
  - id: reasoning_tasks
    label: |-
      设计五项隐私推理任务
      单步交叉验证 · 单步推理
      链式推理 · 重识别与可关联性
      跨模态关联
    type: process
    size: xl
    position:
      x: 1220
      'y': 450
  - id: chained_guideline
    label: |-
      人工编写链式推理题
      定义需要多来源的问题
      写出可验证的预期步骤
      执行核验后评估难度与覆盖
    type: user
    size: xl
    position:
      x: 1460
      'y': 560
  - id: benchmark
    label: |-
      汇编双语基准
      1,119 张图像 · 7,414 条人工设计 VQA
      40 个合成档案 · 九项任务
      中文与英文
    type: database
    size: xl
    position:
      x: 1700
      'y': 250
  - id: release_gap
    label: |-
      官方快照边界
      GitHub 3fc53f39 · HF a364b842
      CC BY-NC-SA 4.0 · 更新尚未完成
      30 个档案 · 663 张图像 · 缺 VQA 与评测器
    type: document
    size: xl
    position:
      x: 1700
      'y': 620
  - id: verification_gate
    label: |-
      选择核验路径
      绝对标准答案？
      语义判断？
    type: decision
    size: xl
    position:
      x: 2180
      'y': 250
  - id: deterministic
    label: |-
      核验 93% 的评测样本
      使用确定性规则匹配
      输出与绝对标准答案比较
      正确答案清晰且无歧义
    type: process
    size: xl
    position:
      x: 2420
      'y': 80
  - id: hybrid
    label: |-
      核验其余 7% 样本
      Qwen2.5-72B-Instruct 初判后人工确认
      Cohen 一致性系数：0.96 · 0.92 · 0.84
      用于语义与中间步骤判断
    type: process
    size: xl
    position:
      x: 2420
      'y': 430
  - id: evaluate
    label: |-
      评测超过 50 个 VLM
      使用原始提示 · 不显式要求思维链
      温度设为 0
      覆盖商业与开源模型
    type: process
    size: xl
    position:
      x: 1940
      'y': 250
  - id: metrics
    label: |-
      计算分层隐私风险指标
      F1 · IEA 精确匹配 · mIoU
      准确率 · 步骤完成百分比
      分数越高表示隐私风险越高
    type: formula
    size: xl
    position:
      x: 2660
      'y': 100
  - id: refusal
    label: |-
      区分能力与拒答
      错误回答和拒答都算任务失败
      不计作成功抽取隐私
      另行报告拒答率
    type: document
    size: xl
    position:
      x: 2660
      'y': 420
  - id: report
    label: |-
      报告 PPR 隐私风险画像
      隐私感知与推理分数
      中英语言 · 任务 · 属性拆分
      同时报总体与仅已回答准确率
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 260
edges:
  - from: goal
    to: taxonomy
    type: primary
  - from: taxonomy
    to: attribute_sources
    type: primary
  - from: taxonomy
    to: profile_seed
    type: primary
  - from: attribute_sources
    to: attribute_synthesis
    type: primary
  - from: attribute_sources
    to: source_rights
    type: secondary
    style:
      dashed: true
  - from: profile_seed
    to: profile_links
    type: primary
  - from: profile_links
    to: profile_media
    type: primary
  - from: attribute_synthesis
    to: perception_tasks
    type: primary
  - from: profile_media
    to: reasoning_tasks
    type: primary
  - from: reasoning_tasks
    to: chained_guideline
    type: primary
  - from: reasoning_tasks
    to: benchmark
    type: primary
  - from: perception_tasks
    to: benchmark
    type: primary
  - from: chained_guideline
    to: benchmark
    type: primary
  - from: benchmark
    to: release_gap
    type: secondary
    style:
      dashed: true
  - from: benchmark
    to: evaluate
    type: primary
  - from: evaluate
    to: verification_gate
    type: primary
  - from: verification_gate
    to: deterministic
    type: primary
  - from: verification_gate
    to: hybrid
    type: primary
  - from: deterministic
    to: metrics
    type: primary
  - from: hybrid
    to: metrics
    type: primary
  - from: evaluate
    to: refusal
    type: primary
    waypoints:
      - x: 2160
        'y': 580
      - x: 2640
        'y': 580
  - from: metrics
    to: report
    type: primary
  - from: refusal
    to: report
    type: primary
modules: []
