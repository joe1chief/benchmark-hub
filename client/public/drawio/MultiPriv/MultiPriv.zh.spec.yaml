meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiPriv 构建与评测流程
  description: 对齐论文的法规隐私属性体系、受控合成个体档案、九项双语 PPR 任务、混合答案验证与 VLM 隐私风险评测流程。
  legend: MultiPriv v3 含 1,119 张图像与 7,414 条人工设计的双语 VQA，覆盖 36 个属性、40 个合成个体和九项隐私感知与推理任务。
nodes:
  - id: goal
    label: |-
      定义个体级隐私风险
      隐私感知与隐私推理
      跨证据身份关联
      受控评测 VLM 能力边界
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: taxonomy
    label: |-
      构建法规支撑的分类体系
      依据 GDPR 与 CCPA 定义
      七个主要类别
      36 个细粒度属性
    type: process
    size: xl
    position:
      x: 260
      'y': 230
  - id: attribute_sources
    label: |-
      汇集属性级数据来源
      筛选有许可的公开数据
      覆盖视觉隐私类别
      排除定义模糊的属性
    type: database
    size: xl
    position:
      x: 500
      'y': 60
  - id: profile_seed
    label: |-
      创建 40 个合成个体
      生成完整文本个人档案
      身份 · 财务 · 健康 · 出行
      不包含真实可识别个人
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: attribute_images
    label: |-
      整理属性级图像
      公开来源加受控合成
      约 18% 由豆包生成
      形成隐私感知证据池
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: profile_links
    label: |-
      建立稳定属性关联
      文档与身份记录对应
      对齐社会关系与地址
      保持跨记录一致性
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: synthetic_media
    label: |-
      生成一致的多模态记录
      每个合成个体十张图像
      豆包与图像编辑工具
      照片 · 指纹 · 交易记录
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: perception_tasks
    label: |-
      设计四项隐私感知任务
      直接与间接标识识别
      隐私信息抽取
      隐私区域定位
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: reasoning_tasks
    label: |-
      设计五项隐私推理任务
      交叉验证 · 单步 · 链式推理
      重识别与可关联性
      跨模态关联
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      汇编双语基准
      1,119 张图像 · 7,414 条人工 VQA
      40 个档案 · 九项任务
      中文与英文版本
    type: database
    size: xl
    position:
      x: 1460
      'y': 230
  - id: verification
    label: |-
      验证标准答案与模型输出
      93% 使用确定性规则
      7% 使用 Qwen 评判加人工复核
      检查语义与中间推理步骤
    type: process
    size: xl
    position:
      x: 1700
      'y': 230
  - id: evaluate
    label: |-
      评测超过 50 个 VLM
      五个商业模型 · 30 个基础 VLM
      18 个推理 VLM
      拒答视为风险得到缓解
    type: process
    size: xl
    position:
      x: 1700
      'y': 500
  - id: metrics
    label: |-
      计算分层风险指标
      F1 · IEA 精确匹配 · mIoU
      准确率 · 任务完成百分比
      双语感知与推理均值
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: report
    label: |-
      报告隐私能力边界
      感知与身份关联对比
      语言和属性维度拆分
      单独报告拒答率
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 650
edges:
