meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TextVQA 构建与评测流程
  description: >-
    TextVQA从Open
    Images出发，先执行自动OCR和人工文字存在性筛选，保留28408张图像。众包标注员编写1到2个必须读取场景文字才能回答的问题；第二个问题必须与第一个不同且答案不同。每题收集10个独立答案，并通过多数质量标记与honeypot题剔除无效工作。45336个问题按图像不重叠拆分为34602条训练、5000条验证和5734条测试。评测输入图像、问题与OCR文字，并依据10个人类答案计算标准VQA软准确率。
  legend: 来源：TextVQA paper, Sections 3-4; official TextVQA project page。实线箭头表示论文或官方资料明确支持的主流程。
