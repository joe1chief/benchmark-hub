meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TextVQA Build and Evaluation Process
  description: >-
    TextVQA starts from Open Images, applies automatic OCR and a human text-presence screen, and retains 28,408 images.
    Crowd workers write one or two questions that require reading scene text; a second question must differ and have a
    different answer. Ten independent answers are collected per question. Majority quality flags and honeypot questions
    remove invalid work. The 45,336 questions are split without image overlap into 34,602 train, 5,000 validation, and
    5,734 test questions. Evaluation combines the image, question, and OCR tokens and reports the standard VQA soft
    accuracy against the ten human answers.
  legend: >-
    Source: TextVQA paper, Sections 3-4; official TextVQA project page. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
