meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ToolSandbox Build and Evaluation Process
  description: >-
    ToolSandbox defines 34 stateful tools across 11 domains and a built-in user simulator. Two internal experts first
    create self-contained single-tool seed scenarios, then compose and branch them into multi-tool, multi-turn,
    state-dependent, canonicalization, and insufficient-information variants. Each scenario specifies an initial
    database state, user task, available tools, a milestone DAG, and optional minefields. A second expert executes every
    scenario as an agent, checks feasibility and annotations, and the set is iterated for at least four rounds against
    multiple model agents. The final 1,032 scenarios are scored by matching database snapshots to milestones in
    topological order with exact, ROUGE-L, or AST-aware similarities; scores are geometrically aggregated and any
    minefield hit zeros the result.
  legend: >-
    Source: ToolSandbox arXiv:2408.04682, Sections 3-4 and Appendix A; official apple/ToolSandbox repository. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
