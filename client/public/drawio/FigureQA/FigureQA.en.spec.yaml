meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FigureQA Build Process
  description: Paper-aligned color-controlled chart generation, balanced binary QA, metric, and audited release boundary.
  legend: >-
    Solid arrows follow arXiv:1710.07300v2 from color-scheme selection through corpus and metric. The dashed audit
    branch records pinned-generator and release limits; it is not a downstream metric product.
nodes:
  - id: evidence
    label: |-
      Evidence: arXiv:1710.07300v2
      FigureQA @ 1981b72f
      config SHA a853b4f0
      paper corpus + generator audit
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: color_split
    label: |-
      Select color_scheme YAML
      before generation
      100 X11 colors → disjoint 50 / 50
      map each plot type to one half
      alternate val/test swaps halves
    type: document
    size: xl
    position:
      x: 300
      'y': 120
  - id: source_sampling
    label: |-
      Sample bounded uniform values
      linear · quadratic · bell + noise
      bars: 2-10 points
      lines: 2-7 × 5-20 points
    type: database
    size: xl
    position:
      x: 560
      'y': 120
  - id: render
    label: |-
      Render 5 chart types
      vertical / horizontal bars
      line / dot-line / pie
      white background
      random font/grid/width/legend
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: annotations
    label: |-
      Modified Bokeh renders RGB PNG
      exports source data
      and every element bounding box
      axes · ticks · labels
      legends · plot elements
    type: database
    size: xl
    position:
      x: 1080
      'y': 120
  - id: question_templates
    label: |-
      Apply 15 binary templates
      extrema · median · AUC
      smoothness · intersection
      emit paired Yes / No
      when possible
    type: process
    size: xl
    position:
      x: 1080
      'y': 390
  - id: balance
    label: |-
      Count answers by question-ID
      across the split
      drop surplus Yes/No cases
      keep at least one per figure
      derive labels from source data
    type: process
    size: xl
    position:
      x: 820
      'y': 390
  - id: published_release
    label: |-
      Paper release
      train: 100k images / 1.3M QA
      validation/test: 20k each
      each has >250k QA
    type: database
    size: xl
    position:
      x: 560
      'y': 390
  - id: task_metric
    label: |-
      Input: figure + binary question
      predict exact Yes or No
      overall accuracy
      and per-template accuracy
    type: terminal
    size: xl
    position:
      x: 300
      'y': 390
  - id: release_boundary
    label: |-
      Pinned config builds
      train1 / val1 / val2
      no test split
      public archive is unversioned
      no canonical prompt or parser
    type: document
    size: xl
    position:
      x: 40
      'y': 390
edges:
  - from: evidence
    to: color_split
    type: primary
  - from: color_split
    to: source_sampling
    type: primary
  - from: source_sampling
    to: render
    type: primary
  - from: render
    to: annotations
    type: primary
  - from: annotations
    to: question_templates
    type: primary
  - from: question_templates
    to: balance
    type: primary
  - from: balance
    to: published_release
    type: primary
  - from: published_release
    to: task_metric
    type: primary
  - from: evidence
    to: release_boundary
    type: data
modules: []
