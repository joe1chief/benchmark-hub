meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FigureQA Build Process
  description: Paper-aligned two-stage generation of synthetic figures, balanced binary questions, split design, and evaluation.
  legend: >-
    Solid arrows follow arXiv:1710.07300 from constrained numerical sampling through modified-Bokeh rendering, question
    generation, alternated-color splits, and accuracy reporting.
nodes:
  - id: numbers
    label: |-
      Sample numerical source data
      uniform parameter ranges and plot constraints
      linear · quadratic · bell shapes + perturbations
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: render
    label: |-
      Render five scientific figure types
      vertical/horizontal bar · line · dot-line · pie
      modified open-source Bokeh renderer
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: variation
    label: |-
      Randomize visual appearance
      100 X11 colors far from white · fonts · gridlines
      place legends via a 3×3 occupancy grid
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: annotations
    label: |-
      Export auxiliary supervision
      numerical data and all element bounding boxes
      color names, RGB values, and unique IDs
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: questions
    label: |-
      Apply 15 binary question templates
      extrema · comparison · area · smoothness · intersection
      generate one Yes and one No when applicable
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: balance
    label: |-
      Balance Yes / No within each question type
      discard excess pairs to remove answer bias
      derive exact answers from numerical source data
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: splits
    label: |-
      Split colors into disjoint A/B halves
      train on one set per plot type; swap for val/test
      also release same-color-scheme val/test sets
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: dataset
    label: |-
      Train: 100k images / 1.3M questions
      validation and test: 20k images each
      each has more than 250k questions
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: evaluation
    label: |-
      Predict Yes or No for image-question pairs
      report overall and per-template accuracy
      compare same versus alternated color schemes
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: numbers
    to: render
    type: primary
  - from: render
    to: variation
    type: primary
  - from: variation
    to: annotations
    type: primary
  - from: annotations
    to: questions
    type: primary
  - from: questions
    to: balance
    type: primary
  - from: balance
    to: splits
    type: primary
  - from: splits
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
modules: []
