meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FigureQA 构建流程
  description: 按论文还原合成图表、平衡二元问题、数据划分和评测的两阶段生成流程。
  legend: 实线箭头遵循 arXiv:1710.07300，从受约束数值采样、改造 Bokeh 渲染到问题生成、颜色交替划分和准确率统计。
nodes:
  - id: numbers
    label: |-
      采样数值源数据
      统一参数范围与图表约束
      线性 · 二次 · 钟形曲线并加入扰动
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: render
    label: |-
      渲染五类科学图表
      纵/横向柱状图 · 折线图 · 点线图 · 饼图
      使用改造后的开源 Bokeh 渲染器
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: variation
    label: |-
      随机化视觉外观
      100种远离白色的X11颜色 · 字体 · 网格线
      用3×3占用网格选择图例位置
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: annotations
    label: |-
      导出辅助监督信息
      数值数据与全部图表元素边界框
      颜色名称、RGB值和唯一ID
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: questions
    label: |-
      应用15个二元问题模板
      极值 · 比较 · 面积 · 平滑度 · 相交
      每个适用模板生成一条 Yes 和一条 No
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: balance
    label: |-
      在每类问题内平衡 Yes / No
      丢弃多余问答对以消除答案偏置
      从数值源数据推导精确答案
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: splits
    label: |-
      把颜色拆成互斥的 A/B 两半
      每类图训练用一半，验证/测试交换
      另发布同配色方案的验证/测试集
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: dataset
    label: |-
      训练集 10万图 / 130万问题
      验证集和测试集各 2万图
      各自超过 25万问题
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: evaluation
    label: |-
      对图像问题对预测 Yes 或 No
      报告总体与各模板准确率
      比较同配色与交替配色方案
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: numbers
    to: render
    type: primary
  - from: render
    to: variation
    type: primary
  - from: variation
    to: annotations
    type: primary
  - from: annotations
    to: questions
    type: primary
  - from: questions
    to: balance
    type: primary
  - from: balance
    to: splits
    type: primary
  - from: splits
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
modules: []
