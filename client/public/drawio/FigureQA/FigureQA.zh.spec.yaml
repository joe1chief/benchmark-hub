meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FigureQA 构建流程
  description: 与论文对齐的颜色受控图表生成、二元问答平衡、指标及发布边界审计。
  legend: 实线按 arXiv:1710.07300v2 从颜色方案选择贯穿语料与指标；虚线审计分支记录固定生成器和发布限制，并非指标的下游产物。
nodes:
  - id: evidence
    label: |-
      证据边界：arXiv:1710.07300v2
      FigureQA @ 1981b72f
      配置 SHA a853b4f0
      论文语料 + 固定生成器审计
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: color_split
    label: |-
      生成前选择 color_scheme YAML
      100 种 X11 颜色分为互斥 50 / 50
      每个划分将各图表类型映射到其中一半
      交替 val/test 对调另一半
    type: document
    size: xl
    position:
      x: 300
      'y': 120
  - id: source_sampling
    label: |-
      从有界均匀分布采样数值
      形状：线性 · 二次 · 钟形 + 扰动
      柱图 2-10 点；折线 2-7 组 × 5-20 点
    type: database
    size: xl
    position:
      x: 560
      'y': 120
  - id: render
    label: |-
      渲染 5 类：垂直柱图 / 水平柱图
      折线 / 点线 / 饼图 · 白色背景
      随机字体、网格线、宽度与图例
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: annotations
    label: |-
      改造后的 Bokeh 渲染 RGB PNG
      同时导出源数据与全部边界框
      含坐标轴、刻度、标签、图例和图元
    type: database
    size: xl
    position:
      x: 1080
      'y': 120
  - id: question_templates
    label: |-
      应用 15 类二元问题模板
      极值 · 中位数 · AUC · 平滑度 · 相交
      可行时成对生成“是 / 否”样例
    type: process
    size: xl
    position:
      x: 1080
      'y': 390
  - id: balance
    label: |-
      按问题 ID 统计整个划分的答案
      丢弃“是/否”盈余；每图至少保留一题
      标签直接来自数值源数据
    type: process
    size: xl
    position:
      x: 820
      'y': 390
  - id: published_release
    label: |-
      论文发布：训练 10万图 / 130万问答
      验证与测试各 2万图
      每个验证/测试集均超过 25万问答
    type: database
    size: xl
    position:
      x: 560
      'y': 390
  - id: task_metric
    label: |-
      输入：图表图像 + 二元问题
      精确预测“是”或“否”
      报告总体与逐模板准确率
    type: terminal
    size: xl
    position:
      x: 300
      'y': 390
  - id: release_boundary
    label: |-
      固定配置仅构建 train1 / val1 / val2
      不含 test；公开压缩包未版本化
      无规范模型提示或答案解析器
    type: document
    size: xl
    position:
      x: 40
      'y': 390
edges:
  - from: evidence
    to: color_split
    type: primary
  - from: color_split
    to: source_sampling
    type: primary
  - from: source_sampling
    to: render
    type: primary
  - from: render
    to: annotations
    type: primary
  - from: annotations
    to: question_templates
    type: primary
  - from: question_templates
    to: balance
    type: primary
  - from: balance
    to: published_release
    type: primary
  - from: published_release
    to: task_metric
    type: primary
  - from: evidence
    to: release_boundary
    type: data
modules: []
