meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ActivityNet-QA 构建与评测流程
  description: 对齐论文的 ActivityNet 视频采样、受控众包问答编写、独立答案复核、双语翻译质检、官方切分、精确准确率与 WUPS 评测流程。
  legend: 上排从 5,800 个视频构建 58,000 对双语问答；下排分流至论文中的严格匹配与语义相似度指标，再按题型汇总。
nodes:
  - id: videos
    label: |-
      从 ActivityNet v1.3 采样视频
      约 20,000 个长视频中选取 5,800 个
      训练 / 验证 / 测试：3,200 / 1,800 / 800 个视频
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      人工众包编写问答
      每个视频恰好 10 对问题与答案
      初始问题和答案均以中文编写
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: types
    label: |-
      控制问题类型覆盖
      1 动作 + 1 空间 + 1 时间 + 7 自由问题
      自由题答案：是非、数量、颜色、物体、位置、其他
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: quality
    label: |-
      标注质量门控
      问题编写者与答案标注者相互独立
      不可答题返工；随机抽题由多人作答并多数投票
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      中译英质量检查
      用 CIDEr 比较谷歌、百度、搜狗与有道译文
      低一致性样本人工检查；其余采用百度结果
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ActivityNet-QA 数据集
      5,800 个视频上的 58,000 对中英对齐问答
      训练 / 验证 / 测试：32,000 / 18,000 / 8,000 对
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prediction
    label: |-
      VideoQA 模型预测
      输入：完整视频 + 自由形式问题
      输出：简短开放式答案
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: exact
    label: |-
      精确匹配准确率
      仅预测与金标准答案完全相等时记 1 分
      官方评测脚本使用这一比较
    type: process
    size: xl
    position:
      x: 1040
      'y': 350
  - id: wups
    label: |-
      WUPS 语义相似度
      基于 WordNet 比较答案词集合
      论文报告阈值 0.9 与 0.0 下的 WUPS
    type: process
    size: xl
    position:
      x: 1040
      'y': 530
  - id: aggregate
    label: |-
      按问题类型汇总
      动作 • 空间关系 • 时间关系 • 自由问题
      自由问题再按六类答案细分
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      ActivityNet-QA 结果
      总体及分题型准确率
      WUPS 用于补充严格相等对答案歧义的处理
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: videos
    to: author
    type: primary
  - from: author
    to: types
    type: primary
  - from: types
    to: quality
    type: primary
  - from: quality
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: prediction
    type: primary
  - from: prediction
    to: exact
    type: primary
  - from: prediction
    to: wups
    type: primary
  - from: exact
    to: aggregate
    type: primary
  - from: wups
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
