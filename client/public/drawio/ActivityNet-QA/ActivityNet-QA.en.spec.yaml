meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ActivityNet-QA Build and Evaluation Process
  description: Paper-aligned class-balanced video sampling, controlled bilingual QA annotation, quality review, and evaluation.
  legend: >-
    The multi-annotator audit covers a sampled portion as an optional quality branch. The paper does not disclose that
    sample's size or annotator count.
nodes:
  - id: videos
    label: |-
      Class-Balanced Video Sampling
      5,800 ActivityNet v1.3 videos
      Train/val balanced • test random
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      Crowdsourced QA Authoring
      10 Chinese QA pairs per video
    type: process
    size: xl
    position:
      x: 280
      'y': 100
  - id: types
    label: |-
      Control Question Coverage
      1 motion + 1 spatial
      1 temporal + 7 free
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: length_gate
    label: |-
      Enforce QA Length Limits
      Question ≤20 • answer ≤5 words
    type: process
    size: xl
    position:
      x: 760
      'y': 100
  - id: yes_no_balance
    label: |-
      Balance Yes/No Answers
      Keep ratio close to 1:1
    type: process
    size: xl
    position:
      x: 1000
      'y': 100
  - id: quality
    label: |-
      Independent Answer Review
      Regenerate unanswerable
    type: process
    size: xl
    position:
      x: 1240
      'y': 100
  - id: random_audit
    label: |-
      Audit a Sampled Portion
      Multiple annotators • vote
      Sample/count not disclosed
    type: user
    size: xl
    position:
      x: 1480
      'y': 300
  - id: translate
    label: |-
      Chinese-to-English QA
      Four engines + CIDEr check
    type: process
    size: xl
    position:
      x: 1720
      'y': 100
  - id: release
    label: |-
      ActivityNet-QA
      58,000 bilingual QA pairs
    type: database
    size: xl
    position:
      x: 1960
      'y': 100
  - id: prediction
    label: |-
      VideoQA Prediction
      Video + question → answer
    type: document
    size: xl
    position:
      x: 1960
      'y': 660
  - id: exact
    label: |-
      Exact-Match Accuracy
      Prediction equals reference
    type: process
    size: xl
    position:
      x: 1640
      'y': 560
  - id: wups
    label: |-
      WUPS Similarity
      Thresholds 0.9 and 0.0
    type: process
    size: xl
    position:
      x: 1640
      'y': 760
  - id: aggregate
    label: |-
      Aggregate by Type
      Motion • spatial
      Temporal • free
    type: process
    size: xl
    position:
      x: 1320
      'y': 660
  - id: report
    label: |-
      Report Results
      Overall and per-type scores
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 660
edges:
  - from: videos
    to: author
    type: primary
  - from: author
    to: types
    type: primary
  - from: types
    to: length_gate
    type: primary
  - from: length_gate
    to: yes_no_balance
    type: primary
  - from: yes_no_balance
    to: quality
    type: primary
  - from: quality
    to: translate
    type: primary
  - from: quality
    to: random_audit
    type: optional
    label: Sampled portion
  - from: random_audit
    to: translate
    type: optional
  - from: translate
    to: release
    type: primary
  - from: release
    to: prediction
    type: primary
  - from: prediction
    to: exact
    type: primary
  - from: prediction
    to: wups
    type: primary
  - from: exact
    to: aggregate
    type: primary
  - from: wups
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
