meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ActivityNet-QA Build and Evaluation Process
  description: >-
    Paper-aligned ActivityNet video sampling, controlled crowdsourced QA authoring, independent answer checks, bilingual
    translation quality control, official splits, exact accuracy, and WUPS evaluation.
  legend: >-
    The top row builds 58,000 bilingual QA pairs from 5,800 videos; the bottom row branches into the paper's exact-match
    and semantic-similarity criteria before type-wise reporting.
nodes:
  - id: videos
    label: |-
      Sample ActivityNet v1.3 Videos
      5,800 of Approximately 20,000 Long Web Videos
      Train / Val / Test: 3,200 / 1,800 / 800 Videos
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      Human Crowdsourced QA Authoring
      Exactly 10 Question–Answer Pairs per Video
      Initial Questions and Answers Written in Chinese
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: types
    label: |-
      Controlled Question Coverage
      1 Motion + 1 Spatial + 1 Temporal + 7 Free
      Free Answers: Yes/No, Number, Color, Object, Location, Other
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: quality
    label: |-
      Annotation Quality Gates
      Separate Question and Answer Annotators
      Regenerate Unanswerable Items; Majority Vote on Random Audits
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      Chinese-to-English Translation QA
      Compare Google, Baidu, Sogou, and Youdao with CIDEr
      Manually Check Low-Agreement Cases; Otherwise Use Baidu
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ActivityNet-QA Dataset
      58,000 Bilingually Aligned QA Pairs on 5,800 Videos
      Train / Val / Test: 32,000 / 18,000 / 8,000 QA Pairs
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prediction
    label: |-
      VideoQA Model Prediction
      Input: Full Video + Free-Form Question
      Output: Short Open-Ended Answer
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: exact
    label: |-
      Exact-Match Accuracy
      Score 1 Only When Prediction Equals Ground Truth
      Official Evaluation Script Uses This Comparison
    type: process
    size: xl
    position:
      x: 1040
      'y': 350
  - id: wups
    label: |-
      WUPS Semantic Similarity
      WordNet-Based Similarity between Answer Word Sets
      Paper Reports WUPS at Thresholds 0.9 and 0.0
    type: process
    size: xl
    position:
      x: 1040
      'y': 530
  - id: aggregate
    label: |-
      Aggregate by Question Type
      Motion • Spatial Relationship • Temporal Relationship • Free
      Split Free Questions by the Six Answer Types
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      ActivityNet-QA Results
      Overall and Per-Type Accuracy
      WUPS Complements Strict Equality for Answer Ambiguity
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
