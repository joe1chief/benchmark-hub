meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench v2 构建与评测流程
  description: 对齐 NeurIPS 最终论文与固定代码，展示数据收集、专业标注、三人质量门禁、公开/私有分流、按任务路由评分，以及英文八能力与中文五能力的独立宏平均。
  legend: 公开数据以 10,000 条记录发布；最终论文将独立收集的私有集保留给定期更新的排行榜，固定的公开镜像不包含这些私有记录。
nodes:
  - id: scope
    label: |-
      固定基准范围
      单图文本中心任务
      不评测多页长上下文
      各任务的双语覆盖不同
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: collect
    label: |-
      收集并筛选 81 个数据集
      文本密集型学术来源
      补充自标注与私有来源
      覆盖 31 个实际场景
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: taxonomy
    label: |-
      八类能力下定义 23 项任务
      识别 · 指代 · 端到端检测 · 抽取
      解析 · 计算 · 理解 · 推理
      相关任务可复用同一来源
    type: process
    size: xl
    position:
      x: 500
      'y': 250
  - id: guidelines
    label: |-
      制定标注规范
      纳入常见数字与答案变体
      按从左到右、从上到下阅读
      坐标归一到 0–1,000
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: annotate
    label: |-
      标注公开分支
      15 名专业标注员
      创建指令—回答对
      按任务添加坐标
      Markdown · HTML · JSON · LaTeX
    type: process
    size: xl
    position:
      x: 1220
      'y': 60
  - id: review
    label: |-
      交叉复核公开记录
      标注员 1 完成 · 标注员 2 复核
      有分歧交由标注员 3 裁决
      无共识即删除 · 最终修正约 1%
    type: process
    size: xl
    position:
      x: 1460
      'y': 60
  - id: release_gate
    label: |-
      选择哪条数据分支？
      公开或私有
    type: decision
    size: xl
    position:
      x: 980
      'y': 250
  - id: public
    label: |-
      发布 10,000 条指令记录
      约 9,500 张图像 · 论文表 1
      英文 7,400 + 中文 2,600
      固定公开 HF c7e7cdf…
    type: database
    size: xl
    position:
      x: 1700
      'y': 60
  - id: private_collect
    label: |-
      独立收集私有集
      1,500 张图像
      实拍 735 + 无标签 765
      纸质书 · 电子书 · 扫描 · 网页
      对齐公开集 23 任务分布
    type: database
    size: xl
    position:
      x: 1220
      'y': 440
  - id: private_annotate
    label: |-
      单独标注私有集
      核验私有标签
      使用公开任务合同
      用于抗污染评测
      最终论文称：不发布
    type: process
    size: xl
    position:
      x: 1460
      'y': 440
  - id: evaluate
    label: |-
      执行单图指令评测
      将模型输出写入 predict
      解析任务专属输出合同
      使用发布版 eval.py 路由
    type: process
    size: xl
    position:
      x: 2180
      'y': 250
  - id: metric_gate
    label: |-
      应使用哪一种
      任务专属评测器？
    type: decision
    size: xl
    position:
      x: 2420
      'y': 250
  - id: structured_metrics
    label: |-
      结构/关系指标
      表格/图表：TEDS
      文档：STEDS
      KIE/映射：解析字典 F1
      公式：发布版归一化器
    type: process
    size: xl
    position:
      x: 2660
      'y': 0
  - id: spatial_reading_metrics
    label: |-
      空间/长文本指标
      文本定位：IoU
      位置 VQA：½ 内容 + ½ IoU
      检测：ICDAR Hmean @ IoU 0.5
      长文本：BLEU · METEOR
      F1 · 1−NED
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
  - id: count_vqa_metrics
    label: |-
      计数/基础 VQA 指标
      字符计数：精确
      单词计数：归一化 L1
      选择题：精确选项
      短答：包含 · 长答：ANLS
    type: process
    size: xl
    position:
      x: 2660
      'y': 500
  - id: task_means
    label: |-
      按能力聚合
      每项能力内逐条取均值
      英文：21 任务 → 8 能力
      中文：9 任务 → 5 能力
      任务均值仅作诊断
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: language_gate
    label: |-
      对应哪一种分语言
      能力集合？
    type: decision
    size: xl
    position:
      x: 3140
      'y': 250
  - id: en_macro
    label: |-
      英文：八类能力均值
      识别 · 指代 · 端到端检测
      抽取 · 解析 · 计算
      理解 · 推理
      无权平均 · 0–100
    type: process
    size: xl
    position:
      x: 3380
      'y': 60
  - id: cn_macro
    label: |-
      中文：五类能力均值
      识别 · 抽取 · 解析
      理解 · 推理
      不汇总：
      指代 · 端到端检测 · 计算
    type: process
    size: xl
    position:
      x: 3380
      'y': 440
  - id: report
    label: |-
      分语言报告
      各能力分数 + 宏平均
      公开结果 + 私有趋势
      无统一双语总分
    type: terminal
    size: xl
    position:
      x: 3620
      'y': 250
  - id: source_boundary
    label: |-
      来源/权利边界
      NeurIPS 2fd3db… · arXiv 8f4980…
      仓库 86d091… · HF c7e7cdf…
      公开 HF：10,000 条
      私有集：论文不放 · 新闻称已发布
      HF MIT · 仓库仅研究/非商用
    type: document
    size: xl
    position:
      x: 3860
      'y': 500
edges:
  - from: scope
    to: collect
    type: primary
  - from: collect
    to: taxonomy
    type: primary
  - from: taxonomy
    to: guidelines
    type: primary
  - from: guidelines
    to: release_gate
    type: primary
  - from: release_gate
    to: annotate
    type: primary
    label: 公开
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: annotate
    to: review
    type: primary
  - from: review
    to: public
    type: primary
  - from: release_gate
    to: private_collect
    type: primary
    label: 私有
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: private_collect
    to: private_annotate
    type: primary
  - from: public
    to: evaluate
    type: primary
    label: 公开记录
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: private_annotate
    to: evaluate
    type: primary
    label: 保留记录
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: evaluate
    to: metric_gate
    type: primary
  - from: metric_gate
    to: structured_metrics
    type: primary
    label: 结构/F1
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.2
      entryX: 0
      entryY: 0.5
  - from: metric_gate
    to: spatial_reading_metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: metric_gate
    to: count_vqa_metrics
    type: primary
    label: 计数/VQA
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.8
      entryX: 0
      entryY: 0.5
  - from: structured_metrics
    to: task_means
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.2
  - from: spatial_reading_metrics
    to: task_means
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: count_vqa_metrics
    to: task_means
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.8
  - from: task_means
    to: language_gate
    type: primary
  - from: language_gate
    to: en_macro
    type: primary
    label: 英文
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: language_gate
    to: cn_macro
    type: primary
    label: 中文
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: en_macro
    to: report
    type: primary
    label: 八能力宏平均
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: cn_macro
    to: report
    type: primary
    label: 五能力宏平均
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: report
    to: source_boundary
    type: secondary
    label: 来源边界
    labelPosition: center
    style:
      dashed: true
modules: []
