meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench v2 构建与评测流程
  description: 对齐论文，构建包含 10,000 个双语公开问答和 1,500 张私有测试图像的基准，覆盖 31 个场景、23 项任务、八类 OCR 能力，并按任务路由指标后归一到百分制。
  legend: OCRBench v2 聚焦单图文本任务。公开集用于可复现评测；独立收集的私有集不公开，用于降低污染风险并维护排行榜。
nodes:
  - id: collect
    label: |-
      收集并筛选 81 个数据集
      文本密集型学术数据来源
      补充人工收集的私有数据
      面向实际 OCR 应用
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      确定评测范围
      单图文本中心输入
      中英文指令
      31 个真实场景
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: taxonomy
    label: |-
      设计八类能力下的 23 项任务
      识别 · 指代 · 端到端检测
      抽取 · 解析 · 计算
      理解 · 推理
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: prompts
    label: |-
      将标注转为问答指令
      为各任务编写专属提示
      复杂任务附输出格式示例
      Markdown · JSON · LaTeX
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: location
    label: |-
      统一定位任务坐标
      按图像尺寸归一化
      缩放到 0–1,000
      在提示中明确格式
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: annotate
    label: |-
      补齐任务与场景覆盖
      人工标注新增图像
      标签对齐既定任务定义
      保留场景多样性
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: verify
    label: |-
      人工审核公开指令
      检查每条公开提示
      修正约 1% 的标注错误
      核验输出格式要求
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: public
    label: |-
      发布公开测试集
      10,000 个经人工核验的问答对
      英文图 7,400 + 中文图 2,600
      23 项任务覆盖 31 个场景
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: private
    label: |-
      构建独立私有测试集
      人工收集 1,500 张图像
      纸质书 · 电子书 · 扫描件 · 网页
      标注 23 项任务并保持不公开
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: infer
    label: |-
      执行多模态模型评测
      输入单张图像与指令
      解析任务专属输出格式
      比较公开与私有趋势
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: metrics1
    label: |-
      路由结构类指标
      解析任务：TEDS
      定位任务：IoU
      关系抽取：F1
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: metrics2
    label: |-
      路由长文本与计数指标
      长文本：BLEU · METEOR
      F1 · 归一化编辑距离
      计数：精确匹配或归一化 L1
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics3
    label: |-
      路由基础 VQA 指标
      选择题：精确匹配
      少于五词的短答：包含判断
      更长回答：ANLS
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      汇总并诊断结果
      分别统计八类能力
      平均为 0–100 分
      比较公开与私有排名
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: scope
    type: primary
  - from: scope
    to: taxonomy
    type: primary
  - from: taxonomy
    to: prompts
    type: primary
  - from: prompts
    to: location
    type: primary
  - from: location
    to: annotate
    type: primary
  - from: annotate
    to: verify
    type: primary
  - from: verify
    to: public
    type: primary
  - from: public
    to: private
    type: primary
  - from: private
    to: infer
    type: primary
  - from: infer
    to: metrics1
    type: primary
  - from: metrics1
    to: metrics2
    type: primary
  - from: metrics2
    to: metrics3
    type: primary
  - from: metrics3
    to: report
    type: primary
modules: []
