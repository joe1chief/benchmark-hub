meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench v2 Build and Evaluation Process
  description: >-
    Paper-aligned creation of a bilingual 10,000-QA public benchmark and a 1,500-image private test set across 31
    scenarios, 23 tasks, eight OCR capabilities, and task-routed metrics normalized to a 100-point scale.
  legend: >-
    OCRBench v2 focuses on single-image text tasks. The public set is released for reproducibility; the separately
    collected private set remains withheld for contamination-resistant leaderboard evaluation.
nodes:
  - id: collect
    label: |-
      Harvest and Screen 81 Datasets
      Text-rich Academic Sources
      Add Carefully Collected Private Data
      Target Practical OCR Applications
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      Define the Evaluation Scope
      Single-image Text-centric Inputs
      English and Chinese Instructions
      31 Realistic Scenarios
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: taxonomy
    label: |-
      Design 23 Tasks in 8 Capabilities
      Recognition · Referring · Spotting
      Extraction · Parsing · Calculation
      Understanding · Reasoning
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: prompts
    label: |-
      Convert Labels to QA Instructions
      Write Task-specific Prompts
      Include Structured Output Examples
      Markdown · JSON · LaTeX
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: location
    label: |-
      Standardize Localization Targets
      Normalize by Image Dimensions
      Scale Coordinates to 0–1,000
      State the Format in Prompts
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: annotate
    label: |-
      Complete Missing Coverage
      Manually Annotate Added Images
      Align Labels to Defined Tasks
      Preserve Scenario Diversity
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: verify
    label: |-
      Manually Review Public Instructions
      Inspect Every Public Prompt
      Correct about 1% Annotation Errors
      Verify Output Requirements
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: public
    label: |-
      Release the Public Test Set
      10,000 Human-verified QA Pairs
      7,400 English + 2,600 Chinese Images
      23 Tasks across 31 Scenarios
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: private
    label: |-
      Build a Separate Private Test Set
      1,500 Manually Collected Images
      Printed Books · E-books · Scans · Web
      Annotate 23 Tasks · Keep Withheld
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: infer
    label: |-
      Run LMM Evaluation
      Feed One Image plus Instruction
      Parse Task-specific Output Format
      Report Public and Private Trends
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: metrics1
    label: |-
      Route Structural Metrics
      Parsing: TEDS
      Localization: IoU
      Relation Extraction: F1
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: metrics2
    label: |-
      Route Reading and Counting Metrics
      Long Reading: BLEU · METEOR
      F1 · Normalized Edit Distance
      Counting: Exact or Normalized L1
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics3
    label: |-
      Route Basic VQA Metrics
      Multiple Choice: Exact Match
      Short Answer under Five Words: Containment
      Longer Answer: ANLS
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Aggregate and Diagnose Results
      Score Each of Eight Capabilities
      Average on a 0–100 Scale
      Compare Public and Private Rankings
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
