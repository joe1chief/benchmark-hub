meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OPQA 构建与评测流程
  description: 根据公开系统卡复原 OpenAI-Proof Q&A 的构建与评测路径：将真实研究与工程瓶颈连同历史代码和运行证据封装为根因诊断任务。
  legend: OpenAI 系统卡公开了筛选标准、任务数、可访问证据、任务目标和 pass@1 指标；任务编写、参考答案与评分器实现仍属内部信息。
nodes:
  - id: incidents
    label: |-
      汇集历史项目瓶颈
      来自 OpenAI 研究与工程
      真实阻塞项目的问题
      并非合成练习
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: eligibility
    label: |-
      应用“OpenAI-Proof”标准
      团队解决耗时超过一天
      导致重大项目延迟
      部分影响训练运行或发布
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: select
    label: |-
      选出 20 个内部任务
      覆盖研究与工程案例
      保留真实故障背景
      保持诊断难度
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: types
    label: |-
      覆盖复杂故障类型
      意外性能回退
      异常训练指标
      隐蔽实现缺陷
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: evidence
    label: |-
      保留历史诊断证据
      代码与日志
      实验和运行数据
      相关项目产物
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: container
    label: |-
      打包任务容器
      提供代码访问
      纳入运行产物
      隔离每次调查
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: prompt
    label: |-
      编排诊断任务
      定位问题根因
      解释复杂故障
      聚焦解除阻塞的洞察
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: private
    label: |-
      保留为内部基准
      公开说明共 20 题
      数据集未对外发布
      编写细节仍未公开
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: assign
    label: |-
      向模型分配单个任务
      开放任务容器
      提供代码与运行证据
      开始一次独立尝试
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: investigate
    label: |-
      调查故障
      检查代码与产物
      追踪指标和性能回退
      形成根因解释
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: solution
    label: |-
      提交诊断与解释
      明确问题根因
      连接证据与故障
      给出解除阻塞的结论
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: grade
    label: |-
      评分单次解答
      每题一次尝试
      内部评分器细节
      公开材料未披露
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: aggregate
    label: |-
      汇总 20 个任务
      统计成功诊断
      保持单次尝试设置
      计算 pass@1
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告 OPQA 表现
      指标：pass@1
      真实机器学习诊断
      内部评测信号
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: incidents
    to: eligibility
    type: primary
  - from: eligibility
    to: select
    type: primary
  - from: select
    to: types
    type: primary
  - from: types
    to: evidence
    type: primary
  - from: evidence
    to: container
    type: primary
  - from: container
    to: prompt
    type: primary
  - from: prompt
    to: private
    type: primary
  - from: private
    to: assign
    type: primary
  - from: assign
    to: investigate
    type: primary
  - from: investigate
    to: solution
    type: primary
  - from: solution
    to: grade
    type: primary
  - from: grade
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
