      OpenAI 研究与工程团队
      重大项目中的真实瓶颈
      部分影响训练运行或产品发布
      历史内部案例
    type: document
    size: xl
    position:
      x: 40
      'y': 80
  - id: criterion
    label: |-
      重大项目至少延迟一天
      团队解决耗时超过一天
      筛选高后果瓶颈
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: tasks
    label: |-
      20 个内部任务
      OpenAI-Proof Q&A · OPQA
      研究与工程案例
      内部基准
    type: database
    size: xl
    position:
      x: 600
      'y': 80
