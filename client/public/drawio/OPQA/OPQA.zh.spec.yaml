meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OPQA 构建与评测流程
  description: 按固定版本 GPT-5 系统卡复原其明确披露的 OPQA 评测路径；私有的构建和评分细节仅作为证据缺口展示，不推断未公开流程。
  legend: 实线表示内部任务与评测路径中已披露的事实；虚线仅指向固定来源未说明的构建、评分与公开发布边界。
nodes:
