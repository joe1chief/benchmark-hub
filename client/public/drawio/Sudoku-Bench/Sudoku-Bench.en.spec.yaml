meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sudoku-Bench Build and Evaluation Process
  description: >-
    Sudoku-Bench's core challenge_100 set selects 15 four-by-four, 15 six-by-six, and 70 nine-by-nine puzzles to span
    model capability. Fifty puzzles were curated exclusively by the Cracking the Cryptic hosts and twenty difficult
    vanilla puzzles were supplied by Nikoli. The collection is balanced from one- to five-star difficulty. Each puzzle
    is exported from SudokuPad into a pure-text specification containing the rules, grid size, initial digits, and
    coordinate descriptions of visual elements, isolating creative reasoning from visual parsing. The release also
    includes separate nikoli_100 and 2,565-item ctc subsets plus an expert-trace research asset built from more than
    3,000 Cracking the Cryptic video transcripts and SudokuPad actions; these are not the core 100-puzzle score set.
    Evaluation is tool-free. In multi-step mode the model commits at least one digit, receives the updated board, and
    stops at the first wrong placement or after solving; the initial prompt and five latest responses remain in context.
    Single-shot mode requests the whole solution once. Average solve rate and, for multi-step, average correct
    placements are reported across one run per model and puzzle.
  legend: >-
    Source: Sudoku-Bench arXiv:2505.16135 Sections 2-4; official SakanaAI/Sudoku-Bench repository and challenge_100
    release. Solid arrows show the main flow explicitly supported by the paper or official documentation.
