meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sudoku-Bench 构建与评测流程
  description: >-
    Sudoku-Bench核心`challenge_100`包含15道4×4、15道6×6和70道9×9题，用于形成从小模型到前沿模型的能力梯度。其中50题由Cracking the
    Cryptic主持人专门策划，20道困难标准数独由Nikoli提供，并在1至5星难度间均衡分布。每题从SudokuPad导出为纯文本规范，包含规则、网格尺寸、初始数字和视觉元素坐标描述，从而把创造性推理与视觉解析分离。发布包还含独立的`nikoli_100`、2565题`ctc`子集，以及从3000多个Cracking
    the
    Cryptic视频转录和SudokuPad操作构建的专家轨迹研究资产；它们不属于核心100题计分集。评测不允许工具。多步模式每轮至少提交一个数字，系统返回更新后的棋盘，首次填错或解完即停止；上下文保留首条题面和最近5次模型回复。单轮模式一次输出完整解。每个模型每题运行一次，报告平均解题率，多步模式另报平均正确落子数。
  legend: >-
    来源：Sudoku-Bench arXiv:2505.16135 Sections 2-4; official SakanaAI/Sudoku-Bench repository and challenge_100
    release。实线箭头表示论文或官方资料明确支持的主流程。
