meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DROP Build Process
  description: >-
    Paper-aligned DROP workflow: narrative and number-rich Wikipedia passages seed adversarial crowdsourcing, workers
    must write discrete-reasoning questions that a live BiDAF reader misses, answers use spans, dates, or numbers, and
    96,567 questions are passage-split, re-annotated, filtered, and scored with EM plus numeracy-aware F1.
  legend: Solid arrows show passage selection, adversarial question creation, answer typing, validation, and evaluation.
nodes:
  - id: passages
    label: |-
      Wikipedia Passage Search
      Narrative + Number-rich Text
      NFL / History / ≥20 Numbers
      ≈7,000 Passages
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: hit
    label: |-
      AMT HIT
      5 Random Passages
      Write ≥12 QA Pairs
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: reasoning
    label: |-
      Discrete-reasoning Prompts
      Add/Subtract / Min/Max / Count
      Selection / Comparison
    type: document
    size: xl
    position:
      x: 560
      'y': 200
  - id: adversarial
    label: |-
      Real-time BiDAF Gate
      Submit Only if Model Fails
    type: process
    size: large
    position:
      x: 820
      'y': 200
  - id: answer_types
    label: |-
      Worker Supplies Answer
      Passage/Question Span
      Date or Number with Explicit Unit
    type: process
    size: xl
    position:
      x: 1060
      'y': 200
  - id: dataset
    label: |-
      DROP: 96,567 Questions
      7,735 Passages
      English
    type: database
    size: large
    position:
      x: 1320
      'y': 200
  - id: split
    label: |-
      Split by Passage
      Train 77,409 / Dev 9,536
      Test 9,622
    type: database
    size: xl
    position:
      x: 1560
      'y': 200
  - id: validate
    label: |-
      Dev / Test Validation
      ≥2 Additional Answers
      Remove 0.7% Invalid
      Cohen's κ = 0.74
    type: user
    size: xl
    position:
      x: 1820
      'y': 200
  - id: predict
    label: |-
      Reader + Discrete Reasoning
      Predict Span(s), Date, or Number
    type: process
    size: xl
    position:
      x: 2080
      'y': 200
  - id: score
    label: |-
      Normalized Exact Match
      Numeracy-aware Macro F1
      Align Multi-spans; Max over Golds
    type: terminal
    size: xl
    position:
      x: 2340
      'y': 200
edges:
  - from: passages
    to: hit
    type: primary
  - from: hit
    to: reasoning
    type: primary
  - from: reasoning
    to: adversarial
    type: primary
  - from: adversarial
    to: answer_types
    type: primary
  - from: answer_types
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: validate
    type: primary
  - from: validate
    to: predict
    type: primary
  - from: predict
    to: score
    type: primary
modules: []
