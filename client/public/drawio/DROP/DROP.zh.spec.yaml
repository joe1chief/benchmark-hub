meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DROP 构建流程
  description: >-
    论文对齐的 DROP 流程：叙事性和数字密集的 Wikipedia 段落用于对抗式众包，标注员必须编写实时 BiDAF 阅读器答错的 离散推理题，答案为片段、日期或数字；96,567 道题按段落划分、复标、过滤，并以 EM
    和数值敏感 F1 评分。
  legend: 实线箭头表示段落选择、对抗式出题、答案类型、验证和评测。
nodes:
  - id: passages
    label: |-
      Wikipedia 段落搜索
      叙事 + 数字密集文本
      NFL / 历史 / 至少 20 个数字
      约 7,000 个段落
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: hit
    label: |-
      AMT 任务
      随机给出 5 个段落
      至少编写 12 组问答
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: reasoning
    label: |-
      离散推理提示
      加减 / 最大最小 / 计数
      选择 / 比较
    type: document
    size: xl
    position:
      x: 560
      'y': 200
  - id: adversarial
    label: |-
      实时 BiDAF 门
      仅模型答错时可提交
    type: process
    size: large
    position:
      x: 820
      'y': 200
  - id: answer_types
    label: |-
      标注员提供答案
      段落 / 问题文本片段
      日期或带明确单位的数字
    type: process
    size: xl
    position:
      x: 1060
      'y': 200
  - id: dataset
    label: |-
      DROP：96,567 道题
      7,735 个段落
      英文
    type: database
    size: large
    position:
      x: 1320
      'y': 200
  - id: split
    label: |-
      按段落划分
      训练 77,409 / 开发 9,536
      测试 9,622
    type: database
    size: xl
    position:
      x: 1560
      'y': 200
  - id: validate
    label: |-
      开发 / 测试验证
      至少 2 个附加答案
      移除 0.7% 无效题
      Cohen's κ = 0.74
    type: user
    size: xl
    position:
      x: 1820
      'y': 200
  - id: predict
    label: |-
      阅读理解 + 离散推理
      预测片段、日期或数字
    type: process
    size: xl
    position:
      x: 2080
      'y': 200
  - id: score
    label: |-
      归一化精确匹配
      数值敏感宏平均 F1
      对齐多片段；多答案取最大
    type: terminal
    size: xl
    position:
      x: 2340
      'y': 200
edges:
  - from: passages
    to: hit
    type: primary
  - from: hit
    to: reasoning
    type: primary
  - from: reasoning
    to: adversarial
    type: primary
  - from: adversarial
    to: answer_types
    type: primary
  - from: answer_types
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: validate
    type: primary
  - from: validate
    to: predict
    type: primary
  - from: predict
    to: score
    type: primary
modules: []
