meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CharXiv Build Process
  description: >-
    Paper-aligned CharXiv v1 construction and evaluation: select 2,323 natural scientific charts from eight arXiv
    subjects, build descriptive and reasoning QA with distinct human workflows, publish public validation answers while
    withholding test answers, and score zero-shot MLLM responses with the official versioned GPT-4o binary judge.
  legend: Solid arrows show chart selection, parallel QA construction, expert verification, release, and evaluation.
nodes:
  - id: papers
    label: |-
      Download arXiv Preprints
      8 Subjects • Jan 2020–Sep 2023
      Extract Source Figures
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: render
    label: |-
      Re-render Figures as JPEGs
      Resize Longer Side to 1024 px
      Keep Natural Scientific Charts
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: siglip
    label: |-
      SigLIP Candidate Prefilter
      Cosine Similarity ≥ 0.65
      vs. MathVista Mean
      Surface Chart-like Figures
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: manual
    label: |-
      Graduate-student Selection
      750 per Subject and Year
      Inspect Candidate Batches of 10
      Choose 1 Distinct Chart
    type: user
    size: xl
    position:
      x: 940
      'y': 220
  - id: quality
    label: |-
      Pairwise Similarity ≥ 0.95
      Deduplicate Near-matches
      Remove Blurry/Unclear Figures
      Keep 2,323 Charts
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: descriptive
    label: |-
      Descriptive QA
      19 Templates • 4 per Chart
      Extraction • Enumeration
      Pattern • Counting
      Compositionality
    type: document
    size: xl
    position:
      x: 1540
      'y': 40
  - id: answerability
    label: |-
      Per Chart: 3 Answerable
      + 1 Unanswerable
      9,292 Open-vocabulary Qs
      Template-specific Gold Answers
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: reasoning
    label: |-
      Reasoning QA • 1 per Chart
      Review 10 GPT-4V QA Pairs
      Choose / Modify / Write New QA
    type: document
    size: xl
    position:
      x: 1540
      'y': 400
  - id: reasoning_set
    label: |-
      Require Definite Answers
      No Ambiguity
      Text: Chart / General
      Number: Chart / General
      No Advanced Domain Knowledge
    type: process
    size: xl
    position:
      x: 1840
      'y': 400
  - id: verify
    label: |-
      Human-expert Verification
      Curate Charts and QA
      Check Gold Answers
      Confirm Accuracy/Answerability
    type: user
    size: xl
    position:
      x: 2140
      'y': 220
  - id: release
    label: |-
      Release: 2,323 Charts
      11,615 Questions
      Validation 1,000: Public Answers
      Test 1,323: Private Gold
    type: database
    size: xl
    position:
      x: 2440
      'y': 220
  - id: inference
    label: |-
      Zero-shot MLLM Evaluation
      Chart + Question
      + Answer-format Instruction
      Score Descriptive / Reasoning
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: judge
    label: |-
      gpt-4o-2024-05-13 Judge
      Extract Answer
      Binary Correctness
      Gold + Type-specific Rubric
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: report
    label: |-
      Report Accuracy by Category
      Human Reasoning: 80.5%
      Human Descriptive: 92.1%
      Compare Open/Proprietary MLLMs
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: papers
    to: render
    type: primary
  - from: render
    to: siglip
    type: primary
  - from: siglip
    to: manual
    type: primary
  - from: manual
    to: quality
    type: primary
  - from: quality
    to: descriptive
    type: primary
  - from: quality
    to: reasoning
    type: primary
  - from: descriptive
    to: answerability
    type: primary
  - from: reasoning
    to: reasoning_set
    type: primary
  - from: answerability
    to: verify
    type: primary
  - from: reasoning_set
    to: verify
    type: primary
  - from: verify
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
