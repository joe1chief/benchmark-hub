meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Pare-Bench Build and Evaluation Process
  description: >-
    Paper-aligned stateful app modeling, four-stage scenario generation, oracle execution retries, human verification,
    and proactive-assistant evaluation for Pare-Bench.
  legend: >-
    Simulated users navigate state-dependent app screens, while proactive assistants observe events and use a flat
    cross-app API only after proposing assistance and receiving user approval.
nodes:
  - id: step_1
    label: |-
      Extend the ARE Platform
      Reuse apps and persistent state
      Add active user simulation
      Select target apps per scenario
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Model Stateful App Interfaces
      One FSM for each user-facing app
      Screens become states
      Navigation and forms are transitions
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Enforce Interface Asymmetry
      User sees state-dependent actions
      Assistant sees flat app APIs
      Share persistent environment state
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Define Scenario Components
      Initial app states
      Environment event flow
      Oracle validation conditions
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Launch Generation Agent
      Claude Agent SDK code agent
      Read-only Pare codebase context
      Required target-app selection
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Generate Scenario Description
      Write a natural-language story
      Ground a latent user goal
      Specify realistic app context
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Check Description Uniqueness
      Compare existing scenarios
      Use LLM-as-a-judge
      Reject duplicate stories
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Populate Initial App State
      Generate init_and_populate_apps
      Insert contacts emails and events
      Establish scenario seed context
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Build Event Flow
      Generate build_event_flow
      Schedule environment events
      Add oracle user and agent actions
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Generate Validation Function
      Define final-state conditions
      Check required completion actions
      Bind scenario success oracle
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Execute in Oracle Mode
      Run stages two through four
      Check syntax and execution
      Feed failures back and retry
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Human Quality Verification
      Check semantic coherence
      Validate realistic event content
      Confirm task-execution criteria
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Finalize 143 Scenarios
      9 FSM apps plus 3 core apps
      Four application domains
      Optional failures and noise events
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Evaluate Proactive Assistants
      At-least-one and all-four success
      Mean task success rate
      Proposal acceptance and read actions
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
