meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Pare-Bench 构建与评测流程
  description: 对齐论文的有状态应用建模、四阶段场景生成、oracle执行重试、人工核验与主动助手评测流程。
  legend: 模拟用户通过状态依赖的应用屏幕导航；主动助手观察事件，提出帮助并经用户同意后才使用跨应用扁平API执行。
nodes:
  - id: step_1
    label: |-
      扩展ARE平台
      复用应用与持久状态
      加入主动用户仿真
      为场景选择目标应用
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      建模有状态应用接口
      每个用户应用对应一个FSM
      屏幕建模为状态
      导航与表单建模为转移
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      强制接口非对称
      用户仅见状态依赖动作
      助手可见扁平应用API
      双方共享持久环境状态
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      定义场景三部分
      初始应用状态
      环境事件流
      Oracle验证条件
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      启动场景生成智能体
      基于Claude Agent SDK
      只读访问Pare代码库
      输入必须包含的目标应用
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      生成场景描述
      编写自然语言故事
      隐含一个用户目标
      给出真实应用上下文
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      检查描述唯一性
      对比已有场景
      使用LLM-as-a-judge
      拒绝重复故事
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      填充初始应用状态
      生成init_and_populate_apps
      写入联系人邮件与日程
      建立场景种子上下文
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      构建事件流
      生成build_event_flow
      调度环境事件
      添加oracle用户与助手动作
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      生成验证函数
      定义最终状态条件
      检查完成任务所需动作
      绑定场景成功oracle
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      在Oracle模式执行
      运行第二至第四阶段
      检查语法与可执行性
      失败则反馈并重试
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      人工质量核验
      检查语义连贯性
      核验事件内容真实合理
      确认任务执行判据
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      定稿143个场景
      9个FSM应用加3个核心应用
      覆盖四类应用领域
      可注入工具失败与噪声事件
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      评估主动助手
      至少一次成功与四次全成功
      平均任务成功率
      提议率接受率与读取动作
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
