meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MicroVQA 构建与评测流程
  description: 对齐论文展示显微图像原始 VQA 的专家创建、由受监督 DSPy 提示完成考试题转换、RefineBot 清除语言捷径、 专家修正以及多模态思维链评测。
  legend: 12 名生物学专家先创建 1,061 条原始样本；经两阶段 MCQ 流水线和全量专家复核后，最终发布覆盖 三类科学推理任务的 1,042 道题。
nodes:
  - id: tasks
    label: |-
      定义科学推理任务
      访谈九名显微研究 PI 与博士后
      专家图像理解
      假设生成 · 实验方案设计
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: experts
    label: |-
      招募 12 名生物学专家
      覆盖不同显微研究领域
      每名专家约创建 90 条
      估计专家总投入约 600 小时
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: images
    label: |-
      收集可再分发图像
      贡献者自己的实验
      图像数据库
      2024 年以来发表的研究论文
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: raw
    label: |-
      创建 1,061 条原始 VQA
      图像组 · 问题 · 详细回答
      实验上下文与提问动机
      每条耗时 30 至 40 分钟
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality
    label: |-
      检查贡献者样本质量
      研究级难度
      任务对齐 · 图像内容多样性
      第 10 条和第 40 条后反馈
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: gold
    label: |-
      创建 50 道金标 MCQ
      由医师科学家主导设计
      人工转换原始问答对
      遵循 NBME 与 Bloom 原则
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: dspy
    label: |-
      优化第一阶段提示
      用金标 MCQ 监督 DSPy
      内容相似度 · NBME 格式
      惩罚额外作答线索
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage1
    label: |-
      生成考试风格 MCQ
      保留原问答语义
      形成唯一最佳答案
      增加可信干扰项
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: reflect
    label: |-
      运行 RefineBot 评估与反思器
      不看图像用思维链作答
      暴露仅靠语言的捷径
      总结被利用的策略
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: rewrite
    label: |-
      改写薄弱 MCQ
      替换容易排除的干扰项
      检查器确保语义等价
      迭代至变难或达到次数上限
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: seeds
    label: |-
      执行最终难度门槛
      失败题更换随机种子重跑
      GPT-4o 与 Claude 3.5 各两个种子
      要求两个模型均回答错误
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: manual
    label: |-
      专家复核每道最终 MCQ
      原创建者检查正确性
      发现问题时做最小修改
      全量复核最终 1,042 题
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: release
    label: |-
      发布 MicroVQA
      1,042 道专家整理 MCQ
      明场 · 荧光 · 电子显微图像
      覆盖三类科学推理任务
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: evaluate
    label: |-
      评测多模态模型
      采用 MMMU-Pro 思维链提示
      解析数字形式最终答案
      报告分任务准确率与无图消融
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: tasks
    to: experts
    type: primary
  - from: experts
    to: images
    type: primary
  - from: images
    to: raw
    type: primary
  - from: raw
    to: quality
    type: primary
  - from: quality
    to: gold
    type: primary
  - from: gold
    to: dspy
    type: primary
  - from: dspy
    to: stage1
    type: primary
  - from: stage1
    to: reflect
    type: primary
  - from: reflect
    to: rewrite
    type: primary
  - from: rewrite
    to: seeds
    type: primary
  - from: seeds
    to: manual
    type: primary
  - from: manual
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
modules: []
