meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MicroVQA 构建与评测流程
  description: 依据论文展示从显微研究专家原始问答、考试式转换、RefineBot 去除语言捷径、原作者复核到官方准确率解析的流程， 并明确区分论文协议与固定评测脚手架的边界。
  legend: >-
    12 名生物学专家创建 1,061 条原始样本；论文发布 1,042 道经原作者全量复核的多选题，但未披露 19 条流失规则。 最终门槛要求 GPT-4o-2024-08-06 与
    Claude-3.5-Sonnet-20241022 在两个随机种子下均答错。 未能通过 RefineBot 的题目保留第一阶段版本。
nodes:
  - id: tasks
    label: |-
      定义三类科研任务
      访谈九名显微研究 PI 与博士后
      专家图像理解
      假设生成 · 实验方案设计
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: experts
    label: |-
      招募 12 名生物学专家
      覆盖不同显微研究领域
      每名专家约 90 条样本
      估计专家总工时约 600 小时
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: images
    label: |-
      汇集可再分发图像
      贡献者自有实验
      开放数据库与 CC-BY 论文
      2024 年 1 月以后发表的文献
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: raw
    label: |-
      创建 1,061 条原始 VQA
      每题最多六张 RGB 图或视频帧
      问题 · 详细答案 · 干扰项
      实验背景与研究动机
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality
    label: |-
      审核贡献者样本质量
      研究难度 · 任务对齐 · 图像多样性
      正文称第 10 与第 40 条后反馈
      附录 E.1 称先审四至六条
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: gold
    label: |-
      创建 50 道金标多选题
      由医师科学家主导设计
      遵循 NBME 单一最佳答案格式
      保留原始问答目标
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: dspy
    label: |-
      优化第一阶段提示
      DSPy MIPROv2 · 思维链 + RAG · o1-mini
      裁判语义 · NBME 格式 · 多余线索
      语义保持权重最高
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage1
    label: |-
      生成第一阶段考试式多选题
      保留科学语义
      形成单一最佳答案
      添加可信且长度相近的干扰项
    type: process
    size: xl
    position:
      x: 1820
      'y': 40
  - id: refine
    label: |-
      执行一次 RefineBot 尝试
      GPT-4o 无图评测器 + 反思器
      改写器累计利用历轮反思
      等价性检查 · 最多五轮
    type: process
    size: xl
    position:
      x: 1820
      'y': 420
  - id: refine_gate
    label: |-
      RefineBot 尝试成功吗？
      评测器答错 · 改写语义保持
    type: decision
    size: xl
    position:
      x: 1540
      'y': 420
  - id: dual_gate
    label: |-
      最终难度门槛通过吗？
      两个指定模型均失败 · 两种子
    type: decision
    size: xl
    position:
      x: 1260
      'y': 420
  - id: gate_models
    label: |-
      最终门槛模型对
      GPT-4o-2024-08-06
      Claude-3.5-Sonnet-20241022
    type: document
    size: xl
    position:
      x: 1260
      'y': 240
  - id: rerun
    label: |-
      以新随机种子重跑整个 RefineBot
      论文未给出总重跑次数上限
      部分题目最终仍无法通过
    type: process
    size: xl
    position:
      x: 1540
      'y': 760
  - id: stage1_fallback
    label: |-
      保留第一阶段多选题
      用于始终无法通过 RefineBot 的题目
      不采用未成功的第二阶段改写
    type: process
    size: xl
    position:
      x: 1260
      'y': 760
  - id: manual
    label: |-
      原创建者复核最终多选题
      全量复核发布的 1,042 题
      检查正确答案与干扰项
      发现问题时做最小修正
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: attrition
    label: |-
      构建计数边界
      1,061 条原始样本 → 1,042 道发布题
      论文与数据卡均未披露
      19 条样本的流失规则
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      发布 MicroVQA 测试集
      1,042 道多选题 · 423 道多图题
      三类科学推理任务
      数据采用 CC BY-SA 4.0
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: eval_prompt
    label: |-
      构造论文评测提示
      图像 + 问题 + 从一编号的选项
      LLaVA 系列外采用 MMMU-Pro 思维链
      要求输出“The answer is (X)”
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: parse
    label: |-
      解析首个精确答案匹配
      区分大小写的“answer is”加一位数字
      允许可选粗体与括号
      序号减一 · 无匹配记为负一
    type: process
    size: xl
    position:
      x: 20
      'y': 420
  - id: metrics
    label: |-
      汇总官方指标
      全部发布样本上的平均准确率
      缺失或格式错误输出均记错
      分任务 · 无图 · 仅选项分析
    type: terminal
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 760
  - id: scaffold_gap
    label: |-
      固定评测器复现边界
      论文给出 LLaVA 专用前缀与后缀
      当前代码对所有模型使用同一提示
      CLI 读 test · 批量辅助函数请求 train
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 260
      'y': 760
edges:
  - from: tasks
    to: experts
    type: primary
  - from: experts
    to: images
    type: primary
  - from: images
    to: raw
    type: primary
  - from: raw
    to: quality
    type: primary
  - from: quality
    to: gold
    type: primary
  - from: gold
    to: dspy
    type: primary
  - from: dspy
    to: stage1
    type: primary
  - from: stage1
    to: refine
    type: primary
  - from: refine
    to: refine_gate
    type: primary
  - from: refine_gate
    to: dual_gate
    type: primary
    label: 是
    labelPosition: center
  - from: gate_models
    to: dual_gate
    type: secondary
    style:
      dashed: true
    label: 指定模型
    labelPosition: center
  - from: refine_gate
    to: rerun
    type: secondary
    style:
      dashed: true
    label: 否
    labelPosition: center
  - from: dual_gate
    to: manual
    type: primary
    label: 是
    labelPosition: center
  - from: dual_gate
    to: rerun
    type: secondary
    style:
      dashed: true
    label: 否
    labelPosition: center
  - from: rerun
    to: refine
    type: secondary
    style:
      dashed: true
    label: 重试
    labelPosition: center
  - from: rerun
    to: stage1_fallback
    type: secondary
    style:
      dashed: true
    label: 回退
    labelPosition: center
  - from: stage1_fallback
    to: manual
    type: primary
    label: 保留
    labelPosition: center
  - from: manual
    to: attrition
    type: primary
  - from: attrition
    to: release
    type: primary
  - from: release
    to: eval_prompt
    type: primary
  - from: eval_prompt
    to: parse
    type: primary
  - from: parse
    to: metrics
    type: primary
  - from: parse
    to: scaffold_gap
    type: secondary
    style:
      dashed: true
    label: 代码/论文漂移
    labelPosition: center
  - from: scaffold_gap
    to: metrics
    type: secondary
    style:
      dashed: true
    label: 复现边界
    labelPosition: center
modules: []
