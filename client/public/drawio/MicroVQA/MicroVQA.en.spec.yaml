meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MicroVQA Build and Evaluation Process
  description: >-
    Paper-aligned expert creation of raw microscopy VQA, exam-style conversion with a supervised DSPy prompt, RefineBot
    removal of language shortcuts, expert correction, and multimodal chain-of-thought evaluation.
  legend: >-
    Twelve biology experts created 1,061 raw samples; after the two-stage MCQ pipeline and full expert review, the
    released benchmark contains 1,042 questions across three scientific-reasoning tasks.
nodes:
  - id: tasks
    label: |-
      Define Scientific Reasoning Tasks
      Interview Nine Microscopy PIs and Postdocs
      Expert Image Understanding
      Hypothesis Generation · Experiment Proposal
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: experts
    label: |-
      Recruit 12 Biology Experts
      Diverse Microscopy Fields
      About 90 Samples per Expert
      Estimated Expert Time: About 600 Hours
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: images
    label: |-
      Source Redistributable Images
      Contributors' Own Experiments
      Image Databases
      Research Papers Published since 2024
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: raw
    label: |-
      Create 1,061 Raw VQA Samples
      Image Set · Question · Detailed Answer
      Experimental Context and Motivation
      30 to 40 Minutes per Sample
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality
    label: |-
      Review Contributor Quality
      Research-level Difficulty
      Task Alignment · Image Diversity
      Feedback after First 10 and 40 Samples
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: gold
    label: |-
      Create 50 Gold-standard MCQs
      Physician-scientist Leads Design
      Manually Convert Raw QA Pairs
      Follow NBME and Bloom Principles
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: dspy
    label: |-
      Optimize the Stage-one Prompt
      Supervise DSPy with Gold MCQs
      Content Similarity · NBME Formatting
      Penalize Extraneous Clues
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage1
    label: |-
      Generate Exam-style MCQs
      Preserve Original QA Meaning
      Produce One Best Answer
      Add Plausible Distractors
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: reflect
    label: |-
      Run RefineBot Evaluator and Reflector
      Answer without the Image using CoT
      Expose Language-only Shortcuts
      Summarize the Exploited Strategy
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: rewrite
    label: |-
      Rewrite Weak MCQs
      Replace Easy Distractors
      Checker Enforces Semantic Equivalence
      Repeat until Hard or Iteration Limit
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: seeds
    label: |-
      Apply the Final Difficulty Gate
      Rerun Failed Cases with New Seeds
      Two Seeds for GPT-4o and Claude 3.5
      Require Both Models to Answer Incorrectly
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: manual
    label: |-
      Expert-review Every Final MCQ
      Original Creator Checks Its Correctness
      Make Minimal Fixes when Needed
      Review All 1,042 Released Questions
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: release
    label: |-
      Release MicroVQA
      1,042 Expert-curated MCQs
      Brightfield · Fluorescence · Electron Images
      Three Scientific-reasoning Tasks
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: evaluate
    label: |-
      Evaluate Multimodal Models
      MMMU-Pro Chain-of-thought Prompt
      Parse the Numbered Final Answer
      Report Accuracy by Task and No-image Ablation
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
