meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench 构建流程
  description: 对齐论文的 2,457 题生命科学研究能力基准构建流程，包含程序化与专家出题两条路线、迭代审核、 污染监测拆分和允许拒答的选择题评分。
  legend: LAB-Bench 包含八个大类和 30 个子任务。论文报告总计 2,457 题，每个子任务约 80% 公开、 约 20% 私有保留以监测训练污染。
nodes:
  - id: scope
    label: |-
      定义实用生物研究能力
      文献 · 图 · 表 · 补充材料
      数据库 · 实验方案 · 序列 · 克隆
      八个大类 · 30 个子任务
    type: document
    size: xl
    position:
      x: 20
      'y': 200
  - id: strategies
    label: |-
      拆分两类构建策略
      可规模化公式任务使用程序生成
      专业研究任务使用人工编写
      统一为选择题任务结构
    type: process
    size: xl
    position:
      x: 300
      'y': 200
  - id: programmatic
    label: |-
      程序生成序列与数据库问答
      序列问答：15 子任务 · 750 题
      数据库问答：10 子任务 · 650 题
      计算标准答案与合理干扰项
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: manual
    label: |-
      专家编写六类人工任务
      文献 248 · 补充材料 102 · 图像 226
      表格 305 · 实验方案 135
      克隆场景 41
    type: user
    size: xl
    position:
      x: 580
      'y': 380
  - id: prototypes
    label: |-
      模型仅用于候选灵感
      提供图像与表格问题原型
      探测草稿难度并建议干扰项
      由专家纠正或替换建议
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: review
    label: |-
      校准并审核专家草稿
      重点检查最初 5–10 题
      在标注平台修订 · 接收 · 拒绝
      合并前持续由作者复核
    type: user
    size: xl
    position:
      x: 1140
      'y': 200
  - id: dataset
    label: |-
      汇总 LAB-Bench · 2,457
      问题 · 标准答案 · 干扰项
      大类与子任务元数据
      加入训练污染检测标记
    type: database
    size: xl
    position:
      x: 1420
      'y': 200
  - id: split
    label: |-
      划分公开与私有集合
      每个子任务约 80% 公开
      约 20% 私有保留用于监测
      对比公开与私有集合表现差异
    type: process
    size: xl
    position:
      x: 1700
      'y': 200
  - id: model_eval
    label: |-
      无工具评测模型
      零样本思维链提示
      增加信息不足拒答选项
      从文本回答解析选项
    type: process
    size: xl
    position:
      x: 1700
      'y': 540
  - id: human
    label: |-
      建立人类专家基线
      博士级生物研究人员
      可用互联网与科研工具
      禁用人工智能工具 · 标记确定性
    type: user
    size: xl
    position:
      x: 1420
      'y': 540
  - id: metric
    label: |-
      计算可拒答选择题指标
      准确率 = 正确数 / 全部题目
      精确率 = 正确数 / 已作答数
      覆盖率 = 已作答数 / 全部题目
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 540
  - id: report
    label: |-
      汇报可复现结果
      每个模型平均运行三次
      按大类与子任务拆分
      对比模型与人类专家基线
    type: terminal
    size: xl
    position:
      x: 860
      'y': 540
edges:
  - from: scope
    to: strategies
    type: primary
  - from: strategies
    to: programmatic
    type: primary
  - from: strategies
    to: manual
    type: primary
  - from: manual
    to: prototypes
    type: primary
  - from: programmatic
    to: review
    type: primary
  - from: prototypes
    to: review
    type: primary
  - from: review
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: model_eval
    type: primary
  - from: model_eval
    to: human
    type: primary
  - from: human
    to: metric
    type: primary
  - from: metric
    to: report
    type: primary
modules: []
