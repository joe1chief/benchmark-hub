  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench Build Process
  description: >-
    Paper-aligned construction and evaluation of the 2,457-question Language Agent Biology Benchmark, preserving its
    programmatic and four manual construction branches, partly public release boundary, and parallel model and human
    baselines.
  legend: >-
    Solid arrows show paper construction and evaluation. Dashed arrows mark pinned evidence or the current
    public-artifact boundary. The paper evaluates models on the full 2,457-item set; the 1,967/490 release split is a
    parallel contamination-monitoring branch, not an upstream evaluation filter.
