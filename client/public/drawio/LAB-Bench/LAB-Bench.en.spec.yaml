meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench Build Process
  description: >-
    Paper-aligned construction of the 2,457-question Language Agent Biology Benchmark through programmatic and
    expert-authored task pipelines, iterative review, contamination monitoring, and selective multiple-choice scoring.
  legend: >-
    LAB-Bench contains eight broad categories and 30 subtasks. The paper reports 2,457 total questions, with about 80%
    released publicly and 20% retained privately to monitor contamination.
nodes:
  - id: scope
    label: |-
      Define Practical Biology Capabilities
      Literature · Figures · Tables · Supplements
      Databases · Protocols · Sequences · Cloning
      Eight Categories · 30 Subtasks
    type: document
    size: xl
    position:
      x: 20
      'y': 200
  - id: strategies
    label: |-
      Split Two Construction Strategies
      Programmatic for Scalable Formulaic Tasks
      Manual for Expert-intensive Research Tasks
      Common Multiple-choice Task Schema
    type: process
    size: xl
    position:
      x: 300
      'y': 200
  - id: programmatic
    label: |-
      Programmatically Generate SeqQA and DbQA
      SeqQA: 15 Subtasks · 750 Questions
      DbQA: 10 Subtasks · 650 Questions
      Compute Ideals and Plausible Distractors
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: manual
    label: |-
      Experts Author Six Manual Categories
      LitQA2 248 · SuppQA 102 · FigQA 226
      TableQA 305 · ProtocolQA 135
      Cloning Scenarios 41
    type: user
    size: xl
    position:
      x: 580
      'y': 380
  - id: prototypes
    label: |-
      Use Models Only for Candidate Inspiration
      Prototype FigQA and TableQA Questions
      Probe Drafts and Candidate Distractors
      Experts Correct or Replace Suggestions
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: review
    label: |-
      Calibrate and Review Expert Drafts
      Inspect First 5–10 Questions Closely
      Revise · Approve · Reject in Airtable
      Continue Author Review Before Merge
    type: user
    size: xl
    position:
      x: 1140
      'y': 200
  - id: dataset
    label: |-
      Assemble LAB-Bench · 2,457
      Question · Ideal Answer · Distractors
      Category and Subtask Metadata
      Add Training-contamination Canary
    type: database
    size: xl
    position:
      x: 1420
      'y': 200
  - id: split
    label: |-
      Create Public and Private Splits
      About 80% Public per Subtask
      Retain About 20% for Monitoring
      Compare Public-private Performance Gaps
    type: process
    size: xl
    position:
      x: 1700
      'y': 200
  - id: model_eval
    label: |-
      Evaluate Models Without Tools
      Zero-shot Chain-of-thought Prompt
      Add Insufficient-information Option
      Parse Choice from Text Completion
    type: process
    size: xl
    position:
      x: 1700
      'y': 540
  - id: human
    label: |-
      Establish Expert Human Baseline
      PhD-level Biology Researchers
      Internet and Research Tools Allowed
      AI Tools Prohibited · Sure/Unsure Flag
    type: user
    size: xl
    position:
      x: 1420
      'y': 540
  - id: metric
    label: |-
      Compute Selective MCQ Metrics
      Accuracy = Correct / All Questions
      Precision = Correct / Attempted
      Coverage = Attempted / All Questions
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 540
  - id: report
    label: |-
      Report Reproducible Results
      Average Three Runs per Model
      Category and Subtask Breakdowns
      Compare Models with Human Baselines
    type: terminal
    size: xl
    position:
      x: 860
      'y': 540
