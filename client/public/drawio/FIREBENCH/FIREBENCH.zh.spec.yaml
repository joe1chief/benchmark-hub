meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FIREBENCH 构建流程
  description: 按论文还原 2,470 条企业指令遵循样本的组装与确定性/模型评委混合评测。
  legend: 实线箭头依次列出正式发布的六类能力池；类别总量以 Table 1 为准，论文内部格式题算术不一致在复核说明中明示而不擅自修补。
nodes:
  - id: capabilities
    label: |-
      定义六项生产能力
      格式 · 顺序回复 · 排序 · 过度自信
      正向必含 · 负向禁用
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: format
    label: |-
      输出格式池：1,300条
      论文报告QA在21种约束下共1,000条
      加MHPP 100题×JSON/XML/Markdown=300
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: ordered
    label: |-
      顺序回复池：200次试验
      双角色客服会话 · 每轮恰问一个问题
      从约70字段中严格依次收集10–15项
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: ranking
