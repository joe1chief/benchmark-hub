    label: |-
      过度自信池：370条
      300题×标准/不确定性提示
      约70道长文档不可回答题
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: content
    label: |-
      内容要求池：200 + 200条
      使用相同Arena Hard Auto 2.0提示
      GPT-5生成强制包含或禁止准则
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: benchmark
    label: |-
      组装FIREBENCH
      Table 1精确总量：2,470条
      覆盖企业QA、客服、数据与编程工作流
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: grade
    label: |-
      按能力使用专属评分规则
      格式/顺序/排序程序验证；另用简单模糊匹配
