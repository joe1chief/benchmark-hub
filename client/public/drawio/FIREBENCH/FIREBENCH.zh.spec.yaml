meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FIREBENCH 构建流程
  description: 按论文版本展示六个企业指令遵循能力池的并行构建、分类评分和六类宏平均报告。
  legend: 实线遵循 arXiv:2603.04857v1。论文的格式样本算术与后续公开代码差异均明确披露，不做静默修正。
nodes:
  - id: evidence
    label: |-
      固定证据边界
      arXiv:2603.04857v1
      FireBench 仓库 @ dad399d
      下方展示论文组成
    type: document
    size: xl
    position:
      x: 40
      'y': 500
  - id: capabilities
    label: |-
      定义六类生产能力
      格式 · 顺序回复 · 条目排序
      过度自信 · 正向内容要求
      负向内容要求
    type: document
    size: xl
    position:
      x: 340
      'y': 500
  - id: format
    label: |-
      输出格式 · Table 1：1,300
      问答：4 个来源各 25 题 × 21 种约束
      但论文仍报告 1,000 条问答实例
      MHPP：100 × JSON/XML/Markdown = 300
    type: database
    size: xl
    position:
      x: 640
      'y': 0
  - id: ordered
    label: |-
      顺序回复 · 200 次试验
      双角色客服会话
      从约 70 字段采样 10–15 个
      每轮一问；每字段 5–10 个核验值
    type: database
    size: xl
    position:
      x: 640
      'y': 200
  - id: ranking
    label: |-
      条目排序 · 200 次试验
      20 张真实感表格
      随机排序字段与升序/降序
      原样返回全部或 Top-N 行
    type: database
    size: xl
    position:
      x: 640
      'y': 400
  - id: confidence
    label: |-
      过度自信 · 370 条
      300 道 GPQA/HLE/SimpleQA 成对试验
      标准 + 不确定性感知推理
      约 70 篇长文档不可答
    type: database
    size: xl
    position:
      x: 640
      'y': 600
  - id: positive
    label: |-
      正向内容要求 · 200
      人工选择 Arena Hard Auto 2.0 提示
      GPT-5 生成必须包含的要求
      及核验准则
    type: database
    size: xl
    position:
      x: 640
      'y': 800
  - id: negative
    label: |-
      负向内容要求 · 200
      使用同一批 Arena Hard Auto 2.0 提示
      GPT-5 生成禁止约束
      及核验准则
    type: database
    size: xl
    position:
      x: 640
      'y': 1000
  - id: benchmark
    label: |-
      组装论文基准
      Table 1 总数：2,470
      1,300 / 200 / 200 / 370 / 200 / 200
      六个独立能力池
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: grading
    label: |-
      选择分类评分方式
      每条样本得到一个二值结果
    type: decision
    size: xl
    position:
      x: 1300
      'y': 500
  - id: deterministic
    label: |-
      程序化评分
      格式解析 / 正则 / 结构化输出
      顺序值对照真值
      排序后精确匹配行
    type: process
    size: xl
    position:
      x: 1600
      'y': 100
  - id: abstention
    label: |-
      过度自信规则
      答对 ↔ 不拒答
      答错 ↔ 明确拒答
      文档信息不足 ↔ 只能拒答
    type: process
    size: xl
    position:
      x: 1600
      'y': 500
  - id: judge
    label: |-
      内容要求评委
      GPT-4.1 检查 GPT-5 生成的准则
      正向：全部必需元素均出现
      负向：全部禁止元素均避开
    type: process
    size: xl
    position:
      x: 1600
      'y': 900
  - id: score
    label: |-
      报告论文结果
      计算六类准确率
      总分 = 六类准确率
      的无权平均
      比较 11 个闭源 / 开放权重
      模型
    type: terminal
    size: xl
    position:
      x: 1950
      'y': 500
  - id: release_boundary
    label: |-
      公开代码边界 @ dad399d
      问答：每来源 12 条
      48 × 21 = 1,008
      main.py 平均 7 个测试集分数
      内容路径：被测模型，而非 judge_model
    type: document
    size: xl
    position:
      x: 1950
      'y': 850
