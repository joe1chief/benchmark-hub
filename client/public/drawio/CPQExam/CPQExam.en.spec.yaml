      Invalid Output Becomes Empty
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: normalize
    label: |-
      Normalize Prediction
      Remove Separators and Whitespace
      Sort Multiple-Answer Letters
    type: process
    size: xl
    position:
      x: 2280
      'y': 300
  - id: score
    label: |-
      Exact Match to Gold Answer
      Report Accuracy by Level
      Type and Department + Invalid Count
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
  - id: quarkmed_note
    label: |-
      Table 7 QuarkMed Result Only
