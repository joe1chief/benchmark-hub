  - from: curate
    to: boundary
    type: primary
  - from: curate
    to: release
    type: primary
  - from: release
    to: levels
    type: primary
  - from: levels
    to: formats
    type: primary
  - from: formats
    to: prompt
    type: primary
  - from: prompt
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: normalize
    type: primary
  - from: normalize
    to: score
    type: primary
  - from: quarkmed_note
