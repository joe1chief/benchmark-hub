meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CPQExam Release and Evaluation Process
  description: >-
    Source-aligned flow separating the paper's private CPQExam status from the later official 7,600-question JSONL
    release, while preserving the disclosed prompt, parser, exact-match scoring, and grouped accuracy.
  legend: Orange marks the undisclosed selection boundary; the dashed note is QuarkMed-specific, not a generic evaluator step.
nodes:
  - id: exam
    label: |-
      Chinese Health Professional
      Qualification Examination
      Licensure and Career Advancement
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: curate
    label: Original Curation Disclosed?
    type: decision
    size: xl
    position:
      x: 320
      'y': 190
  - id: boundary
    label: |-
      Private Dataset in the Paper
      Original Sampling / Filtering /
      De-Duplication
      Release-Selection Rules Not
      Disclosed
    type: document
    size: xl
    position:
      x: 600
      'y': 60
  - id: release
    label: |-
      Later Release: 7,600 Questions
      Official Public JSONL
      Curated Chinese Data
      14 Departments
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: levels
    label: |-
      Four Professional Levels
      Primary 600 / Intermediate 4,800
      Associate Senior 1,200 / Senior
      1,000
    type: process
    size: xl
    position:
      x: 880
      'y': 300
  - id: formats
    label: |-
      Question Formats
      Single / Multiple Response
      Shared Stem / Case Analysis
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: prompt
