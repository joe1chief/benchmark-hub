      Standard Chinese Prompt
      Think, Then Return JSON Only
      { answer: A/B/C }
    type: document
    size: xl
    position:
      x: 1440
      'y': 300
  - id: inference
    label: |-
      One Inference per Test Sample
      Temperature 0.6 for All Models
    type: process
    size: xl
    position:
      x: 1720
      'y': 300
  - id: parse
    label: |-
      Parse JSON Answer
      Fallback to Regex on Malformed
