meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CPQExam 发布与评测流程
  description: 按来源还原公开的 7,600 道中国卫生专业技术资格考试基准，包括已披露的数据字段、提示、解析器、精确匹配与分组准确率。
  legend: 橙色表示原始整理流程未披露；其后的公开数据与评测器细节均来自官方仓库。
nodes:
  - id: exam
    label: |-
      中国卫生专业技术资格考试
      用于执业资格与职业晋升
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: curate
    label: 原始整理已披露？
    type: decision
    size: xl
    position:
      x: 320
      'y': 190
  - id: boundary
    label: |-
      论文与仓库未说明
      采样 / 过滤 / 去重
      发布集选择规则
    type: document
    size: xl
    position:
      x: 600
      'y': 60
  - id: release
    label: |-
      官方公开 JSONL
      7,600 道中文题
      覆盖 14 个科室
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: levels
    label: |-
      四个专业级别
      初级 600 / 中级 4,800
      副高 1,200 / 高级 1,000
    type: process
    size: xl
    position:
      x: 880
      'y': 300
  - id: formats
    label: |-
      题目形式
      单选 / 多选
      共用题干 / 案例分析
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: prompt
    label: |-
      标准中文提示
      思考后仅返回 JSON
      { answer: A/B/C }
    type: document
    size: xl
    position:
      x: 1440
      'y': 300
  - id: inference
    label: |-
      每个测试样本推理一次
      所有模型温度 0.6
      QuarkMed 可选知识增强
    type: process
    size: xl
    position:
      x: 1720
      'y': 300
  - id: parse
    label: |-
      解析 JSON 答案
      格式异常时回退正则抽取
      无效输出记为空答案
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: normalize
    label: |-
      规范预测答案
      移除分隔符与空白
      对多选字母排序
    type: process
    size: xl
    position:
      x: 2280
      'y': 300
  - id: score
    label: |-
      与标准答案精确匹配
      按级别、题型与科室报告准确率
      同时报告无效答案数
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
edges:
  - from: exam
    to: curate
    type: primary
  - from: curate
    to: boundary
    type: primary
  - from: curate
    to: release
    type: primary
  - from: boundary
    to: score
    type: primary
  - from: release
    to: levels
    type: primary
  - from: levels
    to: formats
    type: primary
  - from: formats
    to: prompt
    type: primary
  - from: prompt
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: normalize
    type: primary
  - from: normalize
    to: score
    type: primary
modules: []
