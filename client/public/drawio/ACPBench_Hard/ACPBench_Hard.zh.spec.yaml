meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard 构建与评测流程
  description: 对齐论文的 PDDL 生成、优质规划、计划 / 状态采样、八类开放式任务、模板翻译、语法解析和任务专用符号验证流程。
  legend: 上排遵循论文六步生成流程；下排区分直接验证与缓存优先任务，只有未决候选才调用规划器。
nodes:
  - id: pddl
    label: |-
      准备 PDDL 信源
      有生成器时生成领域 / 问题
      ALFWorld：复用官方 PDDL
      13 个规划领域
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: planner
    label: |-
      生成计划
      优先最高质量规划器
      多样化规划器作为后备
      保留多条有效计划
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sample
    label: |-
      按任务采样
      根据目标任务采样
      计划或中间状态
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: symbolic
    label: |-
      生成任务专用符号问答
      App • Prog • Reach • AReach
      Val • Just • Land • NextA
      Reach / AReach：存疑状态跳过
      保留验证所需材料
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      使用领域模板翻译
      PDDL 事实 / 动作 → 自然语言
      保留事实、计划、代价
      与验证证据
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ACPBench Hard 数据集
      官方数据卡验证集：320 例
      测试：13 领域 × 8 任务 × 10 = 1,040
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: inference
    label: |-
      开放式评测 • 2-shot
      温度 0 • 默认最多 1,000
      GPT-OSS 20B / 120B
      例外最多 4,000
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: parse
    label: |-
      宽松语法解析器
      丢弃不合语法的 token
      提取动作、事实、列表或序号
      再运行符号验证器
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: route
    label: 选择验证器类别？
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: deterministic
    label: |-
      直接 / 模拟验证
      App、Prog：完整集合精确匹配
      Val：首个无效序号
      Just：真子序列且仍为有效计划
    type: process
    size: xl
    position:
      x: 600
      'y': 350
  - id: known_fast
    label: |-
      已知答案快速路径
      Reach • AReach • Land • NextA
      检查 None / 缓存正负集合
    type: process
    size: xl
    position:
      x: 600
      'y': 610
  - id: unresolved
    label: 是否为未决候选？
    type: decision
    size: xl
    position:
      x: 320
      'y': 610
  - id: solve
    label: |-
      规划器后备验证
      Reach / AReach / Land
      NextA：最优代价减 1
    type: process
    size: xl
    position:
      x: 80
      'y': 700
  - id: report
    label: |-
      ACPBench Hard 严格准确率
      按任务 / 领域统计二元准确率
      只评最终答案
    type: terminal
    size: xl
    position:
      x: 80
      'y': 440
  - id: jaccard
    label: |-
      仅适用性任务的附加分析
      可选 Jaccard 相似度
    type: terminal
    size: xl
    position:
      x: 80
      'y': 260
edges:
  - from: pddl
    to: planner
    type: primary
  - from: planner
    to: sample
    type: primary
  - from: sample
    to: symbolic
    type: primary
  - from: symbolic
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: route
    type: primary
  - from: route
    to: deterministic
    type: primary
    label: |-
      直接 / 模拟类
      App • Prog • Val • Just
  - from: route
    to: known_fast
    type: primary
    label: 可达类：Reach • AReach • Land • NextA
  - from: deterministic
    to: report
    type: primary
  - from: known_fast
    to: unresolved
    type: primary
  - from: unresolved
    to: report
    type: primary
    label: 已知结果
  - from: unresolved
    to: solve
    type: primary
    label: 需要规划器
  - from: solve
    to: report
    type: primary
  - from: report
    to: jaccard
    type: secondary
    label: 宽松附加分析
modules: []
