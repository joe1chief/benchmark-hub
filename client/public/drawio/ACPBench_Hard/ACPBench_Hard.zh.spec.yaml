meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard 构建与评测流程
  description: 对齐论文的 PDDL 生成、优质规划、计划 / 状态采样、八类开放式任务、模板翻译、语法解析和任务专用符号验证流程。
  legend: 上排遵循论文六步数据生成流程；下排分流至存储值 / 模拟检查与规划器验证，再汇总严格准确率。
nodes:
  - id: pddl
    label: |-
      生成 PDDL 领域与问题
      ACPBench 的 13 个规划领域
      复用 ALFWorld PDDL
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: planner
    label: |-
      运行 Top-K / Top-Quality 规划器
      产生多条有效计划
      保留任务、当前状态与目标
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sample
    label: |-
      采样计划 / 中间状态
      按任务选择所需材料
      跳过可达性不确定的状态
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: symbolic
    label: |-
      生成符号化问答
      适用性 • 状态演进
      可达性 • 动作可达性
      验证 • 论证
      地标 • 下一动作
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      使用领域模板翻译
      PDDL 事实 / 动作 → 自然语言
      保留事实、计划、代价
      与验证证据
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ACPBench Hard 数据集
      官方数据卡验证集：320 例
      测试：13 领域 × 8 任务 × 10 = 1,040
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: inference
    label: |-
      开放式评测 • 2-shot
      温度 0 • 默认最多 1,000
      GPT-OSS 20B / 120B
      例外最多 4,000
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: parse
    label: |-
      任务专用语法解析器
      提取动作、事实、计划或序号
      拒绝非法 / 无法解析的符号
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: route
    label: 选择验证路径？
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: stored
    label: |-
      存储值 / 模拟检查
      精确集合：适用性、状态演进
      首个无效序号
      子序列论证
    type: process
    size: xl
    position:
      x: 400
      'y': 350
  - id: solve
    label: |-
      规划器支撑的检查
      可达性 • 动作可达性
      地标
      下一动作令最优距离减 1
    type: process
    size: xl
    position:
      x: 400
      'y': 530
  - id: report
    label: |-
      ACPBench Hard 结果
      按任务 / 领域统计二元准确率
      严格答案
      适用性可附加 Jaccard
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: pddl
    to: planner
    type: primary
  - from: planner
    to: sample
    type: primary
  - from: sample
    to: symbolic
    type: primary
  - from: symbolic
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: route
    type: primary
  - from: route
    to: stored
    type: primary
    label: |-
      存储：适用性 • 状态演进
      验证 • 论证
  - from: route
    to: solve
    type: primary
    label: |-
      求解：可达性 • 动作可达性
      地标 • 下一动作
  - from: stored
    to: report
    type: primary
  - from: solve
    to: report
    type: primary
modules: []
