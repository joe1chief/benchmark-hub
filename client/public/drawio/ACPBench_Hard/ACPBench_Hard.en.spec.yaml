meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard Build and Evaluation Process
  description: >-
    Paper-aligned PDDL generation, top-quality planning, plan/state sampling, eight open-ended task families, template
    translation, grammar parsing, and task-specific symbolic validation.
  legend: >-
    The top row follows the paper's six-step generation workflow; the bottom row branches between stored/simulated
    checks and planner-backed validators before strict accuracy reporting.
nodes:
  - id: pddl
    label: |-
      Generate PDDL Domain + Problem Files
      13 Planning Domains from ACPBench
      Use Existing ALFWorld PDDL Instead of Its Generator
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: planner
    label: |-
      Run Top-K / Top-Quality Planner
      Produce Multiple Valid Plans
      Preserve Planning Task, Current State, and Goal
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sample
    label: |-
      Sample Plans or Intermediate States
      Choose the Required Artifact per Task
      Skip States When Reachability Certainty Is Unavailable
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: symbolic
    label: |-
      Generate Symbolic Questions + Answers
      Applicability • Progression • Reachability • Action Reachability
      Validation • Justification • Landmarks • Next Action
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      Translate with Domain Templates
      PDDL Facts and Actions → Natural Language
      Retain Facts, Actions, Plans, Costs, and Witness Sets for Scoring
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ACPBench Hard Dataset
      Dev: 40 Examples per Task = 320
      Test: 10 per Domain × 13 × 8 Tasks = 1,040
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: inference
    label: |-
      Open-Ended Model Evaluation
      Natural-Language Context + Task Instruction + 2 Shots
      Temperature 0 • Maximum 1,000 Generated Tokens
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: parse
    label: |-
      Task-Specific Grammar Parser
      Extract Action Lists, Fact Lists, Plans, or an Index
      Reject Unparseable / Invalid Symbols
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: route
    label: Validator Path?
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: stored
    label: |-
      Stored-Answer / Simulation Checks
      Exact Sets for Applicability and Progression
      First Invalid Index; Proper-Subsequence Plan for Justification
    type: process
    size: xl
    position:
      x: 600
      'y': 350
  - id: solve
    label: |-
      Planner-Backed Checks
      Reachability • Action Reachability • Landmarks
      Next Action Must Reduce Optimal Goal Distance by One
    type: process
    size: xl
    position:
      x: 600
      'y': 530
  - id: report
    label: |-
      ACPBench Hard Results
      Binary Correctness and Accuracy per Task / Domain
      Strict Complete Answers; Optional Jaccard Analysis for Applicability
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: pddl
    to: planner
    type: primary
  - from: planner
    to: sample
    type: primary
  - from: sample
    to: symbolic
    type: primary
  - from: symbolic
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: route
    type: primary
  - from: route
    to: stored
    type: primary
  - from: route
    to: solve
    type: primary
  - from: stored
    to: report
    type: primary
  - from: solve
    to: report
    type: primary
modules: []
