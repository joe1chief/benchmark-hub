meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard Build and Evaluation Process
  description: >-
    Paper-aligned PDDL generation, top-quality planning, plan/state sampling, eight open-ended task families, template
    translation, grammar parsing, and task-specific symbolic validation.
  legend: >-
    The top row follows the paper's six-step generation workflow; the bottom row branches between stored/simulated
    checks and planner-backed validators before strict accuracy reporting.
nodes:
  - id: pddl
    label: |-
      Generate PDDL Domain + Problem
      13 ACPBench planning domains
      Reuse ALFWorld PDDL
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: planner
    label: |-
      Run Top-K / Top-Quality Planner
      Produce multiple valid plans
      Keep task, current state, and goal
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sample
    label: |-
      Sample Plan / Intermediate State
      Choose artifact per task
      Skip uncertain reachability states
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: symbolic
    label: |-
      Generate Symbolic QA
      Applicability • progression
      Reachability • action reachability
      Validation • justification
      Landmarks • next action
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      Translate with Domain Templates
      PDDL facts/actions → natural language
      Keep facts, plans, costs,
      and validation witnesses
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ACPBench Hard Dataset
      Official data card: 320 validation
      Test: 13 domains × 8 tasks × 10 = 1,040
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: inference
    label: |-
      Open-Ended Evaluation • 2-shot
      Temperature 0 • default max 1,000
      GPT-OSS 20B / 120B
      exception max: 4,000
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: parse
    label: |-
      Task-Specific Grammar Parser
      Extract actions, facts, plans, or index
      Reject invalid / unparseable symbols
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: route
    label: Validator Path?
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: stored
    label: |-
      Stored / Simulation Checks
      Exact sets: applicability, progression
      First invalid index
      Subsequence justification
    type: process
    size: xl
    position:
      x: 400
      'y': 350
  - id: solve
    label: |-
      Planner-Backed Checks
      Reachability • action reachability
      Landmarks
      Next action: optimal distance −1
    type: process
    size: xl
    position:
      x: 400
      'y': 530
  - id: report
    label: |-
      ACPBench Hard Results
      Binary accuracy per task / domain
      Strict answers
      Optional applicability Jaccard
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: pddl
    to: planner
    type: primary
  - from: planner
    to: sample
    type: primary
  - from: sample
    to: symbolic
    type: primary
  - from: symbolic
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: route
    type: primary
  - from: route
    to: stored
    type: primary
    label: |-
      Stored: Applicability • Progression
      Validation • Justification
  - from: route
    to: solve
    type: primary
    label: Solve • 4 checks
  - from: stored
    to: report
    type: primary
  - from: solve
    to: report
    type: primary
modules: []
