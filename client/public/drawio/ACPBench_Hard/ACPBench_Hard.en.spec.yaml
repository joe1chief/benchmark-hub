meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard Build and Evaluation Process
  description: >-
    Paper-aligned PDDL generation, top-quality planning, plan/state sampling, eight open-ended task families, template
    translation, grammar parsing, and task-specific symbolic validation.
  legend: >-
    The top row follows the six-step generation workflow; the bottom row separates direct validators from cache-first
    tasks whose unresolved candidates require a planner.
nodes:
  - id: pddl
    label: |-
      PDDL Source Preparation
      Generator when available
      ALFWorld: reuse official PDDL
      13 planning domains
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: planner
    label: |-
      Plan Production
      Top-quality planner first
      Diverse planner as backup
      Retain multiple valid plans
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sample
    label: |-
      Task-Scoped Sampling
      Sample plans or intermediate states
      according to the target task
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: symbolic
    label: |-
      Task-Specific Symbolic QA
      App • Prog • Reach • AReach
      Val • Just • Land • NextA
      Reach / AReach: skip uncertain states
      Retain validator artifacts
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: translate
    label: |-
      Translate with Domain Templates
      PDDL facts/actions → natural language
      Keep facts, plans, costs,
      and validation witnesses
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      ACPBench Hard Dataset
      Official data card: 320 validation
      Test: 13 domains × 8 tasks × 10 = 1,040
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: inference
    label: |-
      Open-Ended Evaluation • 2-shot
      Temperature 0 • default max 1,000
      GPT-OSS 20B / 120B
      exception max: 4,000
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: parse
    label: |-
      Lenient Grammar Parser
      Discard out-of-grammar tokens
      Extract actions, facts, lists, or index
      Then run symbolic validators
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: route
    label: Validator Family?
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: deterministic
    label: |-
      Direct / Simulation Validators
      App, Prog: exact complete sets
      Val: first invalid index
      Just: proper subsequence + valid plan
    type: process
    size: xl
    position:
      x: 600
      'y': 350
  - id: known_fast
    label: |-
      Known-Answer Fast Path
      Reach • AReach • Land • NextA
      Check None / cached positive-negative sets
    type: process
    size: xl
    position:
      x: 600
      'y': 610
  - id: unresolved
    label: Unresolved Candidate?
    type: decision
    size: xl
    position:
      x: 320
      'y': 610
  - id: solve
    label: |-
      Planner Fallback
      Reach / AReach / Land
      NextA: optimal cost drops by 1
    type: process
    size: xl
    position:
      x: 80
      'y': 700
  - id: report
    label: |-
      Strict ACPBench Hard Accuracy
      Binary accuracy per task / domain
      Final answers only
    type: terminal
    size: xl
    position:
      x: 80
      'y': 440
  - id: jaccard
    label: |-
      Applicability-Only Add-on
      Optional Jaccard similarity
    type: terminal
    size: xl
    position:
      x: 80
      'y': 260
edges:
  - from: pddl
    to: planner
    type: primary
  - from: planner
    to: sample
    type: primary
  - from: sample
    to: symbolic
    type: primary
  - from: symbolic
    to: translate
    type: primary
  - from: translate
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: route
    type: primary
  - from: route
    to: deterministic
    type: primary
    label: |-
      App • Prog
      Val • Just
  - from: route
    to: known_fast
    type: primary
    label: Reach • AReach • Land • NextA
  - from: deterministic
    to: report
    type: primary
  - from: known_fast
    to: unresolved
    type: primary
  - from: unresolved
    to: report
    type: primary
    label: Known result
  - from: unresolved
    to: solve
    type: primary
    label: Planner needed
  - from: solve
    to: report
    type: primary
  - from: report
    to: jaccard
    type: secondary
    label: Less-strict analysis
modules: []
