meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClothoAQA Build and Baseline Evaluation Process
  description: >-
    Paper-aligned two-stage crowdsourcing, rare-answer curation, audio-disjoint split search, and task-specific binary
    versus 828-class baseline evaluation for the fixed Zenodo release.
  legend: >-
    Solid arrows show dataset construction and baseline evaluation; branches distinguish question sets and task-specific
    protocols.
