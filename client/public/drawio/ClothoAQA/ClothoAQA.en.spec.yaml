meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClothoAQA Build Process
  description: >-
    Paper-aligned construction and baseline evaluation flow for ClothoAQA. Qualified crowd workers create two
    complementary three-question sets and independent answer annotations for 1,991 environmental-audio clips; the
    curated 35,838 audio-question-answer triplets are split without audio overlap and evaluated as binary and
    single-word classification.
  legend: Solid arrows trace annotation, curation, release, and the paper's baseline evaluation branches.
