meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClothoAQA 构建与基线评测流程
  description: 对齐论文的两阶段众包、罕见答案整理、音频不重叠划分搜索，以及固定 Zenodo 版本中 二分类与 828 类单词分类各自独立的基线评测流程。
  legend: 实线表示数据集构建与基线评测；分支区分两组问题和各任务专属协议。
nodes:
  - id: evidence
    label: |-
      证据边界
      arXiv:2204.09634v2
      Zenodo 6473207
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: audio
    label: |-
      随机抽取 Clotho 音频
      1,991 段环境声音
      每段 15–30 秒
    type: database
    size: xl
    position:
      x: 320
      'y': 240
  - id: question_workers
    label: |-
      合格 AMT 问题工人
      ≥3,000 项 • ≥95% 通过率
      英语地区 + 自定义资格测试
    type: user
    size: xl
    position:
      x: 600
      'y': 240
  - id: set_a
    label: |-
      问题组 A
      一是 • 一否
      一其他单词答案
    type: process
    size: xl
    position:
      x: 880
      'y': 80
  - id: set_b
    label: |-
      不重复问题组 B
      一是 • 一否 • 一其他
      不得与 A 组相同或相似
    type: process
    size: xl
    position:
      x: 880
      'y': 400
  - id: screen
    label: |-
      人工问题筛查
      类型 • 语音内容
      答案泄露 • 直接称呼
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: answers
    label: |-
      独立 AMT 答案工人
      每题 3 个答案
      信心：是 / 否 / 不确定
    type: user
    size: xl
    position:
      x: 1440
      'y': 240
  - id: rare_answers
    label: |-
      内部罕见答案修正
      拼写修复或语义近似替换
      1,889 → 830 个唯一答案
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: split_search
    label: |-
      音频不重叠划分搜索
      2,000 个候选 60/40 划分
      取前 50，再拆 20/20
    type: process
    size: xl
    position:
      x: 2000
      'y': 240
  - id: release
    label: |-
      固定 Zenodo 发布版
      训练 / 验证 / 测试
      1,174 / 344 / 473 段音频
      11,946 个问题 • 35,838 行
    type: database
    size: xl
    position:
      x: 2280
      'y': 240
  - id: task_route
    label: 选择基线任务
    type: decision
    size: xl
    position:
      x: 2560
      'y': 240
  - id: binary
    label: |-
      是/否二分类器
      每段音频 12 个答案行
      Logistic 输出
    type: process
    size: xl
    position:
      x: 2840
      'y': 80
  - id: binary_variants
    label: |-
      仅二分类使用的标签变体
      未过滤 • 全体一致
      多数投票
    type: document
    size: xl
    position:
      x: 3120
      'y': 80
  - id: multiclass
    label: |-
      其他答案分类器
      每段音频 6 个答案行
      828 类单词
    type: process
    size: xl
    position:
      x: 2840
      'y': 400
  - id: modalities
    label: |-
      模态消融
      音频 + 问题
      仅问题 • 仅音频
    type: process
    size: xl
    position:
      x: 3400
      'y': 240
  - id: metrics
    label: |-
      任务专属指标
      二分类准确率
      多分类 Top-1 / Top-5 / Top-10
    type: document
    size: xl
    position:
      x: 3680
      'y': 240
  - id: report
    label: |-
      ClothoAQA 基线报告
      固定划分与任务变体
      多模态与消融对比
    type: terminal
    size: xl
    position:
      x: 3960
      'y': 240
edges:
  - from: evidence
    to: audio
    type: primary
  - from: audio
    to: question_workers
    type: primary
  - from: question_workers
    to: set_a
    type: primary
  - from: question_workers
    to: set_b
    type: primary
  - from: set_a
    to: screen
    type: primary
  - from: set_b
    to: screen
    type: primary
  - from: screen
    to: answers
    type: primary
  - from: answers
    to: rare_answers
    type: primary
  - from: rare_answers
    to: split_search
    type: primary
  - from: split_search
    to: release
    type: primary
  - from: release
    to: task_route
    type: primary
  - from: task_route
    to: binary
    type: primary
  - from: binary
    to: binary_variants
    type: primary
  - from: binary_variants
    to: modalities
    type: primary
  - from: task_route
    to: multiclass
    type: primary
  - from: multiclass
    to: modalities
    type: primary
  - from: modalities
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
