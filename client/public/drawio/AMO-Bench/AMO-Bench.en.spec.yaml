meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMO-Bench Build and Evaluation Process
  description: >-
    Paper-aligned expert creation, blind quality review, originality checks, human-and-model difficulty filtering,
    answer-type-specific grading, grading QA, and 32-sample aggregation for AMO-Bench.
  legend: >-
    The top row implements the paper's four construction stages. The bottom row routes 39 parser-compatible and 11
    descriptive answers to separate graders before AVG@32 reporting.
nodes:
  - id: experts
    label: |-
      Recruit Mathematics Experts
      Top Universities / Educational Institutions
      MO Award Winners or Experienced Competition Problem Designers
    type: user
    size: xl
    position:
      x: 40
      'y': 100
  - id: create
    label: |-
      Independently Create Original Problems
      Provide the Final Answer
      Also Write a Detailed Step-by-Step Human Solution
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: quality
    label: |-
      Blind Quality Review by ≥3 Experts
      Check Unambiguous Statement and Logical Correctness
      Require Knowledge within MO / IMO Scope
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: originality
    label: |-
      Verify Genuine Originality
      10-Gram Match against Existing Sets including AIME24/25
      Web Search + Expert Memory of Similar Competition Problems
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: difficulty
    label: |-
      Apply the Difficulty Gate
      Human Expert Confirms IMO-Level or Harder
      ≥2 Advanced Models Fail Consistent Solving in 3 Samples Each
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Release 50 AMO-Bench Problems
      Algebra 11 • Functions / Sequences 13 • Geometry 5
      Number Theory 9 • Combinatorics 12
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: sample
    label: |-
      Generate 32 Responses per Model and Problem
      Temperature 1.0 Reasoning / 0.7 Non-Reasoning
      Top-k 50 • Top-p 0.95 • Maximum Available Length
    type: process
    size: xl
    position:
      x: 1440
      'y': 470
  - id: route
    label: Answer Type?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 470
  - id: parser
    label: |-
      Parser Grading for 39 Problems
      Numerical • Set • Variable Expression
      math-verify Equivalence; 4-Decimal Precision / Variable Substitution
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: llm_judge
    label: |-
      LLM Grading for 11 Descriptive Problems
      o4-mini (Low) Evaluates Semantic Correctness
      Majority Vote across 5 Independent Judge Samples
    type: process
    size: xl
    position:
      x: 880
      'y': 580
  - id: correctness
    label: |-
      Per-Response Correctness
      Merge Parser and LLM-Judge Outcomes
      Manual Post-Processing Review during Preliminary Evaluation
    type: process
    size: xl
    position:
      x: 600
      'y': 470
  - id: report
    label: |-
      AMO-Bench Results
      AVG@32 = Mean Accuracy over 32 Sampled Responses
      Also Analyze Pass@32, Output Length, Categories, and AMO-Bench-P
    type: terminal
    size: xl
    position:
      x: 320
      'y': 360
  - id: validate
    label: |-
      Validate the Hybrid Grader
      Manually Check 1,000 Responses from 10 LLMs
      99.2% Grading Accuracy before Large-Scale Evaluation
    type: user
    size: xl
    position:
      x: 320
      'y': 580
edges:
  - from: experts
    to: create
    type: primary
  - from: create
    to: quality
    type: primary
  - from: quality
    to: originality
    type: primary
  - from: originality
    to: difficulty
    type: primary
  - from: difficulty
    to: release
    type: primary
  - from: release
    to: sample
    type: primary
  - from: sample
    to: route
    type: primary
  - from: route
    to: parser
    type: primary
  - from: route
    to: llm_judge
    type: primary
  - from: parser
    to: correctness
    type: primary
  - from: llm_judge
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
  - from: correctness
    to: validate
    type: primary
modules: []
