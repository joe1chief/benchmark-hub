meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMO-Bench Build and Evaluation Process
  description: >-
    Paper-aligned expert creation, blind quality review, originality checks, human-and-model difficulty filtering,
    answer-type-specific grading, grading QA, and 32-sample aggregation for AMO-Bench.
  legend: >-
    The top row implements the paper's four construction stages. The bottom row routes 39 parser-compatible and 11
    descriptive answers to separate graders before AVG@32 reporting. This figure records what the v1 paper reports:
    originality screening was performed. The official meituan-longcat/AMO-Bench repository later revised Problem 35 and
    reports similarity caveats for Problem 26 and Problems 38/39; those post-release notes do not silently rewrite the
    v1 workflow.
nodes:
  - id: experts
    label: |-
      Recruit Math Experts
      Top Universities / Institutions
      MO Winners or Experienced
      Competition Problem Designers
    type: user
    size: xl
    position:
      x: 40
      'y': 100
  - id: create
    label: |-
      Create Original Problems
      Final Answer
      Detailed Step-by-Step
      Human Solution
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: quality
    label: |-
      Blind Review by ≥3 Experts
      Unambiguous + Correct
      Knowledge within MO / IMO
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: originality
    label: |-
      Verify Originality
      10-Gram Match: Existing Sets
      Includes AIME 2024 / 2025
      Web Search + Expert Memory
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: difficulty
    label: |-
      Apply Difficulty Gate
      Human: IMO-Level or Harder
      ≥2 Advanced Models Fail
      3 Samples per Model
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Release 50 Problems
      Algebra 11 • Func / Seq 13
      Geometry 5 • Number Theory 9
      Combinatorics 12
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: sample
    label: |-
      32 Responses / Model / Problem
      Temp 1.0 Reasoning; 0.7 Other
      Top-k 50 • Top-p 0.95
      Maximum Available Length
    type: process
    size: xl
    position:
      x: 1440
      'y': 470
  - id: route
    label: Answer Type?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 470
  - id: parser
    label: |-
      Parser Grades 39 Problems
      Numerical • Set • Variable Expression
      math-verify Equivalence
      4 Decimals / Variable Substitution
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: llm_judge
    label: |-
      LLM Grades 11 Descriptive
      o4-mini (Low)
      Semantic Correctness
      5-Sample Majority Vote
    type: process
    size: xl
    position:
      x: 880
      'y': 580
  - id: correctness
    label: |-
      Per-Response Correctness
      Merge Parser + Judge
      Manual Preliminary Review
    type: process
    size: xl
    position:
      x: 600
      'y': 470
  - id: report
    label: |-
      AMO-Bench Results
      AVG@32 Mean Accuracy
      Pass@32 • Output Length
      Categories • AMO-Bench-P
    type: terminal
    size: xl
    position:
      x: 320
      'y': 360
  - id: validate
    label: |-
      Validate Hybrid Grader
      1,000 Responses • 10 LLMs
      99.2% Grading Accuracy
    type: user
    size: xl
    position:
      x: 320
      'y': 580
edges:
  - from: experts
    to: create
    type: primary
  - from: create
    to: quality
    type: primary
  - from: quality
    to: originality
    type: primary
  - from: originality
    to: difficulty
    type: primary
  - from: difficulty
    to: release
    type: primary
  - from: release
    to: sample
    type: primary
  - from: sample
    to: route
    type: primary
  - from: route
    to: parser
    type: primary
  - from: route
    to: llm_judge
    type: primary
  - from: parser
    to: correctness
    type: primary
  - from: llm_judge
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
  - from: correctness
    to: validate
    type: primary
modules: []
