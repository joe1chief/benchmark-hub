    type: primary
  - from: system
    to: adversarial
    type: primary
  - from: adversarial
    to: rubrics
    type: primary
  - from: rubrics
    to: dataset
    type: primary
  - from: dataset
    to: response
    type: primary
  - from: response
    to: verifier
    type: primary
  - from: verifier
    to: strict
    type: primary
  - from: strict
    to: score
    type: primary
  - from: score
