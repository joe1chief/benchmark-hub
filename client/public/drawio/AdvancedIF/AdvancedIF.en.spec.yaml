meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvancedIF Construction and Rubric-Based Evaluation Workflow
  description: >-
    Paper-aligned workflow for expert-authoring adversarial instruction-following dialogs and final-turn rubrics across
    three capability categories, then applying criterion-level o3-mini verification and strict all-criteria scoring.
  legend: >-
    AdvancedIF contains 1,645 human-written dialogs and human-written rubrics. For multi-turn dialogs, rubrics cover
    only the final turn. A dialog receives credit only when the response satisfies every applicable criterion.
nodes:
  - id: scope
    label: |-
      Define Advanced Instruction Following
      Isolate Instruction Execution from Factuality
      Avoid Ambiguous Intentions and Domain Overlap
    type: process
    size: xl
    position:
      x: 40
      'y': 240
  - id: experts
    label: |-
      Recruit Human Expert Annotators
      Manually Author Both Prompts and Rubrics
      One Prompt Targets One Advanced-IF Category
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: category
    label: Which Instruction-Following Category?
    type: decision
    size: xl
    position:
      x: 600
      'y': 240
  - id: complex
    label: |-
      Explicit and Complex IF
      402 Single-Turn Dialogs • 7.44 Criteria on Average
      6+ Tone, Format, Style, Length, Negative,
      Spelling, Structure, or Inter-Conditional Instructions
    type: document
    size: xl
    position:
      x: 880
      'y': 20
  - id: carried
    label: |-
      Multi-Turn Carried Context IF
      736 Dialogs • 7.69 Turns • 6.08 Criteria on Average
      Carry Setup, Scattered Details, and Edits to Final Turn
    type: document
    size: xl
    position:
      x: 880
      'y': 240
  - id: system
    label: |-
      System Prompt Steerability
      507 Dialogs • 11.21 Turns • 9.81 Criteria on Average
      Style, Safety, Product, Voice, and Tool Specifications
    type: document
    size: xl
    position:
      x: 880
      'y': 460
  - id: adversarial
    label: |-
      Collect Prompts Adversarially
      Multi-Turn Annotator Chats with a Provided LLM
      Keep Only Final-Turn Responses that Trigger IF Failure
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: rubrics
    label: |-
      Author the Final-Turn Rubric
      Same Annotator Decomposes Instructions into up to 20
      Clear, Separately Verifiable Binary Criteria
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: dataset
    label: |-
      Release AdvancedIF
      402 + 736 + 507 = 1,645 Dialogs
      Human Prompts • Human Rubrics • Multi-Turn + System
    type: database
    size: xl
    position:
      x: 1720
      'y': 240
  - id: response
    label: |-
      Generate the Model Response
      Use the Full User/System Conversation Context
      Score the Response at the Final Turn
    type: process
    size: xl
    position:
      x: 1720
      'y': 700
  - id: verifier
    label: |-
      Verify Every Criterion Separately
      o3-mini Receives Prompt, Response, and Rubric
      Produce TRUE or FALSE for Each Criterion
    type: process
    size: xl
    position:
      x: 1440
      'y': 700
  - id: strict
    label: |-
      Are All Rubric Criteria TRUE?
      Any Single Failed Requirement Makes the Dialog Fail
    type: decision
    size: xl
    position:
      x: 1160
      'y': 700
  - id: score
    label: |-
      Aggregate Strict Pass Percentages
      ComplexIF (CIF) • Carried Context (CC)
      System Steerability (SS) • Three-Category Average
    type: process
    size: xl
    position:
      x: 880
      'y': 700
  - id: report
    label: |-
      Report Advanced-IF Capability
      Compare Thinking and Minimal-Thinking Models
      Diagnose Single-Turn, Context-Carry, and System Gaps
    type: terminal
    size: xl
    position:
      x: 600
      'y': 700
edges:
  - from: scope
    to: experts
    type: primary
  - from: experts
    to: category
    type: primary
  - from: category
