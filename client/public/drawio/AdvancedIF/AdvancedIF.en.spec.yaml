meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvancedIF Build Process
  description: Paper-aligned construction and strict rubric evaluation from arXiv:2511.10507v2 Sections 3.1-3.2 and Table 1.
  legend: >-
    Carried-context and system-steerability examples use category-specific annotator-LLM multi-turn dialogues; complex
    single-turn examples go directly to final-turn failure filtering. Rubrics pass multiple human review rounds before
    release.
nodes:
