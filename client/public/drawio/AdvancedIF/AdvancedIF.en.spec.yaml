    label: |-
      Define Advanced IF Scope
      Separate IF from Factuality
      Exclude Ambiguous Intent
    type: process
    size: xl
    position:
      x: 40
      'y': 240
  - id: experts
    label: |-
      Recruit Expert Annotators
      Human Prompts and Rubrics
      One Category per Prompt
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: category
    label: Select IF Category
    type: decision
    size: xl
    position:
      x: 600
      'y': 240
  - id: complex
    label: |-
      Complex Single-Turn IF
      402 Dialogs
      At Least 6 Constraints
    type: document
    size: xl
    position:
      x: 880
      'y': 20
  - id: carried
    label: |-
      Carried-Context IF
      736 Dialogs • 7.69 Turns
      Setup, Details, and Edits
    type: document
    size: xl
    position:
      x: 880
      'y': 240
  - id: system
    label: |-
      System-Prompt Steerability
      507 Dialogs • 11.21 Turns
      Style, Safety, Voice, Tools
    type: document
    size: xl
    position:
      x: 880
      'y': 460
  - id: carried_dialogue
    label: |-
      Run Annotator-LLM Dialogue
      Multi-Turn Interaction
      Carry Context to Final Turn
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: system_dialogue
    label: |-
      Run System-Prompt Dialogue
      Annotator and LLM Multi-Turn
      507/507 Have at Least 4 Turns
    type: process
    size: xl
    position:
      x: 1160
      'y': 460
  - id: final_response
    label: |-
      Collect Provided LLM Response
      Full category-specific context
      Inspect the final turn
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: failure_gate
    label: |-
      Final-Turn IF Failure?
      Retain Only Failures
      in the Target Category
    type: decision
    size: xl
    position:
      x: 1720
      'y': 240
  - id: discard
    label: |-
      Exclude Non-Failure Prompt
      Not an IF Failure
      Do Not Add to Release
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 460
  - id: rubrics
    label: |-
      Author Final-Turn Rubric
      Same Annotator • Up to 20
      Binary Verifiable Criteria
    type: process
    size: xl
    position:
      x: 2000
      'y': 240
  - id: ordering_note
    label: |-
      Criterion Ordering
      Construction order not disclosed
    type: document
    size: xl
    position:
      x: 2000
      'y': 20
  - id: human_review
    label: |-
      Multiple Human Review Rounds
      Review rubric criteria only
      Revise criteria before release
    type: user
    size: xl
    position:
      x: 2280
      'y': 240
  - id: dataset
    label: |-
      Release AdvancedIF
      402 + 736 + 507 = 1,645
      Human Dialogs and Rubrics
    type: database
    size: xl
    position:
      x: 2560
      'y': 240
  - id: response
    label: |-
      Generate Model Response
      Use Full Conversation Context
      Score the Final Turn
    type: process
    size: xl
    position:
      x: 2560
      'y': 700
  - id: verifier
    label: |-
      Verify Every Criterion
      o3-mini Judges TRUE or FALSE
      Conversation context + prompt
      Response + rubric criterion
    type: process
    size: xl
    position:
      x: 2000
      'y': 700
  - id: strict
    label: |-
      All Criteria TRUE?
      One Failure Fails the Dialog
    type: decision
    size: xl
    position:
      x: 1720
      'y': 700
  - id: failed_dialog
    label: |-
      Record Failed Dialog
      At Least One Criterion FALSE
      Include in Pass-Rate Denominator
    type: document
    size: xl
    position:
      x: 1720
      'y': 860
  - id: score
    label: |-
      Aggregate Strict Pass Rate
      CIF • CC • SS
      Three-Category Average
    type: process
    size: xl
    position:
      x: 1440
      'y': 700
  - id: report
    label: |-
      Report Advanced IF Results
      Compare Model Settings
      Diagnose Category Gaps
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 700
