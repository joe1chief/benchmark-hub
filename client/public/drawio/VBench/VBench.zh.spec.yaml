meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VBench 构建与评测流程
  description: >-
    VBench将文生视频质量拆成16个层次化、解耦维度，覆盖视频质量与条件一致性。作者为每个维度设计跨内容类别的针对性提示套件，并匹配专用自动指标。候选视频模型使用同一组提示生成结果。人工标注员依据维度特定说明比较生成视频，同时忽略无关质量，形成偏好数据，用于验证各自动指标与人类感知的一致性。VBench按维度与内容类别报告细粒度分数，并给出总体质量与语义得分，以揭示模型优劣势。
  legend: 来源：VBench arXiv:2311.17982, Sections 3-5; official Vchitect/VBench repository。实线箭头表示论文或官方资料明确支持的主流程。
