meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AI2 Reasoning Challenge Construction and Evaluation Workflow
  description: >-
    Paper-aligned question filtering, independently built optional corpus, corpus checks, dataset splits, and fractional
    multiple-choice scoring.
  legend: >-
    IR and PMI run in parallel on the Waterloo corpus. Challenge contains only questions both filters miss. The ARC
    Corpus is an optional independent retrieval resource, not a derivative of the question dataset.
nodes:
  - id: question_sources
    label: |-
      Standardized Science Exam Sources
      Grades 3–9 • Non-Diagram MCQ
      Releasable Boards + Content Partner
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: assemble
    label: |-
      Assemble Natural Questions
      7,787 Items
      Usually Four Answer Choices
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: ir
    label: |-
      Waterloo IR Filter
      5×10¹⁰-Token Web Corpus
      Question + Each Answer Option
      Top Retrieved-Sentence Score
    type: process
    size: xl
    position:
      x: 600
      'y': 0
  - id: pmi
    label: |-
      Waterloo PMI Filter
      Uni • Bi • Tri • Skip-Bigrams
      Average Association Score
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: challenge_gate
    label: Both Filters Wrong?
    type: decision
    size: xl
    position:
      x: 880
      'y': 110
  - id: challenge
    label: |-
      ARC Challenge
      2,590 Questions
    type: database
    size: xl
    position:
      x: 1160
      'y': 0
  - id: easy
    label: |-
      ARC Easy
      5,197 Questions
    type: database
    size: xl
    position:
      x: 1160
      'y': 220
  - id: splits
    label: |-
      Train / Dev / Test Splits
      Challenge 1,119 / 299 / 1,172
      Easy 2,251 / 570 / 2,376
    type: document
    size: xl
    position:
      x: 1440
      'y': 110
  - id: question_release
    label: |-
      Release ARC Questions
      Easy + Challenge = 7,787
    type: document
    size: xl
    position:
      x: 1720
      'y': 110
  - id: predict
    label: |-
      Predict Answer Choice
      Corpus Use Is Optional
      Systems May Use Other Resources
    type: process
    size: xl
    position:
      x: 2000
      'y': 110
  - id: score
    label: |-
      Fractional Multiple-Choice Score
      1 Point for Correct Choice
      1/k for Tie Including Correct
    type: process
    size: xl
    position:
      x: 2280
      'y': 110
  - id: report
    label: |-
      Report Mean Percentage
      Challenge and Easy Separately
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 110
  - id: corpus_queries
    label: |-
      Design Corpus Searches
      ~100 Hand-Written Templates
      80 Science Topics
    type: document
    size: xl
    position:
      x: 40
      'y': 650
  - id: web_documents
    label: |-
      Retrieve Top Web Documents
      Instantiate Topic Templates
    type: process
    size: xl
    position:
      x: 320
      'y': 650
  - id: corpus_filter
    label: |-
      Deduplicate Documents
      Remove Repeated Pages
    type: process
    size: xl
    position:
      x: 600
      'y': 650
  - id: text_extract
    label: |-
      Strip Documents to Text
      Retain Textual Content
    type: process
    size: xl
    position:
      x: 880
      'y': 650
  - id: sentence_split
    label: |-
      Split Text into Sentences
      Build Sentence-Level Units
    type: process
    size: xl
    position:
      x: 1160
      'y': 650
  - id: aristomini
    label: |-
      AristoMini Corpus
      Wiktionary • Simple Wikipedia
      Additional Science Sentences
    type: database
    size: xl
    position:
      x: 1160
      'y': 870
  - id: corpus_merge
    label: |-
      Add AristoMini
      Merge Sentence Sources
    type: process
    size: xl
    position:
      x: 1440
      'y': 690
  - id: corpus_qc
    label: |-
      Informal Corpus Checks
      805 Docs: ~75% Science-Relevant
      99.8% Question Vocabulary
      ~95% Sampled Knowledge Coverage
    type: user
    size: xl
    position:
      x: 1720
      'y': 690
  - id: corpus
    label: |-
      Optional ARC Corpus
      14M Science Sentences
      1.4GB Text
    type: database
    size: xl
    position:
      x: 2000
      'y': 690
