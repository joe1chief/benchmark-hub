meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AI2 Reasoning Challenge Construction and Evaluation
  description: >-
    Paper-aligned workflow for collecting natural science exam questions, using two simple solvers to define the Easy
    and Challenge sets, building the supporting ARC Corpus, and evaluating public baselines.
  legend: >-
    Challenge membership is algorithmic: a question must be missed by both the Waterloo-corpus retrieval solver and the
    PMI word-co-occurrence solver. The optional 14M-sentence ARC Corpus supports research but does not alter the
    Easy/Challenge assignment.
nodes:
  - id: source
    label: |-
      Collect Public-Domain Science Exam Questions
      Human-Authored for Grades 3–9
      Natural • Non-Diagram • Usually Four Choices
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: normalize
    label: |-
      Normalize the ARC Question Set
      Standardize Stem, Options, and Correct Choice
      Retain 7,787 Questions
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: ir
    label: |-
      Run Retrieval Baseline
      Search the Waterloo Web Corpus
      Score Candidate Answers from Retrieved Text
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: pmi
    label: |-
      Run PMI Co-Occurrence Baseline
      Measure Question–Answer Word Association
      Predict the Highest-Scoring Option
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: gate
    label: Did Both Simple Solvers Answer Incorrectly?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 100
  - id: challenge
    label: |-
      ARC Challenge Set
      Both Solvers Failed • 2,590 Questions
      Train / Dev / Test = 1,119 / 299 / 1,172
    type: database
    size: xl
    position:
      x: 1160
      'y': 310
  - id: easy
    label: |-
      ARC Easy Set
      At Least One Solver Succeeded • 5,197 Questions
      Train / Dev / Test = 2,251 / 570 / 2,376
    type: database
    size: xl
    position:
      x: 1440
      'y': 310
  - id: package
    label: |-
      Release the ARC Question Package
      Easy + Challenge = 7,787
      Preserve Multiple-Choice Labels and Splits
    type: document
    size: xl
    position:
      x: 1300
      'y': 560
  - id: corpus
    label: |-
      Build the Optional ARC Corpus
      ~100 Hand-Written Queries over 80 Science Topics
      AristoMini Filtering → 14M Science Sentences
    type: database
    size: xl
    position:
      x: 1020
      'y': 560
  - id: baselines
    label: |-
      Evaluate Public Baselines on Challenge
      IR • PMI • BiDAF • DecompAttn • DGEM
      Compare with Random Choice
    type: process
    size: xl
    position:
      x: 740
      'y': 560
  - id: score
    label: |-
      Score Multiple-Choice Accuracy
      One Point for the Correct Option
      Fractional Credit When a Solver Ties Choices
    type: process
    size: xl
    position:
      x: 460
      'y': 560
  - id: publish
    label: |-
      Publish ARC Resources
      Question Sets + 14M-Sentence Corpus
      Baseline Implementations + Leaderboard
    type: terminal
    size: xl
    position:
      x: 180
      'y': 560
edges:
  - from: source
    to: normalize
    type: primary
  - from: normalize
    to: ir
    type: primary
  - from: ir
    to: pmi
    type: primary
  - from: pmi
    to: gate
    type: primary
  - from: gate
    to: challenge
    type: primary
  - from: gate
    to: easy
    type: primary
  - from: challenge
    to: package
    type: primary
    waypoints:
      - x: 1260
        'y': 500
      - x: 1400
        'y': 500
  - from: easy
    to: package
    type: primary
    waypoints:
      - x: 1540
        'y': 520
      - x: 1400
        'y': 520
  - from: package
    to: corpus
    type: primary
  - from: corpus
    to: baselines
    type: data
  - from: baselines
    to: score
    type: primary
  - from: score
    to: publish
    type: primary
modules: []
