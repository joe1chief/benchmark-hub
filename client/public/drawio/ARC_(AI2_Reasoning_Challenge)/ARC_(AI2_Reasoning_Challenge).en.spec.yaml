  title: AI2 Reasoning Challenge Build Process
  description: Paper-aligned construction of the ARC question sets and the independently built optional ARC Corpus.
  legend: >-
    IR and PMI run in parallel. Challenge contains only questions both solvers miss. The corpus is an optional retrieval
    resource and is not derived from the question dataset.
