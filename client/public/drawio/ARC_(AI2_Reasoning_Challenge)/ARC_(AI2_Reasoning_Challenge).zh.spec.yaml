meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AI2 推理挑战集构建流程
  description: 对齐论文的 ARC 问题集构建流程，以及独立构建的可选 ARC Corpus 流程。
  legend: IR 与 PMI 并行运行；只有两者均答错的问题进入 Challenge。语料库是可选检索资源，不由问题集派生。
nodes:
  - id: question_sources
    label: |-
      公版科学考试题
      3–9 年级 • 无图表选择题
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: normalize
    label: |-
      规范化问题
      保留 7,787 题
    type: process
    size: xl
    position:
      x: 280
      'y': 80
  - id: ir
    label: |-
      Waterloo IR 求解器
      检索文本并为答案打分
    type: process
    size: xl
    position:
      x: 520
      'y': 0
  - id: pmi
    label: |-
      PMI 求解器
      计算词共现分数
    type: process
    size: xl
    position:
      x: 520
      'y': 200
  - id: challenge_gate
    label: 两个求解器都答错？
    type: decision
    size: xl
    position:
      x: 760
      'y': 100
  - id: challenge
    label: |-
      ARC Challenge
      2,590 题
    type: database
    size: xl
    position:
      x: 1000
      'y': 0
  - id: easy
    label: |-
      ARC Easy
      5,197 题
    type: database
    size: xl
    position:
      x: 1000
      'y': 200
  - id: question_release
    label: |-
      发布 ARC 问题集
      Easy + Challenge = 7,787
    type: document
    size: xl
    position:
      x: 1240
      'y': 100
  - id: corpus_queries
    label: |-
      设计语料检索
      约 100 个模板，覆盖 80 个主题
    type: document
    size: xl
    position:
      x: 40
      'y': 520
  - id: web_documents
    label: |-
      检索网页文档
      按主题检索网页
    type: process
    size: xl
    position:
      x: 280
      'y': 520
  - id: corpus_filter
    label: |-
      文档去重
      删除重复网页
    type: process
    size: xl
    position:
      x: 520
      'y': 520
  - id: text_extract
    label: |-
      提取文本
      保留文档文本内容
    type: process
    size: xl
    position:
      x: 760
      'y': 520
  - id: sentence_split
    label: |-
      切分为句子
      构造句子级语料单元
    type: process
    size: xl
    position:
      x: 1000
      'y': 520
  - id: aristomini
    label: |-
      AristoMini 语料
      补充科学文本
    type: database
    size: xl
    position:
      x: 1000
      'y': 720
  - id: corpus_merge
    label: |-
      加入 AristoMini 语料
      合并句子来源
    type: process
    size: xl
    position:
      x: 1240
      'y': 560
  - id: corpus
    label: |-
      可选 ARC Corpus
      1400 万科学句子
    type: database
    size: xl
    position:
      x: 1480
      'y': 560
  - id: publish
    label: |-
      公开 ARC 资源
      问题集 + 可选语料库
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 320
edges:
  - from: question_sources
    to: normalize
    type: primary
  - from: normalize
    to: ir
    type: primary
  - from: normalize
    to: pmi
    type: primary
  - from: ir
    to: challenge_gate
    type: primary
  - from: pmi
    to: challenge_gate
    type: primary
  - from: challenge_gate
    to: challenge
    type: primary
    label: 两者均答错
  - from: challenge_gate
    to: easy
    type: primary
    label: 其他情况
  - from: challenge
    to: question_release
    type: primary
  - from: easy
    to: question_release
    type: primary
  - from: corpus_queries
    to: web_documents
    type: primary
  - from: web_documents
    to: corpus_filter
    type: primary
  - from: corpus_filter
    to: text_extract
    type: primary
  - from: text_extract
    to: sentence_split
    type: primary
  - from: sentence_split
    to: corpus_merge
    type: primary
  - from: aristomini
    to: corpus_merge
    type: data
  - from: corpus_merge
    to: corpus
    type: primary
  - from: question_release
    to: publish
    type: primary
  - from: corpus
    to: publish
    type: optional
modules: []
