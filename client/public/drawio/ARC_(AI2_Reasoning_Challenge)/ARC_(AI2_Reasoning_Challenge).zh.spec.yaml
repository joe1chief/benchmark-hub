meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AI2 推理挑战集构建与评测流程
  description: 对齐论文的自然科学考试题收集、双简单求解器划分 Easy/Challenge、配套 ARC Corpus 构建与公开基线评测流程。
  legend: Challenge 集由算法门禁定义：题目必须同时被 Waterloo 语料检索求解器和 PMI 词共现求解器答错。 可选的 1400 万句 ARC Corpus 用于研究支持，但不改变 Easy/Challenge 归属。
nodes:
  - id: source
    label: |-
      收集公版科学考试题
      面向 3–9 年级、由人类命制
      自然题面 • 无图表 • 通常四选一
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: normalize
    label: |-
      规范化 ARC 题集
      统一题干、选项与正确答案
      保留 7,787 题
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: ir
    label: |-
      运行检索基线
      搜索 Waterloo Web Corpus
      依据检索文本为候选答案打分
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: pmi
    label: |-
      运行 PMI 词共现基线
      衡量问题词与答案词关联
      预测得分最高选项
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: gate
    label: 两个简单求解器是否都答错？
    type: decision
    size: xl
    position:
      x: 1160
      'y': 100
  - id: challenge
    label: |-
      ARC Challenge 集
      两个求解器均失败 • 2,590 题
      训练 / 开发 / 测试 = 1,119 / 299 / 1,172
    type: database
    size: xl
    position:
      x: 1160
      'y': 310
  - id: easy
    label: |-
      ARC Easy 集
      至少一个求解器成功 • 5,197 题
      训练 / 开发 / 测试 = 2,251 / 570 / 2,376
    type: database
    size: xl
    position:
      x: 1440
      'y': 310
  - id: package
    label: |-
      发布 ARC 问题包
      Easy + Challenge = 7,787
      保留选择题标签与数据划分
    type: document
    size: xl
    position:
      x: 1300
      'y': 560
  - id: corpus
    label: |-
      构建可选 ARC Corpus
      约 100 个手写查询覆盖 80 个科学主题
      AristoMini 过滤 → 1400 万科学句子
    type: database
    size: xl
    position:
      x: 1020
      'y': 560
  - id: baselines
    label: |-
      在 Challenge 集评测公开基线
      IR • PMI • BiDAF • DecompAttn • DGEM
      与随机选择比较
    type: process
    size: xl
    position:
      x: 740
      'y': 560
  - id: score
    label: |-
      计算选择题准确率
      正确选项得 1 分
      求解器并列选择时给分数比例
    type: process
    size: xl
    position:
      x: 460
      'y': 560
  - id: publish
    label: |-
      公开 ARC 资源
      题集 + 1400 万句语料库
      基线实现 + 排行榜
    type: terminal
    size: xl
    position:
      x: 180
      'y': 560
edges:
  - from: source
    to: normalize
    type: primary
  - from: normalize
    to: ir
    type: primary
  - from: ir
    to: pmi
    type: primary
  - from: pmi
    to: gate
    type: primary
  - from: gate
    to: challenge
    type: primary
  - from: gate
    to: easy
    type: primary
  - from: challenge
    to: package
    type: primary
    waypoints:
      - x: 1260
        'y': 500
      - x: 1400
        'y': 500
  - from: easy
    to: package
    type: primary
    waypoints:
      - x: 1540
        'y': 520
      - x: 1400
        'y': 520
  - from: package
    to: corpus
    type: primary
  - from: corpus
    to: baselines
    type: data
  - from: baselines
    to: score
    type: primary
  - from: score
    to: publish
    type: primary
modules: []
