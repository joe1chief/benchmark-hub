meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MM-BrowseComp Paper-v1 Construction, Release, and Evaluation
  description: >-
    Evidence-bounded reconstruction from arXiv:2508.13186v1, the first public data-and-code commit
    5f5298cd0e84ac511ad1cda3840cef73773661cc, and current audit commit cf82a2390aa7a7ed3d96f72969d22548eff3e101; the
    paper's 224-question benchmark is kept separate from the later 400-question expansion.
  legend: >-
    Solid arrows are the paper-v1 construction, Pass@1 evaluation, parsing, and scoring path. Dotted arrows isolate
    post-paper version drift, 16-run test-time scaling, public-release boundaries, and source-code caveats.
nodes:
  - id: b1
    label: |-
      B1 · Evidence + Version Pin
      Paper v1 · 2025-08-14
      Public Data + Code @ 5f5298c
      No Paper-time Commit · +6 Days
      Current Audit @ cf82a23
    type: document
    module: build
    size: xl
    position:
      x: 40
      'y': 192
  - id: b2
    label: |-
      B2 · Coverage + Expert Team
      22 Subtasks · 5 Broad Categories
      >20 Master's / PhD Researchers
      2–3 Aligned Subtasks per Expert
      Multiple Authors + Gold Example
    type: user
    module: build
    size: xl
    position:
      x: 320
      'y': 192
  - id: b3
    label: |-
      B3 · Reverse-construct Questions
      Start from a Known Verified Fact
      Use the Most Authoritative Sources
      Engineer a Question toward It
      Concise, Verifiable Gold Answer
    type: process
    module: build
    size: xl
    position:
      x: 600
      'y': 192
  - id: b4
    label: |-
      B4 · Mandatory Multimodality
      Essential Evidence Is Visual
      Missing from All Text Sources
      Search Web Images or Videos
      No Text-only Shortcut
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 192
  - id: b5
    label: |-
      B5 · Irreducible Checklist
      One Checklist per Question
      Minimal Sequential Search Path
      Every Step Is Indispensable
      Full Path Derives the Gold Answer
    type: document
    module: build
    size: xl
    position:
      x: 1160
      'y': 192
  - id: b6
    label: |-
      B6 · Two-gate Failure Screen
      Gemini-2.5-Pro / GPT-4o
      Web ×1 Each · Both Fail
      New Annotator · Web ≤5 min
      Still Unresolved
    type: process
    module: build
    size: xl
    position:
      x: 1440
      'y': 192
  - id: b7
    label: |-
      B7 · Unique + Stable Answer
      Search for Alternative Valid Answers
      Use OpenAI Deep Research
      Tighten Constraints until Unique
      Add a Time Constraint if Needed
    type: process
    module: build
    size: xl
    position:
      x: 1720
      'y': 192
  - id: q1
    label: |-
      Q1 · Phase 1 Pilot + Calibration
      3 Items per Subtask / Annotator
      Follow the Gold Example
      Core Review + Detailed Feedback
      Align before Full Construction
    type: process
    module: release
    size: xl
    position:
      x: 1720
      'y': 688
  - id: q2
    label: |-
      Q2 · Phase 2 Full Construction
      Build Remaining Instances
      Core-team Secondary Review
      Feedback + Revision Cycle
    type: process
    module: release
    size: xl
    position:
      x: 1440
      'y': 688
  - id: q3
    label: |-
      Q3 · Dependency Filter
      No-browser Agent Fails Checklist
      Keep Search-dependent Only
    type: process
    module: release
    size: xl
    position:
      x: 1160
      'y': 688
  - id: q4
    label: |-
      Q4 · Final Factual Verification
      Recheck Question + Gold Answer
      Recheck Sources + Every Check
      Confirm Unique, Static Answer
    type: process
    module: release
    size: xl
    position:
      x: 880
      'y': 688
  - id: q5
    label: |-
      Q5 · Resolve 300 Candidates
      161 Accepted · 53.7%
      63 Revised · 21.0%
      76 Discarded · 25.3%
      Paper-v1 Final = 224
    type: process
    module: release
    size: xl
    position:
      x: 600
      'y': 688
  - id: r1
    label: |-
      R1 · First Public File · 224 IDs
      22 Subtasks · 5 Categories · 11 Fields
      id/category/subtask/level
      question/answer/checklist/checklist_property
      images/source/canary · Paper 57%; File 130/224 (58.0%)
    type: database
    module: release
    size: xl
    position:
      x: 320
      'y': 688
  - id: r2
    label: |-
      R2 · Partly Public Boundary
      Public: Encrypted Data + Assets
      Question / Answer / Checklist Encrypted
      No Decrypted Plaintext Online
      MIT Badge; No LICENSE in Tree
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 688
  - id: e1
    label: |-
      E1 · Decrypt the JSONL
      Per-row canary Is Password
      SHA-256 Key + XOR + Base64
      Decode question / answer / checklist
      Error → Warn + Keep Original Line
    type: process
    module: evaluate
    size: xl
    position:
      x: 40
      'y': 1120
  - id: e2
    label: |-
      E2 · Build Evaluation Query
      Universal Paper Wrapper
      Answer + Give a Solution Roadmap
      Append Benchmark Question
      Baseline Fetches Prompt Images
    type: document
    module: evaluate
    size: xl
    position:
      x: 320
      'y': 1120
  - id: e3
    label: |-
      E3 · Evaluation Routes
      Tool-free · 224
      Official · 224 · Three Services
      Pro / Flash / o3
      Open-source · 54
      Subtask-uniform · Cost-limited
    type: process
    module: evaluate
    size: xl
    position:
      x: 600
      'y': 1120
  - id: e4
    label: |-
      E4 · Browse + Multimodal Reason
      Search Engine + Web Browser
      Reverse-image Search if Supported
      Analyze Images / Videos / PDFs
      Visual Evidence + Multi-hop Search
    type: process
    module: evaluate
    size: xl
    position:
      x: 880
      'y': 1120
  - id: e5
    label: |-
      E5 · Paper Pass@1 Contract
      Tool-free: temp 1 · top_p 1
      Official UI: 2025-06-06 to 06-10
      New Clean Chat per Query
      Record First Complete Response
    type: process
    module: evaluate
    size: xl
    position:
      x: 1160
      'y': 1120
  - id: e6
    label: |-
      E6 · Structured GPT-4o Judge
      Fixed GPT-4o-2024-11-20
      Question + Gold + Checks + Model Answer
      No Original Images in Judge Input
      Judge Last 25,000 Characters
    type: process
    module: evaluate
    size: xl
    position:
      x: 1440
      'y': 1120
  - id: e7
    label: |-
      E7 · Parse Three-line Contract
      CHECKLIST_SCORE: c/t
      CHECKLIST_RESULT: [0,1,…]
      OVERALL_CORRECTNESS: YES/NO
      Only Missing OVERALL → parser_error
    type: process
    module: evaluate
    size: xl
    position:
      x: 1720
      'y': 1120
  - id: m1
    label: |-
      M1 · Persist Per-item Result
      Raw Judge Output + Parsed YES/NO
      Parsed c / t + 0–1 Vector
      Checklist Score = c/t if t > 0
      One JSON per Evaluated ID
    type: database
    module: score
    size: xl
    position:
      x: 1720
      'y': 1536
  - id: m2
    label: |-
      M2 · Convert to Item Signals
      OA Item: OVERALL = YES
      SA Item: YES and c = t with t > 0
      AVG CS Item: Numeric c/t
      Vector Stored · Not Aggregated
    type: formula
    module: score
    size: xl
    position:
      x: 1440
      'y': 1536
  - id: m3
    label: |-
      M3 · Released-script Aggregation
      This Run Only · 2-decimal Output
      Pre-judge / --skip_evaluated: Excluded
      Judge Failure Still in OA / SA Denom
      AVG CS Denom: Numeric c/t Only
    type: process
    module: score
    size: xl
    position:
      x: 1160
      'y': 1536
  - id: m4
    label: |-
      M4 · Paper Metric Definitions
      OA = Correct Answers / Questions
      SA = Correct + All Checks / Qs
      AVG CS = Mean Checklist Completion
      Keep 224 and 54 Results Separate
    type: formula
    module: score
    size: xl
    position:
      x: 880
      'y': 1536
  - id: m5
    label: |-
      M5 · Report Paper-v1 Pass@1
      Table 1 · One Attempt
      Best Tool-enabled Agent: o3
      OA 29.02% · SA 19.64%
      AVG CS 36.49%
    type: terminal
    module: score
    size: xl
    position:
      x: 600
      'y': 1536
  - id: a1
    label: |-
      A1 · Post-paper Drift · Excluded
      2025-09-22: Re-encrypt 224
      2026-01-04 @ cf82a23: 400 File
      Retain 224 IDs + Add 176 IDs
      README Overview Still Says 224
    type: document
    module: audit
    size: xl
    position:
      x: 40
      'y': 1984
  - id: a2
    label: |-
      A2 · Reproduction Gaps
      No Exact Aug-14 Artifact Commit
      Aug-20 Scripts ≠ Table 1 Harness
      54-subset IDs / Seed Not Released
      Conclusion 244; Body + Data 224
    type: document
    module: audit
    size: xl
    position:
      x: 520
      'y': 1984
  - id: a3
    label: |-
      A3 · Separate 16-run TTS
      QwQ-32B + Qwen2.5-VL-72B
      16 Independent Runs per Question
      Majority / Weighted / Best-of-N
      OA Up · SA Marginal · Not Pass@1
    type: process
    module: audit
    size: xl
    position:
      x: 1000
      'y': 1984
  - id: a4
    label: |-
      A4 · Implementation Caveats
      Failed Image Download Is Skipped
      Judge Flag Does Not Add Images
      Missing c/t May Not Flag Parse Error
      Judge Failure Still Counts in OA / SA
    type: document
    module: audit
    size: xl
    position:
      x: 1480
      'y': 1984
