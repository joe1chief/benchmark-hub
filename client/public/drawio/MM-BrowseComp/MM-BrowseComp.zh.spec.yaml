meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MM-BrowseComp 构建流程
  description: 按论文重建由专家编写的 224 道多模态网页浏览题及 22 个子任务，包含不可约核对清单与三阶段验证。
  legend: 上排展示问题编写，下排展示验证、筛选、发布及采用答案与清单指标的 Pass@1 评测。
nodes:
  - id: taxonomy
    label: |-
      定义 22 个浏览子任务
      媒体 · 技术 · 社会
      地理 · 学术
      要求多模态网页研究
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: experts
    label: |-
      分配专家标注员
      超过 20 名 AI 研究人员
      每人负责两至三个匹配子任务
      提供黄金示例
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: invert
    label: |-
      采用反向问题构造
      从已知可验证事实出发
      检索权威来源
      迭代至答案唯一
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: multimodal
    label: |-
      强制多模态依赖
      必要证据主要为视觉内容
      纯文本来源不含该证据
      使用网页图像或视频
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: quality
    label: |-
      强制难度与时间稳定性
      搜索增强强模型仍难回答
      人工五分钟检索仍不可靠
      答案简洁稳定且可核验
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: checklist
    label: |-
      编写经验证的核对清单
      最小不可约证据步骤
      保留顺序推理路径
      支持过程级诊断
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: pilot
    label: |-
      阶段一 · 试点与校准
      每个子任务先做三题
      核心团队审查示例
      对齐质量标准
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: full
    label: |-
      阶段二 · 全量构建
      完成其余问题
      核心团队二次审查
      根据反馈修订
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: verify
    label: |-
      阶段三 · 最终验证
      检查工具依赖性
      复核事实与来源
      确认答案唯一性
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: filter
    label: |-
      处理 300 个候选题
      直接接受 161 · 修订 63
      丢弃 76 个无效题
      最终保留 224 题
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: release
    label: |-
      汇总 MM-BrowseComp
      224 道题 · 22 个子任务
      57% 的题面包含图像
      每题均需多模态浏览
    type: database
    size: xl
    position:
      x: 300
      'y': 420
  - id: evaluate
    label: |-
      以 Pass@1 评测智能体
      整体准确率 · 最终答案
      严格准确率 · 全清单通过
      平均清单得分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: taxonomy
    to: experts
    type: primary
  - from: experts
    to: invert
    type: primary
  - from: invert
    to: multimodal
    type: primary
  - from: multimodal
    to: quality
    type: primary
  - from: quality
    to: checklist
    type: primary
  - from: checklist
    to: pilot
    type: primary
  - from: pilot
    to: full
    type: primary
  - from: full
    to: verify
    type: primary
  - from: verify
    to: filter
    type: primary
  - from: filter
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
modules: []
