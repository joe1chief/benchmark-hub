meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MM-BrowseComp 论文 v1 构建、发布与评测流程
  description: >-
    依据 arXiv:2508.13186v1、首次公开数据与代码提交 5f5298cd0e84ac511ad1cda3840cef73773661cc 和当前审计提交
    cf82a2390aa7a7ed3d96f72969d22548eff3e101 重建；论文的 224 题基准与后续 400 题扩展严格分层。
  legend: 实线表示论文 v1 的构题、Pass@1 评测、解析与计分主流程；虚线隔离论文后版本漂移、16 次测试时扩展、公开发布边界和源码实现注意项。
nodes:
  - id: b1
    label: |-
      B1 · 证据与版本钉住
      论文 v1 · 2025-08-14
      公开数据与代码 @ 5f5298c
      无论文时点提交 · 延后 6 天
      当前审计 @ cf82a23
    type: document
    module: build
    size: xl
    position:
      x: 40
      'y': 192
  - id: b2
    label: |-
      B2 · 覆盖范围与专家团队
      22 个子任务 · 5 个大类
      超过 20 名硕士或博士研究人员
      每位专家负责 2–3 个匹配子任务
      多人编写并提供黄金示例
    type: user
    module: build
    size: xl
    position:
      x: 320
      'y': 192
  - id: b3
    label: |-
      B3 · 依据来源反向构题
      从已知可核验事实出发
      使用最权威的信息来源
      围绕该事实设计问题
      黄金答案简短且易核验
    type: process
    module: build
    size: xl
    position:
      x: 600
      'y': 192
  - id: b4
    label: |-
      B4 · 强制多模态依赖
      必要证据存在于视觉模态
      所有文本来源均不含该证据
      检索网页图像或视频
      消除纯文本捷径
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 192
  - id: b5
    label: |-
      B5 · 不可约核对清单
      每个问题配一份清单
      最小顺序搜索路径
      每一步均不可缺少
      完整路径可推出黄金答案
    type: document
    module: build
    size: xl
    position:
      x: 1160
      'y': 192
  - id: b6
    label: |-
      B6 · 双门失败筛选
      Gemini-2.5-Pro / GPT-4o
      各联网 1 次 · 均失败
      陌生标注员 · 联网 ≤5 分钟
      仍未解决
    type: process
    module: build
    size: xl
    position:
      x: 1440
      'y': 192
  - id: b7
    label: |-
      B7 · 唯一且稳定的答案
      主动搜索其他有效答案
      使用 OpenAI Deep Research
      收紧约束直至答案唯一
      必要时加入时间限制
    type: process
    module: build
    size: xl
    position:
      x: 1720
      'y': 192
  - id: q1
    label: |-
      Q1 · 阶段一：试点与校准
      每位标注员每个子任务做 3 题
      参照黄金示例
      核心团队审查并给出详细反馈
      全量构建前统一标准
    type: process
    module: release
    size: xl
    position:
      x: 1720
      'y': 688
  - id: q2
    label: |-
      Q2 · 阶段二：全量构建
      完成其余数据实例
      核心团队二次审查
      再次反馈并修订
    type: process
    module: release
    size: xl
    position:
      x: 1440
      'y': 688
  - id: q3
    label: |-
      Q3 · 依赖筛选
      无浏览 Agent
      清单失败 · 仅留检索依赖题
    type: process
    module: release
    size: xl
    position:
      x: 1160
      'y': 688
  - id: q4
    label: |-
      Q4 · 最终事实核验
      复核问题与黄金答案
      复核来源与每条清单
      确认答案唯一且稳定
    type: process
    module: release
    size: xl
    position:
      x: 880
      'y': 688
  - id: q5
    label: |-
      Q5 · 处理 300 个候选题
      接受 161 题 · 53.7%
      修订 63 题 · 21.0%
      丢弃 76 题 · 25.3%
      论文 v1 最终 = 224 题
    type: process
    module: release
    size: xl
    position:
      x: 600
      'y': 688
  - id: r1
    label: |-
      R1 · 首次公开文件 · 224 ID
      22 子任务 · 5 大类 · 11 字段
      id/category/subtask/level
      question/answer/checklist/checklist_property
      images/source/canary · 论文 57%；文件 130/224（58.0%）
    type: database
    module: release
    size: xl
    position:
      x: 320
      'y': 688
  - id: r2
    label: |-
      R2 · 部分公开边界
      公开：加密数据与配套资产
      问题 / 答案 / 清单均加密
      不得在网上公开解密明文
      MIT 徽章；固定树无 LICENSE
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 688
  - id: e1
    label: |-
      E1 · 解密 JSONL
      每行 canary 用作密码
      SHA-256 / XOR / Base64
      解密 question / answer / checklist
      出错 → 告警并保留原始行
    type: process
    module: evaluate
    size: xl
    position:
      x: 40
      'y': 1120
  - id: e2
    label: |-
      E2 · 构造评测查询
      论文通用包装提示
      回答并给出求解路线图
      再附加基准问题
      基线脚本拉取题面图像
    type: document
    module: evaluate
    size: xl
    position:
      x: 320
      'y': 1120
  - id: e3
    label: |-
      E3 · 评测路线
      无工具 · 224
      官方 3 个服务 · 224
      Pro / Flash / o3
      开源 · 54
      按子任务均匀抽样 · 成本限制
    type: process
    module: evaluate
    size: xl
    position:
      x: 600
      'y': 1120
  - id: e4
    label: |-
      E4 · 浏览并进行多模态推理
      搜索引擎与网页浏览器
      支持时使用反向图像搜索
      分析图像、视频与 PDF
      结合视觉证据与多跳检索
    type: process
    module: evaluate
    size: xl
    position:
      x: 880
      'y': 1120
  - id: e5
    label: |-
      E5 · 论文 Pass@1 合同
      无工具：temp 1 · top_p 1
      官方网页端：2025-06-06 至 06-10
      每题使用新的空白会话
      记录第一份完整回答
    type: process
    module: evaluate
    size: xl
    position:
      x: 1160
      'y': 1120
  - id: e6
    label: |-
      E6 · 结构化 GPT-4o 裁判
      固定 GPT-4o-2024-11-20
      问题 + 黄金答案 + 清单 + 模型回答
      裁判输入不含原始图像
      只裁判末尾 25,000 字符
    type: process
    module: evaluate
    size: xl
    position:
      x: 1440
      'y': 1120
  - id: e7
    label: |-
      E7 · 解析裁判三行合同
      CHECKLIST_SCORE: c/t
      CHECKLIST_RESULT: [0,1,…]
      OVERALL_CORRECTNESS: YES/NO
      仅缺少 OVERALL → parser_error
    type: process
    module: evaluate
    size: xl
    position:
      x: 1720
      'y': 1120
  - id: m1
    label: |-
      M1 · 保存逐题结果
      原始裁判输出 + 解析的 YES/NO
      解析后的 c / t 与 0–1 向量
      t > 0 时清单得分 = c/t
      每个被评 ID 保存一个 JSON
    type: database
    module: score
    size: xl
    position:
      x: 1720
      'y': 1536
  - id: m2
    label: |-
      M2 · 转换为逐题信号
      OA：OVERALL = YES
      SA：YES 且 c=t>0
      AVG CS：数值 c/t
      向量保存但不参与聚合
    type: formula
    module: score
    size: xl
    position:
      x: 1440
      'y': 1536
  - id: m3
    label: |-
      M3 · 发布脚本聚合
      仅本次运行 · 输出保留 2 位
      裁判前失败 / --skip_evaluated：排除
      裁判失败仍计入 OA / SA 分母
      AVG CS 分母：仅含数值 c/t
    type: process
    module: score
    size: xl
    position:
      x: 1160
      'y': 1536
  - id: m4
    label: |-
      M4 · 论文指标定义
      OA = 最终答案正确数 / 题数
      SA = 答案正确且清单全过 / 题数
      AVG CS = 清单完成率的平均值
      224 题与 54 题结果分开
    type: formula
    module: score
    size: xl
    position:
      x: 880
      'y': 1536
  - id: m5
    label: |-
      M5 · 报告论文 v1 Pass@1
      表 1 · 每题尝试一次
      最佳联网智能体：o3
      OA 29.02% · SA 19.64%
      AVG CS 36.49%
    type: terminal
    module: score
    size: xl
    position:
      x: 600
      'y': 1536
  - id: a1
    label: |-
      A1 · 论文后漂移 · 排除
      2025-09-22：重加密 224 题
      cf82a23 · 2026-01-04：400 题
      保留 224 个 ID + 新增 176 个
      README 概览仍写 224 题
    type: document
    module: audit
    size: xl
    position:
      x: 40
      'y': 1984
  - id: a2
    label: |-
      A2 · 复现缺口
      无 8 月 14 日精确产物提交
      8 月 20 日脚本 ≠ 表 1 工具链
      未发布 54 题子集 ID 与种子
      结论 244；正文与数据 224
    type: document
    module: audit
    size: xl
    position:
      x: 520
      'y': 1984
  - id: a3
    label: |-
      A3 · 独立的 16 次测试时扩展
      QwQ-32B + Qwen2.5-VL-72B
      每题独立运行 16 次
      多数 / 加权 / Best-of-N
      OA 提升 · SA 小幅 · 非 Pass@1
    type: process
    module: audit
    size: xl
    position:
      x: 1000
      'y': 1984
  - id: a4
    label: |-
      A4 · 发布实现注意项
      图像下载失败时只跳过图像
      裁判标志不会加入图像
      缺少 c/t 不一定报解析错误
      裁判失败仍计入 OA / SA
    type: document
    module: audit
    size: xl
    position:
      x: 1480
      'y': 1984
