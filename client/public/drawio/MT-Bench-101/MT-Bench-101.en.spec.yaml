    to: invalid_policy
    type: optional
    label: No bracketed integer
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: dialogue_minimum
    to: task_mean
    type: primary
  - from: task_mean
    to: paper_average
    type: primary
  - from: paper_average
    to: report
    type: primary
  - from: judge
    to: human_validation
    type: optional
  - from: human_validation
    to: report
    type: optional
  - from: invalid_policy
    to: implementation_boundary
    type: optional
  - from: task_mean
    to: implementation_boundary
    type: optional
modules: []
