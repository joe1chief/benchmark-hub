meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MT-Bench-101 Build and Evaluation Process
  description: >-
    Paper-, dataset-, and evaluator-pinned construction of MT-Bench-101 from dialogue-derived abilities through
    unanimous curation, golden-context judging, parser failure handling, and the paper's hierarchical aggregation.
  legend: >-
    Solid arrows show the documented construction or evaluation path; dotted arrows mark evidence, audit, validation, or
    implementation boundaries. Paper protocol and behavior at the pinned OpenCompass revision are labeled separately.
nodes:
  - id: evidence
    label: |-
      Evidence and Version Pins
      Paper 2402.14762v3
      Dataset repo bc18b3e2
      OpenCompass fork da7b1c3a
      JSONL SHA-256 1a1e433a…d80
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: dialogue_sources
    label: |-
      Derive Fine-grained Abilities
      Inspect ShareGPT and RealChat
      Study Human–LLM Dialogues
      Add Educational Psychology
    type: database
    size: xl
    position:
      x: 320
      'y': 280
  - id: taxonomy
    label: |-
      Three-tier Ability Taxonomy
      Perceptivity · Adaptability · Interactivity
      Memory · Understanding · Interference
      Rephrasing · Reflection · Reasoning · Questioning
    type: process
    size: xl
    position:
      x: 600
      'y': 280
  - id: task_catalog
    label: |-
      Define 13 Third-level Tasks
      CM · AR · SI · TS · CC · CR · FR
      SC · SA · MR · GR · IC · PI
      30 Topics · At Least 10 per Task
    type: document
    size: xl
    position:
      x: 880
      'y': 280
  - id: generation_prompts
    label: |-
      Build Task-specific GPT-4 Prompts
      Uniform Initial Instruction
      Unique Task Rules
      Handcrafted Examples
    type: document
    size: xl
    position:
      x: 1160
      'y': 280
  - id: generate
    label: |-
      Generate Candidate Dialogues
      GPT-4 Produces >1,000 per Task
      Follow the Assigned Ability
      Span the Topic Inventory
    type: process
    size: xl
    position:
      x: 1440
      'y': 280
  - id: screen
    label: |-
      Apply Five Curation Criteria
      Task Rules and Topic Diversity
      Remove Near-duplicates
      Exclude Live/Post-2022 Knowledge
      Reject Errors, Offense, and PII
    type: user
    size: xl
    position:
      x: 1720
      'y': 280
  - id: curation_gate
    label: |-
      Do All Five Annotators
      Approve This Candidate?
    type: decision
    size: xl
    position:
      x: 2000
      'y': 280
  - id: release
    label: |-
      Release MT-Bench-101
      1,388 English Dialogues
      4,208 History Turns · 13 Tasks
      Public · Apache-2.0
    type: database
    size: xl
    position:
      x: 2280
      'y': 120
  - id: discard
    label: |-
      Reject the Candidate
      Any Annotator Can Block Retention
      No Majority-vote Acceptance
      Rejection Counts Not Published
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 480
  - id: release_audit
    label: |-
      Pinned-release Audit
      Schema: task · id · history
      IDs 1–1388 · 2–7 Turns per Dialogue
      Duplicate History: SI 1138 and 1142
    type: document
    size: xl
    position:
      x: 2560
      'y': 20
  - id: turn_gate
    label: |-
      Does the Task Begin Direct
      Evaluation at Turn Two?
    type: decision
    size: xl
    position:
      x: 2560
      'y': 280
  - id: skip_first
    label: |-
      Skip First-turn Evaluation
      FR · CR · AR · SA · SC · CM
      593 Dialogues Lose One Item Each
      Begin with the Second Turn
    type: process
    size: xl
    position:
      x: 2840
      'y': 80
  - id: all_turns
    label: |-
      Evaluate from the First Turn
      CC · GR · IC · MR · PI · SI · TS
      Retain Every Released Turn
      No First-turn Exclusion
    type: process
    size: xl
    position:
      x: 2840
      'y': 480
  - id: evaluation_items
    label: |-
      Construct 3,615 Evaluation Items
      4,208 Turns − 593 First Turns
      Golden Prior History + Current User
      Score Only the Newest Response
    type: database
    size: xl
    position:
      x: 3120
      'y': 280
  - id: candidate_response
    label: |-
      Generate Candidate Response
      Use Curated Golden Context
      Avoid Self-generated History Drift
      Infer the Last Response Only
    type: process
    size: xl
    position:
      x: 3400
      'y': 280
  - id: judge
    label: |-
      Task-specific GPT-4 Judge
      Score 1–10 with a Rationale
      Output Rating: [[score]]
      Paper Temperature = 0.6
    type: process
    size: xl
    position:
      x: 3680
      'y': 280
  - id: judge_drift
    label: |-
      Pinned OpenCompass Boundary
      gpt-4-1106-preview · T = 0.8
      Differs from Paper T = 0.6
      MR/GR Prompt Adds Reference Dialogue
    type: document
    size: xl
    position:
      x: 3680
      'y': 20
  - id: parse_gate
    label: |-
      Does Regex Find a
      Bracketed Integer?
    type: decision
    size: xl
    position:
      x: 3960
      'y': 280
  - id: dialogue_minimum
    label: |-
      Aggregate Parsed Turn Scores
      Dialogue Score = Minimum Turn
      One Failure Lowers Whole Dialogue
      Only Parsed Turns Participate
    type: process
    size: xl
    position:
      x: 4240
      'y': 100
  - id: invalid_policy
    label: |-
      Skip Invalid Judge Output
      No 1–10 Range Check at This Pin
      Empty Dialogue Disappears
      All Invalid Outputs → Assertion
    type: terminal
    size: xl
    position:
      x: 4240
      'y': 500
  - id: task_mean
    label: |-
      Compute Each Task Score
      Unweighted Mean of Dialogue Minima
      One Value for Each of 13 Tasks
      Missing Dialogues Shrink Denominator
    type: process
    size: xl
    position:
      x: 4520
      'y': 100
  - id: paper_average
    label: |-
      Compute Paper “Avg.”
      Macro Mean of 13 Task Scores
      Equal Weight per Task
      Public Summarizer Omits This Value
    type: process
    size: xl
    position:
      x: 4800
      'y': 100
  - id: human_validation
    label: |-
      Validate Automatic Judging
      Random 100 Dialogues · Five Experts
      Majority Human Rating
      87% Auto–Human vs 80% Human Internal
    type: user
    size: xl
    position:
      x: 4520
      'y': 500
  - id: implementation_boundary
    label: |-
      Parser and Reporting Boundary
      Regex Takes First [integer]
      Invalid Outputs Shrink Coverage
      Code Emits Task Scores, Not Avg.
    type: document
    size: xl
    position:
      x: 4800
      'y': 500
  - id: report
    label: |-
      Report Ability Profiles
      Compare 21 LLMs in the Paper
      Analyze Tasks and Dialogue Turns
      Paper Tables, Not a Live Leaderboard
    type: terminal
    size: xl
    position:
      x: 5080
      'y': 280
edges:
  - from: evidence
    to: dialogue_sources
    type: data
  - from: dialogue_sources
    to: taxonomy
