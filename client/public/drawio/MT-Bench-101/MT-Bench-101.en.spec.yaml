  - from: taxonomy
    to: task_catalog
    type: primary
  - from: task_catalog
    to: generation_prompts
    type: primary
  - from: generation_prompts
    to: generate
    type: primary
  - from: generate
    to: screen
    type: primary
  - from: screen
