      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: release
    to: release_audit
    type: optional
  - from: release
    to: turn_gate
    type: primary
  - from: turn_gate
    to: skip_first
    type: primary
    label: Yes, six direct-evaluation tasks
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: turn_gate
    to: all_turns
    type: primary
    label: No, seven all-turn tasks
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: skip_first
    to: evaluation_items
    type: primary
  - from: all_turns
    to: evaluation_items
    type: primary
  - from: evaluation_items
    to: candidate_response
    type: primary
  - from: candidate_response
    to: judge
    type: primary
  - from: judge
    to: judge_drift
