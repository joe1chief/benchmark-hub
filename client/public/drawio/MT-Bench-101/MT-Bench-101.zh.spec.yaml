meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MT-Bench-101 构建流程
  description: 与论文对齐地展示 MT-Bench-101 细粒度多轮对话能力的构建、筛选与评测流程。
  legend: 实线箭头依次表示能力分类、GPT-4 数据生成、五人全票筛选、黄金上下文评测以及最低轮次分数汇总。
nodes:
  - id: evidence
    label: |-
      分析多轮对话
      研究人类与 LLM 交互
      融入教育学洞见
      识别细粒度能力
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      构建三层能力分类
      感知性与适应性
      交互性
      定义 13 个不同任务
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: prompts
    label: |-
      设计任务专属提示
      加入数据生成规则
      加入人工编写示例
      覆盖 30 个多样主题
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: generate
    label: |-
      使用 GPT-4 生成
      每个任务超过 1,000 条
      形成多轮对话
      遵循能力任务合同
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: curation
    label: |-
      五名标注员筛选
      逐条审查候选数据
      必须五人全部通过
      仅保留高质量样本
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: release
    label: |-
      定稿 MT-Bench-101
      1,388 个对话
      4,208 个轮次
      13 个任务与 30 个主题
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: context
    label: |-
      使用黄金对话上下文
      提供人工筛选的历史
      避免模型预测误差累积
      评测当前最新回答
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: responses
    label: |-
      生成候选回答
      使用模型官方对话格式
      保留系统提示
      保持轮次结构
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: judge
    label: |-
      用 GPT-4 逐轮评分
      使用任务专属评测提示
      应用细粒度评分指南
      给出 1–10 分及理由
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: minimum
    label: |-
      汇总整个对话
      取最低轮次分数
      惩罚任一关键失败
      防止上下文抬高分数
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: validation
    label: |-
      验证自动评分
      抽取 100 个对话
      五名专家多数投票
      与人工达到 87% 一致
    type: user
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告能力画像
      比较 21 个 LLM
      按任务与轮次分析
      发布榜单结果
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: evidence
    to: taxonomy
    type: primary
  - from: taxonomy
    to: prompts
    type: primary
  - from: prompts
    to: generate
    type: primary
  - from: generate
    to: curation
    type: primary
  - from: curation
    to: release
    type: primary
  - from: release
    to: context
    type: primary
  - from: context
    to: responses
    type: primary
  - from: responses
    to: judge
    type: primary
  - from: judge
    to: minimum
    type: primary
  - from: minimum
    to: validation
    type: primary
  - from: validation
    to: report
    type: primary
modules: []
