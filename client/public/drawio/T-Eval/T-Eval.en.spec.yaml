meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T-Eval Build and Evaluation Process
  description: >-
    T-Eval decomposes tool utilization into planning, reasoning, retrieval, understanding, invocation, and review. The
    benchmark defines 15 tools across Research, Travel, Entertainment, Web, Life, and Financial domains and supplies
    complete human-written tool documentation. Tools are uniformly sampled, GPT-3.5 generates user queries from shuffled
    documentation and few-shot examples, and GPT-4 refines them. A planner, executor, and reviewer multi-agent annotator
    produces golden thought-action-observation-review trajectories. Humans review and filter 1,500 initial
    instruction-solution pairs twice, retaining 553 golden trajectories that are decomposed into 23,305 step-level test
    cases. Planning compares predicted and golden action sequences with Sentence-BERT similarity, Hopcroft-Karp
    matching, and ordered-sequence matching. Reasoning compares the next thought, retrieval checks the next tool,
    understanding compares parameters, invocation checks tool name and arguments, and review is a five-way
    multiple-choice diagnosis. The six subset scores are averaged for overall process performance; end-to-end win rate
    is also reported in the paper.
  legend: >-
    Source: T-Eval arXiv:2312.14033 Sections 2-4 and Appendices; official open-compass/T-Eval repository. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
