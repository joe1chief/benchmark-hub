meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T-Eval 构建与评测流程
  description: >-
    T-Eval把工具使用分解为规划、推理、检索、理解、调用和复审六种能力。基准在研究、旅行、娱乐、网络、生活和金融领域定义15个工具，并提供完整的人工编写工具文档。作者均匀采样工具，把打乱的文档和少样本示例交给GPT-3.5生成用户查询，再由GPT-4润色。由规划器、执行器和复审器组成的多智能体标注器生成包含思考、动作、观察与复审的黄金轨迹。人工对1500条初始指令-解答对进行两轮复核筛选，保留553条黄金轨迹，再拆解为23305个分步测试用例。规划能力使用Sentence-BERT相似度、Hopcroft-Karp匹配和有序动作序列匹配；推理比较下一步思考，检索检查下一工具，理解比较参数，调用检查工具名和参数，复审则做五类错误诊断选择题。六项子分数平均形成过程总体分，论文另报告端到端胜率。
  legend: >-
    来源：T-Eval arXiv:2312.14033 Sections 2-4 and Appendices; official open-compass/T-Eval
    repository。实线箭头表示论文或官方资料明确支持的主流程。
