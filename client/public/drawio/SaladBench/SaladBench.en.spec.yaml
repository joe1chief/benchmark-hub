meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SaladBench Build and Evaluation Process
  description: >-
    SALAD-Bench defines a three-level taxonomy of six domains, 16 tasks, and 66 categories. Its 21,000-question base set
    combines public benchmarks with self-instruction from GPT-3.5-turbo fine-tuned on about 500 harmful QA pairs. LSH
    and Sentence-BERT remove duplicates, a SafeRLHF reward model filters benign items, and only unanimous labels from
    three open models are kept; three annotators validate a random subset with 94.3% agreement. An attack pipeline
    expands roughly 4,000 low-refusal bases to about 240,000 candidates and retains 5,000 effective attacks. A defense
    pipeline selects 200 hard bases and effective defenses, while about 4,000 MCQs pair safe and unsafe queries and
    responses. MD-Judge and MCQ-Judge then support safety, attack, defense, category, and Elo-style evaluation.
  legend: >-
    Source: SALAD-Bench arXiv:2402.05044 Sections 3-5 and appendices; official OpenSafetyLab/SALAD-BENCH repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
