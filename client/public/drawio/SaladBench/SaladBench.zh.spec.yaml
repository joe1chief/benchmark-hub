meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SaladBench 构建与评测流程
  description: >-
    SALAD-Bench定义由6个领域、16项任务和66个类别组成的三级分类体系。2.1万条基础问题由公开基准与自指令共同构成，后者使用约500组有害问答微调GPT-3.5-turbo。LSH与Sentence-BERT用于去重，SafeRLHF奖励模型过滤良性项目，并只保留3个开源模型一致同意的标签；3位标注者随机抽检的一致率为94.3%。攻击流程把约4000条低拒绝基础问题扩展到约24万候选并保留5000条有效攻击；防御流程选择200条困难基础问题与有效防御；约4000道多选题配对安全和不安全查询及回答。MD-Judge与MCQ-Judge用于安全、攻击、防御、类别和Elo式评测。
  legend: >-
    来源：SALAD-Bench arXiv:2402.05044 Sections 3-5 and appendices; official OpenSafetyLab/SALAD-BENCH
    repository。实线箭头表示论文或官方资料明确支持的主流程。
