meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: K-QA 构建流程
  description: 对齐论文的 K-QA 构建流程：从去标识化 K Health 对话中筛选独立问题，由医生编写细粒度参考答案， 借助 GPT-4 拆分事实陈述，并使用经验证的 NLI 指标评测。
  legend: K-QA 共 1,212 个问题；其中医生参考答案与 statement 级评测子集含 201 个答案，拆为 1,589 条必需或可选陈述。
nodes:
  - id: interactions
    label: |-
      获取真实患者互动
      去标识化 K Health 对话
      来自 1,055 名独立用户
      人工复核隐私泄露
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: prefilter
    label: |-
      自动预筛问题
      BERT 区分问题与陈述
      正则排除账单和物流问题
      保留候选患者问题
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: candidates
    label: |-
      候选池 · 约 26K
      真实消费者健康表达
      含模糊术语与多种病情
      潜在可独立回答问题
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: medical_review
    label: |-
      医疗专业人员复核
      要求问题可独立回答
      不依赖患者既往病史
      标注 ICD-10 病情类别
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: questions
    label: |-
      发布 K-QA 问题 · 1,212 题
      覆盖一百多种医疗状况
      真实世界长答案医学问答
      完整问题集并非都有标准答案
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: answers
    label: |-
      编写 201 个医生答案
      六位医生加资深复核医生
      查阅 UpToDate 与 PubMed
      禁用生成式 AI · 约 400 小时
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: decomposition
    label: |-
      拆分为原子陈述
      另六位医疗医生负责拆分
      GPT-4 少样本建议
      可修改删除或补充缺失事实
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: statements
    label: |-
      产出 1,589 条陈述
      每个医生答案平均 7.9 条
      简洁 · 准确 · 可独立判断
      892 条必需 + 697 条可选
    type: database
    size: xl
    position:
      x: 1700
      'y': 380
  - id: importance
    label: |-
      临床重要性共识
      必需：临床关键内容
      可选：补充信息
      医疗小组协作决策
    type: user
    size: xl
    position:
      x: 1420
      'y': 380
  - id: predict
    label: |-
      生成模型答案
      评测 201 个有参考答案的问题
      可配置模型使用零温度
      可选 ICL 与医疗 RAG 变体
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: nli
    label: |-
      自动 NLI 比较
      模型答案作为前提
      每条标准陈述作为假设
      GPT-4 少样本 CoT：蕴含或矛盾
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: validate
    label: |-
      验证 NLI 裁判
      50 个问答对 · 402 条陈述
      三位医生加多数投票
      Fleiss Kappa 为 0.70
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: metrics
    label: |-
      汇报医学答案质量
      全面性：被蕴含的必需陈述
      幻觉率：与标准事实矛盾的比例
      全面性越高且幻觉率越低越好
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: interactions
    to: prefilter
    type: primary
  - from: prefilter
    to: candidates
    type: primary
  - from: candidates
    to: medical_review
    type: primary
  - from: medical_review
    to: questions
    type: primary
  - from: questions
    to: answers
    type: primary
  - from: answers
    to: decomposition
    type: primary
  - from: decomposition
    to: statements
    type: primary
  - from: statements
    to: importance
    type: primary
  - from: importance
    to: predict
    type: primary
  - from: predict
    to: nli
    type: primary
  - from: nli
    to: validate
    type: primary
  - from: validate
    to: metrics
    type: primary
modules: []
