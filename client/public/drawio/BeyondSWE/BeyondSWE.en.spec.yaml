meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BeyondSWE Build Process
  description: >-
    Paper-aligned four-setting candidate mining, task-specific expert review, agent-assisted environments, repeated
    stability inspection, and clean-container evaluation.
  legend: Read the construction row left-to-right, then the benchmark and independent evaluation row right-to-left.
nodes:
  - id: sources
    label: |-
      Task-Specific Real Sources
      GitHub PRs / External Links / Packages
      New 2025 Repositories and Specifications
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: funnels
    label: |-
      Task-Specific Candidate Funnels
      CrossRepo 3k->800; DomainFix 800->200
      DepMigrate 7k->1k; Doc2Repo 60->50
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: expert
    label: |-
      Task-Specific Expert Review
      Links / Three Domain Experts
      Four SWE Experts / Spec-Test Alignment
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: environment
    label: |-
      Agent-Assisted Docker Construction
      Ubuntu + Pre-PR Repository
      Distill Successful Setup to Dockerfile
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: stability
    label: |-
      Strict Stability Inspection
      Build and Run Relevant Tests 5 Times
      Stable P2P / F2P or Reference Tests
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: quality
    label: |-
      Final Quality Audit
      Five Senior SWE + Five Senior PhDs
      Reject Leakage, Flakiness, Invalid Tests
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      BeyondSWE: 500 / 246 Repositories
      CrossRepo 200 + DomainFix 72
      DepMigrate 178 + Doc2Repo 50
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Agent Task
      Issue + Repository or Specification
      Produce Patch or Complete Repository
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: fresh
    label: |-
      Independent Final Verification
      Apply Changes to Fresh Container
      Restore Tests; Remove Future History
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      Executable Success Contract
      Issue Families: All P2P + F2P Pass
      Doc2Repo: Adapted Complete Test Suite
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Task-Specific Scores
      Issue-Family Resolved Rate
      Doc2Repo Pass Rate + Almost-Correct Count
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: sources
    to: funnels
    type: primary
  - from: funnels
    to: expert
    type: primary
  - from: expert
    to: environment
    type: primary
  - from: environment
    to: stability
    type: primary
  - from: stability
    to: quality
    type: primary
  - from: quality
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: fresh
    type: primary
  - from: fresh
    to: execute
    type: primary
  - from: execute
    to: metrics
    type: primary
modules: []
