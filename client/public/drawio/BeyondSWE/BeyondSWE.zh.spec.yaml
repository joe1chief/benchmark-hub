meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BeyondSWE 构建流程
  description: 基于 arXiv:2603.03194v2，展示四类候选漏斗、Docker 构建、五次稳定性检查、任务专属复核、跨任务审计和纯净容器验证。
  legend: 800 / 200 / 1,000 / 60 是环境构建和稳定性检查后的中间数量；最终任务数在任务专属人工复核后确定。
nodes:
  - id: sources
    label: |-
      各任务候选来源
      PR • 外链 • 依赖升级
      新仓库 • 任务规范
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: crossrepo
    label: |-
      CrossRepo 候选漏斗
      约 3,000 个含外链的合并请求
      需要仓库外部知识
    type: process
    size: xl
    position:
      x: 320
      'y': 20
  - id: domainfix
    label: |-
      DomainFix 候选漏斗
      约 800 个合并请求
      21 个仓库 • 11 个研究领域
    type: process
    size: xl
    position:
      x: 320
      'y': 200
  - id: depmigrate
    label: |-
      DepMigrate 候选漏斗
      LLM 过滤 → 约 7,000 个候选
      23 个发生版本升级的软件包
    type: process
    size: xl
    position:
      x: 320
      'y': 400
  - id: doc2repo
    label: |-
      Doc2Repo 候选漏斗
      2025 年创建的 Python 仓库
      持续活跃 • ≥3 位贡献者 • >20 星
    type: process
    size: xl
    position:
      x: 320
      'y': 560
  - id: task_review
    label: |-
      任务专属人工复核
      外链 • 3 位领域专家
      4 位 SWE • 规范/测试一致性
      保留 200 / 72 / 178 / 50
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: environment
    label: |-
      智能体辅助 Docker 配置
      安装软件包 / 编译器
      将成功命令固化为 Dockerfile
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: stability
    label: |-
      五次稳定性检查
      CrossRepo 800 • DomainFix 200
      DepMigrate 1,000 • Doc2Repo 60
    type: process
    size: xl
    position:
      x: 880
      'y': 300
  - id: swe_audit
    label: |-
      跨任务环境审计
      五位资深软件工程师
      检查环境构建与数据清洗
    type: user
    size: xl
    position:
      x: 1440
      'y': 300
  - id: cross_task_audit
    label: |-
      最终任务质量审计
      五位资深博士研究员
      软件工程与 LLM 专长
    type: user
    size: xl
    position:
      x: 1720
      'y': 300
  - id: dataset
    label: |-
      发布 BeyondSWE
      246 个仓库中的 500 个唯一实例
      CrossRepo 200 • DomainFix 72
      DepMigrate 178 • Doc2Repo 50
    type: database
    size: xl
    position:
      x: 1720
      'y': 760
  - id: input
    label: |-
      智能体评测输入
      Issue 与仓库，或自然语言规范
      提交补丁或完整仓库
    type: document
    size: xl
    position:
      x: 1160
      'y': 760
  - id: fresh
    label: |-
      纯净容器验证
      应用改动 • 恢复测试
      移除未来历史 • 工作区副作用
    type: process
    size: xl
    position:
      x: 880
      'y': 760
  - id: execute
    label: |-
      可执行成功合同
      Issue 类：P2P + F2P 通过
      Doc2Repo：完整适配套件通过
    type: process
    size: xl
    position:
      x: 600
      'y': 760
  - id: metrics
    label: |-
      任务指标
      Resolved Rate（P2P / F2P）
      Doc2Repo Pass + 正确数量
    type: terminal
    size: xl
    position:
      x: 320
      'y': 760
