meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldSense v3 全模态数据构建与准确率评测流程
  description: >-
    WorldSense v3 定义 8 个领域、67 个子类、三层认知、26 个任务以及语音/环境声/音乐三种音频类型。FineVideo 与 MusicAVQA 提供约 8000 个候选视频，经音视频相关性、动态指标和专家审查保留
    1662 个片段。80 名标注员编写必须联合音频与视频作答的四选一题，经专家复核及 Qwen2-VL、Video-LLaMA2、OneLLM 难度回路形成发布口径 3172 道 MCQ。评测用匹配式 A/B/C/D
    抽取、ground truth 准确率及领域/任务分解。
  legend: >-
    来源：WorldSense omnimodal benchmark arXiv:2502.04326v3 (2026-03-01), Sections 3.1-3.3 and 3.5, Table 1 and
    data-statistics appendix; official project https://jaaackhongggg.github.io/WorldSense/, repository
    https://github.com/JaaackHongggg/WorldSense, and dataset https://huggingface.co/datasets/honglyhly/WorldSense. This
    is not unrelated text/synthetic arXiv:2311.15930. Section 3.4 prose says 3,173 questions, while Table 1 and the
    release say 3,172; the diagram uses 3,172 and records the discrepancy as a note. Drift-prone leaderboard results are
    excluded.。实线箭头表示论文或官方资料明确支持的主流程。
