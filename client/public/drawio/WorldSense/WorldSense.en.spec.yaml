meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldSense v3 Omnimodal Dataset Construction and Accuracy Evaluation
  description: >-
    WorldSense v3 defines 8 domains, 67 subcategories, three cognitive tiers, 26 tasks, and speech/environment/music
    audio types. FineVideo and MusicAVQA yield about 8,000 candidates; AV correlation, dynamic metrics, and expert
    review retain 1,662 clips. Eighty annotators write audio-plus-video-dependent four-option questions, with expert
    review and a Qwen2-VL/Video-LLaMA2/OneLLM difficulty loop producing the canonical released count of 3,172 MCQs.
    Evaluation uses matching-based A/B/C/D extraction, ground-truth accuracy, and domain/task breakdowns.
  legend: >-
    Source: WorldSense omnimodal benchmark arXiv:2502.04326v3 (2026-03-01), Sections 3.1-3.3 and 3.5, Table 1 and
    data-statistics appendix; official project https://jaaackhongggg.github.io/WorldSense/, repository
    https://github.com/JaaackHongggg/WorldSense, and dataset https://huggingface.co/datasets/honglyhly/WorldSense. This
    is not unrelated text/synthetic arXiv:2311.15930. Section 3.4 prose says 3,173 questions, while Table 1 and the
    release say 3,172; the diagram uses 3,172 and records the discrepancy as a note. Drift-prone leaderboard results are
    excluded.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
