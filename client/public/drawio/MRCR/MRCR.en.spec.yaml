meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenAI MRCR Build Process
  description: >-
    Official-card-aligned construction of 2,400 synthetic long-context conversations across three needle counts and
    eight token bins, with hash-gated SequenceMatcher scoring.
  legend: >-
    Needles and distractors share the same generation distribution, so the model must recover the requested occurrence
    by order.
nodes:
  - id: schema
    label: |-
      Define Writing Task Space
      438 Distinct Entities
      10 Writing Formats
      Combine Topic and Format
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: responses
    label: |-
      Generate Assistant Responses
      Use GPT-4o for All Responses
      Cover Target and Distractors
      Keep One Shared Distribution
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: conversation
    label: |-
      Build Multi-turn Conversation
      Alternate User and Assistant
      Mix Many Writing Requests
      Form the Long Haystack
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: needles
    label: |-
      Insert Repeated Needles
      Choose 2 · 4 · or 8 Needles
      Repeat an Identical User Ask
      Interleave Same-source Distractors
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: target
    label: |-
      Select Ordered Target
      Choose the i-th Occurrence
      Use One-indexed Position
      Retain Its Assistant Response
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: query
    label: |-
      Append Retrieval Instruction
      Request the i-th Response
      Require Random 10-char Prefix
      Forbid Any Other Text
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: bins
    label: |-
      Measure Prompt plus Answer
      Tokenize Total Context
      Assign Eight Length Bins
      Span 4,096 through 1,048,576
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: sample
    label: |-
      Balance the Dataset
      100 Samples per Length Bin
      Repeat for 2 · 4 · 8 Needles
      Total 3 × 8 × 100
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: release
    label: |-
      Publish OpenAI MRCR
      2,400 Samples
      Keep Prompt · Answer · Prefix
      Store Needle and Length Metadata
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: correction
    label: |-
      Maintain Corrected Release
      Replace Too-many-needle Rows
      Repair Incorrect Ground Truth
      Mark Changes with date_added
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: prefix_gate
    label: |-
      Apply Prefix Gate
      Response Must Start with Prefix
      Missing Prefix Scores Zero
      Otherwise Strip Both Prefixes
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Compute Similarity Score
      Python difflib SequenceMatcher
      Compare Response with Gold Text
      Report Ratio by Bin and Needles
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: schema
    to: responses
    type: primary
  - from: responses
    to: conversation
    type: primary
  - from: conversation
    to: needles
    type: primary
  - from: needles
    to: target
    type: primary
  - from: target
    to: query
    type: primary
  - from: query
    to: bins
    type: primary
  - from: bins
    to: sample
    type: primary
  - from: sample
    to: release
    type: primary
  - from: release
    to: correction
    type: primary
  - from: correction
    to: prefix_gate
    type: primary
  - from: prefix_gate
    to: score
    type: primary
modules: []
