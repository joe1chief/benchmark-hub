meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenAI MRCR Build Process
  description: >-
    MRCR uses 438 entities and ten writing formats to synthesize long multi-turn conversations whose GPT-4o assistant
    responses make target requests indistinguishable from distractors; each example repeats one request 2, 4, or 8 times
    and asks for an indexed response, producing 2,400 examples across eight length bins.
  legend: >-
    Source: OpenAI MRCR dataset card, Motivation, Description, Dataset Construction, Evaluation Criteria, Statistics,
    and Changelog. Solid arrows show the main flow explicitly supported by the paper or official documentation.
nodes:
  - id: schema
    label: |-
      Define Writing Task Space
      438 Distinct Entities
      10 Writing Formats
      Combine Topic and Format
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: responses
    label: |-
      Generate Assistant Responses
      Use GPT-4o for All Responses
      Cover Target and Distractors
      Keep One Shared Distribution
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: conversation
    label: |-
      Build Multi-turn Conversation
      Alternate User and Assistant
      Mix Many Writing Requests
      Form the Long Haystack
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: needles
    label: |-
      Insert Repeated Needles
      Choose 2 · 4 · or 8 Needles
      Repeat an Identical User Ask
      Interleave Same-source Distractors
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: target
    label: |-
      Select Ordered Target
      Choose the i-th Occurrence
      Use One-indexed Position
      Retain Its Assistant Response
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: query
    label: |-
      Append Retrieval Instruction
      Request the i-th Response
      Require Random 10-char Prefix
      Forbid Any Other Text
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: bins
    label: |-
      Measure Prompt plus Answer
      Tokenize Total Context
      Assign Eight Length Bins
      Span 4,096 through 1,048,576
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: sample
    label: |-
      Balance the Dataset
      100 Samples per Length Bin
      Repeat for 2 · 4 · 8 Needles
      Total 3 × 8 × 100
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: release
    label: |-
      Publish OpenAI MRCR
      2,400 Samples
      Keep Prompt · Answer · Prefix
      Store Needle and Length Metadata
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: correction
    label: |-
      Maintain Corrected Release
      Replace Too-many-needle Rows
      Repair Incorrect Ground Truth
      Mark Changes with date_added
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: prefix_gate
    label: |-
      Required Prefix Present?
      Missing Prefix = 0
      Present: Strip Both Prefixes
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Compute Similarity Score
      Python difflib SequenceMatcher
      Compare Response with Gold Text
      Report Ratio by Bin and Needles
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
  - id: prefix_zero
    label: |-
      Required Prefix Missing
      Match Ratio = 0
    type: terminal
    size: xl
    position:
      x: 20
      'y': 720
edges:
  - from: schema
    to: responses
    type: primary
  - from: responses
    to: conversation
    type: primary
  - from: conversation
    to: needles
    type: primary
  - from: needles
    to: target
    type: primary
  - from: target
    to: query
    type: primary
  - from: query
    to: bins
    type: primary
  - from: bins
    to: sample
    type: primary
  - from: sample
    to: release
    type: primary
  - from: release
    to: correction
    type: primary
  - from: correction
    to: prefix_gate
    type: primary
  - from: prefix_gate
    to: score
    type: primary
    label: Present · compare stripped text
    labelPosition: center
  - from: prefix_gate
    to: prefix_zero
    type: optional
    label: Missing · zero
    labelPosition: center
modules: []
