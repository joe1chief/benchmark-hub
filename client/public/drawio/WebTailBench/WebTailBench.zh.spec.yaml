meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WebTailBench 实时任务构建刷新与评测流程
  description: >-
    WebTailBench人工核验609个可完成的真实网页任务，覆盖11类，其中八类为单技能，三类为跨站或组合任务。独立的WebTailBench-Refusals包含111个手工整理的有害任务，覆盖七类安全风险。论文强调高流量真实网站、覆盖度、客观成功条件，以及当外部条件确实不可满足时，智能体正确说明也可获得满分。由于实时网站会漂移，任务需要周期刷新；论文只声明其有效期到2025年11月底。主任务评测使用全新的Playwright会话、100步预算，仅对环境错误最多重试五次，并由o4-mini
    Task Verification评判三次独立运行；报告跨类别宏平均和总体微平均成功率。拒绝集则独立报告安全拒绝率。
  legend: >-
    来源：WebTailBench arXiv:2511.19663, Section 4, Sections 5.1.1, 5.1.3, and 5.4, and Appendix D.1; official dataset
    https://huggingface.co/datasets/microsoft/WebTailBench. Freshness pin: the paper states that the live-site tasks
    were designed to remain valid through the end of November 2025 and require periodic refresh
    thereafter.。实线箭头表示论文或官方资料明确支持的主流程。
