meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WebTailBench Live-Task Build, Refresh, and Evaluation
  description: >-
    WebTailBench manually verifies 609 achievable live-web tasks across 11 categories: eight single-skill categories and
    three multi-site or compositional categories. A separate WebTailBench-Refusals set contains 111 manually curated
    harmful tasks across seven safety categories. The paper emphasizes realistic high-traffic sites, coverage, objective
    success conditions, and full credit when an agent correctly reports an external impossibility. Because live sites
    drift, tasks require periodic refresh; the paper only claims validity through the end of November 2025. Main-task
    evaluation uses fresh Playwright sessions, a 100-step budget, up to five retries only for environment errors, and
    o4-mini Task Verification over three independent runs. It reports category macro and overall micro success rates
    averaged across runs, while the refusal set separately reports safe-refusal rate.
  legend: >-
    Source: WebTailBench arXiv:2511.19663, Section 4, Sections 5.1.1, 5.1.3, and 5.4, and Appendix D.1; official dataset
    https://huggingface.co/datasets/microsoft/WebTailBench. Freshness pin: the paper states that the live-site tasks
    were designed to remain valid through the end of November 2025 and require periodic refresh thereafter.. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
