meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PixMo-Count 构建与评测流程
  description: 依据 Molmo 与 PixMo 论文重绘 Detic 检测、置信度与多样性过滤、对象中心点、 人工核验评测划分、开放数据封装以及直接计数与先指点后计数评测。
  legend: PixMo-Count 是 Ai2 的 PixMo 数据集而非 Gemini Robotics 基准；正式发布划分包含 36,916 条训练记录以及各 540 条验证与测试记录。
nodes:
  - id: step_1
    label: |-
      获取多样网页图像
      从网页托管图像开始
      保留图像 URL
      覆盖不同场景与对象类别
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      运行 Detic 检测器
      使用标准非 VLM 模型
      检测候选对象实例
      不使用 VLM 生成标注
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      应用严格置信度过滤
      移除低置信度检测
      提高自动标签精度
      保留合格实例框
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      为每张图选择一个类别
      取检测实例最多的类别
      使用一个明确计数目标
      记录其对象标签
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      将检测框转为对象中心
      存储 x 与 y 点坐标
      统计所选对象实例数
      保留 0 至 10 的候选计数
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      形成计数问答对
      图像与目标对象类别配对
      以总数作为答案
      保留中心点供训练监督
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      过滤准确性与多样性
      移除不可靠候选项
      减少重复视觉样例
      准备训练池与核验池
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      抽取评测候选项
      覆盖 2 至 10 个对象
      每个计数抽取 120 例
      沿用 CountBenchQA 式验证
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      人工核验评测样例
      检查真实对象数量
      剔除错误检测器标签
      形成可信计数参考答案
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      划分验证集与测试集
      各 540 条人工核验记录
      计数范围保持 2 至 10
      评测记录不含点坐标字段
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      定稿训练集
      发布剩余 36,916 条记录
      计数范围为 0 至 10
      包含对象中心点与类别标签
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      发布开放数据集
      ODC-BY-1.0 研究许可
      URL · SHA-256 · 计数 · 标签 · 点
      按哈希核验下载图像
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      生成计数预测
      提供图像与计数问题
      比较仅输出计数策略
      评估先指点后计数推理
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告计数准确率
      比较预测计数与参考计数
      使用验证集或保留测试集
      分析点顺序策略影响
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: step_1
    to: step_2
    type: primary
  - from: step_2
    to: step_3
