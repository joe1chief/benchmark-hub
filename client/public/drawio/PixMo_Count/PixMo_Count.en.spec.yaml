  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PixMo-Count Build and Evaluation Process
  description: >-
    Molmo and PixMo paper-aligned Detic detection, confidence and diversity filtering, object-center targets,
    human-verified evaluation splits, open dataset packaging, and count versus point-then-count evaluation.
  legend: >-
    PixMo-Count is an Ai2 PixMo dataset, not a Gemini Robotics benchmark; the released splits contain 36,916 training
    records plus 540 validation and 540 test records.
