meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MM-MTBench 构建流程
  description: 按论文重建 92 个一至四轮实用多模态对话及其 GPT-4o 评判流程。
  legend: 每轮使用标准历史答案独立生成，再按正确性与完整性评判，避免前序模型错误传播。
nodes:
  - id: usecases
    label: |-
      选择实用场景
      信息抽取 · 摘要生成
      基于图像的推理
      模拟真实助手使用
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: images
    label: |-
      策展五类图像
      图表 21 · 表格 19
      PDF 页面 24 · 图示 20
      其他 8
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: author
    label: |-
      人工策展对话
      编写图像问题与答案
      保持开放式回答
      确保问题必须看图
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: verify
    label: |-
      验证参考答案
      由第二组标注员复核
      检查抽取信息正确性
      检查要点覆盖完整性
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: conversations
    label: |-
      组织 92 个对话
      69 个单轮 · 18 个两轮
      四个三轮 · 一个四轮
      保留轮次顺序
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      发布 MM-MT-Bench
      92 个多模态对话
      问题与参考答案
      五类实用图像
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: query
    label: |-
      按轮查询模型
      各轮并行独立评测
      提供图像与当前问题
      历史使用标准答案
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: response
    label: |-
      保存候选回答
      保留完整对话历史
      每轮配对参考答案
      不传播前序模型错误
    type: document
    size: xl
    position:
      x: 1140
      'y': 420
  - id: judge
    label: |-
      独立评判每一轮
      论文使用 GPT-4o
      提供完整对话历史
      对比候选与参考答案
    type: user
    size: xl
    position:
      x: 860
      'y': 420
  - id: criteria
    label: |-
      按两项核心标准评分
      抽取内容的正确性
      相对参考答案的完整性
      给出一至十分
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: aggregate
    label: |-
      汇总逐轮评分
      跨对话计算平均值
      得到 MM-MT-Bench 分数
      分数越高越好
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: validate
    label: |-
      验证实用场景一致性
      报告平均评判分
      对照视觉竞技场 ELO
      皮尔逊相关系数 0.91
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: usecases
    to: images
    type: primary
  - from: images
    to: author
    type: primary
  - from: author
    to: verify
    type: primary
  - from: verify
    to: conversations
    type: primary
  - from: conversations
    to: release
    type: primary
  - from: release
    to: query
    type: primary
  - from: query
    to: response
    type: primary
  - from: response
    to: judge
    type: primary
  - from: judge
    to: criteria
    type: primary
  - from: criteria
    to: aggregate
    type: primary
  - from: aggregate
    to: validate
    type: primary
modules: []
