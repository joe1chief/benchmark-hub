meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MM-MT-Bench Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the paper's 92-conversation construction and teacher-forced turn evaluation, then separates the pinned
    Hugging Face release from the behavior of official mistral-evals commit d61811fcd34b7802109538bacc28e70d8633f261.
  legend: >-
    Solid arrows trace the paper-backed construction and the released evaluator's successful execution path. Unconnected
    middle-row cards are independent audit findings. Paper facts are separated from Hugging Face data commit
    0d94c4edef2c971a37c1407a9b99dcdf9003410b and current evaluator behavior wherever they differ.
