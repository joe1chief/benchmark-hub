meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SealQA Build and Evaluation Process
  description: >-
    SealQA is created over eight months by six NLP researchers, who spend more than one hour per question on average.
    They write single-answer questions in five categories: advanced reasoning, disambiguation, temporal tracking,
    cross-lingual search, and false-premise detection. Each item includes supporting web pages, an explanation,
    freshness and expected-search-result labels, and is repeatedly refined until frontier models fail. At least two
    graduate reviewers check URLs, answer correctness, and clarity before expert approval; volatile items receive
    effective years and review dates. Seal-0 contains 111 questions with repeated zero-percent performance from tested
    frontier non-reasoning systems with browsing; Seal-Hard expands to 254. LongSeal pairs each of those 254 questions
    with one gold source and 50 hard negatives. Evaluation uses tool-enabled or search-injected settings, randomizes the
    gold position among 12, 20, or 30 documents for LongSeal, and uses GPT-4o-mini to label answers correct, incorrect,
    or not attempted before reporting accuracy and category breakdowns.
  legend: >-
    Source: SealQA arXiv:2506.01062 Sections 2-4 and Appendices A-C; official vtllms/sealqa dataset. Solid arrows show
    the main flow explicitly supported by the paper or official documentation.
