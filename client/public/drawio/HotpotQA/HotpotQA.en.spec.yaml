      arXiv:1809.09600v1 · §§2-3, 5 · Appendix A
      Official Code 3635853 · hotpot_evaluate_v1.py
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: wiki
    label: |-
      English Wikipedia Dump
      October 1, 2017
      First Paragraphs + Hyperlinks
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: graph
    label: |-
      Directed Hyperlink Graph G
      Edge (a, b): Article a Links to b
      Curate 591 Suitable Bridge Categories B
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: bridge_pairs
    label: |-
      Bridge-question Branch (75%)
      Sample b in B and Edge (a, b)
      Two Paragraphs Linked by a → b
    type: process
    size: xl
    position:
      x: 620
      'y': 80
  - id: comparison_pairs
    label: |-
      Comparison Branch (25%)
      42 Lists of Similar Entities
      50% Yes/No; 50% Span Answer
    type: process
    size: xl
    position:
      x: 620
      'y': 520
  - id: crowd
