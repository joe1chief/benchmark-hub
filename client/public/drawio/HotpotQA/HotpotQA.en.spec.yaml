meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HotpotQA Build Process
  description: >-
    Paper-aligned HotpotQA workflow: an English Wikipedia hyperlink graph seeds bridge and comparison paragraph pairs,
    crowdworkers write multi-hop questions and supporting facts, model-assisted hardness partitioning yields 112,779
    examples, and distractor and full-wiki settings score answers, supporting facts, and joint EM/F1.
  legend: >-
    Solid arrows show the two question-construction branches, hardness processing, benchmark-setting branches, and joint
    evaluation.
nodes:
