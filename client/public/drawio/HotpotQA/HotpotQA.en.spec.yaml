    type: process
    size: xl
    position:
      x: 2080
      'y': 80
  - id: fullwiki
    label: |-
      Full-wiki Setting
      Search First Paragraphs of All Wikipedia Articles
      Gold Paragraphs Not Specified
    type: process
    size: xl
    position:
      x: 2080
      'y': 520
  - id: prediction
    label: |-
      QA System Outputs
      Answer Span / Yes / No
      Supporting Fact Sentence Set
    type: process
    size: xl
    position:
      x: 2380
      'y': 300
  - id: metrics
    label: |-
