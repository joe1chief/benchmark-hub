      112,779 Valid Examples
      Answer Span or Yes / No
      Gold Supporting Sentences
    type: database
    size: xl
    position:
      x: 1220
      'y': 300
  - id: hardness
    label: |-
      Hardness Processing
      Turker Audit: Train-easy 18,089
      3-fold Model: Train-medium 56,814
    type: process
    size: xl
    position:
      x: 1500
      'y': 300
  - id: split
    label: |-
      Remaining Hard Split
      Train-hard 15,661 / Dev 7,405
