meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GENIUS 构建流程
  description: 按论文、数据集与评测代码对齐的 GENIUS 构建与评分流程。
  legend: >-
    证据固定到 arXiv:2602.11144v1、仓库 115338d6 和数据集 a1c68adc。仓库 README 声明 CC-BY-NC 4.0，固定 Hugging Face 卡片声明 MIT；两者均保留。评测器运行 3
    轮评分，且仅对含图像标签的提示计入 VC。
nodes:
  - id: evidence
    label: |-
      证据快照
      论文 2602.11144v1
      仓库 115338d6 · 数据 a1c68adc
      模型推理：未标准化
    type: document
    size: xl
    position:
      x: 40
      'y': 320
  - id: framework
    label: |-
      定义生成式流体智能
      从即时上下文证据适应
      依据 CHC 理论组织
    type: document
    size: xl
    position:
      x: 296
      'y': 320
  - id: implicit
    label: |-
      隐式模式归纳
      86 个样本
      1 类生成任务
      推断未明示的局部规则
    type: process
    size: xl
    position:
      x: 552
      'y': 80
  - id: constraint
    label: |-
      即时约束执行
      213 个样本
      符号 153 · 视觉 60
      执行新给出的局部约束
    type: process
    size: xl
    position:
      x: 552
      'y': 320
  - id: adaptation
    label: |-
      情境知识适应
      211 个样本
      先验冲突 101 · 多语义 110
      覆盖已记忆的先验
    type: process
    size: xl
    position:
      x: 552
      'y': 560
  - id: curate
    label: |-
      专家策划多模态样本
      每种模态都不可缺少
      评测提示交叉验证
      至少经过 3 轮
    type: process
    size: xl
    position:
      x: 808
      'y': 320
  - id: release
    label: |-
      发布 510 个样本
      3 维度 · 5 任务 · 20 子任务
      上下文/编号/指令/RC + 可选 VC
      仓库 CC-BY-NC 4.0 · HF 卡 MIT
    type: database
    size: xl
    position:
      x: 1064
      'y': 320
  - id: outputs
    label: |-
      每个样本提交一张 PNG
      outputs/模型/任务/编号.png
      缺失输出记零分
      未公开生成脚本
    type: process
    size: xl
    position:
      x: 1064
      'y': 720
  - id: judge
    label: |-
      运行 Gemini-3-Pro-preview 评委
      执行 3 轮评分
      每轮 RC/AQ 各一次
      VC 与抄袭检查逐图像提示调用
    type: process
    size: xl
    position:
      x: 808
      'y': 720
  - id: parser
    label: |-
      解析固定指标标签
      解析失败记零分
      3 轮结果取均值后取整
      VC 仅计入含图像标签的提示
    type: process
    size: xl
    position:
      x: 552
      'y': 720
  - id: score
    label: |-
      将 0/1/2 映射为 0/50/100
      对可用指标值求均值
      总分 = 0.6 RC + 0.35 VC
      + 0.05 AQ
    type: terminal
    size: xl
    position:
      x: 296
      'y': 720
edges:
