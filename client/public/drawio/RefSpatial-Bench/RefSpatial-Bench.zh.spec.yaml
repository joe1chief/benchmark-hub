meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RefSpatial-Bench 构建与评测流程
  description: >-
    RefSpatial-Bench是RoboRefer论文引入的留出多步空间指代基准。其上位RefSpatial流程结合过滤后的OpenImages、抽样的CA-1M具身视频帧，以及使用人工筛选Objaverse-LVIS资产生成的Infinigen模拟场景；完整资源含250万样本、2000万问答、31种关系和最长5步推理链。发布的基准分Location、Placement与Unseen组合三部分，每条记录把RGB图像和目标掩码与提示、类别及步数配对。模型返回点坐标元组，评测将坐标与目标区域核对并报告各划分及平均准确率。
  legend: >-
    来源：RoboRefer arXiv:2506.04308 Section 3.3, benchmark and evaluation sections, and appendices, cross-checked against
    BAAI/RefSpatial-Bench。实线箭头表示论文或官方资料明确支持的主流程。
