meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RefSpatial-Bench Build and Evaluation Process
  description: >-
    RefSpatial-Bench is the held-out multi-step spatial-referring benchmark introduced with RoboRefer. Its parent
    RefSpatial pipeline combines filtered OpenImages, sampled CA-1M embodied-video frames, and simulated Infinigen
    scenes using manually screened Objaverse-LVIS assets; the full resource spans 2.5 million samples, 20 million QA
    pairs, 31 relations, and reasoning chains up to five steps. The released benchmark has Location, Placement, and
    Unseen-composition folders, each pairing RGB images and target masks with prompts, category labels, and step counts.
    Models return point-coordinate tuples, which are checked against the target regions and summarized as split and
    average accuracy.
  legend: >-
    Source: RoboRefer arXiv:2506.04308 Section 3.3, benchmark and evaluation sections, and appendices, cross-checked
    against BAAI/RefSpatial-Bench. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
