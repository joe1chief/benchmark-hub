meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HMMT-25 构建流程
  description: 与论文一致的 MathArena HMMT 2025 年 2 月终答题基准构建与评测流程。
  legend: HMMT-25 包含 2025 年 2 月 15 日发布的 30 道终答题。每题四次作答用于估计 pass@1 准确率， 不通过多数投票合并答案。
nodes:
  - id: release
    label: |-
      选择 HMMT 2025 年 2 月赛
      信誉良好且高难度的数学竞赛
      官方发布日期 · 2025 年 2 月 15 日
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: extract
    label: |-
      抽取 30 道终答题
      将题面与答案转换为 LaTeX
      保留题号和数学主题标签
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: verify
    label: |-
      逐题人工核验
      对照官方来源检查错字、不一致
      以及格式问题
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: dataset
    label: |-
      发布 30 行基准数据
      problem_idx · problem · answer
      problem_type · CC BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: prompt
    label: |-
      使用终答题提示词
      要求逐步推理
      最终答案放入 boxed 花括号
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: runs
    label: |-
      每题生成四次回答
      使用模型提供方推荐超参数
      不针对基准额外调参
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: parse
    label: |-
      解析 boxed 最终答案
      将任意 LaTeX 转为 SymPy 结构
      与标准答案做等价性检验
    type: process
    size: xl
    position:
      x: 1840
      'y': 80
  - id: judge
    label: |-
      复核语义等价性
      Gemini-2.5-Flash 评判器
      比较评判器与规则解析结果
    type: process
    size: xl
    position:
      x: 2140
      'y': 80
  - id: manual
    label: |-
      人工检查歧义或告警输出
      过短/截断 · 解析错误 · 推理中含正确答案
      解决分歧并更新解析器
    type: process
    size: xl
    position:
      x: 2440
      'y': 80
  - id: timing
    label: |-
      跟踪数据污染风险
      尽量在竞赛发布附近评测
      标记 2025 年 2 月 15 日后发布的模型
    type: process
    size: xl
    position:
      x: 1840
      'y': 520
  - id: score
    label: |-
      报告 HMMT-25 结果
      四次运行平均的 pass@1 准确率
      分数/排名置信区间与公开回答轨迹
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 300
edges:
  - from: release
    to: extract
    type: primary
  - from: extract
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: prompt
    type: primary
  - from: prompt
    to: runs
    type: primary
  - from: runs
    to: parse
    type: primary
  - from: parse
    to: judge
    type: primary
  - from: judge
    to: manual
    type: primary
  - from: manual
    to: score
    type: primary
  - from: runs
    to: timing
    type: secondary
  - from: timing
    to: score
    type: secondary
modules: []
