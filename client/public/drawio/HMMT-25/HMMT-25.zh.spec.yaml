meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HMMT-25 构建流程
  description: 与论文一致的 MathArena HMMT 2025 年 2 月锦标赛答案型基准构建和评测流程。
  legend: 实线表示论文流程；虚线表示证据、时序控制和官方产物边界。每题四次独立回答用于估计 pass@1， 不做多数投票合并。
nodes:
  - id: evidence
    label: |-
      证据与固定版本
      MathArena · arXiv 2505.23281v3
      代码 462e6f4 · 数据集 6fdc427
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: release
    label: |-
      选择 HMMT 2025 年 2 月锦标赛
      仅限个人赛题
      不含邀请赛/HMIC
      高难度且声誉可靠的数学竞赛
      发布于 2025 年 2 月 15 日
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: extract
    label: |-
      提取 3 场个人赛 × 每场 10 道题
      代数 · 几何 · 组合
      按标准模板统一格式
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: verify
    label: |-
      逐题人工核验
      对照官方来源检查错别字与不一致
      检查题面和答案格式
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: dataset
    label: |-
      发布 30 行数据集
      problem · answer · problem_type
      CC BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: prompt
    label: |-
      使用最终答案提示
      要求逐步推理
      最终答案写入 \boxed{}
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: runs
    label: |-
      每题生成 4 个独立回答
      使用模型提供商推荐超参数
      不针对基准额外调参
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: parse
    label: |-
      规则式最终答案解析器
      任意 LaTeX → SymPy 结构
      与标准答案做等价检查
    type: process
    size: xl
    position:
      x: 1840
      'y': 140
  - id: flags
    label: |-
      GUI 标记待复核输出
      过短或截断 · 解析器错误
      推理轨迹有答案但未成功提取
    type: process
    size: xl
    position:
      x: 2140
      'y': 40
  - id: judge
    label: |-
      Gemini-2.5-Flash 评判器
      审计语义等价性
      与规则解析器结论对比
    type: process
    size: xl
    position:
      x: 2140
      'y': 260
  - id: reconcile
    label: |-
      处理被标记样本
      人工检查每个评判分歧
      更新解析器并做回归测试
    type: process
    size: xl
    position:
      x: 2440
      'y': 140
  - id: timing
    label: |-
      控制数据污染风险
      临近比赛日期进行评测
      标记赛后发布的模型
    type: process
    size: xl
    position:
      x: 1840
      'y': 520
  - id: score
    label: |-
      报告 HMMT-25 结果
      pass@1 = 4 次运行均值 · 不做多数投票
      95% 准确率/排名区间 · 公开回答轨迹
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 140
  - id: artifact_boundary
    label: |-
      官方产物边界
      配置：T=0.6 · 最多 16,000 token
      strict_parsing=false
      数据集版本晚于代码固定点
    type: document
    size: xl
    position:
      x: 3040
      'y': 520
edges:
  - from: evidence
    to: release
    type: data
  - from: release
    to: extract
    type: primary
  - from: extract
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: prompt
    type: primary
  - from: prompt
    to: runs
    type: primary
  - from: runs
    to: parse
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: parse
    to: flags
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: parse
    to: judge
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: flags
    to: reconcile
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: judge
    to: reconcile
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: reconcile
    to: score
    type: primary
  - from: runs
    to: timing
    type: secondary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: timing
    to: score
    type: secondary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.25
      entryY: 1
  - from: score
    to: artifact_boundary
    type: data
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.25
modules: []
