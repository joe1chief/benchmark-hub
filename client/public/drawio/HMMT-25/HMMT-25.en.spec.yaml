meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HMMT-25 Build Process
  description: Paper-aligned MathArena construction and evaluation of the February 2025 HMMT final-answer benchmark.
  legend: >-
    HMMT-25 contains 30 final-answer problems released on 15 February 2025. Four responses per problem estimate pass@1
    accuracy; they are not combined by majority vote.
nodes:
  - id: release
    label: |-
      Select HMMT February 2025
      reputable high-difficulty competition
      official release date · 15 February 2025
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: extract
    label: |-
      Extract 30 final-answer problems
      convert statements and answers to LaTeX
      retain problem index and subject labels
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: verify
    label: |-
      Manually verify every item
      check typographical errors · inconsistencies
      and formatting against official sources
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: dataset
    label: |-
      Publish the 30-row benchmark
      problem_idx · problem · answer
      problem_type · CC BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: prompt
    label: |-
      Use the final-answer prompt
      reason step by step
      put the final answer inside boxed braces
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: runs
    label: |-
      Generate four responses per problem
      provider-recommended hyperparameters
      no benchmark-specific tuning
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: parse
    label: |-
      Parse the boxed final answer
      convert arbitrary LaTeX to SymPy structures
      test equivalence with the gold answer
    type: process
    size: xl
    position:
      x: 1840
      'y': 80
  - id: judge
    label: |-
      Cross-check semantic equivalence
      Gemini-2.5-Flash judge
      compare judge result with rule parser
    type: process
    size: xl
    position:
      x: 2140
      'y': 80
  - id: manual
    label: |-
      Inspect ambiguous or flagged outputs
      short/truncated · parser error · answer in trace
      resolve disagreements and update parser
    type: process
    size: xl
    position:
      x: 2440
      'y': 80
  - id: timing
    label: |-
      Track contamination risk
      evaluate close to the competition date
      flag models released after 15 February 2025
    type: process
    size: xl
    position:
      x: 1840
      'y': 520
  - id: score
    label: |-
      Report HMMT-25 results
      pass@1 accuracy averaged over four runs
      score/rank confidence intervals and public traces
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 300
edges:
  - from: release
    to: extract
    type: primary
  - from: extract
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: prompt
    type: primary
  - from: prompt
    to: runs
    type: primary
  - from: runs
    to: parse
    type: primary
  - from: parse
    to: judge
    type: primary
  - from: judge
    to: manual
    type: primary
  - from: manual
    to: score
    type: primary
  - from: runs
    to: timing
    type: secondary
  - from: timing
    to: score
    type: secondary
modules: []
