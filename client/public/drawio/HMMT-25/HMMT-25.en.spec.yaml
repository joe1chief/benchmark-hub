meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HMMT-25 Build Process
  description: Paper-aligned construction and evaluation of the February 2025 HMMT tournament benchmark in MathArena.
  legend: >-
    The solid path is the paper protocol. Dashed paths show evidence, timing controls, and artifact boundaries. Four
    independent responses estimate pass@1; they are never combined by majority vote.
nodes:
  - id: evidence
    label: |-
      Evidence & fixed revisions
      MathArena · arXiv 2505.23281v3
      code 462e6f4 · dataset 6fdc427
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: release
    label: |-
      Select HMMT February 2025 tournament
      individual tests only
      excludes Invitational/HMIC
      reputable high-difficulty competition
      released 15 February 2025
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: extract
    label: |-
      Extract 3 individual tests × 10 problems
      Algebra · Geometry · Combinatorics
      format in the standardized template
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: verify
    label: |-
      Manually verify every item
      typographical errors · inconsistencies
      formatting against official sources
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: dataset
    label: |-
      Publish the 30-row dataset
      problem · answer · problem_type
      CC BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: prompt
    label: |-
      Use the final-answer prompt
      reason step by step
      place the final answer in \boxed{}
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: runs
    label: |-
      Generate four responses per problem
      provider-recommended hyperparameters
      no benchmark-specific tuning
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: parse
    label: |-
      Rule-based final-answer parser
      arbitrary LaTeX → SymPy structures
      check equivalence with gold answer
    type: process
    size: xl
    position:
      x: 1840
      'y': 140
  - id: flags
    label: |-
      GUI flags outputs for review
      short/truncated · parser error
      answer in reasoning trace, not extracted
    type: process
    size: xl
    position:
      x: 2140
      'y': 40
  - id: judge
    label: |-
      Gemini-2.5-Flash judge
      audit semantic equivalence
      compare with rule-parser decision
    type: process
    size: xl
    position:
      x: 2140
      'y': 260
  - id: reconcile
    label: |-
      Reconcile flagged cases
      manually inspect every disagreement
      update and regression-test the parser
    type: process
    size: xl
    position:
      x: 2440
      'y': 140
  - id: timing
    label: |-
      Control contamination risk
      evaluate close to competition date
      flag models released after the event
    type: process
    size: xl
    position:
      x: 1840
      'y': 520
  - id: score
    label: |-
      Report HMMT-25 results
      pass@1 = mean of four runs · no majority
      95% accuracy/rank CIs · public traces
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 140
  - id: artifact_boundary
    label: |-
      Official-artifact boundary
      config: T=0.6 · max 16,000 tokens
      strict_parsing=false
      dataset revision is later than code pin
    type: document
    size: xl
    position:
      x: 3040
      'y': 520
