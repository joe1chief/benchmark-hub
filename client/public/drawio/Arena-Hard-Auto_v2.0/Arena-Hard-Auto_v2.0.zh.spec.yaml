meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto v2.0 构建流程
  description: 版本分层流程：论文提供 BenchBuilder 骨架，官方仓库补充 v2.0 困难题、创意写作题、裁判和风格控制汇总配置。
  legend: 上方为 500 条困难提示流程，下方为 250 条创意写作提示流程。
nodes:
  - id: source
    label: |-
      Chatbot Arena 新鲜查询
      真实用户提示
    type: database
    size: xl
    position:
      x: 40
      'y': 270
  - id: curate
    label: |-
      BenchBuilder 式筛选
      清洗、聚类、质量过滤
      选择新鲜困难查询
    type: process
    size: xl
    position:
      x: 320
      'y': 270
  - id: hard
    label: |-
      困难提示集
      500 条新鲜开放式查询
      软件、数学等主题
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: creative
    label: |-
      创意写作集
      250 条 Arena 查询
    type: document
    size: xl
    position:
      x: 600
      'y': 440
  - id: hard_answers
    label: |-
      困难集回答
      被测模型对基线模型
      成对 A/B 展示
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: creative_answers
    label: |-
      创意写作回答
      被测模型对基线模型
      成对 A/B 展示
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: hard_judge
    label: |-
      困难题裁判
      官方配置 Gemini-2.5
      可选 GPT-4.1
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: creative_judge
    label: |-
      创意写作双裁判
      GPT-4.1 + Gemini-2.5
      各自独立判定
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: aggregate
    label: |-
      按类别汇总
      困难 / 创意写作胜率
      Bootstrap 置信区间
    type: process
    size: xl
    position:
      x: 1440
      'y': 270
  - id: style
    label: |-
      风格控制得分
      控制 Markdown 与长度
      模型排名 / 榜单
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 270
edges:
  - from: source
    to: curate
    type: primary
  - from: curate
    to: hard
    type: primary
  - from: curate
    to: creative
    type: primary
  - from: hard
    to: hard_answers
    type: primary
  - from: creative
    to: creative_answers
    type: primary
  - from: hard_answers
    to: hard_judge
    type: primary
  - from: creative_answers
    to: creative_judge
    type: primary
  - from: hard_judge
    to: aggregate
    type: primary
  - from: creative_judge
    to: aggregate
    type: primary
  - from: aggregate
    to: style
    type: primary
modules: []
