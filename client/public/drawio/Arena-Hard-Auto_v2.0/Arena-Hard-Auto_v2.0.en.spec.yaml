      Separability + Agreement
      Pair Rank Brier Score
    type: process
    size: xl
    position:
      x: 2000
      'y': 270
  - id: report
    label: |-
      Publish Separate v2 Leaderboards
      Hard: Style-Controlled
      Creative: Judge Ensemble
