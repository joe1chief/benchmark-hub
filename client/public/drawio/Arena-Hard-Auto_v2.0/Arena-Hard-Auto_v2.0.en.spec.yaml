    type: process
    size: xl
    position:
      x: 1440
      'y': 270
  - id: hard_aggregate
    label: |-
      Hard Style-Controlled Ranking
      Markdown + Length Features
      Bradley-Terry + 100 Bootstraps
      5th / 95th Percentile CI
    type: process
    size: xl
    position:
      x: 1720
      'y': 60
  - id: creative_aggregate
    label: |-
      Creative Ensemble Ranking
      Pool Independent Judges
      No Style Control
      100 Bootstraps + 5th / 95th CI
    type: process
    size: xl
    position:
      x: 1720
      'y': 480
  - id: quality
    label: |-
