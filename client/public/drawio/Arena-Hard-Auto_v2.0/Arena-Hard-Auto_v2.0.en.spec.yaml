meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto v2.0 Build Process
  description: >-
    Version-aware pipeline: the paper supplies the BenchBuilder backbone, while the official repository defines the v2.0
    hard-prompt and creative-writing sets, judges, and style-controlled reporting.
  legend: The upper lane is the 500-prompt hard set; the lower lane is the 250-prompt creative-writing set.
nodes:
  - id: source
    label: |-
      Fresh Chatbot Arena Queries
      Real-world User Prompts
    type: database
    size: xl
    position:
      x: 40
      'y': 270
  - id: curate
    label: |-
      BenchBuilder-style Curation
      Clean, Cluster, Quality-filter
      Select Fresh Challenging Queries
    type: process
    size: xl
    position:
      x: 320
      'y': 270
  - id: hard
    label: |-
      Hard Prompt Set
      500 Fresh Open-ended Queries
      Software, Math, and More
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: creative
    label: |-
      Creative-writing Set
      250 Arena Queries
    type: document
    size: xl
    position:
      x: 600
      'y': 440
  - id: hard_answers
    label: |-
      Hard-set Responses
      Evaluated Model vs Baseline
      Pairwise A/B Presentation
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: creative_answers
    label: |-
      Creative-writing Responses
      Evaluated Model vs Baseline
      Pairwise A/B Presentation
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: hard_judge
    label: |-
      Hard-prompt Judge
      Gemini-2.5 Official
      GPT-4.1 Alternative
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: creative_judge
    label: |-
      Creative-writing Ensemble
      GPT-4.1 + Gemini-2.5
      Independent Judgments
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: aggregate
    label: |-
      Category-aware Aggregation
      Hard / Creative Win Rates
      Bootstrap Confidence Intervals
    type: process
    size: xl
    position:
      x: 1440
      'y': 270
  - id: style
    label: |-
      Style-controlled Scores
      Control Markdown + Length
      Model Ranking / Leaderboard
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 270
edges:
  - from: source
    to: curate
    type: primary
  - from: curate
    to: hard
    type: primary
  - from: curate
    to: creative
    type: primary
  - from: hard
    to: hard_answers
    type: primary
  - from: creative
    to: creative_answers
    type: primary
  - from: hard_answers
    to: hard_judge
    type: primary
  - from: creative_answers
    to: creative_judge
    type: primary
  - from: hard_judge
    to: aggregate
    type: primary
  - from: creative_judge
    to: aggregate
    type: primary
  - from: aggregate
    to: style
    type: primary
modules: []
