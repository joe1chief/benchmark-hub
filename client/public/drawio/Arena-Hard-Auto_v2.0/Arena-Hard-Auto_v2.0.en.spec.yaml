    label: |-
      Chatbot Arena Query Pool
      Fresh Real-World User Prompts
      Crowdsourced Open-Ended Data
    type: database
    size: xl
    position:
      x: 40
      'y': 270
  - id: evidence_boundary
    label: |-
      Evidence Boundary
      Paper v2: BenchBuilder Backbone
      Official Repo: v2 Sets + Evaluation
    type: document
    size: xl
    position:
      x: 320
      'y': 270
  - id: hard_prompts
    label: |-
      Hard-Prompt Split
      500 Fresh Challenging Queries
      Software • Math • Real-World
    type: document
    size: xl
    position:
      x: 600
      'y': 60
  - id: creative_prompts
    label: |-
      Creative-Writing Split
      250 Creative Arena Queries
      Separate Evaluation Category
    type: document
    size: xl
    position:
      x: 600
      'y': 480
  - id: hard_answers
    label: |-
      Generate + Cache Hard Answers
      Candidate vs o3-mini Baseline
      Pairwise A/B Order
    type: process
    size: xl
    position:
      x: 880
      'y': 60
  - id: creative_answers
    label: |-
      Generate + Cache Creative Answers
      Candidate vs Gemini-2.0 Baseline
      Pairwise A/B Order
    type: process
    size: xl
    position:
      x: 880
      'y': 480
  - id: hard_judge
    label: |-
      Hard Pairwise Judge
      Gemini-2.5 Official
      GPT-4.1 Alternative
      o3-mini Baseline
    type: process
    size: xl
    position:
      x: 1160
      'y': 60
  - id: creative_judge
    label: |-
      Creative Ensemble Judges
      GPT-4.1 + Gemini-2.5
      Independent Inference
      Gemini-2.0 Baseline
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: hard_judgments
    label: |-
      Parse Hard Judgments
      A>>B • A>B • Tie
      B>A • B>>A
      Cache by Prompt / Model / Judge
    type: database
    size: xl
    position:
      x: 1440
      'y': 60
  - id: creative_judgments
    label: |-
      Pool Creative Judgments
      GPT-4.1 + Gemini-2.5 Records
