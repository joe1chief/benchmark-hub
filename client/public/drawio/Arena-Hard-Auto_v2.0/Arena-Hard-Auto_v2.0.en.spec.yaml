meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto v2.0 Build and Evaluation
  description: >-
    Evidence-bounded workflow: the paper supplies only the BenchBuilder backbone, while the official repository defines
    the two v2.0 categories and their distinct evaluation paths.
  legend: Hard prompts use style control; creative writing uses an independent two-judge ensemble without style control.
nodes:
