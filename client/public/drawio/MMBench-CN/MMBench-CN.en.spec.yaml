meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-CN v1.0 Build Process
  description: >-
    MMBench-CN is the verified Chinese counterpart of the October-2023 v1.0 English release, with the same 1,164 DEV and
    1,784 TEST logical questions. The later 3,217-item CN v1.1 files are retained as a separate version boundary.
  legend: >-
    Solid arrows show source construction, Chinese translation/verification, and evaluation. Dashed arrows attach
    schema, version, label-visibility, or released-code audit facts and do not add questions to the main denominator.
nodes:
  - id: taxonomy
    label: |-
      Three-level taxonomy
      2 L1 / 6 L2
      20 L3 abilities
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      Author seed set
      10–20 MCQs
      per L3 ability
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      Student volunteers
      Internet + public
      validation images
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      English image MCQs
      question + optional hint
      2–4 choices + answer
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      Text-only filter
      LLM consensus
      then human review
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      Wrong-item filter
      all screening VLMs fail
      then human review
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: en_release
    label: |-
      English v1.0 source
      2,948 logical questions
      revised October 2023
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: translate
    label: |-
      GPT-4 translation
      question + choices
      preserve names/symbols/code
    type: process
    size: xl
    position:
      x: 1720
      'y': 280
  - id: verify
    label: |-
      Human verification
      validity + correctness
      item-level alignment
    type: user
    size: xl
    position:
      x: 2000
      'y': 280
  - id: cn_release
    label: |-
      MMBench-CN v1.0
      same images, base IDs,
      categories, and answers
    type: database
    size: xl
    position:
      x: 2280
      'y': 280
  - id: split
    label: |-
      Chinese release
      DEV 1,164 labels open
      TEST 1,784 labels hidden
    type: database
    size: xl
    position:
      x: 2560
      'y': 280
  - id: prompt
    label: |-
      Zero-shot open generation
      image + optional hint
      Chinese question + choices
    type: process
    size: xl
    position:
      x: 2840
      'y': 280
  - id: heuristic
    label: |-
      Choice parsed
      by heuristic?
    type: decision
    size: xl
    position:
      x: 3120
      'y': 120
  - id: gpt
    label: |-
      Chinese choice matcher
      gpt-4-0125
      match option or Z
    type: process
    size: xl
    position:
      x: 3120
      'y': 480
  - id: circular
    label: |-
      CircularEval
      N circular rotations
      all passes must be correct
    type: process
    size: xl
    position:
      x: 3400
      'y': 280
  - id: score
    label: |-
      Logical-item accuracy
      micro overall + L2/L3
      official test submission
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 280
  - id: v11_audit
    label: |-
      Version boundary
      CN v1.1 = 3,217
      separate from this ID
    type: document
    size: xl
    position:
      x: 2280
      'y': 760
  - id: schema_audit
    label: |-
      v1.0 TSV audit
      source/comment retained
      rotations share a base id
    type: document
    size: xl
    position:
      x: 2560
      'y': 760
  - id: code_audit
    label: |-
      Released-code caveat
      3 failed judge retries
      random valid choice or Z
    type: document
    size: xl
    position:
      x: 3680
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: en_release
    type: primary
  - from: wrong_qc
    to: en_release
    type: primary
  - from: en_release
    to: translate
    type: primary
  - from: translate
    to: verify
    type: primary
  - from: verify
    to: cn_release
    type: primary
  - from: cn_release
    to: split
    type: primary
  - from: split
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 'Yes'
  - from: heuristic
    to: gpt
    type: primary
    label: 'No'
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: cn_release
    to: v11_audit
    type: secondary
    style:
      dashed: true
  - from: split
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
