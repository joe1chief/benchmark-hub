meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympiadBench 论文构建与评测合同
  description: 按论文 v2 还原双语多模态竞赛基准的整理流程，并展示固定公开版本中的提示、自动评分、分母与定理证明边界。
  legend: 实线表示构建与评测主流程；虚线表示固定证据及代码/数据发布边界；定理证明保留为单独的人工抽样分支。
nodes:
  - id: evidence
    label: |-
      一手证据
      arXiv v2
      PDF SHA-256 4360149145ef…
      仓库 ba5b26a7e284
      HF 91184b52131e
    type: document
    size: xl
    position:
      x: 20
      'y': -180
  - id: scope
    label: |-
      确定基准范围
      双语多模态科学题
      数学与物理
      竞赛与高考难度
    type: document
    size: xl
    position:
      x: 20
      'y': 80
  - id: sources
    label: |-
      收集三类来源
      全球奥林匹克竞赛
      中国地区及全国
      数学竞赛
      高考模拟题
    type: database
    size: xl
    position:
      x: 260
      'y': 80
  - id: source_select
    label: |-
      选择竞赛及年份
      难度 · 题量 · 公开材料
      语言 · 学科
      尽量扩大年份覆盖
    type: process
    size: xl
    position:
      x: 500
      'y': 80
  - id: ocr
    label: |-
      转换官方 PDF
      使用 Mathpix OCR
      生成 Markdown 文本与公式
      保留内嵌图像
    type: process
    size: xl
    position:
      x: 740
      'y': 80
  - id: verify
    label: |-
      人工比对 PDF
      将转换结果与原始 PDF 对照
      清理并修订错误
      保护科学记号准确性
    type: process
    size: xl
    position:
      x: 980
      'y': 80
  - id: structure
    label: |-
      结构化每条记录
      问题 · 解答 · 答案
      专家级逐步推理
      统一标记格式
    type: document
    size: xl
    position:
      x: 1220
      'y': 80
  - id: dedupe
    label: |-
      向量化并去重
      Laurie/Bloom1b7-deepspeed-
      chat-Chinese-math 向量
      基于余弦相似度
      阈值未披露
    type: process
    size: xl
    position:
      x: 1460
      'y': 80
  - id: annotate
    label: |-
      添加人工标签
      开放题或定理证明题
      子领域 · 学科 · 语言
      模态与难度
    type: process
    size: xl
    position:
      x: 1700
      'y': 80
  - id: progressive
    label: |-
      保留递进式物理题组
      共享物理材料
      相互依赖的子问题
      把材料写入 context 字段
    type: process
    size: xl
    position:
      x: 1940
      'y': 80
  - id: answer_types
    label: |-
      归一化确定答案
      数值 · 表达式 · 方程
      区间 · 元组
      多答案 · 单位 · 误差
    type: process
    size: xl
    position:
      x: 2180
      'y': 80
  - id: release
    label: |-
      固定 8,476 条发布集
      数学 6,142 · 物理 2,334
      英文 2,125 · 中文 6,351
      含图 4,869 · 开放题 6,728
      定理证明题 1,748
    type: database
    size: xl
    position:
      x: 2420
      'y': 80
  - id: prompt
    label: |-
      应用共享零样本提示模板
      插入学科与答案类型
      要求 LaTeX
      最终答案放入方框
      不向模型提供知识标签
    type: process
    size: xl
    position:
      x: 2420
      'y': 420
  - id: eval_gate
    label: |-
      题目类型？
      自动或人工分支
    type: decision
    size: xl
    position:
      x: 2180
      'y': 420
  - id: open_eval
    label: |-
      开放题评测
      共 6,728 道开放题
      具有确定答案类型
      进入自动评分分支
    type: process
    size: xl
    position:
      x: 1940
      'y': 300
  - id: proof_eval
    label: |-
      定理证明题评测
      共 1,748 道定理证明题
      仅做人工抽样评估
      不计算完整自动得分
    type: process
    size: xl
    position:
      x: 1940
      'y': 620
  - id: extract
    label: |-
      提取最终答案
      匹配英文或中文
      最终答案短语
      回退到方框或末行公式
      单独处理 DeepSeek 标记
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: score
    label: |-
      比较结构化答案
      逗号与正负号配对
      默认 1e-8 或逐题误差
      区间 · 表达式 · 方程 · SymPy
    type: process
    size: xl
    position:
      x: 1460
      'y': 300
  - id: denominator
    label: |-
      应用官方统计分母
      跳过定理证明题文件
      排除空值/不可用
      不合适/API 错误回答
      以实际可用回答为分母
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
  - id: report
    label: |-
      报告微平均正确率
      数学与物理分项
      纯文本与多模态切片
      定理证明结果保持独立
    type: terminal
    size: xl
    position:
      x: 980
      'y': 420
  - id: source_boundary
    label: |-
      固定公开版本边界
      仓库 ba5b26a7e284 · 无发布标签
      HF 91184b52131e · 18 个配置
      train 仅为打包标签 · 24 列
      Apache-2.0 · 提示措辞存在漂移
    type: document
    size: xl
    position:
      x: 740
      'y': 420
edges:
  - from: evidence
    to: scope
    type: secondary
    label: 一手来源
    labelPosition: center
    style:
      dashed: true
  - from: scope
    to: sources
    type: primary
  - from: sources
    to: source_select
    type: primary
  - from: source_select
    to: ocr
    type: primary
  - from: ocr
    to: verify
    type: primary
  - from: verify
    to: structure
    type: primary
  - from: structure
    to: dedupe
    type: primary
  - from: dedupe
    to: annotate
    type: primary
  - from: annotate
    to: progressive
    type: primary
  - from: progressive
    to: answer_types
    type: primary
  - from: answer_types
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: eval_gate
    type: primary
  - from: eval_gate
    to: open_eval
    type: primary
    label: 开放题
    labelPosition: center
  - from: eval_gate
    to: proof_eval
    type: primary
    label: 定理证明题
    labelPosition: center
  - from: open_eval
    to: extract
    type: primary
  - from: extract
    to: score
    type: primary
  - from: score
    to: denominator
    type: primary
  - from: denominator
    to: report
    type: primary
  - from: proof_eval
    to: report
    type: primary
    waypoints:
      - x: 1800
        'y': 680
      - x: 1080
        'y': 680
  - from: report
    to: source_boundary
    type: secondary
    style:
      dashed: true
modules: []
