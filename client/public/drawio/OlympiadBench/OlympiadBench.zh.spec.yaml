meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympiadBench 构建与评测流程
  description: 对齐论文整理双语多模态数学与物理竞赛题，保留专家解答，并对确定答案类型执行符号化自动评分。
  legend: 8,476 题中包含 6,728 道开放式问题和 1,748 道定理证明题；自动评分器主要处理具有确定答案的类型。
nodes:
  - id: scope
    label: |-
      确定奥林匹克级范围
      数学与物理
      中文与英文
      文本题与图像题
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      收集官方 PDF
      全球数理奥林匹克竞赛
      中国地区与全国竞赛
      高考及模拟题
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: ocr
    label: |-
      使用 Mathpix 转换 PDF
      识别文本与公式
      生成 Markdown
      保留题目图像
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: verify
    label: |-
      人工核验 OCR
      逐项比对原始 PDF
      清理并修订错误
      保护科学符号准确性
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: structure
    label: |-
      结构化每道题目
      问题 · 解答 · 答案
      保留专家推理步骤
      使用统一标记格式
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: dedupe
    label: |-
      向量化并去重
      使用数学训练小模型
      基于余弦相似度匹配
      移除重复题目
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: labels
    label: |-
      标注主题与题型
      数学和物理子领域
      开放题或定理证明
      执行人工分类
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: progressive
    label: |-
      保留递进式题组
      合并共享材料
      连接依赖子问题
      存储上下文及答案
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: answer_types
    label: |-
      分类确定答案
      数值 · 表达式 · 方程
      区间 · 元组
      记录多答案状态
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布 OlympiadBench
      8,476 题 · 全部带解答
      4,869 题含图像
      开放题 6,728 · 证明题 1,748
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: prompt
    label: |-
      构建双语评测提示
      插入学科与答案类型
      规定输出格式
      支持文本与多模态模型
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: extract
    label: |-
      提取模型最终答案
      归一化方程
      解析区间与元组
      区分数值和符号答案
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      执行自动评分
      数值默认容差 1e-8
      逐元素检查结构化答案
      用 SymPy 判断表达式等价
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告准确率
      汇总数学与物理
      单独分析定理证明题
      保留逐步专家解答
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: sources
    type: primary
  - from: sources
    to: ocr
    type: primary
  - from: ocr
    to: verify
    type: primary
  - from: verify
    to: structure
    type: primary
  - from: structure
    to: dedupe
    type: primary
  - from: dedupe
    to: labels
    type: primary
  - from: labels
    to: progressive
    type: primary
  - from: progressive
    to: answer_types
    type: primary
  - from: answer_types
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: extract
    type: primary
  - from: extract
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
