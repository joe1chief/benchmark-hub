      Remove Repeated Problems
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: labels
    label: |-
      Annotate Topics and Types
      Math and Physics Subfields
      Open-ended or Theorem Proof
      Manual Classification
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: progressive
    label: |-
      Preserve Progressive Problems
      Group Shared Materials
      Link Dependent Subquestions
      Store Context and Answers
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: answer_types
    label: |-
      Classify Definitive Answers
      Numeric · Expression · Equation
      Interval · Tuple
