    label: |-
      Define Olympiad-level Scope
      Mathematics and Physics
      English and Chinese
      Text and Image Problems
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Collect Official PDFs
      Global Math and Physics Olympiads
      Chinese Regional Competitions
      Gaokao and Mock Questions
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: ocr
    label: |-
      Convert PDFs with Mathpix
      Recognize Text and Formulae
      Produce Markdown
      Retain Embedded Images
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: verify
    label: |-
      Manually Verify OCR
      Compare with Original PDFs
      Clean and Revise Errors
      Protect Scientific Notation
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: structure
    label: |-
