meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympiadBench Build and Evaluation Process
  description: >-
    Paper-aligned curation of bilingual multimodal mathematics and physics competition problems with expert solutions
    and symbolic automatic scoring.
  legend: >-
    The 8,476-problem release contains 6,728 open-ended questions and 1,748 theorem-proving problems; the automatic
    scorer targets definitive-answer types.
