    type: primary
  - from: release
    to: prompts
    type: primary
  - from: prompts
    to: settings
    type: primary
  - from: settings
    to: answer
    type: primary
  - from: answer
    to: accuracy
    type: primary
  - from: accuracy
    to: transfer
    type: primary
modules: []
