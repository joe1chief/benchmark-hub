meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLogiQA 构建与评测流程
  description: 对齐 P-MMEval 论文展示如何从 LogiQA 测试集构建含 80 道平行题、覆盖十种语言的逻辑推理基准。
  legend: 英文与中文沿用 LogiQA 原文；GPT-4o 翻译另外八种语言，专业翻译团队逐条纠错和本地化。
nodes:
  - id: goal
    label: |-
      定义平行多语言评测
      逻辑推理任务
      各语言使用一致问题
      衡量跨语言迁移
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: source
    label: |-
      从原始 LogiQA 开始
      英文和中文测试数据
      篇章 · 问题 · 四个选项
      正确答案选项
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: select
    label: |-
      选择测试集前 80 题
      保留原始英文和中文
      固定平行题目身份
      每种语言目标 80 题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: languages
    label: |-
      定义十种语言
      英 · 中 · 阿 · 西 · 日
      韩 · 泰 · 法 · 葡 · 越
      覆盖七个语言家族
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: translate
    label: |-
      翻译另外八种语言
      GPT-4o-2024-05-13
      翻译完整题目结构
      保持选项对应关系
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: review
    label: |-
      开展全量人工复核
      专业翻译团队
      检查含义与自然度
      逐条审核所有译文
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: revise
    label: |-
      纠错并本地化题目
      修正翻译错误
      本地化词汇与表达
      删除不可翻译样本
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: align
    label: |-
      对齐平行记录
      同一篇章 · 问题 · 选项
      保持正确选项一致
      保留各语言文本
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      在 P-MMEval 发布 MLogiQA
      80 道平行问题
      10 个语言配置
      共 800 条实例
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompts
    label: |-
      规范化评测提示
      OpenCompass 与 lm-eval-harness
      英文和母语指令
      固定 JSON 答案格式
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: settings
    label: |-
      运行三种提示设定
      英文提示
      母语提示
      英文少样本提示
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: answer
    label: |-
      请求直接作答
      MLogiQA 不使用思维链
      在 JSON 中返回一个选项
      解析所选答案
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: accuracy
    label: |-
      评分逻辑问答
      选项精确准确率
      按语言与设定报告
      比较平行题表现
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: transfer
    label: |-
      分析跨语言迁移
      计算 CACR
      研究中文源题效应
      报告多语言一致性
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
