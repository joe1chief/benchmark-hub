meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video SimpleQA — 构建与评测流程
  description: >-
    论文以 Wikimedia 每日媒体及百科证据构建多跳视频问答。生成器与批评器最多迭代三轮，专家细化并拆解问题，四个模型共同筛选难度，两名标注员必须同时通过，答案还要接受权威性与安全终审。最终发布 1,079 个视频、1,504
    组最终问答，其中二跳/三跳/四跳分别为 928/469/107 题，并同时提供逐事实子问答。最终多跳题与拆解子题使用同一套 o3 三分类事实性裁判和 F-score 协议，但分别汇报结果以定位各跳错误。
  legend: >-
    来源：arXiv:2503.18923, Sections 3.1-3.3, 4.1-4.2, and Table 4. Construction and evaluation are pinned to the paper
    version represented by this identifier.。实线箭头表示论文或官方资料明确支持的主流程。
