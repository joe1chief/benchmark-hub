meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video SimpleQA — Build and Evaluation Process
  description: >-
    The paper builds multi-hop video QA from Wikimedia Media of the Day and encyclopedic evidence. A generator and
    critic iterate for at most three rounds; experts refine and decompose questions, four models gate difficulty, two
    annotators must both accept, and answers receive a final authority and safety audit. The released set has 1,079
    videos and 1,504 final QA pairs, including 928/469/107 two-/three-/four-hop questions, alongside per-fact sub-QAs.
    The same o3 three-way factuality judge and F-score protocol is applied to final multi-hop QAs and decomposed
    sub-QAs, whose results are reported separately for fine-grained hop analysis.
  legend: >-
    Source: arXiv:2503.18923, Sections 3.1-3.3, 4.1-4.2, and Table 4. Construction and evaluation are pinned to the
    paper version represented by this identifier.. Solid arrows show the main flow explicitly supported by the paper or
    official documentation.
