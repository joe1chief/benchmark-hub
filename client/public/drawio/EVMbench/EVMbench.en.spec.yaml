meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EVMbench Build Process
  description: Paper-aligned construction and evaluation of EVMbench across Detect, Patch, and Exploit modes.
  legend: >-
    Solid arrows follow the EVMbench paper from public audit findings through security-expert quality control, isolated
    environments, mode-specific evaluation, and three-run score reporting.
nodes:
  - id: source
    label: |-
      Start from public smart-contract audits
      primarily Code4rena reports
      plus selected Tempo security scenarios
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: screen
    label: |-
      Screen severe real vulnerabilities
      o3 flags high-severity loss-of-funds findings
      keep Solidity, post-Jun-2023, licensed cases
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: curate
    label: |-
      OtterSec experts manually quality-control
      remove unsuitable or non-reproducible cases
      final: 120 vulnerabilities from 40 audits
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: environments
    label: |-
      Build isolated Ubuntu 24.04 environments
      repository · audit scope · known-issue context
      no web; grader runs in a separate container
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: modes
    label: |-
      Instantiate three benchmark modes
      Detect: 120 · Patch: 45 across 22 repos
      Exploit: 24 across 16 repos
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: agent
    label: |-
      Run agents with audit-realistic inputs
      detect writes an audit report · patch edits code
      exploit submits transactions to local Anvil
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: grading
    label: |-
      Apply mode-specific verification
      GPT-5 matches reports · hidden exploit tests
      replay transactions + Rust state grader
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: metrics
    label: |-
      Repeat every setting three times
      report vulnerability recall / patch / exploit rate
      bootstrap confidence intervals and cost
    type: terminal
    size: xl
    position:
      x: 1860
      'y': 250
edges:
  - from: source
    to: screen
    type: primary
  - from: screen
    to: curate
    type: primary
  - from: curate
    to: environments
    type: primary
  - from: environments
    to: modes
    type: primary
  - from: modes
    to: agent
    type: primary
  - from: agent
    to: grading
    type: primary
  - from: grading
    to: metrics
    type: primary
modules: []
