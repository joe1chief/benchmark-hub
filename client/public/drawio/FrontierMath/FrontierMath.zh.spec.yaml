    to: experts
    type: primary
  - from: experts
    to: authoring
    type: primary
  - from: authoring
    to: requirements
    type: primary
  - from: requirements
    to: problem_package
    type: primary
  - from: problem_package
    to: blind_review
    type: primary
  - from: blind_review
    to: contamination
    type: primary
  - from: contamination
    to: current_release
    type: primary
  - from: current_release
    to: version_boundary
    type: primary
  - from: version_boundary
    to: current_prompt
    type: primary
  - from: current_prompt
    to: submission
    type: primary
  - from: submission
    to: verification
    type: primary
modules: []
