meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierMath 构建流程
  description: 按论文对齐的专家命题、污染控制、实验式求解与自动验证流程。
  legend: 实线箭头对应 arXiv:2411.04872 第 2、4 节；论文采用三个难度维度而非 Tier 1–4，且只有答案可自动核验的题目进入基准。
nodes:
  - id: experts
    label: |-
      与 60+ 位数学家合作
      来自十多个国家的高校
      专长覆盖现代数学主要领域
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: authoring
    label: |-
      创作全新、未发表的问题
      覆盖约 70% 的 MSC2020 顶级学科
      专家典型解题耗时数小时至数天
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: requirements
    label: |-
      执行四项命题要求
      原创性 · 可自动核验
      不可猜中 · 计算上可处理
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: package
    label: |-
      提交完整题目包
      题面 + 详细解答 + 验证脚本
      学科/技巧标签与难度元数据
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: peer_review
    label: |-
      至少一次领域专家盲审
      检查正确性、歧义和可猜性
      审核代码、分类与难度
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: contamination
    label: |-
      修订后实施污染控制
      安全传输 + 专家检索公开数学来源
      Quetext/Copyscape 检查题面
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: difficulty
    label: |-
      记录经同行调整的难度
      背景知识等级 1–5
      创造性耗时 + 执行耗时
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: benchmark
    label: |-
      FrontierMath 基准
      数百道专家原创问题
      数值或可由 SymPy/自定义脚本核验的对象
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: solve
    label: |-
      模型在交互式 Python 循环中求解
      运行实验、读取结果/错误并继续改进
      论文实验上限为 10,000 tokens
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: submission
    label: |-
      提交自包含的最终答案程序
      标记“# This is the final answer”
      用 pickle 保存 Python 对象
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: verify
    label: |-
      自动核验每个答案
      整数精确匹配 · SymPy 等价 · 自定义脚本
      报告单次准确率与 Pass@8
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: experts
    to: authoring
    type: primary
  - from: authoring
    to: requirements
    type: primary
  - from: requirements
    to: package
    type: primary
  - from: package
    to: peer_review
    type: primary
  - from: peer_review
    to: contamination
    type: primary
  - from: contamination
    to: difficulty
    type: primary
  - from: difficulty
    to: benchmark
    type: primary
  - from: benchmark
    to: solve
    type: primary
  - from: solve
    to: submission
    type: primary
  - from: submission
    to: verify
    type: primary
modules: []
