meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierMath Build Process
  description: >-
    Paper-aligned expert construction, contamination control, experiment-enabled solving, and automatic verification
    flow.
  legend: >-
    Solid arrows follow arXiv:2411.04872 Sections 2 and 4; the paper uses three difficulty dimensions rather than Tier
    1–4, and only automatically verifiable answer types enter the benchmark.
nodes:
  - id: experts
    label: |-
      Collaborate with 60+ mathematicians
      universities in more than a dozen countries
      broad modern-mathematics expertise
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: authoring
    label: |-
      Write new, unpublished problems
      cover about 70% of top-level MSC2020 subjects
      typical expert effort: hours to days
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: requirements
    label: |-
      Enforce four creation requirements
      originality · automated verifiability
      guessproofness · computational tractability
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: package
    label: |-
      Submit complete problem package
      statement + detailed solution + verifier script
      subject/technique tags and difficulty metadata
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: peer_review
    label: |-
      At least one blind domain-expert review
      check correctness, ambiguity, guessability
      verify code, classifications, and difficulty
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: contamination
    label: |-
      Revise, then control contamination
      secure handling + expert public-source checks
      Quetext/Copyscape statement checks
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: difficulty
    label: |-
      Record peer-adjusted difficulty
      background level 1–5
      creativity hours + execution hours
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: benchmark
    label: |-
      FrontierMath benchmark
      hundreds of original expert problems
      numerical or SymPy/custom-verifiable objects
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: solve
    label: |-
      Model solves in an interactive Python loop
      execute experiments, inspect results/errors, refine
      experiment limit used in paper: 10,000 tokens
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: submission
    label: |-
      Submit a self-contained final-answer program
      mark “# This is the final answer”
      save the Python object with pickle
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: verify
    label: |-
      Automatically verify each answer
      exact integer · SymPy equivalence · custom script
      report per-run accuracy and Pass@8
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: experts
    to: authoring
    type: primary
  - from: authoring
    to: requirements
    type: primary
  - from: requirements
    to: package
    type: primary
  - from: package
    to: peer_review
    type: primary
  - from: peer_review
    to: contamination
    type: primary
  - from: contamination
    to: difficulty
    type: primary
  - from: difficulty
    to: benchmark
    type: primary
  - from: benchmark
    to: solve
    type: primary
  - from: solve
    to: submission
    type: primary
  - from: submission
    to: verify
    type: primary
modules: []
