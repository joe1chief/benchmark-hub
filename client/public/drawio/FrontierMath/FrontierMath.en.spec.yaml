  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierMath v2 Build Process
  description: >-
    Paper-aligned expert construction and current v2 tool-based evaluation with an explicit historical-protocol
    boundary.
  legend: >-
    Construction follows arXiv:2411.04872v7 Sections 2–4. Current evaluation follows Epoch AI's 2026-06-12 v2 page and
    implementation gist revision 39d23771; the private verifier corpus is not released.
nodes:
  - id: evidence
    label: |-
      Evidence: arXiv:2411.04872v7
      official gist @ 39d23771
      plus current v2 site
      private; no public dataset repository
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: experts
    label: |-
      Collaborate with 60+ mathematicians
      universities in 12+ countries
      broad modern-math expertise
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: authoring
    label: |-
      Write new, unpublished problems
      cover ~70% of top-level MSC2020
      expert solving takes hours to days
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: requirements
    label: |-
      Enforce four creation requirements
      original · automatically verifiable
      guessproof · computationally tractable
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: problem_package
    label: |-
      Submit statement + detailed solution
      verifier + subject/technique tags
      difficulty: background · creativity
      and execution
    type: document
    size: xl
    position:
      x: 1080
      'y': 120
  - id: blind_review
    label: |-
      At least one blind expert review
      check correctness and ambiguity
      check guessproofness + verifier
      metadata/difficulty; revise failures
    type: process
    size: xl
    position:
      x: 1340
      'y': 120
  - id: contamination
    label: |-
      Control originality/contamination
      secure handling + expert web searches
      Quetext/Copyscape: statements only
    type: process
    size: xl
    position:
      x: 1600
      'y': 120
  - id: current_release
    label: |-
      v2 2026-06-12: 338 total
      Tiers 1–3: 295 · Tier 4: 43
      12 public = 10 base + 2 Tier 4; included
      corrected 123 + 12; removed 5 + 7
    type: database
    size: xl
    position:
      x: 1600
      'y': 420
  - id: version_boundary
    label: |-
      Version boundary: keep protocols apart
      paper: 10,000 tokens + marker/pickle
      historical, not current
      v2 replaces that submission loop
    type: document
    size: xl
    position:
      x: 1340
      'y': 420
  - id: current_prompt
    label: |-
      Current v2: python + submit_answer
      hard limit 1,000,000 tokens
      force submission at 660,000
      stateless Python; tool calls ≤30 s
    type: process
    size: xl
    position:
      x: 1080
      'y': 420
  - id: submission
    label: |-
      Submit answer() with no args
      return typed object
      no output; no comments
      runtime ≤30 s; no submit is wrong
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: verification
    label: |-
      Run private verify(answer()) in sandbox
      True → 1
      False/error/timeout/no answer → 0
      report accuracy; verifier set private
    type: terminal
    size: xl
    position:
      x: 560
      'y': 420
