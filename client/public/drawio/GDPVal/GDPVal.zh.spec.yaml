meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GDPVal 构建流程
  description: 与论文一致的 GDPVal 构建、质检、黄金子集发布和专家对比评测流程。
  legend: 实线箭头对应 arXiv:2510.04374。图中区分 1,320 题完整基准与公开的 220 题黄金子集； 自动评分器属于实验性工具，并非主要指标。
nodes:
  - id: sectors
    label: |-
      筛选美国经济重要行业
      每个行业贡献超过 5% GDP
      最终保留 9 个行业
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: occupations
    label: |-
      筛选以数字化工作为主的职业
      GPT-4o 分类 O*NET 任务；数字化占比 ≥60%
      按工资和就业规模选出 44 个职业
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: experts
    label: |-
      招募并认证职业专家
      面试 · 背景核验 · 培训 · 测验
      至少 4 年经验，平均 14 年
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: task_authoring
    label: |-
      专家编写真实工作任务
      请求 + 可选参考文件 + 交付物
      每题映射到 O*NET 工作活动
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: metadata
    label: |-
      记录经济性与真实性元数据
      难度 · 代表性 · 完成时间
      估算价值 = 专家工时 × 职业工资
    type: document
    size: xl
    position:
      x: 1080
      'y': 250
  - id: quality
    label: |-
      筛查、评审、反馈并迭代修改
      自动检查 + 至少 3 次人工评审
      每题平均经过 5 次人工评审
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: full_set
    label: |-
      汇总完整基准
      共 1,320 题，每职业至少 30 题
      每题平均约需 7 个专家工时
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: gold
    label: |-
      发布 220 题黄金子集
      每职业 5 题，附请求和参考文件
      从交付物中清除专家身份信息
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: model_runs
    label: |-
      生成模型交付物
      每题独立采样 3 次
      比较完整产物而非短答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: grading
    label: |-
      对职业专家隐藏产物来源
      将模型产物与人类交付物两两比较
      3 位评分者 × 3 个样本 = 每题 9 次比较
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: metric
    label: |-
      报告交付物对决胜率
      人类专家工作作为参考基线
      实验评分器一致率 66%，人工间为 71%
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: sectors
    to: occupations
    type: primary
  - from: occupations
    to: experts
    type: primary
  - from: experts
    to: task_authoring
    type: primary
  - from: task_authoring
    to: metadata
    type: primary
  - from: metadata
    to: quality
    type: primary
  - from: quality
    to: full_set
    type: primary
  - from: full_set
    to: gold
    type: primary
  - from: gold
    to: model_runs
    type: primary
  - from: model_runs
    to: grading
    type: primary
  - from: grading
    to: metric
    type: primary
modules: []
