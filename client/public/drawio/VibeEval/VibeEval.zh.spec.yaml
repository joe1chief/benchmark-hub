meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Vibe-Eval 数据分支与并行评测流程
  description: >-
    Vibe-Eval含269个开放式图文提示，其中169个为普通集，100个由Reka Core失败样例挖掘成困难集。每题都有人工金标准回答，并经过两轮独立复核。自动评测把文本提示、模型回答和金标准交给Reka
    Core，以0.4温度独立评分3次并取1至5分均值。人工评测每题从13个模型中均匀抽4个回答，收集约2万条含平局的第三方成对偏好，再拟合Bradley-Terry/ELO排名；最后比较自动与人工排名的一致性。
  legend: 来源：Vibe-Eval arXiv:2405.02287 and official reka-ai/reka-vibe-eval repository。实线箭头表示论文或官方资料明确支持的主流程。
