meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Vibe-Eval Dataset Branches and Parallel Evaluation
  description: >-
    Vibe-Eval contains 269 open-ended image-text prompts: 169 normal prompts and 100 hard prompts mined from Reka Core
    failures. Every prompt has a human-authored gold response and passes two independent review rounds. Automatic
    evaluation gives Reka Core the text prompt, model response, and gold response, obtains a 1-5 score three times at
    temperature 0.4, and averages the scores. Human evaluation samples four of 13 model responses per prompt, collects
    about 20K third-party pairwise preferences including ties, and fits Bradley-Terry/ELO rankings; automatic and human
    rankings are then compared for agreement.
  legend: >-
    Source: Vibe-Eval arXiv:2405.02287 and official reka-ai/reka-vibe-eval repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
