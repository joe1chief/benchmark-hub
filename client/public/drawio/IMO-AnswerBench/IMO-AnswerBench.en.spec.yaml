meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IMO-AnswerBench Build Process
  description: >-
    Paper- and release-aligned IMO-AnswerBench workflow: experts handpick and reformulate 400 Olympiad problems, balance
    four mathematical categories, robustify statements against memorization, enforce unique non-trivial short answers,
    and evaluate semantic correctness with the Gemini 2.5 Pro AnswerAutoGrader.
  legend: >-
    Solid arrows show paper construction and answer evaluation; dashed arrows mark human validation of the autograder
    and the post-paper answerbench_v2 correction release.
nodes:
  - id: sources
    label: |-
      Past Olympiad Competitions
      National + Regional + International
      Diverse Topics and Techniques
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: handpick
    label: |-
      Expert Hand-selection
      400 Problems
      Verifiable Short Answers
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: balance
    label: |-
      Balance Four IMO Categories
      100 Each: Algebra / Combinatorics
      Geometry / Number Theory
    type: process
    size: xl
    position:
      x: 560
      'y': 200
  - id: reformulate
    label: |-
      Reformulate Proof-heavy Items
      Produce Clear Non-trivial Short Answers
      Cover Pre-IMO through IMO-Hard
    type: process
    size: xl
    position:
      x: 820
      'y': 200
  - id: robustify
    label: |-
      Robustify against Memorization
      Paraphrase + Rename Objects
      Change Values + Add Distractors
    type: process
    size: xl
    position:
      x: 1080
      'y': 200
  - id: consistency
    label: |-
      Consistency Quality Gate
      Unique Simplified Answer
      Avoid Binary or Ambiguous Outputs
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: vet
    label: |-
      Medalist / Mathematician Review
      Panel Total: 10 IMO Gold
      and 5 IMO Silver Medals
    type: user
    size: xl
    position:
      x: 1600
      'y': 200
  - id: dataset
    label: |-
      IMO-AnswerBench Paper Set
      400 Problem + Ground-truth Pairs
      Category / Topic / Source Metadata
    type: database
    size: xl
    position:
      x: 1860
      'y': 200
  - id: v2
    label: |-
      Official answerbench_v2.csv
      Post-paper Release Correction
      Fix Ambiguity / Incorrect Answers
    type: document
    size: xl
    position:
      x: 1860
      'y': 520
  - id: generate
    label: |-
      Generate Model Solutions
      Preserve Reasoning + Final Answer
      Paper Results Usually Average 8 Runs
    type: process
    size: xl
    position:
      x: 2140
      'y': 200
  - id: grader
    label: |-
      Gemini 2.5 Pro AnswerAutoGrader
      Extract Final Answer
      Compare with Ground Truth
    type: process
    size: xl
    position:
      x: 2420
      'y': 200
  - id: semantic
    label: |-
      Semantic-equivalence Decision
      Accept Equivalent Formats
      Reject Inconsistent or Missing Answers
    type: process
    size: xl
    position:
      x: 2700
      'y': 200
  - id: validate
    label: |-
      Human Validation Audit
      800 Answer Judgments
      Near-identical Agreement
    type: user
    size: xl
    position:
      x: 2700
      'y': 520
  - id: report
    label: |-
      Report Accuracy
      Overall + Four Categories
      Robustified vs Original Analysis
    type: terminal
    size: xl
    position:
      x: 2980
      'y': 200
edges:
  - from: sources
    to: handpick
    type: primary
  - from: handpick
    to: balance
    type: primary
  - from: balance
    to: reformulate
    type: primary
  - from: reformulate
    to: robustify
    type: primary
  - from: robustify
    to: consistency
    type: primary
  - from: consistency
    to: vet
    type: primary
  - from: vet
    to: dataset
    type: primary
  - from: dataset
    to: generate
    type: primary
  - from: dataset
    to: v2
    type: optional
  - from: v2
    to: generate
    type: optional
  - from: generate
    to: grader
    type: primary
  - from: grader
    to: semantic
    type: primary
  - from: grader
    to: validate
    type: optional
  - from: semantic
    to: report
    type: primary
  - from: validate
    to: report
    type: optional
modules: []
