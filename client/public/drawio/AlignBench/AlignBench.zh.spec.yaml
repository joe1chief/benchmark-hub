meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlignBench 构建流程
  description: AlignBench 通过人工参考答案核验与三模型难度过滤整理 683 条查询，再执行固定 GPT-4-0613 协议、评分字典解析及官方推理/语言聚合。
  legend: 各层构成连续路径；开放创作类目标回复采用 T=0.7，评审固定为 gpt-4-0613、T=0.1。最终总分等权平均推理组与语言组。
nodes:
  - id: sources
    label: |-
      真实中文场景
      在线聊天服务使用场景
      研究者编写的挑战题
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: rules
    label: |-
      四条查询规则
      任务导向 • 清晰流畅
      困难复杂 • 脱敏处理
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: taxonomy
    label: |-
      论文类别 1–4
      基本任务 • 中文理解
      综合问答 • 文本写作
    type: document
    size: xl
    position:
      x: 600
      'y': 80
  - id: taxonomy_more
    label: |-
      论文类别 5–8
      逻辑推理 • 数学计算
      角色扮演 • 专业能力
    type: document
    size: xl
    position:
      x: 880
      'y': 80
  - id: draft
    label: |-
      GPT-4 参考答案草稿
      为每条查询提供起点
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: human_review
    label: |-
      人工核验参考答案
      修订并完善草稿
      检查正确性与质量
    type: user
    size: xl
    position:
      x: 1440
      'y': 80
  - id: evidence
    label: |-
      知识密集型证据
      人工核验时进行网页检索
      记录网址与原文引用
    type: database
    size: xl
    position:
      x: 1440
      'y': 360
  - id: verified
    label: |-
      已核验候选三元组
      查询 + 类别 + 参考答案
      必要时附带检索证据
    type: document
    size: xl
    position:
      x: 1160
      'y': 360
  - id: difficulty
    label: |-
      三模型难度过滤
      GPT-3.5-Turbo • ChatGLM • 讯飞星火
      GPT-4 评分；剔除最易的 50%
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: dataset
    label: |-
      发布 AlignBench
      683 条中文查询
      八个主要类别
    type: database
    size: xl
    position:
      x: 600
      'y': 360
  - id: model
    label: |-
      生成目标 LLM 回复
      固定答案类别：T = 0.1
      开放 / 写作 / 角色目标 T = 0.7
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: judge
    label: |-
      固定 gpt-4-0613 点式评审
      评审 T = 0.1
      查询 + 参考答案 + 目标回复
      任务特定维度 + 思维链
    type: process
    size: xl
    position:
      x: 40
      'y': 360
  - id: score_dict
    label: |-
      解析末尾评分字典
      提取各维度整数分
      读取“综合得分”；正则回退
    type: document
    size: xl
    position:
      x: 40
      'y': 640
  - id: aggregate
    label: |-
      聚合官方结果
      推理 = 数学与逻辑平均分
      语言 = 其余 6 类平均分
      总分 = (推理 + 语言) / 2
    type: process
    size: xl
    position:
      x: 320
      'y': 640
  - id: score
    label: |-
      AlignBench 结果
      类别 • 推理 • 语言
      1–10 分制总分
    type: terminal
    size: xl
    position:
      x: 600
      'y': 640
edges:
  - from: sources
    to: rules
    type: primary
  - from: rules
    to: taxonomy
    type: primary
  - from: taxonomy
    to: taxonomy_more
    type: primary
  - from: taxonomy_more
    to: draft
    type: primary
  - from: draft
    to: human_review
    type: primary
  - from: human_review
    to: evidence
    type: data
    label: 知识密集型
  - from: evidence
    to: verified
    type: data
  - from: human_review
    to: verified
    type: primary
    label: 其他查询
    waypoints:
      - x: 1260
        'y': 240
  - from: verified
    to: difficulty
    type: primary
  - from: difficulty
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: judge
    type: primary
  - from: judge
    to: score_dict
    type: primary
  - from: score_dict
    to: aggregate
    type: primary
  - from: aggregate
    to: score
    type: primary
modules: []
