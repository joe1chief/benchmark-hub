meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlignBench 构建流程
  description: AlignBench 通过人工参与的参考答案核验与三模型难度过滤整理 683 条真实中文场景查询，再使用规则校准的多维 GPT-4 点式评审器完成评测。
  legend: 三层按折线路径构成连续的构建与评测流程；虚线分支表示人工核验知识密集型参考答案时必须记录的网页证据。
nodes:
  - id: sources
    label: |-
      真实中文场景
      在线聊天服务使用场景
      研究者编写的挑战题
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: rules
    label: |-
      四条查询规则
      任务导向 • 清晰流畅
      困难复杂 • 脱敏处理
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: taxonomy
    label: |-
      论文类别 1–4
      基本任务 • 中文理解
      综合问答 • 文本写作
    type: document
    size: xl
    position:
      x: 600
      'y': 80
  - id: taxonomy_more
    label: |-
      论文类别 5–8
      逻辑推理 • 数学计算
      角色扮演 • 专业能力
    type: document
    size: xl
    position:
      x: 880
      'y': 80
  - id: draft
    label: |-
      GPT-4 参考答案草稿
      为每条查询提供起点
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: human_review
    label: |-
      人工核验参考答案
      修订并完善草稿
      检查正确性与质量
    type: user
    size: xl
    position:
      x: 1440
      'y': 80
  - id: evidence
    label: |-
      知识密集型证据
      人工核验时进行网页检索
      记录网址与原文引用
    type: database
    size: xl
    position:
      x: 1440
      'y': 360
  - id: verified
    label: |-
      已核验候选三元组
      查询 + 类别 + 参考答案
      必要时附带检索证据
    type: document
    size: xl
    position:
      x: 1160
      'y': 360
  - id: difficulty
    label: |-
      三模型难度过滤
      GPT-3.5-Turbo • ChatGLM • 讯飞星火
      GPT-4 评分；剔除最易的 50%
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: dataset
    label: |-
      发布 AlignBench
      683 条中文查询
      八个主要类别
    type: database
    size: xl
    position:
      x: 600
      'y': 360
  - id: model
    label: |-
      目标 LLM 回复
      按类别设置温度
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: judge
    label: |-
      GPT-4 点式评审
      任务特定维度 + 思维链
      规则校准的 1–10 分细则
    type: process
    size: xl
    position:
      x: 40
      'y': 360
  - id: score
    label: |-
      各维度分与总分
      人工参考答案锚定为 8 分
      最终采用 1–10 分制
    type: terminal
    size: xl
    position:
      x: 40
      'y': 640
edges:
  - from: sources
    to: rules
    type: primary
  - from: rules
    to: taxonomy
    type: primary
  - from: taxonomy
    to: taxonomy_more
    type: primary
  - from: taxonomy_more
    to: draft
    type: primary
  - from: draft
    to: human_review
    type: primary
  - from: human_review
    to: evidence
    type: data
    label: 知识密集型
  - from: evidence
    to: verified
    type: data
  - from: human_review
    to: verified
    type: primary
    label: 其他查询
    waypoints:
      - x: 1260
        'y': 240
  - from: verified
    to: difficulty
    type: primary
  - from: difficulty
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
