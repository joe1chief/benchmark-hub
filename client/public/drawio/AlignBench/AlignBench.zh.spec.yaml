meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlignBench 构建流程
  description: 基于 arXiv:2311.18743 重绘的 AlignBench 中文对齐基准数据策划与规则校准 LLM 评审流程。
  legend: 实线表示查询策划、证据化参考答案和自动评审主流程；虚线表示过滤与人工一致性验证反馈。
nodes:
  - id: scenarios
    label: |-
      中文真实场景
      在线服务使用问题
      研究者补充提示
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: taxonomy
    label: |-
      任务分类体系
      8 个主要类别
      覆盖对齐能力维度
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: query_rules
    label: |-
      查询筛选规则
      任务导向且表达流畅
      复杂、安全、贴近应用
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: evidence
    label: |-
      网络证据收集
      记录 URL 和引用
      支撑知识密集问题
    type: database
    size: xl
    position:
      x: 560
      'y': 160
  - id: references
    label: |-
      人工验证参考答案
      GPT-4 生成初稿
      标注员审查修订
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: difficulty
    label: |-
      难度过滤
      LLM 为候选查询打分
      剔除较容易的一半
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: benchmark_set
    label: |-
      AlignBench 数据集
      683 个真实场景查询
      含类别与参考答案
    type: document
    size: xl
    position:
      x: 1080
      'y': 160
  - id: judge
    label: |-
      规则校准评审
      多维逐点评分
      思维链解释与最终分数
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: scenarios
    to: taxonomy
    type: primary
  - from: taxonomy
    to: query_rules
    type: primary
  - from: query_rules
    to: evidence
    type: primary
  - from: evidence
    to: references
    type: data
  - from: references
    to: difficulty
    type: primary
  - from: difficulty
    to: benchmark_set
    type: primary
  - from: benchmark_set
    to: judge
    type: primary
  - from: judge
    to: references
    type: optional
    label: 人工一致性校验
modules: []
