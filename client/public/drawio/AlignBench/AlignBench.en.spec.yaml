meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlignBench Build Process
  description: >-
    AlignBench curates 683 real-scenario Chinese queries through human-in-the-loop reference verification and a
    three-model difficulty filter, then applies a rule-calibrated multidimensional GPT-4 point-wise judge.
  legend: >-
    The three layered rows form one continuous construction-and-evaluation path; the dashed branch records web evidence
    required while humans verify knowledge-intensive references.
nodes:
  - id: sources
    label: |-
      Real Chinese Scenarios
      Online Chat-Service Usage
      Researcher-Written Challenges
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: rules
    label: |-
      Four Query Rules
      Task-Oriented • Clear and Fluent
      Challenging • Desensitized
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: taxonomy
    label: |-
      Paper Categories 1–4
      Fundamental Language Ability • Advanced Chinese Understanding
      Open-ended Questions • Writing Ability
    type: document
    size: xl
    position:
      x: 600
      'y': 80
    style:
      fontSize: 10
  - id: taxonomy_more
    label: |-
      Paper Categories 5–8
      Logical Reasoning • Mathematics
      Task-oriented Role Play • Professional Knowledge
    type: document
    size: xl
    position:
      x: 880
      'y': 80
    style:
      fontSize: 10
  - id: draft
    label: |-
      GPT-4 Reference Draft
      Starting Point for Each Query
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: human_review
    label: |-
      Human Reference Verification
      Revise and Refine Drafts
      Check Correctness and Quality
    type: user
    size: xl
    position:
      x: 1440
      'y': 80
  - id: evidence
    label: |-
      Knowledge-Intensive Evidence
      Web Search during Human Verification
      Record URLs and Quotations
    type: database
    size: xl
    position:
      x: 1440
      'y': 360
  - id: verified
    label: |-
      Verified Candidate Triples
      Query + Category + Reference
      Attach Evidence When Required
    type: document
    size: xl
    position:
      x: 1160
      'y': 360
  - id: difficulty
    label: |-
      Three-Model Difficulty Filter
      GPT-3.5-Turbo • ChatGLM • Sparkdesk
      GPT-4 Scores; Drop Easiest 50%
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: dataset
    label: |-
      Release AlignBench
      683 Chinese Queries
      Eight Main Categories
    type: database
    size: xl
    position:
      x: 600
      'y': 360
  - id: model
    label: |-
      Target LLM Response
      Category-Specific Temperature
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: judge
    label: |-
      GPT-4 Point-Wise Judge
      Task-Specific Dimensions + CoT
      Rule-Calibrated 1–10 Rubrics
    type: process
    size: xl
    position:
      x: 40
      'y': 360
  - id: score
    label: |-
      Dimension + Overall Scores
      Human Reference Anchored at 8
      Final Score on a 1–10 Scale
    type: terminal
    size: xl
    position:
      x: 40
      'y': 640
edges:
  - from: sources
    to: rules
    type: primary
  - from: rules
    to: taxonomy
    type: primary
  - from: taxonomy
    to: taxonomy_more
    type: primary
  - from: taxonomy_more
    to: draft
    type: primary
  - from: draft
    to: human_review
    type: primary
  - from: human_review
    to: evidence
    type: data
    label: knowledge-intensive
  - from: evidence
    to: verified
    type: data
  - from: human_review
    to: verified
    type: primary
    label: other queries
    waypoints:
      - x: 1260
        'y': 240
  - from: verified
    to: difficulty
    type: primary
  - from: difficulty
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
