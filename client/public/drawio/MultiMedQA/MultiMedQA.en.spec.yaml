      Open and Closed Domain Tasks
    type: database
    size: xl
    position:
      x: 980
      'y': 240
  - id: mcq_tasks
    label: |-
      Route Four Multiple-choice Groups
      MedQA · MedMCQA · PubMedQA
      MMLU Clinical Topics
      PubMedQA Includes Abstract Context
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: prompting
    label: |-
      Apply Prompting Strategies
      Few-shot · Chain-of-thought
      Self-consistency: 11 Decodes
      Eleven Paths Stated for Three Datasets
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: mcq_score
    label: |-
      Score Exact Answer Choices
      Accuracy per Dataset or MMLU Topic
      Compare PaLM and Flan-PaLM Variants
      Report Prompting Ablations
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: long_sample
