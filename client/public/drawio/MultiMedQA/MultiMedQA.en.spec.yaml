      Report MultiMedQA Results
      Multiple-choice Accuracy and Human Ratings
      1,000 Bootstrap Replicas
      95% Percentile Intervals
    type: terminal
    size: xl
    position:
      x: 2180
      'y': 280
  - id: legacy_reference_boundary
