  title: MultiMedQA Build and Evaluation Process
  description: >-
    Paper-aligned assembly of six existing English medical question-answering datasets, construction of HealthSearchQA,
    automated multiple-choice evaluation, and clinician-led long-form human evaluation.
  legend: >-
    MultiMedQA combines seven datasets spanning professional exams, biomedical research, and consumer health;
    HealthSearchQA contributes 3,375 commonly searched questions.
