      Draw the 140-question Long-form Set
      100 HealthSearchQA · 20 LiveQA
      20 MedicationQA
      Disjoint from Tuning Exemplars
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
  - id: response_sets
