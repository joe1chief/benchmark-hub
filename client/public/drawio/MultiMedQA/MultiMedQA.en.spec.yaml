meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiMedQA Build and Evaluation Process
  description: >-
    Version-of-record construction of seven English medical question-answering datasets, followed by separate
    multiple-choice, blinded clinician, and lay-user evaluation branches with explicit release and version boundaries.
  legend: >-
    Nature 620 (2023) reports 3,173 HealthSearchQA questions and 1,000 bootstrap replicas; arXiv v1 had 3,375 and 100
    respectively. Solid arrows are the disclosed workflow; dashed arrows expose evidence or availability boundaries.
