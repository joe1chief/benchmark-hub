meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MultiMedQA 构建与评测流程
  description: 以最终发表版为准，展示七个英文医疗问答数据集的构建，以及多选题、盲审临床医生和普通用户三条独立评测分支，并显式标注发布与版本边界。
  legend: Nature 620（2023）报告 3,173 条 HealthSearchQA 与 1,000 次 Bootstrap；arXiv v1 分别为 3,375 条和 100 次。 实线表示论文披露的流程，虚线表示证据或可用性边界。
nodes:
  - id: goal
    label: |-
      定义广覆盖医疗问答评测
      医学考试 · 研究文献 · 消费者问题
      多项选择与长文本回答
      仅覆盖英文
    type: document
    size: xl
    position:
      x: 20
      'y': 260
  - id: existing_sources
    label: |-
      选择六个既有问答数据集
      专业考试 · 生物医学文献
      消费者健康与用药问题
      保留各数据集格式
    type: database
    size: xl
    position:
      x: 260
      'y': 60
  - id: health_seeds
    label: |-
      准备健康查询种子
      疾病与相关症状作为种子
      面向消费者的起始词
      进入搜索驱动采集分支
    type: input
    size: xl
    position:
      x: 260
      'y': 440
  - id: existing_inventory
    label: |-
      盘点既有数据源
      MedQA · MedMCQA · PubMedQA
      MMLU 六个临床主题
      LiveQA · MedicationQA
    type: process
    size: xl
    position:
      x: 500
      'y': 60
  - id: search_suggestions
    label: |-
      获取公开搜索建议
      输入疾病与症状种子
      收集所有用户可见的问题
      保留常见消费者措辞
    type: process
    size: xl
    position:
      x: 500
      'y': 440
  - id: health_release
    label: |-
      整理 HealthSearchQA
      发表版表格含 3,173 条问题
      3,156 个唯一文本 · 17 条重复
      仅问题 · 自由文本 · 开放域
    type: database
    size: xl
    position:
      x: 740
      'y': 440
  - id: suite
    label: |-
      汇编七数据集套件
      七个英文数据集
      多选与长文本两类格式
      同时含开放域和封闭域任务
    type: database
    size: xl
    position:
      x: 980
      'y': 240
  - id: mcq_tasks
    label: |-
      路由四组多选任务
      MedQA · MedMCQA · PubMedQA
      MMLU 临床主题
      PubMedQA 输入包含摘要上下文
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: prompting
    label: |-
      应用提示策略
      少样本 · 思维链
      自一致性使用 11 次解码
      论文明确该数字用于三个数据集
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: mcq_score
    label: |-
      按准确选项计分
      分数据集或 MMLU 主题算准确率
      比较 PaLM 与 Flan-PaLM 变体
      报告提示策略消融
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: long_sample
    label: |-
      抽取 140 题长回答集
      HealthSearchQA 100 题 · LiveQA 20 题
      MedicationQA 20 题
      与提示调优样例不重合
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
  - id: response_sets
    label: |-
      生成三组回答
      临床医生参考回答
      Flan-PaLM 540B 回答
      Med-PaLM 540B 回答
    type: input
    size: xl
    position:
      x: 1460
      'y': 300
  - id: clinician_eval
    label: |-
      执行临床医生盲审
      由另一组医生评审 · 隐藏回答来源
      每个回答由一名医生评分
      九名医生来自美国 · 英国 · 印度
    type: user
    size: xl
    position:
      x: 1700
      'y': 250
  - id: clinician_axes
    label: |-
      评定临床质量维度
      科学共识 · 伤害程度与可能性
      理解 · 回忆 · 推理的正确与错误证据
      错误或缺失内容 · 偏见
    type: process
    size: xl
    position:
      x: 1940
      'y': 140
  - id: lay_eval
    label: |-
      执行普通用户评审
      五名印度非医学背景评分者
      是否回应用户意图
      是否有帮助且可行动
    type: user
    size: xl
    position:
      x: 1940
      'y': 440
  - id: report
    label: |-
      报告 MultiMedQA 结果
      多选准确率与人工评分
      1,000 次 Bootstrap 重采样
      95% 百分位区间
    type: terminal
    size: xl
    position:
      x: 2180
      'y': 280
  - id: legacy_reference_boundary
    label: |-
      既有参考答案边界
      不把既有解释当作标准答案
      来源不一致且部分来自非临床人员
      由合格临床医生提供标准化参考
    type: document
    size: xl
    position:
      x: 980
      'y': 600
  - id: source_boundary
    label: |-
      发布与权利边界
      Nature 补充文件发布 HealthSearchQA · CC BY 4.0
      六个源数据集各自保留使用条款
      Med-PaLM 代码与权重未公开
    type: document
    size: xl
    position:
      x: 1220
      'y': 600
edges:
  - from: goal
    to: existing_sources
    type: primary
  - from: goal
    to: health_seeds
    type: primary
  - from: existing_sources
    to: existing_inventory
    type: primary
  - from: health_seeds
    to: search_suggestions
    type: primary
  - from: search_suggestions
    to: health_release
    type: primary
  - from: existing_inventory
    to: suite
    type: primary
  - from: health_release
    to: suite
    type: primary
  - from: suite
    to: mcq_tasks
    type: primary
  - from: mcq_tasks
    to: prompting
    type: primary
  - from: prompting
    to: mcq_score
    type: primary
  - from: mcq_score
    to: report
    type: primary
    waypoints:
      - x: 2300
        'y': 80
      - x: 2300
        'y': 240
  - from: suite
    to: long_sample
    type: primary
  - from: long_sample
    to: response_sets
    type: primary
  - from: response_sets
    to: clinician_eval
    type: primary
  - from: clinician_eval
    to: clinician_axes
    type: primary
  - from: clinician_axes
    to: report
    type: primary
  - from: response_sets
    to: lay_eval
    type: primary
  - from: lay_eval
    to: report
    type: primary
  - from: suite
    to: legacy_reference_boundary
    type: secondary
    style:
      dashed: true
  - from: suite
    to: source_boundary
    type: secondary
    style:
      dashed: true
modules: []
