meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperQA 构建与评测流程
  description: 对齐论文的学术图表采集、STEM专家标注、三人复核共识、元数据封装与MathVista确定性评测流程。
  legend: PaperQA是MathVista三个新建数据集之一，并不是Intern-S1下游报告首次提出的评测。
nodes:
  - id: step_1
    label: |-
      识别能力覆盖缺口
      现有数据缺少科学推理
      需要基于学术图表作答
      聚焦视觉数学与科学技能
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      获取2023年8月论文
      使用Hugging Face Papers发布
      采集论文图形与表格
      保留论文级来源信息
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      选择信息丰富的插图
      学术表格 · 图形 · 图表
      要求包含视觉科学内容
      支持非平凡推理问题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      人工编写问答
      由STEM研究生标注
      每题扎根于对应插图
      记录答案及所需选项
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      独立复核答案
      每个新数据集三名复核者
      检查科学解释正确性
      对比全部标注答案
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      计算标注一致性
      复核一致率99.2%
      736个新问题仅6个分歧
      统计覆盖三个新数据集
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      通过共识解决分歧
      全体复核团队讨论
      修正有歧义的答案标签
      每个样例确定一个答案
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      添加细粒度元数据
      问题与答案类型
      来源 · 类别 · 任务 · 年级
      视觉上下文与推理技能
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      定稿PaperQA
      107个人工标注样例
      学术图形问答
      图表与曲线 · 科学推理
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      封装为MathVista格式
      图像 · 问题 · 选项 · 答案
      标准查询与来源元数据
      纳入testmini与test抽样
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      生成模型回答
      提供任务说明与图像
      加入问题和候选选项
      允许输出详细推理
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      抽取短答案
      使用基于GPT-4的抽取器
      200题试验准确率超99.5%
      将长回答转成单一答案
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      规范化所需格式
      选择题转为选项字母
      自由题转整数浮点数或列表
      与确定性标准答案比较
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告准确率
      对规范化答案精确计分
      按来源与FQA拆分
      分析科学推理能力
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
