meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperQA 构建与评测流程
  description: 对齐论文v3的学术图表取材、STEM人工标注、独立复核、共识定稿、固定发布封装与MathVista官方评测流程。
  legend: 实线为论文或官方代码披露的主流程；虚线仅标识固定证据、发布漂移、许可与抽取器复现边界，不是额外步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2310.02255v3 · PDF ee5a616e9481
      Git 53d525874bdd
      HF 2b6ad69445fb
    type: document
    size: xl
    position:
      x: 120
      'y': 100
  - id: coverage_gap
    label: |-
      识别科学推理缺口
      学术图表上的科学推理
      仍未被现有来源覆盖
      需要视觉扎根的数学推理
      新建PaperQA来源数据集
    type: document
    size: xl
    position:
      x: 380
      'y': 100
  - id: paper_sources
    label: |-
      获取2023年8月论文
      使用Hugging Face发布的论文
      选取信息丰富的表格与图形
      纳入学术论文中的图表
    type: database
    size: xl
    position:
      x: 640
      'y': 100
  - id: author_questions
    label: |-
      人工标注问题
      由STEM领域研究生标注
      每题扎根于对应插图
      聚焦科学推理
    type: document
    size: xl
    position:
      x: 900
      'y': 100
  - id: independent_review
    label: |-
      独立复核每个数据集
      三名复核者标注答案
      执行两步一致性流程
      对比复核者答案标签
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: agreement
    label: |-
      计算交叉复核一致性
      三个新数据集共736题
      答案一致率99.2%
      总计六处分歧
    type: process
    size: xl
    position:
      x: 1420
      'y': 100
  - id: consensus
    label: |-
      解决六处分歧
      全体复核团队逐题讨论
      修正有歧义的答案标签
      每个样例达成共识
    type: process
    size: xl
    position:
      x: 1680
      'y': 100
  - id: metadata
    label: |-
      添加细粒度元数据
      问题与答案类型 · 语言
      来源 · 类别 · 任务 · 年级
      上下文与推理技能
    type: database
    size: xl
    position:
      x: 1940
      'y': 100
  - id: paper_scope
    label: |-
      论文v3的PaperQA范围
      107个学术插图样例
      大学级图形问答
      科学与统计推理
    type: database
    size: xl
    position:
      x: 2200
      'y': 100
  - id: fixed_release
    label: |-
      封装固定官方发布
      发布JSON含108条PaperQA
      testmini 19条 · test 89条
      图像 · 问题 · 选项 · 元数据
    type: database
    size: xl
    position:
      x: 1940
      'y': 360
  - id: split_policy
    label: |-
      执行MathVista划分策略
      testmini用于开发验证
      test答案保持隐藏
      近似整体来源分布
    type: process
    size: xl
    position:
      x: 2200
      'y': 360
  - id: response_generation
    label: |-
      生成模型回答
      单独传入图像
      类型提示 · 问题 · 选项
      可选图像描述与OCR上下文
    type: process
    size: xl
    position:
      x: 1680
      'y': 360
  - id: extraction_gate
    label: |-
      规则能否抽取
      精确选项或数值
      可选引号正则
      否则用大模型
    type: decision
    size: xl
    position:
      x: 1420
      'y': 360
  - id: direct_extract
    label: |-
      使用直接抽取
      返回精确选项字符串
      解析整数或浮点回答
      仅quick_extract启用正则
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: llm_extract
    label: |-
      使用五示例大模型抽取器
      拼接查询与模型回答
      论文使用GPT-4抽取短答案
      200题试验准确率超99.5%
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: normalize
    label: |-
      规范化抽取答案
      字母或编辑距离最近选项
      整数 · 舍入浮点数 · 列表字符串
      使用安全精确相等比较
    type: process
    size: xl
    position:
      x: 900
      'y': 360
  - id: report
    label: |-
      报告确定性准确率
      统计规范化后的精确匹配
      按来源与元数据拆分
      PaperQA仍是MathVista子集
    type: terminal
    size: xl
    position:
      x: 640
      'y': 360
  - id: release_boundary
    label: |-
      论文与发布计数边界
      论文v3记载107个样例
      固定JSON含108条：19加89
      主流程同时保留两项事实
    type: document
    size: xl
    position:
      x: 2460
      'y': 100
  - id: license_boundary
    label: |-
      许可与用途边界
      新增贡献采用CC BY-SA 4.0
      图像与问题版权仍归原作者
      可作测试集，不得用作训练集
    type: document
    size: xl
    position:
      x: 1940
      'y': 780
  - id: extractor_boundary
    label: |-
      抽取器复现边界
      论文仅说明GPT-4，未给检查点
      代码读取AZURE_OPENAI_MODEL
      端点与部署位于外部
    type: document
    size: xl
    position:
      x: 1160
      'y': 780
edges:
  - from: source_evidence
    to: coverage_gap
    type: secondary
    style:
      dashed: true
  - from: coverage_gap
    to: paper_sources
    type: primary
  - from: paper_sources
    to: author_questions
    type: primary
  - from: author_questions
    to: independent_review
    type: primary
  - from: independent_review
    to: agreement
    type: primary
  - from: agreement
    to: consensus
    type: primary
  - from: consensus
    to: metadata
    type: primary
  - from: metadata
    to: paper_scope
    type: primary
  - from: paper_scope
    to: split_policy
    type: primary
  - from: split_policy
    to: fixed_release
    type: primary
  - from: fixed_release
    to: response_generation
    type: primary
  - from: response_generation
    to: extraction_gate
    type: primary
  - from: extraction_gate
    to: direct_extract
    type: primary
  - from: extraction_gate
    to: llm_extract
    type: primary
  - from: direct_extract
    to: normalize
    type: primary
  - from: llm_extract
    to: normalize
    type: primary
  - from: normalize
    to: report
    type: primary
  - from: paper_scope
    to: release_boundary
    type: secondary
    style:
      dashed: true
  - from: fixed_release
    to: license_boundary
    type: secondary
    style:
      dashed: true
  - from: llm_extract
    to: extractor_boundary
    type: secondary
    style:
      dashed: true
modules: []
