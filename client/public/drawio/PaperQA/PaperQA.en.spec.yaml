meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperQA Build and Evaluation Process
  description: >-
    Paper-aligned academic-figure collection, STEM expert annotation, three-reviewer consensus, metadata packaging, and
    deterministic MathVista evaluation for the PaperQA subset.
  legend: >-
    PaperQA is one of MathVista's three newly annotated datasets; it is not the downstream evaluation introduced by
    Intern-S1.
nodes:
  - id: step_1
    label: |-
      Identify a Coverage Gap
      Existing sets miss scientific reasoning
      Need reasoning over academic figures
      Target visually grounded math skills
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Source August 2023 Papers
      Use Hugging Face Papers releases
      Collect cited figures and tables
      Preserve paper-level provenance
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Select Informative Illustrations
      Academic tables · figures · charts
      Require visual scientific content
      Support non-trivial reasoning questions
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Manually Author Questions
      STEM graduate student annotators
      Ground each item in its illustration
      Record answer and options as needed
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Independently Review Answers
      Three reviewers per new dataset
      Check scientific interpretation
      Compare all annotated answers
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Measure Agreement
      99.2 percent consistency
      Only 6 disputes among 736
      Across all three new datasets
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Resolve Disputes by Consensus
      Entire review team discusses
      Correct ambiguous answer labels
      Reach one answer per example
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Attach Fine-grained Metadata
      Question and answer types
      Source · category · task · grade
      Context and reasoning skills
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Finalize PaperQA
      107 manually annotated examples
      Academic figure question answering
      Charts and plots · scientific skill
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Package in MathVista Format
      Image · question · choices · answer
      Standard query and source metadata
      Include in testmini and test sampling
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Generate Model Response
      Supply task instruction and figure
      Include question and choices
      Allow detailed reasoning output
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Extract the Short Answer
      GPT-4-based answer extractor
      More than 99.5 percent on 200 trials
      Convert long response to one answer
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Normalize Required Format
      Option letter for multiple choice
      Integer float or list for free form
      Match deterministic ground truth
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Report Accuracy
      Score exact normalized answers
      Break down by source and FQA
      Analyze scientific reasoning ability
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
