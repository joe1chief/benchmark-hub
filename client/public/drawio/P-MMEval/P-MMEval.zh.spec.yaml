  title: P-MMEval 构建与评测流程
  description: 与论文一致地展示 P-MMEval 的筛选、补译、人工本地化、平行组装、提示与多语言评分流程。
  legend: 八个基准组成部分统一覆盖十种语言；GPT-4o 仅补齐缺失翻译，专业翻译团队负责复核与修订。
nodes:
  - id: step_1
    label: |-
      统一语言覆盖范围
      英文 中文 阿拉伯文 西班牙文
      日文 韩文 泰文 法文
      葡萄牙文 越南文 · 7个语系
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      汇集11个候选数据集
      基础理解任务
      基础生成任务
      多语言候选池
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      使用三组模型对探测
      Qwen2.5 7B 对 72B
      LLaMA3.1 8B 对 70B
      Mistral Nemo 对 Large
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      执行配对样本t检验
      英文加四种受支持语言
      每种语言最多250条
      三组模型对均要求p小于0.01
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      保留基础基准
      XNLI · MHellaSwag
      Flores-200
      对模型规模差异显著
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      加入五个专项数据集
      HumanEval-XL · MGSM
      MLogiQA · MMMLU
      MIFEval
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      补齐缺失翻译
      用GPT-4o生成未覆盖语言
      每个组成部分扩展至十种语言
      保持平行样本对齐
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      专业翻译团队复核
      修订并本地化措辞
      移除文化上不可映射条目
      验证跨语言语义等价
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      形成平行P-MMEval
      8个基准组成部分 · 7类任务
      10种语言 · 7个语系
      共21,580条分语言实例
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      固定各组成部分样本数
      1012 · 120 · 120 · 80
      250 · 80 · 400 · 96
      八个组成部分均按每种语言计
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      统一评测提示
      改编OpenCompass与lm-eval
      约束答案输出格式
      为母语提示翻译指令
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      运行三种提示设置
      英文 · 母语 · 英文少样本
      MGSM使用思维链
      其余任务直接作答
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      采用任务专用指标
      分类任务使用准确率
      Flores-200使用BLEU
      HumanEval-XL使用Pass@1
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告多语言一致性
      按任务与语言汇总得分
      以CACR衡量跨语言迁移
      一致比较不同模型规模
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
