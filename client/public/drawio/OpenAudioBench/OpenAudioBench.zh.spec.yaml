      百川团队构建音频任务
      逻辑推理
      202条
    type: database
    size: xl
    position:
      x: 640
      'y': 40
  - id: llama
    label: |-
      采用Spoken Llama Questions
      通用知识音频
      提供参考答案
      300条
    type: database
    size: xl
    position:
      x: 640
      'y': 224
  - id: web
    label: |-
      抽样Web Questions
      从完整数据集随机抽取
      通用知识问答
      1,000条
    type: database
    size: xl
    position:
      x: 640
      'y': 408
  - id: trivia
    label: |-
      抽样TriviaQA
      从完整数据集随机抽取
      通用知识问答
      1,000条
    type: database
    size: xl
    position:
      x: 640
      'y': 592
  - id: alpaca
    label: |-
      筛选AlpacaEval
      Helpful-base和Vicuna子集
      移除数学与代码问题
      199条
    type: database
    size: xl
    position:
      x: 640
      'y': 776
  - id: speech
    label: |-
      合成语音指令
      使用作者TTS模型
      转换Web、Trivia和Alpaca提示
      按组件保留公开音频
    type: process
    size: xl
    position:
      x: 960
      'y': 672
  - id: release
    label: |-
      组装OpenAudioBench
      五个音频组件
      202 + 300 + 1,000 + 1,000 + 199
      合计2,701条
    type: database
    size: xl
    position:
      x: 1240
      'y': 408
  - id: st
    label: |-
      运行语音转文本
      音频输入
      文本输出
      使用输出文本评测
    type: process
    size: xl
    position:
      x: 1520
      'y': 224
  - id: ss
    label: |-
      运行非级联语音转语音
      音频输入
      文本与音频交错输出
      合并输出文本后评测
    type: process
    size: xl
    position:
      x: 1520
      'y': 592
  - id: normalize
    label: |-
      准备评分输入
      语音转文本保留直接文本
      语音转语音使用合并文本
      将回答与任务上下文配对
    type: process
    size: xl
    position:
      x: 1800
      'y': 408
  - id: judge_ref
    label: |-
      评判有参考答案任务
      GPT-4o使用参考答案
      覆盖Reasoning、Llama、Web与Trivia
      输出正确率或分数
    type: process
    size: xl
    position:
      x: 2080
      'y': 224
  - id: judge_open
    label: |-
      评判开放式AlpacaEval
      基于GPT-4o给质量分
      固定工具不使用参考答案
      考查帮助性相关性准确性和细节
    type: process
    size: xl
    position:
      x: 2080
      'y': 592
  - id: report
    label: |-
      报告五项组件结果
      分开报告语音转文本
      与语音转语音
      按数据集给正确率或分数
      论文未报告单一总分公式
    type: terminal
    size: xl
    position:
      x: 2360
      'y': 408
  - id: release_boundary
    label: |-
      固定官方发布与评测工具
      Git 805d456433db · HF 98f8fa0d5fa7
      CSV行数为202、300、1000、1000、199
      2,701个音频 · 启动7项任务
    type: document
    size: xl
    position:
      x: 1240
      'y': 960
  - id: drift_boundary
    label: |-
      论文与工具差异
      Reasoning使用1到5分且阈值为4
      Llama报百分比 · Web与Trivia乘10
      Alpaca使用1到10分 · 重复轮数不同
    type: document
    size: xl
    position:
      x: 1800
      'y': 960
  - id: openness_boundary
    label: |-
      公开发布边界
      HF公开且无需门控
      未声明数据集许可且无LICENSE文件
      模型代码许可不覆盖HF数据
    type: document
    size: xl
    position:
      x: 2360
      'y': 960
