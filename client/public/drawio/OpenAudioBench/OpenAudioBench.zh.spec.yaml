meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenAudioBench 构建与评测流程
  description: 依据论文和官方数据卡，组装五个音频理解子集，并在语音转文本和语音转语音设置下使用GPT-4o评测。
  legend: 五个公开组件分别含202、300、1,000、1,000和199条，共计2,701道音频问题。
nodes:
  - id: goal
    label: |-
      定义音频理解范围
      逻辑推理
      通用知识
      开放式问答
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: reasoning
    label: |-
      自建Reasoning QA
      百川团队构建音频任务
      逻辑推理
      202条
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: llama
    label: |-
      采用Spoken Llama Questions
      通用知识
      提供参考答案
      300条
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: web
    label: |-
      抽样Web Questions
      从完整数据集随机抽取
      通用知识问答
      1,000条
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: trivia
    label: |-
      抽样TriviaQA
      从完整数据集随机抽取
      通用知识问答
      1,000条
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: alpaca
    label: |-
      筛选AlpacaEval
      Helpful-base和Vicuna子集
      移除数学与代码问题
      199条
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: speech
    label: |-
      生成语音指令
      使用作者TTS模型
      转换Web、Trivia和Alpaca提示
      保留Spoken Llama音频
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      组装OpenAudioBench
      五个音频组件
      逻辑、通用与开放任务
      合计2,701条
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: st
    label: |-
      运行语音转文本设置
      音频输入
      文本输出
      用输出文本评测
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: ss
    label: |-
      运行语音转语音设置
      音频输入
      文本音频交错输出
      非级联生成
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: normalize
    label: |-
      归一化模型回答
      合并SS交错输出中的文本
      ST保留直接文本
      形成评分输入
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: judge_ref
    label: |-
      评判有参考答案任务
      提供参考答案
      GPT-4o判断正确性
      覆盖Reasoning、Llama、Web、Trivia
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: judge_open
    label: |-
      评判开放式AlpacaEval
      基于GPT-4o给分
      论文未报告参考答案
      使用公开评测工具
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告五项结果
      按数据集给准确率或分数
      分别报告ST与SS
      分数越高越好
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: goal
    to: reasoning
    type: primary
  - from: reasoning
    to: llama
    type: primary
  - from: llama
    to: web
    type: primary
  - from: web
    to: trivia
    type: primary
  - from: trivia
    to: alpaca
    type: primary
  - from: alpaca
    to: speech
    type: primary
  - from: speech
    to: release
    type: primary
  - from: release
    to: st
    type: primary
  - from: st
    to: ss
    type: primary
  - from: ss
    to: normalize
    type: primary
  - from: normalize
    to: judge_ref
    type: primary
  - from: judge_ref
    to: judge_open
    type: primary
  - from: judge_open
    to: report
    type: primary
modules: []
