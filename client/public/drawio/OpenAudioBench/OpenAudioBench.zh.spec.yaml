meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenAudioBench 构建与评测流程
  description: 对齐论文与固定发布版本，并行构建五个音频理解组件，经两种推理设置后按组件进入对应的GPT-4o评分路径。
  legend: 实线箭头表示论文支持的基准主流程；虚线箭头表示固定证据、公开评测工具行为、实现差异与开放性边界，不是额外基准阶段。
