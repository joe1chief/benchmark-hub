    labelPosition: start
  - from: choice_gate
    to: prompt_match
    type: primary
    label: 否 · 不打乱选项
    labelPosition: end
  - from: shuffle
    to: prompt_match
    type: primary
  - from: prompt_match
    to: inference
    type: primary
  - from: inference
    to: metric_gate
    type: primary
  - from: inference
