meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBench 论文 v1 构建与评测流程
  description: 依据一手来源并锁定 arXiv:2407.10990v1，区分论文中的 300,901 题语料、平衡采样的 8,913 题评测快照， 以及后续已升级为 MedBench v5 的在线平台。
  legend: 实线表示论文定义的构建与计分流程；带标签分支展示不同来源的整理、病例改写审批、选项循环打乱及按数据集配置的指标； 虚线表示独立验证或披露边界，而非参与计分的数据流。
nodes:
  - id: scope
    label: |-
      定义五个评测维度
      MLU · MLG · MKQA
      CMR · HSE
      中文医学综合评测
    type: document
    size: xl
    position:
      x: 20
      'y': 340
  - id: source_gate
    label: |-
      数据集来自哪类来源？
      论文 v1 构建路线
    type: decision
    size: xl
    position:
      x: 300
      'y': 340
  - id: public_sources
    label: |-
      整合八个公开数据集
      CMeEE-v2 · CMeIE-v2 · CHIP-CDEE
      CHIP-CDN · CHIP-CTC · MedDG
      IMCS-V2-MRG · CMB-Clin
    type: database
    size: xl
    position:
      x: 580
      'y': 80
  - id: constructed_sources
    label: |-
      由考试/教材/病例自建 12 个数据集
      SMDoc · DBMHG · Med-Exam
      MedHC · MedMC · MedSpeQA · MedHG
      DDx-basic · DDx-advanced · MedTreat
      MedSafety · DrugCA
    type: database
    size: xl
    position:
      x: 580
      'y': 600
  - id: curate
    label: |-
      执行五阶段整理
      收集 · 筛选 · 改写
      编制 · 核验
      完整性 · 代表性 · 多样性
    type: process
    size: xl
    position:
      x: 860
      'y': 600
  - id: clinical_gate
    label: |-
      是否为 DDx-basic、DDx-advanced
      或 MedTreat 临床病例？
    type: decision
    size: xl
    position:
      x: 1140
      'y': 600
  - id: general_verify
    label: |-
      常规医学核验
      两名资深医生
      每人均有十年以上经验
      检查准确性与专业性
    type: user
    size: xl
    position:
      x: 1420
      'y': 440
  - id: scare_rewrite
    label: |-
      改写临床病历
      一名十年以上经验资深医生
      遵循 SCARE 2023 字段
      统一语义并保护隐私
    type: process
    size: xl
    position:
      x: 1420
      'y': 760
  - id: special_gate
    label: |-
      另两名资深医生是否均通过
      病例质量与选项合理性审查？
    type: decision
    size: xl
    position:
      x: 1700
      'y': 760
  - id: not_qualified
    label: |-
      按论文规则不合格
      后续处置未披露
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 980
  - id: merge
    label: |-
      合并已整理来源
      八个公开集 + 十二个自建集
      封闭式 + 开放式任务
      单选题 + 多选题
    type: process
    size: xl
    position:
      x: 1980
      'y': 340
  - id: corpus
    label: |-
      MedBench 论文 v1 语料
      300,901 道中文题目
      20 个数据集 · 43 个专业
      论文 arXiv:2407.10990v1
    type: database
    size: xl
    position:
      x: 2260
      'y': 340
  - id: rights_boundary
    label: |-
      发布边界
      平台可访问但无原始语料版本
      标准答案与题目物理隔离
      数据许可证及完整快照未披露
    type: document
    size: xl
    position:
      x: 2260
      'y': 700
  - id: refresh_sample
    label: |-
      生成评测快照
      平衡随机采样 8,913 条
      覆盖极小集并代表性抽取大集
      每三个月更新一次
    type: process
    size: xl
    position:
      x: 2540
      'y': 340
  - id: platform
    label: |-
      论文 v1 云端流程
      请求题目 · 本地推理
      上传答案 · 获取指标
      查看排名 · 标准答案始终隐藏
    type: cloud
    size: xl
    position:
      x: 2820
      'y': 340
  - id: version_drift
    label: |-
      在线平台漂移 · 2026-07-21
      前端已面向 MedBench v5
      API 列出 36 个 LLM 数据集及新轨道
      并非可复现的论文 v1 实现版本
    type: document
    size: xl
    position:
      x: 2820
      'y': 700
  - id: choice_gate
    label: |-
      是否为选项题？
      动态评测路线
    type: decision
    size: xl
    position:
      x: 3100
      'y': 340
  - id: shuffle
    label: |-
      穷举循环打乱选项
      评测每一种循环位移
      每次循环位移均回答正确
      才能获得该题分数
    type: process
    size: xl
    position:
      x: 3380
      'y': 80
  - id: prompt_match
    label: |-
      随机匹配提示词
      每题从提示池抽取模板
      论文演示采用 K = 3
      提示不改变题目语境与答案
    type: document
    size: xl
    position:
      x: 3660
      'y': 340
  - id: inference
    label: |-
      执行本地模型推理
      将答案返回平台
      运行全自动评测
      题目与答案绝不在同地共存
    type: process
    size: xl
    position:
      x: 3940
      'y': 340
  - id: metric_gate
    label: |-
      当前数据集配置了
      哪一种评测指标？
    type: decision
    size: xl
    position:
      x: 4220
      'y': 340
  - id: accuracy
    label: |-
      准确率
      Med-Exam · MedHG
      MedSafety · DrugCA
      对照标准答案 · 报告 0-100 分
    type: process
    size: xl
    position:
      x: 4500
      'y': 80
  - id: text_metrics
    label: |-
      BLEU + ROUGE-L
      开放式问答
      各指标归一化至 0-100
      保留两个数据集级指标
    type: process
    size: xl
    position:
      x: 4500
      'y': 300
  - id: micro_f1
    label: |-
      Micro-F1
      信息抽取
      CHIP 封闭问答 + DDx 任务
      按数据集配置计分
    type: process
    size: xl
    position:
      x: 4500
      'y': 520
  - id: implementation_boundary
    label: |-
      未披露的评测边界
      无论文 v1 评分器仓库
      缺少解析与无效输出处理规则
      缺少种子、分词及分母规则
    type: document
    size: xl
    position:
      x: 3940
      'y': 700
  - id: aggregate
    label: |-
      汇总可比得分
      先平均每个维度内的数据集
      再平均五个维度
      报告分维度与总成绩
    type: process
    size: xl
    position:
      x: 4780
      'y': 340
  - id: human_study
    label: |-
      独立人工验证
      五个数据集各十题 · 共 50 题
      五个模型 · 三名盲评
      十年以上经验资深医生
    type: user
    size: xl
    position:
      x: 5060
      'y': 340
  - id: human_rank
    label: |-
      对照参考答案比较排名
      排名 1 至 5 · 赋分 5 至 1
      仅属人工研究
      不计入 MedBench 总分
    type: terminal
    size: xl
    position:
      x: 5340
      'y': 340
edges:
