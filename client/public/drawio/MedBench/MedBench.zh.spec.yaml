    labelPosition: end
  - from: metric_gate
    to: accuracy
    type: primary
    label: 准确率路线
    labelPosition: start
  - from: metric_gate
    to: text_metrics
    type: primary
    label: 开放问答路线
    labelPosition: center
  - from: metric_gate
    to: micro_f1
    type: primary
    label: Micro-F1 路线
    labelPosition: end
  - from: accuracy
