meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBench 构建与评测流程
  description: 对齐论文的构建与动态云端评测流程，覆盖 20 个数据集、43 个临床专业、五个能力维度， 共 300,901 道中文医学题目。
  legend: 上行从左至右为构建流程，下行从右至左为评测流程；平台平衡采样 8,913 条记录， 物理隔离题目和标准答案，并每三个月更新数据。
nodes:
  - id: dimensions
    label: |-
      定义五个评测维度
      医学语言理解
      生成 · 知识问答 · 复杂推理
      医疗安全与伦理
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: public
    label: |-
      整合八个公开数据集
      七个 CBLUE 数据集
      加入 CMB-Clin
      复用官方题目与标签
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: newsets
    label: |-
      自建十二个新数据集
      考试 · 教材 · 临床病例
      覆盖知识 · 诊断 · 安全
      包含封闭式与开放式任务
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: curate
    label: |-
      执行五阶段数据整理
      收集 · 筛选 · 改写
      编制 · 核验
      保证准确性与隐私
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: cases
    label: |-
      改写三个临床病例集
      DDx-basic · DDx-advanced · MedTreat
      一名资深医生依照 SCARE 2023
      另两名资深医生必须通过
    type: user
    size: xl
    position:
      x: 980
      'y': 40
  - id: verify
    label: |-
      开展医学核验
      两名资深医生复核
      均拥有十年以上经验
      统一语言并确保语义准确
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: corpus
    label: |-
      形成 MedBench 语料
      300,901 道中文题目
      20 个数据集 · 43 个专业
      单选 · 多选 · 开放题
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: platform
    label: |-
      部署云端评测平台
      物理隔离题目与标准答案
      平衡采样 8,913 条记录
      每三个月更新一次
    type: cloud
    size: xl
    position:
      x: 1460
      'y': 420
  - id: shuffle
    label: |-
      循环打乱选项
      评测全部可能顺序
      所有排列均答对才得分
      防止记忆选项位置
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompts
    label: |-
      动态匹配提示词
      从 K = 3 个模板中随机选择
      按题型适配提示
      保持评测可复现
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: inference
    label: |-
      执行模型推理
      向平台提交答案
      全程隐藏标准答案
      运行全自动评测
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: metrics
    label: |-
      应用任务专属指标
      Accuracy · Micro-F1
      BLEU · ROUGE-L
      文本指标归一化至 0-100
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: aggregate
    label: |-
      汇总可比得分
      先计算各维度平均分
      再平均五个维度
      报告分维度与总成绩
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      验证并发布结果
      50 题 · 5 数据集 · 5 模型
      三名资深医生盲评
      比对排序并发布报告
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: dimensions
    to: public
    type: primary
  - from: public
    to: newsets
    type: primary
  - from: newsets
    to: curate
    type: primary
  - from: curate
    to: cases
    type: primary
  - from: cases
    to: verify
    type: primary
  - from: verify
    to: corpus
    type: primary
  - from: corpus
    to: platform
    type: primary
  - from: platform
    to: shuffle
    type: primary
  - from: shuffle
    to: prompts
    type: primary
  - from: prompts
    to: inference
    type: primary
  - from: inference
    to: metrics
    type: primary
  - from: metrics
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
