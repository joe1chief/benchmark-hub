meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBench Paper-v1 Construction and Evaluation
  description: >-
    Primary-source workflow pinned to arXiv:2407.10990v1, separating the 300,901-item paper corpus from the balanced
    8,913-item evaluation snapshot and from the later live MedBench v5 platform.
  legend: >-
    Solid arrows show paper-defined construction and scoring. Labeled branches expose source-specific curation,
    case-rewrite approval, choice shuffling, and dataset-configured metrics. Dashed arrows mark validation or disclosure
    boundaries rather than scored data flow.
nodes:
  - id: scope
    label: |-
      Define Five Dimensions
      MLU · MLG · MKQA
      CMR · HSE
      Chinese Medical Evaluation
    type: document
    size: xl
    position:
      x: 20
      'y': 340
  - id: source_gate
    label: |-
      Which Dataset Source?
      Paper-v1 Construction Route
    type: decision
    size: xl
    position:
      x: 300
      'y': 340
  - id: public_sources
    label: |-
      Integrate Eight Public Datasets
      CMeEE-v2 · CMeIE-v2 · CHIP-CDEE
      CHIP-CDN · CHIP-CTC · MedDG
      IMCS-V2-MRG · CMB-Clin
    type: database
    size: xl
    position:
      x: 580
      'y': 80
  - id: constructed_sources
    label: |-
      Build 12 from Exams/Textbooks/Cases
      SMDoc · DBMHG · Med-Exam
      MedHC · MedMC · MedSpeQA · MedHG
      DDx-basic · DDx-advanced · MedTreat
      MedSafety · DrugCA
    type: database
    size: xl
    position:
      x: 580
      'y': 600
  - id: curate
    label: |-
      Five-stage Curation
      Collect · Screen · Rewrite
      Compile · Verify
      Integrity · Representation · Diversity
    type: process
    size: xl
    position:
      x: 860
      'y': 600
  - id: clinical_gate
    label: |-
      DDx-basic, DDx-advanced,
      or MedTreat Case History?
    type: decision
    size: xl
    position:
      x: 1140
      'y': 600
  - id: general_verify
    label: |-
      General Medical Verification
      Two Senior Physicians
      Each Has over Ten Years' Experience
      Check Accuracy + Professionalism
    type: user
    size: xl
    position:
      x: 1420
      'y': 440
  - id: scare_rewrite
    label: |-
      Rewrite Clinical Records
      One Senior Physician · over Ten Years
      Follow SCARE 2023 Fields
      Standardize Semantics + Protect Privacy
    type: process
    size: xl
    position:
      x: 1420
      'y': 760
  - id: special_gate
    label: |-
      Do Two Additional Senior Doctors
      Both Approve Case Quality
      and Option Reasonableness?
    type: decision
    size: xl
    position:
      x: 1700
      'y': 760
  - id: not_qualified
    label: |-
      Not Qualified by Paper Rule
      Later Disposition Not Reported
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 980
  - id: merge
    label: |-
      Integrate Curated Sources
      Eight Public + Twelve Constructed
      Closed + Open Tasks
      Single-choice + Multiple-choice
    type: process
    size: xl
    position:
      x: 1980
      'y': 340
  - id: corpus
    label: |-
      MedBench Paper-v1 Corpus
      300,901 Chinese Questions
      20 Datasets · 43 Specialties
      Paper arXiv:2407.10990v1
    type: database
    size: xl
    position:
      x: 2260
      'y': 340
  - id: rights_boundary
    label: |-
      Release Boundary
      Platform Access, Not a Raw Corpus Revision
      Gold Answers Are Physically Separated
      Dataset License + Full Snapshot Undisclosed
    type: document
    size: xl
    position:
      x: 2260
      'y': 700
  - id: refresh_sample
    label: |-
      Generate Evaluation Snapshot
      Balanced Random Sample: 8,913
      Cover Tiny Sets + Represent Large Sets
      Refresh Every Three Months
    type: process
    size: xl
    position:
      x: 2540
      'y': 340
  - id: platform
    label: |-
      Paper-v1 Cloud Workflow
      Request Questions · Infer Locally
      Upload Answers · Receive Metrics
      View Ranking · Gold Remains Hidden
    type: cloud
    size: xl
    position:
      x: 2820
      'y': 340
  - id: version_drift
    label: |-
      Live-platform Drift · 2026-07-21
      Front End Targets MedBench v5
      API Lists 36 LLM Datasets + New Tracks
      Not a Reproducible Paper-v1 Revision
    type: document
    size: xl
    position:
      x: 2820
      'y': 700
  - id: choice_gate
    label: |-
      Choice-based Question?
      Dynamic-evaluation Route
    type: decision
    size: xl
    position:
      x: 3100
      'y': 340
  - id: shuffle
    label: |-
      Exhaustive Circular Shuffling
      Evaluate Every Circular Rotation
      Correct under Every Rotation
      Is Required to Earn the Score
    type: process
    size: xl
    position:
      x: 3380
      'y': 80
  - id: prompt_match
    label: |-
      Random Prompt Matching
      Sample from a Prompt Pool per Question
      Paper Demonstration Uses K = 3
      Prompt Does Not Change Context or Gold
    type: document
    size: xl
    position:
      x: 3660
      'y': 340
  - id: inference
    label: |-
      Run Local Model Inference
      Return Answers to the Platform
      Fully Automatic Evaluation
      Question and Gold Never Co-reside
    type: process
    size: xl
    position:
      x: 3940
      'y': 340
  - id: metric_gate
    label: |-
      Which Metric Is Configured
      for This Dataset?
    type: decision
    size: xl
    position:
      x: 4220
      'y': 340
  - id: accuracy
    label: |-
      Accuracy
      Med-Exam · MedHG
      MedSafety · DrugCA
      Compare with Gold · Report 0-100
    type: process
    size: xl
    position:
      x: 4500
      'y': 80
  - id: text_metrics
    label: |-
      BLEU + ROUGE-L
      Open Question Answering
      Normalize Each Metric to 0-100
      Preserve Both Dataset Metrics
    type: process
    size: xl
    position:
      x: 4500
      'y': 300
  - id: micro_f1
    label: |-
      Micro-F1
      Information Extraction
      CHIP Closed QA + DDx Tasks
      Dataset-specific Scoring
    type: process
    size: xl
    position:
      x: 4500
      'y': 520
  - id: implementation_boundary
    label: |-
      Undisclosed Evaluation Boundary
      No Paper-v1 Evaluator Repository
      Parser + Invalid-output Handling Absent
      Seeds, Tokenization + Denominators Absent
    type: document
    size: xl
    position:
      x: 3940
      'y': 700
  - id: aggregate
    label: |-
      Aggregate Comparable Scores
      Average Datasets within Each Dimension
      Then Average the Five Dimensions
      Report Dimension + Total Scores
    type: process
    size: xl
    position:
      x: 4780
      'y': 340
  - id: human_study
    label: |-
      Separate Human Validation
      Ten Each from Five Datasets · 50 Total
      Five Models · Three Blinded
      Senior Physicians over Ten Years
    type: user
    size: xl
    position:
      x: 5060
      'y': 340
  - id: human_rank
    label: |-
      Compare Rankings with References
      Rank 1 to 5 · Award 5 to 1 Points
      Human Study Only
      Not Part of the MedBench Total
    type: terminal
    size: xl
    position:
      x: 5340
      'y': 340
