meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBench Build and Evaluation Process
  description: >-
    Paper-aligned construction and dynamic cloud evaluation of 300,901 Chinese medical questions spanning 20 datasets,
    43 clinical specialties, and five capability dimensions.
  legend: >-
    Read construction left-to-right, then evaluation right-to-left; the platform samples 8,913 balanced records,
    physically separates questions from gold answers, and refreshes the collection every three months.
nodes:
  - id: dimensions
    label: |-
      Define Five Dimensions
      Medical Language Understanding
      Generation · Knowledge QA · Reasoning
      Healthcare Safety and Ethics
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: public
    label: |-
      Integrate Eight Public Datasets
      Seven CBLUE Datasets
      Plus CMB-Clin
      Reuse Official Questions and Labels
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: newsets
    label: |-
      Construct Twelve New Datasets
      Exams · Textbooks · Clinical Cases
      Cover Knowledge · Diagnosis · Safety
      Include Closed and Open Tasks
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: curate
    label: |-
      Apply Five Curation Stages
      Collect · Screen · Rewrite
      Compile · Verify
      Preserve Accuracy and Privacy
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: cases
    label: |-
      Rewrite Three Clinical Case Sets
      DDx-basic · DDx-advanced · MedTreat
      One Senior Doctor Uses SCARE 2023
      Two More Doctors Must Approve
    type: user
    size: xl
    position:
      x: 980
      'y': 40
  - id: verify
    label: |-
      Perform Medical Verification
      Two Senior Physicians
      Each Has over Ten Years' Experience
      Standardize Language and Semantics
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: corpus
    label: |-
      Form the MedBench Corpus
      300,901 Chinese Questions
      20 Datasets · 43 Specialties
      Single · Multiple · Open-ended
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: platform
    label: |-
      Deploy the Cloud Platform
      Physically Separate Questions and Gold
      Sample 8,913 Balanced Records
      Refresh Every Three Months
    type: cloud
    size: xl
    position:
      x: 1460
      'y': 420
  - id: shuffle
    label: |-
      Apply Circular Choice Shuffling
      Evaluate Every Possible Ordering
      Require Correctness on All Shuffles
      Defeat Position Memorization
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompts
    label: |-
      Match a Dynamic Prompt
      Randomly Select from K = 3
      Adapt to the Question Type
      Keep Evaluation Reproducible
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: inference
    label: |-
      Run Model Inference
      Submit Answers to the Platform
      Keep Ground Truth Hidden
      Execute Fully Automatic Evaluation
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: metrics
    label: |-
      Apply Task-specific Metrics
      Accuracy · Micro-F1
      BLEU · ROUGE-L
      Normalize Text Metrics to 0-100
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: aggregate
    label: |-
      Aggregate Comparable Scores
      Average within Each Dimension
      Average All Five Dimensions
      Report Dimension and Total Results
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Validate and Publish Results
      50 Items · Five Datasets · Five Models
      Three Blinded Senior Physicians
      Compare Rankings and Release Reports
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
