meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EgoTempo Build Process
  description: >-
    Revision-pinned Ego4D clip construction, Gemini-assisted temporal QA curation, single-frame shortcut control, and
    paper-faithful open-ended evaluation.
  legend: >-
    Solid arrows trace the CVPR 2025 paper workflow; dashed branches pin the evidence and audit the released JSON. The
    paper/release count drift and paper/repository judge-model divergence are stated explicitly.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      arXiv:2503.13646v1
      repo @ 7022ba7
      dataset v1.0 · JSON SHA adc9e7d
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: source
    label: |-
      Ego4D source videos
      diverse real-world scenarios
      timestamped first-person
      narrations (Nj, tj)
    type: database
    size: xl
    position:
      x: 40
      'y': 320
  - id: windows
    label: |-
      Derive each narration window
      Tj = tj ± βi / (2α)
      βi: local mean timestamp gap
      α: global mean of those gaps
    type: process
    size: xl
    position:
      x: 300
      'y': 320
  - id: clips
    label: |-
      Group consecutive segments
      stop at 120 narrations
      or at 120 seconds
      source segments average 5 seconds
    type: process
    size: xl
    position:
      x: 560
      'y': 320
  - id: caption
    label: |-
      Gemini 1.5 Pro zero-shot
      caption clip + Ego4D narrations
      add background context
      missing from narrations
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: taxonomy
    label: |-
      Gemini 1.5 Pro: OpenQA
      10 capabilities
      action sequence · counting
      event order · future prediction
      object-specific action
      object sequence · object counting
      spatial · locating
      action-specific object
    type: document
    size: xl
    position:
      x: 1080
      'y': 320
    style:
      fontSize: 9
  - id: review
    label: |-
      Manual video-grounded review
      require multiframe evidence
      require QA logical consistency
      check against the actual clip
      discard irrelevant pairs
      discard non-temporal pairs
    type: process
    size: xl
    position:
      x: 1340
      'y': 320
  - id: shortcut
    label: |-
      Gemini single-frame gate
      discard pairs answerable
      from one frame
      curation frame choice
      is not disclosed
      evaluation uses central frame
    type: process
    size: xl
    position:
      x: 1600
      'y': 320
  - id: benchmark
    label: |-
      Paper: EgoTempo OpenQA benchmark
      500 QA · 10 × 50
      365 clips · 221 videos
      40 scenarios
      3–140 seconds · mean 45 seconds
    type: database
    size: xl
    position:
      x: 1860
      'y': 320
  - id: release_audit
    label: |-
      Pinned v1.0 JSON audit
      500 rows · 367 unique clip_id
      222 unique video_uid
      release counts differ from paper
    type: database
    size: xl
    position:
      x: 1860
      'y': 20
  - id: inputs
    label: |-
      Controlled evidence settings
      same questions and references
    type: decision
    size: xl
    position:
      x: 2120
      'y': 320
  - id: text
    label: |-
      Text only
      diagnose language / commonsense shortcuts
    type: document
    size: xl
    position:
      x: 2380
      'y': 80
  - id: single
    label: |-
      Single central frame
      diagnose static visual shortcuts
    type: document
    size: xl
    position:
      x: 2380
      'y': 320
  - id: video
    label: |-
      Uniform multiframe input
      rates S = 0.1, 0.5, 1 FPS
      fixed-frame / ordering
      ablations are separate
    type: document
    size: xl
    position:
      x: 2380
      'y': 560
  - id: prediction
    label: |-
      MLLM open-ended predictions
      closed and open video models
      Gemini experiments use 1.5 Flash
      not Pro (data generation)
    type: process
    size: xl
    position:
      x: 2640
      'y': 320
  - id: judge
    label: |-
      Paper: Gemini 1.5 Pro judge
      prediction + reference
      → correct / incorrect
      return a decision reason
      pinned notebook defaults to Flash
    type: process
    size: xl
    position:
      x: 2900
      'y': 320
  - id: report
    label: |-
      Accuracy by capability
      and overall
      absolute evidence-setting scores
      video gain = Accuracy(S)
      / single-frame accuracy
    type: terminal
    size: xl
    position:
      x: 3160
      'y': 320
