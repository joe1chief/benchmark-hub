meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "RealPref 构建与评测流程"
  description: "RealPref从PersonaHub采样并人工筛选100个角色，扩展人口统计、传记和生活事件，为每名用户生成10个原始偏好和3个可合理推导的泛化偏好，共1300个偏好。每个偏好使用从显式到隐式的四种表达方式。偏好、生活事件和随机会话被拼接为平均约2K至247K词元的历史。原始与泛化偏好分别生成多选、判断和开放式问题；分类任务使用准确率，开放答案按细粒度量表由LLM评判，并按表达类型、上下文长度和未见场景泛化切分结果。"
  legend: "来源：arXiv:2603.04191 Sections 3-4, cross-checked against GG14127/RealPref generation pipeline and dataset schema。实线箭头表示论文或官方资料明确支持的主流程。"
