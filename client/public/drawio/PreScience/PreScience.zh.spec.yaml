meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreScience 论文v2构建与评测流程
  description: 按论文v2重建时间安全的学术图谱、质量控制、七项预测任务、分任务指标与12个月语料模拟，并将较旧代码和数据版本单独标示。
  legend: 实线表示论文v2披露的构建与评测流程；虚线表示固定证据、公开重建、发布差异、实现与许可证边界，这些说明卡不是额外阶段。
nodes:
  - id: source_evidence
    label: |-
      固定论文与官方证据
      arXiv 2602.20459v2
      PDF b0d435e3f4c1 · Git 47384ed79c48
      HF a6cbe3237468 · 各版本分别固定
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: paper_scope
    label: |-
      定义持续更新的科学预测数据集
      观察论文、作者、引用与主题
      仅使用t_p之前的历史
      预测各截止点之后的科研贡献
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: target_window
    label: |-
      固定目标论文时间窗
      2023年10月至2025年9月
      六个AI类别 · 不含cs.ML
      训练44,984 · 测试52,836 · 共97,820
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: companion_graph
    label: |-
      扩展历史伴随论文图谱
      加入每篇目标的关键参考文献
      加入作者发表历史及其参考文献
      并集包含501,866篇不同论文
    type: database
    size: xl
    position:
      x: 860
      'y': 80
  - id: reference_filter
    label: |-
      筛选目标参考文献集合
      保留1至10篇关键参考文献
      排除零篇与异常大的集合
      要求论文记录可追溯至arXiv
    type: process
    size: xl
    position:
      x: 1120
      'y': 80
  - id: author_resolution
    label: |-
      解析作者身份
      使用Semantic Scholar图谱元数据
      应用S2AND作者消歧
      人工检查优于当时S2AG结果
    type: process
    size: xl
    position:
      x: 1380
      'y': 80
  - id: temporal_metadata
    label: |-
      对齐时序元数据
      发表数 · 引用数 · h指数
      每个字段锚定论文发表日期
      仅暴露t_p之前的历史
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: topic_labeling
    label: |-
      创建并验证202项主题分类
      gpt-5.4-2026-03-05标注全部目标
      Claude Opus 4.7复标530篇
      跨标注F1为0.67 · 另做GRIT验证
    type: process
    size: xl
    position:
      x: 1900
      'y': 80
  - id: paper_dataset
    label: |-
      固定论文v2描述的数据状态
      训练44,984 · 测试52,836
      目标97,820 · 全部501,866篇
      主题 · 作者 · 参考 · 引用轨迹
    type: database
    size: xl
    position:
      x: 1900
      'y': 400
  - id: task_families
    label: |-
      7项科研预测任务
      5项论文 + 2项主题
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 1640
      'y': 400
  - id: contribution_task
    label: |-
      生成未来科研贡献
      输入关键参考文献与t_p前历史
      预测标题与摘要
      LACER · ROUGE-L · BERTScore
    type: process
    size: xl
    position:
      x: 1380
      'y': 160
  - id: ranking_tasks
    label: |-
      执行三项排序任务
      合作者 · 前期工作 · 未来组合
      以第一作者或作者团队为条件
      nDCG@1000 · R-Precision
    type: process
    size: xl
    position:
      x: 1380
      'y': 320
  - id: citation_task
    label: |-
      预测12个月累计引用
      作者 · 参考 · 文本 · t_p前历史
      同时评测原始与对数引用空间
      MAE · R2 · Pearson · Spearman
    type: process
    size: xl
    position:
      x: 1380
      'y': 480
  - id: topic_tasks
    label: |-
      202个单主题 · 4,334个主题对
      预测其份额变化
      主题对须在任一切分至少有10篇
      R2 · Pearson相关系数
    type: process
    size: xl
    position:
      x: 1380
      'y': 640
  - id: task_metrics
    label: |-
      汇总论文v2各任务指标
      LACER采用1至10语义量表
      排序仅使用截止点可见候选
      分任务报告而不虚构单一总分
    type: process
    size: xl
    position:
      x: 1120
      'y': 400
  - id: corpus_rollout
    label: |-
      组合12个月语料模拟
      从2024年10月1日的历史开始
      按日抽取论文数与团队规模
      预测合作者与参考文献
      将生成论文回写语料
    type: process
    size: xl
    position:
      x: 860
      'y': 400
  - id: rollout_eval
    label: |-
      评测合成语料动态
      每月抽100篇论文
      检索10个GRIT近邻
      重复六次模拟
      LACER多样性 · LACER新颖性
    type: process
    size: xl
    position:
      x: 600
      'y': 400
  - id: findings
    label: |-
      分别报告各类结果
      各任务指标保持独立
      合成论文的多样性更低
      相对演化语料的新颖性下降
    type: terminal
    size: xl
    position:
      x: 340
      'y': 400
  - id: rebuild_boundary
    label: |-
      公开重建边界
      发布数据使用内部Semantic Scholar API
      公开脚本仅在意图上等价
      结果可能变化 · 不保证字节一致
    type: document
    size: xl
    position:
      x: 860
      'y': 240
  - id: release_drift
    label: |-
      论文v2与HF发布差异
      论文v2：六类 · 97,820个目标
      HF：七类 · 97,826个目标
      固定HF版本没有主题字段
    type: document
    size: xl
    position:
      x: 1900
      'y': 680
  - id: code_drift
    label: |-
      论文v2与固定代码差异
      论文v2定义七项任务
      固定仓库只提供四个任务目录
      没有未来组合或主题趋势运行器
    type: document
    size: xl
    position:
      x: 1640
      'y': 680
  - id: prompt_parser_boundary
    label: |-
      LACER实现边界
      默认评审为gpt-5-2025-08-07
      解析器读取Score后的数值
      API生成默认参数未固定
    type: document
    size: xl
    position:
      x: 1120
      'y': 160
  - id: license_boundary
    label: |-
      许可证与榜单边界
      Git代码：Apache 2.0
      HF数据：ODC-BY 1.0
      未找到官方排行榜
    type: document
    size: xl
    position:
      x: 80
      'y': 680
