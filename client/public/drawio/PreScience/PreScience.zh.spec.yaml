meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreScience 构建与评测流程
  description: 按论文与官方代码构建时间隔离的AI论文语料作者引用图四项科学预测任务以及12个月组合模拟。
  legend: 发布版包含2023年10月至2025年10月的9.8万篇目标论文以及共50.2万篇目标参考文献与作者历史论文，训练集和测试集各覆盖连续一年。
nodes:
  - id: step_1
    label: |-
      固定科学预测时间线
      预测截止点之后的科研进展
      排除截止点之后的证据
      保留完整时间元数据
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      筛选arXiv元数据快照
      2023年10月至2025年10月
      七个AI相关类别
      保留带日期的目标论文
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      映射并去重目标论文
      arXiv ID映射为S2 Corpus ID
      删除未解析或重复记录
      按发表日期排序
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      关联关键前期工作
      获取S2 influential引用
      只保留目标论文之前的文献
      每篇目标最多十篇关键参考
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      扩展作者发表历史
      获取目标论文作者
      加入目标之前的作者论文
      加入历史论文使用的参考文献
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      使用S2AND消歧作者
      合并记录形成作者身份
      剪除无效姓名聚类
      缺失作者保留为单例
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      时间对齐引用元数据
      仅统计目标发表前引用
      按截止时间计算作者h-index
      构建逐月引用轨迹
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      冻结文本与论文角色
      从快照恢复标题和摘要
      标注目标参考与历史角色
      形成结构化学术图谱
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      发布时间切分
      训练：2023年10月至2024年10月
      测试：2024年10月至2025年10月
      9.8万目标 · 共50.2万论文
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      预测合作者
      种子作者预测其余作者
      仅使用既往发表历史
      nDCG与R-Precision评分
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      选择前期工作
      由论文作者预测关键参考
      排序当时可用候选文献
      nDCG与R-Precision评分
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      生成科研贡献
      作者加关键参考生成标题与摘要
      对照未来真实目标论文
      LACERScore · ROUGE-L · BERTScore
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      预测科学影响
      目标文本上下文与计量特征
      预测12个月累计引用
      MAE · Pearson · Spearman
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      组合12个月模拟
      按天生成合成论文
      将合成历史传入后续轮次
      与人类论文比较新颖性与多样性
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
