meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreScience Build and Evaluation Process
  description: >-
    Paper- and code-aligned construction of a temporally isolated AI-paper corpus, author and citation graph, four
    scientific-forecasting tasks, and a 12-month composed simulation.
  legend: >-
    The release has 98K target papers from October 2023 to October 2025 and 502K total target, reference, and
    author-history papers; train and test occupy consecutive one-year windows.
nodes:
  - id: step_1
    label: |-
      Fix the Forecasting Timeline
      Predict science after a cutoff
      Exclude post-cutoff evidence
      Preserve chronological metadata
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Filter an arXiv Snapshot
      October 2023 to October 2025
      Seven AI-related categories
      Retain dated target papers
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Map and Deduplicate Targets
      Resolve arXiv IDs to S2 Corpus IDs
      Remove unresolved or duplicate records
      Sort targets by publication date
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Attach Key Prior Work
      Fetch influential S2 references
      Keep references before each target
      Limit targets to at most ten key refs
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Expand Author Histories
      Fetch target-paper authors
      Add their pre-target publications
      Add references used in those histories
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Disambiguate Authors with S2AND
      Merge records into author identities
      Prune invalid name clusters
      Preserve missing authors as singletons
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Align Citation Metadata
      Count citations only before each target
      Compute author h-index at cutoff
      Build monthly citation trajectories
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Freeze Text and Paper Roles
      Restore titles and abstracts from snapshot
      Tag targets references and histories
      Produce a structured scholarly graph
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Release Temporal Splits
      Train: Oct 2023 to Oct 2024
      Test: Oct 2024 to Oct 2025
      98K targets · 502K total papers
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Forecast Collaborators
      Seed author to remaining authors
      Use only prior publication history
      Score nDCG and R-Precision
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Select Prior Work
      Paper authors to key references
      Rank temporally available candidates
      Score nDCG and R-Precision
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Generate the Contribution
      Authors plus key references to title · abstract
      Compare with the future target
      LACERScore · ROUGE-L · BERTScore
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Predict Scientific Impact
      Target context and bibliometrics
      Forecast 12-month citations
      MAE · Pearson · Spearman
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Compose a 12-Month Simulation
      Generate papers day by day
      Feed synthetic history into later turns
      Compare novelty and diversity with humans
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
