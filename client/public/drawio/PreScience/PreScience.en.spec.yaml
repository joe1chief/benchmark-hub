meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreScience Paper-v2 Build and Evaluation Process
  description: >-
    Paper-v2 reconstruction of the time-safe scholarly graph, quality controls, seven forecasting tasks, task-specific
    metrics, and the 12-month corpus rollout, with older code and data releases kept separate.
  legend: >-
    Solid arrows show paper-v2 construction and evaluation flow. Dashed arrows mark fixed evidence, rebuild, release,
    implementation, and license boundaries; those callouts are not extra stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Primary and Official Evidence
      arXiv 2602.20459v2 · PDF b0d435e3f4c1
      Git 47384ed79c48 · HF a6cbe3237468
      Paper, Code, and Data Are Version-separated
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: paper_scope
    label: |-
      Define a Living Scientific Forecasting Dataset
      Observe Papers, Authors, Citations, and Topics
      Use Only History before t_p
      Forecast Contributions after Each Cutoff
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: target_window
    label: |-
      Fix the Target-paper Window
      October 2023 through September 2025
      Six AI Categories · Excludes cs.ML
      44,984 Train · 52,836 Test · 97,820 Total
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: companion_graph
    label: |-
      Expand the Historical Companion Graph
      Influential References of Each Target
      Author Publication Histories and Their References
      501,866 Unique Papers in the Union
    type: database
    size: xl
    position:
      x: 860
      'y': 80
  - id: reference_filter
    label: |-
      Filter Target Reference Sets
      Keep 1 to 10 Influential References
      Exclude Zero and Unusually Large Sets
      Require arXiv-reachable Paper Records
    type: process
    size: xl
    position:
      x: 1120
      'y': 80
  - id: author_resolution
    label: |-
      Resolve Author Identity
      Use Semantic Scholar Graph Metadata
      Apply S2AND Author Disambiguation
      Manual Examination Beats Current S2AG
    type: process
    size: xl
    position:
      x: 1380
      'y': 80
  - id: temporal_metadata
    label: |-
      Align Temporal Metadata
      Publication Counts · Citation Counts · h-indices
      Anchor Every Field to Publication Date
      Expose Only History before t_p
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: topic_labeling
    label: |-
      Create and Validate a 202-topic Taxonomy
      gpt-5.4-2026-03-05 Labels Every Target
      Claude Opus 4.7 Relabels 530 Papers
      Cross-label F1 0.67 · External GRIT Check
    type: process
    size: xl
    position:
      x: 1900
      'y': 80
  - id: paper_dataset
    label: |-
      Freeze the Paper-v2 Dataset State
      44,984 Train · 52,836 Test
      97,820 Targets · 501,866 Total Papers
      Topics · Authors · References · Citations
    type: database
    size: xl
    position:
      x: 1900
      'y': 400
  - id: task_families
    label: |-
      7 Forecasting Tasks
      5 Paper + 2 Topic
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 1640
      'y': 400
  - id: contribution_task
    label: |-
      Generate a Future Contribution
      Influential References plus History before t_p
      Predict Title and Abstract
      LACER · ROUGE-L · BERTScore
    type: process
    size: xl
    position:
      x: 1380
      'y': 160
  - id: ranking_tasks
    label: |-
      Run Three Ranking Tasks
      Collaborator · Prior Work · Future Combination
      First Author or Team Conditions the Ranking
      nDCG@1000 · R-Precision
    type: process
    size: xl
    position:
      x: 1380
      'y': 320
  - id: citation_task
    label: |-
      Predict 12-month Citation Count
      Authors · References · Text · History before t_p
      Evaluate Raw and Log Citation Space
      MAE · R2 · Pearson · Spearman
    type: process
    size: xl
    position:
      x: 1380
      'y': 480
  - id: topic_tasks
    label: |-
      202 Unary Topics · 4,334 Topic Pairs
      Forecast Their Share Change
      Pairs Need at Least 10 Papers in Either Split
      R2 · Pearson Correlation
    type: process
    size: xl
    position:
      x: 1380
      'y': 640
  - id: task_metrics
    label: |-
      Aggregate Paper-v2 Task Metrics
      LACER Uses a 1-to-10 Semantic Scale
      Rankings Use Cutoff-safe Candidate Pools
      Report Per-task Metrics without One Overall Score
    type: process
    size: xl
    position:
      x: 1120
      'y': 400
  - id: corpus_rollout
    label: |-
      Compose a 12-month Corpus Rollout
      Start from H at October 1, 2024
      Sample Papers and Teams Day by Day
      Predict Collaborators and References
      Fold Generated Papers Back
    type: process
    size: xl
    position:
      x: 860
      'y': 400
  - id: rollout_eval
    label: |-
      Evaluate Synthetic-corpus Dynamics
      Sample 100 Papers per Month
      Retrieve 10 GRIT Neighbors
      Repeat Six Rollouts
      LACER Diversity · LACER Novelty
    type: process
    size: xl
    position:
      x: 600
      'y': 400
  - id: findings
    label: |-
      Report Separate Outcomes
      Task Metrics Stay Task-specific
      Synthetic Papers Are Less Diverse
      Novelty Falls against the Evolving Corpus
    type: terminal
    size: xl
    position:
      x: 340
      'y': 400
  - id: rebuild_boundary
    label: |-
      Public-rebuild Boundary
      Released Data Used Internal Semantic Scholar APIs
      Public Scripts Are Equivalent in Intent
      Results May Vary · No Byte-identical Guarantee
    type: document
    size: xl
    position:
      x: 860
      'y': 240
  - id: release_drift
    label: |-
      Paper-v2 to HF-release Drift
      Paper v2: Six Categories · 97,820 Targets
      HF: Seven Categories · 97,826 Targets
      Fixed HF Revision Has No Topic Field
    type: document
    size: xl
    position:
      x: 1900
      'y': 680
  - id: code_drift
    label: |-
      Paper-v2 to Fixed-code Drift
      Paper v2 Defines Seven Tasks
      Pinned Repo Exposes Four Task Directories
      No Future-combination or Topic-trend Runner
    type: document
    size: xl
    position:
      x: 1640
      'y': 680
  - id: prompt_parser_boundary
    label: |-
      LACER Implementation Boundary
      Default Judge gpt-5-2025-08-07
      Parser Reads the Numeric Value after Score
      API Generation Defaults Are Not Pinned
    type: document
    size: xl
    position:
      x: 1120
      'y': 160
  - id: license_boundary
    label: |-
      License and Leaderboard Boundary
      Git Code: Apache 2.0
      HF Dataset: ODC-BY 1.0
      No Official Leaderboard Identified
    type: document
    size: xl
    position:
      x: 80
      'y': 680
