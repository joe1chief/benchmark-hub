meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMSU 构建流程
  description: 按论文四阶段构建覆盖 47 项任务的 5,000 道语音理解选择题，结合专家语言学设计、教材题目、三类音频来源、多轮人工审核，并以准确率评测 22 个模型。
  legend: 三类音频数量合计 5,000；任务划分为 24 项感知任务与 23 项推理任务。
nodes:
  - id: framework
    label: |-
      设计语言学框架
      咨询语言学专家
      覆盖六个主要子领域
      定义 47 项语音任务
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      组织能力层级
      24 项感知任务
      23 项推理任务
      语言学与副语言学
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: questions
    label: |-
      收集多项选择题
      来源为权威语言学教材
      以在线来源补充
      保持语言现象覆盖
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: options
    label: |-
      扩充答案选项
      专家参与设计提示
      GPT-4o 生成候选项
      构造可信干扰项
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: open_audio
    label: |-
      优先真实世界音频
      3,837 条开源音频
      占数据的 76.74%
      使用多样语音语料库
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: custom_audio
    label: |-
      加入 672 条定制录音
      由专业配音演员录制
      补齐缺失的音系线索
      纳入 15 名多样说话人
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: synthetic
    label: |-
      加入 491 条合成音频
      占数据的 9.82%
      使用 Azure 多音色 TTS
      选择 20 种不同声音
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: review
    label: |-
      执行多轮人工审核
      十名受训标注员
      过滤或改进低质样本
      检查问题 · 选项 · 音频
    type: user
    size: xl
    position:
      x: 1140
      'y': 420
  - id: finalize
    label: |-
      专家与团队最终复核
      检查清晰度和正确性
      保持数据多样性
      标注任务 · 类别 · 子领域
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: release
    label: |-
      汇总 5,000 道选择题
      感知 2,580 · 推理 2,420
      每项任务约 90 至 120 题
      平均音频时长 7.01 秒
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: evaluate
    label: |-
      评测 22 个音频模型
      12 个 SpeechLLM · 10 个 OmniLLM
      随机且平衡 A-D 选项
      人类基线为 15 人答 1,000 题
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      报告准确率
      汇总感知与推理总分
      语义 · 音系
      副语言学分项结果
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: framework
    to: taxonomy
    type: primary
  - from: taxonomy
    to: questions
    type: primary
  - from: questions
    to: options
    type: primary
  - from: options
    to: open_audio
    type: primary
  - from: open_audio
    to: custom_audio
    type: primary
  - from: custom_audio
    to: synthetic
    type: primary
  - from: synthetic
    to: review
    type: primary
  - from: review
    to: finalize
    type: primary
  - from: finalize
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
