meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMSU Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the paper-v3 four-stage benchmark construction, the disclosed pair-review and revision loops, the
    5,000-item public release, and the separately versioned official inference, parsing, failure, and accuracy code.
  legend: >-
    Solid arrows trace construction and evaluation. Decision branches carry explicit outcomes. Unconnected middle-row
    cards preserve release, reproducibility, and paper-to-code boundaries rather than implying undocumented steps.
