meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Spider 2.0 Build and Evaluation Process
  description: >-
    Paper-aligned construction of enterprise SQL workflows across six database systems, contamination-reducing rewrites,
    focused execution evaluators, multi-annotator quality control, and agentic Success Rate scoring.
  legend: >-
    Read benchmark construction left-to-right, then agent evaluation right-to-left; Spider 2.0 uses Success Rate, while
    the 547-task lite and snow text-to-SQL variants use Execution Accuracy.
nodes:
  - id: sources
    label: |-
      Enterprise Database Sources
      BigQuery / Snowflake / SQLite / DuckDB
      PostgreSQL / ClickHouse; 213 Databases
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: sql_pool
    label: |-
      Real Workflow Candidate Pool
      1,021 SQLs + 157 DBT Projects
      Real Tutorials / Forums / Projects; >50 Tokens
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: retain
    label: |-
      High-Quality Retention
      547 SQL Queries + 78 DBT Projects
      Execute Successfully, Timely, Non-Empty
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: rewrite
    label: |-
      Contamination-Reducing Rewrite
      Surface 84.2% + Semantic 42.0%
      Re-Execute Every Rewritten SQL
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: context
    label: |-
      Task Context and Instructions
      Dialect Docs + Database Interface + Codebase
      Manual Natural Questions; LLM-Assisted Paraphrase
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: quality
    label: |-
      Focused Evaluator + Quality Gate
      Scripts for String / Table / Database Answers
      >=3 Reviewers + False/True Red-Team Cases
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      Spider 2.0 Suite
      632 Agentic Workflows
      547-Task Lite and Snow SQL Variants
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Agentic Task Input
      Question + Database Interface + Codebase
      Project Config, Docs, and Context
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: agent
    label: |-
      Spider-Agent Multi-Turn Loop
      Explore Schema and Documentation
      Modify SQL / Python / Project Files
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: feedback
    label: |-
      Dynamic Environment Feedback
      Execute through CLI and Database
      Debug until Final Observation
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: evaluator
    label: |-
      Per-Task Focused Evaluation
      Check Essential String / Table / DB Elements
      Binary 0 or 1; Ignore Irrelevant Columns
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Spider 2.0 Results
      Agentic Success Rate (SR)
      Lite / Snow Execution Accuracy (EX)
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: sql_pool
    type: primary
  - from: sql_pool
    to: retain
    type: primary
  - from: retain
    to: rewrite
    type: primary
  - from: rewrite
    to: context
    type: primary
  - from: context
    to: quality
    type: primary
  - from: quality
    to: release
    type: primary
  - from: release
    to: input
    type: primary
  - from: input
    to: agent
    type: primary
  - from: agent
    to: feedback
    type: primary
  - from: feedback
    to: evaluator
    type: primary
  - from: evaluator
    to: report
    type: primary
modules: []
