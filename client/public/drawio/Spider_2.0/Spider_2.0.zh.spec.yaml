meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Spider 2.0 构建与评测流程
  description: 按论文展示跨六种数据库系统的企业 SQL 工作流、降污染重写、聚焦执行判定器、多标注员质控与 Agent 成功率评分。
  legend: 先从左到右阅读基准构建，再从右到左阅读 Agent 评测；Spider 2.0 使用成功率，547 题 lite/snow 文本转 SQL 变体使用执行准确率。
nodes:
  - id: sources
    label: |-
      企业数据库来源
      BigQuery / Snowflake / SQLite / DuckDB
      PostgreSQL / ClickHouse；共 213 个库
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: sql_pool
    label: |-
      真实工作流候选池
      1,021 条 SQL + 157 个 DBT 项目
      真实教程 / 论坛 / 项目；>50 Token
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: retain
    label: |-
      高质量保留门
      547 条 SQL + 78 个 DBT 项目
      执行成功、及时且结果非空
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: rewrite
    label: |-
      降污染重写
      表面重写 84.2% + 语义重写 42.0%
      重新执行每条重写 SQL
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: context
    label: |-
      任务上下文与指令
      方言文档 + 数据库接口 + 代码库
      人工问题；LLM 辅助改写
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: quality
    label: |-
      聚焦判定器 + 质量门
      支持字符串 / 表格 / 数据库答案脚本
      至少 3 人复核 + 正误红队用例
    type: decision
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      Spider 2.0 套件
      632 个 Agent 工作流
      547 题 Lite 与 Snow SQL 变体
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Agent 任务输入
      问题 + 数据库接口 + 代码库
      项目配置、文档与上下文
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: agent
    label: |-
      Spider-Agent 多轮循环
      探索 Schema 与文档
      修改 SQL / Python / 项目文件
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: feedback
    label: |-
      动态环境反馈
      通过 CLI 与数据库执行
      调试直到最终观测
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: evaluator
    label: |-
      每题聚焦执行评测
      检查字符串 / 表格 / 数据库核心元素
      二值 0/1；忽略无关列
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Spider 2.0 结果
      Agent 成功率（SR）
      Lite / Snow 执行准确率（EX）
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: sql_pool
    type: primary
  - from: sql_pool
    to: retain
    type: primary
  - from: retain
    to: rewrite
    type: primary
  - from: rewrite
    to: context
    type: primary
  - from: context
    to: quality
    type: primary
  - from: quality
    to: release
    type: primary
  - from: release
    to: input
    type: primary
  - from: input
    to: agent
    type: primary
  - from: agent
    to: feedback
    type: primary
  - from: feedback
    to: evaluator
    type: primary
  - from: evaluator
    to: report
    type: primary
modules: []
