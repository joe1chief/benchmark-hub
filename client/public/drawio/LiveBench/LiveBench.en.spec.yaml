meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveBench Build Process
  description: >-
    Paper-aligned LiveBench workflow: build tasks from recent competitions, datasets, news, arXiv abstracts, and movie
    synopses or from harder contamination-limited variants of prior benchmarks; cover 18 tasks in six categories;
    require objective ground truth and automatic grading; tailor prompts for parseable final answers; refresh monthly by
    replacing about one sixth of questions, prioritizing old or easy tasks; delay new-question release for one month so
    one sixth remains private on the leaderboard; run single-turn temperature-zero evaluation; score each question from
    zero to one; and average questions into tasks, tasks into categories, and six categories into LiveBench Score.
  legend: >-
    Two source types merge; the rejection branch enforces objective automatic grading; public and private sets rejoin
    for evaluation.
