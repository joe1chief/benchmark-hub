meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveBench Build, Release, and Evaluation Process
  description: >-
    Evidence-bounded reconstruction of LiveBench from arXiv:2406.19314v2, the pinned official code, and the deployed
    official site. The figure separates the paper's 18-task / 6-category snapshot from the live site's dated 23-task /
    7-category / 1,270-question cost basis, and distinguishes standard objective graders from the later agentic-coding
    harness.
  legend: >-
    Solid arrows show benchmark data, inference, and score flow. Dashed arrows show rejection, evidence, drift, or
    scoring-QC feedback. Paper-era counts and current-site counts are dated rather than merged.
nodes:
  - id: recent_sources
    label: |-
      Recent Information Sources
      Math Contests · arXiv · News
      Kaggle / Socrata · Movies · Code
      Freeze Source Dates per Release
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 160
    style:
      fontSize: 9
  - id: variant_sources
    label: |-
      Harder / More Diverse Variants
      AMPS · Big-Bench Hard · IFEval
      Procedural Synthetic Tasks
      Not New-source-only
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 400
    style:
      fontSize: 9
  - id: construct_tasks
    label: |-
      Task-specific Construction
      APIs · Sampling · Scripts · Authoring
      Paper: 40–100 Questions per Task
      Target ≈30–70% Frontier Success
    type: process
    module: construction
    size: xl
    position:
      x: 360
      'y': 240
    style:
      fontSize: 9
  - id: objective_gate
    label: |-
      Objective Ground Truth
      and Automatic Scorer?
    type: decision
    module: construction
    size: xl
    position:
      x: 680
      'y': 240
  - id: reject_task
    label: |-
      Reject Subjective or
      Unverifiable Task
      No Human / LLM Preference Judge
    type: document
    module: construction
    size: xl
    position:
      x: 680
      'y': 520
    style:
      fontSize: 9
  - id: prompt_contract
    label: |-
      Write Task-specific Prompt
      Zero-shot CoT · Best Guess
      Explicit Parsable Final Answer
      XML Tags / Bold / Exact Format
    type: process
    module: construction
    size: xl
    position:
      x: 1000
      'y': 240
    style:
      fontSize: 9
  - id: validate_questions
    label: |-
      Validate Questions + Ground Truth
      Generation-script Checks
      Author Inspection and Task QC
      Keep Diverse Difficulty
    type: process
    module: construction
    size: xl
    position:
      x: 1320
      'y': 240
    style:
      fontSize: 9
  - id: paper_snapshot
    label: |-
      Paper v2 / ICLR 2025 Snapshot
      18 Tasks · 6 Categories
      1,000 Questions after Update 1
      English · Test-only Benchmark
    type: database
    module: construction
    size: xl
    position:
      x: 1640
      'y': 240
    style:
      fontSize: 9
  - id: update_select
    label: |-
      Select Tasks to Refresh
      Oldest · Easiest · Suspected Leakage
      Paper Policy: Monthly Updates
    type: process
    module: maintenance
    size: xl
    position:
      x: 1640
      'y': 720
    style:
      fontSize: 9
  - id: regenerate
    label: |-
      Regenerate / Replace Questions
      ≈1/6 per Paper Update
      Change Generator for Harder Drift
      Rerun All Models after Update
    type: process
    module: maintenance
    size: xl
    position:
      x: 1960
      'y': 720
    style:
      fontSize: 9
  - id: version_tags
    label: |-
      Version Every Question
      Release Date · Removal Date
      Select a Dated Benchmark Release
    type: document
    module: maintenance
    size: xl
    position:
      x: 2280
      'y': 720
    style:
      fontSize: 9
  - id: public_release
    label: |-
      Public Questions / Prior Releases
      Code + Some Data on GitHub / HF
      Paper: New Batch Public after 1 Month
    type: database
    module: maintenance
    size: xl
    position:
      x: 2280
      'y': 960
    style:
      fontSize: 9
  - id: private_window
    label: |-
      Newest Questions Withheld
      Used by Official Leaderboard
      Paper Target: ≈1/6 Private
      Exact Private Subset Not Public
    type: database
    module: maintenance
    size: xl
    position:
      x: 2280
      'y': 1200
    style:
      fontSize: 9
  - id: current_snapshot
    label: |-
      Official Site · 2026-06-25
      23 Task Columns · 7 Categories
      Canonical Cost Basis: 1,270 Questions
      1,198 Regular + 72 Agentic v2
    type: database
    module: maintenance
    size: xl
    position:
      x: 1640
      'y': 1080
    style:
      fontSize: 9
  - id: release_drift
    label: |-
      Version Drift — Do Not Conflate
      Paper: 18 / 6 · Monthly ≈1/6
      Site: 23 / 7 / 1,270 · Full Refresh ≈6 Months
      README / Public HF Lag Latest Site
    type: document
    module: maintenance
    size: xl
    position:
      x: 1320
      'y': 1080
    style:
      fontSize: 9
  - id: release_select
    label: |-
      Choose Benchmark Release
      Official Code Supports 11 Dates
      Through 2026-06-25 at Code Pin
    type: user
    module: evaluation
    size: xl
    position:
      x: 40
      'y': 1440
    style:
      fontSize: 9
  - id: load_filter
    label: |-
      Load Version-valid Questions
      Release Date ≤ Selected Date
      Removal Date Empty or Later
      Question IDs Must Be Unique
    type: process
    module: evaluation
    size: xl
    position:
      x: 360
      'y': 1440
    style:
      fontSize: 9
  - id: eval_route
    label: Agentic Coding Category?
    type: decision
    module: evaluation
    size: xl
    position:
      x: 680
      'y': 1440
  - id: standard_infer
    label: |-
      Standard Model Inference
      Paper: Single-turn · T=0
      Code Base Fallback: T=0
      Model/Q/CLI/Provider Config
      Examples: T=0.7 / 1.0
    type: process
    module: evaluation
    size: xl
    position:
      x: 1000
      'y': 1320
    style:
      fontSize: 9
  - id: agentic_infer
    label: |-
      Current Agentic Coding v2
      Mini-SWE-Agent in Docker
      Patch Real Repositories
      Current Agent Cap: 250 Steps
    type: process
    module: evaluation
    size: xl
    position:
      x: 1000
      'y': 1600
    style:
      fontSize: 9
  - id: standard_scorer
    label: |-
      Store Answer + Metadata
      Task-specific Objective Evaluator
      Regex / Exact / Fuzzy / Edit-distance
      Tests / IF Verifiers · Fractional OK
    type: process
    module: evaluation
    size: xl
    position:
      x: 1640
      'y': 1320
    style:
      fontSize: 9
  - id: agentic_scorer
    label: |-
      Apply Patch + Run Repository Tests
      FAIL_TO_PASS + PASS_TO_PASS
      Resolved = 1 · Unresolved / No Patch = 0
      Infra / Flaky: Retry or Skip
    type: process
    module: evaluation
    size: xl
    position:
      x: 1640
      'y': 1600
    style:
      fontSize: 9
  - id: question_score
    label: |-
      Branch-specific Judgment Merge
      Standard: Task-specific Score in [0, 1]
      Agentic: Resolved 1 / Unresolved 0
      Keep Evaluation-status Metadata
    type: process
    module: evaluation
    size: xl
    position:
      x: 1960
      'y': 1440
    style:
      fontSize: 9
  - id: score_audit
    label: |-
      Standard-parser Manual QC
      Sample Incorrect Standard Outputs
      Broaden Fair Parsers if Needed
      Rescore Standard Models after Changes
    type: user
    module: evaluation
    size: xl
    position:
      x: 2280
      'y': 1480
    style:
      fontSize: 9
  - id: task_average
    label: |-
      Mean Question Scores
      → Task Score
    type: process
    module: aggregation
    size: xl
    position:
      x: 1960
      'y': 2080
  - id: category_average
    label: |-
      Equal Mean of Task Scores
      → Category Score
    type: process
    module: aggregation
    size: xl
    position:
      x: 1640
      'y': 2080
  - id: overall_average
    label: |-
      Equal Mean of Categories
      Paper: 6 · Current Site: 7
      → LiveBench Score
    type: formula
    module: aggregation
    size: xl
    position:
      x: 1320
      'y': 2080
  - id: leaderboard
    label: |-
      Release-specific Leaderboard
      Task · Category · Overall Breakdown
      Never Merge Scores across Releases
    type: terminal
    module: aggregation
    size: xl
    position:
      x: 1000
      'y': 2080
    style:
      fontSize: 9
  - id: release_boundary
    label: |-
      Public / Withheld Boundary
      Repo + Older HF Data Are Public
      Latest Questions Are Not Public
      No Frozen Public Full 2026 Corpus
    type: document
    module: evidence_boundary
    size: xl
    position:
      x: 680
      'y': 2320
    style:
      fontSize: 9
  - id: evidence_pins
    label: |-
      Evidence Freeze · 2026-07-21
      Paper v2 · Code 4bf3d6f4
      Site f2e0b4bc · Cost SHA 09ffc358
      Public HF Sets Changed 2025-04
    type: document
    module: evidence_boundary
    size: xl
    position:
      x: 40
      'y': 2320
    style:
      fontSize: 9
