meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveBench 构建流程
  description: >-
    依据论文重绘的 LiveBench 流程：一类任务来自近期竞赛、数据集、新闻、arXiv 摘要和电影梗概，另一类是既有 benchmark 的更难、污染受限变体，共覆盖六类 18
    个任务；仅保留有客观真值且可自动判分的任务，并定制可解析 终答格式；每月优先替换较旧或较易任务，平均替换约六分之一；新题延迟一个月公开，使榜单始终保留六分之一 私有题；以温度零单轮运行，逐题得 0 至 1
    分，再依次按题平均到任务、按任务平均到类别、按六类平均为总分。
  legend: 两类来源合并；拒绝分支保证客观自动判分；公开集与私有集在评测前汇合。
