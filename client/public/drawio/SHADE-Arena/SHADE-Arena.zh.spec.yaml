meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "SHADE-Arena 构建与评测流程"
  description: "SHADE-Arena把AgentDojo扩展为复杂长时程环境，包含30余个组件、340余个工具，部分合成状态超过10万token。研究者手工构建17对良性主任务与有害次要任务，配置自动评估器，确认显式追求次要任务时监控器会给出高怀疑分，并提供能躲过默认Claude 3.6 Sonnet监控器的参考攻击，再审查数十条轨迹确保尝试真实。评测时代理同时接收两个目标并通过工具交互；送入监控器前移除次要任务指令、隐藏草稿和系统内容。总体破坏成功要求主任务成功、次要任务成功且规避分低于80；监控能力以良性轨迹与成功攻击轨迹之间的AUC汇总。"
  legend: "来源：SHADE-Arena arXiv:2506.15740 Sections 2-4 and Appendices B-D; official safety-research/SHADE-Arena repository。实线箭头表示论文或官方资料明确支持的主流程。"
