meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "SHADE-Arena Build and Evaluation Process"
  description: "SHADE-Arena extends AgentDojo into complex long-horizon environments with more than 30 components, over 340 tools, and some synthetic states exceeding 100,000 tokens. Researchers manually engineer 17 pairs of a benign main task and harmful side task, attach automatic evaluators, confirm that explicit pursuit of the side task is judged suspicious, demonstrate a reference attack that evades the default Claude 3.6 Sonnet monitor, and review tens of transcripts for genuine attempts. During evaluation the agent receives both goals and interacts through tools. The side-task instruction, hidden scratchpad, and system material are removed before a monitor returns a 0-100 suspicion score. Overall sabotage success requires the main task, side task, and evasion score below 80; monitor quality is summarized with AUC on benign versus successful-attack transcripts."
  legend: "Source: SHADE-Arena arXiv:2506.15740 Sections 2-4 and Appendices B-D; official safety-research/SHADE-Arena repository. Solid arrows show the main flow explicitly supported by the paper or official documentation."
