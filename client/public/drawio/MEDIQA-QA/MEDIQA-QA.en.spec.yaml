meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MEDIQA-QA Construction, Release, and Official Evaluation
  description: >-
    Evidence-bounded reconstruction from ACL Anthology W19-5039 and the final 2019 official MEDIQA2019 snapshot
    cefa5a1b89e8263aeea0dbe59da52990963cdd1d.
  legend: >-
    Solid arrows trace question sourcing, CHiQA retrieval, expert annotation, split release, and the official Task 3
    evaluator. Competition test ranks and scores were hidden; the current repository also publishes a post-challenge
    labeled copy. RQE, MedQuAD, and NLI are optional strategies. The dashed arrow marks an independent reproducibility
    audit, not data flow after scoring.
nodes:
  - id: b1
    label: |-
      B1 · Source Questions
      Train: LiveQA 104 + Alexa 104
      Validation: 25 · Test: 150
      Held-out Provenance Not Reported
    type: database
    module: build
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 10
  - id: b2
    label: |-
      B2 · Retrieve with CHiQA
      Answers: 839 · 862 · 234 · 1,107
      CHiQA Supplies Initial Order
    type: process
    module: build
    size: xl
    position:
      x: 360
      'y': 192
    style:
      fontSize: 10
  - id: b3
    label: |-
      B3 · Expert Rate + Rerank
      4 Excellent · 3 Correct / Incomplete
      2 Related · 1 Incorrect
      Gold Ranks 1–11
    type: user
    module: build
    size: xl
    position:
      x: 680
      'y': 192
    style:
      fontSize: 10
  - id: b4
    label: |-
      B4 · Derive Gold Targets
      Scores 3/4 → Label 1
      Scores 1/2 → Label 0
      ReferenceRank Gives Gold Order
    type: process
    module: build
    size: xl
    position:
      x: 1000
      'y': 192
    style:
      fontSize: 10
  - id: b5
    label: |-
      Annotation / QC Boundary
      Not Reported:
      Expert Count / Agreement
      Double-label / Adjudication
      Retrieval Parameters / Dedup
    type: document
    module: build
    size: xl
    position:
      x: 1320
      'y': 192
    style:
      fontSize: 10
  - id: r1
    label: |-
      R1 · Pin Official Snapshot
      Commit cefa5a1 · 2019-09-04
      Task 3 + Evaluator Unchanged
      at 32311a1 · README: CC BY 4.0
    type: database
    module: release
    size: xl
    position:
      x: 1320
      'y': 520
    style:
      fontSize: 10
  - id: r2
    label: |-
      R2 · Train / Validation
      208 Q / 1,701 A · Val 25 / 234
      QID · Question · AID · URL · Text
      SystemRank · ReferenceRank · Score
    type: database
    module: release
    size: xl
    position:
      x: 1000
      'y': 520
    style:
      fontSize: 10
  - id: r3
    label: |-
      R3 · 2019 Test Input
      150 Q / 1,107 A
      QID · Question · AID · URL · Text
      No Rank / Score Attributes
    type: database
    module: release
    size: xl
    position:
      x: 680
      'y': 520
    style:
      fontSize: 10
  - id: r4
    label: |-
      R4 · Current Labeled Test
      Adds SystemRank · ReferenceRank · Score
      572 Positive · 535 Negative
      Binary Gold Is Public
    type: database
    module: release
    size: xl
    position:
      x: 360
      'y': 520
    style:
      fontSize: 10
  - id: r5
    label: |-
      Release / Provenance Boundary
      Repo Asserts CC BY 4.0
      Third-party Answer URLs Retained
      Source Rights / Crawl Dates Not Listed
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 520
    style:
      fontSize: 10
  - id: e1
    label: |-
      E1 · Score Candidates
      Input: Question + Candidate Answers
      Optional: RQE over MedQuAD / NLI
      Neither Is Required
    type: document
    module: evaluate
    size: xl
    position:
      x: 40
      'y': 848
    style:
      fontSize: 10
  - id: e2
    label: |-
      E2 · Submission CSV
      QuestionID, AnswerID, Label
      README Says Label-0 Is Filtered
      Code Counts Every Row toward Rank
    type: process
    module: evaluate
    size: xl
    position:
      x: 360
      'y': 848
    style:
      fontSize: 10
  - id: e3
    label: |-
      E3 · Preprocess
      Read with header=None
      Drop Duplicate QID + AID · Keep First
      Exact QID + AID + Label Matching
    type: process
    module: evaluate
    size: xl
    position:
      x: 680
      'y': 848
    style:
      fontSize: 10
  - id: e4
    label: |-
      E4 · Independent Metrics
      Classification + Ranking
      Same Submission and Binary Gold
      No Composite Score
    type: process
    module: evaluate
    size: xl
    position:
      x: 1000
      'y': 848
    style:
      fontSize: 10
  - id: m1
    label: |-
      Classification
      Accuracy = Matched Triples / Gold Rows
      score = Accuracy
      Precision = Global TP / Predicted Positives
    type: formula
    module: evaluate
    size: xl
    position:
      x: 1320
      'y': 712
    style:
      fontSize: 10
  - id: m2
    label: |-
      Ranking-code Drift
      MRR Uses First Correct-positive Row
      Prior Label-0 / False-positive Rows Count
      Spearman Mean Excludes NaN Questions
    type: formula
    module: evaluate
    size: xl
    position:
      x: 1320
      'y': 984
    style:
      fontSize: 10
  - id: e5
    label: |-
      E5 · Result Object
      score = Accuracy
      score_secondary = Spearman rho
      meta = MRR + Precision
    type: terminal
    module: evaluate
    size: xl
    position:
      x: 1640
      'y': 848
    style:
      fontSize: 10
  - id: g1
    label: |-
      Public Reproduction Gap
      Test Gold Has Header; Parser Assumes None
      Demo Paths Are Absent
      Repair Header + Paths
    type: document
    module: evaluate
    size: xl
    position:
      x: 1640
      'y': 1136
    style:
      fontSize: 10
