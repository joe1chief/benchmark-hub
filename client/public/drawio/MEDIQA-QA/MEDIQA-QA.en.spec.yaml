      Alexa Frequent Diseases · 104
      Consumer Health Information Needs
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: train_candidates
    label: |-
      Submit Training Questions to CHiQA
      Retrieve Candidate Web Answers
      LiveQA · 839 Answers
      Alexa · 862 Answers
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: eval_questions
    label: |-
      Form Held-out Consumer Questions
      Validation · 25 Questions
      Test · 150 Questions
      Preserve Real Medical Queries
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: eval_candidates
    label: |-
      Retrieve Held-out CHiQA Answers
