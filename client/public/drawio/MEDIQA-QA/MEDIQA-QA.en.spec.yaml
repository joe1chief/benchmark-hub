meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MEDIQA-QA Build Process
  description: >-
    Reconstructs the MEDIQA 2019 QA pipeline from consumer-health questions and CHiQA candidates through expert
    relevance/rank annotation, answer filtering and reranking, and the four official evaluation measures.
  legend: >-
    Exact release totals are 383 questions and 3,042 candidate answers: 208 training, 25 validation, and 150 test
    questions. MedQuAD, RQE, and NLI are optional supporting resources, not extra MEDIQA-QA test items.
