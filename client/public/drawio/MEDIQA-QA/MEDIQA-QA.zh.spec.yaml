meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MEDIQA-QA 构建流程
  description: 按 MEDIQA 2019 论文重建医学消费者问题经 CHiQA 检索、专家相关性与排序标注、答案过滤重排以及四项官方指标评测的流程。
  legend: 正式发布精确包含 383 个问题与 3,042 个候选答案，其中训练 208 题、验证 25 题、测试 150 题；MedQuAD、RQE 与 NLI 只作为可选辅助资源，不计入额外测试样本。
nodes:
  - id: train_questions
    label: |-
      形成两组训练问题
      TREC 2017 LiveQA · 104 题
      Alexa 常见疾病 · 104 题
      面向消费者健康信息需求
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: train_candidates
    label: |-
      将训练问题提交给 CHiQA
      检索网页候选答案
      LiveQA · 839 个答案
      Alexa · 862 个答案
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: eval_questions
    label: |-
      形成留出消费者问题
      验证集 · 25 题
      测试集 · 150 题
      保留真实医学提问
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: eval_candidates
    label: |-
      检索留出集 CHiQA 答案
      验证集 · 234 个答案
      测试集 · 1,107 个答案
      保留系统原始排序
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: expert_labels
    label: |-
      医学专家判断每个答案
      4 优秀 · 3 正确但不完整
      2 相关 · 1 错误
      人工重排为第 1 至第 11 名
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: dataset
    label: |-
      发布 MEDIQA-QA
      383 个问题 · 3,042 个答案
      训练集 · 验证集 · 测试集
      相关性分数与参考排序
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: support
    label: |-
      可选加入推理证据
      对 MedQuAD 47K 问答做 RQE
      对候选答案做 NLI
      蕴涵 · 矛盾 · 中立
    type: document
    size: xl
    position:
      x: 1420
      'y': 420
  - id: predict
    label: |-
      为给定候选答案打分
      使用问题 · 答案 · 来源
      原始排序与其他特征
      生成相关性预测
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: filter
    label: |-
      过滤答案相关性
      保留有用医学答案
      剔除错误候选答案
      输出二元相关性判断
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: rerank
    label: |-
      重排剩余答案
      将最佳答案置于首位
      保留完整候选顺序
      符合官方提交合同
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: classification_metrics
    label: |-
      评估相关性分类
      准确率
      精确率
      对照专家分数
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: ranking_metrics
    label: |-
      评估答案排序
      平均倒数排名
      Spearman 秩相关系数
      报告全部四项官方指标
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: train_questions
    to: train_candidates
    type: primary
  - from: train_candidates
    to: eval_questions
    type: primary
  - from: eval_questions
    to: eval_candidates
    type: primary
  - from: eval_candidates
    to: expert_labels
    type: primary
  - from: expert_labels
    to: dataset
    type: primary
  - from: dataset
    to: support
    type: primary
  - from: support
    to: predict
    type: primary
  - from: predict
    to: filter
    type: primary
  - from: filter
    to: rerank
    type: primary
  - from: rerank
    to: classification_metrics
    type: primary
  - from: classification_metrics
    to: ranking_metrics
    type: primary
modules: []
