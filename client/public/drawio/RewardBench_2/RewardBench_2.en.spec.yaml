meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RewardBench_2 Build and Evaluation Process
  description: >-
    RewardBench 2 is an accuracy-based reward-model benchmark built from about 3,000 candidate prompts and finalized as
    1,865 prompts across Factuality, Precise Instruction Following, Math, Safety, Focus, and Ties. Seventy percent are
    previously unused human prompts from WildChat; QuRater, a topic classifier, manual inspection, and Tulu 3
    decontamination against 20 downstream evaluations are applied before completions from 20 models or humans are
    filtered with domain-specific judges, verifiers, voting, rubrics, and manual checks. Most items contain one chosen
    and three rejected completions. Five domains use best-of-four accuracy, Ties uses a distribution-aware score, and
    the overall score is the unweighted mean of six domains.
  legend: >-
    Source: RewardBench 2 arXiv:2506.01937 Section 3 and Appendices G-I, cross-checked against allenai/reward-bench.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
