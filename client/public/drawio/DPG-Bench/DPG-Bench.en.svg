d prompts</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>correct unsupported</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>or incoherent details</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>retain valid dense requirements</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="1400" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1500,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Second GPT-4 Pass via DSG</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>derive semantic tuples and categories</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>write yes / no questions</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>construct question dependency graphs</tspan></text></g></g></g></g><g data-cell-id="10"><g><path d="M 1680 359 C 1680 350.72 1724.77 344 1780 344 C 1806.52 344 1831.96 345.58 1850.71 348.39 C 1869.46 351.21 1880 355.02 1880 359 L 1880 429 C 1880 437.28 1835.23 444 1780 444 C 1724.77 444 1680 437.28 1680 429 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1880 359 C 1880 367.28 1835.23 374 1780 374 C 1724.77 374 1680 367.28 1680 359" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1780,373.5) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Pinned DPG-Bench @ 68f5076</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>1,065 prompts</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>mean 83.91 CLIP tokens</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>4,286 distinct nouns</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>5 level-1 · 13 level-2 categories</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1960" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2060,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Candidate Image Generation</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>generate 4 images per prompt</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>recommended 2×2 grid</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>filename must match its prompt</tspan></text></g></g></g></g><g data-cell-id="12"><g><rect x="2240" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2340,361) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Official VQA Checkpoint</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>damo/mplug_visual-question-</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>answering_coco_large_en</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>answer yes / no for every question</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>score all four tiles independently</tspan></text></g></g></g></g><g data-cell-id="13"><g><rect x="2520" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2620,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Dependency-aware Question Score</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>yes = 1 · no = 0</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>if any parent question is no</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>its child question score becomes 0</tspan></text></g></g></g></g><g data-cell-id="14"><g><rect x="2800" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2900,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Three-level Aggregation</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>image = mean of pruned questions</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>prompt = mean of 4 image scores</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>benchmark score = mean across prompts</tspan></text></g></g></g></g><g data-cell-id="15"><g><rect x="3080" y="344" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width