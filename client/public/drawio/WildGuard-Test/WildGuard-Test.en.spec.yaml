meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildGuardTest Construction, Three-Task F1, and OLMo 3 Downstream Evaluation
  description: >-
    WildGuardTest is a classifier benchmark built from a synthetic vanilla/adversarial test split. Three independent
    annotators label prompt harmfulness, response harmfulness, and response refusal; Unsure is allowed, majority voting
    is applied per label, and only labels without two-way agreement are nulled/removed, so other task labels on the same
    row may remain. GPT-4 plus human mismatch review audits the result. The official dataset exposes 1,725 rows spanning
    13 approximately balanced risk subcategories, while the paper separately reports 5,299 aggregate task-label items.
    Canonical evaluation reports F1 for all three tasks with adversarial/vanilla breakdowns. OLMo 3 is a distinct
    downstream model-generation evaluation: it selects 749 adversarial prompts, generates target-model responses, uses
    WildGuard to classify safety/refusal behavior, and reports refusal accuracy (1 - ASR, higher is better).
  legend: >-
    Source: WildGuard arXiv:2406.18495v3 (2024-12-09), Section 3.2, Section 4.1 and Table 4, and Appendix A.6 Table 10;
    official repository https://github.com/allenai/wildguard; official data
    https://huggingface.co/datasets/allenai/wildguardmix, wildguardtest config. The separate OLMo 3 operational layer is
    pinned to arXiv:2512.13961v2 (2026-04-14), safety-evaluation appendix; OLMo 3's broader subset wording must not
    replace WildGuard v3's synthetic vanilla/adversarial construction provenance. Unit/source tension must remain
    explicit: the reproducible dataset has 1,725 prompt-response rows, the WildGuard paper quotes 5,299 aggregate
    human-annotated task-label items across three tasks, and OLMo 3 selects 749 adversarial prompts. Because 1,725 x 3
    is 5,175 and per-label agreement filtering can leave null labels, 5,299 must not be derived from row count or
    relabeled as unique prompts.. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
