meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildGuardTest 构建、三任务F1与OLMo 3下游评测
  description: >-
    WildGuardTest 是从合成 vanilla/adversarial 测试切分构建的分类器基准。三名独立标注员分别标注提示有害性、回答有害性和回答拒答；允许选择
    Unsure，每个标签独立多数投票，仅将不足两票一致的单项标签置空/移除，因此同一行的其他任务标签仍可保留。随后由 GPT-4 全量复判并人工检查不一致项。官方数据包含1,725个 prompt-response
    行，覆盖13个近似均衡的风险子类；论文另报5,299个三任务聚合标注项，两者不是同一单位。原始评测按三项任务分别报告 F1 并区分 adversarial/vanilla。OLMo 3 是独立的下游生成式安全评测：选择749条
    adversarial prompts，让目标模型生成回答，用 WildGuard 判断安全/拒答，并报告拒答准确率（1-ASR，越高越好）。
  legend: >-
    来源：WildGuard arXiv:2406.18495v3 (2024-12-09), Section 3.2, Section 4.1 and Table 4, and Appendix A.6 Table 10;
    official repository https://github.com/allenai/wildguard; official data
    https://huggingface.co/datasets/allenai/wildguardmix, wildguardtest config. The separate OLMo 3 operational layer is
    pinned to arXiv:2512.13961v2 (2026-04-14), safety-evaluation appendix; OLMo 3's broader subset wording must not
    replace WildGuard v3's synthetic vanilla/adversarial construction provenance. Unit/source tension must remain
    explicit: the reproducible dataset has 1,725 prompt-response rows, the WildGuard paper quotes 5,299 aggregate
    human-annotated task-label items across three tasks, and OLMo 3 selects 749 adversarial prompts. Because 1,725 x 3
    is 5,175 and per-label agreement filtering can leave null labels, 5,299 must not be derived from row count or
    relabeled as unique prompts.。实线箭头表示论文或官方资料明确支持的主流程。
