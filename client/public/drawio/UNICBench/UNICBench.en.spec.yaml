meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: UNICBench Build and Evaluation Process
  description: >-
    UNICBench unifies counting across 5,300 images with 5,508 questions, 872 documents with 5,888 questions, and 2,069
    audio clips with 2,905 questions. Curators establish accurate count ground truth, assign a three-level capability
    taxonomy and difficulty tags, and freeze modality-specific splits and matching rules. Evaluation fixes prompts,
    random seeds, and decoding settings; deterministically parses numeric answers; applies modality-appropriate
    matching; and reports exact success, absolute and squared count error, and stratified results by modality,
    capability, and difficulty. The paper evaluates 45 MLLMs under this common protocol.
  legend: >-
    Source: UNICBench arXiv:2603.00595; official WeChatCV/UnicBench repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
