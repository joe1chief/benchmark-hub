meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArtifactsBench 构建流程
  description: 基于 arXiv:2507.04952，对齐 ArtifactsBench 的候选来源、过滤、checklist 校准、沙箱截图评测和 MLLM 裁判验证流程。
  legend: 实线表示基准构建与自动评测主流程；虚线表示歧义修复、人类验证和 WebDev Arena 对齐。
nodes:
  - id: candidate_sources
    label: |-
      候选来源
      专家 showcase
      SVG/网页片段与截图
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: filtering
    label: |-
      来源过滤
      移除无效、简单
      非视觉或非交互项
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: dedup
    label: |-
      去重与污染控制
      MinHash、语义相似度
      截图感知哈希
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: rewriting
    label: |-
      提示词改写
      专家清晰度审核
      30/40/30 难度校准
    type: document
    size: xl
    position:
      x: 560
      'y': 70
  - id: checklist
    label: |-
      Checklist 校准
      10 个维度
      LLM 草拟并人工精修
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: dataset
    label: |-
      ArtifactsBench 数据集
      1,825 个可执行查询
      九主题与校准难度层级
    type: database
    size: xl
    position:
      x: 820
      'y': 160
  - id: execution
    label: |-
      沙箱执行
      Playwright 1024x768
      交互前中后三张截图
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 70
  - id: judge
    label: |-
      MLLM-as-Judge
      checklist 引导双裁判
      代码与视觉证据
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: validation
    label: |-
      对齐报告
      280 例人类研究
      WebDev Arena 一致性 94.4%
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: candidate_sources
    to: filtering
    type: primary
  - from: filtering
    to: dedup
    type: primary
  - from: dedup
    to: rewriting
    type: primary
  - from: dedup
    to: filtering
    type: optional
    label: 改写或丢弃
  - from: rewriting
    to: checklist
    type: primary
  - from: checklist
    to: dataset
    type: primary
  - from: dataset
    to: execution
    type: primary
  - from: execution
    to: judge
    type: primary
  - from: judge
    to: validation
    type: primary
  - from: validation
    to: checklist
    type: optional
    label: 人类与 Arena 校准
modules: []
