meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArtifactsBench 构建流程
  description: 对齐论文的动态交互式作品构建与评测：从多源候选，经校准检查表、确定性浏览器轨迹、 双 MLLM 裁判与人类验证形成可复现分数。
  legend: 先从左到右阅读基准构建行，再从右到左阅读可执行多模态评测行。
nodes:
  - id: sources
    label: |-
      多源候选
      专家作品 + SVG/网页数据集
      案例研究 + 截图转查询生成
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: filter
    label: |-
      自动来源过滤
      删除不完整 / 非视觉 / 过于简单项
      检查许可并要求交互动态
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: dedup
    label: |-
      两阶段去重
      MinHash + DOM/CSS/JS 语义相似度
      截图感知哈希
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: rewrite
    label: |-
      提示修复与可解性检查
      专家 + LLM 清晰度改写
      修订或删除脆弱 / 歧义任务
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: checklist
    label: |-
      校准的任务检查表
      Hunyuan-Turbos 起草10个维度
      人工精炼；Cohen's Kappa不低于0.8
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: dataset
    label: |-
      ArtifactsBench：1,825题
      9个动态视觉领域
      后验难度分布：30 / 40 / 30
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: execution
    label: |-
      确定性浏览器沙箱
      提取并执行模型代码
      Playwright / Chromium，1024 x 768
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: trajectory
    label: |-
      脚本化交互轨迹
      捕获交互前 / 中 / 后
      三张按时间排序的截图
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: referees
    label: |-
      检查表引导的双裁判
      Qwen2.5-VL-72B + Gemini-2.5-Pro
      评分5个视觉 + 5个代码维度
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: human
    label: |-
      双盲人类验证
      280个实例 / 6个模型
      前端工程师；Pair ACC最高90.95%
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: arena
    label: |-
      外部排名保真度检查
      比较完整模型排名
      对齐 WebDev Arena 人类偏好
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      可复现的作品得分
      视觉保真度 + 交互正确性
      代码逻辑 / 鲁棒性 / 工程质量
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: filter
    type: primary
  - from: filter
    to: dedup
    type: primary
  - from: dedup
    to: rewrite
    type: primary
  - from: rewrite
    to: checklist
    type: primary
  - from: checklist
    to: dataset
    type: primary
  - from: dataset
    to: execution
    type: primary
  - from: execution
    to: trajectory
    type: primary
  - from: trajectory
    to: referees
    type: primary
  - from: referees
    to: human
    type: primary
  - from: human
    to: arena
    type: primary
  - from: arena
    to: report
    type: primary
modules: []
