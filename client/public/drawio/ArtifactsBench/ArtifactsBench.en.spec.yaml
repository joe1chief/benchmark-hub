meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArtifactsBench Build Process
  description: >-
    Paper-aligned construction and evaluation of dynamic interactive artifacts, from multi-source candidates through
    calibrated checklists, deterministic browser trajectories, dual MLLM referees, and human validation.
  legend: Read the benchmark-construction row left-to-right, then the executable multimodal evaluation row right-to-left.
nodes:
  - id: sources
    label: |-
      Multi-Source Candidates
      Expert Showcases + SVG/Web Datasets
      Case Studies + Screenshot-to-Query Generation
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: filter
    label: |-
      Automated Source Filtering
      Remove Incomplete / Non-Visual / Trivial Items
      Enforce License and Interactive Dynamics
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: dedup
    label: |-
      Two-Stage Deduplication
      MinHash + Semantic DOM/CSS/JS Similarity
      Screenshot Perceptual Hashing
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: rewrite
    label: |-
      Prompt Repair and Solvability Check
      Expert + LLM Clarity Rewriting
      Revise or Remove Brittle / Ambiguous Tasks
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: checklist
    label: |-
      Calibrated Task Checklist
      Hunyuan-Turbos Drafts 10 Dimensions
      Human Refinement; Cohen's Kappa at Least 0.8
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: dataset
    label: |-
      ArtifactsBench: 1,825 Tasks
      Nine Dynamic Visual Domains
      Post-Hoc Difficulty Split: 30 / 40 / 30
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: execution
    label: |-
      Deterministic Browser Sandbox
      Extract and Execute Model Code
      Playwright / Chromium at 1024 x 768
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: trajectory
    label: |-
      Scripted Interaction Trajectory
      Capture Before / During / After
      Three Time-Ordered Screenshots
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: referees
    label: |-
      Checklist-Guided Dual Referees
      Qwen2.5-VL-72B + Gemini-2.5-Pro
      Score Five Vision + Five Code Dimensions
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: human
    label: |-
      Double-Blind Human Validation
      280 Instances / Six Models
      Front-End Engineers; Pair ACC up to 90.95%
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: arena
    label: |-
      External Rank-Fidelity Check
      Compare Full Model Rankings
      Align with WebDev Arena Preferences
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Reproducible Artifact Scores
      Visual Fidelity + Interaction Correctness
      Code Logic / Robustness / Engineering Quality
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
