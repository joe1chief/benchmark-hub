meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IndicGenBench Build Process
  description: >-
    Paper-aligned multilingual construction: selected English examples from four established sources are professionally
    translated into multi-way parallel data spanning 29 Indic languages, 13 scripts, four families, and five evaluation
    tracks.
  legend: >-
    Solid arrows show source extension, professional translation, released task datasets, prompting, and task-specific
    metrics.
nodes:
  - id: sources
    label: |-
      Four Quality-controlled Sources
      CrossSum · FLORES-200
      XQuAD / SQuAD · XOR-TyDi
    type: cloud
    size: xl
    position:
      x: 20
      'y': 300
  - id: select
    label: |-
      Select English Examples per Task
      Reuse Existing Indic Translations Where Available
      Preserve Source Task and Annotation Quality
    type: process
    size: xl
    position:
      x: 300
      'y': 300
  - id: translate
    label: |-
      Professional Contract Translators
      Translate Task-specific Fields
      29 Languages · High 9 / Medium 7 / Low 13
    type: user
    size: xl
    position:
      x: 580
      'y': 300
  - id: parallel
    label: |-
      Multi-way Parallel Benchmark
      13 Writing Scripts · 4 Language Families
      Train / Dev / Test Where Source Allows
    type: database
    size: xl
    position:
      x: 860
      'y': 300
  - id: crosssum
    label: |-
      CrossSum-IN · 29 Languages
      English Article → Indic Summary
      20.3k Examples
    type: database
    size: xl
    position:
      x: 1140
      'y': 0
  - id: flores
    label: |-
      FLORES-IN · 29 Languages
      English ↔ Indic Translation
      58.2k Examples
    type: database
    size: xl
    position:
      x: 1140
      'y': 200
  - id: xquad
    label: |-
      XQuAD-IN · 12 Languages
      Indic Passage + Question → Indic Answer
      16.6k QA Pairs
    type: database
    size: xl
    position:
      x: 1140
      'y': 400
  - id: xorqa
    label: |-
      XorQA-IN · 28 Languages
      Indic Question + English Passage
      Two Tracks: Indic or English Answer · 32k
    type: database
    size: xl
    position:
      x: 1140
      'y': 600
  - id: release
    label: |-
      Official Task/Language/Split JSON
      Source-dependent Licenses
      Benchmark Canary in Every File
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: prompt
    label: |-
      Main One-shot Generation
      Task-language Exemplars
      Optional 0–5 Shot and Multilingual Fine-tuning
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: metric
    label: |-
      Task Metrics
      ChrF: CrossSum + FLORES Both Directions
      SQuAD Token-F1: Three QA Tracks
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 200
  - id: analysis
    label: |-
      Report Across Languages and Resources
      High / Medium / Low Averages
      Prompt-language and English-gap Analyses
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 500
