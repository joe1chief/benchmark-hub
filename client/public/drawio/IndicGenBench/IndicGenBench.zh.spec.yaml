meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IndicGenBench 构建流程
  description: 与论文一致的多语言构建流程：从四个成熟数据源筛选英文样本，经专业译者扩展为覆盖 29 种印度语言、13 种文字、四个语系和五条评测轨道的多向平行数据。
  legend: 实线表示数据源扩展、专业翻译、任务数据发布、提示评测与任务专用指标。
nodes:
  - id: evidence
    label: |-
      主要证据与固定发布版本
      arXiv:2404.16816v2
      ACL 2024 · Git c96a10d
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      四个经过质量控制的数据源
      CrossSum · FLORES-200
      XQuAD / SQuAD · XOR-TyDi
    type: cloud
    size: xl
    position:
      x: 20
      'y': 300
  - id: select
    label: |-
      按任务筛选英文样本
      复用已有印度语言译文
      保留原任务与标注质量
    type: process
    size: xl
    position:
      x: 300
      'y': 300
  - id: translate
    label: |-
      专业合同译者
      翻译各任务所需字段
      29 种语言 · 高资源 9 / 中 7 / 低 13
    type: user
    size: xl
    position:
      x: 580
      'y': 300
  - id: parallel
    label: |-
      多向平行基准
      13 种文字 · 四个语系
      数据源允许时提供训练 / 验证 / 测试
    type: database
    size: xl
    position:
      x: 860
      'y': 300
  - id: crosssum
    label: |-
      CrossSum-IN · 29 种语言
      每种语言：100 训练 / 100 验证
      每种语言：500 测试
      英文文章 → 印度语言摘要
      论文总量：20.3k 样本
    type: database
    size: xl
    position:
      x: 1140
      'y': 0
  - id: flores
    label: |-
      FLORES-IN · 29 种语言
      22 种已有 + 7 种新译
      每种语言：997 Dev + 1,012 Devtest
      英文 ↔ 印度语言翻译
      论文总量：58.2k 样本
    type: database
    size: xl
    position:
      x: 1140
      'y': 200
  - id: xquad
    label: |-
      XQuAD-IN · 12 种语言
      训练 / 验证：20 段落 + 100 问答
      测试：240 段落 + 1,190 问答
      论文总量：16.6k 个问答对
    type: database
    size: xl
    position:
      x: 1140
      'y': 400
  - id: xorqa
    label: |-
      XorQA-IN · 两阶段翻译
      28 种语言 · IN-EN + IN-XX 两轨
      来源：100 训练 · 500 验证 · 539 测试
      论文总量：32k 个任务视图
    type: database
    size: xl
    position:
      x: 1140
      'y': 600
  - id: release
    label: |-
      官方按任务 / 语言 / 划分发布 JSON
      沿用各来源许可证
      每个文件包含基准防污染 Canary
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: prompt
    label: |-
      主要采用 One-shot 生成评测
      任务语言示例
      可选 0–5 Shot 与多语言微调
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: metric
    label: |-
      任务专用指标
      ChrF：CrossSum 与 FLORES 双向
      SQuAD Token-F1：三条问答轨道
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 200
  - id: analysis
    label: |-
      跨语言与资源等级报告
      高 / 中 / 低资源平均
      提示语言与英文差距分析
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 500
  - id: artifact_boundary
    label: |-
      论文任务与发布边界
      四个发布组件 · 五条论文轨道
      XorQA 组件提供 EN + XX 两种视图
      按任务指标与资源等级平均值报告
    type: document
    size: xl
    position:
      x: 2260
      'y': 500
edges:
  - from: evidence
    to: sources
    type: data
  - from: sources
    to: select
    type: primary
  - from: select
    to: translate
    type: primary
  - from: translate
    to: parallel
    type: primary
  - from: parallel
    to: crosssum
    type: primary
  - from: parallel
    to: flores
    type: primary
  - from: parallel
    to: xquad
    type: primary
  - from: parallel
    to: xorqa
    type: primary
  - from: crosssum
    to: release
    type: primary
  - from: flores
    to: release
    type: primary
  - from: xquad
    to: release
    type: primary
  - from: xorqa
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: metric
    type: primary
  - from: metric
    to: analysis
    type: primary
  - from: analysis
    to: artifact_boundary
    type: data
modules: []
