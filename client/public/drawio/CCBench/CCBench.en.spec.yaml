meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CCBench Build Process
  description: >-
    Official-repository-aligned construction and evaluation of 187 real-world coding-agent tasks from private
    CodeCrafters submissions, packaged in Harbor format with staff-written test runners, reference solutions, oracle
    verification, public tasks, and inspectable run logs.
  legend: Solid arrows show task construction and agent evaluation; dashed arrows carry solvability or transparency evidence.
nodes:
  - id: submissions
    label: |-
      Source Private CodeCrafters Submissions
      Engineers Implement Git, Redis, SQLite, and More
      Codebases Have Varying Real-world Quality
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: select
    label: |-
      Select Small Real Codebases and Features
      Fewer than 10,000 Lines of Code
      Private Sources Excluded from Public Training Corpora
    type: process
    size: xl
    position:
      x: 340
      'y': 200
  - id: instruction
    label: |-
      Write a Detailed Feature Instruction
      Break Implementation into Smaller Stages
      Explain How Official Tests Will Run
    type: document
    size: xl
    position:
      x: 640
      'y': 200
  - id: harbor
    label: |-
      Compile a Harbor-format Task
      Starting Repository • instruction.md • Environment
      Tests • task.toml • Optional Solution
    type: process
    size: xl
    position:
      x: 940
      'y': 200
  - id: tests
    label: |-
      Attach Official CodeCrafters Test Runners
      Hand-written by Staff
      Battle-tested by Hundreds of Thousands of Users
    type: process
    size: xl
    position:
      x: 1240
      'y': 80
  - id: oracle
    label: |-
      Add a Reference Solution
      Run the Harbor Oracle Agent
      Verify that Each Packaged Task Is Solvable
    type: process
    size: xl
    position:
      x: 1240
      'y': 320
  - id: release
    label: |-
      Release 187 CCBench Tasks
      Public Harbor Packages and Evaluation Logs
      Real-world Features over Small Private-origin Repositories
    type: database
    size: xl
    position:
      x: 1540
      'y': 200
  - id: run
    label: |-
      Run Any Coding Agent via Harbor CLI
      Give Repository, Staged Feature Instruction, and Test Info
      Use the Benchmark Time Budget
    type: process
    size: xl
    position:
      x: 1840
      'y': 200
  - id: patch
    label: |-
      Agent Inspects and Modifies the Codebase
      Implement the Requested Feature
      Return a Candidate Solution
    type: process
    size: xl
    position:
      x: 2140
      'y': 200
  - id: verify
    label: |-
      Execute the Official Test Runner
      Evaluate the Candidate in the Task Environment
      Write Harbor Verifier Reward 1 or 0
    type: process
    size: xl
    position:
      x: 2440
      'y': 200
  - id: report
    label: |-
      Report Binary Task Success and Success Rate
      Aggregate Overall and by Challenge Group
      Publish Logs for Error Inspection
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 200
edges:
  - from: submissions
    to: select
    type: primary
  - from: select
    to: instruction
    type: primary
  - from: instruction
    to: harbor
    type: primary
  - from: harbor
    to: tests
    type: primary
  - from: harbor
    to: oracle
    type: primary
  - from: tests
    to: release
    type: primary
  - from: oracle
    to: release
    type: data
  - from: release
    to: run
    type: primary
  - from: run
    to: patch
    type: primary
  - from: patch
    to: verify
    type: primary
  - from: verify
    to: report
    type: primary
modules: []
