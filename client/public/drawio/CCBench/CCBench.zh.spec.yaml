meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CCBench 构建流程
  description: 按官方仓库构建并评测 187 个真实编程 Agent 任务：任务源于 CodeCrafters 私有提交，以 Harbor 格式封装，配套员工手写 测试、参考解、Oracle 可解性验证，并公开任务与可检查的运行日志。
  legend: 实线表示任务构建与 Agent 评测，虚线表示可解性或透明度证据。
nodes:
  - id: submissions
    label: |-
      获取 CodeCrafters 私有提交
      工程师从零实现 Git、Redis、SQLite 等软件
      代码库质量反映不同真实开发水平
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: select
    label: |-
      选择小型真实代码库与功能
      代码规模少于 10,000 行
      私有来源未进入公开训练语料
    type: process
    size: xl
    position:
      x: 340
      'y': 200
  - id: instruction
    label: |-
      编写详细功能指令
      把实现要求拆成多个较小阶段
      说明官方测试的运行方式
    type: document
    size: xl
    position:
      x: 640
      'y': 200
  - id: harbor
    label: |-
      编译为 Harbor 格式任务
      初始仓库 • instruction.md • 环境
      测试 • task.toml • 可选参考解
    type: process
    size: xl
    position:
      x: 940
      'y': 200
  - id: tests
    label: |-
      接入 CodeCrafters 官方测试器
      由员工手工编写
      经数十万用户四年以上反复检验
    type: process
    size: xl
    position:
      x: 1240
      'y': 80
  - id: oracle
    label: |-
      加入参考解
      运行 Harbor Oracle Agent
      验证每个封装任务确实可解
    type: process
    size: xl
    position:
      x: 1240
      'y': 320
  - id: release
    label: |-
      发布 187 个 CCBench 任务
      公开 Harbor 任务包与评测日志
      小型私有来源仓库上的真实功能开发
    type: database
    size: xl
    position:
      x: 1540
      'y': 200
  - id: run
    label: |-
      通过 Harbor CLI 运行任意编程 Agent
      提供仓库、分阶段功能说明与测试信息
      使用基准规定的时间预算
    type: process
    size: xl
    position:
      x: 1840
      'y': 200
  - id: patch
    label: |-
      Agent 检查并修改代码库
      实现要求的功能
      返回候选解决方案
    type: process
    size: xl
    position:
      x: 2140
      'y': 200
  - id: verify
    label: |-
      执行官方测试器
      在任务环境中评测候选方案
      写入 Harbor 验证奖励 1 或 0
    type: process
    size: xl
    position:
      x: 2440
      'y': 200
  - id: report
    label: |-
      报告二元任务成功与成功率
      汇总整体及各挑战组结果
      发布日志供错误检查
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 200
edges:
  - from: submissions
    to: select
    type: primary
  - from: select
    to: instruction
    type: primary
  - from: instruction
    to: harbor
    type: primary
  - from: harbor
    to: tests
    type: primary
  - from: harbor
    to: oracle
    type: primary
  - from: tests
    to: release
    type: primary
  - from: oracle
    to: release
    type: data
  - from: release
    to: run
    type: primary
  - from: run
    to: patch
    type: primary
  - from: patch
    to: verify
    type: primary
  - from: verify
    to: report
    type: primary
modules: []
