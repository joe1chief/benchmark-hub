meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RiemannBench Build and Evaluation Process
  description: >-
    Riemann-Bench contains 25 fully private, research-level mathematics problems written by Ivy League professors,
    graduate students, and PhD-holding IMO medalists from problems encountered in their own research. Every item must
    have an unambiguous unique closed-form answer, support programmatic verification when equivalent forms exist, and
    pass double-blind verification by two independent domain experts who solve it from scratch without seeing the author
    solution. Models run as unconstrained research agents with coding tools, search, and open-ended reasoning. Each
    problem receives 100 independent attempts; programmatic verifiers judge correctness and an unbiased estimator
    reports pass@1.
  legend: >-
    Source: Riemann-Bench arXiv:2604.06802 Sections 3 and 5, cross-checked against the official Surge AI benchmark page.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
