  layout: horizontal
  routing: orthogonal
  title: RiemannBench 构建与评测流程
  description: >-
    Riemann-Bench包含25道完全私有的研究级数学题，由常春藤高校教授、研究生和拥有博士学位的IMO奖牌得主从自身研究问题中编写。每题必须具有无歧义且唯一的闭式答案，在存在等价形式时支持程序化验证，并通过两位独立领域专家的双盲复核；复核者不能预先看到作者答案，必须从头求解。模型作为不受约束的研究智能体运行，可使用代码工具、搜索和开放式推理。每题执行100次独立尝试，由程序验证器判定正确性并用无偏估计器报告pass@1。
  legend: >-
    来源：Riemann-Bench arXiv:2604.06802 Sections 3 and 5, cross-checked against the official Surge AI benchmark
    page。实线箭头表示论文或官方资料明确支持的主流程。
