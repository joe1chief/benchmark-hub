meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MILU Build and Evaluation Process
  description: >-
    Paper-v3 reconstruction of MILU's India-centric examination collection, layered quality control, topic recovery,
    subject-language gap filling, 79,617/8,933 release, two evaluation paths, and distinct paper, gated-data, and
    current-harness aggregation boundaries.
  legend: >-
    Solid arrows show the paper-backed construction and non-API log-likelihood path. Dashed data arrows show the
    separate validation release and API generation path. Unconnected bottom cards are evidence audits, not processing
    stages; paper v3, the gated Hugging Face snapshot, and the current harness must remain separate.
nodes:
  - id: evidence
    label: |-
      Pin Primary Evidence
      arXiv 2411.02538v3
      Revised 2025-02-04
      PDF a862d7eb…
      Git 7d8e6c9 · HF 946c423
      Data Commit be958af
    type: document
    size: xl
    position:
      x: 40
      'y': 60
  - id: exam_sources
    label: |-
      Choose Exam Sources
      Public National · State · Regional
      More than 1,500 Exams
      More than 40 Types · Recent Years
      Expert Answers · Portal Tags
    type: database
    size: xl
    position:
      x: 280
      'y': 60
  - id: scrape
    label: |-
      Scrape Released Papers
      More than 150K Raw MCQs
      11 Languages incl. English
      General + Culture Knowledge
      History · Arts · Festivals · Laws
    type: process
    size: xl
    position:
      x: 520
      'y': 60
  - id: format_qc
    label: |-
      Apply Format QC
      Drop Reading Comprehension
      Drop Image Questions
      Drop Items above Four Options
      Retain Four-choice Items
    type: process
    size: xl
    position:
      x: 760
      'y': 60
  - id: language_qc
    label: |-
      Apply Cleaning Layers
      Review a Large Sample
      IndicLID + Unicode Checks
      Drop Wrong-language Items
      Deduplicate Questions
    type: process
    size: xl
    position:
      x: 1000
      'y': 60
  - id: topic_recovery
    label: |-
      Recover Missing Topics
      Only about 45% Tagged Well
      IndicTrans2 to English
      GPT-4o-mini Assigns Topics
      About 20K Fine-grained Tags
    type: process
    size: xl
    position:
      x: 1000
      'y': 280
  - id: taxonomy
    label: |-
      Build the Taxonomy
      NV-Embed-v2 Tag Embeddings
      K-means: 50 Clusters
      Manual Review and Merge
      41 Subjects · Eight Domains
    type: user
    size: xl
    position:
      x: 760
      'y': 280
  - id: gap_fill
    label: |-
      Fill Subject-Language Gaps
      Target at Least 100 per Pair
      Sample Same-subject English
      Task-aware GPT-4o Translation
      Cap Each Pair at 500
    type: process
    size: xl
    position:
      x: 520
      'y': 280
  - id: final_qc
    label: |-
      Run Final Language Audit
      Sample Every Language
      Manually Verify Accuracy
      Correct Remaining Errors
    type: process
    size: xl
    position:
      x: 280
      'y': 280
  - id: test_release
    label: |-
      Release Test Split
      79,617 Four-choice MCQs
      19,915 Translated · about 25%
      11 Languages · 41 Subjects
      Eight Domains · Counts Published
    type: database
    size: xl
    position:
      x: 520
      'y': 460
  - id: validation_release
    label: |-
      Release Validation Split
      8,933 Examples · All 41 Subjects
      Few-shot Demonstrations Only
      No Train Split Declared
    type: database
    size: xl
    position:
      x: 40
      'y': 460
  - id: public_contract
    label: |-
      Publish Row Contract
      question · four options · target
      translation flag · language
      domain · subject
      11 configs · test + validation
      CC BY 4.0 · Auto-gated
    type: document
    size: xl
    position:
      x: 520
      'y': 640
  - id: harness
    label: |-
      Pin Official Harness
      Git 7d8e6c9 · Task 683a670
      lm_eval 0.4.4 · MIT
      ai4bharat/MILU · token=true
      11 Tasks · Version 0.0
    type: service
    size: xl
    position:
      x: 760
      'y': 640
  - id: eval_route
    label: |-
      Evaluation Branch
      Log-likelihood
      or Zero-shot JSON
    type: decision
    size: xl
    position:
      x: 1000
      'y': 640
  - id: nonapi_setup
    label: |-
      Set Non-API Shots
      Paper: 0 · 1 · 5 Shot
      Validation Supplies Examples
      Current Sampler: first_n
      Most Open Rows: 5-shot
    type: process
    size: xl
    position:
      x: 1000
      'y': 820
  - id: prompt
    label: |-
      Render Harness Prompt
      Question: question
      Choices: A-D · four options
      Answer:
      Chat Template for Instruct
    type: document
    size: xl
    position:
      x: 760
      'y': 820
  - id: loglikelihood
    label: |-
      Score Four Choices
      Condition Each on Prompt
      Sum Target-token Log Probs
      Choose Highest Score
      No Generation Parser
    type: process
    size: xl
    position:
      x: 520
      'y': 820
  - id: item_accuracy
    label: |-
      Compute Item Accuracy
      Map option1-option4 to 0-3
      Compare Choice with Gold
      Correct 1 · Incorrect 0
      Mean Accuracy
    type: process
    size: xl
    position:
      x: 280
      'y': 820
  - id: language_score
    label: |-
      Score Each Language
      11 Test Configs
      Paper Cell: Mean of 8 Domains
      Analyze Subjects/Resources
      Keep Shot Regime
    type: process
    size: xl
    position:
      x: 40
      'y': 820
  - id: api_generate
    label: |-
      Run Paper API Branch
      Closed Models · Zero-shot
      No Prompt Log Probabilities
      Generate Structured JSON
      Cost Blocks 1/5-shot
    type: process
    size: xl
    position:
      x: 760
      'y': 1020
  - id: api_parse
    label: |-
      Parse API Response
      Extract Selected Answer
      JSON Schema/Parser Unpublished
      No API Task in Pinned Harness
    type: document
    size: xl
    position:
      x: 520
      'y': 1020
  - id: paper_aggregate
    label: |-
      Compute Paper Summary
      Macro Mean of 11 Languages
      GPT-4o 74.74% · API 0-shot
      Open Rows Mostly 5-shot
      Keep Mixed Shots Explicit
    type: process
    size: xl
    position:
      x: 40
      'y': 1100
  - id: report
    label: |-
      Report Paper Analyses
      Language · Domain · Subject
      Model Family · Scale · Resource
      0/1/5-shot When Available
      HF Card Is Not a New Run
    type: terminal
    size: xl
    position:
      x: 280
      'y': 1100
  - id: construction_gaps
    label: |-
      Construction Gaps
      Portal URLs · Collection Dates
      Annotators · Agreement
      Dedup Method · QC Sample Sizes
      Translation Prompt/Model · Seed
    type: document
    size: xl
    position:
      x: 40
      'y': 1320
  - id: release_boundary
    label: |-
      Current HF Boundary
      HF 946c423 · Auto-gated
      11 × 2 Parquet Files Listed
      Payload/Data Server: HTTP 401
      Rows Not Independently Audited
    type: document
    size: xl
    position:
      x: 280
      'y': 1320
  - id: data_history
    label: |-
      Release-history Boundary
      Math Formatting Defects
      Math Excluded from v3 Scores
      Data Re-pushed 2025-04-28
      Table 79,617 · Prose about 85K
    type: document
    size: xl
    position:
      x: 520
      'y': 1320
  - id: repo_boundary
    label: |-
      Paper/Harness Boundary
      Paper Pins No Harness Commit
      Current Few-shot: first_n
      README: --apply_chat_template
      Full Run Commands Unreleased
    type: document
    size: xl
    position:
      x: 40
      'y': 1500
  - id: aggregation_boundary
    label: |-
      Aggregation Boundary
      Paper Cell: Domain Mean
      Overall: 11-language Macro
      Harness: weight_by_size
      Derived 75.95: Counterfactual
      Not Official · Not Reproduced
    type: document
    size: xl
    position:
      x: 280
      'y': 1500
  - id: reporting_drift
    label: |-
      Paper/README Count Drift
      Abstract: More than 42 Models
      Section 4: 42 · Intro/End: 45
      Task README: 42 Subjects · 72%
      v3/Card: 41 Subjects · 74%
    type: document
    size: xl
    position:
      x: 520
      'y': 1500
