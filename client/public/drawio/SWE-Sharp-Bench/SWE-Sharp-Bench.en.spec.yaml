meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-Sharp-Bench Build Process
  description: >-
    Paper-aligned C# repository selection, .NET environment construction, three-state execution filtering, human review,
    and patch evaluation.
  legend: Read the construction row left-to-right, then the C# agent evaluation row right-to-left.
nodes:
  - id: repos
    label: |-
      Top 100 C# GitHub Repositories
      At Least 5,000 Stars; Active 6 Months
      Latest Commit Builds and Tests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: prs
    label: |-
      Scrape 1,000 Latest PRs per Repo
      Reference Issue + Modify Test Files
      Merged into Default Branch
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: environment
    label: |-
      Auto-Generate .NET Dockerfile
      Parse Workflows / sln / csproj / env
      Resolve NuGet and Runtime Versions
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: validate_env
    label: |-
      Build and Launch Container
      Minimally Repair Setup Failures
      Otherwise Discard Pull Request
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: execute
    label: |-
      Three-State Test Execution
      Base -> Base + Test -> Test + Fix
      Require Pass -> Fail -> Pass
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: manual
    label: |-
      Two-Author Manual Verification
      Check Statement Specification
      Reject Narrow / Misaligned Tests
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-Sharp-Bench
      150 Issue-Resolving Tasks
      17 C# Repositories
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: agent
    label: |-
      SWE-Agent or OpenHands
      C#-Adapted Prompt
      One Valid Attempt; 2-Hour Timeout
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: patch
    label: |-
      Agent Edits Non-Test Files
      Generate Repository Patch
      Execute in Reproducible Container
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tests
    label: |-
      Run Required .NET Tests
      NUnit / XUnit / MSTest
      Unified Normalized Logs
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metric
    label: |-
      Resolved Instance
      Generated Patch Passes All Tests
      Metric: Resolution Rate
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: repos
    to: prs
    type: primary
  - from: prs
    to: environment
    type: primary
  - from: environment
    to: validate_env
    type: primary
  - from: validate_env
    to: execute
    type: primary
  - from: execute
    to: manual
    type: primary
  - from: manual
    to: dataset
    type: primary
  - from: dataset
    to: agent
    type: primary
  - from: agent
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: metric
    type: primary
modules: []
