meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EQ-Bench Build Process
  description: Paper-aligned construction of 60 emotional-understanding dialogue questions and distance-based scoring.
  legend: >-
    Solid arrows follow arXiv:2312.06281 from GPT-4 dialogue generation through author references, zero-shot
    critique-and-revision responses, parsing retries, normalization, and final benchmark score.
nodes:
  - id: seeds
    label: |-
      Sample diverse dialogue seeds
      random location · author style
      broad conflict / tension scenario
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: dialogues
    label: |-
      Generate emotionally charged dialogues
      GPT-4 writes positive or negative conflict scenes
      retain nuanced interpersonal dynamics
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: references
    label: |-
      Authors construct each question
      choose 4 diverse candidate emotions
      set 0–10 reference intensities themselves
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: dataset
    label: |-
      EQ-Bench test set
      60 English emotional-understanding questions
      author references avoid GPT-4-as-judge bias
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: prompt
    label: |-
      Administer exact zero-shot prompt
      first-pass 0–10 ratings → stepwise critique
      revised 0–10 ratings in parseable format
    type: document
    size: xl
    position:
      x: 1080
      'y': 250
  - id: retry
    label: |-
      Parse both rating sets
      start temperature 0.01
      on failure add 0.15; stop after >5 attempts
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: normalize
    label: |-
      Normalize each 4-emotion vector to sum 10
      compare model and normalized reference
      focus on relative emotional intensity
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: question_score
    label: |-
      Score each parseable answer
      10 − Σ absolute rating differences
      random responding calibrates to 0
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: final_score
    label: |-
      Average first-pass and revised runs separately
      take the better overall run, not per question
      <50/60 parseable = fail · perfect = 100
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
