meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CraftBench 记录与 AWM 合成流程
  description: 按固定证据还原 CraftBench 场景记录、各执行组件反馈环，以及独立的智能体评测分支。
  legend: 虚线表示来源、反馈或评测证据；实线表示构建与判分顺序。
nodes:
  - id: evidence
    label: |-
      证据冻结
      arXiv:2602.10090v3
      GitHub @85e322f
      AWM-1K @dde80a0
    type: document
    size: xl
    position:
      x: 880
      'y': 40
  - id: seeds
    label: |-
      100 个热门域名
      有状态应用场景种子
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: scenario_filter
    label: |-
      Self-Instruct 场景扩展
      CRUD 分类器
      嵌入去重：保留余弦值 ≤ 0.85
      设置类别上限
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: collection
    label: |-
      AWM 集合
      1,000 个唯一场景
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: craft_record
    label: |-
      CraftBench：定制制造作业跟踪器
      官方场景 ID
      manufacturing_execution_system_1
    type: database
    size: xl
    position:
      x: 880
      'y': 300
  - id: tasks
    label: |-
      该场景含 10 个任务
      可由 API 完成 · 登录后场景
      AWM 总计 10,000 个任务
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: schema
    label: |-
      SQLite 模式合成
      Craft：18 张表
    type: database
    size: xl
    position:
      x: 1440
      'y': 300
  - id: sample_data
    label: |-
      初始数据合成
      Craft：114 条 INSERT
    type: database
    size: xl
    position:
      x: 1720
      'y': 300
  - id: api_spec
    label: |-
      先合成接口规范
      18 个 API 组 · 50 个端点
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: env_code
    label: |-
      环境代码实现
      SQLAlchemy · Pydantic
      FastAPI · MCP 服务 · 端点成为工具
    type: process
    size: xl
    position:
      x: 2280
      'y': 300
  - id: verifier
    label: |-
      任务验证器合成
      比较执行前后数据库状态
      结构化证据 + 自然语言标准
    type: process
    size: xl
    position:
      x: 2560
      'y': 300
  - id: release
    label: |-
      发布的可执行 AWM 环境
      MCP 工具 + 任务验证器
    type: database
    size: xl
    position:
      x: 2840
      'y': 300
  - id: boundary
    label: |-
      身份 / 评测边界
      无独立划分、提示、评测程序
      或 CraftBench 指标
    type: document
    size: xl
    position:
      x: 3400
      'y': 300
  - id: schema_feedback
    label: |-
      模式反馈环
      执行 DDL · 失败率 < 10% 才接受
      traceback → 200–500 token 摘要
      重新生成 · 最多 5 次
      随后保留最低错误率尝试
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: data_feedback
    label: |-
      样例数据反馈环
      执行 INSERT · 失败率 < 10% 才接受
      traceback → 200–500 token 摘要
      重新生成 · 最多 5 次
      随后保留最低错误率尝试
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: env_feedback
    label: |-
      环境反馈环
      启动 · 健康检查 · 工具列表
      仅接受 0% 启动错误
      traceback → 200–500 token 摘要
      重新生成 ×5；随后保留最低错误率
    type: process
    size: xl
    position:
      x: 2280
      'y': 40
  - id: agent_trajectory
    label: |-
      智能体评测运行
      智能体轨迹
      列出工具 · 调用工具
    type: process
    size: xl
    position:
      x: 2840
      'y': 600
  - id: verification_signals
    label: |-
      任务验证器输出
      结构化验证信号
    type: document
    size: xl
    position:
      x: 2560
      'y': 760
  - id: judge
    label: |-
      代码增强 GPT-5 判分器
      轨迹 + 结构化验证信号
    type: process
    size: xl
    position:
      x: 3120
      'y': 680
  - id: outcome
    label: |-
      结果分类
      完成 · 部分完成
      智能体错误 · 环境错误
    type: process
    size: xl
    position:
      x: 3400
      'y': 680
  - id: awm_reward
    label: |-
      仅用于 AWM 训练奖励
      完成 = 1.0 · 部分完成 = 0.1
      其他 = 0.0
      格式错误 = −1；提前终止
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 680
