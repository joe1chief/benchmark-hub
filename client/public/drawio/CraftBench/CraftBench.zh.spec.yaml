meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CraftBench 身份与 AWM 环境合成流程
  description: 按论文对齐的 AWM 合成流程，明确 CraftBench 只是名为“定制制造作业跟踪器”的一个场景，而非拥有独立数据集或分数的 benchmark。
  legend: 橙色表示身份边界；下方路径是 AWM 通用环境与奖励流程。
nodes:
  - id: seeds
    label: |-
      100 个热门域名
      有状态应用场景种子
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: scenarios
    label: |-
      Self-Instruct 扩展场景
      CRUD 分类器与嵌入去重
      限制过度代表类别
    type: process
    size: xl
    position:
      x: 320
      'y': 190
  - id: collection
    label: |-
      AWM 集合：1,000 个场景
      CraftBench 仅在附录表 16 中列为
      “定制制造作业跟踪器”
    type: database
    size: xl
    position:
      x: 600
      'y': 190
  - id: identity
    label: 是否发布独立 benchmark 协议？
    type: decision
    size: xl
    position:
      x: 880
      'y': 190
  - id: boundary
    label: |-
      没有独立 CraftBench 论文、题数、划分、
      提示、评测运行或指标
      公开资料只给出场景名称
    type: document
    size: xl
    position:
      x: 1160
      'y': 40
  - id: tasks
    label: |-
      AWM 通用任务合成
      每场景 10 个可由 API 完成的登录后任务
      总计 10,000 个任务
    type: process
    size: xl
    position:
      x: 1160
      'y': 310
  - id: database
    label: |-
      生成 SQLite 模式与样例数据
      定义状态空间和初始状态
    type: process
    size: xl
    position:
      x: 1440
      'y': 310
  - id: tools
    label: |-
      生成 Python 工具层
      以 MCP 暴露动作、观测和状态转移
    type: process
    size: xl
    position:
      x: 1720
      'y': 310
  - id: verifier
    label: |-
      生成任务验证代码
      比较执行前后数据库状态
      同时生成成功与失败标准
    type: process
    size: xl
    position:
      x: 2000
      'y': 310
  - id: validate
    label: |-
      执行组件与健康检查
      错误摘要并最多自修复 5 次
      环境启动错误阈值为零
    type: process
    size: xl
    position:
      x: 2280
      'y': 310
  - id: agent
    label: |-
      AWM 训练交互
      智能体先列工具再进行多轮调用
      这不是 CraftBench 专属测试
    type: process
    size: xl
    position:
      x: 2560
      'y': 310
  - id: reward
    label: |-
      代码增强 GPT-5 判分器
      完成 / 部分完成 / 智能体错误 / 环境错误
      这是 AWM 奖励，不是 CraftBench 独立分数
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 310
edges:
  - from: seeds
    to: scenarios
    type: primary
  - from: scenarios
    to: collection
    type: primary
  - from: collection
    to: identity
    type: primary
  - from: identity
    to: boundary
    type: primary
  - from: identity
    to: tasks
    type: primary
  - from: tasks
    to: database
    type: primary
  - from: database
    to: tools
    type: primary
  - from: tools
    to: verifier
    type: primary
  - from: verifier
    to: validate
    type: primary
  - from: validate
    to: agent
    type: primary
  - from: agent
    to: reward
    type: primary
modules: []
