meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CraftBench 记录与 AWM 合成流程
  description: 按固定证据还原 CraftBench 场景记录及其 AWM 构建产物，并明确训练环境与独立评测基准的边界。
  legend: 虚线表示来源或奖励证据；主路径表示从场景到可执行环境的合成。
nodes:
  - id: evidence
    label: |-
      证据冻结
      arXiv:2602.10090v3
      GitHub @85e322f
      AWM-1K @dde80a0
    type: document
    size: xl
    position:
      x: 880
      'y': 40
  - id: seeds
    label: |-
      100 个热门域名
      有状态应用场景种子
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: scenario_filter
    label: |-
      Self-Instruct 场景扩展
      CRUD 分类器
      嵌入去重：余弦值 < 0.85
      设置类别上限
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: collection
    label: |-
      AWM 集合
      1,000 个唯一场景
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: craft_record
    label: |-
      CraftBench：定制制造作业跟踪器
      官方 ID（下划线分隔）
      manufacturing · execution
      system · 1
    type: database
    size: xl
    position:
      x: 880
      'y': 300
  - id: tasks
    label: |-
      该场景含 10 个任务
      可由 API 完成 · 登录后场景
      AWM 总计 10,000 个任务
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: sqlite
    label: |-
      SQLite 状态与初始数据
      Craft：18 张表 · 114 条插入
    type: database
    size: xl
    position:
      x: 1440
      'y': 300
  - id: interface
    label: |-
      SQLAlchemy · Pydantic
      FastAPI · MCP：18 个 API 组
      50 个端点；每个端点成为工具
    type: process
    size: xl
    position:
      x: 1720
      'y': 300
  - id: verifier
    label: |-
      任务验证器
      比较执行前后数据库状态
      提取成功与失败标准
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: self_correct
    label: |-
      基于执行的自纠错
      traceback 压缩至 200–500 tokens
      回灌并最多重试 5 次
    type: process
    size: xl
    position:
      x: 2280
      'y': 300
  - id: tolerance
    label: |-
      重试后保留最低错误率尝试
      模式 / 数据允许 10% 错误
      环境启动错误阈值：0%
    type: process
    size: xl
    position:
      x: 2560
      'y': 300
  - id: boundary
    label: |-
      身份 / 评测边界
      无独立划分、提示、评测程序
      或 CraftBench 指标
    type: document
    size: xl
    position:
      x: 2840
      'y': 300
  - id: awm_reward
    label: |-
      代码增强 GPT-5 判分器
      仅用于 AWM 训练奖励
      完成 = 1.0 · 部分完成 = 0.1
      其他 = 0.0
      格式错误 = −1；提前终止
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 40
edges:
  - from: evidence
    to: craft_record
    type: data
  - from: seeds
    to: scenario_filter
    type: primary
  - from: scenario_filter
    to: collection
    type: primary
  - from: collection
    to: craft_record
    type: primary
  - from: craft_record
    to: tasks
    type: primary
  - from: tasks
    to: sqlite
    type: primary
  - from: sqlite
    to: interface
    type: primary
  - from: interface
    to: verifier
    type: primary
  - from: verifier
    to: self_correct
    type: primary
  - from: self_correct
    to: tolerance
    type: primary
  - from: tolerance
    to: boundary
    type: primary
  - from: verifier
    to: awm_reward
    type: data
modules: []
