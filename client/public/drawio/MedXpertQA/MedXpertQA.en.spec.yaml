    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: human_filter
    label: |-
      Human-difficulty Filter
      Retain 10,146
      Adaptive Brier Thresholds
      Three Levels · 3rd–25th Percentiles
      16.78% Without Annotations Unfiltered
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 260
      'y': 40
  - id: ai_filter
