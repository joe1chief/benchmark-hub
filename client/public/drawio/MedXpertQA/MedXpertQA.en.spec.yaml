meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedXpertQA Build and Evaluation Process
  description: >-
    Paper-aligned construction from 37,543 authoritative medical questions through calibrated human and AI difficulty
    filters, duplicate removal, leakage-oriented rewriting, licensed-physician review, public splits, and exact scoring.
  legend: >-
    Solid arrows show construction and evaluation paths. Dashed arrows isolate paper-ordering, image-count, source-code,
    and model-count discrepancies so that conflicting evidence remains visible without altering the executable path.
