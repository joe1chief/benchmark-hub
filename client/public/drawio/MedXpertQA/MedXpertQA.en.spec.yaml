meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedXpertQA Build and Evaluation Process
  description: >-
    Paper-aligned construction from 37,543 authoritative medical exam questions through calibrated human and AI
    difficulty filtering, duplicate removal, leakage-oriented augmentation, licensed-physician review, and evaluation.
  legend: >-
    Final 4,460 items comprise 2,455 Text and 2,005 MM questions; each subset reserves five development examples,
    leaving 2,450 Text and 2,000 MM test questions. The main overview reports 2,839 MM images, whereas Table 2 reports
    2,852 images for the 2,000-question MM test set.
nodes:
  - id: collect
    label: |-
      Collect Authoritative Questions
      Licensing and Specialty Board Exams
      Radiology Exams · NEJM Images
      Total Input: 37,543
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: annotations
    label: |-
      Preserve Source Annotations
      Human Response Distributions
      Expert Explanations
      Prior Difficulty Ratings
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: difficulty
    label: |-
      Filter for Expert Difficulty
      Adaptive Brier Score by Prior Rating
      Eight AI Experts · 14 Sample Votes
      37,543 → 10,146 → 4,737
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: edit
    label: |-
      Remove Exact-like Duplicates
      Apply Edit-distance Filtering
      Retain Harder Question in a Pair
      4,737 → 4,713
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: semantic
    label: |-
      Remove Semantic Near-duplicates
      MedCPT Query Encoder
      Cosine Similarity · IQR Outliers
      Keep Harder Item · 4,713 → 4,683
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: question_aug
    label: |-
      Rephrase Public Questions
      GPT-4o and Claude 3.5 Sonnet
      Preserve All Clinical Information
      Reduce Memorization Leakage
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: option_aug
    label: |-
      Strengthen Answer Options
      Drop Low-response Distractors
      Keep Correct and at Least Two Distractors
      Expand Text to 10 · MM to 5 Options
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: expert_review
    label: |-
      Run Multi-round Expert Review
      Licensed Physicians Check Every Item
      Correct Facts, Narratives, and Options
      Delete Remaining Failures · 4,460
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Form Text and MM Subsets
      Text: 2,455 · MM: 2,005
      Main Overview: 2,839 MM Images
      17 Specialties · 11 Body Systems
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      Reserve Few-shot Development Items
      Five Text and Five MM Examples
      Test: 2,450 Text · 2,000 MM
      Table 2: 2,852 Test Images
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: labels
    label: |-
      Add Analysis Labels
      Three Tasks and Fine-grained Subtasks
      Reasoning versus Understanding
      Human Review on a Random 10 Percent
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: evaluate
    label: |-
      Evaluate 18 Leading Models
      LLMs on Text · LMMs on Both Subsets
      Zero-shot Chain of Thought
      Greedy Decoding and Answer Cleansing
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: human
    label: |-
      Establish Human Baseline
      Aggregate Pre-licensed Expert Responses
      Reuse Source Response Distributions
      Compare Reasoning and Understanding
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report MedXpertQA Accuracy
      Overall · Text · MM
      Specialty and Task Breakdowns
      Reasoning-oriented Model Analysis
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
