      Rewrite Public Questions
      GPT-4o-2024-11-20
      Claude-3.5-Sonnet-20241022
      Preserve Clinical Content
      Reduce Memorization Leakage
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 40
  - id: option_count
