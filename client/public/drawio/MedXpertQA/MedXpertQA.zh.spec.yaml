meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedXpertQA 构建与评测流程
  description: 对齐论文展示从 37,543 道权威医学题出发，经校准的人类与 AI 难度筛选、重复题清理、面向泄漏的改写、执业医师复核、公开划分与精确计分的全流程。
  legend: 实线表示构建与评测路径；虚线隔离论文步骤顺序、图像数量、构建源码与模型数量的冲突，保留证据但不改写可执行路径。
nodes:
  - id: pool
    label: |-
      收集权威医学题库
      共 37,543 题
      文本 26,675 · 多模态 10,868
      考试题与 NEJM 图像
      保留作答分布
      解释与难度标注
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: human_filter
    label: |-
      人类难度筛选
      保留 10,146 题
      自适应 Brier 阈值
      三级难度·第 3–25 百分位
      16.78% 无标注题不经此筛选
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 260
      'y': 40
  - id: ai_filter
    label: |-
      AI 难度筛选
      保留 4,737 题
      每个基础专家尝试四次
      每题共十四票
      八模型专家池
      所有专家均错题保留
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 40
  - id: edit_filter
    label: |-
      编辑距离去重
      删除近乎相同题对
      题对中保留更难者
      4,737 → 4,713
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: semantic_filter
    label: |-
      语义去重
      MedCPT 查询编码器
      余弦相似度 + IQR
      删除题对中较易者
      4,713 → 4,683
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: rewrite
    label: |-
      改写公开来源题
      GPT-4o-2024-11-20
      Claude-3.5-Sonnet-20241022
      保留全部临床信息
      降低记忆泄漏风险
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 40
  - id: option_count
    label: |-
      重建答案选项
      保留正确项 + 至少两个干扰项
      删除低作答率干扰项
      文本 = 10 个选项
      多模态 = 5 个选项
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: physician_review
    label: |-
      执业医师复核
      多轮检查每道题
      修正事实、叙事与选项
      删除 223 道不合格题
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1700
      'y': 40
  - id: release
    label: |-
      发布 MedXpertQA
      共 4,460 题
      文本 2,455 题
      多模态 2,005 题
      17 个专科·11 个系统
    type: database
    size: xl
    position:
      x: 1700
      'y': 360
  - id: public_split
    label: |-
      发布开发集与测试集
      文本：5 开发 + 2,450 测试
      多模态：5 开发 + 2,000 测试
      图像随多模态题发布
    type: process
    size: xl
    position:
      x: 1460
      'y': 360
  - id: label_review
    label: |-
      添加分析标签
      诊断 / 治疗 / 基础医学
      推理 / 理解
      声称随机复核 10%
      490 + 400 = 890
      39/890 = 4.3%
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 360
  - id: image_drift
    label: |-
      图像数量差异
      第 3.1 节：2,839 幅图像
      对应 2,005 道多模态题
      表 2：2,852 幅图像
      对应 2,000 道测试题
      发布版另含 6 张开发图
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 1700
      'y': 560
  - id: source_gap
    label: |-
      源码开放边界
      构建与增强代码未公开
      评测器、数据、图像与排行榜
      以 MIT 许可公开
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 220
  - id: order_boundary
    label: |-
      论文步骤顺序冲突
      第 3.2 节称 AI 为第一步
      人类筛选为第二步
      计数仅按下列顺序自洽
      37,543 → 10,146 → 4,737
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 220
  - id: standard_inference
    label: |-
      标准模型推理
      医疗助手系统提示
      零样本思维链
      第二次答案触发提示
      贪婪解码
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1460
      'y': 680
  - id: parser
    label: |-
      标准模型解析器
      先按完整答案触发词切分
      失败则尝试 " answer is "
      再失败则扫描整段第二轮回复
      匹配 A–J 或 A–E
      取首个匹配·空结果计错
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 680
  - id: special_models
    label: |-
      特殊模型抽样
      o1/o3-mini：每子集与类型 10%
      随机种子 42
      QVQ 与 DeepSeek 单独路径
    type: process
    size: xl
    position:
      x: 1460
      'y': 940
  - id: special_parser
    label: |-
      特殊模型解析器
      QVQ：在 Final Answer 处切分
      取首个或最后一个字母
      DeepSeek：读取 boxed 答案
      要求 A–J 或 A–E
    type: process
    size: xl
    position:
      x: 1220
      'y': 940
  - id: accuracy
    label: |-
      计算精确准确率
      校验标识与输出长度
      每个源标识必须有输出
      空或无效结果计错
      正确数 ÷ 全部保留输出
    type: terminal
    size: xl
    style:
      fontSize: 9
    position:
      x: 980
      'y': 800
  - id: model_count_boundary
    label: |-
      模型数量差异
      论文评测 18 个模型
      README 称 17 个
      报告锁定论文范围
    type: document
    size: xl
    position:
      x: 740
      'y': 800
edges:
  - from: pool
    to: human_filter
    type: primary
  - from: human_filter
    to: ai_filter
    type: primary
  - from: ai_filter
    to: edit_filter
    type: primary
  - from: edit_filter
    to: semantic_filter
    type: primary
  - from: semantic_filter
    to: rewrite
    type: primary
  - from: rewrite
    to: option_count
    type: primary
  - from: option_count
    to: physician_review
    type: primary
  - from: physician_review
    to: release
    type: primary
  - from: release
    to: public_split
    type: primary
  - from: public_split
    to: label_review
    type: primary
  - from: public_split
    to: standard_inference
    type: primary
  - from: standard_inference
    to: parser
    type: primary
  - from: parser
    to: accuracy
    type: primary
  - from: public_split
    to: special_models
    type: primary
    waypoints:
      - x: 1920
        'y': 500
      - x: 1920
        'y': 1000
      - x: 1680
        'y': 1000
  - from: special_models
    to: special_parser
    type: primary
  - from: special_parser
    to: accuracy
    type: primary
  - from: release
    to: image_drift
    type: secondary
    style:
      dashed: true
  - from: rewrite
    to: source_gap
    type: secondary
    style:
      dashed: true
  - from: ai_filter
    to: order_boundary
    type: secondary
    style:
      dashed: true
  - from: accuracy
    to: model_count_boundary
    type: secondary
    style:
      dashed: true
modules: []
