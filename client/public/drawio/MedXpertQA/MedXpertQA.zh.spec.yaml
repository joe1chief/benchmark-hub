meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedXpertQA 构建与评测流程
  description: 对齐论文展示从 37,543 道权威医学考试题，经人类与 AI 校准难度筛选、重复题清理、面向泄漏的增强、 执业医师复核，到最终评测的完整流程。
  legend: >-
    最终 4,460 题包含 2,455 道 Text 与 2,005 道 MM；每个子集各留五题作开发示例，测试集因此为 2,450 道 Text 和 2,000 道 MM。正文概览记载 MM 共 2,839 幅图像，而 Table
    2 对 2,000 道 MM 测试题记载 2,852 幅图像。
nodes:
  - id: collect
    label: |-
      收集权威医学题目
      执照考试与专科委员会考试
      放射科考试 · NEJM 图像挑战
      初始共 37,543 题
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: annotations
    label: |-
      保留来源标注
      人类作答分布
      专家解析
      先验难度评级
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: difficulty
    label: |-
      筛出专家级难题
      按先验评级设自适应 Brier 阈值
      八个 AI 专家 · 每题 14 次投票
      37,543 → 10,146 → 4,737
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: edit
    label: |-
      清除近似精确重复题
      执行编辑距离筛选
      相似题对保留更难者
      4,737 → 4,713
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: semantic
    label: |-
      清除语义近重复题
      使用 MedCPT Query Encoder
      余弦相似度 · IQR 异常值
      保留更难者 · 4,713 → 4,683
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: question_aug
    label: |-
      改写公开来源题干
      GPT-4o 与 Claude 3.5 Sonnet
      保留全部临床信息
      降低记忆泄漏风险
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: option_aug
    label: |-
      强化答案选项
      删除低人类选择率干扰项
      保留正确项及至少两个干扰项
      Text 扩至 10 项 · MM 扩至 5 项
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: expert_review
    label: |-
      多轮医学专家复核
      执业医师检查每道题
      修正事实叙事与选项问题
      删除残余不合格项 · 得 4,460 题
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      形成 Text 与 MM 子集
      Text：2,455 · MM：2,005
      正文概览：MM 共 2,839 幅图像
      17 个专科 · 11 个身体系统
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      留出少样本开发题
      Text 与 MM 各五道
      测试：Text 2,450 · MM 2,000
      Table 2：测试集 2,852 幅图像
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: labels
    label: |-
      添加分析标签
      三类任务与细粒度子任务
      推理类与理解类
      人工复核随机 10% 标签
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: evaluate
    label: |-
      评测 18 个领先模型
      LLM 评 Text · LMM 评两个子集
      零样本思维链提示
      贪婪解码并清洗答案
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: human
    label: |-
      建立人类基线
      汇总准执业专家回答
      复用来源作答分布
      比较推理与理解子集
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告 MedXpertQA 准确率
      总体 · Text · MM
      按专科与任务拆分
      分析推理导向模型
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: annotations
    type: primary
  - from: annotations
    to: difficulty
    type: primary
  - from: difficulty
    to: edit
    type: primary
  - from: edit
    to: semantic
    type: primary
  - from: semantic
    to: question_aug
    type: primary
  - from: question_aug
    to: option_aug
    type: primary
  - from: option_aug
    to: expert_review
    type: primary
  - from: expert_review
    to: release
    type: primary
  - from: release
    to: split
    type: primary
  - from: split
    to: labels
    type: primary
  - from: labels
    to: evaluate
    type: primary
  - from: evaluate
    to: human
    type: primary
  - from: human
    to: report
    type: primary
modules: []
