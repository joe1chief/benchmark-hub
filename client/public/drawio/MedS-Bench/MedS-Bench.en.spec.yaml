  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedS-Bench Build and Evaluation Process
  description: >-
    Paper- and official-platform-aligned integration of existing medical datasets into instruction-formatted clinical
    tasks, leakage-controlled evaluation splits, cost-aware sampling, task-specific metrics, and a dynamic leaderboard.
  legend: >-
    The paper release contains 28 source datasets, 52 tasks, and about 0.3 million samples; the maintained official
    platform now states 39 integrated datasets, reflecting post-paper dynamic expansion rather than the original paper
    count.
