meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedS-Bench Build and Evaluation Process
  description: >-
    Paper- and official-platform-aligned integration of existing medical datasets into instruction-formatted clinical
    tasks, leakage-controlled evaluation splits, cost-aware sampling, task-specific metrics, and a dynamic leaderboard.
  legend: >-
    Paper v2 is internally inconsistent: Section 2.1 and Figure 1 report 28 source datasets and 52 tasks, while Figure 3
    says 39 datasets. The maintained README also says 39; fixed release snapshots expose additional task-count drift.
