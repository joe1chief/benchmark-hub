  title: "ReasoningQA Build and Evaluation Process"
  description: "ReasoningQA is not a standalone LongCat benchmark paper. It is the self-constructed logical-reasoning component of OpenAudioBench introduced in the Baichuan-Audio report. The official card lists 202 audio items and the report states that each answer is evaluated by GPT-4o against a reference answer before accuracy is calculated. Audio models are tested in speech-to-text mode or non-cascaded speech-to-speech mode; for the latter, interleaved output text is merged for scoring. Later LongCat reports reuse the same named subset in comparative result tables but do not document an alternative construction pipeline."
  legend: "Source: Baichuan-Audio arXiv:2502.17239 Section 4.3 and Table 8, cross-checked against the baichuan-inc/OpenAudioBench dataset card; LongCat-Flash-Omni only reuses the subset in its result table. Solid arrows show the main flow explicitly supported by the paper or official documentation."
