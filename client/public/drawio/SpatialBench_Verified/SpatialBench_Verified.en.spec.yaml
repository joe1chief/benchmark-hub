  title: SpatialBench Verified Build and Evaluation Process
  description: >-
    SpatialBench Verified is a LatchBio evaluation variant documented only in the Claude Sonnet 5 system card, not in a
    standalone benchmark paper. The card says it tests analysis of spatial-transcriptomics data across 115 externally
    validated problems and requires models to answer biological questions about a sample from the analysis results. The
    cited source does not disclose how problems were sourced or annotated, dataset splits, prompts, tools,
    reference-answer format, per-item rubric, or aggregation formula. The diagram therefore preserves the disclosed
    scope and validation facts while marking the unavailable build and scoring details explicitly instead of inventing
    them.
  legend: >-
    Source: Claude Sonnet 5 System Card Section 8.14.2 LatchBio Bioinformatics, p.142. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
