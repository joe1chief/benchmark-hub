meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PutnamBench Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of the manual Lean 4, Isabelle, and Coq formalization sequence, second-person
    verification, factored-solution tasks, proof-assistant checking, and pass@n evaluation in the NeurIPS 2024 paper.
  legend: >-
    Solid arrows reproduce the paper workflow. Dashed arrows separate source permission, near-paper and current
    repository snapshots, count drift, and language-specific license boundaries.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2407.11214v2
      PDF 0a990ea2dcfe
      Current Repo 982b29ea89d5
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: putnam_sources
    label: |-
      Collect 640 Putnam Problems
      Original English Statements
      Numerical Solutions Where Needed
      Natural-language Proofs Required
    type: database
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: category_inventory
    label: |-
      Paper Category Inventory · Overlapping
      Algebra 253 · Analysis 226
      Number Theory 107 · Geometry 68
      Linear Algebra 51 · Abstract Algebra 28
      Combinatorics 26 · Probability 9 · Set 8
    type: document
    size: xl
    position: { x: 980, y: 780 }
    style: { fontSize: 9 }
  - id: factored_solutions
    label: |-
      Factor Closed-form Solutions
      for Roughly 60% of Problems
      Keep Solution outside Theorem
      Preserve Solution-finding Difficulty
    type: process
    size: xl
    position: { x: 740, y: 300 }
    style: { fontSize: 9 }
  - id: human_team
    label: |-
      Manual Formalization Team
      2 Doctoral + 5 Undergraduate Students
      Prior Math · CS · Proof-assistant Experience
      About 25 min per Problem per Language
    type: user
    size: xl
    position: { x: 980, y: 300 }
    style: { fontSize: 9 }
  - id: lean_forms
    label: |-
      First Formalize in Lean 4
      640 Paper Formalizations
      Use Mathlib Definitions
      Manually Constructed
    type: process
    size: xl
    position: { x: 1220, y: 80 }
    style: { fontSize: 9 }
  - id: isabelle_forms
    label: |-
      Then Formalize in Isabelle
      640 Paper Formalizations
      Adapt to HOL Foundations
      Not a Mechanical Translation
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: coq_forms
    label: |-
      Finally Formalize in Coq
      412 Paper Formalizations
      MathComp · Coquelicot · GeoCoq
      Language-specific Adaptation
    type: process
    size: xl
    position: { x: 1700, y: 520 }
    style: { fontSize: 9 }
  - id: second_person_verify
    label: |-
      Independent Peer Verification
      Every Formalization Checked
      by a Second Person at Least Once
      About 10 min on Average
    type: process
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: paper_dataset
    label: |-
      PutnamBench Paper Contract
      640 Problems
      Lean 640 + Isabelle 640 + Coq 412
      1,692 Formalizations Total
    type: database
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: task_gate
    label: |-
      Choose Evaluation Task
      Factored Problems Support
      Two Distinct Settings
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: task_one
    label: |-
      Task 1
      Infer Closed-form Solution
      Rewrite It into the Theorem
      Then Prove Correctness
      Not Evaluated by Paper Baseline
    type: document
    size: xl
    position: { x: 2660, y: 80 }
    style: { fontSize: 9 }
  - id: task_two
    label: |-
      Task 2
      Given Theorem + Solution
      Produce a Proof
      of Its Correctness
    type: document
    size: xl
    position: { x: 2660, y: 520 }
    style: { fontSize: 9 }
  - id: prover_attempts
    label: |-
      Generate Proof Attempts
      Budget n Attempts per Problem
      Paper GPT-4o Baseline pass@10
      Temperature 0.7
    type: process
    size: xl
    position: { x: 2900, y: 300 }
    style: { fontSize: 9 }
  - id: proof_check
    label: |-
      Execute Candidate Proof
      in Lean 4 · Isabelle · Coq
      Target Assistant Certifies
      Success or Failure
    type: process
    size: xl
    position: { x: 3140, y: 300 }
    style: { fontSize: 9 }
  - id: pass_n
    label: |-
      Report pass@n
      At Least One Certified Proof
      within n Attempts
    type: terminal
    size: xl
    position: { x: 3380, y: 300 }
  - id: maa_boundary
    label: |-
      Source Permission Boundary
      English Problem Statements
      Included with Permission
      from the MAA
    type: document
    size: xl
    position: { x: 500, y: 780 }
    style: { fontSize: 9 }
  - id: near_paper_release
    label: |-
      Near-paper Repository Snapshot
      93869067a543 · 2024-11-04
      644 + 640 + 412 = 1,696
      Differs from Paper 1,692
    type: document
    size: xl
    position: { x: 2180, y: 780 }
    style: { fontSize: 9 }
  - id: current_release
    label: |-
      Current Audited Snapshot
      982b29ea89d5
      Years 1962–2025
      672 + 640 + 412 = 1,724
    type: document
    size: xl
    position: { x: 2420, y: 1020 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      Language License Boundary
      Lean 4 + Isabelle · Apache-2.0
      Coq · MIT
      Informal Statements under MAA Permission
    type: document
    size: xl
    position: { x: 2660, y: 1260 }
    style: { fontSize: 9 }
edges:
  - { from: source_evidence, to: putnam_sources, type: secondary, style: { dashed: true } }
  - { from: putnam_sources, to: factored_solutions, type: primary }
  - from: putnam_sources
    to: category_inventory
    type: secondary
    style: { dashed: true }
    waypoints:
      - { x: 460, y: 620 }
      - { x: 1080, y: 620 }
  - { from: factored_solutions, to: human_team, type: primary }
  - { from: human_team, to: lean_forms, type: primary }
  - { from: lean_forms, to: isabelle_forms, type: primary }
  - { from: isabelle_forms, to: coq_forms, type: primary }
  - { from: coq_forms, to: second_person_verify, type: primary }
  - { from: second_person_verify, to: paper_dataset, type: primary }
  - { from: paper_dataset, to: task_gate, type: primary }
  - { from: task_gate, to: task_one, type: primary }
  - { from: task_gate, to: task_two, type: primary }
  - { from: task_two, to: prover_attempts, type: primary }
  - { from: prover_attempts, to: proof_check, type: primary }
  - { from: proof_check, to: pass_n, type: primary }
  - from: putnam_sources
    to: maa_boundary
    type: secondary
    style: { dashed: true }
    waypoints:
      - { x: 360, y: 700 }
      - { x: 600, y: 700 }
  - { from: paper_dataset, to: near_paper_release, type: secondary, style: { dashed: true } }
  - { from: near_paper_release, to: current_release, type: secondary, style: { dashed: true } }
  - { from: current_release, to: license_boundary, type: secondary, style: { dashed: true } }
modules: []
