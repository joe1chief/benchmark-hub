  title: PutnamBench Build and Evaluation Process
  description: >-
    Paper-aligned workflow for manually formalizing William Lowell Putnam Mathematical Competition problems in Lean 4,
    Isabelle, and Coq, independently verifying the formalizations, and evaluating formal theorem provers.
  legend: >-
    The NeurIPS 2024 paper reports 640 Putnam problems, 640 Lean 4 formalizations, 640 Isabelle formalizations, and 412
    Coq formalizations, for 1,692 formalizations in total. Successful proofs are certified by the target proof assistant
    and summarized with pass@n.
