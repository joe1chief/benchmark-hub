meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TableVQA-Bench Build and Evaluation Process
  description: >-
    TableVQA-Bench converts WikiTableQuestions, TabFact, and FinTabNet into four visual table-QA subsets containing an
    image, HTML, and QA for every sample. VWTQ applies a Wikipedia stylesheet to WikiTableQuestions tables. VWTQ-Syn
    uses a custom renderer to create more varied styles. VTabFact renders TabFact tables and converts entailed or
    refuted statements into True or False questions. FinTabNet originally lacks QA, so GPT-4 generates questions and
    answers from text- and HTML-formatted financial tables; authors manually revise scale-unit errors. Tables with more
    than fifty rows are filtered and the authors review the released samples. The final benchmark contains 1,500 QA
    pairs over 894 table images: 750 VWTQ, 250 VWTQ-Syn, 250 VTabFact, and 250 FinTabNetQA. Evaluation sends the table
    image and question to each model, normalizes free-form answers for VWTQ and VWTQ-Syn, uses binary accuracy for
    VTabFact, and uses relieved accuracy that tolerates scale-unit variation for FinTabNetQA. Results are reported for
    every subset and as the benchmark aggregate.
  legend: >-
    Source: TableVQA-Bench arXiv:2404.19205 Sections 3-4; official naver-ai/tablevqabench repository and released
    dataset card. Solid arrows show the main flow explicitly supported by the paper or official documentation.
