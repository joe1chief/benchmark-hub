meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TableVQA-Bench 构建与评测流程
  description: >-
    TableVQA-Bench把WikiTableQuestions、TabFact和FinTabNet转换为4个视觉表格问答子集，每个样本都包含图像、HTML和问答。VWTQ给WikiTableQuestions表格套用Wikipedia样式表；VWTQ-Syn用自定义渲染器生成更多样式；VTabFact渲染TabFact表格，并把蕴含或反驳陈述转换为True或False问题；FinTabNet原本没有问答，因此用GPT-4根据文本和HTML格式的金融表格生成问题与答案，作者再人工修正单位尺度错误。超过50行的表格被过滤，发布样本由作者仔细复核。最终基准包含1500组问答、894张表格图像：VWTQ
    750条，VWTQ-Syn、VTabFact和FinTabNetQA各250条。评测时模型接收表格图像与问题；VWTQ和VWTQ-Syn对自由文本答案做规范化，VTabFact使用二元准确率，FinTabNetQA使用容忍单位尺度差异的宽松准确率，最后按子集及整体报告。
  legend: >-
    来源：TableVQA-Bench arXiv:2404.19205 Sections 3-4; official naver-ai/tablevqabench repository and released dataset
    card。实线箭头表示论文或官方资料明确支持的主流程。
