meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode 构建流程
  description: 对齐 NeurIPS 2023 论文的 InterCode 框架与三个原始环境：由 NL2Bash 构建 Bash、由 Spider 构建 SQL、 由 MBPP 构建 Python，并统一在可复现的 Docker 沙箱中执行。
  legend: 三条彩色泳道表示并行构建的环境。InterCode-CTF 属于后续独立论文扩展，因此单独绘制，不混入原论文三环境流程。
nodes:
  - id: contract
    label: |-
      将交互式编程定义为 POMDP
      自然语言任务指令
      代码 / 提交动作 → 执行反馈
      保持状态并循环至提交
    type: database
    size: xl
    position:
      x: 20
      'y': 350
  - id: docker
    label: |-
      模块化环境合同
      Dockerfile + 数据集 + 奖励
      安全且可复现的代码执行
      记录动作、观察与状态变化
    type: process
    size: xl
    position:
      x: 300
      'y': 350
  - id: bash_source
    label: |-
      Bash 来源 · NL2Bash
      从 1,000 条命令开始
      保留使用不少于 4 个工具的命令
    type: document
    size: xl
    position:
      x: 580
      'y': 0
  - id: bash_adapt
    label: |-
      落地并整理 Bash 任务
      删除不支持或非 Linux 条目
      补充文件路径并更新旧参数
      200 条命令分为 4 个互斥集合
    type: process
    size: xl
    position:
      x: 880
      'y': 0
  - id: bash_reward
    label: |-
      Bash 任务与奖励
      3 个自定义文件系统 + 1 个无关集合
      输出相似度 + 文件集合差异
      MD5 文件内容正确性
    type: process
    size: xl
    position:
      x: 1180
      'y': 0
  - id: sql_source
    label: |-
      SQL 来源 · Spider 1.0 Dev
      1,034 个问题 · 20 个数据库
      自然语言问题 + 标准 SQL
    type: document
    size: xl
    position:
      x: 580
      'y': 320
  - id: sql_adapt
    label: |-
      构建 MySQL 环境
      解决模式字段类型冲突
      将 SQLite 数据库转换为 MySQL
      合并为一个初始化转储文件
    type: process
    size: xl
    position:
      x: 880
      'y': 320
  - id: sql_reward
    label: |-
      SQL 执行奖励
      比较最后执行结果与标准结果
      记录 IoU / Jaccard
      以调整后的 Kendall τ 缩放排序得分
    type: process
    size: xl
    position:
      x: 1180
      'y': 320
  - id: python_source
    label: |-
      Python 来源 · MBPP
      117 道代码生成题
      题面 + 标准代码 + 单元测试
    type: document
    size: xl
    position:
      x: 580
      'y': 640
  - id: python_adapt
    label: |-
      构建 Python 解释器
      Ubuntu Docker 环境
      提交生成的函数
      保留 MBPP 测试合同
    type: process
    size: xl
    position:
      x: 880
      'y': 640
  - id: python_reward
    label: |-
      Python 执行奖励
      运行官方单元测试
      奖励 = 通过测试的比例
    type: process
    size: xl
    position:
      x: 1180
      'y': 640
  - id: suite
    label: |-
      发布 InterCode 套件
      Bash · SQL · Python
      query + gold 最小数据合同
      每个环境提供自定义奖励端点
    type: database
    size: xl
    position:
      x: 1480
      'y': 350
  - id: validate
    label: |-
      环境有效性检查
      标准动作执行时不得报错
      验证标准动作获得奖励 1
      测试数据加载器与容器
    type: process
    size: xl
    position:
      x: 1760
      'y': 350
  - id: evaluate
    label: |-
      交互式模型评测
      单轮对比最多 10 轮 Try Again
      ReAct 与 Plan-and-Solve 策略
      奖励为 1 或轮数耗尽时停止
    type: process
    size: xl
    position:
      x: 2040
      'y': 350
  - id: report
    label: |-
      汇报交互式编程结果
      成功率：奖励为 1 的任务占比
      非法动作 Error %
      平均轮数与奖励诊断
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 350
edges:
  - from: contract
    to: docker
    type: primary
  - from: docker
    to: bash_source
    type: primary
  - from: bash_source
    to: bash_adapt
    type: primary
  - from: bash_adapt
    to: bash_reward
    type: primary
  - from: docker
    to: sql_source
    type: primary
  - from: sql_source
    to: sql_adapt
    type: primary
  - from: sql_adapt
    to: sql_reward
    type: primary
  - from: docker
    to: python_source
    type: primary
  - from: python_source
    to: python_adapt
    type: primary
  - from: python_adapt
    to: python_reward
    type: primary
  - from: bash_reward
    to: suite
    type: primary
  - from: sql_reward
    to: suite
    type: primary
  - from: python_reward
    to: suite
    type: primary
  - from: suite
    to: validate
    type: primary
  - from: validate
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
