  title: InterCode Build Process
  description: >-
    Paper-aligned InterCode framework and the three environments introduced in the NeurIPS 2023 paper: Bash from
    NL2Bash, SQL from Spider, and Python from MBPP, all executed in reproducible Docker sandboxes.
  legend: >-
    The three colored lanes are parallel environment constructions. InterCode-CTF is a later paper extension and is
    documented separately rather than being folded into the original three-environment benchmark.
