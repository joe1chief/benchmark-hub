meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode Build Process
  description: >-
    Paper-aligned InterCode framework and the three environments introduced in the NeurIPS 2023 paper: Bash from
    NL2Bash, SQL from Spider, and Python from MBPP, all executed in reproducible Docker sandboxes.
  legend: >-
    The three colored lanes are parallel environment constructions. InterCode-CTF is a later paper extension and is
    documented separately rather than being folded into the original three-environment benchmark.
nodes:
  - id: contract
    label: |-
      Interactive Coding as a POMDP
      Natural-language Instruction
      Code / Submit Action → Execution Observation
      Stateful Loop Until Submit
    type: database
    size: xl
    position:
      x: 20
      'y': 350
  - id: docker
    label: |-
      Modular Environment Contract
      Dockerfile + Dataset + Reward
      Safe, Reproducible Execution
      Log Actions, Observations, and State Changes
    type: process
    size: xl
    position:
      x: 300
      'y': 350
  - id: bash_source
    label: |-
      Bash Source · NL2Bash
      Start from 1,000 Commands
      Retain Commands Using ≥4 Utilities
    type: document
    size: xl
    position:
      x: 580
      'y': 0
  - id: bash_adapt
    label: |-
      Ground and Curate Bash Tasks
      Remove Unsupported / Non-Linux Items
      Add Files and Paths · Update Old Flags
      200 Commands in 4 Disjoint Sets
    type: process
    size: xl
    position:
      x: 880
      'y': 0
  - id: bash_reward
    label: |-
      Bash Task + Reward
      3 Custom File Systems + 1 Agnostic Set
      Output Similarity + File-set Difference
      MD5 Content Correctness
    type: process
    size: xl
    position:
      x: 1180
      'y': 0
  - id: sql_source
    label: |-
      SQL Source · Spider 1.0 Dev
      1,034 Questions · 20 Databases
      Natural-language Query + Gold SQL
    type: document
    size: xl
    position:
      x: 580
      'y': 320
  - id: sql_adapt
    label: |-
      Build MySQL Environment
      Resolve Schema Type Conflicts
      Convert SQLite Databases to MySQL
      Combine into One Initialization Dump
    type: process
    size: xl
    position:
      x: 880
      'y': 320
  - id: sql_reward
    label: |-
      SQL Execution Reward
      Compare Latest Output with Gold Output
      Record IoU / Jaccard
      Scale Ordering by Adjusted Kendall τ
    type: process
    size: xl
    position:
      x: 1180
      'y': 320
  - id: python_source
    label: |-
      Python Source · MBPP
      117 Code-generation Problems
      Prompt + Gold Code + Unit Tests
    type: document
    size: xl
    position:
      x: 580
      'y': 640
  - id: python_adapt
    label: |-
      Build Python Interpreter
      Ubuntu Docker Environment
      Submit Synthesized Function
      Preserve MBPP Test Contract
    type: process
    size: xl
    position:
      x: 880
      'y': 640
  - id: python_reward
    label: |-
      Python Execution Reward
      Run Official Unit Tests
      Reward = Proportion of Tests Passed
    type: process
    size: xl
    position:
      x: 1180
      'y': 640
  - id: suite
    label: |-
      Released InterCode Suite
      Bash · SQL · Python
      Query + Gold Minimum Data Contract
      Custom Reward Endpoint per Environment
    type: database
    size: xl
    position:
      x: 1480
      'y': 350
  - id: validate
    label: |-
      Environment Validation
      Execute Gold Actions Without Error
      Verify Gold Receives Reward 1
      Test Data Loaders and Containers
    type: process
    size: xl
    position:
      x: 1760
      'y': 350
  - id: evaluate
    label: |-
      Interactive Model Evaluation
      Single Turn vs Max-10-turn Try Again
      ReAct and Plan-and-Solve Policies
      Stop at Reward 1 or Turn Exhaustion
    type: process
    size: xl
    position:
      x: 2040
      'y': 350
  - id: report
    label: |-
      Report Interactive Coding Results
      Success Rate: Episodes with Reward 1
      Error % for Inadmissible Actions
      Average Turns and Reward Diagnostics
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 350
