meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMSI-Bench Build Process
  description: >-
    Paper-aligned construction of 1,000 fully human-curated multi-image spatial questions from more than 120,000
    candidate real-world images, followed by independent quality control and exact-match evaluation of 37 MLLMs.
  legend: Every final question requires multiple images; non-multi-step questions contain exactly two images.
nodes:
  - id: images
    label: |-
      Inspect Candidate Images
      More Than 120K Images
      Eight Real-world Datasets
      No Synthetic Scenes
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Cover Diverse Sources
      ScanNet · Matterport3D · DTU
      nuScenes · Waymo · Ego4D
      AgiBot-World · DAVIS 2017
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: taxonomy
    label: |-
      Define Spatial Taxonomy
      Camera · Object · Region
      Position · Attribute · Motion
      Ten Basic plus Multi-step
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: annotate
    label: |-
      Six 3D-vision Researchers
      Spend More Than 300 Hours
      Use Free-form Annotation
      Avoid Question Templates
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: select
    label: |-
      Select Relevant Image Sets
      Require Cross-image Integration
      Reject Single-image-solvable Items
      Basic Tasks Use Two Images
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: question
    label: |-
      Write Four-choice Questions
      Exactly One Correct Answer
      Make Questions Challenging
      Keep Them Human-answerable
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: rationale
    label: |-
      Add Rich Annotations
      Craft Plausible Distractors
      Write Detailed Reasoning
      Set Difficulty by Human Time
    type: document
    size: xl
    position:
      x: 1420
      'y': 420
  - id: qc
    label: |-
      Three Independent Reviewers
      Remove Ambiguous or Wrong Items
      Reject Common-sense-solvable
      Reject Insufficient Visual Evidence
    type: user
    size: xl
    position:
      x: 1140
      'y': 420
  - id: release
    label: |-
      Assemble Final MMSI-Bench
      1,000 Questions · 1,990 Images
      Mean 2.55 Images per Question
      Maximum Ten Images
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: evaluate
    label: |-
      Evaluate 37 MLLMs
      Temperature Zero · Max 2,048
      Add Random and Blind GPT-4o
      Add Five-person Human Average
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: score
    label: |-
      Extract Answer and Score
      Exact Match with Gold Choice
      Use VLMEvalKit LLM Fallback
      Report Accuracy Percentage
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: analyze
    label: |-
      Analyze Four Error Modes
      Grounding · Overlap Matching
      and Scene Reconstruction
      Situation Transformation
      Spatial Logic
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: images
    to: sources
    type: primary
  - from: sources
    to: taxonomy
    type: primary
  - from: taxonomy
    to: annotate
    type: primary
  - from: annotate
    to: select
    type: primary
  - from: select
    to: question
    type: primary
  - from: question
    to: rationale
    type: primary
  - from: rationale
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: score
    type: primary
  - from: score
    to: analyze
    type: primary
modules: []
