meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMSI-Bench Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the ICLR 2026 camera-ready construction, public Parquet schema, human-time difficulty annotation, three
    prompting settings, paper and released-code answer extraction boundaries, all-row accuracy denominator, and
    reasoning-error analysis, using arXiv:2505.23764v3 and pinned official code/data revisions.
  legend: >-
    Solid arrows trace construction and scoring. Labeled branches preserve image-dependence rejection, quality-control
    revision, prompt strategy, regex failure, and LLM-fallback exhaustion. CC BY does not replace upstream image rights.
