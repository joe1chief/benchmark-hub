meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComplexFuncBench 构建与评测流程
  description: 按论文还原 1,000 条复杂旅行函数调用样本的三阶段构建流程，以及用于调用级和最终回答评分的完整 ComplexEval。
  legend: 实线依次表示 API 整理、粗粒度生成、人工精标、十倍泛化和自动评测。
nodes:
  - id: apis
    label: |-
      Booking.com（经 RapidAPI）
      五个领域的 43 个实时 API
      人工修正函数描述
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coarse
    label: |-
      阶段一：GPT-4o 粗粒度生成
      采样函数并生成 1,000 个问题
      以及初始函数调用路径
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: select
    label: |-
      选择 100 个相对完整样本
      覆盖不同步数与调用路径
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: correct
    label: |-
      阶段二：资深标注
      改写问题并修正参数
      构造最短且完整的调用路径
    type: user
    size: xl
    position:
      x: 880
      'y': 100
  - id: disambiguate
    label: |-
      消除歧义
      排除功能重叠函数并删除
      产生多个有效参数的 API 结果
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: templates
    label: |-
      质检后的模板集
      100 条无错误复杂调用路径
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generalize
    label: |-
      阶段三：十倍泛化
      GPT-4o 修改地点与约束
      初级标注员填写参数
    type: user
    size: xl
    position:
      x: 1720
      'y': 100
  - id: dataset
    label: |-
      ComplexFuncBench
      1,000 条样本
      600 单域 + 400 跨域
    type: database
    size: xl
    position:
      x: 2000
      'y': 100
  - id: model
    label: |-
      模型迭代预测函数调用
      接收已标注的 API 响应
      直至生成最终回答
    type: process
    size: xl
    position:
      x: 2000
      'y': 440
  - id: format
    label: |-
      格式检查
      有效函数 / 必需参数 / 参数类型
      返回具体错误供模型自我修正
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: mapping
    label: |-
      将预测调用映射到标准调用
      bge-large-en 向量
      余弦相似度 + 匈牙利算法
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: matching
    label: |-
      多维等价判断
      精确规则 / 相同 API 响应
      GPT-4o 参数语义匹配
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: call_metrics
    label: |-
      函数调用指标
      任务成功率
      调用准确率
    type: terminal
    size: xl
    position:
      x: 880
      'y': 330
  - id: response
    label: |-
      GPT-4o 最终回答评审
      完整性与正确性
      评分范围 0 到 2
    type: terminal
    size: xl
    position:
      x: 880
      'y': 550
edges:
  - from: apis
    to: coarse
    type: primary
  - from: coarse
    to: select
    type: primary
  - from: select
    to: correct
    type: primary
  - from: correct
    to: disambiguate
    type: primary
  - from: disambiguate
    to: templates
    type: primary
  - from: templates
    to: generalize
    type: primary
  - from: generalize
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: format
    type: primary
  - from: format
    to: mapping
    type: primary
  - from: mapping
    to: matching
    type: primary
  - from: matching
    to: call_metrics
    type: primary
  - from: matching
    to: response
    type: primary
modules: []
