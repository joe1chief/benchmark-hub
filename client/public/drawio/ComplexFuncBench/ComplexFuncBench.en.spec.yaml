    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: call_metrics
    label: |-
      Function-Calling Metrics
      Task Success Rate
      Call Accuracy
    type: terminal
    size: xl
    position:
      x: 880
      'y': 330
  - id: response
    label: |-
      GPT-4o Final-Response Review
      Completeness and Correctness
      Scores from 0 to 2
    type: terminal
    size: xl
    position:
      x: 880
      'y': 550
