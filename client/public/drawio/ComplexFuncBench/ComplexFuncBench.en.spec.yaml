meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComplexFuncBench Build and Evaluation Process
  description: >-
    Paper-aligned three-stage construction of 1,000 complex travel function-calling samples and the full ComplexEval
    procedure for call-level and final-response scoring.
  legend: >-
    Solid arrows trace API curation, coarse generation, human refinement, tenfold generalization, and automatic
    evaluation.
nodes:
  - id: apis
    label: |-
      Booking.com via RapidAPI
      43 Real-Time APIs / 5 Domains
      Manually Correct Function Descriptions
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coarse
    label: |-
      Stage 1: GPT-4o Coarse Generation
      Sample Functions and Generate 1,000 Queries
      plus Preliminary Function-Call Paths
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: select
    label: |-
      Select 100 Relatively Complete Samples
      Cover Diverse Steps and Call Paths
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: correct
    label: |-
      Stage 2: Senior Annotation
      Rewrite Queries and Correct Parameters
      Build the Shortest Complete Call Path
    type: user
    size: xl
    position:
      x: 880
      'y': 100
  - id: disambiguate
    label: |-
      Remove Ambiguity
      Exclude Overlapping Functions and Delete
      API Results with Multiple Valid Values
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: templates
    label: |-
      Quality-Checked Templates
      100 Error-Free Complex Call Paths
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generalize
    label: |-
      Stage 3: Tenfold Generalization
      GPT-4o Changes Locations and Constraints
      Junior Annotators Fill Parameters
    type: user
    size: xl
    position:
      x: 1720
      'y': 100
  - id: dataset
    label: |-
      ComplexFuncBench
      1,000 Samples
      600 Single-Domain + 400 Cross-Domain
    type: database
    size: xl
    position:
      x: 2000
      'y': 100
  - id: model
    label: |-
      Model Iteratively Predicts Calls
      Receive Annotated API Responses
      Continue until Final Response
    type: process
    size: xl
    position:
      x: 2000
      'y': 440
  - id: format
    label: |-
      Format Check
      Valid Function / Required Parameters / Types
