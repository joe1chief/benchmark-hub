meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HireBench（AWM 环境）构建流程
  description: >-
    对齐论文与发布数据的 HireBench Coding Graduate Pipeline 身份和合成流程：它是 AgentWorldModel 生成的 1,000 个 环境之一，包含 10 个招聘任务、SQLite 状态、MCP
    工具与逐任务验证。
  legend: HireBench 是一个生成的 AWM 场景，不是独立 benchmark。实线表示已用 AgentWorldModel-1K 场景和任务文件核验的 AWM 通用构建与评测路径。
nodes:
  - id: evidence
    label: |-
      一手证据与固定快照
      arXiv:2602.10090v3 · 图 2 · 第 3.1-3.3 节 · 附录 A.1-A.3
      代码 85e322f · HF 数据 e9b8de6
      gen_scenario.jsonl:762 · gen_tasks.jsonl:520
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: identity
    label: |-
      确定制品身份
      HireBench Coding Graduate Pipeline
      ats_applicant_tracking_system_
      4 · 官方 ID 后缀 · 不是独立基准
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: seeds
    label: |-
      从 100 个领域名称种子开始
      面向有状态数据库应用
      要求可生成真实的合成 CRUD 数据
    type: database
    size: xl
    position:
      x: 340
      'y': 300
  - id: scenarios
    label: |-
      合成场景描述
      将名称扩展为应用概念
      包含 HireBench 招聘工作流
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: filter
    label: |-
      过滤并去重场景
      CRUD 分类器 + 向量余弦阈值 0.85
      限制过度集中的类别
    type: process
    size: xl
    position:
      x: 940
      'y': 300
  - id: tasks
    label: |-
      生成 10 个 HireBench 任务
      可由 API 完成且处于登录后上下文
      职位 · 候选人 · 面试 · Offer · 数据分析
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: database
    label: |-
      构建 SQLite 状态与样例数据
      申请人 · 职位需求 · 投递记录
      满足全部 10 个任务的前置条件
    type: database
    size: xl
    position:
      x: 1540
      'y': 80
  - id: tools
    label: |-
      生成 MCP 工具接口
      仅生成最小化类型化读写操作
      Python FastAPI + MCP 环境代码
    type: process
    size: xl
    position:
      x: 1540
      'y': 520
  - id: verifier
    label: |-
      生成逐任务验证器
      检查初始与最终数据库状态
      成败标准 + 结构化信号
    type: process
    size: xl
    position:
      x: 1840
      'y': 300
  - id: execute
    label: |-
      执行每个生成组件
      测试数据库 · 样例数据 · 工具 · 验证器
      在隔离环境捕获运行错误
    type: process
    size: xl
    position:
      x: 2140
      'y': 300
  - id: repair
    label: |-
      根据执行反馈修复
      将错误摘要与问题代码反馈给 LLM
      最多 5 次 · Schema/数据容许 10% · 启动容许 0%
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: release
    label: |-
      发布于 AgentWorldModel-1K
      1,000 个环境和 10,000 个任务之一
      公开 gen_*.jsonl：数据库 + MCP + 任务 + 验证器
    type: database
    size: xl
    position:
      x: 2740
      'y': 300
  - id: agent
    label: |-
      运行多轮工具使用 Agent
      可重置的隔离 HireBench 环境
      Agent 改变招聘工作流状态
    type: process
    size: xl
    position:
      x: 3040
      'y': 300
  - id: judge
    label: |-
      合并状态信号与轨迹
      代码增强 LLM-as-a-Judge
      处理不完美的环境证据
    type: process
    size: xl
    position:
      x: 3340
      'y': 300
  - id: result
    label: |-
      返回四类结果
      完成 · 部分完成
      Agent 错误 · 环境错误
    type: terminal
    size: xl
    position:
      x: 3640
      'y': 300
  - id: artifact_boundary
    label: |-
      公开发布 / 身份边界
      一个场景 + 10 个任务 · 不存在独立 HireBench
      HF gen_*.jsonl 在 e9b8de6 公开
      种子名称文件 / 生成运行记录未在公开数据树中
    type: document
    size: xl
    position:
      x: 3940
      'y': 300
edges:
  - from: evidence
    to: identity
    type: data
  - from: identity
    to: seeds
    type: primary
  - from: seeds
    to: scenarios
    type: primary
  - from: scenarios
    to: filter
    type: primary
  - from: filter
    to: tasks
    type: primary
  - from: tasks
    to: database
    type: primary
  - from: tasks
    to: tools
    type: secondary
  - from: database
    to: verifier
    type: primary
  - from: tools
    to: verifier
    type: secondary
  - from: verifier
    to: execute
    type: primary
  - from: execute
    to: repair
    type: primary
  - from: repair
    to: release
    type: data
  - from: release
    to: agent
    type: primary
  - from: agent
    to: judge
    type: primary
  - from: judge
    to: result
    type: primary
  - from: result
    to: artifact_boundary
    type: data
modules: []
