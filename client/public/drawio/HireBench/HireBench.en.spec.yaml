  - from: database
    to: verifier
    type: primary
  - from: tools
    to: verifier
    type: secondary
  - from: verifier
    to: execute
    type: primary
  - from: execute
    to: repair
    type: primary
  - from: repair
    to: release
    type: data
  - from: release
    to: agent
    type: primary
  - from: agent
    to: judge
    type: primary
  - from: judge
    to: result
    type: primary
modules: []
