meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HireBench (AWM Environment) Build Process
  description: >-
    Paper- and release-aligned identity and synthesis path for HireBench Coding Graduate Pipeline: one of 1,000
    generated AgentWorldModel environments, with ten recruiting tasks, SQLite state, MCP tools, and task-specific
    verification.
  legend: >-
    HireBench is a generated AWM scenario, not a standalone benchmark. Solid arrows show the common AWM construction and
    evaluation path verified against the released AgentWorldModel-1K scenario and task files.
nodes:
  - id: identity
    label: |-
      Establish the Artifact Identity
      HireBench = Coding Graduate Pipeline
      One AWM Scenario · Not a Standalone Benchmark
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: seeds
    label: |-
      Start from 100 Domain-name Seeds
      Target Stateful Database-backed Applications
      Require Realistic Synthetic CRUD Data
    type: database
    size: xl
    position:
      x: 340
      'y': 300
  - id: scenarios
    label: |-
      Synthesize Scenario Descriptions
      Expand Names into Application Concepts
      Include the HireBench Recruiting Workflow
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: filter
    label: |-
      Filter and Deduplicate Scenarios
      CRUD Suitability Classifier + Embeddings
      Cap Over-represented Categories
    type: process
    size: xl
    position:
      x: 940
      'y': 300
  - id: tasks
    label: |-
      Generate 10 HireBench Tasks
      Jobs · Assessments · Candidates · Interviews
      Offers · Pipeline Updates · Analytics
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: database
    label: |-
      Build SQLite State and Sample Data
      Applicants · Requisitions · Submissions
      Satisfy Preconditions for All Ten Tasks
    type: database
    size: xl
    position:
      x: 1540
      'y': 80
  - id: tools
    label: |-
      Generate the MCP Tool Interface
      Minimal Typed Read / Write Operations
      Python FastAPI + MCP Environment Code
    type: process
    size: xl
    position:
      x: 1540
      'y': 520
  - id: verifier
    label: |-
      Generate Task-specific Verification
      Inspect Initial and Final Database States
      Success / Failure Criteria + Structured Signals
    type: process
    size: xl
    position:
      x: 1840
      'y': 300
  - id: execute
    label: |-
      Execute Each Generated Component
      Test Database · Sample Data · Tools · Verifier
      Capture Runtime Failures in Isolation
    type: process
    size: xl
    position:
      x: 2140
      'y': 300
  - id: repair
    label: |-
      Self-correct Generation Failures
      Return Error + Problematic Code to the LLM
      Retry until Success or Five Iterations
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: release
    label: |-
      Release inside AgentWorldModel-1K
      One of 1,000 Environments and 10,000 Tasks
      Database + MCP Tools + Tasks + Verifiers
    type: database
    size: xl
    position:
      x: 2740
      'y': 300
  - id: agent
    label: |-
      Run a Multi-turn Tool-use Agent
      Resettable Isolated HireBench Environment
      Agent Changes Recruiting-workflow State
    type: process
    size: xl
    position:
      x: 3040
      'y': 300
  - id: judge
    label: |-
      Combine State Signals + Trajectory
      Code-augmented LLM-as-a-Judge
      Resolve Imperfect Environment Evidence
    type: process
    size: xl
    position:
      x: 3340
      'y': 300
  - id: result
    label: |-
      Return Four-class Outcome
      Completed · Partially Completed
      Agent Error · Environment Error
    type: terminal
    size: xl
    position:
      x: 3640
      'y': 300
