meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQAPro 构建流程
  description: 对齐论文的 ChartQAPro 构建与评测流程：收集并人工筛选多样的真实图表，九名标注者以人工种子结合三种 VLM 扩展问题， 再由第二名标注者独立复核并消解分歧，最终用增强宽松准确率评测 1,948 道题。
  legend: 实线箭头表示图表整理、问答构造、复核、发布和评测；虚线箭头传递复核证据。
nodes:
  - id: sources
    label: |-
      从99个在线来源收集图表
      网页抓取 + Google搜索
      Pew • Tableau • PPIC • Our World in Data
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: filter
    label: |-
      人工筛选视觉与主题多样性
      多序列、堆叠、分组、仪表盘、
      信息图、地图及多图表设计
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: charts
    label: |-
      整理1,341张真实图表
      保留URL、替代文本和元数据
      同时包含纯图表与图表-段落样本
    type: database
    size: xl
    position:
      x: 640
      'y': 220
  - id: seed
    label: |-
      九名标注者编写多样种子问答
      五人负责推理题，四人负责其他题型
      强调复杂视觉与数值推理
    type: user
    size: xl
    position:
      x: 940
      'y': 40
  - id: types
    label: |-
      覆盖五类问答
      推理 • 对话 • 选择 • 假设 • 事实核验
      并纳入不可回答问题
    type: document
    size: xl
    position:
      x: 940
      'y': 400
  - id: vlm
    label: |-
      人机协同扩展
      GPT-4o + Gemini + Claude降低单模型偏差
      每个种子生成五对新问答并交互扩展
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: refine
    label: |-
      人工精修
      删除直接检索或过于简单的问题
      修订不清晰、歧义或错误的问答
    type: process
    size: xl
    position:
      x: 1540
      'y': 220
  - id: review
    label: |-
      第二名标注者独立复核
      原标注者和复核者分别作答
      初始答案一致率为66.17%
    type: user
    size: xl
    position:
      x: 1840
      'y': 220
  - id: consensus
    label: |-
      协作消解全部分歧
      更正问题或答案并改写歧义
      主观估计允许小于1%的差异
    type: decision
    size: xl
    position:
      x: 2140
      'y': 220
  - id: release
    label: |-
      发布ChartQAPro
      1,341张图表 • 1,948道验证问题
      99个来源 • 真实主题与样式多样性
    type: database
    size: xl
    position:
      x: 2440
      'y': 220
  - id: inference
    label: |-
      评测21个视觉语言模型
      输入图表（有时附带说明段落）和问题
      生成开放词表答案
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: exact
    label: |-
      精确匹配
      选择题 + 事实核验题
      所有年份型答案
    type: process
    size: xl
    position:
      x: 3040
      'y': 40
  - id: numeric
    label: |-
      数值匹配
      相对误差不超过5%即正确
      年份不使用宽松容差
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: text
    label: |-
      文本匹配
      平均归一化编辑距离相似度
      容纳轻微表述差异
    type: process
    size: xl
    position:
      x: 3040
      'y': 400
  - id: report
    label: |-
      增强宽松准确率
      聚合逐题正确性
      按图表、答案和问题类型分析
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: sources
    to: filter
    type: primary
  - from: filter
    to: charts
    type: primary
  - from: charts
    to: seed
    type: primary
  - from: charts
    to: types
    type: data
  - from: seed
    to: vlm
    type: primary
  - from: types
    to: vlm
    type: primary
  - from: vlm
    to: refine
    type: primary
  - from: refine
    to: review
    type: primary
  - from: review
    to: consensus
    type: primary
  - from: consensus
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: exact
    type: primary
  - from: inference
    to: numeric
    type: primary
  - from: inference
    to: text
    type: primary
  - from: exact
    to: report
    type: primary
  - from: numeric
    to: report
    type: primary
  - from: text
    to: report
    type: primary
modules: []
