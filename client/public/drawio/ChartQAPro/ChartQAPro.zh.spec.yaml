meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQAPro 构建流程
  description: 对齐 ACL 最终版：明确区分附录 A.1 的 WebCharts 候选发现链与最终 99 来源发布集，再展示九人问答创建、跨类别复核及评分流程。
  legend: 实线表示主要构建与评测流程；虚线表示问答类型约束。
nodes:
  - id: sources
    label: |-
      157 个种子图表网站
      来自 Hoque 与 Agrawala（2019）
      WebCharts 发现范围
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: search
    label: |-
      查询 Google 图片
      “图表图像” • “图形” • “可视化数据”
      收集广泛网页图像候选
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: vit_filter
    label: |-
      二分类 ViT 图表筛选
      识别并分离图表图像
      人工移除残余非图表图像
    type: process
    size: xl
    position:
      x: 640
      'y': 40
  - id: pool
    label: |-
      WebCharts 候选池
      筛选后 41,000 张图表图像
      保留广泛样式与主题
    type: database
    size: xl
    position:
      x: 940
      'y': 40
  - id: web_select
    label: |-
      选择 WebCharts 语料
      从 41K 候选选出 800 张图表
      另行人工整理 200 张信息图
    type: process
    size: xl
    position:
      x: 1240
      'y': 40
  - id: other_sources
    label: |-
      其他人工整理来源语料
      Pew • Tableau • PPIC • OWID
      排除简单统计图表
    type: database
    size: xl
    position:
      x: 1240
      'y': 400
  - id: charts
    label: |-
      合并 1,341 张真实图表
      最终发布集覆盖 99 个在线来源
      保留 URL、替代文本与元数据
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: seed
    label: |-
      9 名标注者创建种子问答
      5 人负责推理；4 人负责其他类型
      要求复杂视觉与数值推理
    type: user
    size: xl
    position:
      x: 1840
      'y': 40
  - id: types
    label: |-
      五类问答
      推理 • 对话 • 选择题
      假设 • 事实核验
      另含不可回答问题
    type: document
    size: xl
    position:
      x: 1840
      'y': 400
  - id: vlm
    label: |-
      人机协同扩展
      GPT-4o + Gemini + Claude
      每个模型为每张图表生成 5 组问答
      标注者另做交互式提示扩展
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: refine
    label: |-
      人工精修
      移除直接检索或过于简单的问题
      修订不清晰、有歧义或错误的条目
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: review
    label: |-
      7 名跨类别复核标注者
      5 人复核事实题；2 人复核其他类型
      复核者与原创建者交叉核验
    type: user
    size: xl
    position:
      x: 2740
      'y': 220
  - id: consensus
    label: |-
      初始一致率：66.17%
      共同解决全部分歧
      修订错误或歧义
      主观估计允许 <1% 差异
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: release
    label: |-
      发布 ChartQAPro
      1,341 张图表 • 1,948 道核验问题
      ACL 最终版：99 个来源
    type: database
    size: xl
    position:
      x: 3340
      'y': 220
  - id: inference
    label: |-
      评测 21 个视觉语言模型
      直接提示 • 思维链（CoT）
      程序思维（PoT）
      图表 + 可选段落 -> 答案
    type: process
    size: xl
    position:
      x: 3640
      'y': 220
  - id: exact
    label: |-
      精确匹配
      选择题 + 事实核验
      所有年份答案
    type: process
    size: xl
    position:
      x: 3940
      'y': 40
  - id: numeric
    label: |-
      数值匹配
      允许 5% 相对误差
      年份不使用容差
    type: process
    size: xl
    position:
      x: 3940
      'y': 220
  - id: text
    label: |-
      文本匹配
      平均归一化 Levenshtein 相似度
      ANLS 经阈值后给予部分分
    type: process
    size: xl
    position:
      x: 3940
      'y': 400
  - id: report
    label: |-
      增强宽松准确率
      平均每题正确性
      按图表、答案和问题类型分析
    type: terminal
    size: xl
    position:
      x: 4240
      'y': 220
edges:
  - from: sources
    to: search
    type: primary
  - from: search
    to: vit_filter
    type: primary
  - from: vit_filter
    to: pool
    type: primary
  - from: pool
    to: web_select
    type: primary
  - from: web_select
    to: charts
    type: primary
  - from: other_sources
    to: charts
    type: primary
  - from: charts
    to: seed
    type: primary
  - from: charts
    to: types
    type: data
  - from: seed
    to: vlm
    type: primary
  - from: types
    to: vlm
    type: primary
  - from: vlm
    to: refine
    type: primary
  - from: refine
    to: review
    type: primary
  - from: review
    to: consensus
    type: primary
  - from: consensus
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: exact
    type: primary
  - from: inference
    to: numeric
    type: primary
  - from: inference
    to: text
    type: primary
  - from: exact
    to: report
    type: primary
  - from: numeric
    to: report
    type: primary
  - from: text
    to: report
    type: primary
modules: []
