meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQAPro Build Process
  description: >-
    Paper-aligned construction and evaluation flow for ChartQAPro: diverse real-world charts are collected and manually
    filtered, nine annotators combine human seeds with three VLMs, a second-annotator review resolves disagreements, and
    enhanced relaxed accuracy scores the final 1,948 questions.
  legend: Solid arrows show chart curation, QA creation, review, release, and evaluation; dashed arrows carry review evidence.
nodes:
  - id: sources
    label: |-
      Collect Charts from 99 Online Sources
      Web Crawl + Google Search
      Pew • Tableau • PPIC • Our World in Data
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: filter
    label: |-
      Manually Filter for Visual + Topic Diversity
      Multi-series, Stacked, Grouped, Dashboard,
      Infographic, Map, and Multi-chart Designs
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: charts
    label: |-
      Curate 1,341 Real-world Charts
      Preserve URL, Alt Text, and Metadata
      Include Chart-only and Chart-text Examples
    type: database
    size: xl
    position:
      x: 640
      'y': 220
  - id: seed
    label: |-
      Nine Annotators Write Diverse Seed QA Pairs
      Five Focus on Reasoning; Four on Other Types
      Require Complex Visual and Numerical Reasoning
    type: user
    size: xl
    position:
      x: 940
      'y': 40
  - id: types
    label: |-
      Cover Five QA Families
      Reasoning • Conversational • Multiple-choice
      Hypothetical • Fact-checking + Unanswerable Cases
    type: document
    size: xl
    position:
      x: 940
      'y': 400
  - id: vlm
    label: |-
      Human–VLM Expansion
      GPT-4o + Gemini + Claude Reduce Single-model Bias
      Generate Five New Pairs per Seed and Interactively Expand
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: refine
    label: |-
      Human Refinement
      Remove Direct-retrieval or Overly Simple Questions
      Revise Unclear, Ambiguous, or Incorrect QA Pairs
    type: process
    size: xl
    position:
      x: 1540
      'y': 220
  - id: review
    label: |-
      Independent Second-annotator Review
      Original and Reviewer Answer Each Question
      Initial Answer Agreement: 66.17%
    type: user
    size: xl
    position:
      x: 1840
      'y': 220
  - id: consensus
    label: |-
      Resolve Every Disagreement Collaboratively
      Correct Questions or Answers; Rewrite Ambiguity
      Accept <1% Difference for Subjective Estimates
    type: decision
    size: xl
    position:
      x: 2140
      'y': 220
  - id: release
    label: |-
      Release ChartQAPro
      1,341 Charts • 1,948 Verified Questions
      99 Sources • Real-world Topic and Style Diversity
    type: database
    size: xl
    position:
      x: 2440
      'y': 220
  - id: inference
    label: |-
      Evaluate 21 Vision-language Models
      Input Chart (+ Accompanying Paragraph When Present)
      Generate an Open-vocabulary Answer
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: exact
    label: |-
      Exact Match
      Multiple-choice + Fact-checking
      All Year-valued Answers
    type: process
    size: xl
    position:
      x: 3040
      'y': 40
  - id: numeric
    label: |-
      Numeric Match
      Correct within 5% Relative Error
      Years Excluded from Tolerance
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: text
    label: |-
      Text Match
      Average Normalized Levenshtein Similarity
      Handles Minor Surface-form Variation
    type: process
    size: xl
    position:
      x: 3040
      'y': 400
  - id: report
    label: |-
      Enhanced Relaxed Accuracy
      Aggregate per-question Correctness
      Analyze by Chart, Answer, and Question Type
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: sources
    to: filter
    type: primary
  - from: filter
    to: charts
    type: primary
  - from: charts
    to: seed
    type: primary
  - from: charts
    to: types
    type: data
  - from: seed
    to: vlm
    type: primary
  - from: types
    to: vlm
    type: primary
  - from: vlm
    to: refine
    type: primary
  - from: refine
    to: review
    type: primary
  - from: review
    to: consensus
    type: primary
  - from: consensus
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: exact
    type: primary
  - from: inference
    to: numeric
    type: primary
  - from: inference
    to: text
    type: primary
  - from: exact
    to: report
    type: primary
  - from: numeric
    to: report
    type: primary
  - from: text
    to: report
    type: primary
modules: []
