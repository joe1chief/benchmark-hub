meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQAPro Build Process
  description: >-
    Final-ACL construction and evaluation flow for ChartQAPro: Appendix A.1 WebCharts discovery is kept distinct from
    the final 99-source release, followed by nine-annotator human-VLM QA creation, cross-review, and scoring.
  legend: Solid arrows show the primary construction and evaluation flow; dashed arrows carry the QA taxonomy.
nodes:
  - id: sources
    label: |-
      157-site Seed of Chart-hosting Websites
      From Hoque and Agrawala (2019)
      WebCharts Discovery Scope
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: search
    label: |-
      Query Google Images
      “chart images” • “graphs” • “visual data”
      Gather Broad Web Image Candidates
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: vit_filter
    label: |-
      Binary ViT Chart Filter
      Isolate Likely Chart Images
      Manually Remove Remaining Non-chart Images
    type: process
    size: xl
    position:
      x: 640
      'y': 40
  - id: pool
    label: |-
      WebCharts Candidate Pool
      41,000 Chart Images after Filtering
      Retain Broad Styles and Topics
    type: database
    size: xl
    position:
      x: 940
      'y': 40
  - id: web_select
    label: |-
      Select the WebCharts Corpus
      800 Charts from the 41K Pool
      Separately Hand-curate 200 Infographics
    type: process
    size: xl
    position:
      x: 1240
      'y': 40
  - id: other_sources
    label: |-
      Other Curated Source Corpora
      Pew • Tableau • PPIC • Our World in Data
      Exclude Simple Statistical Charts
    type: database
    size: xl
    position:
      x: 1240
      'y': 400
  - id: charts
    label: |-
      Merge 1,341 Real-world Charts
      Final Release Spans 99 Online Sources
      Preserve URL, Alt Text, and Metadata
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: seed
    label: |-
      9 Annotators Create Seed QA Pairs
      5 on Reasoning; 4 on Other Types
      Require Complex Visual + Numerical Reasoning
    type: user
    size: xl
    position:
      x: 1840
      'y': 40
  - id: types
    label: |-
      Five QA Families
      Reasoning • Conversational • Multiple-choice
      Hypothetical • Fact-checking
      Also Include Unanswerable Cases
    type: document
    size: xl
    position:
      x: 1840
      'y': 400
  - id: vlm
    label: |-
      Human–VLM Expansion
      GPT-4o + Gemini + Claude
      Each Model Creates 5 Pairs per Chart
      Annotators Also Prompt Interactively
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: refine
    label: |-
      Human Refinement
      Remove Direct-retrieval or Simple Questions
      Revise Unclear, Ambiguous, or Incorrect Items
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: review
    label: |-
      7 Cross-category Review Annotators
      5 Review Factoid; 2 Review Other Types
      Reviewer + Original Creator Cross-check
    type: user
    size: xl
    position:
      x: 2740
      'y': 220
  - id: consensus
    label: |-
      Initial Agreement: 66.17%
      Resolve Every Disagreement Together
      Revise Errors or Ambiguity
      Allow <1% on Subjective Estimates
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: release
    label: |-
      Release ChartQAPro
      1,341 Charts • 1,948 Verified Questions
      Final ACL Count: 99 Sources
    type: database
    size: xl
    position:
      x: 3340
      'y': 220
  - id: inference
    label: |-
      Evaluate 21 Vision–Language Models
      Direct • Chain-of-Thought (CoT)
      Program-of-Thought (PoT)
      Chart + Optional Paragraph -> Answer
    type: process
    size: xl
    position:
      x: 3640
      'y': 220
  - id: exact
    label: |-
      Exact Match
      Multiple-choice + Fact-checking
      All Year-valued Answers
    type: process
    size: xl
    position:
      x: 3940
      'y': 40
  - id: numeric
    label: |-
      Numeric Match
      Correct within 5% Relative Error
      Years Excluded from Tolerance
    type: process
    size: xl
    position:
      x: 3940
      'y': 220
  - id: text
    label: |-
      Text Match
      Average Normalized Levenshtein Similarity
      ANLS Gives Partial Credit after Thresholding
    type: process
    size: xl
    position:
      x: 3940
      'y': 400
  - id: report
    label: |-
      Enhanced Relaxed Accuracy
      Average Per-question Correctness
      Analyze by Chart, Answer, and Question Type
    type: terminal
    size: xl
    position:
      x: 4240
      'y': 220
