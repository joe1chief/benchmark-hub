meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BenchCAD Build Process
  description: >-
    Paper-aligned industrial-family generation, execution verification, artifact packaging, four-task derivation, and
    capability-decomposed scoring from arXiv:2605.10865v2.
  legend: The top row builds the verified core; the lower fan-out derives and scores the four evaluation tasks.
nodes:
  - id: standards
    label: |-
      Curate Industrial Design Families
      52 of 106 Families Standard-Anchored
      47 ISO / DIN / EN / ASME / IEC Codes
    type: database
    size: xl
    position:
      x: 40
      'y': 120
  - id: family_modules
    label: |-
      Experts Implement 106 Family Modules
      Typed Schema • Sampler • Validator • Builder
      Cover 49 CadQuery Operations
    type: user
    size: xl
    position:
      x: 320
      'y': 120
  - id: sample
    label: |-
      Sample Family × Subfamily × Tier
      Easy • Medium • Hard Parameter Complexity
      Enforce Standard Tables and Physical Relations
    type: process
    size: xl
    position:
      x: 600
      'y': 120
  - id: sandbox
    label: |-
      Sandbox-Execute CadQuery
      Reject Parse / Import / Runtime / 30-Second Timeout
      Reject Zero or Inverted Geometry
    type: decision
    size: xl
    position:
      x: 880
      'y': 120
  - id: artifacts
    label: |-
      Package Verified Part Artifacts
      Code • STEP • Four Canonical Views
      Parameters • Op List • Expert Visual Sign-Off
    type: database
    size: xl
    position:
      x: 1160
      'y': 120
  - id: release
    label: |-
      BenchCAD Core Release
      17,900 Execution-Verified Programs
      106 Industrial Part Families
    type: database
    size: xl
    position:
      x: 1440
      'y': 120
  - id: vision2code
    label: |-
      Vision2Code
      Four Orthographic Views → Executable CadQuery
      Measure Geometry and Operation Fidelity
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: qa_bank
    label: |-
      Matched Vision QA and Code QA
      2,400 Numeric Question Pairs
      Two Conditioning Modes = 4,800 Records
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: edit_bank
    label: |-
      Code Edit
      Verified Original / Instruction / Target
      748 Curated Edit Pairs
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: controls
    label: |-
      Shared Evaluation Controls
      Same Prompts and 30-Second Sandbox
      Black-View • No-Code • Unchanged Blind Controls
    type: document
    size: xl
    position:
      x: 880
      'y': 1000
  - id: v2c_score
    label: |-
      Vision2Code Scores
      Execution • Voxel IoU • Chamfer • Hausdorff
      Feature F1 • Essential-Operation Recall
    type: process
    size: xl
    position:
      x: 1160
      'y': 720
  - id: qa_score
    label: |-
      Matched QA Scores
      ±5% Ratio Tolerance • Exact Integer Answers
      Vision-vs-Code Capability Gap
    type: process
    size: xl
    position:
      x: 1440
      'y': 720
  - id: edit_score
    label: |-
      Code Edit Scores
      Headroom-Normalized Improvement
      Execution • Target Match • Non-Target Preservation
    type: process
    size: xl
    position:
      x: 1720
      'y': 720
  - id: report
    label: |-
      Four-Task Capability Report
      Vision2Code • Vision QA • Code QA • Code Edit
      Family, Difficulty, Geometry, Parameter, and Edit Gaps
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 1000
