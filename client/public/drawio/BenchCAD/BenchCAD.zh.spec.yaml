meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BenchCAD 构建流程
  description: 严格对齐 arXiv:2605.10865，展示 BenchCAD 的生成、验证、任务派生与能力分解评测流程。
  legend: 实线表示已验证数据构建与评分主流程；虚线表示盲测对照和能力诊断比较。
nodes:
  - id: standards
    label: |-
      整理工业设计家族
      紧固件 • 齿轮 • 弹簧 • 管件 • 外壳
      47 项 ISO / DIN / EN / ASME / IEC 标准
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: family_modules
    label: |-
      领域专家实现 106 个家族
      类型 schema • 采样器 • 验证器 • builder
      标准方程与物理参数关系
    type: user
    size: xl
    position:
      x: 320
      'y': 220
  - id: sample
    label: |-
      按家族 × 子家族 × 难度采样
      简单 • 中等 • 困难参数复杂度
      覆盖 49 个 CadQuery 操作和可选特征
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: sandbox
    label: |-
      生成并沙箱执行 CadQuery
      隔离解析/导入 • 运行异常 • 30 秒超时
      拒绝零体积或反转几何
    type: decision
    size: xl
    position:
      x: 880
      'y': 220
  - id: artifacts
    label: |-
      打包已验证部件产物
      源码 • STEP • 四个标准视图
      参数 JSON • 操作列表 • 专家视觉验收
    type: database
    size: xl
    position:
      x: 1160
      'y': 220
  - id: release
    label: |-
      发布 BenchCAD 核心集
      17,900 个执行验证部件
      106 个家族 • 52 个标准锚定家族
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: vision2code
    label: |-
      构建 Vision2Code 任务
      输入四个正交渲染视图
      目标为可执行 CadQuery 程序
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: qa_bank
    label: |-
      构建配对 Vision QA 与 Code QA
      每家族 6–12 个专家模板 • 二次复核
      2,400 个数值题对 × 两种条件输入
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: edit_bank
    label: |-
      构建 Code Edit 任务
      验证原件与目标 • 复核指令
      两个强模型交叉检查 • 保留 748 对
    type: process
    size: xl
    position:
      x: 1720
      'y': 400
  - id: model_run
    label: |-
      评测前沿、开源与 CAD 专用模型
      统一提示与沙箱 • 保持配对比较
      加入黑图、无代码和保持原程序的盲测
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: v2c_score
    label: |-
      评分 Vision2Code
      执行率 • Voxel IoU • Chamfer / Hausdorff
      Feature-F1 • 关键操作召回 • 综合分
    type: process
    size: xl
    position:
      x: 2280
      'y': 40
  - id: qa_score
    label: |-
      评分配对 QA
      比率允许 ±5% • 整数精确匹配
      L1–L4 能力和视觉-代码差距
    type: process
    size: xl
    position:
      x: 2280
      'y': 220
  - id: edit_score
    label: |-
      评分最小代码编辑
      对剩余改进空间归一化的 IoU 增益
      执行 • 目标匹配 • 非目标区域保持
    type: process
    size: xl
    position:
      x: 2280
      'y': 400
  - id: report
    label: |-
      发布能力分解结果
      四类任务 • 家族与难度分解
      感知、参数、操作和编辑能力差距
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 220
edges:
  - from: standards
    to: family_modules
    type: primary
  - from: family_modules
    to: sample
    type: primary
  - from: sample
    to: sandbox
    type: primary
  - from: sandbox
    to: sample
    type: optional
  - from: sandbox
    to: artifacts
    type: primary
  - from: artifacts
    to: release
    type: primary
  - from: release
    to: vision2code
    type: primary
  - from: release
    to: qa_bank
    type: primary
  - from: release
    to: edit_bank
    type: primary
  - from: vision2code
    to: model_run
    type: primary
  - from: qa_bank
    to: model_run
    type: primary
  - from: edit_bank
    to: model_run
    type: primary
  - from: model_run
    to: v2c_score
    type: primary
  - from: model_run
    to: qa_score
    type: primary
  - from: model_run
    to: edit_score
    type: primary
  - from: v2c_score
    to: report
    type: primary
  - from: qa_score
    to: report
    type: primary
  - from: edit_score
    to: report
    type: primary
modules: []
