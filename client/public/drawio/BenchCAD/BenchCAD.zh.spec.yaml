meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BenchCAD 构建流程
  description: 基于 arXiv:2605.10865v2，展示工业零件族生成、执行验证、产物打包、四任务派生与能力分解评分。
  legend: 上行构建验证后的核心数据；下方扇出为四类评测任务及其评分。
nodes:
  - id: standards
    label: |-
      整理工业设计零件族
      106 个零件族中 52 个锚定标准
      覆盖 47 项 ISO / DIN / EN / ASME / IEC 标准
    type: database
    size: xl
    position:
      x: 40
      'y': 120
  - id: family_modules
    label: |-
      专家实现 106 个零件族模块
      类型化 Schema • 采样器 • 校验器 • 构建器
      覆盖 49 种 CadQuery 操作
    type: user
    size: xl
    position:
      x: 320
      'y': 120
  - id: sample
    label: |-
      按零件族 × 子族 × 难度采样
      简单 • 中等 • 困难参数复杂度
      强制标准表和物理参数关系
    type: process
    size: xl
    position:
      x: 600
      'y': 120
  - id: sandbox
    label: |-
      沙箱执行 CadQuery
      拒绝解析/导入/运行错误及 30 秒超时
      拒绝零体积或反转几何
    type: decision
    size: xl
    position:
      x: 880
      'y': 120
  - id: artifacts
    label: |-
      打包验证后的零件产物
      代码 • STEP • 四个标准视图
      参数 • 操作清单 • 专家视觉签核
    type: database
    size: xl
    position:
      x: 1160
      'y': 120
  - id: release
    label: |-
      发布 BenchCAD 核心集
      17,900 个执行验证程序
      106 个工业零件族
    type: database
    size: xl
    position:
      x: 1440
      'y': 120
  - id: vision2code
    label: |-
      Vision2Code
      四个正交视图 → 可执行 CadQuery
      评估几何和操作忠实度
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: qa_bank
    label: |-
      配对 Vision QA 与 Code QA
      2,400 个数值问题对
      两种输入模式 = 4,800 条记录
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: edit_bank
    label: |-
      Code Edit
      验证原程序、指令和目标程序
      748 个精选编辑对
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: controls
    label: |-
      共用评测控制
      相同提示与 30 秒沙箱
      黑视图 • 无代码 • 不修改盲控
    type: document
    size: xl
    position:
      x: 880
      'y': 1000
  - id: v2c_score
    label: |-
      Vision2Code 指标
      执行率 • Voxel IoU • Chamfer • Hausdorff
      Feature F1 • 关键操作召回率
    type: process
    size: xl
    position:
      x: 1160
      'y': 720
  - id: qa_score
    label: |-
      配对 QA 指标
      比率 ±5% 容差 • 整数精确匹配
      视觉与代码输入能力差
    type: process
    size: xl
    position:
      x: 1440
      'y': 720
  - id: edit_score
    label: |-
      Code Edit 指标
      余量归一化改进
      执行率 • 目标匹配 • 非目标保持
    type: process
    size: xl
    position:
      x: 1720
      'y': 720
  - id: report
    label: |-
      四任务能力报告
      Vision2Code • Vision QA • Code QA • Code Edit
      零件族、难度、几何、参数与编辑差距
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 1000
edges:
  - from: standards
    to: family_modules
    type: primary
  - from: family_modules
    to: sample
    type: primary
  - from: sample
    to: sandbox
    type: primary
  - from: sandbox
    to: sample
    type: optional
  - from: sandbox
    to: artifacts
    type: primary
  - from: artifacts
    to: release
    type: primary
  - from: release
    to: vision2code
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: release
    to: qa_bank
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: release
    to: edit_bank
    type: primary
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: vision2code
    to: v2c_score
    type: primary
  - from: qa_bank
    to: qa_score
    type: primary
  - from: edit_bank
    to: edit_score
    type: primary
  - from: controls
    to: report
    type: data
  - from: v2c_score
    to: report
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: qa_score
    to: report
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: edit_score
    to: report
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.75
      entryY: 0
modules: []
