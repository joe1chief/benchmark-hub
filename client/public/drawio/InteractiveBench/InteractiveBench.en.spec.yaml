meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InteractiveBench Build Process
  description: >-
    Paper-aligned five-testbed framework: three Interactive Proofs use hidden truth and sparse verifier feedback under
    20-round budgets, while two Interactive Games evaluate long-horizon strategic utility.
  legend: >-
    Solid parallel lanes are distinct paper testbeds, not sequential stages. Proof scores depend on a fixed judge, so
    judge-sensitivity ablations accompany the main results.
nodes:
  - id: framework
    label: |-
      Unified Horizon-T Interaction
      Player π ↔ Environment / Judge
      Terminate on Final Answer or Budget Exhaustion
    type: database
    size: xl
    position:
      x: 20
      'y': 400
  - id: proofs
    label: |-
      Interactive Proofs
      Hidden Ground Truth + Omniscient Verifier
      Maximize Correctness Under Query Cost Budget
    type: database
    size: xl
    position:
      x: 300
      'y': 220
  - id: games
    label: |-
      Interactive Games
      Other Agents + Task Rewards
      Maximize Long-horizon Expected Utility
    type: database
    size: xl
    position:
      x: 300
      'y': 760
  - id: logic_data
    label: |-
      Logic · 46 Situation Puzzles
      Expert Curators from Puzzle Associations
      Filter: Interaction Necessity + Ambiguity Resolution
    type: user
    size: xl
    position:
      x: 580
      'y': 0
  - id: logic_eval
    label: |-
      20-round Player–Judge Loop
      Ask Yes/No Query or Submit Explanation
      Feedback: Yes / No / Both / Irrelevant
      Correct Submission Terminates
    type: process
    size: xl
    position:
      x: 900
      'y': 0
  - id: logic_metric
    label: |-
      Logic Results
      Accuracy Within Budget
      Average Turns on Solved Puzzles
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 0
  - id: ui_data
    label: |-
      UI2Html · 50 UI2Code-Real Screenshots
      Front-end Expert Curation and Re-annotation
      Clarity · Diversity · Complexity · Feasibility
    type: user
    size: xl
    position:
      x: 580
      'y': 210
  - id: ui_eval
    label: |-
      Incomplete Screenshot Summary → Player
      20 Rounds: Full HTML + Binary Clarification
      Headless Render vs Hidden Target → Final HTML
    type: process
    size: xl
    position:
      x: 900
      'y': 210
  - id: ui_metric
    label: |-
      UI2Html Results
      Integer Layout + Component + Style
      Text + Polish Scores · Sum Overall
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 210
  - id: math_data
    label: |-
      Math · 52 HLE Mathematics Problems
      Experts Retain Hard, Reasoning-intensive Items
      Reference Derivation + Final Answer
    type: user
    size: xl
    position:
      x: 580
      'y': 420
  - id: math_eval
    label: |-
      20-round Claim / Final-solution Loop
      Sparse Four-way Claim Feedback
      Temperature 0 · Budget-match Player Tokens to Pass@k
    type: process
    size: xl
    position:
      x: 900
      'y': 420
  - id: math_metric
    label: |-
      Math Results
      Accuracy + Average Turns on Solved
      Compare Budget-matched Pass@k
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 420
  - id: poker_env
    label: |-
      Texas Hold’em Environment
      5,000 Hands · 10 Tables · 6 Fixed Agents
      500 Hands/Table · Identical Rules and Stacks
    type: process
    size: xl
    position:
      x: 580
      'y': 680
  - id: poker_eval
    label: |-
      Structured Partial Observation
      Output Legal Fold / Check / Call / Raise / All-in
      One Retry for Invalid Output → Auto-fold
    type: process
    size: xl
    position:
      x: 900
      'y': 680
  - id: poker_metric
    label: |-
      Poker Results Across Tables
      Mean ± SD Winnings per Hand
      VPIP · Fold Rate · Response Latency
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 680
  - id: trust_env
    label: |-
      Random-horizon Trust Game
      Iterated Prisoner’s Dilemma Payoffs
      Round-robin Model Pairs + Continuation Probability
    type: process
    size: xl
    position:
      x: 580
      'y': 900
  - id: trust_eval
    label: |-
      Observe Full Action History
      Simultaneously Choose Cooperate or Defect
      Repeat Matches Under Same Payoff Matrix
    type: process
    size: xl
    position:
      x: 900
      'y': 900
  - id: trust_metric
    label: |-
      Trust Results
      Average Realized Payoff per Round
      Cooperation and Betrayal Statistics
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 900
  - id: report
    label: |-
      Five-testbed Interactive Profile
      Logic · UI Coding · Math
      Poker · Trust
      Report Budget Efficiency and Judge Sensitivity
    type: terminal
    size: xl
    position:
      x: 1680
      'y': 420
