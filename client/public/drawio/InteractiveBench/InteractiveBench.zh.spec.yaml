  - from: logic_data
    to: logic_eval
    type: primary
  - from: logic_eval
    to: logic_metric
    type: primary
  - from: logic_metric
    to: report
    type: primary
    waypoints:
      - x: 1450
        'y': 50
      - x: 1450
        'y': 440
      - x: 1660
        'y': 440
