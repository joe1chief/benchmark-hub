meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InteractiveBench 构建流程
  description: 与论文一致的五测试床框架：三个交互式证明在 20 轮预算内使用隐藏真值和稀疏验证反馈，两个交互式博弈评估长期策略效用。
  legend: 并行实线泳道是不同论文测试床而非顺序阶段；证明分数依赖固定评审器，因此主结果配套评审器敏感性消融。
nodes:
  - id: framework
    label: |-
      统一 Horizon-T 交互框架
      Player π ↔ 环境 / 评审器
      提交最终答案或预算耗尽时终止
    type: database
    size: xl
    position:
      x: 20
      'y': 400
  - id: proofs
    label: |-
      交互式证明
      隐藏真值 + 全知验证器
      在查询成本预算内最大化正确率
    type: database
    size: xl
    position:
      x: 300
      'y': 220
  - id: games
    label: |-
      交互式博弈
      与其他智能体交互并获得任务奖励
      最大化长期期望效用
    type: database
    size: xl
    position:
      x: 300
      'y': 760
  - id: logic_data
    label: |-
      逻辑 · 46 个情境谜题
      推理与解谜协会专家整理
      筛选：交互必要性 + 歧义可消解性
    type: user
    size: xl
    position:
      x: 580
      'y': 0
  - id: logic_eval
    label: |-
      20 轮 Player–Judge 循环
      询问是非问题或提交完整解释
      反馈：是 / 否 / 两者皆有 / 无关
      正确提交立即结束
    type: process
    size: xl
    position:
      x: 900
      'y': 0
  - id: logic_metric
    label: |-
      逻辑结果
      预算内准确率
      仅已解题平均轮数
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 0
  - id: ui_data
    label: |-
      UI2Html · 50 张 UI2Code-Real 截图
      前端专家筛选并重新标注
      布局清晰 · 组件多样 · 视觉复杂 · 可实现
    type: user
    size: xl
    position:
      x: 580
      'y': 210
  - id: ui_eval
    label: |-
      不完整截图摘要 → Player
      20 轮：完整 HTML + 二元澄清问题
      无头浏览器渲染对比隐藏目标 → 最终 HTML
    type: process
    size: xl
    position:
      x: 900
      'y': 210
  - id: ui_metric
    label: |-
      UI2Html 结果
      布局 + 组件 + 风格
      文本 + 完成度五项整数分求和
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 210
  - id: math_data
    label: |-
      数学 · 52 道 HLE 数学题
      专家保留困难且推理密集的问题
      参考推导 + 最终答案
    type: user
    size: xl
    position:
      x: 580
      'y': 420
  - id: math_eval
    label: |-
      20 轮中间命题 / 最终解答循环
      命题获得四类稀疏反馈
      温度 0 · 按 Player token 与 Pass@k 对齐预算
    type: process
    size: xl
    position:
      x: 900
      'y': 420
  - id: math_metric
    label: |-
      数学结果
      准确率 + 已解题平均轮数
      对比预算匹配 Pass@k
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 420
  - id: poker_env
    label: |-
      德州扑克环境
      5,000 手牌 · 10 张独立牌桌 · 六个固定智能体
      每桌 500 手 · 规则与筹码一致
    type: process
    size: xl
    position:
      x: 580
      'y': 680
  - id: poker_eval
    label: |-
      结构化不完全观察
      输出合法弃牌 / 过牌 / 跟注 / 加注 / 全押
      非法输出可重试一次 → 自动弃牌
    type: process
    size: xl
    position:
      x: 900
      'y': 680
  - id: poker_metric
    label: |-
      跨牌桌扑克结果
      每手收益均值 ± 标准差
      VPIP · 弃牌率 · 响应延迟
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 680
  - id: trust_env
    label: |-
      随机时长信任博弈
      重复囚徒困境收益矩阵
      模型两两循环赛 + 继续概率
    type: process
    size: xl
    position:
      x: 580
      'y': 900
  - id: trust_eval
    label: |-
      观察完整历史动作
      双方同时选择合作或背叛
      在同一收益矩阵下重复比赛
    type: process
    size: xl
    position:
      x: 900
      'y': 900
  - id: trust_metric
    label: |-
      信任博弈结果
      每轮平均实际收益
      合作与背叛行为统计
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 900
  - id: report
    label: |-
      五测试床交互能力画像
      逻辑 · UI 编码 · 数学
      扑克 · 信任博弈
      报告预算效率与评审器敏感性
    type: terminal
    size: xl
    position:
      x: 1680
      'y': 420
edges:
  - from: framework
    to: proofs
    type: primary
  - from: framework
    to: games
    type: primary
  - from: proofs
