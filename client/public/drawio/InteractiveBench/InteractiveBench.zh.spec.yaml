meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InteractiveBench 构建流程
  description: 与论文一致的五测试床框架：三个交互式证明使用隐藏真值和各自验证循环，两个交互式博弈按各自时长与终止规则评估长期策略效用。
  legend: 并行实线泳道是不同论文测试床而非顺序阶段；每个测试床分别报告指标，论文没有定义五域统一总分。
nodes:
  - id: evidence
    label: |-
      主要证据与固定快照
      arXiv:2603.04737v4
      首投 2026-03 · Git caaf091
      论文定义五个独立测试床
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: framework
    label: |-
      统一 Horizon-T 交互框架
      Player π ↔ 环境 / 评审器 / 智能体
      各测试床独立定义轮数与终止条件
    type: database
    size: xl
    position:
      x: 20
      'y': 400
  - id: proofs
    label: |-
      交互式证明
      隐藏真值 + 全知验证器
      在查询预算内最大化任务得分
    type: database
    size: xl
    position:
      x: 300
      'y': 220
  - id: games
    label: |-
      交互式博弈
      与其他智能体交互并获得任务奖励
      最大化长期期望效用
    type: database
    size: xl
    position:
      x: 300
      'y': 760
  - id: logic_data
    label: |-
      逻辑 · 46 个情境谜题
      推理与解谜协会专家整理
      筛选：交互必要性 + 歧义可消解性
    type: user
    size: xl
    position:
      x: 580
      'y': 0
  - id: logic_eval
    label: |-
      20 轮 Player–Judge 循环
      询问是非问题或提交完整解释
      反馈：是 / 否 / 两者皆有 / 无关
      错误最终答案消耗一次动作
      正确提交立即结束
    type: process
    size: xl
    position:
      x: 900
      'y': 0
  - id: logic_metric
    label: |-
      逻辑结果
      预算内准确率
      仅已解题平均轮数
      Grok-4.1-fast 评审 · 温度 0
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 0
  - id: ui_data
    label: |-
      UI2Html · 50 张 UI2Code-Real 截图
      前端专家筛选并重新标注
      布局清晰 · 组件多样 · 视觉复杂 · 可实现
    type: user
    size: xl
    position:
      x: 580
      'y': 210
  - id: ui_eval
    label: |-
      固定 qwen-vl-max 摘要器与评审器
      不完整摘要提供给 Player
      20 轮：完整 HTML + 二元问题
      无头渲染对比隐藏目标
      随后独立提交一次无问题的最终 HTML
    type: process
    size: xl
    position:
      x: 900
      'y': 210
  - id: ui_metric
    label: |-
      UI2Html 结果
      布局 + 组件 + 风格
      文本 + 完成度 · 仅在本域求和
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 210
  - id: math_data
    label: |-
      数学 · 52 道 HLE 数学题
      专家保留困难且推理密集的问题
      参考推导 + 最终答案
    type: user
    size: xl
    position:
      x: 580
      'y': 420
  - id: math_eval
    label: |-
      20 轮中间命题 / 最终解答循环
      四类稀疏反馈
      Grok-4.1-fast 评审 · 温度 0
      Pass@k 仅匹配 Player token
      不计评审器 token
    type: process
    size: xl
    position:
      x: 900
      'y': 420
  - id: math_metric
    label: |-
      数学结果
      准确率 + 已解题平均轮数
      对比预算匹配 Pass@k
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 420
  - id: poker_env
    label: |-
      德州扑克环境
      5,000 手牌 · 10 桌 × 500 手
      六个固定智能体 · 初始筹码 10,000
      盲注 50 / 100 · 规则一致
    type: process
    size: xl
    position:
      x: 580
      'y': 680
  - id: poker_eval
    label: |-
      结构化不完全观察
      输出合法弃牌 / 过牌 / 跟注 / 加注 / 全押
      非法输出可重试一次 → 自动弃牌
    type: process
    size: xl
    position:
      x: 900
      'y': 680
  - id: poker_metric
    label: |-
      跨牌桌扑克结果
      每手收益均值 ± 标准差
      VPIP · 弃牌率 · 响应延迟
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 680
  - id: trust_env
    label: |-
      随机时长信任博弈
      重复囚徒困境收益矩阵
      两两循环赛 + 继续概率 δ
      独立比赛次数 R 未披露
    type: process
    size: xl
    position:
      x: 580
      'y': 900
  - id: trust_eval
    label: |-
      收益：CC 2,2 · CD -1,3
      DC 3,-1 · DD 0,0
      观察历史后双方同时选择 C 或 D
    type: process
    size: xl
    position:
      x: 900
      'y': 900
  - id: trust_metric
    label: |-
      信任博弈结果
      每轮平均实际收益
      合作率
      对方上一轮合作后的背叛率
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 900
  - id: report
    label: |-
      五个测试床分别报告结果
      逻辑 · UI2Html · 数学
      扑克 · 信任博弈
      各自指标与评审器敏感性
      无五域统一总分
    type: terminal
    size: xl
    position:
      x: 1680
      'y': 420
  - id: artifact_boundary
    label: |-
      部分开放的论文与制品边界
      论文 v4 定义五个测试床
      Git caaf091 仅发布四域代码
      UI2Html 代码与资产未发布
      旧版排行榜仅覆盖四域
    type: document
    size: xl
    position:
      x: 1960
      'y': 420
  - id: implementation_drift
    label: |-
      caaf091 实现漂移
      逻辑 / 数学强制第 21 次提交
      扑克日志仅含 4,590 手牌
      信任默认值不等于论文配置
      协议以论文 v4 为准
    type: document
    size: xl
    position:
      x: 2240
      'y': 420
