    type: primary
  - from: ui_data
    to: ui_eval
    type: primary
  - from: ui_eval
    to: ui_metric
    type: primary
  - from: ui_metric
    to: report
    type: primary
    waypoints:
      - x: 1490
        'y': 260
      - x: 1490
        'y': 455
      - x: 1660
        'y': 455
  - from: proofs
    to: math_data
    type: primary
  - from: math_data
    to: math_eval
    type: primary
  - from: math_eval
    to: math_metric
    type: primary
  - from: math_metric
    to: report
    type: primary
    waypoints:
      - x: 1660
        'y': 470
  - from: games
    to: poker_env
    type: primary
  - from: poker_env
    to: poker_eval
    type: primary
  - from: poker_eval
    to: poker_metric
    type: primary
  - from: poker_metric
    to: report
    type: primary
    waypoints:
      - x: 1570
        'y': 730
      - x: 1570
        'y': 485
      - x: 1660
        'y': 485
  - from: games
    to: trust_env
    type: primary
  - from: trust_env
    to: trust_eval
    type: primary
  - from: trust_eval
    to: trust_metric
    type: primary
  - from: trust_metric
    to: report
    type: primary
    waypoints:
      - x: 1610
        'y': 950
      - x: 1610
        'y': 500
      - x: 1660
        'y': 500
modules: []
