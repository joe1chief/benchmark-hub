meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CG-Bench Build Process
  description: >-
    Paper-aligned long-video and QAC construction with an explicit four-condition AND gate: manual rationality, GPT-4
    text-only answerability, MLLM visual difficulty, and clue-distribution checks must all pass; any failure returns the
    item for revision before release and clue-grounded evaluation.
  legend: Solid arrows show construction and evaluation; dotted arrows show the reject-and-revise loop.
nodes:
  - id: collect
    label: |-
      Manually Collect Internet Videos
      Longer Than 10 Minutes
      Preserve Audio + Subtitles
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: taxonomy_video
    label: |-
      Tag and Balance Video Content
      14 Root • 171 Secondary • 638 Tertiary
      Cover Diverse 10–80 Minute Videos
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: review_video
    label: |-
      Seven Rounds of Manual Video Review
      Check Relevance, Quality, and Diversity
      Retain 1,219 Long Videos
    type: user
    size: xl
    position:
      x: 540
      'y': 420
  - id: question_taxonomy
    label: |-
      Define Question Taxonomy
      Perception • Reasoning • Hallucination
      Include Fine-grained Subcategories
    type: document
    size: xl
    position:
      x: 790
      'y': 420
  - id: qac
    label: |-
      Annotate 6–15 QAC per Video
      Watch Entire Video • Use Native Language
      Write QA, Then One or More Clue Intervals
    type: user
    size: xl
    position:
      x: 1040
      'y': 420
  - id: options
    label: |-
      Create Multiple-choice Options
      Add 4–7 Negative Options
      Preserve Complete Events in Clue Intervals
    type: process
    size: xl
    position:
      x: 1290
      'y': 420
  - id: manual_qc
    label: |-
      Manual Rationality Check
      Inspect Question, Options, and Answer
      Reject Illogical or Weak Items
    type: process
    size: xl
    position:
      x: 1540
      'y': 420
  - id: text_qc
    label: |-
      GPT-4 Text-only Check
      Reject Questions Answerable Without Video
      Enforce Video Dependence
    type: process
    size: xl
    position:
      x: 1790
      'y': 420
  - id: visual_qc
    label: |-
      MLLM Visual-difficulty Check
      Reject Sparse-frame-answerable Items
      Reject Items Easy for Smaller Models
    type: process
    size: xl
    position:
      x: 2040
      'y': 420
  - id: distribution_qc
    label: |-
      Clue-distribution Check
      Monitor Clue Duration + Temporal Position
      Preserve Dataset-level Diversity
    type: process
    size: xl
    position:
      x: 2290
      'y': 420
  - id: all_gate
    label: |-
      All Four Checks Pass?
      Manual AND GPT-4 AND MLLM AND Distribution
      Any Failure Requires Revision
    type: decision
    size: xl
    position:
      x: 2540
      'y': 420
  - id: revise
    label: |-
      Return to Annotators
      Revise QA, Options, or Clue Intervals
      Re-enter the Complete Quality Gate
    type: process
    size: xl
    position:
      x: 2040
      'y': 800
  - id: release
    label: |-
      Release CG-Bench
      1,219 Videos • 12,129 QAC
      14,362 Clue Intervals
    type: database
    size: xl
    position:
      x: 2790
      'y': 420
  - id: mcq
    label: |-
      Full-video / Clue-clip MCQ
      Compare Long-video and Merged Clue Input
      Report long-acc. + clue-acc.
    type: process
    size: xl
    position:
      x: 3040
      'y': 20
  - id: white_box
    label: |-
      White-box Clue Grounding
      Predict One or More Time Intervals
      mIoU • rec.@IoU • acc.@IoU
    type: process
    size: xl
    position:
      x: 3040
      'y': 280
  - id: black_box
    label: |-
      Black-box Credibility
      Compare Full-video and Clue-only Accuracy
      CRR = min(long-acc., clue-acc.) / clue-acc.
    type: process
    size: xl
    position:
      x: 3040
      'y': 560
  - id: open_ended
    label: |-
      Clue-aided Open QA
      GPT-4o Judges Text, Then Requests Visual Clues
      Sample Frames Only from Annotated Intervals
    type: process
    size: xl
    position:
      x: 3040
      'y': 820
  - id: report
    label: |-
      Report Accuracy, Grounding, and Credibility
      Break Down Question Categories
      Diagnose Long-context Dilution
    type: terminal
    size: xl
    position:
      x: 3290
      'y': 420
edges:
  - from: collect
    to: taxonomy_video
    type: primary
  - from: taxonomy_video
    to: review_video
    type: primary
  - from: review_video
    to: question_taxonomy
    type: primary
  - from: question_taxonomy
    to: qac
    type: primary
  - from: qac
    to: options
    type: primary
  - from: options
    to: manual_qc
    type: primary
  - from: manual_qc
    to: text_qc
    type: primary
  - from: text_qc
    to: visual_qc
    type: primary
  - from: visual_qc
    to: distribution_qc
    type: primary
  - from: distribution_qc
    to: all_gate
    type: primary
  - from: all_gate
    to: release
    type: primary
  - from: all_gate
    to: revise
    type: optional
  - from: revise
    to: qac
    type: optional
  - from: release
    to: mcq
    type: primary
  - from: release
    to: white_box
    type: primary
  - from: release
    to: black_box
    type: primary
  - from: release
    to: open_ended
    type: primary
  - from: mcq
    to: report
    type: primary
  - from: white_box
    to: report
    type: primary
  - from: black_box
    to: report
    type: primary
  - from: open_ended
    to: report
    type: primary
modules: []
