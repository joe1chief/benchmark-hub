  title: CG-Bench Build Process
  description: >-
    Paper-aligned construction of CG-Bench: long videos are manually collected from defined domains, annotated with
    question-answer-clue triplets, iteratively reviewed, and evaluated with MCQ, white-box clue grounding, black-box
    clue recovery, and clue-aided open-ended QA.
  legend: Solid arrows show collection, annotation, quality review, release, and evaluation.
