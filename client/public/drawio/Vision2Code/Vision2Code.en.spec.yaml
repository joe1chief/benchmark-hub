meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BenchCAD VISION2CODE — CAD Generation and Evaluation
  description: >-
    The benchmark represented by the site entry is BenchCAD VISION2CODE. Experts define 106 industrial part families and
    a typed generation stack (schema, sampler, validator, builder) that emits easy/medium/hard parameters and CadQuery
    programs. Programs that fail compilation, exceed 30 seconds, have volume at or below 10⁻⁶ mm³, or contain an
    inverted transform with negative determinant are quarantined; experts visually sign off the rest, producing 17,900
    items. Evaluation reconstructs CadQuery from four canonical orthographic views and reports voxel IoU, Chamfer,
    Hausdorff, Feature-F1, essential-operation recall, and execution rate. The paper does not expose the full composite
    formula, so none is invented.
  legend: >-
    Source: Pinned to arXiv:2605.10865 (BenchCAD), Sections 3.1-3.2 (pp.4-5) and Section 4.3 (p.6), specifically the
    VISION2CODE subtask. Do not conflate it with the independent paper arXiv:2605.11307. The paper names the composite
    metric components but does not publish a complete explicit VISION2CODE total-score formula.. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
