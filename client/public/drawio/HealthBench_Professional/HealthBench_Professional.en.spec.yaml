meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthBench Professional Build Process
  description: >-
    Paper-aligned construction and evaluation of 525 real clinician-chat tasks selected from 15,079 candidates through
    three physician review stages, difficulty stratification, physician baselines, rubric grading, and length
    adjustment.
  legend: >-
    Solid arrows show the disclosed data and scoring path. HealthBench Professional complements HealthBench with a
    narrower focus on common clinician-facing chat work; its intentionally difficult sample is not an average-use
    estimate.
nodes:
  - id: cohort
    label: |-
      Recruit and Vet 190 Physicians
      Practice across 50 Countries and 26 Specialties
      Automated Checks + Manual Rubric Review
    type: user
    size: xl
    position:
      x: 40
      'y': 360
  - id: good_faith
    label: |-
      Collect Good-faith Usage
      Routine Clinical · Academic · Admin · Research
      Real Testing in ChatGPT for Clinicians
    type: database
    size: xl
    position:
      x: 340
      'y': 140
  - id: red_team
    label: |-
      Collect Physician Red Teaming
      Adversarial Probing and Edge Cases
      About One-third of the Final Benchmark
    type: database
    size: xl
    position:
      x: 340
      'y': 580
  - id: authorship
    label: |-
      Stage 1 · Physician Authorship
      Create Single- or Multi-turn Conversation + Rubric
      Rate Final Model Reply on Likert 1-7
    type: process
    size: xl
    position:
      x: 640
      'y': 360
  - id: review
    label: |-
      Stage 2 · Physician Review
      Check Realism · Difficulty · Rubric Quality
      Revise or Exclude Unsuitable Examples
    type: process
    size: xl
    position:
      x: 940
      'y': 360
  - id: hard_verify
    label: |-
      Independently Verify Difficult Cases
      Two Physicians Confirm Meaningful Model Error
      Both Confirm the Scenario Is Realistic
    type: decision
    size: xl
    position:
      x: 1240
      'y': 360
  - id: adjudication
    label: |-
      Stage 3 · Final Adjudication
      Resolve Ambiguity and Sharpen Rubric Wording
      Remove Subjective or Preference-based Criteria
    type: process
    size: xl
    position:
      x: 1540
      'y': 360
  - id: tag
    label: |-
      Tag Every Candidate
      Difficulty · Good Faith / Red Team · Use Case
      Specialty · Language · Single / Multi-turn
    type: document
    size: xl
    position:
      x: 1840
      'y': 360
  - id: sample
    label: |-
      Stratify 15,079 Candidates
      Select for Quality and Representativeness
      Enrich Difficult Cases about 3.5 Times
    type: decision
    size: xl
    position:
      x: 2140
      'y': 360
  - id: benchmark
    label: |-
      Release 525 Tasks
      Consult · Writing / Documentation · Research
      Conversation + Signed Physician Rubric Items
    type: database
    size: xl
    position:
      x: 2440
      'y': 360
  - id: physician_baseline
    label: |-
      Collect Physician Baselines for All Tasks
      Specialist-matched · No Time Limit · Web Access
      No AI Assistance or Self-authored Examples
    type: user
    size: xl
    position:
      x: 2740
      'y': 100
  - id: model_response
    label: |-
      Generate the Next Model Response
      Use the Full Clinician Conversation Context
      Evaluate Models and Product Harnesses
    type: process
    size: xl
    position:
      x: 2740
      'y': 620
  - id: grader
    label: |-
      Grade Each Rubric Criterion Independently
      Default GPT-5.4 Low-reasoning Grader
      Met = Full Signed Points · Unmet = Zero
    type: process
    size: xl
    position:
      x: 3040
      'y': 360
  - id: raw_score
    label: |-
      Compute Raw Example Score
      Sum Met Positive and Negative Points
      Divide by Maximum Possible Positive Score
    type: process
    size: xl
    position:
      x: 3340
      'y': 360
  - id: length
    label: |-
      Apply Empirical Length Adjustment
      Estimate Score-length Slope across Verbosity Runs
      Penalize Longer Final Answers Symmetrically
    type: process
    size: xl
    position:
      x: 3640
      'y': 360
  - id: report
    label: |-
      Report HealthBench Professional Score
      Mean Length-adjusted Score · Clip to 0-1 · ×100
      Include Use-case · Specialty · Source Slices
    type: terminal
    size: xl
    position:
      x: 3940
      'y': 360
edges:
  - from: cohort
    to: good_faith
    type: primary
  - from: cohort
    to: red_team
    type: secondary
  - from: good_faith
    to: authorship
    type: primary
  - from: red_team
    to: authorship
    type: secondary
  - from: authorship
    to: review
    type: primary
  - from: review
    to: hard_verify
    type: primary
  - from: hard_verify
    to: adjudication
    type: primary
  - from: adjudication
    to: tag
    type: primary
  - from: tag
    to: sample
    type: primary
  - from: sample
    to: benchmark
    type: primary
  - from: benchmark
    to: physician_baseline
    type: secondary
  - from: benchmark
    to: model_response
    type: primary
  - from: physician_baseline
    to: grader
    type: secondary
  - from: model_response
    to: grader
    type: primary
  - from: grader
    to: raw_score
    type: primary
  - from: raw_score
    to: length
    type: primary
  - from: length
    to: report
    type: primary
modules: []
