meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthBench Professional 构建流程
  description: 对齐论文的 HealthBench Professional 构建与评测流程：从 15,079 个真实临床医生聊天候选中，经三阶段医生复核、 难度分层、医生基线、rubric 评分和长度校正，形成 525 个任务。
  legend: 实线表示论文披露的数据与评分路径。HealthBench Professional 聚焦常见临床医生聊天任务，是对 HealthBench 的补充； 其刻意加难的样本不能解释为平均真实使用表现。
nodes:
  - id: cohort
    label: |-
      招募并筛选 190 名医生
      执业覆盖 50 个国家与 26 个专科
      自动质检 + 人工 Rubric 复核
    type: user
    size: xl
    position:
      x: 40
      'y': 360
  - id: good_faith
    label: |-
      收集善意日常使用
      临床 · 学术 · 行政 · 研究工作
      在 ChatGPT for Clinicians 中真实测试
    type: database
    size: xl
    position:
      x: 340
      'y': 140
  - id: red_team
    label: |-
      收集医生红队测试
      对抗探测与边缘案例
      约占最终基准三分之一
    type: database
    size: xl
    position:
      x: 340
      'y': 580
  - id: authorship
    label: |-
      阶段 1 · 医生创作
      编写单双轮对话与初始 Rubric
      对末轮模型回答作 Likert 1-7 评分
    type: process
    size: xl
    position:
      x: 640
      'y': 360
  - id: review
    label: |-
      阶段 2 · 医生复核
      检查真实性 · 难度 · Rubric 质量
      修订或剔除不合格样本
    type: process
    size: xl
    position:
      x: 940
      'y': 360
  - id: hard_verify
    label: |-
      独立核验困难样本
      两名医生确认模型存在实质错误
      两人同时确认情境真实相关
    type: decision
    size: xl
    position:
      x: 1240
      'y': 360
  - id: adjudication
    label: |-
      阶段 3 · 最终裁定
      消除歧义并收紧 Rubric 表述
      移除主观或偏好型标准
    type: process
    size: xl
    position:
      x: 1540
      'y': 360
  - id: tag
    label: |-
      为每个候选打标签
      难度 · 善意 / 红队 · 使用场景
      专科 · 语言 · 单轮 / 多轮
    type: document
    size: xl
    position:
      x: 1840
      'y': 360
  - id: sample
    label: |-
      对 15,079 个候选分层抽样
      兼顾质量与代表性
      困难样本占比提升约 3.5 倍
    type: decision
    size: xl
    position:
      x: 2140
      'y': 360
  - id: benchmark
    label: |-
      发布 525 个任务
      会诊 · 写作 / 文档 · 医学研究
      对话 + 带正负分的医生 Rubric
    type: database
    size: xl
    position:
      x: 2440
      'y': 360
  - id: physician_baseline
    label: |-
      为全部任务收集医生基线
      专科匹配 · 不限时间 · 可访问网络
      不用 AI 且不回答本人创作样本
    type: user
    size: xl
    position:
      x: 2740
      'y': 100
  - id: model_response
    label: |-
      生成下一条模型回答
      使用完整临床医生对话上下文
      同时评测模型与产品 Harness
    type: process
    size: xl
    position:
      x: 2740
      'y': 620
  - id: grader
    label: |-
      独立判定每条 Rubric 标准
      默认 GPT-5.4 低推理裁判
      命中得完整带符号分 · 未命中得零
    type: process
    size: xl
    position:
      x: 3040
      'y': 360
  - id: raw_score
    label: |-
      计算原始样本分
      汇总命中的正分与负分
      除以该样本最大可能正分
    type: process
    size: xl
    position:
      x: 3340
      'y': 360
  - id: length
    label: |-
      应用经验长度校正
      从多模型多详细度运行估计分数长度斜率
      对过长末轮回答作对称惩罚
    type: process
    size: xl
    position:
      x: 3640
      'y': 360
  - id: report
    label: |-
      报告 HealthBench Professional 分数
      长度校正均值 · 截断至 0-1 · 乘 100
      同时报场景 · 专科 · 来源切片
    type: terminal
    size: xl
    position:
      x: 3940
      'y': 360
edges:
  - from: cohort
    to: good_faith
    type: primary
  - from: cohort
    to: red_team
    type: secondary
  - from: good_faith
    to: authorship
    type: primary
  - from: red_team
    to: authorship
    type: secondary
  - from: authorship
    to: review
    type: primary
  - from: review
    to: hard_verify
    type: primary
  - from: hard_verify
    to: adjudication
    type: primary
  - from: adjudication
    to: tag
    type: primary
  - from: tag
    to: sample
    type: primary
  - from: sample
    to: benchmark
    type: primary
  - from: benchmark
    to: physician_baseline
    type: secondary
  - from: benchmark
    to: model_response
    type: primary
  - from: physician_baseline
    to: grader
    type: secondary
  - from: model_response
    to: grader
    type: primary
  - from: grader
    to: raw_score
    type: primary
  - from: raw_score
    to: length
    type: primary
  - from: length
    to: report
    type: primary
modules: []
