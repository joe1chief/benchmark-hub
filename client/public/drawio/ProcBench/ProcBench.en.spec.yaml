    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Define 23 Task Types
      Manipulate strings lists or integers
      Cover distinct state transitions
      Avoid specialized knowledge
    type: database
    size: xl
    position:
      x: 500
      'y': 40
