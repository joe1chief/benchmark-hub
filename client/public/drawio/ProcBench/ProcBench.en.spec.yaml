  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProcBench Build and Evaluation Process
  description: >-
    Paper-aligned generation of 23 explicit-procedure task families with controlled step counts, complete intermediate
    states, typed output conversion, and step-aware exact-match metrics.
  legend: >-
    ProcBench contains 240 examples for each of 23 tasks: ten examples at every problem length from two through 25, for
    5,520 examples in total.
