meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProcBench 构建与评测流程
  description: 按论文 v1 重建由生成器定义的程序任务、受控问题长度、同步状态真值、GPT-4o 类型化抽取和逐步精确指标，并明确复核与发布边界。
  legend: 实线表示论文与代码披露的构建或评测流程；虚线表示固定证据、发布许可、未披露人工复核或解析提示边界，并非额外流程步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2410.03117v1
      PDF cf5f2ecc5ba3
      Git 06b98344a730
      HF 182e5139c73
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: design_goal
    label: |-
      隔离指令可遵循性
      固定到目标的求解路径
      最小化隐式知识
      测量直接多步推理
    type: document
    size: xl
    position:
      x: 280
      'y': 40
  - id: task_criteria
    label: |-
      应用任务设计条件
      明确给出完整程序
      每个人类操作步骤都简单
      只需基础英文知识
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: task_families
    label: |-
      定义 23 个不同任务族
      字符串、列表和整数状态
      覆盖多种状态转移规则
      不需专业领域知识
    type: database
    size: xl
    position:
      x: 800
      'y': 40
  - id: fixed_templates
    label: |-
      每类任务编写固定模板
      给出完整求解程序
      规定具体输入字段
      要求输出全部结果状态
    type: document
    size: xl
    position:
      x: 1060
      'y': 40
  - id: step_schedule
    label: |-
      安排受控问题长度
      问题长度为 2 至 25 步
      每个长度生成 10 例
      每个任务族共 240 例
    type: process
    size: xl
    position:
      x: 1320
      'y': 40
  - id: task_generator
    label: |-
      运行任务专用生成器
      抽取字符串、列表或数字
      执行模板规定的操作
      保存问题配置
    type: process
    size: xl
    position:
      x: 1580
      'y': 40
  - id: length_gate
    label: |-
      强制满足目标步数
      比较生成状态长度
      丢弃步数不符的样本
      重采样直至填满配额
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: ground_truth
    label: |-
      同步生成标准答案
      保存初始状态
      保存全部中间状态
      保存类型化最终状态
    type: database
    size: xl
    position:
      x: 2100
      'y': 40
  - id: benchmark_release
    label: |-
      冻结论文口径 ProcBench
      23 个任务族 × 每类 240 例
      总计 5,520 个样本
      固定模板与具体问题配对
    type: database
    size: xl
    position:
      x: 2360
      'y': 40
  - id: length_splits
    label: |-
      派生长度分组
      短：2 至 6 步
      中：7 至 16 步
      长：17 至 25 步
    type: process
    size: xl
    position:
      x: 2620
      'y': 40
  - id: model_prompt
    label: |-
      提示输出完整序列
      提供模板与具体问题
      要求中间及最终状态
      不使用任务专用辅助提示
    type: process
    size: xl
    position:
      x: 2360
      'y': 560
  - id: raw_response
    label: |-
      收集模型自由文本
      保存原始答案
      保存模型用量元数据
      将文本交给统一抽取器
    type: document
    size: xl
    position:
      x: 2100
      'y': 560
  - id: extraction_schema
    label: |-
      推断每类任务的类型模式
      读取标准答案字段类型
      intermediate：类型化列表
      final：整数、字符串或列表
    type: process
    size: xl
    position:
      x: 1840
      'y': 560
  - id: gpt4o_parser
    label: |-
      使用 GPT-4o 规范化
      模型 gpt-4o-2024-08-06
      Pydantic 结构化输出解析
      中间列表不得重复最终状态
    type: process
    size: xl
    position:
      x: 1580
      'y': 560
  - id: parse_outcome
    label: |-
      形成解析后的预测
      保留 intermediate 与 final
      保持任务专用类型
      解析失败时插入空预测
    type: document
    size: xl
    position:
      x: 1320
      'y': 560
  - id: exact_comparison
    label: |-
      精确比较状态元素
      转换整数或字符串预测
      列表长度与顺序必须相同
      首次不匹配即停止前缀
    type: process
    size: xl
    position:
      x: 800
      'y': 560
  - id: prefix_match_length
    label: |-
      计算前缀匹配长度
      从第一个预测状态开始
      统计连续精确匹配数
      首次错误即停止
    type: process
    size: xl
    position:
      x: 540
      'y': 360
  - id: prefix_accuracy
    label: |-
      计算前缀准确率
      用较长序列长度归一化 PML
      惩罚多余预测状态
      惩罚缺失预测状态
    type: process
    size: xl
    position:
      x: 280
      'y': 360
  - id: sequential_match
    label: |-
      计算完整序列匹配
      仅当 PA 等于一时取一
      其余情况取零
      要求整个序列相等
    type: process
    size: xl
    position:
      x: 20
      'y': 360
  - id: final_match
    label: |-
      计算最终状态匹配
      比较目标和预测的末状态
      忽略此前状态的不匹配
      返回二值结果
    type: process
    size: xl
    position:
      x: 280
      'y': 760
  - id: aggregate_report
    label: |-
      报告四项逐步指标
      PML · PA · SM · FM
      按模型与任务求平均
      同时按长度分组汇总
    type: terminal
    size: xl
    position:
      x: 20
      'y': 760
  - id: release_boundary
    label: |-
      固定发布与许可边界
      Git 树 7aaeabca63f9 · MIT
      HF 树 95499b2392f3 · CC BY 4.0
      23 个任务文件 · 5,520 行
      代码与数据许可证不同
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 2620
      'y': 320
  - id: review_boundary
    label: |-
      复核来源边界
      生成器直接产生精确真值
      长度不符时触发重采样
      论文未披露人工复核阶段
      不推断存在人工标注
    type: document
    size: xl
    position:
      x: 2100
      'y': 320
  - id: parser_boundary
    label: |-
      解析提示边界
      固定 GPT-4o 抽取模型
      动态类型化 Pydantic 模式
      失败时返回空预测
      报告指标包含解析影响
    type: document
    size: xl
    position:
      x: 1580
      'y': 920
edges:
  - from: source_evidence
    to: design_goal
    type: secondary
    style:
      dashed: true
  - from: design_goal
    to: task_criteria
    type: primary
  - from: task_criteria
    to: task_families
    type: primary
  - from: task_families
    to: fixed_templates
    type: primary
  - from: fixed_templates
    to: step_schedule
    type: primary
  - from: step_schedule
    to: task_generator
    type: primary
  - from: task_generator
    to: length_gate
    type: primary
  - from: length_gate
    to: task_generator
    type: primary
    waypoints:
      - x: 1960
        'y': 240
      - x: 1700
        'y': 240
  - from: length_gate
    to: ground_truth
    type: primary
  - from: ground_truth
    to: benchmark_release
    type: primary
  - from: benchmark_release
    to: length_splits
    type: primary
  - from: benchmark_release
    to: model_prompt
    type: primary
  - from: model_prompt
    to: raw_response
    type: primary
  - from: raw_response
    to: extraction_schema
    type: primary
  - from: extraction_schema
    to: gpt4o_parser
    type: primary
  - from: gpt4o_parser
    to: parse_outcome
    type: primary
  - from: parse_outcome
    to: exact_comparison
    type: primary
  - from: exact_comparison
    to: prefix_match_length
    type: primary
  - from: prefix_match_length
    to: prefix_accuracy
    type: primary
  - from: prefix_accuracy
    to: sequential_match
    type: primary
  - from: exact_comparison
    to: final_match
    type: primary
  - from: sequential_match
    to: aggregate_report
    type: primary
  - from: final_match
    to: aggregate_report
    type: primary
  - from: length_splits
    to: release_boundary
    type: secondary
    style:
      dashed: true
  - from: ground_truth
    to: review_boundary
    type: secondary
    style:
      dashed: true
  - from: gpt4o_parser
    to: parser_boundary
    type: secondary
    style:
      dashed: true
modules: []
