meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Oolong 构建与评测流程
  description: 对齐论文构建合成与真实长上下文任务，隔离检索和原子分类之外的信息聚合能力。
  legend: Oolong-synth 目标范围为 1K 至 4M token，Oolong-real 为 55K 至 1.3M token；论文主要报告到 128K，并非仅含 128K。
nodes:
  - id: goal
    label: |-
      隔离长上下文聚合能力
      超越简单检索
      组合大量原子判断
      回答分布统计问题
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: synth_sources
    label: |-
      选择十个分类数据集
      类别数为 2 至 10
      保留自然文本样例
      形成 Oolong-synth 来源
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: atomic
    label: |-
      过滤原子任务难度
      测试 GPT-4.1 nano
      测试 Llama 4 Maverick
      移除两者均分错的样例
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: metadata
    label: |-
      添加合成元信息
      用户 ID 服从 80/20 偏斜
      日期均匀覆盖 40 个月
      支持交叉引用与时间问题
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: contexts
    label: |-
      构造长上下文
      目标范围 1K 至 4M token
      填充到各目标约 95%
      每个上下文复用 25 个问题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: questions
    label: |-
      生成三类问题
      计数聚合
      用户信息交叉引用
      时间线与时序推理
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: real_sources
    label: |-
      构建 Oolong-real
      使用 CRD3 临界角色转写
      覆盖第一与第二季战役
      保留真实对话语境
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: gold
    label: |-
      连接人工统计真值
      使用 CritRoleStats
      记录掷骰与法术
      按剧集和角色索引
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: real_context
    label: |-
      拼接剧集上下文
      组合 1 至 24 集
      范围 55K 至 1.3M token
      生成计数与集合问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布 Oolong 两个分集
      受控合成聚合任务
      真实转写聚合任务
      上下文与问题分开存储
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: prompt
    label: |-
      组装评测提示
      开头放置指令与标签空间
      末尾附近再次给出说明
      最后附加问题
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: parse
    label: |-
      解析模型回答
      优先提取方框最终答案
      否则取最后一个目标类型
      真实集后备使用 GPT-5-nano
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      按答案类型评分
      符号与字符串精确匹配
      数值分数为 0.75 的绝对误差次幂
      列表答案计算集合重叠
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告聚合性能
      与随机基线比较
      按长度和问题类型拆分
      主要模型实验覆盖至 128K
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: goal
    to: synth_sources
    type: primary
  - from: synth_sources
    to: atomic
    type: primary
  - from: atomic
    to: metadata
    type: primary
  - from: metadata
    to: contexts
    type: primary
  - from: contexts
    to: questions
    type: primary
  - from: questions
    to: real_sources
    type: primary
  - from: real_sources
    to: gold
    type: primary
  - from: gold
    to: real_context
    type: primary
  - from: real_context
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
