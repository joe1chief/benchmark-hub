meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Oolong Build and Evaluation Process
  description: >-
    Paper-aligned construction of synthetic and real long-context tasks that isolate aggregation beyond retrieval and
    atomic classification.
  legend: >-
    Oolong-synth targets 1K to 4M tokens; Oolong-real spans 55K to 1.3M tokens. The paper mainly reports models up to
    128K, not a 128K-only benchmark.
nodes:
  - id: goal
    label: |-
      Isolate Long-context Aggregation
      Go Beyond Retrieval
      Combine Many Atomic Decisions
      Answer Distributional Questions
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: synth_sources
    label: |-
      Select Ten Classification Datasets
      Use Two to Ten Labels
      Retain Natural Text Instances
      Create Oolong-synth Sources
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: atomic
    label: |-
      Filter Atomic Difficulty
      Test GPT-4.1 nano
      Test Llama 4 Maverick
      Remove Items Both Misclassify
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: metadata
    label: |-
      Add Synthetic Metadata
      User IDs Follow 80/20 Skew
      Dates Uniform over Forty Months
      Enable Cross-reference and Time Queries
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: contexts
    label: |-
      Construct Long Contexts
      Target 1K to 4M Tokens
      Fill about 95% of Each Target
      Reuse Each Context for 25 Questions
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: questions
    label: |-
      Generate Three Question Families
      Counting Aggregations
      User Information Cross-reference
      Timeline and Temporal Reasoning
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: real_sources
    label: |-
      Build Oolong-real
      Use CRD3 Critical Role Transcripts
      Campaigns One and Two
      Retain Real Conversational Context
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: gold
    label: |-
      Link Human Gold Statistics
      Use CritRoleStats
      Dice Rolls and Spell Records
      Index Episode and Character
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: real_context
    label: |-
      Concatenate Episode Contexts
      Combine One to Twenty-four Episodes
      Span 55K to 1.3M Tokens
      Ask Count and Set Questions
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      Release Both Oolong Splits
      Synthetic Controlled Tasks
      Real Transcript Aggregation
      Context and Question Stored Separately
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: prompt
    label: |-
      Assemble Evaluation Prompts
      Put Instructions and Labels First
      Repeat Guidance near the End
      Append the Question Last
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: parse
    label: |-
      Parse Model Answers
      Prefer Boxed Final Answer
      Fall Back to Last Expected Type
      Use GPT-5-nano for Real Fallback
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      Apply Type-specific Scoring
      Exact Match for Symbols and Strings
      Numeric Credit: 0.75 to Absolute Error
      Set Overlap for List Answers
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Aggregation Performance
      Compare Random Baselines
      Split by Length and Question Type
      Main Model Study through 128K
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: goal
    to: synth_sources
    type: primary
  - from: synth_sources
    to: atomic
    type: primary
  - from: atomic
    to: metadata
    type: primary
  - from: metadata
    to: contexts
    type: primary
  - from: contexts
    to: questions
    type: primary
  - from: questions
    to: real_sources
    type: primary
  - from: real_sources
    to: gold
    type: primary
  - from: gold
    to: real_context
    type: primary
  - from: real_context
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
