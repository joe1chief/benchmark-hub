meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-PolyBench 构建流程
  description: 对齐论文的多语言挖掘、环境验证、任务标注与结构化检索评测流程。
  legend: 上排从左向右完成构建，下排从右向左完成数据标注与评测；下方分支为 500 题子集。
nodes:
  - id: repos
    label: |-
      四种语言的 GitHub 仓库
      Java / JavaScript / TypeScript / Python
      排除 SWE-bench 仓库
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: repo_filter
    label: |-
      仓库元数据过滤
      PR 超过 100，近 12 个月有更新
      宽松许可证，主要使用英文
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: pr_filter
    label: |-
      挖掘 377,300 条 PR
      PR 关闭关联 Issue
      PR 包含测试代码
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: environment
    label: |-
      配置历史执行环境
      使用各语言包管理工具
      仓库 / 基准提交级 Docker
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: execute
    label: |-
      拆分标准补丁与测试补丁
      运行标准补丁前后测试
      记录 F2P 与 P2P 测试
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: validate
    label: |-
      可测试性过滤
      至少需要一个 F2P 测试
      排除测试新建文件的任务
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-PolyBench
      21 个仓库的 2,110 个实例
      覆盖四种编程语言
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: classify
    label: |-
      LLM 辅助标注
      缺陷修复 / 功能 / 重构
      Issue 信息充分度
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: subset
    label: |-
      SWE-PolyBench500
      每种语言 125 个实例
      按任务与仓库分层抽样
    type: document
    size: xl
    position:
      x: 1160
      'y': 720
  - id: patch
    label: |-
      智能体接收 Issue 与代码库
      生成并应用代码补丁
      在 Docker 环境中执行
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tests
    label: |-
      执行式解决判定
      全部 F2P 与 P2P 测试通过
      指标：通过率
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      检索评测
      文件级精确率 / 召回率
      最深变更 CST 节点精确率 / 召回率
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: repos
    to: repo_filter
    type: primary
  - from: repo_filter
    to: pr_filter
    type: primary
  - from: pr_filter
    to: environment
    type: primary
  - from: environment
    to: execute
    type: primary
  - from: execute
    to: validate
    type: primary
  - from: validate
    to: dataset
    type: primary
  - from: dataset
    to: classify
    type: primary
  - from: classify
    to: subset
    type: data
  - from: classify
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: metrics
    type: primary
modules: []
