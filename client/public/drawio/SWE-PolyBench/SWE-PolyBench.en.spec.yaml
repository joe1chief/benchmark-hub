meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-PolyBench Build Process
  description: Paper-aligned multilingual mining, environment validation, task annotation, and structural retrieval evaluation.
  legend: >-
    Read the construction row left-to-right, then the dataset and evaluation row right-to-left; the lower branch denotes
    the 500-item subset.
nodes:
  - id: repos
    label: |-
      GitHub Repositories in 4 Languages
      Java / JavaScript / TypeScript / Python
      Exclude SWE-bench Repositories
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: repo_filter
    label: |-
      Repository Metadata Filter
      100+ PRs; Updated Within 12 Months
      Permissive License; English Project
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: pr_filter
    label: |-
      Mine 377,300 Pull Requests
      Pull Request Closes an Issue
      Pull Request Includes Test Code
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: environment
    label: |-
      Configure Historical Environment
      Language-Specific Package Tools
      Repository / Base-Commit Docker
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: execute
    label: |-
      Split Gold and Test Patches
      Run Tests Before / After Gold Patch
      Record F2P and P2P Tests
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: validate
    label: |-
      Testability Filter
      Require at Least One F2P Test
      Reject Tested Newly Created Files
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-PolyBench
      2,110 Instances from 21 Repositories
      Four Programming Languages
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: classify
    label: |-
      LLM-Assisted Annotation
      Bug Fix / Feature / Refactor
      Issue Informativeness
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: subset
    label: |-
      SWE-PolyBench500
      125 Instances per Language
      Stratified Across Tasks and Repositories
    type: document
    size: xl
    position:
      x: 1160
      'y': 720
  - id: patch
    label: |-
      Agent Receives Issue + Repository
      Generate and Apply Code Patch
      Run in Docker Environment
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tests
    label: |-
      Execution-Based Resolution
      All F2P and P2P Tests Must Pass
      Metric: Pass Rate
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Retrieval Evaluation
      File-Level Precision / Recall
      Deepest Changed CST-Node Precision / Recall
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: repos
    to: repo_filter
    type: primary
  - from: repo_filter
    to: pr_filter
    type: primary
  - from: pr_filter
    to: environment
    type: primary
  - from: environment
    to: execute
    type: primary
  - from: execute
    to: validate
    type: primary
  - from: validate
    to: dataset
    type: primary
  - from: dataset
    to: classify
    type: primary
  - from: classify
    to: subset
    type: data
  - from: classify
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: metrics
    type: primary
modules: []
