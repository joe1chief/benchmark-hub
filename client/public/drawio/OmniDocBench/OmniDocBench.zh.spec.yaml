meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniDocBench 构建、发布与评测流程
  description: 区分论文 v2 的 981 页基准构建与评测合同，以及后续 v1.7 Git/Hugging Face 发布在规模、评测代码和开放性上的漂移。
  legend: >-
    固定证据为 arXiv:2412.07626v2、Git v1_0 337cc2696589、Git main 2b161d010d2e 与 Hugging Face
    aa1ee96d106d。实线表示构建或评测主流程；虚线表示证据与发布漂移。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv v2 · 2160acf35586
      Git v1.0 · 337cc2696589
      Git main · 2b161d010d2e
      HF aa1ee96d106d
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: paper_scope
    label: |-
      界定论文 v2 基准
      981 页 · 九类文档来源
      19 类版面 · 15 个属性标签
      端到端 · 逐任务 · 逐属性评测
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: sources
    label: |-
      收集超过 20 万份 PDF
      Common Crawl · Google · 百度
      内部数据来源
      覆盖多样真实文档
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: cluster
    label: |-
      聚类页面视觉外观
      ResNet-50 页面特征
      Faiss · 十个聚类中心
      显式覆盖版式多样性
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: candidates
    label: |-
      采样标注候选页面
      从聚类中心附近抽取
      保留视觉多样性
      得到 6,000 个候选页面
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: attributes
    label: |-
      标注页面级属性
      文档类型 · 版式类型
      语言类型
      支撑均衡筛选
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: balance
    label: |-
      平衡最终筛选结果
      保留多样属性组合
      筛选为 981 页
      覆盖九类文档来源
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: preannotate
    label: |-
      生成智能预标注
      微调 LayoutLMv3 · PaddleOCR
      UniMERNet · GPT-4o
      版面 · 文本 · 公式 · 表格
    type: process
    size: xl
    position:
      x: 1980
      'y': 40
  - id: layout
    label: |-
      标注版面元素
      15 类块级 · 四类行内元素
      记录区域与属性
      保留页面几何信息
    type: document
    size: xl
    position:
      x: 2260
      'y': 40
  - id: relations
    label: |-
      记录文档元素关系
      标注阅读顺序
      连接标题与所属对象
      记录跨页关系
    type: process
    size: xl
    position:
      x: 2540
      'y': 40
  - id: content
    label: |-
      转写元素内容
      Unicode 文本 · LaTeX 公式
      HTML 与 LaTeX 表格
      逐字符核验
    type: document
    size: xl
    position:
      x: 2820
      'y': 40
  - id: human
    label: |-
      执行人工精修
      修正边界框与阅读顺序
      使用 Tables Generator 与 latexlive
      修复关系与内容
    type: process
    size: xl
    position:
      x: 3100
      'y': 40
  - id: qc
    label: |-
      执行专家质量检查
      CDM 标出无法渲染的元素
      三名研究人员复核修正
      验证最终标注
    type: process
    size: xl
    position:
      x: 3380
      'y': 40
  - id: paper_release
    label: |-
      定稿论文 v2 数据集
      981 页 · 九类来源
      超过 10 万条标注
      19 类版面 · 15 个属性标签
    type: database
    size: xl
    position:
      x: 3660
      'y': 40
  - id: published_snapshot
    label: |-
      识别当前 v1.7 快照
      1,651 页 · 十类数据来源
      28 类块级 + 四类行内标签
      5 个页面 + 3 个文本 + 6 个表格属性
    type: database
    size: xl
    position:
      x: 3660
      'y': 440
  - id: normalize
    label: |-
      归一化模型输出
      输入整页 Markdown 预测
      移除图像与起始标签
      规范重复字符
    type: process
    size: xl
    position:
      x: 3380
      'y': 440
  - id: extract
    label: |-
      提取可比较组件
      LaTeX 与 HTML 表格
      展示公式 · Markdown 表格
      代码块 · 文本 · 阅读顺序
    type: process
    size: xl
    position:
      x: 3100
      'y': 440
  - id: match
    label: |-
      匹配预测与真值
      论文：相邻匹配后再模糊匹配
      当前 main：MGAM
      仅调整预测侧粒度
    type: process
    size: xl
    position:
      x: 2820
      'y': 440
  - id: ignore
    label: |-
      应用忽略规则
      页眉页脚参与匹配但不计分
      页码与页脚注不计分
      公平处理位置不确定的标题
    type: process
    size: xl
    position:
      x: 2540
      'y': 440
  - id: task_gate
    label: |-
      选择评测模块
      端到端或单模块评测
    type: decision
    size: xl
    position:
      x: 2260
      'y': 440
  - id: recognition_metrics
    label: |-
      评测文本与表格
      文本 NED · BLEU · METEOR
      表格 TEDS · NED
      按页面与属性拆分
    type: process
    size: xl
    position:
      x: 1920
      'y': 280
  - id: formula_order_metrics
    label: |-
      评测公式与阅读顺序
      公式 CDM · NED · BLEU
      阅读顺序 NED
      汇总端到端组件结果
    type: process
    size: xl
    position:
      x: 1920
      'y': 480
  - id: detection_metrics
    label: |-
      评测检测模块
      版面与公式检测
      COCODet 的 mAP 与 mAR
      属于当前代码扩展
    type: process
    size: xl
    position:
      x: 1920
      'y': 680
  - id: report
    label: |-
      报告细粒度结果
      总分取文本准确率
      表格 TEDS 与公式 CDM 的均值
      按数据集 · 页面 · 属性汇总
    type: terminal
    size: xl
    position:
      x: 1560
      'y': 480
  - id: drift_boundary
    label: |-
      版本与规模边界
      论文 v2：981 页 · 九类来源
      当前 HF：1,355 个 v1.5 + 296 个困难样本
      共 1,651 页 · 十类来源 · v1.7 代码榜单
    type: document
    size: xl
    position:
      x: 1040
      'y': 300
  - id: license_boundary
    label: |-
      开放性边界
      代码仓库采用 Apache 2.0
      数据集声明仅供研究
      不允许商业使用
    type: document
    size: xl
    position:
      x: 1040
      'y': 840
