meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniDocBench Build and Evaluation Process
  description: >-
    Paper-aligned selection, semi-automatic annotation, expert verification, and multi-level evaluation of diverse PDF
    document parsing.
  legend: >-
    The final benchmark has 981 pages from nine document types and more than 100,000 annotations; 6,000 pages are
    annotation candidates, not the release size.
nodes:
  - id: sources
    label: |-
      Collect More Than 200,000 PDFs
      Common Crawl · Google · Baidu
      Internal Data Sources
      Cover Diverse Document Types
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: cluster
    label: |-
      Cluster Visual Appearance
      ResNet-50 Page Features
      Faiss with Ten Centers
      Expose Layout Diversity
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: sample
    label: |-
      Sample 6,000 Candidates
      Draw Near Cluster Centers
      Retain Visually Diverse Pages
      Prepare Attribute Screening
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: balance
    label: |-
      Annotate and Balance Pages
      Document Type · Layout · Language
      Select 981 Pages
      Cover Nine Document Types
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: preannotate
    label: |-
      Generate Pre-annotations
      Fine-tuned LayoutLMv3
      PaddleOCR · UniMERNet
      GPT-4o for Table Content
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: layout
    label: |-
      Annotate Nineteen Layout Classes
      Bounding Boxes and Attributes
      Block and Span Elements
      Preserve Page Geometry
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: relations
    label: |-
      Record Document Relations
      Reading Order
      Caption and Affiliation Links
      Cross-page Relationships
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: content
    label: |-
      Transcribe Element Content
      Unicode Text · LaTeX Formulae
      HTML and LaTeX Tables
      Correct Every Character
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: human
    label: |-
      Perform Human Refinement
      Correct Boxes and Reading Order
      Use Tables Generator and latexlive
      Repair Relations and Content
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: qc
    label: |-
      Run Final Quality Control
      CDM Detects Rendering Failures
      Three Researchers Correct Results
      Verify All Annotations
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: release
    label: |-
      Release OmniDocBench
      981 Pages · Nine Document Types
      More Than 100,000 Annotations
      Fifteen Attribute Labels
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: preprocess
    label: |-
      Normalize Model Markdown
      Remove Images and Start Tags
      Extract Tables · Formulae · Code
      Segment Text and Reading Order
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: match
    label: |-
      Match Predictions to Ground Truth
      Adjacency Search
      Normalized-edit Fuzzy Matching
      Apply Ignore Rules
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Multi-level Metrics
      Text NED · Table TEDS and NED
      Formula CDM · NED · BLEU
      Reading-order NED by Task and Attribute
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
