meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VitaBench — Task Construction, Agent Loop, and Strict Scoring
  description: >-
    VitaBench models three real application domains with 66 tools, explicit pre/postconditions, dependency graphs, and a
    user simulator that progressively reveals needs. User profiles, composite requests, real/synthetic environment data,
    and human rubrics feed repeated trial-and-human-acceptance cycles that retain 400 tasks: 100 cross-domain and 300
    single-domain (100 each for Delivery, In-store, and OTA). Evaluation runs an agent against the user simulator and
    tools until ###STOP### or failure, scores overlapping trajectory windows into persistent rubric states, and repeats
    each task four times. Strict success requires every rubric item satisfied; the paper reports Avg@4, Pass@4, and
    Pass^4.
  legend: >-
    Source: arXiv:2509.26490v2, Sections 3.2-3.3 (pp.4-6) and Section 4.1 (p.6); official repository:
    https://github.com/meituan-longcat/vitabench. The diagram is pinned to paper v2; later repository
    evaluator/database/result updates are maintenance drift, not paper evidence.. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
