meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MathQA 构建、公开发布、论文评测与指标流程
  description: >-
    基于 NAACL 2019 论文、官方 math-QA/math-QA 固定提交 4f958013c164a40745a5b771dfb005df308deb4a、其公开 MathQA.zip，以及 AllenAI
    加载器/数据卡固定提交 c4f1cc784c04c4957b50c97858f23893b633eea6（数据 URL 未固定版本）的证据边界重建。论文清单与固定版本发布清单分开呈现， 因为两者的题数和运算列表并不一致。
  legend: 实线依次表示基准构建、发布、论文评测和答案准确率；虚线仅表示审计或可复现性证据， 不代表额外的数据处理步骤。
nodes:
  - id: c1
    label: |-
      C1 · 来源 AQuA-RAT
      超过 10 万道英文 GRE / GMAT 选择题
      题目 · 五个选项 · 解题说明
      保留正确选项
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: c2
    label: |-
      C2 · 保留可用程序求解的题目
      排除高阶多项式题
      排除答案完全非数值的题
      其他精确筛选规则未报告
    type: process
    module: construction
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 9
  - id: c3
    label: |-
      C3 · 定义运算表示语言
      论文定义 58 种领域感知运算
      参数：题中数值 · 常量
      前序运算结果
    type: document
    module: construction
    size: xl
    position:
      x: 600
      'y': 192
    style:
      fontSize: 9
  - id: c4
    label: |-
      C4 · 按词频划分领域
      几何 · 物理 · 概率
      盈亏 · 通用 · 其他
      缩小可选运算范围
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 192
    style:
      fontSize: 9
  - id: c5
    label: |-
      C5 · 动态众包编写程序
      展示运算公式和说明
      仅允许合法参数
      逐步构造程序
    type: user
    module: construction
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 9
  - id: c6
    label: |-
      C6 · 执行并检查提交
      每一步执行后追加结果
      至少使用一个题中数值
      最终值接近正确选项
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 9
  - id: c7
    label: |-
      C7 · 控制标注员质量
      随机插入测试题
      应用未公开的准确率阈值
      既有不可信标注重新入池
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 688
    style:
      fontSize: 9
  - id: c8
    label: |-
      C8 · 验证题目—程序对齐
      三名验证者
      至少两票通过
      报告验证准确率 94.64%
    type: user
    module: construction
    size: xl
    position:
      x: 1160
      'y': 688
    style:
      fontSize: 9
  - id: c9
    label: |-
      C9 · 扩展到近重复题
      将具体数值替换为通用数值
      按 Levenshtein 距离匹配
      阈值：最多四个词
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 688
    style:
      fontSize: 9
  - id: c10
    label: |-
      C10 · 论文数据清单
      表 1：37,259 道题
      平均 5.3 步运算 · 58 类运算
      训练 / 开发 / 测试随机拆分 80 / 12 / 8
    type: database
    module: construction
    size: xl
    position:
      x: 600
      'y': 688
    style:
      fontSize: 9
  - id: c11
    label: |-
      专家评估
      500 题 · 92% 有效
      与众包投票一致率 87%
      论文未说明是否用于发布筛选
    type: document
    module: construction
    size: xl
    position:
      x: 320
      'y': 688
    style:
      fontSize: 9
  - id: c12
    label: |-
      未公开的构建边界
      基于解题说明自动生成的程序被排除
      仅 61% 通过人工验证
      精确阈值和脚本未发布
    type: document
    module: construction
    size: xl
    position:
      x: 40
      'y': 688
    style:
      fontSize: 9
  - id: r1
    label: |-
      R1 · 官方发布版本固定点
      math-QA/math-QA · 4f958013
      提交日期：2019-06-02
      MathQA.zip · 仓库标注 MIT
    type: database
    module: release
    size: xl
    position:
      x: 600
      'y': 1120
    style:
      fontSize: 9
  - id: r2
    label: |-
      R2 · 固定版本公开核心拆分
      train 29,837 · dev 4,475
      test 2,985 · 核心合计 37,297
      另有 challenge_test 604 题
    type: database
    module: release
    size: xl
    position:
      x: 880
      'y': 1120
    style:
      fontSize: 9
  - id: r3
    label: |-
      R3 · 公开行字段契约
      Problem · Rationale · options · correct
      annotated_formula · linear_formula
      category · 测试集包含全部金标字段
    type: document
    module: release
    size: xl
    position:
      x: 1160
      'y': 1120
    style:
      fontSize: 9
  - id: r4
    label: |-
      论文 ↔ 发布版本漂移
      论文 37,259 vs ZIP 核心 37,297
      论文 58 种 vs operation_list 78 行
      公开公式实际使用 53 个运算名
    type: document
    module: release
    size: xl
    position:
      x: 880
      'y': 1400
    style:
      fontSize: 8
  - id: r5
    label: |-
      AllenAI Hugging Face 加载器 / 数据卡固定点
      c4f1cc7 · 2024-01-18
      加载器数据 URL 未固定版本
      数据卡标 Apache-2.0；GitHub 标 MIT
    type: document
    module: release
    size: xl
    position:
      x: 1160
      'y': 1400
    style:
      fontSize: 8
  - id: r6
    label: |-
      R4 · 公开 / 缺失边界
      公开：输入 + 金标程序 / 答案
      不存在隐藏的官方测试标签
      缺失：标注 / 模型 / 评测器代码
      无检查点或数值选项匹配阈值
      仓库静态榜单 · 无提交界面
    type: document
    module: release
    size: xl
    position:
      x: 1440
      'y': 1120
    style:
      fontSize: 8
  - id: e1
    label: |-
      E1 · 论文输入契约
      训练：题目 ↔ 金标程序对
      测试：模型仅接收题目文本
      选项仅在程序执行后使用
      测试不输入说明 / 金标 / 答案
    type: document
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1728
    style:
      fontSize: 9
  - id: e2
    label: |-
      E2 · 训练 Seq2prog 变体
      官方 Python OpenNMT
      两层 LSTM · 隐藏层 100
      Adam · 学习率 0.001
    type: process
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1728
    style:
      fontSize: 9
  - id: e3
    label: |-
      E3 · 约束束搜索解码
      Seq2prog vs Seq2prog+cat
      词频领域分类 → 硬解码约束
      MathQA 束大小 = 100
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1728
    style:
      fontSize: 9
  - id: e4
    label: |-
      E4 · 执行候选程序
      按顺序执行各步运算
      前序结果传给后续步骤
      每个程序得到一个数值结果
    type: process
    module: evaluation
    size: xl
    position:
      x: 600
      'y': 1728
    style:
      fontSize: 9
  - id: e5
    label: |-
      E5 · 将结果映射到答案选项
      保留未公开阈值内的选项
      同时考察匹配选项数量
      与执行值到某选项的最小距离
    type: process
    module: evaluation
    size: xl
    position:
      x: 320
      'y': 1728
    style:
      fontSize: 8
  - id: m1
    label: |-
      M1 · 答案准确率
      选对的题数 / 测试题总数
      每题一个正确答案
      程序精确匹配不是论文指标
    type: formula
    module: metric
    size: xl
    position:
      x: 40
      'y': 1728
    style:
      fontSize: 9
  - id: m2
    label: |-
      M2 · NAACL 2019 论文结果
      随机：20.0%
      Seq2prog：51.9%
      Seq2prog+cat：54.2%
    type: terminal
    module: metric
    size: xl
    position:
      x: 40
      'y': 2064
    style:
      fontSize: 9
