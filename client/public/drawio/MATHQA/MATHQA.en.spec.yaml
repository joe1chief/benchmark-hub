meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathQA Build Process
  description: >-
    Reconstructs the paper's pipeline for turning solvable AQuA-RAT multiple-choice word problems into MathQA's
    crowd-authored, executable operation programs and its answer-accuracy evaluation protocol.
  legend: >-
    MathQA uses 58 domain-aware operations. Its exact table total is 37,259 items; the paper also rounds this to 37,200
    or 37k in prose.
nodes:
  - id: source
    label: |-
      Start from AQuA-RAT
      English GRE/GMAT Word Problems
      Question · Five Options · Rationale
      Preserve the Correct Option
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: screen
    label: |-
      Select Solvable Numeric Problems
      Remove Unusable Noisy Cases
      Omit High-order Polynomials
      Omit Entirely Nonnumeric Solutions
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: language
    label: |-
      Define the Representation Language
      58 Domain-aware Operations
      Problem Numbers · Constants
      Prior Operation Results as Arguments
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: categorize
    label: |-
      Categorize by Term Frequency
      Geometry · Physics · Probability
      Gain-Loss · General · Other
      Prune the Available Operations
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: annotate
    label: |-
      Crowd-author an Operation Program
      Choose an Operation and Valid Arguments
      Execute Every Submitted Step
      Append Its Result as a New Argument
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: gate
    label: |-
      Enforce the Submission Gate
      Use at Least One Problem Number
      Final Value Must Closely Match
      the Correct Numeric Option
    type: decision
    size: xl
    position:
      x: 1420
      'y': 40
  - id: worker_qa
    label: |-
      Control Crowd-worker Quality
      Insert Random Test Questions
      Require an Accuracy Threshold
      Requeue Untrusted Annotations
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: validate
    label: |-
      Validate Program Alignment
      Accept with at Least 2 of 3 Votes
      94.64% Validation Accuracy
      Expert Audit · 92% of 500 Valid
    type: decision
    size: xl
    position:
      x: 1140
      'y': 420
  - id: expand
    label: |-
      Expand to Similar Problems
      Replace Numbers with Placeholders
      Match by Levenshtein Distance
      At Most 4 Words of Edit Distance
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: dataset
    label: |-
      Assemble MathQA
      37,259 Problems · Five Options
      Aligned Executable Programs
      Mean 5.3 Operations per Program
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: split
    label: |-
      Randomly Split the Dataset
      Train · 80%
      Development · 12%
      Test · 8%
    type: document
    size: xl
    position:
      x: 300
      'y': 420
  - id: evaluate
    label: |-
      Evaluate Answer Accuracy
      Decode and Execute a Program Beam
      Match Its Value to an Option
      Score the Selected Correct Option
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: screen
    type: primary
  - from: screen
    to: language
    type: primary
  - from: language
    to: categorize
    type: primary
  - from: categorize
    to: annotate
    type: primary
  - from: annotate
    to: gate
    type: primary
  - from: gate
    to: worker_qa
    type: primary
  - from: worker_qa
    to: validate
    type: primary
  - from: validate
    to: expand
    type: primary
  - from: expand
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: evaluate
    type: primary
modules: []
