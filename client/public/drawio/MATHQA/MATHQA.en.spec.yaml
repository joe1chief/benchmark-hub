meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MathQA Construction, Public Release, Paper Evaluation, and Metric
  description: >-
    Evidence-bounded reconstruction from the NAACL 2019 paper, official math-QA/math-QA commit
    4f958013c164a40745a5b771dfb005df308deb4a, its public MathQA.zip, and the AllenAI loader/card at
    c4f1cc784c04c4957b50c97858f23893b633eea6, whose data URL is not version-pinned. Paper inventory and pinned-release
    inventory are kept separate because their counts and operation lists differ.
  legend: >-
    Solid arrows trace benchmark construction, release, paper evaluation, and answer accuracy. Dashed arrows mark audit
    or reproducibility evidence; they do not represent additional data processing.
nodes:
  - id: c1
    label: |-
      C1 · Source AQuA-RAT
      100K+ English GRE / GMAT MCQs
      Problem · Five Options · Rationale
      Correct Option Retained
