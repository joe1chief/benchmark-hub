      Run Operations Sequentially
      Feed Prior Results to Later Steps
      Obtain One Numeric Result per Program
    type: process
    module: evaluation
    size: xl
    position:
      x: 600
      'y': 1728
    style:
      fontSize: 9
  - id: e5
    label: |-
      E5 · Map Results to Answer Options
      Keep Options within an Unspecified Threshold
      Use Matched-option Count
      and Minimum Distance to an Option
    type: process
    module: evaluation
    size: xl
    position:
      x: 320
      'y': 1728
    style:
      fontSize: 8
  - id: m1
    label: |-
      M1 · Answer Accuracy
      Correct Selected Options / Test Problems
      One Correct Answer per Problem
      Program Exact Match Is Not the Paper Metric
    type: formula
    module: metric
    size: xl
    position:
      x: 40
      'y': 1728
    style:
      fontSize: 9
