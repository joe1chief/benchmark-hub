meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Natural Questions 构建流程
  description: >-
    论文对齐的 Natural Questions 流程：真实聚合 Google 查询经筛选后与搜索前五中的 Wikipedia 页面配对，标注员先判断问题
    有效性，再选择长答案、短答案、是/否或空答案；单标注训练集与五人标注开发/测试集用于共识精确率、召回率和 F1。
  legend: 实线箭头表示查询抽样、Wikipedia 配对、三阶段标注、发布划分、共识标签和评测。
nodes:
  - id: queries
    label: |-
      真实 Google 查询
      匿名化 + 聚合
      由多个用户提出
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: query_filter
    label: |-
      问题启发式筛选
      至少 8 个词；事实查找形式
      排除非问题 / 如何做
    type: process
    size: xl
    position:
      x: 300
      'y': 200
  - id: wikipedia
    label: |-
      执行 Google 搜索
      Wikipedia 位于前 5 才保留
      查询与页面配对
    type: process
    size: xl
    position:
      x: 560
      'y': 200
  - id: question_stage
    label: |-
      阶段 1：问题检查
      良好事实问题或无效问题
      看页面前先判断
    type: user
    size: xl
    position:
      x: 820
      'y': 200
  - id: long_stage
    label: |-
      阶段 2：长答案
      最早的最小 HTML 边界框
      段落 / 表格 / 列表或空
    type: process
    size: xl
    position:
      x: 1080
      'y': 200
  - id: short_stage
    label: |-
      阶段 3：短答案
      长答案内的实体片段
      是 / 否 / 无短答案
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: release
    label: |-
      Natural Questions 发布集
      训练 307,373：单标注
      开发 7,830 / 测试 7,842：五人标注
    type: database
    size: xl
    position:
      x: 1600
      'y': 200
  - id: consensus
    label: |-
      五人共识（β=2）
      至少 2 个非空 → 匹配任一答案
      少于 2 个非空 → 预测空答案
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: model
    label: |-
      问答系统
      预测长答案
      预测短答案或空答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 200
  - id: score
    label: |-
      长 / 短答案分别报告
      精确率 / 召回率 / F1
      作答与拒答质量
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 200
edges:
  - from: queries
    to: query_filter
    type: primary
  - from: query_filter
    to: wikipedia
    type: primary
  - from: wikipedia
    to: question_stage
    type: primary
  - from: question_stage
    to: long_stage
    type: primary
  - from: long_stage
    to: short_stage
    type: primary
  - from: short_stage
    to: release
    type: primary
  - from: release
    to: consensus
    type: primary
  - from: consensus
    to: model
    type: primary
  - from: model
    to: score
    type: primary
modules: []
