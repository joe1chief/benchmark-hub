    type: primary
  - from: final_dataset
    to: initial_test
    type: primary
  - from: initial_test
    to: verified_test
    type: primary
  - from: verified_test
    to: choice
    type: primary
  - from: verified_test
    to: blanking
    type: primary
  - from: choice
    to: acc_parser
    type: primary
  - from: blanking
    to: acc_parser
    type: primary
  - from: blanking
    to: bleu
    type: primary
  - from: acc_parser
    to: report
    type: primary
  - from: bleu
    to: report
    type: primary
  - from: final_dataset
