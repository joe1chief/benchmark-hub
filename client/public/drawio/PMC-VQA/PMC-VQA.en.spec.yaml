      Start from PMC-OA
      1.6M Biomedical
      Image-caption Pairs
      PubMed Central Open Access
      Collected from 2.4M Papers
    type: database
    size: xl
    position:
      x: 260
      'y': 260
    style:
      fontSize: 10
