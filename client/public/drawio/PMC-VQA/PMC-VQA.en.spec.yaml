    type: database
    size: xl
    position:
      x: 1940
      'y': 260
  - id: classifier
    label: |-
      Train Question Classifier
      Reach 81.77 Percent Accuracy
      Reject Caption-only
      Information
      Apply to the Remaining
      Candidate Pool
    type: process
    size: xl
    position:
      x: 2180
      'y': 260
    style:
      fontSize: 9
