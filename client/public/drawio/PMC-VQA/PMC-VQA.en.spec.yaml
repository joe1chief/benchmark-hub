    type: process
    size: xl
    position:
      x: 2900
      'y': 260
    style:
      fontSize: 9
  - id: choice
    label: |-
      Run Choice Task
      Paper Prompt: Question q
      Options a1 to a4
      Suffix: the answer is
      Generate Correct A B C or D
      Evaluate on Verified Test Set
    type: process
    size: xl
    position:
      x: 3140
      'y': 80
    style:
      fontSize: 9
  - id: blanking
    label: |-
      Run Blanking Task
      Paper Prompt:
      Question question
      Suffix: the answer is
      Generate Free-form Answer Text
      Evaluate on Verified Test Set
    type: process
    size: xl
    position:
      x: 3140
      'y': 440
    style:
      fontSize: 9
  - id: acc_parser
    label: |-
      Map Output to Answer Option
      difflib.SequenceMatcher
      Ratio
      Select Most Similar Candidate
      Compute Exact Choice Accuracy
    type: process
    size: xl
    position:
      x: 3380
      'y': 200
    style:
      fontSize: 10
  - id: bleu
    label: |-
      Score Free-form Text
      BLEU-1 Measures
      Unigram Precision
      Map Output to Options
      for Accuracy
      Report Both Blanking Metrics
    type: process
    size: xl
    position:
      x: 3380
      'y': 500
    style:
      fontSize: 9
  - id: report
    label: |-
      Report Task-specific Metrics
      Choice: Accuracy
      Blanking: Accuracy
      and BLEU-1
      Keep Results Separate by Task
    type: terminal
    size: xl
    position:
      x: 3620
      'y': 320
    style:
      fontSize: 10
  - id: release_snapshot
    label: |-
      Fixed Public Data Snapshot
      v1 train.csv · test.csv
      test_clean.csv · images.zip
      test.csv 50,000 Rows
      test_clean.csv 2,000 Rows
      SHA-256 852307310866
    type: document
    size: xl
    position:
      x: 2420
      'y': 800
    style:
      fontSize: 9
  - id: release_drift
    label: |-
      Post-paper Release Drift
      xmcmic URL Now Resolves
      to RadGenome
      Card Says train2 test2 images2
      Snapshot Filenames Add
      Underscores before 2
    type: document
    size: xl
    position:
      x: 2660
      'y': 1020
    style:
      fontSize: 9
  - id: metric_boundary
    label: |-
      Metric Implementation Boundary
      Paper Defines
      SequenceMatcher ACC and BLEU-1
      TE Uses The choices are
      TD Uses Choices
      Distinct ACC Parsers
      No BLEU Routine
    type: document
    size: xl
    position:
      x: 3380
      'y': 900
    style:
      fontSize: 8
  - id: license_boundary
