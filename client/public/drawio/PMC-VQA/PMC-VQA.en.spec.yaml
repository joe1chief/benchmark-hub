meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PMC-VQA Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of caption-to-VQA generation, two-stage visual-dependence filtering, verified test-set
    creation, and parallel Choice and Blanking evaluation, with release drift kept outside the primary flow.
  legend: >-
    Solid arrows show the paper-disclosed construction and evaluation workflow. Dashed arrows identify fixed evidence,
    public-release drift, metric implementation gaps, and license boundaries; they are not additional build stages.
