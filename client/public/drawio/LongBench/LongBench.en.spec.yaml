meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench Build Process
  description: >-
    Reconstructs the six-category bilingual LongBench data pipeline, standardized release, and task-specific automatic
    evaluation.
  legend: >-
    LongBench has 21 datasets and 4,750 test examples: 14 English tasks, five Chinese tasks, and two code tasks.
    LongBench-E uniformly samples 13 eligible datasets into 0–4k, 4–8k, and 8k+ length bins, up to 100 per bin.
nodes:
  - id: sources
    label: |-
      Gather Long-context Task Sources
      Existing Validation or Test Splits
      English · Chinese · Code Data
      Six Target Capability Categories
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: convert
    label: |-
      Reuse and Convert Existing Tasks
      NarrativeQA · Qasper · Summarization
      Apply ZeroSCROLLS-style Text Templates
      Preserve Questions and References
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: qa
    label: |-
      Build Long-document QA
      Multi-doc · Evidence plus Distractors
      MultiFieldQA · Diverse Long Documents
      PhD / Master Annotators Write QA Pairs
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: fewshot
    label: |-
      Build Few-shot Learning Tasks
      Sample Demonstrations from Training Data
      Append a Validation-set Query
      Cover TREC · TriviaQA · SAMSum · LSHT
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: synthetic
    label: |-
      Build Synthetic Retrieval and Counting
      Sample Wikipedia or Chinese C4 Passages
      GPT-3.5-Turbo Summarizes One Passage
      Shuffle Duplicates for PassageCount
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: code
    label: |-
      Build Code-completion Tasks
      Sample LCC Next-line Completion
      Use RepoBench-P XF-F · Oracle-Filled
      Concatenate Gold plus Cross-file Snippets
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: schema
    label: |-
      Standardize Every Example
      input · context · answers · length
      dataset · language · all_classes · _id
      Words for EN/Code · Characters for ZH
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: release
    label: |-
      Release LongBench
      21 Datasets · 4,750 Test Examples
      14 English · 5 Chinese · 2 Code Tasks
      Six Long-context Categories
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: e
    label: |-
      Optionally Build LongBench-E
      Select 13 Eligible Datasets
      Sample up to 100 per Length Bin
      0–4k · 4–8k · 8k+
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: infer
    label: |-
      Run Task-specific Zero-shot Inference
      Format input and context with Templates
      Apply Dataset-specific Output Limits
      If Too Long Keep First and Last Halves
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: score
    label: |-
      Apply the Dataset Metric
      QA F1 · ROUGE-L
      Classification / Retrieval Accuracy
      Code Edit Similarity
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report Long-context Performance
      Dataset and Category Averages
      Separate English and Chinese Views
      LongBench-E Scores by Length Bin
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
