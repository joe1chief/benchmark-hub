meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench 构建流程
  description: 重建 LongBench 六类中英双语长上下文数据流程、标准化发布格式与按任务自动评测方法。
  legend: >-
    LongBench 含 21 个数据集和 4,750 条测试样本：14 个英文任务、5 个中文任务和 2 个代码任务。 LongBench-E 从 13 个适用数据集中按 0–4k、4–8k、8k+ 三档均匀采样，每档最多 100
    条。
nodes:
  - id: sources
    label: |-
      汇集长上下文任务来源
      使用既有验证集或测试集
      覆盖英文 · 中文 · 代码数据
      面向六类目标能力
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: convert
    label: |-
      复用并转换既有任务
      NarrativeQA · Qasper · 摘要数据
      应用ZeroSCROLLS风格纯文本模板
      保留问题与参考答案
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: qa
    label: |-
      构建长文档问答
      多文档 · 证据段落加干扰文档
      MultiFieldQA · 多来源长文档
      博硕士标注者编写问答对
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: fewshot
    label: |-
      构建少样本学习任务
      从训练集抽取示例
      拼接一个验证集查询
      覆盖TREC · TriviaQA · SAMSum · LSHT
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: synthetic
    label: |-
      构建合成检索与计数任务
      抽取Wikipedia或中文C4段落
      GPT-3.5-Turbo摘要其中一段
      PassageCount随机重复并打乱段落
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: code
    label: |-
      构建代码补全任务
      抽样LCC下一行代码补全
      使用RepoBench-P XF-F与Oracle-Filled
      拼接标准片段及跨文件片段
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: schema
    label: |-
      标准化每条样本
      input · context · answers · length
      dataset · language · all_classes · _id
      英文/代码计词 · 中文计字符
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: release
    label: |-
      发布LongBench
      21个数据集 · 4,750条测试样本
      14个英文 · 5个中文 · 2个代码任务
      覆盖六类长上下文场景
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: e
    label: |-
      可选构建LongBench-E
      选取13个适用数据集
      每个长度档最多采样100条
      0–4k · 4–8k · 8k+
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: infer
    label: |-
      运行任务专用零样本推理
      按模板组织input和context
      应用数据集专用输出上限
      超长时保留首尾两半并删中间
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: score
    label: |-
      应用各数据集指标
      问答F1 · ROUGE-L
      分类/检索准确率
      代码编辑相似度
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      报告长上下文表现
      数据集与类别平均分
      分别展示英文与中文结果
      LongBench-E按长度档报告
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: convert
    type: primary
  - from: convert
    to: qa
    type: primary
  - from: qa
    to: fewshot
    type: primary
  - from: fewshot
    to: synthetic
    type: primary
  - from: synthetic
    to: code
    type: primary
  - from: code
    to: schema
    type: primary
  - from: schema
    to: release
    type: primary
  - from: release
    to: e
    type: primary
  - from: e
    to: infer
    type: primary
  - from: infer
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
