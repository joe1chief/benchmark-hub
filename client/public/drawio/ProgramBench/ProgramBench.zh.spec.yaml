meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProgramBench 构建与评测流程
  description: 按论文由Agent把开源程序转成黑盒重建任务并加固行为测试构建去源码离线环境最后按可执行行为等价评分。
  legend: ProgramBench发布200个任务与248,853个行为测试函数，Agent仅获得只可执行参考程序及使用文档并须生成源代码和构建脚本。
nodes:
  - id: step_1
    label: |-
      识别候选开源仓库
      要求可构建独立程序
      优先编译型语言项目
      覆盖多种软件领域
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      标准化采集Agent
      mini-SWE-agent框架
      Claude Sonnet 4.5
      Ubuntu 22.04 Docker容器
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      构建标准可执行程序
      从原始源代码编译
      验证程序能够运行
      记录单一可复现构建脚本
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      探索外部可观察行为
      阅读源码文档与原生测试
      用多样输入调用参考程序
      收集现有行为测试
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      生成行为测试
      断言stdout stderr及退出码
      检查生成文件与副作用
      不依赖源码内部实现
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      按覆盖率扩充测试
      测量当前行覆盖率
      定向覆盖缺失代码路径
      迭代追求完整覆盖
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      检查断言质量
      标记仅退出码检查
      标记短子串与或式断言
      提示Agent修复弱测试
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      过滤无效测试
      要求标准程序确定性通过
      删除虚假程序也能通过的测试
      只保留外部可观察断言
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      移除实现细节
      删除源代码与原始测试
      清理使用文档
      仅保留任务可见信息
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      构建离线任务镜像
      注入只可执行标准程序
      加入清理后文档与必需资产
      禁网并禁止读取二进制
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      发布基准
      200个开源程序任务
      共248,853个测试函数
      每任务测试中位数770
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      从黑盒行为重建程序
      探测可执行程序与文档
      编写源代码与构建脚本
      任意语言 · 1,000步 · 6小时
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      运行隐藏行为测试
      构建并调用候选程序
      比较所有外部可观察效果
      排除被判为作弊的方案
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      评估行为等价性
      Resolved：全部测试通过
      Tests Passed：衡量部分进展
      Almost：至少95%测试通过
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
