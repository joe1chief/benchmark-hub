meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProgramBench 构建与评测流程
  description: 按论文 v1 重建智能体辅助仓库转换、覆盖率驱动行为测试加固、去源码洁净任务、公开评测解析、作弊复核与发布计数漂移。
  legend: 实线表示论文与代码披露的构建或评测；虚线表示固定证据、发布漂移、许可、未发布构建提示、推理提示范围或作弊评判边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2605.03546v1
      PDF 87c67873f06f
      Git v1.2.4 963063c9271c
      HF de0ddfb63759
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: candidate_repositories
    label: |-
      识别候选开源仓库
      要求可构建独立程序
      优先编译型语言项目
      覆盖多种软件领域
    type: database
    size: xl
    position:
      x: 280
      'y': 40
  - id: collection_agent
    label: |-
      标准化采集智能体
      mini-SWE-agent 框架
      Claude Sonnet 4.5
      Ubuntu 22.04 Docker 容器
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: gold_build
    label: |-
      构建标准可执行程序
      编译原始源代码
      验证程序能够运行
      记录单一可复现构建脚本
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: behavior_sources
    label: |-
      探索行为证据源
      用多样输入探测标准程序
      阅读源码、测试与文档
      收集现有行为测试
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: generate_tests
    label: |-
      生成行为测试
      使用 Pytest 测试框架
      断言输出、退出状态与文件效果
      避免依赖源码内部实现
    type: process
    size: xl
    position:
      x: 1320
      'y': 40
  - id: coverage_loop
    label: |-
      按覆盖率扩充测试
      测量第一方代码行覆盖率
      定向覆盖缺失代码路径
      迭代达到覆盖率目标
    type: process
    size: xl
    position:
      x: 1580
      'y': 40
  - id: assertion_linter
    label: |-
      检查断言质量
      标记仅退出码检查
      标记短子串与或式逻辑
      提示智能体修复测试
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: validation_gate
    label: |-
      应用标准程序与虚假程序过滤
      要求标准程序确定性通过
      拒绝虚假程序也能通过的测试
      修订或丢弃剩余失败测试
    type: process
    size: xl
    position:
      x: 2100
      'y': 40
  - id: sanitize_documentation
    label: |-
      清理使用文档
      保留用户可见接口
      删除源代码与原始测试
      删除实现细节
    type: document
    size: xl
    position:
      x: 2360
      'y': 40
  - id: cleanroom_image
    label: |-
      构建洁净任务镜像
      注入只可执行标准程序
      使用独立全新镜像
      加入文档与必需测试资产
    type: database
    size: xl
    position:
      x: 2620
      'y': 40
  - id: paper_release
    label: |-
      完成论文口径 ProgramBench
      200 个开源程序任务
      248,853 个行为测试函数
      每任务测试中位数为 770
    type: database
    size: xl
    position:
      x: 2880
      'y': 40
  - id: candidate_inputs
    label: |-
      公开候选侧可见输入
      只可执行标准程序
      清理后文档与必需资产
      行为测试始终隐藏
    type: document
    size: xl
    position:
      x: 2620
      'y': 560
  - id: policy_prompt
    label: |-
      强制执行黑盒规则
      禁止源码查找与联网
      禁止封装标准程序
      禁止反编译与跟踪
    type: process
    size: xl
    position:
      x: 2360
      'y': 560
  - id: agent_run
    label: |-
      运行软件智能体
      mini-SWE-agent · 任意语言
      20 核 CPU · 60 GB 内存
      最多 1,000 步与 6 小时
    type: process
    size: xl
    position:
      x: 2100
      'y': 560
  - id: submission
    label: |-
      打包候选代码仓库
      提交全部编写的源代码
      根目录提供 compile.sh
      打包为 submission.tar.gz
    type: document
    size: xl
    position:
      x: 1840
      'y': 560
  - id: clean_eval_image
    label: |-
      启动评测镜像
      解包至洁净工作区
      删除与标准程序哈希相同的文件
      编译期间阻断网络
    type: database
    size: xl
    position:
      x: 1580
      'y': 560
  - id: compile_submission
    label: |-
      编译候选程序
      执行 chmod 与 compile.sh
      产出候选可执行程序
      构建失败即停止
    type: process
    size: xl
    position:
      x: 1320
      'y': 560
  - id: branch_selection
    label: |-
      选择测试分支
      读取 tests.json 元数据
      保留未忽略的分支
      从 HF 下载分支数据包
    type: process
    size: xl
    position:
      x: 1060
      'y': 560
  - id: hidden_pytest
    label: |-
      运行隐藏行为 Pytest
      执行每个选中分支
      比较标准程序的外部行为
      生成 JUnit XML 结果
    type: process
    size: xl
    position:
      x: 800
      'y': 560
  - id: junit_parser
    label: |-
      解析 JUnit 测试结果
      映射通过、失败与错误
      将缺失预期测试标为未运行
      检测互相冲突的重复结果
    type: process
    size: xl
    position:
      x: 540
      'y': 560
  - id: ignored_test_filter
    label: |-
      应用逐测试排除规则
      移除 tests.json 忽略项
      将意外结果保留为警告
      非通过状态均视为未解决
    type: process
    size: xl
    position:
      x: 280
      'y': 560
  - id: instance_score
    label: |-
      计算每个任务分数
      测试通过率为通过数除以有效测试
      仅全部测试通过才算解决
      保留部分进展分数
    type: process
    size: xl
    position:
      x: 20
      'y': 560
  - id: cheating_review
    label: |-
      应用论文作弊门
      检查完整轨迹与代码库
      检测源码查找或程序封装
      严格多数评判即标记
    type: process
    size: xl
    position:
      x: 20
      'y': 840
  - id: headline_metrics
    label: |-
      报告基准指标
      解决率：全部测试通过且无作弊
      每任务测试通过率
      近乎解决率：至少通过 95%
    type: terminal
    size: xl
    position:
      x: 280
      'y': 840
  - id: release_drift_boundary
    label: |-
      固定 v1.2.4 计数漂移
      Git：201 个任务目录（含计算器夹具）
      313,292 列出 · 65,845 忽略
      247,447 个有效计分名
      论文：200 任务 · 248,853 测试函数
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 2880
      'y': 320
  - id: license_boundary
    label: |-
      发布许可边界
      Git 评测代码采用 MIT
      HF 测试数据卡采用 MIT
      每任务保留上游许可证
      HF 含 200 个任务目录
    type: document
    size: xl
    position:
      x: 2620
      'y': 320
  - id: construction_boundary
    label: |-
      构建发布边界
      论文注明智能体、模型与镜像
      按功能描述提示
      未公开完整构建流水线代码
      公开 Git 以评测器为主
    type: document
    size: xl
    position:
      x: 540
      'y': 320
  - id: prompt_boundary
    label: |-
      推理提示边界
      附录给出完整行为规则
      公开评测器不绑定智能体框架
      基线智能体运行器位于外部
      不臆造隐藏设置
    type: document
    size: xl
    position:
      x: 2360
      'y': 920
  - id: cheating_boundary
    label: |-
      作弊评判边界
      每次运行由 9 个模型评判
      3 个 GPT-5.2 · 3 个 Sonnet 4.5
      3 个 Gemini 3.1 Pro · 5 票即多数
      公开评测 CLI 未实现此流程
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 1160
edges:
  - from: source_evidence
    to: candidate_repositories
    type: secondary
    style:
      dashed: true
  - from: candidate_repositories
    to: collection_agent
    type: primary
  - from: collection_agent
    to: gold_build
    type: primary
  - from: gold_build
    to: behavior_sources
    type: primary
  - from: behavior_sources
    to: generate_tests
    type: primary
  - from: generate_tests
    to: coverage_loop
    type: primary
  - from: coverage_loop
    to: assertion_linter
    type: primary
  - from: assertion_linter
    to: validation_gate
    type: primary
  - from: validation_gate
    to: coverage_loop
    type: primary
    waypoints:
      - x: 2220
        'y': 240
      - x: 1700
        'y': 240
  - from: validation_gate
    to: sanitize_documentation
    type: primary
  - from: sanitize_documentation
    to: cleanroom_image
    type: primary
  - from: cleanroom_image
    to: paper_release
    type: primary
  - from: paper_release
    to: candidate_inputs
    type: primary
    waypoints:
      - x: 3140
        'y': 100
      - x: 3140
        'y': 500
      - x: 2740
        'y': 500
  - from: candidate_inputs
    to: policy_prompt
    type: primary
  - from: policy_prompt
    to: agent_run
    type: primary
  - from: agent_run
    to: submission
    type: primary
  - from: submission
    to: clean_eval_image
    type: primary
  - from: clean_eval_image
    to: compile_submission
    type: primary
  - from: compile_submission
    to: branch_selection
    type: primary
  - from: branch_selection
    to: hidden_pytest
    type: primary
  - from: hidden_pytest
    to: junit_parser
    type: primary
  - from: junit_parser
    to: ignored_test_filter
    type: primary
  - from: ignored_test_filter
    to: instance_score
    type: primary
  - from: instance_score
    to: cheating_review
    type: primary
  - from: cheating_review
    to: headline_metrics
    type: primary
  - from: paper_release
    to: release_drift_boundary
    type: secondary
    style:
      dashed: true
  - from: release_drift_boundary
    to: license_boundary
    type: secondary
    style:
      dashed: true
  - from: collection_agent
    to: construction_boundary
    type: secondary
    style:
      dashed: true
  - from: policy_prompt
    to: prompt_boundary
    type: secondary
    style:
      dashed: true
  - from: cheating_review
    to: cheating_boundary
    type: secondary
    style:
      dashed: true
modules: []
