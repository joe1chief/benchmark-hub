      Require a standalone program
      Favor compiled-language projects
      Cover diverse software domains
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Standardize the Collection Agent
      mini-SWE-agent harness
      Claude Sonnet 4.5
      Ubuntu 22.04 Docker container
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Build the Gold Executable
      Compile from the original source
      Verify the program runs
      Record one reproducible build script
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Explore Observable Behavior
      Read source docs and native tests
      Invoke the reference with varied inputs
      Harvest existing behavioral tests
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Generate Behavioral Tests
      Assert stdout stderr and exit codes
      Check produced files and side effects
      Avoid source-level implementation details
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Expand Tests by Coverage
      Measure current line coverage
      Target missing code paths
      Iterate toward full coverage
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Lint Assertion Quality
      Flag exit-code-only checks
      Flag short substrings and OR assertions
      Prompt the agent to repair weak tests
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Filter Invalid Tests
      Require deterministic gold passes
      Reject tests passed by a dummy binary
      Keep externally observable assertions
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Strip Implementation Details
      Remove source and original tests
      Sanitize usage documentation
      Retain only task-visible information
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Build an Offline Task Image
      Inject execute-only gold program
      Add sanitized docs and essential assets
      Block internet and binary reading
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Release the Benchmark
      200 open-source program tasks
      248,853 test functions total
      Median 770 tests per task
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Rebuild from Black-Box Behavior
      Probe executable and documentation
      Write source plus a build script
      Any language · 1,000 steps · 6 hours
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Run Hidden Behavioral Tests
      Build and invoke the candidate
      Compare all observable effects
      Exclude solutions flagged as cheating
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Score Behavioral Equivalence
      Resolved: all tests pass
      Tests Passed: partial progress
      Almost: at least 95 percent pass
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
