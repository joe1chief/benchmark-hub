  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProgramBench Build and Evaluation Process
  description: >-
    Paper-aligned agentic conversion of open-source programs into black-box reconstruction tasks with hardened
    behavioral tests, source-stripped offline environments, and executable-equivalence scoring.
  legend: >-
    ProgramBench releases 200 tasks and 248,853 behavioral test functions; agents receive an execute-only reference
    program plus usage documentation and must produce source code and a build script.
nodes:
