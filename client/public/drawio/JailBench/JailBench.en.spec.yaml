      Define Two-level Safety Taxonomy
      5 Risk Domains · 40 Specific Categories
      Chinese Linguistic + Cultural Context
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: sources
    label: |-
      Four Public Harmful-query Sources
      Anthropic Red-team Data · AdvBench
      SafetyBench · Flames
      Labeled + Unlabeled Queries
    type: cloud
    size: xl
    position:
      x: 300
      'y': 300
  - id: translate
    label: |-
      Chinese Localization
      Translate All Source Queries
