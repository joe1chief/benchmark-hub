meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JailBench Build Process
  description: >-
    Paper-aligned JailBench construction: a Chinese safety taxonomy and four public harmful-query sources form the seed
    pool, while AJPE tests template-seed pairs, retains harmful evidence, induces and scores new prompts, and feeds
    high-scoring prompts back into the template pool.
  legend: >-
    Solid arrows show the main construction and evaluation flow. Dashed arrows mark evidence or taxonomy inputs and the
    high-scoring-template feedback loop. The paper-scale benchmark and public repository subset are kept separate.
