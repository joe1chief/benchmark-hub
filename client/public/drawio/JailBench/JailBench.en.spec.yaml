      Task · Criteria · Output Constraints
    type: process
    size: xl
    position:
      x: 860
      'y': 300
  - id: verify
    label: |-
      Label Quality Control
      Randomly Sample Classified Queries
      Manual Taxonomy Verification
      Correct Inaccurate Assignments
    type: process
    size: xl
    position:
      x: 1140
      'y': 300
  - id: augment
    label: |-
      Fill Underrepresented Categories
      ChatGPT Few-shot Question Generation
      Target Category + Sampled Examples
      Repeat for Coverage + Diversity
    type: process
    size: xl
    position:
      x: 1420
      'y': 300
  - id: seed_pool
    label: |-
      JailBench Seed Construction Pool
      More Than 10,000 Chinese Questions
      5 Domains · 40 Risk Categories
    type: database
    size: xl
    position:
      x: 1700
      'y': 300
  - id: prior_templates
    label: |-
      Jailbreak Template Pool
      AutoDAN · GPTFuzzer · Jailbroken
      ReNeLLM · ICA · DeepInception
      Chinese Translation + Manual Refinement
    type: document
    size: xl
    position:
      x: 1980
      'y': 620
  - id: template_seed
    label: |-
      AJPE Template Testing Input
      Random Jailbreak Template
      + Original JailBench Seed Question
    type: database
    size: xl
    position:
      x: 1700
      'y': 620
  - id: target_llm
    label: |-
      Query Target LLM Groups
      Generate Response to Enhanced Prompt
      Retain Template-to-output Trace
    type: process
    size: xl
    position:
      x: 1420
      'y': 620
  - id: evaluator
    label: |-
      Security Evaluator
      Classify Target Output Harmfulness
      Compute Per-template ASR
    type: process
    size: xl
    position:
      x: 1140
      'y': 620
  - id: gate
    label: |-
      Harmful Output
      and Template Meets
      Preset ASR Threshold?
    type: decision
    size: xl
    position:
      x: 860
      'y': 620
  - id: harmful_pairs
    label: |-
      Retained AJPE Evidence
      Successful Harmful Input-output Pairs
      + Their Effective Templates
    type: database
    size: xl
    position:
      x: 580
      'y': 620
  - id: induction
    label: |-
      ChatGPT In-context Induction
      Learn from Harmful Input-output Pairs
      Generate Diverse Inducive Instructions
      Mimic Effective Template Traits
    type: process
    size: xl
    position:
      x: 300
      'y': 620
  - id: score
    label: |-
      Log-probability Prompt Scoring
      Model Confidence Proxies Effectiveness
      Rank Newly Generated Prompts
    type: process
    size: xl
    position:
      x: 20
      'y': 620
  - id: prompt_pool
    label: |-
      High-scoring Jailbreak Prompt Pool
      Keep Best Prompts + Feed Them Back
      AJPE Expands Pool Beyond 1,000
    type: database
    size: xl
    position:
      x: 20
      'y': 900
  - id: combine
    label: |-
      Construct Paper-scale JailBench
      Select 20 Effective Prompts
      Select 540 JailBench Seed Questions
      Cartesian Product = 10,800 Cases
    type: database
    size: xl
    position:
      x: 300
      'y': 900
  - id: evaluate
    label: |-
      Evaluate Paper's 13 Chinese-capable LLMs
      JailBench Seed + Enhanced JailBench
      Aggregate 5 Domains + Overall
    type: process
    size: xl
    position:
      x: 580
      'y': 900
  - id: report
    label: |-
      Report Safety Vulnerability
      ASR = n / m
      AE = k/m · Σ 1/exp(l_s/l_o)
      Seed vs Jailbreak-enhanced Results
    type: terminal
    size: xl
    position:
      x: 860
      'y': 900
  - id: artifact_boundary
    label: |-
      Paper / Public Artifact Boundary
      Paper: 540 × 20 = 10,800 · 40 Types
      Git 5f47407: 108 / 2,160 · 27 Types
      Full Data by Application; Partial CSVs
      README: MDJudge + 14-model Leaderboard
    type: document
    size: xl
    position:
      x: 1140
      'y': 900
  - id: safe_discard
    label: |-
      Safe / Low-ASR Branch
      Discard Safe Output Evidence
      Drop Templates Below ASR Threshold
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 900
