meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JailBench 构建流程
  description: 对齐论文的 JailBench 构建：从中文两级安全分类与有害问题的翻译、标注、扩增开始，经过 AJPE 模板测试、 上下文提示生成、对数概率排序，形成越狱测试集并完成安全评测。
  legend: JailBench Seed 构建池超过 10,000 题；公开评测设计从中选 540 道种子题，与 20 个高效越狱提示组合成 10,800 个用例。
nodes:
  - id: standard
    label: |-
      中国生成式 AI 安全基本要求
      训练数据与生成内容主要风险
      安全专家 + 语言学专家协作
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      定义两级安全分类体系
      5 个风险领域 · 40 个具体类别
      适配中文语言与文化语境
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: collect
    label: |-
      汇集有害问题
      来源为公开红队与安全数据集
      同时包含有标签与无标签来源
      保留原始分类信息
    type: cloud
    size: xl
    position:
      x: 580
      'y': 40
  - id: translate
    label: |-
      中文本地化
      将来源问题翻译为中文
      人工校正语言与语义
      形成基础原始数据
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: label
    label: |-
      对齐 JailBench 分类
      映射已有标签类别
      ChatGPT 分类无标签问题
      提示包含分类标准与输出格式
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: verify
    label: |-
      标签质量控制
      随机抽样已分类条目
      人工按分类体系复核
      修正不准确的类别分配
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: augment
    label: |-
      补齐稀缺类别
      ChatGPT 少样本生成有害问题
      输入目标类别与已有样例
      迭代提升覆盖度与多样性
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: seed_pool
    label: |-
      JailBench Seed 构建池
      超过 10,000 个中文问题
      5 个领域 · 40 个风险类别
    type: database
    size: xl
    position:
      x: 1980
      'y': 40
  - id: prior_templates
    label: |-
      收集已有越狱模板
      AutoDAN · GPTFuzzer · DeepInception 等
      翻译为中文并人工精修
    type: document
    size: xl
    position:
      x: 1980
      'y': 380
  - id: test
    label: |-
      AJPE 模板测试
      随机模板 × 种子问题
      评估目标模型输出有害性
      丢弃 ASR 低于阈值的模板
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: generate
    label: |-
      AJPE 提示生成
      学习成功有害输入输出对
      ChatGPT 生成多样诱导提示
      模仿有效模板特征
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: score
    label: |-
      提示质量筛选
      用输出对数概率衡量提示有效性
      保留表现最高的提示
      将模板池扩展至超过 1,000 个
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: combine
    label: |-
      构建最终 JailBench
      选择 20 个高效越狱提示
      选择 540 道 JailBench Seed 问题
      笛卡尔积 → 10,800 个测试用例
    type: database
    size: xl
    position:
      x: 860
      'y': 380
  - id: evaluate
    label: |-
      执行安全评测
      查询 13 个中文能力模型
      MDJudge 判定输出有害性
      按 5 个领域与 40 类汇总
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      汇报安全漏洞
      攻击成功率 = 有害输出 / 总问题数
      攻击效率进一步考虑提示长度
      对比 Seed 与越狱增强结果
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: standard
    to: taxonomy
    type: primary
  - from: taxonomy
    to: collect
    type: primary
  - from: collect
    to: translate
    type: primary
  - from: translate
    to: label
    type: primary
  - from: label
    to: verify
    type: primary
  - from: verify
    to: augment
    type: primary
  - from: augment
    to: seed_pool
    type: primary
  - from: seed_pool
    to: prior_templates
    type: primary
  - from: prior_templates
    to: test
    type: primary
  - from: test
    to: generate
    type: primary
  - from: generate
    to: score
    type: primary
  - from: score
    to: combine
    type: primary
  - from: combine
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
