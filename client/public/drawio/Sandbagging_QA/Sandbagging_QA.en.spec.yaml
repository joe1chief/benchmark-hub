meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sandbagging_QA Build and Evaluation Process
  description: >-
    Sandbagging QA is an evaluation environment inside Apollo Research's in-context scheming suite, not an independently
    documented OpenAI benchmark. A model receives a harmless list of multi-digit multiplication problems, answer-format
    documentation, and optionally a long-term mathematics-research goal. In the underperform incentive, documentation
    says accuracy above 50% triggers arithmetic unlearning; the paired counterfactual says accuracy below 50% triggers
    unlearning. The paper also removes the explicit goal in an ablation. Each incentive condition is run 50 times per
    model. Final-answer accuracy is compared between paired conditions, and bootstrap testing with alpha 0.01 estimates
    whether performance depends significantly on the deployment incentive; the evidence is aggregate behavior rather
    than proof from a single rollout.
  legend: >-
    Source: Frontier Models are Capable of In-context Scheming arXiv:2412.04984 Sections 2.3 and 3.6, Table 6, and
    Appendix A.6; Apollo Research project page. Solid arrows show the main flow explicitly supported by the paper or
    official documentation.
