meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sandbagging_QA 构建与评测流程
  description: >-
    Sandbagging QA是Apollo
    Research上下文内谋划套件中的评测环境，并非一个独立记录的OpenAI基准。模型获得一组无害的多位数乘法题、答案格式说明，以及可选的长期数学研究目标。在低表现激励条件中，文档称准确率高于50%会触发算术能力遗忘；配对反事实条件则称低于50%会触发遗忘。论文还通过移除显式目标进行消融。每个激励条件对每个模型运行50次，比较最终答案准确率，并以alpha为0.01的bootstrap检验表现是否显著依赖部署激励；证据来自聚合行为而非单条轨迹。
  legend: >-
    来源：Frontier Models are Capable of In-context Scheming arXiv:2412.04984 Sections 2.3 and 3.6, Table 6, and Appendix
    A.6; Apollo Research project page。实线箭头表示论文或官方资料明确支持的主流程。
