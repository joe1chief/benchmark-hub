meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Visual Puzzles — 多来源筛选与评测流程
  description: >-
    Visual Puzzles
    汇集在线/教材谜题、人工翻译的中国公务员考试逻辑题、大规模视觉数据合成及改造后的多模态基准。所有题目统一为四选一，过滤掉依赖高等数学或领域知识以及无法纯视觉求解的题目，再由人工多轮检查清晰度、可解性、推理类型和难度。最终 1,168
    题分属五类，数量为 262/211/200/209/286；难度占比 46/39/15%，视觉/文本选项占比 57/43%。评测比较直接提示与思维链，按模型报告较优结果，以准确率计分并给出70名学生的人类基线。
  legend: >-
    来源：arXiv:2504.10342, Sections 2.2-2.3 (pp.3-4) and Section 3.1 (p.5); official project:
    https://neulab.github.io/VisualPuzzles/; official dataset:
    https://huggingface.co/datasets/neulab/VisualPuzzles.。实线箭头表示论文或官方资料明确支持的主流程。
