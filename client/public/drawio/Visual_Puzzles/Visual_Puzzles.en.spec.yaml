meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Visual Puzzles — Multi-source Curation and Evaluation
  description: >-
    Visual Puzzles combines online and textbook puzzles, manually translated logic questions from Chinese civil-service
    examinations, large-scale visual-data synthesis, and repurposed multimodal benchmarks. All items are normalized to
    four choices, filtered to remove advanced-math or domain-knowledge dependence and to require visual solvability,
    then repeatedly reviewed by humans for clarity, solvability, reasoning type, and difficulty. The final 1,168 items
    span five categories with counts 262/211/200/209/286, difficulty proportions 46/39/15%, and visual/text answer
    options 57/43%. Evaluation compares direct and chain-of-thought prompting, reporting the better result per model,
    with accuracy and a 70-student human baseline.
  legend: >-
    Source: arXiv:2504.10342, Sections 2.2-2.3 (pp.3-4) and Section 3.1 (p.5); official project:
    https://neulab.github.io/VisualPuzzles/; official dataset: https://huggingface.co/datasets/neulab/VisualPuzzles..
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
