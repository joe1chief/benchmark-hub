meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldTravel Webscape Construction and Constraint Evaluation
  description: >-
    WorldTravel builds a controlled five-city travel webscape from authoritative venue facts plus practical
    travel/review evidence, synthesizes static pages with GPT-5.2 under manual review, and asks experts to design
    tightly coupled itinerary tasks whose unique feasibility is checked against reference itineraries. Quality control
    proceeds in order through author self-review, independent cross-solving, pure external review, and pilots with
    GPT-4.1, Doubao-1.8-Pro, and Gemini-2.5-Pro, producing 150 tasks over 2,003 pages. Agents use eight
    screenshot-returning APIs and emit strict JSON itineraries. Evaluation reports Feasibility Rate = |F|/N ↑,
    Constraint Violation = 1-(1/N)Σ_i n_H^(i)/|C_H^(i)| ↓ over all N tasks, and
    Optimality|Feasible=(1/|F|)Σ_{i∈F}n_S^(i)/|C_S^(i)| ↑ only over feasible tasks.
  legend: >-
    Source: WorldTravel arXiv:2602.08367v1, Figure 2, Sections 3.1-3.5, Table 1, Appendices A-F, H.1, and K. No official
    code/data/project URL is linked by the paper or arXiv record. The benchmark-site ccbench.org metadata is invalid for
    this item because that live domain is an unrelated CodeCrafters coding benchmark; it must not appear as a
    WorldTravel source.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
