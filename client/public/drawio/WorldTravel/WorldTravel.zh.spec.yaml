meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldTravel 网页环境构建与约束评测流程
  description: >-
    WorldTravel将权威场馆事实与旅行平台/评论中的实践信息汇合，在人工审查下用GPT-5.2合成静态网页，并由专家设计具有紧耦合约束的行程任务，通过参考行程确认可行解唯一。质检依次经过作者自审、独立交叉求解、独立外部复核，以及GPT-4.1、Doubao-1.8-Pro和Gemini-2.5-Pro三模型试跑，最终形成5城2003页上的150个任务。智能体通过8个返回截图的API交互并输出严格JSON行程。评测报告可行率
    |F|/N ↑、在全部N个任务上计算的约束违反率 1-(1/N)Σ_i n_H^(i)/|C_H^(i)| ↓，以及仅在可行任务上计算的最优性 (1/|F|)Σ_{i∈F}n_S^(i)/|C_S^(i)| ↑。
  legend: >-
    来源：WorldTravel arXiv:2602.08367v1, Figure 2, Sections 3.1-3.5, Table 1, Appendices A-F, H.1, and K. No official
    code/data/project URL is linked by the paper or arXiv record. The benchmark-site ccbench.org metadata is invalid for
    this item because that live domain is an unrelated CodeCrafters coding benchmark; it must not appear as a
    WorldTravel source.。实线箭头表示论文或官方资料明确支持的主流程。
