meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CoQA 构建流程
  description: 对齐论文的 CoQA 流程：从七个领域筛选多实体段落并按段落划分，由合格标注员两人实时对话，收集改写问题和基于依据跨度编辑的自由答案；开发/测试题再收集三个答案形成四参考，并以归一化词重合宏 F1 评测。
  legend: 实线箭头表示段落筛选、提问者/回答者配对采集、多答案复标和评测。
nodes:
  - id: domains
    label: |-
      七类文本领域
      故事 / 文学 / 考试 / 新闻
      Wikipedia / Reddit / 科学
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: passage_filter
    label: |-
      CoreNLP 段落筛选
      多实体 / 事件 / 代词指代
      截取至约 200 词
    type: process
    size: xl
    position:
      x: 300
      'y': 240
  - id: split
    label: |-
      按段落划分
      域内每域开发 100 + 测试 100
      Reddit / 科学各仅测试 100
    type: database
    size: xl
    position:
      x: 560
      'y': 240
  - id: qualify
    label: |-
      AMT 资格测试
      960 人中 57% 通过
    type: user
    size: large
    position:
      x: 820
      'y': 240
  - id: pair
    label: |-
      ParlAI 实时配对
      提问者 + 回答者
      共享对话历史
    type: process
    size: xl
    position:
      x: 1060
      'y': 240
  - id: questioner
    label: |-
      提问者
      提出依赖上下文的问题
      原文词重合时提示改写
    type: user
    size: xl
    position:
      x: 1340
      'y': 60
  - id: answerer
    label: |-
      回答者
      高亮依据文本跨度
      编辑复制内容为自由答案
    type: user
    size: xl
    position:
      x: 1340
      'y': 420
  - id: corpus
    label: |-
      CoQA 语料
      8,399 段对话
      127K 轮 / 每段平均 15.2 轮
    type: database
    size: xl
    position:
      x: 1620
      'y': 240
  - id: references
    label: |-
      开发 / 测试答案竞猜任务
      每题再收集三个答案
      每题共四个参考答案
    type: user
    size: xl
    position:
      x: 1900
      'y': 240
  - id: prediction
    label: |-
      对话问答系统
      段落 + 金标答案历史
      预测下一轮自由答案
    type: process
    size: xl
    position:
      x: 2180
      'y': 240
  - id: metric
    label: |-
      词重合宏 F1
      忽略冠词与标点
      对四个参考答案取平均
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 240
edges:
  - from: domains
    to: passage_filter
    type: primary
  - from: passage_filter
    to: split
    type: primary
  - from: split
    to: qualify
    type: primary
  - from: qualify
    to: pair
    type: primary
  - from: pair
    to: questioner
    type: primary
  - from: pair
    to: answerer
    type: primary
  - from: questioner
    to: corpus
    type: primary
  - from: answerer
    to: corpus
    type: primary
  - from: corpus
    to: references
    type: primary
  - from: references
    to: prediction
    type: primary
  - from: prediction
    to: metric
    type: primary
modules: []
