meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Belebele 构建流程
  description: >-
    对齐论文的 Belebele 流程：用 488 个 FLORES-200 段落经五轮 LSP 反馈生成英文四选一题，结合人工检查和词法捷径检测在末轮过滤约 20%，再由专家把问题和答案人工翻译到 122
    个语言变体并由第二人逐条校对，最终对 109,800 行报告准确率。
  legend: 实线箭头表示英文 MCQ 构建、质量过滤、专家翻译、校对和评测。
nodes:
  - id: flores
    label: |-
      FLORES-200 平行段落
      488 个不同段落
      Wikinews / Wikijunior / WikiVoyage
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: lsp
    label: |-
      LSP 创建英文 MCQ
      五轮反馈迭代
      四个选项 / 一个正确答案
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: guidelines
    label: |-
      仅依赖段落的理解题
      合理负例 / 无歧义
      禁止外部知识与捷径
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: manual_qa
    label: |-
      迭代人工检查
      每轮抽查问题
      返回难度反馈
    type: user
    size: xl
    position:
      x: 880
      'y': 240
  - id: lexical_qa
    label: |-
      程序化捷径检查
      词法重合 / 长度特征
      词袋模型准确率 0.28
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: english_set
    label: |-
      英文测试集
      末轮过滤约 20%
      900 题 / 488 个段落
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: translate
    label: |-
      专家人工翻译
      只翻问题与答案；不使用机器翻译
      对齐既有 FLORES 段落
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: transliterate
    label: |-
      额外文字变体
      五种印度-雅利安语言转写
      IndicXlit 辅助
    type: process
    size: xl
    position:
      x: 2000
      'y': 240
  - id: proofread
    label: |-
      独立第二标注员
      逐条校对与编辑翻译
      保持 FLORES 本地化方式
    type: user
    size: xl
    position:
      x: 2280
      'y': 240
  - id: dataset
    label: |-
      Belebele 平行测试集
      122 个语言变体 / 29 种文字
      27 个语系 / 109,800 行
    type: database
    size: xl
    position:
      x: 2560
      'y': 240
  - id: metric
    label: |-
      选择 A / B / C / D
      按语言变体报告准确率
      随机基线 = 25%
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 240
edges:
  - from: flores
    to: lsp
    type: primary
  - from: lsp
    to: guidelines
    type: primary
  - from: guidelines
    to: manual_qa
    type: primary
  - from: manual_qa
    to: lexical_qa
    type: primary
  - from: lexical_qa
    to: english_set
    type: primary
  - from: english_set
    to: translate
    type: primary
  - from: translate
    to: transliterate
    type: primary
  - from: transliterate
    to: proofread
    type: primary
  - from: proofread
    to: dataset
    type: primary
  - from: dataset
    to: metric
    type: primary
modules: []
