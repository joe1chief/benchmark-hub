meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Belebele Build Process
  description: >-
    Paper-aligned Belebele workflow: 488 FLORES-200 passages seed English four-choice questions through five LSP
    feedback rounds, manual and lexical shortcut checks remove about 20% of the final iteration, experts translate and
    independently proofread questions and answers into 122 language variants, and 109,800 rows are scored by accuracy.
  legend: Solid arrows show English MCQ creation, quality filtering, expert translation, proofreading, and evaluation.
nodes:
  - id: flores
    label: |-
      FLORES-200 Parallel Passages
      488 Distinct Passages
      Wikinews / Wikijunior / WikiVoyage
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: lsp
    label: |-
      English MCQ Creation by LSP
      Five Iterations of Feedback
      Four Options / One Correct
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: guidelines
    label: |-
      Passage-only Comprehension
      Plausible Negatives / No Ambiguity
      No External Knowledge or Shortcuts
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: manual_qa
    label: |-
      Iterative Manual Inspection
      Sample Questions Each Round
      Return Difficulty Feedback
    type: user
    size: xl
    position:
      x: 880
      'y': 240
  - id: lexical_qa
    label: |-
      Programmatic Shortcut Checks
      Lexical Overlap / Length Features
      Bag-of-words Accuracy 0.28
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: english_set
    label: |-
      English Test Set
      Filter about 20% in Final Iteration
      900 Questions / 488 Passages
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: translate
    label: |-
      Expert Human Translation
      Questions + Answers Only; No MT
      Align with Existing FLORES Passage
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: transliterate
    label: |-
      Extra Script Variants
      Transliterate Five Indo-Aryan Languages
      with IndicXlit Support
    type: process
    size: xl
    position:
      x: 2000
      'y': 240
  - id: proofread
    label: |-
      Independent Second Annotator
      Proofread + Edit Every Translation
      Preserve FLORES Localization
    type: user
    size: xl
    position:
      x: 2280
      'y': 240
  - id: dataset
    label: |-
      Belebele Parallel Test Set
      122 Language Variants / 29 Scripts
      27 Families / 109,800 Rows
    type: database
    size: xl
    position:
      x: 2560
      'y': 240
  - id: metric
    label: |-
      Choose A / B / C / D
      Accuracy per Language Variant
      Random Baseline = 25%
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 240
edges:
  - from: flores
    to: lsp
    type: primary
  - from: lsp
    to: guidelines
    type: primary
  - from: guidelines
    to: manual_qa
    type: primary
  - from: manual_qa
    to: lexical_qa
    type: primary
  - from: lexical_qa
    to: english_set
    type: primary
  - from: english_set
    to: translate
    type: primary
  - from: translate
    to: transliterate
    type: primary
  - from: transliterate
    to: proofread
    type: primary
  - from: proofread
    to: dataset
    type: primary
  - from: dataset
    to: metric
    type: primary
modules: []
