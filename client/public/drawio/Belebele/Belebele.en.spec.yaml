meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Belebele Build Process
  description: >-
    Paper-aligned English authoring, quality control, expert translation, independent proofreading, conditional
    IndicXlit transliteration, and test-only evaluation, based on arXiv:2308.16884v2.
  legend: Solid arrows are the common path; dashed arrows are the five-language transliteration-only branch.
nodes:
