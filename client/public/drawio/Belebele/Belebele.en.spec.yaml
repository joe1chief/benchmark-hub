    label: |-
      FLORES-200 Parallel Passages
      488 Distinct Passages
      Wikinews • Wikijunior • WikiVoyage
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: guidelines
    label: |-
      Authoring Guidelines First
      Passage-Only Comprehension • No External Knowledge
      Plausible Distractors • No Ambiguity or Shortcuts
    type: document
    size: xl
    position:
      x: 320
      'y': 180
  - id: authoring
    label: |-
      Five-Round English MCQ Authoring
      Four Options • Exactly One Correct
      Provider Revises from Round Feedback
    type: user
    size: xl
    position:
      x: 600
      'y': 180
  - id: human_qa
    label: |-
      Human Sampling Review Each Round
      Inspect Difficulty and Ambiguity
      Feed Findings into the Next Round
    type: user
    size: xl
    position:
      x: 880
      'y': 40
  - id: automatic_qa
    label: |-
      Automatic Shortcut QA
      Lexical Overlap • Answer Length • Bag-of-Words
      Check Correct-vs-Distractor Feature Balance
    type: process
    size: xl
    position:
      x: 880
      'y': 320
  - id: english_set
    label: |-
      Final English Set
      Filter About 20% in Final Round
      900 Questions over 488 Passages
    type: database
    size: xl
    position:
      x: 1160
      'y': 180
  - id: translate
    label: |-
      Expert Human Translation
      Questions and Answers Only • Never Machine Translation
      Align Ambiguities to the Existing FLORES Passage
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: proofread
    label: |-
      Independent Proofreading
      Second Annotator Edits Every Translation
      Preserve Localized Passage Alignment
    type: user
    size: xl
    position:
      x: 880
      'y': 520
  - id: indic_condition
    label: |-
      Hindi • Bengali • Urdu
      Nepali • Sinhala?
      Only These Five Need a Latin-Script Variant
    type: decision
    size: xl
    position:
      x: 600
      'y': 520
  - id: transliterate
    label: |-
      Conditional IndicXlit Branch
      Annotator Transliterates Native to Latin Script
      Recheck Questions, Answers, and Passage Pairing
    type: process
    size: xl
    position:
      x: 600
      'y': 760
  - id: dataset
    label: |-
      Belebele Parallel Test Set
      122 Variants • 115 Languages • 29 Scripts
      27 Families • 109,800 Rows
    type: database
    size: xl
    position:
      x: 320
      'y': 520
  - id: metric
    label: |-
      Test-Only Multiple Choice
      Accuracy per Language Variant
      Random Baseline = 25%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 520
