meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartMimic 构建流程
  description: >-
    按论文版本构建并评测 1,000 个图表图像、指令和 Python 代码三元组：从 2024 年 2 月后 CC BY 4.0 的 arXiv 图与 独特公开样例筛选，等分为 Direct 与 Customized
    Mimic，并以可执行的高层和低层相似度指标评分。
  legend: 实线表示论文版本的策划与评测，虚线表示补充图表来源。
nodes:
  - id: arxiv
    label: |-
      抓取 CC BY 4.0 的 arXiv 源文件图像
      论文发表于 2024 年 2 月之后
      跨科学领域约 174,100 张图
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: general_filter
    label: |-
      执行通用可视化筛选
      清晰度 • 视觉吸引力 • 配色 • 独特性
      保留约 15,800 张候选图表
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: diversity_filter
    label: |-
      筛选多样性与信息密度
      在图型和子类别池内比较
      平衡视觉复杂度与信息传达价值
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: experts
    label: |-
      五位跨领域专家独立复核
      保留候选池交集并集体投票
      选出 279 张高价值 arXiv 图表
    type: user
    size: xl
    position:
      x: 940
      'y': 220
  - id: supplemental
    label: |-
      补充独特风格图表
      Matplotlib Gallery • Stack Overflow • Twitter • Reddit
      替换数据与样式以降低泄漏
    type: database
    size: xl
    position:
      x: 940
      'y': 440
  - id: prototypes
    label: |-
      组装 500 张原型图表
      18 种常规与 4 种高级图型
      论文版本含 191 个细粒度子类别
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: annotators
    label: |-
      熟练 Python 标注员复现图表
      计算机相关专业硕士生
      至少四年 Python 与 matplotlib 经验
    type: user
    size: xl
    position:
      x: 1540
      'y': 220
  - id: direct
    label: |-
      Direct Mimic
      人工编写 Python 代码与指令
      500 个图像–指令–代码三元组
    type: document
    size: xl
    position:
      x: 1840
      'y': 80
  - id: customized
    label: |-
      Customized Mimic
      用新领域数据替换图表数据
      同步修改代码与指令 • 500 个三元组
    type: document
    size: xl
    position:
      x: 1840
      'y': 360
  - id: release
    label: |-
      发布论文版本 ChartMimic
      1,000 个高质量测试样本
      两项任务 • 22 种图型 • 191 个子类
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: model
    label: |-
      生成图表渲染代码
      输入目标图表图像与任务指令
      执行预测 Python 并渲染图表
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: high_level
    label: |-
      高层相似度
      GPT-4V 比较真值与生成图表
      给出 0–100 分
    type: process
    size: xl
    position:
      x: 2740
      'y': 80
  - id: low_level
    label: |-
      低层可执行指标
      文本 • 布局 • 图型 • 颜色
      包含执行率与元素级相似度
    type: process
    size: xl
    position:
      x: 2740
      'y': 360
  - id: validation
    label: |-
      用人类判断验证指标
      300 个 Direct 样本 × 四种提示方法
      1,200 张图 • 三位评估者 • Pearson 相关
    type: user
    size: xl
    position:
      x: 3040
      'y': 220
  - id: report
    label: |-
      报告执行率、高层、低层与总体得分
      分开统计 Direct 与 Customized Mimic
      分析文本、图型、颜色与代码错误
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: arxiv
    to: general_filter
    type: primary
  - from: general_filter
    to: diversity_filter
    type: primary
  - from: diversity_filter
    to: experts
    type: primary
  - from: experts
    to: prototypes
    type: primary
  - from: supplemental
    to: prototypes
    type: data
  - from: prototypes
    to: annotators
    type: primary
  - from: annotators
    to: direct
    type: primary
  - from: annotators
    to: customized
    type: primary
  - from: direct
    to: release
    type: primary
  - from: customized
    to: release
    type: primary
  - from: release
    to: model
    type: primary
  - from: model
    to: high_level
    type: primary
  - from: model
    to: low_level
    type: primary
  - from: high_level
    to: validation
    type: primary
  - from: low_level
    to: validation
    type: primary
  - from: validation
    to: report
    type: primary
modules: []
