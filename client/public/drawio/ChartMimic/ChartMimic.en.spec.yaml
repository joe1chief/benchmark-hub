meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartMimic Build Process
  description: >-
    Paper-version construction and evaluation of 1,000 human-curated chart-image, instruction, and Python-code triplets,
    built from post-February-2024 CC BY 4.0 arXiv figures and distinctive public examples, split equally into Direct and
    Customized Mimic, and scored with executable high- and low-level similarity metrics.
  legend: Solid arrows show paper-version curation and evaluation; dashed arrows carry supplemental chart sources.
nodes:
  - id: arxiv
    label: |-
      Scrape CC BY 4.0 arXiv Source Figures
      Publications after February 2024
      About 174,100 Figures across Scientific Domains
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: general_filter
    label: |-
      Apply General Visualization Filtering
      Clarity • Visual Appeal • Color Scheme • Uniqueness
      Retain about 15,800 Candidate Charts
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: diversity_filter
    label: |-
      Filter Diversity and Information Density
      Compare within Type and Subcategory Pools
      Balance Visual Complexity and Communication Value
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: experts
    label: |-
      Five Cross-domain Experts Review Independently
      Preserve Pool Intersection and Vote Collectively
      Select 279 High-value arXiv Charts
    type: user
    size: xl
    position:
      x: 940
      'y': 220
  - id: supplemental
    label: |-
      Add Distinctive Supplemental Charts
      Matplotlib Gallery • Stack Overflow • Twitter • Reddit
      Replace Data and Styles to Reduce Leakage
    type: database
    size: xl
    position:
      x: 940
      'y': 440
  - id: prototypes
    label: |-
      Assemble 500 Prototype Charts
      18 Regular and Four Advanced Chart Types
      191 Fine-grained Subcategories in the Paper Version
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: annotators
    label: |-
      Skilled Python Annotators Reproduce Charts
      Computer-science Master’s Students
      At Least Four Years of Python and matplotlib Experience
    type: user
    size: xl
    position:
      x: 1540
      'y': 220
  - id: direct
    label: |-
      Direct Mimic
      Manually Write Python Code and Instruction
      500 Figure–Instruction–Code Triplets
    type: document
    size: xl
    position:
      x: 1840
      'y': 80
  - id: customized
    label: |-
      Customized Mimic
      Replace Chart Data with New-domain Data
      Modify Code and Instruction • 500 Triplets
    type: document
    size: xl
    position:
      x: 1840
      'y': 360
  - id: release
    label: |-
      Release the Paper-version ChartMimic
      1,000 High-quality Test Examples
      Two Tasks • 22 Types • 191 Subcategories
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: model
    label: |-
      Generate Chart-rendering Code
      Input Target Chart Image plus Task Instruction
      Execute Predicted Python to Render a Chart
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: high_level
    label: |-
      High-level Similarity
      GPT-4V Compares Ground-truth and Generated Charts
      Score from 0 to 100
    type: process
    size: xl
    position:
      x: 2740
      'y': 80
  - id: low_level
    label: |-
      Low-level Executable Metrics
      Text • Layout • Chart Type • Color
      Include Execution Rate and Element-level Similarity
    type: process
    size: xl
    position:
      x: 2740
      'y': 360
  - id: validation
    label: |-
      Validate Metrics against Human Judgment
      300 Direct Examples × Four Prompting Methods
      1,200 Charts • Three Evaluators • Pearson Correlation
    type: user
    size: xl
    position:
      x: 3040
      'y': 220
  - id: report
    label: |-
      Report Execution, High-, Low-, and Overall Scores
      Separate Direct and Customized Mimic
      Analyze Text, Type, Color, and Code Failures
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
