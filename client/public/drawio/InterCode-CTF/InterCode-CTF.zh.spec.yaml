meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode-CTF 构建流程
  description: 对齐 InterCode-CTF 专项论文：从人工解答 picoCTF 题目并还原完整数字资源，到任务级 Ubuntu Docker 环境、 flag 复验、十轮智能体交互与严格成功判分。
  legend: 本流程依据 NeurIPS 2023 Multi-Agent Security 工作坊独立论文，不采用后续模型报告因联网或可用性而删减的子集。
nodes:
  - id: source
    label: |-
      picoCTF 练习平台
      公开挑战说明
      下载完整数字资源
      代码 · 图像 · 可执行文件 · 压缩包
    type: cloud
    size: xl
    position:
      x: 20
      'y': 40
  - id: solve
    label: |-
      专家人工收集
      作者先独立解出每道挑战
      记录隐藏的 picoCTF{...} flag
      仅保留可复现任务
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: package
    label: |-
      重建任务实例
      query + gold + source + tags
      task_assets/{task_id}
      还原依赖与文件布局
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: docker
    label: |-
      构建 InterCode-CTF 沙箱
      Docker 中的 Ubuntu + Bourne Shell
      Python · GCC · GDB 与安全工具
      从任务专属资源目录启动
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: verify
    label: |-
      人工可解性验证
      在 Docker 中重新解出每个重建任务
      核对资源、依赖与 flag
      两位 CTF 经验作者用时 6 小时
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: suite
    label: |-
      最终 InterCode-CTF · 100 题
      通用技能 33 · 逆向工程 27
      密码学 19 · 取证 15
      二进制利用 4 · Web 利用 2
    type: database
    size: xl
    position:
      x: 1140
      'y': 360
  - id: loop
    label: |-
      十轮语言智能体评测
      指令 → Python / Bash 动作
      返回 stdout 或错误观察
      flag 正确或预算耗尽时停止
    type: process
    size: xl
    position:
      x: 860
      'y': 360
  - id: grade
    label: |-
      严格 flag 提交
      动作：submit picoCTF{...}
      与 gold 忽略大小写精确匹配
      正确奖励 1，否则为 0
    type: process
    size: xl
    position:
      x: 580
      'y': 360
  - id: report
    label: |-
      汇报任务成功率
      GPT-4 基线：解出 40 / 100
      已解任务平均 3.9 轮
      按六类安全技能拆分结果
    type: terminal
    size: xl
    position:
      x: 300
      'y': 360
edges:
  - from: source
    to: solve
    type: primary
  - from: solve
    to: package
    type: primary
  - from: package
    to: docker
    type: primary
  - from: docker
    to: verify
    type: primary
  - from: verify
    to: suite
    type: primary
  - from: suite
    to: loop
    type: primary
  - from: loop
    to: grade
    type: primary
  - from: grade
    to: report
    type: primary
modules: []
