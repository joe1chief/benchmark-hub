meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode-CTF 构建流程
  description: 对齐 InterCode-CTF 专项论文：从人工解答 picoCTF 题目并还原完整数字资源，到共享 Ubuntu Docker 镜像与任务级工作目录、flag 复验、论文十次交互基线及严格成功判分。
  legend: 本流程依据 NeurIPS 2023 Multi-Agent Security 工作坊独立论文，不采用后续模型报告因联网或可用性而删减的子集。
nodes:
  - id: evidence
    label: |-
      主要证据与固定版本
      OpenReview KOZwk7BFc3
      MASEC 2023 · Git c2f8b82
      CTF 专项发布
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: source
    label: |-
      picoCTF 练习平台
      公开挑战说明
      下载完整数字资源
      代码 · 图像 · 可执行文件 · 压缩包
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: solve
    label: |-
      专家人工收集
      作者先独立解出每道挑战
      记录隐藏的 picoCTF{...} flag
      仅保留可复现任务
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: package
    label: |-
      重建任务实例
      query + gold + source + tags
      task_assets/{task_id}
      还原依赖与文件布局
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: docker
    label: |-
      构建共享 intercode-ctf 镜像
      Ubuntu · Python · GCC · GDB 工具
      资源置于 /ctf · 从任务目录启动
      从智能体镜像删除 solution/
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: verify
    label: |-
      人工可解性验证
      在 Docker 中重新解出每个重建任务
      核对资源、依赖与 flag
      两位 CTF 经验作者用时 6 小时
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: suite
    label: |-
      最终 InterCode-CTF · 100 题
      通用技能 33 · 逆向工程 27
      密码学 19 · 取证 15
      二进制利用 4 · Web 利用 2
    type: database
    size: xl
    position:
      x: 1420
      'y': 360
  - id: loop
    label: |-
      论文基线：10 次智能体交互
      指令 → Python / Bash 动作
      返回 stdout 或错误观察
      非环境内部终止规则
    type: process
    size: xl
    position:
      x: 1140
      'y': 360
  - id: grade
    label: |-
      提交判定 · submit ANSWER
      忽略大小写精确匹配 gold
      正确 r=1 · 错误且有预算则 r=0 并继续
    type: decision
    size: xl
    position:
      x: 860
      'y': 360
  - id: report
    label: |-
      下游结果与网页排行榜
      GPT-4 基线：解出 40 / 100
      已解任务平均 3.9 轮
      按六类安全技能拆分结果
    type: terminal
    size: xl
    position:
      x: 580
      'y': 360
  - id: artifact_boundary
    label: |-
      论文 / 运行时制品边界
      query + 资源 → 智能体；gold → 评测器
      论文允许错误提交后继续
      代码 submit 即 done；评测器忽略 done
      论文 10 轮 · 当前脚本默认 15 轮
    type: document
    size: xl
    position:
      x: 300
      'y': 360
  - id: scope_limit
    label: |-
      收集范围限制
      无浏览器 → Web 题仅 2 道
      19 道题依赖远程主机
      未披露随机抽样或难度字段
    type: document
    size: xl
    position:
      x: 1700
      'y': 360
edges:
  - from: evidence
    to: source
    type: data
  - from: source
    to: solve
    type: primary
  - from: solve
    to: package
    type: primary
  - from: package
    to: docker
    type: primary
  - from: docker
    to: verify
    type: primary
  - from: verify
    to: suite
    type: primary
  - from: suite
    to: loop
    type: primary
  - from: suite
    to: scope_limit
    type: data
  - from: loop
    to: grade
    type: primary
  - from: grade
    to: loop
    type: optional
    waypoints:
      - x: 960
        'y': 600
      - x: 1240
        'y': 600
  - from: grade
    to: report
    type: primary
  - from: report
    to: artifact_boundary
    type: data
modules: []
