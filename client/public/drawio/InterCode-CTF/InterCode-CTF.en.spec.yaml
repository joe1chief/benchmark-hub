meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode-CTF Build Process
  description: >-
    Paper-aligned InterCode-CTF construction from manually solved picoCTF challenges and exact task assets to a
    task-specific Ubuntu Docker environment, verified flags, a ten-turn agent loop, and exact success scoring.
  legend: >-
    The workflow follows the dedicated NeurIPS 2023 Multi-Agent Security workshop paper, not later model-report subsets
    that remove unavailable or internet-dependent tasks.
