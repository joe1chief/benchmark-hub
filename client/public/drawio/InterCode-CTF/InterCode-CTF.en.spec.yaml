meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InterCode-CTF Build Process
  description: >-
    Paper-aligned InterCode-CTF construction from manually solved picoCTF challenges and exact task assets to a shared
    Ubuntu Docker image with task-specific working directories, verified flags, a ten-interaction paper baseline, and
    exact success scoring.
  legend: >-
    The workflow follows the dedicated NeurIPS 2023 Multi-Agent Security workshop paper, not later model-report subsets
    that remove unavailable or internet-dependent tasks.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Fixed Revision
      OpenReview KOZwk7BFc3 · MASEC 2023
      Git c2f8b82 · Dedicated CTF Release
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: source
    label: |-
      picoCTF Practice Platform
      Public Challenge Instructions
      Download Exact Digital Resources
      Code · Images · Executables · Archives
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: solve
    label: |-
      Expert Manual Collection
      Author First Solves Each Challenge
      Record Hidden picoCTF{...} Flag
      Retain Reproducible Tasks
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: package
    label: |-
      Recreate Task Instance
      query + gold + source + tags
      task_assets/{task_id}
      Restore Dependencies and File Layout
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: docker
    label: |-
      Build the Shared intercode-ctf Image
      Ubuntu · Python · GCC · GDB Security Tools
      All Assets under /ctf · Task-specific Start
      Remove solution/ from Agent Image
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: verify
    label: |-
      Manual Feasibility Verification
      Re-solve Every Recreated Task in Docker
      Confirm Assets, Dependencies, and Flag
      Two CTF-experienced Authors · 6 Hours
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: suite
    label: |-
      Final InterCode-CTF · 100 Tasks
      General 33 · Reverse Engineering 27
      Cryptography 19 · Forensics 15
      Binary Exploitation 4 · Web 2
    type: database
    size: xl
    position:
      x: 1420
      'y': 360
  - id: loop
    label: |-
      Paper Baseline: 10 Agent Interactions
      Instruction → Python / Bash Action
      stdout or Error Observation Returns
      Not an Environment Termination Rule
    type: process
    size: xl
    position:
      x: 1140
      'y': 360
  - id: grade
    label: |-
      Submit Decision · submit ANSWER
      Case-insensitive Match to Gold
      Correct: r=1 · Wrong + Budget: r=0, Loop
    type: decision
    size: xl
    position:
      x: 860
      'y': 360
  - id: report
    label: |-
      Downstream Results + Web Leaderboard
      GPT-4 Baseline: 40 / 100 Solved
      3.9 Average Turns on Solved Tasks
      Break Down Success by Six Categories
    type: terminal
    size: xl
    position:
      x: 580
      'y': 360
  - id: artifact_boundary
    label: |-
      Paper / Runtime Artifact Boundary
      query + Assets → Agent; gold → Evaluator
      Paper: Wrong Submit May Continue
      Code: submit done; evaluator ignores done
      Paper 10 · Current Script Default 15
    type: document
    size: xl
    position:
      x: 300
      'y': 360
  - id: scope_limit
    label: |-
      Collection Scope Limitation
      No Browser → Only 2 Web Tasks
      19 Queries Reference Remote Hosts
      No Random Sample or Difficulty Field
    type: document
    size: xl
    position:
      x: 1700
      'y': 360
