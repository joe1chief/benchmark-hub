0+ repository maintainers</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>from 36 flagship open-source repos</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>over 40 expert hours per task</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="520" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(620,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Select realistic repository work</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>multi-PR chains or free-form requests</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>concise brief + codebase guidelines</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="776" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(876,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Define mergeability criteria</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>behavior · regression · build/lint/style</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>tests · scope · quality; mark blockers</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1040" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"