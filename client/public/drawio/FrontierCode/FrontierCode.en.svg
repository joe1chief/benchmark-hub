 rules</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>docs allowed</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>solution-bearing sources banned</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>5 trials/effort; average then best</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="520" y="296" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(620,326.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Report pass rate + weighted rubric</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>any blocker failure → score 0</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>unfair internet use → run score 0</tspan></text></g></g></g></g><g data-cell-id="12"><g><path d="M 200 25 L 246.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 254.32 25 L 246.82 28.75 L 246.82 21.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="13"><g><path d="M 456 25 L 510.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 518.32 25 L 510.82 28.75 L 510.82 21.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="14"><g><path d="M 720 25 L 766.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" p