meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierCode 1.1 构建流程
  description: 按官方文章对齐的任务构建、评分标准加固、私有发布与 1.1 版评测流程。
  legend: 实线箭头对应 Cognition 于 2026-06-08 发布的构建文章及 2026-07-07 发布的 1.1 版更新；官方未披露论文、公开仓库、题目包、基准提交清单或评分器实现。
nodes:
  - id: evidence
    label: |-
      证据：官方文章 2026-06-08 / 2026-07-07
      无论文、公开仓库或题目/评分器发布
      仅展示官方披露的阶段和数量
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: maintainers
    label: |-
      招募 20+ 位代码库维护者
      覆盖 36 个旗舰开源仓库
      每题投入超过 40 小时专家工作
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: task_selection
    label: |-
      选取真实代码库工作
      来自多 PR 链或自由需求
      简短任务说明 + 代码库通用规范
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: rubric_design
    label: |-
      定义可合并性标准
      行为 · 回归 · 构建/检查/风格
      测试 · 范围 · 质量；标记 blocker
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: verifier_ensemble
    label: |-
      为每条标准配置评分方式
      经典/命令 · 反向经典 · 范围检查
      mutagent 自适应经典 · LLM 提示评分
    type: process
    size: xl
    position:
      x: 1080
      'y': 120
  - id: quality_control
    label: |-
      加固并校准每套评分标准
      错误解 + 替代正确解；Devin 攻击
      4 个 0–100% 梯度解；分阶段评审
    type: process
    size: xl
    position:
      x: 1340
      'y': 120
  - id: private_release
    label: |-
      私有 Extended 150；Main 为最难 100 题
      基准提交清单与评分器代码未公开
      Diamond 50 在 1.1 版已弃用
    type: database
    size: xl
    position:
      x: 1340
      'y': 420
  - id: version_11
    label: |-
      应用 FrontierCode 1.1 评分更新
      审核 1,000+ 标准；75 个 blocker 降级
      公平联网提示 + 经典违规验证器
    type: process
    size: xl
    position:
      x: 1080
      'y': 420
  - id: agent_runs
    label: |-
      按公平联网规则运行智能体
      可查文档；禁止检索现成解法
      每种强度 5 次；先平均再取最佳强度
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: score
    label: |-
      报告通过率 + 加权评分标准分
      任一 blocker 失败即记 0 分
      不公平联网也使该次运行记 0 分
    type: terminal
    size: xl
    position:
      x: 560
      'y': 420
edges:
  - from: evidence
    to: maintainers
    type: primary
  - from: maintainers
    to: task_selection
    type: primary
  - from: task_selection
    to: rubric_design
    type: primary
  - from: rubric_design
    to: verifier_ensemble
    type: primary
  - from: verifier_ensemble
    to: quality_control
    type: primary
  - from: quality_control
    to: private_release
    type: primary
  - from: private_release
    to: version_11
    type: primary
  - from: version_11
    to: agent_runs
    type: primary
  - from: agent_runs
    to: score
    type: primary
modules: []
