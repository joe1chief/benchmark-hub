meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierCode 1.1 构建流程
  description: 按官方规范对齐的 FrontierCode 1.1 数据构建、评分加固与可合并性评测流程。
  legend: 实线箭头依次对应 Cognition 2026 年 6 月构建说明及 2026 年 7 月 1.1 版更新；题目未公开，因此仅展示官方披露的阶段和数量。
nodes:
  - id: maintainers
    label: |-
      招募开源维护者
      20+ 位开发者，覆盖 36 个旗舰仓库
      每人每题投入超过 40 小时
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: task_source
    label: |-
      维护者选取真实高难工作
      来自真实多 PR 链与自由需求
      简短任务描述 + 代码库通用规范
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: rubric_design
    label: |-
      定义“可合并 PR”标准
      行为 · 回归 · 构建/风格 · 测试
      改动范围约束 · 代码质量
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: verifier_ensemble
    label: |-
      为每条标准配置验证器
      经典/命令 · 反向经典 · 范围检查
      mutagent 自适应测试 · LLM 评审
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: hardening
    label: |-
      对评分标准做对抗式加固
      审核依据；尝试错误解与替代正确解
      加入 Devin 生成的攻击以暴露误判
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: calibration_review
    label: |-
      用 4 个 0–100% 梯度解校准
      小组负责人多轮迭代，Cognition 研究员终审
      随机题再由研究员独立作答验证
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: release
    label: |-
      私有 FrontierCode 1.1 题集
      Extended 150 题 · Main 为最难 100 题
      Diamond 因高噪声已弃用
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: version_11
    label: |-
      1.1 版修订评分与联网规则
      审核 1,000+ 标准，75 个 blocker 降级
      公平联网提示 + 经典违规验证器
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: agent_runs
    label: |-
      智能体自主完成仓库任务
      可查文档，禁止检索现成解法
      每种推理强度运行 5 次，取最佳强度
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: scoring
    label: |-
      报告通过率与加权标准分
      仅全部 blocker 通过才算 pass
      blocker 失败或不公平联网均记零分
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
edges:
  - from: maintainers
    to: task_source
    type: primary
  - from: task_source
    to: rubric_design
    type: primary
  - from: rubric_design
    to: verifier_ensemble
    type: primary
  - from: verifier_ensemble
    to: hardening
    type: primary
  - from: hardening
    to: calibration_review
    type: primary
  - from: calibration_review
    to: release
    type: primary
  - from: release
    to: version_11
    type: primary
  - from: version_11
    to: agent_runs
    type: primary
  - from: agent_runs
    to: scoring
    type: primary
modules: []
