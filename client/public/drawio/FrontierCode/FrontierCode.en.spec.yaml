      Recruit open-source maintainers
      20+ developers across 36 flagship repositories
      each invests more than 40 hours per task
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: task_source
    label: |-
      Maintainers select realistic hard work
      real PR chains plus free-form requests
      concise task description + codebase guidelines
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: rubric_design
    label: |-
      Define what a mergeable PR must satisfy
      behavior · regressions · build/style · tests
      scope discipline · code quality
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: verifier_ensemble
    label: |-
      Build criterion-specific verifiers
      classical/command · reverse-classical · scope
      adaptive classical via mutagent · LLM rubric
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: hardening
    label: |-
      Adversarially harden every rubric
      audit rationale; try wrong and alternative fixes
      add Devin-generated hacks to expose errors
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: calibration_review
    label: |-
      Calibrate with four solutions from 0 to 100%
      pod lead iterates; Cognition researcher reviews
      random tasks are independently solved
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: release
    label: |-
      Private FrontierCode 1.1 release
      Extended: 150 tasks · Main: hardest 100
      Diamond deprecated because it became noisy
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: version_11
    label: |-
      Refine version 1.1 grading and internet use
      audit 1,000+ criteria; demote 75 strict blockers
      fair-use prompt + classical violation verifier
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: agent_runs
    label: |-
      Agent attempts repository task autonomously
      allow documentation search, forbid solution lookup
      5 trials per reasoning effort; retain best effort
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: scoring
    label: |-
      Report pass rate and weighted rubric score
      pass only when every blocker clears
      failed blocker or unfair internet use scores zero
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
