  title: FrontierCode 1.1 Build Process
  description: Official-specification-aligned construction, hardening, and mergeability evaluation flow for FrontierCode 1.1.
  legend: >-
    Solid arrows follow Cognition's June 2026 construction specification and July 2026 version 1.1 update; the tasks are
    not public, so only officially disclosed stages and counts are shown.
nodes:
