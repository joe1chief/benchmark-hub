meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Unified Med-VLM Benchmark Build and Evaluation Process
  description: >-
    The Unified Med-VLM Benchmark is an evaluation suite defined in the MedXIAOHE technical report rather than a
    standalone dataset. It harmonizes more than 30 public and in-house benchmarks across visual diagnosis and
    recognition, medical imaging, diagnosis, medical text, report generation, and instruction following. The report
    standardizes prompts and output formats, uses structured outputs where appropriate, applies each constituent
    benchmark's official metric, and adds in-house faithfulness tests where report evaluation is sensitive to omissions
    versus unsupported additions. Models run under the same protocol and results are grouped by capability rather than
    collapsed into an undocumented single score.
  legend: >-
    Source: MedXIAOHE arXiv:2602.12705, Unified Evaluation section and main benchmark table. Solid arrows show the main
    flow explicitly supported by the paper or official documentation.
