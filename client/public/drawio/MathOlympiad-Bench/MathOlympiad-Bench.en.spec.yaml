meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathOlympiad-Bench Build Process
  description: >-
    Goedel-Prover-V2-paper-aligned human formalization, Lean compilation checks, and proof-generation evaluation for
    MathOlympiad-Bench.
  legend: >-
    Solid arrows trace Compfiles and IMOSLLean4 collection, human repair and one-theorem normalization, Lean compilation
    QC, the 360-item release, and Pass@N evaluation.
nodes:
  - id: collect
    label: |-
      Collect Formal Math Sources
      Use Compfiles
      Use IMOSLLean4
      Focus on Olympiad Problems
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: source_mix
    label: |-
      Cover Multiple Contest Sources
      158 IMO Problems
      131 IMO Shortlist Problems
      68 National · 3 Puzzles
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: human_verify
    label: |-
      Perform Human Verification
      Complete Truncated Statements
      Merge Cross-file Dependencies
      Split Multi-theorem Problems
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: pair
    label: |-
      Normalize One Problem Record
      Keep Exactly One Formal Theorem
      Pair One Informal Statement
      Preserve Assumptions · Meaning
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: repair
    label: |-
      Repair Mathlib Compatibility
      Adjust Imports · Namespaces
      Fix Types · Missing Dependencies
      Unify the Target Lean Environment
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: compile
    label: |-
      Compile-check Formal Statements
      Replace Proof with sorry
      Require Every Theorem to Compile
      Reject Syntax · Environment Errors
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: crosscheck
    label: |-
      Cross-check Benchmark Correctness
      Compare Overlap with MiniF2F
      Find at Least Three Mismatches
      Preserve the Corrected Statements
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      Release MathOlympiad-Bench
      360 Human-verified Problems
      Lean Theorem + Informal Problem
      Cover IMO 1959–2024
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: setup
    label: |-
      Configure Proof Evaluation
      Use Lean 4.9.0-rc1
      Provide Theorem · Valid Context
      Ask for a Complete Proof
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: whole_proof
    label: |-
      Generate a Whole Proof
      Allow up to 30,000 Tokens
      Submit the Candidate to Lean
      Compilation Means Success
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: correction
    label: |-
      Optionally Apply Verifier Feedback
      Return Lean Compiler Feedback
      Add up to Two Repair Rounds
      Cap Total Generation at 40,000
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: report
    label: |-
      Aggregate Formal-proof Results
      Accept Only Lean-compiling Proofs
      Report Pass@N by Sample Count
      Compare Direct · Self-corrected
    type: terminal
    size: xl
    position:
      x: 500
      'y': 420
edges:
  - from: collect
    to: source_mix
    type: primary
  - from: source_mix
    to: human_verify
    type: primary
  - from: human_verify
    to: pair
    type: primary
  - from: pair
    to: repair
    type: primary
  - from: repair
    to: compile
    type: primary
  - from: compile
    to: crosscheck
    type: primary
  - from: crosscheck
    to: release
    type: primary
  - from: release
    to: setup
    type: primary
  - from: setup
    to: whole_proof
    type: primary
  - from: whole_proof
    to: correction
    type: primary
  - from: correction
    to: report
    type: primary
modules: []
