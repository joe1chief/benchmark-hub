meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathOlympiad-Bench 构建流程
  description: 与 Goedel-Prover-V2 论文对齐地展示 MathOlympiad-Bench 的人工形式化、Lean 编译核验与证明生成评测。
  legend: 实线箭头依次表示 Compfiles 与 IMOSLLean4 汇集、人工修复和单定理规范化、Lean 编译质检、360 题发布及 Pass@N 评测。
nodes:
  - id: collect
    label: |-
      汇集形式化数学来源
      采用 Compfiles
      采用 IMOSLLean4
      聚焦奥林匹克难题
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: source_mix
    label: |-
      覆盖多类竞赛题
      IMO 正赛 158 题
      IMO 候选题 131 题
      全国赛 68 题 · 谜题 3 题
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: human_verify
    label: |-
      开展人工核验
      补齐不完整题目陈述
      合并跨文件定义与依赖
      拆分一题多定理情况
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: pair
    label: |-
      规范单题表示
      每条仅含一个形式定理
      配对对应非形式化陈述
      保留题意与假设条件
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: repair
    label: |-
      修复 Mathlib 兼容性
      调整导入与命名空间
      修正类型和缺失依赖
      统一目标 Lean 环境
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: compile
    label: |-
      编译核验形式化语句
      用 sorry 占位证明
      要求每个定理均可编译
      排除语法与环境错误
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: crosscheck
    label: |-
      交叉检查基准正确性
      与 MiniF2F 重叠题比较
      识别至少三处陈述不符
      保留本基准正确版本
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      发布 MathOlympiad-Bench
      共 360 道人工核验题
      每题含 Lean 定理与原题
      覆盖 1959–2024 年 IMO
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: setup
    label: |-
      配置证明评测环境
      使用 Lean 4.9.0-rc1
      提供定理与允许的上下文
      由模型生成完整证明
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: whole_proof
    label: |-
      运行整段证明生成
      单次上限 30,000 词元
      将候选证明交给 Lean
      编译通过即判成功
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: correction
    label: |-
      可选验证器引导修正
      返回 Lean 编译器反馈
      最多增加两轮自我修正
      总生成预算 40,000 词元
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: report
    label: |-
      汇总形式证明结果
      仅接受 Lean 编译成功证明
      按采样数报告 Pass@N
      比较直接生成与自我修正
    type: terminal
    size: xl
    position:
      x: 500
      'y': 420
edges:
  - from: collect
    to: source_mix
    type: primary
  - from: source_mix
    to: human_verify
    type: primary
  - from: human_verify
    to: pair
    type: primary
  - from: pair
    to: repair
    type: primary
  - from: repair
    to: compile
    type: primary
  - from: compile
    to: crosscheck
    type: primary
  - from: crosscheck
    to: release
    type: primary
  - from: release
    to: setup
    type: primary
  - from: setup
    to: whole_proof
    type: primary
  - from: whole_proof
    to: correction
    type: primary
  - from: correction
    to: report
    type: primary
modules: []
