meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AthenaBench-Mini Paper-Aligned Build Process
  description: >-
    Task-specific construction controls and random-seed Mini selection aligned with AthenaBench v2 Sections 3.1-3.6 and
    4.2-4.3.
  legend: >-
    Quality controls are not global: de-duplication applies only to RCM/VSP, leakage checks only to TAA, and model
    filtering plus human repair only to CKT.
nodes:
  - id: ckt_source
    label: |-
      Collect CKT Knowledge
      Authoritative CTI Sources
      Generate Five-Option MCQs
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: ckt
    label: |-
      Filter CKT with GPT-5
      Gemini Cross-Check
      Human Repair for CKT Only
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: cve_source
    label: |-
      Collect CVE and CVSS Data
      Root-Cause + Severity Fields
      Build RCM and VSP
    type: database
    size: xl
    position:
      x: 40
      'y': 230
  - id: rcm_vsp
    label: |-
      Deduplicate RCM / VSP Only
      Filter Invalid Records
      Do Not Apply Globally
    type: process
    size: xl
    position:
      x: 320
      'y': 230
  - id: taa_source
    label: |-
      Collect Threat Reports
      Actors and Techniques
      Build TAA Items
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: taa
    label: |-
      Leakage Check for TAA Only
      Inspect Actor Clues
      Keep Other Tasks Separate
    type: process
    size: xl
    position:
      x: 320
      'y': 420
  - id: rms_ate
    label: |-
      Build RMS and ATE
      Mitigations + Scenarios
      Use Their Own Procedures
    type: process
    size: xl
    position:
      x: 320
      'y': 610
  - id: full_benchmark
    label: |-
      Assemble Full AthenaBench
      8,100 Items • Six Tasks
      Preserve Task Boundaries
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: seed_candidates
    label: |-
      Apply Per-Task Rates / Quotas
      Create 10 Mini Candidates
      Use 10 Random Seeds
    type: process
    size: xl
    position:
      x: 880
      'y': 300
  - id: select_seed
    label: |-
      Select Aggregate Closest to Full
      Compare Model Performance
      Keep Prescribed Task Counts
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: mini_release
    label: |-
      Release 950 Mini Items
      CKT 300 • ATE 100 • RCM 200
      RMS 100 • VSP 200 • TAA 50
    type: database
    size: xl
    position:
      x: 1440
      'y': 300
  - id: report
    label: |-
      Evaluate Six Task Metrics
      Compare Mini with Full
      Report CTI Performance
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 300
edges:
  - from: ckt_source
    to: ckt
    type: primary
  - from: cve_source
    to: rcm_vsp
    type: primary
  - from: taa_source
    to: taa
    type: primary
  - from: ckt
    to: full_benchmark
    type: primary
  - from: rcm_vsp
    to: full_benchmark
    type: primary
  - from: taa
    to: full_benchmark
    type: primary
  - from: rms_ate
    to: full_benchmark
    type: primary
    waypoints:
      - x: 560
        'y': 660
      - x: 560
        'y': 750
      - x: 700
        'y': 750
      - x: 700
        'y': 430
  - from: full_benchmark
    to: seed_candidates
    type: primary
  - from: seed_candidates
    to: select_seed
    type: primary
  - from: select_seed
    to: mini_release
    type: primary
  - from: mini_release
    to: report
    type: primary
modules: []
