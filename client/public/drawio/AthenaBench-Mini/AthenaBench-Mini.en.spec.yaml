    type: primary
  - from: sampling_policy
    to: candidate_subsets
    type: primary
  - from: candidate_subsets
    to: representative_selection
    type: primary
  - from: representative_selection
    to: mini_release
    type: primary
  - from: mini_release
    to: model_eval
    type: primary
  - from: model_eval
    to: categorical_metrics
    type: primary
  - from: model_eval
    to: rms_metric
    type: data
  - from: model_eval
    to: vsp_metric
    type: data
  - from: categorical_metrics
    to: combined
    type: primary
  - from: rms_metric
    to: combined
    type: primary
  - from: vsp_metric
    to: combined
    type: primary
  - from: combined
    to: report
    type: primary
modules: []
