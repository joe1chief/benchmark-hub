meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedExQA Build and Evaluation Process
  description: >-
    Paper-v2 and fixed-source-aligned construction, release, and evaluation of 965 English multiple-choice questions
    with two explanations across five underrepresented medical specialties.
  legend: >-
    Paper: arXiv:2406.06331v2. Code: knowlab/MedExQA@9a5b34af. Dataset: bluesky333/MedExQA@3a9f80d6. Dashed branches
    expose non-disclosed or implementation-specific boundaries.
nodes:
  - id: specialties
    label: |-
      Define Five Underrepresented Specialties
      Biomedical Engineering · Laboratory Science
      Clinical Psychology · Occupational Therapy
      Speech-Language Pathology
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Collect English MCQs Manually
      Free-Access Mock Tests + Online Exams
      Five Professions · Explanations Inform Construction
      Retention/Rewriting Undisclosed
      60% Pass Mark Descriptive · Not a Filter
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: source_boundary
    label: |-
      Source-Provenance Boundary
      Paper Does Not Enumerate Item URLs
      Raw Counts and Source Mix Not Reported
      No Item-Level Upstream-Rights Audit Is Reported
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: exact_dedup
    label: |-
      Remove Exact Duplicates
      Deduplicate Questions
      Deduplicate Explanations
      Stage Exclusion Counts Not Reported
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: semantic_filter
    label: |-
      Remove Similar Questions
      BERT Embeddings + Cosine Similarity
      Check Semantic Near-Duplicates
      Model and Threshold Not Disclosed
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: legal_filter
    label: |-
      Exclude Law and Regulation Questions
      Manually Curated Keyword List
      List and Match Rules Not Released
      Per-Stage Rejection Count Not Reported
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: shuffle
    label: |-
      Shuffle Answer Options
      Change Original Option Positions for Fair Use
      Preserve the Correct Answer Mapping
      Algorithm and Seed Not Disclosed
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: explanation_pair
    label: |-
      Attach Two Explanations per QA Pair
      Distinct Writing Styles
      Comprehensible Reasoning for the Correct Choice
      Overall Explanation-Pair Similarity: 78.7%
    type: document
    size: xl
    position:
      x: 1700
      'y': 420
  - id: construction_validation
    label: |-
      Human-Validate Each Record
      Check the Question and Both Explanations
      Confirm Distinct Expression
      Confirm Correct, Comprehensible Reasoning
    type: user
    size: xl
    position:
      x: 1420
      'y': 420
  - id: construction_boundary
    label: |-
      Construction-Review Boundary
      Explanation Authoring or Selection Not Described
      Validator Count and Credentials Not Reported
      Assignment, Adjudication, Agreement Not Reported
    type: document
    size: xl
    position:
      x: 1140
      'y': 420
  - id: corpus
    label: |-
      Final Corpus: 965 English MCQs
      Biomedical Engineering 148 · Laboratory 377
      Clinical Psychology 111 · Occupational 194
      Speech-Language Pathology 135
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: split
    label: |-
      Split Within Every Specialty
      Development: 5 Each = 25
      Test: 143 + 372 + 106 + 189 + 130 = 940
      All Model Evaluation Uses Test Except Human Review
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: release_rights
    label: |-
      Release Dataset and Research Assets
      Dataset CC BY-NC-SA 4.0 · Noncommercial
      Models Trained on It Restricted to Research Use
      Not Validated for Clinical Decision-Making
    type: terminal
    size: xl
    position:
      x: 300
      'y': 420
  - id: models
    label: |-
      Evaluate 22 Model Rows
      18 Open Baselines + MedPhi-2
      GPT-3.5-1106 · GPT-4-1106 · GPT-4-0125
      Zero-Shot · Batch 1 · Temperature 0
    type: process
    size: xl
    position:
      x: 20
      'y': 420
  - id: evaluation_arm
    label: |-
      Evaluation Arm?
      Next-Token Classification
      or Chat Answer + Explanation
    type: decision
    size: xl
    position:
      x: 20
      'y': 820
  - id: logits
    label: |-
      Next-Token Logits Classification
      Exclude Three GPT APIs Without Logits
      Gather Probabilities for A · B · C · D
      Select the Highest-Probability Token
    type: process
    size: xl
    position:
      x: 300
      'y': 660
  - id: chat_generation
    label: |-
      Generate Chat Answer and Explanation
      Released Runner: Greedy Decode
      No Sampling · Up to 300 New Tokens
      Pass generated_text Directly to Parser
    type: process
    size: xl
    position:
      x: 300
      'y': 980
  - id: chat_parser
    label: |-
      Parse Chat Answer to A-D
      Replace Option Text · Regex Answer Patterns
      First Standalone Letter · thefuzz Fallback
      No Abstain State After Fuzzy Fallback
    type: process
    size: xl
    position:
      x: 580
      'y': 980
  - id: chat_correct
    label: |-
      Parsed Choice
      Equals Gold?
    type: decision
    size: xl
    position:
      x: 860
      'y': 980
  - id: answer_accuracy
    label: |-
      Compute Answer Accuracy
      Exact A-D Equality per Item
      Report Each Specialty
      Paper Reports Five-Specialty Macro Average
    type: process
    size: xl
    position:
      x: 860
      'y': 660
  - id: explanation_metrics
    label: |-
      Score the Generated Explanation
      BLEU · ROUGE-L · METEOR
      SciBERT BERTScore via evaluate
      Compare Against Two References
    type: process
    size: xl
    position:
      x: 1140
      'y': 880
  - id: explanation_zero
    label: |-
      Force All Explanation Metrics to Zero
      Required When String-Matched Answer Is Wrong
      Wrong Rationale Cannot Earn Partial Credit
    type: process
    size: xl
    position:
      x: 1140
      'y': 1100
  - id: human_evaluation
    label: |-
      Human Rubric on 25 Dev Items
      Three Health MSc Annotators
      0: Wrong / Missing / Irrelevant
      0.5: Right Answer / Flawed Rationale
      1: Answer and Rationale Correct
    type: process
    size: xl
    position:
      x: 1420
      'y': 1080
  - id: human_boundary
    label: |-
      Human-Review Boundary
      Assignment and Raters per Item Not Reported
      Score Aggregation Not Reported
      Adjudication and Agreement Not Reported
    type: document
    size: xl
    position:
      x: 1420
      'y': 1440
  - id: report
    label: |-
      Report Results
      Answer · Explanation · Human
      Five-Specialty Macro Average
      Correlation with Human Scores
      One Ref .9347 · Two Refs .9385
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 820
  - id: implementation_boundary
    label: |-
      Released-Code Boundary
      Per-Specialty CSVs; Existing CSV Is Reused
      No Explanation, Human, or Macro Pipeline
      No Error, Missing-Row, Version, or Reference-Reduction Policy
    type: document
    size: xl
    position:
      x: 1700
      'y': 1160
