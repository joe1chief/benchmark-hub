meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedExQA Build and Evaluation Process
  description: >-
    Paper- and repository-aligned construction of 965 multiple-choice medical questions with two validated explanations
    across five underrepresented specialties, followed by answer and explanation evaluation.
  legend: >-
    Five examples per specialty form a 25-item development set and the remaining 940 form the test set; explanation
    scores are set to zero whenever the answer classification is wrong.
nodes:
  - id: specialties
    label: |-
      Define Five Specialties
      Biomedical Engineering
      Laboratory Science · Psychology
      Occupational and Speech Therapy
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: collect
    label: |-
      Collect Public Exam Questions
      Free Online Mock Tests and Exams
      Tailored to Each Profession
      Retain Explanations When Available
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: dedup
    label: |-
      Remove Exact Duplicates
      Deduplicate Questions
      Deduplicate Explanations
      Preserve One Clean QA Record
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: semantic
    label: |-
      Filter Semantically Similar Items
      Encode Questions with BERT
      Compare Cosine Similarity
      Remove Near-duplicate Questions
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: legal
    label: |-
      Exclude Law and Regulation Items
      Use a Manually Defined Keyword List
      Remove Jurisdiction-specific Content
      Retain Transferable Medical Knowledge
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: shuffle
    label: |-
      Shuffle Answer Options
      Change Original Option Positions
      Protect Fair Use and Test Integrity
      Preserve the Correct Label Mapping
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: explanations
    label: |-
      Provide Two Explanations per QA
      Use Distinct Writing Styles
      Explain the Correct Answer
      Keep Both References Comprehensible
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: validation
    label: |-
      Human-validate Every Record
      Check Question and Both Explanations
      Confirm Distinct Expression
      Confirm Correct Medical Reasoning
    type: user
    size: xl
    position:
      x: 1460
      'y': 420
  - id: corpus
    label: |-
      Form 965 English MCQs
      BME 148 · Lab 377 · Psychology 111
      Occupational Therapy 194
      Speech Language Pathology 135
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      Create Development and Test Sets
      Five Dev Examples per Specialty
      Development = 25
      Test = 940
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: models
    label: |-
      Evaluate 22 Models
      18 Open Baselines · Three GPT Models
      Include MedPhi-2
      Zero-shot · Batch One · Temperature Zero
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: answer
    label: |-
      Parse Answer Classification
      Base Models Use Next-token Logits
      Chat Models Use Regex and Fuzzy Match
      Compare Choice with Gold
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics
    label: |-
      Score Generated Explanations
      BLEU · ROUGE-L · METEOR
      SciBERT BERTScore
      Assign Zero if Answer Is Wrong
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Human-validate and Report
      Three MSc Health Annotators
      Score 25 Dev Items as 0 · 0.5 · 1
      Correlate Human and Automatic Metrics
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: specialties
    to: collect
    type: primary
  - from: collect
    to: dedup
    type: primary
  - from: dedup
    to: semantic
    type: primary
  - from: semantic
    to: legal
    type: primary
  - from: legal
    to: shuffle
    type: primary
  - from: shuffle
    to: explanations
    type: primary
  - from: explanations
    to: validation
    type: primary
  - from: validation
    to: corpus
    type: primary
  - from: corpus
    to: split
    type: primary
  - from: split
    to: models
    type: primary
  - from: models
    to: answer
    type: primary
  - from: answer
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
