meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedExQA 构建与评测流程
  description: 对齐论文与官方仓库，在五个代表不足的医学专业中构建 965 道多选题，每题配两份人工核验解释， 再分别评估答案分类和解释生成。
  legend: 每个专业抽取五条组成 25 条开发集，其余 940 条组成测试集；只要答案分类错误， 对应解释指标统一记为零。
nodes:
  - id: specialties
    label: |-
      定义五个医学专业
      生物医学工程
      临床检验科学 · 临床心理学
      作业治疗与言语语言病理学
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: collect
    label: |-
      收集公开考试题
      免费在线模拟测试与考试
      面向各专业资格需求
      可用时保留原始解释
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: dedup
    label: |-
      移除完全重复项
      对问题去重
      对解释去重
      每项保留一条干净记录
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: semantic
    label: |-
      过滤语义近似题
      使用 BERT 编码问题
      比较余弦相似度
      移除近重复题目
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: legal
    label: |-
      排除法律法规题
      使用人工定义关键词表
      移除特定司法辖区内容
      保留可迁移医学知识
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: shuffle
    label: |-
      打乱答案选项
      改变原始选项位置
      维护合理使用与测试完整性
      同步保留正确标签映射
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: explanations
    label: |-
      每题提供两份解释
      采用不同写作风格
      说明正确答案
      两份参考均需清晰可懂
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: validation
    label: |-
      人工核验每条记录
      检查问题与两份解释
      确认表达方式不同
      确认医学推理正确
    type: user
    size: xl
    position:
      x: 1460
      'y': 420
  - id: corpus
    label: |-
      形成 965 道英文多选题
      生医工 148 · 检验 377 · 心理 111
      作业治疗 194
      言语语言病理 135
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      划分开发集与测试集
      每个专业取五条开发样本
      开发集 = 25
      测试集 = 940
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: models
    label: |-
      评测 22 个模型
      18 个开放基线 · 三个 GPT 模型
      加入 MedPhi-2
      零样本 · 批量一 · 温度零
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: answer
    label: |-
      解析答案分类
      基础模型使用下一词元 logits
      聊天模型用正则与模糊匹配
      将选项与标准答案比较
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics
    label: |-
      评估生成解释
      BLEU · ROUGE-L · METEOR
      SciBERT BERTScore
      答案错误则解释得分为零
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      人工验证并报告
      三名健康相关硕士标注员
      对 25 条开发样本评分 0 · 0.5 · 1
      计算人工与自动指标相关性
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: specialties
    to: collect
    type: primary
  - from: collect
    to: dedup
    type: primary
  - from: dedup
    to: semantic
    type: primary
  - from: semantic
    to: legal
    type: primary
  - from: legal
    to: shuffle
    type: primary
  - from: shuffle
    to: explanations
    type: primary
  - from: explanations
    to: validation
    type: primary
  - from: validation
    to: corpus
    type: primary
  - from: corpus
    to: split
    type: primary
  - from: split
    to: models
    type: primary
  - from: models
    to: answer
    type: primary
  - from: answer
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
