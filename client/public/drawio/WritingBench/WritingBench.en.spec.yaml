meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WritingBench Query Construction and Dynamic-Criteria Evaluation
  description: >-
    WritingBench creates a six-domain, 100-subdomain taxonomy, drafts and diversifies queries with GPT-4o and
    Claude-3.5-Sonnet, has 30 trained annotators collect and clean supporting materials, and uses five experts to
    filter, adapt, prune, and cross-validate the final 1,000 bilingual queries. Claude-3.7 generates exactly five
    query-specific criteria, humans review them, and Claude-3.7 or the 155K-item Qwen2.5-7B critic scores each criterion
    from 1 to 10; the five scores are averaged.
  legend: >-
    Source: WritingBench arXiv:2503.05244v4, Figure 2, Sections 3.1.1-3.1.2, Table 2, Sections 3.2-3.3, Section 4.1,
    Table 4, and Appendices A.3, A.5.2, B, and C.2-C.6; official repository https://github.com/X-PLUG/WritingBench.
    Version pin: current/paper-v4 1,000-query release, not the initial 1,239-query snapshot. Section 3.3 24K-to-12K SFT
    selection is downstream validation, not benchmark construction.. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
