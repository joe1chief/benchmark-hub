meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WritingBench 查询构建与动态标准评测流程
  description: >-
    WritingBench建立6个领域、100个子域的分类体系，用GPT-4o与Claude-3.5-Sonnet起草并多维化查询，由30名受训标注员收集清洗辅助材料，再由5名专家筛选、适配、裁剪与交叉验证，形成1000条双语查询。Claude-3.7为每题生成恰好5条实例标准并经人工复核，随后由Claude-3.7或基于约155K样例微调的Qwen2.5-7B评论模型逐标准打1至10分并取五项均值。
  legend: >-
    来源：WritingBench arXiv:2503.05244v4, Figure 2, Sections 3.1.1-3.1.2, Table 2, Sections 3.2-3.3, Section 4.1, Table 4,
    and Appendices A.3, A.5.2, B, and C.2-C.6; official repository https://github.com/X-PLUG/WritingBench. Version pin:
    current/paper-v4 1,000-query release, not the initial 1,239-query snapshot. Section 3.3 24K-to-12K SFT selection is
    downstream validation, not benchmark construction.。实线箭头表示论文或官方资料明确支持的主流程。
