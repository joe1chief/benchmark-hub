meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScreenSpot Build and Evaluation Process
  description: >-
    ScreenSpot is the original GUI-grounding benchmark introduced with SeeClick, not ScreenSpot-Pro. Four experienced
    computer-science annotators are assigned mobile, desktop, or web GUI types, capture screenshots during routine use,
    annotate frequently used clickable regions with bounding boxes, and write English commands. Mobile and desktop cases
    use common apps and operations; web cases cover development, shopping, forum, and tool sites from WebArena.
    Interfaces and elements are English, and personal information is removed. The final benchmark contains over 600
    screenshots and more than 1,200 instructions across iOS, Android, macOS, Windows, and web, with text and icon/widget
    labels. Models receive a screenshot and instruction; output coordinates, or bounding-box centers, become predicted
    points. Click accuracy counts a hit when the point falls inside the ground-truth box and is reported by platform and
    element type.
  legend: >-
    Source: SeeClick arXiv:2401.10935 Section 4 and Appendix B; official njucckevin/SeeClick repository. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
