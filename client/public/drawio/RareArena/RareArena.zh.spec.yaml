meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "RareArena 构建与评测流程"
  description: "RareArena建立在PMC-Patients病例摘要之上，并在已披露的数据处理阶段使用GPT-4o。流程筛选罕见病病例、抽取诊断、用CODER术语向量映射到Orphanet、删除映射失败病例，再截断和改写病例文本以避免诊断泄漏。罕见病筛查在决定性诊断检查前截断，罕见病确认在最终诊断前截断，并继续移除残余泄漏。最终资源覆盖近5万名患者和4000多种疾病。模型返回5个诊断，GPT-4o把同义词和上位词与标准疾病对齐，报告Top-1与Top-5召回率。"
  legend: "来源：The Lancet Digital Health 2026 article, cross-checked against zhao-zy15/RareArena README Data Collection and evaluation description。实线箭头表示论文或官方资料明确支持的主流程。"
