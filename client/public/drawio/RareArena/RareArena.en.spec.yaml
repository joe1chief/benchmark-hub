  layout: horizontal
  routing: orthogonal
  title: "RareArena Build and Evaluation Process"
  description: "RareArena builds on PMC-Patients case summaries and uses GPT-4o for the disclosed data-processing stages. Rare-disease cases are filtered, their diagnoses are extracted and mapped to Orphanet with CODER term embeddings, unmapped cases are removed, and case text is truncated and rephrased to prevent diagnosis leakage. Rare Disease Screening stops before decisive diagnostic tests, while Rare Disease Confirmation stops before the final diagnosis; residual leakage is removed. The resulting resource covers nearly 50,000 patients and more than 4,000 diseases. Models return five diagnoses, GPT-4o aligns synonyms and hypernyms to the gold disease, and Top-1 and Top-5 recall are reported."
  legend: "Source: The Lancet Digital Health 2026 article, cross-checked against zhao-zy15/RareArena README Data Collection and evaluation description. Solid arrows show the main flow explicitly supported by the paper or official documentation."
