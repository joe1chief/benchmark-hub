meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RareArena Paper-aligned Construction and Evaluation Process
  description: >-
    Lancet Digital Health workflow from the June 2024 PubMed Central release through candidate extraction, diagnostic
    filtering, Orphanet mapping, separate pre-test and post-test task construction, human quality review, primary
    zero-shot evaluation, and a 500-case prompt-method analysis.
  legend: >-
    Solid arrows show the paper pipeline. Dashed arrows isolate evidence, mapping audit, release history, post-paper
    evaluator and sampled-subset drift, and license boundaries.
