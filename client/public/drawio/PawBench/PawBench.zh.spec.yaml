meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PawBench 构建与评测流程
  description: 基于固定官方仓库重构Reuse and Tag任务构建、统一任务与harness契约、Model×Harness执行、 三种评分模式、聚合、切片分析与诊断发布流程。
  legend: 实线表示官方披露的构建、执行、评分或发布阶段；虚线表示来源、发布、提示词、harness、裁判与许可边界， 不代表额外的基准步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方仓库证据
      Git 0f794a8bb6c2
      README e8a4267d3800
      任务树 b90ac4523b14
    type: document
    size: xl
    position:
      x: 20
      'y': 320
  - id: coeval_unit
    label: |-
      定义联合评测单元
      Agent Performance = f(Model, Harness)
      按Model×Harness×Task评测
      固定同一任务定义
    type: document
    size: xl
    position:
      x: 280
      'y': 320
  - id: reuse_sources
    label: |-
      复用六类任务来源
      ClawEval 52 · QwenClawBench 29
      PinchBench 23 · 自建21
      SkillsBench 15 · WildClawBench 10
    type: database
    size: xl
    position:
      x: 540
      'y': 320
  - id: normalize_tasks
    label: |-
      规范化各来源任务
      每题一个Markdown与YAML头
      统一提示词与工作区字段
      统一评分器与结果接口
    type: process
    size: xl
    position:
      x: 800
      'y': 320
  - id: task_contract
    label: |-
      封装任务契约
      提示词 · 期望行为 · 评分标准
      检查器代码或大模型裁判规则
      工作区文件 · 任务超时
    type: document
    size: xl
    position:
      x: 1060
      'y': 320
  - id: taxonomy
    label: |-
      应用五维正交标签
      场景 · 能力 · 复杂度
      模态 · 环境
      每题保留来源身份
    type: process
    size: xl
    position:
      x: 1320
      'y': 320
  - id: fixed_release
    label: |-
      固定PawBench-v1.0任务树
      150题且任务ID唯一
      hybrid 120题 · automated 15题
      LLM judge 15题
    type: database
    size: xl
    position:
      x: 1580
      'y': 320
  - id: harness_versions
    label: |-
      构建三套Harness镜像
      QwenPaw 1.1.3
      OpenClaw 2026.4.24
      Hermes 2026.4.23
    type: process
    size: xl
    position:
      x: 1840
      'y': 320
  - id: model_harness_grid
    label: |-
      形成基线运行网格
      9个模型 · 3个Harness · 150题
      27组模型与Harness提交
      配置4,050个任务单元
    type: process
    size: xl
    position:
      x: 2100
      'y': 320
  - id: prepare_workspace
    label: |-
      准备隔离工作区
      启动指定Docker Harness
      清理旧文件并放入声明文件
      创建output与sessions目录
    type: process
    size: xl
    position:
      x: 2360
      'y': 320
  - id: execute_agent
    label: |-
      执行Agent任务
      发送任务专属提示词
      执行任务超时限制
      捕获Harness轨迹
    type: process
    size: xl
    position:
      x: 2620
      'y': 320
  - id: collect_evidence
    label: |-
      收集执行证据
      工作区 · 轨迹 · 用量 · 日志
      保留任务状态与耗时
      可选保存工作区或Docker镜像
    type: database
    size: xl
    position:
      x: 2880
      'y': 320
  - id: grading_gate
    label: |-
      选择评分模式
      自动检查器
      大模型裁判
      检查器与裁判混合
    type: decision
    size: xl
    position:
      x: 3140
      'y': 320
  - id: automated_grade
    label: |-
      执行自动评分
      提取内嵌Python grade代码
      运行任务专属检查
      平均数值型标准得分
    type: process
    size: xl
    position:
      x: 3400
      'y': 80
  - id: llm_grade
    label: |-
      执行大模型裁判评分
      输入任务提示与期望行为
      加入规则与轨迹摘要
      只接受一个JSON评分对象
    type: process
    size: xl
    position:
      x: 3400
      'y': 320
  - id: hybrid_grade
    label: |-
      合并混合评分
      使用每题声明的权重
      自动分低于0.75时裁判贡献归零
      检测到运行中API故障时例外
    type: process
    size: xl
    position:
      x: 3400
      'y': 560
  - id: normalize_score
    label: |-
      规范化任务结果
      得分保持在0至1
      仅满分视为通过
      保留标准明细与备注
    type: process
    size: xl
    position:
      x: 3660
      'y': 320
  - id: aggregate
    label: |-
      聚合模型与Harness提交
      平均每题结果
      统计错误与缺失任务
      保留自动与裁判分区
    type: process
    size: xl
    position:
      x: 3920
      'y': 320
  - id: slices
    label: |-
      构建诊断切片
      来源 · 场景 · 能力
      复杂度 · 模态 · 环境
      评分类型 · 模型 · Harness
    type: database
    size: xl
    position:
      x: 4180
      'y': 320
  - id: diagnose
    label: |-
      诊断模型与Harness差异
      固定模型比较Harness
      固定Harness比较模型
      检查失败样例与任务轨迹
    type: process
    size: xl
    position:
      x: 4440
      'y': 320
  - id: no_paper_boundary
    label: |-
      方法来源边界
      尚无独立论文发布
      官方仓库与项目网站
      是主要方法来源
    type: document
    size: xl
    position:
      x: 20
      'y': 760
  - id: release_boundary
    label: |-
      固定发布边界
      没有Git标签或GitHub Release
      固定提交0f794a8bb6c2
      仓库采用Apache-2.0许可
    type: document
    size: xl
    position:
      x: 1580
      'y': 760
  - id: prompt_boundary
    label: |-
      提示词与解析器边界
      每题提示词与评分规则公开
      不存在单一全局推理提示词
      未披露统一答案解析器
    type: document
    size: xl
    position:
      x: 1060
      'y': 760
  - id: compatibility_boundary
    label: |-
      Harness可比性契约
      相同任务提示 · 工作区 · 超时
      相同轨迹与结果结构
      各Harness适配器保持独立
    type: document
    size: xl
    position:
      x: 1840
      'y': 1040
  - id: judge_boundary
    label: |-
      裁判版本边界
      README基线：Claude Opus 4.6
      代码默认：4-5-20251101
      运行配置可以覆盖默认值
    type: document
    size: xl
    position:
      x: 3400
      'y': 1040
  - id: license_boundary
    label: |-
      许可与资产边界
      PawBench代码采用Apache-2.0
      复用任务保留来源信息
      外部资产沿用上游权利
    type: document
    size: xl
    position:
      x: 280
      'y': 760
  - id: baseline_boundary
    label: |-
      发布固定基线快照
      27组提交即9模型×3 Harness
      快照日期为2026年5月29日
      结果数值不是构建要求
    type: terminal
    size: xl
    position:
      x: 4440
      'y': 760
