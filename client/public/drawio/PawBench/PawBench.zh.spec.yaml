meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PawBench 构建与评测流程
  description: 依据官方仓库重绘 PawBench v1.0 的复用与标注、统一任务合同、模型与 Harness 联合运行、 自动及模型评分、排行榜切片和 Harness 差距诊断流程。
  legend: PawBench v1.0 在相同 150 个任务上联合评测 9 个模型与 3 个 Agent Harness；因未发布独立论文， 官方仓库是本图的方法学主来源。
nodes:
  - id: step_1
    label: |-
      定义联合评测单元
      模型 × Harness × 任务
      区分模型与运行时影响
      保持同一可比任务合同
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      复用六类任务来源
      ClawEval 52 · QwenClawBench 29
      PinchBench 23 · SkillsBench 15
      WildClawBench 10 · 自建 21
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      汇总并标准化 150 个任务
      把来源转换为统一任务格式
      保留提示词与工作区合同
      使评分器可跨 Harness 运行
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      标注五个正交维度
      场景 · 能力 · 复杂度
      模态 · 环境
      复杂度分 L1 L2 或 L3
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      封装每个任务页面
      提示词与预期行为
      评分标准与检查器代码
      Rubric · 工作区文件 · 元数据
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      集成三个 Harness
      QwenPaw · OpenClaw · Hermes
      只适配 Agent 运行时
      暴露相同任务接口
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      强制 Harness 兼容合同
      相同提示词与工作区合同
      相同超时与轨迹格式
      相同最终结果结构
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      交叉运行 9 模型与 3 Harness
      执行每个已配置任务组合
      固定任务定义
      将变化归因于模型或运行时
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      执行任务并保存证据
      记录完整轨迹与指标
      可选保留最终工作区
      可选保留 Docker 镜像
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      选择官方评分模式
      自动检查器
      LLM Judge
      检查器与 Judge 混合
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      评定任务结果
      运行确定性检查器代码
      应用任务专属 LLM Rubric
      Judge 基线 Claude Opus 4.6
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      聚合可比结果
      将任务结果转换为百分比
      计算模型与 Harness 总分
      保留逐任务证据
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      发布排行榜切片
      来源 · 场景 · 能力
      复杂度 · 模态 · 环境
      评分类型 · 模型 · Harness
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      诊断 Harness 差距
      固定 Harness 比较模型
      固定模型比较 Harness
      检查轨迹与评分失败
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
