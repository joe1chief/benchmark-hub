meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PawBench Build and Evaluation Process
  description: >-
    Fixed-repository reconstruction of Reuse and Tag task construction, common task and harness contracts, Model by
    Harness execution, three grading modes, aggregation, slice analysis, and diagnostic publication.
  legend: >-
    Solid arrows are disclosed construction, execution, scoring, or publication stages. Dashed arrows identify source,
    release, prompt, harness, judge, and license boundaries; they are not additional benchmark stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Repository Evidence
      Git 0f794a8bb6c2
      README e8a4267d3800
      Task tree b90ac4523b14
    type: document
    size: xl
    position:
      x: 20
      'y': 320
  - id: coeval_unit
    label: |-
      Define the Co-evaluation Unit
      Agent Performance = f(Model, Harness)
      Evaluate Model by Harness by Task
      Hold the same task definition fixed
    type: document
    size: xl
    position:
      x: 280
      'y': 320
  - id: reuse_sources
    label: |-
      Reuse Six Task Sources
      ClawEval 52 · QwenClawBench 29
      PinchBench 23 · self-built 21
      SkillsBench 15 · WildClawBench 10
    type: database
    size: xl
    position:
      x: 540
      'y': 320
  - id: normalize_tasks
    label: |-
      Normalize Every Source Task
      One Markdown file with YAML front matter
      Common prompt and workspace fields
      Common grader and result interfaces
    type: process
    size: xl
    position:
      x: 800
      'y': 320
  - id: task_contract
    label: |-
      Package the Task Contract
      Prompt · expected behavior · criteria
      Checker code or LLM judge rubric
      Workspace files · task timeout
    type: document
    size: xl
    position:
      x: 1060
      'y': 320
  - id: taxonomy
    label: |-
      Apply Five Orthogonal Labels
      Scenario · capability · complexity
      Modality · environment
      Keep source identity for every task
    type: process
    size: xl
    position:
      x: 1320
      'y': 320
  - id: fixed_release
    label: |-
      Freeze the PawBench-v1.0 Task Tree
      150 tasks with unique task IDs
      120 hybrid · 15 automated
      15 LLM judge tasks
    type: database
    size: xl
    position:
      x: 1580
      'y': 320
  - id: harness_versions
    label: |-
      Build Three Harness Images
      QwenPaw 1.1.3
      OpenClaw 2026.4.24
      Hermes 2026.4.23
    type: process
    size: xl
    position:
      x: 1840
      'y': 320
  - id: model_harness_grid
    label: |-
      Form the Baseline Run Grid
      9 models · 3 harnesses · 150 tasks
      27 model-harness submissions
      4,050 configured task cells
    type: process
    size: xl
    position:
      x: 2100
      'y': 320
  - id: prepare_workspace
    label: |-
      Prepare an Isolated Workspace
      Start the selected Docker harness
      Clean workspace and stage declared files
      Create output and sessions directories
    type: process
    size: xl
    position:
      x: 2360
      'y': 320
  - id: execute_agent
    label: |-
      Execute the Agent Task
      Send the task-specific prompt
      Enforce the task timeout
      Capture the harness transcript
    type: process
    size: xl
    position:
      x: 2620
      'y': 320
  - id: collect_evidence
    label: |-
      Collect Execution Evidence
      Workspace · transcript · usage · logs
      Retain task status and elapsed time
      Optionally save workspace or Docker image
    type: database
    size: xl
    position:
      x: 2880
      'y': 320
  - id: grading_gate
    label: |-
      Which Grading Mode?
      Automated checker
      LLM judge
      Hybrid checker plus judge
    type: decision
    size: xl
    position:
      x: 3140
      'y': 320
  - id: automated_grade
    label: |-
      Run Automated Grading
      Extract embedded Python grade code
      Execute task-specific checks
      Average numeric criterion scores
    type: process
    size: xl
    position:
      x: 3400
      'y': 80
  - id: llm_grade
    label: |-
      Run LLM-judge Grading
      Include task prompt and expected behavior
      Add rubric and transcript summary
      Require one JSON score object
    type: process
    size: xl
    position:
      x: 3400
      'y': 320
  - id: hybrid_grade
    label: |-
      Combine Hybrid Grades
      Apply each task's declared weights
      Below 0.75 zeroes the LLM contribution
      Except a detected mid-run API failure
    type: process
    size: xl
    position:
      x: 3400
      'y': 560
  - id: normalize_score
    label: |-
      Normalize the Task Outcome
      Keep scores on the 0 to 1 scale
      Treat a perfect score as pass
      Preserve criterion breakdown and notes
    type: process
    size: xl
    position:
      x: 3660
      'y': 320
  - id: aggregate
    label: |-
      Aggregate a Model-harness Submission
      Average per-task outcomes
      Count errors and missing tasks
      Preserve automated and judge partitions
    type: process
    size: xl
    position:
      x: 3920
      'y': 320
  - id: slices
    label: |-
      Build Diagnostic Slices
      Source · scenario · capability
      Complexity · modality · environment
      Grading type · model · harness
    type: database
    size: xl
    position:
      x: 4180
      'y': 320
  - id: diagnose
    label: |-
      Diagnose Model and Harness Gaps
      Fix a model and compare harnesses
      Fix a harness and compare models
      Inspect failures and task traces
    type: process
    size: xl
    position:
      x: 4440
      'y': 320
  - id: no_paper_boundary
    label: |-
      Methodology-source Boundary
      No standalone paper is published
      Official repository and project site
      Are the primary methodology sources
    type: document
    size: xl
    position:
      x: 20
      'y': 760
  - id: release_boundary
    label: |-
      Fixed-release Boundary
      No Git tag and no GitHub release exist
      Pin commit 0f794a8bb6c2
      Repository license is Apache-2.0
    type: document
    size: xl
    position:
      x: 1580
      'y': 760
  - id: prompt_boundary
    label: |-
      Prompt and Parser Boundary
      Task prompts and rubrics are public
      No single global inference prompt exists
      No common answer parser is disclosed
    type: document
    size: xl
    position:
      x: 1060
      'y': 760
  - id: compatibility_boundary
    label: |-
      Harness-comparability Contract
      Same task prompt · workspace · timeout
      Same transcript and result schema
      Harness adapters remain distinct
    type: document
    size: xl
    position:
      x: 1840
      'y': 1040
  - id: judge_boundary
    label: |-
      Judge-version Boundary
      README baseline: Claude Opus 4.6
      Code default: 4-5-20251101
      Runtime configuration can override it
    type: document
    size: xl
    position:
      x: 3400
      'y': 1040
  - id: license_boundary
    label: |-
      License and Asset Boundary
      PawBench code is Apache-2.0
      Reused tasks retain source provenance
      External assets keep upstream rights
    type: document
    size: xl
    position:
      x: 280
      'y': 760
  - id: baseline_boundary
    label: |-
      Publish the Fixed Baseline Snapshot
      27 submissions = 9 models by 3 harnesses
      Snapshot dated May 29 2026
      Results are not construction requirements
    type: terminal
    size: xl
    position:
      x: 4440
      'y': 760
