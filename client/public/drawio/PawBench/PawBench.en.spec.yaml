  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PawBench Build and Evaluation Process
  description: >-
    Official repository-aligned Reuse and Tag construction, common task contract, Model by Harness execution, automated
    and LLM grading, leaderboard slicing, and harness-gap diagnosis for PawBench v1.0.
  legend: >-
    PawBench v1.0 evaluates 9 models in 3 agent harnesses on the same 150 tasks; the repository is the primary
    methodology source because no standalone paper is published.
