meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PrOntoQA Build and Formal Evaluation Process
  description: >-
    ICLR-paper-aligned synthesis of uniquely provable modus-ponens questions, shortcut-controlled natural-language
    rendering, eight-shot greedy evaluation, and symbolic reconstruction of predicted chains of thought.
  legend: >-
    Solid arrows reproduce the paper pipeline. Dashed arrows isolate the paper-matched v1 code snapshot and its
    Apache-2.0 license from later PrOntoQA-OOD development.
nodes:
  - id: source_evidence
    label: |-
      Fixed Source Evidence
      arXiv 2210.01240v4
      PDF SHA-256 8e0502fa3b6b
      Paper-code v1 066f73fc70bf
      Reviewed Paper plus Fixed Branch
    type: document
    size: xl
    position:
      x: 20
      'y': 40
    style:
      fontSize: 9
  - id: task_scope
    label: |-
      Define the Controlled Reasoning Task
      Repeated Modus Ponens Only
      Proof Calculus Uses Ax and Hop
      Require One Unique Gold Proof
    type: document
    size: xl
    position:
      x: 260
      'y': 40
    style:
      fontSize: 9
  - id: ontology_types
    label: |-
      Choose an Ontology Type
      Fictional Names Avoid Pretraining Knowledge
      True Uses Three Hand-coded Real Ontologies
      False Randomizes Real Concept Names
    type: process
    size: xl
    position:
      x: 500
      'y': 40
    style:
      fontSize: 9
  - id: linear_ontology
    label: |-
      Generate a Linear Hierarchical Ontology
      Randomly Vary from 3 to 10 Concepts
      Every Node Has Zero or One Child
      Add Subtype Relations and Properties
    type: database
    size: xl
    position:
      x: 740
      'y': 40
    style:
      fontSize: 9
  - id: controlled_grammar
    label: |-
      Render the Ontology with Simple Grammar
      Translate Every Edge and Property
      Use Syntactic Variants
      Preserve an Easy Unique Inverse Parse
    type: process
    size: xl
    position:
      x: 980
      'y': 40
    style:
      fontSize: 9
  - id: context_order
    label: |-
      Order the Ontology Context First
      Traverse Preorder for Top-down
      Traverse Postorder for Bottom-up
      Finish Ordering before Any Distractor
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
    style:
      fontSize: 9
  - id: shortcut_audit
    label: |-
      Audit the Label Shortcut
      Without Distractors Labels Are Nearly Perfect
      Queried Property Mention Reveals Polarity
      Remove This Non-reasoning Heuristic
    type: process
    size: xl
    position:
      x: 1460
      'y': 200
    style:
      fontSize: 9
  - id: distractor
    label: |-
      Insert a Counter-shortcut Distractor
      Use the Generated Proof Conclusion Property
      Negate It on a Disconnected Novel Concept
      Insert the Sentence at a Random Position
    type: process
    size: xl
    position:
      x: 1700
      'y': 200
    style:
      fontSize: 9
  - id: seed_axiom
    label: |-
      Seed the Formal Proof
      Choose a Starting Node Uniformly
      Assign One Entity to That Concept
      Create the Initial Type Axiom
    type: process
    size: xl
    position:
      x: 980
      'y': 360
    style:
      fontSize: 9
  - id: proof_walk
    label: |-
      Walk Up the Ontology Tree
      Apply One Deduction Rule per Hop
      Stop at a Node or Node Property
      Match Target Proof Length · Test 1 3 5
    type: process
    size: xl
    position:
      x: 1220
      'y': 360
    style:
      fontSize: 9
  - id: query_polarity
    label: |-
      Render the Entity Fact and Query
      State the Initial Axiom in Natural Language
      With Probability 0.5 Ask Conclusion
      or Its Negation as True or False
    type: process
    size: xl
    position:
      x: 1460
      'y': 360
    style:
      fontSize: 9
  - id: gold_cot
    label: |-
      Render the Gold Chain of Thought
      Keep the Ordered Formal Proof
      Translate Each Step Conclusion
      Emit One Sentence per Proof Step
    type: process
    size: xl
    position:
      x: 1460
      'y': 520
    style:
      fontSize: 9
  - id: example_record
    label: |-
      Assemble One Synthetic Example
      Context · Query · Gold CoT · Label
      Keep a One-to-one Proof Mapping
      Generate Examples on Demand
    type: database
    size: xl
    position:
      x: 1940
      'y': 360
    style:
      fontSize: 9
  - id: experiment_controls
    label: |-
      Set the Paper Experiment Variables
      1 · 3 · 5 Hops
      Top-down or Bottom-up Context
      Fictional · True · False Ontology
    type: process
    size: xl
    position:
      x: 2180
      'y': 360
    style:
      fontSize: 9
  - id: eight_shot
    label: |-
      Build an Eight-shot CoT Prompt
      Eight Independently Generated
      Fully Labeled Demonstrations
      Append One Unlabeled Test Example
    type: process
    size: xl
    position:
      x: 2420
      'y': 360
    style:
      fontSize: 9
  - id: greedy_decode
    label: |-
      Decode the CoT and Binary Label
      Use Greedy Decoding
      text-ada-001 through text-curie-001
      davinci · text-davinci-001 · text-davinci-002
    type: process
    size: xl
    position:
      x: 2660
      'y': 360
    style:
      fontSize: 9
  - id: response_split
    label: |-
      Split the Model Response
      Recover Predicted CoT Sentences
      Recover Final True or False Label
      Compare Label with Gold Separately
    type: process
    size: xl
    position:
      x: 2900
      'y': 360
    style:
      fontSize: 9
  - id: semantic_parser
    label: |-
      Parse Predicted CoT Symbolically
      Apply Recursive-descent Grammar
      Recover a Sequence of Logical Forms
      Mark Unparseable Steps Incorrect
    type: process
    size: xl
    position:
      x: 3140
      'y': 360
    style:
      fontSize: 9
  - id: step_validity
    label: |-
      Classify Step Validity
      Strictly-valid Uses Gold Rules
      Broadly-valid Uses the Added Calculus
      Otherwise Mark the Step Invalid
    type: process
    size: xl
    position:
      x: 3380
      'y': 180
    style:
      fontSize: 9
  - id: step_atomicity
    label: |-
      Classify Step Atomicity
      Atomic Means One Rule Application
      Non-atomic Skips Intermediate Steps
      Apply This Split to Strict Steps
    type: process
    size: xl
    position:
      x: 3380
      'y': 360
    style:
      fontSize: 9
  - id: step_utility
    label: |-
      Classify Step Utility
      Gold-proof Premises plus Off-path Conclusion
      Means a Misleading Step
      Otherwise Mark It Correct
    type: process
    size: xl
    position:
      x: 3380
      'y': 540
    style:
      fontSize: 9
  - id: proof_path
    label: |-
      Reconstruct the Predicted Proof Graph
      Seek a Path from Premises to Conclusion
      A Correct Path May Coexist with
      Extraneous Invalid Steps
    type: process
    size: xl
    position:
      x: 3620
      'y': 360
    style:
      fontSize: 9
  - id: strict_metric
    label: |-
      Strict Proof Accuracy
      Require a Canonical Path
      Strictly-valid Atomic
      and Correct Steps
    type: process
    size: xl
    position:
      x: 3860
      'y': 80
    style:
      fontSize: 9
  - id: skip_metric
    label: |-
      Skip Proof Accuracy
      Also Allow Strictly-valid
      Non-atomic Correct Steps
      Preserve Goal Reachability
    type: process
    size: xl
    position:
      x: 3860
      'y': 240
    style:
      fontSize: 9
  - id: broad_metric
    label: |-
      Broad Proof Accuracy
      Allow Broadly-valid Steps
      Use the More Powerful Calculus
      Preserve Goal Reachability
    type: process
    size: xl
    position:
      x: 3860
      'y': 400
    style:
      fontSize: 9
  - id: valid_metric
    label: |-
      Valid Proof Accuracy
      Permit Strict or Broad Validity
      Use the Most Permissive Proof Path
      Preserve Goal Reachability
    type: process
    size: xl
    position:
      x: 3860
      'y': 560
    style:
      fontSize: 9
  - id: label_metric
    label: |-
      Label Accuracy
      Compare True or False Directly
      Keep Separate from Proof Accuracy
      Test Answer-versus-reason Agreement
    type: process
    size: xl
    position:
      x: 3860
      'y': 720
    style:
      fontSize: 9
  - id: breakdown
    label: |-
      Aggregate Formal Analyses
      Break Down by Hops Order and Ontology
      Count Step Categories and First Errors
      Compute Wilson 95% Confidence Intervals
    type: process
    size: xl
    position:
      x: 4100
      'y': 360
    style:
      fontSize: 9
  - id: paper_report
    label: |-
      Report the Paper Experiment
      400 Examples per Configuration
      48 Experiments in the Main Analysis
      Compare Label and Four Proof Accuracies
    type: terminal
    size: xl
    position:
      x: 4340
      'y': 360
    style:
      fontSize: 9
  - id: release_boundary
    label: |-
      Paper-matched Code and License Boundary
      Use v1 Branch at 066f73fc70bf
      CLI Defaults to 500 Trials · Hops 1-through-5
      Fixed Seed 62471893 · Main Is Later OOD Code
      Generates On Demand · Apache-2.0
    type: document
    size: xl
    position:
      x: 1940
      'y': 900
    style:
      fontSize: 9
