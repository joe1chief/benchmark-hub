meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PrOntoQA 构建与形式化评测流程
  description: >-
    对齐 ICLR 论文，展示唯一可证明的肯定前件问题合成、防捷径自然语言转换、八样本贪心评测，以及预测思维链的符号重建过程。
  legend: >-
    实线复原论文流程；虚线把论文匹配的 v1 代码快照及 Apache-2.0 许可与后续 PrOntoQA-OOD 开发隔离。
nodes:
  - id: source_evidence
    label: |-
      固定来源证据
      arXiv 2210.01240v4
      PDF SHA-256 8e0502fa3b6b
      论文代码 v1 066f73fc70bf
      论文与固定分支联合核验
    type: document
    size: xl
    position:
      x: 20
      'y': 40
    style:
      fontSize: 9
  - id: task_scope
    label: |-
      定义受控推理任务
      只允许重复使用肯定前件
      证明演算包含公理 Ax 与跳步 Hop
      要求唯一标准证明
    type: document
    size: xl
    position:
      x: 260
      'y': 40
    style:
      fontSize: 9
  - id: ontology_types
    label: |-
      选择本体类型
      虚构名称规避预训练知识
      真实本体来自三个手工编写本体
      反事实本体随机组合真实概念名
    type: process
    size: xl
    position:
      x: 500
      'y': 40
    style:
      fontSize: 9
  - id: linear_ontology
    label: |-
      生成线性层次本体
      随机包含 3 至 10 个概念
      每个节点有零个或一个子节点
      添加子类型关系与概念属性
    type: database
    size: xl
    position:
      x: 740
      'y': 40
    style:
      fontSize: 9
  - id: controlled_grammar
    label: |-
      用简单语法渲染本体
      翻译每条边与每个属性
      使用受控句法变体
      保持简单且唯一的反向解析
    type: process
    size: xl
    position:
      x: 980
      'y': 40
    style:
      fontSize: 9
  - id: context_order
    label: |-
      先确定本体上下文顺序
      前序遍历生成自顶向下顺序
      后序遍历生成自底向上顺序
      完成排序后才插入干扰句
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
    style:
      fontSize: 9
  - id: shortcut_audit
    label: |-
      审查标签捷径
      无干扰句时标签预测接近完美
      查询属性是否出现会泄露极性
      消除此非推理启发式
    type: process
    size: xl
    position:
      x: 1460
      'y': 200
    style:
      fontSize: 9
  - id: distractor
    label: |-
      插入反捷径干扰句
      取已生成证明的结论属性
      在断开的新概念上赋予其否定
      将该句随机插入已排序上下文
    type: process
    size: xl
    position:
      x: 1700
      'y': 200
    style:
      fontSize: 9
  - id: seed_axiom
    label: |-
      播种形式证明
      均匀选择一个起始节点
      把一个实体赋给该概念
      创建初始类型公理
    type: process
    size: xl
    position:
      x: 980
      'y': 360
    style:
      fontSize: 9
  - id: proof_walk
    label: |-
      沿本体树向上推演
      每一跳应用一次演绎规则
      在节点或节点属性处停止
      匹配目标证明长度 · 测试 1 3 5 跳
    type: process
    size: xl
    position:
      x: 1220
      'y': 360
    style:
      fontSize: 9
  - id: query_polarity
    label: |-
      渲染实体事实与查询
      用自然语言表述初始公理
      以 0.5 概率询问证明结论
      或其否定是否为真
    type: process
    size: xl
    position:
      x: 1460
      'y': 360
    style:
      fontSize: 9
  - id: gold_cot
    label: |-
      渲染标准思维链
      保持形式证明的有序步骤
      翻译每一步的结论
      每个证明步骤输出一句话
    type: process
    size: xl
    position:
      x: 1460
      'y': 520
    style:
      fontSize: 9
  - id: example_record
    label: |-
      组装一条合成样本
      上下文 · 查询 · 标准思维链 · 标签
      保留与形式证明的一一映射
      按需动态生成样本
    type: database
    size: xl
    position:
      x: 1940
      'y': 360
    style:
      fontSize: 9
  - id: experiment_controls
    label: |-
      设置论文实验变量
      1 · 3 · 5 跳
      自顶向下或自底向上上下文
      虚构 · 真实 · 反事实本体
    type: process
    size: xl
    position:
      x: 2180
      'y': 360
    style:
      fontSize: 9
  - id: eight_shot
    label: |-
      构造八样本思维链提示
      独立生成八条
      完整带标签的演示样本
      追加一条无答案测试样本
    type: process
    size: xl
    position:
      x: 2420
      'y': 360
    style:
      fontSize: 9
  - id: greedy_decode
    label: |-
      解码思维链与二元标签
      使用贪心解码
      text-ada-001 至 text-curie-001
      davinci · text-davinci-001 · text-davinci-002
    type: process
    size: xl
    position:
      x: 2660
      'y': 360
    style:
      fontSize: 9
  - id: response_split
    label: |-
      拆分模型回答
      恢复预测思维链句子
      恢复最终真或假标签
      标签与标准答案单独比较
    type: process
    size: xl
    position:
      x: 2900
      'y': 360
    style:
      fontSize: 9
  - id: semantic_parser
    label: |-
      将预测思维链解析为符号形式
      应用递归下降语法
      恢复逻辑形式序列
      无法解析的步骤标记为错误
    type: process
    size: xl
    position:
      x: 3140
      'y': 360
    style:
      fontSize: 9
  - id: step_validity
    label: |-
      判定步骤有效性
      严格有效仅用标准证明规则
      广义有效使用扩展演算
      其余步骤判为无效
    type: process
    size: xl
    position:
      x: 3380
      'y': 180
    style:
      fontSize: 9
  - id: step_atomicity
    label: |-
      判定步骤原子性
      原子步骤只应用一次规则
      非原子步骤跳过中间结论
      该划分用于严格有效步骤
    type: process
    size: xl
    position:
      x: 3380
      'y': 360
    style:
      fontSize: 9
  - id: step_utility
    label: |-
      判定步骤效用
      标准证明前提导向路径外结论
      即为误导步骤
      否则标记为正确步骤
    type: process
    size: xl
    position:
      x: 3380
      'y': 540
    style:
      fontSize: 9
  - id: proof_path
    label: |-
      重建预测证明图
      寻找从前提到结论的路径
      正确路径可以与
      额外无效步骤同时存在
    type: process
    size: xl
    position:
      x: 3620
      'y': 360
    style:
      fontSize: 9
  - id: strict_metric
    label: |-
      严格证明准确率
      要求存在规范路径
      步骤需严格有效 原子
      且位于正确路径
    type: process
    size: xl
    position:
      x: 3860
      'y': 80
    style:
      fontSize: 9
  - id: skip_metric
    label: |-
      跳步证明准确率
      额外允许严格有效
      非原子的正确步骤
      仍须到达目标结论
    type: process
    size: xl
    position:
      x: 3860
      'y': 240
    style:
      fontSize: 9
  - id: broad_metric
    label: |-
      广义证明准确率
      允许广义有效步骤
      使用更强的证明演算
      仍须到达目标结论
    type: process
    size: xl
    position:
      x: 3860
      'y': 400
    style:
      fontSize: 9
  - id: valid_metric
    label: |-
      有效证明准确率
      允许严格或广义有效步骤
      使用最宽松的证明路径
      仍须到达目标结论
    type: process
    size: xl
    position:
      x: 3860
      'y': 560
    style:
      fontSize: 9
  - id: label_metric
    label: |-
      标签准确率
      直接比较真或假
      与证明准确率分开计算
      检查答案与推理是否一致
    type: process
    size: xl
    position:
      x: 3860
      'y': 720
    style:
      fontSize: 9
  - id: breakdown
    label: |-
      汇总形式化分析
      按跳数 顺序与本体类型分解
      统计步骤类别及首个错误
      计算 Wilson 95% 置信区间
    type: process
    size: xl
    position:
      x: 4100
      'y': 360
    style:
      fontSize: 9
  - id: paper_report
    label: |-
      报告论文实验
      每个配置生成 400 条样本
      主分析共 48 组实验
      比较标签与四种证明准确率
    type: terminal
    size: xl
    position:
      x: 4340
      'y': 360
    style:
      fontSize: 9
  - id: release_boundary
    label: |-
      论文匹配的代码与许可边界
      使用 v1 分支 066f73fc70bf
      CLI 默认 500 次 · 跳数遍历 1 至 5
      固定种子 62471893 · main 为后续 OOD 代码
      按需生成样本 · Apache-2.0
    type: document
    size: xl
    position:
      x: 1940
      'y': 900
    style:
      fontSize: 9
