meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PrOntoQA 构建与评测流程
  description: 按论文从小型本体合成具有唯一证明的连锁肯定前件问答，再对模型思维链进行符号重构与逐步形式分析。
  legend: 原论文按需生成样例，以8个独立生成的上下文示例评测1跳、3跳和5跳设置，每个实验配置含400个测试样例。
nodes:
  - id: step_1
    label: |-
      定义受控推理任务
      证明仅使用连锁肯定前件
      每题要求唯一标准证明
      句子保持易于语义解析
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      生成线性本体
      从先验抽取3至10个概念
      添加子类关系与概念属性
      每个节点最多一个子节点
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      选择本体条件
      使用虚构概念名称
      使用符合现实的真实本体
      使用随机反事实错误本体
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      初始化形式证明
      均匀随机选择起始节点
      把一个实体赋给该概念
      建立初始逻辑公理
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      沿本体向上遍历
      每一跳应用一次推理规则
      到目标节点或属性时停止
      控制1跳 · 3跳 · 5跳证明
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      渲染自然语言上下文
      用语法映射每条边和属性
      使用句法简单的表达变体
      保持唯一的反向解析
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      控制上下文难度
      添加干扰句阻断捷径
      自顶向下或自底向上排序
      测试规划而非知识检索
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      创建查询与二元标签
      陈述证明中的初始实体事实
      以0.5概率询问结论或其否定
      标注True或False
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      生成标准思维链
      翻译每个证明步骤的结论
      每个形式步骤对应一句话
      保存上下文 · 查询 · CoT · 标签
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      执行8-shot思维链评测
      独立生成上下文示例
      追加一个不含答案的测试题
      解码模型思维链与标签
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      符号解析预测思维链
      反向应用同一套简单语法
      使用递归下降语义解析
      恢复逻辑形式序列
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      分类每个证明步骤
      判断严格有效或广义有效
      判断原子步骤或跨步推理
      标记正确路径 · 误导 · 无效
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      对照标准证明
      检查是否推出目标结论
      比较模型预测的二元标签
      区分局部推理与规划错误
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告形式推理指标
      标签准确率 · 严格证明准确率
      跨步 · 广义 · 有效证明准确率
      按跳数顺序与本体拆分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: step_1
    to: step_2
    type: primary
  - from: step_2
    to: step_3
    type: primary
  - from: step_3
    to: step_4
    type: primary
  - from: step_4
    to: step_5
    type: primary
  - from: step_5
    to: step_6
    type: primary
  - from: step_6
    to: step_7
    type: primary
  - from: step_7
    to: step_8
    type: primary
  - from: step_8
    to: step_9
    type: primary
  - from: step_9
    to: step_10
    type: primary
  - from: step_10
    to: step_11
    type: primary
  - from: step_11
    to: step_12
    type: primary
  - from: step_12
    to: step_13
    type: primary
  - from: step_13
    to: step_14
    type: primary
modules: []
