meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DynaMath 构建流程
  description: 对齐论文的种子筛选、程序化视觉数学题生成与变体级数学推理鲁棒性评测。
  legend: 实线箭头展示 501 个种子程序生成 5,010 个具体变体；指标分支区分平均、最坏与一致性鲁棒性视角。
nodes:
  - id: sources
    label: |-
      候选视觉数学题
      MathVista 107 · MATH-V 27 · MMMU/材料 93
      公共网页 236 题 + 作者新设计 38 题
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: select
    label: |-
      种子筛选与复核
      必须依赖视觉信息推理
      移除难以用代码重现的复杂图像
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: seeds
    label: |-
      501 个高质量种子问题
      覆盖 9 个数学主题
      改编 227 题 + 新设计 274 题
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: program
    label: |-
      大学 STEM 学生先标注常用解题策略
      每题手写一个 Python 程序
      条件采样器 + 求解及答案格式化
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: variations
    label: |-
      编码受控变化空间
      数值 · 函数 · 图结构 · 几何
      运算 · 颜色 · 布局 · 情境
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: render
    label: |-
      渲染视觉上下文
      Matplotlib / Pyglet 绘图函数
      470 个绘图程序 + 31 个固定图像程序
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: verify
    label: |-
      人工程序质检
      核验采样条件、图像、解法、
      答案格式与生成难度
    type: decision
    size: xl
    position:
      x: 1600
      'y': 250
  - id: variants
    label: |-
      动态评测集
      每个种子随机采样 10 个变体
      501 × 10 = 5,010 道具体问题
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: predict
    label: |-
      视觉语言模型零样本预测
      图像 + 问题 · 温度 0
      生成推理与短答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: extract
    label: |-
      提取并归一化短答案
      比较 Ans(i,j) 与程序真值 GT(i,j)
      可选 5 次重复一致性实验
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: metrics
    label: |-
      变体鲁棒性视角
      每个种子使用同一组 10 个变体
    type: decision
    size: xl
    position:
      x: 2640
      'y': 250
  - id: average
    label: |-
      平均准确率 Aavg
      对 5,010 个变体的正确率求均值
    type: document
    size: xl
    position:
      x: 2900
      'y': 10
  - id: worst
    label: |-
      最坏准确率 Awst
      10 个变体全对时该种子才算正确
    type: document
    size: xl
    position:
      x: 2900
      'y': 250
  - id: robustness
    label: |-
      RR = Awst / Aavg
      重复一致性 RC 用于区分模型随机性
    type: document
    size: xl
    position:
      x: 2900
      'y': 490
  - id: report
    label: |-
      DynaMath 报告
      总体、主题与难度切片
      平均—最坏差距与鲁棒性
    type: terminal
    size: xl
    position:
      x: 3160
      'y': 250
edges:
  - from: sources
    to: select
    type: primary
  - from: select
    to: seeds
    type: primary
  - from: seeds
    to: program
    type: primary
  - from: program
    to: variations
    type: primary
  - from: variations
    to: render
    type: primary
  - from: render
    to: verify
    type: primary
  - from: verify
    to: variants
    type: primary
  - from: variants
    to: predict
    type: primary
  - from: predict
    to: extract
    type: primary
  - from: extract
    to: metrics
    type: primary
  - from: metrics
    to: average
    type: primary
  - from: metrics
    to: worst
    type: primary
  - from: metrics
    to: robustness
    type: primary
  - from: average
    to: report
    type: primary
  - from: worst
    to: report
    type: primary
  - from: robustness
    to: report
    type: primary
modules: []
