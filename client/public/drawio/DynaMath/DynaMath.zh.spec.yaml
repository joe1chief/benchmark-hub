meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DynaMath 构建流程
  description: 按论文与固定发布版本还原动态视觉数学程序构建、两套独立评测网格及鲁棒性报告。
  legend: 实线表示构建与指标计算；虚线表示证据或附录 H.6 的代理分析。
nodes:
  - id: evidence
    label: |-
      固定证据边界
      arXiv:2411.00836v2
      DynaMath 仓库 @ 598c3c3
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: sources
    label: |-
      视觉数学候选题
      MathVista 107 · MATH-V 27
      科学图表 45 · 图结构题 48
      公开网页 236 · 作者新题 38
    type: database
    size: xl
    position:
      x: 40
      'y': 320
  - id: select
    label: |-
      全面复核种子题
      保留依赖视觉的数学推理
      剔除图像过于复杂、
      难以程序化生成的问题
    type: process
    size: xl
    position:
      x: 300
      'y': 320
  - id: seeds
    label: |-
      501 道种子题 · 既有 227 + 新增 274
      学段：小学 63 · 高中 277
      本科 161 · 覆盖九个数学主题
      数值题 296 · 选择题 174 · 自由作答 31
    type: database
    size: xl
    position:
      x: 560
      'y': 320
  - id: program
    label: |-
      大学 STEM 学生标注解题策略
      每题手工编写一个 Python 程序
      条件采样 + 算法解法
      明确答案格式
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: variations
    label: |-
      编码论文定义的七类变化
      数值 · 几何 · 函数 · 颜色
      符号 · 图结构
      现实情境
    type: process
    size: xl
    position:
      x: 1080
      'y': 320
  - id: render
    label: |-
      渲染每道采样后的视觉题
      470 个绘图程序 · Matplotlib / Pyglet
      31 个固定图像程序
      仅随机替换文字元素
    type: process
    size: xl
    position:
      x: 1340
      'y': 320
  - id: verify
    label: |-
      论文仅报告全面人工复核
      以及程序均为精心编写
      具体程序质控检查清单
      未披露
    type: process
    size: xl
    position:
      x: 1600
      'y': 320
  - id: variants
    label: |-
      动态变体网格
      N=501 个种子 · 每题 M=10 个变体
      501 × 10 = 5,010 道问题
    type: database
    size: xl
    position:
      x: 1860
      'y': 320
  - id: rc_sample
    label: |-
      独立重复评测分支
      501 道问题 × 5 次响应
      每次与第一次响应比较
      不属于 501 × 10 变体网格
    type: database
    size: xl
    position:
      x: 1860
      'y': 660
  - id: predict
    label: |-
      视觉语言模型零样本推理
      输入图像与问题提示
      生成推理过程和简短答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 320
  - id: extract
    label: |-
      基于提示抽取答案
      模板匹配
      将 Ans(i,j) 与程序标准答案 GT(i,j) 比较
    type: process
    size: xl
    position:
      x: 2380
      'y': 320
  - id: metrics
    label: |-
      两套论文评测轨道
      变体网格：N=501 · M=10
      重复网格：501 道问题 · K=5
    type: decision
    size: xl
    position:
      x: 2640
      'y': 320
  - id: average
    label: |-
      平均准确率 Aavg
      Aavg=(1/N) Σᵢ (1/M) Σⱼ
      I[Ans(i,j)=GT(i,j)]
      N=501 · M=10
    type: document
    size: xl
    position:
      x: 2960
      'y': 0
  - id: worst
    label: |-
      最坏情况准确率 Awst
      Awst=(1/N) Σᵢ minⱼ I[Ans(i,j)=GT(i,j)]
      同一种子的 10 个变体必须全对
    type: document
    size: xl
    position:
      x: 2960
      'y': 220
  - id: robustness
    label: |-
      相对鲁棒性比率
      RR = Awst / Aavg
      区分能力水平与最坏保持率
    type: document
    size: xl
    position:
      x: 2960
      'y': 440
  - id: consistency
    label: |-
      重复一致性 RC(i,j)
      RC(i,j)=(1/K) Σₖ I[Ansₖ(i,j)=Ans₁(i,j)]
      K=5 · 以第一次响应为锚点
    type: document
    size: xl
    position:
      x: 2640
      'y': 660
  - id: icl_proxy
    label: |-
      附录 H.6：上下文学习污染代理
      变体 1–3 作少样本 · 变体 4 测试
      仅为初步污染迹象
      非正式去污染
    type: document
    size: xl
    position:
      x: 2640
      'y': 880
  - id: report
    label: |-
      DynaMath 鲁棒性报告
      总体 · 主题 · 学段
      Aavg · Awst · RR · RC
      H.6 代理结论保持明确限定
    type: terminal
    size: xl
    position:
      x: 3300
      'y': 320
