meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DynaMath Build Process
  description: >-
    Paper- and release-pinned construction of dynamic visual-math programs, two distinct evaluation grids, and
    robustness reporting.
  legend: >-
    Solid arrows follow construction and metric computation; dashed arrows mark evidence or the Appendix H.6 proxy
    analysis.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      arXiv:2411.00836v2
      DynaMath repo @ 598c3c3
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: sources
    label: |-
      Visual-math candidates
      MathVista 107 · MATH-V 27
      scientific figures 45 · graph theory 48
      public web 236 · author-designed 38
    type: database
    size: xl
    position:
      x: 40
      'y': 320
  - id: select
    label: |-
      Comprehensive seed review
      retain visually grounded math reasoning
      remove images too complex
      for programmatic generation
    type: process
    size: xl
    position:
      x: 300
      'y': 320
  - id: seeds
    label: |-
      501 seed questions · 227 adapted + 274 new
      education: elementary 63 · high school 277
      undergraduate 161 · nine math topics
      numerical 296 · MCQ 174 · free-form 31
    type: database
    size: xl
    position:
      x: 560
      'y': 320
  - id: program
    label: |-
      College STEM students annotate strategies
      handcraft one Python program per seed
      condition sampler + algorithmic solution
      explicit answer format
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: variations
    label: |-
      Encode the exact seven variation families
      numerical · geometric · function · color
      symbolic · graph structure
      real-life context
    type: process
    size: xl
    position:
      x: 1080
      'y': 320
  - id: render
    label: |-
      Render each sampled visual question
      470 plotting programs · Matplotlib / Pyglet
      31 fixed-image programs
      randomize textual elements only
    type: process
    size: xl
    position:
      x: 1340
      'y': 320
  - id: verify
    label: |-
      Paper reports comprehensive manual review
      and carefully crafted programs
      specific program-QA checklist
      not disclosed
    type: process
    size: xl
    position:
      x: 1600
      'y': 320
  - id: variants
    label: |-
      Dynamic variant grid
      N=501 seeds · M=10 variants each
      501 × 10 = 5,010 questions
    type: database
    size: xl
    position:
      x: 1860
      'y': 320
  - id: rc_sample
    label: |-
      Independent repetition track
      501 questions × 5 responses
      compare each with the first response
      not the 501 × 10 variant grid
    type: database
    size: xl
    position:
      x: 1860
      'y': 660
  - id: predict
    label: |-
      Zero-shot VLM inference
      image + question prompt
      generate reasoning and a short answer
    type: process
    size: xl
    position:
      x: 2120
      'y': 320
  - id: extract
    label: |-
      Prompt-based answer extraction
      template matching
      compare Ans(i,j) with program GT(i,j)
    type: process
    size: xl
    position:
      x: 2380
      'y': 320
  - id: metrics
    label: |-
      Two paper evaluation tracks
      variant grid: N=501 · M=10
      repetition grid: 501 questions · K=5
    type: decision
    size: xl
    position:
      x: 2640
      'y': 320
  - id: average
    label: |-
      Average accuracy Aavg
      Aavg=(1/N) Σᵢ (1/M) Σⱼ
      I[Ans(i,j)=GT(i,j)]
      N=501 · M=10
    type: document
    size: xl
    position:
      x: 2960
      'y': 0
  - id: worst
    label: |-
      Worst-case accuracy Awst
      Awst=(1/N) Σᵢ minⱼ I[Ans(i,j)=GT(i,j)]
      all 10 variants of a seed
      must be correct
    type: document
    size: xl
    position:
      x: 2960
      'y': 220
  - id: robustness
    label: |-
      Relative robustness ratio
      RR = Awst / Aavg
      level versus worst-case retention
    type: document
    size: xl
    position:
      x: 2960
      'y': 440
  - id: consistency
    label: |-
      Repetition consistency RC(i,j)
      RC(i,j)=(1/K) Σₖ I[Ansₖ(i,j)=Ans₁(i,j)]
      K=5 · first response anchor
    type: document
    size: xl
    position:
      x: 2640
      'y': 660
  - id: icl_proxy
    label: |-
      Appendix H.6: in-context learning proxy
      variants 1–3 few-shot · variant 4 test
      preliminary contamination indication only
      not formal decontamination
    type: document
    size: xl
    position:
      x: 2640
      'y': 880
  - id: report
    label: |-
      DynaMath robustness report
      overall · topic · education level
      Aavg · Awst · RR · RC
      H.6 proxy kept explicitly qualified
    type: terminal
    size: xl
    position:
      x: 3300
      'y': 320
