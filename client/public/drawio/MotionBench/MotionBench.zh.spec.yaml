    type: primary
  - from: review
    to: combine
    type: primary
  - from: direct
    to: combine
    type: primary
  - from: combine
    to: categories
    type: primary
  - from: categories
    to: split
    type: primary
  - from: split
    to: evaluate
    type: primary
  - from: evaluate
