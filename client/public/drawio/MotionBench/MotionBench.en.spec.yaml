meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MotionBench Build and Evaluation Process
  description: >-
    Paper-aligned three-stream video curation, fine-grained motion QA generation, image-only shortcut filtering, human
    review, split, and accuracy evaluation.
  legend: >-
    The final benchmark has 5,385 videos and 8,052 multiple-choice QAs across motion recognition, location, action
    order, repetition count, motion objects, and camera motion.
nodes:
  - id: goal
    label: |-
      Define Fine-grained Motion Evaluation
      Dynamic rather than Static Perception
      Six Motion-oriented Categories
      Multiple-choice Video QA
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: intricate
    label: |-
      Collect Intricate Interactions
      Panda-70M · Pexels
      Self-collected Movie Clips
      Segment Events with PySceneDetect
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: fields
    label: |-
      Collect Specific-field Videos
      MedVid · SportsSloMo · Ha-ViD
      min Height or Width above 448
      Duration from 3 to 60 Seconds
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: synthetic
    label: |-
      Render Synthetic Videos in Unity
      20 Motions · 6 Avatars · 5 Scenes
      Sample from 15 Viewpoints
      Manually Remove Occlusions
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: captions
    label: |-
      Annotate Dynamic Captions
      15 Degree-qualified Annotators
      20 Working Days
      Secondary Review
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: generate
    label: |-
      Generate Intricate QAs
      GPT-4o Creates Six per Video
      Tie Questions to Dynamic Captions
      Cover Motion-specific Reasoning
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: shortcut
    label: |-
      Remove Static Shortcuts
      First-frame-only GPT-4o
      Qwen2-VL · GLM-4V-plus
      Discard if All Three Answer Correctly
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: review
    label: |-
      Manually Review Intricate QAs
      10 Annotators over 5 Days
      Remove Ambiguous or Wrong Items
      Categorize and Second-review
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: direct
    label: |-
      Build the Other Two Streams
      Directly Annotate Specific-field QAs
      Generate Synthetic QAs from Ground Truth
      2,530 plus 600 QAs
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: combine
    label: |-
      Combine Three QA Streams
      Intricate: 2,355 Videos · 4,922 QAs
      Specific: 2,430 Videos · 2,530 QAs
      Synthetic: 600 Videos · 600 QAs
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: categories
    label: |-
      Assign Six Motion Categories
      MR Recognition · LM Location
      AO Order · RC Count · MO Objects
      CM Camera Motion
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: split
    label: |-
      Release and Randomly Split
      5,385 Videos · 8,052 QAs
      Development 4,020 · Test 4,034
      Test Labels via Online Submission
    type: database
    size: xl
    position:
      x: 1460
      'y': 650
  - id: evaluate
    label: |-
      Evaluate Video-language Models
      Append Only Reply with Best Option
      Parse First Uppercase Letter by Regex
      Keep a Random Baseline
    type: process
    size: xl
    position:
      x: 1220
      'y': 650
  - id: report
    label: |-
      Report Motion Understanding
      Overall Multiple-choice Accuracy
      Accuracy for All Six Categories
      Annotation Density 68.4
    type: terminal
    size: xl
    position:
      x: 980
      'y': 650
