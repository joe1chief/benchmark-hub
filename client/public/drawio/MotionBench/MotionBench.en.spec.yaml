      Scene-detection Parameters
      Unity Project / Assets / Seed
      Model Versions / Gate Prompt
      Split Script / Seed
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 2700
      'y': 1440
  - id: rights_boundary
    label: |-
      Release and Rights Boundary
      Code · Apache-2.0
      HF Data · CC-BY-NC-SA-4.0
      Research-only + Upstream Terms
      Raw-video Copyright Not Owned
      Redistribution Restrictions Apply
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3180
      'y': 1120
  - id: split_release
    label: |-
      Release Data-backed DEV / TEST Split
      No Explicit split Field
      Answer Present -> DEV · 4,018 QAs / 2,706 Videos
      Answer NA -> TEST · 4,034 QAs / 2,679 Videos
      TEST Labels Withheld
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 3420
      'y': 720
  - id: split_drift
    label: |-
      Paper-to-data Split Drift
      Table 3 Says 4,020 + 4,034
      That Totals 8,054, Not 8,052
      Fixed Data Is 4,018 + 4,034
      Random Split Seed Not Released
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3420
      'y': 1200
  - id: paper_protocol
    label: |-
      Apply the Paper-v2 Response Protocol
      Append · Only reply with the best option.
      Take the First Uppercase Letter by Regex
      Intended for Each Multiple-choice QA
    type: process
    size: xl
    position:
      x: 3900
      'y': 720
  - id: protocol_boundary
    label: |-
      Paper / Released-code Boundary
      No Inference Harness in Fixed Repo
      Prompt Append + Regex Not Implemented
      answer_util Splits Then Takes First Character
      test_acc Does Not Call answer_util
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3900
      'y': 1160
  - id: predictions
    label: |-
      Produce Prediction JSON
      Map Each QA UID to an Option
      Expected Values · A / B / C / D
      Preserve Submitted UID Coverage
    type: process
    size: xl
    position:
      x: 4140
      'y': 720
  - id: scorer_gate
    label: |-
      Which Disclosed Scoring Semantics?
      Paper Contract
      Public GitHub Code
      Private-label HF Space
    type: decision
    size: xl
    position:
      x: 4380
      'y': 720
  - id: paper_accuracy
    label: |-
      Compute Intended Paper Accuracy
      Full Expected Question Set
      Exact Multiple-choice Correctness
      Overall + Six Category Accuracies
      Random Baseline · 0.25
    type: process
    size: xl
    position:
      x: 4620
      'y': 340
  - id: github_scorer
    label: |-
      Run Fixed GitHub compute_accuracy
      Mixed DEV + TEST Metadata
      Exact String Match by UID
      Skip NA after Counting Total
      acc = Right / 8,052
      answered_acc = Right / Submitted UIDs
    type: process
    size: xl
    style:
      fontSize: 8
    position:
      x: 4620
      'y': 720
  - id: space_scorer
    label: |-
      Run Fixed HF Space Scorer
      Private Separate DEV / TEST Labels
      Exact String Match by UID
      Report answered_acc
      Missing UIDs Stay outside Denominator
    type: process
    size: xl
    position:
      x: 4620
      'y': 1080
  - id: scorer_boundary
    label: |-
      Submission Coverage Boundary
      Upstream Scorers Have No Full-UID Gate
      Partial Submission Can Inflate answered_acc
      TEST Labels Remain Private
      Report Coverage with Any Score
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 4860
      'y': 1320
  - id: report
    label: |-
      Report MotionBench Results
      Separate Intended and Implemented Metrics
      Overall + MR / LM / CM / MO / AO / RC
      Include Submitted / Expected Coverage
      Cite Exact Paper, Data, and Scorer Revisions
    type: terminal
    size: xl
    style:
      fontSize: 9
    position:
      x: 4860
      'y': 720
  - id: leaderboard
    label: |-
      Publish Comparable Results
      Static Project-page Leaderboard Exists
      HF Space Is the Test Submission Route
      has_leaderboard · true
    type: terminal
    size: xl
    position:
      x: 5100
      'y': 720
  - id: availability
    label: |-
