meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MotionBench Build and Evaluation Process
  description: >-
    Paper-v2- and release-aligned three-stream curation, dynamic-caption QA construction, first-frame shortcut gate,
    data-backed split, and separate paper, public-code, and private-Space scoring semantics.
  legend: >-
    Evidence is frozen to arXiv:2501.02955v2, code dcc9b071, data f099db892, and Space a4033176. Solid lines are
    disclosed process paths; dashed lines are side releases or audit boundaries. Official data has 4,018 DEV QAs.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper · arXiv 2501.02955v2
      Section 3 · Tables 2–3
      Supplementary Sections 9–10
      Code dcc9b071 · Data f099db892
      Space a4033176
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 720
  - id: stream_gate
    label: |-
      Route Fine-grained Dynamic MC Video QA
      Six Categories · Three Streams
      Intricate · Pexels / Panda / Movies
      Specific Fields · Unity Synthetic
    type: decision
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 720
  - id: pexels
    label: |-
      Collect Pexels Videos
      Self-collected Web Source
      Table 2 · Directly Adopt
      Do Not Apply Scene Segmentation
    type: database
    size: xl
    position:
      x: 1020
      'y': 20
  - id: segment
    label: |-
      Collect and Segment Other Intricate Videos
      Panda-70M + Movie Clips
      Segment Event-level Clips
      Paper References PySceneDetect
      Parameters Not Disclosed
    type: process
    size: xl
    position:
      x: 1020
      'y': 360
  - id: captions
    label: |-
      Annotate the 2,355-video Intricate Pool
      Pexels Direct + Segmented Sources
      15 Adult Annotators
      At Least Bachelor's Degree
      20 Working Days
      Every Caption Second-reviewed
    type: process
    size: xl
    position:
      x: 1740
      'y': 220
  - id: caption_release
    label: |-
      Release MotionBenchCaption-train
      Separate Caption Asset
      5,000 Videos · 5,000 Captions
      Manually Annotated + Double-checked
      Paper · 12.63 Words per Second
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 1740
      'y': 0
  - id: gpt4o
    label: |-
      Generate Intricate QAs
      GPT-4o Reads Dynamic Captions
      About Six Questions per Video
      Target Dynamic Information
      Assign Category during Creation
    type: process
    size: xl
    position:
      x: 1980
      'y': 220
  - id: first_frame_gate
    label: |-
      Do All Three Image VLMs
      Answer Correctly from First Frame?
      GPT-4o · Qwen2-VL
      GLM-4V-plus
    type: decision
    size: xl
    position:
      x: 2220
      'y': 220
  - id: discard
    label: |-
      Discard Static-shortcut QA
      All Three Models Were Correct
      Do Not Regenerate by Default
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 0
  - id: manual_review
    label: |-
      Check + Freeze Retained Intricate QAs
      10 Annotators · 5 Days
      Question / Category / Relevance
      Options / Unique Correct Answer
      Every Annotation Second-reviewed
      2,355 Videos · 4,922 QAs
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2460
      'y': 300
  - id: field_sources
    label: |-
      Collect + Extract Field Clips
      MedVid · SportsSloMo · HA-ViD
      Paper Filter · min(H,W) > 448 · [3,60] s
      Map source + apply start/end
      Selection rule, not final guarantee
      Release includes clips < 3 s
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 1020
      'y': 720
