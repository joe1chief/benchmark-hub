      Mixamo · 20 Motions · 6 Avatars · 5 Scenes
      15-viewpoint Pool · Remove Occlusions
      GT -> Auto Qs + Options · Assign Category
      Parameters Undisclosed · 600 Videos / 600 QAs
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 760
      'y': 1200
  - id: merge
