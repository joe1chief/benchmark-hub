      Sports · 805 / 851
      Industrial · 1,194 / 1,230
      Total · 2,430 Videos / 2,530 QAs
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1500
      'y': 720
  - id: synthetic_recipe
    label: |-
