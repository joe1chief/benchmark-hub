      AO 1,001 · CM 775 · RC 774
      Options · 4×7,610 · 3×363
      2×75 · 1×4
      Paper-reported Annotation Density · 68.4
    type: document
    size: xl
    style:
      fontSize: 8
    position:
      x: 2940
      'y': 1120
