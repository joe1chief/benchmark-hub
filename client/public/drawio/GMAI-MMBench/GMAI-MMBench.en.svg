ct 2D/3D medical datasets</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>retain 268 public + 16 hospital sets</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>classification · detection · segmentation</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="600" y="224" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(700,254.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Standardize data</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>SA-Med2D-20M protocol → 2D RGB</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>MeSH: expand · unify · merge left/right</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="896" y="224" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(996,254.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Build lexical taxonomy</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>38 modalities · 18 tasks · 18 departments</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>4 granularities; 3 labelers + vote merge</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1200" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/>