ont-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(3100,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Paper answer extraction</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>option letters first</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>else ChatGPT-3.5-turbo-0613</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>unextractable output = error</tspan></text></g></g></g></g><g data-cell-id="14"><g><rect x="3296" y="0" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(3396,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Paper metrics</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>single ACC = correct / questions</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>multi ACC = match / predicted</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>multi recall = match / ground truth</tspan></text></g></g></g></g><g data-cell-id="15"><g><path d="M 2800 440 L 3000 440 L 3000 525 Q 2950 498 2900 525 Q 2850 552 2800 525 L 2800 455 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="79.2" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2900,435.4) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Pinned VLMEvalKit</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>GMAI inherits ImageMCQDataset</tspan></text><text y="37.4" data-line-font-