meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LV-Eval Build Process
  description: >-
    Paper-aligned construction of 11 bilingual long-context QA datasets through controlled context mixing, confusing
    fact insertion, leakage-reducing replacements, human annotation, and keyword-aware two-stage scoring.
  legend: >-
    The same 1,729 QA pairs are reused at five length levels, yielding 8,645 synthetic contexts from 16K to 256K words
    or Chinese characters. Six datasets are English and five are Chinese.
nodes:
  - id: sources
    label: |-
      Select Public QA and Text Sources
      HotpotQA · 2Wiki · DuReader · LooGLE
      LongBench · CMRC · MultiFieldQA
      PG-19 · Journey to the West · LIC
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: qa
    label: |-
      Construct 11 Bilingual QA Sets
      9 Adapted Public QA Datasets
      2 Synthetic Fact-recall Datasets
      6 English · 5 Chinese
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: pool
    label: |-
      Fix 1,729 QA Pairs
      Single-hop and Multi-hop Tasks
      One Fact QA per Fact-recall Language
      Reuse Identical QA Across Lengths
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: mix
    label: |-
      Mix Supporting and Distractor Documents
      Sample Distractors to Target Length
      Disperse Multi-hop Supporting Passages
      Shuffle and Prefix Passage Indices
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: lengths
    label: |-
      Build Five Controlled Length Levels
      16K · 32K · 64K · 128K · 256K
      One Context per QA and Length
      Average 102,380 Words or Characters
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: cfi
    label: |-
      Insert Confusing Facts · 6 Datasets
      GPT-4 Generates Two Similar Facts
      Human Linguists Resolve Conflicts
      Randomly Insert Non-contradictory Facts
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: kpr
    label: |-
      Apply Keyword and Phrase Replacement
      Six Datasets · 1,924 Replaced Pairs
      Human-authored Replacement Rules
      Review Full Context for New Conflicts
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: annotation
    label: |-
      Complete Human Annotation
      Five Full-time Master's Annotators
      Review 557 Confusing-fact Instances
      Mark 955 Answer-keyword Instances
    type: user
    size: xl
    position:
      x: 1700
      'y': 380
  - id: dataset
    label: |-
      Release LV-Eval · 8,645 Contexts
      1,729 QA Pairs × Five Lengths
      Context · Question · Ground Truth
      Confusing Facts and Answer Keywords
    type: database
    size: xl
    position:
      x: 1420
      'y': 380
  - id: inference
    label: |-
      Run Long-context Inference
      Dataset-specific Zero-shot Prompts
      Greedy Token Generation
      Middle-truncate Unsupported Contexts
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: recall
    label: |-
      Stage 1 · Answer-keyword Recall
      Match Manually Marked Critical Content
      Require the Dataset Threshold
      Reject Missing-keyword Responses
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: f1
    label: |-
      Stage 2 · Blacklist-aware Similarity
      Remove Common Non-informative Words
      Compute English or Chinese QA F1
      Use Task-native Rouge Where Defined
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      Report Controlled Long-context Scores
      Eleven Dataset-level Metrics
      Five Length-level Averages
      Single-hop and Multi-hop Analysis
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
