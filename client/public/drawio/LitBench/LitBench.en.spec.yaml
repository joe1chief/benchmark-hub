    type: primary
  - from: length_debias
    to: release
    type: primary
  - from: release
    to: judges
    type: primary
  - from: release
    to: rewards
    type: primary
  - from: release
    to: human_study
    type: primary
  - from: judges
    to: report
    type: primary
  - from: rewards
    to: report
    type: primary
  - from: human_study
    to: report
    type: primary
