meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LitBench Build Process
  description: >-
    EACL 2026 paper-aligned construction of independent post-2022 test and pre-2023 training preference corpora,
    followed by zero-shot, Bradley-Terry, generative-reward-model, and online-human validation.
  legend: >-
    Solid arrows show paper construction, training, or validation; data arrows inject the held-out benchmark; the
    dependency arrow supplies the trained BT model to the online study. Unconnected document cards preserve pinned
    public-artifact boundaries and unresolved paper/release drift.
