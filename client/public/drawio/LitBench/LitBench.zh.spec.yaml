    type: data
  - from: bt_model
    to: report
    type: data
  - from: gen_model
    to: report
    type: data
  - from: bt_model
    to: rm_ranking
    type: dependency
    waypoints:
      - x: 1776
        'y': 480
      - x: 1776
        'y': 944
      - x: 1628
