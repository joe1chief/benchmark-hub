meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RoboSpatial 构建与评测流程
  description: >-
    RoboSpatial把ScanNet、Matterport3D、3RScan、HOPE和GraspNet-1B场景数据转化为面向机器人的空间问答。流水线接收RGB图像、标定相机位姿、定向三维框和语义标签，在世界、自我与物体中心参考系下计算空间配置、上下文与兼容性，再把三维几何投影到二维以采样点或区域，并增加10万条物体定位问答。完整资源约含300万空间问答、100万图像和5000个扫描。RoboSpatial-Val从训练未见的扫描中留出6000题，三类关系各2000题；是非题按准确率计分，坐标预测必须落入参考点集凸包。
  legend: >-
    来源：RoboSpatial arXiv:2411.16537 Sections 3-4 and Appendix B, cross-checked against
    NVlabs/RoboSpatial。实线箭头表示论文或官方资料明确支持的主流程。
