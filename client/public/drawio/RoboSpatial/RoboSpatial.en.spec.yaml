meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RoboSpatial Build and Evaluation Process
  description: >-
    RoboSpatial converts ScanNet, Matterport3D, 3RScan, HOPE, and GraspNet-1B scene data into robotics-oriented spatial
    QA. The pipeline consumes RGB images, calibrated camera poses, oriented 3D boxes, and semantic labels; it computes
    spatial configuration, context, and compatibility across world-, ego-, and object-centric reference frames, then
    projects 3D geometry to sample 2D points or regions and adds 100k grounding QA pairs. The full resource contains
    about 3 million spatial QA pairs over 1 million images and 5,000 scans. RoboSpatial-Val holds out unseen scans and
    contains 6,000 questions, evenly split across the three relation types; yes/no questions use accuracy and coordinate
    predictions must lie within a reference convex hull.
  legend: >-
    Source: RoboSpatial arXiv:2411.16537 Sections 3-4 and Appendix B, cross-checked against NVlabs/RoboSpatial. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
