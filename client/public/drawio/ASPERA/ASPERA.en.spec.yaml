meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA and Asper-Bench Construction and Evaluation Workflow
  description: >-
    Paper-aligned workflow for interactively generating executable digital-assistant tasks, simulation initializers, and
    assertion-based evaluators, then measuring whether model-generated action programs resolve each task.
  legend: >-
    Every task is a four-part contract: user query, reference Action Execution Program (AEP), State Initialization
    Program (SIP), and Evaluation Program (EP). Success requires error-free execution and every EP assertion to pass.
nodes:
  - id: library
    label: |-
      Implement the ASPERA Assistant Library
      Simulated Company • 7 Databases • 69 Primitives
      49 Functions • 20 Classes • Time Utilities
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: session
    label: |-
      Start Developer-LLM Interaction
      Supply Focus Instructions or a Human Query
      Control Complexity, Length, and Scenario
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: prompt
    label: |-
      Ground GPT-4o Generation
      Library Documentation + Natural-Language Rules
      Five In-Context Examples per Program Type
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: aep
    label: |-
      Generate Query + Reference AEP
      Compose Primitives, Flow Control, Iteration, and Time Logic
      Developer Executes, Filters, and Edits
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: sip
    label: |-
      Generate the SIP
      Build the Dynamic Simulation State Needed by the Query
      Developer Executes and Edits the Initializer
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: ep
    label: |-
      Generate the EP
      Run SIP Then AEP; Assert Return Values and State Changes
      Support Multiple Acceptable Outcomes and Branches
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      Audit and Release Asper-Bench
      Lead Author Executes/Corrects; Two Annotators Confirm Quality
      250 Tasks: 71 Information-Seeking + 179 State-Mutating
    type: database
    size: xl
    position:
      x: 1720
      'y': 100
  - id: setting
    label: |-
      Choose the Evaluator Setting
      CCK: Full Library Docs + 5 AEP Examples
      PS: Select Primitives Module by Module + 1 Example
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: candidate
    label: |-
      Generate a Candidate AEP
      Model Converts the Unseen User Query into Python
      PS Also Records Primitive Precision, Recall, and Micro F1
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: initialize
    label: |-
      Initialize the Reference State
      Execute the Task SIP in the Isolated Simulation
      Conditional Queries Cover Every AEP Branch
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: execute
    label: |-
      Execute the Candidate AEP
      Observe Return Value, Exceptions, and Database Side Effects
    type: process
    size: xl
    position:
      x: 880
      'y': 520
  - id: assertions
    label: |-
      Did Execution Finish without Error
      and Do All Reference EP Assertions Pass?
    type: process
    size: xl
    position:
      x: 600
      'y': 520
  - id: metric
    label: |-
      Compute Task Success Rate
      One Resolved Task Only When Every Required Check Passes
      Compare CCK and Primitive-Selection Difficulty
    type: process
    size: xl
    position:
      x: 320
      'y': 520
  - id: report
    label: |-
      Report Program-Synthesis Capability
      Task Success + Primitive Selection Diagnostics
      Analyze Missing, Extra, and Misused Primitives
    type: terminal
    size: xl
    position:
      x: 40
      'y': 520
