meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA Build Process
  description: >-
    Paper-aligned assistant-library simulation, human-assisted LLM task generation, quality control, and task-success
    evaluation workflow for ASPERA and Asper-Bench, based on arXiv:2507.15501.
  legend: >-
    Solid arrows show ASPERA task construction and execution evaluation; dashed arrows mark developer moderation and
    bias-mitigation loops.
nodes:
  - id: assistant_library
    label: |-
      Assistant library simulation
      7 databases
      69 Python primitives
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: aep_generation
    label: |-
      Query and AEP generation
      GPT-4o with examples
      complex compositional programs
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: bias_control
    label: |-
      Diversity controls
      prior query history
      focus instructions and filtering
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: sip_generation
    label: |-
      SIP generation
      initialise simulation state
      dynamic user databases
    type: process
    size: xl
    position:
      x: 560
      'y': 70
  - id: ep_generation
    label: |-
      EP generation
      execute SIP and AEP
      assert goals and side effects
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: human_qc
    label: |-
      Developer moderation
      run and edit programs in IDE
      annotator quality confirmation
    type: user
    size: xl
    position:
      x: 820
      'y': 160
  - id: dataset
    label: |-
      Asper-Bench dataset
      250 tasks
      AEP, SIP and EP annotations
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluator
    label: |-
      ASPERA evaluator
      complete or partial codebase knowledge
      task success via passing assertions
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: assistant_library
    to: aep_generation
    type: primary
  - from: assistant_library
    to: sip_generation
    type: data
  - from: aep_generation
    to: bias_control
    type: optional
    label: mitigate repetition bias
  - from: bias_control
    to: aep_generation
    type: optional
    label: revise focus
  - from: aep_generation
    to: sip_generation
    type: primary
  - from: sip_generation
    to: ep_generation
    type: primary
  - from: ep_generation
    to: human_qc
    type: primary
  - from: human_qc
    to: aep_generation
    type: optional
    label: execute and edit outputs
  - from: human_qc
    to: dataset
    type: primary
  - from: dataset
    to: evaluator
    type: primary
modules: []
