meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA and Asper-Bench Construction and Evaluation Workflow
  description: >-
    Paper-aligned workflow for interactively generating executable digital-assistant tasks, simulation initializers, and
    assertion-based evaluators, then measuring whether model-generated action programs resolve each task.
  legend: >-
    Every task is a four-part contract: user query, reference Action Execution Program (AEP), State Initialization
    Program (SIP), and Evaluation Program (EP). Success requires error-free execution and every EP assertion to pass.
