meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA 与 Asper-Bench 构建及评测流程
  description: 按论文呈现交互式生成可执行数字助理任务、模拟环境初始化器和断言式评测器，再衡量模型生成的动作程序能否 完成任务的完整流程。
  legend: 每个任务包含四项合同：用户查询、参考动作执行程序 AEP、状态初始化程序 SIP、评测程序 EP。只有执行无错误且 EP 的全部断言通过，任务才算成功。
nodes:
  - id: library
    label: |-
      ASPERA 助理库
      7 库 • 69 原语
      49 函数 • 20 类
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: session
    label: |-
      开发者-LLM 查询历史
      聚焦指令或人工查询
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: prompt
    label: |-
      按程序类型提示 GPT-4o
      AEP • SIP • EP
      每种程序各 5 个 ICE
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: aep
    label: |-
      生成查询 + 参考 AEP
      生成后筛选
      开发者执行并编辑
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: sip
    label: |-
      生成 SIP
      初始化动态状态
      开发者执行并编辑
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: ep
    label: |-
      生成 EP
      断言返回与状态
      开发者执行并编辑
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: lead_author
    label: |-
      首席作者最终复核
      执行并修正全部组成
    type: user
    size: xl
    position:
      x: 1720
      'y': 100
  - id: confirm
    label: |-
      独立确认
      两位标注员确认
    type: user
    size: xl
    position:
      x: 2000
      'y': 100
  - id: release
    label: |-
      发布 Asper-Bench
      250 题 • 71/179
    type: database
    size: xl
    position:
      x: 2280
      'y': 100
  - id: setting
    label: |-
      选择评测设置
      CCK • PS
    type: process
    size: xl
    position:
      x: 2280
      'y': 520
  - id: candidate
    label: |-
      生成候选 AEP
      未见查询转 Python
    type: process
    size: xl
    position:
      x: 2000
      'y': 520
  - id: initialize
    label: |-
      运行参考 SIP
      覆盖 AEP 各分支
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: execute
    label: |-
      执行候选 AEP
      返回 • 异常 • 状态
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: assertions
    label: 全部 EP 断言通过？
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: metric
    label: |-
      任务成功率
      全部检查通过
    type: process
    size: xl
    position:
      x: 880
      'y': 520
  - id: report
    label: |-
      报告程序合成能力
      任务成功 + PS F1
    type: terminal
    size: xl
    position:
      x: 600
      'y': 520
edges:
  - from: library
    to: session
    type: primary
  - from: session
    to: prompt
    type: primary
  - from: prompt
    to: aep
    type: primary
  - from: aep
    to: sip
    type: primary
  - from: sip
    to: ep
    type: primary
  - from: ep
    to: lead_author
    type: primary
  - from: lead_author
    to: confirm
    type: primary
  - from: confirm
    to: release
    type: primary
  - from: release
    to: setting
    type: primary
  - from: setting
    to: candidate
    type: primary
  - from: candidate
    to: initialize
    type: primary
  - from: initialize
    to: execute
    type: primary
  - from: execute
    to: assertions
    type: primary
  - from: assertions
    to: metric
    type: primary
  - from: metric
    to: report
    type: primary
modules: []
