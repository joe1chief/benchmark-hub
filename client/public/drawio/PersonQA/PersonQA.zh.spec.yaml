meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PersonQA 已披露构建与评测流程
  description: 严格依据 OpenAI 官方系统卡重建：人物公开事实、18 类事实、作答准确率与幻觉率， 并逐项标明所有未公开的构建组件。
  legend: OpenAI 未发布 PersonQA 独立论文、数据集、仓库、样本量、标注协议或评分器； 图中“未公开”是刻意保留的证据边界，不代表推测出的步骤。
nodes:
  - id: step_1
    label: |-
      建立公开信息边界
      证据仅来自官方系统卡
      没有独立论文或仓库
      不推测未发布的数据管线
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      使用人物公开事实
      该来源基础由官方明确披露
      问题面向人物层面的事实
      具体事实来源未列出
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      覆盖 18 类人物事实
      类别数量由官方披露
      类别名称未发布
      各类别分布未发布
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      形成人物事实问答记录
      问题与参考事实配对
      只披露了高层数据组成
      问题编写程序未公开
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      样本数量未公开
      无训练验证测试规模
      无人物数或问题总数
      无公开划分策略
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      来源选择未公开
      无采集或排除规则
      无参考日期或更新周期
      无公开来源追踪字段
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      标注协议未公开
      无标注者资质信息
      无独立复核或仲裁流程
      无质量控制统计
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      评测资产未公开
      无提示词或答案解析器
      无正确性或幻觉评分器
      数据与代码均未发布
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      向模型提问人物事实
      评测特定 OpenAI 模型快照
      生成自然语言答案
      记录模型是否尝试作答
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      评估已尝试答案
      准确率面向已尝试作答
      正确表示答案符合事实
      精确评分程序未公开
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      识别幻觉答案
      检查模型产生幻觉的频率
      幻觉率越低越好
      精确标注程序未公开
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      报告准确率
      数值越高越好
      比较不同模型快照
      明确仅统计已尝试作答
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      报告幻觉率
      数值越低越好
      与准确率分开解释
      更多陈述可同时增加两者
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      审核参考事实时效性
      过时金标会夸大错误率
      当前正确答案可能被判错
      后续版本需更仔细复核
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
