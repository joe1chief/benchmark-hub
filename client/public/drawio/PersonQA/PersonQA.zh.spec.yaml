meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PersonQA 已披露评测流程
  description: 依据三份固定 OpenAI 系统卡做公开边界内重建：内部人物事实任务、18 类范围、已尝试答案准确率、幻觉率，以及已披露的金标时效性风险。
  legend: 实线仅表示官方系统卡明确陈述或直接蕴含的阶段；虚线表示来源、构建、评测、发布与解释边界，不推测隐藏流程。
nodes:
  - id: source_evidence
    label: |-
      固定官方系统卡证据
      o1 · PDF 3ba7bdbe69e0
      深度研究 · PDF 6662a84c7fdf
      o3 与 o4-mini · PDF 32d7ca19fff2
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: disclosure_scope
    label: |-
      确立公开信息范围
      PersonQA 无独立论文
      仅使用官方系统卡
      不推测隐藏构建管线
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: task_definition
    label: |-
      定义人物事实问答
      面向人物提出问题
      使用公开可得事实
      衡量已尝试答案准确率
    type: document
    size: xl
    position:
      x: 600
      'y': 80
  - id: category_scope
    label: |-
      覆盖 18 类事实
      类别数量已披露
      类别名称未披露
      类别分布未披露
    type: process
    size: xl
    position:
      x: 860
      'y': 80
  - id: internal_set
    label: |-
      使用内部评测集
      包含人物事实问题与参考事实
      样本量与划分未公开
      未发布题目载荷
    type: database
    size: xl
    position:
      x: 1120
      'y': 80
  - id: model_snapshot
    label: |-
      选择系统卡所报模型快照
      系统卡比较具名模型版本
      分数对应各卡特定运行
      未发布通用固定检查点
    type: process
    size: xl
    position:
      x: 1380
      'y': 80
  - id: model_response
    label: |-
      向模型提出 PersonQA 问题
      生成自然语言回答
      保留是否尝试作答
      提示词与生成设置未公开
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: attempted_scope
    label: |-
      应用已尝试答案口径
      准确率面向已尝试答案
      拒答与弃答处理未披露
      精确分母未披露
    type: process
    size: xl
    position:
      x: 1640
      'y': 260
  - id: accuracy
    label: |-
      计算准确率
      模型是否正确回答
      越高越好
      精确评分器未发布
    type: process
    size: xl
    position:
      x: 1380
      'y': 260
  - id: hallucination
    label: |-
      计算幻觉率
      模型产生幻觉的频率
      越低越好
      精确评分器未发布
    type: process
    size: xl
    position:
      x: 1380
      'y': 500
  - id: report
    label: |-
      分别报告两项指标
      准确率 · 越高越好
      幻觉率 · 越低越好
      两项结果分开解释
    type: terminal
    size: xl
    position:
      x: 1120
      'y': 400
  - id: freshness_audit
    label: |-
      审核参考事实时效性
      过时测试事实会夸大幻觉率
      当前子女事实可能多于金标
      后续答案需更仔细复核
    type: process
    size: xl
    position:
      x: 860
      'y': 400
  - id: claim_tradeoff
    label: |-
      系统卡所报解释
      o3 整体产生更多陈述
      正确与幻觉陈述均会增多
      原因尚未确定
    type: document
    size: xl
    position:
      x: 600
      'y': 680
  - id: construction_boundary
    label: |-
      构建公开边界
      来源选择未披露
      编写与标注未披露
      复核与仲裁未披露
    type: document
    size: xl
    position:
      x: 1120
      'y': 240
  - id: evaluation_boundary
    label: |-
      评测实现边界
      提示词与解析器未披露
      生成设置未披露
      试验次数与评分器未披露
    type: document
    size: xl
    position:
      x: 1900
      'y': 240
  - id: release_boundary
    label: |-
      公开发布边界
      无公开数据集或仓库
      无公开 Git 提交可记录
      无公开数据 revision 或哈希可记录
    type: document
    size: xl
    position:
      x: 80
      'y': 360
