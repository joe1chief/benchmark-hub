  - from: accuracy
    to: report
    type: primary
  - from: hallucination
    to: report
    type: primary
  - from: report
    to: freshness_audit
    type: primary
  - from: report
    to: claim_tradeoff
    type: secondary
    style:
      dashed: true
    waypoints:
      - x: 1120
        'y': 640
      - x: 730
        'y': 640
