meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Multi-IF Build and Evaluation Process
  description: >-
    Paper-aligned expansion of English IFEval prompts into compatible three-turn conversations, seven additional
    languages, two-stage quality filters, cumulative rollouts, and strict/loose rule-based metrics.
  legend: >-
    Multi-IF contains 4,501 three-turn conversations in English, French, Hindi, Italian, Portuguese, Chinese, Spanish,
    and Russian.
nodes:
  - id: goal
    label: |-
      Extend Rule-based IFEval
      Add Multi-turn Instruction Retention
      Add Multilingual Coverage
      Keep Script-verifiable Constraints
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: source
    label: |-
      Start from English IFEval
      Use the Original Prompt as Turn 1
      Preserve Its Verifiable Instructions
      Prepare Two Following Turns
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: expand
    label: |-
      Generate Turns 2 and 3
      Sample One of 30 Instruction Types
      Llama 3.1 405B Uses Prior Prompts
      Write a Natural Follow-up Prompt
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: conflict_scan
    label: |-
      Scan Cross-turn Conflicts
      Llama 3.1 405B Checks Instructions
      Detect Incompatible Requirements
      Form Candidate English Dialogues
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: conflict_human
    label: |-
      Human-verify Compatibility
      Remove Contradictory Prompts
      Keep Followable Instructions
      Produce the Golden English Set
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: translate
    label: |-
      Translate into Seven Languages
      Llama 3.1 405B Produces Drafts
      FR · HI · IT · PT · ZH · ES · RU
      Skip Language-inapplicable Constraints
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: audit
    label: |-
      Audit Every Translation
      Multilingual Professional Annotators
      Check Faithfulness and Native Style
      Rewrite 15 Percent on Average
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: sensitive
    label: |-
      Remove Sensitive Prompts
      LLM Flags Potential Content
      Humans Review Flagged Cases
      Delete Actual Sensitive Items
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: release
    label: |-
      Release Multi-IF
      4,501 Conversations
      Three User Turns Each
      Eight Languages
    type: database
    size: xl
    position:
      x: 1220
      'y': 500
  - id: rollout
    label: |-
      Run Cumulative Conversations
      Collect the Turn 1 Response
      Append Prior Prompts and Responses
      Generate Each Successive Response
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: metrics
    label: |-
      Compute Four Rule-based Metrics
      Instruction and Conversation Levels
      Strict and Loose Criteria
      Loose Mode Removes Edge Text
    type: process
    size: xl
    position:
      x: 740
      'y': 500
  - id: report
    label: |-
      Report Multi-turn Accuracy
      Average the Four Metrics
      Break Down by Turn and Language
      Compare 14 Leading Models
    type: terminal
    size: xl
    position:
      x: 500
      'y': 500
edges:
  - from: goal
    to: source
    type: primary
  - from: source
    to: expand
    type: primary
  - from: expand
    to: conflict_scan
    type: primary
  - from: conflict_scan
    to: conflict_human
    type: primary
  - from: conflict_human
    to: translate
    type: primary
  - from: translate
    to: audit
    type: primary
  - from: audit
    to: sensitive
    type: primary
  - from: sensitive
    to: release
    type: primary
  - from: release
    to: rollout
    type: primary
  - from: rollout
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
