meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArXivMath 构建流程
  description: 基于 arXiv:2605.00674 对齐的月度构建与最终答案评测流程。
  legend: ArXivMath 是动态基准；每个月从上月新发布的数学论文构建新版本，在降低污染风险的同时维持研究级难度。
nodes:
  - id: monthly_papers
    label: |-
      收集近期 arXiv 数学论文
      使用上月新提交论文
      覆盖多样研究领域
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: abstracts
    label: |-
      阅读标题与摘要
      聚焦论文核心研究结果
      拒绝不适合的摘要
    type: document
    size: xl
    position:
      x: 320
      'y': 170
  - id: candidate_generation
    label: |-
      生成候选问题
      Gemini 3.1 Pro Preview
      从摘要以中等推理强度生成
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: candidate_contract
    label: |-
      强制最终答案合同
      定义明确且自包含
      只有一个无歧义可验证答案
    type: document
    size: xl
    position:
      x: 880
      'y': 170
  - id: candidate_pool
    label: |-
      形成月度候选池
      约 200 道问题
      数值 • 公式 • 特定数学对象
    type: database
    size: xl
    position:
      x: 1160
      'y': 170
  - id: full_paper
    label: |-
      补齐缺失上下文
      用 DeepSeek-OCR-2 转换全文
      加入必要假设
    type: process
    size: xl
    position:
      x: 1440
      'y': 170
  - id: automatic_filters
    label: |-
      运行自动筛选
      自包含 • 无法由已有工作猜出
      未使用 AI • 核验作者专业性
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: author_review
    label: |-
      作者人工复核
      定义明确 • 非平凡 • 有研究价值
      删除所有存疑问题
    type: user
    size: xl
    position:
      x: 1160
      'y': 500
  - id: release
    label: |-
      发布月度 ArXivMath
      复核后约保留 30 题
      保存最终答案标准值
    type: database
    size: xl
    position:
      x: 880
      'y': 500
  - id: model_runs
    label: |-
      使用默认参数运行模型
      每个基准运行四次
      不启用搜索或代码工具
    type: process
    size: xl
    position:
      x: 600
      'y': 500
  - id: parser
    label: |-
      解析并验证最终答案
      基于 SymPy 判断精确等价
      与标准答案比较
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: format_repair
    label: |-
      修复格式失败
      要求模型重新表述
      使用预期答案格式
    type: process
    size: xl
    position:
      x: 40
      'y': 500
  - id: judge
    label: |-
      使用 LLM 正确性评审
      交叉检查解析器结论
      标记所有分歧
    type: process
    size: xl
    position:
      x: 40
      'y': 790
  - id: manual_disagreement
    label: |-
      人工解决分歧
      占答案不到 1%
      运行后复核可移除歧义题
    type: user
    size: xl
    position:
      x: 320
      'y': 790
  - id: report
    label: |-
      汇报 ArXivMath 表现
      多次运行平均最终答案准确率
      跟踪成本与月度版本
    type: terminal
    size: xl
    position:
      x: 600
      'y': 790
edges:
  - from: monthly_papers
    to: abstracts
    type: primary
  - from: abstracts
    to: candidate_generation
    type: primary
  - from: candidate_generation
    to: candidate_contract
    type: primary
  - from: candidate_contract
    to: candidate_pool
    type: primary
  - from: candidate_pool
    to: full_paper
    type: primary
  - from: full_paper
    to: automatic_filters
    type: primary
  - from: automatic_filters
    to: author_review
    type: primary
  - from: author_review
    to: release
    type: primary
  - from: release
    to: model_runs
    type: primary
  - from: model_runs
    to: parser
    type: primary
  - from: parser
    to: format_repair
    type: primary
  - from: format_repair
    to: judge
    type: primary
  - from: judge
    to: manual_disagreement
    type: primary
  - from: manual_disagreement
    to: report
    type: primary
modules: []
