meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArXivMath 论文对齐构建流程
  description: 依据 ArXivMath v2 附录 A.1、A.2、A.6.1 与 A.6.2，展示月度构建及解析器与裁判并行评测。
  legend: 格式修复是条件分支：仅解析格式失败时重述并重试；解析器与裁判不足 1% 的分歧进入人工复核。
nodes:
  - id: monthly_papers
    label: |-
      收集上月论文
      近期 arXiv 数学研究
      覆盖多样领域
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: candidate_pool
    label: |-
      生成约 200 道候选题
      聚焦核心研究结果
      一个可验证最终答案
    type: database
    size: xl
    position:
      x: 320
      'y': 180
  - id: screening
    label: |-
      筛选并修订问题
      补齐论文全文上下文
      删除存疑候选题
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: final_review
    label: |-
      MathArena 团队最终审核
      核验清晰性与正确性
      批准标准答案
    type: user
    size: xl
    position:
      x: 880
      'y': 180
  - id: release
    label: |-
      发布约 30 道问题
      月度动态基准
      保存最终标准答案
    type: database
    size: xl
    position:
      x: 1160
      'y': 180
  - id: model_outputs
    label: |-
      生成模型输出
      使用默认参数
      不启用搜索或代码工具
    type: process
    size: xl
    position:
      x: 1440
      'y': 180
  - id: parser
    label: |-
      运行精确答案解析器
      符号等价判断
      与标准答案比较
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: llm_judge
    label: |-
      并行运行 LLM 裁判
      独立检查答案正确性
      比较最终判定
    type: process
    size: xl
    position:
      x: 1160
      'y': 760
  - id: format_gate
    label: |-
      解析格式失败？
      有效解析不做修复
      仅路由格式失败
    type: decision
    size: xl
    position:
      x: 880
      'y': 500
  - id: restate
    label: |-
      要求模型重述答案
      使用预期答案格式
      不修改答案内容
    type: process
    size: xl
    position:
      x: 600
      'y': 390
  - id: parser_retry
    label: |-
      重试一次解析器
      解析重述后的最终答案
      保留新的判定
    type: process
    size: xl
    position:
      x: 600
      'y': 610
  - id: agreement_gate
    label: |-
      解析器与裁判一致？
      分歧少于 1%
      仅路由例外情况
    type: decision
    size: xl
    position:
      x: 320
      'y': 610
  - id: manual_review
    label: |-
      人工复核少于 1% 的分歧
      仅解决不一致结果
      记录最终判定
    type: user
    size: xl
    position:
      x: 320
      'y': 850
  - id: report
    label: |-
      报告最终准确率
      汇总重复运行结果
      跟踪月度版本
    type: terminal
    size: xl
    position:
      x: 40
      'y': 610
edges:
  - from: monthly_papers
    to: candidate_pool
    type: primary
  - from: candidate_pool
    to: screening
    type: primary
  - from: screening
    to: final_review
    type: primary
  - from: final_review
    to: release
    type: primary
  - from: release
    to: model_outputs
    type: primary
  - from: model_outputs
    to: parser
    type: primary
  - from: model_outputs
    to: llm_judge
    type: data
  - from: parser
    to: format_gate
    type: primary
  - from: format_gate
    to: restate
    type: optional
    label: 格式失败
  - from: restate
    to: parser_retry
    type: primary
  - from: format_gate
    to: agreement_gate
    type: primary
    label: 解析成功
  - from: parser_retry
    to: agreement_gate
    type: primary
  - from: llm_judge
    to: agreement_gate
    type: data
  - from: agreement_gate
    to: manual_review
    type: optional
    label: 分歧 < 1%
  - from: agreement_gate
    to: report
    type: primary
    label: 一致
  - from: manual_review
    to: report
    type: primary
modules: []
