meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArXivMath Build Process
  description: Paper-aligned monthly construction and final-answer evaluation workflow based on arXiv:2605.00674.
  legend: >-
    ArXivMath is dynamic: each monthly release is built from mathematics papers posted in the preceding month, reducing
    contamination while keeping research-level difficulty.
nodes:
  - id: monthly_papers
    label: |-
      Collect Recent arXiv Math Papers
      Use the Previous Month's Submissions
      Cover Diverse Research Fields
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: abstracts
    label: |-
      Read Titles and Abstracts
      Target Central Research Results
      Reject Unsuitable Abstracts
    type: document
    size: xl
    position:
      x: 320
      'y': 170
  - id: candidate_generation
    label: |-
      Generate Candidate Questions
      Gemini 3.1 Pro Preview
      Medium Reasoning from Abstracts
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: candidate_contract
    label: |-
      Enforce Final-Answer Contract
      Well-Defined and Self-Contained
      One Unambiguous Verifiable Answer
    type: document
    size: xl
    position:
      x: 880
      'y': 170
  - id: candidate_pool
    label: |-
      Form Monthly Candidate Pool
      About 200 Questions
      Number • Formula • Mathematical Object
    type: database
    size: xl
    position:
      x: 1160
      'y': 170
  - id: full_paper
    label: |-
      Recover Missing Context
      Convert Full Papers with DeepSeek-OCR-2
      Add Required Assumptions
    type: process
    size: xl
    position:
      x: 1440
      'y': 170
  - id: automatic_filters
    label: |-
      Run Automated Filters
      Self-Contained • Not Guessable from Prior Work
      No AI Use • Verify Author Expertise
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: author_review
    label: |-
      Authors Manually Review
      Well-Defined • Non-Trivial • Interesting
      Remove Every Doubtful Problem
    type: user
    size: xl
    position:
      x: 1160
      'y': 500
  - id: release
    label: |-
      Release Monthly ArXivMath
      Around 30 Problems after Review
      Store Ground-Truth Final Answers
    type: database
    size: xl
    position:
      x: 880
      'y': 500
  - id: model_runs
    label: |-
      Run Models with Default Parameters
      Four Runs per Benchmark
      No Search or Code Tools
    type: process
    size: xl
    position:
      x: 600
      'y': 500
  - id: parser
    label: |-
      Parse and Verify Final Answers
      SymPy-Based Exact Equivalence
      Compare with Ground Truth
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: format_repair
    label: |-
      Repair Formatting Failures
      Ask the Model to Restate
      Use the Expected Answer Format
    type: process
    size: xl
    position:
      x: 40
      'y': 500
  - id: judge
    label: |-
      Apply LLM Correctness Judge
      Cross-Check Parser Decisions
      Flag Every Disagreement
    type: process
    size: xl
    position:
      x: 40
      'y': 790
  - id: manual_disagreement
    label: |-
      Manually Resolve Disagreements
      Fewer Than 1% of Answers
      Post-Run Review Can Remove Ambiguity
    type: user
    size: xl
    position:
      x: 320
      'y': 790
  - id: report
    label: |-
      Report ArXivMath Performance
      Final-Answer Accuracy Averaged over Runs
      Track Cost and Monthly Versions
    type: terminal
    size: xl
    position:
      x: 600
      'y': 790
edges:
  - from: monthly_papers
    to: abstracts
    type: primary
  - from: abstracts
    to: candidate_generation
    type: primary
  - from: candidate_generation
    to: candidate_contract
    type: primary
  - from: candidate_contract
    to: candidate_pool
    type: primary
  - from: candidate_pool
    to: full_paper
    type: primary
  - from: full_paper
    to: automatic_filters
    type: primary
  - from: automatic_filters
    to: author_review
    type: primary
  - from: author_review
    to: release
    type: primary
  - from: release
    to: model_runs
    type: primary
  - from: model_runs
    to: parser
    type: primary
  - from: parser
    to: format_repair
    type: primary
  - from: format_repair
    to: judge
    type: primary
  - from: judge
    to: manual_disagreement
    type: primary
  - from: manual_disagreement
    to: report
    type: primary
modules: []
