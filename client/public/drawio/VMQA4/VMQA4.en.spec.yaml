  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VMQA4 Build and Evaluation Process
  description: >-
    VMQA4 is the name printed in the Gemini 2.5 Pro Preview card for SecureBio's single-choice early Virology
    Capabilities Test. The card describes it as a biological knowledge-and-reasoning MCQ evaluation and explicitly notes
    that VMQA refers to an earlier VCT version. It does not disclose item construction, scale, or split. Evaluation
    presents the external items, parses one choice, computes exact accuracy, and compares Gemini generations. The
    published successor VCT contains 322 expert-authored multimodal multiple-response questions, but those later details
    are provenance context and cannot be copied into VMQA4 as if they described the same release.
  legend: >-
    Source: Gemini 2.5 Pro Preview model card CBRN section and footnote 4; successor VCT arXiv:2504.16137 for provenance
    only. Solid arrows show the main flow explicitly supported by the paper or official documentation.
