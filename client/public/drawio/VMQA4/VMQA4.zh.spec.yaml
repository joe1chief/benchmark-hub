  layout: horizontal
  routing: orthogonal
  title: VMQA4 构建与评测流程
  description: >-
    VMQA4是Gemini 2.5 Pro Preview模型卡中对SecureBio早期Virology Capabilities
    Test单选版的称呼。模型卡将其描述为生物知识与推理选择题，并明确脚注VMQA是VCT早期版本；题目构建、规模与切分均未披露。评测提供外部题目，解析一个选项，计算严格准确率，并比较Gemini代际。公开的后续VCT包含322道专家编写的多模态多选题，但这些只能作为来源背景，不能直接复制为VMQA4自身细节。
  legend: >-
    来源：Gemini 2.5 Pro Preview model card CBRN section and footnote 4; successor VCT arXiv:2504.16137 for provenance
    only。实线箭头表示论文或官方资料明确支持的主流程。
