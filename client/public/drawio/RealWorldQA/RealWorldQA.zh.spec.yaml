  description: "RealWorldQA没有配套基准论文。xAI数据卡记录首版包含765张匿名化真实世界图像，其中包括车载图像和其他真实场景；每张图像配一个问题和一个易于验证的答案。数据卡把目标描述为真实世界理解并以CC BY-ND 4.0发布，但未披露图像来源比例、问题编写流程、标注者数量、质检阶段、提示格式或官方答案解析器。因此流程图仅展示已确认步骤，并把简单答案准确率标为公开评测惯例，而不虚构隐藏构建链路。"
  legend: "来源：xAI official Hugging Face dataset card Introduction and release metadata; no accompanying paper or detailed annotation protocol is published。实线箭头表示论文或官方资料明确支持的主流程。"
