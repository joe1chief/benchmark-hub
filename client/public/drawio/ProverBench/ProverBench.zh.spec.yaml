meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProverBench 构建与评测流程
  description: 按论文筛选AIME、教材与教程问题并形式化为Lean 4任务，再进行整段证明生成、形式验证与通过率报告。
  legend: ProverBench含325道形式化问题，其中15道来自AIME 2024-2025，另有310道教材或教育教程题，覆盖论文列出的九个竞赛与本科数学领域。
nodes:
  - id: step_1
    label: |-
      定义覆盖目标
      高中竞赛数学
      本科层级数学
      多种抽象层次与推理风格
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      收集AIME 2024-2025候选题
      覆盖AIME I与II场次
      考虑近期竞赛问题
      支持形式与非形式推理对比
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      为清晰形式化筛选
      排除几何问题
      排除组合与计数问题
      保留适合Lean的题目
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      选择15道AIME题
      覆盖初等数论
      覆盖初等代数
      在给定正确答案下形式化
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      筛选教材与教程
      使用高中竞赛例题
      使用本科课程材料
      增强主题与难度覆盖
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      形式化另外310道题
      数论与初等代数
      线性代数与抽象代数
      微积分 · 分析 · 概率
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      分配九个学科领域
      40 · 30 · 50 · 40 · 90
      30 · 10 · 10 · 10道题
      保留论文中的领域分布
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      封装Lean 4任务
      保存名称与数学领域
      保存导入项与header
      保存以by结束的formal_statement
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      冻结ProverBench
      15道AIME加310道教材题
      共325道形式化问题
      发布完整评测集
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      构建证明提示
      要求补全Lean 4代码
      包含导入项与定理陈述
      留下未完成证明体
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      选择生成模式
      非CoT：直接输出Lean代码
      CoT：先给出详细证明计划
      再构造最终形式证明
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      抽样候选证明
      使用声明的样本预算
      生成整段证明完成
      评测全体与AIME子集
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      在Lean 4中验证
      使用Lean 4.9.0-rc2环境
      只接受通过形式检查的证明
      拒绝无法编译的代码
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告形式证明表现
      统计至少一次求解成功的题
      按样本预算计算通过率
      拆分全体与AIME 24-25
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
