  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PACE-Bench 构建与评测流程
  description: 与论文一致地展示如何通过相关性与杠杆度筛选，为四个昂贵 Agent 目标构建紧凑的非 Agent 代理。
  legend: PACE-Bench 是 PACE 框架的具体产物：在严格留一模型评测下，为每个目标选择约100个带权代理实例。
nodes:
  - id: step_1
    label: |-
      评测四个Agent目标
      GAIA · SWE-Bench Verified
      SWE-Bench Multimodal · SWT-Bench
      统一使用OpenHands Index框架
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      评测19个来源基准
      低成本非Agent原子实例
      覆盖11类能力
      使用lm-eval或官方代码
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      构建校准矩阵
      14个模型的来源得分矩阵X
      目标实例级得分
      聚合目标均值y
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      执行严格模型留一验证
      留出一个被测模型
      其余13个模型用于校准
      对14个模型依次重复
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      自助采样目标实例
      有放回采样目标条目
      稳定目标均值估计
      重复筛选与拟合
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      计算X的薄SVD
      分解来源实例响应
      得到右奇异向量V
      表示全局几何结构
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      计算两类信号
      由V得到杠杆分h
      与目标均值的绝对Spearman rho
      仅使用校准模型
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      选择局部子集
      按绝对rho排序
      保留前C_L个Local候选
      强调目标相关性
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      选择全局子集
      按h乘绝对rho排序
      保留前C_G个Global候选
      兼顾几何信息与相关性
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      形成具体目标代理
      处理Local与Global重叠
      按固定比例继续扩展候选
      达到C=100个唯一实例后停止
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      投影局部与全局得分
      使用各子集的SVD特征
      拟合两个互补视角
      只在校准模型上拟合
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      拟合两类预测目标
      线性最小二乘预测绝对得分
      逻辑回归预测成对排序
      预测留出模型的Agent能力
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      集成两条路径
      混合Local与Global预测器
      调节混合系数lambda
      序列化来源ID指标权重与图像
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      验证代理质量
      MAE 3.80% · Spearman 0.81
      成对准确率84.37%
      目标评测成本低于1%
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
