  title: PACE-Bench Build and Evaluation Process
  description: >-
    Paper-aligned construction of compact non-agentic proxies for four expensive agentic targets through relevance and
    leverage selection.
  legend: >-
    PACE-Bench is the concrete output of the PACE framework: one approximately 100-instance weighted proxy per target,
    selected under strict leave-one-model-out evaluation.
