meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KontextBench Build Process
  description: >-
    Paper-aligned construction of the crowd-sourced real-world image-editing benchmark introduced with FLUX.1 Kontext,
    from diverse source images and user instructions to five task categories and human-led evaluation.
  legend: >-
    The paper reports 1,026 unique image-prompt pairs from 108 base images. It does not disclose a finer annotation or
    filtering protocol, so the diagram does not infer unreported quality-control stages.
nodes:
  - id: use_cases
    label: |-
      Crowd-source Real-world Use Cases
      Collect Practical Editing Requests
      Favor Authentic User Workflows
      Avoid Synthetic-only Task Distributions
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: images
    label: |-
      Curate 108 Base Images
      Personal Photographs
      CC-licensed and Public-domain Art
      AI-generated Visual Content
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: pairs
    label: |-
      Pair Image with Edit Instruction
      Multiple Prompts per Base Image
      Preserve Image and Prompt Indices
      Assign a Unique Pair Key
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: categories
    label: |-
      Tag Five Core Task Categories
      Local Editing 416 · Global Editing 262
      Text Editing 92 · Style Reference 63
      Character Reference 193
    type: document
    size: xl
    position:
      x: 860
      'y': 40
  - id: dataset
    label: |-
      Release KontextBench · 1,026
      Unique Source-image and Prompt Pairs
      Image · Instruction · Category · Key
      MIT-licensed Benchmark Metadata
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: generate
    label: |-
      Generate Comparable Model Outputs
      Run FLUX.1 Kontext Variants
      Run Proprietary and Open Baselines
      Publish Reported Baseline Samples
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: human
    label: |-
      Conduct Human Evaluation
      Image Quality and Instruction Editing
      Local · Global · Text · Style · Character
      Compare Systems by Task Category
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: quantitative
    label: |-
      Add Quantitative Checks
      AuraFace Input-output Similarity for CREF
      Median Image-to-image Latency
      Track Character Drift Across Edits
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: report
    label: |-
      Report KontextBench Results
      Human Scores by Editing Category
      Character-reference Face Similarity
      Generation Efficiency and Consistency
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 380
edges:
  - from: use_cases
    to: images
    type: primary
  - from: images
    to: pairs
    type: primary
  - from: pairs
    to: categories
    type: primary
  - from: categories
    to: dataset
    type: primary
  - from: dataset
    to: generate
    type: primary
  - from: generate
    to: human
    type: primary
  - from: human
    to: quantitative
    type: primary
  - from: quantitative
    to: report
    type: primary
modules: []
