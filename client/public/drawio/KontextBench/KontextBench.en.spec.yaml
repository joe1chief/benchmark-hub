meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KontextBench Build Process
  description: >-
    Paper- and artifact-aligned construction and evaluation of KontextBench, separating the two reported inputs, the
    pinned test artifact, three parallel single-turn evaluations, and the paper's independent multi-turn study.
  legend: >-
    Evidence pins: arXiv:2506.15742v2; official FLUX.1 Kontext release commit 57ce4051906a986d39c3ec51571b32c239c7d165;
    official dataset snapshot fb9b2cb88bb41632b81a02c4f98fa33b00941f92. Solid arrows show the core construction and
    single-turn evaluation; dashed arrows show the separate multi-turn study. The paper does not report collection,
    filtering, annotation, quality-control, generation, human-rating, AuraFace-subset, timing, or aggregation protocols.
    The pinned HF test artifact contains inputs only and no baseline samples, evaluation code, or raw votes. Its MIT tag
    coexists with a scientific-and-research-use-only statement for the benchmark and included images.
