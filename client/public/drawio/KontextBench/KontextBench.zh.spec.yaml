meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KontextBench 构建流程
  description: 对齐论文与公开产物的 KontextBench 构建和评测流程，区分两类已报告输入、固定版本测试集产物、 三条并行单轮评测，以及论文独立开展的多轮研究。
  legend: >-
    证据版本：arXiv:2506.15742v2；官方 FLUX.1 Kontext 发布提交 57ce4051906a986d39c3ec51571b32c239c7d165；官方数据集快照
    fb9b2cb88bb41632b81a02c4f98fa33b00941f92。实线表示核心构建与单轮评测，虚线表示独立多轮研究。 论文未披露采集、筛选、标注、质检、生成、人评、AuraFace 子集、时延或汇总协议。固定 HF
    测试集 仅含输入，不含基线样例、评测代码或原始投票；其 MIT 标记与“基准及所含图像仅供科研使用”的说明并存。
