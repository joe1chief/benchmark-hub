meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KontextBench 构建流程
  description: 对齐 FLUX.1 Kontext 论文的真实图像编辑基准构建流程，从众包使用场景、多源基础图像与编辑指令， 到五类任务组织和以人工比较为主的评测。
  legend: 论文明确报告从 108 张基础图像形成 1,026 个独特图像-提示对，但没有披露更细的标注或过滤协议， 因此图中不推测论文未报告的质检环节。
nodes:
  - id: use_cases
    label: |-
      众包真实使用场景
      收集实际图像编辑请求
      覆盖真实用户工作流
      避免仅由合成任务构成
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: images
    label: |-
      整理 108 张基础图像
      个人照片
      开放许可与公有领域艺术图像
      人工智能生成视觉内容
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: pairs
    label: |-
      配对图像与编辑指令
      每张基础图像可对应多个提示
      保留图像与提示索引
      分配唯一配对标识
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: categories
    label: |-
      标注五类核心任务
      局部编辑 416 · 全局编辑 262
      文本编辑 92 · 风格参考 63
      角色参考 193
    type: document
    size: xl
    position:
      x: 860
      'y': 40
  - id: dataset
    label: |-
      发布 KontextBench · 1,026
      独特源图像与提示配对
      图像 · 指令 · 类别 · 唯一标识
      开放许可的基准元数据
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: generate
    label: |-
      生成可比较的模型输出
      运行 FLUX.1 Kontext 各版本
      运行闭源与开放基线
      发布论文所报基线样例
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: human
    label: |-
      开展人工评测
      图像质量与指令编辑效果
      局部 · 全局 · 文本 · 风格 · 角色
      按任务类别比较系统
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: quantitative
    label: |-
      补充量化检查
      角色参考的人脸嵌入相似度
      图像到图像生成时延中位数
      跟踪多轮编辑中的角色漂移
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: report
    label: |-
      汇报 KontextBench 结果
      各编辑类别的人工评分
      角色参考人脸相似度
      生成效率与一致性
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 380
edges:
  - from: use_cases
    to: images
    type: primary
  - from: images
    to: pairs
    type: primary
  - from: pairs
    to: categories
    type: primary
  - from: categories
    to: dataset
    type: primary
  - from: dataset
    to: generate
    type: primary
  - from: generate
    to: human
    type: primary
  - from: human
    to: quantitative
    type: primary
  - from: quantitative
    to: report
    type: primary
modules: []
