meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthBench-Hallu 已披露评测流程
  description: 与论文对齐地展示 HealthBench-Hallu 对 HealthBench 模型回答执行的事实性评测，包括高精度声明抽取、实时证据验证、 加权计分，以及作者未公开资产的明确边界。
  legend: 实线表示已披露评测路径；虚线表示分析支路或未公开工件边界。
nodes:
  - id: evidence
    label: |-
      一手证据
      arXiv 2602.06570v1 · 第2.2.2/4.2.2节
      HF 集合 6965d81e
      模型快照 03a1fd5
    type: document
    size: xl
    position:
      x: 20
      'y': 260
  - id: responses
    label: |-
      HealthBench 任务回答
      非独立题集
      未报告题数
    type: database
    size: xl
    position:
      x: 260
      'y': 260
  - id: failure_types
    label: |-
      目标错误类型
      错误或误用医学知识
      捏造证据或数据
      歪曲因果关系
    type: document
    size: xl
    position:
      x: 500
      'y': 540
  - id: extract
    label: |-
      GPT-5 高精度声明抽取
      提高细粒度声明覆盖
    type: process
    size: xl
    position:
      x: 500
      'y': 260
  - id: normalize
    label: |-
      声明规范化
      原子性 + 指代消解
      丢弃噪声 + 干扰项
      去重并保持原顺序
    type: process
    size: xl
    position:
      x: 740
      'y': 260
  - id: claims
    label: |-
      原子声明
      自包含
      可独立验证
    type: database
    size: xl
    position:
      x: 980
      'y': 260
  - id: search
    label: |-
      实时多轮检索
      权威医学来源与临床指南
      不使用缓存证据
    type: process
    size: xl
    position:
      x: 1220
      'y': 260
  - id: verdict
    label: |-
      证据判定
      支持 / 不确定 / 驳斥
    type: decision
    size: xl
    position:
      x: 1460
      'y': 260
  - id: supported
    label: |-
      支持
      权重 0.0
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 20
  - id: uncertain
    label: |-
      不确定
      权重 0.5
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 240
  - id: refuted
    label: |-
      驳斥
      权重 1.0
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 460
  - id: weighted
    label: |-
      加权幻觉率
      H = 声明权重之和 /
      声明总数
    type: terminal
    size: xl
    position:
      x: 1940
      'y': 180
  - id: rates
    label: |-
      单独报告
      驳斥率
      不确定率
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 660
  - id: artifact_boundary
    label: |-
      未公开 HealthBench-Hallu 边界
      未公开样本或评测代码
      未公开提示词/检索预算/来源白名单
      及被评回答运行 ID
    type: document
    size: xl
    position:
      x: 260
      'y': 620
edges:
  - from: evidence
    to: responses
    type: primary
  - from: responses
    to: failure_types
    type: secondary
  - from: responses
    to: extract
    type: primary
  - from: failure_types
    to: extract
    type: secondary
  - from: extract
    to: normalize
    type: primary
  - from: normalize
    to: claims
    type: primary
  - from: claims
    to: search
    type: primary
  - from: search
    to: verdict
    type: primary
  - from: verdict
    to: supported
    type: primary
  - from: verdict
    to: uncertain
    type: secondary
  - from: verdict
    to: refuted
    type: primary
  - from: supported
    to: weighted
    type: primary
  - from: uncertain
    to: weighted
    type: primary
  - from: refuted
    to: weighted
    type: primary
  - from: verdict
    to: rates
    type: data
  - from: evidence
    to: artifact_boundary
    type: data
modules: []
