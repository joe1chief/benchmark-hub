      B1 · Select Real MCP Surface
      Six Operational Domains
      Maps · GitHub · Finance
      3D · Browser · Web Search
      11 Servers · 133 Tools
    type: database
    module: build
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: b2
    label: |-
      B2 · Define Scenario Taxonomy
      4–5 Task Types per Domain
