    module: build
    size: xl
    position:
      x: 600
      'y': 192
    style:
      fontSize: 8
  - id: b4
    label: |-
      B4 · Construction Difficulty Gate
      No MCP Needed → Reject
      Stably Solved within Up to Five Attempts → Reject
      Attempts Screen Tasks, Not Evaluation Runs
      Model/Seed + Rejection Log Unreported
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 192
    style:
      fontSize: 8
  - id: b5
    label: |-
      B5 · Design Execution Evaluators
      Format · Static · Dynamic
      Static: Manually Collected Fixed Answers
      Dynamic: Fetch Live Ground Truth
      No LLM-as-a-Judge
    type: process
    module: build
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 8
  - id: b6
    label: |-
      B6 · Other-author Cross-check
      Tasks + Evaluators
      Feasibility · Ambiguity · Correctness
      Final: 231 Tasks · 84 Unique Evaluators
      Annotator Count/Agreement Unreported
    type: process
    module: build
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 8
