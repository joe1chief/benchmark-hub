meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCP-Universe Build Process
  description: >-
    Reconstructs MCP-Universe's manual real-world task design, author cross-checks, execution-based evaluator creation,
    automatic run configuration, MCP interaction, and binary success measurement.
  legend: >-
    The released benchmark contains 231 tasks, 11 real MCP servers with 133 tools, and 84 unique evaluators: 4 format,
    32 static, and 48 dynamic evaluators.
nodes:
  - id: domains
    label: |-
      Select Six Real-world Domains
      Location · Repository · Finance
      3D Design · Browser Automation
      Web Search
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: servers
    label: |-
      Integrate Authentic MCP Services
      11 Real Servers · 133 Tools
      Real APIs · Data · Environments
      Single-server and Multi-server Tasks
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: scenarios
    label: |-
      Brainstorm Common Scenarios
      Four or Five Task Types per Domain
      Cover Practical Usage Patterns
      Require Real Tool Interaction
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: challenge
    label: |-
      Reject Simple Candidates
      Discard Tasks Solvable without MCP
      Discard Tasks Solved Consistently
      with MCP within Five Retries
    type: decision
    size: xl
    position:
      x: 860
      'y': 40
  - id: author
    label: |-
      Manually Author 231 Tasks
      Goal · Initial Context
      Accessible Tools and Servers
      Challenging Real-world Instructions
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: task_review
    label: |-
      Cross-check Every Task
      Feasibility
      Ambiguity
      Correctness
    type: decision
    size: xl
    position:
      x: 1420
      'y': 40
  - id: evaluators
    label: |-
      Build 84 Execution Evaluators
      4 Format · 32 Static
      48 Dynamic
      Encode Predefined Success Criteria
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: eval_review
    label: |-
      Cross-check Every Evaluator
      Feasibility · Ambiguity · Correctness
      Manually Store Invariant Answers
      Automate Real-time Ground Truth
    type: decision
    size: xl
    position:
      x: 1140
      'y': 420
  - id: configure
    label: |-
      Configure Each Evaluation Automatically
      Build the LLM-agent Pair
      Select Servers and Evaluators
      Allocate Resources and API Endpoints
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: execute
    label: |-
      Execute through MCP
      ReAct or ReAct with Exploration
      Identify and Sequence Unknown Tools
      Capture the Full Interaction Log
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: assess
    label: |-
      Run Objective Checks
      Format Compliance
      Time-invariant Content Matching
      Dynamic Real-time Verification
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Aggregate MCP-Universe Results
      Binary Pass or Fail per Task
      Success Rate across All Tasks
      Average Evaluator Score · Efficiency
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
