      Build LLM–Agent Pair
      Select Task Files + MCP Servers
      Attach Evaluators · Resources · Endpoints
      No Fixed Paper Run Seed Disclosed
    type: process
    module: execute
    size: xl
    position:
      x: 40
      'y': 944
    style:
      fontSize: 8
  - id: e2
    label: |-
      E2 · Restrict Listed Servers Only
      use_specified_server = true
      231 Tasks · 385 Server Entries
      Zero Entries Specify Individual Tools
      Expose All Schemas Returned by Listed Servers
    type: process
    module: execute
    size: xl
    position:
      x: 320
      'y': 944
    style:
      fontSize: 8
  - id: e3
    label: |-
      E3 · Paper Main Agent Protocol
      All Listed LLMs Use ReAct
      GPT-OSS Uses Agent SDK Exception
      Temperature 1.0 for All LLMs
      GPT-OSS Has No AS Metric
    type: process
    module: execute
    size: xl
    position:
      x: 600
      'y': 944
    style:
      fontSize: 8
  - id: d1
    label: |-
      D1 · Public YAML Drift
      7a804f8 Maps/Repo/Finance: Explore-and-Exploit
      v1.1.3 Finance: Function Call
      v1.1.3 Web Search: Harmony ReAct
      Iteration Caps Differ by Snapshot
    type: document
    module: execute
    size: xl
    position:
      x: 600
      'y': 1128
    style:
      fontSize: 8
  - id: e4
    label: |-
      E4 · Generate One ReAct Step
      JSON thought + action
      reason · server · tool · arguments
      or JSON thought + answer
      Invalid JSON/Action Enters Retry History
    type: process
    module: execute
    size: xl
    position:
      x: 880
      'y': 944
    style:
      fontSize: 8
  - id: e5
    label: |-
      E5 · Invoke MCP and Extend History
      Call Selected Server Tool
      Require First Result as TextContent
      Prompt Requests Optional <500-word Summary
      Repeat until Answer or Step Cap
    type: process
    module: execute
    size: xl
    position:
      x: 1160
      'y': 944
    style:
      fontSize: 8
  - id: e6
    label: |-
      E6 · Produce Answer, Trace, and Cleanup
      answer Payload Is Evaluator Input
      Cap Exhaustion Returns Fixed Failure String
      Save Evaluator Vector + Trace ID
      Run Configured Cleanups in Reverse
    type: terminal
    module: execute
    size: xl
    position:
      x: 1440
      'y': 944
    style:
      fontSize: 8
  - id: s1
    label: |-
      S1 · Evaluate Rule Expression
      Decode JSON · Get Field · Iterate · Length
      Apply Named Operation to the Derived Value
      Resolve Environment-backed Arguments
      Parse/Execution Error → Failed Check
    type: process
    module: score
    size: xl
    position:
      x: 1440
      'y': 1320
    style:
      fontSize: 8
  - id: s2
    label: |-
      S2 · Apply Objective Checks
      Format: JSON / Structural Compliance
      Static: Fixed Manual Ground Truth
      Dynamic: Runtime API / End-state Truth
      Domain-specific Ops; No LLM Judge
    type: process
    module: score
    size: xl
    position:
      x: 1160
      'y': 1320
    style:
      fontSize: 8
  - id: s3
    label: |-
      S3 · Retain Boolean Check Vector
      Each Rule: passed · reason · error
      Public Report Lists Passed/Not Passed
      Per-task Fraction + LLM Calls
      Trace Timing/Tokens Are Also Logged
    type: document
    module: score
    size: xl
    position:
      x: 880
      'y': 1320
    style:
      fontSize: 8
  - id: s4
    label: |-
      S4 · Binary Completion
      Paper E ∈ {0, 1}
      All Required Checks Must Pass
      Any Failure → Task Fail
      Retain Boolean Check Vector
    type: formula
    module: score
    size: xl
    position:
      x: 600
      'y': 1320
    style:
      fontSize: 8
  - id: s5
    label: |-
      S5 · Paper Aggregate Metrics
      SR = Successful Tasks / Tasks
      AE = Mean Passed-check % per Task
      AS = Mean Steps on Successful Tasks
      Domain + Overall SR · No Variance Reported
    type: terminal
    module: score
    size: xl
    position:
      x: 320
      'y': 1320
    style:
      fontSize: 8
  - id: s6
    label: |-
      S6 · Mutable Four-track Leaderboard
      Overall · LLM ReAct · LLM Function Calls · Agent
      Page Text: GPT-5 Best at 43.72 SR
      Tables: 44.59 Function Calls · 44.16 ReAct
      Live Results ≠ Paper-v1 Tables
    type: document
    module: score
    size: xl
    position:
      x: 40
      'y': 1320
    style:
      fontSize: 8
