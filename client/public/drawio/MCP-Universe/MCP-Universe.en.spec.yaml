meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MCP-Universe Construction, Release, Execution, and Scoring
  description: >-
    Evidence-bounded reconstruction from arXiv:2508.14704v1, the paper-era 7a804f8 source snapshot, and the latest
    stable public release v1.1.3 at commit 63fb05cee17538eb2ca7ac886a8fe74b5f9e0b4b. It separates the 231-task
    construction contract from mutable real-world MCP services and the post-paper live leaderboard.
  legend: >-
    Solid arrows follow the benchmark lifecycle. The dashed branch audits public YAML agent/config drift rather than
    paper-main setup. Public tasks and evaluator code are distinguishable from credentials, external services, live
    data, and leaderboard results that are not content-pinned by the paper.
