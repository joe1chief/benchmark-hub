    type: process
    module: build
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 8
  - id: b3
    label: |-
      B3 · Manually Brainstorm Tasks
      Goal G · Initial Context C
      Available Tools T_available
      Challenging Practical Instructions
      No Source Dataset or Train/Test Split Reported
