meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MCP-Universe 构建、发布、执行与计分流程
  description: >-
    基于 arXiv:2508.14704v1、论文期源码快照 7a804f8，以及最新稳定公开版本 v1.1.3（提交 63fb05cee17538eb2ca7ac886a8fe74b5f9e0b4b）的证据有界重建；区分 231
    题构建契约、可变的真实 MCP 服务与论文发表后的在线榜单。
  legend: 实线箭头表示基准生命周期；虚线分支审计公开 YAML 中的智能体/配置漂移，不属于论文主实验设置。公开任务与评估器代码， 和论文未内容固定的凭证、外部服务、实时数据及榜单结果明确分开。
nodes:
  - id: b1
    label: |-
      B1 · 选择真实 MCP 表面
      六个实际业务领域
      地图 · GitHub · 金融
      3D · 浏览器 · 网页搜索
      11 个服务器 · 133 个工具
    type: database
    module: build
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: b2
    label: |-
      B2 · 定义场景分类
      每领域 4–5 类任务
      路线/仓库/金融/3D/浏览器/搜索
      覆盖常见真实工作流
      单服务器与多服务器任务
    type: process
    module: build
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 8
  - id: b3
    label: |-
      B3 · 人工构思任务
      目标 G · 初始上下文 C
      可用工具 T_available
      高难度真实指令
      未描述来源数据集或训练/测试划分
    type: user
    module: build
    size: xl
    position:
      x: 600
      'y': 192
    style:
      fontSize: 8
  - id: b4
    label: |-
      B4 · 构题难度门控
      不用 MCP 可解 → 淘汰
      在最多五次内稳定解出 → 淘汰
      这些尝试用于筛题，不是评测重试
      模型/种子与淘汰日志未披露
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 192
    style:
      fontSize: 8
  - id: b5
    label: |-
      B5 · 设计执行式评估器
      格式 · 静态 · 动态
      静态：人工收集固定答案
      动态：获取实时真值
      不使用 LLM 裁判
    type: process
    module: build
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 8
  - id: b6
    label: |-
      B6 · 其他作者交叉核验
      任务 + 评估器
      可行性 · 歧义 · 正确性
      最终：231 题 · 84 个唯一评估器
      标注人数/一致性未披露
    type: process
    module: build
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 8
  - id: r1
    label: |-
      R1 · 论文期快照
      arXiv 2508.14704v1 · 唯一版本
      2025-08-20 提交 7a804f8
      基准数据位于 configs/test
      论文 PDF SHA-256 19a07fb6…
    type: document
    module: release
    size: xl
    position:
      x: 1440
      'y': 568
    style:
      fontSize: 8
  - id: r2
    label: |-
      R2 · 稳定公开版本
      发布 v1.1.3 · 提交 63fb05c…
      数据树 a28ba506… 与 HEAD 相同
      到 HEAD 有 102 个非数据文件变更
      当前路径：configs/mcpuniverse
    type: database
    module: release
    size: xl
    position:
      x: 1160
      'y': 568
    style:
      fontSize: 8
  - id: r3
    label: |-
      R3 · 审计引用任务套件
      45 地图 · 33 仓库 · 40 金融
      19 个 3D · 39 浏览器 · 55 搜索
      231 个唯一配置引用
      232 个 JSON · 1 个额外未引用
    type: database
    module: release
    size: xl
    position:
      x: 880
      'y': 568
    style:
      fontSize: 8
  - id: r4
    label: |-
      R4 · 发布任务契约
      文件名作为任务 ID
      category · question · output_format
      mcp_servers · use_specified_server
      evaluators · cleanups
    type: document
    module: release
    size: xl
    position:
      x: 600
      'y': 568
    style:
      fontSize: 8
  - id: r5
    label: |-
      R5 · 公开评估器表面
      767 条规则 · 每题 1–16 条
      题目/格式/真值/规则/代码公开
      169 题指定输出格式
      62 题包含状态清理
    type: document
    module: release
    size: xl
    position:
      x: 320
      'y': 568
    style:
      fontSize: 8
  - id: r6
    label: |-
      R6 · 可复现边界
      Apache-2.0 代码与配置公开
      API 密钥/账户/Blender 必需
      外部服务器提交与实时数据未固定
      README 仍指向 configs/test
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 568
    style:
      fontSize: 8
  - id: e1
    label: |-
      E1 · 加载领域配置
      构建 LLM–智能体组合
      选择任务文件 + MCP 服务器
      挂载评估器 · 资源 · 端点
      论文未披露固定运行种子
    type: process
    module: execute
    size: xl
    position:
      x: 40
      'y': 944
    style:
      fontSize: 8
  - id: e2
    label: |-
      E2 · 仅限定所列服务器
      use_specified_server = true
      231 题 · 385 条服务器项
      服务器项中 0 条指定单个工具
      暴露所列服务器返回的全部工具 Schema
    type: process
    module: execute
    size: xl
    position:
      x: 320
      'y': 944
    style:
      fontSize: 8
  - id: e3
    label: |-
      E3 · 论文主实验智能体协议
      所列 LLM 均使用 ReAct
      GPT-OSS 例外使用 Agent SDK
      所有 LLM 温度为 1.0
      GPT-OSS 不报告 AS 指标
    type: process
    module: execute
    size: xl
    position:
      x: 600
      'y': 944
    style:
      fontSize: 8
  - id: d1
    label: |-
      D1 · 公开 YAML 漂移
      7a804f8 地图/仓库/金融：探索并利用
      v1.1.3 金融：原生函数调用
      v1.1.3 网页搜索：Harmony ReAct
      迭代次数上限也随快照变化
    type: document
    module: execute
    size: xl
    position:
      x: 600
      'y': 1128
    style:
      fontSize: 8
  - id: e4
    label: |-
      E4 · 生成一步 ReAct
      JSON thought + action
      reason · server · tool · arguments
      或 JSON thought + answer
      无效 JSON/Action 写入重试历史
    type: process
    module: execute
    size: xl
    position:
      x: 880
      'y': 944
    style:
      fontSize: 8
  - id: e5
    label: |-
      E5 · 调用 MCP 并扩展历史
      调用选定服务器工具
      要求首个结果为 TextContent
      提示要求可选少于 500 词摘要
      直到给出答案或达到步数上限
    type: process
    module: execute
    size: xl
    position:
      x: 1160
      'y': 944
    style:
      fontSize: 8
  - id: e6
    label: |-
      E6 · 生成答案、轨迹并清理
      answer 载荷作为评估输入
      达上限返回固定失败字符串
      保存评估向量 + Trace ID
      逆序执行已配置清理
    type: terminal
    module: execute
    size: xl
    position:
      x: 1440
      'y': 944
    style:
      fontSize: 8
  - id: s1
    label: |-
      S1 · 求值评估表达式
      解析 JSON · 取字段 · 遍历 · 计数
      对派生值执行具名比较操作
      解析环境变量提供的参数
      解析/执行错误 → 检查失败
    type: process
    module: score
    size: xl
    position:
      x: 1440
      'y': 1320
    style:
      fontSize: 8
  - id: s2
    label: |-
      S2 · 执行客观检查
      格式：JSON / 结构合规
      静态：固定人工真值
      动态：运行时 API / 终态真值
      领域自定义操作；无 LLM 裁判
    type: process
    module: score
    size: xl
    position:
      x: 1160
      'y': 1320
    style:
      fontSize: 8
  - id: s3
    label: |-
      S3 · 保留布尔检查向量
      每条：passed · reason · error
      公开报告列出通过/未通过数量
      每题通过比例 + LLM 调用数
      另记录轨迹耗时/Token
    type: document
    module: score
    size: xl
    position:
      x: 880
      'y': 1320
    style:
      fontSize: 8
  - id: s4
    label: |-
      S4 · 二元完成
      论文 E ∈ {0, 1}
      所需检查必须全部通过
      任一失败 → 整题失败
      保留布尔检查向量
    type: formula
    module: score
    size: xl
    position:
      x: 600
      'y': 1320
    style:
      fontSize: 8
  - id: s5
    label: |-
      S5 · 论文汇总指标
      SR = 成功任务数 / 任务数
      AE = 每题检查通过率的平均值
      AS = 成功任务的平均步数
      分领域 + 总体 SR · 未报告方差
    type: terminal
    module: score
    size: xl
    position:
      x: 320
      'y': 1320
    style:
      fontSize: 8
  - id: s6
    label: |-
      S6 · 可变四赛道榜单
      总体 · LLM ReAct · LLM 原生函数调用 · Agent
      页面文字：GPT-5 最佳 SR 43.72
      表格：函数调用 44.59 · ReAct 44.16
      在线结果 ≠ 论文 v1 表格
    type: document
    module: score
    size: xl
    position:
      x: 40
      'y': 1320
    style:
      fontSize: 8
