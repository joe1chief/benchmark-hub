meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ViVerBench 构建、专家修订与双评分流程
  description: >-
    ViVerBench定义6类视觉验证能力中的16项任务。初始数据由12位领域专家负责的人工分支、程序生成与增强开放数据共同构建，真假按1:1平衡，并为错误样例提供真值解释。首批5位新专家在人评前审核正确性和歧义并增强难度；随后10位专家分成两组各5人对成对样本进行人评。另一批5位新专家最终复检高频错题，删除错误项并修订歧义，得到3594条样本。规则准确率只检查真假标签；当真值和预测均为错误时，模型评分还用GPT-4.1核验预测解释与真值解释的一致性。
  legend: 来源：ViVerBench ICLR 2026 paper, Section 3 and Appendix A。实线箭头表示论文或官方资料明确支持的主流程。
