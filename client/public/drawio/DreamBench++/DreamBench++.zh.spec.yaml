meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DreamBench++ 构建流程
  description: 对齐论文的多样化个性化生成数据集构建流程与人类偏好对齐 GPT-4o 评测协议。
  legend: 实线箭头依次展示数据集整理、个性化图像生成、两阶段 GPT-4o 评分以及独立人工评分验证。
nodes:
  - id: sources
    label: |-
      参考图像来源
      作者自有 · Unsplash · Rawpixel · Google 图片搜索
      逐图核验学术使用版权
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: images
    label: |-
      整理 150 张多样参考图
      生物主体 · 物体 · 风格
      120 张写实 + 30 张非写实
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: prompts
    label: |-
      每张图编写 9 个提示
      4 个写实 · 3 个非写实
      2 个复杂或想象内容
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: benchmark
    label: |-
      DreamBench++ 评测集
      150 张参考图 · 1,350 个提示
      覆盖主体、物体、风格及难度
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: generation
    label: |-
      生成个性化图像
      论文比较 7 种现代方法
      尽量采用官方实现并调优参数
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: meta
    label: |-
      人工编写评测元提示
      任务 · 准则 · 0—4 分范围 · 输出格式
      输入参考图、生成图和文本提示
    type: document
    size: xl
    position:
      x: 1340
      'y': 250
  - id: think
    label: |-
      第一步 · 内部思考
      GPT-4o 确认理解任务
      自对齐总结并制定评分计划
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: dimensions
    label: |-
      第二步 · 两维度评分
      任务强化使评委持续遵循准则
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: concept
    label: |-
      概念保持
      图像 ↔ 图像
      形状 · 颜色 · 纹理 · 面部特征
    type: document
    size: xl
    position:
      x: 2120
      'y': 90
  - id: following
    label: |-
      提示遵循
      文本 ↔ 生成图像
      相关性 · 准确性 · 完整性 · 上下文
    type: document
    size: xl
    position:
      x: 2120
      'y': 410
  - id: gpt_score
    label: |-
      GPT-4o 评分输出
      两个维度分别给出 0—4 分
      聚合基准结果
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
  - id: human
    label: |-
      独立人工真值
      7 位受训标注员
      每个实例至少由两人评分
    type: process
    size: xl
    position:
      x: 2640
      'y': 250
  - id: report
    label: |-
      人类对齐报告
      Krippendorff 一致性分析
      比较 GPT-4o、DINO、CLIP-I、CLIP-T
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 250
edges:
  - from: sources
    to: images
    type: primary
  - from: images
    to: prompts
    type: primary
  - from: prompts
    to: benchmark
    type: primary
  - from: benchmark
    to: generation
    type: primary
  - from: generation
    to: meta
    type: primary
  - from: meta
    to: think
    type: primary
  - from: think
    to: dimensions
    type: primary
  - from: dimensions
    to: concept
    type: primary
  - from: dimensions
    to: following
    type: primary
  - from: concept
    to: gpt_score
    type: primary
  - from: following
    to: gpt_score
    type: primary
  - from: gpt_score
    to: human
    type: primary
  - from: human
    to: report
    type: primary
modules: []
