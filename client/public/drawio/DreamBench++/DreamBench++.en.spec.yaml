meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DreamBench++ Build Process
  description: >-
    Paper-aligned construction of the diverse personalized-generation set and the human-aligned GPT-4o evaluation
    protocol.
  legend: >-
    Solid arrows trace dataset curation, image generation, two-step GPT-4o judging, and validation against independent
    human ratings.
nodes:
  - id: sources
    label: |-
      Reference-image sources
      authors · Unsplash · Rawpixel · Google Image Search
      copyright checked for academic use
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: images
    label: |-
      Curate 150 diverse references
      live subjects · objects · styles
      120 photorealistic + 30 non-photorealistic
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: prompts
    label: |-
      Write 9 prompts per image
      4 photorealistic · 3 non-photorealistic
      2 complicated / imaginative
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: benchmark
    label: |-
      DreamBench++ evaluation set
      150 references · 1,350 prompts
      subject / object / style difficulty coverage
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: generation
    label: |-
      Generate personalized images
      seven modern methods in the paper
      official implementations and tuned settings
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: meta
    label: |-
      Human-written evaluation meta-prompt
      task · criteria · 0–4 range · output format
      reference + target + text prompt
    type: document
    size: xl
    position:
      x: 1340
      'y': 250
  - id: think
    label: |-
      Step 1 · internal thinking
      GPT-4o confirms task understanding
      self-aligned summary and scoring plan
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: dimensions
    label: |-
      Step 2 · score two dimensions
      task reinforcement keeps the judge on rubric
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: concept
    label: |-
      Concept preservation
      image ↔ image
      shape · color · texture · facial traits
    type: document
    size: xl
    position:
      x: 2120
      'y': 90
  - id: following
    label: |-
      Prompt following
      text ↔ generated image
      relevance · accuracy · completeness · context
    type: document
    size: xl
    position:
      x: 2120
      'y': 410
  - id: gpt_score
    label: |-
      GPT-4o score output
      independent 0–4 ratings per dimension
      aggregate benchmark results
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
  - id: human
    label: |-
      Independent human ground truth
      7 trained annotators
      every instance rated by at least two humans
    type: process
    size: xl
    position:
      x: 2640
      'y': 250
  - id: report
    label: |-
      Human-alignment report
      Krippendorff analysis
      compare GPT-4o, DINO, CLIP-I, and CLIP-T
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 250
edges:
  - from: sources
    to: images
    type: primary
  - from: images
    to: prompts
    type: primary
  - from: prompts
    to: benchmark
    type: primary
  - from: benchmark
    to: generation
    type: primary
  - from: generation
    to: meta
    type: primary
  - from: meta
    to: think
    type: primary
  - from: think
    to: dimensions
    type: primary
  - from: dimensions
    to: concept
    type: primary
  - from: dimensions
    to: following
    type: primary
  - from: concept
    to: gpt_score
    type: primary
  - from: following
    to: gpt_score
    type: primary
  - from: gpt_score
    to: human
    type: primary
  - from: human
    to: report
    type: primary
modules: []
