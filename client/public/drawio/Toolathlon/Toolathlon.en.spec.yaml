meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Toolathlon Build and Evaluation Process
  description: >-
    Toolathlon assembles 604 tools across 32 consumer and professional applications, primarily by revising or
    implementing MCP servers. Benchmark builders instantiate realistic initial states from real software, manually
    source or craft 108 tasks across seven categories, and require cross-application workflows averaging about 20
    interaction turns. Every task packages its initial state, instruction, environment configuration, and a dedicated
    deterministic evaluation script. Runs are isolated to prevent cross-task interference. An agent receives the task
    and available tools, executes the long-horizon workflow, and the task-specific checker inspects the resulting
    environment state. The benchmark reports execution success and tool-call turns, with repeated-run reliability
    metrics on the leaderboard.
  legend: >-
    Source: Toolathlon arXiv:2510.25726; official Toolathlon project, dataset documentation, and hkust-nlp/Toolathlon
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
