meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Toolathlon 构建与评测流程
  description: >-
    Toolathlon汇集32个消费级与专业软件应用中的604个工具，主要通过修订或自行实现MCP服务器获得。构建者从真实软件中实例化具有真实感的初始状态，人工收集或设计7类共108个任务，并要求跨应用工作流，平均约20轮交互。每个任务均打包初始状态、指令、环境配置和专用的确定性评测脚本；运行彼此隔离，避免任务间干扰。智能体接收任务和可用工具后执行长视域工作流，再由任务专用检查器检查最终环境状态。基准报告执行成功率与工具调用轮数，排行榜还展示多次运行的可靠性指标。
  legend: >-
    来源：Toolathlon arXiv:2510.25726; official Toolathlon project, dataset documentation, and hkust-nlp/Toolathlon
    repository。实线箭头表示论文或官方资料明确支持的主流程。
