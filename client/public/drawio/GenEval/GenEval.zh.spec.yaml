meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenEval 构建流程
  description: 固定版本的提示生成、图像生成、检测与颜色校验、二值评分和人工验证流程。
  legend: 虚线箭头表示固定版本论文与仓库证据；实线箭头表示基准构建和评测。提示与元数据在仓库内，无独立官方数据集。
nodes:
  - id: evidence
    label: |-
      一手证据
      arXiv:2310.11513v1
      官方仓库 af4902f2
      无独立官方数据集
    type: document
    size: xl
    position:
      x: 40
      'y': 100
  - id: templates
    label: |-
      定义六类任务模板
      80 个 COCO 类 · 10 色
      数量 2–4 · 4 方位
    type: database
    size: xl
    position:
      x: 300
      'y': 100
  - id: sampling
    label: |-
      使用种子 43 采样
      单物体覆盖全部 80 类
      其余五类各采样 100
      按 YAML 表示去重
    type: process
    size: xl
    position:
      x: 560
      'y': 100
  - id: prompt_set
    label: |-
      发布 553 个结构化提示
      分项：80/99/80/94/100/100
      附带包含/排除约束元数据
    type: database
    size: xl
    position:
      x: 820
      'y': 100
  - id: generate
    label: |-
      每个提示生成 4 张图
      保留各模型默认生成参数
      保存评测元数据
    type: process
    size: xl
    position:
      x: 1080
      'y': 100
  - id: detect
    label: |-
      COCO Mask2Former 检测
      阈值 0.3 · 计数任务 0.9
      每类最多保留 16 个物体
    type: process
    size: xl
    position:
      x: 1340
      'y': 100
  - id: geometry
    label: |-
      检查包含/排除约束
      计数 + 基于中心的相对位置
      偏移 0.1 尺寸 · 方向分量 >0.5
    type: process
    size: xl
    position:
      x: 1340
      'y': 390
  - id: color_binding
    label: |-
      CLIP ViT-L/14 颜色分类
      边界框裁剪 + 分割掩码
      #999 背景 · 10 个候选色
    type: process
    size: xl
    position:
      x: 1080
      'y': 390
  - id: binary
    label: |-
      逐图二值正确性
      全部要求通过才计为正确
      同时保留失败原因
    type: process
    size: xl
    position:
      x: 820
      'y': 390
  - id: aggregate
    label: |-
      对图像正确性取均值
      报告六类任务得分
      六类等权均值为总分
    type: terminal
    size: xl
    position:
      x: 560
      'y': 390
  - id: human_validation
    label: |-
      人工验证：6,000 条标注
      1,200 张图 · 每图 5 人
      83% 对 88%；860 条全同意为 91%
    type: terminal
    size: xl
    position:
      x: 300
      'y': 390
edges:
  - from: evidence
    to: templates
    type: data
  - from: templates
    to: sampling
    type: primary
  - from: sampling
    to: prompt_set
    type: primary
  - from: prompt_set
    to: generate
    type: primary
  - from: generate
    to: detect
    type: primary
  - from: detect
    to: geometry
    type: primary
  - from: geometry
    to: color_binding
    type: primary
  - from: color_binding
    to: binary
    type: primary
  - from: binary
    to: aggregate
    type: primary
  - from: aggregate
    to: human_validation
    type: primary
modules: []
