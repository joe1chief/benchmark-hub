meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OneIG-Bench Build and Evaluation Process
  description: >-
    Paper-aligned construction of bilingual text-to-image prompt sets and automated evaluation across five fine-grained
    generation dimensions.
  legend: >-
    The release has 1,120 English prompts, their manually verified Chinese counterparts, and 200 additional multilingual
    prompts: 2,440 prompt records in total.
nodes:
  - id: scope
    label: |-
      Define Five Evaluation Dimensions
      Semantic Alignment · Text
      Knowledge and Reasoning · Style
      Diversity Across All Prompt Sets
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Curate Real-world Prompts
      Public Internet Data
      User Inputs
      Established Datasets
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: cluster
    label: |-
      Balance Scenes and Semantics
      Cluster Prompt Embeddings
      Prevent Category Dominance
      Maintain Five-dimension Proportions
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: dedupe
    label: |-
      Remove Semantic Duplicates
      Find High-overlap Prompts
      Compare with Cluster Centers
      Filter by Cosine Similarity
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: rewrite
    label: |-
      Rewrite Prompt Lengths
      Use GPT-4o
      Short under 30 · Medium 30–60
      Long over 60 · Ratio about 1:2:1
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: review
    label: |-
      Perform Manual Review
      Remove Sensitive Content
      Reject Conflicting Semantics
      Check Prompt Rationality
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: bilingual
    label: |-
      Create Chinese Prompt Sets
      Translate and Manually Verify 1,120
      Add 200 Multilingual Prompts
      Cover Culture and Portraits
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      Release Six Prompt Sets
      245 Anime · 244 Portrait
      206 Object · 200 Text · 225 Reasoning
      1,120 EN · 1,320 ZH
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: generate
    label: |-
      Generate Evaluation Images
      Run Selected Prompt Subsets
      Prefer Four Images per Prompt
      Store by Category and Model
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: alignment
    label: |-
      Score Semantic Alignment
      GPT-4o Builds DSG Graphs
      Qwen2.5-VL-7B Answers Questions
      Validate Leaves Only if Root Is Correct
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: text
    label: |-
      Score Text Rendering
      VLM Extracts and Cleans Text
      Edit Distance · Completion Rate
      Word Accuracy Composite
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: reason_style
    label: |-
      Score Reasoning and Style
      GPT-4o Answer · LLM2CLIP Cosine
      CSD and OneIG Style Encoders
      Maximum Reference Similarity
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: diversity
    label: |-
      Score Output Diversity
      Pair Images from Each Prompt
      DreamSim Cosine Similarity
      Average Within and Across Prompts
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Five Core Metrics
      English and Chinese Results
      Fine-grained Type and Length Analysis
      Compare Models by Subset
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
