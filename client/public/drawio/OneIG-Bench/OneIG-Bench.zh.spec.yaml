meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OneIG-Bench 构建与评测流程
  description: 对齐论文构建双语文生图提示集合，并从五个细粒度生成维度执行自动评测。
  legend: 发布集含 1,120 条英文提示、经人工核验的对应中文提示及 200 条额外多语种提示，共 2,440 条提示记录。
nodes:
  - id: scope
    label: |-
      定义五个评测维度
      语义对齐 · 文本渲染
      知识推理 · 风格
      全部提示集合的多样性
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      整理真实需求提示
      公开互联网数据
      用户输入
      既有公开数据集
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: cluster
    label: |-
      平衡场景与语义
      聚类提示嵌入
      避免单一类别占优
      维持五个维度的比例
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: dedupe
    label: |-
      去除语义重复
      发现高度重叠提示
      与聚类中心比较
      按余弦相似度过滤
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: rewrite
    label: |-
      改写提示长度
      使用 GPT-4o
      短于 30 · 中等 30 至 60
      长于 60 · 比例约 1:2:1
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: review
    label: |-
      执行人工审核
      移除敏感内容
      拒绝语义冲突
      检查提示合理性
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: bilingual
    label: |-
      构建中文提示集合
      翻译并人工核验 1,120 条
      增加 200 条多语种提示
      覆盖文化与人像主题
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      发布六个提示集合
      动漫 245 · 人像 244
      物体 206 · 文本 200 · 推理 225
      英文 1,120 · 中文 1,320
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: generate
    label: |-
      生成评测图像
      按所选维度运行提示子集
      建议每条提示生成四张图
      按类别与模型存储
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: alignment
    label: |-
      评测语义对齐
      GPT-4o 构建 DSG 问题图
      Qwen2.5-VL-7B 回答
      仅根节点正确时计入叶节点
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: text
    label: |-
      评测文本渲染
      VLM 提取并清理文字
      编辑距离 · 完成率
      词准确率复合分数
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: reason_style
    label: |-
      评测推理与风格
      GPT-4o 答案对 LLM2CLIP 余弦
      CSD 与 OneIG 风格编码器
      取参考图最高相似度
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: diversity
    label: |-
      评测输出多样性
      配对同一提示生成图
      计算 DreamSim 余弦相似度
      先逐提示再全局平均
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告五项核心指标
      分别展示中英文结果
      按类型和长度细分分析
      逐子集比较模型
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: sources
    type: primary
  - from: sources
    to: cluster
    type: primary
  - from: cluster
    to: dedupe
    type: primary
  - from: dedupe
    to: rewrite
    type: primary
  - from: rewrite
    to: review
    type: primary
  - from: review
    to: bilingual
    type: primary
  - from: bilingual
    to: release
    type: primary
  - from: release
    to: generate
    type: primary
  - from: generate
    to: alignment
    type: primary
  - from: alignment
    to: text
    type: primary
  - from: text
    to: reason_style
    type: primary
  - from: reason_style
    to: diversity
    type: primary
  - from: diversity
    to: report
    type: primary
modules: []
