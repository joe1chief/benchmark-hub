meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CritPt 研究挑战构建与评测流程
  description: 按论文与官方仓库对齐：从未发表的专家物理研究项目，经抗泄漏挑战设计、两步答案格式化、私有物理判分到五次运行挑战准确率。
  legend: 实线箭头依次表示专家整理、公开发布、模型生成、服务器判分与汇总。
nodes:
  - id: experts
    label: |-
      50 多位活跃物理研究者
      30 多家机构、11 个学科
      问题源于各自真实研究
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: author
    label: |-
      新建未发表、自包含的挑战
      模拟入门级完整研究项目
      只需公开知识但答案不可搜索
    type: process
    size: xl
    position:
      x: 320
      'y': 190
  - id: criteria
    label: |-
      人工设计抗猜测答案
      明示符号、约定和物理单位
      采用机器可验证输出格式
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: checkpoints
    label: |-
      每个复合挑战拆成 2—4 个模块检查点
      保留步骤依赖与完整挑战
    type: process
    size: xl
    position:
      x: 880
      'y': 190
  - id: review
    label: |-
      迭代专家复核与高层同行评审
      每个挑战平均投入 40 多专家小时
      检查歧义、可解性与判分
    type: process
    size: xl
    position:
      x: 1160
      'y': 190
  - id: release
    label: |-
      71 个挑战、190 个检查点
      1 个公开样例含解答
      70 个测试挑战的答案保持私有
    type: database
    size: xl
    position:
      x: 1440
      'y': 190
  - id: run
    label: |-
      运行完整挑战或检查点
      标准配置不提供前序标准答案
      运行 5 轮；可选代码和网页工具
    type: process
    size: xl
    position:
      x: 1720
      'y': 190
  - id: solve
    label: |-
      第一步：自由形式物理解答
      生成自然语言、数学式与推导
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: format
    label: |-
      第二步：填入给定代码模板
      规范化最终数值、符号式、数组、
      类别或 Python 函数
    type: process
    size: xl
    position:
      x: 2280
      'y': 190
  - id: batch
    label: |-
      提交完整 70 题测试批次
      缺失或不匹配的题目 ID 会被拒绝
      私有答案只留在评分服务器
    type: document
    size: xl
    position:
      x: 2560
      'y': 190
  - id: grade
    label: |-
      物理定制自动判分
      数值容差、符号等价
      或用隐藏用例测试 Python 函数
    type: process
    size: xl
    position:
      x: 2840
      'y': 190
  - id: score
    label: |-
      逐挑战判定正确性
      主要指标：70 个测试挑战
      运行 5 次的平均准确率
    type: terminal
    size: xl
    position:
      x: 3120
      'y': 190
edges:
  - from: experts
    to: author
    type: primary
  - from: author
    to: criteria
    type: primary
  - from: criteria
    to: checkpoints
    type: primary
  - from: checkpoints
    to: review
    type: primary
  - from: review
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: solve
    type: primary
  - from: solve
    to: format
    type: primary
  - from: format
    to: batch
    type: primary
  - from: batch
    to: grade
    type: primary
  - from: grade
    to: score
    type: primary
modules: []
