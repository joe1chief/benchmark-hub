meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Legal Agent Benchmark Build Process
  description: >-
    Official current-snapshot workflow for turning realistic client matters into isolated legal-agent tasks, atomic
    expert rubrics, criterion-level semantic judgments, and strict all-criteria task scores.
  legend: >-
    This benchmark has no associated research paper. The diagram follows Harvey's official benchmark announcement and
    repository snapshot: 1,660 tasks and about 101,000 criteria across 24 practice areas plus contracting.
nodes:
  - id: matters
    label: |-
      Start from Realistic Client Matters
      Practicing Lawyers Model Real Work
      Cover 24 Legal Practice Areas
      Include Contracting Workflows
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: decompose
    label: |-
      Decompose Matters into Associate Tasks
      About 50-word Partner-style Request
      Closed-universe Assignment
      Define Reviewable Deliverables
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: documents
    label: |-
      Build Synthetic Client Documents
      Generate Large Batches under Lawyer Guidance
      Include Key and Peripheral Materials
      Lawyer-review DOCX · XLSX · PPTX · PDF · Email
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: criteria
    label: |-
      Author Atomic Expert Criteria
      Binary · Equal-weight · Deliverable-scoped
      Add Match Rules and Source Documents
      Avoid a Single Golden Output
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: package
    label: |-
      Package Structured Task Records
      Title · Instructions · Work Type
      Deliverables · Criteria · Tags
      Version Documents with Each Task
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      Release the Evolving Benchmark
      1,660 Tasks · About 101,000 Criteria
      24 Practice Areas plus Contracting
      Open Repository under MIT License
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: sandbox
    label: |-
      Start One Isolated Container per Task
      Podman · No Network or Capabilities
      Read-only Source Documents
      Writable Output Directory
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: agent
    label: |-
      Run the Legal Agent Tool Loop
      Bash · Read · Write · Edit · Glob · Grep
      Continue until No Tool Calls or Max Turns
      Save Requested Deliverable Files
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: judge
    label: |-
      Judge One Criterion at a Time
      Default Claude Sonnet 4.6 · Temperature 0
      Inspect Only Relevant Deliverable Files
      Use Semantic Judgment · No Keyword Matching
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: score
    label: |-
      Apply Strict Task-level Scoring
      Criterion Pass Is Binary
      Task Score Is 1 Only If Every Criterion Passes
      No Partial Credit in the Headline Metric
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      Report Legal-agent Performance
      Headline All-criteria Task Pass Rate
      Diagnostic Pooled Criterion Pass Rate
      Add Heatmaps · Coverage · Tokens · Latency · Cost
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: matters
    to: decompose
    type: primary
  - from: decompose
    to: documents
    type: primary
  - from: documents
    to: criteria
    type: primary
  - from: criteria
    to: package
    type: primary
  - from: package
    to: release
    type: primary
  - from: release
    to: sandbox
    type: primary
  - from: sandbox
    to: agent
    type: primary
  - from: agent
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
