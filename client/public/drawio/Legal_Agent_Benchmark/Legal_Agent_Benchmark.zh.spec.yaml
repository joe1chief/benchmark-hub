meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Legal Agent Benchmark 构建流程
  description: 按官方当前快照，将真实客户事项转化为隔离的法律智能体任务、原子专家评分点、 逐评分点语义判断和严格的全评分点任务得分。
  legend: 该基准没有配套研究论文。本图依据 Harvey 官方发布说明与仓库快照： 1,660 个任务、约 101,000 个评分点，覆盖 24 个执业领域及合同工作。
nodes:
  - id: matters
    label: |-
      从真实感客户事项出发
      由执业律师模拟真实工作
      覆盖 24 个法律执业领域
      包含合同工作流
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: decompose
    label: |-
      将事项拆成初级律师任务
      约 50 字的合伙人式指令
      闭卷式材料范围
      定义可审阅交付物
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: documents
    label: |-
      构建合成客户材料
      在律师指导下批量生成
      同时包含关键与外围材料
      律师审核 DOCX · XLSX · PPTX · PDF · 邮件
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: criteria
    label: |-
      编写原子专家评分点
      二元 · 等权 · 限定到交付物
      添加匹配规则与来源材料
      不设置唯一标准交付物
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: package
    label: |-
      打包结构化任务记录
      标题 · 指令 · 工作类型
      交付物 · 评分点 · 标签
      将文档与任务一同版本化
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      发布持续演进的基准
      1,660 个任务 · 约 101,000 个评分点
      24 个执业领域及合同工作
      仓库采用 MIT 许可证开放
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: sandbox
    label: |-
      每个任务启动独立容器
      Podman · 无网络与额外权限
      来源文档只读
      输出目录可写
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: agent
    label: |-
      运行法律智能体工具循环
      Bash · Read · Write · Edit · Glob · Grep
      直到不再调用工具或达到轮数上限
      保存要求的交付文件
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: judge
    label: |-
      每次评判一个评分点
      默认 Claude Sonnet 4.6 · 温度 0
      只检查相关交付文件
      使用语义判断 · 不做关键词匹配
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: score
    label: |-
      应用严格任务级计分
      每个评分点二元通过
      仅当全部评分点通过时任务得 1 分
      核心指标不给部分分
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      汇报法律智能体表现
      核心为全评分点任务通过率
      辅助为汇总评分点通过率
      补充热图 · 覆盖率 · Token · 时延 · 成本
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: matters
    to: decompose
    type: primary
  - from: decompose
    to: documents
    type: primary
  - from: documents
    to: criteria
    type: primary
  - from: criteria
    to: package
    type: primary
  - from: package
    to: release
    type: primary
  - from: release
    to: sandbox
    type: primary
  - from: sandbox
    to: agent
    type: primary
  - from: agent
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
