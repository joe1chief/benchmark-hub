meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProtocolQA 构建与评测流程
  description: 按论文由两轮生物学专家构建实验方案故障排除选择题，再进行防污染发布、选择性作答评测、专家基线与开放回答验证。
  legend: ProtocolQA是LAB-Bench中135题的无工具子任务，论文公开约80%并私留20%；LAB-Bench总计2,457题不能作为ProtocolQA规模。
nodes:
  - id: step_1
    label: |-
      招募生物学专家
      签约生物学博士
      或顶尖博士项目学生
      依靠领域专家人工构建
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      提取已发表实验方案
      从protocols.io选择记录
      选择STAR Protocols文章
      保留可操作的实验步骤
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      注入一个或多个错误
      有意改变一个实验步骤
      明确破坏或改变实验输出
      也覆盖中间步骤失败
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      解释注入的错误
      记录改动为何错误
      说明预期负面影响
      将解释与修改方案配对
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      交给另一批专家
      进行第二轮问题撰写
      提供全部相关修改上下文
      分离错误创建与题目起草
    type: user
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      验证失败场景
      检查错误与解释是否对齐
      确认确实可能产生负面结果
      两项检查通过后才继续
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      起草故障排除问题
      描述假想的湿实验结果
      询问何种改动可改善结果
      正确答案对应注入错误
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      构建多项选择题
      保存问题与答案选项
      指定一个理想纠正措施
      加入合理的替代操作
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      在创作界面中审核
      用Airtable维护任务与元数据
      修订 · 拒绝 · 或批准草稿
      把通过题目合入语料库
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      冻结135道ProtocolQA题
      保持该子任务无工具
      公开发布约80%
      私留20%用于污染监测
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      使用零样本思维链提示
      随机打乱答案选项
      加入信息不足拒答选项
      要求答案标签内单个字母
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      解析模型选择
      用正则提取答案标签
      失败时回退到Claude 2解析
      把拒答视为未尝试
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      计算选择性指标
      准确率 = 正确数除以全部题
      精确率 = 正确数除以已尝试题
      覆盖率 = 已尝试题除以全部题
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      用人类与自由回答验证
      专家测验可使用研究工具
      不让作者看到自己编写的题
      专家评分20题开放回答子集
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: step_1
    to: step_2
    type: primary
  - from: step_2
    to: step_3
    type: primary
  - from: step_3
    to: step_4
    type: primary
  - from: step_4
    to: step_5
    type: primary
  - from: step_5
    to: step_6
    type: primary
  - from: step_6
    to: step_7
    type: primary
  - from: step_7
    to: step_8
    type: primary
  - from: step_8
    to: step_9
    type: primary
  - from: step_9
    to: step_10
    type: primary
  - from: step_10
    to: step_11
    type: primary
  - from: step_11
    to: step_12
    type: primary
  - from: step_12
    to: step_13
    type: primary
  - from: step_13
    to: step_14
    type: primary
modules: []
