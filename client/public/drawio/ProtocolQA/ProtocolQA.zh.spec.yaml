    type: primary
  - from: ongoing_review
    to: paper_set
    type: primary
  - from: paper_set
    to: zero_shot_cot
    type: primary
  - from: zero_shot_cot
    to: model_completion
    type: primary
  - from: model_completion
    to: text_parser
    type: primary
  - from: text_parser
