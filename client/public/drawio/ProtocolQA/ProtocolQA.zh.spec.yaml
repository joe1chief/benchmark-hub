    type: primary
  - from: selective_metrics
    to: three_run_report
    type: primary
  - from: paper_set
    to: open_answer_rewrite
    type: primary
    waypoints:
      - x: 3060
        'y': 200
      - x: 3060
        'y': 660
      - x: 2820
        'y': 660
