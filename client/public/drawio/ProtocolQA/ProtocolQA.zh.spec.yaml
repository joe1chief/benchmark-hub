meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProtocolQA 构建、评测与发布证据
  description: >-
    按论文呈现两轮专家注错构建、作者校准复核、无工具选择性评测，以及独立20题开放回答审计与固定公开发布证据。
  legend: >-
    实线表示论文披露的构建与评测；虚线表示固定论文或仓库证据、108公开与27私有快照、公开包许可及独立开放回答文件。
nodes:
  - id: source_evidence
    label: |-
      固定一手证据
      论文2407.10362v3 · SHA 7c781a703287
      Git 998a8e0a40cf · 方案文件均已哈希
      证据卡片 · 不是构建步骤
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: benchmark_scope
    label: |-
      ProtocolQA基准范围
      135道无工具实验方案故障排除选择题
      属于LAB-Bench而非全库2,457题
      构建 · 评测 · 审计
    type: document
    size: xl
    position:
      x: 280
      'y': 40
  - id: expert_round_one
    label: |-
      第一轮专家
      签约生物学专家
      生物学博士或顶尖博士项目学生
      制作修改后的实验方案材料
    type: user
    size: xl
    position:
      x: 520
      'y': 40
  - id: protocol_sources
    label: |-
      已发表实验方案来源
      protocols.io
      STAR Protocols
      提取可执行实验步骤
    type: database
    size: xl
    position:
      x: 760
      'y': 40
  - id: error_injection
    label: |-
      注入一个或多个错误
      修改或省略步骤
      明确改变或破坏实验输出
      也覆盖中间步骤失败
    type: process
    size: xl
    position:
      x: 1000
      'y': 40
  - id: error_explanation
    label: |-
      解释注入错误
      记录改动为何错误
      说明预期负面影响
      与修改后的方案配对
    type: document
    size: xl
    position:
      x: 1240
      'y': 40
  - id: expert_round_two
    label: |-
      第二轮专家
      另一批专家接收方案与解释
      选择候选并起草问题
      与注入错误的工作分离
    type: user
    size: xl
    position:
      x: 1480
      'y': 40
  - id: alignment_check
    label: |-
      检查错误与解释对齐
      确认解释匹配实际改动
      拒绝不对齐的候选
      对齐后才继续
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: outcome_check
    label: |-
      检查负面实验结果
      同意该错误会损害结果
      要求失败原因明确
      结果合理后才继续
    type: process
    size: xl
    position:
      x: 1960
      'y': 40
  - id: mcq_draft
    label: |-
      起草故障排除选择题
      描述假想实验结果
      询问如何改动以修复
      正确答案对应注入错误
    type: document
    size: xl
    position:
      x: 2200
      'y': 40
  - id: author_calibration
    label: |-
      作者校准
      作者细审每名写作者最初5–10题
      返工 · 接受 · 或移除
      校准后再扩大产题
    type: process
    size: xl
    position:
      x: 2440
      'y': 40
  - id: ongoing_review
    label: |-
      持续作者复核
      合入语料库前审核题目
      修订或拒绝有缺陷的草稿
      校准后持续维护质量
    type: process
    size: xl
    position:
      x: 2680
      'y': 40
  - id: paper_set
    label: |-
      冻结ProtocolQA
      135道多项选择题
      无工具生物学推理
      公开与私有部分共同评测
    type: database
    size: xl
    position:
      x: 2920
      'y': 40
  - id: zero_shot_cot
    label: |-
      零样本CoT · 不使用工具
      随机打乱答案选项
      加入明确拒答选项
      要求答案标签内单个字母
    type: process
    size: xl
    position:
      x: 2920
      'y': 320
  - id: model_completion
    label: |-
      收集模型文本
      不借助检索工具进行推理
      输出所选字母或拒答
      评测全部ProtocolQA题
    type: process
    size: xl
    position:
      x: 2680
      'y': 320
  - id: text_parser
    label: |-
      文本完成解析器
      正则读取答案标签
      Claude 2回退解析文本完成
      拒答计为未尝试
    type: process
    size: xl
    position:
      x: 2440
      'y': 320
  - id: selective_metrics
    label: |-
      计算选择性指标
      准确率 = 正确数 / 总题数
      精确率 = 正确数 / 已尝试数
      覆盖率 = 已尝试数 / 总题数
    type: process
    size: xl
    position:
      x: 2200
      'y': 320
  - id: three_run_report
    label: |-
      报告论文结果
      使用公开与私有部分
      每个模型取三次运行平均
      三项指标分别报告
    type: terminal
    size: xl
    position:
      x: 1960
      'y': 320
  - id: open_answer_rewrite
    label: |-
      独立20题开放回答审计
      必要时移除选择题措辞
      收集Claude 3.5与GPT-4o回答
      不是OpenAI的108题衍生集
    type: process
    size: xl
    position:
      x: 2680
      'y': 600
  - id: expert_grade
    label: |-
      生物学专家评分回答
      与理想选择题答案对照
      判定正确或错误
      由论文作者专家评分
    type: user
    size: xl
    position:
      x: 2440
      'y': 600
  - id: second_review
    label: |-
      第二名复核者检查全部评分
      复核完成后再报告
      人工准确率审计
      不是自动评分器
    type: process
    size: xl
    position:
      x: 2200
      'y': 600
  - id: open_answer_report
    label: |-
      报告开放回答准确率
      Claude 3.5 Sonnet为0.30
      GPT-4o为0.20 · 共20题
      与主选择题指标分开
    type: terminal
    size: xl
    position:
      x: 1960
      'y': 600
  - id: release_snapshot
    label: |-
      固定仓库快照
      提交998a8e0a40cf · 公开108 · 私有27
      公开SHA 08e85d9c0afb
      划分SHA 3e6774d7c05b
      精确对应135题发布口径
    type: database
    size: xl
    position:
      x: 3400
      'y': 40
  - id: license_boundary
    label: |-
      发布许可
      仓库LICENSE为CC BY-SA 4.0
      适用于公开发布包
      不据此推断排行榜
    type: document
    size: xl
    position:
      x: 3640
      'y': 40
  - id: openanswer_snapshot
    label: |-
      固定开放回答文件
      20行 · SHA 4ccc200873d4
      对应论文中的小规模审计
      不是ProtocolQA Open-Ended
    type: document
    size: xl
    position:
      x: 1720
      'y': 600
edges:
  - from: source_evidence
    to: benchmark_scope
    type: secondary
    style:
      dashed: true
  - from: benchmark_scope
    to: expert_round_one
    type: primary
  - from: expert_round_one
    to: protocol_sources
    type: primary
  - from: protocol_sources
