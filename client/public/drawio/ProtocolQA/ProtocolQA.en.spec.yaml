    size: xl
    position:
      x: 2440
      'y': 600
  - id: second_review
    label: |-
      Second Reviewer Checks Every Grade
      Resolve Review before Reporting
      Manual Accuracy Audit
      Not an Automatic Grader
    type: process
    size: xl
    position:
      x: 2200
      'y': 600
  - id: open_answer_report
