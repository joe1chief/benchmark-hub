meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProtocolQA Construction, Evaluation, and Release Evidence
  description: >-
    Paper-aligned two-expert protocol-error construction, calibrated author review, tool-free selective evaluation,
    and a separate 20-item open-answer audit with pinned public-release evidence.
  legend: >-
    Solid arrows show paper-disclosed construction and evaluation. Dashed arrows show fixed paper or repository
    evidence, the 108-public and 27-private snapshot, the public-package license, and the separate open-answer file.
