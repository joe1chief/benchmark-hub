meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DefenderBench Build Process
  description: Paper-aligned conversion of public cybersecurity data into modular interactive agent environments.
  legend: Solid arrows trace fixed-seed preprocessing, task-family environments, agent episodes, and normalized aggregation.
nodes:
  - id: sources
    label: |-
      Public cybersecurity sources
      CyberBattleSim · phishing · CTI
      CodeXGLUE · Devign · CVEFix
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: preprocess
    label: |-
      Data preprocessing module
      download/cache · fixed-seed shuffle
      filtering · test/few-shot sampling
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: suite
    label: Five cybersecurity task types
    type: decision
    size: xl
    position:
      x: 560
      'y': 210
  - id: intrusion
    label: |-
      Network intrusion
      CBS Chain + CTF text game
      JSON state · 3 actions · 100 steps
    type: document
    size: xl
    position:
      x: 820
      'y': 50
  - id: detection
    label: |-
      Detection and knowledge
      malicious text 500 · web 500 · CTI MCQA 500
      vulnerability CG 500 + DV 500
    type: document
    size: xl
    position:
      x: 820
      'y': 210
  - id: fixing
    label: |-
      Vulnerability fixing
      12,107 commits → single-method/single-CVE filter
      240 multilingual-code samples
    type: document
    size: xl
    position:
      x: 820
      'y': 370
  - id: environment
    label: |-
      Interactive task environment
      instruction + sample + optional few-shot + history
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: agent
    label: |-
      Standard agent interface
      action → observation → format feedback
      up to 5 steps; intrusion up to 100
    type: process
    size: xl
    position:
      x: 1340
      'y': 210
  - id: metrics
    label: |-
      Task-native metrics
      intrusion win % · macro-F1 · CodeBLEU
    type: decision
    size: xl
    position:
      x: 1600
      'y': 210
  - id: aggregate
    label: |-
      DefenderBench score
      unweighted mean of 8 reported task metrics
      average across 5 runs
    type: terminal
    size: xl
    position:
      x: 1860
      'y': 210
edges:
  - from: sources
    to: preprocess
    type: primary
  - from: preprocess
    to: suite
    type: primary
  - from: suite
    to: intrusion
    type: primary
  - from: suite
    to: detection
    type: primary
  - from: suite
    to: fixing
    type: primary
  - from: intrusion
    to: environment
    type: primary
  - from: detection
    to: environment
    type: primary
  - from: fixing
    to: environment
    type: primary
  - from: environment
    to: agent
    type: primary
  - from: agent
    to: metrics
    type: primary
  - from: metrics
    to: aggregate
    type: primary
modules: []
