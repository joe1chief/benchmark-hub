meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DefenderBench Build Process
  description: Paper- and implementation-aligned construction of five cybersecurity task types and eight reported metrics.
  legend: >-
    Solid arrows show the pinned toolkit flow; task nodes retain paper-versus-loader drift instead of presenting intent
    as released behavior.
nodes:
  - id: evidence_boundary
    label: |-
      Evidence boundary
      arXiv 2506.00739v4
      repo e431098e
      Zenodo DOI 13118970
    type: document
    size: xl
    position:
      x: 40
      'y': 330
  - id: sources
    label: |-
      Public upstream sources
      no frozen consolidated suite bundle
      toolkit downloads and caches inputs
      upstream revisions may drift
    type: database
    size: xl
    position:
      x: 300
      'y': 330
  - id: preprocess
    label: |-
      Task-specific preprocessing
      fixed-seed shuffle and filtering
      test / few-shot sampling
      CVEFix uses separate seed 42
    type: process
    size: xl
    position:
      x: 560
      'y': 330
  - id: suite
    label: Five task types
    type: decision
    size: xl
    position:
      x: 820
      'y': 330
  - id: intrusion
    label: |-
      Network intrusion
      Chain10 + ToyCTF6 in pinned code
      JSON/text game · 3 actions
    type: document
    size: xl
    position:
      x: 1080
      'y': 10
  - id: malicious
    label: |-
      Malicious content detection
      text 20,137 · web 15,612 after −144
      paper: 500 test + 10/class ICL
      web loader bug: both ICL pools positive
    type: document
    size: xl
    position:
      x: 1080
      'y': 170
  - id: cti
    label: |-
      CTI MCQA
      2,500 → 2,338 → 500 test + 20 ICL
      paper: remove inaccessible links
      loader only checks URL contains http
    type: document
    size: xl
    position:
      x: 1080
      'y': 330
  - id: vuln_detect
    label: |-
      Vulnerability detection
      two report columns share one corpus
      same 2,732-row Devign-derived test
      same seed → same 500-row subset
    type: document
    size: xl
    position:
      x: 1080
      'y': 490
  - id: fixing
    label: |-
      Vulnerability fixing
      12,107 commits · 4,249 projects
      repository filters → 8 languages × 30
      240 test samples · paper/repo drift
    type: document
    size: xl
    position:
      x: 1080
      'y': 650
  - id: intrusion_episode
    label: |-
      Intrusion episode
      action → observation history
      up to 100 agent steps
    type: process
    size: xl
    position:
      x: 1340
      'y': 90
  - id: static_episode
    label: |-
      Static-task episode
      up to 5 total attempts
      first answer counts as attempt 1
      format feedback before retry
    type: process
    size: xl
    position:
      x: 1340
      'y': 530
  - id: intrusion_metrics
    label: |-
      Two intrusion percentages
      nodes taken / total nodes
      takeover fraction, not binary win
    type: process
    size: xl
    position:
      x: 1600
      'y': 90
  - id: task_metrics
    label: |-
      Six static report columns
      five Macro-F1 columns
      CodeBLEU weights
      0.1 / 0.1 / 0.4 / 0.4
    type: process
    size: xl
    position:
      x: 1600
      'y': 530
  - id: aggregate
    label: |-
      Paper-table DefenderBench score
      DefB = sum(8 column percentages) / 8
      official runner does not compute it
    type: process
    size: xl
    position:
      x: 1860
      'y': 330
  - id: repeat
    label: |-
      Evaluation report
      five independent runs per experiment
      report the run mean
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 330
