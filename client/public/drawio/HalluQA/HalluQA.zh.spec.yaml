meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HalluQA 构建流程
  description: 与论文一致的三路 450 道中文对抗幻觉问题构建及 GPT-4 评测流程。
  legend: HalluQA 包含 175 道 misleading、69 道 misleading-hard 和 206 道 knowledge 问题。 三路分别针对模仿性虚假与事实错误，之后共用答案/证据标注和质量保证流程。
nodes:
  - id: route
    label: |-
      设计中文对抗问题
      覆盖历史、文化、风俗和社会现象
      按幻觉成因与难度分流
    type: decision
    size: xl
    position:
      x: 40
      'y': 300
  - id: misleading_design
    label: |-
      编写 misleading 问题
      总结 20 种 TruthfulQA 启发模式
      结合中国文化语境改写
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: glm_probe
    label: |-
      用 GLM-130B 探测五次
      提供六个人工中文问答示例
      至少 3/5 次出现虚假才保留
    type: process
    size: xl
    position:
      x: 640
      'y': 40
  - id: misleading_set
    label: |-
      定稿 misleading 子集
      作者编写 175 道问题
      覆盖 22 个领域
    type: database
    size: xl
    position:
      x: 940
      'y': 40
  - id: hard_design
    label: |-
      收集中文互联网高难混淆问题
      使用 ChatGPT 3.5 构造对抗题
      要求题目前提自身具有误导性
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: hard_set
    label: |-
      定稿 misleading-hard 子集
      作者审核 69 道问题
      覆盖 15 个领域
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: knowledge_design
    label: |-
      十名中文母语研究生实习生出题
      覆盖多领域事实知识
      准备候选问题与答案
    type: process
    size: xl
    position:
      x: 340
      'y': 560
  - id: dual_probe
    label: |-
      ChatGPT 与 Puyu 各探测五次
      两个模型都至少错 3/5 次
      收集约 1,000 道候选题
    type: process
    size: xl
    position:
      x: 640
      'y': 560
  - id: knowledge_set
    label: |-
      NLP 专家筛选 knowledge 子集
      核验标注后保留 206 道题
      覆盖 14 个领域
    type: database
    size: xl
    position:
      x: 940
      'y': 560
  - id: annotate
    label: |-
      添加答案集合与证据
      misleading：四个正确 + 四个错误答案
      knowledge：至少一个正确 + 一个错误答案
    type: document
    size: xl
    position:
      x: 1240
      'y': 300
  - id: quality
    label: |-
      按数据支路执行质量检查
      外部链接/解释支撑正确答案
      未参与出题的作者重写或删除缺陷题
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: dataset
    label: |-
      发布 HalluQA
      450 道中文对抗问题
      30 个领域 · 175 + 69 + 206
    type: database
    size: xl
    position:
      x: 1840
      'y': 300
  - id: inference
    label: |-
      要求每题必须作答
      流畅、直接且受正确示例支持
      除不可答题外拒答也计为幻觉
    type: process
    size: xl
    position:
      x: 2140
      'y': 300
  - id: judge
    label: |-
      使用 GPT-4-0613 评判
      提供正确答案示例与五项标准
      五次投票 · 温度 0 · top-p 0.5
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: score
    label: |-
      报告非幻觉率
      450 条回答中被判无幻觉的比例
      五票评判与人工一致率 93.50%
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 300
edges:
  - from: route
    to: misleading_design
    type: primary
  - from: misleading_design
    to: glm_probe
    type: primary
  - from: glm_probe
    to: misleading_set
    type: primary
  - from: route
    to: hard_design
    type: primary
  - from: hard_design
    to: hard_set
    type: primary
  - from: route
    to: knowledge_design
    type: secondary
  - from: knowledge_design
    to: dual_probe
    type: secondary
  - from: dual_probe
    to: knowledge_set
    type: secondary
  - from: misleading_set
    to: annotate
    type: primary
  - from: hard_set
    to: annotate
    type: primary
  - from: knowledge_set
    to: annotate
    type: secondary
  - from: annotate
    to: quality
    type: primary
  - from: quality
    to: dataset
    type: primary
  - from: dataset
    to: inference
    type: primary
  - from: inference
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
