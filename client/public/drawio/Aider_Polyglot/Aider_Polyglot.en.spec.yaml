meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Aider Polyglot Build Process
  description: >-
    Official-source-aligned six-language Exercism selection, seven-model difficulty probing, end-to-end file editing,
    and Docker test evaluation.
  legend: Read the benchmark selection row left-to-right, then the Aider execution row right-to-left.
nodes:
  - id: exercism
    label: |-
      Exercism Problem Pool
      697 Exercises
      Six Popular Languages
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: languages
    label: |-
      Language Coverage
      C++ / Go / Java / JavaScript
      Python / Rust
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: probe
    label: |-
      Seven-Model Difficulty Probe
      Every Model Attempts All 697
      Count Successful Solvers per Exercise
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: filter
    label: |-
      Difficulty Filter
      Retain Exercises Solved by 0-3 Models
      Exclude 472 Easier Exercises
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: dataset
    label: |-
      Aider Polyglot
      225 Hard Exercises
      C++26 / Go39 / Java47 / JS49 / Py34 / Rust30
    type: database
    size: xl
    position:
      x: 1160
      'y': 100
  - id: input
    label: |-
      Benchmark Task
      Natural-Language Coding Request
      Existing Source Files + Unit Tests
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: aider
    label: |-
      Run Aider with Model
      Select Edit Format
      Exercises Execute in Random Order
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: edit
    label: |-
      Translate Request into Code
      Format and Apply File Edits
      Save Edits to Local Source Files
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: docker
    label: |-
      Isolated Docker Execution
      Run Language-Specific Unit Tests
      Record Success / Failure per Exercise
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: report
    label: |-
      Benchmark Report
      Percent Completed Correctly
      Correct Edit Format / Well-Formed Rate
    type: terminal
    size: xl
    position:
      x: 600
      'y': 440
edges:
  - from: exercism
    to: languages
    type: primary
  - from: languages
    to: probe
    type: primary
  - from: probe
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: aider
    type: primary
  - from: aider
    to: edit
    type: primary
  - from: edit
    to: docker
    type: primary
  - from: docker
    to: report
    type: primary
modules: []
