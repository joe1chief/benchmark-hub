meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Aider Polyglot 构建流程
  description: 对齐官方资料的六语言 Exercism 筛选、七模型难度预试、端到端文件编辑与 Docker 测试流程。
  legend: 上排从左向右完成基准筛选，下排从右向左完成 Aider 执行评测。
nodes:
  - id: exercism
    label: |-
      Exercism 题目池
      共 697 道练习
      覆盖六种热门语言
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: languages
    label: |-
      语言覆盖
      C++ / Go / Java / JavaScript
      Python / Rust
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: probe
    label: |-
      七模型难度预试
      每个模型尝试全部 697 题
      统计每题成功模型数
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: filter
    label: |-
      难度过滤
      保留仅被 0-3 个模型解出的题
      排除另外 472 道较简单练习
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: dataset
    label: |-
      Aider Polyglot
      225 道困难练习
      C++26 / Go39 / Java47 / JS49 / Py34 / Rust30
    type: database
    size: xl
    position:
      x: 1160
      'y': 100
  - id: input
    label: |-
      基准任务
      自然语言编码需求
      现有源文件 + 单元测试
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: aider
    label: |-
      使用指定模型运行 Aider
      选择编辑格式
      练习按随机顺序执行
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: edit
    label: |-
      将需求转化为代码
      格式化并应用文件编辑
      保存到本地源文件
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: docker
    label: |-
      隔离 Docker 执行
      运行语言专用单元测试
      记录每题成功或失败
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: report
    label: |-
      基准报告
      正确完成题目百分比
      正确编辑格式 / 格式完好率
    type: terminal
    size: xl
    position:
      x: 600
      'y': 440
edges:
  - from: exercism
    to: languages
    type: primary
  - from: languages
    to: probe
    type: primary
  - from: probe
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: aider
    type: primary
  - from: aider
    to: edit
    type: primary
  - from: edit
    to: docker
    type: primary
  - from: docker
    to: report
    type: primary
modules: []
