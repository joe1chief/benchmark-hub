meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BigO(Bench) 构建流程
  description: 对齐论文的经验时空复杂度标注流程：从 Code Contests 正确 Python 解答出发，经 dataclass 解析、 沙箱性能分析、非负曲线拟合、框架验证与三类评测任务形成基准。
  legend: 先从左到右阅读性能分析流水线，再从右到左阅读数据发布与评测流水线。
nodes:
  - id: source
    label: |-
      Code Contests 来源池
      8,139题 / 1,485,888份解答
      仅保留通过公开与私有测试的Python解答
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: dataclass
    label: |-
      题目专用输入 Dataclass
      Llama 3.1 405B 生成解析器
      多轮回译覆盖82%的题目
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: filter
    label: |-
      基准过滤
      要求可用Dataclass + 至少50份解答
      删除异常数据类型与失败项
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: expand
    label: |-
      系统化扩展输入
      独立 / 联合增长参数规模
      随机与恒等扩展策略
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: profile
    label: |-
      隔离动态性能分析
      Bubblewrap 沙箱
      cProfile运行时间 + tracemalloc内存
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: fit
    label: |-
      推断复杂度曲线
      非负最小二乘
      最小残差 + 简单性偏置 + 曲线系数
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      BigO(Bench) 发布
      3,105题 / 1,190,250份解答
      时空类别 + 系数 + 原始性能数据
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: validate
    label: |-
      框架验证
      与人工标注匹配：时间92% / 空间84%
      检查覆盖率与多次运行自洽性
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: tests
    label: |-
      整理复杂度测试集
      时间：311题 / 640解答 / 11类
      空间：308题 / 636解答 / 5类
    type: document
    size: xl
    position:
      x: 880
      'y': 440
  - id: predict
    label: |-
      任务一：复杂度预测
      输入题目 + 人类解答
      预测时间与空间Big-O类别
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: generate
    label: |-
      任务二：约束代码生成
      输入题目 + 可行目标复杂度
      生成满足约束的正确Python解答
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      任务三与指标
      同类人类解答中的系数百分位
      Pass@k / Best@k / All@k
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: source
    to: dataclass
    type: primary
  - from: dataclass
    to: filter
    type: primary
  - from: filter
    to: expand
    type: primary
  - from: expand
    to: profile
    type: primary
  - from: profile
    to: fit
    type: primary
  - from: fit
    to: dataset
    type: primary
  - from: dataset
    to: validate
    type: primary
  - from: validate
    to: tests
    type: primary
  - from: tests
    to: predict
    type: primary
  - from: predict
    to: generate
    type: primary
  - from: generate
    to: report
    type: primary
modules: []
