meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BigO(Bench) Build Process
  description: >-
    Paper-aligned construction of empirical time-space complexity labels from correct Code Contests Python solutions,
    including dataclass parsing, sandbox profiling, non-negative curve fitting, validation, and three evaluation tasks.
  legend: Read the profiling pipeline left-to-right, then the released dataset and evaluation pipeline right-to-left.
