meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBullets Construction and Evaluation
  description: >-
    Primary-source workflow pinned to arXiv:2402.18060v6 and the official ChallengeClinicalQA data snapshot,
    distinguishing image removal from case exclusion and separating answer, explanation, and human evaluation.
  legend: >-
    Solid arrows show construction and scored experiment routes. Labeled branches expose the three paper prompts. Dashed
    arrows mark companion-data, robustness, contamination, supplementary configuration, rights, and reproducibility
    boundaries; those analyses do not filter the released 308 questions or contribute to a composite score.
