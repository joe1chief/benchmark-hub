meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBullets Build and Evaluation Process
  description: >-
    Paper-aligned construction of 308 text-only Medbullets Step 2/3 cases with expert explanations, controlled four- and
    five-option variants, and separate answer and explanation evaluation.
  legend: >-
    Medbullets is the 308-item subject of this diagram; the 1,524-item JAMA Clinical Challenge dataset remains a
    distinct companion track in the paper and is never merged into the Medbullets count.
nodes:
  - id: source
    label: |-
      Identify Medbullets Step 2/3 Posts
      Publicly Linked from X
      April 2022 to December 2023
      Simulated Challenging Clinical Cases
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: collect
    label: |-
      Collect Public Question Pages
      Preserve Case Description
      Preserve Question and Five Choices
      Preserve Expert Explanation
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: filter
    label: |-
      Enforce Text-only Eligibility
      Exclude Image-dependent Cases
      Keep Publicly Available Examples
      Retain Complete Answer Context
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: structure
    label: |-
      Standardize Each QA Record
      Case · Question · Five Choices
      Correct Answer
      Expert Rationale for All Options
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: release
    label: |-
      Form the Medbullets Dataset
      308 English Cases
      USMLE Step 2/3 Style
      Expert-written Explanations
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: variants
    label: |-
      Create Controlled Variants
      Medbullets-5 Keeps Five Choices
      Medbullets-4 Randomly Drops One Wrong Choice
      Support Comparison with MedQA-4
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: companion
    label: |-
      Keep JAMA as a Separate Track
      1,524 Cases · 13 Domains
      Four Choices · Expert Explanations
      Do Not Merge with the 308 Items
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: models
    label: |-
      Evaluate Seven LLMs
      GPT-3.5 · GPT-4 · PaLM 2
      Llama 2 · Llama 3
      MedAlpaca · Meerkat
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: direct
    label: |-
      Run Direct Answer Prompting
      X to Y
      Zero-shot or 2/5-shot
      Few-shot Uses Leave-one-out Examples
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: cot
    label: |-
      Run Two-stage CoT Prompting
      X to R then Y
      Generate Reasoning First
      Then Predict the Answer Choice
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: explain
    label: |-
      Generate Answer-conditioned Rationale
      X plus Gold Y to R
      Explain Why the Gold Is Best
      Evaluate Explanation Quality
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: answergrade
    label: |-
      Grade Answer Predictions
      Parse the Selected Choice
      Compare with the Gold Answer
      Report Accuracy
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: autograde
    label: |-
      Score Generated Explanations
      ROUGE-L · BERTScore · BLEURT
      BARTScore Variants · CTC
      G-Eval on Three Quality Axes
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Validate and Report Results
      30 Medbullets-5 Cases
      GPT-4 and PaLM 2 · Three Ratings Each
      Completeness · Correctness · Relevance
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: collect
    type: primary
  - from: collect
    to: filter
    type: primary
  - from: filter
    to: structure
    type: primary
  - from: structure
    to: release
    type: primary
  - from: release
    to: variants
    type: primary
  - from: variants
    to: companion
    type: primary
  - from: companion
    to: models
    type: primary
  - from: models
    to: direct
    type: primary
  - from: direct
    to: cot
    type: primary
  - from: cot
    to: explain
    type: primary
  - from: explain
    to: answergrade
    type: primary
  - from: answergrade
    to: autograde
    type: primary
  - from: autograde
    to: report
    type: primary
modules: []
