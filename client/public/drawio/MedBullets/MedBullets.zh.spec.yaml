meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedBullets 构建与评测流程
  description: 对齐论文构建 308 道纯文本 Medbullets Step 2/3 临床题，保留专家解析，形成四选项与五选项 对照版本，并分别评测答案与解释。
  legend: 本图主体是 308 条 Medbullets；论文中的 1,524 条 JAMA Clinical Challenge 是独立伴随评测轨道， 不计入 Medbullets 的 308 条规模。
nodes:
  - id: source
    label: |-
      定位 Medbullets Step 2/3 帖子
      由 X 平台公开链接
      时间为 2022-04 至 2023-12
      模拟高难度临床病例
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: collect
    label: |-
      收集公开题目页面
      保留病例描述
      保留问题和五个选项
      保留专家解析
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: filter
    label: |-
      执行纯文本准入筛选
      排除依赖图像的病例
      仅保留公开可用样本
      确保答案上下文完整
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: structure
    label: |-
      标准化每条问答记录
      病例 · 问题 · 五个选项
      正确答案
      解释所有选项的专家理由
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: release
    label: |-
      形成 Medbullets 数据集
      308 道英文病例题
      USMLE Step 2/3 风格
      配有专家撰写解析
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: variants
    label: |-
      创建受控对照版本
      Medbullets-5 保留五个选项
      Medbullets-4 随机删一个错误项
      用于和 MedQA-4 对比
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: companion
    label: |-
      将 JAMA 保持为独立轨道
      1,524 题 · 13 个领域
      四个选项 · 专家解析
      不与 308 条主体集合并
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: models
    label: |-
      评测七个大语言模型
      GPT-3.5 · GPT-4 · PaLM 2
      Llama 2 · Llama 3
      MedAlpaca · Meerkat
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: direct
    label: |-
      执行直接回答提示
      X 到 Y
      零样本或 2/5 样本
      少样本采用留一法示例
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: cot
    label: |-
      执行两阶段思维链提示
      X 到 R 再到 Y
      先生成推理过程
      再预测答案选项
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: explain
    label: |-
      生成答案条件解析
      X 加标准 Y 到 R
      解释标准答案为何最佳
      评估解释质量
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: answergrade
    label: |-
      评判答案预测
      解析模型所选选项
      与标准答案比较
      报告准确率
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: autograde
    label: |-
      自动评估生成解释
      ROUGE-L · BERTScore · BLEURT
      BARTScore 系列 · CTC
      G-Eval 三个质量维度
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      人工验证并报告结果
      30 道 Medbullets-5 题
      GPT-4 与 PaLM 2 · 每条三份评分
      完整性 · 正确性 · 相关性
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: collect
    type: primary
  - from: collect
    to: filter
    type: primary
  - from: filter
    to: structure
    type: primary
  - from: structure
    to: release
    type: primary
  - from: release
    to: variants
    type: primary
  - from: variants
    to: companion
    type: primary
  - from: companion
    to: models
    type: primary
  - from: models
    to: direct
    type: primary
  - from: direct
    to: cot
    type: primary
  - from: cot
    to: explain
    type: primary
  - from: explain
    to: answergrade
    type: primary
  - from: answergrade
    to: autograde
    type: primary
  - from: autograde
    to: report
    type: primary
modules: []
