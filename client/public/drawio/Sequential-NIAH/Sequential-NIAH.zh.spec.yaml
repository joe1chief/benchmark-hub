  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sequential-NIAH 构建与评测流程
  description: >-
    Sequential-NIAH通过三条流水线构建14000个长上下文样本。合成时序数据把虚构主体、时间和事件组合成3至15根针；真实时序数据来自ICEWS和FEG时序知识图谱，由GPT-4o把3至10个事件链改写为自然问答；真实逻辑数据筛选2986条私有开放域问答，人工抽样检查后改写为自然的顺序针。最终6000条合成时序、5014条真实时序和2986条真实逻辑问答，与LongData-Corpus中8K至128K文本一一配对，打乱针序并随机插入。双语数据含7500条英文和6500条中文，划分为10000训练、2000开发、2000测试。评估器训练数据包含乱序、缺失、冗余和错误四类回答变体及GPT-4o理由，在Qwen2.5-32B上微调后验证准确率达99.49%。目标模型在2000条测试样本上运行，评估器判断答案完整性与顺序，并按上下文长度、针数和流水线报告准确率。
  legend: >-
    来源：Sequential-NIAH arXiv:2504.04713 Sections 2-4 and Appendices; official miraclefish/Sequential-NIAH-Benchmark
    repository。实线箭头表示论文或官方资料明确支持的主流程。
