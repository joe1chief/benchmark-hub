meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Sequential-NIAH Build and Evaluation Process
  description: >-
    Sequential-NIAH creates 14,000 long-context samples with three pipelines. Synthetic-temporal data combines fake
    subjects, times, and events into sequences of 3 to 15 needles. Real-temporal data draws from ICEWS and FEG temporal
    knowledge graphs and uses GPT-4o to rewrite chains of 3 to 10 events. Real-logical data filters 2,986 private
    open-domain QA examples, manually checks samples, and rewrites them into natural sequential needles. The resulting
    6,000 synthetic-temporal, 5,014 real-temporal, and 2,986 real-logical QA items are paired one-to-one with 8K to 128K
    texts sampled from LongData-Corpus, shuffled, and inserted at random positions. The bilingual set contains 7,500
    English and 6,500 Chinese examples and is split 10,000 train, 2,000 development, and 2,000 test. A Qwen2.5-32B
    evaluator is fine-tuned on shuffled, missing, redundant, and incorrect answer variants with GPT-4o rationales and
    reaches 99.49 percent validation accuracy. Target models run on the 2,000 test items; the evaluator judges
    completeness and order, and accuracy is reported by context length, needle count, and pipeline.
  legend: >-
    Source: Sequential-NIAH arXiv:2504.04713 Sections 2-4 and Appendices; official miraclefish/Sequential-NIAH-Benchmark
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
