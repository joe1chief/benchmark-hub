meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SQuAD Build Process
  description: >-
    Paper-aligned SQuAD v1.0 workflow: high-PageRank English Wikipedia articles are sampled and cleaned into passages,
    qualified crowdworkers write extractive questions in their own words, development and test questions receive extra
    answers, and 107,785 question-answer pairs are evaluated with normalized exact match and token F1.
  legend: >-
    Solid arrows show passage curation, article-level splitting, crowdsourced QA, extra-answer collection, and
    extractive evaluation.
nodes:
  - id: ranked_articles
    label: |-
      English Wikipedia
      Top 10K by Internal PageRank
    type: database
    size: large
    position:
      x: 40
      'y': 200
  - id: sample
    label: |-
      Uniformly Sample
      536 Articles
    type: process
    size: large
    position:
      x: 280
      'y': 200
  - id: passages
    label: |-
      Extract 23,215 Paragraphs
      Remove Images / Tables / Figures
      Drop <500 Characters
    type: process
    size: xl
    position:
      x: 520
      'y': 200
  - id: split
    label: |-
      Split by Article
      Train 80% / Dev 10% / Test 10%
    type: database
    size: xl
    position:
      x: 780
      'y': 200
  - id: qa
    label: |-
      Qualified Crowdworkers
      Up to 5 Questions per Paragraph
      Highlight Answer Span
      Own Words; Copy-paste Disabled
    type: user
    size: xl
    position:
      x: 1040
      'y': 200
  - id: dataset
    label: |-
      SQuAD v1.0
      107,785 QA Pairs
      Answers Entailed by Passage
    type: database
    size: xl
    position:
      x: 1300
      'y': 200
  - id: extra_answers
    label: |-
      Dev / Test Re-annotation
      ≥2 Additional Answers per Question
      Select Shortest Valid Span
    type: user
    size: xl
    position:
      x: 1560
      'y': 200
  - id: predict
    label: |-
      Extractive Reader
      Predict Any Passage Span
    type: process
    size: large
    position:
      x: 1820
      'y': 200
  - id: normalize
    label: |-
      Normalize Prediction
      Ignore Articles + Punctuation
      Compare with All References
    type: process
    size: xl
    position:
      x: 2060
      'y': 200
  - id: score
    label: |-
      Exact Match
      Max Token F1 per Question
      Macro-average over Questions
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 200
edges:
  - from: ranked_articles
    to: sample
    type: primary
  - from: sample
    to: passages
    type: primary
  - from: passages
    to: split
    type: primary
  - from: split
    to: qa
    type: primary
  - from: qa
    to: dataset
    type: primary
  - from: dataset
    to: extra_answers
    type: primary
  - from: extra_answers
    to: predict
    type: primary
  - from: predict
    to: normalize
    type: primary
  - from: normalize
    to: score
    type: primary
modules: []
