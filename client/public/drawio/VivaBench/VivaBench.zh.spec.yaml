meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VivaBench — 临床病例构建与交互诊断流程
  description: >-
    VivaBench 将公开临床题材整理为病史/体检/影像/检验结构，使用 SNOMED-CT、LOINC 和 ICD-10 规范化并接受临床复核。评测包含三个诊断阶段：Review 后的初步诊断 dP、Investigation
    后的最终诊断 dD，以及 Full Information 预检 dF。对 dP 和 dD，每个预测诊断分别被分类为精确（E）、近似（A）或未匹配（U）；E/A 得分还要求请求过支持该诊断的检查，精确与近似 Top-k
    分开报告。dF 采用不检查 investigation 的独立匹配支路，且不进入 Sconf。dP/dD 的置信度归一化为 c′ 且 Σc′=1，并计算
    Sconf=Σ(i∈E)c′ᵢ+Σ(i∈A)c′ᵢ−Σ(i∈U)c′ᵢ。信息查询精确率/召回率按 Review/Investigation × Matched/Full 四种配置报告。公开版本的总量不一致，因此图中固定为官方 HF
    当前可核验的990条 reviewed 和约1.95k条 generated_raw。
  legend: >-
    来源：arXiv:2510.10278, Sections 3.1-3.2 and the evaluation equations; official dataset:
    https://huggingface.co/datasets/chychiu/VivaBench. The paper defines diagnostic stages dP, dD, and dF; the
    relevant-investigation condition for interactive top-k scoring; confidence normalization c′ and
    exact/approximate/unmatched sets E/A/U; and four Review/Investigation by Matched/Full query configurations. Public
    paper and dataset versions disagree on total size, so the diagram pins the currently verifiable HF views rather than
    asserting one universal count.。实线箭头表示论文或官方资料明确支持的主流程。
