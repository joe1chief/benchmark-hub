meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VivaBench — Clinical Case Curation and Interactive Diagnosis
  description: >-
    VivaBench structures public clinical vignettes as History/Physical/Imaging/Laboratory cases normalized with
    SNOMED-CT, LOINC, and ICD-10 and clinically reviewed. Evaluation reports three diagnostic stages: provisional dP
    after Review, final dD after Investigation, and a Full Information pre-test dF. For dP and dD, each predicted
    diagnosis is independently classified as exact (E), approximate (A), or unmatched (U), and E/A credit additionally
    requires an investigation that supports that diagnosis; exact and approximate Top-k are reported separately. dF uses
    an independent matching path without the investigation condition and does not enter Sconf. For dP/dD, confidence is
    normalized to c′ with Σc′=1 and Sconf=Σ(i∈E)c′ᵢ+Σ(i∈A)c′ᵢ−Σ(i∈U)c′ᵢ. Information-seeking precision/recall is
    reported for Review/Investigation by Matched/Full scope. Public versions disagree on total size, so the diagram pins
    the official HF snapshot of 990 reviewed and about 1.95k generated_raw rows.
  legend: >-
    Source: arXiv:2510.10278, Sections 3.1-3.2 and the evaluation equations; official dataset:
    https://huggingface.co/datasets/chychiu/VivaBench. The paper defines diagnostic stages dP, dD, and dF; the
    relevant-investigation condition for interactive top-k scoring; confidence normalization c′ and
    exact/approximate/unmatched sets E/A/U; and four Review/Investigation by Matched/Full query configurations. Public
    paper and dataset versions disagree on total size, so the diagram pins the currently verifiable HF views rather than
    asserting one universal count.. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
