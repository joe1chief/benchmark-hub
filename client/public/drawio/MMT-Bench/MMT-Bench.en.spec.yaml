meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMT-Bench Build Process
  description: >-
    Paper-aligned construction of 31,325 multimodal multiple-choice questions across 32 meta-tasks and 162 subtasks,
    followed by hierarchical accuracy evaluation of 32 LVLMs and task-map analysis.
  legend: >-
    Candidate subtasks must be fundamental, challenging to current LVLMs, and backed by publicly accessible test
    samples.
nodes:
  - id: meta
    label: |-
      Brainstorm Meta-tasks
      Coauthors Propose Candidates
      Deduplicate and Filter
      Retain 32 Important Meta-tasks
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: subtasks
    label: |-
      Decompose into Subtasks
      Require Fundamental Capability
      Require Current-model Challenge
      Require Public Test Samples
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: search
    label: |-
      Search Candidate Datasets
      Google · Papers With Code
      Kaggle · ChatGPT
      Assess Relevance and Usability
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: sample
    label: |-
      Sample Source Data
      Cap Each Subtask at 200
      Randomly Select Examples
      Balance Contributing Datasets
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: metadata
    label: |-
      Build Uniform Metadata
      Store Multimodal Inputs
      Add QA-required Information
      Tag Capability and Prompt Type
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: mcq
    label: |-
      Generate Multiple-choice QA
      Use Manual Rules or ChatGPT
      Create up to Eight Choices
      Keep One Gold Answer
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
    label: |-
      Assemble MMT-Bench
      31,325 Questions
      32 Meta · 162 Subtasks
      13 Input Types · 14 Capabilities
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: evaluate
    label: |-
      Evaluate 32 Public LVLMs
      Use OpenCompass Pipeline
      Feed Task-specific Modalities
      Generate One Model Response
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: extract
    label: |-
      Three-stage Answer Extraction
      First Read Option Letters
      Then Match Option Content
      Then Ask ChatGPT · Else Z
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: score
    label: |-
      Compute Accuracy
      Compare Choice with Gold Answer
      Aggregate by Subtask
      Average into Meta-task Scores
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: vectors
    label: |-
      Build 162 Task Vectors
      LoRA-tune Qwen-VL-Chat
      Three Epochs per Subtask
      Compare Vectors by Cosine Distance
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Publish Hierarchical Task Map
      Cluster Related Subtasks
      Compare Model Rankings
      Report Overall Multitask Results
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: meta
    to: subtasks
    type: primary
  - from: subtasks
    to: search
    type: primary
  - from: search
    to: sample
    type: primary
  - from: sample
    to: metadata
    type: primary
  - from: metadata
    to: mcq
    type: primary
  - from: mcq
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: extract
    type: primary
  - from: extract
    to: score
    type: primary
  - from: score
    to: vectors
    type: primary
  - from: vectors
    to: report
    type: primary
modules: []
