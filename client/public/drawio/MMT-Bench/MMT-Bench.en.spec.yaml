      Paper v1 · 24 Apr 2024
      HF 2255d3a7 · 24 Jun · CC BY 4.0
      Full Labels Tag · 84012c95 · 18 Jul
      Repo Root Has No LICENSE File
    type: document
    size: xl
    position:
      x: 352
      'y': 672
  - id: parser_drift
    label: |-
      Paper / Code Drift
      Paper Failure → Z
      Repo Exhaustion → Random Choice / Z
      Repo Judge → A–D despite Up to 8 Choices
      Meta: Row-weighted → Paper Subtask Mean (e7004588)
    type: document
    size: xl
    position:
      x: 624
      'y': 672
  - id: paper_eval
    label: |-
