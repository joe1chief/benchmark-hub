      Tag Visual-prompt / Input-image Type
    type: document
    size: xl
    position:
      x: 1984
      'y': 192
  - id: qa_route
    label: Task-specific QA Generation Route?
    type: decision
    size: xl
    position:
      x: 2256
      'y': 192
  - id: rules
    label: |-
      Manually Designed Rules
      Generate Question + Gold Answer
      Example · Sketch Retrieval
      Random Distractor Images from Metadata
      Task-dependent · Up to Eight Choices
    type: process
    size: xl
    position:
      x: 2528
      'y': 48
  - id: chatgpt
    label: |-
      Well-designed ChatGPT Prompts
      Generate High-quality MCQs
      Example · Video Captioning
      Confusing Wrong Choices
      Task-dependent · Up to Eight Choices
    type: user
    size: xl
    position:
      x: 2528
      'y': 336
  - id: merge_qa
    label: |-
      Merge Generated MCQs
      Preserve Task Hierarchy
    type: process
    size: s
    position:
      x: 2832
      'y': 224
  - id: dataset
    label: |-
      Assemble Paper MMT-Bench
      31,325 Multi-choice Questions
      32 Meta-tasks · 162 Subtasks
      13 Visual Input Types · 14 Capabilities
    type: database
    size: xl
    position:
      x: 3072
      'y': 192
  - id: release
    label: |-
      Publish Benchmark Artifacts
      Project Page + Official Repository
      Later HF Full / Validation Splits
      Combined-image and MI Variants
    type: document
    size: xl
    position:
      x: 3344
      'y': 192
  - id: release_boundary
