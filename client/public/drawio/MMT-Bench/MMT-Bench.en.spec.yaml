      Google · Papers With Code
      Kaggle · ChatGPT
      Download Candidate Datasets
    type: database
    size: xl
    position:
      x: 1168
      'y': 192
  - id: dataset_gate
    label: Candidate Dataset Relevant and Usable?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 192
  - id: reject_dataset
    label: |-
      Reject Dataset Candidate
      Continue Searching Sources
    type: process
    size: xl
    position:
      x: 1440
      'y': 448
  - id: sampling
    label: |-
      Balance Source Sampling
      Randomly Keep at Most 200 per Subtask
      Equal Samples per Contributing Dataset
    type: process
    size: xl
    position:
      x: 1712
      'y': 192
  - id: metadata
    label: |-
      Collate Uniform Metadata
      Images + QA-required Information
