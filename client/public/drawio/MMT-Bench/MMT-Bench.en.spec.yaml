    size: xl
    position:
      x: 3344
      'y': 960
  - id: letter_gate
    label: Unambiguous Option Letter Found?
    type: decision
    size: xl
    position:
      x: 3072
      'y': 960
  - id: content_gate
    label: Unambiguous Option Content Found?
    type: decision
    size: xl
    position:
      x: 2800
      'y': 1120
  - id: chatgpt_extract
    label: |-
      Step 3 · Ask ChatGPT
      Match Response to One Option
      Return One Valid Option or Z
    type: user
    size: xl
    position:
      x: 2528
      'y': 1120
  - id: valid_gate
    label: |-
      Normalize ChatGPT Output
      Valid Option → Compare against Gold
      No / Refusal → Z · Always Incorrect
    type: process
    size: xl
    position:
      x: 2256
      'y': 1120
  - id: accuracy
    label: |-
      Compute Paper Accuracy
      Extracted Option vs Gold · Z Is Wrong
      Meta = Mean of All Its Subtasks
      Overall across All Subtasks
      Overall* Excludes Visual Recognition
    type: process
    size: xl
    position:
      x: 1712
      'y': 1056
  - id: score_report
    label: |-
      Report Multitask Results
      Overall · 32 Meta-tasks
      Detailed 162 Subtasks
      Paper Evaluates Prompt Variants Separately
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 1056
  - id: task_data
    label: |-
      Step 2 · Build Per-subtask Data
      Adapt Every MCQ to Instructions
      One Dataset for Each of 162 Subtasks
    type: process
    size: xl
    position:
      x: 3072
      'y': 1504
  - id: probe
    label: |-
      Step 1 · Choose Qwen-VL-Chat Probe
      Pretrained Initial Weights
      Good Coverage of Most Subtasks
    type: process
    size: xl
    position:
      x: 3344
      'y': 1504
  - id: vectors
    label: |-
      Step 3 · LoRA Fine-tune per Subtask
      Three Epochs × 162 Subtasks
      Weight Delta Is Task Vector
      Reduce 9.6B to 3.5M Parameters
    type: process
    size: xl
    position:
      x: 2800
      'y': 1504
  - id: distance
    label: |-
      Build 162 × 162 Task Graph
      Distance = 1 − Cosine Similarity
      Range 0 to 2
    type: process
    size: xl
    position:
      x: 2528
      'y': 1504
  - id: task_map
    label: |-
      Analyze Task Map
      Hierarchical Clustering · 12 Clusters
      Kendall Tau Ranking Consistency
      Discover In-domain / Out-of-domain Tasks
    type: terminal
    size: xl
    position:
      x: 2256
      'y': 1504
