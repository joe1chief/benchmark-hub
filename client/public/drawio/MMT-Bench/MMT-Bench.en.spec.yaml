meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMT-Bench Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs paper-v1 task selection, source search, balanced sampling, metadata and MCQ generation, then separates
    the paper's 30-model OpenCompass protocol and task-map analysis from later release and evaluator drift.
  legend: >-
    Solid arrows trace disclosed construction, evaluation, and task-map paths. Every decision edge names its outcome.
    Unconnected middle-row cards record release, implementation, metric, and reproducibility boundaries.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper · arXiv 2404.16006v1
      First Eval Code · 8ec8203c
      Current Repo · 5e900028
      HF Dataset · 2255d3a7
    type: document
    size: xl
    position:
      x: 80
      'y': 192
  - id: meta
    label: |-
      Brainstorm Meta-tasks
      All Coauthors Propose Candidates
      Deduplicate and Filter Importance
      Retain 32 Meta-tasks
    type: user
    size: xl
    position:
      x: 352
      'y': 192
  - id: subtasks
    label: |-
      Decompose into Candidate Subtasks
      Dozens of AI-specialist Coauthors
      Build Hierarchical Task Structure
    type: process
    size: xl
    position:
      x: 624
      'y': 192
  - id: criteria_gate
    label: Meets All Three Subtask Criteria?
    type: decision
    size: xl
    position:
      x: 896
      'y': 192
  - id: exclude_subtask
