meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMT-Bench 证据对齐的构建与评测流程
  description: 按论文 v1 重建任务筛选、来源搜索、平衡抽样、元数据与选择题生成，并将论文的 30 模型 OpenCompass 协议和任务地图分析与后续发布、评测器漂移分开呈现。
  legend: 实线表示已披露的构建、评测与任务地图流程；每条判定边都标明结果；中间未连线卡片记录发布、实现、指标与可复现性边界。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      论文 · arXiv 2404.16006v1
      首版评测代码 · 8ec8203c
      当前仓库 · 5e900028
      HF 数据集 · 2255d3a7
    type: document
    size: xl
    position:
      x: 80
      'y': 192
  - id: meta
    label: |-
      构思元任务
      全体合著者提出候选
      去重并按重要性筛选
      保留 32 个元任务
    type: user
    size: xl
    position:
      x: 352
      'y': 192
  - id: subtasks
    label: |-
      分解候选子任务
      数十名 AI 领域合著者参与
      建立分层任务结构
    type: process
    size: xl
    position:
      x: 624
      'y': 192
  - id: criteria_gate
    label: 同时满足三项子任务标准？
    type: decision
    size: xl
    position:
      x: 896
      'y': 192
  - id: exclude_subtask
    label: |-
      排除候选子任务
      不基础、不具挑战性
      或测试样本无法公开获取
    type: terminal
    size: xl
    position:
      x: 896
      'y': 448
  - id: search
    label: |-
      按子任务名搜索
      Google · Papers With Code
      Kaggle · ChatGPT
      下载候选数据集
    type: database
    size: xl
    position:
      x: 1168
      'y': 192
  - id: dataset_gate
    label: 候选数据集相关且可用？
    type: decision
    size: xl
    position:
      x: 1440
      'y': 192
  - id: reject_dataset
    label: |-
      淘汰候选数据集
      继续搜索其他来源
    type: process
    size: xl
    position:
      x: 1440
      'y': 448
  - id: sampling
    label: |-
      平衡来源抽样
      每子任务随机保留至多 200 条
      每个贡献数据集取相同样本数
    type: process
    size: xl
    position:
      x: 1712
      'y': 192
  - id: metadata
    label: |-
      整理统一元数据
      图像 + 生成问答所需信息
      人工标注所需能力
      标注视觉提示 / 输入图像类型
    type: document
    size: xl
    position:
      x: 1984
      'y': 192
  - id: qa_route
    label: 该任务采用哪种问答生成路径？
    type: decision
    size: xl
    position:
      x: 2256
      'y': 192
  - id: rules
    label: |-
      人工设计规则
      生成问题 + 标准答案
      示例 · 草图检索
      从元数据随机采样干扰图像
      依任务而定 · 最多八个选项
    type: process
    size: xl
    position:
      x: 2528
      'y': 48
  - id: chatgpt
    label: |-
      精心设计的 ChatGPT 提示词
      高效生成高质量选择题
      示例 · 视频描述
      生成混淆性错误选项
      依任务而定 · 最多八个选项
    type: user
    size: xl
    position:
      x: 2528
      'y': 336
  - id: merge_qa
    label: |-
      合并生成的选择题
      保留任务层级
    type: process
    size: s
    position:
      x: 2832
      'y': 224
  - id: dataset
    label: |-
      汇总论文版 MMT-Bench
      31,325 道多项选择题
      32 个元任务 · 162 个子任务
      13 类视觉输入 · 14 类能力
    type: database
    size: xl
    position:
      x: 3072
      'y': 192
  - id: release
    label: |-
      发布基准资产
      项目页 + 官方仓库
      后续 HF 全量 / 验证划分
      合并图像版与 MI 版
    type: document
    size: xl
    position:
      x: 3344
      'y': 192
  - id: release_boundary
    label: |-
      发布时间线与权利边界
      论文 v1 · 2024 年 4 月 24 日
      HF 2255d3a7 · 6 月 24 日 · CC BY 4.0
      全量标签 tag · 84012c95 · 7 月 18 日
      仓库根目录无 LICENSE
    type: document
    size: xl
    position:
      x: 352
      'y': 672
  - id: parser_drift
    label: |-
      论文 / 代码漂移
      论文失败 → Z
      仓库耗尽 → 随机选项 / Z
      仓库判分 → 最多 8 项仍限 A–D
      元任务：按行加权 → 论文的子任务均值（e7004588）
    type: document
    size: xl
    position:
      x: 624
      'y': 672
  - id: paper_eval
    label: |-
      论文 v1 评测
      30 个公开可用 LVLM
      输入任务特定模态
      每道选择题生成一个自由回答
    type: process
    size: xl
    position:
      x: 3344
      'y': 960
  - id: letter_gate
    label: 抽取到唯一选项字母？
    type: decision
    size: xl
    position:
      x: 3072
      'y': 960
  - id: content_gate
    label: 抽取到唯一选项内容？
    type: decision
    size: xl
    position:
      x: 2800
      'y': 1120
  - id: chatgpt_extract
    label: |-
      步骤 3 · 询问 ChatGPT
      将回答匹配到一个选项
      返回一个有效选项或 Z
    type: user
    size: xl
    position:
      x: 2528
      'y': 1120
  - id: valid_gate
    label: |-
      规范化 ChatGPT 输出
      有效选项 → 与标准答案比较
      无结果 / 拒答 → Z · 始终计错
    type: process
    size: xl
    position:
      x: 2256
      'y': 1120
  - id: accuracy
    label: |-
      计算论文准确率
      抽取选项对比标答 · Z 计错
      元任务 = 所有子任务准确率均值
      Overall 覆盖所有子任务
      Overall* 排除视觉识别
    type: process
    size: xl
    position:
      x: 1712
      'y': 1056
  - id: score_report
    label: |-
      报告多任务结果
      总体 · 32 个元任务
      162 个子任务明细
      不同提示变体分别评测
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 1056
  - id: task_data
    label: |-
      步骤 2 · 构建逐子任务数据
      将每道选择题改为指令数据
      162 个子任务各一套数据
    type: process
    size: xl
    position:
      x: 3072
      'y': 1504
  - id: probe
    label: |-
      步骤 1 · 选择 Qwen-VL-Chat 探测模型
      从预训练初始权重出发
      在多数子任务上具备良好表现
    type: process
    size: xl
    position:
      x: 3344
      'y': 1504
  - id: vectors
    label: |-
      步骤 3 · 每子任务执行 LoRA 微调
      162 个子任务各训练三轮
      权重差作为任务向量
      参数从 9.6B 降至 3.5M
    type: process
    size: xl
    position:
      x: 2800
      'y': 1504
  - id: distance
    label: |-
      构建 162 × 162 任务图
      距离 = 1 − 余弦相似度
      取值范围 0 至 2
    type: process
    size: xl
    position:
      x: 2528
      'y': 1504
  - id: task_map
    label: |-
      分析任务地图
      层次聚类 · 12 个簇
      Kendall Tau 排名一致性
      发现域内 / 域外任务
    type: terminal
    size: xl
    position:
      x: 2256
      'y': 1504
edges:
  - from: evidence
    to: meta
    type: primary
  - from: meta
    to: subtasks
    type: primary
  - from: subtasks
    to: criteria_gate
    type: primary
  - from: criteria_gate
    to: search
    type: primary
    label: 三项全满足
    labelPosition: end
  - from: criteria_gate
    to: exclude_subtask
    type: primary
    label: 任一项不满足
    labelPosition: end
  - from: search
    to: dataset_gate
    type: primary
  - from: dataset_gate
    to: sampling
    type: primary
    label: 相关且可用
    labelPosition: end
  - from: dataset_gate
    to: reject_dataset
    type: primary
    label: 不适用
    labelPosition: end
  - from: reject_dataset
    to: search
    type: secondary
  - from: sampling
    to: metadata
    type: primary
  - from: metadata
    to: qa_route
    type: primary
  - from: qa_route
    to: rules
    type: primary
    label: 人工规则
    labelPosition: end
  - from: qa_route
    to: chatgpt
    type: primary
    label: ChatGPT 提示词
    labelPosition: end
  - from: rules
    to: merge_qa
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: chatgpt
    to: merge_qa
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: merge_qa
    to: dataset
    type: primary
  - from: dataset
    to: release
    type: primary
  - from: dataset
    to: paper_eval
    type: primary
  - from: paper_eval
    to: letter_gate
    type: primary
  - from: letter_gate
    to: accuracy
    type: primary
    label: 是 · 选项
    labelPosition: start
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.15
  - from: letter_gate
    to: content_gate
    type: primary
    label: 否
    labelPosition: end
  - from: content_gate
    to: accuracy
    type: primary
    label: 是 · 选项
    labelPosition: start
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.4
  - from: content_gate
    to: chatgpt_extract
    type: primary
    label: 否
    labelPosition: end
  - from: chatgpt_extract
    to: valid_gate
    type: primary
  - from: valid_gate
    to: accuracy
    type: primary
  - from: accuracy
    to: score_report
    type: primary
  - from: dataset
    to: probe
    type: primary
  - from: probe
    to: task_data
    type: primary
  - from: task_data
    to: vectors
    type: primary
  - from: vectors
    to: distance
    type: primary
  - from: distance
    to: task_map
    type: primary
modules: []
