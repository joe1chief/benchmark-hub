meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WSC273 Version Build and KR 2012 Proposed Protocol
  description: >-
    KR 2012 defines a constrained Winograd schema as a pair of sentences differing in one or two special words, with an
    ambiguous pronoun whose correct antecedent reverses between the two variants. Ideal candidates are obvious to
    ordinary human readers, resist selectional-restriction shortcuts, and are Google-proof against simple corpus
    statistics. The paper proposes empirically testing future candidates with normally abled native English-speaking
    adults before admitting them to a hidden challenge corpus; that proposed acceptance gate must have both pass and
    revise/reject outcomes. Separately, the expert-authored original benchmark snapshot grew to 285 examples. WSC273 is
    the first 273 examples, excluding the later 12, and is evaluated as binary antecedent selection with accuracy. The
    diagram does not claim that all WSC273 examples passed the paper's proposed future native-speaker protocol.
  legend: >-
    Source: Levesque, Davis, and Morgenstern, The Winograd Schema Challenge, KR 2012, Sections 4-6 and 8 for the
    constrained schema criteria and proposed native-speaker/hidden-challenge protocol; Kocijan et al., A Review of
    Winograd Schema Challenge Datasets and Approaches, arXiv:2004.13831, Section 2.1 for the WSC285/WSC273 version
    relationship; official NYU benchmark catalog https://cs.nyu.edu/~davise/Benchmarks/Text.html and hub
    https://cs.nyu.edu/~davise/papers/WinogradSchemas/WS.html. Version pin: WSC273 is the first 273 examples of the
    285-example benchmark snapshot; it is shown separately from the paper's proposed future hidden challenge and is not
    claimed to have passed that proposed empirical protocol.. Solid arrows show the main flow explicitly supported by
    the paper or official documentation.
