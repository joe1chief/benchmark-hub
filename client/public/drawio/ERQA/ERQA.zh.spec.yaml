meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ERQA 构建流程
  description: 固定 ERQA 的来源、人工标注、TFRecord 精确提示后缀，以及论文与发布脚本评测边界。
  legend: 发布问题已包含直接回答后缀；CoT 仅由论文追加；API 参数与规范化遵循固定代码。
nodes:
  - id: evidence
    label: |-
      固定证据边界
      arXiv:2503.20020v1
      ERQA 仓库 @ 5bba488
      TFRecord SHA256 1974f5e5…
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: scope
    label: |-
      定义具身推理范围
      超越识别、计数与定位
      可供性 · 三维关系
      跨帧配准
    type: document
    size: xl
    position:
      x: 40
      'y': 350
  - id: images
    label: |-
      图像：作者 · OXE · UMI · MECCANO
      HoloAssist · EGTEA Gaze+
      样本筛选与出题细节
      未披露
    type: database
    size: xl
    position:
      x: 300
      'y': 350
  - id: curate
    label: |-
      策展图文交错的多模态 VQA
      一张或多张图像加文本
      A / B / C / D 四选一
    type: process
    size: xl
    position:
      x: 560
      'y': 350
  - id: manual_qc
    label: |-
      人工质量控制
      400 道问题全部人工标注
      检查正确性与质量
    type: process
    size: xl
    position:
      x: 820
      'y': 350
  - id: taxonomy
    label: |-
      八类问题
      空间 84 · 动作 72 · 轨迹 66 · 状态估计 55
      任务 38 · 多视角 37
      指向 34 · 其他 14
    type: document
    size: xl
    position:
      x: 1080
      'y': 350
  - id: dataset
    label: |-
      ERQA 基准 · 400 道四选一问题
      28% 为多图题
      论文未报告训练 / 开发 / 测试划分
    type: database
    size: xl
    position:
      x: 1340
      'y': 350
  - id: artifact
    label: |-
      公开 TFRecord · 400 条
      91,402,921 字节 · CC BY 4.0
      question · image/encoded · answer
      question_type · visual_indices
    type: database
    size: xl
    position:
      x: 1600
      'y': 350
  - id: direct_suffix
    label: |-
      TFRecord 直接回答后缀 · 400/400
      “Please answer directly with only
      the letter of the correct option
      and nothing else.”
    type: document
    size: xl
    position:
      x: 1860
      'y': 350
  - id: protocol
    label: |-
      评测协议边界
      论文提示
      与固定发布脚本分开
    type: decision
    size: xl
    position:
      x: 2140
      'y': 350
  - id: paper_direct
    label: |-
      论文无 CoT 条件
      原样使用原始 TFRecord 问题
      不另造直接提示
    type: process
    size: xl
    position:
      x: 2420
      'y': 80
  - id: paper_cot
    label: |-
      论文在原问题后精确追加
      “Reason step by step about the answer,
      and show your work, for each step.
      Only after that,
      proceed to the final answer.”
    type: process
    size: xl
    position:
      x: 2420
      'y': 300
  - id: release_harness
    label: |-
      发布脚本 @ 5bba488
      原样使用原始 TFRecord 问题
      不自动注入论文 CoT
    type: process
    size: xl
    position:
      x: 2420
      'y': 600
  - id: openai_settings
    label: |-
      OpenAI API 参数
      温度 0
      max_tokens=300
    type: document
    size: xl
    position:
      x: 2700
      'y': 520
  - id: gemini_settings
    label: |-
      Gemini API 参数
      温度 0
      max_output_tokens=500
    type: document
    size: xl
    position:
      x: 2700
      'y': 700
  - id: normalize
    label: |-
      精确匹配规范化
      对完整响应移除句点
      去首尾空白 · 转小写
      再与标准答案精确匹配
    type: process
    size: xl
    position:
      x: 2980
      'y': 610
  - id: metrics
    label: |-
      多项选择准确率
      总体 · 单图 · 多图
      按问题类型
      论文比较无 CoT 与 CoT
    type: terminal
    size: xl
    position:
      x: 3280
      'y': 350
edges:
  - from: evidence
    to: images
    type: data
  - from: scope
    to: images
    type: data
  - from: images
    to: curate
    type: primary
  - from: curate
    to: manual_qc
    type: primary
  - from: manual_qc
    to: taxonomy
    type: primary
  - from: taxonomy
    to: dataset
    type: primary
  - from: dataset
    to: artifact
    type: primary
  - from: artifact
    to: direct_suffix
    type: primary
  - from: direct_suffix
    to: protocol
    type: primary
  - from: protocol
    to: paper_direct
    type: primary
  - from: protocol
    to: paper_cot
    type: primary
  - from: protocol
    to: release_harness
    type: primary
  - from: release_harness
    to: openai_settings
    type: primary
  - from: release_harness
    to: gemini_settings
    type: primary
  - from: openai_settings
    to: normalize
    type: primary
  - from: gemini_settings
    to: normalize
    type: primary
  - from: paper_direct
    to: metrics
    type: primary
    waypoints:
      - x: 3220
        'y': 130
      - x: 3220
        'y': 400
  - from: paper_cot
    to: metrics
    type: primary
    waypoints:
      - x: 3240
        'y': 350
      - x: 3240
        'y': 400
  - from: normalize
    to: metrics
    type: primary
    waypoints:
      - x: 3260
        'y': 660
      - x: 3260
        'y': 400
modules: []
