meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ERQA 构建流程
  description: 对齐论文与官方发布：组织人工策展的具身推理 VQA、公开序列化、可选思维链推理并报告准确率。
  legend: Gemini Robotics 报告明确给出能力分类、规模、多图占比和评测方法，但未公开图像采集或问题编写协议，因此图中不作推断。
nodes:
  - id: scope
    label: |-
      定义具身智能体能力范围
      超越识别 / 计数 / 定位等原子能力
      关注物理世界可供性与三维关系
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: curate
    label: |-
      策展多模态 VQA 题目
      一张或多张图像与文本交错输入
      四选一问题，答案为 A / B / C / D
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: taxonomy
    label: |-
      标注 8 类问题
      空间 84 · 动作 72 · 轨迹 66 · 状态 55
      任务 38 · 多视角 37 · 指向 34 · 其他 14
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: multi_image
    label: |-
      保留单图与多图推理
      共 400 题 · 28% 为多图题
      跨帧物体配准与概念对应
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: release
    label: |-
      序列化 ERQA 公开版本
      TFRecord：question · image/encoded · answer
      问题类型 · 视觉索引 · CC BY 4.0
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: prompt
    label: |-
      进行零样本多模态推理
      直接回答或附加论文原始思维链指令
      先逐步推理，再输出最终选项
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: parse
    label: |-
      解析最终选项字母
      将 A / B / C / D 与标准答案比对
      保留问题类型用于诊断
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: metrics
    label: |-
      报告选择题准确率
      总体与各推理类别准确率
      比较直接提示和思维链提示
    type: terminal
    size: xl
    position:
      x: 1860
      'y': 250
edges:
  - from: scope
    to: curate
    type: primary
  - from: curate
    to: taxonomy
    type: primary
  - from: taxonomy
    to: multi_image
    type: primary
  - from: multi_image
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: metrics
    type: primary
modules: []
