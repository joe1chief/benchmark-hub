meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ERQA Build Process
  description: >-
    Paper- and release-aligned organization of curated embodied-reasoning VQA items, public serialization, optional CoT
    inference, and accuracy reporting.
  legend: >-
    The Gemini Robotics report specifies the capability taxonomy, size, multi-image share, and evaluation. It does not
    publish an image-acquisition or question-authoring protocol, so none is inferred here.
nodes:
  - id: scope
    label: |-
      Define embodied-agent capability scope
      broader than recognition / counting / localization
      physical-world affordances and 3D relations
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: curate
    label: |-
      Curate multimodal VQA items
      one or more images interleaved with text
      4-choice questions with A / B / C / D answers
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: taxonomy
    label: |-
      Assign 8 question types
      spatial 84 · action 72 · trajectory 66 · state 55
      task 38 · multi-view 37 · pointing 34 · other 14
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: multi_image
    label: |-
      Preserve single- and multi-image reasoning
      400 questions total · 28% multi-image
      cross-frame registration and correspondence
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: release
    label: |-
      Serialize the public ERQA release
      TFRecord: question · image/encoded · answer
      question_type · visual_indices · CC BY 4.0
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: prompt
    label: |-
      Run zero-shot multimodal inference
      direct answer or optional exact CoT instruction
      reason first, then emit the final choice
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: parse
    label: |-
      Parse the final option letter
      compare A / B / C / D with ground truth
      preserve question type for diagnostics
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: metrics
    label: |-
      Report multiple-choice accuracy
      overall and by reasoning category
      compare direct versus CoT prompting
    type: terminal
    size: xl
    position:
      x: 1860
      'y': 250
edges:
  - from: scope
    to: curate
    type: primary
  - from: curate
    to: taxonomy
    type: primary
  - from: taxonomy
    to: multi_image
    type: primary
  - from: multi_image
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: metrics
    type: primary
modules: []
