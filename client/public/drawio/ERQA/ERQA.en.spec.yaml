meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ERQA Build Process
  description: >-
    Fixed evidence for ERQA provenance, manual labeling, exact TFRecord prompt suffix, and paper-versus-release
    evaluation.
  legend: >-
    The released question already contains the direct-answer suffix; CoT is a paper-only append, while API settings and
    normalization follow fixed code.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      arXiv:2503.20020v1
      ERQA repo @ 5bba488
      TFRecord SHA256 1974f5e5…
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: scope
    label: |-
      Define embodied-reasoning scope
      beyond recognition, counting, localization
      affordances · 3D relations
      cross-frame registration
    type: document
    size: xl
    position:
      x: 40
      'y': 350
  - id: images
    label: |-
      Images: authors · OXE · UMI · MECCANO
      HoloAssist · EGTEA Gaze+
      selection and question authoring
      not disclosed
    type: database
    size: xl
    position:
      x: 300
      'y': 350
  - id: curate
    label: |-
      Curate interleaved multimodal VQA
      one or more images plus text
      four-choice A / B / C / D questions
    type: process
    size: xl
    position:
      x: 560
      'y': 350
  - id: manual_qc
    label: |-
      Manual quality control
      all 400 questions manually labeled
      correctness and quality checked
    type: process
    size: xl
    position:
      x: 820
      'y': 350
  - id: taxonomy
    label: |-
      Eight question types
      spatial 84 · action 72 · trajectory 66 · state 55
      task 38 · multi-view 37
      pointing 34 · other 14
    type: document
    size: xl
    position:
      x: 1080
      'y': 350
  - id: dataset
    label: |-
      ERQA benchmark · 400 four-choice questions
      28% multi-image
      no train / dev / test partition reported
    type: database
    size: xl
    position:
      x: 1340
      'y': 350
  - id: artifact
    label: |-
      Public TFRecord · 400 records
      91,402,921 bytes · CC BY 4.0
      question · image/encoded · answer
      question_type · visual_indices
    type: database
    size: xl
    position:
      x: 1600
      'y': 350
  - id: direct_suffix
    label: |-
      TFRecord direct suffix · 400/400
      “Please answer directly with only
      the letter of the correct option
      and nothing else.”
    type: document
    size: xl
    position:
      x: 1860
      'y': 350
  - id: protocol
    label: |-
      Evaluation protocol boundary
      paper prompting
      versus fixed release harness
    type: decision
    size: xl
    position:
      x: 2140
      'y': 350
  - id: paper_direct
    label: |-
      Paper without-CoT condition
      uses the original TFRecord question
      no additional direct prompt disclosed
    type: process
    size: xl
    position:
      x: 2420
      'y': 80
  - id: paper_cot
    label: |-
      Paper CoT appends exactly
      “Reason step by step about the answer,
      and show your work, for each step.
      Only after that,
      proceed to the final answer.”
    type: process
    size: xl
    position:
      x: 2420
      'y': 300
  - id: release_harness
    label: |-
      Release harness @ 5bba488
      uses the original TFRecord question
      does not inject the paper CoT
    type: process
    size: xl
    position:
      x: 2420
      'y': 600
  - id: openai_settings
    label: |-
      OpenAI API settings
      temperature 0
      max_tokens=300
    type: document
    size: xl
    position:
      x: 2700
      'y': 520
  - id: gemini_settings
    label: |-
      Gemini API settings
      temperature 0
      max_output_tokens=500
    type: document
    size: xl
    position:
      x: 2700
      'y': 700
  - id: normalize
    label: |-
      Exact-match normalization
      full response: remove periods
      trim whitespace · lowercase
      then exact match to ground truth
    type: process
    size: xl
    position:
      x: 2980
      'y': 610
  - id: metrics
    label: |-
      Multiple-choice accuracy
      overall · single-image · multi-image
      per question type
      paper compares without-CoT versus CoT
    type: terminal
    size: xl
    position:
      x: 3280
      'y': 350
edges:
  - from: evidence
    to: images
    type: data
  - from: scope
    to: images
    type: data
  - from: images
    to: curate
    type: primary
  - from: curate
    to: manual_qc
    type: primary
  - from: manual_qc
    to: taxonomy
    type: primary
  - from: taxonomy
    to: dataset
    type: primary
  - from: dataset
    to: artifact
    type: primary
  - from: artifact
    to: direct_suffix
    type: primary
  - from: direct_suffix
    to: protocol
    type: primary
  - from: protocol
    to: paper_direct
    type: primary
  - from: protocol
    to: paper_cot
    type: primary
  - from: protocol
    to: release_harness
    type: primary
  - from: release_harness
    to: openai_settings
    type: primary
  - from: release_harness
    to: gemini_settings
    type: primary
  - from: openai_settings
    to: normalize
    type: primary
  - from: gemini_settings
    to: normalize
    type: primary
  - from: paper_direct
    to: metrics
    type: primary
    waypoints:
      - x: 3220
        'y': 130
      - x: 3220
        'y': 400
  - from: paper_cot
    to: metrics
    type: primary
    waypoints:
      - x: 3240
        'y': 350
      - x: 3240
        'y': 400
  - from: normalize
    to: metrics
    type: primary
    waypoints:
      - x: 3260
        'y': 660
      - x: 3260
        'y': 400
modules: []
