meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PRDBench Build and Evaluation Process
  description: >-
    Paper-aligned seed filtering, agent-driven PRD and criteria construction, human inspection, scaffold removal, and
    EvalAgent scoring for PRDBench.
  legend: >-
    PRDBench retains PRDs, criteria, test artifacts, and required data but removes generated scaffolds so evaluated code
    agents must implement projects from scratch.
