      Remove Generated Scaffold
      Retain PRD and criteria scheme
      Retain artifacts and required data
      Force implementation from scratch
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Finalize PRDBench
      50 projects · 20 domains
      1,262 scoring points
      409 unit · 729 shell · 124 file
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Code Agent Develops Project
      Read PRD and detailed test plan
      Implement predefined interfaces
      Optional debug round uses report
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      EvalAgent Executes Criteria
      Unit tests · shell interaction
      File comparison · artifact checks
      Compare actual and expected outputs
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Report Pass Rate and Feedback
      Score satisfied criteria points
      Generate detailed test report
      Compare development and debugging
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
