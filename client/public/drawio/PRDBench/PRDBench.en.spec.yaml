      Refine every scoring item
      Add test interfaces and artifacts
      Attach commands and expected outputs
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Human Test Inspection
      Run tests on the scaffold
      Check interface compatibility
      Check outputs against the PRD
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Agent Fix and Refinement Loop
      Annotators provide targeted feedback
      Agent revises scaffold or criteria
      Repeat inspection until resolved
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
