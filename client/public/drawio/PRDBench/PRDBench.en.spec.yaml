      Academic theses and projects
      Real engineering requirements
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Apply Two Eligibility Rules
      Fully implementable in Python
      Every required dataset is public
      Preserve diverse real scenarios
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Label and Sample Domains
      GPT-4 assigns domain labels
      Select 50 project-level tasks
      Cover 20 Python domains
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Standardize Each PRD
      GPT-4.1 or Claude Code
      Requirement and function details
      Data requirements and interfaces
