meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CURIE 构建流程
  description: 与论文对齐的专家构建、长上下文任务执行和异构指标评分流程。
  legend: 实线表示构建与评分主流程；虚线表示专家抽样验证路径。
nodes:
  - id: domains
    label: |-
      六个科学领域
      实验 + 理论工作流
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: experts
    label: |-
      领域专家
      每领域 1–3 名博士专家
    type: user
    size: xl
    position:
      x: 300
      'y': 210
  - id: criteria
    label: |-
      任务设计准则
      真实 · 上下文可解 · 专家可评
    type: process
    size: xl
    position:
      x: 560
      'y': 210
  - id: sources
    label: |-
      宽松许可来源
      论文 · 地图图像 · PDB 结构
    type: document
    size: xl
    position:
      x: 820
      'y': 210
  - id: annotation
    label: |-
      专家标注
      标准答案 · 难度 · 交叉复核
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: dataset
    label: |-
      CURIE
      10 个任务 · 429 篇文档 · 580 对样例
    type: database
    size: xl
    position:
      x: 1340
      'y': 210
  - id: input
    label: |-
      按任务选择输入
      完整论文 · 图像/图注 · PDB 文本
    type: decision
    size: xl
    position:
      x: 1600
      'y': 210
  - id: prompt
    label: |-
      标准零样本提示
      任务 + 输出格式 + 完整上下文
    type: process
    size: xl
    position:
      x: 1860
      'y': 210
  - id: outputs
    label: |-
      混合输出
      JSON · 文本/代码 · LaTeX · YAML · FASTA
    type: document
    size: xl
    position:
      x: 2120
      'y': 210
  - id: llmsim
    label: |-
      DFT-S · DFT-P · MPV
      LLMSim 精确率 / 召回率 / F1
    type: process
    size: xl
    position:
      x: 2380
      'y': 30
  - id: rouge
    label: |-
      DFT-C · HFD · HFE · QECC · GEO
      ROUGE-L
    type: process
    size: xl
    position:
      x: 2380
      'y': 150
  - id: special
    label: |-
      BIOGR · PDB
      边界框 IoU · 序列一致率
    type: process
    size: xl
    position:
      x: 2380
      'y': 330
  - id: aggregate
    label: |-
      CURIE 总分
      归一化至 [0,1] · 十任务平均
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 210
  - id: audit
    label: |-
      专家验证
      Rubric + 10–12% 好/尚可/差抽检
    type: user
    size: xl
    position:
      x: 2900
      'y': 210
edges:
  - from: domains
    to: experts
    type: primary
  - from: experts
    to: criteria
    type: primary
  - from: criteria
    to: sources
    type: primary
  - from: sources
    to: annotation
    type: primary
  - from: annotation
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: prompt
    type: primary
  - from: prompt
    to: outputs
    type: primary
  - from: outputs
    to: llmsim
    type: primary
  - from: outputs
    to: rouge
    type: primary
  - from: outputs
    to: special
    type: primary
  - from: llmsim
    to: aggregate
    type: primary
  - from: rouge
    to: aggregate
    type: primary
  - from: special
    to: aggregate
    type: primary
  - from: outputs
    to: audit
    type: optional
  - from: audit
    to: aggregate
    type: optional
modules: []
