  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeR² Build Process
  description: >-
    Paper-aligned expert construction, leakage-resistant calibration, frozen document libraries, and four-regime
    reasoning diagnosis.
  legend: >-
    Solid arrows trace item construction and four controlled input regimes; only supplied evidence changes across
    regimes.
nodes:
