      15+ disciplines · foundations / engineering / interdisciplinary
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: experts
    label: |-
      81 PhD annotators
      work only in their specialties · RMB 2,500 per item
    type: process
    size: xl
    position:
      x: 300
      'y': 250
