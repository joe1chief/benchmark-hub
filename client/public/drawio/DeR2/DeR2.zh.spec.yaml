meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeR² 构建流程
  description: 对齐论文的专家构题、防泄漏难度校准、冻结文档库与四种受控推理诊断流程。
  legend: 实线箭头串联样本构建和四种受控输入；各评测条件只改变所提供的证据。
nodes:
  - id: papers
    label: |-
      2023–2025 年理论导向论文
      15+ 学科 · 理论基础 / 工程 / 交叉领域
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: experts
    label: |-
      81 位博士标注员
      仅在本专业工作 · 每题 2,500 元
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: item
    label: |-
      人工编写五字段样本
      指令 · 概念 · 推理链 · 答案 · 文档集
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: calibrate
    label: |-
      三次离线难度校准
      仅指令：三次全错
      提供概念：至少一对一错
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: docs
    label: |-
      从源论文参考文献建库
      每概念至少一篇相关文档 + 主题邻近噪声
      平均 6.5 篇 · 禁止答案泄漏
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: review
    label: |-
      博士审核与迭代返工
      科学逻辑 · 唯一答案 · 格式
      重跑校准并复核文档
    type: decision
    size: xl
    position:
      x: 1340
      'y': 250
  - id: benchmark
    label: |-
      DeR² 受控沙盒
      300 个前沿问题 · 冻结文档库
      五类答案形态
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: regimes
    label: |-
      四种受控输入
      提示与评分一致，仅改变证据
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: instruction
    label: |-
      仅指令条件
      参数知识基线
    type: document
    size: xl
    position:
      x: 2120
      'y': 10
  - id: concepts
    label: |-
      仅概念条件
      预言概念 · 组合与调度推理
    type: document
    size: xl
    position:
      x: 2120
      'y': 170
  - id: related
    label: |-
      仅相关文档条件
      干净证据 · 提取与推理
    type: document
    size: xl
    position:
      x: 2120
      'y': 330
  - id: full
    label: |-
      完整文档集条件
      相关 + 噪声 · 去噪与推理
    type: document
    size: xl
    position:
      x: 2120
      'y': 490
  - id: judge
    label: |-
      固定单次预测 · 禁止联网
      Doubao 裁判 · 数值 / 符号 / 清单归一
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: metrics
    label: |-
      准确率与受控差值
      知识 · 文档到概念 · 噪声损失
      检索损失 = 仅概念 − 完整文档集
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
