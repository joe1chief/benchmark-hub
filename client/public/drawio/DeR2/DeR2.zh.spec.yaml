meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeR² 构建与评测流程
  description: 对专家构题、防泄漏校准、冻结文档库、四种受控证据条件、确定性截断、双次推理、裁判归一化和诊断损失差值进行版本钉住。
  legend: 实线串联通过审核的样本和评测；虚线回路表示审核指导下的返工。
nodes:
  - id: evidence
    label: |-
      论文 arXiv:2601.21937v2
      GitHub @ 95a8aba
      HF 数据集 @ b0a84aed
      TSV SHA256 3473fab…
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: papers
    label: |-
      2023—2025 年源论文
      理论导向 · 15+ 学科
      排除应用实验、
      社会调查与数值模拟
    type: database
    size: xl
    position:
      x: 300
      'y': 300
  - id: experts
    label: |-
      81 位博士标注员
      仅在自身专业工作
      每题 2,500 元
      审核每条 350 元
    type: process
    size: xl
    position:
      x: 560
      'y': 300
  - id: item
    label: |-
      人工定稿五个字段
      指令 · 概念 · 推理链
      答案 · 文档集
      唯一且可验证的目标
    type: document
    size: xl
    position:
      x: 820
      'y': 300
  - id: calibrate
    label: |-
      每种条件运行三次
      仅指令：3/3 错误
      仅概念：至少一次正确
      且至少一次错误
    type: process
    size: xl
    position:
      x: 1080
      'y': 300
  - id: calibration_gate
    label: |-
      是否满足校准条件？
      若概念条件三次全对：
      文档集复测 · 始终正确则丢弃
      至少两次失败则保留，否则修改
    type: decision
    size: xl
    position:
      x: 1340
      'y': 300
  - id: docs
    label: |-
      从源论文参考文献建库
      每个概念至少一篇相关文档
      添加主题邻近噪声
      禁止概念 / 答案泄漏
    type: process
    size: xl
    position:
      x: 1600
      'y': 300
  - id: review
    label: |-
      审核员至少有 3 条通过样本
      科学逻辑 · 唯一答案
      重跑难度校准
      再次复核文档集
    type: process
    size: xl
    position:
      x: 1860
      'y': 300
  - id: benchmark
    label: |-
      DeR²-300 · 数量版本边界
      300 题 · 冻结文档库
      论文：平均 6.5 篇文档
      TSV：相关 1,111 + 噪声 666 = 1,777
      固定均值 5.9233 · 无训练/开发/测试划分
    type: database
    size: xl
    position:
      x: 2120
      'y': 300
  - id: regimes
    label: |-
      三套条件专用提示
      仅流程与评分保持一致
      四种受控输入
      仅指令 · 仅概念
      仅相关文档 · 完整文档集
    type: decision
    size: xl
    position:
      x: 2380
      'y': 300
  - id: instruction
    label: |-
      提示 C · 仅指令条件
      参数知识
      不提供概念或文档
    type: document
    size: xl
    position:
      x: 2640
      'y': 0
  - id: concepts
    label: |-
      提示 B · 仅概念条件
      预言概念
      组合与调度推理
    type: document
    size: xl
    position:
      x: 2640
      'y': 190
  - id: related
    label: |-
      提示 A · 仅相关文档条件
      干净证据文档
      提取并操作化概念
    type: document
    size: xl
    position:
      x: 2640
      'y': 380
  - id: full
    label: |-
      提示 A · 完整文档集条件
      相关文档 + 噪声文档
      选择、去噪并推理
    type: document
    size: xl
    position:
      x: 2640
      'y': 570
  - id: truncate
    label: |-
      确定性长文本保护
      默认 max_chars = 30,000
      保留前半与后半
      中间插入固定截断标记
    type: process
    size: xl
    position:
      x: 2900
      'y': 300
  - id: run
    label: |-
      固定输入 · 禁止联网
      温度 = 1 · top_p = 0.7
      每个模型 × 设置运行两次
      报告平均分
    type: process
    size: xl
    position:
      x: 3160
      'y': 300
  - id: judge
    label: |-
      doubao-seed-1-6-251015 裁判
      任务特定归一化
      数值容差 · 符号等价
      清单匹配
    type: process
    size: xl
    position:
      x: 3420
      'y': 300
  - id: metrics
    label: |-
      答案准确率
      论文原词 · 不新增缩写
      知识损失 · 检索损失
      噪声诱发损失 · 文档到概念损失
      唯一公式：RLoss = 仅概念 − 完整文档集
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 300
