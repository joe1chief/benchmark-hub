    type: primary
  - from: docs
    to: review
    type: primary
  - from: review
    to: benchmark
    type: primary
  - from: benchmark
    to: regimes
    type: primary
  - from: regimes
    to: instruction
    type: primary
  - from: regimes
    to: concepts
    type: primary
  - from: regimes
    to: related
    type: primary
  - from: regimes
    to: full
    type: primary
  - from: instruction
    to: judge
    type: primary
  - from: concepts
    to: judge
    type: primary
  - from: related
    to: judge
