      单题准确率
    type: terminal
    size: large
    position:
      x: 1640
      'y': 240
  - id: diagnostics
    label: |-
      是/否偏置 +
      一致性测试
    type: process
    size: large
    position:
      x: 1640
      'y': 400
  - id: failure
    label: |-
      故障决策树
      语言 / 视觉 / 混合
    type: terminal
    size: large
    position:
      x: 1840
      'y': 400
