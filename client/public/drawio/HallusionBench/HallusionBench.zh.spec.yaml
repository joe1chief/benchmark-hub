    label: |-
      视觉问题
      分类体系
    type: document
    size: large
    position:
      x: 40
      'y': 240
  - id: dependent
    label: |-
      视觉依赖问题
      591 题
    type: process
    size: large
    position:
      x: 240
      'y': 80
  - id: supplement
    label: |-
      视觉补充问题
      538 题
    type: process
    size: large
    position:
      x: 240
      'y': 400
  - id: collect
    label: |-
      专家精选
      346 张图像
    type: user
    size: large
    position:
      x: 440
      'y': 240
  - id: original
    label: |-
      无图输入 16%
      原始图像输入 39%
    type: document
    size: large
    position:
      x: 640
      'y': 80
  - id: edited
    label: |-
      181 张人工编辑图像
      占问题 45%
    type: process
    size: large
    position:
      x: 640
      'y': 400
  - id: controls
    label: |-
