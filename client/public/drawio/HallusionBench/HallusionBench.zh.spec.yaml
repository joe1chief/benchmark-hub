meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HallusionBench 构建流程
  description: >-
    按论文对齐的 HallusionBench 流程：专家定义视觉依赖与视觉补充问题，收集并编辑 346 张图像，构造 455 个控制对和 1,129 道二元问题； GPT-4 对 LVLM
    回复判定三次取平均，再报告单题、图像、问题对、难度、偏置、一致性及故障诊断指标。
  legend: 实线表示控制对构建和评测；指标分支区分正确性统计与故障诊断。
nodes:
