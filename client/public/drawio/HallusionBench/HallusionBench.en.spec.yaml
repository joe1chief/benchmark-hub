  title: HallusionBench Build Process
  description: >-
    Paper-aligned HallusionBench workflow: experts define Visual Dependent and Visual Supplement questions, collect and
    edit 346 images into 455 control pairs with 1,129 binary questions, judge LVLM outputs three times with GPT-4, and
    report item, figure, pair, difficulty, bias, consistency, and failure-diagnosis metrics.
  legend: Solid arrows show control-pair construction and evaluation; metric branches separate correctness from diagnosis.
