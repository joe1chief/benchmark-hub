  layout: horizontal
  routing: orthogonal
  title: RULER Build and Evaluation Process
  description: >-
    Paper-aligned workflow for generating configurable synthetic long-context tasks across retrieval, multi-hop tracing,
    aggregation, and question answering, then measuring effective context size.
  legend: >-
    The paper evaluates 13 representative configurations. For each task and each of 4K, 8K, 16K, 32K, 64K, and 128K
    tokens, it generates 500 examples and scores target recall with recall-based accuracy.
