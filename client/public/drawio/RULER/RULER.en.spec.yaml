      At Each Context Length
    type: process
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: aggregate_scores
    label: |-
      Aggregate Results
      Mean across 13 Tasks per Length
      Increasing and Decreasing
      Length-weighted Averages
    type: process
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: effective_length
    label: |-
      Effective Context Length
      Largest Length above 85.6%
      Llama2-7B at 4K Threshold
      Compare with Claimed Length
