      No-explanation Wording Is Template-specific
    type: document
    size: xl
    position: { x: 980, y: 80 }
    style: { fontSize: 9 }
  - id: generate
    label: |-
      Generate Every Task-length Pair
      500 Examples per Length
      Auto-generated Evaluation Inputs
      No Fixed Row Split
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: direct_answer
    label: |-
      General Prompt Route
      No One-shot Demonstration
      Apply Model + Task Templates
      Append Task Answer Prefix
    type: process
    size: xl
    position: { x: 1220, y: 0 }
    style: { fontSize: 9 }
  - id: vt_cwe_one_shot
    label: |-
      VT and CWE Route
      Prepend One Demonstration
      Then Present Test Query
      Append Task Answer Prefix
    type: process
    size: xl
    position: { x: 1220, y: 180 }
    style: { fontSize: 9 }
  - id: inference
    label: |-
      Inference · 17 LMs
      15 Open + GPT-4 + Gemini-1.5
      Paper: vLLM · BF16 · Eight A100s
      Paper: Greedy Decoding
      Snapshot: Llama2 vLLM · GPT/Gemini APIs
    type: process
    size: xl
    position: { x: 1700, y: 300 }
    style: { fontSize: 8 }
  - id: recall_metric
