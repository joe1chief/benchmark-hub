      PDF SHA256 8a4bc6ca28d8
      Paper-era Git dbc6a83c2f60
      Current Git 38da79d79519
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 8 }
  - id: benchmark_design
