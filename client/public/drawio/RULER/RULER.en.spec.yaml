meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RULER Paper-aligned Build and Evaluation Process
  description: >-
    COLM 2024 workflow for configuring four long-context behavior categories, generating 13 representative task
    configurations across six context lengths, and measuring recall-based accuracy and effective context length.
  legend: >-
    Solid arrows show the paper workflow. Dashed arrows isolate source, paper-era implementation, release, current-code
    drift, and license boundaries; RULERv2 and later generator fixes are not projected back into the paper pipeline.
