meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FACTS Grounding Build Process
  description: Paper-aligned construction, judge calibration, eligibility filtering, and factuality scoring for FACTS Grounding.
  legend: >-
    Solid arrows distinguish dataset construction from the two separately calibrated evaluation stages. Ineligible
    responses are counted as inaccurate in the final score.
nodes:
  - id: documents
    label: |-
      Collect web documents and reviews
      finance · technology · retail · medical · legal
      mean 2.5k tokens; maximum 32k
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: authoring
    label: |-
      Third-party raters author context-only tasks
      Q&A · summarization · document rewriting
      non-trivial requests with long-form answers
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: quality
    label: |-
      Manually verify every example
      exclude creative / expert-knowledge / math tasks
      remove OCR-unreadable PDFs and invalid contexts
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: splits
    label: |-
      Balanced random sampling by task attributes
      Open public set: 860 examples
      Blind private set: 859 examples
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: responses
    label: |-
      Generate long-form model responses
      answer the request using only supplied context
      no external knowledge should be required
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: eligibility
    label: |-
      Calibrate eligibility on N=450 golden labels
      choose per-judge best of 2 prompts by Macro-F1
      disqualify only when all 3 judges agree
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: factuality_setup
    label: |-
      Calibrate factuality on N=402 golden labels
      test 7 prompt templates per judge
      select each judge's highest Macro-F1 prompt
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: factuality
    label: |-
      Gemini 1.5 Pro · GPT-4o · Claude 3.5 Sonnet
      mark accurate only if every informative claim
      is supported by the supplied document
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: score
    label: |-
      Count ineligible responses as inaccurate
      average judges' percentages of accurate answers
      report final FACTS Grounding factuality score
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: documents
    to: authoring
    type: primary
  - from: authoring
    to: quality
    type: primary
  - from: quality
    to: splits
    type: primary
  - from: splits
    to: responses
    type: primary
  - from: responses
    to: eligibility
    type: primary
  - from: eligibility
    to: factuality_setup
    type: primary
  - from: factuality_setup
    to: factuality
    type: primary
  - from: factuality
    to: score
    type: primary
modules: []
