meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FACTS Grounding Build Process
  description: >-
    Paper- and artifact-pinned construction, manual quality control, balanced split, separately calibrated eligibility
    and factuality judges, and final score aggregation.
  legend: >-
    Solid arrows follow arXiv:2501.03200v1; dashed arrows supply pinned calibration or release evidence. Eligibility and
    factuality use separate golden sets.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      arXiv:2501.03200v1
      HF dataset @ 11b6961
      FACTS Grounding 1.0 public artifact
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: documents
    label: |-
      Collect web documents or review sets
      medical · legal · internet/technology
      financial · retail/product
      mean 2.5k tokens · maximum 32k
    type: database
    size: xl
    position:
      x: 40
      'y': 360
  - id: authoring
    label: |-
      Third-party raters author tasks
      Q&A · summarization · rewriting
      non-trivial request from context
      system instruction
      forbids external knowledge
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: quality
    label: |-
      Manually verify every example
      remove creative / expert tasks
      remove math / logic / meta-analysis
      remove OCR-unreadable PDF contexts
    type: process
    size: xl
    position:
      x: 600
      'y': 360
  - id: splits
    label: |-
      Balanced random sampling
      Open public split: 860
      Blind private split: 859
      total: 1,719 examples
    type: database
    size: xl
    position:
      x: 880
      'y': 360
  - id: responses
    label: |-
      Generate the model response
      system instruction + user request
      + supplied context
      fulfill the request in long form
      ground exclusively in supplied context
    type: process
    size: xl
    position:
      x: 1160
      'y': 360
  - id: eligibility_setup
    label: |-
      Calibrate eligibility prompts
      separate golden set N=450
      request only vs request + context
      best Macro-F1 template per judge
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: eligibility
    label: |-
      Three-judge eligibility verdict
      Gemini 1.5 Pro · GPT-4o
      Claude 3.5 Sonnet
      sufficient response to user request
      ineligible only if all three agree
    type: process
    size: xl
    position:
      x: 1760
      'y': 120
  - id: factuality_setup
    label: |-
      Calibrate factuality prompts
      separate N=402 golden set
      class ratio 87:13
      test seven prompt templates
      best Macro-F1 template per judge
    type: document
    size: xl
    position:
      x: 1460
      'y': 680
  - id: factuality
    label: |-
      Three-judge factuality verdict
      accurate only if every
      informative claim is grounded
      or requires no grounding
      one unsupported claim means inaccurate
    type: process
    size: xl
    position:
      x: 1760
      'y': 600
  - id: combine
    label: |-
      Combine the two stages
      disqualify ineligible responses
      count ineligible replies as inaccurate
      accurate % for each factuality judge
    type: process
    size: xl
    position:
      x: 2080
      'y': 360
  - id: score
    label: |-
      FACTS Grounding factuality score
      average accurate-response %
      from the three judges
      report Open and Blind leaderboards
      multiple providers
      mitigate self-preference
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 360
