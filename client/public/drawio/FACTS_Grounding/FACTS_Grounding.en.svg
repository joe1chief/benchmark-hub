sets</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>medical · legal · internet/technology</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>financial · retail/product</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>mean 2.5k tokens · maximum 32k</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="280" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,361) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Third-party raters author tasks</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Q&amp;A · summarization · rewriting</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>non-trivial request from context</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>system instruction</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>forbids external knowledge</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="560" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Manually verify every example</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>remove creative / expert tasks</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>remove math / logic / meta-analysis</tspan></text><text y="50.6" data-