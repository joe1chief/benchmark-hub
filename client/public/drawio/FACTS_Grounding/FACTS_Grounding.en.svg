 y="50.6" data-line-font-size="11" x="0"><tspan>fulfill the request in long form</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>ground exclusively in supplied context</tspan></text></g></g></g></g><g data-cell-id="8"><g><path d="M 1416 24 L 1616 24 L 1616 109 Q 1566 82 1516 109 Q 1466 136 1416 109 L 1416 39 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1516,32.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Calibrate eligibility prompts</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>separate golden set N=450</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>request only vs request + context</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>best Macro-F1 template per judge</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="1720" y="104" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1820,121) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Three-judge eligibility verdict</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Gemini 1.5 Pro · GPT-4o</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Claude 3.5 Sonnet</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>sufficient response to user request</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>ineligible only if all three agree</tspan></text></g></g></g></g><g data-cell-id="10"><g><path d="M 1416 664 L 1616 664 L 1616 749 Q 1566 722 1516 749 Q 1466 776 1416 749 L 1416 679 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1516,666) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Calibrate factuality prompts</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>separate N=402 golden set</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>class ratio 87:13</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>test seven prompt templates</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>best Macro-F1 template per judge</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1720" y="584" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1820,601) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Three-judge factuality verdict</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>accurate only if every</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>informative claim is grounded</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>or requires no grounding</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>one unsupported claim means inaccurate</tspan></text></g></g></g></g><g data-cell-id="12"><g><rect x="2040" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2140,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Combine the two stages</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>disqualify ineligible responses</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>count ineligible replies as inaccurate</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>accurate % for each factuality judge</tspan></text></g></g></g></g><g data-cell-id="13"><g><rect x="2336" y="344" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="79.2" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2436,354.4) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>FACTS Grounding factuality score</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>average accurate-response %</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>from the three judges</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>report Open and Blind leaderboards</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>multiple providers</tspan></text><text y="77" data-line-font-size="11" x="0"><tspan>mitigate self-preference</tspan></text></g></g></g></g><g data-cell-id="14"><g><path d="M 50 100 L 50 334.82" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 50 342