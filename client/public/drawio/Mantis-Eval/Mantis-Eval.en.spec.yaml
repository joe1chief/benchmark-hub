meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Mantis-Eval Build Process
  description: >-
    Paper- and evaluator-aligned manual construction of a held-out multi-image reasoning benchmark, followed by native
    or merged-image input handling and type-specific multiple-choice and short-answer scoring.
  legend: >-
    arXiv:2405.01483 reports 217 manually curated English examples with 2.5 images on average and at most five; the
    official evaluator reports multiple-choice, short-answer, and overall accuracy.
