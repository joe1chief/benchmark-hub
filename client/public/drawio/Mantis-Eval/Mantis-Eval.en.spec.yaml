      HF Source Field · Manual 50 · ChatGPT 42
      ImagenHub 28 + Mixed Web / Datasets
    type: document
    size: xl
    position:
      x: 624
      'y': 672
  - id: rights_boundary
    label: |-
      Release and Rights Boundary
      Repo + HF Card · Apache-2.0
      Embedded Third-party Images
      No Per-image License Mapping Disclosed
    type: document
    size: xl
    position:
      x: 896
      'y': 672
  - id: code_boundary
    label: |-
