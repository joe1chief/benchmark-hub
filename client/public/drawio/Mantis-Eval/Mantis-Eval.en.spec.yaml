meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Mantis-Eval Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs only the paper-v3 disclosed manual creation of the held-out multi-image set, preserves the undisclosed
    curation boundary, and traces the separately versioned official evaluator through input, type, parser, and scoring
    branches.
  legend: >-
    Solid arrows trace disclosed construction and official evaluation code. Decision branches carry explicit outcomes.
    Unconnected cards are evidence or reproducibility boundaries and do not invent review, rejection, or
    option-generation stages.
