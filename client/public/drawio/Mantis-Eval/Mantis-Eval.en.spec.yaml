    label: |-
      Prepare Model-specific Inputs
      Native Models Receive Image Sequence
      Single-image Baselines Merge Horizontally
      Append the Question Text
    type: process
    size: xl
    position:
      x: 1070
      'y': 420
  - id: prompt
    label: |-
      Request a Concise Final Response
      Multiple Choice · Output Option Letter
      Short Answer · Use “Final Answer:”
      Generate One Response per Item
    type: document
    size: xl
    position:
      x: 720
      'y': 420
  - id: parse
    label: |-
      Apply Type-specific Parsing
      MC · First Alphabetic Character / Option Text
