      Add Missing Image Placeholders
      Preserve Released Image Order
    type: process
    size: xl
    position:
      x: 1712
      'y': 32
  - id: flat_input
    label: |-
      False Path · Build Images-first Input
      Remove Image Placeholders from Text
      Pass Every Image before Joined Text
      QwenVL Keeps List · Other Wrappers May Merge
    type: process
    size: xl
    position:
      x: 1712
      'y': 352
  - id: type_gate
    label: Released Question Type?
    type: decision
    size: xl
    position:
      x: 1984
      'y': 192
  - id: mc_prompt
    label: |-
      Format Multiple-choice Prompt
      Append Lettered Options as Needed
      Ask for the Option Letter Directly
      Run the Selected Model Wrapper
    type: document
    size: xl
    position:
      x: 2256
      'y': 32
  - id: short_prompt
    label: |-
      Format Short-answer Prompt
      Allow Analysis before Final Response
      Request Final Answer: Marker
      Run the Selected Model Wrapper
    type: document
    size: xl
    position:
      x: 2256
      'y': 352
  - id: mc_parse
    label: |-
      Normalize Multiple-choice Response
      Strip Final Answer: / The Answer Is / Answer:
      Then Select First Alphabetic Character
      Uppercase the Selected Character
    type: process
    size: xl
    position:
      x: 2528
      'y': 32
  - id: letter_gate
    label: Valid In-range Option Letter?
    type: decision
    size: xl
    position:
      x: 2800
      'y': 32
  - id: letter_compare
    label: |-
      Compare Option Letter
      Selected Uppercase Letter
      Equals Reference Letter
    type: process
    size: xl
    position:
      x: 3072
      'y': 0
  - id: text_fallback
    label: |-
      Exact Option-text Fallback
      Use Raw Response, Not Parsed Phrase
      Strip A. / A: / (A) from Gold Option
      Case-sensitive Exact Equality
    type: process
    size: xl
    position:
      x: 3072
      'y': 160
  - id: short_parse
    label: |-
      Parse Short Answer
      Same Three Marker Precedence Rules
      Strip Marker Suffix; Else Keep Raw
      Normalize Reference Parentheses / Space
      Case-insensitive Exact Equality
    type: process
    size: xl
    position:
      x: 2800
      'y': 352
  - id: match_gate
    label: Row Marked Correct?
    type: decision
    size: xl
    position:
      x: 3344
      'y': 192
  - id: correct
