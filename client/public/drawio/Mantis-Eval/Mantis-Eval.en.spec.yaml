      217 Rows · 200 MCQ + 17 Short
      Image Counts · 145 / 39 / 32 / 1
      For 2 / 3 / 4 / 5 Images
    type: document
    size: xl
    position:
      x: 352
      'y': 672
  - id: source_boundary
    label: |-
