      Target Reasoning and Coreference
      Cover Relations across Images
      Use English Questions
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: acquire
    label: |-
      Acquire Candidate Images
      Annotators Use Google Search
      Select Images Needed Together
      Cover Diverse Everyday Topics
    type: database
    size: xl
    position:
      x: 370
      'y': 40
  - id: compose
    label: |-
      Compose Multi-image Instances
      Average 2.5 Images per Example
      Maximum 5 Images
      Preserve Image Order
    type: process
    size: xl
    position:
      x: 720
      'y': 40
  - id: author
    label: |-
      Manually Author Questions
      Require Joint Image Understanding
      Include Multiple Choice
      Include Short Answer
    type: user
    size: xl
    position:
      x: 1070
      'y': 40
  - id: curate
    label: |-
      Finalize Manual Curation
      Topics Include Size Perception
      Weight Comparison and Other Relations
      Keep Both Question Formats
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
