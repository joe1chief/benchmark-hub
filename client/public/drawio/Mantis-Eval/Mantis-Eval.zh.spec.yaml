meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Mantis-Eval 构建流程
  description: 按论文及官方评测器复原 Mantis-Eval：人工构建留出的多图推理测试集，再按模型能力输入原生图像序列或拼接图， 分别解析多选题与简答题并报告准确率。
  legend: arXiv:2405.01483 报告 217 条人工整理的英文样本，平均含 2.5 张图、最多 5 张图； 官方评测器分别报告多选题准确率、简答题准确率和总体准确率。
nodes:
  - id: scope
    label: |-
      定义留出的多图评测
      面向推理与共指能力
      覆盖跨图像关系
      使用英文问题
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: acquire
    label: |-
      获取候选图像
      标注者使用 Google 搜索
      选择必须联合理解的图像
      覆盖多样日常主题
    type: database
    size: xl
    position:
      x: 370
      'y': 40
  - id: compose
    label: |-
      组成多图样本
      每条平均 2.5 张图
      最多 5 张图
      保留图像顺序
    type: process
    size: xl
    position:
      x: 720
      'y': 40
  - id: author
    label: |-
      人工编写问题
      要求联合理解多张图像
      包含多项选择题
      包含简答题
    type: user
    size: xl
    position:
      x: 1070
      'y': 40
  - id: curate
    label: |-
      完成人工整理
      主题包括大小感知
      重量比较及其他关系
      保留两种问题格式
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
    label: |-
      发布 Mantis-Eval
      共 217 条测试样本
      包含多选题与简答题
      不进入 Mantis 训练数据
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: input
    label: |-
      准备模型专属输入
      原生多图模型接收图像序列
      单图基线水平拼接所有图像
      追加问题文本
    type: process
    size: xl
    position:
      x: 1070
      'y': 420
  - id: prompt
    label: |-
      要求输出简洁最终回答
      多选题 · 输出选项字母
      简答题 · 使用 “Final Answer:”
      每题生成一次回答
    type: document
    size: xl
    position:
      x: 720
      'y': 420
  - id: parse
    label: |-
      按题型解析答案
      多选 · 首个字母或选项文本
      简答 · 解析最终答案提示语
      忽略大小写进行比较
    type: process
    size: xl
    position:
      x: 370
      'y': 420
  - id: report
    label: |-
      报告准确率
      多选题准确率
      简答题准确率
      总体平均正确率
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: acquire
    type: primary
  - from: acquire
    to: compose
    type: primary
  - from: compose
    to: author
    type: primary
  - from: author
    to: curate
    type: primary
  - from: curate
    to: release
    type: primary
  - from: release
    to: input
    type: primary
  - from: input
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: report
    type: primary
modules: []
