meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MSEarthMCQ Build Process
  description: >-
    MSEarthMCQ parses more than 400,000 Earth-science PDFs, filters papers and aligns figures with references, then uses
    GPT-4o to refine captions and create candidate questions; three-phase five-model and 70B-plus-model screening plus
    expert review removes 216 invalid items and yields 2,784 questions.
  legend: >-
    Source: arXiv:2505.20740 Sections 3-4 and Appendices E-G; official PrismaX/MSEarth repository and MSEarth_MCQ
    dataset. Solid arrows show the main flow explicitly supported by the paper or official documentation.
nodes:
  - id: papers
    label: |-
      Collect Earth-science Papers
      More than 400K PDFs
      Cover Five Earth Spheres
      Start from Scholarly Sources
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: parse
    label: |-
      Parse and Classify Papers
      Convert PDF to JSON with MinerU
      Match Abstract to Sphere Terms
      Assign Discipline Categories
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: filter
    label: |-
      Filter Scientific Figures
      Use Qwen2.5-VL-72B
      Require Earth-science Relevance
      Retain about 83K Papers
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: align
    label: |-
      Align Figures and Captions
      Extract MinerU Figure Assets
      Detect Figure Labels by Regex
      Match References in Main Text
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: context
    label: |-
      Extract Supporting Context
      Keep Referencing Paragraphs
      Require More than Two Sentences
      Retain 64,560 Papers
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: refine
    label: |-
      Generate Refined Captions
      Input Figure · Raw Caption
      Add Paper-context Reasoning
      Use GPT-4o
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: generate
    label: |-
      Generate Candidate MCQs
      Input Figure and Both Captions
      Use GPT-4o
      Ground QA in Paper Evidence
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: phase_a
    label: |-
      Phase A Vote Outcome?
      Original Caption
      Five MLLMs
    type: decision
    size: xl
    position:
      x: 1460
      'y': 420
  - id: phase_b
    label: |-
      Phase B: >60% Correct?
      Refined Caption
      Same Five MLLMs
    type: decision
    size: xl
    position:
      x: 1220
      'y': 420
  - id: phase_c
    label: |-
      Phase C: >60% Correct?
      Refined Caption
      Three 70B+ MLLMs
    type: decision
    size: xl
    position:
      x: 980
      'y': 420
  - id: sample
    label: |-
      Sample the MCQ Benchmark
      900 Questions from Phase A
      1,800 B · 300 C
      Form 3,000 MCQ Candidates
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: expert
    label: |-
      Validate with Earth Experts
      Require Master's Background
      Check Completeness and Answer
      Remove 216 Invalid MCQs
    type: user
    size: xl
    position:
      x: 500
      'y': 420
  - id: release
    label: |-
      Publish MSEarthMCQ
      2,784 Figure-grounded MCQs
      2,117 Discovery · 667 Perception
      1,255 Single · 1,529 Multi-image
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: score
    label: |-
      Evaluate with Accuracy
      Use Structured MCQ Prompt
      Extract Choice by Regex
      Compare with Gold Option
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
  - id: discard
    label: |-
      Discard Candidate
      Overly Simple or Flawed
    type: loss
    size: xl
    position:
      x: 1100
      'y': 800
edges:
  - from: papers
    to: parse
    type: primary
  - from: parse
    to: filter
    type: primary
  - from: filter
    to: align
    type: primary
  - from: align
    to: context
    type: primary
  - from: context
    to: refine
    type: primary
  - from: refine
    to: generate
    type: primary
  - from: generate
    to: phase_a
    type: primary
  - from: phase_a
    to: phase_b
    type: primary
    label: '>40% wrong · analyze further'
    labelPosition: center
  - from: phase_b
    to: phase_c
    type: primary
    label: ≤60% correct · analyze further
    labelPosition: center
  - from: phase_c
    to: sample
    type: primary
    label: '>60% correct · hard QA'
    labelPosition: center
  - from: sample
    to: expert
    type: primary
  - from: expert
    to: release
    type: primary
  - from: release
    to: score
    type: primary
  - from: phase_a
    to: discard
    type: optional
    label: All correct · too simple
    labelPosition: center
    waypoints:
      - x: 1580
        'y': 720
      - x: 1220
        'y': 720
  - from: phase_a
    to: sample
    type: primary
    label: Otherwise · easy QA
    labelPosition: center
    waypoints:
      - x: 1460
        'y': 650
      - x: 740
        'y': 650
  - from: phase_b
    to: sample
    type: primary
    label: '>60% correct · specialized QA'
    labelPosition: center
    waypoints:
      - x: 1220
        'y': 250
      - x: 740
        'y': 250
  - from: phase_c
    to: discard
    type: optional
    label: ≤60% correct · flawed
    labelPosition: center
modules: []
