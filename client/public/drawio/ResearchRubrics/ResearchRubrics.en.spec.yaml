meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ResearchRubrics Build and Evaluation Process
  description: >-
    ResearchRubrics contains 101 open-ended single-turn deep-research prompts across nine domains and 2,593
    prompt-specific criteria, usually 20-43 per task. All prompts and rubrics are human-authored without LLM seeding:
    one STEM-trained expert drafts, a second iteratively reviews, and a third independently finalizes them, totaling
    more than 2,800 hours. Criteria cover six axes, distinguish mandatory from optional requirements, and use signed
    importance weights. Human and model judges grade criterion adherence, including partial credit in the ternary
    protocol, then aggregate weighted rubric compliance and report results by domain, criterion axis, and
    task-complexity dimensions.
  legend: >-
    Source: ResearchRubrics arXiv:2511.07685 Sections 3.1-3.4 and evaluation sections, cross-checked against
    scaleapi/researchrubrics. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
