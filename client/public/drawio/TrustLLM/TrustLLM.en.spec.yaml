meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TrustLLM Build and Evaluation Process
  description: >-
    TrustLLM first defines eight trustworthiness principles, then operationalizes the six dimensions that can be
    benchmarked reproducibly: truthfulness, safety, fairness, robustness, privacy, and machine ethics. The authors
    decompose these into more than 18 subcategories, select or construct over 30 datasets, standardize task prompts, and
    add controlled perturbations or adversarial cases where required. Sixteen representative LLMs are evaluated with
    dimension-specific procedures: exact or semantic correctness, refusal and toxicity behavior, group disparities,
    perturbation consistency, privacy leakage, and ethical-choice agreement. Metrics are normalized within their task
    context and summarized by subcategory, dimension, and overall model comparison; transparency and accountability
    remain principles but are not scored in this benchmark.
  legend: >-
    Source: TrustLLM arXiv:2401.05561, Sections 2-10 and Appendices; official HowieHwong/TrustLLM repository. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
