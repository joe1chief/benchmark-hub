meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TrustLLM 构建与评测流程
  description: >-
    TrustLLM先提出8项可信原则，再将其中可重复评测的6个维度操作化：真实性、安全性、公平性、鲁棒性、隐私和机器伦理。作者将其拆成18个以上子类别，选择或构造30多个数据集，统一任务提示，并在需要时加入受控扰动或对抗样例。16个代表性LLM接受维度特定评测，包括精确或语义正确性、拒答与毒性、群体差异、扰动一致性、隐私泄漏和伦理选择一致性。各指标在对应任务语境中归一化，并按子类别、维度及模型总体比较汇总；透明性与问责制仍属于原则，但未在该基准中量化评分。
  legend: >-
    来源：TrustLLM arXiv:2401.05561, Sections 2-10 and Appendices; official HowieHwong/TrustLLM
    repository。实线箭头表示论文或官方资料明确支持的主流程。
