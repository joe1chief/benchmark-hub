  title: ClinicBench Build Process
  description: >-
    Paper-aligned construction and evaluation flow for ClinicBench. Eleven existing clinical datasets and six newly
    constructed clinical-practice datasets form seventeen datasets across eleven reasoning, generation, and
    understanding tasks; twenty-two LLMs are then evaluated with automatic metrics and medical-expert review.
  legend: Solid arrows trace benchmark construction and evaluation; the two upper and lower branches are complementary.
