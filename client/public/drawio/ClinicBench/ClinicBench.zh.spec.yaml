    label: |-
      论文与官方发布边界
      arXiv 2405.00716v4
      表 1 • §§3, 4.1, 4.4–4.5
      官方仓库 57138be
    type: document
    size: xl
    position:
      x: 40
      'y': 340
  - id: existing
    label: |-
      复用 11 个数据集 • 5 类任务
      考试问答 • 放射报告总结
      命名实体识别
      关系抽取
      文档分类
    type: database
    size: xl
    position:
      x: 340
      'y': 20
  - id: decision_data
    label: |-
      构建临床决策数据
      Referral QA 1,057 • GPT-4
      专家复核／纠正／过滤
      治疗推荐 796 • ChatDoctor
    type: process
    size: xl
    position:
      x: 340
      'y': 180
  - id: generation_data
    label: |-
      构建长文档数据
      住院总结 382 • MIMIC-IV
      患者教育 181 • MIMIC-III
    type: process
    size: xl
    position:
      x: 340
      'y': 340
  - id: pharmacology_data
    label: |-
      构建药理问答
      213 种新药 • DrugBank
      2023 年 10 月至 2024 年 4 月
      GPT-4 生成问答对
      专家复核
    type: process
    size: xl
    position:
      x: 340
      'y': 500
  - id: interaction_data
    label: |-
      构建药物相互作用
      Moderna 新冠疫苗
      2023–2024 配方 • Drugs.com
      阳性 100 + 阴性 100
    type: process
    size: xl
    position:
      x: 340
      'y': 660
  - id: release
    label: |-
      发布 ClinicBench
      3 个场景 • 11 类任务
      17 个数据集 • 超过 20,000 测试样本
      其中 6 个新建临床数据集
    type: database
    size: xl
    position:
      x: 680
      'y': 340
  - id: release_drift
    label: |-
      公开仓库快照
      5 个新数据文件
      Referral QA 缺失
      患者教育文件 3,621 行
      论文测试子集 181 对
    type: document
    size: xl
    position:
      x: 680
      'y': 660
  - id: model_panel
    label: |-
      组建模型面板
      共 22 个 LLM
      11 个通用 + 11 个医疗模型
      商业闭源 + 开源模型
    type: terminal
    size: xl
    position:
      x: 980
      'y': 340
  - id: prompt_select
    label: |-
      每项新临床任务设计 3 套提示
      抽取 100 个样本
      LLaMA-2 7B／13B／70B
      比较效果
      最佳提示用于完整数据集
    type: process
    size: xl
    position:
      x: 1280
      'y': 340
  - id: settings
    label: |-
      零样本 + 1／3／5 样本
      评测 22 个 LLM
      11 个通用 + 11 个医疗模型
      使用任务专属提示
    type: process
    size: xl
    position:
      x: 1580
      'y': 340
  - id: auto_metrics
    label: |-
      按任务自动评分
      Accuracy • ROUGE-L
      Micro／实体级 F1
      对比任务专属 SOTA
    type: document
    size: xl
    position:
      x: 1880
      'y': 160
  - id: human_samples
    label: |-
      抽取人工复核样本
      住院总结与患者教育各 100
      生成候选模型输出
    type: document
    size: xl
    position:
      x: 1880
      'y': 520
  - id: human_review
    label: |-
      3 位医疗专家盲评
      公共 LLM 与 GPT-4 对比
      事实性 • 完整性
      偏好 • 安全
      报告胜 + 平比例
    type: user
    size: xl
    position:
      x: 2180
      'y': 520
  - id: report
    label: |-
      发布 ClinicBench 结果
      自动任务指标
      零／少样本对比
      盲评临床实用性
    type: terminal
    size: xl
    position:
      x: 2480
      'y': 340
