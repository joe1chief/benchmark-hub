  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClinicBench 构建流程
  description: 与论文 v4 对齐的 ClinicBench 构建流程：11 个复用数据集与 6 个不同来源的临床数据集组成 17 数据集基准；仅 Referral QA 与药理问答使用 GPT-4 生成及专家复核。
  legend: 实线表示论文主流程；虚线分支记录范围更小且划分不同的公开仓库快照。
nodes:
