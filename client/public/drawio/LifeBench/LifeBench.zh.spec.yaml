meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LifeBench 构建流程
  description: 对齐论文的 LifeBench 构建流程：五个 DeepSeek-R1 模块生成一年期合成人生，经现实约束的日程模拟、 多源手机数据、带时间戳的记忆问答、质量控制和 LoCoMo 式评测完成。
  legend: 数量采用 arXiv:2603.03781v1：10 名用户，每人 5,149 个事件及 8,046 条手机/健康记录， 共 2,003 道带时间戳问题，覆盖五类记忆能力。
nodes:
  - id: priors
    label: |-
      汇集人物画像先验
      匿名问卷背景与生活方式
      PersonaHub 习惯 · 计划 · 特质 · 技能
      补充虚构的敏感属性
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: persona
    label: |-
      模块一 · 合成人物画像
      创建 20–30 人社交网络
      以高德地图真实地点锚定日常生活
      保持偏好与关系一致
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: plots
    label: |-
      选择个性化年度情节
      从 7 类约 50 个候选情节出发
      至多选择 10 条相容情节线
      结合画像与日历上下文
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: outline
    label: |-
      模块二 · 构建分层大纲
      按月规划完整一年
      依据上月摘要自回归生成
      纳入节假日与主题事件
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: atomic
    label: |-
      以部分—整体关系分解事件
      年度到月份再到主题事件
      递归拆成不足一天的原子事件
      优化每个两周活动窗口
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: subjective
    label: |-
      模块三 · 主观智能体模拟日程
      使用长期摘要与 7 天短期记忆
      检索 3 条相关情景活动
      生成符合情绪 · 爱好 · 习惯的活动
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: objective
    label: |-
      客观智能体检查现实性
      解决时间冲突并检查路程可行性
      结合高德信息核对地点与事实
      同时约束天气和既有日程
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: artifacts
    label: |-
      模块四 · 生成多源数据痕迹
      联系人 · 短信 · 通话 · 推送 · 照片
      备忘录 · 日历 · 智能体聊天 · 噪声
      补充健康与运动记录
    type: document
    size: xl
    position:
      x: 1700
      'y': 380
  - id: qa
    label: |-
      模块五 · 生成带时间戳问答
      在日常模拟期间动态生成问题
      对可回答性缺口补充手机数据
      形成选择题与简答题
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: quality
    label: |-
      过滤并复核数据质量
      LLM 删除非自包含题目
      人工审核并改写不合理问答
      检查现实性 · 关系 · 行程 · 多样性
    type: user
    size: xl
    position:
      x: 1140
      'y': 380
  - id: release
    label: |-
      发布 10 份一年期用户历史
      每人 5,149 个事件 · 日均约 14 个
      每人 8,046 条手机与健康记录
      2,003 题 · 517 选择题 + 1,486 简答题
    type: database
    size: xl
    position:
      x: 860
      'y': 380
  - id: evaluate
    label: |-
      规范化并评测记忆系统
      将数据痕迹摘要为 LoCoMo 格式
      GPT-5.1-Mini 负责记忆与作答
      使用 text-embedding-3-small 检索
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      判断答案并汇报准确率
      GPT-5.1-Mini 执行标准 LoCoMo Judge
      计算总体答对比例
      按 IE · MR · TKU · ND · UA 拆分
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: priors
    to: persona
    type: primary
  - from: persona
    to: plots
    type: primary
  - from: plots
    to: outline
    type: primary
  - from: outline
    to: atomic
    type: primary
  - from: atomic
    to: subjective
    type: primary
  - from: subjective
    to: objective
    type: primary
  - from: objective
    to: artifacts
    type: primary
  - from: artifacts
    to: qa
    type: primary
  - from: qa
    to: quality
    type: primary
  - from: quality
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
