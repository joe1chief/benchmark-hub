meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LifeBench Build Process
  description: >-
    Paper-aligned construction of one-year synthetic lives with five DeepSeek-R1 modules, constrained daily simulation,
    multi-source phone artifacts, timestamped memory questions, quality control, and LoCoMo-style evaluation.
  legend: >-
    Counts follow arXiv:2603.03781v1: 10 users, 5,149 events and 8,046 phone/health records per user, and 2,003
    timestamped questions across five memory categories.
nodes:
  - id: priors
    label: |-
      Assemble Persona Priors
      Anonymized Survey Background and Lifestyle
      PersonaHub Habits · Plans · Traits · Skills
      Add Fictional Sensitive Attributes
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: persona
    label: |-
      Module 1 · Synthesize a Persona
      Create a 20–30-person Social Network
      Ground Daily Life in Real AMap Locations
      Preserve Coherent Preferences and Relations
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: plots
    label: |-
      Select Personalized Yearly Plots
      Start from about 50 Candidates in 7 Types
      Choose Up to 10 Compatible Plot Lines
      Condition on Persona and Calendar Context
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: outline
    label: |-
      Module 2 · Build a Hierarchical Outline
      Plan One Year Month by Month
      Autoregress from Prior-month Summaries
      Include Holidays and Thematic Events
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: atomic
    label: |-
      Partonomically Decompose Events
      Year to Month to Thematic Event
      Recursively Split to Atomic Events under 1 Day
      Optimize Each Two-week Activity Window
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: subjective
    label: |-
      Module 3 · Subjective Daily Simulation
      Use Long-term Summaries and 7-day Memory
      Retrieve 3 Relevant Episodic Activities
      Draft Emotion · Hobby · Habit-aware Activities
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: objective
    label: |-
      Objective Agent Checks Realism
      Resolve Time Conflicts and Travel Feasibility
      Verify Venues and Facts with AMap Context
      Condition on Weather and Existing Schedule
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: artifacts
    label: |-
      Module 4 · Generate Multi-source Artifacts
      Contacts · SMS · Calls · Push · Photos
      Notes · Calendar · Agent Chats · Noise
      Add Health and Sports Records
    type: document
    size: xl
    position:
      x: 1700
      'y': 380
  - id: qa
    label: |-
      Module 5 · Generate Timestamped QA
      Create Questions during Daily Simulation
      Supplement Phone Data for Answerability Gaps
      Produce Multiple-choice and Short Answers
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: quality
    label: |-
      Filter and Review Data Quality
      LLM Removes Non-self-contained Items
      Manual Review Rewrites Unreasonable QA
      Score Realism · Relations · Trips · Diversity
    type: user
    size: xl
    position:
      x: 1140
      'y': 380
  - id: release
    label: |-
      Release 10 One-year User Histories
      5,149 Events per User · about 14 per Day
      8,046 Phone and Health Records per User
      2,003 Questions · 517 MCQ + 1,486 Short
    type: database
    size: xl
    position:
      x: 860
      'y': 380
  - id: evaluate
    label: |-
      Normalize and Evaluate Memory Systems
      Summarize Artifacts into LoCoMo Format
      Use GPT-5.1-Mini for Memory and Answering
      Embed with text-embedding-3-small
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      Judge Answers and Report Accuracy
      Standard LoCoMo Judge with GPT-5.1-Mini
      Overall Proportion Correct
      Break Down IE · MR · TKU · ND · UA
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: priors
    to: persona
    type: primary
  - from: persona
    to: plots
    type: primary
  - from: plots
    to: outline
    type: primary
  - from: outline
    to: atomic
    type: primary
  - from: atomic
    to: subjective
    type: primary
  - from: subjective
    to: objective
    type: primary
  - from: objective
    to: artifacts
    type: primary
  - from: artifacts
    to: qa
    type: primary
  - from: qa
    to: quality
    type: primary
  - from: quality
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
