"><tspan>以高德地图真实地点锚定日常生活</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>保持偏好与关系一致</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="560" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>选择个性化年度情节</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>从 7 类约 50 个候选情节出发</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>至多选择 10 条相容情节线</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>结合画像与日历上下文</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="840" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>模块二 · 构建分层大纲</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>按月规划完整一年</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>依据上月摘要自回归生成</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>纳入节假日与主题事件</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1120" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px