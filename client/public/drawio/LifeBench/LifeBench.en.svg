atic Events</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1132" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1232,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Partonomically Decompose Events</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Year to Month to Thematic Event</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Recursively Split to Atomic Events under 1 Day</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>Optimize Each Two-week Activity Window</tspan></text></g></g></g></g><g data-cell-id="7"><g><rect x="1412" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1512,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Module 3 · Subjective Daily Simulation</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Use Long-term Summaries and 7-day Memory</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Retrieve 3 Relevant Episodic Activities</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>Draft Emotion · Hobby · Habit-aware Activities</tspan></text></g></g></g></g><g data-cell-id="8"><g><rect x="1692" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/>