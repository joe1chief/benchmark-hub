meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LingoQA 构建流程
  description: 对齐论文，分别通过动作与场景两条流程构建自动驾驶视频问答，再制作双人标注的人类评测集， 并训练与人类判断高度相关的 DeBERTaV3 Lingo-Judge。
  legend: 数量采用 arXiv:2312.14115：共 28,000 个四秒场景和 41.99 万条问答标注。论文对动作分支的问答总数存在冲突， 本图只保留无歧义的总体数量。
nodes:
  - id: sessions
    label: |-
      采集自动驾驶行程
      记录前视视频与车辆状态
      保留感知与策略上下文
      识别值得关注的驾驶行为
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: clips
    label: |-
      提取四秒视频场景
      按 1 Hz 采样画面
      标准答案平均 17.2 个词
      将片段送入两条构建流程
    type: process
    size: xl
    position:
      x: 300
      'y': 260
  - id: action_seed
    label: |-
      动作分支 · 编写行为种子
      操作员描述情境与车辆动作
      加入信号灯 · 检测物 · 天气
      加入速度 · 转向 · 道路元数据
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: action_qa
    label: |-
      生成并平衡动作问答
      提示动作 · 理由 · 问题 · 提示线索
      GPT-3.5 负责改写 · 作答 · 扩展
      每种动作与策略类型最多 500 条
    type: process
    size: xl
    position:
      x: 900
      'y': 40
  - id: scenery_seed
    label: |-
      场景分支 · 密集标注视频
      选择三段各 30 分钟的驾驶行程
      用 ELAN 标注约 15 类描述
      将描述对齐到每个 1 Hz 画面
    type: user
    size: xl
    position:
      x: 580
      'y': 480
  - id: scenery_qa
    label: |-
      生成场景感知问答
      用思维链示例提示 GPT-4
      根据密集描述推导问题
      每个视频生成约 43 条问答
    type: process
    size: xl
    position:
      x: 900
      'y': 480
  - id: corpus
    label: |-
      合并 LingoQA 训练语料
      包含 24,577 个动作片段
      总计 2.8 万个独立四秒场景
      总计 41.99 万条问答标注
    type: database
    size: xl
    position:
      x: 1220
      'y': 260
  - id: competencies
    label: |-
      覆盖九项驾驶能力
      动作 · 理由 · 注意
      识别 · 定位 · 描述
      计数 · 预判 · 反事实推理
    type: process
    size: xl
    position:
      x: 1500
      'y': 260
  - id: eval_questions
    label: |-
      单独制作人类评测集
      内部标注员编写 500 道问题
      20 多名评估员参与
      问题均锚定驾驶视频片段
    type: user
    size: xl
    position:
      x: 1780
      'y': 260
  - id: references
    label: |-
      每题收集两个参考答案
      两次标注分配给不同人员
      复核语义分歧
      再标两次并按多数语义解决
    type: user
    size: xl
    position:
      x: 2060
      'y': 260
  - id: judge
    label: |-
      训练 DeBERTaV3 Lingo-Judge
      输入问题 · 人类答案 · 模型答案
      以人类正确性标签做 LoRA 训练
      主动学习修正旧模型错判样本
    type: process
    size: xl
    position:
      x: 2060
      'y': 600
  - id: score
    label: |-
      不输入视频直接评分答案
      分别预测对每个参考答案的正确性
      每题取两个参考答案中的最高分
      对所有问题取均值得到模型分数
    type: process
    size: xl
    position:
      x: 1780
      'y': 600
  - id: report
    label: |-
      验证并汇报 LingoQA 分数
      Judge 留出集准确率为 95%
      17 个模型上 Spearman 0.950 · Pearson 0.993
      与人类评分及文本指标对比
    type: terminal
    size: xl
    position:
      x: 1500
      'y': 600
edges:
  - from: sessions
    to: clips
    type: primary
  - from: clips
    to: action_seed
    type: primary
  - from: clips
    to: scenery_seed
    type: primary
  - from: action_seed
    to: action_qa
    type: primary
  - from: scenery_seed
    to: scenery_qa
    type: primary
  - from: action_qa
    to: corpus
    type: primary
  - from: scenery_qa
    to: corpus
    type: primary
  - from: corpus
    to: competencies
    type: primary
  - from: competencies
    to: eval_questions
    type: primary
  - from: eval_questions
    to: references
    type: primary
  - from: references
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
