meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LingoQA Build Process
  description: >-
    Paper-v4/ECCV construction of the Action and Scenery training branches, the held-out human evaluation set,
    independent Lingo-Judge training, and the exact repository scoring contract.
  legend: >-
    Solid arrows show paper-backed dataset or Judge construction. Dashed arrows show downstream candidate-model
    evaluation; the diamond connector injects the released Judge. The drift cards preserve unreconciled paper, README,
    and current-public-parquet counts instead of silently selecting one.
nodes:
  - id: sessions
    label: |-
      Recorded Driving Sessions
      Single Front-facing RGB Camera
      No LiDAR in Benchmark Input
    type: database
    size: xl
    position:
      x: 128
      'y': 248
  - id: clips
    label: |-
      4 s Scenario · 1 Hz
      5 Frames over 4 Seconds
      Faces + Plates Anonymised
    type: process
    size: xl
    position:
      x: 400
      'y': 248
  - id: train_branch
    label: Training Construction Branch?
    type: decision
    size: xl
    position:
      x: 800
      'y': 248
  - id: action_seed
    label: |-
