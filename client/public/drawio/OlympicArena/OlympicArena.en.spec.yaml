meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympicArena Build and Evaluation Process
  description: >-
    Paper-aligned construction of a bilingual, multidisciplinary, multimodal Olympiad benchmark with answer-level and
    process-level evaluation.
  legend: >-
    OlympicArena contains 11,163 problems from 62 competitions across 7 fields, including text-only and interleaved
    text-image inputs plus programming test cases.
nodes:
  - id: sources
    label: |-
      Collect Competition URLs
      Sixty-two Olympiad Competitions
      Seven Scientific Fields
      Publicly Available Test PDFs
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: pdfs
    label: |-
      Download Licensed Materials
      Problems and Available Solutions
      Collect CS Test Cases
      Respect Copyright Constraints
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: ocr
    label: |-
      Convert PDFs with Mathpix
      Transform into Markdown
      Preserve Interleaved Images
      Prepare Model-compatible Inputs
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: annotate
    label: |-
      Extract and Annotate Problems
      About Thirty STEM Students
      Use Open Annotation Interface
      Record Solutions and Metadata
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: validate
    label: |-
      Run Multi-step Validation
      Check Initial Annotations
      Correct Multimodal Extraction
      Verify Released Metadata
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: dedupe
    label: |-
      Deduplicate Within Competitions
      Model-embedding Similarity
      Find Same-year Repeats
      Remove Duplicate Problems
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: difficulty
    label: |-
      Label Cognitive Difficulty
      Knowledge Recall
      Concept Application
      Cognitive Reasoning
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: abilities
    label: |-
      Label Reasoning Abilities
      Eight Logical Categories
      Five Visual Categories
      GPT-4V Labels · Human Verification
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release OlympicArena
      11,163 Problems · 7 Fields
      7,571 Images · 13 Answer Types
      7,904 Problems with Solutions
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      Create Three Data Splits
      548 OlympicArena-ot
      638 OlympicArena-val with Steps
      Remaining Official Test Set
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: settings
    label: |-
      Run Three Zero-shot Settings
      Interleaved Multimodal
      Image-caption Replacement
      Text-only Baseline
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: answer_eval
    label: |-
      Perform Answer-level Evaluation
      Rule Matching for Fixed Answers
      Pass@k over CS Test Cases
      GPT-4V for Other Answer Types
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: process_eval
    label: |-
      Perform Process-level Evaluation
      Sample 96 Solved Problems
      GPT-4 Structures Solutions
      GPT-4V Scores Steps 0 or 1
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Cognitive Results
      Accuracy and CS Pass@1
      Step Scores · 83% Agreement
      Analyze Logic and Vision Skills
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
