meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympicArena 构建与评测流程
  description: 对齐论文构建双语、多学科、多模态奥林匹克基准，同时执行答案级与过程级评测。
  legend: OlympicArena 含 7 个领域、62 项竞赛的 11,163 道题，覆盖纯文本、图文交错输入及编程测试用例。
nodes:
  - id: sources
    label: |-
      收集竞赛网址
      覆盖 62 项奥林匹克竞赛
      涵盖七个科学领域
      获取公开试题 PDF
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: pdfs
    label: |-
      下载合规竞赛材料
      收集题目与已有解答
      补充计算机学科测试用例
      遵守版权与许可要求
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: ocr
    label: |-
      使用 Mathpix 转换 PDF
      生成 Markdown
      保留图文交错内容
      准备模型可用输入
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: annotate
    label: |-
      提取并标注题目
      约 30 名理工科学生参与
      使用开放标注界面
      记录解答与元信息
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: validate
    label: |-
      执行多步质量验证
      检查初始标注
      修正多模态提取错误
      核验发布元信息
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: dedupe
    label: |-
      在各竞赛内去重
      使用模型嵌入相似度
      发现同年重复试题
      移除重复问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: difficulty
    label: |-
      标注认知难度
      知识回忆
      概念应用
      认知推理
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: abilities
    label: |-
      标注推理能力
      八类逻辑能力
      五类视觉能力
      GPT-4V 标注并人工核验
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      发布 OlympicArena
      11,163 题 · 7 个领域
      7,571 张图 · 13 种答案
      7,904 题带解答
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      划分三套数据
      548 题 OlympicArena-ot
      638 题带步骤的验证集
      其余为官方测试集
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: settings
    label: |-
      运行三种零样本设置
      图文交错多模态
      图像描述替代
      纯文本基线
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: answer_eval
    label: |-
      执行答案级评测
      固定答案按规则匹配
      编程题以测试用例算 Pass@k
      其他答案由 GPT-4V 判定
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: process_eval
    label: |-
      执行过程级评测
      抽取 96 道带解答题
      GPT-4 结构化解题过程
      GPT-4V 将每步评为 0 或 1
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告认知推理结果
      准确率与编程 Pass@1
      步骤分数 · 83% 一致率
      分析逻辑与视觉能力
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: pdfs
    type: primary
  - from: pdfs
    to: ocr
    type: primary
  - from: ocr
    to: annotate
    type: primary
  - from: annotate
    to: validate
    type: primary
  - from: validate
    to: dedupe
    type: primary
  - from: dedupe
    to: difficulty
    type: primary
  - from: difficulty
    to: abilities
    type: primary
  - from: abilities
    to: release
    type: primary
  - from: release
    to: split
    type: primary
  - from: split
    to: settings
    type: primary
  - from: settings
    to: answer_eval
    type: primary
  - from: answer_eval
    to: process_eval
    type: primary
  - from: process_eval
    to: report
    type: primary
modules: []
