meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlympicArena 构建与评测流程
  description: 对齐论文与固定官方源，分别呈现双语多模态奥赛基准的构建、发布、答案级评测与过程级评测，并明确论文、公开数据与发布代码的边界。
  legend: >-
    固定证据为 arXiv:2406.12753v2、GAIR-NLP/OlympicArena 提交 99f6fa745ff8 与 Hugging Face 数据提交
    001189f4e78b；实线表示构建或评测主流程，虚线表示证据与发布差异。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv v2 · bc6064edc79e
      Git 99f6fa745ff8
      HF 001189f4e78b
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      定义奥赛范围
      七个学科 · 62 项竞赛
      英文与中文
      纯文本与图文交错
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: collect
    label: |-
      收集公开竞赛网址
      下载试题 PDF
      保留已有解答 · 计算机题测试用例
      遵守版权与许可要求
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: convert
    label: |-
      使用 Mathpix 转换
      从 PDF 生成 Markdown
      保留图文交错顺序
      准备模型可用内容
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: extract
    label: |-
      提取并标注题目
      约 30 名理工科学生 · Streamlit
      以网址保存图像
      每题存为 JSON
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: checks
    label: |-
      执行七项规则检查
      答案类型对照变量与等号
      单独保存单位 · 答案不得含图
      预览并检查每个图像链接
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: review
    label: |-
      分两阶段验证
      按预定义规则纠错
      由另一位标注员再次复核
      交叉检查并修正错误
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: dedupe
    label: |-
      在每项竞赛内去重
      比较模型嵌入
      发现同年重复试题
      移除重复问题
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: difficulty
    label: |-
      仅为验证集标注难度
      知识回忆 · 概念应用
      认知推理
      GPT-4V 标注 · 人工核验
    type: process
    size: xl
    position:
      x: 1940
      'y': 40
  - id: abilities
    label: |-
      标注推理能力
      八类逻辑 · 五类视觉
      GPT-4V 多标签标注
      人工核验
    type: process
    size: xl
    position:
      x: 2180
      'y': 40
  - id: release
    label: |-
      形成论文基准
      11,163 题 · 英文 7,054 · 中文 4,109
      7,571 张图 · 4,960 道含图题
      7,904 题有解答 · 13 类答案
    type: database
    size: xl
    position:
      x: 2420
      'y': 40
  - id: split_gate
    label: |-
      按评测用途划分
      论文定义三套数据
    type: decision
    size: xl
    position:
      x: 2420
      'y': 420
  - id: ot
    label: |-
      OlympicArena-ot
      548 道题
      其他类答案
      使用模型判分
    type: document
    size: xl
    position:
      x: 2140
      'y': 280
  - id: val
    label: |-
      OlympicArena-val
      638 道题
      带逐步解答
      用于调参或小规模测试
    type: document
    size: xl
    position:
      x: 2140
      'y': 420
  - id: test
    label: |-
      OlympicArena-test
      9,977 道题
      不公开答案
      官方正式测试集
    type: document
    size: xl
    position:
      x: 2140
      'y': 560
  - id: paper_settings
    label: |-
      论文评测全部 11,163 题
      多模态 · 图像描述 · 纯文本
      三种设置均为零样本
      由 InternVL-Chat-V1.5 生成描述
    type: process
    size: xl
    position:
      x: 1820
      'y': 420
  - id: prompt
    label: |-
      应用答案类型专属提示
      要求 LaTeX 与最终方框答案
      最多输出 2,048 个词元
      温度 0.0 · 计算机题 0.2
    type: process
    size: xl
    position:
      x: 1540
      'y': 420
  - id: eval_gate
    label: |-
      按答案类型分流
      固定答案 · 代码 · 其他
    type: decision
    size: xl
    position:
      x: 1260
      'y': 420
  - id: rule_eval
    label: |-
      评测固定答案类型
      论文：提取最终方框内容
      固定代码：无方框时保留整段回答
      数值 · SymPy · 区间 · 集合 · 元组
    type: process
    size: xl
    position:
      x: 980
      'y': 280
  - id: code_eval
    label: |-
      用测试用例评测代码
      论文：生成五次 · n = 5 · k = 1
      固定代码：丢弃提取失败的代码
      有效 n = 成功提取的代码段数 ≤ 5
      无偏 Pass@1 · 总分把非零结果计对
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: model_eval
    label: |-
      评测其他类答案
      GPT-4V 查看题目 · 标答 · 解答
      人工检查 100 题 · 一致率近 80%
      其他类约占基准 5%
    type: process
    size: xl
    position:
      x: 980
      'y': 560
  - id: process_eval
    label: |-
      执行过程级评测
      抽取 96 道带解答题
      GPT-4 重排为逐步过程
      GPT-4V 逐步评 0 或 1 · 题内取均值
      人工一致率 83%
    type: process
    size: xl
    position:
      x: 700
      'y': 680
  - id: report
    label: |-
      汇报基准结果
      总准确率 · 计算机题 Pass@1
      学科 · 语言 · 模态
      过程分数与能力分析
    type: terminal
    size: xl
    position:
      x: 700
      'y': 420
  - id: source_boundary
    label: |-
      公开快照边界
      HF：638 验证 + 9,977 测试 = 10,615 · 缺 548 道 OT
      数据卡论文栏误写：2406.16772
      本地代码仅评验证集
      测试需提交 · CC BY-NC-SA 4.0
    type: document
    size: xl
    position:
      x: 280
      'y': 420
