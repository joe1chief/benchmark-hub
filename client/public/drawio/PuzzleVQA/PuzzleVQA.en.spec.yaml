  title: PuzzleVQA Build and Evaluation Process
  description: >-
    Paper-aligned workflow for generating abstract visual-pattern puzzles from multimodal templates, attaching
    perception, induction, and deduction explanations, and evaluating multimodal models with accuracy.
  legend: >-
    PuzzleVQA contains 20 templates across 10 categories. Each template produces 100 unique instances, yielding 2,000
    test samples with image, question, options, answer, caption, pattern explanation, and deduction.
