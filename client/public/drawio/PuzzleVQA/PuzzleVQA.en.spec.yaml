meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PuzzleVQA Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of template-based PuzzleVQA generation, multimodal record creation, zero-shot and
    progressively guided evaluation, official answer extraction, and paper-versus-current release boundaries.
  legend: >-
    Solid arrows reproduce the PuzzleVQA paper and pinned implementation workflow. Dashed arrows mark fixed evidence,
    release drift, later-scope separation, and license boundaries.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2403.13315v3
      PDF a7cc824f4ed3
      Paper Code e974881fd10a
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: task_scope
    label: |-
      Define Abstract-pattern VQA
      Diagnose Visual Perception
      Induction and Deduction
      without Extensive World Knowledge
    type: document
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: concepts
    label: |-
      Four Fundamental Concepts
      Numbers · Colors
      Sizes · Shapes
    type: database
    size: xl
    position: { x: 500, y: 300 }
  - id: mode_taxonomy
    label: |-
      Compose Puzzle Modes
      Four Single-concept Categories
      Six Dual-concept Categories
    type: process
    size: xl
    position: { x: 740, y: 300 }
  - id: categories
    label: |-
      Ten Puzzle Categories
      200 Test Items per Category
      Single and Dual Concepts
    type: database
    size: xl
    position: { x: 980, y: 300 }
  - id: templates
    label: |-
      Design 20 Multimodal Templates
      Two Templates per Category
      Define Objects · Layout
      Pattern · Demonstrations · Query
    type: document
    size: xl
    position: { x: 1220, y: 300 }
    style: { fontSize: 9 }
  - id: define_layout
    label: |-
      Fix Layout + Abstract Pattern
      Straightforward Rules
      Avoid Unnecessary Complexity
      Ensure Programmatic Correctness
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: populate_objects
    label: |-
      Randomly Populate Objects
      Satisfy the Template Pattern
      Form Multiple Demonstrations
      of the Underlying Rule
    type: process
    size: xl
    position: { x: 1700, y: 300 }
    style: { fontSize: 9 }
  - id: construct_query
    label: |-
      Construct Missing-object Query
      Select One Target Answer
      Hide It with a Question Mark
    type: process
    size: xl
    position: { x: 1940, y: 300 }
  - id: make_choices
    label: |-
      Build Multiple-choice Options
      Four Choices Normally
      Three for Size Questions
      Heuristic Distractor Sampling
    type: process
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: render_image
    label: |-
      Render Puzzle with Python
      Pillow Draws Image Objects
      Augment Template and Objects
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: reasoning_text
    label: |-
      Generate Ground-truth Explanations
      Caption for Visual Perception
      Pattern Explanation for Induction
      Deduction toward Final Answer
    type: document
    size: xl
    position: { x: 2660, y: 300 }
    style: { fontSize: 9 }
  - id: record_schema
    label: |-
      Store Seven Record Fields
      image · question · options · answer
      caption · explanation · deduction
    type: database
    size: xl
    position: { x: 2900, y: 300 }
  - id: paper_dataset
    label: |-
      PuzzleVQA Paper Dataset
      20 Templates × 100 Unique Items
      20 JSONL Files · 2,000 Rows
      Test-only Benchmark
    type: database
    size: xl
    position: { x: 3140, y: 300 }
    style: { fontSize: 9 }
  - id: eval_input
    label: |-
      Evaluate Same 2,000 Puzzles
      Image + Question + Options
      Zero-shot Setting
    type: process
    size: xl
    position: { x: 3380, y: 300 }
  - id: prompt_gate
    label: |-
      Select Diagnostic Prompt
      Baseline or Progressive
      Ground-truth Guidance
    type: process
    size: xl
    position: { x: 3620, y: 300 }
  - id: zero_shot
    label: |-
      Zero-shot CoT Baseline
      Describe Image First
      Then Think Step by Step
    type: process
    size: xl
    position: { x: 4100, y: -100 }
  - id: guided_caption
    label: |-
      Guided Perception
      Prepend Ground-truth Caption
      before the Question
    type: process
    size: xl
    position: { x: 3860, y: 180 }
  - id: guided_induction
    label: |-
      Guided Perception + Induction
      Prepend Caption
      + Pattern Explanation
    type: process
    size: xl
    position: { x: 3860, y: 420 }
  - id: guided_deduction
    label: |-
      Guided Through Deduction
      Caption + Pattern + Deduction
      Stop before Revealing Answer
    type: process
    size: xl
    position: { x: 3860, y: 660 }
    style: { fontSize: 9 }
  - id: model_output
    label: |-
      Multimodal Model Output
      Greedy Decoding
      Reasoning + Candidate Choice
    type: process
    size: xl
    position: { x: 4100, y: 300 }
  - id: direct_regex
    label: |-
      Parse the Raw Response
      Prefer Last Parenthesized A–D
      Fallback to Last Bare A–D
    type: process
    size: xl
    position: { x: 4340, y: 300 }
  - id: extraction_prompt
    label: |-
      If Direct Extraction Fails
      Prompt Model with Output
      and Explicit Choice Trigger
    type: process
    size: xl
    position: { x: 4580, y: 560 }
  - id: fallback_regex
    label: |-
      Re-run the Same Parser
      Prefer Last Parenthesized A–D
      Fallback to Last Bare A–D
    type: process
    size: xl
    position: { x: 4820, y: 560 }
  - id: parsed_answer
    label: |-
      Map Letter to Option
      Produce One Predicted Answer
    type: process
    size: xl
    position: { x: 4820, y: 180 }
  - id: accuracy
    label: |-
      Report Accuracy
      Correct Predictions
      divided by 2,000 Items
    type: terminal
    size: xl
    position: { x: 5060, y: 300 }
  - id: paper_release
    label: |-
      Paper-matched Code Snapshot
      e974881fd10a
      Generation 4f1278484889
      Prompting e7be8ba6639b
      Main 6e0f5d9db945
    type: document
    size: xl
    position: { x: 3140, y: 900 }
    style: { fontSize: 9 }
  - id: current_release
    label: |-
      Current Repository Boundary
      9b3a074cca0c
      Later Repository Changes
      Must Not Rewrite Paper Contract
    type: document
    size: xl
    position: { x: 3380, y: 1140 }
    style: { fontSize: 9 }
  - id: scope_boundary
    label: |-
      Benchmark Scope Boundary
      This Flow Is PuzzleVQA Only
      AlgoPuzzleVQA Is a Separate
      Later Benchmark Track
    type: document
    size: xl
    position: { x: 3140, y: 1380 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      License-time Boundary
      Paper-matched Snapshot Has No LICENSE
      Current Snapshot Adds MIT
      Do Not Backdate the License File
    type: document
    size: xl
    position: { x: 3620, y: 1380 }
    style: { fontSize: 9 }
