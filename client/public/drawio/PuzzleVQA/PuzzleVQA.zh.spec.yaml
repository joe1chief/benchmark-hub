meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PuzzleVQA 构建与评测流程
  description: >-
    基于固定来源重建 PuzzleVQA 模板化生成、多模态记录构造、零样本与逐级提示评测、官方答案解析，
    并区分论文期与当前发布边界。
  legend: >-
    实线表示 PuzzleVQA 论文及固定实现流程；虚线表示固定证据、发布漂移、后续范围分离和许可边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2403.13315v3
      PDF a7cc824f4ed3
      论文期代码 e974881fd10a
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: task_scope
    label: |-
      定义抽象图案视觉问答
      诊断视觉感知
      归纳与演绎能力
      无需大量世界知识
    type: document
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: concepts
    label: |-
      四类基础概念
      数字 · 颜色
      大小 · 形状
    type: database
    size: xl
    position: { x: 500, y: 300 }
  - id: mode_taxonomy
    label: |-
      组合谜题模式
      四类单概念题
      六类双概念题
    type: process
    size: xl
    position: { x: 740, y: 300 }
  - id: categories
    label: |-
      十个谜题类别
      每类 200 条测试题
      同时覆盖单概念与双概念
    type: database
    size: xl
    position: { x: 980, y: 300 }
  - id: templates
    label: |-
      设计 20 个多模态模板
      每类别两个模板
      定义对象 · 布局
      规律 · 示例 · 问题
    type: document
    size: xl
    position: { x: 1220, y: 300 }
    style: { fontSize: 9 }
  - id: define_layout
    label: |-
      固定布局与抽象规律
      使用直接明确的规则
      避免不必要复杂度
      保证程序化正确性
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: populate_objects
    label: |-
      随机填充具体对象
      满足模板规律
      形成多组用于展示
      底层规律的示例
    type: process
    size: xl
    position: { x: 1700, y: 300 }
    style: { fontSize: 9 }
  - id: construct_query
    label: |-
      构造缺失对象问题
      选择一个目标答案
      用问号隐藏该对象
    type: process
    size: xl
    position: { x: 1940, y: 300 }
  - id: make_choices
    label: |-
      构造选择题选项
      通常为四个选项
      大小题为三个选项
      启发式采样干扰项
    type: process
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: render_image
    label: |-
      使用 Python 渲染谜题
      Pillow 绘制图像对象
      扩增模板与对象组合
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: reasoning_text
    label: |-
      生成标准推理解释
      图像描述对应视觉感知
      规律解释对应归纳
      推导步骤指向最终答案
    type: document
    size: xl
    position: { x: 2660, y: 300 }
    style: { fontSize: 9 }
  - id: record_schema
    label: |-
      保存七个记录字段
      图像 · 问题 · 选项 · 答案
      描述 · 规律解释 · 推导
    type: database
    size: xl
    position: { x: 2900, y: 300 }
  - id: paper_dataset
    label: |-
      PuzzleVQA 论文数据集
      20 个模板 × 各 100 条唯一题目
      20 个 JSONL 文件 · 共 2,000 行
      仅测试基准
    type: database
    size: xl
    position: { x: 3140, y: 300 }
    style: { fontSize: 9 }
  - id: eval_input
    label: |-
      评测同一批 2,000 道题
      输入图像 + 问题 + 选项
      零样本设置
    type: process
    size: xl
    position: { x: 3380, y: 300 }
  - id: prompt_gate
    label: |-
      选择诊断提示
      基线提示或逐级加入
      标准信息的提示
    type: process
    size: xl
    position: { x: 3620, y: 300 }
  - id: zero_shot
    label: |-
      零样本思维链基线
      先描述图像
      再逐步思考
    type: process
    size: xl
    position: { x: 4100, y: -100 }
  - id: guided_caption
    label: |-
      引导视觉感知
      在问题前加入
      标准图像描述
    type: process
    size: xl
    position: { x: 3860, y: 180 }
  - id: guided_induction
    label: |-
      引导感知与归纳
      加入图像描述
      + 标准规律解释
    type: process
    size: xl
    position: { x: 3860, y: 420 }
  - id: guided_deduction
    label: |-
      引导至演绎阶段
      图像描述 + 规律 + 推导
      在揭示答案前停止
    type: process
    size: xl
    position: { x: 3860, y: 660 }
    style: { fontSize: 9 }
  - id: model_output
    label: |-
      多模态模型输出
      贪心解码
      推理过程 + 候选选择
    type: process
    size: xl
    position: { x: 4100, y: 300 }
  - id: direct_regex
    label: |-
      解析模型原始响应
      优先最后一个带括号 A–D
      回退到最后一个裸 A–D
    type: process
    size: xl
    position: { x: 4340, y: 300 }
  - id: extraction_prompt
    label: |-
      直接解析失败时
      将原输出交给模型
      并附加明确选项触发语
    type: process
    size: xl
    position: { x: 4580, y: 560 }
  - id: fallback_regex
    label: |-
      对二次响应复用同一解析器
      优先最后一个带括号 A–D
      回退到最后一个裸 A–D
    type: process
    size: xl
    position: { x: 4820, y: 560 }
  - id: parsed_answer
    label: |-
      将字母映射为选项
      生成一个预测答案
    type: process
    size: xl
    position: { x: 4820, y: 180 }
  - id: accuracy
    label: |-
      报告准确率
      正确预测数
      除以 2,000 道题
    type: terminal
    size: xl
    position: { x: 5060, y: 300 }
  - id: paper_release
    label: |-
      论文匹配代码快照
      e974881fd10a
      生成代码 4f1278484889
      提示代码 e7be8ba6639b
      主程序 6e0f5d9db945
    type: document
    size: xl
    position: { x: 3140, y: 900 }
    style: { fontSize: 9 }
  - id: current_release
    label: |-
      当前仓库边界
      9b3a074cca0c
      后续仓库变更
      不得改写论文口径
    type: document
    size: xl
    position: { x: 3380, y: 1140 }
    style: { fontSize: 9 }
  - id: scope_boundary
    label: |-
      基准范围边界
      本图仅表示 PuzzleVQA
      AlgoPuzzleVQA 属于
      后续独立基准路线
    type: document
    size: xl
    position: { x: 3140, y: 1380 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      许可时间边界
      论文匹配快照没有 LICENSE
      当前快照后来加入 MIT
      不将许可文件追溯至论文期
    type: document
    size: xl
    position: { x: 3620, y: 1380 }
    style: { fontSize: 9 }
edges:
  - { from: source_evidence, to: task_scope, type: secondary, style: { dashed: true } }
  - { from: task_scope, to: concepts, type: primary }
  - { from: concepts, to: mode_taxonomy, type: primary }
  - { from: mode_taxonomy, to: categories, type: primary }
  - { from: categories, to: templates, type: primary }
  - { from: templates, to: define_layout, type: primary }
  - { from: define_layout, to: populate_objects, type: primary }
  - { from: populate_objects, to: construct_query, type: primary }
  - { from: construct_query, to: make_choices, type: primary }
  - { from: make_choices, to: render_image, type: primary }
  - { from: render_image, to: reasoning_text, type: primary }
  - { from: reasoning_text, to: record_schema, type: primary }
  - { from: record_schema, to: paper_dataset, type: primary }
  - { from: paper_dataset, to: eval_input, type: primary }
  - { from: eval_input, to: prompt_gate, type: primary }
  - from: prompt_gate
    to: zero_shot
    type: primary
    waypoints:
      - { x: 3740, y: -40 }
      - { x: 4020, y: -40 }
  - { from: prompt_gate, to: guided_caption, type: primary }
  - { from: prompt_gate, to: guided_induction, type: primary }
  - { from: prompt_gate, to: guided_deduction, type: primary }
  - { from: zero_shot, to: model_output, type: primary }
  - { from: guided_caption, to: model_output, type: primary }
  - { from: guided_induction, to: model_output, type: primary }
  - { from: guided_deduction, to: model_output, type: primary }
  - { from: model_output, to: direct_regex, type: primary }
  - { from: direct_regex, to: parsed_answer, type: primary }
  - { from: direct_regex, to: extraction_prompt, type: primary }
  - { from: extraction_prompt, to: fallback_regex, type: primary }
  - { from: fallback_regex, to: parsed_answer, type: primary }
  - { from: parsed_answer, to: accuracy, type: primary }
  - { from: paper_dataset, to: paper_release, type: secondary, style: { dashed: true } }
  - { from: paper_release, to: current_release, type: secondary, style: { dashed: true } }
  - { from: paper_release, to: scope_boundary, type: secondary, style: { dashed: true } }
  - { from: current_release, to: license_boundary, type: secondary, style: { dashed: true } }
modules: []
