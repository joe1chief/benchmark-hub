meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildJailbreak-Test 构建、原始ASR/RTA与OLMo 3指标
  description: >-
    WildTeaming 从 LMSYS-Chat-1M 与 WildChat 中挖掘105K个人类越狱策略实例，聚类为5.7K个策略簇，并过滤低风险和离题材料。WildJailbreak 随后构造四条训练分支：50,050条
    vanilla harmful、50,050条 vanilla benign、82,728条 adversarial harmful 与78,706条 adversarial benign，论文合计约写为262K。从同分布
    adversarial 构造中留出2,000条 harmful 和250条 benign prompts 组成 WildJailbreak-Test。原论文用HarmBench测试分类器计算harmful
    ASR，并用独立GPT-4拒答分类器计算benign RTA；两者均为越低越好，另报overall accuracy。OLMo 3 则以 top_p 0.95、temperature 0.7、三次运行均值和 WildGuard
    拒答标签，报告越高越好的 harmful拒答准确率（1-ASR）与 benign不拒答准确率，并可选取均值总分。
  legend: >-
    来源：WildJailbreak-Test has no independent paper. Construction and original evaluation are pinned to WildTeaming
    arXiv:2406.18510v1 (2024-06-26), Sections 3, 4.1, and 4.2; official repository
    https://github.com/allenai/wildteaming and official data https://huggingface.co/datasets/allenai/wildjailbreak. The
    2,000 harmful plus 250 benign held-out split is cross-checked against WildGuard arXiv:2406.18495v3 Section 4.4. The
    separate OLMo 3 operational layer is pinned to arXiv:2512.13961v2. Count/version tension: use 250 benign prompts,
    not the conflicting 210 found in older/site records; the four training branch counts sum to 261,534 and are rounded
    in the paper to 262K. Metric direction must remain separate: original ASR/RTA are lower-is-better, while OLMo 3
    reports inverted higher-is-better refusal/non-refusal accuracies.。实线箭头表示论文或官方资料明确支持的主流程。
