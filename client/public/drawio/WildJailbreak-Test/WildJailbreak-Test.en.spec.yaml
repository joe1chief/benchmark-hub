meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildJailbreak-Test Construction, Original ASR/RTA, and OLMo 3 Metrics
  description: >-
    WildTeaming mines 105K human-devised tactic instances from LMSYS-Chat-1M and WildChat, clusters them into 5.7K
    tactic groups, and prunes low-risk/off-topic material. WildJailbreak then builds four training branches: 50,050
    vanilla harmful, 50,050 vanilla benign, 82,728 adversarial harmful, and 78,706 adversarial benign items, reported in
    aggregate as 262K. A same-distribution adversarial holdout forms WildJailbreak-Test with 2,000 harmful and 250
    benign prompts. The original paper scores harmful ASR with the HarmBench test classifier and benign RTA with a
    separate GPT-4 refusal classifier, reporting both as lower-is-better plus overall accuracy. OLMo 3 instead uses
    top_p 0.95, temperature 0.7, three-run means, and WildGuard refusal labels to report harmful refusal accuracy
    (1-ASR) and benign non-refusal accuracy as higher-is-better, with an optional mean aggregate.
  legend: >-
    Source: WildJailbreak-Test has no independent paper. Construction and original evaluation are pinned to WildTeaming
    arXiv:2406.18510v1 (2024-06-26), Sections 3, 4.1, and 4.2; official repository
    https://github.com/allenai/wildteaming and official data https://huggingface.co/datasets/allenai/wildjailbreak. The
    2,000 harmful plus 250 benign held-out split is cross-checked against WildGuard arXiv:2406.18495v3 Section 4.4. The
    separate OLMo 3 operational layer is pinned to arXiv:2512.13961v2. Count/version tension: use 250 benign prompts,
    not the conflicting 210 found in older/site records; the four training branch counts sum to 261,534 and are rounded
    in the paper to 262K. Metric direction must remain separate: original ASR/RTA are lower-is-better, while OLMo 3
    reports inverted higher-is-better refusal/non-refusal accuracies.. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
