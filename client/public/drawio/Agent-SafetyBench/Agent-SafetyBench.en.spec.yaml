meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent-SafetyBench Build Process
  description: >-
    Paper-aligned construction, quality-control, scorer-training, and agent-evaluation workflow based on
    arXiv:2412.14470.
  legend: >-
    Solid arrows follow the published construction and evaluation pipeline; both legacy-data refinement and new-case
    augmentation feed the same validated benchmark.
nodes:
  - id: taxonomy
    label: |-
      Define Safety Taxonomy
      8 Risk Categories
      10 Failure Modes
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: legacy_sources
    label: |-
      Collect Existing Cases
      R-Judge • AgentDojo • GuardAgent
      ToolEmu • ToolSword • InjecAgent
    type: document
    size: xl
    position:
      x: 320
      'y': 40
  - id: environment_names
    label: |-
      Generate New Environment Names
      GPT-4o • Claude 3.5 • Gemini 1.5
      300 Candidate Environments
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: refine
    label: |-
      Refine Existing Data
      Clarify Failure Modes • Deduplicate
      Standardize Environments and Parameters
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: augment
    label: |-
      Generate Missing Cases
      Risk-Controlled Instructions
      Expected Risky Behaviors
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: merge
    label: |-
      Balance the Eight Categories
      876 Refined + 1,124 New Cases
      250 Cases per Risk Category
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: schema
    label: |-
      Encode Test-Case Schema
      Risk • Instruction or Dialog
      Environments • Failure Modes
    type: document
    size: xl
    position:
      x: 1160
      'y': 170
  - id: environments
    label: |-
      Implement Dynamic Environments
      JSON Tool Schemas + Python Classes
      Configurable Initialization Parameters
    type: process
    size: xl
    position:
      x: 1440
      'y': 170
  - id: precheck
    label: |-
      Manual Author Precheck
      Inspect Every Generated Case
      Repair Invalid Instructions and Risks
    type: user
    size: xl
    position:
      x: 1440
      'y': 500
  - id: automatic_checks
    label: |-
      Automated Validation
      Parse JSON and Execute Python
      Verify Tools and Environment Behavior
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: interaction_qc
    label: |-
      Postcheck and Cross-Validation
      4,000 Agent Interaction Records
      Manual Labels and Case Revisions
    type: user
    size: xl
    position:
      x: 880
      'y': 500
  - id: benchmark
    label: |-
      Release Agent-SafetyBench
      349 Dynamic Environments
      2,000 Validated Test Cases
    type: database
    size: xl
    position:
      x: 600
      'y': 500
  - id: scorer
    label: |-
      Train the Safety Scorer
      Fine-Tune Qwen2.5-7B on 4,000 Records
      91.5% Held-Out Accuracy
    type: process
    size: xl
    position:
      x: 600
      'y': 790
  - id: agent_eval
    label: |-
      Evaluate 16 Agents
      Dynamic Tool-Interaction Loops
      Preserve Complete Trajectories
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: report
    label: |-
      Report Safety Results
      Safe-Trajectory Ratio as Safety Score
      Risk and Failure-Mode Breakdowns
    type: terminal
    size: xl
    position:
      x: 320
      'y': 790
edges:
