  - from: environment_names
    to: augment
    type: primary
  - from: refine
    to: merge
    type: primary
  - from: augment
    to: merge
    type: primary
  - from: merge
    to: schema
    type: primary
  - from: schema
    to: environments
    type: primary
  - from: environments
    to: precheck
    type: primary
  - from: precheck
    to: automatic_checks
    type: primary
  - from: automatic_checks
    to: interaction_qc
    type: primary
  - from: interaction_qc
    to: benchmark
    type: primary
  - from: interaction_qc
    to: scorer
    type: data
  - from: benchmark
    to: agent_eval
    type: primary
  - from: agent_eval
    to: report
    type: primary
  - from: scorer
    to: report
    type: data
modules: []
