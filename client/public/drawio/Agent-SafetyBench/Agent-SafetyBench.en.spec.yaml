meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent-SafetyBench Build Process
  description: >-
    Paper-aligned benchmark construction, interaction quality control, scorer training, and trajectory-level evaluation
    from arXiv:2412.14470v2 Sections 3.2.2-3.3, Section 4.1, and Appendices F-G.
  legend: >-
    Manual postchecking of 4,000 interactions drives case and environment revisions before cross-validation and release;
    the resulting labels also train the scorer used on complete trajectories from the 16-agent evaluation.
nodes:
  - id: taxonomy
    label: |-
      Define Safety Taxonomy
      8 Risk Categories
      10 Failure Modes
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: legacy_sources
    label: |-
      Collect Existing Cases
      Six Agent-Safety Sources
      Normalize Risk Coverage
    type: document
    size: xl
    position:
      x: 320
      'y': 40
  - id: environment_names
    label: |-
      Generate Environments
      Three Frontier LLMs
      300 Candidate Names
    type: process
    size: xl
    position:
      x: 320
      'y': 320
  - id: refine
    label: |-
      Refine Existing Data
      Clarify Failure Modes
      Deduplicate and Standardize
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: augment
    label: |-
      Generate Missing Cases
      Risk-Controlled Instructions
      Expected Risky Behavior
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: merge
    label: |-
      Balance Risk Categories
      876 Refined + 1,124 New
      250 Cases per Category
    type: database
    size: xl
    position:
      x: 880
      'y': 180
  - id: schema
    label: |-
      Encode Case Schema
      Risk • Instruction • Environment
      Expected Failure Mode
    type: document
    size: xl
    position:
      x: 1160
      'y': 180
  - id: environments
    label: |-
      Implement Dynamic Environments
      JSON Tool Schemas
      Python Environment Classes
    type: process
    size: xl
    position:
      x: 1440
      'y': 180
  - id: precheck
    label: |-
      Perform Author Precheck
      Inspect Generated Cases
      Repair Invalid Behavior
    type: user
    size: xl
    position:
      x: 1440
      'y': 500
  - id: automatic_checks
    label: |-
      Run Automated Checks
      Parse JSON • Execute Python
      Verify Tools and State
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: cross_validation
    label: |-
      Cross-Validate Revisions
      200 Cases • 98% Reasonable
      200 Labels • 97.5% Consistent
    type: user
    size: xl
    position:
      x: 600
      'y': 500
  - id: benchmark
    label: |-
      Release Agent-SafetyBench
      349 Dynamic Environments
      2,000 Validated Cases
    type: database
    size: xl
    position:
      x: 320
      'y': 500
  - id: interaction_qc
    label: |-
      Postcheck 4,000 Interactions
      Manually Label Trajectories
      Revise Cases and Environments
    type: user
    size: xl
    position:
      x: 880
      'y': 500
  - id: scorer_train
    label: |-
      Train Safety Scorer
      Fine-Tune Qwen2.5-7B
      on Labeled Interactions
    type: process
    size: xl
    position:
      x: 880
      'y': 780
  - id: trained_scorer
    label: |-
      Validate and Freeze Scorer
      91.5% Held-Out Accuracy
      Trained Trajectory Classifier
    type: database
    size: xl
    position:
      x: 1160
      'y': 780
  - id: agent_eval
    label: |-
      Evaluate 16 Agents
      Dynamic Tool Interaction
      Same Validated Benchmark
    type: process
    size: xl
    position:
      x: 320
      'y': 780
  - id: trajectories
    label: |-
      Record Complete Trajectories
      Messages • Actions • Tool States
      Preserve Full Interaction
    type: document
    size: xl
    position:
      x: 320
      'y': 1080
  - id: score_trajectories
    label: |-
      Score Complete Trajectories
      Apply the Trained Scorer
      One Safety Decision Each
    type: process
    size: xl
    position:
      x: 1440
      'y': 1080
  - id: safety_label
    label: |-
      Classify Safe or Unsafe
      Preserve Risk Category
      Preserve Failure Mode
    type: process
    size: xl
    position:
      x: 1720
      'y': 1080
  - id: report
    label: |-
      Report Scores and Statistics
      Safe-Trajectory Ratio
      Risk and Failure Breakdowns
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 1080
