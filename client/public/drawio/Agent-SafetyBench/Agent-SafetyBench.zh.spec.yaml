meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent-SafetyBench 构建流程
  description: 基于 arXiv:2412.14470 对齐的基准构建、质量控制、评分器训练与 Agent 评测流程。
  legend: 实线箭头表示论文中的构建与评测主流程；已有数据精炼与新样本扩增共同汇入同一套验证后的基准。
nodes:
  - id: taxonomy
    label: |-
      定义安全分类体系
      8 类安全风险
      10 种失败模式
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: legacy_sources
    label: |-
      汇集已有样本
      R-Judge • AgentDojo • GuardAgent
      ToolEmu • ToolSword • InjecAgent
    type: document
    size: xl
    position:
      x: 320
      'y': 40
  - id: environment_names
    label: |-
      生成新环境名称
      GPT-4o • Claude 3.5 • Gemini 1.5
      300 个候选环境
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: refine
    label: |-
      精炼已有数据
      明确失败模式 • 去重
      统一环境与参数
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: augment
    label: |-
      生成缺失样本
      按风险类别控制指令
      标注预期危险行为
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: merge
    label: |-
      平衡八类风险
      876 个精炼样本 + 1,124 个新样本
      每类风险 250 个样本
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: schema
    label: |-
      编码测试样本结构
      风险 • 指令或对话
      环境 • 失败模式
    type: document
    size: xl
    position:
      x: 1160
      'y': 170
  - id: environments
    label: |-
      实现动态交互环境
      JSON 工具定义 + Python 类
      可配置初始化参数
    type: process
    size: xl
    position:
      x: 1440
      'y': 170
  - id: precheck
    label: |-
      作者人工预检
      逐条检查生成样本
      修复无效指令与风险归类
    type: user
    size: xl
    position:
      x: 1440
      'y': 500
  - id: automatic_checks
    label: |-
      自动化验证
      解析 JSON 并执行 Python
      验证工具与环境行为
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: interaction_qc
    label: |-
      后检与交叉验证
      4,000 条 Agent 交互记录
      人工标注并修订样本
    type: user
    size: xl
    position:
      x: 880
      'y': 500
  - id: benchmark
    label: |-
      发布 Agent-SafetyBench
      349 个动态环境
      2,000 个验证后测试样本
    type: database
    size: xl
    position:
      x: 600
      'y': 500
  - id: scorer
    label: |-
      训练安全评分器
      用 4,000 条记录微调 Qwen2.5-7B
      留出集准确率 91.5%
    type: process
    size: xl
    position:
      x: 600
      'y': 790
  - id: agent_eval
    label: |-
      评测 16 个 Agent
      动态工具交互循环
      保留完整轨迹
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: report
    label: |-
      汇报安全结果
      安全轨迹占比作为 Safety Score
      按风险与失败模式拆分
    type: terminal
    size: xl
    position:
      x: 320
      'y': 790
edges:
  - from: taxonomy
    to: legacy_sources
    type: primary
  - from: taxonomy
    to: environment_names
    type: data
  - from: legacy_sources
    to: refine
    type: primary
  - from: environment_names
    to: augment
    type: primary
  - from: refine
    to: merge
    type: primary
  - from: augment
    to: merge
    type: primary
  - from: merge
    to: schema
    type: primary
  - from: schema
    to: environments
    type: primary
  - from: environments
    to: precheck
    type: primary
  - from: precheck
    to: automatic_checks
    type: primary
  - from: automatic_checks
    to: interaction_qc
    type: primary
  - from: interaction_qc
    to: benchmark
    type: primary
  - from: interaction_qc
    to: scorer
    type: data
  - from: benchmark
    to: agent_eval
    type: primary
  - from: agent_eval
    to: report
    type: primary
  - from: scorer
    to: report
    type: data
modules: []
