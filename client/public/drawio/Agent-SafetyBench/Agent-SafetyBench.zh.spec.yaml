meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent-SafetyBench 构建流程
  description: 基于 arXiv:2412.14470 对齐的 Agent-SafetyBench 基准构建与安全评分流程。
  legend: 实线表示数据构建和 agent 评测主流程；虚线表示质量控制和 scorer 训练检查点。
nodes:
  - id: taxonomy
    label: |-
      安全分类体系
      8 类风险
      10 类失败模式
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: format
    label: |-
      测试用例 schema
      风险、指令/对话
      环境、失败模式
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: environments
    label: |-
      交互式环境
      JSON 工具 schema
      Python 环境类
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: refine
    label: |-
      精炼已有数据
      明确失败模式
      去重并标准化环境
    type: process
    size: xl
    position:
      x: 560
      'y': 70
  - id: augment
    label: |-
      数据增强
      300 个新环境名
      每类风险 250 个 case
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: quality
    label: |-
      质量控制
      人工预检
      脚本校验、后检、交叉验证
    type: decision
    size: xl
    position:
      x: 820
      'y': 160
  - id: benchmark
    label: |-
      基准发布
      349 个环境
      2,000 个测试用例
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: scorer
    label: |-
      Agent 评测
      工具交互记录
      finetuned scorer -> safety score
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: taxonomy
    to: format
    type: primary
  - from: taxonomy
    to: environments
    type: data
  - from: format
    to: refine
    type: primary
  - from: environments
    to: augment
    type: primary
  - from: refine
    to: quality
    type: primary
  - from: augment
    to: quality
    type: primary
  - from: quality
    to: refine
    type: optional
    label: 修订无效 case
  - from: quality
    to: benchmark
    type: primary
  - from: benchmark
    to: scorer
    type: primary
modules: []
