meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedSP1000 构建与评测流程
  description: 对齐论文与官方代码，展示把 MedEdPORTAL 标准化病人材料转为可执行、经泄漏审计的角色包、冻结专家 rubric、 闭环多智能体仿真及按病例宏平均评分的完整流程。
  legend: 基准通过“复制后删除”保留来源原文；来源没有提供的临床结果不得捏造，所有模型均按映射至六项 ACGME 能力的 同一组 24,602 条 rubric 评分。
nodes:
  - id: source
    label: |-
      检索 MedEdPORTAL
      “Simulation Case”与“Standardized Patient”
      1,073 篇文章
      22,244 个附件
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: filter
    label: |-
      按文本完整性筛选
      直接保留 931 篇可抽取文章
      人工审查 142 篇多模态文章
      保留 86 · 丢弃 56 · 共 1,017
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: markdown
    label: |-
      转为统一 Markdown
      Office 文档使用 MarkItDown
      DOC 与 PDF 使用 MinerU2 和 OCR
      生成 7,147 个 Markdown 文件
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: simulatability
    label: |-
      评估文本仿真可行性
      Codex 阅读文章全部文件
      抽取专科与紧急程度
      1,017 篇中保留 613 篇
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: scenarios
    label: |-
      拆分独立就诊场景
      每条元数据对应一个场景
      分配至 17 个临床专科
      得到 1,638 个可执行病例
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: packets
    label: |-
      划分四类角色包
      场景初始化 · 病人
      环境控制器 · 评估者
      复制后删除角色不可见段落
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: audit
    label: |-
      审计泄漏与一致性
      检查评分项语义等价信息
      检查病人扮演信息充分性
      迭代修正异常
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: rubrics
    label: |-
      解析冻结专家 Rubric
      逐字复制每条评分点
      不合并也不改写
      24,602 条映射至六项 ACGME 能力
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: validate
    label: |-
      由临床医生验证构建质量
      12 名医生 · 平均医学训练八年
      100 个抽样病例每例双人评分
      修正形成 100 例验证子集
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: dataset
    label: |-
      发布 MedSP1000
      由 613 篇文章形成 1,638 例
      17 个专科 · 六项能力
      24,602 条轨迹级 Rubric
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: interface
    label: |-
      初始化被评临床模型
      仅披露场景初始化信息
      输出 speak · actions · eos
      通过交互逐步获取信息
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: simulation
    label: |-
      运行闭环仿真
      病人智能体负责对话
      控制器处理行动与状态推进
      无来源结果标为不支持且绝不捏造
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: evaluator
    label: |-
      评估完整交互轨迹
      评估智能体接收冻结 Rubric
      每项二元判断完成或未完成
      在 100 个抽样运行上验证执行质量
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告 Rubric 完成率
      完成项数除以病例总项数
      对各病例等权宏平均
      按专科与能力拆分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: filter
    type: primary
  - from: filter
    to: markdown
    type: primary
  - from: markdown
    to: simulatability
    type: primary
  - from: simulatability
    to: scenarios
    type: primary
  - from: scenarios
    to: packets
    type: primary
  - from: packets
    to: audit
    type: primary
  - from: audit
    to: rubrics
    type: primary
  - from: rubrics
    to: validate
    type: primary
  - from: validate
    to: dataset
    type: primary
  - from: dataset
    to: interface
    type: primary
  - from: interface
    to: simulation
    type: primary
  - from: simulation
    to: evaluator
    type: primary
  - from: evaluator
    to: report
    type: primary
modules: []
