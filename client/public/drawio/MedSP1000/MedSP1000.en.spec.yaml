meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedSP1000 Build and Evaluation Process
  description: >-
    Paper- and official-code-aligned conversion of MedEdPORTAL standardized-patient materials into executable,
    leakage-audited role packets, frozen expert rubrics, closed-loop multi-agent simulations, and case-macro scoring.
  legend: >-
    The benchmark preserves source wording through copy-and-delete packet construction; unsupported clinical results are
    never fabricated, and each model is scored against the same 24,602 rubric items organized by six ACGME competencies.
nodes:
  - id: source
    label: |-
      Search MedEdPORTAL
      “Simulation Case” and
      “Standardized Patient”
      1,073 Articles
      22,244 Attachments
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: filter
    label: |-
      Filter for Text Completeness
      Keep 931 Text-extractable Articles
      Manually Review 142 Multimodal Articles
      Retain 86 · Discard 56 · Total 1,017
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: markdown
    label: |-
      Convert to Unified Markdown
      MarkItDown for Office Documents
      MinerU2 and OCR for DOC and PDF
      Produce 7,147 Markdown Files
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: simulatability
    label: |-
      Assess Text Simulatability
      Codex Reads All Article Files
      Extract Specialty and Urgency
      Keep 613 of 1,017 Articles
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: scenarios
    label: |-
      Split Independent Encounters
      One Metadata Entry per Scenario
      Assign 17 Clinical Specialties
      Yield 1,638 Executable Cases
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: packets
    label: |-
      Partition Four Role Packets
      Scenario Initialization · Patient
      Environment Controller · Evaluator
      Copy Then Delete Privileged Passages
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: audit
    label: |-
      Audit Leakage and Consistency
      Check Scoring-item Equivalents
      Check Patient Portrayal Sufficiency
      Iteratively Correct Anomalies
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: rubrics
    label: |-
      Parse Frozen Expert Rubrics
      Copy Every Scoring Point Verbatim
      Do Not Merge or Rewrite Items
      Map 24,602 Items to Six ACGME Skills
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: validate
    label: |-
      Clinician-validate Construction
      12 Clinicians · Mean Eight Training Years
      100 Sampled Cases · Two Ratings Each
      Correct a 100-case Verified Subset
    type: user
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 420
  - id: dataset
    label: |-
      Release MedSP1000
      1,638 Cases from 613 Articles
      17 Specialties · Six Competencies
      24,602 Trajectory-level Rubrics
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: interface
    label: |-
      Initialize the Assessed Clinician
      Reveal Only Scenario Initialization
      Output speak · actions · eos
      Acquire Information Progressively
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: simulation
    label: |-
      Run Closed-loop Simulation
      Patient Agent Handles Dialogue
      Controller Resolves Actions and States
      Mark Unsupported Results
      Never Invent
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: evaluator
    label: |-
      Score the Full Trajectory
      Evaluator Receives Frozen Rubrics
      Binary Completed or Not per Item
      Runtime Validation · 100 Runs
      Two Ratings Each
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Rubric Completion Rates
      Overall and Specialty · Case-macro
      Competency Definition Conflicts in Paper
      §2.1.3 Item-micro
      §4.3 Eq. 3 Case-macro
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
  - id: release_boundary
    label: |-
      Fixed-release Count Boundary
      HF scenario_index · 1,639 Paths
      Code · 1,638 Rubric Files
      Four Empty · 1,634 Parseable
    type: document
    size: xl
    position:
      x: 980
      'y': 760
  - id: protocol_boundary
    label: |-
      Runtime Protocol Boundary
      Paper · No Turn Cap · Temperature 0
      Repository Example · 12 Turns
      Default API Path Leaves
      Temperature Unset
    type: document
    size: xl
    position:
      x: 500
      'y': 760
  - id: metric_boundary
    label: |-
      Competency Aggregation Conflict
      §2.1.3 Pools Rubric Items · Micro
      §4.3 Eq. 3
      Averages Case Ratios · Macro
      Paper Does Not Reconcile the Definitions
    type: document
    size: xl
    position:
      x: 20
      'y': 760
  - id: rights_boundary
    label: |-
      Rights-label Conflict
      Paper Data CC BY-NC-SA
      Code CC BY-SA
      HF Card + Repository LICENSE Say MIT
      Original MedEdPORTAL Terms
      Still Apply
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 1220
      'y': 760
