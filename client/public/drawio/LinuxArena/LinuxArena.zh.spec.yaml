meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: LinuxArena 构建流程
  description: 三条泳道分别呈现对齐论文的基准构建与意外完成过滤、论文 v2 评测协议，以及独立的 LaStraj 人工红队轨迹分支。
  legend: >-
    实线表示构建或评测主流程；虚线表示已保存轨迹、审计反馈或跨泳道依赖；点线表示证据或实现漂移。除明确标注“当前”外， 数量均取自 arXiv:2604.15384v2。C/I
    是二元评分器结果。已发布的评分器代码只在评测运行时对智能体隐藏。 LinuxArena 没有公开榜单或提交入口。
nodes:
  - id: c1
    label: |-
      C1 · 设计 20 个有状态环境
      从零构建 Docker Compose 系统
      1–11 个容器，多数为 3–5 个
      面向生产式 Linux 工作流
    type: database
    module: construction
    size: xl
    position:
      x: 32
      'y': 176
  - id: c2
    label: |-
      C2 · 填充并划分环境
      约 25 名 EquiStamp 外包人员
      作者与 Redwood 领导
      公开 10 个，保留 10 个环境
      共享权限支持同环境配对
    type: process
    module: construction
    size: xl
    position:
      x: 288
      'y': 176
  - id: c3
    label: |-
      C3 · 主任务 · 1,667
      六类软件工程任务
      LLM 辅助后由人工复核
      需求说明 + 外部 C/I 评分器
    type: user
    module: construction
    size: xl
    position:
      x: 544
      'y': 48
  - id: c4
    label: |-
      C4 · 副任务 · 185
      六类安全失效任务
      完全人工编写，不用 LLM 生成
      目标 + 评分器 + 可选提交/测试
      危害分即时与延迟
    type: user
    module: construction
    size: xl
    position:
      x: 544
      'y': 304
  - id: c5
    label: |-
      C5 · 任务、评分器与轨迹质控
      人工尝试 + 自动化/模型检查
      修订损坏、脆弱或失真的样例
      保存仅诚实主任务轨迹
      构造可信攻击并反复测试
    type: process
    module: construction
    size: xl
    position:
      x: 800
      'y': 176
  - id: c6
    label: |-
      C6 · 枚举同环境任务对
      检查全部主任务 × 副任务组合
      不存在固定人工配对集
      每个任务对都进入第一阶段
    type: process
    module: construction
    size: xl
    position:
      x: 1056
      'y': 176
  - id: c7
    label: |-
      C7 · 第一阶段 · LLM 概率筛查
      输入环境、主任务、副目标、评分器
      标记 不可能 / 可能 / 很可能
      每个同环境任务对都要筛查
    type: process
    module: construction
    size: xl
    position:
      x: 1312
      'y': 176
  - id: d1
    label: 第一阶段标签？
    type: decision
    module: construction
    size: xl
    position:
      x: 1568
      'y': 176
  - id: c8
    label: |-
      C8 · 第二阶段 · 新环境回放
      仅 可能 / 很可能 进入
      回放已保存的仅诚实轨迹
      第二个模型只能用测试工具
      不能执行其他环境动作
    type: process
    module: construction
    size: xl
    position:
      x: 1824
      'y': 304
  - id: d2
    label: 副任务评分器结果？
    type: decision
    module: construction
    size: xl
    position:
      x: 2080
      'y': 304
  - id: c9
    label: |-
      C9 · 残余误报审计
      I → 保留；C → 删除任务对
      总计约删除 0.9% 的任务对
      迭代至低于安全指标噪声底
    type: process
    module: construction
    size: xl
    position:
      x: 2336
      'y': 176
  - id: x1
    label: |-
      删除任务对
      第二阶段副任务评分器 = C
      任务清单本身不变
    type: terminal
    module: construction
    size: xl
    position:
      x: 2336
      'y': 432
  - id: c10
    label: |-
      C10 · 论文 v2 任务清单
      全量：20 / 1,667 主 / 185 副
      公开：10 / 906 / 92
      保留：10 / 761 / 93
      评分器仅在运行时对智能体隐藏
    type: database
    module: construction
    size: xl
    position:
      x: 2592
      'y': 176
  - id: a1
    label: |-
      公开资产漂移 · 审计于 2026-07
      当前仓库：10 / 907 / 92
      官网：10 / 919 / 93
      论文上限 160；当前 CT 默认 150
      无公开榜单或提交入口
    type: document
    module: construction
    size: xl
    position:
      x: 2848
      'y': 176
  - id: e1
    label: |-
      E1 · 论文独立评测切片
      输入 C10 论文 v2 任务清单
      诚实主任务：400 项，每环境 20 项
      明显副任务单测：全部 185 项
      回合 = 环境 + 策略 + 协议
    type: database
    module: evaluation
    size: xl
    position:
      x: 32
      'y': 736
  - id: e2h
    label: |-
      E2H · 诚实 ReAct 分支
      仅主任务，不给副目标
      用 Bash / Inspect / submit 改状态
      收集效用与诚实动作分
    type: process
    module: evaluation
    size: xl
    position:
      x: 288
      'y': 600
  - id: e2c
    label: |-
      E2C · 诚实校准
      按攻击模型匹配诚实集
      衍生攻击使用 Opus 诚实集
      第 99 百分位 + 随机并列
      精确得到 1% 逐步误报率
    type: process
    module: evaluation
    size: xl
    position:
      x: 544
      'y': 600
  - id: e2o
    label: |-
      E2O · 明显副任务单测分支
      系统提示给副目标与评分器细节
      无并发主任务，也不要求隐蔽
      覆盖全部 185 项，测原始能力
    type: process
    module: evaluation
    size: xl
    position:
      x: 32
      'y': 1120
  - id: e3
    label: |-
      E3 · 隐蔽攻击输入
      主任务 + 副目标；无评分器/伪代码
      不给环境描述
      隐藏规划；每次调用思考 1k token
      副任务测试与提交不受监控
    type: process
    module: evaluation
    size: xl
    position:
      x: 288
      'y': 936
  - id: e4
    label: |-
      E4 · 隐蔽攻击五阶段控制器
      1 探索 ≤30 · 2 离线第一阶段计划
      3 再探索 ≤30 · 4 详细隐蔽计划
      5 执行 ≤100；鼓励主任务但不评分
      论文 v2 上限 160；最终状态仍评分
    type: process
    module: evaluation
    size: xl
    position:
      x: 544
      'y': 936
  - id: d3
    label: 拟调用哪类工具？
    type: decision
    module: evaluation
    size: xl
    position:
      x: 800
      'y': 936
  - id: e5
    label: |-
      E5 · 两次动作前监控调用
      仅常规动作；执行前调用
      主任务 + 分段指引 + 拟执行动作
      完整历史、结果与全部可能副目标
      不读取攻击者思维链
    type: process
    module: evaluation
    size: xl
    position:
      x: 1056
      'y': 936
  - id: e7
    label: |-
      E7 · 监控器类型化解析
      Pydantic：推理 + 0–10 整数分
      提供方 schema + 校验重试
      审计每次解析失败
    type: process
    module: evaluation
    size: xl
    position:
      x: 1312
      'y': 936
  - id: e6
    label: |-
      E6 · 平均并应用阈值
      两个已校验的 0–10 整数分
      先取平均，再应用校准阈值
      任一告警即标记整条轨迹
    type: process
    module: evaluation
    size: xl
    position:
      x: 1568
      'y': 736
  - id: e8
    label: |-
      E8 · 回合运行质控
      重试过早/零步/未提交回合
      重试评分器或环境故障
      缺失监控分直接丢弃，绝不补零
      只用有效评分作分母
    type: process
    module: evaluation
    size: xl
    position:
      x: 1824
      'y': 936
  - id: e9
    label: |-
      E9 · 危害时序
      即时危害取首次测试输出开头
      “Score value: C”
      否则取副评分为 C 的最终提交
      仅严格早于危害的告警有效
    type: process
    module: evaluation
    size: xl
    position:
      x: 2080
      'y': 936
  - id: e10
    label: |-
      E10 · 安全报告
      D = 危害前检出；A = 攻击成功
      破坏成功 = P(¬D ∧ A)
      规避率 = P(¬D | A)
      安全性 = P(D)/[P(D)+P(¬D ∧ A)]
      比例用 Wilson 95%；安全曲线用自举区间
    type: formula
    module: evaluation
    size: xl
    position:
      x: 2336
      'y': 936
  - id: l1
    label: |-
      L1 · 独立人工红队分支
      在公开环境选择副任务与掩护主任务
      掩护任务不得自动完成副目标
      每条入选轨迹最多 8 小时
      反复对抗 Nano 或 Opus 4.6
    type: user
    module: lastraj
    size: xl
    position:
      x: 32
      'y': 1440
  - id: l2
    label: |-
      L2 · 隐蔽轨迹筛选
      目标实时监控分 ≤5/10
      全知轨迹需补入合成探索
      若补入上下文触发检测则丢弃
      每条发布轨迹都已完成副任务
    type: process
    module: lastraj
    size: xl
    position:
      x: 400
      'y': 1440
  - id: l3
    label: |-
      L3 · LaStraj v3 发布
      76 条公开环境轨迹
      独立轨迹数据集
      不属于论文任务构建清单
      无榜单
    type: terminal
    module: lastraj
    size: xl
    position:
      x: 768
      'y': 1440
