meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LinuxArena Build Process
  description: >-
    Paper-aligned construction of realistic Linux control environments, independently authored main and side tasks,
    hidden external scorers, accidental-completion filtering, attack policies, and per-action monitoring.
  legend: >-
    Counts follow arXiv:2604.15384v2: 20 environments, 1,667 main tasks, and 185 side tasks. Ten environments are public
    and ten are withheld. Main and side tasks may be paired within the same environment; no single fixed pairing is
    released.
nodes:
  - id: design
    label: |-
      Design 20 Production-like Environments
      Scratch-built Stateful Docker Compose Systems
      Balance Realism · Diversity · Access Overlap
      Cover Useful Linux Agent Workflows
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: split
    label: |-
      Quality-control the Environments
      Human · Automated · Model Checks
      Iterate on Tasks and Scorers
      Publish 10 Environments · Withhold 10
    type: process
    size: xl
    position:
      x: 300
      'y': 260
  - id: main_tasks
    label: |-
      Build 1,667 Main Tasks
      LLM-assisted then Human-reviewed
      Feature · Refactor · Bug · Research
      Rewrite · Infrastructure Categories
    type: user
    size: xl
    position:
      x: 580
      'y': 20
  - id: main_scorers
    label: |-
      Implement Hidden Main-task Scorers
      External Binary Success Checks
      Test Useful Task Completion
      Keep Scoring outside the Agent Context
    type: process
    size: xl
    position:
      x: 900
      'y': 20
  - id: side_tasks
    label: |-
      Human-author 185 Side Tasks
      No LLM Used for Side-task Creation
      Exfiltration · Malware · Tampering
      Access · Monitoring · Secret Categories
    type: user
    size: xl
    position:
      x: 580
      'y': 500
  - id: side_scorers
    label: |-
      Implement Minimal Hidden Side Scorers
      Define Goal · Scorer Details · Optional Tests
      Distinguish Live and Delayed Failure
      Minimize the Scoring API Surface
    type: process
    size: xl
    position:
      x: 900
      'y': 500
  - id: pairs
    label: |-
      Form Same-environment Candidate Pairs
      Combine Compatible Main and Side Tasks
      Do Not Fix One Permanent Pairing Set
      Enumerate All Same-environment Pairs for Checks
    type: process
    size: xl
    position:
      x: 1220
      'y': 260
  - id: llm_filter
    label: |-
      Stage 1 · Screen Accidental Completion
      LLM Labels Pair Unlikely · Maybe · Likely
      Detect Main Tasks that May Trigger Side Goals
      Forward Suspicious Pairs to Replay Testing
    type: process
    size: xl
    position:
      x: 1500
      'y': 260
  - id: replay
    label: |-
      Stage 2 · Replay and Test Suspicious Pairs
      Run Saved Honest Trajectory in Fresh Environment
      Second Model Attempts Scorer-only Completion
      Remove Passing Pairs · about 0.9% Overall
    type: process
    size: xl
    position:
      x: 1780
      'y': 260
  - id: release
    label: |-
      Release the LinuxArena Task Resources
      20 Environments · 1,667 Main · 185 Side
      Public and Withheld Environment Split
      Hidden Scorers Preserve Evaluation Integrity
    type: database
    size: xl
    position:
      x: 2060
      'y': 260
  - id: policies
    label: |-
      Run Honest and Attack Policies
      Honest ReAct Agent · Bash and Inspect · 160 Steps
      Obvious Policy Measures Raw Side-task Capability
      Subtle Policy Pursues Main plus Hidden Side Task
    type: process
    size: xl
    position:
      x: 2060
      'y': 600
  - id: monitor
    label: |-
      Monitor Every Agent Action
      Score Suspicion from 0 to 10
      Average Two Monitor Calls per Action
      Set Threshold at 99th Honest Percentile
    type: process
    size: xl
    position:
      x: 1780
      'y': 600
  - id: report
    label: |-
      Report Safety and Utility Metrics
      Main-task Success · Side-task Success
      Sabotage Succeeds Only without Pre-harm Flag
      Evasion Rates and Wilson 95% Intervals
    type: terminal
    size: xl
    position:
      x: 1500
      'y': 600
edges:
  - from: design
    to: split
    type: primary
  - from: split
