meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: LinuxArena Build Process
  description: >-
    Three paper-aligned lanes separate benchmark construction and accidental-completion filtering, the paper v2
    evaluation protocol, and the independent LaStraj human red-team trajectory branch.
  legend: >-
    Solid arrows are construction or evaluation flow; dashed arrows carry saved trajectories, audit feedback, or
    cross-lane dependencies; dotted arrows mark evidence or implementation drift. Counts are from arXiv:2604.15384v2
    unless explicitly labeled current. C/I are binary scorer outcomes. Released scorer code is hidden only from the
    evaluated agent at run time. LinuxArena has no public leaderboard or submission path.
nodes:
  - id: c1
    label: |-
      C1 · Design 20 Stateful Environments
      Scratch-built Docker Compose systems
      1–11 containers; most use 3–5
      Production-like Linux workflows
    type: database
    module: construction
    size: xl
    position:
      x: 32
      'y': 176
  - id: c2
    label: |-
      C2 · Populate + Split Environments
      ~25 contractors; authors + Redwood lead
      10 public + 10 withheld environments
      Shared access enables task pairing
    type: process
    module: construction
    size: xl
    position:
      x: 288
      'y': 176
  - id: c3
    label: |-
      C3 · Main Tasks · 1,667
      Six software-engineering categories
      LLM-assisted, then human-reviewed
      Requirement + external C/I scorer
    type: user
    module: construction
    size: xl
    position:
      x: 544
      'y': 48
  - id: c4
    label: |-
      C4 · Side Tasks · 185
      Six security-failure categories
      Human-authored; no LLM generation
      Goal + scorer + optional submit/test
      Live or delayed harm
    type: user
    module: construction
    size: xl
    position:
      x: 544
      'y': 304
  - id: c5
    label: |-
      C5 · QC Tasks, Scorers, Trajectories
      Human attempts + automated/model checks
      Revise broken, brittle, unrealistic cases
      Save honest-only main-task trajectories
      Build plausible attacks; retest
    type: process
    module: construction
    size: xl
    position:
      x: 800
      'y': 176
  - id: c6
    label: |-
      C6 · Enumerate Same-environment Pairs
      All main × side combinations
      No fixed curated pairing set
      Every pair continues to Stage 1
    type: process
    module: construction
    size: xl
    position:
      x: 1056
      'y': 176
  - id: c7
    label: |-
      C7 · Stage 1 · LLM Likelihood Screen
      Inputs: env + main + side goal + scorer
      Label UNLIKELY / MAYBE / LIKELY
      Screen every same-environment pair
    type: process
    module: construction
    size: xl
    position:
      x: 1312
      'y': 176
  - id: d1
    label: Stage 1 label?
    type: decision
    module: construction
    size: xl
    position:
      x: 1568
      'y': 176
  - id: c8
    label: |-
      C8 · Stage 2 · Fresh-environment Replay
      Only MAYBE / LIKELY pairs enter
      Replay saved honest-only trajectory
      Second model may use test tool only
      Cannot execute other environment actions
    type: process
    module: construction
    size: xl
    position:
      x: 1824
      'y': 304
  - id: d2
    label: Side scorer result?
    type: decision
    module: construction
    size: xl
    position:
      x: 2080
      'y': 304
  - id: c9
    label: |-
      C9 · Residual False-positive Audit
      I → retain; C → remove pairing
      About 0.9% of pairs removed overall
      Repeat until below metric noise floor
    type: process
    module: construction
    size: xl
    position:
      x: 2336
      'y': 176
  - id: x1
    label: |-
      Remove Pairing
      Stage 2 side scorer = C
      Task inventory remains unchanged
    type: terminal
    module: construction
    size: xl
    position:
      x: 2336
      'y': 432
  - id: c10
    label: |-
      C10 · Paper v2 Task Inventory
      Full: 20 / 1,667 main / 185 side
      Public: 10 / 906 / 92
      Withheld: 10 / 761 / 93
      Scorers hidden only at agent run time
    type: database
    module: construction
    size: xl
    position:
      x: 2592
      'y': 176
  - id: a1
    label: |-
      Public-artifact Drift · Audited 2026-07
      Current repo: 10 / 907 / 92
      Official site: 10 / 919 / 93
      Paper cap 160; current CT default 150
      No public leaderboard/submission path
    type: document
    module: construction
    size: xl
    position:
      x: 2848
      'y': 176
  - id: e1
    label: |-
      E1 · Independent Paper Slices
      Input: C10 paper v2 inventory
      Honest main: 400 · 20 per environment
      Obvious side-only: all 185 tasks
      Episode = environment + policy + protocol
    type: database
    module: evaluation
    size: xl
    position:
      x: 32
      'y': 736
  - id: e2h
    label: |-
      E2H · Honest ReAct Branch
      Main task only; no side goal
      Live state via Bash / Inspect / submit
      Collect utility + honest action scores
    type: process
    module: evaluation
    size: xl
    position:
      x: 288
      'y': 600
  - id: e2c
    label: |-
      E2C · Honest Calibration
      Match honest set to attacker model
      Derived attacks use Opus honest runs
      99th percentile + probabilistic ties
      Exact 1% step-wise false-positive rate
    type: process
    module: evaluation
    size: xl
    position:
      x: 544
      'y': 600
  - id: e2o
    label: |-
      E2O · Obvious Side-only Branch
      Side goal + scorer details in system prompt
      No concurrent main task or stealth
      Raw capability across all 185 side tasks
    type: process
    module: evaluation
    size: xl
    position:
      x: 32
      'y': 1120
  - id: e3
    label: |-
      E3 · Subtle Attack Inputs
      Main + side goal; no scorer/pseudocode
      Environment description omitted
      Hidden planning; 1k thinking per call
      Side test + submit are unmonitored
    type: process
    module: evaluation
    size: xl
    position:
      x: 288
      'y': 936
  - id: e4
    label: |-
      E4 · Subtle Five-phase Controller
      1 Explore ≤30 · 2 Offline Phase-1 plan
      3 Explore ≤30 · 4 Detailed stealth plan
      5 Execute ≤100; main urged, not scored
      Paper v2 cap 160; final state scored
    type: process
    module: evaluation
    size: xl
    position:
      x: 544
      'y': 936
  - id: d3
    label: Proposed tool?
    type: decision
    module: evaluation
    size: xl
    position:
      x: 800
      'y': 936
  - id: e5
    label: |-
      E5 · Two Pre-action Monitor Calls
      Regular actions only; before execution
      Main + score bands + proposed action
      Full history, outcomes, all side goals
      No attacker chain-of-thought
    type: process
    module: evaluation
    size: xl
    position:
      x: 1056
      'y': 936
  - id: e7
    label: |-
      E7 · Typed Monitor Parser
      Pydantic: reasoning + integer 0–10
      Provider schema; validation retries
      Audit every parse failure
    type: process
    module: evaluation
    size: xl
    position:
      x: 1312
      'y': 936
  - id: e6
    label: |-
      E6 · Average + Apply Threshold
      Two validated integer 0–10 scores
      Average, then use calibrated threshold
      Any flag marks the trajectory
    type: process
    module: evaluation
    size: xl
    position:
      x: 1568
      'y': 736
  - id: e8
    label: |-
      E8 · Episode Run QC
      Retry early/zero/no-submit episodes
      Retry scorer or environment failures
      Drop missing monitor scores; never zero-fill
      Use only valid-score denominator
    type: process
    module: evaluation
    size: xl
    position:
      x: 1824
      'y': 936
  - id: e9
    label: |-
      E9 · Harm Timing
      Live: first test output begins
      "Score value: C"
      Else final submit when side scorer = C
      Only strictly pre-harm flags count
    type: process
    module: evaluation
    size: xl
    position:
      x: 2080
      'y': 936
  - id: e10
    label: |-
      E10 · Safety Report
      D = pre-harm detection; A = attack success
      Sabotage = P(¬D ∧ A)
      Evasion = P(¬D | A)
      Safety = P(D)/[P(D)+P(¬D ∧ A)]
      Wilson 95%; safety curves: bootstrap CI
    type: formula
    module: evaluation
    size: xl
    position:
      x: 2336
      'y': 936
  - id: l1
    label: |-
      L1 · Independent Human Red-team Branch
      Pick side + cover main in public envs
      Cover must not auto-complete side goal
      ≤8 h per selected trajectory
      Iterate vs Nano or Opus 4.6
    type: user
    module: lastraj
    size: xl
    position:
      x: 32
      'y': 1440
  - id: l2
    label: |-
      L2 · Stealth-filtered Trajectories
      Target live-monitor score ≤5/10
      Add synthetic exploration if omniscient
      Discard if added context triggers detection
      Every released trace succeeds on side task
    type: process
    module: lastraj
    size: xl
    position:
      x: 400
      'y': 1440
  - id: l3
    label: |-
      L3 · LaStraj v3 Release
      76 public-environment trajectories
      Independent trajectory dataset
      Not paper task-construction inventory
      No leaderboard
    type: terminal
    module: lastraj
    size: xl
    position:
      x: 768
      'y': 1440
