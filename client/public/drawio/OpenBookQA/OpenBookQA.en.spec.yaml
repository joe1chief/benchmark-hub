meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenBookQA Build Process
  description: >-
    Paper-aligned OpenBookQA workflow: 2,287 central WorldTree facts are filtered to a 1,326-fact open book, crowd
    workers combine each core fact with common knowledge to write four-choice questions, automated hardness and
    five-person answerability gates plus expert review produce 5,957 train/dev/test questions.
  legend: >-
    Solid arrows show fact curation, crowd question writing, automated and human filtering, split assembly, and
    evaluation.
nodes:
  - id: worldtree
    label: |-
      WorldTree Facts
      2,287 Marked Central
    type: database
    size: large
    position:
      x: 40
      'y': 200
  - id: core_book
    label: |-
      Generality Filter
      Open Book F: 1,326
      Elementary Science Facts
    type: database
    size: xl
    position:
      x: 280
      'y': 200
  - id: combine
    label: |-
      Crowd Worker Receives f
      Adds Common Fact k
      Derives New Assertion s
    type: user
    size: xl
    position:
      x: 540
      'y': 200
  - id: question
    label: |-
      Write Question + Answer
      Add 3 Incorrect Choices
      One Unique Correct Choice
    type: document
    size: xl
    position:
      x: 800
      'y': 200
  - id: basic_checks
    label: |-
      Automatic Basic Checks
      Exactly 4 Choices / No Negation
      Uniform Choice Length
    type: process
    size: xl
    position:
      x: 1060
      'y': 200
  - id: hardness
    label: |-
      Automated Hardness Gate
      IR + Word-association Solvers Fail
      Top-3 Retrieved Text Insufficient
      Easy → Edit and Retry
    type: process
    size: xl
    position:
      x: 1320
      'y': 200
  - id: answerability
    label: |-
      Lay Answerability Gate
      5 New Crowd Workers
      Keep if ≥4 / 5 Correct
    type: user
    size: xl
    position:
      x: 1580
      'y': 200
  - id: shuffle
    label: |-
      Shuffle Answer Choices
      Associate Core Fact f
      Retain Noisy Extra Fact k
    type: process
    size: xl
    position:
      x: 1840
      'y': 200
  - id: expert
    label: |-
      In-house Expert Filter
      Higher-quality Dev + Test
    type: user
    size: large
    position:
      x: 2100
      'y': 200
  - id: dataset
    label: |-
      OpenBookQA: 5,957
      Train 4,957 / Dev 500 / Test 500
      Train + Dev Include Core Fact f
    type: database
    size: xl
    position:
      x: 2340
      'y': 200
  - id: score
    label: |-
      Open-book 4-choice QA
      Combine f + Common Knowledge
      Accuracy (1/k for k-way Tie)
    type: terminal
    size: xl
    position:
      x: 2600
      'y': 200
edges:
  - from: worldtree
    to: core_book
    type: primary
  - from: core_book
    to: combine
    type: primary
  - from: combine
    to: question
    type: primary
  - from: question
    to: basic_checks
    type: primary
  - from: basic_checks
    to: hardness
    type: primary
  - from: hardness
    to: answerability
    type: primary
  - from: answerability
    to: shuffle
    type: primary
  - from: shuffle
    to: expert
    type: primary
  - from: expert
    to: dataset
    type: primary
  - from: dataset
    to: score
    type: primary
modules: []
