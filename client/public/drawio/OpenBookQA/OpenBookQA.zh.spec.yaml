meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenBookQA 构建流程
  description: >-
    论文对齐的 OpenBookQA 流程：2,287 个 WorldTree 核心事实筛成 1,326 条“开卷”，众包标注员把核心事实与常识结合 编写四选一题，经自动难度门、五人可答性门和专家审核，形成 5,957
    道训练/开发/测试题。
  legend: 实线箭头表示事实筛选、众包出题、自动与人工过滤、数据划分和评测。
nodes:
  - id: worldtree
    label: |-
      WorldTree 事实
      2,287 条被标为核心
    type: database
    size: large
    position:
      x: 40
      'y': 200
  - id: core_book
    label: |-
      通用性筛选
      开卷 F：1,326 条
      小学科学事实
    type: database
    size: xl
    position:
      x: 280
      'y': 200
  - id: combine
    label: |-
      标注员获得核心事实 f
      补充常识 k
      推导新陈述 s
    type: user
    size: xl
    position:
      x: 540
      'y': 200
  - id: question
    label: |-
      编写问题与答案
      加入 3 个错误选项
      仅一个正确选项
    type: document
    size: xl
    position:
      x: 800
      'y': 200
  - id: basic_checks
    label: |-
      自动基础检查
      恰好 4 选项 / 禁用否定词
      选项长度均匀
    type: process
    size: xl
    position:
      x: 1060
      'y': 200
  - id: hardness
    label: |-
      自动难度门
      检索与词关联系统均失败
      前 3 个检索句不足以作答
      太容易 → 编辑重试
    type: process
    size: xl
    position:
      x: 1320
      'y': 200
  - id: answerability
    label: |-
      普通人可答性门
      5 位新标注员
      至少 4 / 5 答对才保留
    type: user
    size: xl
    position:
      x: 1580
      'y': 200
  - id: shuffle
    label: |-
      随机打乱答案选项
      关联核心事实 f
      保留有噪附加事实 k
    type: process
    size: xl
    position:
      x: 1840
      'y': 200
  - id: expert
    label: |-
      内部专家过滤
      提升开发集与测试集质量
    type: user
    size: large
    position:
      x: 2100
      'y': 200
  - id: dataset
    label: |-
      OpenBookQA：5,957 题
      训练 4,957 / 开发 500 / 测试 500
      训练与开发集包含核心事实 f
    type: database
    size: xl
    position:
      x: 2340
      'y': 200
  - id: score
    label: |-
      开卷四选一问答
      结合 f 与常识
      准确率（k 项并列得 1/k）
    type: terminal
    size: xl
    position:
      x: 2600
      'y': 200
edges:
  - from: worldtree
    to: core_book
    type: primary
  - from: core_book
    to: combine
    type: primary
  - from: combine
    to: question
    type: primary
  - from: question
    to: basic_checks
    type: primary
  - from: basic_checks
    to: hardness
    type: primary
  - from: hardness
    to: answerability
    type: primary
  - from: answerability
    to: shuffle
    type: primary
  - from: shuffle
    to: expert
    type: primary
  - from: expert
    to: dataset
    type: primary
  - from: dataset
    to: score
    type: primary
modules: []
