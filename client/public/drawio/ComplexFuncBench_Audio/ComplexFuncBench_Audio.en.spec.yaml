meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComplexFuncBench Audio — Base Build and Audio Adaptation
  description: >-
    Base ComplexFuncBench construction from the paper and official repository, followed by Google DeepMind’s 2026-03-26
    ComplexFuncBench Audio evaluation adaptation. Audio is synthesized from existing prompts; no new audio benchmark
    dataset is constructed.
  legend: >-
    The top row is the base benchmark build. The lower branches distinguish the published text protocol from Google
    DeepMind’s prompt-to-audio Gemini realtime API adaptation; both retain the published ComplexEval scorer.
nodes:
  - id: apis
    label: |-
      Booking.com via RapidAPI
      43 Real-Time APIs across 5 Domains
      Manually Correct Function Descriptions
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coarse
    label: |-
      Stage 1: Coarse Generation
      GPT-4o Samples Functions and Generates
      1,000 Queries plus Preliminary Call Paths
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: select
    label: |-
      Select 100 Relatively Complete Samples
      Cover Different Steps and Call Paths
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: correct
    label: |-
      Stage 2: Senior Annotation
      Rewrite Queries, Correct Parameters
      Build the Shortest Complete Call Path
    type: user
    size: xl
    position:
      x: 880
      'y': 100
  - id: disambiguate
    label: |-
      Remove Ambiguity
      Exclude Overlapping Functions and Delete
      API Results Causing Multiple Valid Values
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: templates
    label: |-
      Quality-Checked Template Set
      100 Error-Free Complex Call Paths
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generalize
    label: |-
      Stage 3: Generalization
      GPT-4o Changes Locations and Constraints
      Nine New Queries per Template
    type: process
    size: xl
    position:
      x: 1720
      'y': 100
  - id: junior
    label: |-
      Junior Annotators Fill Parameters
      Preserve Paths and Disambiguate Responses
    type: user
    size: xl
    position:
      x: 2000
      'y': 100
  - id: dataset
    label: |-
      ComplexFuncBench Base Dataset
      1,000 Samples: 600 Single + 400 Cross Domain
      Built by the Paper and Official zai-org Repository
    type: database
    size: xl
    position:
      x: 2280
      'y': 100
  - id: text_protocol
    label: |-
      Published Text-to-Text Protocol
      Static Context and Interdependent Calls
    type: document
    size: xl
    position:
      x: 2280
      'y': 430
  - id: audio_synth
    label: |-
      ComplexFuncBench Audio
      Google DeepMind Adaptation (2026-03-26)
      Synthesize Audio for Each Existing Prompt
    type: document
    size: xl
    position:
      x: 2280
      'y': 670
  - id: text_run
    label: |-
      Model Iteratively Generates Calls
      Receive Annotated API Responses
    type: process
    size: xl
    position:
      x: 1960
      'y': 430
  - id: live_run
    label: |-
      Run through Gemini Realtime API
      Process Audio Prompts and Function Calls
    type: process
    size: xl
    position:
      x: 1960
      'y': 670
  - id: complexeval
    label: |-
      Published ComplexEval Scorer
      Format Check + Hungarian Mapping
      Rule / Response / GPT-4o Equivalence
    type: process
    size: xl
    position:
      x: 1640
      'y': 550
  - id: response_judge
    label: |-
      GPT-4o Final-Response Review
      Completeness and Correctness (0 to 2)
    type: process
    size: xl
    position:
      x: 1320
      'y': 550
  - id: report
    label: |-
      Report Success Rate and Call Accuracy
      plus Completeness and Correctness
    type: terminal
    size: xl
    position:
      x: 1000
      'y': 550
edges:
  - from: apis
    to: coarse
    type: primary
  - from: coarse
    to: select
    type: primary
  - from: select
    to: correct
    type: primary
  - from: correct
    to: disambiguate
    type: primary
  - from: disambiguate
    to: templates
    type: primary
  - from: templates
    to: generalize
    type: primary
  - from: generalize
    to: junior
    type: primary
  - from: junior
    to: dataset
    type: primary
  - from: dataset
    to: text_protocol
    type: primary
  - from: dataset
    to: audio_synth
    type: primary
  - from: text_protocol
    to: text_run
    type: primary
  - from: audio_synth
    to: live_run
    type: primary
  - from: text_run
    to: complexeval
    type: primary
  - from: live_run
    to: complexeval
    type: primary
  - from: complexeval
    to: response_judge
    type: primary
  - from: response_judge
    to: report
    type: primary
modules: []
