meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PlanBench-XL 构建与评测流程
  description: 按固定来源重建类型化零售生态、可执行状态图任务、检索中介交互、可选保路径阻断器以及论文定义的七项诊断指标。
  legend: 实线复现论文披露的构建与评测流程。虚线标识固定证据、构建后验证、公开发布事实、实现漂移与许可证边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2606.22388v1
      PDF 593b053aacd5
      官方代码 a0dacc2d227e
      HF数据 8d8d3d1a6fa7
    type: document
    size: xl
    position:
      x: 20
      'y': 300
    style:
      fontSize: 10
  - id: datatype_proposal
    label: |-
      提出零售数据类型
      GPT-5.2生成
      具体领域信息
      名称说明与示例值
    type: process
    size: xl
    position:
      x: 260
      'y': 300
  - id: datatype_filter
    label: |-
      过滤数据类型清单
      GPT-5.2移除模糊
      冗余不合理
      或不现实概念
      保留56种数据类型
    type: process
    size: xl
    position:
      x: 500
      'y': 300
    style:
      fontSize: 9
  - id: tool_candidates
    label: |-
      生成候选工具
      组合1至5种输入类型
      恰好对应1种输出类型
      GPT-5.2提出功能
    type: process
    size: xl
    position:
      x: 740
      'y': 300
  - id: tool_filter
    label: |-
      过滤候选工具
      确定性依赖
      工具驱动的信息访问
      领域真实性
      非平凡信息增益
    type: process
    size: xl
    position:
      x: 980
      'y': 300
    style:
      fontSize: 9
  - id: tool_schema
    label: |-
      定稿185个可执行工具
      每种类型有5至10个别名
      基于别名的名称与版本
      GPT-5.2生成说明
      固定类型化签名
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
    style:
      fontSize: 9
  - id: noisy_tools
    label: |-
      加入925个噪声工具
      每个可执行工具配五个
      已弃用 · 条件受限
      陈旧 · 不可靠
      非权威值
    type: process
    size: xl
    position:
      x: 1460
      'y': 300
    style:
      fontSize: 9
  - id: backend
    label: |-
      实例化可执行后端
      每个零售案例有完整记录
      隐藏且非平凡的取值
      唯一类型化输出
      固定噪声工具响应
    type: database
    size: xl
    position:
      x: 1700
      'y': 300
    style:
      fontSize: 9
  - id: task_spec
    label: |-
      定义类型化任务
      初始类型D0
      目标类型Y
      多输入任务必须使用
      每一个已声明输入
    type: process
    size: xl
    position:
      x: 1940
      'y': 300
    style:
      fontSize: 9
  - id: state_graph
    label: |-
      构建状态图
      工具加入新的输出类型
      枚举包含极小工具集
      及其合法执行顺序
      形成真实路径Pi
    type: process
    size: xl
    position:
      x: 2180
      'y': 300
    style:
      fontSize: 9
  - id: task_filter
    label: |-
      保留可解长程任务
      丢弃空路径集合
      最短路径至少5次调用
      发布路径长度为5至9
    type: process
    size: xl
    position:
      x: 2420
      'y': 300
  - id: instantiate_query
    label: |-
      实例化查询案例
      从后端抽取具体取值
      保持任务可解
      GPT-5.2把任务语言化
      隐藏中间子目标
    type: process
    size: xl
    position:
      x: 2660
      'y': 300
    style:
      fontSize: 9
  - id: gold_answer
    label: |-
      构造标准答案
      选择一条有效路径
      GPT-5.2依序执行
      使用抵达的目标取值
      保留全部有效路径作为过程真值
    type: document
    size: xl
    position:
      x: 2900
      'y': 300
    style:
      fontSize: 9
  - id: paper_dataset
    label: |-
      论文最终基准
      327条零售查询
      56种类型 · 1,665个工具
      185个可执行 · 925个噪声
      555个阻断替代工具
    type: database
    size: xl
    position:
      x: 3140
      'y': 300
    style:
      fontSize: 9
  - id: runtime_state
    label: |-
      初始化隐藏运行时状态
      状态含查询q可调用集Ut
      与已获得类型Dt
      U0为空 · D0已可用
      Agent可见100步预算
    type: process
    size: xl
    position:
      x: 3380
      'y': 300
    style:
      fontSize: 9
  - id: action_gate
    label: |-
      每步仅选一个动作
      检索候选工具
      调用已检索工具
      或提交最终答案
    type: process
    size: xl
    position:
      x: 3620
      'y': 300
  - id: retriever
    label: |-
      解析一次检索请求
      按输入 · 按输出
      或同时按输入输出
      别名匹配后精确类型匹配
      至多14个可执行 · 30个总工具
    type: process
    size: xl
    position:
      x: 3860
      'y': 60
    style:
      fontSize: 9
  - id: default_candidates
    label: |-
      默认检索模式
      返回全部匹配可执行工具
      均匀填充剩余槽位
      加入成对说明性噪声
      已检索工具保持可调用
    type: process
    size: xl
    position:
      x: 4100
      'y': 20
    style:
      fontSize: 9
  - id: blocker_mode
    label: |-
      可选阻断检索模式
      选择有效路径上的工具
      至少保留一条路径
      替换为显式失败隐式失败
      或语义误导工具
    type: process
    size: xl
    position:
      x: 4100
      'y': 220
    style:
      fontSize: 9
  - id: tool_call
    label: |-
      执行结构化工具调用
      工具必须已被检索
      所需类型必须已获得
      解析唯一后端元组
      将可信输出加入Dt
    type: process
    size: xl
    position:
      x: 3860
      'y': 380
    style:
      fontSize: 9
  - id: feedback
    label: |-
      返回环境反馈
      候选工具或无直接工具提示
      工具结果或协议错误
      跟踪调用取值与轮次
    type: process
    size: xl
    position:
      x: 4340
      'y': 300
  - id: budget_gate
    label: |-
      检查模型可见的100步预算
      预算未耗尽
      返回动作选择
      预算已耗尽
      不再执行动作并结束
    type: process
    size: xl
    position:
      x: 4580
      'y': 520
    style:
      fontSize: 9
  - id: answer_check
    label: |-
      结束轨迹
      提交答案或预算已耗尽
      规范化文本并做包含匹配
      要求状态含目标类型Y
    type: process
    size: xl
    position:
      x: 3860
      'y': 760
  - id: completion_metrics
    label: |-
      任务完成指标
      准确率
      已执行真实路径
      数据类型精度
      平均轮数
    type: process
    size: xl
    position:
      x: 4340
      'y': 760
  - id: behavior_metrics
    label: |-
      探索行为指标
      平均探索数据类型数
      检索与调用比
      执行质量指标
      无效工具调用率
      不可信输入拒绝率
    type: process
    size: xl
    position:
      x: 4340
      'y': 1040
    style:
      fontSize: 9
  - id: report
    label: |-
      报告论文七项指标
      完成 · 探索
      与执行质量
      分开保留默认与阻断设置
      用种子42保证可复现
    type: terminal
    size: xl
    position:
      x: 4580
      'y': 900
    style:
      fontSize: 9
  - id: human_validation
    label: |-
      构建后验证
      五位研究标注者
      评价50个工具和25种类型
      平均分为4.32与4.56
      验证并非全量过滤
    type: document
    size: xl
    position:
      x: 1700
      'y': 1160
    style:
      fontSize: 9
  - id: release_snapshot
    label: |-
      固定公开发布快照
      代码 a0dacc2d227e
      HF数据 8d8d3d1a6fa7
      queries.json SHA aa708b84ae7d
      代码与HF均为327行
    type: document
    size: xl
    position:
      x: 3140
      'y': 1160
    style:
      fontSize: 9
  - id: implementation_boundary
    label: |-
      评测器实现边界
      固定代码另报EGT召回率
      噪声工具与合并调用指标
      论文榜单仅定义
      七项核心指标
    type: document
    size: xl
    position:
      x: 4580
      'y': 1280
    style:
      fontSize: 9
  - id: license_boundary
    label: |-
      许可证边界
      固定Git代码无LICENSE文件
      固定HF数据卡声明MIT
      仓库代码条款仍为
      独立未声明状态
    type: document
    size: xl
    position:
      x: 3380
      'y': 1380
    style:
      fontSize: 9
edges:
  - from: source_evidence
    to: datatype_proposal
    type: secondary
    style:
      dashed: true
  - from: datatype_proposal
    to: datatype_filter
    type: primary
  - from: datatype_filter
    to: tool_candidates
    type: primary
  - from: tool_candidates
    to: tool_filter
    type: primary
  - from: tool_filter
    to: tool_schema
    type: primary
  - from: tool_schema
    to: noisy_tools
    type: primary
  - from: noisy_tools
    to: backend
    type: primary
  - from: backend
    to: task_spec
    type: primary
  - from: task_spec
    to: state_graph
    type: primary
  - from: state_graph
    to: task_filter
    type: primary
  - from: task_filter
    to: instantiate_query
    type: primary
  - from: instantiate_query
    to: gold_answer
    type: primary
  - from: gold_answer
    to: paper_dataset
    type: primary
  - from: paper_dataset
    to: runtime_state
    type: primary
  - from: runtime_state
    to: action_gate
    type: primary
  - from: action_gate
    to: retriever
    type: primary
  - from: retriever
    to: default_candidates
    type: primary
  - from: retriever
    to: blocker_mode
    type: primary
  - from: default_candidates
    to: feedback
    type: primary
  - from: blocker_mode
    to: feedback
    type: primary
  - from: action_gate
    to: tool_call
    type: primary
  - from: tool_call
    to: feedback
    type: primary
  - from: feedback
    to: budget_gate
    type: primary
  - from: budget_gate
    to: action_gate
    type: primary
    style:
      exitX: 0.5
      exitY: 0
      entryX: 0.5
      entryY: 0
  - from: action_gate
    to: answer_check
    type: primary
  - from: budget_gate
    to: answer_check
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: answer_check
    to: completion_metrics
