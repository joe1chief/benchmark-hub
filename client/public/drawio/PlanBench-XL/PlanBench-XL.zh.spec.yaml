      exitX: 1
      exitY: 0.67
      entryX: 0
      entryY: 0.5
  - from: completion_metrics
    to: report
    type: primary
  - from: behavior_metrics
    to: report
    type: primary
  - from: paper_dataset
    to: human_validation
    type: secondary
    style:
      dashed: true
  - from: paper_dataset
    to: release_snapshot
    type: secondary
    style:
      dashed: true
  - from: report
    to: implementation_boundary
    type: secondary
    style:
      dashed: true
  - from: release_snapshot
    to: license_boundary
    type: secondary
    style:
      dashed: true
modules: []
