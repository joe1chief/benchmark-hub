meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PlanBench-XL 构建与评测流程
  description: 按论文合成类型化零售工具生态状态图任务和自然语言查询，再进行工具可见性受限的交互可选保路径阻断与七项诊断指标评测。
  legend: 发布版包含56种数据类型1,665个工具与327条查询，最短有效路径至少需5次工具调用，Agent最多获得100轮。
nodes:
  - id: step_1
    label: |-
      定义类型化零售生态
      把值划分为数据类型
      显式描述工具输入与输出
      支持可执行状态转移
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      生成并过滤56种数据类型
      LLM提出零售数据概念
      过滤模糊或冗余概念
      保留真实运营数据
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      合成1,665个可执行工具
      组合1至5种输入数据类型
      产生一种输出数据类型
      过滤不合理或重复工具
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      消除命名捷径
      固定规范工具名
      添加自然别名与描述
      创建五类噪声同族工具
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      构建可执行后端
      填充具体零售记录
      使用非平凡字段值
      为噪声工具固定无用输出
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      构造类型化规划任务
      定义初始数据类型D0与目标Y
      构建可达状态图
      枚举全部真实路径
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      保留327个可解长程任务
      要求存在有效解路径
      最短路径为5至9次调用
      抽取具体实体和值
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      编写查询与标准答案
      LLM把类型任务语言化
      隐藏中间子目标
      执行有效路径得到答案
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      初始化交互运行时
      跟踪隐藏类型状态
      跟踪已发现工具与值
      支持检索 · 调用 · 回答
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      检索受限工具子集
      按输入或输出类型搜索
      桥接输入到输出需求
      最多返回30个候选工具
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      可选应用阻断器
      替换路径关键工具
      至少保留一条有效路径
      显式 · 隐式 · 语义误导
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      最多执行100轮
      检索并结构化调用工具
      累积中间证据
      识别失败并重新规划
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      衡量完成与探索
      最终答案Accuracy
      EGT数据类型精度 · 平均轮数
      平均探索数据类型数
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      诊断执行质量
      检索与调用比
      无效工具调用率
      不可信输入拒绝率
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
