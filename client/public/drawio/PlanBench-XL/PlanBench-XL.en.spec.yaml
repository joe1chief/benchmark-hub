    label: |-
      Fixed Official Evidence
      arXiv 2606.22388v1
      PDF 593b053aacd5
      Official Code a0dacc2d227e
      HF Data 8d8d3d1a6fa7
    type: document
    size: xl
    position:
      x: 20
      'y': 300
    style:
      fontSize: 10
  - id: datatype_proposal
