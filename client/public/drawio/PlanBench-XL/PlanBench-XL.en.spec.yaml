      Propose Retail Datatypes
      GPT-5.2 Generates
      Concrete Domain Information
      Names Descriptions and Values
    type: process
    size: xl
    position:
      x: 260
      'y': 300
  - id: datatype_filter
    label: |-
      Filter Datatype Inventory
      GPT-5.2 Removes Vague
      Redundant Unreasonable
      or Unrealistic Concepts
      Retain 56 Datatypes
    type: process
    size: xl
    position:
      x: 500
      'y': 300
    style:
      fontSize: 9
