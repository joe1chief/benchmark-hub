    type: process
    size: xl
    position:
      x: 1940
      'y': 300
    style:
      fontSize: 9
  - id: state_graph
    label: |-
      Build State Graphs
      A Tool Adds New Output Types
      Enumerate Inclusion-minimal
      Tool Sets and Legal Orders
      Form Ground-truth Paths Pi
    type: process
    size: xl
    position:
      x: 2180
      'y': 300
    style:
      fontSize: 9
  - id: task_filter
    label: |-
      Retain Solvable Long Tasks
      Discard Empty Path Sets
      Shortest Path at Least 5 Calls
      Released Lengths 5 to 9
    type: process
    size: xl
    position:
      x: 2420
      'y': 300
  - id: instantiate_query
    label: |-
      Instantiate Query Cases
      Sample Concrete Backend Values
      Preserve Solvability
      GPT-5.2 Verbalizes the Task
      Hide Intermediate Sub-goals
    type: process
    size: xl
    position:
      x: 2660
      'y': 300
    style:
      fontSize: 9
  - id: gold_answer
    label: |-
      Construct Gold Answers
      Select One Valid Path
      GPT-5.2 Executes It in Order
      Use the Reached Target Values
      Keep All Valid Paths for Process GT
    type: document
    size: xl
    position:
      x: 2900
      'y': 300
    style:
      fontSize: 9
  - id: paper_dataset
    label: |-
      Final Paper Benchmark
      327 Retail Queries
