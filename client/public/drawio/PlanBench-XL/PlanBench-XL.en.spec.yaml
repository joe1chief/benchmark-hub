meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PlanBench-XL Build and Evaluation Process
  description: >-
    Paper-aligned synthesis of a typed retail tool ecosystem, state-graph tasks and natural-language queries, followed
    by retrieval-limited interaction, optional path-preserving blockers, and seven diagnostic metrics.
  legend: >-
    The released benchmark contains 56 datatypes, 1,665 tools, and 327 queries whose shortest valid paths require at
    least five tool calls; agents receive at most 100 turns.
nodes:
  - id: step_1
    label: |-
      Define a Typed Retail Ecosystem
      Separate values into datatypes
      Make tool inputs and outputs explicit
      Support executable state transitions
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Generate and Filter 56 Datatypes
      LLM proposes retail data concepts
      Filter vague or redundant concepts
      Keep realistic operational values
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Synthesize 1,665 Executable Tools
      Combine one to five input datatypes
      Produce one output datatype
      Filter unreasonable or duplicate tools
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Remove Naming Shortcuts
      Fix canonical tool names
      Add natural aliases and descriptions
      Create five noisy sibling variants
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Build the Executable Backend
      Populate concrete retail records
      Use non-trivial field values
      Give noisy tools fixed unhelpful outputs
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Construct Typed Planning Tasks
      Define initial datatypes D0 and goal Y
      Build the reachable state graph
      Enumerate all ground-truth paths
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Retain 327 Solvable Long Tasks
      Require a valid solution path
      Shortest paths span 5 to 9 calls
      Sample concrete entities and values
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Write Queries and Gold Answers
      LLM verbalizes the typed task
      Hide intermediate sub-goals
      Execute a valid path for the answer
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Initialize the Interactive Runtime
      Track hidden typed state
      Track discovered tools and values
      Allow retrieve · tool-call · answer
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Retrieve Limited Tool Subsets
      Search by input or output datatype
      Bridge input-to-output needs
      Return at most 30 candidate tools
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Optionally Apply Blockers
      Replace path-critical tools
      Preserve at least one valid path
      Explicit · implicit · misleading
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Execute up to 100 Turns
      Retrieve and invoke structured tools
      Accumulate intermediate evidence
      Detect failures and re-plan
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Measure Completion and Exploration
      Final-answer Accuracy
      EGT datatype precision · average turns
      Mean explored datatype count
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Diagnose Execution Quality
      Search-to-call ratio
      Invalid tool-call rate
      Untrusted-input rejection rate
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
