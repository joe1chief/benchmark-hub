      Choose Exactly One Action
      Retrieve Candidate Tools
      Call a Retrieved Tool
      or Submit Final Answer
    type: process
    size: xl
    position:
      x: 3620
      'y': 300
  - id: retriever
    label: |-
      Resolve a Retrieval Request
      Input-conditioned · Output-conditioned
      or Input-output-conditioned
      Alias Match then Exact Type Match
      At Most 14 Executable · 30 Total
    type: process
    size: xl
    position:
      x: 3860
      'y': 60
    style:
      fontSize: 9
  - id: default_candidates
    label: |-
      Default Retrieval Mode
      Return All Matched Executables
      Fill Remaining Slots Evenly
      with Paired Descriptive Noise
      Keep Retrieved Tools Callable
    type: process
    size: xl
    position:
      x: 4100
      'y': 20
    style:
      fontSize: 9
  - id: blocker_mode
    label: |-
      Optional Block Retrieval Mode
      Select Tools on Valid Paths
      Preserve at Least One Path
      Replace with Explicit Implicit
      or Semantically Misleading Tools
    type: process
    size: xl
    position:
      x: 4100
      'y': 220
    style:
      fontSize: 9
  - id: tool_call
    label: |-
      Execute a Structured Tool Call
      Tool Must Have Been Retrieved
      Required Types Must Be Available
      Resolve One Backend Tuple
      Add Trusted Outputs to Dt
    type: process
    size: xl
    position:
      x: 3860
      'y': 380
    style:
      fontSize: 9
  - id: feedback
    label: |-
      Return Environment Feedback
      Candidate Tools or No-direct Note
      Tool Result or Protocol Error
      Track Calls Values and Turns
    type: process
    size: xl
    position:
      x: 4340
      'y': 300
  - id: budget_gate
    label: |-
      Check the Visible 100-step Budget
      Budget Remains
      Return to Action Selection
      Budget Exhausted
      End without Another Action
    type: process
    size: xl
    position:
      x: 4580
      'y': 520
    style:
      fontSize: 9
  - id: answer_check
    label: |-
      Finalize the Trajectory
      Submitted Answer or Exhausted Budget
      Normalize Text and Test Containment
      Require Target Types Y in State
    type: process
    size: xl
    position:
      x: 3860
      'y': 760
  - id: completion_metrics
    label: |-
      Task Completion Metrics
      Accuracy
      Executed Ground-truth
      Datatype Precision
      Average Turns
    type: process
    size: xl
    position:
      x: 4340
      'y': 760
  - id: behavior_metrics
    label: |-
      Exploration Behavior
      Mean Explored Datatypes
      Search-to-call Ratio
      Execution Quality
      Invalid Tool-call Rate
      Untrusted Input Rejection Rate
    type: process
    size: xl
    position:
      x: 4340
      'y': 1040
    style:
      fontSize: 9
  - id: report
    label: |-
      Report Seven Paper Metrics
      Completion · Exploration
      and Execution Quality
      Keep Default and Block Settings
      Reproducible with Seed 42
    type: terminal
    size: xl
    position:
      x: 4580
      'y': 900
    style:
      fontSize: 9
  - id: human_validation
    label: |-
      Post-construction Validation
      Five Research Annotators
      Rate 50 Tools and 25 Datatypes
      Mean Scores 4.32 and 4.56
      Validation Is Not a Full Filter
    type: document
    size: xl
    position:
      x: 1700
      'y': 1160
    style:
      fontSize: 9
  - id: release_snapshot
    label: |-
      Fixed Public Release Snapshot
      Code a0dacc2d227e
      HF Data 8d8d3d1a6fa7
      queries.json SHA aa708b84ae7d
      327 Rows Match Code and HF
    type: document
    size: xl
    position:
      x: 3140
      'y': 1160
    style:
      fontSize: 9
  - id: implementation_boundary
    label: |-
      Evaluator Implementation Boundary
      Fixed Code Also Reports EGT Recall
      Noisy-tool and Combined-call Metrics
      Paper Leaderboard Defines Seven
      Core Metrics Only
    type: document
    size: xl
    position:
      x: 4580
      'y': 1280
    style:
      fontSize: 9
  - id: license_boundary
    label: |-
      License Boundary
      Fixed Git Code Has No LICENSE File
      Fixed HF Dataset Card Declares MIT
      Repository Code Terms Remain
      Separately Undeclared
    type: document
    size: xl
    position:
      x: 3380
      'y': 1380
    style:
      fontSize: 9
