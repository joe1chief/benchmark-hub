      Tool-grounded Access
      Domain Realism
      Non-trivial Information Gain
    type: process
    size: xl
    position:
      x: 980
      'y': 300
    style:
      fontSize: 9
  - id: tool_schema
    label: |-
      Finalize 185 Executable Tools
      5 to 10 Aliases per Datatype
      Alias-based Names and Versions
      GPT-5.2 Descriptions
      Fixed Typed Signatures
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
    style:
      fontSize: 9
  - id: noisy_tools
    label: |-
      Add 925 Noisy Tools
      Five per Executable Tool
      Deprecated · Condition-limited
      Stale · Unreliable
      Non-authoritative
    type: process
    size: xl
    position:
      x: 1460
      'y': 300
    style:
      fontSize: 9
  - id: backend
    label: |-
      Instantiate Executable Backend
      Complete Retail Record per Case
      Non-trivial Hidden Values
      Unique Typed Outputs
      Fixed Noisy-tool Responses
    type: database
    size: xl
    position:
      x: 1700
      'y': 300
    style:
      fontSize: 9
  - id: task_spec
    label: |-
      Define Typed Tasks
      Initial Types D0
      Target Types Y
      Require Every Declared Input
