meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PlanBench-XL Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of the typed retail ecosystem, executable state-graph tasks, retrieval-mediated
    interaction, optional path-preserving blockers, and the paper's seven diagnostic metrics.
  legend: >-
    Solid arrows reproduce the paper-disclosed build and evaluation workflow. Dashed arrows identify fixed evidence,
    post-construction validation, public-release facts, implementation drift, and license boundaries.
