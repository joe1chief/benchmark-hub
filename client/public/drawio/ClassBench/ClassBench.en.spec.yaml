meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClassBench (AgentWorldModel-1K Environment) Build Process
  description: >-
    AWM paper-aligned construction flow for the released scheduling_2 record: ClassBench is one generated Music School
    Scheduling and Attendance environment, not a standalone benchmark. Its ten tasks drive dependent SQLite, interface,
    and verifier synthesis before isolated execution, bounded repair, release, agent execution, and outcome labeling.
  legend: Solid arrows show synthesis and validation; dashed arrows show data dependencies and the bounded repair return.
nodes:
  - id: seeds
    label: |-
      100 Popular Domain Names
      Seed Stateful Application Domains
      for Self-Instruct Expansion
    type: database
    size: xl
    position:
      x: 40
      'y': 260
  - id: scenarios
    label: |-
      Self-Instruct Scenario Expansion
      Domain Name → Application Description
      Stateful CRUD Workflows
    type: process
    size: xl
    position:
      x: 340
      'y': 260
  - id: filter
    label: |-
      Scenario Filtering + Deduplication
      CRUD Classifier • Embedding Cosine 0.85
      Category Caps for Diversity
    type: process
    size: xl
    position:
      x: 640
      'y': 260
  - id: classbench
    label: |-
      ClassBench
      Music School Scheduling & Attendance
      Released ID — scheduling&#95;2
      One AWM Environment
      Not a Standalone Benchmark
    type: document
    size: xl
    position:
      x: 940
      'y': 260
  - id: tasks
    label: |-
      10 API-solvable User Tasks
      Post-authentication • Self-contained
      Tasks Define Required
      Backend Behavior
    type: document
    size: xl
    position:
      x: 1240
      'y': 260
  - id: database
    label: |-
      Minimal SQLite Schema
      + Sample Data
      Satisfy Every Task's Preconditions
      No Authentication Fields
    type: database
    size: xl
    position:
      x: 1540
      'y': 20
  - id: interface
    label: |-
      Two-stage Interface Synthesis
      API Specification
      → Python Implementation
      MCP Tools + FastAPI Server
    type: process
    size: xl
    position:
      x: 1840
      'y': 20
  - id: verifier
    label: |-
      One Verifier per Task
      Initial vs Final Database State
      Structured Signals + Success Criteria
      Code-augmented LLM Judge
    type: process
    size: xl
    position:
      x: 1540
      'y': 500
  - id: quality_gate
    label: |-
      Isolated Component Execution
      Accept <10% Schema / Data Errors
      Require 0% Environment Startup Errors
      Test Database • Interface • Verifier
    type: process
    size: xl
    position:
      x: 1840
      'y': 260
  - id: repair
    label: |-
      Error Summary + Generated Code
      Feed Back to LLM • Retry up to 5
      Keep Best Attempt if Exhausted
    type: process
    size: xl
    position:
      x: 1840
      'y': 500
  - id: release
    label: |-
      AgentWorldModel-1K Release
      1,000 Environments • 10,000 Tasks
      ClassBench = 1 Environment • 10 Tasks
    type: database
    size: xl
    position:
      x: 2140
      'y': 260
  - id: run
    label: |-
      Run Multi-turn Tool-use Agent
      Resettable Isolated MCP Environment
      Record Agent Trajectory + Final State
    type: process
    size: xl
    position:
      x: 2440
      'y': 260
  - id: score
    label: |-
      Trajectory + Verification Outcome
      Completed • Partially Completed
      Agent Error • Environment Error
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 260
