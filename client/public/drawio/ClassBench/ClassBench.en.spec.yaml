meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClassBench (AWM Environment) Build Process
  description: >-
    Paper-aligned identity and construction flow for ClassBench: it is not a standalone benchmark in the AWM paper, but
    one generated Music School Scheduling and Attendance environment inside AgentWorldModel-1K, produced through
    scenario, task, SQLite, MCP-interface, verification, and execution-based repair stages.
  legend: >-
    Solid arrows show the disclosed AWM synthesis path; the disclosure node prevents treating the environment as a
    separate benchmark.
nodes:
  - id: identity
    label: |-
      Establish the Artifact Identity
      ClassBench = Music School Scheduling & Attendance
      One AWM Scenario, Not a Standalone Benchmark
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: seeds
    label: |-
      Start from 100 Domain-name Seeds
      Focus on Stateful Applications
      Require Database-backed CRUD Operations
    type: database
    size: xl
    position:
      x: 340
      'y': 220
  - id: scenarios
    label: |-
      Synthesize Scenario Descriptions
      LLM Expands Names into Application Concepts
      Include ClassBench Music-school Workflow
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: filter
    label: |-
      Filter and Deduplicate Scenarios
      CRUD Classifier + Embedding Deduplication
      Cap Over-represented Categories
    type: decision
    size: xl
    position:
      x: 940
      'y': 220
  - id: tasks
    label: |-
      Generate 10 User Tasks per Scenario
      API-solvable and Post-authentication
      Tasks Drive Required Backend Functionality
    type: document
    size: xl
    position:
      x: 1240
      'y': 220
  - id: database
    label: |-
      Build SQLite State and Initial Data
      Infer Entities, Relations, and Constraints
      Satisfy Preconditions for Every Task
    type: database
    size: xl
    position:
      x: 1540
      'y': 40
  - id: tools
    label: |-
      Generate the MCP Tool Interface
      Design Minimal Typed Tool Schemas
      Implement Python Read/Write Operations
    type: process
    size: xl
    position:
      x: 1540
      'y': 400
  - id: verifier
    label: |-
      Generate Task-specific Verification
      Compare Initial and Final Database States
      Code-augmented LLM-as-a-Judge Reward
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: execute
    label: |-
      Execute Each Generated Component
      Test Database, Tools, and Verification
      Capture Runtime Errors in Isolation
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: repair
    label: |-
      Self-correct Generation Failures
      Feed Errors and Code Back to the LLM
      Retry up to Five Iterations
    type: decision
    size: xl
    position:
      x: 2440
      'y': 220
  - id: release
    label: |-
      Release inside AgentWorldModel-1K
      One of 1,000 Environments and 10,000 Tasks
      Database + Tools + Tasks + Verification
    type: database
    size: xl
    position:
      x: 2740
      'y': 220
  - id: run
    label: |-
      Run Multi-turn Tool-use Agents
      Resettable Isolated MCP Environment
      Agent Changes Music-school Workflow State
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
  - id: score
    label: |-
      Verify Task Completion
      Inspect Before/After State + Judge Result
      Report Success or Environment Error
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: identity
    to: seeds
    type: primary
  - from: seeds
    to: scenarios
    type: primary
  - from: scenarios
    to: filter
    type: primary
  - from: filter
    to: tasks
    type: primary
  - from: tasks
    to: database
    type: primary
  - from: tasks
    to: tools
    type: primary
  - from: database
    to: verifier
    type: primary
  - from: tools
    to: verifier
    type: primary
  - from: verifier
    to: execute
    type: primary
  - from: execute
    to: repair
    type: primary
  - from: repair
    to: release
    type: data
  - from: release
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
