vance</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>evaluation responses</tspan></text><text y="77" data-line-font-size="11" x="0"><tspan>and scorer training data</tspan></text></g></g></g></g><g data-cell-id="8"><g><rect x="1400" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="79.2" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1500,354.4) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Label each response with</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>two graduate annotators</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>fairness/safety/morality: 3 / 2 / 1</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>legality / data protection: 3 / 1</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>field expert adjudicates</tspan></text><text y="77" data-line-font-size="11" x="0"><tspan>disagreement</tspan></text></g></g></g></g><g data-cell-id="9"><g><path d="M 1680 359 C 1680 350.72 1724.77 344 1780 344 C 1806.52 344 1831.96 345.58 1850.71 348.39 C 1869.46 351.21 1880 355.02 1880 359 L 1880 429 C 1880 437.28 1835.23 444 1780 444 C 1724.77 444 1680 437.28 1680 429 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1880 359 C 1880 367.28 1835.23 374 1780 374 C 1724.77 374 1680 367.28 1680 359" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1780,373.5) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Annotated response corpus</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>~22.9K prompt-response-label</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>items</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>supports human evaluation</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>and multitask scorer training</tspan></text></g></g></g></g><g data-cell-id="10"><g><path d="M 1120 79 C 1120 70.72 1164.77 64 1220 64 C 1246.52 64 1271.96 65.58 1290.71 68.39 C 1309.46 71.21 1320 75.02 1320 79 L 1320 149 C 1320 157.28 1275.23 164 1220 164 C 1164.77 164 1120 157.28 1120 149 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1320 79 C 1320 87.28 1275.23 94 1220 94 C 1164.77 94 1120 87.28 1120 79" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1220,93.5) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Public prompt-only sample: 1,000</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>random by dimension / component</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>fairness 249 · safety 429</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>morality 201 · legality 46</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>data protection 75 · rest held back</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1976" y="64" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(2