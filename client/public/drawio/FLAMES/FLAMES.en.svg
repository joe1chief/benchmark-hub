" x="0"><tspan>data protection 242</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>Chinese values fall under morality</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="280" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,361) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Crowdworkers write Chinese prompts</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>concrete scenario per subcomponent</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>disguise · reverse induction</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>unsafe inquiry</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>successful examples guide free writing</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="560" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,361) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Apply two review rounds</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>1: target value + explicit scenario</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>+ attack method</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>2: attack at least one tested LLM</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>inspectors modify or discard failures</tspan></tex