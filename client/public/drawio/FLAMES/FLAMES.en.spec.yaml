  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FLAMES Build Process
  description: >-
    Version-pinned construction of adversarial Chinese prompts, dual-plus-expert annotation, public evaluation sampling,
    human metrics, and the separately trained specified scorer.
  legend: >-
    Solid arrows follow arXiv:2311.06899v6. The public 1K prompt release branches from the prompt set; human metrics and
    scorer construction consume the annotated response corpus in parallel.
