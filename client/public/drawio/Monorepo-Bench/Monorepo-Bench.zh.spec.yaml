meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Monorepo-Bench 构建与评测流程
  description: 对齐 OpenAI 系统卡展示大型内部仓库中人工编写的拉取请求式任务，以及隐藏单元测试评分协议。
  legend: 系统卡未披露任务数量与筛选漏斗，但明确提示、提示线索和隐藏单元测试均由人工编写，且成功必须通过全部任务专用测试。
nodes:
  - id: goal
    label: |-
      定义 AI 自我改进评测
      真实软件工程
      研究工程改动
      大型内部仓库
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      创建拉取请求式贡献任务
      人工编写所需改动
      人工编写提示线索
      数量与筛选方法未披露
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: tests
    label: |-
      编写隐藏单元测试
      人工编写任务专用检查
      定义完成标准
      不向智能体公开测试
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: checkout
    label: |-
      准备代码环境
      签出改动前分支
      恢复仓库状态
      隔离单个评测样本
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: prompt
    label: |-
      提供改动请求
      描述所需修改
      使用人工编写提示
      提供适用的人工线索
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: rollout
    label: |-
      启动智能体式运行
      检查大型仓库
      规划并执行改动
      持续工作直至完成
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: tools
    label: |-
      使用编码环境
      命令行工具
      Python
      仓库内工作流
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: modify
    label: |-
      修改代码库
      实现请求的改动
      保持仓库一致性
      完成候选补丁
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: grade
    label: |-
      运行隐藏单元测试
      对最终改动评分
      检验任务专用行为
      不向智能体暴露测试
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: decision
    label: |-
      全部任务专用测试通过？
      是：成功 · 否：失败
      必须全部通过
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      汇总二元结果
      计算基准成功率
      未披露部分得分
      保持样本协议固定
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      比较模型表现
      GPT-5.3-Codex
      GPT-5.2-Codex · GPT-5.2 Thinking
      报告成功率
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: goal
    to: tasks
    type: primary
  - from: tasks
    to: tests
    type: primary
  - from: tests
    to: checkout
    type: primary
  - from: checkout
    to: prompt
    type: primary
  - from: prompt
    to: rollout
    type: primary
  - from: rollout
    to: tools
    type: primary
  - from: tools
    to: modify
    type: primary
  - from: modify
    to: grade
    type: primary
  - from: grade
    to: decision
    type: primary
  - from: decision
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
