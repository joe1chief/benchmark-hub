meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Monorepo-Bench Build and Evaluation Process
  description: >-
    OpenAI-system-card-aligned protocol for human-authored pull-request-style tasks in a large internal repository,
    graded by hidden unit tests.
  legend: >-
    The system card does not disclose the task count or selection funnel. It does disclose that prompts, hints, and
    hidden unit tests are human-written and that every task-specific test must pass.
