meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T2I-CompBench 构建与评测流程
  description: >-
    本条目严格对应原始NeurIPS 2023
    T2I-CompBench会议版本，不采用后续8000提示的T2I-CompBench++。原始基准含6000条提示，分为三大类六个子类：3000条属性绑定提示覆盖颜色、形状和纹理，2000条关系提示覆盖空间与非空间关系，1000条提示用于复杂组合。每个子类1000条，按700训练、300测试划分，并平衡已见与未见组合。提示由规则和ChatGPT生成，兼有模板与自然语言；颜色提示结合CC-500、COCO和ChatGPT来源，空间提示覆盖7种关系并加入对比交换，复杂提示覆盖4种场景。评测时每条提示生成10张图。解耦BLIP-VQA把独立的对象-属性概率相乘，UniDet结合几何规则评分空间关系，CLIPScore评估非空间关系，复杂组合的3-in-1指标平均CLIP、BLIP-VQA和UniDet，MiniGPT4-CoT作为辅助统一指标。人工验证每个子类抽25条提示、每条两张图，由3名MTurk标注者按归一化五分制评分。
  legend: >-
    来源：Original T2I-CompBench conference paper arXiv:2307.06350v2 Sections 3-4 and 6.2; official
    Karine-Huang/T2I-CompBench repository and project page. This entry intentionally excludes the later T2I-CompBench++
    v3 expansion.。实线箭头表示论文或官方资料明确支持的主流程。
