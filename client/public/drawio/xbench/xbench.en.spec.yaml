meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: xbench Profession-Aligned Recruitment and Marketing Evaluation
  description: >-
    xbench starts from expert workflow/time/importance interviews, filters tasks by feasibility and evaluability,
    collects live business demands, labels static/dynamic items, and records expert time/value for separate IRT/TMF
    analysis. Recruitment builds 50 cases across Company Mapping, People-to-Info, and Info-to-People; every branch
    passes a public-information solvability plus self-disclosed/reliable-source check, confirmed for all 50 cases,
    before the web-search agent runs. Marketing builds 50 anonymized campaigns from briefs, recommendation lists, and
    client selections, using 836 historical selected-influencer profiles to generate ideal-persona rubrics. Both
    branches use Gemini-2.5-Flash judges; profession parsers and final aggregation are not public.
  legend: >-
    Source: xbench arXiv:2506.13651v1, Figures 1-6, Sections 3.1-3.3, Tables 1-7, Section 4.1, and Appendix A.1 Tables
    11-17; official project https://xbench.org/. The website xbench_profession_v2.4.pdf is a standalone snapshot, not
    arXiv v2. Official repository https://github.com/xbench-ai/xbench-evals at inspected HEAD
    17c562192cc7e62215bfb98b65e9f8806fb95504 does not publish the Recruitment/Marketing data, runner, parser, or scorer.
    Required conflicts: Section 3.2 prose versus Figure 4 swaps Recruitment 44/30/26 category bindings, and Section 3.3
    prose versus Figure 6 swaps Marketing 68/16/16 bindings. Final aggregation and invalid-output rules are
    undisclosed.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
