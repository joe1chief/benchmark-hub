    size: xl
    position:
      x: 5080
      'y': 1160
  - id: pointwise_judge
    label: GPT-4-Turbo 单回答评分：1-10
    type: process
    size: xl
    position:
      x: 3960
      'y': 1560
  - id: raw_mean
