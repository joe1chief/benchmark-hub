meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildBench 任务、检查表、WB-Reward 与 WB-Score 流程
  description: >-
    WildBench 对 WildChat-1M 依次执行长度、轮次、语言、毒性、语义相似度和设备去重；三种 LLM 只淘汰一致判易任务，再按类别抽样 1500 条，经人工复核形成 12 类 1024 题。两份独立检查表合并为每题
    5-10 个可核验问题。评测保留两条不同分支：WB-Reward 使用三个基线、五级胜负映射和可选长度惩罚；WB-Score 使用单回答 1-10 分及论文给定的仿射变换。
  legend: >-
    来源：WildBench arXiv:2406.04770v2 (2024-10-05), Sections 2.1-2.2 and 3.1-3.2, Figure 2; official repository
    https://github.com/allenai/WildBench and official dataset https://huggingface.co/datasets/WildEval/WildBench-V2.
    WildEval is the hosting organization/path, not the benchmark name.。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
  - id: wildchat_1m
    label: WildChat-1M 真实用户对话
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: rule_filters
    label: |-
      查询 10-3000 tokens
      最多 5 轮 / 仅英语 / 去毒性
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: semantic_dedup
    label: |-
      SBERT 语义去重
      移除余弦相似度 > 0.9
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: device_dedup
