ize="11" x="0"><tspan>[ANSWER] 标签</tspan></text><text y="77" data-line-font-size="11" x="0"><tspan>模型无工具可用</tspan></text></g></g></g></g><g data-cell-id="10"><g><rect x="1960" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2060,327.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>生成自然语言响应</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>要求输出一个带标签选项</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>拒答选项记为未作答</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>各模型 API 使用同一协议</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="2240" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2340,327.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>论文答案解析器</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>先用正则提取 [ANSWER] 选项</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>正则失败时回退 Claude 2</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>解析字母与标准选项比较</tspan></text></g></g></g></g><g data-cell-id="12"><g><rect x="2520" y="304" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight