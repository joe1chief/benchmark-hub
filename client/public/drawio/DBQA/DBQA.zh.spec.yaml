meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench DbQA 构建与评测流程
  description: 按论文还原生物数据库问答的程序化构建、公开-私留划分和零样本基线评测。
  legend: DbQA 是 LAB-Bench 的数据库子集；论文中的 35% 是人类评测覆盖率，并非公开比例。
nodes:
  - id: evidence
    label: |-
      LAB-Bench · DbQA 子集
      arXiv:2407.10362v3
      官方仓库 @ 998a8e0
      已消歧名称与身份
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: source_versions
    label: |-
      固定版本的生物数据库来源
      DisGeNet / OMIM · Ensembl 110
      MSigDB 2023.2 · miRDB 6.0
      GTRD · ClinVar / ProteinGym
      MGI/MouseMine · P-HIPSter/Enrichr
    type: database
    size: xl
    position:
      x: 40
      'y': 320
  - id: subtasks
    label: |-
      定义 10 个程序化子任务
      疾病关联 · 基因位置
      miRNA 靶点 · 肿瘤 / 致癌
      TFBS · 变异任务（两类）
      疫苗反应 · 病毒 PPI
    type: process
    size: xl
    position:
      x: 320
      'y': 320
  - id: generate
    label: |-
      生成数据库有据问题
      题干写明来源或证据级别
      推导一个可归属的正确答案
      保留版本级溯源
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: distractors
    label: |-
      构造高难干扰项
      集合差 · 蛋白编码基因补集
      同一染色体不同细胞遗传带
      同一序列上
      ClinVar 相反类别
    type: process
    size: xl
    position:
      x: 880
      'y': 320
  - id: full
    label: |-
      论文完整 DbQA
      650 道问题
      10 个数据库检索子任务
      可归属的多选答案
    type: database
    size: xl
    position:
      x: 1160
      'y': 320
  - id: split
    label: |-
      公开 / 私留 @ 998a8e0
      520 道公开 · 130 道私留
      80% / 20%
      35% = 人类覆盖率
      不是公开比例
    type: database
    size: xl
    position:
      x: 1440
      'y': 320
  - id: prompt
    label: |-
      论文基线提示
      随机排列选项
      + 信息不足选项
      零样本思维链
      [ANSWER] 标签
      模型无工具可用
    type: document
    size: xl
    position:
      x: 1720
      'y': 320
  - id: baseline
    label: |-
      生成自然语言响应
      要求输出一个带标签选项
      拒答选项记为未作答
      各模型 API 使用同一协议
    type: process
    size: xl
    position:
      x: 2000
      'y': 320
  - id: parse
    label: |-
      论文答案解析器
      先用正则提取 [ANSWER] 选项
      正则失败时回退 Claude 2
      解析字母与标准选项比较
    type: process
    size: xl
    position:
      x: 2280
      'y': 320
  - id: metrics
    label: |-
      DbQA 指标
      准确率 = 正确数 / 总题数
      精确率 = 正确数 / 作答数
      覆盖率 = 作答数 / 总题数
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 320
edges:
  - from: evidence
    to: source_versions
    type: data
  - from: source_versions
    to: subtasks
    type: primary
  - from: subtasks
    to: generate
    type: primary
  - from: generate
    to: distractors
    type: primary
  - from: distractors
    to: full
    type: primary
  - from: full
    to: split
    type: primary
  - from: split
    to: prompt
    type: primary
  - from: prompt
    to: baseline
    type: primary
  - from: baseline
    to: parse
    type: primary
  - from: parse
    to: metrics
    type: primary
modules: []
