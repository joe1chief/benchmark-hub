meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench DbQA 构建流程
  description: 对齐论文的 LAB-Bench 数据库问答子集程序化构建与评测流程，共含 650 道题。
  legend: 实线箭头表示数据库溯源任务生成、多选题组装、零样本评测、答案解析与指标计算。
nodes:
  - id: sources
    label: |-
      带版本的生物学数据库
      OMIM · DisGeNET · Ensembl · MSigDB
      miRDB · GTRD · ClinVar 等
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: subtasks
    label: |-
      定义 10 类检索子任务
      关联 · 位置 · 靶点 · 变异
      特征集 · 响应 · 病毒相互作用
    type: document
    size: xl
    position:
      x: 300
      'y': 210
  - id: generate
    label: |-
      程序化生成问题
      从指定来源推导正确答案
    type: process
    size: xl
    position:
      x: 560
      'y': 210
  - id: distractors
    label: |-
      构造高难干扰项
      集合差 · 相邻位点 · 同类实体
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: disambiguate
    label: |-
      明确数据溯源
      标注数据库版本和证据等级
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: benchmark
    label: |-
      DbQA 子集
      650 题 · 10 子任务 · 35% 公开
    type: database
    size: xl
    position:
      x: 1340
      'y': 210
  - id: prompt
    label: |-
      组装多选提示
      打乱选项 + “信息不足”选项
    type: document
    size: xl
    position:
      x: 1600
      'y': 210
  - id: run
    label: |-
      零样本思维链运行
      论文基线不提供工具增强
    type: process
    size: xl
    position:
      x: 1860
      'y': 210
  - id: parse
    label: |-
      解析答案标签
      正则优先 · Claude 2 兜底
    type: process
    size: xl
    position:
      x: 2120
      'y': 210
  - id: metrics
    label: |-
      准确率 · 精确率 · 作答覆盖率
      与生物学专家基线比较
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 210
edges:
  - from: sources
    to: subtasks
    type: primary
  - from: subtasks
    to: generate
    type: primary
  - from: generate
    to: distractors
    type: primary
  - from: distractors
    to: disambiguate
    type: primary
  - from: disambiguate
    to: benchmark
    type: primary
  - from: benchmark
    to: prompt
    type: primary
  - from: prompt
    to: run
    type: primary
  - from: run
    to: parse
    type: primary
  - from: parse
    to: metrics
    type: primary
modules: []
