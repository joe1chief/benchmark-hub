meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KORBench Build Process
  description: >-
    Paper-aligned KOR-Bench construction through manual rule design, rule-driven Q&A design, iterative human and LLM
    validation, and format-aware exact evaluation over five knowledge-orthogonal reasoning categories.
  legend: >-
    The official release contains 25 rules and 250 questions in each of five categories: 125 rules and 1,250 questions
    in total, with ten questions per rule.
nodes:
  - id: sources
    label: |-
      Gather Rule Sources
      Logic Puzzles and Puzzle Websites
      Textbooks · Domain Knowledge
      Prior Knowledge and Virtual Worlds
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: extract
    label: |-
      Extract Core Rules Manually
      Natural-language Rule Descriptions
      Five Categories · 25 Rules Each
      Operation · Logic · Cipher · Puzzle · CF
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: redefine
    label: |-
      Redefine for Knowledge Orthogonality
      New Symbols · Concepts · Constraints
      Adjust Execution Steps
      Introduce Novel Story Contexts
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: qa
    label: |-
      Design Rule-driven Q&A
      Adapt Existing Questions and Answers
      Manually Craft Counterfactual Items
      Programmatically Generate Cipher Items
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: formats
    label: |-
      Specify Exact Answer Formats
      NR Numerical · ME Mathematical
      TR Text · MC Multiple Choice
      SD Structured Data
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: human
    label: |-
      Human Quality Verification
      Inspect Every Rule and Q&A Pair
      Check Correctness and Clarity
      Repair Invalid or Ambiguous Items
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: llm
    label: |-
      LLM Difficulty Verification
      Measure Difficulty and Discrimination
      Flag Universally Wrong Tasks
      Flag Universally Correct or Leaked Tasks
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: revise
    label: |-
      Iteratively Revise Flagged Data
      Clarify Excessively Difficult Rules
      Strengthen Overly Simple Questions
      Re-run Human and Model Checks
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: dataset
    label: |-
      Release KOR-Bench · 1,250
      125 Rules · 10 Questions per Rule
      Five Balanced 250-question Categories
      Rule + Question + Gold Answer
    type: database
    size: xl
    position:
      x: 860
      'y': 380
  - id: prompt
    label: |-
      Run Rule-conditioned Inference
      Supply New Rule and Driven Question
      Category-specific Zero-shot Prompt
      Three-shot and Analysis Variants
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: parse
    label: |-
      Parse and Normalize Response
      Extract [[Answer]] or Boxed Output
      Apply Format- and Rule-specific Logic
      Compare Math, Text, Choice, or Structure
    type: process
    size: xl
    position:
      x: 300
      'y': 380
  - id: metric
    label: |-
      Report Exact Accuracy
      Correct Count over 1,250 Questions
      Overall and Five-category Scores
      Additional Mixed-task Pass Rate
    type: terminal
    size: xl
    position:
      x: 20
      'y': 380
