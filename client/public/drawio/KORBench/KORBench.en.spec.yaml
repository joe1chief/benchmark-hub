  layout: horizontal
  routing: orthogonal
  title: KOR-Bench Build Process
  description: >-
    Paper-aligned KOR-Bench construction and evaluation: manually design knowledge-orthogonal rules, create and
    iteratively validate rule-driven questions, then evaluate format-aware exact answers while keeping the paper's
    optional compositional analyses separate from the 1,250-question core benchmark.
  legend: >-
    Solid arrows trace the core benchmark. Dashed arrows mark the fixed evidence, repair loop, public-artifact boundary,
    and optional Multi-Q / Multi-R / Multi-RQ analysis branch.
