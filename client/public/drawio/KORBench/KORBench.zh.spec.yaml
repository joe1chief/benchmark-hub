meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KOR-Bench 构建流程
  description: 对齐论文的 KOR-Bench 构建与评测流程：人工设计知识正交规则，构造规则驱动问题并进行人机迭代质检， 再以格式感知的精确匹配完成核心评测，同时把论文中的可选组合分析与 1,250 题核心基准明确分开。
  legend: 实线表示核心基准流程；虚线表示固定证据、修订回路、公开制品边界以及可选的 Multi-Q / Multi-R / Multi-RQ 分析旁路。
nodes:
  - id: evidence
    label: |-
      主要证据与固定快照
      ICLR 2025 正式版
      OpenReview SVRRQ8goQo
      arXiv:2410.06526v3
      Git bb8194d · 公开数据 / 评测代码
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      汇集候选规则来源
      逻辑谜题与谜题网站
      书籍 · 领域知识
      虚拟世界规则系统
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: extract
    label: |-
      人工设计核心规则
      五个类别 · 每类 25 条规则
      运算 · 逻辑 · 密码
      谜题 · 反事实
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: redefine
    label: |-
      将规则改造为知识正交
      重定义符号与概念
      修改约束与执行步骤
      替换为全新故事背景
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: qa
    label: |-
      构建规则驱动问答
      按新规则改写问题
      人工编写反事实题
      程序化生成密码题
      每条规则十道题
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: formats
    label: |-
      指定五种答案格式
      NR 数值 · ME 数学表达式
      TR 文本 · MC 选择题
      SD 结构化数据
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: human
    label: |-
      人工质量核验
      检查每条规则与问答对
      核对正确性与清晰度
      修复无效或歧义条目
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: llm
    label: |-
      大模型难度 / 区分度核验
      探测规则与问题难度
      识别过难或过易条目
      将标记项送回修订
    type: process
    size: xl
    position:
      x: 1980
      'y': 40
  - id: revise
    label: |-
      迭代修订被标记数据
      澄清困难规则
      增强过于简单的问题
      重新执行人工 + 模型检查
    type: process
    size: xl
    position:
      x: 1700
      'y': 360
  - id: dataset
    label: |-
      发布核心 KOR-Bench · 1,250 题
      125 条规则 · 每条十题
      五个类别 × 各 250 题
      规则 + 问题 + 标准答案
    type: database
    size: xl
    position:
      x: 2260
      'y': 40
  - id: artifact_boundary
    label: |-
      公开制品边界
      Git bb8194d：数据 + 评测代码
      核心：125 条规则 / 1,250 题
      可选组合分析保持独立
      提供官方排行榜
    type: document
    size: xl
    position:
      x: 2540
      'y': 40
  - id: prompt
    label: |-
      执行规则条件推理
      Chat 模型：分类别零样本提示
      Base 模型：使用相同提示
      + 每条规则 3 个通用问答样例
    type: process
    size: xl
    position:
      x: 2540
      'y': 360
  - id: parse
    label: |-
      解析并归一化回答
      回退顺序：[[...]] → boxed → [...]
      规则专用归一化
      SymPy + LaTeX 处理
    type: process
    size: xl
    position:
      x: 2260
      'y': 360
  - id: metric
    label: |-
      汇报核心精确准确率
      总体 + 五类别准确率
      反事实真实生活答案率
      真实生活答案率越低越好
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 360
  - id: optional_tasks
    label: |-
      可选组合分析
      Multi-Q · Multi-R · Multi-RQ
      复杂规则 / 问题组合
      不属于核心 1,250 题得分
    type: database
    size: xl
    position:
      x: 2260
      'y': 680
  - id: optional_metric
    label: |-
      单独汇报可选分析
      精确准确率
      全部子问题通过率
      不混入核心准确率
    type: terminal
    size: xl
    position:
      x: 1980
      'y': 680
edges:
  - from: evidence
    to: sources
    type: data
  - from: sources
    to: extract
    type: primary
  - from: extract
    to: redefine
    type: primary
  - from: redefine
    to: qa
    type: primary
  - from: qa
    to: formats
    type: primary
  - from: formats
    to: human
    type: primary
  - from: human
    to: llm
    type: primary
  - from: llm
    to: dataset
    type: primary
  - from: llm
    to: revise
    type: data
  - from: revise
    to: human
    type: data
  - from: dataset
    to: artifact_boundary
    type: data
  - from: dataset
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: metric
    type: primary
  - from: dataset
    to: optional_tasks
    type: data
  - from: optional_tasks
    to: optional_metric
    type: data
modules: []
