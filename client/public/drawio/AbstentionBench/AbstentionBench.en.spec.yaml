meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AbstentionBench Build and Evaluation Process
  description: >-
    Paper-aligned candidate screening, fixed-size normalization, six-scenario construction, and conditional abstention
    judging.
  legend: >-
    The suite combines 16 selected datasets, three copied-and-context-removed variants, and UMWP. Correctness is judged
    only for a non-abstaining response with an available reference answer; the judge audit used 300 responses.
nodes:
  - id: candidate_search
    label: |-
      Search Candidate Datasets
      183 candidates • review 82 resources
    type: process
    size: xl
    position:
      x: 40
      'y': 40
  - id: selection
    label: |-
      Dataset Selection Gate
      Publicly available data
      License permits redistribution
    type: process
    size: xl
    position:
      x: 280
      'y': 40
  - id: general_datasets
    label: |-
      General-Domain Suite
      Retain 16 datasets
    type: database
    size: xl
    position:
      x: 520
      'y': 40
  - id: reasoning_sources
    label: |-
      Reasoning Sources
      GPQA • GSM8K • MMLU-Math
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: abstain_variants
    label: |-
      Build 3 -Abstain Variants
      Copy answerable source items
      Remove answer-enabling context
    type: process
    size: xl
    position:
      x: 280
      'y': 240
  - id: umwp
    label: |-
      UMWP
      Unanswerable math problems
    type: database
    size: xl
    position:
      x: 280
      'y': 440
  - id: normalize
    label: |-
      Fixed Uniform Sampling
      Normalize each component
      to at most 3,500 questions
    type: process
    size: xl
    position:
      x: 760
      'y': 240
  - id: scenarios
    label: |-
      Assign 6 Scenarios
      Answerable / unanswerable
      Reference availability varies
    type: process
    size: xl
    position:
      x: 1000
      'y': 240
  - id: release
    label: |-
      AbstentionBench
      16 + 3 + 1 = 20 datasets
      >35,000 unanswerable questions
    type: database
    size: xl
    position:
      x: 1240
      'y': 240
  - id: inference
    label: |-
      Target-Model Response
      Question + generated answer
    type: process
    size: xl
    position:
      x: 1480
      'y': 240
  - id: judge_validation
    label: |-
      Abstention-Judge Audit
      300 human-annotated responses
