meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AbstentionBench Build and Evaluation Process
  description: >-
    Paper-aligned systematic dataset selection, construction of underspecified reasoning variants, six-scenario
    grouping, human-validated LLM judging, and abstention/correctness metrics.
  legend: >-
    The top row builds the 20-dataset suite; the bottom row reads right-to-left through inference, two judging stages,
    and metric aggregation.
nodes:
  - id: search
    label: |-
      Systematic Dataset Search
      Abstention, Refusal, and Uncertainty Resources
      Shortlist 82 Candidate Datasets
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: review
    label: |-
      Author Review and Selection
      Retain Samples Where Abstention Is Desirable
      Select 16 General-Domain Datasets
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: variants
    label: |-
      Build 3 Reasoning Variants
      GPQA-Diamond • GSM8K • MMLU-Math
      Duplicate, Then Remove Context before the Final Question
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: add_umwp
    label: |-
      Add UMWP
      Existing Unanswerable Math Word Problems
      Combine with the 16 Selected + 3 Constructed Sets
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: scenarios
    label: |-
      Group into 6 Abstention Scenarios
      Unknown • False Premise • Stale • Subjective
      Underspecified Context • Underspecified Intent
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      AbstentionBench
      20 Datasets • More Than 35,000 Unanswerable Questions
      Full Suite + Fast Subset of at Most 100 per Dataset
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: labels
    label: |-
      Evaluation Records
      Question + Desired-Abstention Label
      Ground-Truth Answer Where Available
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: inference
    label: |-
      Target-Model Inference
      Default Maximum 4,000 Tokens
      Temperature 0.8 unless Otherwise Specified
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: abstention_judge
    label: |-
      Llama 3.1 8B Instruct Abstention Judge
      Question + Response → Yes / No
      88% Accuracy on Manually Annotated Responses
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness_judge
    label: |-
      Llama 3.1 8B Instruct Correctness Judge
      Score Non-Abstention Responses against References
      Applied Where Ground-Truth Answers Exist
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Evaluation Metrics
      Primary: Abstention Recall
      Abstention Precision + F1 • Response Accuracy
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      AbstentionBench Results
      Aggregate by Dataset and Six Scenarios
      Compare Instruct, Reasoning, Scale, and Prompt Interventions
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
