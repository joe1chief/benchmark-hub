      Is a reference available?
    type: decision
    size: xl
    position:
      x: 1960
      'y': 240
  - id: correctness_judge
    label: |-
      Correctness Judge
      Compare answer with reference
    type: process
    size: xl
    position:
      x: 2200
      'y': 80
  - id: metrics
    label: |-
      Compute Metrics
      Recall • precision
      F1 • accuracy
    type: process
    size: xl
    position:
      x: 2440
      'y': 240
  - id: report
    label: |-
      Report Results
      Aggregate by dataset
      and scenario
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 240
