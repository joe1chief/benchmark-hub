meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedMCQA 论文与发布代码流程
  description: 对齐论文展示收集、清洗、防泄漏考试划分、判别式阅读器评测与盲测提交，并将固定版仓库的复现缺口单独标示。
  legend: 实线表示论文报告的构建或评测路径；虚线表示剔除、来源与权利边界、固定代码漂移，或无法直接执行的公开测试路径。
nodes:
  - id: evidence
    label: |-
      证据与版本固定点
      PMLR 174 / arXiv:2203.14371v1
      代码 c59ef14 · 压缩包哈希 16c1fbc6f47d
      审计日期 2026-07-21
    type: document
    size: xl
    position:
      x: 20
      'y': 180
  - id: sources
    label: |-
      收集医学考试来源
      专业人员模拟题 + 在线测试系列
      AIIMS PG：1991 年至今
      NEET PG：2001 年至今
    type: database
    size: xl
    position:
      x: 300
      'y': 180
  - id: collect
    label: |-
      形成原始选择题记录
      ID · 问题 · 四个选项
      正确选项 · 解析
      学科 · 主题 · 选择类型
    type: process
    size: xl
    position:
      x: 580
      'y': 180
  - id: text_gate
    label: |-
      是否有四个候选位置？
      是否有有效答案键？
      候选均非缺失或空值？
      是否仅凭文本即可作答？
    type: decision
    size: xl
    style:
      fontSize: 9
    position:
      x: 860
      'y': 180
  - id: keyword_gate
    label: |-
      是否命中人工剔除词？
      equation · India · graph · map 等
    type: decision
    size: xl
    position:
      x: 1140
      'y': 180
  - id: exclude
    label: |-
      剔除原始题目
      格式错误或候选缺失
      依赖图片 / 表格 / 外部信息
    type: loss
    size: xl
    position:
      x: 1420
      'y': 20
  - id: cleanup
    label: |-
      启发式文本清洗
      解析 HTML · 符号
      URL · 空白
      修复选项格式
      与拼写
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1420
      'y': 180
  - id: proofread
    label: |-
      人工监督校对
      Grammarly 检查
      问题 · 选项 · 解析
      由人类选择
      适当建议
    type: user
    size: xl
    style:
      fontSize: 9
    position:
      x: 1700
      'y': 180
  - id: dedupe
    label: |-
      删除重复题
      最终语料：193,155 题
      21 个学科 · 约 2,400 个主题
    type: database
    size: xl
    position:
      x: 1980
      'y': 180
  - id: exam_split
    label: |-
      按来源考试划分
      训练：模拟 + 在线 182,822
      开发：NEET PG 4,183
      测试：AIIMS PG 6,150
      图表/压缩包总计 193,155
      摘要称 >194K
      正文/README 对调开发与测试
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 180
  - id: leakage
    label: |-
      跨分区泄漏防护
      对问题两两计算 Levenshtein
      相似度 > .9 则删除开发/测试题
    type: process
    size: xl
    position:
      x: 2540
      'y': 180
  - id: release
    label: |-
      MedMCQA 公开压缩包
      训练 182,822 · 开发 4,183 · 测试 6,150
      公开测试集不含 cop 与 exp
      测试标准答案保持私有
    type: database
    size: xl
    position:
      x: 2820
      'y': 180
  - id: construction_gap
    label: |-
      未披露的构建边界
      网站 / 书目 / 完整词表缺失
      无构建 / 去重 / 划分脚本
      抽样 / 裁决规则未披露
      论文内部歧义：
      缺失选项既称剔除又称修复
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 460
  - id: rights
    label: |-
      发布 / 权利边界
      Saama AI Research
      无需伦理审查
      仓库采用 MIT
      压缩包无内嵌许可证
      抓取题目权利未披露
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3100
      'y': 180
  - id: repo_eval_drift
    label: |-
      固定版仓库漂移
      压缩包 JSONL ≠ 代码 CSV；无适配器
      无检索器；问题与选项同段
      exp 为配对文本
      最小验证损失 ≠ 最高分；耐心2
      长192 · 丢弃.4 · 种子42
    type: loss
    size: xl
    position:
      x: 3100
      'y': 420
  - id: eval_route
    label: |-
      运行论文模型研究，还是
      当前公开盲测提交？
    type: decision
    size: xl
    position:
      x: 2820
      'y': 680
  - id: context_gate
    label: |-
      论文实验是否使用
      外部知识上下文？
    type: decision
    size: xl
    position:
      x: 2540
      'y': 580
  - id: retriever
    label: |-
      检索最高余弦段落
      DPR + 维基百科
      或 PubMedBERT + PubMed
      PubMed 段落
      截断至 250 词元
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 420
  - id: reader
    label: |-
      论文阅读器 · 每题四条序列
      BERT · SciBERT
      BioBERT · PubMedBERT
      有上下文：[CLS] C [SEP]
      Q [SEP] O [SEP]
      无上下文：[CLS] Q [SEP] O [SEP]
      无生成式提示 / 解析器
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 680
  - id: train
    label: |-
      微调论文阅读器
      2 张 Tesla T4 · 5 轮
      学习率 2e-4 · 批量 16
    type: process
    size: xl
    position:
      x: 1980
      'y': 680
  - id: checkpoint
    label: |-
      论文检查点选择
      五轮中取验证分数
      最高的检查点
    type: process
    size: xl
    position:
      x: 1700
      'y': 680
  - id: argmax
    label: |-
      线性层 + Softmax
      对四个选项分数取 Argmax
      输出 1–4 的选项序号
    type: process
    size: xl
    position:
      x: 1420
      'y': 680
  - id: accuracy
    label: |-
      论文准确率
      正确预测数 / 全部有标签记录数
      总体 + 分学科
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 680
  - id: public_test
    label: |-
      对盲测集运行推理
      6,150 个 ID + 问题 + 选项
      不公开正确选项或解析
    type: document
    size: xl
    position:
      x: 2540
      'y': 920
  - id: submission
    label: |-
      生成官方提交 CSV
      列：id + Prediction (correct option)
      预测必须是 1–4 的整数
      通过 Google 表单上传
    type: process
    size: xl
    position:
      x: 2260
      'y': 920
  - id: external_score
    label: |-
      官方外部计分
      私有标答测试准确率
      缺失预测规则
      计分分母规则
      均未披露
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 920
  - id: leaderboard
    label: |-
      官方主页排行榜
      含上下文 + 无上下文
      公开展示提交结果
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 920
  - id: code_label_gate
    label: |-
      固定代码能否读取
      转为 CSV 的副本，
      其中有 cop，且上下文模式
      还具有 exp？
    type: decision
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 1160
  - id: code_failure
    label: |-
      公开测试代码路径失败
      压缩包 JSONL；代码 pd.read_csv
      无适配器
      转换后仍要求 cop - 1
      train.py 先测试后导出
      公开测试无 cop 或 exp
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 1080
  - id: code_labeled_path
    label: |-
      转换后的有标签副本路径
      先将压缩包转为 CSV
      dataset.py 将 cop 转为零基标签
      模型 Argmax；写出时 +1
      固定仓库漂移仍适用
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 1320
edges:
  - from: evidence
    to: sources
    type: primary
  - from: sources
    to: collect
    type: primary
  - from: collect
    to: text_gate
    type: primary
  - from: text_gate
    to: keyword_gate
    type: primary
    label: 是
    labelPosition: end
  - from: text_gate
    to: exclude
    type: optional
    label: 否
    labelPosition: end
  - from: keyword_gate
    to: exclude
    type: optional
    label: 是：剔除
    labelPosition: end
  - from: keyword_gate
    to: cleanup
    type: primary
    label: 否
    labelPosition: end
  - from: cleanup
    to: proofread
    type: primary
  - from: proofread
    to: dedupe
    type: primary
  - from: dedupe
    to: exam_split
    type: primary
  - from: exam_split
    to: leakage
    type: primary
  - from: leakage
    to: release
    type: primary
  - from: evidence
    to: construction_gap
    type: optional
    label: 证据边界
    labelPosition: end
  - from: release
    to: rights
    type: optional
  - from: release
    to: repo_eval_drift
    type: optional
    label: 固定代码审计
    labelPosition: end
  - from: release
    to: eval_route
    type: primary
  - from: eval_route
    to: context_gate
    type: primary
    label: 论文研究
    labelPosition: end
  - from: context_gate
    to: retriever
    type: primary
    label: 有上下文
    labelPosition: end
  - from: context_gate
    to: reader
    type: primary
    label: 无上下文
    labelPosition: end
  - from: retriever
    to: reader
    type: primary
  - from: reader
    to: train
    type: primary
  - from: train
    to: checkpoint
    type: primary
  - from: checkpoint
    to: argmax
    type: primary
  - from: argmax
    to: accuracy
    type: primary
  - from: eval_route
    to: public_test
    type: primary
    label: 公开盲测
    labelPosition: end
  - from: public_test
    to: submission
    type: primary
  - from: submission
    to: external_score
    type: primary
  - from: external_score
    to: leaderboard
    type: primary
  - from: public_test
    to: code_label_gate
    type: optional
    label: 固定代码检查
    labelPosition: end
    waypoints:
      - x: 2660
        'y': 1080
      - x: 2380
        'y': 1080
  - from: code_label_gate
    to: code_labeled_path
    type: primary
    label: 是：私有/有标签副本
    labelPosition: end
  - from: code_label_gate
    to: code_failure
    type: optional
    label: 否：公开压缩包
    labelPosition: end
modules: []
