meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedMCQA Paper and Released-Code Process
  description: >-
    Paper-aligned collection, cleaning, leakage-controlled exam splitting, discriminative reader evaluation, and blind
    test submission, with fixed-repository reproduction gaps kept separate.
  legend: >-
    Solid arrows show reported construction or evaluation paths. Dashed arrows show exclusions, provenance and rights
    boundaries, fixed-code drift, or an unrecoverable public-test path.
nodes:
  - id: evidence
    label: |-
      Evidence and Version Pins
      PMLR 174 / arXiv:2203.14371v1
      Git c59ef14 · Archive SHA 16c1fbc6f47d
      Audited 2026-07-21
    type: document
    size: xl
    position:
      x: 20
      'y': 180
  - id: sources
    label: |-
      Collect Medical Exam Sources
      Professional Mock + Online Test Series
      AIIMS PG: 1991–present
      NEET PG: 2001–present
    type: database
    size: xl
    position:
      x: 300
      'y': 180
  - id: collect
    label: |-
      Form Raw MCQ Records
      ID · Question · Four Options
      Correct Option(s) · Explanation
      Subject · Topic · Choice Type
    type: process
    size: xl
    position:
      x: 580
      'y': 180
  - id: text_gate
    label: |-
      Four Candidate Slots?
      Valid Answer Key?
      No Missing / Null Candidate?
      Text-only and Self-contained?
    type: decision
    size: xl
    style:
      fontSize: 9
    position:
      x: 860
      'y': 180
  - id: keyword_gate
    label: |-
      Contains a Curated Removal Term?
      equation · India · graph · map · etc.
    type: decision
    size: xl
    position:
      x: 1140
      'y': 180
  - id: exclude
    label: |-
      Exclude Raw Item
      Malformed or Missing Candidate
      Image / Table / External Dependency
    type: loss
    size: xl
    position:
      x: 1420
      'y': 20
  - id: cleanup
    label: |-
      Heuristic Text Cleanup
      Parse HTML · Symbols
      URLs · Whitespace
      Repair Option Formatting
      and Spelling
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1420
      'y': 180
  - id: proofread
    label: |-
      Supervised Proofreading
      Grammarly Reviews
      Question · Options · Explanation
      Human Selects
      Appropriate Suggestions
    type: user
    size: xl
    style:
      fontSize: 9
    position:
      x: 1700
      'y': 180
  - id: dedupe
    label: |-
      Remove Duplicate Questions
      Final Corpus: 193,155
      21 Subjects · About 2,400 Topics
    type: database
    size: xl
    position:
      x: 1980
      'y': 180
  - id: exam_split
    label: |-
      Split by Source Exam
      Train: Mock + Online 182,822
      Dev: NEET PG 4,183
      Test: AIIMS PG 6,150
      Table/Archive Total 193,155
      Abstract Claims >194K
      Prose/README Swap Dev/Test
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 180
  - id: leakage
    label: |-
      Cross-split Leakage Guard
      Pairwise Levenshtein over Questions
      Remove Dev/Test Item if Similarity > .9
    type: process
    size: xl
    position:
      x: 2540
      'y': 180
  - id: release
    label: |-
      Public MedMCQA Archive
      Train 182,822 · Dev 4,183 · Test 6,150
      Public Test Omits cop + exp
      Test Ground Truth Remains Private
    type: database
    size: xl
    position:
      x: 2820
      'y': 180
  - id: construction_gap
    label: |-
      Undisclosed Build Boundary
      Sites / Books / Full Keywords Absent
      No Build / Dedup / Split Scripts
      Sampling / Adjudication Unreported
      Paper Ambiguity:
      Missing Options Omitted vs Corrected
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 460
  - id: rights
    label: |-
      Release / Rights Boundary
      Saama AI Research
      IRB Not Required
      Repository MIT
      Archive: No Embedded License
      Scraped-question Rights Unreported
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3100
      'y': 180
  - id: repo_eval_drift
    label: |-
      Fixed Repository Drift
      Archive JSONL ≠ Code CSV; No Adapter
      No Retriever; Q+O Share Segment
      exp Is Paired Text
      min val_loss ≠ Highest Score; Patience 2
      len192 · drop.4 · seed42
    type: loss
    size: xl
    position:
      x: 3100
      'y': 420
  - id: eval_route
    label: |-
      Paper Model Study or
      Current Blind-test Submission?
    type: decision
    size: xl
    position:
      x: 2820
      'y': 680
  - id: context_gate
    label: |-
      Use External Knowledge
      Context in the Paper Study?
    type: decision
    size: xl
    position:
      x: 2540
      'y': 580
  - id: retriever
    label: |-
      Retrieve Top Cosine Passage
      DPR + Wikipedia
      or PubMedBERT + PubMed
      PubMed Passages
      Truncated to 250 Tokens
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 420
  - id: reader
    label: |-
      Paper Reader · Four Sequences
      BERT · SciBERT
      BioBERT · PubMedBERT
      Context: [CLS] C [SEP]
      Q [SEP] O [SEP]
      No Context: [CLS] Q [SEP] O [SEP]
      No Generative Prompt / Parser
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 680
  - id: train
    label: |-
      Fine-tune Paper Reader
      2 Tesla T4 · 5 Epochs
      Learning Rate 2e-4 · Batch 16
    type: process
    size: xl
    position:
      x: 1980
      'y': 680
  - id: checkpoint
    label: |-
      Paper Checkpoint Selection
      Highest Validation Score
      across Five Epochs
    type: process
    size: xl
    position:
      x: 1700
      'y': 680
  - id: argmax
    label: |-
      Linear Layer + Softmax
      Argmax over Four Option Scores
      Emit Option Index 1–4
    type: process
    size: xl
    position:
      x: 1420
      'y': 680
  - id: accuracy
    label: |-
      Paper Accuracy
      Correct Predictions / All Labeled Rows
      Overall + Subject-wise
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 680
  - id: public_test
    label: |-
      Run Inference on Blind Test
      6,150 IDs + Questions + Options
      No Public Correct Option or Explanation
    type: document
    size: xl
    position:
      x: 2540
      'y': 920
  - id: submission
    label: |-
      Build Official Submission CSV
      Columns: id + Prediction (correct option)
      Predictions Must Be Integers 1–4
      Upload through Google Form
    type: process
    size: xl
    position:
      x: 2260
      'y': 920
  - id: external_score
    label: |-
      Official External Scoring
      Private-gold Test Accuracy
      Missing-prediction Rules
      Denominator Rules
      Not Disclosed
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 920
  - id: leaderboard
    label: |-
      Official Homepage Leaderboards
      With Context + Without Context
      Public Submission Results
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 920
  - id: code_label_gate
    label: |-
      Can Fixed Code Read
      a CSV-converted Copy
      with cop and, if Context,
      exp?
    type: decision
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 1160
  - id: code_failure
    label: |-
      Public-test Code Fails
      Archive JSONL; Code pd.read_csv
      No Adapter
      After Conversion, cop - 1 Required
      train.py Tests before Prediction
      Public Test Has No cop or exp
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 1080
  - id: code_labeled_path
    label: |-
      Converted Labeled-copy Path
      Convert Archive to CSV
      dataset.py Maps cop → Zero-based
      Model Argmax; Writer Restores +1
      Repository Drift Still Applies
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 1320
