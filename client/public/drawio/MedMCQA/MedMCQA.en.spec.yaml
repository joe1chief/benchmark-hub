meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedMCQA Build Process
  description: >-
    Paper-aligned MedMCQA workflow: medical-professional mock tests plus official AIIMS and NEET PG questions are
    filtered for text-only four-option quality, cleaned with heuristic and supervised proofreading, deduplicated, split
    by exam with a 0.9 similarity leakage guard, and evaluated on 193,155 questions using accuracy.
  legend: Solid arrows show data collection, text-only quality filtering, exam-based leakage-safe splitting, and evaluation.
nodes:
  - id: sources
    label: |-
      Medical Exam Sources
      Professional Mock / Online Test Series
      Official AIIMS + NEET PG (1991-present)
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: collect
    label: |-
      Collect MCQ Records
      ID + Question + Four Options
      Correct Answer(s) + Explanation
    type: process
    size: xl
    position:
      x: 320
      'y': 240
  - id: text_filter
    label: |-
      Text-only Answerability Filter
      Require Four Options + Best Answer
      Remove Image / Table / External-info Items
    type: process
    size: xl
    position:
      x: 600
      'y': 240
  - id: heuristic_clean
    label: |-
      Heuristic Cleanup
      Remove Curated Keywords
      Parse HTML / Symbols / URLs / Whitespace
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: proofread
    label: |-
      Supervised Proofreading
      Grammar / Punctuation / Spelling
      Apply Grammarly Suggestions Manually
    type: user
    size: xl
    position:
      x: 1160
      'y': 240
  - id: dedupe
    label: |-
      Remove Duplicate Questions
      193,155 Final Records
      21 Subjects / about 2.4K Topics
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: exam_split
    label: |-
      Exam-based Split
      Train: Mock + Online Series
      Dev: NEET PG / Test: AIIMS PG
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: leakage
    label: |-
      Leakage Guard
      Compute Pairwise Levenshtein
      Drop Dev/Test Similarity >0.9
    type: process
    size: xl
    position:
      x: 2000
      'y': 240
  - id: split
    label: |-
      Released Split
      Train 182,822 / Dev 4,183
      Test 6,150
    type: database
    size: xl
    position:
      x: 2280
      'y': 240
  - id: model
    label: |-
      Medical QA Model
      Read Question + Options
      Select Correct Option(s)
    type: process
    size: xl
    position:
      x: 2560
      'y': 240
  - id: metric
    label: |-
      Accuracy
      Overall + Subject-wise Results
    type: terminal
    size: large
    position:
      x: 2840
      'y': 240
edges:
  - from: sources
    to: collect
    type: primary
  - from: collect
    to: text_filter
    type: primary
  - from: text_filter
    to: heuristic_clean
    type: primary
  - from: heuristic_clean
    to: proofread
    type: primary
  - from: proofread
    to: dedupe
    type: primary
  - from: dedupe
    to: exam_split
    type: primary
  - from: exam_split
    to: leakage
    type: primary
  - from: leakage
    to: split
    type: primary
  - from: split
    to: model
    type: primary
  - from: model
    to: metric
    type: primary
modules: []
