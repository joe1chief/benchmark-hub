      HuggingFace ROUGE-1
      / ROUGE-2 / ROUGE-L
      No Stemming or Lemmatization
      BERTScore against Gold
      Citation Text
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 20
  - id: transfer
    label: |-
      Cross-dataset Transfer
      *led-base-[X] Training Setup
      In-domain vs Cross-dataset Results
    type: process
    size: xl
    position:
      x: 2460
      'y': 190
  - id: discourse
    label: |-
      Citation Discourse Analysis
      ACL-ARC Intent + CORWA Functions
      Compare with KL Divergence
    type: process
    size: xl
    position:
      x: 2460
      'y': 360
  - id: human
    label: |-
      Human Evaluation: 3 Annotators
      150 Outputs • XING + CHEN Delve
      5-point Readability + Consistency
      25 × 3 Model Types × 2 Datasets
    type: user
    size: xl
    position:
      x: 2460
      'y': 530
  - id: report
    label: |-
      Multi-dataset Benchmark Report
      Similarity • Transfer • Discourse
      Direct Human Judgment
    type: terminal
    size: xl
    position:
      x: 2780
      'y': 275
