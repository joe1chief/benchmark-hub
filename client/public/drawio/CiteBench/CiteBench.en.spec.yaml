    label: |-
      Collect Four Source Datasets
      ABURAED • CHEN • LU • XING
      CL, CS, and Multi-domain Papers
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: task
    label: |-
      Define Citation Text Generation
      Inputs: Cited Papers + Citing Paper Context
      Target: Original Citation Sentence or Span
    type: document
    size: xl
    position:
      x: 340
      'y': 220
  - id: transform
    label: |-
      Apply Source-specific Transformations
      Fetch and Rebuild Each Official Dataset
      Preserve Instances without Extra Filtering
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: schema
    label: |-
      Serialize a Common Tagged Input
      Cited Abstracts + ABS-tagged Citing Abstract
      CTX_B Before + CTX_A After Context
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: anchors
    label: |-
