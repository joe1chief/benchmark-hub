      ABURAED • CHEN (Delve + S2ORC)
      LU • XING
    type: database
    size: xl
    position:
      x: 40
      'y': 260
  - id: task
    label: |-
      Citation Text Generation
      n Cited Target Documents
      + Citing Source Document
      + Its Contexts
      Target: Original Citation Text
    type: document
    size: xl
    position:
      x: 340
      'y': 260
  - id: transform
    label: |-
      Source-specific Conversion
      Rebuild Each Official Dataset
      No Instance-level Filtering
    type: process
    size: xl
    position:
      x: 640
      'y': 260
  - id: schema
    label: |-
      Optional &lt;abs&gt;…&lt;/abs&gt;: Citing Abstract
      &lt;ctx_b&gt;…&lt;/ctx_b&gt;: Before-context
      Untagged Cited Abstracts
      &lt;ctx_a&gt;…&lt;/ctx_a&gt;: After-context
    type: process
    size: xl
    position:
      x: 940
      'y': 260
  - id: anchors
    label: |-
      Normalize Citation Anchors
      Target Documents: [0], [1], …
      Increment in Order
      Keep Mapping Consistent
      XING Others: #OTHEREFR
    type: process
    size: xl
    position:
      x: 1240
      'y': 260
  - id: splits
    label: |-
      Five Released Subsets
      Train 322,037 • Validation 23,016
      Test 13,712 • Total 358,765
    type: database
    size: xl
    position:
      x: 1540
      'y': 260
  - id: baselines
    label: |-
      Standardized Baselines
      LEAD • TextRank • LexRank
      LED Base / Large / Large-arXiv
      Direct Supervision + Source Transfer
    type: process
    size: xl
    position:
      x: 1840
      'y': 260
  - id: generation
    label: |-
      Generate Citation Text
      Unified Input + Original Target
      Joint or Dataset-specific Training
    type: process
    size: xl
    position:
      x: 2140
      'y': 260
  - id: metrics
