meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CiteBench Build Process
  description: >-
    EMNLP 2023-aligned CiteBench flow: ABURAED, CHEN, LU, and XING are converted without instance-level filtering into a
    unified citation-text generation format, then evaluated through standardized baselines and four independent analysis
    branches for similarity, transfer, discourse, and direct human judgment.
  legend: Solid arrows show dataset harmonization, generation, and the four evaluation branches disclosed in the paper.
