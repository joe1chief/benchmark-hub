      Map Target References to [0]
      Map Other References to #OTHEREFR
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: splits
    label: |-
      Publish Unified Data Splits
      Train 322,037 • Validation 23,016
      Test 13,712 • Total 358,765
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: baselines
    label: |-
      Train Standardized Baselines
      LexRank Extractive Baseline
      LED Directly Supervised Generation
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: generation
    label: |-
      Generate Citation Text
      Use the Unified Input and Target Format
      Compare Dataset-specific and Joint Training
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: metrics
    label: |-
      Score Text Similarity
      ROUGE-1 • ROUGE-2 • ROUGE-L
      BERTScore against Gold Citation Text
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 40
  - id: transfer
    label: |-
      Test Cross-dataset Transfer
      Train on One or Multiple Sources
      Evaluate In-domain and Out-of-domain Generalization
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: discourse
    label: |-
      Analyze Citation Discourse
      Citation Intent Classification
      CORWA-based Functional Diagnostics
    type: process
    size: xl
    position:
      x: 2440
      'y': 400
  - id: human
    label: |-
      Conduct Human Evaluation
      Judge Readability and Consistency
      Compare Generated and Gold Citation Text
    type: user
    size: xl
    position:
      x: 2740
      'y': 400
  - id: report
    label: |-
      Report a Multi-dataset Benchmark
      Aggregate Similarity, Transfer, and Discourse Results
      Expose Domain and Dataset Effects
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
