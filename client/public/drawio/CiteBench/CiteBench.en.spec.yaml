meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CiteBench Build Process
  description: >-
    Paper-aligned CiteBench flow: four citation-text datasets are mapped into one generation task, converted with
    source-specific scripts into a common tagged schema and normalized anchors, then evaluated with extractive and
    neural baselines, transfer experiments, automatic metrics, discourse diagnostics, and human judgments.
  legend: Solid arrows show dataset harmonization and evaluation; branches separate transfer, discourse, and human analysis.
nodes:
