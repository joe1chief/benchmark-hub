meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedQA Build Process
  description: >-
    Paper-aligned MedQA workflow: professional medical-board questions from the United States, mainland China, and
    Taiwan are deduplicated, normalized to four choices, and split 80/10/10; English and Chinese medical textbooks are
    OCR-processed into a retrieval corpus, and open-domain systems select one answer and report accuracy.
  legend: >-
    Solid arrows show the parallel exam-question and textbook-corpus construction branches before retrieval, reading,
    and evaluation.
nodes:
  - id: exams
    label: |-
      Professional Medical Exams
      USMLE / MCMLE / TWMLE
      Real + Mock Questions
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: collect_questions
    label: |-
      Question Collection
      US + Mainland China Websites
      Taiwan Official PDFs via OCR
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: deduplicate
    label: |-
      Remove Duplicate Problems
      Preserve One Correct Answer
    type: process
    size: large
    position:
      x: 600
      'y': 80
  - id: normalize_options
    label: |-
      Fair-use Option Normalization
      Shuffle Answer Order
      USMLE / MCMLE: Drop One Wrong Option
    type: process
    size: xl
    position:
      x: 840
      'y': 80
  - id: question_split
    label: |-
      Question-level 80 / 10 / 10 Split
      USMLE 12,723 / MCMLE 34,251
      TWMLE 14,123; Four Choices Each
    type: database
    size: xl
    position:
      x: 1140
      'y': 80
  - id: textbooks
    label: |-
      Medical Textbooks
      18 English for USMLE / TWMLE
      33 Simplified Chinese for MCMLE
    type: database
    size: xl
    position:
      x: 40
      'y': 520
  - id: ocr_books
    label: |-
      PDF to Text via OCR
      Correct Misspellings
      Divide into Paragraphs
    type: process
    size: xl
    position:
      x: 320
      'y': 520
  - id: corpus
    label: |-
      Retrieval Corpus
      English 231,581 Paragraphs
      Chinese 116,216 Paragraphs
    type: database
    size: xl
    position:
      x: 600
      'y': 520
  - id: coverage
    label: |-
      Two-M.D. Coverage Audit
      100 Dev Questions per Source
      US 88% / Mainland 100% / Taiwan 87%
    type: user
    size: xl
    position:
      x: 900
      'y': 520
  - id: openqa
    label: |-
      Open-domain QA System
      Retrieve Relevant Paragraphs
      Read Question + Evidence + Options
    type: process
    size: xl
    position:
      x: 1460
      'y': 300
  - id: choose
    label: |-
      Choose One Best Answer
      One Correct among Four Options
    type: process
    size: large
    position:
      x: 1760
      'y': 300
  - id: metric
    label: |-
      Accuracy
      Report Dev / Test per Language
    type: terminal
    size: large
    position:
      x: 2020
      'y': 300
edges:
  - from: exams
    to: collect_questions
    type: primary
  - from: collect_questions
    to: deduplicate
    type: primary
  - from: deduplicate
    to: normalize_options
    type: primary
  - from: normalize_options
    to: question_split
    type: primary
  - from: textbooks
    to: ocr_books
    type: primary
  - from: ocr_books
    to: corpus
    type: primary
  - from: corpus
    to: coverage
    type: primary
  - from: question_split
    to: openqa
    type: primary
  - from: coverage
    to: openqa
    type: primary
  - from: openqa
    to: choose
    type: primary
  - from: choose
    to: metric
    type: primary
modules: []
