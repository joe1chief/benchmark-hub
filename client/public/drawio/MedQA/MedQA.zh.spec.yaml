meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedQA 构建、发布与评测流程
  description: 对齐论文、数据包与代码的 MedQA 流程，覆盖多语种医学执业考试题采集、去重与四选项规范化、 精确题目级划分、教材 OCR 语料、人类覆盖度审计、论文开放域问答实验，以及范围更窄的 Elasticsearch 发布 IR 基线。
  legend: >-
    实线表示数据构建或计分路径，虚线表示证据、诊断、许可和实现边界；覆盖度与检索审计不筛选发布数据， 也不进入准确率。GitHub 的 MIT 许可覆盖代码；论文要求教材按“仅限研究使用”的许可协议发布， 而 Drive
    压缩包中没有单独的许可文件。
nodes:
  - id: evidence
    label: |-
      一手证据快照
      arXiv:2009.13081v1 · PDF SHA 5e19522f21c0
      代码 HEAD 27b02f66aac2
      Drive 文件 1ImYUSLk9JbgHXOemfvyiDiirluZHPeQw
      压缩包 SHA 1c2ca8130b3d
    type: document
    size: xl
    position:
      x: 40
      'y': 24
  - id: exams
    label: |-
      采集医学执业考试题
      USMLE · MCMLE · TWMLE
      真实考试 + 模拟题
      来源为可在线自由访问页面
    type: database
    size: xl
    position:
      x: 40
      'y': 264
  - id: collection_boundary
    label: |-
      采集复现边界
      论文附录列出来源
      并说明采集脚本
      当前 GitHub 仓库无爬虫快照
    type: document
    size: xl
    position:
      x: 320
      'y': 24
  - id: deduplicate
    label: |-
      移除重复题目
      按题目粒度处理
      保留一个正确答案
      保留考试来源元数据
    type: process
    size: xl
    position:
      x: 320
      'y': 264
  - id: locale_gate
    label: |-
      当前规范化的是
      哪个考试来源分支？
    type: decision
    size: xl
    position:
      x: 600
      'y': 264
  - id: normalize_options
    label: |-
      USMLE + MCMLE 合理使用变换
      打乱答案选项顺序
      随机删除一个错误选项
      保留一对三：一个正确、三个错误
    type: process
    size: xl
    position:
      x: 880
      'y': 144
  - id: tw_options
    label: |-
      TWMLE 选项边界
      表 3 报告每题四个选项
      论文未报告删除错误选项
      保留一个正确答案
    type: process
    size: xl
    position:
      x: 880
      'y': 384
  - id: split
    label: |-
      随机题目级 80 / 10 / 10 划分
      USMLE 10,178 / 1,272 / 1,273
      MCMLE 27,400 / 3,425 / 3,426
      TWMLE 11,298 / 1,412 / 1,413
    type: database
    size: xl
    position:
      x: 1160
      'y': 264
  - id: release_schema
    label: |-
      发布的四选项 JSONL
      question · options A-D
      answer · answer_idx · meta_info
      所有划分均含金标 answer_idx
    type: database
    size: xl
    position:
      x: 1440
      'y': 264
  - id: archive_snapshot
    label: |-
      官方 Drive data_clean.zip
      131,741,885 字节 · 无版本标签或 DOI
      各划分行数复现论文表 3
      原始 qbank 数量不是官方划分总数
      SHA-256 1c2ca8130b3d86d9…
    type: database
    size: xl
    position:
      x: 1720
      'y': 264
  - id: release_rights
    label: |-
      发布与权利边界
      Drive 压缩包无 README / LICENSE
      GitHub MIT 许可覆盖代码
      不等于许可题目或教材
      没有官方在线排行榜
    type: document
    size: xl
    position:
      x: 1720
      'y': 24
  - id: textbooks
    label: |-
      收集医学教材
      USMLE / TWMLE：18 本英文教材
      MCMLE：33 本简体中文教材
      源材料为 PDF
    type: database
    size: xl
    position:
      x: 40
      'y': 704
  - id: textbook_rights
    label: |-
      教材许可边界
      论文：签署许可协议后发布
      仅限研究使用
      可下载 ≠ 可不受限复用
    type: document
    size: xl
    position:
      x: 40
      'y': 1024
  - id: ocr
    label: |-
      对 PDF 教材执行 OCR
      纠正拼写错误
      将文本切分为段落
      TWMLE 共用英文教材集
    type: process
    size: xl
    position:
      x: 320
      'y': 704
  - id: corpus
    label: |-
      形成检索语料库
      英文 231,581 段
      简体中文 116,216 段
      1,273 万词元 / 1,473 万汉字
    type: database
    size: xl
    position:
      x: 600
      'y': 704
  - id: coverage
    label: |-
      人工教材覆盖度审计
      两名医学博士 · 每来源 100 道开发题
      证据足够：美国 88% · 大陆 100%
      台湾 87% · 仅诊断、不筛题
    type: user
    size: xl
    position:
      x: 880
      'y': 1024
  - id: eval_input
    label: |-
      开放域四选一问答
      题目 + 选项 + 教材语料
      检索证据并选择一个答案
      分考试来源独立评测
    type: process
    size: xl
    position:
      x: 1160
      'y': 704
  - id: tw_eval_gate
    label: |-
      论文评测采用
      哪条语言路径？
    type: decision
    size: xl
    position:
      x: 1440
      'y': 704
  - id: translate_tw
    label: |-
      TWMLE 论文路径
      繁体中文题目翻译为英文
      使用 Google 翻译
      运行与 USMLE 相同的模型
    type: process
    size: xl
    position:
      x: 1720
      'y': 584
  - id: native_route
    label: |-
      原语言论文路径
      USMLE：英文题目 + 英文语料
      MCMLE：简体中文题目 + 中文语料
      保持来源特定开发 / 测试集
    type: process
    size: xl
    position:
      x: 1720
      'y': 824
  - id: paper_methods
    label: |-
      论文基线方法族
      随机 · PMI · IR-ES · IR-CUSTOM
      检索器 → MAX-OUT 阅读器
      BERT / BioBERT / RoBERTa 系列
    type: process
    size: xl
    position:
      x: 2000
      'y': 704
  - id: retrieval_diagnostic
    label: |-
      事后 Top-25 检索审计
      两名医生 · 每来源 100 道开发题
      完整 / 部分 / 无：美国 24 / 8 / 68
      大陆 75 / 21 / 4 · 台湾 60 / 16.7 / 23.3
      Top-N 召回率有条件 · 不计分
    type: user
    size: xl
    position:
      x: 2280
      'y': 424
  - id: paper_results
    label: |-
      报告论文最佳测试准确率
      USMLE 英文 36.7%
      MCMLE 简体中文 70.1%
      TWMLE 繁体中文 42.0%
      无人类分数或综合指标
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 704
  - id: ir_code
    label: |-
      仅发布 IR 基线
      代码 HEAD 27b02f66aac2
      textsearch.py SHA f23d7ccaef21
      Python 3.6 · Elasticsearch 2.4.1
      读取 question / options / answer_idx
    type: process
    size: xl
    position:
      x: 1440
      'y': 1104
  - id: es_index
    label: |-
      构建教材搜索索引
      英文 Snowball 分析器
      中文 SmartCN 分析器
      BM25 · 单分片 · 无副本
    type: process
    size: xl
    position:
      x: 1720
      'y': 1104
  - id: option_query
    label: |-
      为每个答案选项打分
      查询 = 题干 + 选项文本
      汇总 Top-N Elasticsearch 分数
      发布代码默认 topn = 1
    type: process
    size: xl
    position:
      x: 2000
      'y': 1104
  - id: select
    label: |-
      选择置信分最高的选项
      仅在严格大于时更新
      正分并列时保留首个最大值
      将选项标签与 answer_idx 比较
    type: process
    size: xl
    position:
      x: 2280
      'y': 1104
  - id: accuracy
    label: |-
      发布代码准确率
      正确选项数 / 全部解析行 × 100
      不设部分得分
      打印一位小数百分比
    type: process
    size: xl
    position:
      x: 2560
      'y': 1104
  - id: code_boundary
    label: |-
      评测器实现边界
      IR 基线，不是通用 LLM 评测器
      无自由文本答案解析或无效规则
      缺字段或全零分数可能直接中止
    type: document
    size: xl
    position:
      x: 1440
      'y': 1424
  - id: report
    label: |-
      分别发布有证据支撑的结果
      论文模型按考试来源报告准确率
      发布 IR 脚本按 JSONL 报告准确率
      人工审计保持为诊断项
      无官方综合分或在线排行榜
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 904
edges:
  - from: evidence
    to: exams
    type: optional
    label: 固定论文与发布证据
    labelPosition: start
  - from: exams
    to: collection_boundary
    type: optional
    label: 当前爬虫未发布
    labelPosition: end
  - from: exams
    to: deduplicate
    type: primary
  - from: deduplicate
    to: locale_gate
    type: primary
  - from: locale_gate
    to: normalize_options
    type: primary
    label: USMLE + MCMLE 构建路径
    labelPosition: start
  - from: locale_gate
    to: tw_options
    type: primary
    label: TWMLE 构建路径
    labelPosition: end
  - from: normalize_options
    to: split
    type: primary
  - from: tw_options
    to: split
    type: primary
  - from: split
    to: release_schema
    type: primary
  - from: release_schema
    to: archive_snapshot
    type: primary
  - from: archive_snapshot
    to: release_rights
    type: optional
    label: 版本与权利
    labelPosition: end
  - from: textbooks
    to: textbook_rights
    type: optional
    label: 仅限研究使用条件
    labelPosition: end
  - from: textbooks
    to: ocr
    type: primary
  - from: ocr
    to: corpus
    type: primary
  - from: corpus
    to: coverage
    type: optional
    label: 覆盖度诊断
    labelPosition: end
  - from: archive_snapshot
    to: eval_input
    type: primary
  - from: corpus
    to: eval_input
    type: primary
  - from: eval_input
    to: tw_eval_gate
    type: primary
  - from: tw_eval_gate
    to: translate_tw
    type: primary
    label: TWMLE 评测路径
    labelPosition: start
  - from: tw_eval_gate
    to: native_route
    type: primary
    label: USMLE + MCMLE 评测路径
    labelPosition: end
  - from: translate_tw
    to: paper_methods
    type: primary
  - from: native_route
    to: paper_methods
    type: primary
  - from: paper_methods
    to: retrieval_diagnostic
    type: optional
    label: IR-CUSTOM 审计
    labelPosition: end
  - from: paper_methods
    to: paper_results
    type: primary
  - from: paper_results
    to: report
    type: primary
  - from: eval_input
    to: ir_code
    type: optional
    label: 发布 IR 复现路径
    labelPosition: end
  - from: ir_code
    to: code_boundary
    type: optional
    label: 失败语义
    labelPosition: end
  - from: ir_code
    to: es_index
    type: primary
  - from: corpus
    to: es_index
    type: primary
  - from: es_index
    to: option_query
    type: primary
  - from: option_query
    to: select
    type: primary
  - from: select
    to: accuracy
    type: primary
  - from: accuracy
    to: report
    type: primary
modules: []
