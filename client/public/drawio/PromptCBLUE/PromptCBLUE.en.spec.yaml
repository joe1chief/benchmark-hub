meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PromptCBLUE Build and Evaluation Process
  description: >-
    Paper-v1 construction of 16 Chinese medical NLP tasks as prompt-response generation, with the fixed competition
    submission path, task-specific metrics, the unresolved Table 8 printed-total versus 16-row-sum discrepancy, the
    prose-versus-table training-count conflict, and explicit paper-versus-v0.2 release boundaries.
  legend: >-
    Solid arrows reproduce the disclosed construction and evaluation process. Dashed arrows isolate repository-release
    and licensing evidence that must not be mistaken for the paper cohort. Conflict cards preserve both paper values;
    they do not normalize differences that the paper does not explain.
