meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PromptCBLUE Build and Evaluation Process
  description: >-
    Paper- and repository-aligned conversion of 16 Chinese medical NLP tasks into one prompt-response interface,
    hidden-label online evaluation, task-specific normalization, and macro task aggregation.
  legend: >-
    PromptCBLUE v0.2 uses 94 instruction templates and provides 68,900 training, 10,360 validation, and two 10,320-row
    test splits across 16 tasks and five capability cohorts.
nodes:
  - id: step_1
    label: |-
      Assemble 16 Medical NLP Tasks
      Start from CBLUE and companion tasks
      Preserve authentic Chinese medical text
      Cover understanding and generation
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Organize Five Task Cohorts
      Information extraction
      Classification and inference
      Dialogue status and content generation
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Redesign Each Task for LLMs
      Convert spans labels and structures
      Express every target as generated text
      Preserve task-specific semantics
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Author 94 Instruction Templates
      Vary natural prompt wording
      Include answer choices where relevant
      Keep task identity outside model input
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Render a Unified JSONL Schema
      input · target · task type
      answer choices · sample ID
      One prompt-response contract for all tasks
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Preserve Data Splits
      68,900 train · 10,360 validation
      Test A and B: 10,320 each
      Mix all tasks within each release split
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Hide Test Ground Truth
      Publish fixed test inputs
      Leave target strings empty
      Reduce direct label leakage
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Define Evaluation Settings
      Fixed few-shot demonstrations by task
      Full-data and few-shot fine-tuning
      Shared generation interface
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Constrain the Submitted Model
      One shared LLM backbone
      One shared language-model head
      PEFT modules below one percent
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Generate Every Test Response
      Feed the fixed input verbatim
      Preserve row order and sample IDs
      Submit one text answer per row
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Parse into Task Structures
      Provide standard-library post-processing
      Convert text to entities labels or sections
      Produce task-keyed results JSON
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Score Understanding Tasks
      Strict micro-F1 for extraction
      Macro-F1 for selected classifiers
      Micro-F1 for remaining inference tasks
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Score Generation Tasks
      ROUGE-1 · ROUGE-2 · ROUGE-L
      Split Chinese characters before scoring
      Average six report sections for IMCS-MRG
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Rank on the Overall Score
      Select F1 or ROUGE-L per task
      Average all 16 primary task scores
      Evaluate on the online platform
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
