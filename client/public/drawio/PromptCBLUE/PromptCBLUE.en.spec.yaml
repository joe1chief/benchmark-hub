    size: xl
    position:
      x: 1700
      'y': 460
    style:
      fontSize: 9
  - id: generation_metrics
    label: |-
      Score Medical Generation
      Character-spaced ROUGE-1 · ROUGE-2 · ROUGE-L
      Average Six Report Sections for MRG
      Score MedDG Responses Directly
    type: process
    size: xl
    position:
      x: 1700
      'y': 640
    style:
      fontSize: 9
