meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PromptCBLUE 构建与评测流程
  description: >-
    按论文 v1 复原 16 项中文医疗 NLP 任务的提示—回答生成化构建过程，并展示固定竞赛提交链路、任务专用指标、表 8 印刷总计与 16 行实算差异、
    正文与表格训练量冲突，以及论文与 v0.2 发布边界。
  legend: >-
    实线表示论文或竞赛文档明确披露的构建与评测流程；虚线隔离仓库发布与许可证据，避免将其误作论文数据口径。冲突卡片并列保留论文中的两种值，
    不会替论文归一化其未解释的差异。
nodes:
  - id: source_evidence
    label: |-
      固定来源证据
      arXiv 2310.14151v1
      PDF SHA-256 2a69d5133e62
      Git b0753a61a7c1
      论文与官方仓库联合核验
    type: document
    size: xl
    position:
      x: 20
      'y': 40
    style:
      fontSize: 9
  - id: cblue_scope
    label: |-
      汇集 16 项中文医疗 NLP 任务
      二次开发 CBLUE 与配套任务
      保留真实中文医疗文本
      同时覆盖理解与生成
    type: database
    size: xl
    position:
      x: 260
      'y': 40
    style:
      fontSize: 9
  - id: task_cohorts
    label: |-
      组织论文中的五类任务
      信息抽取 5 · 文本分类 3
      自然语言推理 4 · 症状状态 2
      医疗内容生成 2
    type: process
    size: xl
    position:
      x: 500
      'y': 40
    style:
      fontSize: 9
  - id: manual_seeds
    label: |-
      人工撰写多样化种子提示
      三名计算机专业研究生标注员
      每人约写两条种子
      每项任务约六条种子
    type: process
    size: xl
    position:
      x: 740
      'y': 40
    style:
      fontSize: 9
  - id: expert_seed_review
    label: |-
      审核每条人工种子
      两名医疗专家
      一名资深 NLP 研究者
      修改直至专家接受
    type: process
    size: xl
    position:
      x: 980
      'y': 40
    style:
      fontSize: 9
  - id: chatgpt_rephrase
    label: |-
      用 ChatGPT 扩写已接收种子
      每条种子改写十次
      不改变语义
      不改变任何占位符
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
    style:
      fontSize: 9
  - id: expert_augmented_review
    label: |-
      复审生成的提示模板
      仍由同一专家组完成
      剔除语义或占位符漂移
      仅接纳审核通过的模板
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
    style:
      fontSize: 9
  - id: prompt_components
    label: |-
      组装每条提示
      任务指令与文本输入
      可附标签解释及输出格式
      可附示例或分步推理要求
    type: document
    size: xl
    position:
      x: 1700
      'y': 40
    style:
      fontSize: 9
  - id: target_serialization
    label: |-
      将原始目标序列化为文本
      转换跨度 标签与结构
      保留各任务特定语义
      统一改造成生成任务
    type: process
    size: xl
    position:
      x: 1940
      'y': 40
    style:
      fontSize: 9
  - id: uniform_schema
    label: |-
      输出统一提示—回答结构
      input · target · answer_choices
      sample_id · task_type · task_dataset
      四个辅助字段不输入模型
    type: document
    size: xl
    position:
      x: 2180
      'y': 40
    style:
      fontSize: 9
  - id: template_fill
    label: |-
      用来源样本填充提示模板
      形成大型提示—回答候选池
      保留任务与样本身份
      有标签集时保留允许选项
    type: process
    size: xl
    position:
      x: 2420
      'y': 40
    style:
      fontSize: 9
  - id: uniform_sample
    label: |-
      论文正文：每任务均匀抽样
      训练 3,000 至 5,000 条
      开发与测试各 600 至 800 条
      表 8：CHIP-CTC 6,600 · QIC 5,500
      论文未解释正文与表格冲突
    type: process
    size: xl
    position:
      x: 2660
      'y': 40
    style:
      fontSize: 8
  - id: quality_checks
    label: |-
      执行三类质量检查
      专家审模板 · 协助修订 CBLUE
      触发 QQR 重新标注
      每任务查 5% 或 200 条 · 错标率 0.9%
    type: process
    size: xl
    position:
      x: 2900
      'y': 40
    style:
      fontSize: 9
  - id: paper_release
    label: |-
      表 8 总计与 16 行实算
      印刷训/开/测：82,600 / 7,656 / 7,656
      行和训/开/测：78,100 / 6,856 / 6,856
      差额训/开/测：4,500 / 800 / 800
      论文未作解释
    type: database
    size: xl
    position:
      x: 3140
      'y': 40
    style:
      fontSize: 8
  - id: evaluation_settings
    label: |-
      选择论文披露的评测设置
      少样本上下文学习
      少样本微调
      全量微调或参数高效微调
    type: process
    size: xl
    position:
      x: 3140
      'y': 460
    style:
      fontSize: 9
  - id: icl_setting
    label: |-
      构造固定上下文示例
      使用同任务演示
      可行时每标签至少 k 条
      CHIP-CTC 选不同标签示例
    type: process
    size: xl
    position:
      x: 2900
      'y': 280
    style:
      fontSize: 9
  - id: fewshot_ft
    label: |-
      执行少样本微调
      复用已选择的演示样本
      改变训练样本数量
      衡量样本效率影响
    type: process
    size: xl
    position:
      x: 2900
      'y': 460
    style:
      fontSize: 9
  - id: full_ft
    label: |-
      在大型参考训练集上训练
      比较全参数微调
      与参数高效方法
      将 PromptCBLUE 视作单一任务
    type: process
    size: xl
    position:
      x: 2900
      'y': 640
    style:
      fontSize: 9
  - id: shared_model_rule
    label: |-
      执行竞赛模型约束
      所有任务共用一个 LLM 主干
      所有任务共用一个 LM 预测头
      PEFT 总参数量低于主干 1%
    type: process
    size: xl
    position:
      x: 2660
      'y': 460
    style:
      fontSize: 9
  - id: test_generation
    label: |-
      为每条测试样本生成一个回答
      原样输入固定 input
      发布测试输入中的 target 为空
      保持顺序 数量与 sample_id
    type: process
    size: xl
    position:
      x: 2420
      'y': 460
    style:
      fontSize: 9
  - id: submission_package
    label: |-
      构造提交 ZIP 包
      test_predictions.json
      post_generate_process.py
      两个文件均置于 ZIP 根目录
    type: document
    size: xl
    position:
      x: 2180
      'y': 460
    style:
      fontSize: 9
  - id: platform_parser
    label: |-
      在线运行参赛者后处理脚本
      仅允许 Python 标准库
      文本转为按任务组织的 results.json
      忽略手工上传的 results.json
    type: process
    size: xl
    position:
      x: 1940
      'y': 460
    style:
      fontSize: 9
  - id: extraction_metrics
    label: |-
      评分信息抽取与状态任务
      严格实例级 Micro-F1
      实例内全部字段必须精确命中
      覆盖实体 三元组 事件与 ICD 输出
    type: process
    size: xl
    position:
      x: 1700
      'y': 280
    style:
      fontSize: 9
  - id: classification_metrics
    label: |-
      评分分类与推理任务
      CTC QIC DAC 使用 Macro-F1
      STS QQR IR QTR 使用 Micro-F1
      基于解析后的任务标签计算
    type: process
    size: xl
    position:
      x: 1700
      'y': 460
    style:
      fontSize: 9
  - id: generation_metrics
    label: |-
      评分医疗生成任务
      汉字空格化后算 ROUGE-1 · ROUGE-2 · ROUGE-L
      MRG 六个报告章节分别评分后平均
      MedDG 回复直接评分
    type: process
    size: xl
    position:
      x: 1700
      'y': 640
    style:
      fontSize: 9
  - id: overall_score
    label: |-
      计算总体分数
      选择每项任务主指标
      平均 16 项论文任务得分
      每项使用 F1 或 ROUGE-L
    type: process
    size: xl
    position:
      x: 1460
      'y': 460
    style:
      fontSize: 9
  - id: leaderboard
    label: |-
      在天池平台排名
      通用赛道与开源赛道
      执行各赛道审核规则
      发布分任务与总体结果
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 460
    style:
      fontSize: 9
  - id: release_boundary
    label: |-
      固定仓库发布边界
      v0.2 README 声称 94 个模板
      训练 68,900 · 开发 10,360 · 测试 A/B 各 10,320
      文件含 91 条人工 · 352 条扩写记录
    type: document
    size: xl
    position:
      x: 3140
      'y': 900
    style:
      fontSize: 9
  - id: license_boundary
    label: |-
      许可边界
      固定 Git 树没有 LICENSE 文件
      完整数据通过天池分发
      不推断数据集再使用条款
    type: document
    size: xl
    position:
      x: 3380
      'y': 900
    style:
      fontSize: 9
