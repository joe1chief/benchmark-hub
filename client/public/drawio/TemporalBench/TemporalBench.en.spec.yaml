meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TemporalBench Build and Evaluation Process
  description: >-
    TemporalBench samples about 300 validation or test clips from each of seven diverse video sources to obtain roughly
    2,000 clips. Optical flow removes mostly static clips, PySceneDetect removes clips with multiple scene changes, and
    clips longer than twenty seconds are excluded; audio is removed during annotation. Qualified AMT master workers pass
    three probe-caption tasks with two examples and write detailed positive captions, which the authors refine;
    FineGym's existing detailed action descriptions are reused. GPT-4o, Gemini-1.5-Pro, and Llama-3.1-405B generate up
    to nine word-level and six event-order negative captions from three examples. Authors review the candidates as
    multiple-choice QA, leaving 2,000 human-annotated captions and 10,000 video QA pairs. To remove the
    centralized-answer shortcut, each multi-choice item is decomposed into several binary questions. Short-video
    evaluation reports Binary Accuracy and the stricter Multiple Binary Accuracy across sources, with text-only and
    single-frame controls. Long-video evaluation samples non-overlapping clips from one source video, crops the
    enclosing segment, concatenates their positive captions, replaces one clip caption with a negative for each
    distractor, and reports BA and MBA over 1,574 long videos.
  legend: >-
    Source: TemporalBench arXiv:2410.10818 Sections 3-5 and official TemporalBench project page. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
