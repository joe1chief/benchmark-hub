meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TemporalBench 构建与评测流程
  description: >-
    TemporalBench从7个多样化视频来源的验证集或测试集中各采约300段，得到约2000段视频。作者用光流删除基本静止片段，用PySceneDetect删除包含多次场景切换的片段，并排除超过20秒的片段；标注时移除音频。合格的AMT
    master标注者先完成带2个示例的3道探测字幕任务，再编写细粒度正字幕，由作者修正；FineGym沿用其已有的详细动作描述。GPT-4o、Gemini-1.5-Pro和Llama-3.1-405B依据3个示例，每条最多生成9个词级负例和6个事件顺序负例，作者以多选题形式复核，最终得到2000条人工视频字幕与10000组视频问答。为消除“中心答案”捷径，每道多选题被拆成多道二元题。短视频评测按来源报告二元准确率BA和更严格的多二元准确率MBA，并设置纯文本与单帧对照。长视频评测从同一源视频采非重叠片段，裁剪包围区间并拼接正字幕，再用某个片段的负字幕替换生成干扰项，在1574段长视频上报告BA与MBA。
  legend: 来源：TemporalBench arXiv:2410.10818 Sections 3-5 and official TemporalBench project page。实线箭头表示论文或官方资料明确支持的主流程。
