meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C-Eval 构建流程
  description: >-
    按论文对齐的 C-Eval 流程：考试题被组织为 52 个学科、四个层级与四大领域，从 PDF、Word 和网页解析， 规范为四选一并校正
    LaTeX，去重清洗且经过多轮人工复核，再按学科切分，最终以正则抽取答案并按准确率评测，测试标签不公开。
  legend: 实线表示构建与评测主流程；上下分支表示官方数据切分的不同用途。
nodes:
  - id: sources
    label: |-
      模拟 / 地方 / 高校
      职业考试
    type: database
    size: large
    position:
      x: 40
      'y': 240
  - id: taxonomy
    label: |-
      52 个学科
      4 层级 + 4 领域
    type: process
    size: large
    position:
      x: 240
      'y': 240
  - id: parse
    label: |-
      解析 PDF / Word
      与网页
    type: document
    size: large
    position:
      x: 440
      'y': 240
  - id: format
    label: |-
      统一为四选一
      规范 LaTeX
    type: process
    size: large
    position:
      x: 640
      'y': 240
  - id: clean
    label: |-
      去重
      与清洗
    type: process
    size: large
    position:
      x: 840
      'y': 240
  - id: validate
    label: |-
      多轮
      人工复核
    type: decision
    size: large
    position:
      x: 1040
      'y': 240
  - id: pool
    label: |-
      C-Eval
      13,948 道题
    type: database
    size: large
    position:
      x: 1240
      'y': 240
  - id: split
    label: 按学科切分
    type: decision
    size: large
    position:
      x: 1440
      'y': 240
  - id: dev
    label: |-
      开发集：每科 5 题
      含解题说明
    type: document
    size: large
    position:
      x: 1640
      'y': 40
  - id: val
    label: |-
      验证集：占 1/10
      标签公开
    type: document
    size: large
    position:
      x: 1640
      'y': 240
  - id: test
    label: |-
      测试集：占 9/10
      标签保密
    type: document
    size: large
    position:
      x: 1640
      'y': 440
  - id: hard
    label: |-
      C-Eval Hard
      8 个数理化学科
    type: document
    size: large
    position:
      x: 1840
      'y': 40
  - id: prompt
    label: |-
      零样本 / 五样本
      仅答案 + 思维链
    type: process
    size: large
    position:
      x: 1840
      'y': 280
  - id: extract
    label: |-
      正则抽取
      答案选项
    type: process
    size: large
    position:
      x: 2040
      'y': 280
  - id: score
    label: |-
      准确率
      私有测试榜单
    type: terminal
    size: large
    position:
      x: 2240
      'y': 280
edges:
