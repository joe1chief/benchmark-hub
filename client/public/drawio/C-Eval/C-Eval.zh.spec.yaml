meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C-Eval 构建流程
  description: 与论文一致地构建 13,948 道中文考试选择题；由 GPT-4 为开发集生成解释并经人工修订；分别执行零样本仅答案、 五样本仅答案与五样本思维链协议；明确区分论文中的私有测试标签与仓库在 2025 年公开完整测试集的版本边界。
  legend: 实线表示构建与评测；虚线数据箭头提供样例或版本背景。
nodes:
  - id: sources
    label: |-
      收集中文考试题
      模拟 • 地方 • 大学 • 职业考试
      包含获授权的维普题目
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: taxonomy
    label: |-
      组织为 52 个学科
      四个层级 + 四个领域
      每学科至少 200 题
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: parse
    label: |-
      解析来源格式
      PDF • Word • 网页
      恢复题干与选项
    type: document
    size: xl
    position:
      x: 540
      'y': 420
  - id: format
    label: |-
      统一每道题格式
      恰好四个选项
      数学内容转换为 LaTeX
    type: process
    size: xl
    position:
      x: 790
      'y': 420
  - id: clean
    label: |-
      去重与清洗
      删除无效或损坏题目
      保留学科元数据
    type: process
    size: xl
    position:
      x: 1040
      'y': 420
  - id: validate
    label: |-
      多轮人工验证
      检查题目、选项与答案
      修正剩余错误
    type: user
    size: xl
    position:
      x: 1290
      'y': 420
  - id: pool
    label: |-
      C-Eval 题库
      13,948 道多项选择题
      覆盖 52 个学科
    type: database
    size: xl
    position:
      x: 1540
      'y': 420
  - id: split
    label: |-
      在每个学科内切分
      开发集：5 个样例
      验证集 : 测试集 = 1 : 9
    type: decision
    size: xl
    position:
      x: 1790
      'y': 420
  - id: dev
    label: |-
      开发集
      每学科 5 个示例
      提供标准答案
    type: document
    size: xl
    position:
      x: 2040
      'y': 40
  - id: validation
    label: |-
      验证集
      非开发集题目的十分之一
      公开答案标签
    type: document
    size: xl
    position:
      x: 2040
      'y': 420
  - id: test_set
    label: |-
      论文测试集
      非开发集题目的十分之九
      2023 年协议中标签私有
    type: document
    size: xl
    position:
      x: 2040
      'y': 800
  - id: hard
    label: |-
      C-Eval Hard
      八个高难 STEM 学科
      作为附加子集报告
    type: document
    size: xl
    position:
      x: 1790
      'y': 40
  - id: gpt4_explanations
    label: |-
      GPT-4 生成逐步解释
      输入开发集题目
      条件中包含标准答案
    type: process
    size: xl
    position:
      x: 2290
      'y': 40
  - id: human_revision
    label: |-
      人工修订
      纠正并完善 GPT-4 解释
      与开发集示例一起发布
    type: user
    size: xl
    position:
      x: 2540
      'y': 40
  - id: release_boundary
    label: |-
      版本边界
      论文：测试标签私有
      仓库自 2025-07-27 起完整测试集公开
    type: document
    size: xl
    position:
      x: 2290
      'y': 800
  - id: evaluation_sets
    label: |-
      选择评测切分
      验证集 • 测试集 • C-Eval Hard
      保留论文时期的报告协议
    type: database
    size: xl
    position:
      x: 2540
      'y': 420
  - id: zero_answer
    label: |-
      零样本仅答案
      要求输出选项字母
      不提供演示样例
    type: process
    size: xl
    position:
      x: 2790
      'y': 40
  - id: five_answer
    label: |-
      五样本仅答案
      使用开发集题目与答案
      上下文过长时减少样例数
    type: process
    size: xl
    position:
      x: 2790
      'y': 420
  - id: five_cot
    label: |-
      五样本思维链
      使用人工修订的开发集解释
      上下文过长时减少样例数
    type: process
    size: xl
    position:
      x: 2790
      'y': 800
  - id: extract
    label: |-
      正则抽取选项
      解析模型预测的选项
      应用官方答案规则
    type: process
    size: xl
    position:
      x: 3040
      'y': 420
  - id: score
    label: |-
      报告准确率
      学科与总体平均
      对比三种提示模式
    type: terminal
    size: xl
    position:
      x: 3290
      'y': 420
