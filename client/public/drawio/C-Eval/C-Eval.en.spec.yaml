meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C-Eval Build Process
  description: >-
    Paper-aligned construction of 13,948 Chinese exam MCQs, GPT-4-authored and manually revised development
    explanations, the official zero-shot answer-only, five-shot answer-only, and five-shot CoT protocols, plus an
    explicit boundary between the paper's private test labels and the repository's 2025 public release.
  legend: Solid arrows show construction and evaluation; dashed data arrows provide exemplars or version context.
