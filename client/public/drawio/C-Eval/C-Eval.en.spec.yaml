  title: C-Eval Build Process
  description: >-
    Paper-aligned C-Eval workflow: exam questions are organized into 52 subjects across four levels and four areas,
    parsed from PDF, Word, and web sources, normalized to exactly four choices with valid LaTeX, cleaned and repeatedly
