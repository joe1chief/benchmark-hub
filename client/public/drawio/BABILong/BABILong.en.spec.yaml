meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BABILong Build Process
  description: Paper-aligned generation and long-context evaluation workflow for BABILong, based on arXiv:2406.10149.
  legend: >-
    Solid arrows show dataset generation and direct evaluation; dashed arrows distinguish retrieval and recurrent-memory
    baselines.
nodes:
  - id: babi_simulation
    label: |-
      Generate bAbI Simulations
      Characters, Objects, Locations, and Events
      Synthetic Facts plus Ground-Truth Answers
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: task_suite
    label: |-
      Select QA1 through QA20
      Fact Chains • Induction • Deduction
      Counting • Lists/Sets • Space and Time
    type: process
    size: xl
    position:
      x: 320
      'y': 220
  - id: pg19
    label: |-
      Sample PG19 Books
      Natural Long-Form Narratives
      Draw Background Sentences in Original Order
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: interleave
    label: |-
      Hide Task Facts in Background Text
      Interleave Relevant and Distractor Sentences
      Preserve Their Natural and Logical Order
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: length_control
    label: |-
      Add Background until Target Length
      Measure with the GPT-2 Tokenizer
      Adapt Fact Positions Algorithmically
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: release
    label: |-
      Pre-Generate Reproducible Splits
      0K • 4K • 8K • 16K • 32K • 64K
      128K • 512K • 1M • 10M Tokens
    type: database
    size: xl
    position:
      x: 1160
      'y': 220
  - id: direct_eval
    label: |-
      Run Long-Context LLMs Directly
      Locate Supporting Facts
      Memorize and Reason to the Answer
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: rag_chunks
    label: |-
      Run RAG-C Baseline
      Retrieve 512-Token Chunks
      Pass Retrieved Evidence to the LLM
    type: process
    size: xl
    position:
      x: 1440
      'y': 220
  - id: rag_sentences
    label: |-
      Run RAG-S Baseline
      Retrieve Individual Sentences
      Test Multi-Hop and Temporal Failures
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: recurrent_train
    label: |-
      Curriculum-Fine-Tune Memory Models
      RMT • ARMT • Mamba
      Gradually Increase Recurrent Segments
    type: process
    size: xl
    position:
      x: 1440
      'y': 580
  - id: recurrent_eval
    label: |-
      Evaluate Recurrent Memory
      Extrapolate beyond Training Lengths
      Test Selected Runs up to 50M Tokens
    type: process
    size: xl
    position:
      x: 1720
      'y': 580
  - id: score
    label: |-
      Compute Exact Task Accuracy
      Report Every QA Task and Context Length
      Use 1,000 Samples to 32K and 100 Beyond
    type: process
    size: xl
    position:
      x: 2000
      'y': 400
  - id: effective_context
    label: |-
      Diagnose Effective Context Use
      Compare One-, Two-, and Three-Fact Tasks
      Track Accuracy Decay with Length
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: method_compare
    label: |-
      Compare Direct, RAG, and Memory Models
      Analyze Retrieval Order and Missing Facts
      Separate Refusals Where Reported
    type: process
    size: xl
    position:
      x: 2000
      'y': 760
  - id: report
    label: |-
      Publish BABILong Results
      Accuracy by Task, Length, and Method
      Predefined Splits plus 50M Extrapolation
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 980
edges:
  - from: babi_simulation
    to: task_suite
    type: primary
  - from: task_suite
    to: interleave
    type: primary
  - from: pg19
    to: interleave
    type: data
  - from: interleave
    to: length_control
    type: primary
  - from: length_control
    to: release
    type: primary
  - from: release
    to: direct_eval
    type: primary
  - from: release
    to: rag_chunks
    type: optional
  - from: release
    to: rag_sentences
    type: optional
  - from: release
    to: recurrent_train
    type: optional
  - from: recurrent_train
    to: recurrent_eval
    type: primary
  - from: direct_eval
    to: score
    type: primary
  - from: rag_chunks
    to: score
    type: data
  - from: rag_sentences
    to: score
    type: data
  - from: recurrent_eval
    to: score
    type: data
  - from: score
    to: effective_context
    type: primary
  - from: score
    to: method_compare
    type: data
  - from: effective_context
    to: report
    type: primary
  - from: method_compare
    to: report
    type: data
modules: []
