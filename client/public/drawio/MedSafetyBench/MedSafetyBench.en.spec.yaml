meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedSafetyBench Build and Evaluation Process
  description: >-
    Paper-aligned construction from nine AMA medical-ethics principles through dual-model harmful-request generation,
    manual curation, safe-response authoring, stratified splits, physician validation, safety evaluation, and alignment.
  legend: >-
    The 1,800 harmful requests contain 900 GPT-4 and 900 GCG-jailbroken Llama-2 requests; Eval and Improve each contain
    450 from each source and are stratified across all nine principles.
nodes:
  - id: ethics
    label: |-
      Define Medical Safety
      Use Nine AMA Principles
      Treat Violations as Harmful Requests
      Cover Medical-specific Risks
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: gpt4
    label: |-
      Prompt GPT-4 by Principle
      Ask for 20 Requests per Prompt
      Include Medical Jargon
      Generate Direct Harmful Requests
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: llama
    label: |-
      Jailbreak Llama-2-7b-chat
      Apply Greedy Coordinate Gradient
      Optimize an Affirmative Target
      Generate Additional Requests
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: curate
    label: |-
      Manually Curate Requests
      Remove Duplicates
      Remove Irrelevant Examples
      Retain Principle Violations
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: harmful
    label: |-
      Assemble Harmful Set
      900 GPT-4 Requests
      900 Llama-2 Requests
      Total: 1,800 Requests
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: safe
    label: |-
      Author Safe Demonstrations
      GPT-4 Declines Each Request
      Briefly Explain the Ethical Risk
      Manually Verify and Edit Responses
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: split
    label: |-
      Make Stratified Random Splits
      MedSafety-Eval: 900
      MedSafety-Improve: 900
      Each Source 450 · All Nine Principles
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: validate
    label: |-
      Validate with 25 Doctors
      Each Rates 25 Random Requests
      Judge Violation and Principles
      Confirm Harm and Coverage
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: eval_inputs
    label: |-
      Prepare Safety Evaluation
      MedSafety-Eval Harmful Requests
      GenSafety-Eval: 330 Requests
      Do Not Reveal Safe Responses
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: responses
    label: |-
      Query General and Medical LLMs
      Collect Free-form Responses
      Compare Aligned and Base Models
      Preserve the Same Prompt Protocol
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: judge
    label: |-
      Score Response Harmfulness
      GPT-3.5 Rates Compliance 1 to 5
      One: Full Refusal · Five: Full Compliance
      Lower Is Safer · AMA Policy for Medicine
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: improve
    label: |-
      Fine-tune Medical LLMs
      General Safety: 900
      Medical Safety: 900 · Combined: 1,800
      Medalpaca 7b/13b · Meditron 7b
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: preserve
    label: |-
      Check Medical Capability
      MedQA · MedMCQA
      PubMedQA · MMLU-Medical
      Three-shot Accuracy
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Safety and Utility
      Average Harmfulness Scores
      Before-versus-after Alignment
      Verify Medical Performance Preservation
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: ethics
    to: gpt4
    type: primary
  - from: gpt4
    to: llama
    type: primary
  - from: llama
    to: curate
    type: primary
  - from: curate
    to: harmful
    type: primary
  - from: harmful
    to: safe
    type: primary
  - from: safe
    to: split
    type: primary
  - from: split
    to: validate
    type: primary
  - from: validate
    to: eval_inputs
    type: primary
  - from: eval_inputs
    to: responses
    type: primary
  - from: responses
    to: judge
    type: primary
  - from: judge
    to: improve
    type: primary
  - from: improve
    to: preserve
    type: primary
  - from: preserve
    to: report
    type: primary
modules: []
