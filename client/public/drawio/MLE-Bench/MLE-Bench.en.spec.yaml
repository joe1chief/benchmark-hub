meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLE-Bench Build Process
  description: >-
    Paper-aligned MLE-Bench workflow: 5,673 completed Kaggle competitions are reduced by manual relevance and
    reproducibility gates to 75 test tasks plus seven development tasks; offline datasets, local graders, private
    leaderboard snapshots, controlled agent runs, and anti-cheating audits support human-relative medal rates.
  legend: Solid arrows show competition curation, offline packaging, controlled agent execution, audit, and scoring.
nodes:
  - id: pool
    label: |-
      Meta Kaggle Pool
      5,673 Completed Competitions
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: screen
    label: |-
      Exclude Community Events
      Manually Screen 586
    type: process
    size: large
    position:
      x: 280
      'y': 180
  - id: criteria
    label: |-
      Selection Gates
      Modern ML + Clear Task
      Local Metric + Legal Data
    type: decision
    size: xl
    position:
      x: 520
      'y': 180
  - id: selection
    label: |-
      Benchmark Selection
      75 Test + 7 Dev
      Low / Med / High: 22 / 38 / 15
    type: database
    size: xl
    position:
      x: 760
      'y': 180
  - id: split
    label: |-
      Dataset Reconstruction
      Use Public Test or Re-split Train
      Usually 10% Test + Distribution Check
    type: process
    size: xl
    position:
      x: 1000
      'y': 180
  - id: package
    label: |-
      Offline Competition Package
      Description + Data
      Private Leaderboard Snapshot
    type: document
    size: xl
    position:
      x: 1240
      'y': 180
  - id: grading
    label: |-
      Local Grading Contract
      Competition Metric
      Validity Server: Format Only
    type: process
    size: xl
    position:
      x: 1480
      'y': 180
  - id: environment
    label: |-
      Controlled Docker Run
      24 h / A10 / 36 vCPU
      Three Seeds
    type: process
    size: xl
    position:
      x: 1720
      'y': 180
  - id: agent
    label: |-
      Model + Agent Scaffold
      Train / Debug / Predict
      Produce submission.csv
    type: process
    size: xl
    position:
      x: 1960
      'y': 180
  - id: validation
    label: |-
      Submission Validation
      Correct CSV Format?
    type: decision
    size: large
    position:
      x: 2200
      'y': 180
  - id: audit
    label: |-
      Integrity Audit
      Medal-winning Candidates
      GPT-4o Rule Check
      Dolos vs Top-50 Notebooks
      >60% Similarity → Human Review
    type: decision
    size: xl
    position:
      x: 2680
      'y': 180
  - id: compare
    label: |-
      Grade Locally
      Compare Private Leaderboard
      Identify Medal Candidates
    type: process
    size: large
    position:
      x: 2440
      'y': 180
  - id: metrics
    label: |-
      Bronze / Silver / Gold
      Any-medal Rate + Raw Score
      Optional pass@k
    type: terminal
    size: xl
    position:
      x: 2920
      'y': 180
edges:
  - from: pool
    to: screen
    type: primary
  - from: screen
    to: criteria
    type: primary
  - from: criteria
    to: selection
    type: primary
  - from: selection
    to: split
    type: primary
  - from: split
    to: package
    type: primary
  - from: package
    to: grading
    type: primary
  - from: grading
    to: environment
    type: primary
  - from: environment
    to: agent
    type: primary
  - from: agent
    to: validation
    type: primary
  - from: validation
    to: compare
    type: primary
  - from: compare
    to: audit
    type: primary
  - from: audit
    to: metrics
    type: primary
modules: []
