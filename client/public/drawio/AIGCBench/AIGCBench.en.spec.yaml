    Construction of 3,928 I2V cases followed by dataset-specific automatic metrics and a separate human vote, with
    paper-versus-code keyframe divergence and method-specific coverage made explicit.
  legend: Solid arrows show the construction/evaluation spine; dashed data arrows merge independent evidence reports only.
