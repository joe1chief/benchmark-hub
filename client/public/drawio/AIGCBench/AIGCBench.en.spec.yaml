meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIGCBench Build and Evaluation Process
  description: >-
    Paper-aligned construction of the three AIGCBench data sources and evaluation of image-to-video systems with
    reference and reference-free metrics across four dimensions, followed by a 42-participant user study.
  legend: >-
    The upper branches create 1,000 real video-text, 925 real image-text, and 2,003 generated image-text cases; the
    lower row evaluates generated videos after standard frame normalization.
nodes:
  - id: webvid
    label: |-
      Reference Video-Text Branch
      Sample 1,000 Pairs from WebVid10M Validation
      Stratify by Video Subtype
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: laion
    label: |-
      Reference-Free Image-Text Branch
      Randomly Sample 925 LAION-Aesthetics Pairs
      Supports Video-Free Metrics
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: prompts
    label: |-
      Synthetic Prompt Branch
      Combine Subject • Behavior • Background • Style
      Randomly Create 3,000 Template Prompts
    type: process
    size: xl
    position:
      x: 40
      'y': 320
  - id: enrich
    label: |-
      Enrich Prompts with GPT-4
      Make Content More Vivid and Rich
      Preserve the Four-Part Semantic Composition
    type: process
    size: xl
    position:
      x: 320
      'y': 320
  - id: generate
    label: |-
      Generate and Filter Images
      SDXL Base • 1280×720 • 16:9
      T2I-CompBench Metrics Retain Top 2,003 Pairs
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: release
    label: |-
      Assemble AIGCBench
      1,000 + 925 + 2,003 = 3,928 Cases
      Reference-Video and Reference-Free Evaluation Paths
    type: database
    size: xl
    position:
      x: 1160
      'y': 180
  - id: i2v
    label: |-
      Run Image-to-Video Models
      Input Each Control Image and Its Text
      Generate Candidate Videos
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: normalize
    label: |-
      Standardize Video Inputs
      Use the First 16 Frames Unless Specified Otherwise
      Sample 4 Reference Keyframes Where Required
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: metrics
    label: |-
      Compute 11 Metrics in 4 Dimensions
      Control-Video Alignment • Motion Effects
      Temporal Consistency • Video Quality
    type: process
    size: xl
    position:
      x: 600
      'y': 560
  - id: report
    label: |-
      AIGCBench Metric Report
      Reference / Reference-Free CLIP and SSIM • MSE • RAFT Flow
      Adjacent-Frame Consistency • Frame Count • DOVER
    type: terminal
    size: xl
    position:
      x: 320
      'y': 560
  - id: human
    label: |-
      Validate the Standard with a User Study
      42 Participants • 30 Results from Each of 5 Methods
      Vote Best on the Same Four Dimensions
    type: user
    size: xl
    position:
      x: 40
      'y': 560
edges:
  - from: webvid
    to: release
    type: primary
  - from: laion
    to: release
    type: primary
  - from: prompts
    to: enrich
    type: primary
  - from: enrich
    to: generate
    type: primary
  - from: generate
    to: release
    type: primary
  - from: release
    to: i2v
    type: primary
  - from: i2v
    to: normalize
    type: primary
  - from: normalize
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
  - from: report
    to: human
    type: primary
modules: []
