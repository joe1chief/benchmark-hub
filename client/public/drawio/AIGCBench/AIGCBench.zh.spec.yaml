meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIGCBench 构建与验证流程
  description: 按论文构建 3,928 个 AIGCBench 样本，并让自动指标与人工研究并行验证图生视频输出。
  legend: 实线表示主要构建或评测流。自动指标与人工研究分别消费生成视频，仅在最终一致性分析处合流。
nodes:
  - id: webvid
    label: |-
      WebVid 验证集
      按视频子类型采样 1,000
      真实视频-文本对
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: laion
    label: |-
      LAION-Aesthetics
      美学子集采样 925
      真实图像-文本对
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: prompts
    label: |-
      组合 3,000 条提示词
      主体 • 行为
      背景 • 风格
    type: process
    size: xl
    position:
      x: 40
      'y': 320
  - id: enrich
    label: |-
      GPT-4 扩写
      丰富四段式提示词
      保留语义结构
    type: process
    size: xl
    position:
      x: 320
      'y': 320
  - id: generate
    label: |-
      生成并筛选图像
      SDXL：1280 × 720
      T2I 筛至 2,003 条
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: release
    label: |-
      组装 AIGCBench
      1,000 + 925 + 2,003
      共 3,928 个样本
    type: database
    size: xl
    position:
      x: 880
      'y': 180
  - id: i2v
    label: |-
      生成图生视频输出
      图像 + 文本控制
      得到候选视频
    type: process
    size: xl
    position:
      x: 1160
      'y': 180
  - id: normalize
    label: |-
      视频标准化
      使用前 16 帧
      必要时取 4 个参考关键帧
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: metrics
    label: |-
      自动评测
      4 个维度
      11 项指标
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: auto_report
    label: |-
      自动指标报告
      对齐 • 运动
      一致性 • 质量
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 40
  - id: human_sample
    label: |-
      人工研究采样
      每种方法 30 个视频
      5 种图生视频方法
    type: process
    size: xl
    position:
      x: 1440
      'y': 320
  - id: human_vote
    label: |-
      42 名参与者
      对 4 个维度投票
      独立判断
    type: user
    size: xl
    position:
      x: 1720
      'y': 320
  - id: human_report
    label: |-
      人工研究报告
      四维排序
      汇总投票
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 320
  - id: alignment
    label: |-
      验证一致性
      自动指标对比人工投票
      形成最终分析
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 180
edges:
  - from: webvid
    to: release
    type: primary
  - from: laion
    to: release
    type: primary
  - from: prompts
    to: enrich
    type: primary
  - from: enrich
    to: generate
    type: primary
  - from: generate
    to: release
    type: primary
  - from: release
    to: i2v
    type: primary
  - from: i2v
    to: normalize
    type: primary
  - from: normalize
    to: metrics
    type: primary
  - from: metrics
    to: auto_report
    type: primary
  - from: i2v
    to: human_sample
    type: primary
  - from: human_sample
    to: human_vote
    type: primary
  - from: human_vote
    to: human_report
    type: primary
  - from: auto_report
    to: alignment
    type: primary
  - from: human_report
    to: alignment
    type: primary
modules: []
