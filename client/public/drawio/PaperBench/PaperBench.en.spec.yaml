      Run reproduce.sh up to 12 hours
      Create outputs and reproduce.log
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Grade Every Leaf Independently
      SimpleJudge sees paper and rubric
      Rank and include top ten files
      Assign binary pass or fail
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Roll Up Weighted Scores
      Parent equals weighted child mean
      Propagate to rubric root
      Obtain one Replication Score
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Validate Judge with JudgeEval
      Partial replications of five papers
      Human expert leaf labels as gold
      Macro binary metrics · F1 0.83
    type: process
    size: xl
    position:
      x: 260
      'y': 420
