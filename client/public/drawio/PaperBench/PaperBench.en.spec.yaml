  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperBench Build and Evaluation Process
  description: >-
    Paper-aligned ICML paper filtering, author-approved rubric construction, clean reproduction, automated grading, and
    JudgeEval validation for PaperBench.
  legend: >-
    Candidates see the paper and author clarification addendum but not the rubric, and may not use author code or
    blacklisted replications.
