meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperBench 构建与评测流程
  description: 对齐论文 v3 的 ICML 论文筛选、作者核验的分层 rubric、干净环境复现、按要求类型执行的 SimpleJudge 评分、 加权汇总，以及独立 JudgeEval 验证分支。
  legend: 实线表示论文披露的构建或评测步骤；虚线表示固定证据、候选者访问、公开发布与许可证边界，不是额外流程步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2504.01848v3
      PDF 2f58f1a6581a
      Git df37a1752ad6
      项目树 caec0bdac8e6
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: icml_pool
    label: |-
      从 ICML 2024 开始
      Spotlight 与 Oral 论文
      当代机器学习研究
      建立广泛候选池
    type: database
    size: xl
    position:
      x: 280
      'y': 40
  - id: automated_filters
    label: |-
      GPT-4o 初筛
      商业机构与地理条件
      有实证贡献且非纯框架
      单机硬件可完成
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: dependency_filters
    label: |-
      应用复现性过滤
      不依赖闭源模型
      不需新采集或标注人类数据
      细节充分且依赖可获取
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: author_outreach
    label: |-
      人工筛查初筛论文
      确认适用性与单机范围
      共联系 42 位合格作者
      获得 20 项合作
      覆盖 12 个 ICML 主题
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: engineer_draft
    label: |-
      两名工程师起草 Rubric
      深入阅读论文
      分解实证贡献
      定义完整复现目标
    type: document
    size: xl
    position:
      x: 1580
      'y': 40
  - id: rubric_tree
    label: |-
      构建分层 Rubric
      要求组织为树
      子节点细化父目标
      兄弟节点按重要性加权
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: leaf_design
    label: |-
      细化叶节点标准
      专家可在 15 分钟内判定
      代码开发·执行·结果匹配
      20 篇论文共 8,316 个叶节点
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2100
      'y': 40
  - id: author_verification
    label: |-
      内部与原作者联合评审
      优化结构与措辞
      与原作者签订正式合作协议
      多轮反馈修订
      正确性确认与最终签署
    type: process
    size: xl
    position:
      x: 2360
      'y': 40
  - id: addenda
    label: |-
      解决论文信息不足
      面向候选者的补遗
      可选的仅评判器补遗
      记录澄清与范围
    type: document
    size: xl
    position:
      x: 2880
      'y': 40
  - id: task_release
    label: |-
      完成 PaperBench 任务
      20 篇 ICML 论文·12 个主题
      论文 + 补遗 + Rubric
      工件 + 黑名单 + 配置
    type: database
    size: xl
    position:
      x: 3140
      'y': 40
  - id: agent_rollout
    label: |-
      运行候选智能体
      论文 + 补遗 + 说明
      Ubuntu 24.04·单张 A10
      论文实验上限 12 小时
    type: process
    size: xl
    position:
      x: 3140
      'y': 560
  - id: submission
    label: |-
      提交复现仓库
      从零实现研究工作
      根目录必须有 reproduce.sh
      保留代码与实验配置
    type: document
    size: xl
    position:
      x: 2880
      'y': 560
  - id: clean_reproduction
    label: |-
      在全新虚拟机中复现
      Ubuntu 24.04·单张 A10
      从头执行 reproduce.sh
      论文执行上限 12 小时
    type: process
    size: xl
    position:
      x: 2620
      'y': 560
  - id: executed_submission
    label: |-
      形成执行后提交
      保留源代码仓库
      增加 reproduce.log
      增加生成结果与图表
    type: database
    size: xl
    position:
      x: 2360
      'y': 560
  - id: requirement_gate
    label: |-
      选择叶节点要求类型
      加载论文与完整 Rubric
      加入前序兄弟和祖先要求
      独立评分每个叶节点
    type: process
    size: xl
    position:
      x: 2100
      'y': 560
  - id: code_development
    label: |-
      代码开发分支
      查看文档与源代码
      查看 reproduce.sh
      是否存在正确实现？
    type: process
    size: xl
    position:
      x: 1840
      'y': 360
  - id: execution
    label: |-
      执行分支
      查看文档、代码和脚本
      查看 reproduce.log
      是否发生要求的执行？
    type: process
    size: xl
    position:
      x: 1840
      'y': 560
  - id: result_match
    label: |-
      结果匹配分支
      查看文档、脚本和日志
      查看新增或修改的输出
      证据是否匹配论文？
    type: process
    size: xl
    position:
      x: 1840
      'y': 760
  - id: simplejudge
    label: |-
      运行 SimpleJudge
      o3-mini-2025-01-31·高推理
      按要求类型筛选文件
      过长时排序并取前十个
      论文 + 补遗 + 相关证据
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1580
      'y': 560
  - id: binary_leaf
    label: |-
      叶节点二元评分
      满足当前标准记 1
      否则记 0
      缺脚本则执行与结果节点为 0
    type: process
    size: xl
    position:
      x: 1060
      'y': 560
  - id: weighted_rollup
    label: |-
      沿 Rubric 树加权汇总
      父节点为子节点加权均值
      分数逐层传播至根节点
      根节点即复现分数
    type: process
    size: xl
    position:
      x: 800
      'y': 560
  - id: final_metric
    label: |-
      报告基准表现
      平均复现分数
      对全部 20 篇论文求均值
      论文主实验每篇运行三次
    type: terminal
    size: xl
    position:
      x: 540
      'y': 560
  - id: judgeeval_examples
    label: |-
      构建 JudgeEval
      4 个 PaperBench 部分复现
      1 个开发集论文复现
      专家二元真值与解释
      不运行独立复现阶段
    type: database
    size: xl
    position:
      x: 1320
      'y': 1080
  - id: evaluate_judges
    label: |-
      评测多种评判后端
      GPT-4o-mini·GPT-4o
      o1-mini·o1·o3-mini
      按论文宏平均
    type: process
    size: xl
    position:
      x: 1580
      'y': 1080
  - id: judgeeval_result
    label: |-
      报告 JudgeEval 指标
      准确率·精确率·召回率·F1
      o3-mini SimpleJudge F1 为 0.83
      每篇约 66 美元
    type: terminal
    size: xl
    position:
      x: 2100
      'y': 1080
  - id: candidate_boundary
    label: |-
      候选者访问边界
      任务期间隐藏 Rubric
      禁止使用原作者代码
      监控逐论文黑名单
    type: document
    size: xl
    position:
      x: 3140
      'y': 1480
  - id: release_boundary
    label: |-
      固定公开发布
      commit df37a1752ad6·MIT
      20 个正式 + 3 个开发任务目录
      5 个 JudgeEval 样例
    type: document
    size: xl
    position:
      x: 2880
      'y': 1480
  - id: release_fix_boundary
    label: |-
      发布完整性边界
      初始 352ed048 缺少数据
      df37a175 补充随机插值任务
      并增加第 3 个开发任务
    type: document
    size: xl
    position:
      x: 2620
      'y': 1480
  - id: code_dev_boundary
    label: |-
      Code-Dev 变体边界
      跳过干净环境复现
      只评代码开发叶节点
      成本更低但严格性更弱
    type: document
    size: xl
    position:
      x: 2100
      'y': 1480
