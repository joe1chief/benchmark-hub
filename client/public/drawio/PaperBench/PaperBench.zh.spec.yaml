meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperBench 构建与评测流程
  description: 对齐论文的ICML论文筛选、原作者共建评分标准、干净环境复现、自动评分和JudgeEval验证流程。
  legend: 候选智能体只看到论文与作者澄清附录而看不到评分标准，并且不得使用作者代码或黑名单中的复现资源。
nodes:
  - id: step_1
    label: |-
      从ICML 2024起步
      收集Spotlight与Oral论文
      聚焦当代机器学习研究
      形成跨主题候选池
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      应用适配性筛选
      需有实证且单机可运行
      不依赖闭源模型或新人工数据
      方法细节与依赖可获取
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      阅读论文并招募作者
      随机检查筛选后论文
      联系42位原论文作者
      确定20篇并覆盖12个主题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      起草分层评分树
      两名研究工程师先行编写
      分解论文实证贡献
      定义完整复现所需结果
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      开展内部审查
      细化结构与判据
      使叶节点二元且足够细粒度
      按同层重要性赋权
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      与论文原作者共建
      多轮核验正确性
      消除论文未充分说明处
      编写候选与评判专用附录
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      定稿分层评分树
      结果匹配 · 执行
      代码开发三类叶节点
      原作者核验并签字确认
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      发布PaperBench任务
      20篇论文 · 8316个叶结果
      提供论文与澄清附录
      隐藏评分树并设置代码黑名单
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      智能体从零复现
      理解论文实证贡献
      开发并排查实验
      提交含reproduce.sh的仓库
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      在全新虚拟机复现
      Ubuntu 24.04 · 单张A10
      reproduce.sh最多运行12小时
      生成结果与reproduce.log
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      独立评判每个叶节点
      SimpleJudge读取论文与评分树
      排序并放入最相关十个文件
      给出二元通过或失败
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      加权向上汇总分数
      父节点为子节点加权均值
      一直传播到评分树根部
      得到单项Replication Score
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      用JudgeEval验证评判器
      五篇论文的部分复现提交
      人类专家叶标签作为金标准
      宏平均二元指标 · F1为0.83
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告基准表现
      平均Replication Score
      按要求类型拆分结果
      比较智能体与人类基线
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
