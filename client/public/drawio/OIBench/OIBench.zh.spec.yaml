meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OIBench 构建与评测流程
  description: 对齐论文，构建 250 道原创双语信息学奥赛题，配套高强度测试与已验证 C++ 标准解，再进行四种语言零样本执行、全测试通过评分和效率分析。
  legend: OIBench 报告通过率而非 pass@k：一个生成程序只有通过某题全部官方测试用例才算该题通过；时间与空间完成曲线另行分析效率。
nodes:
  - id: coaches
    label: |-
      招募资深 OI 教练
      ACM-ICPC 校队教练
      平均约 20 年执教经验
      从私有题库选题或原创命题
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: originality
    label: |-
      执行原创性与保密要求
      题目必须从未公开
      拒绝仅改数字或表述的改编
      防止直接检索命中
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: difficulty
    label: |-
      标注适当难度
      Codeforces 风格难度等级
      竞赛级别标签
      覆盖高难算法与范式
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: tests
    label: |-
      编写高强度官方测试
      大输入与资源压力场景
      边界与极端用例
      时间与空间限制
    type: database
    size: xl
    position:
      x: 740
      'y': 70
  - id: solutions
    label: |-
      提供 C++ 标准解
      执行全部官方测试
      确认题目可解
      验证测试用例正确性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: review
    label: |-
      六名 OI 参赛者复审
      检查表述清晰与可解性
      检查样例输入输出
      核验 TeX 与 Markdown
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: translate
    label: |-
      制作经核验的英文版本
      招募专业翻译人员
      使用信息学奥赛术语表
      教练与参赛者共同协助
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: contamination
    label: |-
      检查发布前数据污染
      逐题通过搜索引擎检索
      确认不能直接查到
      截至 2025 年 5 月发布时
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      发布 OIBench
      250 道原创中英文题目
      测试 · 难度标签 · 标准解
      平均测试规模 37.5M
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompt
    label: |-
      执行零样本代码生成
      输入完整题目与 OJ 输入输出格式
      目标 C++ · Java · Python · JavaScript
      推理模型最多 32,768 个 token
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: decode
    label: |-
      采用稳定解码设置
      贪心搜索 · 温度 0
      DeepSeek-R1 与 Qwen3 使用 0.6
      每种设置生成一个程序
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: execute
    label: |-
      在 Docker 中编译执行
      C++17 · g++ 11.3 · -O2
      固定 Java · Python · Node 版本
      监控运行时间与内存
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: grade
    label: |-
      应用全对判定
      运行某题全部官方测试
      仅全部通过才判该题正确
      按题计算 AC 通过率
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告正确性与效率
      总体及四种编程语言 AC 率
      中文与英文题面结果
      时间/空间完成曲线
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: coaches
    to: originality
    type: primary
  - from: originality
    to: difficulty
    type: primary
  - from: difficulty
    to: tests
    type: primary
  - from: tests
    to: solutions
    type: primary
  - from: solutions
    to: review
    type: primary
  - from: review
    to: translate
    type: primary
  - from: translate
    to: contamination
    type: primary
  - from: contamination
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: decode
    type: primary
  - from: decode
    to: execute
    type: primary
  - from: execute
    to: grade
    type: primary
  - from: grade
    to: report
    type: primary
modules: []
