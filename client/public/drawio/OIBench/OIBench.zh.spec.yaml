meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OIBench 论文 v1 构建、主评测与发布边界
  description: 对齐论文 v1 的专家命题、原创性与执行门禁、双语评审、四语言全测试通过评测、逐测试用例效率曲线， 并明确区分论文合同与固定版本公开评分器。
  legend: 实线表示论文披露的数据构建或 OIBench 主评测流程。虚线通向独立论文分析或固定版本来源与发布证据； 这些分支不属于 OIBench 主 AC 得分。
nodes:
  - id: scope
    label: |-
      固定 OIBench 范围
      arXiv 2506.10481v1 · 第 3–5 节
      主基准为 250 道题
      来源复核于 2026-07-18
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: coaches
    label: |-
      招募资深 OI 教练
      大学 ACM / 高中 OI
      平均约 20 年执教经验
      私有题目或全新命题
    type: process
    size: xl
    position:
      x: 260
      'y': 250
  - id: originality
    label: |-
      原创性 / 保密门禁
      网络和纸质材料均未发布
      拒绝只改数字
      拒绝只改措辞
      要求全新问题逻辑
    type: process
    size: xl
    position:
      x: 500
      'y': 250
  - id: difficulty
    label: |-
      标注难度元数据
      Codeforces 风格难度分
      竞赛级别标签
      面向前沿推理能力
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: tests
    label: |-
      编写稳健官方测试
      大规模 / 高资源输入
      覆盖边界与极端情形
      正文称标准列在附录
      v1 附录未列出该标准
    type: database
    size: xl
    position:
      x: 980
      'y': 250
  - id: canonical
    label: |-
      验证标准 C++ 解法
      每题一份
      运行全部官方测试
      确认可解性
      验证测试正确性
    type: process
    size: xl
    position:
      x: 1220
      'y': 250
  - id: review
    label: |-
      六名 OI 选手评审
      至少 CCPC 银牌
      检查可解性 · 清晰度 · 样例
      验证 TeX / Markdown
    type: process
    size: xl
    position:
      x: 1460
      'y': 250
  - id: translation
    label: |-
      生成英文版本
      三名专业译者
      翻译专业学位 · 至少两年
      使用 OI 教练 / 选手术语表
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
  - id: search_audit
    label: |-
      审计发布时可检索性
      在线搜索每一道题
      未发现可直接检索同题
      结论固定于 2025 年 5 月
    type: process
    size: xl
    position:
      x: 1940
      'y': 250
  - id: paper_release
    label: |-
      发布 OIBench 主基准
      250 道原创双语题目
      测试 · 难度 · 标准 C++
      平均测试规模：37.5M
    type: database
    size: xl
    position:
      x: 2180
      'y': 250
  - id: prompt
    label: |-
      执行零样本代码生成
      完整题目 + OJ 输入输出
      C++ · Java · Python · JavaScript
      推理模型上限 32,768 token
    type: document
    size: xl
    position:
      x: 2420
      'y': 250
  - id: decode
    label: |-
      应用论文解码设置
      默认贪心 · 温度 0
      DeepSeek-R1 / Qwen3-32B：0.6
      按语言保留主结果
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
  - id: runtime
    label: |-
      使用论文 Docker 运行时
      CentOS 7.6 · 内核 5.4
      glibc 2.31 · C++17 g++11.3 -O2
      Java 1.8.0u45 · Python 3.9
      Node 16.18.1 · npm 8.19.2
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
    style:
      fontSize: 9
  - id: judge
    label: |-
      编译并执行
      运行全部官方测试
      监控时间与内存
      保留逐测试结果
    type: process
    size: xl
    position:
      x: 3140
      'y': 250
  - id: ac_score
    label: |-
      计算主 AC 率
      仅在全部测试通过时接受
      总体 + 四语言 AC
      对比中文 / 英文
    type: process
    size: xl
    position:
      x: 3380
      'y': 40
  - id: efficiency
    label: |-
      构建完成曲线
      逐测试通过率 · 不是 AC
      X：相对标准解资源比
      对数尺度
      Y：通过测试用例占比
    type: process
    size: xl
    position:
      x: 3380
      'y': 460
  - id: report
    label: |-
      报告正确性 / 效率
      AC 与完成曲线保持独立
      保留各语言分项结果
      排除独立分析轨道
    type: terminal
    size: xl
    position:
      x: 3620
      'y': 250
  - id: separate_tracks
    label: |-
      保持分析彼此独立
      OIBench Pseudo · Risk-Score
      衍生 BF · CP · TS · IT
      人类对比
      44 道题
    type: document
    size: xl
    position:
      x: 3860
      'y': 40
  - id: source_boundary
    label: |-
      论文 / 代码 / 许可证边界
      PDF 42dc756… · 代码 2a84ab8…
      HF 数据 7736d47… · 250 行
      数据 CC BY-ND 4.0 · 代码无 LICENSE
      宿主评分器：无 Docker / 曲线
    type: document
    size: xl
    position:
      x: 3860
      'y': 460
    style:
      fontSize: 9
