meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OIBench Build and Evaluation Process
  description: >-
    Paper-aligned creation of 250 original bilingual Olympiad-in-Informatics problems with robust tests and verified C++
    solutions, followed by zero-shot four-language execution, all-tests-correct scoring, and efficiency analysis.
  legend: >-
    OIBench reports accepted rate rather than pass@k: a generated program is accepted for a problem only when it passes
    every official test case. Time and space completion curves provide a separate efficiency view.
