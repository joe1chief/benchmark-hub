meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench 构建流程
  description: 对齐论文的 AutoCodeGen 流程：从 Stack-Edu 种子，经 LLM-沙箱测试合成、逆向题目生成、 三阶段过滤与多语言平衡，形成可执行基准。
  legend: 先从左到右阅读生成行，再从右到左阅读过滤与评测行。
nodes:
  - id: seeds
    label: |-
      Stack-Edu 种子代码
      来自 The Stack v2 的教育代码
      函数 / 类 / 文件级片段
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: solution
    label: |-
      精炼代码解答
      DeepSeek-V3-0324 + 语言 Few-Shot
      自包含、可验证、带清晰注释
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: inputs
    label: |-
      生成测试输入
      公开：不超过 3 个基础用例
      私有：7 个以上且覆盖边界
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: outputs
    label: |-
      多语言沙箱执行
      解答 + 公开 / 私有输入
      获取对应测试输出
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      整合可执行测试
      LLM 将输入输出组合为断言
      重跑解答与两类测试函数
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: problem
    label: |-
      逆向生成编程题
      遵循六项启发式规范
      嵌入公开测试且不泄露解题提示
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: translate
    label: |-
      路由语言覆盖
      6 种语言直接使用生成流程
      其余14种翻译未用数据；全部进入过滤
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: difficulty
    label: |-
      难度控制
      DeepSeek-Coder-V2-Lite 尝试 10 次
      删除 10/10 全部解出的题目
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: quality
    label: |-
      质量控制
      DeepSeek-R1-0528 按 7 项标准批评
      检查可复现性与题目-测试一致性
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: diversity
    label: |-
      多样性采样
      DeepSeek-V3-0324 标注类别
      在各类别池间循环采样
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: dataset
    label: |-
      AutoCodeBench
      3,920 题 / 37,777 个测试
      20 种语言 / 14 类场景
    type: database
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      可执行评测
      沙箱运行隐藏完整测试
      Pass@1 + 难度与语言分析
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: seeds
    to: solution
    type: primary
  - from: solution
    to: inputs
    type: primary
  - from: inputs
    to: outputs
    type: primary
  - from: outputs
    to: tests
    type: primary
  - from: tests
    to: problem
    type: primary
  - from: problem
    to: translate
    type: primary
  - from: translate
    to: difficulty
    type: primary
  - from: difficulty
    to: quality
    type: primary
  - from: quality
    to: diversity
    type: primary
  - from: diversity
    to: dataset
    type: primary
  - from: dataset
    to: report
    type: primary
modules: []
