meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench 构建与评测流程
  description: 按论文区分公开演示测试与私有完整隐藏测试，再经过三阶段过滤、后验人工核验和官方双测试函数 Pass@1 评测。
  legend: 公开演示测试嵌入题面；官方评测要求 demo_test_func 与 full_test_func 均通过。
nodes:
  - id: seeds
    label: |-
      Stack-Edu 种子代码片段
      来自 The Stack v2 的教育代码
      函数 / 类 / 文件级
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: solution
    label: |-
      精炼代码解答
      DeepSeek-V3-0324 + 少样本
      自包含且可验证
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: test_gate
    label: |-
      生成两类测试输入
      公开演示 + 私有完整
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: demo_tests
    label: |-
      公开演示测试输入
      不超过 3 个基础用例
      嵌入题面作为示例
    type: document
    size: xl
    position:
      x: 880
      'y': 0
  - id: full_tests
    label: |-
      私有完整隐藏测试输入
      7+ 个用例，含边界情况
      综合正确性测试
    type: document
    size: xl
    position:
      x: 880
      'y': 200
  - id: execute_inputs
    label: |-
      执行解答与两类输入
      多语言沙箱
      获取演示与隐藏输出
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: integrate
    label: |-
      构建可执行测试函数
      DeepSeek-V3 整合输入输出
      demo_test_func
      full_test_func
      与解答一起重跑两类测试
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: problem
    label: |-
      逆向生成编程题
      六项启发式规范
      嵌入演示测试 • 不泄露解法
    type: document
    size: xl
    position:
      x: 1720
      'y': 100
  - id: translate
    label: |-
      语言覆盖路由
      6 种语言走直接流程
      其余 14 种翻译未使用数据
      再应用相同过滤
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: difficulty
    label: |-
      难度控制
      DeepSeek-Coder-V2-Lite
      每题尝试 10 次
      丢弃 10 / 10 解出的题
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: quality
    label: |-
      LLM-as-Critic 质量控制
      DeepSeek-R1-0528
      七项一致性准则
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: diversity
    label: |-
      多样性采样
      DeepSeek-V3 类别标签
      跨类别池循环采样
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: dataset
    label: |-
      发布 AutoCodeBench
      3,920 题 • 37,777 个测试
      20 种语言 • 14 个类别
    type: database
    size: xl
    position:
      x: 600
      'y': 440
  - id: model_output
    label: |-
      生成候选代码
      必须使用单个围栏代码块
      统一系统提示
    type: process
    size: xl
    position:
      x: 320
      'y': 360
  - id: sandbox_eval
    label: |-
      沙箱评测
      运行 full_test_func
      + demo_test_func
      两者均须返回 PASSED
      Pass@1
    type: process
    size: xl
    position:
      x: 40
      'y': 360
  - id: audit
    label: |-
      后验人工核验
      6 位专业标注员
      6 种语言 • 二元有效性
      准确率 87.6%
    type: user
    size: xl
    position:
      x: 320
      'y': 600
  - id: report
    label: |-
      报告多语言结果
      按语言 / 难度报告 Pass@1
      保留 87.6% 核验限制
    type: terminal
    size: xl
    position:
      x: 40
      'y': 600
edges:
  - from: seeds
    to: solution
    type: primary
  - from: solution
    to: test_gate
    type: primary
  - from: test_gate
    to: demo_tests
    type: primary
  - from: test_gate
    to: full_tests
    type: primary
  - from: demo_tests
    to: execute_inputs
    type: primary
  - from: full_tests
    to: execute_inputs
    type: primary
  - from: execute_inputs
    to: integrate
    type: primary
  - from: integrate
    to: problem
    type: primary
  - from: problem
    to: translate
    type: primary
  - from: translate
    to: difficulty
    type: primary
  - from: difficulty
    to: quality
    type: primary
  - from: quality
    to: diversity
    type: primary
  - from: diversity
    to: dataset
    type: primary
  - from: dataset
    to: model_output
    type: primary
  - from: model_output
    to: sandbox_eval
    type: primary
  - from: dataset
    to: audit
    type: data
  - from: sandbox_eval
    to: report
    type: primary
  - from: audit
    to: report
    type: secondary
modules: []
