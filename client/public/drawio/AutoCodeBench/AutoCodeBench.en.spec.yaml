meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench Build Process
  description: >-
    Paper-aligned AutoCodeGen workflow from Stack-Edu seeds through LLM-sandbox test synthesis, reverse-order problem
    generation, three-stage filtering, and multilingual balancing.
  legend: Read the generation row left-to-right, then the filtering and evaluation row right-to-left.
nodes:
  - id: seeds
    label: |-
      Stack-Edu Seed Snippets
      Educational Code from The Stack v2
      Function / Class / File Level
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: solution
    label: |-
      Refine Code Solutions
      DeepSeek-V3-0324 + Language Few-Shot
      Self-Contained, Verifiable, Commented
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: inputs
    label: |-
      Generate Test Inputs
      Public: Up to 3 Basic Cases
      Private: 7+ Cases Including Edges
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: outputs
    label: |-
      Execute in Multilingual Sandbox
      Solution + Public / Private Inputs
      Capture Corresponding Outputs
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      Integrate Executable Tests
      LLM Combines Inputs + Outputs into Assertions
      Re-run Solution and Both Test Functions
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: problem
    label: |-
      Reverse-Order Problem Generation
      Six Heuristic Specifications
      Embed Public Tests; Do Not Leak Solution Hints
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: translate
    label: |-
      Route Language Coverage
      Six Languages Use the Direct Workflow
      Other 14 Translate Unused Data; All Enter Filtering
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: difficulty
    label: |-
      Difficulty Control
      DeepSeek-Coder-V2-Lite: 10 Attempts
      Discard Problems Solved 10/10
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: quality
    label: |-
      Quality Control
      DeepSeek-R1-0528 Critiques 7 Criteria
      Check Reproducibility and Problem-Test Alignment
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: diversity
    label: |-
      Diversity Sampling
      DeepSeek-V3-0324 Category Labels
      Cyclic Sampling Across Category Pools
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: dataset
    label: |-
      AutoCodeBench
      3,920 Problems / 37,777 Tests
      20 Languages / 14 Categories
    type: database
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Executable Evaluation
      Sandbox Runs Hidden Full Tests
      Pass@1 + Difficulty and Language Analysis
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: seeds
    to: solution
    type: primary
  - from: solution
    to: inputs
    type: primary
  - from: inputs
    to: outputs
    type: primary
  - from: outputs
    to: tests
    type: primary
  - from: tests
    to: problem
    type: primary
  - from: problem
    to: translate
    type: primary
  - from: translate
    to: difficulty
    type: primary
  - from: difficulty
    to: quality
    type: primary
  - from: quality
    to: diversity
    type: primary
  - from: diversity
    to: dataset
    type: primary
  - from: dataset
    to: report
    type: primary
modules: []
