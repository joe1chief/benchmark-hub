  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench Build Process
  description: >-
    Paper-aligned AutoCodeGen pipeline for constructing the 3,920-problem multilingual AutoCodeBench dataset from
    Stack-Edu code seeds through sandbox-backed tests, reverse problem generation, filtering, human audit, and Pass@1
    evaluation, based on arXiv:2508.09101.
  legend: Solid arrows show the construction and evaluation pipeline; dashed arrows mark sandbox and human-quality feedback.
