meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VQA v2 互补对构建与评测流程
  description: >-
    VQA v2从原始VQA图像-问题-答案三元组出发，用VGGNet
    fc7特征检索24张视觉相近的COCO候选图，再由人工选择一张使原问题仍成立但答案发生变化的互补图像。另一批标注者为新图像问答对收集10个答案，随后合并互补对并发布官方切分。评测采用标准VQA软准确率、答案类型拆分与互补对准确率。
  legend: 来源：VQA v2.0 arXiv:1612.00837 and official visualqa.org complementary-pairs documentation。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
