    label: |-
      原始VQA
      图像问题答案
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: neighbors
    label: |-
      24张COCO近邻
      VGGNet fc7
    type: process
    size: xl
    position:
      x: 340
      'y': 180
  - id: select
    label: |-
      人工选择互补图I′
      问题相关且答案不同
    type: user
    size: xl
    position:
      x: 640
      'y': 180
  - id: answers
    label: |-
