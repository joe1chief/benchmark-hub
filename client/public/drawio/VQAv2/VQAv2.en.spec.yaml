meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VQA v2 Complementary-Pair Build and Evaluation
  description: >-
    VQA v2 starts from original VQA image-question-answer triples, retrieves 24 visually similar COCO candidates with
    VGGNet fc7 features, and asks humans to select a complementary image for which the same question remains relevant
    but the answer changes. A separate answer-collection stage gathers ten answers for the new image-question pair
    before complementary pairs and official splits are released. Evaluation uses standard VQA soft accuracy, answer-type
    breakdowns, and complementary-pair accuracy.
  legend: >-
    Source: VQA v2.0 arXiv:1612.00837 and official visualqa.org complementary-pairs documentation. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
