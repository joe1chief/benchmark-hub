meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LogicVista Build Process
  description: >-
    Paper-aligned construction of leakage-resistant visual logic questions from closed licensed sources, with manual
    answer and rationale annotation, five reasoning skills, nine capabilities, iterative answer extraction, and scores.
  legend: >-
    Counts follow arXiv:2407.04973v1: 448 multiple-choice samples, five annotators working for three months, five
    reasoning skills, and nine explicit multimodal capabilities.
nodes:
  - id: sources
    label: |-
      Select Closed Visual-reasoning Sources
      Require License · Registration · Payment
      Obtain Creator Permission for Research Use
      Reduce Benchmark Leakage into Pretraining
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: annotate
    label: |-
      Conduct Three Months of Manual Collection
      Use Five Human Annotators
      Extract Visual Intelligence-test Questions
      Avoid Real-scene Context Shortcuts
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: labels
    label: |-
      Annotate Each Visual Question
      Record the Multiple-choice Options
      Identify the Correct Answer
      Write or Recover the Supporting Rationale
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: capabilities
    label: |-
      Tag Nine Multimodal Capabilities
      Diagrams · OCR · Patterns · Graphs · Tables
      3D Shapes · Puzzles · Sequences · Physics
      Specify the Visual Evidence Required
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: skills
    label: |-
      Tag Five Reasoning Skills
      Inductive · Deductive · Numerical
      Spatial · Mechanical
      Cover Human Critical-thinking Categories
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: json
    label: |-
      Organize Annotations as JSON
      Store Image · Question · Choices
      Store Correct Answer and Rationale
      Preserve Skill and Capability Labels
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
    label: |-
      Release 448 LogicVista Samples
      Image-based Multiple-choice Questions
      Closed-source Curation Reduces Contamination
      Human Answers and Rationales Support Judging
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: run
    label: |-
      Evaluate Eight Representative MLLMs
      Prompt with Image · Question · Choices
      Collect Both Choice-style and Open Responses
      Keep Generated Reasoning for Extraction Context
    type: process
    size: xl
    position:
      x: 1700
      'y': 420
  - id: extract
    label: |-
      Extract a Multiple-choice Letter
      Give an LLM the Question and Options
      Include the MLLM Answer and Reasoning
      Map Open-ended Output to a Candidate Choice
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: validate
    label: |-
      Valid Choice?
      Yes: Compare
      No: Retry
    type: decision
    size: xl
    position:
      x: 1140
      'y': 420
  - id: feedback
    label: |-
      Repair an Invalid Extraction
      Explain the Validation Failure
      Return Feedback to the Extractor
      Repeat until a Valid Choice Is Obtained
    type: process
    size: xl
    position:
      x: 1280
      'y': 650
  - id: compare
    label: |-
      Compare with the Human Answer
      Mark Each Sample Correct or Incorrect
      Use the Same Binary Result across Views
      Retain Skill and Capability Membership
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: report
    label: |-
      Report Accuracy at Three Levels
      Overall LogicVista Score
      Five Reasoning-skill Scores
      Nine Multimodal-capability Scores
    type: terminal
    size: xl
    position:
      x: 580
      'y': 420
edges:
  - from: sources
    to: annotate
    type: primary
  - from: annotate
    to: labels
    type: primary
  - from: labels
    to: capabilities
    type: primary
  - from: capabilities
    to: skills
    type: primary
  - from: skills
    to: json
    type: primary
  - from: json
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: extract
    type: primary
  - from: extract
    to: validate
    type: primary
  - from: validate
    to: feedback
    type: secondary
  - from: feedback
    to: extract
    type: secondary
  - from: validate
    to: compare
    type: primary
  - from: compare
    to: report
    type: primary
modules: []
