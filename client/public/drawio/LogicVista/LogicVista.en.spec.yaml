meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LogicVista Build and Evaluation Process
  description: >-
    Paper-v1 construction of 448 visual multiple-choice reasoning items, the pinned public repository schema and
    taxonomy drift, and the exact released GPT-4 answer-extraction and accuracy path.
  legend: >-
    Solid arrows show paper-backed dataset construction or the released evaluator's straight-through scoring path.
    Dashed arrows show under-specified model inference, defective fallback code, and the publication boundary.
    Unconnected middle-row cards are independent release-audit findings. Paper facts are separated from repository
    commit e5795f17189ce1243231250af7d8c112ae2c5a57 wherever the two artifacts differ.
