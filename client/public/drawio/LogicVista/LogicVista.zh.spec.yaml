meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LogicVista 构建流程
  description: 按论文复原 LogicVista：从有许可门槛的封闭来源收集防泄漏视觉逻辑题，人工标注答案与理由，标记五类推理技能和九种 多模态能力，并通过迭代答案抽取后分层评分。
  legend: 数量依据 arXiv:2407.04973v1：448 道多选题；5 名标注者历时 3 个月；覆盖五类推理技能与九种明确的多模态能力。
nodes:
  - id: sources
    label: |-
      选择封闭视觉推理来源
      要求许可、注册或付费访问
      获得创作者的研究使用授权
      降低基准进入预训练数据的风险
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: annotate
    label: |-
      开展三个月人工收集
      由 5 名标注者完成
      摘取视觉智力测试题
      避免真实场景上下文捷径
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: labels
    label: |-
      标注每道视觉问题
      记录多项选择候选项
      确定正确答案
      编写或整理支持该答案的理由
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: capabilities
    label: |-
      标记九种多模态能力
      图示 · OCR · 模式 · 图形 · 表格
      3D 形状 · 谜题 · 序列 · 物理
      明确问题需要的视觉证据
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: skills
    label: |-
      标记五类推理技能
      归纳 · 演绎 · 数值
      空间 · 机械
      覆盖人类批判思考常用类别
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: json
    label: |-
      将标注组织为 JSON
      保存图像、问题与选项
      保存正确答案与推理理由
      保留技能与能力类别标签
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
    label: |-
      发布 448 道 LogicVista 样本
      均为图像多项选择题
      封闭来源整理可减少污染
      人工答案与理由支持评测
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: run
    label: |-
      评测 8 个代表性多模态模型
      输入图像、问题与选项
      收集选项式或开放式回答
      保留生成理由供答案抽取使用
    type: process
    size: xl
    position:
      x: 1700
      'y': 420
  - id: extract
    label: |-
      抽取多项选择字母
      向抽取 LLM 提供问题与选项
      同时提供模型回答及推理
      将开放回答映射到候选项
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: validate
    label: |-
      选项有效？
      是：比较
      否：重试
    type: decision
    size: xl
    position:
      x: 1140
      'y': 420
  - id: feedback
    label: |-
      修复无效的答案抽取
      说明选项验证失败原因
      将反馈返回抽取模型
      重复直至获得有效候选项
    type: process
    size: xl
    position:
      x: 1280
      'y': 650
  - id: compare
    label: |-
      与人工答案进行比较
      将每道题标为正确或错误
      各分组复用同一二值结果
      保留技能和能力类别归属
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: report
    label: |-
      从三个层级报告准确率
      LogicVista 总体分数
      五类推理技能分数
      九种多模态能力分数
    type: terminal
    size: xl
    position:
      x: 580
      'y': 420
edges:
  - from: sources
    to: annotate
    type: primary
  - from: annotate
    to: labels
    type: primary
  - from: labels
    to: capabilities
    type: primary
  - from: capabilities
    to: skills
    type: primary
  - from: skills
    to: json
    type: primary
  - from: json
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: extract
    type: primary
  - from: extract
    to: validate
    type: primary
  - from: validate
    to: feedback
    type: secondary
  - from: feedback
    to: extract
    type: secondary
  - from: validate
    to: compare
    type: primary
  - from: compare
    to: report
    type: primary
modules: []
