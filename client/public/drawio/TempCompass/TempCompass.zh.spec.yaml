meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TempCompass 构建与评测流程
  description: >-
    TempCompass定义动作、速度、方向、属性变化和事件顺序5个时间维度，细分为10个子维度，并覆盖9类静态内容。原始视频从Shutterstock收集，控制内容类别平衡，并确认不在WebVid中。为阻断语言先验和单帧捷径，作者通过倒放、空间拼接或时间拼接构造静态内容相同但某项时间属性不同的冲突视频对或三元组。人工在410段视频上标注500条由主体和时间信息组成的半结构化元信息。ChatGPT
    gpt-3.5-turbo先生成多选题，经人工修正后再派生是非问答、字幕匹配和字幕生成指令，后续指令也再次人工修正。每条元信息至少生成3、2、3、4条四类指令，合计7540条。质量验证随机抽200条指令交给3名人工作答。评测前三类任务先用专用规则解析显式选项，无法匹配的回答再交给ChatGPT；字幕生成完全由ChatGPT根据生成字幕回答对应多选题，并加入None选项。最终按任务和时间维度报告准确率。
  legend: 来源：TempCompass arXiv:2403.00476 Sections 3.1-3.4 and official llyx97/TempCompass repository。实线箭头表示论文或官方资料明确支持的主流程。
