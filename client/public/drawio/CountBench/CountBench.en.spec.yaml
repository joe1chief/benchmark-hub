meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CountBench Build and Evaluation Process
  description: >-
    Paper-aligned construction of a balanced, manually verified 540-image counting benchmark from LAION-400M and its
    nine-way zero-shot image-text similarity evaluation.
  legend: Solid arrows trace automated filtering, balancing, manual verification, held-out release, and zero-shot scoring.
nodes:
  - id: laion
    label: |-
      Public LAION-400M
      Image-Caption Pairs
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: number_filter
    label: |-
      Keep Spelled Counts Two through Ten
      Remove Dates, Ages, Times, Addresses
      and Other Non-Visible Number Uses
    type: process
    size: xl
    position:
      x: 320
      'y': 190
  - id: detector
    label: |-
      Off-the-Shelf Object Detector
      Count Each Detected Object Class
      Match Caption to Most Prevalent Class
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: candidate
    label: |-
      Automatically Filtered Candidates
      Severe Imbalance: 158K+ Two
      versus about 100 Ten
    type: database
    size: xl
    position:
      x: 880
      'y': 190
  - id: balance
    label: |-
      Pre-Balance Counts
      100 to 200 Candidates per Number
    type: process
    size: xl
    position:
      x: 1160
      'y': 190
  - id: verify
    label: |-
      Manual Verification
      Caption Count Must Match
      Clearly Visible Objects
    type: user
    size: xl
    position:
      x: 1440
      'y': 190
  - id: dataset
    label: |-
      CountBench Test Only
      60 Pairs per Count x 9 = 540
      No Overlap with Counting Training Set
    type: database
    size: xl
    position:
      x: 1720
      'y': 190
  - id: captions
    label: |-
      Create Nine Candidate Captions
      Replace Number with Two through Ten
      One Correct + Eight Counterfactuals
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: similarity
    label: |-
      Zero-Shot VLM Inference
      Compute Image-Text Similarity
      Choose Highest-Scoring Number
    type: process
    size: xl
    position:
      x: 2280
      'y': 190
  - id: report
    label: |-
      Report Counting Accuracy
      and Mean Count Deviation
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
edges:
  - from: laion
    to: number_filter
    type: primary
  - from: number_filter
    to: detector
    type: primary
  - from: detector
    to: candidate
    type: primary
  - from: candidate
    to: balance
    type: primary
  - from: balance
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: captions
    type: primary
  - from: captions
    to: similarity
    type: primary
  - from: similarity
    to: report
    type: primary
modules: []
