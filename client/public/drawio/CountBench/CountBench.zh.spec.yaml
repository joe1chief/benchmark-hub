meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CountBench 构建与评测流程
  description: 按论文还原从 LAION-400M 构建平衡且人工验证的 540 图像计数基准，以及九分类零样本图文相似度评测。
  legend: 实线依次表示自动过滤、平衡、人工验证、保留测试集发布和零样本评分。
nodes:
  - id: laion
    label: |-
      公开 LAION-400M
      图像与描述对
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: number_filter
    label: |-
      保留英文 two 到 ten 计数词
      排除日期、年龄、时间、地址
      及其他非可见数量用法
    type: process
    size: xl
    position:
      x: 320
      'y': 190
  - id: detector
    label: |-
      现成目标检测器
      统计每类检测对象数量
      描述匹配图中数量最多的类别
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: candidate
    label: |-
      自动过滤候选
      数量严重失衡：two 超过 158K
      ten 仅约 100
    type: database
    size: xl
    position:
      x: 880
      'y': 190
  - id: balance
    label: |-
      初步平衡数量
      每个数字保留 100 到 200 个候选
    type: process
    size: xl
    position:
      x: 1160
      'y': 190
  - id: verify
    label: |-
      人工验证
      描述数量必须匹配
      图中清晰可见对象
    type: user
    size: xl
    position:
      x: 1440
      'y': 190
  - id: dataset
    label: |-
      CountBench 仅作测试
      每个数量 60 对 × 9 = 540
      与计数训练集无重叠
    type: database
    size: xl
    position:
      x: 1720
      'y': 190
  - id: captions
    label: |-
      创建九条候选描述
      用 two 到 ten 替换数字
      一条正确 + 八条反事实
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: similarity
    label: |-
      零样本 VLM 推理
      计算图文相似度
      选择得分最高的数字
    type: process
    size: xl
    position:
      x: 2280
      'y': 190
  - id: report
    label: |-
      报告计数准确率
      与平均数量偏差
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
edges:
  - from: laion
    to: number_filter
    type: primary
  - from: number_filter
    to: detector
    type: primary
  - from: detector
    to: candidate
    type: primary
  - from: candidate
    to: balance
    type: primary
  - from: balance
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: captions
    type: primary
  - from: captions
    to: similarity
    type: primary
  - from: similarity
    to: report
    type: primary
modules: []
