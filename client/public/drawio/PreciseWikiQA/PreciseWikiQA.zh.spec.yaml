meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreciseWikiQA 构建与评测流程
  description: 按HalluLens论文重建动态短问答生成、标准答案人工验证、被测模型推理、两阶段评审及固定代码差异。
  legend: 实线表示论文构建或固定实现流程；虚线表示证据、验证、数据、运行器、解析器与权利边界，这些说明卡不是额外阶段。
nodes:
  - id: source_evidence
    label: |-
      固定论文与官方证据
      arXiv 2504.17550v1 · PDF 2257f8628da9
      Git 80307ac6bc9f
      GoodWiki 7491f6da6439 · 各来源分开
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: benchmark_scope
    label: |-
      定义外在幻觉评测
      提出简短事实查询
      假设知识可能存在于训练语料
      推理时不提供维基百科上下文
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: goodwiki_release
    label: |-
      固定GoodWiki来源
      44,754页 · 采集于2023年9月4日
      HF版本7491f6da6439
      Parquet LFS哈希2b8b3edebede
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: wikirank_join
    label: |-
      关联WikiRank 2024重要度
      使用每个维基页面的调和中心性
      标题哈希f83bc6ac3f3a
      分数哈希2acf403c1f0e
    type: process
    size: xl
    position:
      x: 860
      'y': 80
  - id: difficulty_bins
    label: |-
      创建10个档位
      0最难 · 9最易
      中心性代理训练数据出现频率
      保持不同运行的难度分布稳定
    type: process
    size: xl
    position:
      x: 1120
      'y': 80
  - id: page_sampling
    label: |-
      抽取来源页面池
      每档抽取500页
      每次试验使用5,000个来源页
      每次试验重新生成动态集合
    type: database
    size: xl
    position:
      x: 1380
      'y': 80
  - id: section_sampling
    label: |-
      选择一个参考章节
      将每个维基页面切分为章节
      超过两节时去掉最后一节
      从剩余章节随机选择一个
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: question_generation
    label: |-
      生成客观问题
      使用Llama-3.1-70B-Instruct
      简洁 · 无需上下文 · 唯一答案
      问题温度0.7 · Top-p 0.9
    type: process
    size: xl
    position:
      x: 1900
      'y': 80
  - id: answer_generation
    label: |-
      独立生成标准答案
      使用同一参考章节
      仅返回一个词或短语
      可回答性调用温度为0
    type: process
    size: xl
    position:
      x: 1900
      'y': 400
  - id: quality_gate
    label: |-
      质量门
      不可回答：重新生成
      超过10词：过滤
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 1640
      'y': 400
  - id: dynamic_set
    label: |-
      形成动态测试集
      每次试验5,000组问答
      不提供固定公开问题列表
      独立生成并执行三次试验
    type: database
    size: xl
    position:
      x: 1380
      'y': 400
  - id: gold_audit
    label: |-
      审核生成的标准答案
      人工标注250组生成问答
      97.2%的答案正确
      另行验证评审模型准确率
    type: document
    size: xl
    position:
      x: 1380
      'y': 680
  - id: inference_config
    label: |-
      执行被测模型推理
      只发送问题 · 不附上下文
      温度0 · Top-p 1
      使用各模型默认聊天模板
      三次试验 · 自由文本响应
    type: process
    size: xl
    position:
      x: 1120
      'y': 400
  - id: model_response
    label: |-
      收集自由文本响应
      允许直接回答或拒答
      不添加维基百科检索上下文
      为两类评审保留完整文本
    type: process
    size: xl
    position:
      x: 860
      'y': 400
  - id: abstention_judge
    label: |-
      使用Llama-3.1-70B-Instruct
      拒答JSON
      纠正答案 = 尝试
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 600
      'y': 400
  - id: correctness_judge
    label: |-
      判断已尝试答案是否正确
      将响应与标准答案比较
      正确 · 错误 · 不可验证
      后两类都计为幻觉
    type: process
    size: xl
    position:
      x: 340
      'y': 240
  - id: score_metrics
    label: |-
      报告三次试验平均指标
      错误拒答率
      尝试回答中的幻觉率
      总体正确回答率
    type: terminal
    size: xl
    position:
      x: 80
      'y': 400
  - id: data_boundary
    label: |-
      数据版本边界
      固定GoodWiki版本7491f6da6439
      WikiRank下载地址没有版本号
      本次审查以观测字节哈希固定
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: regeneration_drift
    label: |-
      论文与批处理重生成差异
      论文重试不可回答的问题
      批处理以continue直接丢弃
      每个桶使用100个候选缓冲
    type: document
    size: xl
    position:
      x: 1640
      'y': 680
  - id: runner_boundary
    label: |-
      固定运行器边界
      模块默认N为5000 · 脚本传入N为1
      未固定抽样随机种子
      被测模型默认最多生成256词元
    type: document
    size: xl
    position:
      x: 1120
      'y': 680
  - id: judge_parser_drift
    label: |-
      评审提示与解析器差异
      提示先列三类又要求Yes或No
      解析器接受精确的correct或yes
      其余结果全部标为幻觉
    type: document
    size: xl
    position:
      x: 340
      'y': 680
  - id: license_boundary
    label: |-
      许可证与权利边界
      HalluLens：CC BY-NC 4.0
      GoodWiki数据集：MIT
      不推断WikiRank未声明的权利
    type: document
    size: xl
    position:
      x: 80
      'y': 240
