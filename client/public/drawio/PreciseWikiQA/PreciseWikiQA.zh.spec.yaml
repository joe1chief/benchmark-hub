meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreciseWikiQA 构建与评测流程
  description: 按HalluLens论文动态构建按百科重要度分层的短事实问答并分别判断拒答与正确性以评估外在幻觉。
  legend: 每次动态运行从十个WikiRank难度桶各抽500页，并从GoodWiki生成5,000组短事实问答。
nodes:
  - id: step_1
    label: |-
      定义评测范围
      评估外在幻觉
      使用假定已见的训练知识
      要求简短事实答案
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      从GoodWiki开始
      44,754个高质量维基页面
      覆盖广泛主题与事实内容
      使用公开可复现来源池
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      关联WikiRank重要度
      使用每页调和中心性
      代理训练语料出现频率
      排列头部到长尾知识
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      创建十个难度桶
      标记为0至9级
      按中心性由难到易
      稳定动态集难度
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      抽取5,000个源页面
      每个难度桶抽500页
      平衡全部难度层级
      每个动态集重新采样
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      选择参考章节
      把百科页面切为章节
      随机选取一个章节
      推理时不提供该来源
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      生成客观问题
      Llama 3.1 70B阅读章节
      问题具体且自包含
      无需额外上下文
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      独立生成标准答案
      基于同一参考章节作答
      分开问题与答案生成阶段
      减少答案对问题措辞泄露
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      执行问答质量约束
      答案为词或短语
      删除超过十词的答案
      无法回答则重新生成问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      形成动态测试集
      5,000组问答
      不发布固定问题列表
      保持可复现难度分布
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      查询被测模型
      只提供问题不提供上下文
      允许回答或拒答
      记录自由文本响应
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      先判断是否拒答
      识别因知识不足而放弃
      纠正问题仍视为尝试回答
      使用LLM评判提示词
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      判断已尝试答案
      响应与标准答案比较
      正确 · 错误 · 不可验证
      后两类均视为幻觉
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告三项指标
      错误拒答率
      已尝试答案中的幻觉率
      总体正确率 · 三次运行平均
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
