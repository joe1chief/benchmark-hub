      entryDx: 0
      entryDy: 0
  - from: dynamic_set
    to: gold_audit
    type: secondary
    style:
      dashed: true
  - from: dynamic_set
    to: inference_config
    type: primary
  - from: inference_config
    to: model_response
    type: primary
  - from: model_response
    to: abstention_judge
    type: primary
    style:
      exitX: 0
      exitY: 0.2
      exitDx: 0
      exitDy: 0
      entryX: 1
      entryY: 0.2
      entryDx: 0
      entryDy: 0
  - from: abstention_judge
    to: correctness_judge
    type: primary
