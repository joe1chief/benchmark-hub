meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PreciseWikiQA Build and Evaluation Process
  description: >-
    HalluLens-paper reconstruction of dynamic short-form QA generation, human gold-answer validation, tested-model
    inference, two-stage judging, and fixed-code divergences.
  legend: >-
    Solid arrows show paper construction or fixed implementation flow. Dashed arrows mark evidence, validation, data,
    runner, parser, and rights boundaries; those callouts are not extra stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Primary and Official Evidence
      arXiv 2504.17550v1 · PDF 2257f8628da9
      Git 80307ac6bc9f · GoodWiki 7491f6da6439
      Paper, Code, and Source Data Are Separated
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: benchmark_scope
    label: |-
      Define Extrinsic Hallucination Evaluation
      Ask Short Fact-seeking Queries
      Assume Knowledge Could Be in Training Data
      Use No Context at Inference
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: goodwiki_release
    label: |-
      Pin the GoodWiki Source
      44,754 Pages · September 4, 2023
      HF Revision 7491f6da6439
      Parquet LFS SHA 2b8b3edebede
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: wikirank_join
    label: |-
      Join WikiRank 2024 Importance
      Harmonic Centrality per Wikipedia Page
      Titles SHA f83bc6ac3f3a
      Scores SHA 2acf403c1f0e
    type: process
    size: xl
    position:
      x: 860
      'y': 80
  - id: difficulty_bins
    label: |-
      Create 10 Bins
      0 Hardest · 9 Easiest
      Centrality Proxies Training-data Frequency
      Keep the Distribution Stable across Runs
    type: process
    size: xl
    position:
      x: 1120
      'y': 80
  - id: page_sampling
    label: |-
      Sample the Source Pool
      Draw 500 Pages per Bin
      Use 5,000 Source Pages per Trial
      Regenerate the Dynamic Set Each Trial
    type: database
    size: xl
    position:
      x: 1380
      'y': 80
  - id: section_sampling
    label: |-
      Select One Reference Section
      Chunk Each Wikipedia Page into Sections
      Drop the Last Section when More than Two
      Randomly Select One Remaining Section
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: question_generation
    label: |-
      Generate an Objective Question
      Llama-3.1-70B-Instruct
      Concise · Context-free · Single Answer
      Question Temperature 0.7 · Top-p 0.9
    type: process
    size: xl
    position:
      x: 1900
      'y': 80
  - id: answer_generation
    label: |-
      Generate the Gold Answer Separately
      Use the Same Reference Section
      Return One Word or a Short Phrase
      Answerability Call Uses Temperature 0
    type: process
    size: xl
    position:
      x: 1900
      'y': 400
  - id: quality_gate
    label: |-
      Quality Gate
      Unanswerable: Regenerate
      >10 Words: Filter
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 1640
      'y': 400
  - id: dynamic_set
    label: |-
      Form a Dynamic Test Set
      5,000 Question-answer Pairs per Trial
      No Fixed Public Question List
      Run Three Independently Generated Trials
    type: database
    size: xl
    position:
      x: 1380
      'y': 400
  - id: gold_audit
    label: |-
      Audit Generated Gold Answers
      Human Annotation on 250 Generated Pairs
      97.2 Percent of Answers Are Correct
      Judge Accuracy Is Validated Separately
    type: document
    size: xl
    position:
      x: 1380
      'y': 680
  - id: inference_config
    label: |-
      Run Tested-model Inference
      Send the Question Only · No Context
      Temperature 0 · Top-p 1
      Use Each Model's Default Chat Template
      Three Trials · Free-form Responses
    type: process
    size: xl
    position:
      x: 1120
      'y': 400
  - id: model_response
    label: |-
      Collect a Free-form Response
      Allow a Direct Answer or Abstention
      Add No Wikipedia Retrieval Context
      Preserve Full Text for Both Judges
    type: process
    size: xl
    position:
      x: 860
      'y': 400
  - id: abstention_judge
    label: |-
      Llama-3.1-70B-Instruct
      Abstention JSON
      Correction = Attempt
    type: decision
    size: xl
    style:
      fontSize: 10
    position:
      x: 600
      'y': 400
  - id: correctness_judge
    label: |-
      Judge Attempted-answer Correctness
      Compare Response with the Gold Answer
      CORRECT · INCORRECT · UNVERIFIABLE
      Last Two Classes Are Hallucinations
    type: process
    size: xl
    position:
      x: 340
      'y': 240
  - id: score_metrics
    label: |-
      Report Three Trial-averaged Metrics
      False Refusal Rate
      Hallucination Rate among Attempted Answers
      Overall Correct-answer Rate
    type: terminal
    size: xl
    position:
      x: 80
      'y': 400
  - id: data_boundary
    label: |-
      Data-version Boundary
      GoodWiki Revision 7491f6da6439 Is Fixed
      WikiRank Download URLs Are Not Versioned
      Observed Byte Hashes Pin This Review
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: regeneration_drift
    label: |-
      Paper-to-batch Regeneration Drift
      Paper Retries Unanswerable Questions
      Batch Code Drops Them with continue
      Each Bin Uses a 100-candidate Buffer
    type: document
    size: xl
    position:
      x: 1640
      'y': 680
  - id: runner_boundary
    label: |-
      Fixed-runner Boundary
      Module Default N 5000 · Shell Passes N 1
      No Sampling Seed Is Pinned
      Tested-model Limit Defaults to 256 Tokens
    type: document
    size: xl
    position:
      x: 1120
      'y': 680
  - id: judge_parser_drift
    label: |-
      Judge-prompt and Parser Drift
      Prompt Lists Three Labels, Then Says Yes or No
      Parser Accepts Exact correct or yes
      Everything Else Is Marked Hallucinated
    type: document
    size: xl
    position:
      x: 340
      'y': 680
  - id: license_boundary
    label: |-
      License and Rights Boundary
      HalluLens: CC BY-NC 4.0
      GoodWiki Dataset: MIT
      WikiRank Rights Are Not Inferred
    type: document
    size: xl
    position:
      x: 80
      'y': 240
