meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCNLI Build and Evaluation Process
  description: >-
    Paper-aligned construction of 56,486 original-Chinese NLI pairs from five genres through four elicitation
    strategies, five-label verification, controlled splits, and model and human accuracy evaluation.
  legend: >-
    Easy, medium, and hard denote the first, second, and third hypothesis written for one premise-label pair; they are
    elicitation order labels rather than independently assigned difficulty scores.
nodes:
  - id: source
    label: |-
      Collect Original Chinese Premises
      Government · News · Literature
      TV Talk Shows · Telephone Calls
      Written and Spoken Genres
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: preprocess
    label: |-
      Preprocess Source Sentences
      Remove Callhome Annotation Marks
      Keep 8–50 Chinese Characters
      Do Not Translate from English
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: annotators
    label: |-
      Recruit 145 Hypothesis Writers
      Native Chinese Speakers
      Undergraduate and Graduate Students
      Chinese or Other Language Majors
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: protocol
    label: |-
      Adapt the MNLI Elicitation Protocol
      Entailment · Neutral · Contradiction
      Limit Hypothesis Overlap to 70%
      Monitor Writer Contribution Volume
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: classic
    label: |-
      Elicit the Two Initial Subsets
      SINGLE: One per Label · 11,986
      MULTI: Up to Three per Label · 12,328
      First / Second / Third = Easy / Medium / Hard
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: controlled
    label: |-
      Add Two Bias-control Subsets
      ENCOURAGE Diversity · 16,584
      Reward Fewer Negators
      CONSTRAINT Negators · 15,627
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: corpus
    label: |-
      Form the Original OCNLI Corpus
      56,486 Premise–Hypothesis Pairs
      Four Elicitation Strategies
      Five Original Chinese Genres
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: verify
    label: |-
      Relabel about 15% per Subset
      Four Independent Labelers per Pair
      Add the Writer's Original Label
      Five Labels for Verification
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: agreement
    label: |-
      Check Relabeling Agreement
      3+ Votes Agree on 98.3–98.8%
      Compare Subsets and Difficulty Orders
      Preserve Verification Evidence
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: gold
    label: |-
      Assign Gold NLI Labels
      Majority Vote across Five Labels
      Mark No-majority Pairs as “-”
      Allow Their Exclusion
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: split
    label: |-
      Create the Main Data Split
      Randomize 6,000 Verified Multi Pairs
      3,000 Dev + 3,000 Test
      Balance Easy / Medium / Hard
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: train
    label: |-
      Assemble Training Releases
      About 50,000 Remaining Pairs
      Include SINGLE and MULTI
      Also Release 30k train.small
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: baselines
    label: |-
      Evaluate Chinese NLI Baselines
      CBOW · biLSTM · ESIM
      Chinese BERT-base · RoBERTa-large
      Report Accuracy
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Validate Difficulty with Humans
      Five New Students · 300 Test Pairs
      Human 90.3% vs RoBERTa 78.2%
      Report about 12-point Gap
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: preprocess
    type: primary
  - from: preprocess
    to: annotators
    type: primary
  - from: annotators
    to: protocol
    type: primary
  - from: protocol
    to: classic
    type: primary
  - from: classic
    to: controlled
    type: primary
  - from: controlled
    to: corpus
    type: primary
  - from: corpus
    to: verify
    type: primary
  - from: verify
    to: agreement
    type: primary
  - from: agreement
    to: gold
    type: primary
  - from: gold
    to: split
    type: primary
  - from: split
    to: train
    type: primary
  - from: train
    to: baselines
    type: primary
  - from: baselines
    to: report
    type: primary
modules: []
