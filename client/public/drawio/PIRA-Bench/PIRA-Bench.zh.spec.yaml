meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIRA-Bench 构建与评测流程
  description: 与论文一致地展示从带噪连续屏幕轨迹构建画像条件下主动式GUI意图推荐基准。
  legend: 正样本要求给出与画像一致的可行动意图；纯噪声和画像否决样本的标准意图集为空，并对误报施加惩罚。
nodes:
  - id: step_1
    label: |-
      采集真实GUI轨迹
      100条移动端与桌面端序列
      连续被动观察流
      覆盖多样日常活动
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      保留连续上下文
      每条轨迹平均32张截图
      保持时间顺序
      表达长时程行为
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      注入真实噪声
      无关应用切换
      空闲屏幕
      随机浏览片段
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      配对三种用户画像
      社会经济背景
      偏好与个人特征
      让意图取决于具体用户
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      构建直接场景
      视觉上下文可揭示意图
      交错插入无关任务
      推荐需与画像相容
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      构建画像依赖场景
      仅看屏幕不足以判断
      交叉参考画像属性
      只接受画像一致的推荐
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      构建纯噪声负样本
      不存在可行动潜在目标
      画像也可否决视觉线索
      标准意图集为空
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      收集三人独立标注
      同时展示轨迹与画像
      标注明确可行动意图
      每个配对独立作业
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      按一致性确定意图
      保留至少2人同意的意图
      归一化语义描述
      丢弃无共识建议
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      形成PIRA-Bench
      100条轨迹 · 每条三种画像
      同时包含正负场景
      带噪多线程观察
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      执行主动意图预测
      输入连续截图与用户画像
      不提供显式用户指令
      返回推荐意图集合
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      判定语义匹配
      由Gemini-3-flash比较意图集合
      匹配预测与标准答案
      统计正确误报与遗漏意图
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      分别评分正负样本
      正样本计算宏平均Intent F1
      负样本统计每例误报数
      FPSnorm等于1除以1加ln括号1加FPS
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      计算最终得分
      F1平均值乘FPSnorm
      奖励有用的主动意图
      惩罚不必要干预
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: step_1
    to: step_2
    type: primary
  - from: step_2
    to: step_3
    type: primary
  - from: step_3
    to: step_4
    type: primary
  - from: step_4
    to: step_5
    type: primary
  - from: step_5
    to: step_6
    type: primary
  - from: step_6
    to: step_7
    type: primary
  - from: step_7
    to: step_8
    type: primary
  - from: step_8
    to: step_9
    type: primary
  - from: step_9
    to: step_10
    type: primary
  - from: step_10
    to: step_11
    type: primary
  - from: step_11
    to: step_12
    type: primary
  - from: step_12
    to: step_13
    type: primary
  - from: step_13
    to: step_14
    type: primary
modules: []
