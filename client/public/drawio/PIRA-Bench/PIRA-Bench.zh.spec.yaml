meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIRA-Bench 构建与评测流程
  description: 基于固定来源重建画像条件主动式 GUI 意图推荐流程，并保留场景与评分并行分支以及发布和评测器边界。
  legend: 实线表示论文披露的基准流程；虚线表示固定证据、论文措辞漂移、公开发布内容与未开放服务端评测，不是额外构建步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2603.08013v1 · PDF b75a527baea1
      HF 数据版本 26194bfba20d
      榜单页面 HTML a1da2a91fe24
    type: document
    size: xl
    position:
      x: 20
      'y': 260
  - id: collect
    label: |-
      收集 100 条真实 GUI 轨迹
      覆盖移动端与桌面端使用
      连续被动观察流
      多样日常活动
    type: database
    size: xl
    position:
      x: 260
      'y': 260
  - id: preserve
    label: |-
      保留截图序列
      保持时序与长程上下文
      论文摘要报告平均 32 帧
      贡献段落报告平均 33 帧
    type: process
    size: xl
    position:
      x: 500
      'y': 260
  - id: noise
    label: |-
      注入通用噪声
      无关应用切换
      空闲屏幕与随机浏览
      要求持续过滤干扰
    type: process
    size: xl
    position:
      x: 740
      'y': 260
  - id: profiles
    label: |-
      配对三种用户画像
      社会经济状态
      偏好与个人特征
      意图须服从指定用户
    type: document
    size: xl
    position:
      x: 980
      'y': 260
  - id: scenario_scope
    label: |-
      组成混合场景分布
      不切成僵硬独立子集
      模拟不可预测用户行为
      同时覆盖正例与负例
    type: process
    size: xl
    position:
      x: 1220
      'y': 260
  - id: direct
    label: |-
      直接推荐场景
      视觉上下文揭示未来目标
      拆解交错任务
      产生画像兼容的可行动意图
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: profile_dependent
    label: |-
      画像依赖场景
      仅凭截图存在歧义
      交叉核对画像约束
      只接受画像一致的推荐
    type: document
    size: xl
    position:
      x: 1460
      'y': 260
  - id: pure_noise
    label: |-
      纯噪声负例
      漫无目的或碎片化 GUI 活动
      不存在可行动潜在目标
      期望意图集合为空
    type: document
    size: xl
    position:
      x: 1460
      'y': 480
  - id: annotate
    label: |-
      收集三人独立标注
      展示每条轨迹与用户画像
      标出明确可行动意图
      对每个轨迹画像组合标注
    type: process
    size: xl
    position:
      x: 1700
      'y': 260
  - id: consensus
    label: |-
      形成意图真值集合
      保留至少两人共同识别的意图
      噪声或画像否定场景为空集
      移除无共识建议
    type: process
    size: xl
    position:
      x: 1940
      'y': 260
  - id: release
    label: |-
      定稿 PIRA-Bench
      100 条轨迹 · 每条三种画像
      含噪多线程 GUI 观察
      提交轨迹到画像再到意图数组
    type: database
    size: xl
    position:
      x: 2180
      'y': 260
  - id: predict
    label: |-
      执行主动意图预测
      输入截图与指定画像
      不提供显式用户指令
      返回推荐意图集合
    type: process
    size: xl
    position:
      x: 2420
      'y': 260
  - id: judge
    label: |-
      判定语义意图匹配
      Gemini-3-flash 比较预测与真值
      同时向判定器提供用户画像
      判定命中遗漏与多余意图
    type: process
    size: xl
    position:
      x: 2660
      'y': 260
  - id: positive_score
    label: |-
      评分正例轨迹
      逐轨迹计算意图精确率召回率与 F1
      只使用真值非空场景
      宏平均得到 Average Intent F1
    type: process
    size: xl
    position:
      x: 2900
      'y': 100
  - id: negative_score
    label: |-
      评分负例轨迹
      FPS 为每个负例平均幻觉意图数
      FPSnorm = 1 / [1 + ln(1 + FPS)]
      零误报的完美结果为 1
    type: process
    size: xl
    position:
      x: 2900
      'y': 420
  - id: final_score
    label: |-
      计算最终得分
      Sfinal = Average Intent F1 × FPSnorm
      奖励画像一致的主动性
      缩减易产生幻觉的智能体得分
    type: terminal
    size: xl
    position:
      x: 3140
      'y': 260
  - id: wording_boundary
    label: |-
      论文措辞边界
      摘要称平均 32 张截图
      贡献段落称平均 33 张截图
      公开数据卡未消解差异
    type: document
    size: xl
    position:
      x: 500
      'y': 760
  - id: release_boundary
    label: |-
      固定公开数据快照
      trajs.zip · 6,794,715,214 字节
      LFS SHA-256 d9677ed4aada
      仅图像与 profile.json · 不含公开真值
    type: document
    size: xl
    position:
      x: 2180
      'y': 760
  - id: evaluation_boundary
    label: |-
      评测披露边界
      论文披露判定模型与得分公式
      判定提示与匹配解析器未发布
      榜单通过服务端 /api/score 排队评分
    type: document
    size: xl
    position:
      x: 2660
      'y': 760
  - id: openness_boundary
    label: |-
      混合开放边界
      HF 轨迹公开 · Apache-2.0
      提交结构公开
      真值与独立评测器未开放
    type: document
    size: xl
    position:
      x: 2420
      'y': 980
edges:
  - from: source_evidence
    to: collect
    type: secondary
    style:
      dashed: true
  - from: collect
    to: preserve
    type: primary
  - from: preserve
    to: noise
    type: primary
  - from: noise
    to: profiles
    type: primary
  - from: profiles
    to: scenario_scope
    type: primary
  - from: scenario_scope
    to: direct
    type: primary
  - from: scenario_scope
    to: profile_dependent
    type: primary
  - from: scenario_scope
    to: pure_noise
    type: primary
  - from: direct
    to: annotate
    type: primary
  - from: profile_dependent
    to: annotate
    type: primary
  - from: pure_noise
    to: annotate
    type: primary
  - from: annotate
    to: consensus
    type: primary
  - from: consensus
    to: release
    type: primary
  - from: release
    to: predict
    type: primary
  - from: predict
    to: judge
    type: primary
  - from: judge
    to: positive_score
    type: primary
  - from: judge
    to: negative_score
    type: primary
  - from: positive_score
    to: final_score
    type: primary
  - from: negative_score
    to: final_score
    type: primary
  - from: preserve
    to: wording_boundary
    type: secondary
    style:
      dashed: true
  - from: release
    to: release_boundary
    type: secondary
    style:
      dashed: true
  - from: judge
    to: evaluation_boundary
    type: secondary
    style:
      dashed: true
  - from: release_boundary
    to: openness_boundary
    type: secondary
    style:
      dashed: true
modules: []
