meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIRA-Bench Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of profile-conditioned proactive GUI intent recommendation, with parallel scenario and
    scoring branches plus explicit release and evaluator boundaries.
  legend: >-
    Solid arrows show the paper-disclosed benchmark workflow. Dashed arrows identify fixed evidence, wording drift,
    public-release contents, and undisclosed server-side evaluation; they are not additional build stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2603.08013v1
      PDF b75a527baea1
      HF Revision 26194bfba20d
      Leaderboard HTML
      a1da2a91fe24
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 260
  - id: collect
    label: |-
      Collect 100 Real GUI Trajectories
      Mobile and Desktop Device Use
      Sequential
      Passive Observation Streams
      Diverse Everyday Activities
    type: database
    size: xl
    style:
      fontSize: 10
    position:
      x: 260
      'y': 260
  - id: preserve
    label: |-
      Preserve Screenshot Sequences
      Temporal Order and Long-horizon
      Context
      Abstract: Average 32 Frames
      Contribution: Average 33
    type: process
    size: xl
    position:
      x: 500
      'y': 260
  - id: noise
    label: |-
      Inject Universal Noise
      Irrelevant Application
      Switching
      Idle Screens and Random Browsing
      Continuous Distraction Filtering
    type: process
    size: xl
    position:
      x: 740
      'y': 260
  - id: profiles
    label: |-
      Pair Three User Profiles
      Socioeconomic Status
      Preferences and Characteristics
      Assign Profile to User Intent
    type: document
    size: xl
    position:
      x: 980
      'y': 260
  - id: scenario_scope
    label: |-
      Mixed Scenario Distribution
      No Rigid Subsets
      Mirror Unpredictable Behavior
      Cover Positive and Negative Cases
    type: process
    size: xl
    position:
      x: 1220
      'y': 260
  - id: direct
    label: |-
      Direct Recommendation Cases
      Visual Context Reveals Goals
      Disentangle Interleaved Tasks
      Profile-compatible Intents
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: profile_dependent
    label: |-
      Profile-dependent Cases
      Screens Alone Are Ambiguous
      Cross-reference
      Profile Constraints
      Accept Aligned Recommendations
    type: document
    size: xl
    position:
      x: 1460
      'y': 260
  - id: pure_noise
    label: |-
      Pure-noise Negative Cases
      Aimless / Fragmented GUI Activity
      No Actionable Latent Goal
      Expected Intent Set Is Empty
    style:
      fontSize: 10
    type: document
    size: xl
    position:
      x: 1460
      'y': 480
  - id: annotate
    label: |-
      Three Independent Annotations
      Show Trajectory and User Profile
      Mark Actionable Intents
      Annotate Each Trajectory-profile Pair
    type: process
    size: xl
    style:
      fontSize: 10
    position:
      x: 1700
      'y': 260
  - id: consensus
    label: |-
      Ground-truth Intent Sets
      Retain Intents Named
      by At Least 2 of 3
      Empty Set for Noise or
      Profile-negated Cases
      Remove Unsupported Suggestions
    type: process
    size: xl
    position:
      x: 1940
      'y': 260
  - id: release
    label: |-
      Finalize PIRA-Bench
      100 Trajectories
      Three Profiles Each
      Noisy Multithreaded GUI
      Submit Trajectory to Profile
      to Intent Arrays
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 2180
      'y': 260
  - id: predict
    label: |-
      Proactive Intent Prediction
      Input Screenshots + Profile
      No Explicit User Instruction
      Return Recommended Intent Set
    type: process
    size: xl
    position:
      x: 2420
      'y': 260
  - id: judge
    label: |-
      Semantic Intent Matching
      Gemini-3-flash Compares
      Prediction and GT
      Supply User Profile to Judge
      Find Matched / Missed / Extra
    type: process
    size: xl
    position:
      x: 2660
      'y': 260
  - id: positive_score
    label: |-
      Score Positive Trajectories
      Per-trajectory Intent
      Precision Recall and F1
      Ground Truth Nonempty
      Macro-average = Average Intent F1
    type: process
    size: xl
    position:
      x: 2900
      'y': 100
  - id: negative_score
    label: |-
      Score Negative Trajectories
      FPS = Mean Hallucinated Intents
      per Negative
      FPSnorm = 1 / [1 + ln(1 + FPS)]
      Zero False Positives Gives 1
    type: process
    size: xl
    style:
      fontSize: 10
    position:
      x: 2900
      'y': 420
  - id: final_score
    label: |-
      Compute Final Score
      Sfinal = Average Intent F1
      × FPSnorm
      Reward Profile-aligned
      Proactivity
      Penalize Hallucinations
    type: terminal
    size: xl
    position:
      x: 3140
      'y': 260
  - id: wording_boundary
    label: |-
      Paper Wording Boundary
      Abstract: Average 32 Screenshots
      Average 33 Screenshots
      Public Card Does Not Reconcile
      the Difference
    type: document
    size: xl
    position:
      x: 500
      'y': 760
  - id: release_boundary
    label: |-
      Fixed Public Data Snapshot
      trajs.zip · 6,794,715,214 Bytes
      LFS SHA-256 d9677ed4aada
      Images + profile.json
      No Public GT
    type: document
    size: xl
    position:
      x: 2180
      'y': 760
  - id: evaluation_boundary
    label: |-
      Evaluation Disclosure
      Paper Names Judge / Scores
      Judge Prompt and Match Parser
      Not Published
      Leaderboard: /api/score
    type: document
    size: xl
    position:
      x: 2660
      'y': 760
  - id: openness_boundary
    label: |-
      Mixed Openness Boundary
      HF Trajectories Public
      Apache-2.0
      Submission Schema Public
      Ground Truth +
      Evaluator Are Closed
    type: document
    size: xl
    position:
      x: 2420
      'y': 980
