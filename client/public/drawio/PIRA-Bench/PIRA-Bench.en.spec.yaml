meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIRA-Bench Build and Evaluation Process
  description: >-
    Paper-aligned construction of profile-conditioned proactive GUI intent recommendation from noisy sequential screen
    trajectories.
  legend: >-
    Positive trajectories require profile-aligned actionable intents; pure-noise and profile-negated cases have an empty
    ground-truth intent set and penalize false positives.
nodes:
  - id: step_1
    label: |-
      Collect Real GUI Trajectories
      100 mobile and desktop sequences
      Passive observation streams
      Diverse everyday activities
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Preserve Sequential Context
      Average 32 screenshots per trajectory
      Keep temporal order
      Represent long-horizon behavior
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Inject Realistic Noise
      Irrelevant application switching
      Idle screens
      Random browsing segments
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Pair Three User Profiles
      Socioeconomic background
      Preferences and characteristics
      Condition intent on the user
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Create Direct Scenarios
      Visual context reveals an intent
      Interleave unrelated tasks
      Recommendation is profile-compatible
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Create Profile-dependent Cases
      Screens alone are insufficient
      Cross-reference profile attributes
      Accept only aligned recommendations
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Create Pure-noise Negatives
      No actionable latent goal
      Profile may negate a visual cue
      Expected intent set is empty
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Collect Three Human Annotations
      Show trajectory plus profile
      Annotate explicit actionable intents
      Work independently per pair
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Resolve Intent Agreement
      Keep intents supported by 2 of 3
      Normalize semantic descriptions
      Discard unsupported suggestions
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Finalize PIRA-Bench
      100 trajectories · three profiles each
      Positive and negative scenarios
      Noisy multithreaded observation
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Run Proactive Intent Prediction
      Input sequential screenshots and profile
      No explicit user instruction
      Return a set of recommendations
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Judge Semantic Matches
      Gemini-3-flash compares intent sets
      Match predictions to ground truth
      Count true false and missed intents
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Score Positive and Negative Cases
      Macro Average Intent F1
      False positives per negative sample
      FPS norm equals 1 over 1 plus ln 1 plus FPS
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Compute Final Score
      Multiply F1 average by FPS norm
      Reward useful proactive intents
      Penalize unnecessary intervention
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
