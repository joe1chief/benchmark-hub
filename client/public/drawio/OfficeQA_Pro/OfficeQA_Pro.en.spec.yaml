meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OfficeQA Pro Paper-aligned Build and Evaluation Process
  description: >-
    Paper- and source-aligned construction of OfficeQA Pro from U.S. Treasury Bulletins, including independent
    reproduction, two agent-assisted QA passes, the exact not-both-correct Pro gate, the paper evaluation contract, and
    the post-paper gated-release and reward-code boundary.
  legend: >-
    OfficeQA Pro contains the 133 post-filter questions for which the two construction-time agents were not both
    correct; at least one agent was incorrect, which is not the same as requiring both agents to fail. Dashed connectors
    mark fixed-code or source/access evidence that postdates or qualifies the paper protocol.
nodes:
  - id: scope
    label: |-
      Paper and Snapshot Scope
      arXiv:2603.08655v1
      Section 2 · Appendices B and E
      Pro: 133 · Full: 246
      Sources Reviewed 2026-07-18
    type: document
    size: xl
    position:
      x: 20
      'y': 250
    style:
      fontSize: 9
  - id: corpus
    label: |-
      Collect Treasury Bulletins
      Monthly 1939–1982 · Quarterly Thereafter
      Fixed Repository Range: 1939–2025
      About 89,000 Pages · Over 26M Numbers
      100–200 Pages per Bulletin
    type: database
    size: xl
    position:
      x: 260
      'y': 250
    style:
      fontSize: 9
  - id: prepare
    label: |-
      Preserve Document Heterogeneity
      Prose · Tables · Figures · Charts
      Nested Headers · Units · Footnotes · Revisions
      Scans to Digital-native PDFs from 1996
      Remove Embedded Text Layers
    type: process
    size: xl
    position:
      x: 500
      'y': 250
    style:
      fontSize: 9
  - id: criteria
    label: |-
      Apply Three Desiderata
      Enterprise Document Complexity
      Retrieval plus Multi-step Reasoning
      Single Unambiguous Verifiable Answer
    type: document
    size: xl
    position:
      x: 740
      'y': 250
    style:
      fontSize: 9
  - id: seed
    label: |-
      Author Seed Questions and Answers
      Ground Each Item in Creator PDF Pages
      Require Realistic Financial Analysis
      Specify Fiscal versus Calendar Year
      Specify Real versus Nominal Values
    type: process
    size: xl
    position:
      x: 980
      'y': 250
    style:
      fontSize: 9
  - id: scale
    label: |-
      Scale with SuperAnnotate and Turing
      Show Sample Questions
      Generate New Items from the Corpus
      Reject Ungrounded Trivia
      Require Unambiguous Wording
    type: process
    size: xl
    position:
      x: 1220
      'y': 250
    style:
      fontSize: 9
  - id: topical
    label: |-
      Run USAFacts Topical Review
      Reflect Real-world Analyst Queries
      Check Government-data Relevance
    type: process
    size: xl
    position:
      x: 1460
      'y': 250
    style:
      fontSize: 9
  - id: reproduce
    label: |-
      Independently Reproduce the Answer
      New Annotator Uses Creator PDF Pages
      Compare with the Original Answer
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
    style:
      fontSize: 9
  - id: reproduce_gate
    label: |-
      Reproduced Answer
      Matches Original?
    type: decision
    size: xl
    position:
      x: 1940
      'y': 250
    style:
      fontSize: 9
  - id: adjudicate
    label: |-
      Third-annotator Review
      Triggered by a Mismatch
      Resolve the Answer Conflict
    type: process
    size: xl
    position:
      x: 2180
      'y': 520
    style:
      fontSize: 9
  - id: qa_rounds
    label: |-
      Run Two End-to-end QA Passes
      Agents Produce Alternative Answers
      Humans Inspect Every Conflict
      Classify: Agent Failure · Both Valid · Gold Wrong
      Revise Ambiguity or Correct Gold
    type: process
    size: xl
    position:
      x: 2420
      'y': 250
    style:
      fontSize: 9
  - id: parametric_filter
    label: |-
      Remove Parametric-only Questions
      Claude Opus 4.5 and GPT-5.1
      No Corpus or External Sources
      Keep Retrieval-dependent Items
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
    style:
      fontSize: 9
  - id: retained
    label: |-
      Post-filter Pool
      246 Questions Remain
      Grounded and Verifiable
    type: database
    size: xl
    position:
      x: 2900
      'y': 250
    style:
      fontSize: 9
  - id: difficulty_gate
    label: |-
      Both Construction-time Agents Correct?
      Claude Opus 4.5 and GPT-5.1
      Databricks Parsed Documents
    type: decision
    size: xl
    position:
      x: 3140
      'y': 250
    style:
      fontSize: 9
  - id: easy
    label: |-
      Yes: Label Easy
      113 Questions
      Full Companion Only
    type: process
    size: xl
    position:
      x: 3380
      'y': 80
    style:
      fontSize: 9
  - id: pro
    label: |-
      No: Label Pro
      At Least One Agent Incorrect
      133 Questions · Core Benchmark
    type: process
    size: xl
    position:
      x: 3380
      'y': 420
    style:
      fontSize: 9
  - id: release
    label: |-
      Release Two CSV Views
      officeqa_full.csv: 246 = 113 Easy + 133 Pro
      officeqa_pro.csv: 133 Pro
      uid · question · answer
      source_docs · source_files · difficulty
      This Page Targets Pro
    type: database
    size: xl
    position:
      x: 3620
      'y': 250
    style:
      fontSize: 9
  - id: eval_input
    label: |-
      Load CSV and Corpus Representations
      Hugging Face Approval Required
      Original PDFs: about 4 GB
      Parsed JSON: about 730 MB
      Transformed TXT: about 460 MB
    type: database
    size: xl
    position:
      x: 3860
      'y': 250
    style:
      fontSize: 9
  - id: eval_setting
    label: |-
      Choose Paper Evaluation Setting
      Prompt Only · Web Search
      Oracle PDF Pages plus Web
      Oracle Parsed Pages plus Web
      Full-corpus Agent: PDF or Parsed
    type: process
    size: xl
    position:
      x: 4100
      'y': 250
    style:
      fontSize: 9
  - id: answer_contract
    label: |-
      Apply the Paper Prompt Contract
      Use Maximum Precision
      Return Value in FINAL_ANSWER Tags
      Agents Use Corpus and Web as Needed
      Use Latest Revision Unless an Exact
      Date or Document Is Fixed
    type: process
    size: xl
    position:
      x: 4340
      'y': 250
    style:
      fontSize: 8
  - id: paper_score
    label: |-
      Paper v1 Deterministic Metric
      99% of Answers Are Numerical
      Exact / Absolute Relative Error
      0.0% · 0.1%
      1.0% · 5.0%
      Default 0.0% · Normalize Formats
      Fuzzy Text Matching
    type: process
    size: xl
    position:
      x: 4580
      'y': 250
    style:
      fontSize: 8
  - id: fixed_reward
    label: |-
      Fixed reward.py Guards
      Last FINAL_ANSWER
      One Direct Line
      At Most 250 Characters
      Numeric Arity · Unit Compatibility
      Numeric-list · Context-year Handling
      Post-paper · Do Not Back-project
    type: process
    size: xl
    position:
      x: 4820
      'y': 520
    style:
      fontSize: 8
  - id: report
    label: |-
      Report Binary Correctness
      Average over the Selected Split
      OfficeQA Pro Is the Paper Default
      Default 0.0% Error Threshold
      No Official Leaderboard in Fixed Sources
    type: terminal
    size: xl
    position:
      x: 5060
      'y': 250
    style:
      fontSize: 9
  - id: source_boundary
    label: |-
      Source and Access
      PDF 0cf442… · TeX f69b63…
      Repo 8675310… · Reward 0d9169…
      HF 763a836… · Full cc59c6…
      Pro 8dc109… · July 14
      Gated HF · Paper Says GitHub
      Data CC BY-SA 4.0 · Code Apache 2.0
    type: document
    size: xl
    position:
      x: 5300
      'y': 520
    style:
      fontSize: 8
