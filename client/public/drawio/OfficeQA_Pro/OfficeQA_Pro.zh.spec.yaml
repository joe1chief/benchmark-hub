meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OfficeQA Pro 论文对齐构建与评测流程
  description: 对齐论文与固定官方来源的 OfficeQA Pro 构建流程：覆盖独立答案复现、两轮智能体辅助质检、准确的“并非两个都答对” Pro 筛选规则、论文评测合同，以及论文之后的数据门控与奖励代码边界。
  legend: OfficeQA Pro 包含参数知识过滤后、两个构建期智能体并非都答对的 133 题；这表示至少一个智能体未答对，并不要求两个智能体都失败。 虚线表示晚于或限定论文协议的固定代码、来源或访问证据。
nodes:
  - id: scope
    label: |-
      论文与固定快照范围
      arXiv:2603.08655v1
      第 2 节 · 附录 B 与 E
      Pro：133 · Full：246
      来源复核于 2026-07-18
    type: document
    size: xl
    position:
      x: 20
      'y': 250
    style:
      fontSize: 9
  - id: corpus
    label: |-
      汇集美国财政部公报
      1939–1982 年按月 · 此后按季
      固定仓库范围：1939–2025 年
      约 89,000 页 · 超过 2,600 万数值
      每期公报 100–200 页
    type: database
    size: xl
    position:
      x: 260
      'y': 250
    style:
      fontSize: 9
  - id: prepare
    label: |-
      保留文档异质性
      文本 · 表格 · 图形 · 图表
      嵌套表头 · 单位 · 脚注 · 修订值
      1996 年起转为原生数字 PDF
      移除内嵌文本层
    type: process
    size: xl
    position:
      x: 500
      'y': 250
    style:
      fontSize: 9
  - id: criteria
    label: |-
      应用三项设计准则
      企业文档复杂性
      检索加多步推理
      单一、无歧义且可核验的答案
    type: document
    size: xl
    position:
      x: 740
      'y': 250
    style:
      fontSize: 9
  - id: seed
    label: |-
      编写种子问题与答案
      每题落到命题所用 PDF 页面
      要求真实金融分析
      明确财政年与自然年
      明确实际值与名义值
    type: process
    size: xl
    position:
      x: 980
      'y': 250
    style:
      fontSize: 9
  - id: scale
    label: |-
      与 SuperAnnotate、Turing 扩展标注
      提供示例问题
      依据语料生成新题
      拒绝无依据的知识问答
      要求表述无歧义
    type: process
    size: xl
    position:
      x: 1220
      'y': 250
    style:
      fontSize: 9
  - id: topical
    label: |-
      执行 USAFacts 主题复核
      反映真实分析师查询
      检查政府数据相关性
    type: process
    size: xl
    position:
      x: 1460
      'y': 250
    style:
      fontSize: 9
  - id: reproduce
    label: |-
      独立复现答案
      新标注员使用命题所用 PDF 页面
      与原始答案比较
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
    style:
      fontSize: 9
  - id: reproduce_gate
    label: |-
      复现答案是否
      与原始答案一致？
    type: decision
    size: xl
    position:
      x: 1940
      'y': 250
    style:
      fontSize: 9
  - id: adjudicate
    label: |-
      第三位标注员复核
      仅在答案不一致时触发
      解决答案冲突
    type: process
    size: xl
    position:
      x: 2180
      'y': 520
    style:
      fontSize: 9
  - id: qa_rounds
    label: |-
      执行两轮端到端质检
      智能体生成替代答案
      人工检查每个冲突
      分类：智能体失败 · 两者皆可 · 标准答案错误
      消除题目歧义或修正标准答案
    type: process
    size: xl
    position:
      x: 2420
      'y': 250
    style:
      fontSize: 9
  - id: parametric_filter
    label: |-
      移除仅靠参数知识可答的问题
      Claude Opus 4.5 与 GPT-5.1
      不提供语料或外部来源
      保留依赖检索的问题
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
    style:
      fontSize: 9
  - id: retained
    label: |-
      参数过滤后题池
      保留 246 道问题
      均有来源且可核验
    type: database
    size: xl
    position:
      x: 2900
      'y': 250
    style:
      fontSize: 9
  - id: difficulty_gate
    label: |-
      两个构建期智能体是否都答对？
      Claude Opus 4.5 与 GPT-5.1
      使用 Databricks 解析文档
    type: decision
    size: xl
    position:
      x: 3140
      'y': 250
    style:
      fontSize: 9
  - id: easy
    label: |-
      是：标为 Easy
      113 道问题
      仅进入 Full 伴随集
    type: process
    size: xl
    position:
      x: 3380
      'y': 80
    style:
      fontSize: 9
  - id: pro
    label: |-
      否：标为 Pro
      至少一个智能体未答对
      133 道问题 · 核心基准
    type: process
    size: xl
    position:
      x: 3380
      'y': 420
    style:
      fontSize: 9
  - id: release
    label: |-
      发布两个 CSV 视图
      officeqa_full.csv：246 = 113 Easy + 133 Pro
      officeqa_pro.csv：133 道 Pro
      uid · question · answer
      source_docs · source_files · difficulty
      本页聚焦 Pro
    type: database
    size: xl
    position:
      x: 3620
      'y': 250
    style:
      fontSize: 9
  - id: eval_input
    label: |-
      加载 CSV 与语料表示
      需要 Hugging Face 访问审批
      原始 PDF：约 4 GB
      解析 JSON：约 730 MB
      转换 TXT：约 460 MB
    type: database
    size: xl
    position:
      x: 3860
      'y': 250
    style:
      fontSize: 9
  - id: eval_setting
    label: |-
      选择论文评测设置
      仅提示 · 联网搜索
      预言机 PDF 页面加联网
      预言机解析页面加联网
      全语料智能体：PDF 或解析文本
    type: process
    size: xl
    position:
      x: 4100
      'y': 250
    style:
      fontSize: 9
  - id: answer_contract
    label: |-
      应用论文提示合同
      使用最大计算精度
      在 FINAL_ANSWER 标签内返回数值
      智能体按需使用语料与联网
      除非指定日期或文档
      否则采用最新修订值
    type: process
    size: xl
    position:
      x: 4340
      'y': 250
    style:
      fontSize: 8
  - id: paper_score
    label: |-
      论文 v1 确定性指标
      99% 的答案为数值
      精确匹配或绝对相对误差
      0.0% · 0.1%
      1.0% · 5.0%
      默认 0.0% · 格式规范化
      模糊文本匹配
    type: process
    size: xl
    position:
      x: 4580
      'y': 250
    style:
      fontSize: 8
  - id: fixed_reward
    label: |-
      固定 reward.py 约束
      最后一个 FINAL_ANSWER
      单行直接答案
      最多 250 字符
      数值个数 · 单位兼容
      数值列表 · 上下文年份处理
      论文后实现 · 不反推论文协议
    type: process
    size: xl
    position:
      x: 4820
      'y': 520
    style:
      fontSize: 8
  - id: report
    label: |-
      报告二元正确率
      在所选 split 上取平均
      论文默认报告 OfficeQA Pro
      默认 0.0% 误差阈值
      固定来源未披露官方榜单
    type: terminal
    size: xl
    position:
      x: 5060
      'y': 250
    style:
      fontSize: 9
  - id: source_boundary
    label: |-
      来源与访问
      PDF 0cf442… · TeX f69b63…
      仓库 8675310… · 奖励代码 0d9169…
      HF 763a836… · Full cc59c6…
      Pro 8dc109… · 7 月 14 日
      HF 门控 · 论文称 GitHub 公开
      数据 CC BY-SA 4.0 · 代码 Apache 2.0
    type: document
    size: xl
    position:
      x: 5300
      'y': 520
    style:
      fontSize: 8
