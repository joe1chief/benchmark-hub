meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OfficeQA Pro 构建与评测流程
  description: 对齐论文的 OfficeQA Pro 构建流程：从近百年美国财政部公报语料生成问题，经严格检索与难度筛选得到 133 题，并进行确定性答案评分。
  legend: OfficeQA Pro 保留构建时两个前沿智能体未同时答对的 133 道困难题。默认正确率在答案格式规范化后使用 0.0% 允许绝对相对误差。
nodes:
  - id: corpus
    label: |-
      汇集美国财政部公报语料
      覆盖 1939–2025 年
      89,000 页 · 超过 2,600 万数值
      表格 · 文本 · 图表 · 修订值
    type: database
    size: xl
    position:
      x: 20
      'y': 70
  - id: prepare
    label: |-
      保留真实文档复杂度
      扫描件到原生数字 PDF
      嵌套表格与变化单位
      移除 PDF 内嵌文本层
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: criteria
    label: |-
      设定基准构建准则
      企业数据复杂性
      多步检索与分析
      单一且可核验的标准答案
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: seed
    label: |-
      人工编写种子问答
      每题必须落到公报证据
      要求真实分析工作
      明确单位与时间口径
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: scale
    label: |-
      扩展人工标注
      SuperAnnotate 与 Turing
      依据源文档生成新题
      避免无依据的知识问答
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: topical
    label: |-
      审查真实分析价值
      与 USAFacts 合作复核
      区分财政年与自然年
      区分实际值与名义值
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: reproduce
    label: |-
      独立复现答案
      新标注员使用原始来源页
      与初始答案比较
      不一致时由第三人裁决
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: qa
    label: |-
      执行两轮端到端质检
      智能体生成替代答案
      人工检查每个冲突
      消歧题目或修正标准答案
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: retrieve_filter
    label: |-
      强制依赖语料检索
      仅凭参数知识测试作答
      使用 Opus 4.5 与 GPT-5.1
      筛后保留 246 题
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: difficulty
    label: |-
      双智能体都答对？
      移除 · 否则保留
    type: decision
    size: xl
    position:
      x: 980
      'y': 420
  - id: release
    label: |-
      发布 OfficeQA Pro
      133 道文档落地问题
      11% 跨 3+ 公报 · 22% 联网
      3% 视觉 · 62% 高级分析
    type: database
    size: xl
    position:
      x: 740
      'y': 450
  - id: run
    label: |-
      运行文档落地系统
      完整语料或预言机页面
      原始 PDF 或解析文本
      允许题目所需联网检索
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: normalize
    label: |-
      规范化模型答案
      标点与数学符号
      常见缩写
      文本数值与模糊文本规则
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告确定性正确率
      对单一答案执行精确匹配
      统计绝对相对误差阈值
      默认阈值为 0.0%
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: corpus
    to: prepare
    type: primary
  - from: prepare
    to: criteria
    type: primary
  - from: criteria
    to: seed
    type: primary
  - from: seed
    to: scale
    type: primary
  - from: scale
    to: topical
    type: primary
  - from: topical
    to: reproduce
    type: primary
  - from: reproduce
    to: qa
    type: primary
  - from: qa
    to: retrieve_filter
    type: primary
  - from: retrieve_filter
    to: difficulty
    type: primary
  - from: difficulty
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: normalize
    type: primary
  - from: normalize
    to: report
    type: primary
modules: []
