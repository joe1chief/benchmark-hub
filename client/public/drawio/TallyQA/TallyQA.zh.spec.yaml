  layout: horizontal
  routing: orthogonal
  title: TallyQA 构建与评测流程
  description: >-
    TallyQA组合导入与新采集的开放式计数问题。作者从VQA2和Visual Genome导入以How
    many开头且答案为0至15整数的问题，其中VQA2条目要求10名标注者中至少5人答案一致；同时引入TDIUC合成题并构造缺失物体的零计数问题。约800名AMT标注者通过定向任务在17545张图像上生成19500道复杂题；非零问题必须存在反例，另设任务构造困难的零答案问题。作者人工删除低质量或不够复杂的条目。保守的语言规则先去掉通用图像短语，再用spaCy词性标注；仅当问题含1个名词且没有形容词和副词时才判为简单题。最终287907道题包含211430道简单题与76477道复杂题：训练集249318题，Test-Simple含22991道导入题，Test-Complex含15598道人工核验的AMT题。测试图像仅来自Visual
    Genome且不与训练集重叠。评测预测开放式整数，并分别在两个测试集报告精确准确率与RMSE。
  legend: 来源：TallyQA AAAI 2019 paper Section 3 and official manoja328/TallyQA_dataset repository。实线箭头表示论文或官方资料明确支持的主流程。
