meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EmbSpatial-Bench 构建流程
  description: 对齐论文：从带标注的具身三维场景构建均衡的自我中心空间关系选择题，并进行 LVLM 零样本准确率评测。
  legend: 实线箭头复现 ACL 2024 论文的基准构建流程。EmbSpatial-SFT 是独立训练集，不与 3,640 题评测集混合。
nodes:
  - id: sources
    label: |-
      选择带标注的具身场景
      MP3D 测试集 · ScanNet 验证集
      AI2-THOR：7 类 ALFRED 任务 / 93 场景
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: frames
    label: |-
      采集目标 RGB-D 帧
      MP3D / ScanNet 随机视点
      AI2-THOR 按 PDDL 选关键帧
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: project
    label: |-
      将三维物体投影到图像
      相机参数 + 三维坐标
      得到二维边界框与平均深度
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: relations
    label: |-
      提取不重叠空间关系三元组
      整框判断：上 / 下 / 左 / 右
      平均深度：近 / 远 · 观察者视角
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: qa
    label: |-
      生成多项选择问答
      四种方向关系使用 5 个模板
      聚合物体生成最近 / 最远问题
    type: document
    size: xl
    position:
      x: 1080
      'y': 250
  - id: filter
    label: |-
      自动过滤并平衡分布
      移除过大 / 过小边界框
      平衡六种空间关系
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: verify
    label: |-
      逐样本人工核验
      移除指代不清的物体
      移除空间关系错误的问题
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: dataset
    label: |-
      EmbSpatial-Bench
      3,640 个 QA · 2,181 张图 · 277 个场景
      294 个物体类别 · 6 种关系
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: evaluation
    label: |-
      LVLM 零样本评测
      生成式答案或最大似然选项
      分策略报告准确率
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: sources
    to: frames
    type: primary
  - from: frames
    to: project
    type: primary
  - from: project
    to: relations
    type: primary
  - from: relations
    to: qa
    type: primary
  - from: qa
    to: filter
    type: primary
  - from: filter
    to: verify
    type: primary
  - from: verify
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
modules: []
