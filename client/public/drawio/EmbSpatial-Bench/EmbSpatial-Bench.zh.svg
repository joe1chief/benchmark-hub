"11" x="0"><tspan>Matterport3D 测试集 · ScanNet 验证集</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>AI2-THOR：7 类 ALFRED 任务 / 93 个场景</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="261" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(361,334.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>采集目标 RGB-D 图像</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>MP3D / ScanNet 中随机选择视点</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>AI2-THOR 每个 PDDL 子目标后选取关键帧</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="525" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(625,334.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>将带标注的三维物体投影到图像</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>相机参数 + 三维坐标</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>得到二维框及框内平均深度</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="781" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(881,327.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>仅对不重叠边界框提取三元组</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>整框几何：上 / 下 / 左 / 右</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>平均深度：近 / 远</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>所有关系均采用观察者视角</tspan></text></g></g></g></g><g data-cell-id="7"><g><path d="M 1045 304 L 1245 304 L 1245 389 Q 1195 362 1145 389 Q 1095 416 1045 389 L 1045 319 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1145,312.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>生成多项选择题</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>四类方向关系使用 5 种模板</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>不相关关系作为错误选项</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>聚合物体生成最近 / 最远问题</tspan></text></g></g></g></g><g data-cell-id="8"><g><rect x="1301" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1401,327.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>自动过滤边界框并平衡分布</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>宽或高小于 50 像素即剔除</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>宽或高超过对应图像轴一半即剔除</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>保持空间关系分布平衡</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="1565" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1665,327.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>逐样本人工核验</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>相关物体必须唯一且清晰可辨</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>目标空间关系必须正确</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>每个负选项都必须错误</tspan></text></g></g></g></g><g data-cell-id="10"><g><path d="M 1821 319 C 1821 310.72 1865.77 304 1921 304 C 1947.52 304 1972.96 305.58 1991.71 308.39 C 2010.46 311.21 2021 315.02 2021 319 L 2021 389 C 2021 397.28 1976.23 404 1921 404 C 1865.77 404 1821 397.28 1821 389 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 2021 319 C 2021 327.28 1976.23 334 1921 334 C 1865.77 334 1821 327.28 1821 319" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1921,340.1) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>问答 / 图像 / 物体类别 / 场景</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>MP3D：1,201 / 928 / 133 / 26</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>AI2-THOR：1,239 / 683 / 95 / 93</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>ScanNet：1,200 / 570 / 35 / 175</tspan></text></g></g></g></g><g data-cell-id="11"><g><path d="M 2085 319 C 2085 310.72 212