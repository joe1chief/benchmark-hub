meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMLongBench-Doc Build Process
  description: >-
    Paper-aligned expert construction and three-round quality control for 1,082 questions over 135 long PDFs, followed
    by answer extraction and generalized Accuracy/F1 scoring.
  legend: The final benchmark contains 184 retained source questions and 898 newly annotated questions.
nodes:
  - id: documents
    label: |-
      Collect 135 Long PDF Documents
      76 Existing · 59 Newly Collected
      Cover Seven Document Types
      Average 47.5 Pages · 21,214 Tokens
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: train
    label: |-
      Train Ten Expert Annotators
      Doctors or PhD Students
      Require English Proficiency
      Pre-annotate Three Documents
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: batches
    label: |-
      Run 54 Annotation Batches
      Assign Two to Four PDFs Each
      Spend 60–90 Minutes per Document
      Apply Iterative Feedback
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: review
    label: |-
      Review 425 Existing Questions
      Tag Retain · Revise · Remove
      Check Six Quality Issues
      Initially Collect 211 Questions
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: author
    label: |-
      Author New Expert Questions
      About Three per Existing PDF
      About Six per New PDF
      Record Answer and Evidence Metadata
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: coverage
    label: |-
      Enforce Question Diversity
      Single-page and Cross-page Evidence
      Include Unanswerable Questions
      Use Text · Tables · Charts · Images
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: relevance
    label: |-
      QC One: Document Relevance
      Ask GPT-4o Without the PDF
      Remove 94 Answerable-without-PDF Items
      Keep the Document Indispensable
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: reflection
    label: |-
      QC Two: Self-reflection
      Ask GPT-4o with the PDF
      Return Inconsistencies to Experts
      Revise 13.8 Percent
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: crosscheck
    label: |-
      QC Three: Expert Cross-check
      Flag 17.5 Percent Inconsistency
      Measure Kappa at 0.42
      Authors Resolve Final Decisions
    type: user
    size: xl
    position:
      x: 860
      'y': 420
  - id: dataset
    label: |-
      Assemble 1,082 Final Questions
      184 Source · 898 Newly Annotated
      494 Single · 365 Cross-page
      223 Unanswerable Questions
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: extract
    label: |-
      Generate and Normalize Answers
      Feed PDF Pages or OCR Text
      Preserve Free-form Model Output
      GPT-4o Extracts a Short Answer
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Apply Rule-based Scoring
      Generalized Accuracy and F1
      Handle Unanswerable Responses
      Compare LVLM and OCR+LLM Inputs
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
