meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MTVQA Build Process
  description: Paper-aligned construction and evaluation of native multilingual text-centric visual question answering data.
  legend: >-
    Solid arrows trace image collection, multilingual OCR and cleaning, trained maker-checker annotation, ten-percent
    auditing, dataset splits, and exact-answer accuracy.
nodes:
  - id: collect
    label: |-
      Collect Text-rich Images
      30% Public Datasets
      20% Web · 50% Manual
      Documents and Natural Scenes
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: ocr
    label: |-
      Extract Multilingual Text
      Use ByteDance OCR API
      Filter by Language Type
      Filter by Text Amount
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: clean
    label: |-
      Clean Image Candidates
      Remove Sensitive and Unsafe Data
      Drop Images without Text
      8,980 to 8,895 Images
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: train
    label: |-
      Train Native Annotators
      Ten-plus Years of Language Use
      University Degree or Higher
      Guidelines · Q&A · Pilot Task
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: round_one
    label: |-
      First-round Maker Annotation
      Three Annotators per Language
      First 3 Questions Read Text
      Last 2 Require Reasoning
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: initial_qa
    label: |-
      Produce Initial QA Pairs
      Five Distinct QAs per Image
      Require Concise Answers
      28,906 QA Pairs
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: round_two
    label: |-
      Second-round Checker Review
      Two Independent Annotators
      Fix Relevance and Correctness
      Remove Redundancy and Ethics Risks
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: audit
    label: |-
      Audit Each Language
      Quality Inspector Samples 10%
      Return Failures for Re-annotation
      Apply Final Quality Control
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Finalize Nine-language Dataset
      8,794 Images
      28,607 QA Pairs
      More than 20 Scenarios
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: splits
    label: |-
      Create Train and Test Splits
      Train 6,678 · 21,829 QA
      Test 2,116 · 6,778 QA
      Preserve Native-language Text
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: inference
    label: |-
      Run Zero-shot Evaluation
      Use a Consistent Prompt
      Input Image plus Question
      Collect Model Answer
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: score
    label: |-
      Score with Accuracy
      Match Any Target Answer
      Prefer Exact Text Correctness
      Report per Language and Mean
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: human
    label: |-
      Establish Human Baseline
      Ten Native Speakers per Language
      Use the Same Questions
      About 80% Average Accuracy
    type: user
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report MTVQA Results
      Model · Human Gap
      Nine-language Breakdown
      OCR and Reasoning Failures
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
