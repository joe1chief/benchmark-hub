meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MTVQA 证据对齐的构建与评测流程
  description: >-
    依据 arXiv:2405.11985v5 及固定版本的官方代码和数据重建 MTVQA，覆盖三类图像来源比例、 多语言 OCR 与合规过滤、母语标注员的制定者—审核者流程、10% 抽检返工、发布字段和划分，
    并准确呈现论文提示词及已发布评测器的子串匹配规则和失败边界。
  legend: 实线箭头表示构建与计分主流程；带标签的分支保留来源选择、淘汰、修正、返工、输入失败和计分结果。 虚线分支表示独立的人类基线。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      论文 2405.11985v5 · 评测器 96590634
      代码 efc6a78a · 数据 7cdca63e
    type: document
    size: xl
    position:
      x: 80
      'y': 312
    style:
      fontSize: 10
  - id: source_route
    label: |-
      图像来源？
      公开数据集
      网络采集
      人工拍摄
    type: decision
    size: xl
    position:
      x: 408
      'y': 312
    style:
      fontSize: 10
  - id: public_source
    label: |-
      公开富文本图像 · 30%
      ICDAR MLT19 等数据
      文档与自然场景
      保留原始来源权利
    type: database
    size: xl
    position:
      x: 728
      'y': 104
    style:
      fontSize: 10
  - id: web_source
    label: |-
      网络图像 · 20%
      LAION-OCR
      从 Common Crawl 筛选
      菜单 · 标识 · 地图 · 账单
    type: database
    size: xl
    position:
      x: 728
      'y': 312
    style:
      fontSize: 10
  - id: manual_source
    label: |-
      人工拍摄 · 50%
      前往各语言对应国家
      母语真实场景
      高质量本地文字
    type: user
    size: xl
    position:
      x: 728
      'y': 520
    style:
      fontSize: 10
  - id: ocr
    label: |-
      提取并筛选文字
      字节跳动多语言 OCR API
      按语言类型筛选
      按文字数量筛选
    type: process
    size: xl
    position:
      x: 1056
      'y': 312
    style:
      fontSize: 10
  - id: eligibility_gate
    label: |-
      富文本图像合格吗？
      合规性审查
      OCR 检出文字
      属于可用语言组
    type: decision
    size: xl
    position:
      x: 1376
      'y': 312
    style:
      fontSize: 10
  - id: drop_image
    label: |-
      标注前淘汰
      OCR 无文字，或含政治 / 色情 /
      暴力 / 其他不安全内容
    type: terminal
    size: xl
    position:
      x: 1544
      'y': 624
    style:
      fontSize: 10
  - id: language_pool
    label: |-
      汇总九种母语图像
      AR · DE · FR · IT · JA
      KO · RU · TH · VI
      8,980 原始图 → 8,895 候选图
    type: database
    size: xl
    position:
      x: 1704
      'y': 312
    style:
      fontSize: 10
  - id: annotator_train
    label: |-
      招募并培训标注员
      母语使用 10 年以上 · 大学学历
      指南 · 问答 · 试标
    type: user
    size: xl
    position:
      x: 2032
      'y': 312
    style:
      fontSize: 10
  - id: maker_round
    label: |-
      首轮制定者标注
      每语言 3 人 · 每图 5 个问答
      前 3 题读取 · 后 2 题推理
      答案简洁
    type: process
    size: xl
    position:
      x: 2352
      'y': 312
    style:
      fontSize: 10
  - id: initial_pool
    label: |-
      初始标注池
      8,895 张图像
      28,906 个问答对
      母语问题与答案
    type: database
    size: xl
    position:
      x: 2680
      'y': 312
    style:
      fontSize: 10
  - id: checker_gate
    label: |-
      二轮审核结果？
      两名审核员独立检查
      相关性 · 正确性
      冗余性 · 伦理性
    type: decision
    size: xl
    position:
      x: 3000
      'y': 312
    style:
      fontSize: 10
  - id: keep_qa
    label: |-
      保留问答对
      相关且正确
      简洁且不重复
    type: process
    size: xl
    position:
      x: 3328
      'y': 104
    style:
      fontSize: 10
  - id: correct_qa
    label: |-
      修正问答对
      修复答案或措辞
      删除重复内容
    type: process
    size: xl
    position:
      x: 3328
      'y': 312
    style:
      fontSize: 10
  - id: remove_qa
    label: |-
      删除问答对
      无关或不合伦理
      不进入最终语料
    type: terminal
    size: xl
    position:
      x: 3328
      'y': 624
    style:
      fontSize: 10
  - id: audit_gate
    label: |-
      10% 语言抽检通过吗？
      质检员按语言抽样
      核对标注规范
    type: decision
    size: xl
    position:
      x: 3656
      'y': 312
    style:
      fontSize: 10
  - id: reannotate
    label: |-
      退回重新标注
      修正未通过的问答对
      重新进入质量抽检
    type: process
    size: xl
    position:
      x: 3656
      'y': 624
    style:
      fontSize: 10
  - id: release
    label: |-
      MTVQA 最终语料
      8,794 张图像
      28,607 个问答对
      20 余种场景
      数据许可 CC BY-NC 4.0
    type: database
    size: xl
    position:
      x: 3976
      'y': 312
    style:
      fontSize: 10
  - id: split
    label: |-
      发布固定版数据
      image · id · qa_pairs · lang
      qa_pairs：Python 字面量 · KO → KR
      训练 6,678 / 21,829
      测试 2,116 / 6,778 · 无适配器
    type: document
    size: xl
    position:
      x: 3976
      'y': 832
    style:
      fontSize: 10
  - id: prompt
    label: |-
      论文零样本提示词
      “用问题语言中的词或短语回答”
      附加问题 · 模型默认设置
    type: process
    size: xl
    position:
      x: 3328
      'y': 936
    style:
      fontSize: 10
  - id: eval_input_gate
    label: |-
      官方 acc.py 输入状态？
      按语言组织的 JSON 文件目录
      每项含 annotation 与 answer
    type: decision
    size: xl
    position:
      x: 3000
      'y': 936
    style:
      fontSize: 10
  - id: eval_abort
    label: |-
      评测器中止
      目录缺失或 JSON 格式错误
      键缺失或目标列表为空
      不做逐项容错
    type: terminal
    size: xl
    position:
      x: 3000
      'y': 1160
    style:
      fontSize: 10
  - id: empty_nan
    label: |-
      空目录结果
      没有语言得分
      NumPy 均值产生 NaN
      不存在有效分母
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 1160
    style:
      fontSize: 10
  - id: match_gate
    label: |-
      任一目标是答案子串吗？
      双方转小写并去首尾空白
      从模型答案中删除句点
      并非严格完全相等
    type: decision
    size: xl
    position:
      x: 2680
      'y': 936
    style:
      fontSize: 10
  - id: score_one
    label: |-
      单项得分 = 1
      至少一个目标匹配
      纳入该文件分母
    type: process
    size: xl
    position:
      x: 2352
      'y': 728
    style:
      fontSize: 10
  - id: score_zero
    label: |-
      单项得分 = 0
      没有目标子串匹配
      纳入该文件分母
    type: process
    size: xl
    position:
      x: 2352
      'y': 1040
    style:
      fontSize: 10
  - id: aggregate
    label: |-
      汇总已发布准确率
      先求每个文件的项目均值
      再对文件做无权平均
      不检查 9 文件 · 缺失会缩小宏平均
    type: process
    size: xl
    position:
      x: 2032
      'y': 936
    style:
      fontSize: 10
  - id: human
    label: |-
      人类基线
      每种语言十名受教育母语者
      随机选择
      论文 v5 平均值 = 79.7%
    type: user
    size: xl
    position:
      x: 2032
      'y': 1160
    style:
      fontSize: 10
  - id: report
    label: |-
      报告 MTVQA 结果
      各语言准确率与宏平均
      模型 / 人类差距
      OCR · 推理 · 偏差 · 幻觉
    type: terminal
    size: xl
    position:
      x: 1704
      'y': 936
    style:
      fontSize: 10
