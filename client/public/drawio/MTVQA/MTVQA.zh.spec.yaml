meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MTVQA 构建流程
  description: 与论文对齐地展示原生多语言文本中心视觉问答数据的收集、专家标注、质检和评测流程。
  legend: 实线箭头依次表示图像收集、多语言 OCR 与清洗、经培训的制定者-审核者标注、10% 抽检、数据划分及精确答案准确率。
nodes:
  - id: collect
    label: |-
      收集富文本图像
      30% 来自公开数据集
      20% 网络与 50% 人工采集
      覆盖文档与自然场景
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: ocr
    label: |-
      提取多语言文字
      使用字节跳动 OCR API
      按语言类型筛选
      按文字数量筛选
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: clean
    label: |-
      清洗候选图像
      移除敏感与不安全内容
      丢弃无文字图像
      从 8,980 减至 8,895 张
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: train
    label: |-
      培训母语标注员
      使用对应语言至少十年
      本科或更高学历
      指南讲解与问答及试标
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: round_one
    label: |-
      首轮制定者标注
      每种语言三名标注员
      前三题直接读取文字
      后两题需要文字推理
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: initial_qa
    label: |-
      生成初始问答对
      每图五个不同问答
      答案必须简洁
      共 28,906 个问答对
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: round_two
    label: |-
      二轮审核者复核
      两名标注员独立检查
      修正相关性与正确性
      删除冗余和伦理风险
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: audit
    label: |-
      按语言执行抽检
      质检员抽查 10%
      不合格项退回重标
      实施最终质量控制
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      定稿九语言数据集
      8,794 张图像
      28,607 个问答对
      覆盖 20 余种场景
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: splits
    label: |-
      划分训练集与测试集
      训练 6,678 图与 21,829 问答
      测试 2,116 图与 6,778 问答
      保留原生语言文字
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: inference
    label: |-
      执行零样本评测
      使用统一提示
      输入图像与问题
      收集模型答案
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: score
    label: |-
      使用准确率评分
      匹配任一目标答案
      强调文字精确正确
      分语言与总体汇总
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: human
    label: |-
      建立人类基线
      每种语言十名母语者
      回答相同问题
      平均准确率约 80%
    type: user
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告 MTVQA 结果
      模型与人类差距
      九语言分类结果
      OCR 与推理失败分析
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: ocr
    type: primary
  - from: ocr
    to: clean
    type: primary
  - from: clean
    to: train
    type: primary
  - from: train
    to: round_one
    type: primary
  - from: round_one
    to: initial_qa
    type: primary
  - from: initial_qa
    to: round_two
    type: primary
  - from: round_two
    to: audit
    type: primary
  - from: audit
    to: release
    type: primary
  - from: release
    to: splits
    type: primary
  - from: splits
    to: inference
    type: primary
  - from: inference
    to: score
    type: primary
  - from: score
    to: human
    type: primary
  - from: human
    to: report
    type: primary
modules: []
