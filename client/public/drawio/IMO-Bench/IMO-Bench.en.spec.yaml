meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IMO-Bench Build Process
  description: >-
    Paper-aligned IMO-Bench suite workflow: a medalist-vetted source pool becomes the 400-item answer benchmark, 60-item
    proof benchmark, and 1,000-item proof-grading benchmark, each with a distinct construction path, evaluation context,
    and metric.
  legend: >-
    The three solid parallel branches are separate paper benchmarks, not sequential stages; dashed autograder edges
    indicate validated scalable proxies while expert proof grades remain the primary paper results.
nodes:
  - id: panel
    label: |-
      IMO Medalists + Mathematicians
      Panel Total: 10 Gold + 5 Silver
      Vet Problems and Grading Data
    type: user
    size: xl
    position:
      x: 40
      'y': 300
  - id: suite
    label: |-
      IMO-Bench Paper Snapshot
      Three Complementary Benchmarks
      Answer 400 · Proof 60 · Grading 1,000
    type: database
    size: xl
    position:
      x: 320
      'y': 300
  - id: answer_build
    label: |-
      IMO-AnswerBench
      400 Verifiable Short-answer Problems
      100 per Four IMO Categories
    type: document
    size: xl
    position:
      x: 620
      'y': 40
  - id: answer_robust
    label: |-
      Reformulate and Robustify
      Unique Non-trivial Answers
      Paraphrase / Rename / Values / Distractors
    type: process
    size: xl
    position:
      x: 900
      'y': 40
  - id: answer_grade
    label: |-
      AnswerAutoGrader
      Gemini 2.5 Pro Extracts Final Answer
      Semantic Match to Ground Truth
    type: process
    size: xl
    position:
      x: 1180
      'y': 40
  - id: answer_metric
    label: |-
      Answer Result
      Overall + Category Accuracy
      Paper Usually Averages 8 Runs
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 40
  - id: proof_build
    label: |-
      IMO-ProofBench
      60 Proof Problems
      30 Basic + 30 Advanced
    type: document
    size: xl
    position:
      x: 620
      'y': 300
  - id: proof_advanced
    label: |-
      Advanced Set Composition
      18 Medalist-authored Novel
      6 IMO 2024 + 6 USAMO 2025
    type: process
    size: xl
    position:
      x: 900
      'y': 300
  - id: proof_grade
    label: |-
      Proof Evaluation
      Problem + Candidate + Reference + Guidelines
      Expert Integer Grade from 0 to 7
    type: user
    size: xl
    position:
      x: 1180
      'y': 300
  - id: proof_metric
    label: |-
      Proof Result
      Percent of Maximum Points
      Basic / Advanced / Source Slices
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 300
  - id: proof_auto
    label: |-
      Gemini 2.5 Pro ProofAutoGrader
      Scalable Proxy, Not Human Replacement
      Validate Rank Correlation
    type: process
    size: xl
    position:
      x: 1180
      'y': 430
  - id: grading_build
    label: |-
      IMO-GradingBench
      1,000 Advanced-proof Solutions
      Human 0–7 Grades
    type: document
    size: xl
    position:
      x: 620
      'y': 560
  - id: grading_labels
    label: |-
      Map and Balance Four Labels
      Correct 7 · Almost 6
      Partial 1 · Incorrect 0
    type: process
    size: xl
    position:
      x: 900
      'y': 560
  - id: grading_eval
    label: |-
      Grade with Minimal Context
      Problem + Proposed Solution Only
      Predict One of Four Labels
    type: process
    size: xl
    position:
      x: 1180
      'y': 560
  - id: grading_metric
    label: |-
      Grading Result
      Four-way Accuracy
      Mean Absolute Error
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 560
  - id: report
    label: |-
      Report a Three-capability Profile
      Answer Correctness + Proof Quality
      Ability to Grade Proofs
    type: terminal
    size: xl
    position:
      x: 1760
      'y': 300
edges:
  - from: panel
    to: suite
    type: primary
  - from: suite
    to: answer_build
    type: primary
  - from: answer_build
    to: answer_robust
    type: primary
  - from: answer_robust
    to: answer_grade
    type: primary
  - from: answer_grade
    to: answer_metric
    type: primary
  - from: suite
    to: proof_build
    type: primary
  - from: proof_build
    to: proof_advanced
    type: primary
  - from: proof_advanced
    to: proof_grade
    type: primary
  - from: proof_grade
    to: proof_metric
    type: primary
  - from: proof_grade
    to: proof_auto
    type: optional
  - from: proof_auto
    to: proof_metric
    type: optional
  - from: suite
    to: grading_build
    type: primary
  - from: grading_build
    to: grading_labels
    type: primary
  - from: grading_labels
    to: grading_eval
    type: primary
  - from: grading_eval
    to: grading_metric
    type: primary
  - from: answer_metric
    to: report
    type: primary
  - from: proof_metric
    to: report
    type: primary
  - from: grading_metric
    to: report
    type: primary
modules: []
