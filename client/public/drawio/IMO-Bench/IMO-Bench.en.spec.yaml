meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IMO-Bench Build Process
  description: >-
    Paper-aligned IMO-Bench suite workflow: a medalist-vetted source pool becomes the 400-item answer benchmark, 60-item
    proof benchmark, and 1,000-item proof-grading benchmark, each with a distinct construction path, evaluation context,
    and metric.
  legend: >-
    The three solid parallel branches are separate paper benchmarks, not sequential stages; dashed autograder edges
    indicate validated scalable proxies while expert proof grades remain the primary paper results.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Fixed Releases
      arXiv:2511.01846v1 · Code 92ae8c2
      Current Project 96fa6c4
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: panel
    label: |-
      IMO Medalists + Mathematicians
      Panel Total: 10 Gold + 5 Silver
      Vet Problems and Grading Data
    type: user
    size: xl
    position:
      x: 40
      'y': 300
  - id: suite
    label: |-
      IMO-Bench Paper Snapshot
      Three Parallel Paper Benchmarks
      Answer 400 · Proof 60 · Grading 1,000
    type: database
    size: xl
    position:
      x: 320
      'y': 300
  - id: answer
    label: |-
      IMO-AnswerBench
      400 Verifiable Short-answer Problems
      100 per Four IMO Categories
    type: document
    size: xl
    position:
      x: 620
      'y': 40
  - id: answer_robust
    label: |-
      Reformulate and Robustify
      Unique Non-trivial Answers
      Paraphrase / Rename / Values / Distractors
    type: process
    size: xl
    position:
      x: 900
      'y': 40
  - id: answer_grade
    label: |-
      AnswerAutoGrader
      Gemini 2.5 Pro Extracts Final Answer
      Semantic Match to Ground Truth
    type: process
    size: xl
    position:
      x: 1180
      'y': 40
  - id: answer_metric
    label: |-
      Answer Result
      Overall + Category Accuracy
      Paper Usually Averages 8 Runs
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 40
  - id: proof_basic
    label: |-
      Basic Proof Set · 30 Problems
      Rephrased Existing Problems
      Pre-IMO through IMO-Medium
    type: document
    size: xl
    position:
      x: 620
      'y': 300
  - id: proof_advanced
    label: |-
      Advanced Set Composition
      Advanced Proof Set · 30 Problems
      18 Medalist-authored Novel Problems
      6 IMO 2024 + 6 USAMO 2025
    type: process
    size: xl
    position:
      x: 900
      'y': 300
  - id: proof_human
    label: |-
      Primary Human Proof Grading
      Problem + Candidate + Reference
      Specific Guideline · Integer 0 to 7
    type: user
    size: xl
    position:
      x: 1180
      'y': 300
  - id: proof_metric
    label: |-
      Proof Result
      Percent of Maximum Points
      Human Grades Are Primary
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 300
  - id: proof_auto
    label: |-
      Gemini 2.5 Pro ProofAutoGrader
      Predict Points out of 7
      Scalable Proxy, Not Human Replacement
    type: process
    size: xl
    position:
      x: 1460
      'y': 430
  - id: grading_data
    label: |-
      IMO-GradingBench
      1,000 Solutions to 30 Advanced Problems
      Human Integer Grades from 0 to 7
    type: document
    size: xl
    position:
      x: 1180
      'y': 560
  - id: grading_context
    label: |-
      Minimal Grader Context
      Problem + Proposed Solution Only
      No Reference or Grading Guideline
    type: process
    size: xl
    position:
      x: 1460
      'y': 560
  - id: grading_parse
    label: |-
      Map and Parse Four Labels
      Buckets 7 / 6-4 / 3-1 / 0
      Last Word First · LLM Fallback
    type: process
    size: xl
    position:
      x: 1740
      'y': 560
  - id: grading_metric
    label: |-
      Grading Result
      Four-way Accuracy + MAE
      Predicted Score Buckets 7/6/1/0
    type: terminal
    size: xl
    position:
      x: 2020
      'y': 560
  - id: report
    label: |-
      Report a Three-capability Profile
      Answer Correctness + Proof Quality
      Ability to Grade Proofs
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 300
  - id: artifact_boundary
    label: |-
      Public / Paper Boundary
      answerbench_v2 + proofbench_v2
      LeanProof Added Later · Excluded
      Paper Benchmark Assets Are CSV-only
    type: document
    size: xl
    position:
      x: 2600
      'y': 300
edges:
  - from: evidence
    to: suite
    type: data
  - from: panel
    to: suite
    type: primary
  - from: suite
    to: answer
    type: primary
  - from: answer
    to: answer_robust
    type: primary
  - from: answer_robust
    to: answer_grade
    type: primary
  - from: answer_grade
    to: answer_metric
    type: primary
  - from: suite
    to: proof_basic
    type: primary
  - from: suite
    to: proof_advanced
    type: primary
  - from: proof_basic
    to: proof_human
    type: primary
  - from: proof_advanced
    to: proof_human
    type: primary
  - from: proof_human
    to: proof_metric
    type: primary
  - from: proof_human
    to: proof_auto
    type: secondary
  - from: proof_auto
    to: proof_metric
    type: secondary
  - from: proof_human
    to: grading_data
    type: secondary
  - from: grading_data
    to: grading_context
    type: primary
  - from: grading_context
    to: grading_parse
    type: primary
  - from: grading_parse
    to: grading_metric
    type: primary
  - from: answer_metric
    to: report
    type: primary
  - from: proof_metric
    to: report
    type: primary
  - from: grading_metric
    to: report
    type: primary
  - from: report
    to: artifact_boundary
    type: data
modules: []
