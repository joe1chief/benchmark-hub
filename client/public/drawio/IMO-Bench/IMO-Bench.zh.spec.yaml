meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IMO-Bench 构建流程
  description: 与论文一致的 IMO-Bench 套件流程：由奖牌得主复核的题源分别构成 400 题答案基准、60 题证明基准和 1,000 条证明评分基准，每条分支都有独立的构建方法、评测上下文和指标。
  legend: 三条实线并行分支是独立的论文子基准，并非前后顺序；虚线自动裁判表示经验证的规模化代理， 论文的证明主结果仍以专家评分为准。
nodes:
  - id: evidence
    label: |-
      一手证据与固定版本
      arXiv:2511.01846v1
      代码 92ae8c2
      当前项目 96fa6c4
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: panel
    label: |-
      IMO 奖牌得主与数学家
      评审团合计 10 金 + 5 银
      复核题目与评分数据
    type: user
    size: xl
    position:
      x: 40
      'y': 300
  - id: suite
    label: |-
      论文版 IMO-Bench
      三个并行论文子基准
      答案 400 · 证明 60 · 评分 1,000
    type: database
    size: xl
    position:
      x: 320
      'y': 300
  - id: answer
    label: |-
      IMO-AnswerBench
      400 道可验证简答题
      四个 IMO 类别各 100 道
    type: document
    size: xl
    position:
      x: 620
      'y': 40
  - id: answer_robust
    label: |-
      改写与稳健化
      唯一非平凡答案
      释义 / 重命名 / 改数值 / 干扰项
    type: process
    size: xl
    position:
      x: 900
      'y': 40
  - id: answer_grade
    label: |-
      AnswerAutoGrader
      Gemini 2.5 Pro 抽取最终答案
      与标准答案做语义匹配
    type: process
    size: xl
    position:
      x: 1180
      'y': 40
  - id: answer_metric
    label: |-
      答案分支结果
      总体与分类准确率
      论文通常平均 8 次运行
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 40
  - id: proof_basic
    label: |-
      基础证明集 · 30 道
      改写既有问题
      Pre-IMO 至 IMO-Medium
    type: document
    size: xl
    position:
      x: 620
      'y': 300
  - id: proof_advanced
    label: |-
      高级集组成
      高级证明集 · 30 道
      奖牌得主原创 18 道新题
      6 道 IMO 2024 + 6 道 USAMO 2025
    type: process
    size: xl
    position:
      x: 900
      'y': 300
  - id: proof_human
    label: |-
      主要人工证明评分
      题目 + 候选解 + 参考解
      具体细则 · 整数 0 至 7 分
    type: user
    size: xl
    position:
      x: 1180
      'y': 300
  - id: proof_metric
    label: |-
      证明分支结果
      占最高总分百分比
      人工评分是主要结果
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 300
  - id: proof_auto
    label: |-
      Gemini 2.5 Pro ProofAutoGrader
      预测满分 7 分中的得分
      规模化代理而非替代专家
    type: process
    size: xl
    position:
      x: 1460
      'y': 430
  - id: grading_data
    label: |-
      IMO-GradingBench
      1,000 条解答 · 30 道高难题
      人工整数评分 0 至 7
    type: document
    size: xl
    position:
      x: 1180
      'y': 560
  - id: grading_context
    label: |-
      最少评分上下文
      仅提供题目与候选解答
      无参考解与评分细则
    type: process
    size: xl
    position:
      x: 1460
      'y': 560
  - id: grading_parse
    label: |-
      映射并解析四类标签
      分桶 7 / 6-4 / 3-1 / 0
      先取末词 · LLM 回退
    type: process
    size: xl
    position:
      x: 1740
      'y': 560
  - id: grading_metric
    label: |-
      评分分支结果
      四分类准确率 + MAE
      预测分桶 7/6/1/0
    type: terminal
    size: xl
    position:
      x: 2020
      'y': 560
  - id: report
    label: |-
      报告三维能力画像
      答案正确性 + 证明质量
      证明评分能力
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 300
  - id: artifact_boundary
    label: |-
      公开物与论文边界
      answerbench_v2 + proofbench_v2
      LeanProof 为后续新增 · 不纳入
      论文基准仅公开 CSV
    type: document
    size: xl
    position:
      x: 2600
      'y': 300
edges:
  - from: evidence
    to: suite
    type: data
  - from: panel
    to: suite
    type: primary
  - from: suite
    to: answer
    type: primary
  - from: answer
    to: answer_robust
    type: primary
  - from: answer_robust
    to: answer_grade
    type: primary
  - from: answer_grade
    to: answer_metric
    type: primary
  - from: suite
    to: proof_basic
    type: primary
  - from: suite
    to: proof_advanced
    type: primary
  - from: proof_basic
    to: proof_human
    type: primary
  - from: proof_advanced
    to: proof_human
    type: primary
  - from: proof_human
    to: proof_metric
    type: primary
  - from: proof_human
    to: proof_auto
    type: secondary
  - from: proof_auto
    to: proof_metric
    type: secondary
  - from: proof_human
    to: grading_data
    type: secondary
  - from: grading_data
    to: grading_context
    type: primary
  - from: grading_context
    to: grading_parse
    type: primary
  - from: grading_parse
    to: grading_metric
    type: primary
  - from: answer_metric
    to: report
    type: primary
  - from: proof_metric
    to: report
    type: primary
  - from: grading_metric
    to: report
    type: primary
  - from: report
    to: artifact_boundary
    type: data
modules: []
