meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IMO-Bench 构建流程
  description: 与论文一致的 IMO-Bench 套件流程：由奖牌得主复核的题源分别构成 400 题答案基准、60 题证明基准和 1,000 条证明评分基准，每条分支都有独立的构建方法、评测上下文和指标。
  legend: 三条实线并行分支是独立的论文子基准，并非前后顺序；虚线自动裁判表示经验证的规模化代理， 论文的证明主结果仍以专家评分为准。
nodes:
  - id: panel
    label: |-
      IMO 奖牌得主与数学家
      评审团合计 10 金 + 5 银
      复核题目与评分数据
    type: user
    size: xl
    position:
      x: 40
      'y': 300
  - id: suite
    label: |-
      论文版 IMO-Bench
      三个互补子基准
      答案 400 · 证明 60 · 评分 1,000
    type: database
    size: xl
    position:
      x: 320
      'y': 300
  - id: answer_build
    label: |-
      IMO-AnswerBench
      400 道可验证简答题
      四个 IMO 类别各 100 道
    type: document
    size: xl
    position:
      x: 620
      'y': 40
  - id: answer_robust
    label: |-
      改写与稳健化
      唯一非平凡答案
      释义 / 重命名 / 改数值 / 干扰项
    type: process
    size: xl
    position:
      x: 900
      'y': 40
  - id: answer_grade
    label: |-
      AnswerAutoGrader
      Gemini 2.5 Pro 抽取最终答案
      与标准答案做语义匹配
    type: process
    size: xl
    position:
      x: 1180
      'y': 40
  - id: answer_metric
    label: |-
      答案分支结果
      总体与分类准确率
      论文通常平均 8 次运行
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 40
  - id: proof_build
    label: |-
      IMO-ProofBench
      60 道证明题
      基础 30 + 高级 30
    type: document
    size: xl
    position:
      x: 620
      'y': 300
  - id: proof_advanced
    label: |-
      高级集组成
      奖牌得主原创 18 道
      IMO 2024 六道 + USAMO 2025 六道
    type: process
    size: xl
    position:
      x: 900
      'y': 300
  - id: proof_grade
    label: |-
      证明评测
      题目 + 候选 + 参考解 + 评分细则
      专家给 0 至 7 的整数分
    type: user
    size: xl
    position:
      x: 1180
      'y': 300
  - id: proof_metric
    label: |-
      证明分支结果
      占最高总分百分比
      基础 / 高级 / 来源切片
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 300
  - id: proof_auto
    label: |-
      Gemini 2.5 Pro ProofAutoGrader
      规模化代理而非替代专家
      验证排名相关性
    type: process
    size: xl
    position:
      x: 1180
      'y': 430
  - id: grading_build
    label: |-
      IMO-GradingBench
      1,000 条高级证明解答
      配专家 0–7 分
    type: document
    size: xl
    position:
      x: 620
      'y': 560
  - id: grading_labels
    label: |-
      映射并平衡四类标签
      正确 7 · 几乎正确 6
      部分正确 1 · 错误 0
    type: process
    size: xl
    position:
      x: 900
      'y': 560
  - id: grading_eval
    label: |-
      仅给最少上下文评分
      只提供题目与候选解答
      预测四类之一
    type: process
    size: xl
    position:
      x: 1180
      'y': 560
  - id: grading_metric
    label: |-
      评分分支结果
      四分类准确率
      平均绝对误差
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 560
  - id: report
    label: |-
      报告三维能力画像
      答案正确性 + 证明质量
      证明评分能力
    type: terminal
    size: xl
    position:
      x: 1760
      'y': 300
edges:
  - from: panel
    to: suite
    type: primary
  - from: suite
    to: answer_build
    type: primary
  - from: answer_build
    to: answer_robust
    type: primary
  - from: answer_robust
    to: answer_grade
    type: primary
  - from: answer_grade
    to: answer_metric
    type: primary
  - from: suite
    to: proof_build
    type: primary
  - from: proof_build
    to: proof_advanced
    type: primary
  - from: proof_advanced
    to: proof_grade
    type: primary
  - from: proof_grade
    to: proof_metric
    type: primary
  - from: proof_grade
    to: proof_auto
    type: optional
  - from: proof_auto
    to: proof_metric
    type: optional
  - from: suite
    to: grading_build
    type: primary
  - from: grading_build
    to: grading_labels
    type: primary
  - from: grading_labels
    to: grading_eval
    type: primary
  - from: grading_eval
    to: grading_metric
    type: primary
  - from: answer_metric
    to: report
    type: primary
  - from: proof_metric
    to: report
    type: primary
  - from: grading_metric
    to: report
    type: primary
modules: []
