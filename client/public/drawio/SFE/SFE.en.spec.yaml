meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SFE Build and Evaluation Process
  description: >-
    SFE is built in three paper-defined phases. Experts first identify high-value directions in astronomy, chemistry,
    earth, life, and materials science. Two to five experts per discipline then map concrete tasks to signal perception,
    attribute understanding, or comparative reasoning and to MCQ, exact-match, or open-question formats. Native
    scientific data in 17 formats are rendered into images; experts author the VQA pairs, translate them into English
    and Chinese, cross-review scientific correctness, and apply rule-based format checks. The final set contains 830 VQA
    pairs across 66 tasks. Zero-shot evaluation uses temperature zero and reports text similarity or LLM-judge scores,
    with execution success and IoU for grounding tasks, broken down by discipline, cognitive level, and language.
  legend: >-
    Source: SFE arXiv:2506.10521 Sections 3.1-3.2 and Appendix E; official PrismaX-Team/sfe repository. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
