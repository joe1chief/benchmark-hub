meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: clembench-2024 Build Process
  description: >-
    Paper-aligned clembench flow: dialogue games separate reusable templates, response parsers, and game logic from
    freshly sampled instances; a programmatic GameMaster runs LLM self-play, formal and quality scores form clemscore,
    and human plus multilingual studies validate challenge and extensibility.
  legend: Solid arrows show game construction and scoring; branches show human and multilingual validation studies.
nodes:
  - id: games
    label: |-
      Select Capability-probing Dialogue Games
      Instruction Following • Strategy • Language Understanding
      Fully Specifiable Goals and Terminal States
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: templates
    label: |-
      Write Prompt Templates
      Define Player Roles and Turn Instructions
      Keep Game Specification Separate from Instances
    type: document
    size: xl
    position:
      x: 340
      'y': 40
  - id: parsers
    label: |-
      Implement Parsers and Game Flow
      Enforce Well-formed Responses
      Detect Valid Actions and Terminal States
    type: process
    size: xl
    position:
      x: 340
      'y': 400
  - id: instances
    label: |-
      Create Fresh Game Instances
      Sample Existing Pools or Lightly Curate Targets
      Reduce Fixed-instance Contamination Risk
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: master
    label: |-
      Instantiate the Programmatic GameMaster
      Fill Templates with Concrete Instances
      Control Turns, State, and Game-specific Rules
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: selfplay
    label: |-
      Run LLM-vs-LLM Self-play
      Prompt Both Player Roles Turn by Turn
      Record Complete Offline Dialogue Episodes
    type: terminal
    size: xl
    position:
      x: 1240
      'y': 220
  - id: formal
    label: |-
      Measure Formal Play
      Percentage of Games Played to End
      Expose Formatting and Protocol Failures
    type: process
    size: xl
    position:
      x: 1540
      'y': 40
  - id: quality
    label: |-
      Score Game-specific Quality
      Apply Each Game's Main Metric
      Normalize Quality to a 0–100 Scale
    type: process
    size: xl
    position:
      x: 1540
      'y': 400
  - id: aggregate
    label: |-
      Compute clemscore
      Combine Formal Play and Quality
      Average Main Metrics by Game, Then across Games
    type: terminal
    size: xl
    position:
      x: 1840
      'y': 220
  - id: human
    label: |-
      Establish Human Expert Baselines
      Author Pairings Play 10–15 Episodes per Game
      Exclude Instances Created by the Same Player
    type: user
    size: xl
    position:
      x: 2140
      'y': 40
  - id: multilingual
    label: |-
      Run Multilingual Case Study
      Native Speakers Translate Templates and Targets
      Preserve the Same Parser and Game Logic
    type: user
    size: xl
    position:
      x: 2140
      'y': 400
  - id: validation
    label: |-
      Validate Benchmark Properties
      Fresh-instance Rank Correlation 0.71
      Compare Human Ceiling and Language Effects
    type: decision
    size: xl
    position:
      x: 2440
      'y': 220
  - id: report
    label: |-
      Publish Dynamic Benchmark Results
      clemscore • % Played • Quality Score
      Model Ranking + Human + Multilingual Analysis
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
edges:
  - from: games
    to: templates
    type: primary
  - from: games
    to: parsers
    type: primary
  - from: templates
    to: instances
    type: primary
  - from: parsers
    to: instances
    type: primary
  - from: instances
    to: master
    type: primary
  - from: master
    to: selfplay
    type: primary
  - from: selfplay
    to: formal
    type: primary
  - from: selfplay
    to: quality
    type: primary
  - from: formal
    to: aggregate
    type: primary
  - from: quality
    to: aggregate
    type: primary
  - from: aggregate
    to: human
    type: primary
  - from: aggregate
    to: multilingual
    type: primary
  - from: human
    to: validation
    type: primary
  - from: multilingual
    to: validation
    type: primary
  - from: validation
    to: report
    type: primary
modules: []
