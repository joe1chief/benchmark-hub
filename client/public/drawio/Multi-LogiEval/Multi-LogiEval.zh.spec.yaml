meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Multi-LogiEval 构建与评测流程
  description: 对齐论文展示命题/一阶逻辑与非单调推理两路构建、按深度组合规则、LLM 故事生成、人工修订和二元蕴含评测。
  legend: 通过验证的基准包含 1,552 条英文上下文-问题数据，覆盖三类逻辑和一至五步推理深度。
nodes:
  - id: goal
    label: |-
      定义多步逻辑推理
      二元上下文蕴含任务
      明确设置一至五步深度
      分开三类逻辑体系
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: inventory
    label: |-
      整理逻辑构件
      命题 · 一阶 · 非单调逻辑
      33 条核心 PL / FOL 推理规则
      八种 NM 推理模式
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: monotonic
    label: |-
      构建 PL 与 FOL 路径
      深度 1 使用单条规则
      结论连接后续规则前提
      每步对应一条推理规则
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: nonmonotonic
    label: |-
      构建非单调逻辑路径
      从八种默认推理模式开始
      每条深度链只用一条 NM 规则
      再与经典逻辑混合
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: monotonic_combos
    label: |-
      组合单调逻辑规则链
      第 i 步结论进入第 i+1 步前提
      创建 71 种组合
      覆盖深度 2 至 5
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: nonmonotonic_combos
    label: |-
      组合 NM 与经典逻辑链
      人工定义分深度模板
      12 · 2 · 2 · 1 种组合
      分别对应深度 2 · 3 · 4 · 5
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: monotonic_generation
    label: |-
      少样本提示 Claude-2
      规则 · 格式 · 多样性 · 任务
      每种规则组合给五个示例
      生成上下文与问题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: nonmonotonic_generation
    label: |-
      提示生成非单调数据
      定义任务和假设
      指定逻辑连接关系
      强制系统化输出格式
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: naturalize
    label: |-
      把逻辑实例自然语言化
      用真实实体替换符号标签
      扩展领域与概念集合
      推导是或否的答案
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: validate
    label: |-
      人工验证并修订
      检查预期逻辑关系
      修正故事错误 · 语法 · 拼写
      筛选或改写高质量实例
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: release
    label: |-
      发布 1,552 条验证数据
      PL 525 · FOL 535 · NM 492
      深度 1–5：410 · 442 · 310 · 280 · 110
      答案：是 1,126 · 否 426
    type: database
    size: xl
    position:
      x: 1460
      'y': 500
  - id: evaluate
    label: |-
      评测六个 LLM
      零样本思维链提示
      预测二元蕴含标签
      检查生成的推理链
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: report
    label: |-
      报告逻辑推理准确率
      按逻辑类型和深度拆分
      跟踪随深度增加的下降
      分析推理过程正确性
    type: terminal
    size: xl
    position:
      x: 980
      'y': 650
edges:
  - from: goal
    to: inventory
    type: primary
  - from: inventory
    to: monotonic
    type: primary
  - from: inventory
    to: nonmonotonic
    type: primary
  - from: monotonic
    to: monotonic_combos
    type: primary
  - from: nonmonotonic
    to: nonmonotonic_combos
    type: primary
  - from: monotonic_combos
    to: monotonic_generation
    type: primary
  - from: nonmonotonic_combos
    to: nonmonotonic_generation
    type: primary
  - from: monotonic_generation
    to: naturalize
    type: primary
  - from: nonmonotonic_generation
    to: naturalize
    type: primary
  - from: naturalize
    to: validate
    type: primary
  - from: validate
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
