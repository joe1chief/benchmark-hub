meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HarmBench Build and Evaluation Process
  description: >-
    Paper- and repository-aligned HarmBench workflow from policy-guided manual behavior curation through the official
    validation/test split, standardized red-team generation, category-specific classifiers, and attack success rate.
  legend: Solid arrows are the main benchmark pipeline; dashed arrows show taxonomy or release-artifact boundaries.
nodes:
  - id: evidence
    label: |-
      Primary Evidence
      arXiv 2402.04249v2 · §4 / App. B.5
      Repo 8e1604d
      data/behavior_datasets
    type: document
    size: xl
    position:
      x: 20
      'y': 260
  - id: policies
    label: |-
      Acceptable-use Policies
      OpenAI · Anthropic
      Meta · Inflection
    type: document
    size: xl
    position:
      x: 260
      'y': 260
  - id: distill
    label: |-
      GPT-4 Distillation
      Create combined policy summary
      Use as curation guide
    type: process
    size: xl
    position:
      x: 500
      'y': 260
  - id: manual
    label: |-
      Authors Manually Curate
      Violations of laws / norms
      Filter dual-intent cases
      Check differential searchability
    type: user
    size: xl
    position:
      x: 740
      'y': 260
  - id: functional
    label: |-
      510 Behaviors
      200 standard · 100 copyright
      100 contextual · 110 multimodal
    type: database
    size: xl
    position:
      x: 980
      'y': 100
  - id: semantic
    label: |-
      7 Semantic Categories
      Cyber · chemical / biological
      Copyright · misinformation
      Harassment · illegal · general harm
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: split
    label: |-
      Official Behavior Split
      100 validation · 410 test
      No tuning on test behaviors
    type: database
    size: xl
    position:
      x: 1220
      'y': 100
  - id: attack
    label: |-
      Generate Test Cases
      Red-team method receives behavior
      N = 512 test cases per behavior
    type: process
    size: xl
    position:
      x: 1460
      'y': 100
  - id: target
    label: |-
      Target Model + Defense
      Greedy decoding
    type: process
    size: xl
    position:
      x: 1700
      'y': 100
  - id: route
    label: |-
      Functional Route
      Copyright behavior?
    type: decision
    size: xl
    position:
      x: 1940
      'y': 100
  - id: llm_classifier
    label: |-
      Non-copyright Classifier
      Open Llama 2 13B classifier
      Behavior + completion → yes/no
    type: process
    size: xl
    position:
      x: 2180
      'y': 20
  - id: hash_classifier
    label: |-
      Copyright Classifier
      MinHash over overlapping chunks
      Jaccard threshold > 0.6
      Actual copied text required
    type: process
    size: xl
    position:
      x: 2180
      'y': 300
  - id: score
    label: |-
      Attack Success Rate (ASR)
      Fraction of successful test cases
      per behavior; averaged for reports
    type: terminal
    size: xl
    position:
      x: 2420
      'y': 140
  - id: artifact_boundary
    label: |-
      Current Release Boundary
      Text CSV split: 80/320
      Multimodal all: 110
      No separate 20/90 CSV
    type: document
    size: xl
    position:
      x: 1460
      'y': 500
