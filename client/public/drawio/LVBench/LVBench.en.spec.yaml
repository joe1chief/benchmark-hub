    label: |-
      Apply Five Screening Rules
      Clear Protagonist · Causal Structure
      At Least One Event per 5 Minutes
      Stable and Clear · At Least 720p
      Critical Information Is Visual
    type: process
    size: xl
    position:
      x: 792
      'y': 120
