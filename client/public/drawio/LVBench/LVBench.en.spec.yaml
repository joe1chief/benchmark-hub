      Mark Minimal Exact Start–End Segment
    type: user
    size: xl
    position:
      x: 1128
      'y': 360
  - id: editorial_qc
    label: |-
      Run Editorial Quality Control
      Check Coverage · Consistency · Uniqueness
      Reduce Excess Temporal-grounding Items
      Keep References Unambiguous
    type: process
    size: xl
    position:
      x: 792
      'y': 360
  - id: leakage_filter
    label: |-
      Gate Text-only Answerable Items
      GLM-4 and GPT-4 Answer Independently
      Remove If Identical and Correct
      Removed Count Is Not Reported
    type: process
    size: xl
    position:
      x: 456
      'y': 360
  - id: release
    label: |-
      Release 1,549 QA in 103 Video Records
      Unique UID · A–D · time_reference
      No Recommended Train/Dev/Test Split
      Evaluation and Testing Only
    type: database
    size: xl
    position:
      x: 120
      'y': 360
  - id: non_native_input
    label: |-
      Non-native Long-video Route
      Uniform Fixed-frame Sampling
      Examples: 32 or 96 Frames
      Match Each Model's Input Limit
    type: process
    size: xl
    position:
      x: 288
      'y': 584
  - id: native_input
    label: |-
      Native Long-video Route
      Process at One Frame per Second
      Downsample Only above Model Limit
      Not Full Original-frame-rate Input
    type: process
    size: xl
    position:
      x: 624
      'y': 808
  - id: prompt
    label: |-
      Use the Paper Multiple-choice Prompt
      Question Already Contains (A)–(D)
      Return the Choice Letter Directly
      Give No Explanation
    type: document
    size: xl
    position:
      x: 960
      'y': 696
  - id: paper_parser
    label: |-
      Apply Paper Response Parsing
      Regex First · LLM Fallback on Failure
      v3 Does Not Name the LLM or Prompt
      No Generation Configuration Reported
    type: process
    size: xl
    position:
      x: 1296
      'y': 696
  - id: released_scorer
    label: |-
      Run the Released Exact-match Scorer
      Input JSON Maps UID to Answer String
      Compare Directly with Ground-truth A–D
      polish_answer Exists but Is Not Wired
    type: process
    size: xl
    position:
      x: 1632
      'y': 696
  - id: metrics
    label: |-
      Compute Overall and Six Skill Scores
      Overall Uses Submitted Known UIDs
      Multi-label Items Enter Every Tag
      Complete Submission Gives 1,549 Denominator
    type: terminal
    size: xl
    position:
      x: 1968
      'y': 696
  - id: leaderboard
    label: |-
      Publish Overall · ER · EU · KIR
      Publish TG · Rea · Sum
      result.json Uses 0–1 Fractions
      Leaderboard Displays Percentages
    type: terminal
    size: xl
    position:
      x: 2304
      'y': 696
  - id: release_drift
    label: |-
      Version and Released-data Drift
      v1/v2/v3 Test 8/15/26 Models
      Paper: 117 h · 4,101 s Mean
      JSONL: 115.532 h · 4,038 s Mean
      16 Heights under 720p · 4 Videos over 2 h
    type: document
    size: xl
    position:
      x: 120
      'y': 1000
  - id: artifact_boundary
    label: |-
      Artifact and Leaderboard Boundary
      Public QA · Metadata · Scripts
      Partly Public · CC BY-NC-SA
      Raw Videos Stay on YouTube
      HF train=7 Is Seven Doc Images
      Static Board Works · Submit Space Fails
    type: document
    size: xl
    position:
      x: 960
      'y': 1000
