      Hired Annotators · Full-video Platform
      Manual Quality and Harmful-content Check
      Average Compensation USD 30 per Video
    type: user
    size: xl
    position:
      x: 1464
      'y': 120
  - id: stage1
    label: |-
      Stage 1 · Analyze the Full Video
      Mark Events · Scenes · Key Entities
      Find Temporal Dependencies
      Find Causal Relations
    type: user
    size: xl
    position:
      x: 1800
      'y': 120
  - id: stage2
    label: |-
      Stage 2 · Author Distributed Questions
      Average 24 per Hour before Final Filter
      Cover the Full Video Timeline
      Initially Cover All Six Skills per Video
    type: user
    size: xl
    position:
      x: 1800
      'y': 360
  - id: taxonomy
    label: |-
      Assign Multi-label Capabilities
      TG · Sum · Rea · ER · EU · KIR
