meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LVBench Build Process
  description: >-
    Paper-aligned construction of LVBench with three-stage professional annotation, text-only leakage filtering, two
    evaluation-input routes, released scoring behavior, and explicit artifact boundaries.
  legend: >-
    Solid primary edges show the benchmark pipeline. Data edges separate version, access, license, and leaderboard
    caveats from the construction and evaluation flow.
