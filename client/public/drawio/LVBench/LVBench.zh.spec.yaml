meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LVBench 构建流程
  description: 对齐论文的 LVBench 构建流程，明确三阶段专业标注、纯文本泄漏过滤、两条评测输入路线、 已发布评分行为，以及独立的制品披露边界。
  legend: 实线主边表示基准流程；data 边将版本、访问、许可与排行榜注意事项同构建和评测主线分开。
nodes:
  - id: evidence
    label: |-
      主要证据与固定版本
      ICCV 2025 · arXiv v3
      Git 518df472 · HF 0caedb92
      站点 07fdecb1 · 2026-07-21 核验
    type: document
    size: xl
    position:
      x: 120
      'y': 120
  - id: candidates
    label: |-
      收集 500 个 YouTube 候选
      通过搜索、推荐与领域关键词
      自媒体 21 · 动画 18 · 体育 17
      直播 17 · 电视 16 · 纪录片 14
      每个候选至少 30 分钟
    type: database
    size: xl
    position:
      x: 456
      'y': 120
  - id: screen
    label: |-
      应用五项视频筛选规则
      主角清晰 · 结构因果连贯
      平均每 5 分钟至少一个重要事件
      稳定清晰 · 至少 720p
      关键信息依靠视觉
    type: process
    size: xl
    position:
      x: 792
      'y': 120
  - id: corpus
    label: |-
      论文报告的视频集
      103 个视频 · 117 小时
      平均时长 4,101 秒
      六类但非均衡 · 不含音频
    type: database
    size: xl
    position:
      x: 1128
      'y': 120
  - id: annotators
    label: |-
      专业标注设置
      雇佣标注员 · 全片标注平台
      人工检查质量与有害内容
      每个视频平均报酬 30 美元
    type: user
    size: xl
    position:
      x: 1464
      'y': 120
  - id: stage1
    label: |-
      阶段 1 · 完整分析视频
      标记事件、场景与关键实体
      识别时间依赖
      识别因果关系
    type: user
    size: xl
    position:
      x: 1800
      'y': 120
  - id: stage2
    label: |-
      阶段 2 · 编写分布式问题
      最终过滤前平均每小时 24 题
      覆盖完整视频时间线
      每个视频初始覆盖六项能力
    type: user
    size: xl
    position:
      x: 1800
      'y': 360
  - id: taxonomy
    label: |-
      分配多标签能力
      TG · Sum · Rea · ER · EU · KIR
      使用具体且唯一的指代
      发布物包含 26 种规范组合
    type: process
    size: xl
    position:
      x: 1464
      'y': 360
  - id: stage3
    label: |-
      阶段 3 · 构造选项与线索
      1 个正确项 · 3 个可信干扰项
      对齐选项格式与长度
      标注最小精确起止片段
    type: user
    size: xl
    position:
      x: 1128
      'y': 360
  - id: editorial_qc
    label: |-
      执行编辑质控
      检查覆盖、一致性与唯一性
      减少过量时间定位题
      保持指代无歧义
    type: process
    size: xl
    position:
      x: 792
      'y': 360
  - id: leakage_filter
    label: |-
      门控纯文本可回答题目
      GLM-4 与 GPT-4 独立作答
      答案相同且正确时删除
      论文未报告删除数量
    type: process
    size: xl
    position:
      x: 456
      'y': 360
  - id: release
    label: |-
      发布 103 条视频记录
      内含 1,549 个 QA
      唯一 UID · A–D · time_reference
      无推荐 train/dev/test 切分
      仅用于评测
    type: database
    size: xl
    position:
      x: 120
      'y': 360
  - id: non_native_input
    label: |-
      非原生长视频路线
      均匀固定帧采样
      例如 32 或 96 帧
      适配各模型输入上限
    type: process
    size: xl
    position:
      x: 288
      'y': 584
  - id: native_input
    label: |-
      原生长视频路线
      按每秒 1 帧处理
      仅在超过模型上限时继续下采样
      并非输入原始完整帧率
    type: process
    size: xl
    position:
      x: 624
      'y': 808
  - id: prompt
    label: |-
      使用论文选择题提示
      question 已包含 (A)–(D)
      直接返回选项字母
      不给出解释
    type: document
    size: xl
    position:
      x: 960
      'y': 696
  - id: paper_parser
    label: |-
      执行论文响应解析
      先正则匹配 · 失败后由 LLM 抽取
      v3 未指定 LLM 或其提示词
      未报告生成配置
    type: process
    size: xl
    position:
      x: 1296
      'y': 696
  - id: released_scorer
    label: |-
      运行公开精确匹配评分器
      输入 JSON 映射 UID 到答案字符串
      直接与真值 A–D 比较
      polish_answer 存在但未接入
    type: process
    size: xl
    position:
      x: 1632
      'y': 696
  - id: metrics
    label: |-
      计算总体与六项能力分数
      总体分母为已提交的已知 UID
      多标签题进入每个对应分母
      完整提交时分母才为 1,549
    type: terminal
    size: xl
    position:
      x: 1968
      'y': 696
  - id: leaderboard
    label: |-
      发布 Overall · ER · EU · KIR
      发布 TG · Rea · Sum
      result.json 保存 0–1 小数
      排行榜显示百分比
    type: terminal
    size: xl
    position:
      x: 2304
      'y': 696
  - id: release_drift
    label: |-
      版本与发布数据漂移
      v1/v2/v3：8/15/26 个模型
      论文：117 小时 · 均值 4,101 秒
      JSONL：115.532 小时
      JSONL 均值：4,038 秒
      16 条低于 720p · 4 条超两小时
    type: document
    size: xl
    position:
      x: 120
      'y': 1000
  - id: artifact_boundary
    label: |-
      制品与排行榜边界
      QA、元数据与脚本公开
      整体部分公开 · 声明 CC BY-NC-SA
      原视频仍在外部 YouTube
      HF train=7 是七张文档图片
      静态榜单可用 · 提交 Space 故障
    type: document
    size: xl
    position:
      x: 960
      'y': 1000
