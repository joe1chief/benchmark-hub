meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LVBench 构建流程
  description: 对齐论文的长视频基准构建流程，从 500 个候选视频出发，经五项筛选、两阶段标注、 纯文本泄漏过滤和精确选择题评测完成。
  legend: 数量与流程采用论文发布版本：103 个视频、117 小时、1,549 道问题，覆盖六类视频和六项长视频理解能力。
nodes:
  - id: source
    label: |-
      收集 500 个 YouTube 候选视频
      通过搜索与推荐发现内容
      覆盖六类长视频
      从体育纪录片到剧集动画
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: long_rich
    label: |-
      要求视频长且内容丰富
      时长至少 30 分钟
      包含动态视觉内容与多个事件
      保留完整时间线上的事件转变
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: screen
    label: |-
      应用五项视频筛选规则
      主角清晰 · 结构连贯
      每 5 分钟至少一个重要事件
      720p 稳定画面 · 关键信息依赖视觉
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: corpus
    label: |-
      保留 103 个视频 · 共 117 小时
      平均时长 4,101 秒
      覆盖六类视频
      完整视频作为评测上下文
    type: database
    size: xl
    position:
      x: 860
      'y': 40
  - id: annotate_events
    label: |-
      第一阶段 · 完整观看每个视频
      标记重要事件与场景
      记录实体与时间关系
      记录跨事件因果关系
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: write_questions
    label: |-
      第二阶段 · 编写分布式问题
      平均每小时视频 24 道问题
      覆盖完整视频时间线
      要求指代具体且答案唯一
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: capabilities
    label: |-
      覆盖六项长视频能力
      时间定位 · 摘要 · 推理
      实体识别 · 事件理解
      关键信息检索
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: choices
    label: |-
      第三阶段 · 编写四个选项
      一个正确项与三个可信干扰项
      统一选项长度与格式
      限制过多时间定位类问题
    type: user
    size: xl
    position:
      x: 1700
      'y': 380
  - id: clue
    label: |-
      标注最小证据片段
      记录精确起止时间戳
      片段足以回答对应问题
      评测时仍保留完整视频上下文
    type: document
    size: xl
    position:
      x: 1420
      'y': 380
  - id: leakage
    label: |-
      过滤纯文本可回答题目
      让 GLM-4 与 GPT-4 不看视频作答
      两者答案均命中真值时删除
      降低语言知识泄漏
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: release
    label: |-
      发布 LVBench · 1,549 道问题
      103 个视频 · 共 117 小时
      六类视频 · 六项理解能力
      论文报告人类准确率 94.4%
    type: database
    size: xl
    position:
      x: 860
      'y': 380
  - id: evaluate
    label: |-
      评测长视频模型
      原生长视频模型接收完整视频
      其他模型固定采样如 32 或 96 帧
      解码四个答案选项之一
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: report
    label: |-
      汇报精确选择题准确率
      1,549 道问题总体得分
      按六项能力拆分
      按六类视频拆分
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: source
    to: long_rich
    type: primary
  - from: long_rich
    to: screen
    type: primary
  - from: screen
    to: corpus
    type: primary
  - from: corpus
    to: annotate_events
    type: primary
  - from: annotate_events
    to: write_questions
    type: primary
  - from: write_questions
    to: capabilities
    type: primary
  - from: capabilities
    to: choices
    type: primary
  - from: choices
    to: clue
    type: primary
  - from: clue
    to: leakage
    type: primary
  - from: leakage
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
