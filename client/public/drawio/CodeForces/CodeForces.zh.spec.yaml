meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Codeforces 评测流程
  description: 基于官方证据展示如何把 Codeforces 平台作为竞赛编程评测题源。Codeforces 不是单一固定 benchmark；每份模型报告都必须披露自己的 比赛时间窗、题目子集、提示、尝试预算、提交路径与聚合规则。
  legend: 实线表示平台支持的流程；末端两条分支是报告自行定义的替代聚合方式，并非 Codeforces 的统一指标。
nodes:
  - id: platform
    label: |-
      Codeforces 平台
      公开比赛与题库
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: metadata
    label: |-
      官方题目元数据
      题面 / 比赛 / 难度 / 标签
      时间与内存限制
    type: document
    size: xl
    position:
      x: 320
      'y': 190
  - id: identity
    label: 无固定基准
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: selection
    label: |-
      报告自行定义题目选择
      比赛时间窗 / 组别 / 题目
      污染与纳入规则
    type: process
    size: xl
    position:
      x: 880
      'y': 190
  - id: protocol
    label: |-
      固定评测协议
      提示 / 语言 / 尝试次数 / 工具
      在线提交或离线评测器
    type: process
    size: xl
    position:
      x: 1160
      'y': 190
  - id: model
    label: |-
      模型生成完整程序
      遵守已披露的尝试预算
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: judge
    label: |-
      使用声明的评测器
      在线时采用 Codeforces 官方测试
      或完整说明的离线框架
    type: process
    size: xl
    position:
      x: 1720
      'y': 190
  - id: verdict
    label: |-
      单次提交结果
      通过 / 部分得分 / 编译 / 运行错误
      答案错误 / 超时 / 超内存
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: fixed_metric
    label: |-
      固定题集聚合（若定义）
      Accuracy 或 Pass@k
    type: document
    size: xl
    position:
      x: 2280
      'y': 70
  - id: contest_metric
    label: |-
      比赛聚合（若定义）
      排名 / 罚时 / Rating
    type: document
    size: xl
    position:
      x: 2280
      'y': 310
  - id: report
    label: |-
      完整披露协议后报告结果
      仅比较设置一致的运行
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
edges:
  - from: platform
    to: metadata
    type: primary
  - from: metadata
    to: identity
    type: primary
  - from: identity
    to: selection
    type: primary
  - from: selection
    to: protocol
    type: primary
  - from: protocol
    to: model
    type: primary
  - from: model
    to: judge
    type: primary
  - from: judge
    to: verdict
    type: primary
  - from: verdict
    to: fixed_metric
    type: primary
  - from: verdict
    to: contest_metric
    type: primary
  - from: fixed_metric
    to: report
    type: primary
  - from: contest_metric
    to: report
    type: primary
modules: []
