meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Evidence-Bounded Codeforces Evaluation Process
  description: >-
    Official-source-bounded workflow for treating Codeforces as a configurable evaluation platform rather than inventing
    one canonical benchmark, split, prompt, judge, or metric.
  legend: >-
    Solid arrows show required protocol decisions; online and offline judging and the two aggregation families remain
    explicit alternatives.
nodes:
  - id: evidence
    label: |-
      Evidence Boundary
      No Standalone Paper • No Fixed Dataset
      Official API Docs + Blog 20762
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: platform
    label: |-
      Codeforces Platform
      Public Contests + Problemset
      Continuously Updated
    type: database
    size: xl
    position:
      x: 320
      'y': 240
  - id: objects
    label: |-
      Official API Objects
      Problem • Contest • Submission
      RanklistRow + RatingChange
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: identity
    label: |-
      Not One Fixed Benchmark
      No Canonical Item Count, Split
      Prompt, Attempts, or Score
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: selection
    label: |-
      Freeze Report Selection
      Contest Window • Problem Subset
      Contamination + Eligibility Rules
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: protocol
    label: |-
      Freeze Model Protocol
      Prompt • Language • Attempts
      Tools • Sampling • Time Budget
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: model
    label: |-
      Generate Complete Program
      Preserve Attempt Order
      Record Every Submission Candidate
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: judge_route
    label: Judge Route?
    type: decision
    size: xl
    position:
      x: 2000
      'y': 240
  - id: online
    label: |-
      Official Online Submissions
      Codeforces Hidden Tests + Judges
      Platform Limits and Verdicts
    type: process
    size: xl
    position:
      x: 2280
      'y': 80
  - id: offline
    label: |-
      Report-Owned Offline Harness
      Report-Owned Tests + Sandbox
      Fully Specify; Not Canonical
    type: process
    size: xl
    position:
      x: 2280
      'y': 400
  - id: outcome
    label: |-
      Per-Submission Outcome
      Verdict • testset • passedTestCount
      Time + Memory Consumption
    type: document
    size: xl
    position:
      x: 2560
      'y': 240
  - id: aggregation_route
    label: Aggregation?
    type: decision
    size: xl
    position:
      x: 2840
      'y': 240
  - id: fixed_metric
    label: |-
      Fixed-Set Metrics
      Accuracy or Pass@k
      Only If Defined by the Report
    type: document
    size: xl
    position:
      x: 3120
      'y': 80
  - id: contest_metric
    label: |-
      Contest Metrics
      Points • Penalty • Rank • Rating
      Only If Defined by the Report
    type: document
    size: xl
    position:
      x: 3120
      'y': 400
  - id: report
    label: |-
      Fully Disclosed Evaluation Report
      Selection + Protocol + Judge + Metric
      Compare Only the Same Frozen Protocol
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 240
