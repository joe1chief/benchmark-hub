meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Codeforces Evaluation Process
  description: >-
    Evidence-bounded workflow for using the Codeforces platform as a competitive-programming evaluation source.
    Codeforces is not a single fixed benchmark: each model report must disclose its own contest window, problem subset,
    prompt, attempt budget, submission route, and aggregation rule.
  legend: >-
    Solid arrows show the platform-supported path; the two final branches are alternative report-defined aggregations,
    not universal Codeforces metrics.
nodes:
  - id: platform
    label: |-
      Codeforces Platform
      Public Contests and Problemset
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: metadata
    label: |-
      Official Problem Metadata
      Statement / Contest / Difficulty / Tags
      Time and Memory Limits
    type: document
    size: xl
    position:
      x: 320
      'y': 190
  - id: identity
    label: No Fixed Benchmark
    type: decision
    size: xl
    position:
      x: 600
      'y': 190
  - id: selection
    label: |-
      Report-Defined Selection
      Contest Window / Divisions / Problems
      Contamination and Eligibility Rules
    type: process
    size: xl
    position:
      x: 880
      'y': 190
  - id: protocol
    label: |-
      Freeze Evaluation Protocol
      Prompt / Language / Attempts / Tools
      Online Submission or Offline Judge
    type: process
    size: xl
    position:
      x: 1160
      'y': 190
  - id: model
    label: |-
      Model Produces Complete Program
      under the Disclosed Attempt Budget
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: judge
    label: |-
      Apply the Declared Judge
      Official Codeforces Tests when Submitted Online
      or a Fully Specified Offline Harness
    type: process
    size: xl
    position:
      x: 1720
      'y': 190
  - id: verdict
    label: |-
      Per-Submission Outcome
      OK / Partial / Compile / Runtime
      Wrong Answer / Time / Memory Limit
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: fixed_metric
    label: |-
      Fixed-Set Aggregation, If Defined
      Accuracy or Pass@k
    type: document
    size: xl
    position:
      x: 2280
      'y': 70
  - id: contest_metric
    label: |-
      Contest Aggregation, If Defined
      Rank / Penalty / Rating
    type: document
    size: xl
    position:
      x: 2280
      'y': 310
  - id: report
    label: |-
      Report with Full Protocol Disclosure
      Compare Only Runs Using the Same Setup
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 190
edges:
  - from: platform
    to: metadata
    type: primary
  - from: metadata
    to: identity
    type: primary
  - from: identity
    to: selection
    type: primary
  - from: selection
    to: protocol
    type: primary
  - from: protocol
    to: model
    type: primary
  - from: model
    to: judge
    type: primary
  - from: judge
    to: verdict
    type: primary
  - from: verdict
    to: fixed_metric
    type: primary
  - from: verdict
    to: contest_metric
    type: primary
  - from: fixed_metric
    to: report
    type: primary
  - from: contest_metric
    to: report
    type: primary
modules: []
