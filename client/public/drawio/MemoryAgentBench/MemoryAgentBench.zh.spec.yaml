meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MemoryAgentBench 构建与评测流程
  description: 对齐论文展示既有长文本数据重构与 EventQA、FactConsolidation 新建过程，再以统一增量多轮协议覆盖 四类记忆能力和三类记忆智能体。
  legend: 论文版共含 130 个序列、2,071 个问题；EventQA 贡献 500 题，两种 FactConsolidation 各贡献 100 题。
nodes:
  - id: competencies
    label: |-
      定义四类记忆能力
      准确检索
      测试时学习 · 长程理解
      选择性遗忘
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: retrieval
    label: |-
      整理准确检索任务
      重构单跳与多跳文档问答
      将 LongMemEval 合并为 5 段历史
      加入新建 EventQA
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: eventqa
    label: |-
      自动构建 EventQA
      五本小说 · NER 取前十名角色
      GPT-4o 每书抽取 101 个事件
      六选一续接 · 共 500 题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: ttl
    label: |-
      重构测试时学习任务
      五个意图与问题类型分类集
      将带标签样本打乱拼成长上下文
      加入 Redial 电影推荐
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: lru
    label: |-
      整理长程理解任务
      采用 InfiniteBench 英文摘要任务
      使用 100 个长序列及摘要
      加入 DetectiveQA：10 本书 · 71 题
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: forgetting
    label: |-
      构建 FactConsolidation
      从 MQUAKE 反事实编辑对出发
      将新的矛盾事实排在旧事实之后
      单跳与多跳各 100 题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: lengths
    label: |-
      扩展冲突上下文长度
      拼接带编号的事实对
      6K · 32K · 64K · 262K 词元
      要求依据最新记忆状态
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: standardize
    label: |-
      统一所有数据集格式
      有序片段 c1 至 cn
      问题 q1 至 qm
      答案 a1 至 am
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: interaction
    label: |-
      转换为增量式对话
      为每段包装记忆指令
      上下文只注入一次
      对同一记忆多次提问
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: chunking
    label: |-
      按任务选择分块大小
      合成 AR 与 SF 使用 512 词元
      连续文本、分类和推荐用 4,096
      高成本智能体统一用 4,096
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: agents
    label: |-
      实例化三类记忆智能体
      长上下文缓冲区
      简单、向量与结构增强 RAG
      智能体式外部记忆系统
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: run
    label: |-
      执行记忆交互协议
      按顺序输入各片段
      增量更新智能体记忆
      全部输入后再提出问题
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics
    label: |-
      按任务计算指标
      准确率与子串精确匹配
      推荐使用 Recall@5
      GPT-4o 裁判与摘要 F1
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告记忆智能体表现
      四类能力分数
      上下文长度影响
      构建、查询、成本与延迟
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: competencies
    to: retrieval
    type: primary
  - from: retrieval
    to: eventqa
    type: primary
  - from: eventqa
    to: ttl
    type: primary
  - from: ttl
    to: lru
    type: primary
  - from: lru
    to: forgetting
    type: primary
  - from: forgetting
    to: lengths
    type: primary
  - from: lengths
    to: standardize
    type: primary
  - from: standardize
    to: interaction
    type: primary
  - from: interaction
    to: chunking
    type: primary
  - from: chunking
    to: agents
    type: primary
  - from: agents
    to: run
    type: primary
  - from: run
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
