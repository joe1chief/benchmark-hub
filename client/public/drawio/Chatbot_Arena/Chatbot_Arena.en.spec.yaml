meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chatbot Arena Build Process
  description: >-
    Paper-aligned Chatbot Arena flow: consenting users submit live prompts to anonymous model pairs, cast pairwise
    votes, filters and anomalous-user checks form valid battles, and reweighted Bradley–Terry estimation with confidence
    intervals produces the public ranking.
  legend: Solid arrows show live battle collection and ranking; dashed arrows show diversity and expert-quality validation.
nodes:
  - id: user
    label: |-
      Live Crowd Users
      Accept Terms and Data-release Consent
      Submit Fresh, Open-ended Prompts
    type: user
    size: xl
    position:
      x: 40
      'y': 220
  - id: pair
    label: |-
      Sample an Anonymous Model Pair
      Hide Identities until after Voting
      Favor Similar-strength Pairs to Reduce Uncertainty
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: battle
    label: |-
      Side-by-side Multi-turn Battle
      Send the Same User Messages to Both Models
      Continue until the User Can Choose
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: vote
    label: |-
      Record Pairwise Preference
      Model A • Model B • Tie • Both Are Bad
      Store Two Conversations plus the Vote
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: content_filter
    label: |-
      Content and Identity Filtering
      Remove Model/company-name Leakage
      Flag Unsafe Requests with Moderation
    type: decision
    size: xl
    position:
      x: 1240
      'y': 220
  - id: anomaly
    label: |-
      Detect Anomalous Users
      Test Repetitive, Meaningless, or Strategic Patterns
      Exclude Votes that Threaten Ranking Integrity
    type: decision
    size: xl
    position:
      x: 1540
      'y': 220
  - id: valid
    label: |-
      Valid Human-preference Battles
      More Than 240K Votes in the Paper Snapshot
      About 1–2K Valid Votes per Day
    type: database
    size: xl
    position:
      x: 1840
      'y': 220
  - id: diversity
    label: |-
      Validate Prompt Diversity
      Embed and Cluster Prompts into 600 Topics
      Long-tail Coverage across Coding, Math, Poetry, Medicine
    type: process
    size: xl
    position:
      x: 2140
      'y': 40
  - id: experts
    label: |-
      Validate Vote Quality on 160 Battles
      Blind Graduate-student Fact-checking
      Crowd–expert Agreement: 72%–83%
    type: user
    size: xl
    position:
      x: 2140
      'y': 400
  - id: win_matrix
    label: |-
      Estimate Pairwise Win Matrix
      Account for Non-uniform Pair Sampling
      Adaptive Sampling Improves Precision per Vote
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: bt
    label: |-
      Fit Reweighted Bradley–Terry Scores
      Maximum-likelihood Estimation using 1 / P(pair)
      Use Sandwich Covariance for Misspecification
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: intervals
    label: |-
      Compute Score Confidence Intervals
      Report Corrected and Uncorrected Intervals
      Convert Scores into an Approximate Ranking
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: leaderboard
    label: |-
      Publish Chatbot Arena Leaderboard
      Human-preference Rank + Win Rates
      Continuously Refresh with Live Battles
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: user
    to: pair
    type: primary
  - from: pair
    to: battle
    type: primary
  - from: battle
    to: vote
    type: primary
  - from: vote
    to: content_filter
    type: primary
  - from: content_filter
    to: anomaly
    type: primary
  - from: anomaly
    to: valid
    type: primary
  - from: valid
    to: diversity
    type: data
  - from: valid
    to: experts
    type: data
  - from: valid
    to: win_matrix
    type: primary
  - from: diversity
    to: win_matrix
    type: data
  - from: experts
    to: win_matrix
    type: data
  - from: win_matrix
    to: bt
    type: primary
  - from: bt
    to: intervals
    type: primary
  - from: intervals
    to: leaderboard
    type: primary
modules: []
