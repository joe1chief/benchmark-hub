meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chatbot Arena Build Process
  description: >-
    Paper-snapshot Chatbot Arena flow: consenting users conduct anonymous multi-turn battles, identity-keyword filtering
    forms the preference snapshot, and reweighted Bradley-Terry estimation produces approximate ranks. Safety flagging,
    diversity, vote-quality, and anomalous-IP analyses remain independent of ranking inputs.
  legend: Solid arrows show collection and ranking; dashed arrows show paper validation analyses that do not feed the rank.
nodes:
  - id: user
    label: |-
      Live Crowd Users
      Accept Terms for Public Data Release
      Submit Fresh, Open-ended Prompts
    type: user
    size: xl
    position:
      x: 40
      'y': 220
  - id: pair
    label: |-
      Sample an Anonymous Model Pair
      Hide Identities until after Voting
      Prefer Similar-strength Pairs
      Non-uniform Sampling Reduces Uncertainty
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: battle
    label: |-
      Side-by-side Multi-turn Battle
      Send the Same User Messages to Both Models
      Continue until the User Can Decide
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: vote
    label: |-
      Record Pairwise Preference
      Model A • Model B • Tie • Both Are Bad
      Store Both Conversations + Vote
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: content_filter
    label: |-
      Identity Keyword Filter
      Remove Conversations Naming Models
      or Companies to Preserve Anonymity
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: safety_flag
    label: |-
      OpenAI Moderation Safety Flag
      Flag Unsafe Requests: 3%
      Not a Ranking-input Filter
    type: document
    size: xl
    position:
      x: 1240
      'y': 0
  - id: snapshot
    label: |-
      Paper Snapshot (2024-01-21)
      ~240K Votes • >90K Users • >50 Models
      >100 Languages • 77% English
      Recent Rate: 1–2K Valid Votes per Day
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: topic_model
    label: |-
      Topic-modeling Method
      text-embedding-3-small: 1,536 Dimensions
      UMAP -> 5; HDBSCAN Minimum Cluster 32
    type: process
    size: xl
    position:
      x: 1540
      'y': 0
  - id: diversity
    label: |-
      600 Long-tail Topic Clusters
      Sample 10 Prompts per Cluster
      GPT-4-Turbo Generates Topic Labels
    type: document
    size: xl
    position:
      x: 1840
      'y': 0
  - id: experts
    label: |-
      Expert Relabeling: 160 Battles
      Blind Graduate-student Fact-checking
      Crowd–expert Agreement: 72.8%–83.1%
    type: user
    size: xl
    position:
      x: 1540
      'y': 440
  - id: anomaly
    label: |-
      Independent Anomalous-IP Analysis
      Sequential p-values + Fisher Combination
      5 Random Checks among Votes 1–100
      Validate 25 Anomalous + 25 Normal Users
      Not a Ranking-input Filter
    type: process
    size: xl
    position:
      x: 1840
      'y': 440
  - id: win_matrix
    label: |-
      Estimate Pairwise Win Matrix
      Inverse-weight for Non-uniform Pair Sampling
      Target a Uniform Distribution over Pairs
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: bt
    label: |-
      Reweighted Bradley–Terry MLE
      Weight Each Battle by 1 / P(pair)
      Estimate Population BT Coefficients
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: intervals
    label: |-
      Sandwich Robust Confidence Intervals
      Preferred over Bootstrap at Large Samples
      Multiplicity-corrected Approximate Rank
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: leaderboard
    label: |-
      Publish the Paper-era Leaderboard
      BT Score • Win Rate • Confidence Interval
      Approximate Ranks with Uncertainty
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
edges:
  - from: user
    to: pair
    type: primary
  - from: pair
    to: battle
    type: primary
  - from: battle
    to: vote
    type: primary
  - from: vote
    to: content_filter
    type: primary
  - from: vote
    to: safety_flag
    type: data
  - from: content_filter
    to: snapshot
    type: primary
  - from: snapshot
    to: win_matrix
    type: primary
  - from: snapshot
    to: topic_model
    type: data
  - from: topic_model
    to: diversity
    type: data
  - from: snapshot
    to: experts
    type: data
  - from: snapshot
    to: anomaly
    type: data
    waypoints:
      - x: 1680
        'y': 360
      - x: 1740
        'y': 490
  - from: win_matrix
    to: bt
    type: primary
  - from: bt
    to: intervals
    type: primary
  - from: intervals
    to: leaderboard
    type: primary
modules: []
