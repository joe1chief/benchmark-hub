meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chatbot Arena 构建流程
  description: 对齐论文的 Chatbot Arena 流程：获得授权的用户向匿名模型对提交实时问题并进行成对投票，内容过滤和异常用户检测形成有效对战， 再通过重加权 Bradley–Terry 估计与置信区间生成公开排名。
  legend: 实线箭头表示实时对战收集与排名；虚线箭头表示多样性和专家质量验证。
nodes:
  - id: user
    label: |-
      实时众包用户
      接受使用条款与数据发布授权
      提交新鲜的开放式问题
    type: user
    size: xl
    position:
      x: 40
      'y': 220
  - id: pair
    label: |-
      抽取匿名模型对
      投票前隐藏模型身份
      优先比较实力接近的模型以降低不确定性
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: battle
    label: |-
      并排多轮对战
      将相同用户消息发给两个模型
      用户无法判断时可继续对话
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: vote
    label: |-
      记录成对偏好
      模型A • 模型B • 平局 • 两者都差
      保存两段对话及一张选票
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: content_filter
    label: |-
      内容与身份过滤
      删除模型名或公司名泄漏
      用内容审核标记不安全请求
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: anomaly
    label: |-
      检测异常用户
      检验重复、无意义或策略性行为
      排除威胁排名可信度的投票
    type: process
    size: xl
    position:
      x: 1540
      'y': 220
  - id: valid
    label: |-
      有效人工偏好对战
      论文快照累计超过24万票
      近期每天约1,000–2,000张有效票
    type: database
    size: xl
    position:
      x: 1840
      'y': 220
  - id: diversity
    label: |-
      验证提示多样性
      嵌入并聚类为600个主题
      覆盖编程、数学、诗歌、医疗等长尾主题
    type: process
    size: xl
    position:
      x: 2140
      'y': 40
  - id: experts
    label: |-
      在160场对战上验证投票质量
      研究生盲评并检索核实事实
      众包与专家一致率为72%–83%
    type: user
    size: xl
    position:
      x: 2140
      'y': 400
  - id: win_matrix
    label: |-
      估计成对胜率矩阵
      校正非均匀模型对采样
      自适应采样提高单位投票精度
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: bt
    label: |-
      拟合重加权Bradley–Terry分数
      最大似然中使用1 / P(模型对)权重
      以三明治协方差应对模型失配
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: intervals
    label: |-
      计算分数置信区间
      报告经多重校正和未经校正的区间
      将分数转换为近似排名
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: leaderboard
    label: |-
      发布Chatbot Arena排行榜
      人工偏好排名 + 胜率
      随实时对战持续刷新
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: user
    to: pair
    type: primary
  - from: pair
    to: battle
    type: primary
  - from: battle
    to: vote
    type: primary
  - from: vote
    to: content_filter
    type: primary
  - from: content_filter
    to: anomaly
    type: primary
  - from: anomaly
    to: valid
    type: primary
  - from: valid
    to: diversity
    type: data
  - from: valid
    to: experts
    type: data
  - from: valid
    to: win_matrix
    type: primary
  - from: diversity
    to: win_matrix
    type: data
  - from: experts
    to: win_matrix
    type: data
  - from: win_matrix
    to: bt
    type: primary
  - from: bt
    to: intervals
    type: primary
  - from: intervals
    to: leaderboard
    type: primary
modules: []
