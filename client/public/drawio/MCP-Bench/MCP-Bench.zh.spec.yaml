meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: vertical
  routing: orthogonal
  title: MCP-Bench 构建、执行与计分流程
  description: 依据 arXiv v1 与固定官方代码/任务提交，分开呈现 benchmark 构建、MCP 环境与任务生成、agent 执行评估、计分聚合。
  legend: 四个浅色泳道分开构建、执行、评估与聚合；分支和回边明确标注质量门、20 轮停止条件及 5 次乱序 Judge 协议。
