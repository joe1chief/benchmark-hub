meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCP-Bench Build Process
  description: >-
    Reconstructs MCP-Bench's o4-mini dependency-grounded task synthesis, quality filtering, instruction fuzzing,
    distractor setup, multi-round agent execution, and hybrid rule-plus-judge evaluation.
  legend: >-
    The 104 tasks comprise 56 single-server, 30 two-server, and 18 three-server tasks. Each judged instance uses five
    independent rubric-order shuffles before score averaging.
nodes:
  - id: servers
    label: |-
      Collect Live MCP Servers
      28 Servers · 250 Structured Tools
      Eleven Functional Domains
      Production-grade Behaviors
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: schemas
    label: |-
      Catalog Tool Semantics
      Input and Output Signatures
      Required and Optional Parameters
      Nested Schemas and Constraints
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: dependencies
    label: |-
      Discover Dependency Chains
      Inherent and Scenario-based Links
      Intra-server and Cross-server Flows
      Linear · Parallel · Hybrid Patterns
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: synthesize
    label: |-
      Synthesize Tasks with o4-mini
      Ground Goals in Dependency Chains
      56 One-server · 30 Two-server
      18 Three-server · 104 Total
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: filter
    label: |-
      Apply Automatic Quality Gates
      Solvability Must Reach 9.0 / 10
      Practical Utility Must Reach 5.0 / 10
      Discard Tasks below Either Threshold
    type: decision
    size: xl
    position:
      x: 1140
      'y': 40
  - id: inspect
    label: |-
      Inspect Tasks Manually
      Check Realism and Executability
      Review Dependency-chain Reasoning
      Retain High-quality Workflows
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: fuzz
    label: |-
      Fuzz the Task Description
      State High-level Conversational Goals
      Omit Tool Names and Execution Steps
      Preserve Required Numbers and Parameters
    type: document
    size: xl
    position:
      x: 1420
      'y': 420
  - id: distract
    label: |-
      Add Retrieval Noise per Task
      Attach 10 Distractor Servers
      Introduce 100+ Extra Tools
      Force Selection from Contextual Cues
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: execute
    label: |-
      Run a Multi-round MCP Agent
      Plan · Invoke · Observe · Compress
      Update State for Up to 20 Rounds
      Produce Answer from the Full Trace
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: rules
    label: |-
      Compute Rule-based Checks
      Valid Tool Name
      Schema Compliance · Runtime Success
      Dependency-order Compliance
    type: decision
    size: xl
    position:
      x: 580
      'y': 420
  - id: judge
    label: |-
      Apply the o4-mini Rubric Judge
      Task Completion · Tool Usage
      Planning Effectiveness
      Score Each Subdimension from 1 to 10
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Stabilize and Report Scores
      Shuffle Rubric Order Five Times
      Normalize and Average to [0, 1]
      Report Rule Rates and Judge Axes
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: servers
    to: schemas
    type: primary
  - from: schemas
    to: dependencies
    type: primary
  - from: dependencies
    to: synthesize
    type: primary
  - from: synthesize
    to: filter
    type: primary
  - from: filter
    to: inspect
    type: primary
  - from: inspect
    to: fuzz
    type: primary
  - from: fuzz
    to: distract
    type: primary
  - from: distract
    to: execute
    type: primary
  - from: execute
    to: rules
    type: primary
  - from: rules
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
