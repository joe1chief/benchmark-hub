meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: vertical
  routing: orthogonal
  title: MCP-Bench Construction, Execution, and Scoring
  description: >-
    Based on arXiv v1 and a pinned official code/task commit; separates benchmark construction, MCP environment and task
    synthesis, agent execution/evaluation, and score aggregation.
  legend: >-
    Four light lanes separate construction, execution, evaluation, and aggregation. Branch and loop labels state the
    quality decision, the 20-round stop condition, and the five-run shuffled-judge protocol.
