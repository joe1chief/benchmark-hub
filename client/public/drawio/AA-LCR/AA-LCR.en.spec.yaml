    size: xl
    position:
      x: 40
      'y': 100
  - id: sets
    label: |-
      Assemble 30 Document Sets
      234 Documents • 2,979,757 Tokens Total
      Average Completed Prompt: 99,325 Tokens
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: author
    label: |-
      Human Question Authoring
      Multiple Team Members + Contracted Undergraduates
      Practical Multi-Document General / Math Reasoning
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: difficulty
    label: |-
      Check Difficulty Without Frontier Models
      GPT-4o-mini • Llama 3.1 70B • Gemini 1.5 Flash
      Answer Must Require Reasoning, Not Direct Retrieval
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: validate
    label: |-
