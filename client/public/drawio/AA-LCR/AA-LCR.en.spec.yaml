meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-LCR Build and Evaluation Process
  description: >-
    Official-method-aligned construction and evaluation of AA-LCR, covering real multi-document sets, human question
    writing, non-frontier-model difficulty checks, human validation, list-ordered long-context prompting, and Qwen-based
    equality grading.
  legend: >-
    No standalone AA-LCR paper is available; the flow follows the official Artificial Analysis methodology and public
    dataset card. The top row builds the benchmark and the bottom row evaluates a model response.
nodes:
  - id: documents
    label: |-
      Curate Real-World Documents
      7 public-source document types
      Company • industry • government
      Academic • legal • marketing • survey
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: sets
    label: |-
      Assemble 30 Document Sets
      234 documents • 2,979,757 tokens
      Mean completed prompt: 99,325 tokens
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: author
    label: |-
      Human Question Authoring
      Team + contracted undergraduates
      General / mathematical reasoning
      Across multiple documents
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: difficulty
    label: |-
      Non-Frontier Difficulty Check
      GPT-4o-mini • Llama 3.1 70B
      Gemini 1.5 Flash
      Must require reasoning, not retrieval
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: validate
    label: |-
      Human Answer Validation
      Independent solve on same documents
      Revise / discard failures
      ≥1 human solves every retained item
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Release AA-LCR
      100 questions across 30 sets
      Answers + ordered extracted documents
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Construct Long-Context Prompt
      Read data_source_filenames
      In its declared list order
      Concatenate inside BEGIN / END
      Append question after documents
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: response
    label: |-
      Target Model Response
      Reason over the full document set
      Produce candidate answer
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: judge
    label: |-
      Qwen3 Equality Checker
      235B-A22B-2507 • non-reasoning
      Question + official + candidate answer
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: verdict
    label: |-
      Binary Verdict
      CORRECT or INCORRECT
      Semantic equality to reference
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      AA-LCR Result
      Accuracy over 100 questions
      Long-context multi-document performance
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
