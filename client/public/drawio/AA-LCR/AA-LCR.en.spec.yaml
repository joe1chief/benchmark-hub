meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-LCR Build and Evaluation Process
  description: >-
    Official-method-aligned construction and evaluation of AA-LCR, covering real multi-document sets, human question
    writing, non-frontier-model difficulty checks, human validation, ordered long-context prompting, and Qwen-based
    equality grading.
  legend: >-
    No standalone AA-LCR paper is available; the flow follows the official Artificial Analysis methodology and public
    dataset card. The top row builds the benchmark and the bottom row evaluates a model response.
nodes:
