    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Construct Long-Context Prompt
      Documents in Filename Order Between BEGIN / END Markers
      Append the Question After All Documents
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: response
    label: |-
      Target Model Response
      Read and Reason Across the Full Document Set
      Produce the Candidate Answer
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: judge
    label: |-
      LLM Equality Checker
      Qwen3-235B-A22B-2507 • Non-Reasoning Mode
      Question + Official Answer + Candidate Answer
