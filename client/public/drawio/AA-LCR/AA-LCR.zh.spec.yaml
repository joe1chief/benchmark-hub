meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AA-LCR 构建与评测流程
  description: 对齐官方方法的 AA-LCR 构建与评测流程，涵盖真实多文档集、人工出题、非前沿模型难度检查、人工验证、 有序长上下文提示和基于 Qwen 的答案等价性判定。
  legend: AA-LCR 没有独立论文；本图依据 Artificial Analysis 官方方法说明与公开数据卡。上排构建基准，下排评测模型回答。
nodes:
  - id: documents
    label: |-
      整理真实世界文档
      公开材料中的 7 类文档
      公司 • 行业 • 政府 • 学术
      法律 • 营销 • 调研
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: sets
    label: |-
      组装 30 个文档集
      共 234 篇文档、2,979,757 tokens
      完整提示平均 99,325 tokens
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: author
    label: |-
      人工编写问题
      团队成员 + 受聘本科生
      多文档通用 / 数学推理
      面向真实场景
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: difficulty
    label: |-
      非前沿模型难度面板
      GPT-4o-mini • Llama 3.1 70B
      Gemini 1.5 Flash
      仅保留这些模型答错的题目
      依靠推理，而非直接检索
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: validate
    label: |-
      人工验证答案
      首次作答通常为 40–60%
      展示标准答案后高度一致
      修订 / 丢弃；至少 1 人答对
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      发布 AA-LCR
      100 题 • CSV 答案
      有序 data_source_filenames
      提取文本 ZIP
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      精确长上下文提示
      按 data_source_filenames 顺序
      BEGIN DOCUMENT / END DOCUMENT
      BEGIN INPUT DOCUMENTS 外层
      cl100k_base 统计完整提示 tokens
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: response
    label: |-
      目标模型回答
      阅读完整文档集并跨文档推理
      输出候选答案
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: judge
    label: |-
      Qwen3-235B-A22B-2507
      非推理等价性检查器
      候选答案必须与
      官方答案一致
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: verdict
    label: |-
      二元判定
      输出 CORRECT 或 INCORRECT
      与官方答案一致
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      AA-LCR 准确率
      正确判定数 / 100
      长上下文多文档推理表现
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: documents
    to: sets
    type: primary
  - from: sets
    to: author
    type: primary
  - from: author
    to: difficulty
    type: primary
  - from: difficulty
    to: validate
    type: primary
  - from: validate
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: response
    type: primary
  - from: response
    to: judge
    type: primary
  - from: judge
    to: verdict
    type: primary
  - from: verdict
    to: report
    type: primary
modules: []
