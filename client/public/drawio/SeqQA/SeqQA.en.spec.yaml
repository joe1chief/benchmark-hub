meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SeqQA Build and Evaluation Process
  description: >-
    SeqQA is the sequence-manipulation category of LAB-Bench, containing 750 multiple-choice questions across 15
    subtasks involving DNA, RNA, proteins, PCR, restriction enzymes, open reading frames, cloning, and basic sequence
    properties. Most items are generated programmatically. Task-specific scripts and BioPython compute ideal answers,
    while distractors are deterministic near misses or incorrect transformations such as shifted fragment lengths,
    truncated open reading frames, nearby amino acids, or perturbed GC content. The official release separates public
    data from a protected test or canary portion. In the paper's baseline evaluation, models answer with zero-shot
    chain-of-thought and no tools, with an explicit decline option. Text completions are parsed into choices. Accuracy
    measures correct answers over all questions, precision measures correct answers over attempted questions, and
    coverage measures attempted questions over all questions. Results are reported by subtask over three runs and
    compared with human researchers.
  legend: >-
    Source: LAB-Bench arXiv:2407.10362 Sections 2-4 and Appendix SeqQA task descriptions; official
    Future-House/LAB-Bench repository. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
