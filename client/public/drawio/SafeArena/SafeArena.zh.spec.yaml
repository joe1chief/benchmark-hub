meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafeArena 构建与评测流程
  description: >-
    SafeArena在4个由WebArena扩展的网站上定义5类危害。作者人工编写150项有害任务，补充所需环境内容与参考对象，并为每项创建只做最小意图改动、测试相同能力的安全配对任务。GPT-4o-mini再提出100组有害-安全任务对，人工核验意图标签、创建网站内容并检查URL、HTML和参考内容。3位专家作者审查全部500项任务并共同解决歧义。评测时由功能性参考对象判断任务完成，GPT-4o与人工评审按ARIA从立即拒绝到成功完成划分4级，并报告安全与有害任务完成率、拒绝率及按能力归一化的安全分数。
  legend: >-
    来源：SafeArena arXiv:2503.04957 Sections 3.3-4.3 and Appendix D.3; official safearena.github.io
    project。实线箭头表示论文或官方资料明确支持的主流程。
