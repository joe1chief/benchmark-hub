meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafeArena Build and Evaluation Process
  description: >-
    SafeArena defines five harm categories across four WebArena-derived websites. Authors manually write 150 harmful
    tasks, add the required environment artifacts and reference objects, and pair each with a minimally changed safe
    task testing the same capability. GPT-4o-mini then proposes 100 additional harmful-safe pairs; humans verify intent
    labels, create site artifacts, and validate URLs, HTML, and reference content. Three expert authors review all 500
    tasks and resolve ambiguous cases jointly. During evaluation, functional reference objects score task completion,
    GPT-4o and human judges assign ARIA levels from immediate refusal through successful completion, and the paper
    reports safe and harmful task completion, refusal rate, and a capability-normalized safety score.
  legend: >-
    Source: SafeArena arXiv:2503.04957 Sections 3.3-4.3 and Appendix D.3; official safearena.github.io project. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
