meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PHYBench 构建、人工验证与评测流程
  description: 与论文 v2 和固定一手源一致地展示 757 题审稿人题库、独立人工筛选至 500 道符号物理题，以及分离的精确准确率与分级 EED 评测分支。
  legend: 实线追踪人工构建和指标计算；虚线隔离固定证据、LLM 审查辅助、固定数据快照与发布代码实现边界。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv 2504.16074v2 SHA256 35cbf568e673
      Git d9db3ec7246f · EED.py c3c689eb53ce
      HF d6d91c787b7a · 数据 912b17db6a4f
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      定义原创符号物理任务
      答案为单个公式或表达式
      覆盖高中至本科物理
      难度最高达到物理奥赛
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: contributors
    label: |-
      招募 178 名北大物理系学生
      由学生编写并维护题目
      人工创作而非自动生成
      记录贡献者与审查历史
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: formulation
    label: |-
      编制原创题目
      覆盖六个物理领域
      使用原创或大幅改编任务
      抵抗搜索与基准污染
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: constraints
    label: |-
      执行题目要求
      自包含且无歧义
      定义变量与假设
      要求唯一可核验的符号答案
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: question_bank
    label: |-
      提交至题库
      保存题目、答案与解法
      跟踪多轮审查反馈
      将不合格草稿退回修改
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: expert_review
    label: |-
      执行多轮专家审查
      检查物理正确性与可解性
      检查措辞与唯一解释
      修改或拒绝有缺陷的题目
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: llm_aids
    label: |-
      检查 o1 与 DeepSeek-R1 输出
      仅作为专家审查旁路输入
      暴露歧义或错误理解
      不提供题目或标准答案
    type: document
    size: xl
    position:
      x: 1700
      'y': 260
  - id: reviewer_library
    label: |-
      形成审稿人题库
      专家批准后共有 757 道题
      保留答案与完整解法
      将通过题目送入人工验证
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: human_review
    label: |-
      由 81 名学生独立验证
      其中 50 名为中国物理奥赛金牌得主
      每名学生领取 8 道题
      收集 559 份有效答卷
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: retain
    label: |-
      处理人工验证标记
      检查清晰度、正确性与唯一性
      修改或移除不可靠题目
      保留 500 / 757 题，即 66.1%
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: dataset
    label: |-
      定稿 PHYBench
      500 道原创纯文本题
      覆盖六个物理领域
      内部保留参考答案与解法
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: prompt
    label: |-
      运行统一零样本提示
      要求逐步推理
      要求最终输出方框 LaTeX 表达式
      使用 API 默认值或文档化本地设置
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: boxed
    label: |-
      提取最终方框答案
      定位最后一个方框表达式
      去除外层标记与格式噪声
      标记缺失或无法解析的输出
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: normalize
    label: |-
      规范化符号表达式
      使用 latex2sympy2_extended 解析
      执行 SymPy 化简与等价检查
      构造可比较的表达式对象
    type: process
    size: xl
    position:
      x: 20
      'y': 420
  - id: metric_gate
    label: |-
      选择指标分支
      精确符号等价
      或分级表达式相似度
    type: decision
    size: xl
    position:
      x: 20
      'y': 820
  - id: accuracy
    label: |-
      计算准确率
      等价表达式得 100 分
      不等价或无效输出得 0 分
      对整个评测集求平均
    type: process
    size: xl
    position:
      x: 260
      'y': 700
  - id: eed_tree
    label: |-
      转换为表达式树
      保留运算符与操作数
      比较预测与标准答案
      为 EED 构造有序树
    type: process
    size: xl
    position:
      x: 260
      'y': 960
  - id: eed_distance
    label: |-
      计算扩展树编辑距离
      使用扩展 Zhang-Shasha 操作
      编辑规模 x 的成本为 min(x, 0.6(x - 5) + 5)
      仅超过 5 个节点的边际成本按 60% 计费
    type: process
    size: xl
    position:
      x: 500
      'y': 960
  - id: eed_score
    label: |-
      将距离转换为 EED 分数
      r = 距离除以标准答案树大小
      r = 0 时为 100；0 < r < 0.6 时为 60 - 100r
      r 至少为 0.6 时为 0
    type: process
    size: xl
    position:
      x: 740
      'y': 960
  - id: report
    label: |-
      报告准确率与 EED
      保持二元与分级得分分离
      最佳模型仍落后于人类表现
      EED 的样本效率提升 204%
    type: terminal
    size: xl
    position:
      x: 980
      'y': 820
  - id: human_baseline
    label: |-
      估计人类基线
      81 名学生共提交 559 份有效答卷
      准确率 61.9 ± 2.1%
      EED 70.4 ± 1.8 · 自助采样 1 万次
    type: process
    size: xl
    position:
      x: 1220
      'y': 700
  - id: data_boundary
    label: |-
      固定数据发布边界
      HF 含 100 行完整题与 400 行仅题面数据
      三个打包文件在预览器中得到 1000 行
      500 行合并文件重复了两个子集
      数据集元数据为 MIT
    type: document
    size: xl
    position:
      x: 1460
      'y': 700
  - id: code_boundary
    label: |-
      发布代码边界
      Git 快照仅实现 EED
      没有完整推理或方框提取脚本
      没有完整准确率脚本
      含 EED 特定拒绝规则 · MIT · 无标签
    type: document
    size: xl
    position:
      x: 1460
      'y': 960
edges:
  - from: evidence
    to: scope
    type: secondary
    style:
      dashed: true
  - from: scope
    to: contributors
    type: primary
  - from: contributors
    to: formulation
    type: primary
  - from: formulation
    to: constraints
    type: primary
  - from: constraints
    to: question_bank
    type: primary
  - from: question_bank
    to: expert_review
    type: primary
  - from: llm_aids
    to: expert_review
    type: secondary
    label: 仅作审查辅助
    style:
      dashed: true
  - from: expert_review
    to: reviewer_library
    type: primary
  - from: reviewer_library
    to: human_review
    type: primary
  - from: human_review
    to: retain
    type: primary
  - from: retain
    to: dataset
    type: primary
  - from: dataset
    to: prompt
    type: primary
  - from: prompt
    to: boxed
    type: primary
  - from: boxed
    to: normalize
    type: primary
  - from: normalize
    to: metric_gate
    type: primary
  - from: metric_gate
    to: accuracy
    type: primary
    label: 精确分支
  - from: metric_gate
    to: eed_tree
    type: primary
    label: 分级分支
  - from: eed_tree
    to: eed_distance
    type: primary
  - from: eed_distance
    to: eed_score
    type: primary
  - from: accuracy
    to: report
    type: primary
    waypoints:
      - x: 620
        'y': 780
      - x: 860
        'y': 780
  - from: eed_score
    to: report
    type: primary
  - from: human_review
    to: human_baseline
    type: primary
  - from: human_baseline
    to: report
    type: primary
  - from: dataset
    to: data_boundary
    type: secondary
    label: 发布快照
    style:
      dashed: true
    waypoints:
      - x: 860
        'y': 620
      - x: 1580
        'y': 620
  - from: eed_score
    to: code_boundary
    type: secondary
    label: 已实现子集
    style:
      dashed: true
modules: []
