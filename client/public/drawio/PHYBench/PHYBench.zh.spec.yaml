meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PHYBench 构建与评测流程
  description: 与论文一致地展示500道原创符号物理题的人工构建与验证，以及精确和分级表达式评分。
  legend: o1与DeepSeek-R1输出仅在复核时帮助发现歧义或非预期理解，不用于生成题目或标准答案。
nodes:
  - id: step_1
    label: |-
      定义原创物理任务
      答案为单一符号表达式
      不接受数值近似
      以原创内容抵抗污染
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      招募178名北大学生
      物理专业学生编写与整理
      题目完全由人工创作
      不使用自动出题
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      形成757题初始池
      原创或大幅改编
      选取难以搜索的习题
      参考非公开及公开材料
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      覆盖广泛物理范围
      力学 · 电磁学
      热学 · 光学
      近代与高等物理
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      执行题目硬性要求
      自包含且无歧义
      定义所有变量
      仅有一个可核验表达式
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      提交内部题库
      保存题面与参考公式
      跟踪审稿意见
      不合格草稿退回修改
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      进行多轮专家审查
      检查物理正确性
      检查措辞与可解性
      修改或淘汰缺陷题目
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      仅把LLM输出用于复核
      查看o1与DeepSeek-R1答案
      暴露歧义或误读
      绝不生成题目或标准答案
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      由81名学生验证
      独立求解分配的题目
      含50名物理奥赛金牌
      建立高水平人类基线
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      处理验证标记
      检查清晰度与解的唯一性
      解决答案分歧
      移除不可靠题目
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      形成PHYBench
      500道原创题
      难度从高中至本科
      最高达物理奥赛水平
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      运行统一零样本提示
      要求逐步推理
      输出符号LaTeX答案
      以方框表达式结尾
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      比较符号表达式
      用SymPy与latex2sympy解析
      构建表达式树
      采用Zhang-Shasha编辑距离
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告准确率与EED
      等价公式判为正确
      r=0时得100
      0<r<0.6时得60-100r · 否则得0
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
