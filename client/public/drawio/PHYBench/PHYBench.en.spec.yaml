    Paper-v2 and fixed-source alignment for the 757-item Reviewer’s Library, independent human filtering to 500 symbolic
    physics problems, and the separate exact-accuracy and graded-EED evaluation branches.
  legend: >-
    Primary edges trace human construction and metric computation. Dashed edges isolate fixed evidence, LLM review aids,
    the pinned dataset snapshot, and the released-code implementation boundary.
