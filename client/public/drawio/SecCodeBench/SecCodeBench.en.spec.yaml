meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SecCodeBench-V2 Build and Evaluation Process
  description: >-
    SecCodeBench-V2 builds 98 function-level secure-coding tasks from Alibaba production vulnerability patterns,
    spanning 22 CWE types and Java, C, Python, Go, and JavaScript. Each task supplies a complete project scaffold with
    fixed interfaces and dependencies and appears in four scenarios: generation, generation with security hints, repair,
    and repair with hints. Prompts are available in Chinese and English. Experts author and double-review functional
    tests and security proof-of-concept tests, and assign CVSS Critical, High, or Medium severity with weights 4, 2, or
    1. The controller initializes the environment, creates prompts, executes model batches, analyzes artifacts, and
    exports results. Docker validators compile and run each submission; functionality is checked first and may trigger
    feedback-based repair, after which security is assessed by dynamic PoCs or an odd-numbered LLM-judge panel with
    majority voting for semantic flaws. Default Pass@1 is reported overall and by language, scenario, and severity, with
    weighted and unweighted views. Passing only demonstrates resistance within the benchmark threat model.
  legend: >-
    Source: SecCodeBench-V2 arXiv:2602.15485 Sections 2-4 and Appendices; official alibaba/sec-code-bench repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
