meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SecCodeBench-V2 构建与评测流程
  description: >-
    SecCodeBench-V2从阿里巴巴生产漏洞模式构建98个函数级安全编码任务，覆盖22类CWE以及Java、C、Python、Go和JavaScript。每题提供完整项目脚手架、固定接口和依赖，并形成代码生成、带安全提示生成、代码修复、带安全提示修复四种场景；提示支持中英文。专家编写并双重审查功能测试和安全概念验证测试，按CVSS标记严重、高危或中危并赋权4、2、1。控制器依次初始化环境、构造提示、批量执行模型、分析产物并导出结果。Docker验证器编译和运行提交，先检查功能，必要时基于反馈修复，再通过动态PoC或奇数LLM评审团多数票判断语义漏洞。默认报告Pass@1，并按语言、场景和严重度提供加权与非加权结果；通过只代表在该威胁模型内未被攻破。
  legend: >-
    来源：SecCodeBench-V2 arXiv:2602.15485 Sections 2-4 and Appendices; official alibaba/sec-code-bench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
