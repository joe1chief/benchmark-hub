    type: decision
    size: xl
    position:
      x: 1860
      'y': 210
  - id: continuous
    label: |-
      连续检索指标
      精确率 · 召回率 · F1 主指标
    type: process
    size: xl
    position:
      x: 2120
      'y': 70
