meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeepSearchQA 构建流程
  description: 对齐论文的穷举答案网络任务专家构建与黑盒集合评测流程。
  legend: 实线箭头表示客观任务构建、稳定真值、智能体答案集合和两类指标。
nodes:
  - id: sources
    label: |-
      真实高价值查询
      多样开放网络来源
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: experts
    label: |-
      专家标注员构建
      高难多步信息检索
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: objective
    label: |-
      是否客观且真值确定？
      单一实体或穷举答案集
    type: decision
    size: xl
    position:
      x: 560
      'y': 210
  - id: stable
    label: |-
      稳定真值
      时间锚定提示或引用静态数据集
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: chain
    label: |-
      构建因果搜索链
      检索 → 组装 → 推理
      去重 · 实体解析 · 停止判断
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: benchmark
    label: |-
