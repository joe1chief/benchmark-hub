meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: DeepSearchQA 数据集构建流程
  description: 对齐 arXiv:2601.20975v1 §2，展示专家出题、客观问题筛选、独立盲审研究，以及论文明确披露的三种差异处理结果。
  legend: 复核者只接收问题，不看到策题人真值；两条输入仅在对照阶段汇合。无差异时保留策题人真值；有差异时分类为更新真值、复核者错误或问题有歧义， 仅有歧义的问题被删除。
