meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: DeepSearchQA Dataset Build Process
  description: >-
    Expert authoring, objective-question filtering, blind independent research, and the three explicitly disclosed
    discrepancy outcomes from arXiv:2601.20975v1 Section 2.
  legend: >-
    Reviewers receive the question without curator ground truth; the two branches meet only at comparison. No
    discrepancy retains the curator truth. A discrepancy is classified as ground-truth update, reviewer error, or
    ambiguity; ambiguous prompts alone are removed.
