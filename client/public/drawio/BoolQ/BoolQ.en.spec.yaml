meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BoolQ Build Process
  description: >-
    Paper-aligned BoolQ workflow: anonymized Google queries are heuristically filtered for natural yes/no questions,
    retained only when Wikipedia appears in the top five results, judged and annotated in three human steps, combined
    with Natural Questions yes/no items, split into train/dev/test sets, quality-audited, and evaluated by accuracy.
  legend: Solid arrows show construction and evaluation; the upper branch is the independent annotation audit.
