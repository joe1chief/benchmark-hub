    label: |-
      Anonymized Google
      Search Queries
    type: database
    size: large
    position:
      x: 850
      'y': 130
  - id: yes_no_filter
    label: |-
      Likely Yes/No
      Heuristic Filter
    type: process
    size: large
    position:
      x: 850
      'y': 280
  - id: wiki_gate
    label: |-
      Wikipedia in
      Top 5 Results
    type: process
    size: large
    position:
      x: 850
      'y': 430
  - id: quality
    label: |-
      Judge Question
      Before Page View
    type: process
    size: large
    position:
      x: 850
      'y': 580
  - id: passage
    label: |-
      Find Passage or
      Mark Unanswerable
    type: user
    size: large
    position:
      x: 850
      'y': 730
  - id: answer
    label: |-
      Assign Yes / No
      Answer
    type: process
    size: large
    position:
      x: 850
      'y': 880
  - id: pool
