meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BoolQ 构建流程
  description: >-
    按论文对齐的 BoolQ 流程：从匿名 Google 搜索查询中启发式筛出自然的是非问题，仅保留前五条结果含维基百科页面的查询， 经过三步人工判断与标注，再与 Natural Questions
    的是非题合并，切分训练、开发和测试集，抽样核验标注质量并以准确率评测。
  legend: 实线表示构建与评测主流程；上方分支表示独立的标注质量抽检。
nodes:
  - id: queries
    label: |-
      匿名 Google
      搜索查询
    type: database
    size: large
    position:
      x: 40
      'y': 220
  - id: yes_no_filter
    label: |-
      启发式筛选
      可能的是非问题
    type: process
    size: large
    position:
      x: 240
      'y': 220
  - id: wiki_gate
    label: |-
      前五条结果含
      维基百科页面
    type: process
    size: large
    position:
      x: 440
      'y': 220
  - id: quality
    label: |-
      看页面前判断
      问题是否合格
    type: process
    size: large
    position:
      x: 640
      'y': 220
  - id: passage
    label: |-
      定位证据段落或
      标记不可回答
    type: user
    size: large
    position:
      x: 840
      'y': 220
  - id: answer
    label: |-
      标注“是 / 否”
      答案
    type: process
    size: large
    position:
      x: 1040
      'y': 220
  - id: pool
    label: |-
      新采 1.3 万 + NQ 0.3 万
      合计 1.6 万
    type: database
    size: large
    position:
      x: 1240
      'y': 220
  - id: audit
    label: |-
      抽检 110 题
      标注准确率 90%
    type: process
    size: large
    position:
      x: 1440
      'y': 40
  - id: split
    label: 官方切分
    type: decision
    size: large
    position:
      x: 1440
      'y': 300
  - id: train
    label: |-
      训练集 0.94 万
      NQ 题仅在此处
    type: document
    size: large
    position:
      x: 1640
      'y': 160
  - id: dev
    label: 开发集 0.32 万
    type: document
    size: large
    position:
      x: 1640
      'y': 300
  - id: test
    label: 测试集 0.32 万
    type: document
    size: large
    position:
      x: 1640
      'y': 440
  - id: model
    label: |-
      问题 + 段落输入
      预测是 / 否
    type: process
    size: large
    position:
      x: 1840
      'y': 300
  - id: score
    label: 模型准确率
    type: terminal
    size: large
    position:
      x: 2040
      'y': 300
edges:
  - from: queries
    to: yes_no_filter
    type: primary
  - from: yes_no_filter
    to: wiki_gate
    type: primary
  - from: wiki_gate
    to: quality
    type: primary
  - from: quality
    to: passage
    type: primary
  - from: passage
    to: answer
    type: primary
  - from: answer
    to: pool
    type: primary
  - from: pool
    to: audit
    type: data
  - from: pool
    to: split
    type: primary
  - from: split
    to: train
    type: primary
  - from: split
    to: dev
    type: primary
  - from: split
    to: test
    type: primary
  - from: train
    to: model
    type: primary
  - from: dev
    to: model
    type: primary
  - from: test
    to: model
    type: primary
  - from: model
    to: score
    type: primary
modules: []
