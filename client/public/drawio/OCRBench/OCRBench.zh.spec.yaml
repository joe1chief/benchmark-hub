meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench 构建与评测流程
  description: 对齐论文，将 29 个 OCR 相关数据集整合为人工校正的 1,000 条五任务基准，采用任务专属提示和统一的标准答案包含式评分。
  legend: 29 个数据集构成论文的大规模实验池；紧凑版 OCRBench 是明确配比的 1,000 条子集，最终分数由五个组件的正确数相加。
nodes:
  - id: pool
    label: |-
      整合 29 个 OCR 相关数据集
      公开文本识别与 VQA 来源
      文档 · 表单 · 票据
      手写数学表达式
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      组织五类任务
      文本识别 · 场景文本 VQA
      文档 VQA · 关键信息提取
      手写数学表达式识别
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: semantic
    label: |-
      增加语义对照数据
      使用 IIIT5K 词典
      ST 保留 3,000 个单词
      NST 打乱同一批字符
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: candidate
    label: |-
      准备大规模实验候选池
      大型数据集各抽取 3,000 条
      排除少于四个符号的答案
      降低包含式判断误报
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: prompts
    label: |-
      统一任务专属提示
      英文 · 中文 · 数字串识别
      KIE 键到值问题
      HMER 要求输出 LaTeX
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: recognition
    label: |-
      选择文本识别样本 · 300
      规则 · 不规则 · 艺术字
      手写 · 数字串
      非语义文本 · 每类 50
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: vqa
    label: |-
      选择两个 VQA 组件
      场景文本 VQA · 200
      四个来源各 50
      文档 VQA · 200 · 四组各 50
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: extraction
    label: |-
      选择 KIE 与 HMER 组件
      KIE · 200：SROIE 67
      FUNSD 66 · POIE 67
      HME100K HMER · 100
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: verify
    label: |-
      人工核验全部 1,000 个问答对
      修正不准确的标准答案
      补充其他正确答案候选
      检查五组件覆盖
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布紧凑版 OCRBench
      1,000 条图像—问题—答案
      五个 OCR 任务组件
      全部经人工筛选与校正
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: infer
    label: |-
      执行大模型零样本推理
      输入图像与任务提示
      KIE 添加直接读图前缀
      保留自由文本回答
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: criterion
    label: |-
      应用统一判断标准
      检查标准答案是否
      出现在模型回答中
      接受其他正确答案候选
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      按组件统计正确数
      文本识别最高 300
      场景 VQA · 文档 VQA · KIE 各 200
      HMER 最高 100
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告 OCRBench 分数
      五个组件正确数相加
      最终范围 0–1,000
      分析 OCR 能力缺口
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: pool
    to: tasks
    type: primary
  - from: tasks
    to: semantic
    type: primary
  - from: semantic
    to: candidate
    type: primary
  - from: candidate
    to: prompts
    type: primary
  - from: prompts
    to: recognition
    type: primary
  - from: recognition
    to: vqa
    type: primary
  - from: vqa
    to: extraction
    type: primary
  - from: extraction
    to: verify
    type: primary
  - from: verify
    to: release
    type: primary
  - from: release
    to: infer
    type: primary
  - from: infer
    to: criterion
    type: primary
  - from: criterion
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
