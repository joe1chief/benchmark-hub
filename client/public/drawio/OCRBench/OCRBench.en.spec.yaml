    label: |-
      Assemble the Broad Paper Study
      29 OCR-related Public Datasets
      Recognition · VQA · Documents
      KIE · HMER
    type: database
    size: xl
    position:
      x: 20
      'y': 420
  - id: artifact_gate
    label: |-
      Which Paper
      Artifact?
    type: decision
    size: xl
    position:
      x: 260
      'y': 420
  - id: semantic_controls
    label: |-
      Create Semantic Controls
      Use the IIIT5K Dictionary
      ST: 3,000 Word Images
      NST: Shuffle the Same Characters
    type: process
    size: xl
    position:
      x: 500
      'y': 0
  - id: broad_filter
    label: |-
      Prepare the FullTest Study Pool
      Drop Answers under Four Symbols
      Sample 3,000 from Some Large Datasets
      Do Not Infer a Compact-selection Rule
    type: process
    size: xl
    position:
      x: 740
      'y': 0
  - id: broad_study
    label: |-
      Run the 29-dataset Study
      FullTest JSON · Paper Tables 1–2
      Per-dataset Containment Accuracy
      Distinct from the 1,000-item Release
    type: terminal
    size: xl
    position:
      x: 980
      'y': 0
  - id: compact_contract
    label: |-
      Define Compact OCRBench
      Fixed Quotas across Five Components
      1,000 Image–Question–Answer Rows
      Item-selection Algorithm Not Reported
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: component_gate
    label: |-
      Allocate the Five
      Component Quotas
    type: decision
    size: xl
    position:
      x: 740
      'y': 420
  - id: recognition
    label: |-
      Text Recognition · 300
      Regular · Irregular · Artistic
      Handwriting · Digit String · NST
      Six Types × 50
    type: database
    size: xl
    position:
      x: 980
      'y': 140
  - id: scene_vqa
    label: |-
      Scene Text VQA · 200
      STVQA · TextVQA
      ESTVQA English · OCRVQA
      Four Sources × 50
    type: database
    size: xl
    position:
      x: 980
      'y': 280
  - id: doc_vqa
    label: |-
      Document VQA · 200
      DocVQA · ChartQA Augmented
      ChartQA Human · InfographicVQA
      Four Sources × 50
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: kie
    label: |-
      Key Information Extraction · 200
      SROIE 67 · FUNSD 66 · POIE 67
      Ask for the Value of a Given Key
      Preserve Alternative Gold Values
    type: database
    size: xl
    position:
      x: 980
      'y': 560
  - id: hmer
    label: |-
      HMER · 100
      HME100K Images
      Handwritten Mathematical Expressions
      Request LaTeX Output
    type: database
    size: xl
    position:
      x: 980
      'y': 700
  - id: prompting
    label: |-
      Preserve Task-specific Questions
      English · Chinese · Digit Prompts
      Add Direct-text Instruction for KIE
      Keep the HMER LaTeX Contract
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: verify
    label: |-
      Verify All 1,000 Rows Manually
      Correct Inaccurate Answers
      Add Alternative Correct Candidates
      Check the Fixed Component Quotas
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release OCRBench Data and Images
      JSON Fields: Type · Dataset · Question
      Answers · Image Path · ID
      Public 1,000-row HF Mirror
    type: database
    size: xl
    position:
      x: 1700
      'y': 420
  - id: infer
    label: |-
      Run Zero-shot LMM Inference
      Supply One Image and Its Question
      Keep a Free-form Prediction
      No Paper-wide Generation Settings
    type: process
    size: xl
    position:
      x: 1940
      'y': 420
  - id: normalize
    label: |-
      Apply Released Normalization
      Non-HMER: Lowercase + Trim
      Flatten Lines
      HMER: Remove Spaces/Line Breaks
      Test Each Alternative Gold
    type: process
    size: xl
    position:
      x: 2180
      'y': 420
  - id: containment
    label: |-
      Assign Released Binary Row Score
      Any Normalized Gold Is a
      Prediction Substring → 1
      Otherwise → 0
    type: process
    size: xl
    position:
      x: 2420
      'y': 420
  - id: score
    label: |-
      Sum Five Component Counts
      Recognition 300 · Scene VQA 200
      Document VQA 200 · KIE 200
      HMER 100
      Total Score: 0–1,000
    type: terminal
    size: xl
    position:
      x: 2660
      'y': 420
  - id: source_boundary
    label: |-
      Source and Release Boundary
      arXiv v7 4cc667… · Repo 86d091…
      JSON df7595… · HF 92a54b…
      Short Gold Alternatives Exist
      MIT Code · Upstream Data Rights
    type: document
    size: xl
    position:
      x: 2900
      'y': 680
