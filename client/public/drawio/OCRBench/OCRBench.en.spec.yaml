meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench Build and Evaluation Process
  description: >-
    Paper-aligned consolidation of 29 OCR-related datasets into a manually corrected 1,000-item benchmark spanning five
    task families, with task-specific prompts and a unified ground-truth containment score.
  legend: >-
    The 29-dataset pool supports the paper's broad study; the compact OCRBench release is the explicitly balanced
    1,000-item subset summarized by its five component scores.
nodes:
  - id: pool
    label: |-
      Integrate 29 OCR-related Datasets
      Public Recognition and VQA Sources
      Documents · Forms · Receipts
      Handwritten Mathematical Expressions
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      Organize Five Task Families
      Text Recognition · Scene Text VQA
      Document-oriented VQA · KIE
      HMER
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: semantic
    label: |-
      Add Semantic Controls
      Start from the IIIT5K Dictionary
      ST Keeps 3,000 Words
      NST Shuffles the Same Characters
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: candidate
    label: |-
      Prepare the Broad Evaluation Pool
      Sample 3,000 from Large Datasets
      Drop Answers under Four Symbols
      Reduce Containment False Positives
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: prompts
    label: |-
      Standardize Task-specific Prompts
      English · Chinese · Digit Reading
      KIE Key-to-value Questions
      HMER Output in LaTeX
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: recognition
    label: |-
      Select Text Recognition · 300
      Regular · Irregular · Artistic
      Handwriting · Digit Strings
      Non-semantic · 50 Each
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: vqa
    label: |-
      Select Two VQA Components
      Scene Text VQA · 200
      Four Sources · 50 Each
      Document VQA · 200 · Four × 50
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: extraction
    label: |-
      Select KIE and HMER Components
      KIE · 200: SROIE 67
      FUNSD 66 · POIE 67
      HME100K HMER · 100
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: verify
    label: |-
      Manually Verify All 1,000 QA Pairs
      Correct Inaccurate Ground Truth
      Add Alternative Correct Answers
      Check Five-component Coverage
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      Release Compact OCRBench
      1,000 Image–Question–Answer Items
      Five OCR Task Components
      Manually Filtered and Corrected
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: infer
    label: |-
      Run Zero-shot LMM Inference
      Provide Image plus Task Prompt
      Add Direct-text Prefix for KIE
      Preserve Free-form Responses
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: criterion
    label: |-
      Apply the Unified Criterion
      Check Whether a Gold Answer
      Appears in the Model Response
      Accept Alternative Gold Candidates
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      Count Correct Items by Component
      Recognition Max 300
      Scene VQA · Doc VQA · KIE Max 200 Each
      HMER Max 100
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report the OCRBench Score
      Sum Five Component Counts
      Final Range 0–1,000
      Diagnose OCR Capability Gaps
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
