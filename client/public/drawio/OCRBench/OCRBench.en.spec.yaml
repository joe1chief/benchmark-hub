meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench Build and Evaluation Process
  description: >-
    Paper-v7 and fixed-release-aligned separation of the 29-dataset study from the manually corrected 1,000-item
    OCRBench artifact, followed by the released normalization, containment scoring, and five-component sum.
  legend: >-
    Dashed arrows denote the paper's broad FullTest study, not a proven selection pipeline for the compact benchmark.
    Solid arrows follow the released 1,000-item OCRBench build and evaluation contract.
nodes:
