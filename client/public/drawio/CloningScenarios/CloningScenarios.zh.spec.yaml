meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CloningScenarios 构建与评测流程
  description: 对齐论文与固定发布版本的 LAB-Bench CloningScenarios 流程，覆盖 41 道人类高难分子克隆题、 精确公开/私有划分，以及原始禁用工具、支持拒答的评测协议。
  legend: 实线表示主要构建与模型评测路径；虚线表示人类基线与开放问答审计。
nodes:
  - id: evidence
    label: |-
      证据边界
      arXiv:2407.10362v3
      仓库 998a8e0 • HF 5c77cec
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: authors
    label: |-
      论文作者 + 签约
      生物学专家
      人工编写与修订
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: scenario_design
    label: |-
      真实克隆流程
      质粒 • DNA 片段
      酶 • 实验流程选择
    type: process
    size: xl
    position:
      x: 600
      'y': 240
  - id: question_design
    label: |-
      41 道人类高难选择题
      多步骤场景
      可共享背景但可独立作答
    type: document
    size: xl
    position:
      x: 880
      'y': 240
  - id: quality
    label: |-
      专家质量审核
      可信干扰项
      “信息不足”选项
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: release
    label: |-
      固定 CloningScenarios v1
      33 道公开 • 8 道私有
      含污染金丝雀字符串
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: model_protocol
    label: |-
      论文模型协议
      零样本 CoT • 禁用工具
      3 次独立运行
    type: process
    size: xl
    position:
      x: 1720
      'y': 80
  - id: answer_parse
    label: |-
      仓库答案解析
      [ANSWER] 字母标签 + 正则
      “信息不足”视为不确定
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: metrics
    label: |-
      拒答感知指标
      准确率 = 正确数 / 41
      精确率 = 正确数 / 作答数
      覆盖率 = 作答数 / 41
    type: document
    size: xl
    position:
      x: 2280
      'y': 80
  - id: human
    label: |-
      博士专家人类基线
      可用工具 • 禁用 AI
      覆盖全部 41 道题
    type: user
    size: xl
    position:
      x: 2000
      'y': 240
  - id: open_answer
    label: |-
      论文开放问答审计
      10 道改写题
      Claude 3.5 + GPT-4o：各 2/10
    type: document
    size: xl
    position:
      x: 2280
      'y': 400
  - id: report
    label: |-
      LAB-Bench 报告
      模型与人类表现对比
      开放问答揭示选择题高估
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 240
edges:
  - from: evidence
    to: authors
    type: primary
  - from: authors
    to: scenario_design
    type: primary
  - from: scenario_design
    to: question_design
    type: primary
  - from: question_design
    to: quality
    type: primary
  - from: quality
    to: release
    type: primary
  - from: release
    to: model_protocol
    type: primary
  - from: model_protocol
    to: answer_parse
    type: primary
  - from: answer_parse
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
  - from: release
    to: human
    type: data
  - from: human
    to: report
    type: data
  - from: release
    to: open_answer
    type: data
  - from: open_answer
    to: report
    type: data
modules: []
