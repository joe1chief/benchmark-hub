meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FinSearchComp Build Process
  description: Paper-aligned expert construction and end-to-end evaluation of 635 open-domain financial search questions.
  legend: >-
    Solid arrows follow arXiv:2509.13160 from three analyst workflows and task-specific sources through blind expert
    verification, dynamic or range-based gold answers, unrestricted tool use, and rubric-guided accuracy.
nodes:
  - id: task_design
    label: |-
      Define three analyst-style task families
      T1 time-sensitive fetching · T2 historical lookup
      T3 complex historical investigation
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: task_sources
    label: |-
      Build task-specific evidence pipelines
      T1 public APIs + executable dynamic answers
      T2/T3 filings, authorities, and financial databases
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: task_answers
    label: |-
      Author objective finance questions and answers
      T2 direct retrieval without calculation
      T3 multi-source reasoning and calculation
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: experts
    label: |-
      Engage 70 professional finance experts
      50 proficient annotators · 20 senior experts
      about 180 + 60 expert-hours of oversight
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: quality
    label: |-
      Select reliable auditable sources
      state definitions and reference dates explicitly
      use ranges/tolerances; avoid revision-prone metrics
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: blind_review
    label: |-
      Blind multi-expert answer verification
      1–2 experts solve without the answer key
      senior expert edits, arbitrates, or discards
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: dataset
    label: |-
      Final 635 bilingual questions
      Global 337: T1/2/3 = 134/119/84
      Greater China 298: 110/100/88
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: agents
    label: |-
      Run end-to-end agents without fixed context
      orchestrate web search, financial plugins, APIs, SQL
      T1 evaluations occur after local market close
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: scoring
    label: |-
      Rubric-guided LLM binary judgment
      exact match 21.4% · in-range 78.6%
      expert checks validate at least 95% agreement
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: report
    label: |-
      Report accuracy overall and by task / market
      compare web products, APIs, and human experts
      preserve freshness and source provenance
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
