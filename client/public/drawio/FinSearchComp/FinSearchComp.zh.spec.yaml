meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FinSearchComp 构建流程
  description: 按论文还原 635 道开放域金融搜索题的专家构建与端到端评测流程。
  legend: 实线箭头遵循 arXiv:2509.13160，从三类分析师工作流和分任务来源，经盲审专家验证、动态/范围真值、开放工具使用到准则评分。
nodes:
  - id: task_design
    label: |-
      定义三类分析师工作流
      T1 时效数据获取 · T2 简单历史查询
      T3 复杂历史调查
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: task_sources
    label: |-
      构建分任务证据管线
      T1 公共API + 可执行动态答案
      T2/T3 申报文件、权威网站与金融数据库
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: task_answers
    label: |-
      编写客观金融问题与答案
      T2 直接检索且不做数据计算
      T3 多来源推理与计算
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: experts
    label: |-
      邀请70位专业金融专家
      50位熟练标注员 · 20位资深专家
      约180 + 60专家小时监督
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: quality
    label: |-
      选择可靠且可审计的来源
      在问题中明确口径与参考日期
      用范围/容差；避开易修订指标
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: blind_review
    label: |-
      多专家盲审答案
      1–2位专家不看答案独立求解
      资深专家修改、仲裁或丢弃
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: dataset
    label: |-
      最终635道双语问题
      Global 337：T1/2/3 = 134/119/84
      大中华区298：110/100/88
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: agents
    label: |-
      无固定上下文地运行端到端智能体
      编排网页搜索、金融插件、API、SQL
      T1 在当地市场收盘后统一评测
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: scoring
    label: |-
      LLM 按准则做二元判断
      精确匹配21.4% · 范围匹配78.6%
      专家抽查验证至少95%一致率
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: report
    label: |-
      报告总体及任务/市场准确率
      比较网页产品、API和人类专家
      保留时效性与来源依据
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
