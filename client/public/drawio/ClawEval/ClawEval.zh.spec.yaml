meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Claw-Eval 构建流程
  description: 与论文对齐的 Claw-Eval 流程：将原创与兼容任务实现为可审计环境及证据驱动 Rubric，经独立复核和模型试跑后， 在时间隔离的准备、执行、判分三阶段中评估完成度、安全性、鲁棒性与重复可靠性。
  legend: 实线表示任务构建与评测主流程；分支表示三类任务和三个独立证据通道。
nodes:
  - id: sources
    label: |-
      编写并适配候选任务
      250 个原创任务 + 50 个兼容任务
      保留适配任务的提示与评分语义
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: groups
    label: |-
      覆盖三类任务
      通用 161 • 多模态 101 • 多轮 38
      合计九个细分类别
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: design
    label: |-
      定义每个任务
      目标能力 + 提示 + 工具／资产
      草拟完成度、安全性与鲁棒性计划
    type: document
    size: xl
    position:
      x: 340
      'y': 400
  - id: environment
    label: |-
      实现运行环境
      沙箱资产 + 模拟服务 + 模拟用户
      支持工作流、媒体与对话任务
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: rubrics
    label: |-
      形式化细粒度 Rubric
      确定性检查 + LLM／VLM 判断
      每项都绑定可观察证据
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: review
    label: |-
      独立复核与模型试跑
      检查正确性、完整性和泄漏
      修订或移除简单、损坏或不可行任务
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: release
    label: |-
      发布 Claw-Eval
      300 个经人工验证的任务
      2,159 条 Rubric • 每题平均 7.2 条
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: setup
    label: |-
      阶段一：准备
      创建全新的 Docker 沙箱
      只注入任务资源，不暴露评分材料
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: execute
    label: |-
      阶段二：Agent 执行
      使用系统工具与任务专属服务 API
      可选择注入受控工具错误
    type: terminal
    size: xl
    position:
      x: 2140
      'y': 220
  - id: trace
    label: |-
      证据一：执行轨迹
      记录工具调用、观察与完整轨迹
      在 Agent 视野外收集
    type: document
    size: xl
    position:
      x: 2440
      'y': 40
  - id: logs
    label: |-
      证据二：服务审计日志
      记录真实请求及其参数
      检测禁止或缺失的副作用
    type: document
    size: xl
    position:
      x: 2440
      'y': 220
  - id: snapshot
    label: |-
      证据三：环境快照
      捕获文件、服务状态与产物
      保存执行后验证器输出
    type: document
    size: xl
    position:
      x: 2440
      'y': 400
  - id: judge
    label: |-
      阶段三：混合判分
      时间防火墙此时才暴露评分器
      执行确定性与语义 Rubric 检查
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: score
    label: |-
      报告能力与可靠性
      安全门控的完成度与鲁棒性得分
      三次运行平均分 • 至少一次通过率
      三次全部通过率
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
edges:
  - from: sources
    to: groups
    type: primary
  - from: sources
    to: design
    type: primary
  - from: groups
    to: environment
    type: primary
  - from: design
    to: environment
    type: primary
  - from: environment
    to: rubrics
    type: primary
  - from: rubrics
    to: review
    type: primary
  - from: review
    to: release
    type: data
  - from: release
    to: setup
    type: primary
  - from: setup
    to: execute
    type: primary
  - from: execute
    to: trace
    type: primary
  - from: execute
    to: logs
    type: primary
  - from: execute
    to: snapshot
    type: primary
  - from: trace
    to: judge
    type: primary
  - from: logs
    to: judge
    type: primary
  - from: snapshot
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
