meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Claw-Eval Build Process
  description: >-
    Paper-aligned Claw-Eval flow: original and compatibility tasks are implemented with auditable environments and
    evidence-grounded rubrics, independently reviewed and pilot-tested, then run through temporally separated setup,
    execution, and judging phases to score completion, safety, robustness, and repeatability.
  legend: Solid arrows show task construction and evaluation; branches show task groups and three evidence channels.
nodes:
  - id: sources
    label: |-
      Author and Adapt Candidate Tasks
      250 Original + 50 Compatibility Tasks
      Preserve Adapted Prompts and Scoring Semantics
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: groups
    label: |-
      Cover Three Task Groups
      General 161 • Multimodal 101 • Multi-turn 38
      Nine Fine-grained Categories
    type: process
    size: xl
    position:
      x: 340
      'y': 40
  - id: design
    label: |-
      Specify Each Task
      Target Capability + Prompt + Tools/Assets
      Draft Completion, Safety, and Robustness Plan
    type: document
    size: xl
    position:
      x: 340
      'y': 400
  - id: environment
    label: |-
      Implement the Runtime Environment
      Sandbox Assets + Mock Services + Simulated User
      Support Workflow, Media, and Dialogue Tasks
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: rubrics
    label: |-
      Formalize Fine-grained Rubrics
      Deterministic Checks + LLM/VLM Judgments
      Ground Every Item in Observable Evidence
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: review
    label: |-
      Independent Review and Pilot Validation
      Check Correctness, Completeness, and Leakage
      Revise/Remove Trivial, Broken, or Impossible Tasks
    type: decision
    size: xl
    position:
      x: 1240
      'y': 220
  - id: release
    label: |-
      Release Claw-Eval
      300 Human-verified Tasks
      2,159 Rubric Items • Average 7.2 per Task
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: setup
    label: |-
      Phase 1 — Setup
      Provision a Fresh Docker Sandbox
      Inject Task Resources, Not Grading Artifacts
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: execute
    label: |-
      Phase 2 — Agent Execution
      Use System Tools + Task-specific Service APIs
      Optionally Inject Controlled Tool Errors
    type: terminal
    size: xl
    position:
      x: 2140
      'y': 220
  - id: trace
    label: |-
      Evidence 1 — Execution Trace
      Record Tool Calls, Observations, and Trajectory
      Collected Outside the Agent's View
    type: document
    size: xl
    position:
      x: 2440
      'y': 40
  - id: logs
    label: |-
      Evidence 2 — Service Audit Logs
      Record Actual Requests and Parameters
      Detect Forbidden or Missing Side Effects
    type: document
    size: xl
    position:
      x: 2440
      'y': 220
  - id: snapshot
    label: |-
      Evidence 3 — Environment Snapshot
      Capture Files, Service State, and Artifacts
      Preserve Post-execution Verifier Outputs
    type: document
    size: xl
    position:
      x: 2440
      'y': 400
  - id: judge
    label: |-
      Phase 3 — Hybrid Judge
      Temporal Firewall Reveals Graders Only Now
      Apply Deterministic and Semantic Rubric Checks
    type: decision
    size: xl
    position:
      x: 2740
      'y': 220
  - id: score
    label: |-
      Report Capability and Reliability
      Safety-gated Completion and Robustness
      Average Score • Any Pass in Three Runs
      All Three Runs Pass
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
