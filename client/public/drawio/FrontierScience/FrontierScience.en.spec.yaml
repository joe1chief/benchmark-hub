meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierScience Build Process
  description: Paper-aligned dual-track expert construction, review, gold-set selection, and grading workflow.
  legend: >-
    The upper branch is Olympiad and the lower branch is Research, following arXiv:2601.21165 Sections 2.1–2.4; both
    branches merge into the 160-item open gold set and then retain their distinct grading protocols.
nodes:
  - id: disciplines
    label: |-
      Recruit physics, chemistry, and biology experts
      two complementary capability tracks
      every task is original and text-only
    type: database
    size: xl
    position:
      x: 40
      'y': 260
  - id: olympiad_authors
    label: |-
      Olympiad expert pool
      42 medalists or national-team coaches
      108 medals: 45 gold · 37 silver · 26 bronze
    type: process
    size: xl
    position:
      x: 300
      'y': 80
  - id: research_authors
    label: |-
      Research expert pool
      45 PhD scientists: candidates, postdocs, faculty
      authentic subproblems taking at least 3–5 hours
    type: process
    size: xl
    position:
      x: 300
      'y': 440
  - id: olympiad_tasks
    label: |-
      Write self-contained Olympiad problems
      at least international-competition difficulty
      numeric/expression answer or fuzzy biology string
    type: document
    size: xl
    position:
      x: 560
      'y': 80
  - id: research_tasks
    label: |-
      Write open-ended research subproblems
      detailed full-credit solution + metadata
      independent objective rubric items total 10 points
    type: document
    size: xl
    position:
      x: 560
      'y': 440
  - id: olympiad_review
    label: |-
      Select against internal models; revise if solved
      at least 1 independent review + holistic review
      writer/reviewer consensus or discard
    type: process
    size: xl
    position:
      x: 820
      'y': 80
  - id: research_review
    label: |-
      Select against internal-model rubric scores
      at least 2 independent reviews + meta-review
      writer/reviewer consensus or discard
    type: process
    size: xl
    position:
      x: 820
      'y': 440
  - id: gold
    label: |-
      Expert meta-review and release
      >500 Olympiad → 100 gold
      >200 Research → 60 gold; remainder held out
    type: database
    size: xl
    position:
      x: 1080
      'y': 260
  - id: olympiad_grade
    label: |-
      Evaluate Olympiad answers without browsing
      GPT-5 judge compares number/expression/phrase
      average accuracy over 20 independent trials
    type: process
    size: xl
    position:
      x: 1340
      'y': 80
  - id: research_grade
    label: |-
      Evaluate Research answers without browsing
      GPT-5 high-effort judge assigns rubric points
      ≥7/10 is success; average 30 trials
    type: process
    size: xl
    position:
      x: 1340
      'y': 440
  - id: report
    label: |-
      Report track-specific accuracy
      Olympiad: precise constrained reasoning
      Research: open-ended process and final-answer quality
    type: terminal
    size: xl
    position:
      x: 1600
      'y': 260
