meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChemBench 构建流程
  description: >-
    对齐论文的 ChemBench 流程：人工与半自动化学问题进入带防污染标记的标准结构，经至少两名科学家和自动检查审核，形成 2,788 题完整集和 236 题 Mini 子集，再用模型适配提示和稳健解析比较模型、工具增强系统与 19
    名化学家。
  legend: 实线箭头表示语料整理与评测；虚线箭头表示并行数据源和人类基线。
nodes:
  - id: manual
    label: |-
      人工整理来源：1,039对问答
      原创问题 • 大学考试
      习题与题库
    type: user
    size: xl
    position:
      x: 40
      'y': 40
  - id: programmatic
    label: |-
      半自动来源：1,749对问答
      筛选后的化学数据库 + 程序生成变体
      包含化学偏好与直觉任务
    type: database
    size: xl
    position:
      x: 40
      'y': 400
  - id: schema
    label: |-
      通过GitHub拉取请求提交问题
      采用BIG-bench风格标准结构
      编码分子、方程、单位和答案类型
    type: document
    size: xl
    position:
      x: 340
      'y': 220
  - id: canary
    label: |-
      加入BIG-bench金丝雀字符串
      要求模型开发者从训练数据中过滤
      降低基准污染风险
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: review
    label: |-
      合并前质量门禁
      原整理者 + 至少两名科学家
      自动化标准结构检查
    type: decision
    size: xl
    position:
      x: 940
      'y': 220
  - id: labels
    label: |-
      为每题标注属性
      化学主题 • 所需技能 • 难度
      知识 • 推理 • 计算 • 直觉
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: corpus
    label: |-
      发布完整ChemBench语料
      共2,788对问答
      2,544道选择题 + 244道开放题
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: mini
    label: |-
      整理ChemBench-Mini：236题
      保留全部高级题并限制主题/技能组合数量
      平衡主题与技能用于日常评测
    type: database
    size: xl
    position:
      x: 1840
      'y': 40
  - id: system
    label: |-
      评测模型或工具增强系统
      接受任何能返回文本的系统
      使用完整集或ChemBench-Mini
    type: process
    size: xl
    position:
      x: 1840
      'y': 400
  - id: prompt
    label: |-
      应用模型适配提示模板
      区分补全模型与指令模型格式
      规范SMILES、LaTeX、方程和单位
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: inference
    label: |-
      确定性生成
      贪心解码 • 温度0
      请求结构化答案与1–5级置信度
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: parse
    label: |-
      稳健多阶段解析
      提取答案标签、选项字母和数值
      正则完成文字转数字；失败时用LLM兜底
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: human
    label: |-
      ChemBench-Mini人类基线
      通过网页调查19名化学专家
      部分条件允许网页搜索等工具
    type: user
    size: xl
    position:
      x: 3040
      'y': 400
  - id: report
    label: |-
      评估正确性与置信度
      比较模型、智能体和化学家
      发布主题/技能明细与排行榜
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 140
edges:
  - from: manual
    to: schema
    type: primary
  - from: programmatic
    to: schema
    type: primary
  - from: schema
    to: canary
    type: primary
  - from: canary
    to: review
    type: primary
  - from: review
    to: labels
    type: primary
  - from: labels
    to: corpus
    type: primary
  - from: corpus
    to: mini
    type: data
  - from: corpus
    to: system
    type: primary
  - from: mini
    to: prompt
    type: data
  - from: system
    to: prompt
    type: primary
  - from: prompt
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: report
    type: primary
  - from: mini
    to: human
    type: data
  - from: human
    to: report
    type: data
modules: []
