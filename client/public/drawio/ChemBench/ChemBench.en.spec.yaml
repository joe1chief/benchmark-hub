meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChemBench Build Process
  description: >-
    Paper-aligned ChemBench flow: manual and semi-programmatic chemistry questions enter a standardized,
    canary-protected schema, pass two-scientist and automated review, form the 2,788-item corpus and 236-item Mini
    subset, then use model-aware prompting and robust parsing to compare models, tool-augmented systems, and 19
    chemists.
  legend: Solid arrows show corpus curation and evaluation; dashed arrows show parallel sources and the human baseline.
nodes:
  - id: manual
    label: |-
      Manually Curated Sources: 1,039 QA Pairs
      Novel Questions • University Exams
      Exercise Sheets and Question Banks
    type: user
    size: xl
    position:
      x: 40
      'y': 40
  - id: programmatic
    label: |-
      Semi-programmatic Sources: 1,749 QA Pairs
      Curated Chemical Databases + Generated Variants
      Include Chemical-preference and Intuition Tasks
    type: database
    size: xl
    position:
      x: 40
      'y': 400
  - id: schema
    label: |-
      Submit Questions through GitHub Pull Requests
      BIG-bench-style Standard Schema
      Encode Molecules, Equations, Units, and Answer Types
    type: document
    size: xl
    position:
      x: 340
      'y': 220
  - id: canary
    label: |-
      Add BIG-bench Canary String
      Ask Model Developers to Filter Training Data
      Reduce Benchmark Contamination Risk
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: review
    label: |-
      Quality Gate before Merge
      Original Curator + At Least Two Scientists
      Automated Standard-schema Checks
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: labels
    label: |-
      Annotate Every Question
      Chemistry Topic • Required Skill • Difficulty
      Knowledge • Reasoning • Calculation • Intuition
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: corpus
    label: |-
      Release Full ChemBench Corpus
      2,788 QA Pairs
      2,544 Multiple-choice + 244 Open-ended
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: mini
    label: |-
      Curate ChemBench-Mini: 236 Questions
      Keep All Advanced Items; Cap Topic/skill Combinations
      Balance Topics and Skills for Routine Evaluation
    type: database
    size: xl
    position:
      x: 1840
      'y': 40
  - id: system
    label: |-
      Evaluate Models or Tool-augmented Systems
      Accept Any System Returning Text
      Use Full Corpus or ChemBench-Mini
    type: process
    size: xl
    position:
      x: 1840
      'y': 400
  - id: prompt
    label: |-
      Apply Model-aware Prompt Templates
      Completion vs Instruction-tuned Formats
      Normalize SMILES, LaTeX, Equations, and Units
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: inference
    label: |-
      Generate Deterministically
      Greedy Decoding • Temperature 0
      Request Structured Answer + Confidence 1–5
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: parse
    label: |-
      Robust Multi-stage Parsing
      Extract Answer Tags, Choice Letters, and Numbers
      Word-to-number Regex; LLM Fallback if Rules Fail
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: human
    label: |-
      Human Baseline on ChemBench-Mini
      Web Survey of 19 Chemistry Experts
      Some Conditions Permit Tools such as Web Search
    type: user
    size: xl
    position:
      x: 3040
      'y': 400
  - id: report
    label: |-
      Score Correctness and Confidence
      Compare Models, Agents, and Chemists
      Publish Topic/skill Breakdowns and Leaderboards
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 140
