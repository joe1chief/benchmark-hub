meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChemBench Build Process
  description: >-
    Nature Chemistry-aligned ChemBench flow: 1,039 manually curated and 1,749 semi-programmatic questions enter a
    canary-protected extended BIG-bench schema, pass scientist and automated review, form the 2,788-item corpus and the
    236-item Mini subset, and are evaluated with model-aware prompts, separate answer and confidence elicitation, robust
    parsing, and a 19-chemist baseline.
  legend: Solid arrows show corpus curation and answer evaluation; dashed arrows show derived subsets and auxiliary evidence.
