  - from: corpus
    to: system
    type: primary
  - from: mini
    to: prompt
    type: data
  - from: system
    to: prompt
    type: primary
  - from: prompt
    to: inference
    type: primary
  - from: inference
    to: parse
    type: primary
  - from: parse
    to: report
