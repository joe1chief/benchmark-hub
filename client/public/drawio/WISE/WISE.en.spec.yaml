meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WISE Paper Protocol Build and Evaluation
  description: >-
    The paper builds 1,000 knowledge-intensive text-to-image prompts across 25 subdomains from educational materials,
    encyclopedias and public references, common-sense problem sets, and LLM-assisted candidates. Human annotators
    rewrite or discard candidates to enforce visual answerability, one inferable target, stable facts, natural wording,
    explicit expected visual cues, and prompt-answer-explanation consistency. After the benchmark is finalized, Table 4
    reports a descriptive cultural-distribution audit: full WISE is 56.6% global/neutral, 22.6% Western, and 20.8%
    non-Western; the Cultural Common Sense subset is 17.75%, 41.50%, and 40.75%, respectively. The paper specifies
    neither an acceptance threshold nor a rebalance loop. Generated images are scored by GPT-4o-2024-05-13 on
    consistency, realism, and aesthetic quality from 0 to 2, and WiScore is (0.7C + 0.2R + 0.1A) / 2. This entry is
    pinned to the paper protocol rather than the later binary WISE_Verified repository default.
  legend: >-
    Source: WISE arXiv:2503.07265v4, Section 3.1 and Tables 3-4 for sourcing, quality control, and the descriptive
    cultural-distribution audit; Section 3.2 Equation (1) and Appendices D-E for WiScore; Appendices H-I for seed and
    human validation; official repository https://github.com/PKU-YuanGroup/WISE. Version pin: this entry follows the
    paper WiScore protocol, not the repository-default WISE_Verified maintenance protocol. Table 4 is an audit, not a
    build gate.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
