meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BLINK Build Process
  description: >-
    Paper-aligned visual-perception dataset construction and multimodal evaluation workflow for BLINK, based on
    arXiv:2404.12390 and the ECCV 2024 paper.
  legend: >-
    Solid arrows show dataset construction and model scoring; dashed arrows identify human, caption-only, and visual
    prompt diagnostic branches.
nodes:
  - id: task_selection
    label: |-
      Select 14 Visual Perception Tasks
      Pixel Matching • 3D and Geometry
      Affordance • Similarity • Visual Commonsense
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: geometry_sources
    label: |-
      Reuse Geometric Vision Data
      HPatches • IIW • DIW • VSR • Wild6D
      Ground-Truth Points, Depth, and Motion
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: perception_sources
    label: |-
      Reuse Perception Datasets
      TARA • WikiArt • LVIS • TallyQA
      DreamSim • SPair-71k • FunKPoint
    type: database
    size: xl
    position:
      x: 320
      'y': 220
  - id: new_sources
    label: |-
      Collect New Forensics and IQ Data
      SDXL from COCO Captions + Matched Real Photos
      License-Friendly Visual Pattern Problems
    type: database
    size: xl
    position:
      x: 320
      'y': 400
  - id: task_instances
    label: |-
      Construct Task-Specific Instances
      Sample Points, Frames, Boxes, Patches, and Counts
      Derive Correct Choices from Source Annotations
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: mcqa
    label: |-
      Recast Every Task as Multiple Choice
      Single- or Multi-Image Questions
      Text or Image Answer Options
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: visual_prompts
    label: |-
      Add Visual Prompts
      Circles • Boxes • Masks • Reference Points
      Interleave Images and Text
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: qc
    label: |-
      Enforce Unique Images and Manual QC
      Inspect All Collected Data
      Remove Ambiguous Items
    type: process
    size: xl
    position:
      x: 1440
      'y': 220
  - id: release
    label: |-
      Release BLINK
      3,807 Questions over About 7.3K Images
      Validation 1,901 • Test 1,906
    type: database
    size: xl
    position:
      x: 1720
      'y': 220
  - id: model_setup
    label: |-
      Configure Multimodal Models
      Temperature 0 • Retry up to 10
      No Resize; Concatenate Images if Required
    type: process
    size: xl
    position:
      x: 1720
      'y': 500
  - id: answer_parse
    label: |-
      Extract the Model Choice
      Apply Predefined Parsing Rules
      Use GPT-3.5-Turbo for Remaining Outputs
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: human_reference
    label: |-
      Establish Human Reference
      Fast Perception on the Same Tasks
      95.70% Average Test Accuracy
    type: user
    size: xl
    position:
      x: 880
      'y': 740
  - id: caption_analysis
    label: |-
      Run Caption + Text-Only LLM
      GPT-4V Makes Task-Agnostic Dense Captions
      Test Whether Vision Can Be Reduced to Language
    type: process
    size: xl
    position:
      x: 1160
      'y': 740
  - id: prompt_analysis
    label: |-
      Test Visual Prompt Sensitivity
      Change Circle Size and Color
      Measure Robustness of Marked Regions
    type: process
    size: xl
    position:
      x: 1720
      'y': 740
  - id: report
    label: |-
      Report Visual Perception Gap
      Overall and 14-Task Accuracy
      Compare Random, Human, MLLM, and Specialists
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 960
edges:
  - from: task_selection
    to: geometry_sources
    type: primary
  - from: task_selection
    to: perception_sources
    type: primary
  - from: task_selection
    to: new_sources
    type: primary
  - from: geometry_sources
    to: task_instances
    type: primary
  - from: perception_sources
    to: task_instances
    type: primary
  - from: new_sources
    to: task_instances
    type: primary
  - from: task_instances
    to: mcqa
    type: primary
  - from: mcqa
    to: visual_prompts
    type: primary
  - from: visual_prompts
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: model_setup
    type: primary
  - from: model_setup
    to: answer_parse
    type: primary
  - from: release
    to: human_reference
    type: optional
  - from: answer_parse
    to: caption_analysis
    type: optional
  - from: answer_parse
    to: prompt_analysis
    type: optional
  - from: human_reference
    to: report
    type: data
  - from: caption_analysis
    to: report
    type: data
  - from: prompt_analysis
    to: report
    type: data
  - from: answer_parse
    to: report
    type: primary
modules: []
