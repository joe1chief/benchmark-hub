meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BLINK 构建流程
  description: 基于 arXiv:2404.12390，对齐论文的 BLINK 视觉感知任务选择、多选题转换、图像整理和多模态模型评测流程。
  legend: 实线表示 BLINK 数据集构建与评测主流程；虚线表示人类参考和图像转 caption 分析路径。
nodes:
  - id: task_design
    label: |-
      14 个经典 CV 任务
      从低层匹配到 3D 推理
      超越识别能力
    type: document
    size: xl
    position:
      x: 40
      'y': 160
  - id: image_sources
    label: |-
      图像收集
      复用已有数据集
      新采集数据
      真实与合成图像
    type: database
    size: xl
    position:
      x: 300
      'y': 70
  - id: mcqa_conversion
    label: |-
      多选问答转换
      文本或图像选项
      单图与多图问题
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: visual_prompts
    label: |-
      视觉提示
      高亮特定区域
      图文交错格式
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: dataset_split
    label: |-
      BLINK 数据集
      3,807 题 / 7.3K 图像
      每个测试样本图像唯一
    type: database
    size: xl
    position:
      x: 820
      'y': 160
  - id: human_eval
    label: |-
      人类评测
      快速视觉感知题
      平均准确率 95.70%
    type: user
    size: xl
    position:
      x: 1080
      'y': 70
  - id: model_eval
    label: |-
      多模态 LLM 评测
      类 VLMEvalKit 设置
      温度 0 并重试
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 250
  - id: analysis
    label: |-
      感知差距报告
      准确率与随机基线
      视觉提示和 caption 分析
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: task_design
    to: mcqa_conversion
    type: primary
  - from: image_sources
    to: mcqa_conversion
    type: data
  - from: mcqa_conversion
    to: visual_prompts
    type: primary
  - from: visual_prompts
    to: dataset_split
    type: primary
  - from: dataset_split
    to: human_eval
    type: optional
    label: 人类参考
  - from: dataset_split
    to: model_eval
    type: primary
  - from: human_eval
    to: analysis
    type: data
  - from: model_eval
    to: analysis
    type: primary
  - from: analysis
    to: model_eval
    type: optional
    label: caption 与提示分析
modules: []
