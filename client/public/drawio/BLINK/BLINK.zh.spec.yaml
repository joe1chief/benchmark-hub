meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BLINK 构建流程
  description: 展示论文对齐构建与评测，并把固定 HF 发布与 README 计数不一致分开。
  legend: 实线表示数据构建与模型评分；虚线表示人类、纯描述和视觉提示诊断分支。
nodes:
  - id: task_selection
    label: |-
      选择 14 类视觉感知任务
      像素匹配 • 三维与几何
      功能对应 • 相似性 • 视觉常识
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: geometry_sources
    label: |-
      复用几何视觉数据
      HPatches • IIW • DIW
      VSR • Wild6D
      标准点位、深度与运动
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: perception_sources
    label: |-
      复用感知数据集
      TARA • WikiArt • LVIS
      TallyQA • DreamSim
      SPair-71k • FunKPoint
    type: database
    size: xl
    position:
      x: 320
      'y': 220
  - id: new_sources
    label: |-
      新收集取证与 IQ 数据
      COCO 描述驱动 SDXL
      + 匹配真实照片
      许可证友好的视觉规律题
    type: database
    size: xl
    position:
      x: 320
      'y': 400
  - id: task_instances
    label: |-
      构造任务特定样本
      采样点、帧、框和拼图块
      推导计数与正确选项
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: mcqa
    label: |-
      把全部任务改写为选择题
      单图或多图问题
      文本或图像答案选项
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: visual_prompts
    label: |-
      添加视觉提示
      圆圈 • 边框 • 掩码 • 参考点
      交错图像与文本
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: qc
    label: |-
      保证图像唯一并人工质检
      检查全部收集数据
      移除歧义样本
    type: process
    size: xl
    position:
      x: 1440
      'y': 220
  - id: canonical_release
    label: |-
      论文 + HF 标准发布
      3,807 题 • 7,358 张图像
      验证集 1,901 • 测试集 1,906
      HF 修订 a3666eb
    type: database
    size: xl
    position:
      x: 1720
      'y': 220
  - id: readme_drift
    label: |-
      README 计数不一致
      榜单写测试集 1,907
      论文与固定 HF 写 1,906
    type: document
    size: xl
    position:
      x: 2000
      'y': 220
  - id: model_setup
    label: |-
      配置多模态模型
      温度 0 • 最多重试 10 次
      不缩放；不支持多图时拼接图像
    type: process
    size: xl
    position:
      x: 1720
      'y': 500
  - id: answer_parse
    label: |-
      提取模型选择
      先用预定义解析规则
      其余由 GPT-3.5-Turbo 回退解析
    type: process
    size: xl
    position:
      x: 2000
      'y': 500
  - id: human_reference
    label: |-
      建立人类参考
      在相同任务上快速感知
      测试集平均准确率 95.70%
    type: user
    size: xl
    position:
      x: 880
      'y': 740
  - id: caption_analysis
    label: |-
      运行描述 + 纯文本 LLM
      GPT-4V 生成任务无关密集描述
      检验视觉能否被约化为语言
    type: process
    size: xl
    position:
      x: 1160
      'y': 740
  - id: prompt_analysis
    label: |-
      测试视觉提示敏感性
      改变圆圈大小和颜色
      衡量对标记区域的鲁棒性
    type: process
    size: xl
    position:
      x: 1720
      'y': 740
  - id: report
    label: |-
      汇报视觉感知差距
      总体与 14 类任务准确率
      比较随机、人类、MLLM 与专用模型
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 960
edges:
  - from: task_selection
    to: geometry_sources
    type: primary
  - from: task_selection
    to: perception_sources
    type: primary
  - from: task_selection
    to: new_sources
    type: primary
  - from: geometry_sources
    to: task_instances
    type: primary
  - from: perception_sources
    to: task_instances
    type: primary
  - from: new_sources
    to: task_instances
    type: primary
  - from: task_instances
    to: mcqa
    type: primary
  - from: mcqa
    to: visual_prompts
    type: primary
  - from: visual_prompts
    to: qc
    type: primary
  - from: qc
    to: canonical_release
    type: primary
  - from: canonical_release
    to: readme_drift
    type: data
  - from: canonical_release
    to: model_setup
    type: primary
  - from: model_setup
    to: answer_parse
    type: primary
  - from: canonical_release
    to: human_reference
    type: optional
    waypoints:
      - x: 1864
        'y': 660
      - x: 884
        'y': 660
  - from: answer_parse
    to: caption_analysis
    type: optional
  - from: answer_parse
    to: prompt_analysis
    type: optional
  - from: human_reference
    to: report
    type: data
    waypoints:
      - x: 1120
        'y': 900
      - x: 1400
        'y': 900
      - x: 1400
        'y': 1010
  - from: caption_analysis
    to: report
    type: data
  - from: prompt_analysis
    to: report
    type: data
  - from: answer_parse
    to: report
    type: primary
    waypoints:
      - x: 2320
        'y': 560
      - x: 2320
        'y': 900
      - x: 1584
        'y': 900
modules: []
