meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenSkillEval Build and Evaluation Process
  description: >-
    Paper-aligned dynamic case generation, time-sensitive community-skill curation, unified agent execution, and
    complementary trajectory and artifact evaluation.
  legend: >-
    The current paper version contains 677 cases across five task families and a snapshot of 30 high-adoption community
    skills.
nodes:
