      Define Five Task Families
      Presentation Generation
      Web Poster and Visualization
      Report Generation
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Collect Category-specific Sources
      Current Webpages and Documents
      Awarded Websites and Poster Materials
      Open Data and Tabular Datasets
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: snapshot
    label: |-
      Preserve Source Packages
      Snapshot Artifacts and Materials
      Store Source Brief and Data Files
      Ground Every Future Request
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: extract
    label: |-
      Reverse-construct User Intent
      Claude-4.6-Opus and GPT-5.2
      Follow Task-specific Schemas
      Infer Constraints and Expected Output
    type: process
    size: xl
    position:
      x: 740
      'y': 40
