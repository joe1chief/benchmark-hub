meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenSkillEval 构建与评测流程
  description: 依据论文，动态生成案例、按时间快照整理社区技能、统一运行Agent，并从轨迹和最终工件两条通道评测。
  legend: 论文当前版本包含五类任务共677个案例，以及按高社区采用度筛选的30个社区skill快照。
nodes:
  - id: families
    label: |-
      定义五类任务
      演示文稿生成
      网页海报与数据可视化
      报告生成
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      按类别收集来源
      最新网页和文档
      获奖网站与海报素材
      开放数据及表格数据集
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: snapshot
    label: |-
      保存来源包
      快照工件和源材料
      存储source brief与数据文件
      为后续请求提供依据
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: extract
    label: |-
      反向构造用户意图
      使用Claude-4.6-Opus和GPT-5.2
      遵循任务专用模式
      推断约束与预期输出
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: specs
    label: |-
      创建结构化任务规格
      写入task_input JSON
      记录目标与要求
      把分析关联到来源内容
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: instruction
    label: |-
      创建自然语言指令
      写入instruction Markdown
      与结构化规格保持一致
      维持真实请求风格
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: verify
    label: |-
      验证生成案例
      Verifier LLM检查完整性
      检查依据与一致性
      过滤薄弱或无支持案例
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: cases
    label: |-
      发布动态案例集
      来源包加规格加指令
      覆盖五类应用
      共677个任务实例
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: skills
    label: |-
      收集社区技能
      来自ClawHub、Skills.sh等
      按任务家族匹配skill
      视为特定时间快照
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: curate
    label: |-
      按社区采用度筛选
      以下载量为信号
      采用成本敏感选择
      保留30个skill
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: runner
    label: |-
      运行统一Agent实验
      使用Harbor与Docker隔离
      比较无skill和强制使用设置
      记录输出成本与轨迹
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: trajectory
    label: |-
      评估Agent轨迹
      用ATIF归一化轨迹
      Agent裁判拆分skill步骤
      测量读取遵循跳过与违背
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: artifact
    label: |-
      评估最终工件
      任务专用VLM与量规
      截图交互及代码检查
      评判质量完整性与准确性
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      审计Agent与Skill
      报告家族及总体质量
      测量技能增益多样性Token时间
      比较成本性能权衡
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: families
    to: sources
    type: primary
  - from: sources
    to: snapshot
    type: primary
  - from: snapshot
    to: extract
    type: primary
  - from: extract
    to: specs
    type: primary
  - from: specs
    to: instruction
    type: primary
  - from: instruction
    to: verify
    type: primary
  - from: verify
    to: cases
    type: primary
  - from: cases
    to: skills
    type: primary
  - from: skills
    to: curate
    type: primary
  - from: curate
    to: runner
    type: primary
  - from: runner
    to: trajectory
    type: primary
  - from: trajectory
    to: artifact
    type: primary
  - from: artifact
    to: report
    type: primary
modules: []
