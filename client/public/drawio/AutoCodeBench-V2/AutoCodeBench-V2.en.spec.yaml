meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench-V2 Build and Evaluation Process
  description: >-
    Evidence-bounded view separating the original AutoCodeGen paper from the later official V2 release,
    proprietary-model and sandbox refinement, updated dataset, and documented V2 evaluation tutorial.
  legend: >-
    Read left-to-right, then right-to-left; the orange node marks the boundary between paper and later official V2
    evidence.
nodes:
