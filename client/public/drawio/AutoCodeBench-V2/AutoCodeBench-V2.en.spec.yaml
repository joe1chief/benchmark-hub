    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: schema
    label: |-
      V2 Record Contract
      question + signature + output
      full_test_func + language + difficulty
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: predict
    label: |-
      Official Quick Start: Model Output
      Replace the output Field
      Required Single Fenced-Code System Prompt
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: sandbox
    label: |-
      V2 Sandbox Verification
      hunyuansandbox/multi-language-sandbox:v2
