    label: |-
      Paper-Documented AutoCodeGen
      Stack-Edu Seeds + LLM-Sandbox Interaction
      Reverse-Order Problems + Three Filters
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: original
    label: |-
      Paper Output: AutoCodeBench
      3,920 Problems / 20 Languages
      Published as autocodebench.jsonl
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: boundary
    label: |-
      Separate Official V2 Release
      Not Defined in the August 2025 Paper
      Announced December 4, 2025
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: release
    label: |-
      Iterative V2 Refinement
      Start from the Original Dataset
      Top Proprietary Models + Sandbox Feedback
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: snapshot
    label: |-
      V2 Dataset Releases
      Initial: 1,000 Problems / 20 Languages
      Feb. 17, 2026 Bug-Fixed Snapshot: 998
    type: database
    size: xl
    position:
      x: 1160
      'y': 100
  - id: distribution
    label: |-
      Difficulty Distribution
      Initial 136/218/646; Fixed 136/217/645
