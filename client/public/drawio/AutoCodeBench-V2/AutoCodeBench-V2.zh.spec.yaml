meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench-V2 构建与评测流程
  description: 以证据边界区分原始 AutoCodeGen 论文与后续官方 V2 发布、闭源模型和沙箱迭代精炼、 更新数据集及已公开的 V2 评测教程。
  legend: 先从左到右、再从右到左阅读；橙色节点区分论文与后续官方 V2 证据。
nodes:
  - id: paper
    label: |-
      论文记载的 AutoCodeGen
      Stack-Edu 种子 + LLM-沙箱交互
      逆向生成题目 + 三阶段过滤
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: original
    label: |-
      论文产物：AutoCodeBench
      3,920 题 / 20 种语言
      发布为 autocodebench.jsonl
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: boundary
    label: |-
      独立的官方 V2 发布
      2025年8月论文未定义该版本
      2025年12月4日正式宣布
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: release
    label: |-
      V2 迭代精炼
      从原始数据集出发
      顶级闭源模型 + 沙箱反馈
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: snapshot
    label: |-
      V2 数据发布
      初版：1,000题 / 20种语言
      2026年2月17日修正版：998题
    type: database
    size: xl
    position:
      x: 1160
      'y': 100
  - id: distribution
    label: |-
      难度分布
      初版136/218/646；修正版136/217/645
      与原3,920题完全相同的题面为0
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: schema
    label: |-
      V2 记录结构
      question + signature + output
      full_test_func + language + difficulty
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: predict
    label: |-
      官方 Quick Start：模型输出
      替换 output 字段
      使用指定的单围栏代码系统提示
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: sandbox
    label: |-
      V2 沙箱验证
      hunyuansandbox/multi-language-sandbox:v2
      call_sandbox.py 并发数 32
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: report
    label: |-
      V2 可执行结果
      用 full_test_func 验证答案
      Pass@1 榜单与分项统计
    type: terminal
    size: xl
    position:
      x: 600
      'y': 440
edges:
  - from: paper
    to: original
    type: primary
  - from: original
    to: boundary
    type: primary
  - from: boundary
    to: release
    type: primary
  - from: release
    to: snapshot
    type: primary
  - from: snapshot
    to: distribution
    type: primary
  - from: distribution
    to: schema
    type: primary
  - from: schema
    to: predict
    type: primary
  - from: predict
    to: sandbox
    type: primary
  - from: sandbox
    to: report
    type: primary
modules: []
