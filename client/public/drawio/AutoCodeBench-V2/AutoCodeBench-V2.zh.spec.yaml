meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench-V2 构建流程
  description: 基于 arXiv:2508.09101，对齐 AutoCodeBench 系列的 AutoCodeGen 流程：多语言种子抽取、 沙箱测试生成、逆向题目生成、三阶段过滤、系列子集构建与 Pass@1 评测。
  legend: 实线表示自动化构建与评测主流程；虚线表示沙箱验证和质量控制反馈。
nodes:
  - id: seeds
    label: |-
      Stack-Edu 种子
      GitHub 教育代码
      函数/类/文件级
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: solutions
    label: |-
      解法生成
      DeepSeek-V3 few-shot
      自包含代码
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: sandbox
    label: |-
      沙箱验证
      支持 20+ 语言
      可执行性检查
    type: terminal
    size: xl
    position:
      x: 300
      'y': 250
  - id: tests
    label: |-
      测试函数
      公开 <=3 用例
      私有 7+ 边界用例
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: problem_generation
    label: |-
      逆向生成题目
      语言与 I/O 规格
      不暴露解法提示
    type: document
    size: xl
    position:
      x: 820
      'y': 70
  - id: filtering
    label: |-
      三阶段过滤
      10 次采样控难度
      R1 评判与标注
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: benchmark
    label: |-
      AutoCodeBench
      3,920 道题
      20 语言 / 14 类别
    type: database
    size: xl
    position:
      x: 1080
      'y': 70
  - id: series
    label: |-
      系列变体
      ACB-Lite 按通过数
      ACB-Complete 测基座
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: evaluation
    label: |-
      模型评测
      Pass@1
      30+ LLM 标准提示
    type: process
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: seeds
    to: solutions
    type: primary
  - from: solutions
    to: sandbox
    type: primary
  - from: sandbox
    to: tests
    type: primary
  - from: tests
    to: problem_generation
    type: primary
  - from: problem_generation
    to: filtering
    type: primary
  - from: filtering
    to: benchmark
    type: primary
  - from: benchmark
    to: series
    type: primary
  - from: series
    to: evaluation
    type: primary
  - from: sandbox
    to: solutions
    type: optional
    label: 修复失败
  - from: filtering
    to: problem_generation
    type: optional
    label: 丢弃或重生成
modules: []
