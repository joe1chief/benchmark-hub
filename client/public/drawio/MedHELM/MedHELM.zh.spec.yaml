meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHELM 构建与评测流程
  description: 对齐论文与官方平台，展示分类体系验证、35 个基准组装、九模型统一评测、LLM 评审验证、 宏平均胜率聚合及成本报告，覆盖 121 项医学任务。
  legend: 18 个新形成的基准由 5 个重构基准与 13 个全新基准组成；13 个全新基准中有 12 个基于 EHR， 35 个基准中有 14 个因隐私保持私有。
nodes:
  - id: draft
    label: |-
      起草医学任务分类体系
      五个大类
      21 个子类
      98 项候选任务
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: clinicians
    label: |-
      招募 29 名临床医生
      覆盖 14 个医学专业
      来自四家机构
      审查覆盖度与任务映射
    type: user
    size: xl
    position:
      x: 260
      'y': 40
  - id: validation
    label: |-
      验证并完善分类体系
      任务映射一致率 96.7%
      完整性评分 4.21 / 5
      吸收 107 条意见
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: finaltaxonomy
    label: |-
      定稿任务分类体系
      五个大类
      22 个子类
      121 项医学任务
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: existing
    label: |-
      映射 17 个现有基准
      复用成熟任务
      将每项对齐分类体系
      保留标准评测方法
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: reformulated
    label: |-
      重构五个数据集合
      定义标准提示词
      定义标准指标
      将数据集合转为基准
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: newbenchmarks
    label: |-
      构建 13 个全新基准
      补足代表不足的工作流任务
      其中 12 个使用 EHR 数据
      与 Stanford Health Care 合作
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: suite
    label: |-
      形成 35 基准套件
      覆盖全部 22 个子类
      13 个开放式 · 22 个封闭式
      14 公开 · 7 受限 · 14 私有
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: contract
    label: |-
      定义每个基准样本
      上下文 · 提示 · 指标
      适用时提供标准参考
      保留任务专属语义
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: models
    label: |-
      评测九个前沿模型
      使用统一提示设置
      使用统一解码设置
      记录响应与词元用量
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: scoring
    label: |-
      按输出类型评分
      封闭题用精确匹配或 Micro-F1
      开放题用三模型 LLM 评审团
      评审提示不使用思维链
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: jury
    label: |-
      汇总评审团评分
      GPT-4o · Claude 3.7 Sonnet
      Llama 3.3 70B
      准确性 · 完整性 · 清晰度
      全部九个 1 至 5 分评分取平均
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: juryvalidation
    label: |-
      验证 LLM 评审团
      20 名医生 · 31 + 25 个输出
      对照 ACI-Bench 与 MEDIQA
      评审 ICC 0.47 对人工 ICC 0.43
    type: user
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      发布性能与成本结果
      计算成对归一化胜率
      对 35 个基准做宏平均
      成本价格冻结于 2025-05-12
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
