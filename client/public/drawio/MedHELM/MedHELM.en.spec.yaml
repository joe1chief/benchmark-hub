meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHELM Build and Evaluation Process
  description: >-
    Paper- and official-platform-aligned taxonomy validation, 35-benchmark assembly, uniform nine-model evaluation, jury
    validation, macro win-rate aggregation, and cost reporting across 121 medical tasks.
  legend: >-
    The 18 newly formulated benchmarks comprise five reformulations plus 13 new benchmarks; 12 of the 13 new benchmarks
    are EHR-based, and 14 of all 35 benchmarks remain private.
