meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MCPMark Construction, Release, Execution, Verification, and Metrics
  description: >-
    Evidence-bounded reconstruction from arXiv:2509.24002v1, the nearest preprint-era official release v1.2.0 at commit
    bc5f8382081eb88d95bb28ffcad9536d681d0426, and the current MCPMark Verified payload at commit
    84faaca88f418032c038f0f2e4ce1ed17b2f72b5. The paper does not identify an exact repository commit.
  legend: >-
    Solid arrows follow benchmark construction, quality control, paper evaluation, task-specific verification, and
    default four-run aggregation plus declared single-run exceptions. Dashed arrows audit the declared paper-era
    reconstruction pin and the non-comparable current Verified task set; they are evidence branches, not construction
    stages.
nodes:
  - id: c1
    label: |-
      C1 · Select Five MCP Environments
      Notion · GitHub · Filesystem
      PostgreSQL · Playwright
      Realistic CRUD Workflows
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: c2
    label: |-
      C2 · Curate 38 Initial States
      Marketplace Templates · Repositories
      Folder Trees · Template Databases
      Authored + WebArena Local Sites
      Mixed Licenses · Appendix H
    type: database
    module: construction
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 8
  - id: c3
    label: |-
      C3 · I — Exploration
      Human Expert + Task-creation Agent
      Start from a High-level Topic
      Gather Broad and Deep Context
    type: user
    module: construction
    size: xl
    position:
      x: 600
      'y': 192
    style:
      fontSize: 9
  - id: c4
    label: |-
      C4 · II — Evolvement
      Refine the Natural-language Instruction
      Remove Hints · Harder Information Seeking
      More Processing + Integrated Steps
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 192
    style:
      fontSize: 8
  - id: c5
    label: |-
      C5 · III — Verification Co-design
      Task Agent Drafts verify.py
      Expert + Execution Agent Solve the Task
      Refine Checks against Every Requirement
    type: process
    module: construction
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 8
  - id: c6
    label: |-
      C6 · Stress-test the Verifier
      Test the Correct Final State
      Perturb State for Incorrect Outcomes
      Cover Edge Cases · Objective Pass / Fail
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 8
  - id: c7
    label: |-
      C7 · IV — Iterate and Finalize
      Repeat Evolvement + Verification
      Raise Difficulty; Keep Realism
      10 Experts · 3–5 Hours per Task
      Task Agent May Be Bypassed; Verifier Remains
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 688
    style:
      fontSize: 8
  - id: q1
    label: |-
      Q1 · Layered Quality Control
      Human-expert Cross-review
      Month-long Community Check
      Extra Validation for Every Task
      Unsolved by All Evaluated Models
    type: user
    module: release
    size: xl
    position:
      x: 1160
      'y': 688
    style:
      fontSize: 8
  - id: r1
    label: |-
      R1 · Paper-v1 Inventory
      127 Tasks · 38 Initial States
      FS 30 · Notion 28 · Playwright 25
      GitHub 23 · PostgreSQL 21
      Avg 288.6 Words · 209.8 Verifier LOC
    type: database
    module: release
    size: xl
    position:
      x: 880
      'y': 688
    style:
      fontSize: 8
  - id: r2
    label: |-
      R2 · Published Task Contract
      description.md · meta.json · verify.py
      Instruction + Initial State + Verifier
      Repo Code under Apache-2.0
      Some States External / Credentialed
    type: document
    module: release
    size: xl
    position:
      x: 600
      'y': 688
    style:
      fontSize: 8
  - id: r3
    label: |-
      R3 · Paper-era Evidence Boundary
      arXiv:2509.24002v1 · One Revision
      Paper Names No Repository Commit
      Declared Reconstruction Pin: v1.2.0
      Commit bc5f838 · Not Claimed Exact
    type: document
    module: release
    size: xl
    position:
      x: 320
      'y': 688
    style:
      fontSize: 8
  - id: r4
    label: |-
      R4 · Current Verified Drift
      Payload 84faaca · HEAD cd45b7f
      Same 127 Standard + 50 Easy Tasks
      46 Descriptions + 55 Verifiers Changed
      Pinned Servers · Earlier Results Deprecated
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 688
    style:
      fontSize: 8
  - id: e1
    label: |-
      E1 · Restore the Task Sandbox
      Provision Service-specific Environment
      Load the Defined Initial State
      Isolate One Task Attempt
    type: process
    module: evaluation
    size: xl
    position:
      x: 600
      'y': 1200
    style:
      fontSize: 9
  - id: e2
    label: |-
      E2 · Enforce Prompt / Tool Boundary
      Generic System Prompt + Task Instruction
      Expose Only MCP Tool Schemas
      Verifier Stays Evaluator-side
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1200
    style:
      fontSize: 8
  - id: e3
    label: |-
      E3 · Route Model and MCP Calls
      MCP Python SDK Configures Servers / Tools
      LiteLLM Uses OpenAI Function Schema
      Native Anthropic Extended-thinking Path
    type: process
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1200
    style:
      fontSize: 8
  - id: e4
    label: |-
      E4 · Run the Tool-calling Loop
      Model Emits JSON Tool Arguments
      MCP Returns Results; Model Adapts
      No Tool Call → Final-response Stop
      Max 100 Turns · 3,600-second Timeout
    type: process
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1200
    style:
      fontSize: 8
  - id: e5
    label: |-
      E5 · Persist and Parse Evidence
      execution.log + messages.json
      18 / 127 Verifiers Read Transcript
      Task-specific Last-assistant / Output Parsers
      No Global Final-answer Parser
    type: document
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1680
    style:
      fontSize: 8
  - id: e6
    label: |-
      E6 · Run Programmatic Verification
      verify.py Runs Even after Agent Failure
      Inspect Final State + Parsed Output as Needed
      Exit Code 0 → Pass; Else / Exception → Fail
    type: process
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1680
    style:
      fontSize: 8
  - id: e7
    label: |-
      E7 · Reset and Repeat
      Cleanup + Restore Original State
      Default: Four Independent Runs per Task
      Declared Single-run Models: One Run
      Resume Completed Runs
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1680
    style:
      fontSize: 8
  - id: m1
    label: |-
      M1 · Build Binary Success Matrix
      execution_result.success
      Verifier Overrides Agent Self-report
      127 × 4 Default · 127 × 1 Single-run
    type: database
    module: metrics
    size: xl
    position:
      x: 600
      'y': 1680
    style:
      fontSize: 9
  - id: m2
    label: |-
      M2 · Compute Reliability Metrics
      pass@1: Mean of Available Run Accuracies
      pass@4: At Least One of Four Passes
      pass⁴: All Four Runs Pass
      Last Two Undefined for Single-run Models
    type: process
    module: metrics
    size: xl
    position:
      x: 320
      'y': 1680
    style:
      fontSize: 8
  - id: m3
    label: |-
      M3 · Gate and Aggregate
      Require Each Model's Expected Run Count
      Aggregate Only Complete Valid Models
      Micro-average All 127 + Per-service Views
      pass@1 Mean ± Population Std
    type: process
    module: metrics
    size: xl
    position:
      x: 40
      'y': 1680
    style:
      fontSize: 8
  - id: m4
    label: |-
      M4 · Report Paper-v1 Evidence
      GPT-5-medium: 52.56 ± 1.29 pass@1
      pass@4 68.50 · pass⁴ 33.86
      Across Evaluated LLMs: Avg 16.2 Turns
      and 17.4 Tool Calls
      Do Not Compare Directly with Verified
    type: terminal
    module: metrics
    size: xl
    position:
      x: 40
      'y': 2016
    style:
      fontSize: 8
