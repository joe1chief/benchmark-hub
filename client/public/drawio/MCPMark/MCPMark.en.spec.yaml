meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCPMark Build Process
  description: >-
    Reconstructs MCPMark's curated state selection, four-stage human-AI task creation, programmatic verifier testing,
    month-long quality control, sandbox lifecycle, and four-run reliability metrics.
  legend: >-
    Each of the 127 CRUD-diverse tasks binds one natural-language instruction to a curated initial state and a
    programmatic verifier. Pass⁴ requires all four independent runs to succeed.
nodes:
  - id: services
    label: |-
      Select Five MCP Environments
      Filesystem · Notion · Playwright
      GitHub · PostgreSQL
      Cover Realistic CRUD Workflows
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: states
    label: |-
      Curate 38 Initial States
      Templates · Repositories · Webpages
      Folder Trees · Databases
      Mirror Real Application Scenarios
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: explore
    label: |-
      I · Explore the Environment
      Human Expert + Task-creation Agent
      Follow a Real-world Topic
      Gather Broad and Deep Context
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: evolve
    label: |-
      II · Evolve the Instruction
      Remove Unnecessary Hints
      Increase Search and Processing Burden
      Require More Interaction Steps
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: verify_design
    label: |-
      III · Develop the Verifier
      Task Agent Drafts a Script
      Expert + Execution Agent Solve the Task
      Align Script with Every Requirement
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: test_verifier
    label: |-
      Test Both Verifier Outcomes
      Check the Successful Final State
      Perturb the State to Force Failure
      Refine until Both Are Detected
    type: decision
    size: xl
    position:
      x: 1420
      'y': 40
  - id: iterate
    label: |-
      IV · Iterate Design and Verification
      Repeat Evolvement and Verification
      Raise Difficulty Progressively
      Preserve Realism and Verifiability
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: release
    label: |-
      Assemble 127 Tasks
      Instruction + Initial State + Verifier
      Diverse Create · Read · Update · Delete
      Five Real-world MCP Services
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: qa
    label: |-
      Apply Benchmark Quality Control
      Human-expert Cross-review
      Month-long Community Check
      Revalidate Every Unsolved Task
    type: decision
    size: xl
    position:
      x: 860
      'y': 420
  - id: execute
    label: |-
      Run MCPMark-Agent in a Sandbox
      Restore the Defined Initial State
      Standard Tool-calling Loop
      Explicitly Track Environment State
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: check_reset
    label: |-
      Verify and Reset Every Attempt
      Programmatically Check Final State
      Require All Task Checks to Pass
      Reset to Prevent Side Effects
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: metrics
    label: |-
      Four-run Reliability Metrics
      Pass@1 · Mean Single-run
      Pass@4 · Any Run Succeeds
      Pass⁴ · All Runs Succeed
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: services
    to: states
    type: primary
  - from: states
    to: explore
    type: primary
  - from: explore
    to: evolve
    type: primary
  - from: evolve
    to: verify_design
    type: primary
  - from: verify_design
    to: test_verifier
    type: primary
  - from: test_verifier
    to: iterate
    type: primary
  - from: iterate
    to: release
    type: primary
  - from: release
    to: qa
    type: primary
  - from: qa
    to: execute
    type: primary
  - from: execute
    to: check_reset
    type: primary
  - from: check_reset
    to: metrics
    type: primary
modules: []
