meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCPMark 构建流程
  description: 按论文还原 MCPMark 的初始状态策展、四阶段人机协作任务创建、程序化验证器测试、为期一个月的质控、沙盒生命周期和四次运行可靠性指标。
  legend: 127 个 CRUD 多样任务均绑定一条自然语言指令、一个精心策展的初始状态和一个程序化验证器；Pass⁴ 要求四次独立运行全部成功。
nodes:
  - id: services
    label: |-
      选择五个 MCP 环境
      Filesystem · Notion · Playwright
      GitHub · PostgreSQL
      覆盖真实 CRUD 工作流
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: states
    label: |-
      策展 38 个初始状态
      模板 · 代码仓库 · 网页
      目录树 · 数据库
      模拟真实应用场景
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: explore
    label: |-
      第一阶段 · 探索环境
      人类专家与任务创建智能体协作
      围绕真实主题展开
      收集广泛而深入的环境上下文
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: evolve
    label: |-
      第二阶段 · 演化任务指令
      删除不必要提示
      增加检索和处理负担
      要求更多交互步骤
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: verify_design
    label: |-
      第三阶段 · 开发验证器
      任务智能体起草验证脚本
      专家和执行智能体完成任务
      让脚本覆盖每一项要求
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: test_verifier
    label: |-
      测试验证器正反结果
      检查成功的最终状态
      扰动状态以制造失败
      迭代到两种结果均能识别
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: iterate
    label: |-
      第四阶段 · 迭代设计与验证
      重复演化和验证阶段
      逐步提高任务难度
      保持真实性与可验证性
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: release
    label: |-
      汇总 127 个任务
      指令 + 初始状态 + 验证器
      创建 · 读取 · 更新 · 删除
      覆盖五个真实 MCP 服务
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: qa
    label: |-
      执行基准质量控制
      人类专家交叉复审
      为期一个月的社区检查
      额外复核所有模型均未解出的题
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: execute
    label: |-
      在沙盒运行 MCPMark-Agent
      恢复预定义初始状态
      执行标准工具调用循环
      显式跟踪环境状态
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: check_reset
    label: |-
      每次尝试后验证并重置
      程序化检查最终环境状态
      所有任务检查均须通过
      重置环境以避免副作用
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: metrics
    label: |-
      四次运行可靠性指标
      Pass@1 · 单次成功率均值
      Pass@4 · 任一次成功
      Pass⁴ · 四次全部成功
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: services
    to: states
    type: primary
  - from: states
    to: explore
    type: primary
  - from: explore
    to: evolve
    type: primary
  - from: evolve
    to: verify_design
    type: primary
  - from: verify_design
    to: test_verifier
    type: primary
  - from: test_verifier
    to: iterate
    type: primary
  - from: iterate
    to: release
    type: primary
  - from: release
    to: qa
    type: primary
  - from: qa
    to: execute
    type: primary
  - from: execute
    to: check_reset
    type: primary
  - from: check_reset
    to: metrics
    type: primary
modules: []
