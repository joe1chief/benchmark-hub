meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MCPMark 构建、发布、执行、验证与指标流程
  description: >-
    基于 arXiv:2509.24002v1、最接近预印本时期的官方 v1.2.0 版本（提交 bc5f8382081eb88d95bb28ffcad9536d681d0426）以及当前 MCPMark Verified
    任务载荷（提交 84faaca88f418032c038f0f2e4ce1ed17b2f72b5）进行证据有界重建；论文未给出精确仓库提交。
  legend: 实线表示基准构建、质量控制、论文评测、任务专属验证和默认四次运行聚合及已声明单跑例外；虚线审计声明的论文时期重建锚点及不可直接比较的当前 Verified 任务集，它们是证据分支而非构建阶段。
nodes:
  - id: c1
    label: |-
      C1 · 选择五类 MCP 环境
      Notion · GitHub · Filesystem
      PostgreSQL · Playwright
      面向真实 CRUD 工作流
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: c2
    label: |-
      C2 · 策展 38 个初始状态
      市场模板 · 代码仓库
      目录树 · 模板数据库
      自建 + WebArena 本地站点
      混合许可证 · 见附录 H
    type: database
    module: construction
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 8
  - id: c3
    label: |-
      C3 · 第一阶段 — 探索
      人类专家 + 任务创建智能体
      从高层主题出发
      收集广泛而深入的上下文
    type: user
    module: construction
    size: xl
    position:
      x: 600
      'y': 192
    style:
      fontSize: 9
  - id: c4
    label: |-
      C4 · 第二阶段 — 演化
      优化自然语言指令
      删除提示 · 增加信息检索难度
      提高处理负担与综合步骤数
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 192
    style:
      fontSize: 8
  - id: c5
    label: |-
      C5 · 第三阶段 — 协同设计验证器
      任务智能体起草 verify.py
      专家 + 执行智能体完成任务
      逐项要求细化检查逻辑
    type: process
    module: construction
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 8
  - id: c6
    label: |-
      C6 · 压测验证器
      测试正确的最终状态
      扰动状态以产生错误结果
      覆盖边界条件 · 客观判定通过 / 失败
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 8
  - id: c7
    label: |-
      C7 · 第四阶段 — 迭代并定稿
      重复演化 + 验证
      提高难度并保持真实性
      10 位专家 · 每题投入 3–5 小时
      可跳过任务智能体；验证器仍保留
    type: process
    module: construction
    size: xl
    position:
      x: 1440
      'y': 688
    style:
      fontSize: 8
  - id: q1
    label: |-
      Q1 · 分层质量控制
      人类专家交叉复审
      为期一个月的社区检查
      对所有受测模型均未解出的任务
      逐一追加验证
    type: user
    module: release
    size: xl
    position:
      x: 1160
      'y': 688
    style:
      fontSize: 8
  - id: r1
    label: |-
      R1 · 论文 v1 清单
      127 个任务 · 38 个初始状态
      FS 30 · Notion 28 · Playwright 25
      GitHub 23 · PostgreSQL 21
      平均 288.6 词 · 验证器 209.8 行
    type: database
    module: release
    size: xl
    position:
      x: 880
      'y': 688
    style:
      fontSize: 8
  - id: r2
    label: |-
      R2 · 已发布任务契约
      description.md · meta.json · verify.py
      指令 + 初始状态 + 验证器
      仓库代码采用 Apache-2.0
      部分状态依赖外部资源 / 凭据
    type: document
    module: release
    size: xl
    position:
      x: 600
      'y': 688
    style:
      fontSize: 8
  - id: r3
    label: |-
      R3 · 论文时期证据边界
      arXiv:2509.24002v1 · 仅一个版本
      论文未给出仓库提交
      声明的重建锚点：v1.2.0
      提交 bc5f838 · 不宣称完全对应
    type: document
    module: release
    size: xl
    position:
      x: 320
      'y': 688
    style:
      fontSize: 8
  - id: r4
    label: |-
      R4 · 当前 Verified 漂移
      载荷 84faaca · HEAD cd45b7f
      同 127 个标准任务 + 50 个简单任务
      46 条描述 + 55 个验证器已变更
      固定服务器版本 · 早期结果已弃用
    type: document
    module: release
    size: xl
    position:
      x: 40
      'y': 688
    style:
      fontSize: 8
  - id: e1
    label: |-
      E1 · 恢复任务沙盒
      配置服务专属环境
      加载预定义初始状态
      隔离单次任务尝试
    type: process
    module: evaluation
    size: xl
    position:
      x: 600
      'y': 1200
    style:
      fontSize: 9
  - id: e2
    label: |-
      E2 · 约束提示词 / 工具边界
      通用系统提示 + 任务指令
      仅暴露 MCP 工具模式
      验证器留在评测侧
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1200
    style:
      fontSize: 8
  - id: e3
    label: |-
      E3 · 路由模型与 MCP 调用
      MCP Python SDK 配置服务器 / 工具
      LiteLLM 采用 OpenAI 函数模式
      Anthropic 扩展思考走原生路径
    type: process
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1200
    style:
      fontSize: 8
  - id: e4
    label: |-
      E4 · 执行工具调用循环
      模型生成 JSON 工具参数
      MCP 返回结果；模型据此调整
      无工具调用 → 以最终回复停止
      最多 100 轮 · 超时 3,600 秒
    type: process
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1200
    style:
      fontSize: 8
  - id: e5
    label: |-
      E5 · 持久化并解析证据
      execution.log + messages.json
      18 / 127 个验证器读取对话记录
      任务专属末条助手回复 / 输出解析器
      不存在全局最终答案解析器
    type: document
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1680
    style:
      fontSize: 8
  - id: e6
    label: |-
      E6 · 执行程序化验证
      智能体失败后仍运行 verify.py
      按需检查最终状态 + 解析结果
      退出码 0 → 通过；否则 / 异常 → 失败
    type: process
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1680
    style:
      fontSize: 8
  - id: e7
    label: |-
      E7 · 重置并重复运行
      清理 + 恢复原始状态
      默认每题四次独立运行
      已声明单跑模型每题一次
      续跑已完成任务
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1680
    style:
      fontSize: 8
  - id: m1
    label: |-
      M1 · 构建二值成功矩阵
      execution_result.success
      验证器覆盖智能体自报结果
      默认 127×4 · 单跑 127×1
    type: database
    module: metrics
    size: xl
    position:
      x: 600
      'y': 1680
    style:
      fontSize: 9
  - id: m2
    label: |-
      M2 · 计算可靠性指标
      pass@1：可用运行准确率均值
      pass@4：四次中至少一次通过
      pass⁴：四次全部通过
      单跑模型不计算后两项
    type: process
    module: metrics
    size: xl
    position:
      x: 320
      'y': 1680
    style:
      fontSize: 8
  - id: m3
    label: |-
      M3 · 完整性门控与聚合
      要求各模型预期运行数齐全
      仅聚合完整且有效的模型结果
      127 题微平均 + 分服务视图
      pass@1 均值 ± 总体标准差
    type: process
    module: metrics
    size: xl
    position:
      x: 40
      'y': 1680
    style:
      fontSize: 8
  - id: m4
    label: |-
      M4 · 报告论文 v1 证据
      GPT-5-medium：pass@1 52.56 ± 1.29
      pass@4 68.50 · pass⁴ 33.86
      跨受测模型平均 16.2 轮
      与 17.4 次工具调用
      不可与 Verified 直接比较
    type: terminal
    module: metrics
    size: xl
    position:
      x: 40
      'y': 2016
    style:
      fontSize: 8
