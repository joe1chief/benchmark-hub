meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: LongVideoBench 构建、发布与评测流程
  description: >-
    基于 NeurIPS 2024 Datasets and Benchmarks 正式论文、官方加载器提交 fc3c553250cfee6853a722f9b181f1b69f478426、主数据快照
    60d1c89c1919a198b73be39c2babb213b29d6a5c，以及公开元数据快照 cdf3444602208c95f453e7683583a077ce38ddbf 的证据边界复原。
  legend: 实线表示构建、发布、推理和评分主流程；点线或虚线表示访问及可复现性边界。论文视频数量与固定公开元数据中的 实际计数分开呈现；测试标签和原生测试评分器仍未公开。
nodes:
  - id: b1
    label: |-
      B1 · 定义覆盖网格
      4 个不连续时长区间
      (8,15] · (15,60] 秒
      (180,600] · (900,3600] 秒
      10 个内容类别
    type: process
    module: build
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: b2
    label: |-
      B2 · 下载网页视频
      119 个频道 · 横屏 99 + 竖屏 20
      官方平台 API · 2024 年 4 月
      接受分辨率 ≥ 720P
    type: database
    module: build
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 9
  - id: d1
    label: 平台提供转录字幕？
    type: decision
    module: build
    size: xl
    position:
      x: 600
      'y': 192
  - id: b3
    label: |-
      已有转录字幕路径
      剔除缺失字幕的视频
      剔除非英语字幕的视频
      保留带时间戳英语文本
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 64
    style:
      fontSize: 9
  - id: b4
    label: |-
      无转录字幕路径
      生成英语字幕
      Whisper-V3-Large
      保留时间戳
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 320
    style:
      fontSize: 9
  - id: b5
    label: |-
      B3 · 采样与质量过滤
      均匀覆盖主题 / 10 个类别
      Q-Align 分数范围 [0,1]
      仅保留分数 > 0.25
    type: process
    module: build
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 9
  - id: b6
    label: |-
      B4 · 人工过滤视频
      剔除静帧 / 字幕不完整视频
      论文最终数量 · 3,763 个视频
      视频 + 英语字幕
    type: database
    module: build
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 9
  - id: a1
    label: |-
      B5 · 培训有经验的合同标注者
      受控实验室 · 按题型培训
      显示时间对齐字幕
      标注前完整观看视频
    type: user
    module: build
    size: xl
    position:
      x: 1440
      'y': 688
    style:
      fontSize: 9
  - id: a2
    label: |-
      B6 · 编写引用推理多选题
      L1 感知 + L2 关系
      17 个细粒度题型
      4–5 个选项 · 3–4 个相关干扰项
    type: document
    module: build
    size: xl
    position:
      x: 1160
      'y': 688
    style:
      fontSize: 9
  - id: a3
    label: |-
      B7 · 定位被引用上下文
      包含并突出引用查询
      为每个引用时刻标注帧索引
      覆盖单个或多个时刻
    type: process
    module: build
    size: xl
    position:
      x: 880
      'y': 688
    style:
      fontSize: 9
  - id: a4
    label: |-
      B8 · 三角色质量控制
      主标注者命题并剔除视频
      检查者核对题型 / 规则
      修订者修复被标记条目
      20% 被判有问题并修订
    type: user
    module: build
    size: xl
    position:
      x: 600
      'y': 688
    style:
      fontSize: 9
  - id: r1
    label: |-
      R1 · 论文拆分合同
      无训练集 · 验证 20% / 测试 80%
      验证 · 1,337 题 / 752 视频
      测试 · 5,341 题 / 3,011 视频
      测试标签隐藏
    type: database
    module: release
    size: xl
    position:
      x: 320
      'y': 688
    style:
      fontSize: 9
  - id: r2
    label: |-
      R2 · 固定 Meta · cdf34446
      6,678 行 · 验证 1,337 / 测试 5,341
      唯一视频 ID · 验证 753 / 测试 3,008
      论文视频数 · 752 / 3,011
      明确标示数据发布漂移
    type: database
    module: release
    size: xl
    position:
      x: 40
      'y': 688
    style:
      fontSize: 8
  - id: r3
    label: |-
      R3 · 主数据集 · 60d1c89c
      需同意访问 · CC BY-NC-SA 4.0
      视频 / 字幕归档 + JSON
      验证标签公开 · 测试标签 = −1
      仅限非商业使用
    type: database
    module: release
    size: xl
    position:
      x: 40
      'y': 944
    style:
      fontSize: 8
  - id: r4
    label: |-
      发布 / 评测边界
      GitHub 加载器 · fc3c5532
      固定仓库没有原生评分器
      README 指向可变的 LMMs-Eval main
      测试经邮件提交 · 隐藏评分
    type: document
    module: release
    size: xl
    position:
      x: 320
      'y': 944
    style:
      fontSize: 8
  - id: e1
    label: |-
      E1 · 载入一个拆分
      原始 MP4 + 字幕 JSON + 元数据
      问题 + 4–5 个选项
      验证 correct_choice 为 0–4 · 测试为 −1
    type: database
    module: evaluate
    size: xl
    position:
      x: 40
      'y': 1280
    style:
      fontSize: 9
  - id: e2
    label: |-
      E2 · 均匀采样视频帧
      num_frames = min(预算, int(时长))
      每秒最多 1 帧
      论文在验证集比较 1–256 帧
    type: process
    module: evaluate
    size: xl
    position:
      x: 320
      'y': 1280
    style:
      fontSize: 9
  - id: e3
    label: |-
      E3 · 交错视频帧与文本
      按字幕中点时间戳排序
      固定加载器仅在采样帧覆盖
      字幕时段时保留该字幕
    type: process
    module: evaluate
    size: xl
    position:
      x: 600
      'y': 1280
    style:
      fontSize: 9
  - id: e4
    label: |-
      E4 · 追加多选提示
      问题 + 带字母选项
      要求直接返回选项字母
      不要求思维链
    type: document
    module: evaluate
    size: xl
    position:
      x: 880
      'y': 1280
    style:
      fontSize: 9
  - id: d2
    label: 评测拆分？
    type: decision
    module: evaluate
    size: xl
    position:
      x: 1160
      'y': 1280
  - id: e5
    label: |-
      验证集 · 选择设置
      零样本 · 比较不同帧预算
      为每个模型选择最优设置
      标签公开
    type: process
    module: evaluate
    size: xl
    position:
      x: 1440
      'y': 1120
    style:
      fontSize: 9
  - id: e6
    label: |-
      测试集 · 固定已选设置
      对 5,341 题做零样本评测
      返回 A / B / C / D / E
      提交 JSON · 测试标签隐藏
    type: process
    module: evaluate
    size: xl
    position:
      x: 1440
      'y': 1440
    style:
      fontSize: 9
  - id: m1
    label: |-
      M1 · 多项选择准确率
      正确预测数 / 总题数
      不使用辅助裁判模型
      提交可接受字母开头字符串
      精确测试评分器未公开
    type: formula
    module: evaluate
    size: xl
    position:
      x: 1720
      'y': 1280
    style:
      fontSize: 8
  - id: m2
    label: |-
      M2 · 报告与排行榜
      验证总分 + 测试总分
      4 个时长区间准确率
      17 个题型准确率
      引用查询深度分析
    type: terminal
    module: evaluate
    size: xl
    position:
      x: 2000
      'y': 1280
    style:
      fontSize: 9
