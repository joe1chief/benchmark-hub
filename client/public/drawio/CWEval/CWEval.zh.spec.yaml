meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CWEval 构建流程
  description: 按论文展示任务设计，并连接固定官方仓库的 Docker 隔离生成与双判定执行器。
  legend: 实线表示构建与执行主流程；两个分支表示对同一代码样本分别执行功能和安全判定。
nodes:
  - id: cwe
    label: |-
      CWE 文档
      安全关键编程行为
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: evidence_boundary
    label: |-
      论文 §§III–V + 官方仓库
      框架：arXiv 2501.08200v1
      仓库执行器：8112fb4
    type: document
    size: xl
    position:
      x: 300
      'y': 210
  - id: design
    label: |-
      自包含任务设计
      尽量隔离第三方依赖
    type: process
    size: xl
    position:
      x: 560
      'y': 210
  - id: specification
    label: |-
      清晰任务规格
      函数签名 · 文档字符串 · 可选样例
    type: document
    size: xl
    position:
      x: 820
      'y': 210
  - id: requirements
    label: |-
      规格要求
      安全语义 · 不泄漏安全提示 · 无歧义
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: functional
    label: |-
      功能判定器
      预期输入 / 输出行为
    type: process
    size: xl
    position:
      x: 1340
      'y': 70
  - id: security
    label: |-
      安全判定器
      输出 · 时间 · 内存 · 副作用
    type: process
    size: xl
    position:
      x: 1340
      'y': 350
  - id: references
    label: |-
      双参考实现
      安全版通过两类判定
      不安全版功能通过、安全失败
    type: document
    size: xl
    position:
      x: 1600
      'y': 210
  - id: verify
    label: |-
      专家验证
      漏洞可复现且可在不损功能时修复
    type: user
    size: xl
    position:
      x: 1860
      'y': 210
  - id: benchmark
    label: |-
      CWEval-bench
      119 个任务 · 31 个 CWE · 5 种语言
      11 个 C 内存漏洞任务
    type: database
    size: xl
    position:
      x: 2120
      'y': 210
  - id: c_specific
    label: |-
      语言特定覆盖
      含 11 个 C 内存漏洞任务
    type: document
    size: xl
    position:
      x: 2120
      'y': 390
  - id: generate
    label: |-
      官方样本生成
      cweval/generate.py gen
      每题 n 个样本
    type: process
    size: xl
    position:
      x: 2380
      'y': 210
  - id: execute
    label: |-
      Docker 隔离评测
      cweval/evaluate.py pipeline
      运行两类判定器
    type: process
    size: xl
    position:
      x: 2640
      'y': 210
  - id: metrics
    label: |-
      func@k 与 func-sec@k
      逐题无偏估计
      E_tasks[1 -
      C(n - c, k) / C(n, k)]
      c_func：功能测试全通过
      c_func-sec：功能与安全测试全通过
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 210
edges:
  - from: cwe
    to: evidence_boundary
    type: primary
  - from: evidence_boundary
    to: design
    type: primary
  - from: design
    to: specification
    type: primary
  - from: specification
    to: requirements
    type: primary
  - from: requirements
    to: functional
    type: primary
  - from: requirements
    to: security
    type: primary
  - from: functional
    to: references
    type: primary
  - from: security
    to: references
    type: primary
  - from: references
    to: verify
    type: primary
  - from: verify
    to: benchmark
    type: primary
  - from: benchmark
    to: c_specific
    type: data
  - from: benchmark
    to: generate
    type: primary
  - from: generate
    to: execute
    type: primary
  - from: execute
    to: metrics
    type: primary
modules: []
