  - from: requirements
    to: security
    type: primary
  - from: functional
    to: references
    type: primary
  - from: security
    to: references
    type: primary
  - from: references
    to: verify
    type: primary
  - from: verify
    to: benchmark
    type: primary
  - from: benchmark
