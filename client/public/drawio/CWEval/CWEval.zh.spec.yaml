meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CWEval 构建流程
  description: 与论文对齐的安全编码任务设计、双动态判定器验证及功能与安全联合评测流程。
  legend: 实线表示构建与执行主流程；两个分支表示对同一代码样本分别执行功能和安全判定。
nodes:
  - id: cwe
    label: |-
      CWE 文档
      安全关键编程行为
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: design
    label: |-
      自包含任务设计
      尽量隔离第三方依赖
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: specification
    label: |-
      清晰任务规格
      函数签名 · 文档字符串 · 可选样例
    type: document
    size: xl
    position:
      x: 560
      'y': 210
  - id: requirements
    label: |-
      规格要求
      安全语义 · 不泄漏安全提示 · 无歧义
    type: decision
    size: xl
    position:
      x: 820
      'y': 210
  - id: functional
    label: |-
      功能判定器
      预期输入 / 输出行为
    type: process
    size: xl
    position:
      x: 1080
      'y': 70
  - id: security
    label: |-
      安全判定器
      输出 · 时间 · 内存 · 副作用
    type: process
    size: xl
    position:
      x: 1080
      'y': 350
  - id: references
    label: |-
      双参考实现交叉验证
      安全版全过 · 不安全版安全测试失败
    type: document
    size: xl
    position:
      x: 1340
      'y': 210
  - id: verify
    label: |-
      专家验证
      漏洞可复现且可在不损功能时修复
    type: user
    size: xl
    position:
      x: 1600
      'y': 210
  - id: benchmark
    label: |-
      CWEval-bench
      119 个任务 · 31 个 CWE · 5 种语言
    type: database
    size: xl
    position:
      x: 1860
      'y': 210
  - id: c_specific
    label: |-
      语言特定覆盖
      含 11 个 C 内存漏洞任务
    type: document
    size: xl
    position:
      x: 1860
      'y': 390
  - id: generate
    label: |-
      LLM 代码生成
      为每题采样一个或多个实现
    type: process
    size: xl
    position:
      x: 2120
      'y': 210
  - id: execute
    label: |-
      结果驱动执行
      每个样本同时运行两类判定器
    type: process
    size: xl
    position:
      x: 2380
      'y': 210
  - id: metrics
    label: |-
      func@k · func-sec@k
      无偏 pass@k 式估计
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 210
