meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NL2Repo-Bench Build and Evaluation Process
  description: >-
    Paper-aligned repository selection, AST-assisted specification reverse engineering, environment and quality
    verification, and upstream-pytest evaluation of agents building installable Python libraries from scratch.
  legend: >-
    Read task construction left-to-right, then from-scratch agent evaluation right-to-left; only the requirements
    document is visible during generation, while source code and official tests remain hidden.
nodes:
  - id: candidates
    label: |-
      Real-World Python Libraries
      GitHub Open-Source Repositories
      Modular Architecture + Native pytest
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: selection
    label: |-
      Four Repository Criteria
      300-120,000 LOC | >= 10 Stars
      pytest + Updated within 3 Years
    type: decision
    size: xl
    position:
      x: 320
      'y': 100
  - id: baseline
    label: |-
      Human Clone-and-Test Gate
      Review Structure and Dependencies
      Retain Only Native All-Pass Repositories
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: reverse_engineer
    label: |-
      AST-Assisted Reverse Engineering
      Extract Classes / Functions / Signatures
      Reconstruct Tested Behavior Case by Case
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: specification
    label: |-
      Single Requirements Document
      Description + Supports + API Guide
      Implementation Notes where Applicable
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: qa
    label: |-
      Multi-Stage Quality Assurance
      Expert Review + Static API Coverage
      Pilot Agents + Senior-Engineer Refinement
    type: decision
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      NL2Repo-Bench Release
      104 Tasks across 9 Categories
      Dedicated Verified Docker Image per Task
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: visibility
    label: |-
      Minimal Agent Starting State
      Empty Workspace + One Requirements Doc
      No Scaffold / Source / Tests / Signatures
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: build
    label: |-
      Long-Horizon Agent Construction
      Architecture + Dependencies + Multi-File Logic
      Produce a Fully Installable Python Library
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: package
    label: |-
      Package Generated Workspace
      Load into Task Evaluation Image
      Isolate Environment from Agent Choice
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: pytest
    label: |-
      Authoritative Upstream pytest
      Run Original Repository Test Suite
      Continue Collected Tests despite Collection Errors
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Execution-Based Results
      Average Test Pass Rate per Task
      Overall Score + Fully Passed Pass@1 Count
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
