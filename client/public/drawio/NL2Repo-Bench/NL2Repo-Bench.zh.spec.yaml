meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NL2Repo-Bench 构建与评测流程
  description: 按论文展示仓库筛选、AST 辅助需求文档逆向、环境与质量验证，以及 agent 从零构建可安装 Python 库后的上游 pytest 评测。
  legend: 先从左到右阅读任务构建，再从右到左阅读从零生成评测；生成时只公开需求文档，源码与官方测试保持隐藏。
nodes:
  - id: candidates
    label: |-
      真实 Python 库
      GitHub 开源仓库
      模块化架构 + 原生 pytest
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: selection
    label: |-
      四项仓库标准
      300-120,000 行｜至少 10 星
      含 pytest + 三年内有更新
    type: decision
    size: xl
    position:
      x: 320
      'y': 100
  - id: baseline
    label: |-
      人工克隆与测试门
      检查结构和依赖
      仅保留原生测试全通过仓库
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: reverse_engineer
    label: |-
      AST 辅助逆向
      提取类 / 函数 / 签名
      逐项重建被测试行为
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: specification
    label: |-
      单一需求文档
      项目描述 + 支撑信息 + API 指南
      适用时提供实现说明
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: qa
    label: |-
      多阶段质量保证
      专家审核 + 静态 API 覆盖
      先导 Agent + 高级工程师迭代
    type: decision
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      NL2Repo-Bench 发布
      104 个任务，覆盖 9 类库
      每题独立验证 Docker 镜像
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: visibility
    label: |-
      Agent 最小初始状态
      空工作区 + 一份需求文档
      无脚手架 / 源码 / 测试 / 签名
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: build
    label: |-
      长程 Agent 构建
      架构 + 依赖 + 多文件逻辑
      产出完整可安装 Python 库
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: package
    label: |-
      打包生成工作区
      装入任务评测镜像
      隔离 Agent 环境选择影响
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: pytest
    label: |-
      权威上游 pytest
      运行原仓库官方测试套件
      收集错误时仍执行已收集测试
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      执行式结果
      每题平均测试通过率
      总分 + 完整通过 Pass@1 数量
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: candidates
    to: selection
    type: primary
  - from: selection
    to: baseline
    type: primary
  - from: baseline
    to: reverse_engineer
    type: primary
  - from: reverse_engineer
    to: specification
    type: primary
  - from: specification
    to: qa
    type: primary
  - from: qa
    to: release
    type: primary
  - from: release
    to: visibility
    type: primary
  - from: visibility
    to: build
    type: primary
  - from: build
    to: package
    type: primary
  - from: package
    to: pytest
    type: primary
  - from: pytest
    to: report
    type: primary
modules: []
