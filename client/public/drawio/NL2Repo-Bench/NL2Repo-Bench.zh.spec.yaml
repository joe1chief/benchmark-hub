meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NL2Repo-Bench 构建与评测流程
  description: 按论文呈现仓库筛选、AST 辅助逆向、四部分规格撰写、环境与质量验证，以及使用隐藏上游 pytest 对从零构建仓库的评测。
  legend: 实线表示任务构建与 Agent 评测；虚线传递独立隐藏的 Docker 与上游测试资产。API 签名可见，仅因其被写在唯一规格文档内部。
nodes:
  - id: candidates
    label: |-
      真实 Python 库
      GitHub 开源仓库
      模块化项目 + 原生 pytest
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: selection
    label: |-
      仓库筛选标准
      300-120,000 行 + 至少 10 星
      pytest + 三年内创建 / 更新
    type: process
    size: xl
    position:
      x: 360
      'y': 80
  - id: baseline
    label: |-
      人工克隆与测试门
      检查结构和依赖
      仅保留原生测试全通过仓库
    type: user
    size: xl
    position:
      x: 680
      'y': 80
  - id: ast_inventory
    label: |-
      AST API 清单
      类 / 函数 / 常量
      签名 + 源码位置；排除测试
    type: process
    size: xl
    position:
      x: 1000
      'y': 80
  - id: behavior_review
    label: |-
      标注者行为审查
      输入 / 输出 / 约束
      导入路径与被测试语义
    type: user
    size: xl
    position:
      x: 1000
      'y': 300
  - id: specification
    label: |-
      四部分规格
      项目描述 + 支撑信息
      API 使用指南 + 实现节点
    type: document
    size: xl
    position:
      x: 1320
      'y': 190
  - id: docker
    label: |-
      每题独立 Docker
      上游基线测试确认有效性
      修环境；不改功能源码
    type: process
    size: xl
    position:
      x: 680
      'y': 300
  - id: qa
    label: |-
      多阶段质量保证
      专家审核 + 静态 API 覆盖
      先导 Agent + 高级工程师迭代
    type: process
    size: xl
    position:
      x: 1640
      'y': 190
  - id: release
    label: |-
      NL2Repo-Bench：104 题 / 9 类
      简单 <= 1500；中等 1500-4000 行
      困难 >= 4000（按原仓库行数）
    type: database
    size: xl
    position:
      x: 1640
      'y': 500
  - id: agent_input
    label: |-
      空工作区 + 仅规格
      无额外脚手架 / 源码 / 测试
      API 签名只在规格内
    type: document
    size: xl
    position:
      x: 1320
      'y': 500
  - id: build
    label: |-
      自主仓库构建
      Agent 可使用可用工具
      无交互轮次限制
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: package
    label: |-
      打包生成工作区
      安装到任务评测镜像
      隐藏资产始终不进入上下文
    type: process
    size: xl
    position:
      x: 680
      'y': 500
  - id: hidden_pytest
    label: |-
      原始上游 pytest 套件
      --continue-on-collection-errors
      执行全部已收集测试
    type: process
    size: xl
    position:
      x: 360
      'y': 500
  - id: avg_score
    label: |-
      每题连续分数
      平均测试通过率
      对仓库测试求均值
    type: process
    size: xl
    position:
      x: 40
      'y': 400
  - id: full_pass
    label: |-
      完整通过 Pass@1 数量
      一次运行整套测试全通过
      仓库计数；不是估计器
    type: process
    size: xl
    position:
      x: 360
      'y': 700
  - id: report
    label: |-
      NL2Repo-Bench 结果
      平均测试通过分数
      独立的完整通过仓库数
    type: terminal
    size: xl
    position:
      x: 40
      'y': 860
edges:
  - from: candidates
    to: selection
    type: primary
  - from: selection
    to: baseline
    type: primary
  - from: baseline
    to: ast_inventory
    type: primary
  - from: ast_inventory
    to: behavior_review
    type: primary
  - from: behavior_review
    to: specification
    type: primary
  - from: baseline
    to: docker
    type: data
  - from: specification
    to: qa
    type: primary
  - from: docker
    to: qa
    type: data
    waypoints:
      - x: 780
        'y': 420
      - x: 1780
        'y': 420
      - x: 1780
        'y': 240
  - from: qa
    to: release
    type: primary
  - from: release
    to: agent_input
    type: primary
  - from: agent_input
    to: build
    type: primary
  - from: build
    to: package
    type: primary
  - from: package
    to: hidden_pytest
    type: primary
  - from: docker
    to: hidden_pytest
    type: data
  - from: hidden_pytest
    to: avg_score
    type: primary
  - from: hidden_pytest
    to: full_pass
    type: secondary
  - from: avg_score
    to: report
    type: primary
  - from: full_pass
    to: report
    type: secondary
modules: []
