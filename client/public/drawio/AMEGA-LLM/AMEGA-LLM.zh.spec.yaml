meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMEGA-LLM 构建与评测流程
  description: 对齐论文的 AMEGA：医生基于指南构建临床病例，通过准则级 GPT-4 判断、失败尝试恢复、有效尝试多数投票、显式门控的 Reask、加权计分与评估器验证，完成自动化口试评测。
  legend: >-
    本图固定采用论文快照的 20 个病例、135 个问题和 1,337 项准则；官方仓库后来扩展为 24 个病例、163 个问题和 1,497 项准则。每次尝试的 Boolean 数量与准则数量不等时才算格式失败；格式失败超过 50%
    时将准则二分，每半都重新进行 11 次评估。否则对有效向量做准则多数投票与置信度计算，再决定是否 Reask。虚线验证支路是独立可靠性研究。
nodes:
  - id: guidelines
    label: |-
      选择当前临床指南
      来自权威的美国与全球医学组织
      覆盖诊断、治疗、监测与随访
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: physicians
    label: |-
      由资深医生构建基准
      每位均有超过 5 年临床经验
      选择指南并将建议转化为病例
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: cases
    label: |-
      编写 20 个虚构临床病例
      覆盖 13 个医学专科
      主诉、病史、查体、化验与影像
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: questions
    label: |-
      每病例编写 6–8 个连续问题
      总计 135 个开放式问题
      探查鉴别、检查、治疗、并发症与随访
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: rubrics
    label: |-
      定义指南衍生的加权 Rubric
      1,337 个独立评分元素
      按临床重要性加权 • 每病例最多 50 分
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      医生复核并发布 AMEGA
      每病例由至少 1 名其他医生复核
      并迭代修订
      每病例 20–30 小时
      总计超过 400 小时
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      模拟零样本临床口试
      先给初始病例，再逐题提问
      统一提示；不提供示范答案
      候选模型温度 0
    type: document
    size: xl
    position:
      x: 1720
      'y': 470
  - id: candidate
    label: |-
      候选模型回答
      回答当前临床问题
      按顺序继续完成整个病例
    type: process
    size: xl
    position:
      x: 1440
      'y': 470
  - id: evaluator
    label: |-
      GPT-4-0613 评估器
      并行运行 11 次评估尝试
      每次同时评估全部准则
      返回一个 True / False 向量
    type: process
    size: xl
    position:
      x: 1160
      'y': 470
  - id: failure_gate
    label: |-
      格式失败尝试是否 >50%？
      Boolean 数量 ≠ 准则数量
    type: decision
    size: xl
    position:
      x: 880
      'y': 470
  - id: split_criteria
    label: |-
      将准则列表拆成两半
      每一半均重新运行 11 次
      再次校验 Boolean 向量
    type: process
    size: xl
    position:
      x: 880
      'y': 740
  - id: gate
    label: 准则未满足且允许 Reask？
    type: decision
    size: xl
    position:
      x: 320
      'y': 470
  - id: reask
    label: |-
      引导式 Reask 与自我反思
      告知未满足准则
      候选补充细节
      关键错误跳过 Reask
    type: process
    size: xl
    position:
      x: 1440
      'y': 740
  - id: voting
    label: |-
      稳定准则判断
      每项准则运行 11 次并行评估
      多数投票 + 由一致率得到 0–1 置信度
    type: process
    size: xl
    position:
      x: 600
      'y': 470
  - id: score
    label: |-
      AMEGA 指南遵循结果
      布尔结果 × 临床权重
      问题分 / 病例分 • 50 分均值
      归一化缺陷 • 成本
    type: terminal
    size: xl
    position:
      x: 40
      'y': 470
  - id: validate
    label: |-
      验证评估器可靠性
      50 次模拟；11 次后趋稳
      临床专家比较 2 个病例
      抽查病例 3 与 5
    type: user
    size: xl
    position:
      x: 600
      'y': 740
edges:
  - from: guidelines
    to: physicians
    type: primary
  - from: physicians
    to: cases
    type: primary
  - from: cases
    to: questions
    type: primary
  - from: questions
    to: rubrics
    type: primary
  - from: rubrics
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: candidate
    type: primary
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: failure_gate
    type: primary
  - from: failure_gate
    to: split_criteria
    type: optional
    label: 是：拆分
  - from: split_criteria
    to: evaluator
    type: optional
    label: 分半重评
  - from: failure_gate
    to: voting
    type: primary
    label: ≤50%：投票
  - from: voting
    to: gate
    type: primary
  - from: gate
    to: reask
    type: optional
    label: 是：Reask
    waypoints:
      - x: 324
        'y': 850
      - x: 1444
        'y': 850
  - from: reask
    to: candidate
    type: optional
    label: 补充后重新评估
  - from: gate
    to: score
    type: primary
    label: 否：计分
  - from: voting
    to: validate
    type: secondary
    label: 验证研究
modules: []
