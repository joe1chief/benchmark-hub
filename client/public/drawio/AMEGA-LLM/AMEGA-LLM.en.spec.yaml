meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMEGA-LLM Build and Evaluation Process
  description: >-
    Paper-aligned physician construction of guideline-grounded clinical cases and automated oral-exam evaluation with
    criterion-level GPT-4 judgments, failed-attempt recovery, majority voting over valid attempts, explicitly gated
    reasks, weighted scores, and evaluator validation.
  legend: >-
    The diagram intentionally uses the paper snapshot of 20 cases, 135 questions, and 1,337 criteria. The current
    official repository later extends the resource to 24 cases, 163 questions, and 1,497 criteria. The solid lane
    follows the Methods order: >50% failures trigger bisection and retry; ≤50% proceeds to criterion majority vote and
    confidence before the unmet-criteria Reask decision. The dashed validation branch is a separate reliability study.
nodes:
  - id: guidelines
    label: |-
      Select Current Guidelines
      US + Global Organizations
      Diagnosis • Treatment
      Monitoring • Follow-Up
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: physicians
    label: |-
      Experienced Physicians
      >5 Years Clinical Experience
      Select Guidelines
      Translate Them into Cases
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: cases
    label: |-
      Craft 20 Fictional Cases
      13 Medical Specialties
      Complaint • History • Exam
      Labs • Imaging
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: questions
    label: |-
      Write 6–8 Sequential Questions
      135 Open-Ended Questions
      Differential • Workup • Therapy
      Complications • Follow-Up
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: rubrics
    label: |-
      Define Weighted Rubrics
      1,337 Scoring Elements
      Guideline-Derived
      Clinical Weights • 50 per Case
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Physician Review + Release
      ≥1 Additional Physician
      Iteratively Refines Each Case
      20–30 h / Case • >400 h Total
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Zero-Shot Oral Examination
      Initial Case, Then One Question
      Standardized Prompt
      No Demonstration Answers
    type: document
    size: xl
    position:
      x: 1720
      'y': 470
  - id: candidate
    label: |-
      Candidate Model Response
      Answer Current Question
      Continue through Case
    type: process
    size: xl
    position:
      x: 1440
      'y': 470
  - id: evaluator
    label: |-
      GPT-4-0613 Evaluator
      11 Parallel Evaluations
      Boolean Vector per Criterion
    type: process
    size: xl
    position:
      x: 1160
      'y': 470
  - id: failure_gate
    label: Failure Rate >50%?
    type: decision
    size: xl
    position:
      x: 880
      'y': 470
  - id: split_criteria
    label: |-
      Bisect the Criteria List
      Evaluate Both Halves
      Repeat Self-Consistency
    type: process
    size: xl
    position:
      x: 880
      'y': 740
  - id: gate
    label: |-
      Unmet Criteria +
      Reask Permitted?
    type: decision
    size: xl
    position:
      x: 320
      'y': 470
  - id: reask
    label: |-
      Guided Reask + Reflection
      Reveal Unmet Criteria
      Candidate Adds Details
      Skip Critical-Error Reask
    type: process
    size: xl
    position:
      x: 1440
      'y': 740
  - id: voting
    label: |-
      Stabilize Criterion Judgments
      11 Runs per Criterion
      Majority Vote + Confidence
    type: process
    size: xl
    position:
      x: 600
      'y': 470
  - id: score
    label: |-
      AMEGA Results
      Boolean × Clinical Weights
      Question / Case Scores
      50-Point Mean • Deficiency • Cost
    type: terminal
    size: xl
    position:
      x: 40
      'y': 470
  - id: validate
    label: |-
      Validate Evaluator
      50-Run Stability Study
      Expert Check: 2 Cases
      Spot Checks: Cases 3 and 5
    type: user
    size: xl
    position:
      x: 600
      'y': 740
