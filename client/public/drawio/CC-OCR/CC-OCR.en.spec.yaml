  title: CC-OCR Build Process
  description: >-
    Paper-aligned construction of CC-OCR: existing benchmarks, re-annotated datasets, and newly collected images are
    organized into four OCR-centric tracks and 39 subsets, annotated with text, LaTeX, HTML, JSON, and SMILES formats,
