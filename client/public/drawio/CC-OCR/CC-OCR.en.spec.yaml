meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: vertical
  routing: orthogonal
  title: CC-OCR Build Process
  description: >-
    Paper-aligned construction and evaluation of 7,058 fully annotated images in 39 subsets across four OCR-centric
    tracks, directly reusing qualified public annotations while applying the iterative annotation pipeline only to
    re-annotated or newly collected data, with task-specific output formats, metrics, and robustness diagnostics.
  legend: >-
    Solid arrows show benchmark construction and evaluation; dashed arrows carry already-qualified public annotations
    directly into the merged pool.
