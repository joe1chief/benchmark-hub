  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CC-OCR Build Process
  description: >-
    Paper-aligned construction and evaluation of 7,058 fully annotated images in 39 subsets across four OCR-centric
    tracks, combining qualified public annotations, re-annotation, and newly collected application data with
    task-specific output formats, metrics, and robustness diagnostics.
  legend: >-
    Solid arrows show benchmark construction and evaluation; dashed arrows carry source or annotation evidence into the
    shared pipeline.
