meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CC-OCR 构建流程
  description: 按论文构建并评测 CC-OCR：组合合格公开标注、重新标注与新采集应用数据，在四条 OCR 核心赛道和 39 个子集中形成 7,058 张完整标注图像，并按任务使用不同输出格式、指标与鲁棒性诊断。
  legend: 实线表示基准构建与评测，虚线表示数据来源或标注证据汇入共享流程。
nodes:
  - id: qualified_sources
    label: |-
      复用合格的公开标注
      多场景 OCR 基准
      受限类别 KIE 数据集
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: reannotated_sources
    label: |-
      重新标注选定公开数据
      多语言图像与开放类别 KIE
      把标签提升到 LMM 评测质量
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: new_sources
    label: |-
      新采集真实应用图像
      全部中文多场景与文档解析数据
      实拍文档、自然场景、网页与手写图像
    type: database
    size: xl
    position:
      x: 40
      'y': 400
  - id: source_pool
    label: |-
      汇成多样且实用的数据池
      文档 52.5% • 自然场景 36.8% • 网页 7.8%
      41% 为首次发布的真实应用图像
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: scene_track
    label: |-
      赛道 1：多场景文字识别
      印刷体 • 手写体 • 艺术字 • 畸变文字
      多方向与文字定位挑战
    type: process
    size: xl
    position:
      x: 640
      'y': 0
  - id: multilingual_track
    label: |-
      赛道 2：多语言文字识别
      英文 50.3% • 中文 28.2%
      其余十种语言共 21.5%
    type: process
    size: xl
    position:
      x: 640
      'y': 150
  - id: document_track
    label: |-
      赛道 3：文档解析
      数字文档与实拍文档
      文本 • 表格 • 公式 • 分子结构
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: kie_track
    label: |-
      赛道 4：关键信息抽取
      受限类别与开放类别
      表单、票据、证件与文档
    type: process
    size: xl
    position:
      x: 640
      'y': 450
  - id: annotation
    label: |-
      生成任务专属标注
      模型预标注 • 跨模型交叉验证
      专家人工修正与复核
    type: user
    size: xl
    position:
      x: 940
      'y': 220
  - id: formats
    label: |-
      规范化要求的输出格式
      纯文本 60.2% • JSON 28.4% • LaTeX 5.7%
      HTML 4.3% • SMILES 1.4% • 词级位置
    type: document
    size: xl
    position:
      x: 1240
      'y': 220
  - id: release
    label: |-
      发布 CC-OCR 测试集
      7,058 张完整标注图像
      四条赛道 • 39 个子集
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: inference
    label: |-
      评测代表性 LMM
      通用模型与 OCR 专用模型
      生成原生文本或结构化输出
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: task_metrics
    label: |-
      应用任务专属指标
      OCR：Eval-Trans 与 Eval-Pos • 文档：NED
      表格：TEDS • KIE：字段级 F1
    type: process
    size: xl
    position:
      x: 2140
      'y': 100
  - id: diagnostics
    label: |-
      诊断 OCR 鲁棒性
      文字定位精确率与召回率
      旋转 0°/90°/180°/270° • 重复率 R_rep
    type: process
    size: xl
    position:
      x: 2140
      'y': 340
  - id: report
    label: |-
      按赛道和子集报告结果
      比较识别、解析、抽取与鲁棒性
      揭示真实 OCR 优势与失败模式
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 220
edges:
  - from: qualified_sources
    to: source_pool
    type: data
  - from: reannotated_sources
    to: source_pool
    type: data
  - from: new_sources
    to: source_pool
    type: data
  - from: source_pool
    to: scene_track
    type: primary
  - from: source_pool
    to: multilingual_track
    type: primary
  - from: source_pool
    to: document_track
    type: primary
  - from: source_pool
    to: kie_track
    type: primary
  - from: scene_track
    to: annotation
    type: primary
  - from: multilingual_track
    to: annotation
    type: primary
  - from: document_track
    to: annotation
    type: primary
  - from: kie_track
    to: annotation
    type: primary
  - from: annotation
    to: formats
    type: primary
  - from: formats
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: task_metrics
    type: primary
  - from: inference
    to: diagnostics
    type: primary
  - from: task_metrics
    to: report
    type: primary
  - from: diagnostics
    to: report
    type: primary
modules: []
