meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TreeBench 构建与评测流程
  description: >-
    TreeBench从SA-1B按10个类别采样1000张密集目标图像。8名LMM专家先检查类别匹配与图像质量，保留647张。OpenAI o3与Gemini 2.5
    Pro分别依据感知和推理协议为每图提出3个问题；人工专家再选择、修改或替换候选题，编写答案选项与证据边界框，并剔除4个强VLM都能答对的题目。独立交叉验证最终得到覆盖10项能力的405个视觉问答对。模型必须输出选择题答案和可追溯证据框；答案准确率衡量任务正确性，mean
    IoU衡量证据定位质量，并分别报告感知与二阶推理结果。
  legend: >-
    来源：TreeBench arXiv:2507.07999, Section 3; official Haochen-Wang409/TreeVGR and TreeBench dataset
    repositories。实线箭头表示论文或官方资料明确支持的主流程。
