meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-Evo 构建流程
  description: 对齐论文的发布级任务构建、执行过滤、人工复核与部分进展评测流程。
  legend: 上排从左向右完成构建，下排从右向左完成发布级软件演进评测。
nodes:
  - id: seeds
    label: |-
      SWE-bench + SWE-gym 种子池
      代码库快照与执行环境
      人类变更与对应测试
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: tags
    label: |-
      选择版本发布转换
      基准提交精确对应版本标签
      与下一个版本标签配对
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: specification
    label: |-
      构建发布级需求规格
      两版本发布说明之差
      追加明确关联的 PR / Issue 原文
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: artifacts
    label: |-
      构造演进实例
      发布前代码库 + 测试补丁
      起止版本标准补丁
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: execution
    label: |-
      执行式过滤
      至少需要一个 FAIL_TO_PASS
      排除安装或运行错误
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: manual
    label: |-
      人工质量复核
      对齐说明、关联上下文、补丁与测试
      从数百候选筛至 48 题
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-Evo
      7 个仓库的 48 个发布级任务
      平均修改 21 个文件、运行 874 个测试
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      智能体输入
      以发布说明为中心的需求规格
      完整发布前代码库
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: patch
    label: |-
      智能体协调多步骤修改
      输出模型补丁
      应用到代码库
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tests
    label: |-
      运行可执行测试合同
      全部 FAIL_TO_PASS + PASS_TO_PASS
      保持原有行为
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      发布演进指标
      问题解决率 + 补丁应用率
      修复率；发生回归则记零
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: seeds
    to: tags
    type: primary
  - from: tags
    to: specification
    type: primary
  - from: specification
    to: artifacts
    type: primary
  - from: artifacts
    to: execution
    type: primary
  - from: execution
    to: manual
    type: primary
  - from: manual
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: metrics
    type: primary
modules: []
