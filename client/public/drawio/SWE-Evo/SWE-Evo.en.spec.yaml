meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-Evo Build Process
  description: >-
    Paper-aligned release-level task construction, execution filtering, human verification, and partial-progress
    evaluation.
  legend: Read the construction row left-to-right, then the release-sized evaluation row right-to-left.
nodes:
  - id: seeds
    label: |-
      SWE-bench + SWE-gym Seed Pool
      Repository Snapshots and Environments
      Human-Authored Changes and Tests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: tags
    label: |-
      Select Release Transitions
      Base Commit Exactly Matches Version Tag
      Pair with Next Tagged Version
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: specification
    label: |-
      Build Release-Level Specification
      Release-Note Delta
      Append Explicitly Linked PR / Issue Text
    type: document
    size: xl
    position:
      x: 600
      'y': 100
  - id: artifacts
    label: |-
      Construct Evolution Instance
      Pre-Release Codebase + Test Patch
      Start-to-End Gold Patch
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: execution
    label: |-
      Execution-Based Filtering
      Require at Least One FAIL_TO_PASS
      Reject Install or Runtime Errors
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: manual
    label: |-
      Human Quality Verification
      Align Note, Linked Context, Patch, Tests
      Reduce Hundreds to 48 Tasks
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-Evo
      48 Release-Sized Tasks / 7 Repositories
      Avg 21 Files and 874 Tests per Task
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Agent Input
      Release-Centered Specification
      Complete Pre-Release Codebase
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: patch
    label: |-
      Agent Coordinates Multi-Step Edits
      Output Model Patch
      Apply to Repository
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tests
    label: |-
      Run Executable Test Contract
      All FAIL_TO_PASS + PASS_TO_PASS
      Preserve Existing Behavior
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Release Evolution Metrics
      Resolved Rate + Patch Apply Rate
      Fix Rate; Regression => Zero
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: seeds
    to: tags
    type: primary
  - from: tags
    to: specification
    type: primary
  - from: specification
    to: artifacts
    type: primary
  - from: artifacts
    to: execution
    type: primary
  - from: execution
    to: manual
    type: primary
  - from: manual
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: metrics
    type: primary
modules: []
