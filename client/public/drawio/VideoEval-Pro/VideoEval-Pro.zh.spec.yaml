meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VideoEval-Pro 筛选构建与开放回答评测流程
  description: >-
    VideoEval-Pro从Video-MME、MLVU、LVBench与LongVideoBench收集5562道多选题，丢弃干扰项转为开放短答，再依次过滤：视频须长于10分钟、原答案选项平均不超过5词、由Gemini 2.0
    Flash判断无选项时可答、并删除Gemini仅看一张随机帧就能在多选和开放形式下都答对的简单题。最终含465个视频与1289组问答，覆盖局部/整体感知与推理。模型用32至512帧评测，GPT-4o-0806把回答标为正确、错误或未作答，以正确占比为得分，并报告任务范围与帧扩展表现。
  legend: >-
    来源：VideoEval-Pro arXiv:2505.14640, benchmark construction and evaluation sections; official TIGER-Lab
    release。实线箭头表示论文或官方资料明确支持的主流程。
