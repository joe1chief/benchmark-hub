meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ImgEdit-Bench Build Process
  description: >-
    Paper-aligned benchmark workflow: manually curated Internet images form a 734-case Basic suite, a 47-case
    Understanding-Grounding-Editing suite, and a 30-case multi-turn suite; single-turn and multi-turn outputs follow
    distinct scoring paths.
  legend: >-
    Solid arrows show benchmark construction and primary scoring. Dashed arrows mark auxiliary fake detection and the
    separately trained open ImgEdit-Judge.
