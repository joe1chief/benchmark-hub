meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MORSE-500 构建流程
  description: 按论文程序化构建并多阶段验证覆盖六类推理的 500 个内嵌问题视频，再以官方协议计算准确率。
  legend: 技术或认知质量问题会触发脚本或原型修订；每类任务通常迭代两至三轮。
nodes:
  - id: taxonomy
    label: |-
      定义推理能力分类
      抽象 · 数学
      物理 · 规划
      空间 · 时间
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: adapt
    label: |-
      识别并改造任务
      现有基准 · ARC-AGI
      数学动画 · 机器人数据
      真实及生成物理场景
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: prototype
    label: |-
      构建概念原型
      领域专家定义推理挑战
      使用 Vibe Coding 流程
      迭代校正任务语义
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: implement
    label: |-
      实现生成脚本
      Manim · Matplotlib
      OpenCV · MoviePy
      视频生成模型
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: parameterize
    label: |-
      参数化任务复杂度
      实体数量 · 推理深度
      干扰项 · 时间动态
      视觉噪声与遮挡
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: generate
    label: |-
      生成多样任务变体
      使用确定性 Python 脚本
      独立抽样复杂度参数
      保持标签可复现
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: embed
    label: |-
      合成视频任务
      将问题直接嵌入视频
      要求从时间序列提取信息
      不提供独立文本问题线索
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: auto_qc
    label: |-
      执行自动技术验证
      最低 512p 且编码正确
      检查所需视觉内容完整
      交叉核验参数与标签
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: refine_technical
    label: |-
      修复技术问题
      渲染或动画伪影
      关键视觉元素缺失
      参数与标签不一致
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: human_qc
    label: |-
      作者抽样执行人类评审
      检查清晰且答案唯一
      核验视觉与语义一致
      确认困难但人类可解
    type: user
    size: xl
    position:
      x: 980
      'y': 420
  - id: refine_quality
    label: |-
      修订认知质量问题
      修复时序与视觉对比
      处理程序生成边界情况
      每类别重复两至三轮
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      汇总 MORSE-500
      500 个视频 · 总长 3.1 小时
      抽象64 · 数学84 · 物理64
      规划100 · 空间108 · 时间80
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: inference
    label: |-
      执行标准模型推理
      原生视频模型输入完整视频
      其他模型 2 FPS · 最多 32 帧
      长边缩放至 512 像素
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: score
    label: |-
      计算准确率
      固定提示 “Answer the question in this video.”
      Qwen2.5-72B-AWQ 抽取答案
      与标准标签进行字符串匹配
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: taxonomy
    to: adapt
    type: primary
  - from: adapt
    to: prototype
    type: primary
  - from: prototype
    to: implement
    type: primary
  - from: implement
    to: parameterize
    type: primary
  - from: parameterize
    to: generate
    type: primary
  - from: generate
    to: embed
    type: primary
  - from: embed
    to: auto_qc
    type: primary
  - from: auto_qc
    to: refine_technical
    type: primary
  - from: refine_technical
    to: human_qc
    type: primary
  - from: human_qc
    to: refine_quality
    type: primary
  - from: refine_quality
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: score
    type: primary
modules: []
