meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MORSE-500 构建流程
  description: 按论文构建覆盖六类推理的 500 个内嵌问题视频，经两阶段质量保障后，以精确匹配协议评测。
  legend: 技术或认知检查失败项返回脚本修订；答案抽取异常项仍进入计分流程。来源：arXiv:2506.05523v1 第 2.1-3.1 节及官方代码提交 07743de。
nodes:
  - id: design
    label: |-
      定义六类推理能力
      改造基准、教育动画、
      机器人及物理任务
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: implement
    label: |-
      构建原型并实现脚本
      领域专家 · 氛围编程
      Manim · Matplotlib · OpenCV · MoviePy
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: generate
    label: |-
      参数化并生成任务变体
      五个复杂度维度
      确定性标签 · 视频内嵌问题
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: auto_qc
    label: |-
      自动检查是否通过？
      不低于 512p · 编码 · 内容完整
      参数与标签一致
    type: decision
    size: xl
    position:
      x: 860
      'y': 40
  - id: human_qc
    label: |-
      作者复核是否通过？
      清晰 · 答案唯一 · 视觉可证
      难度适当且人类可解
    type: decision
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      汇总 MORSE-500
      500 个视频 · 总长 3.1 小时
      抽象64 · 数学84 · 物理64
      规划100 · 空间108 · 时间80
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: repair
    label: |-
      修订脚本与参数
      修复伪影、时序及视觉对比
      每类通常迭代 2-3 轮
    type: process
    size: xl
    position:
      x: 620
      'y': 280
  - id: prepare
    label: |-
      准备评测视频
      保持原始宽高比
      最长边缩放至 512 像素
    type: process
    size: xl
    position:
      x: 1420
      'y': 520
  - id: native_route
    label: 是否支持原生视频输入？
    type: decision
    size: lg
    position:
      x: 1160
      'y': 540
  - id: full_video
    label: 输入完整视频片段
    type: process
    size: lg
    position:
      x: 900
      'y': 400
  - id: frame_input
    label: |-
      抽样图像帧
      每秒 2 帧 · 最多 32 帧
    type: process
    size: lg
    position:
      x: 900
      'y': 680
  - id: infer
    label: |-
      执行模型推理
      固定提示：回答该视频中的问题
    type: process
    size: xl
    position:
      x: 620
      'y': 540
  - id: extract
    label: |-
      抽取简短答案
      Qwen2.5-72B-Instruct-AWQ
      温度 0 · 取首个非空行
    type: process
    size: xl
    position:
      x: 340
      'y': 540
  - id: extraction_ok
    label: 抽取器调用是否成功？
    type: decision
    size: lg
    position:
      x: 80
      'y': 560
  - id: candidate
    label: |-
      使用抽取候选答案
      去除首尾空白字符
    type: process
    size: lg
    position:
      x: 80
      'y': 860
  - id: extraction_error
    label: |-
      记录字面值“Error”
      保留该行继续比较
    type: loss
    size: lg
    position:
      x: 340
      'y': 860
  - id: compare
    label: |-
      执行精确字符串比较
      排除去空后为空或字面值“non”的标准答案
      astype(str)：缺失值变“nan”后仍保留
    type: process
    size: xl
    position:
      x: 620
      'y': 840
  - id: score
    label: |-
      报告准确率
      正确数 / 剩余题数
      汇总总体及六类结果
    type: terminal
    size: xl
    position:
      x: 900
      'y': 840
edges:
  - from: design
    to: implement
    type: primary
  - from: implement
    to: generate
    type: primary
  - from: generate
    to: auto_qc
    type: primary
  - from: auto_qc
    to: human_qc
    type: primary
    label: 通过
    labelPosition: center
  - from: auto_qc
    to: repair
    type: optional
    label: 失败 · 技术问题
    labelPosition: center
  - from: human_qc
    to: release
    type: primary
    label: 通过
    labelPosition: center
  - from: human_qc
    to: repair
    type: optional
    label: 失败 · 认知问题
    labelPosition: center
  - from: repair
    to: implement
    type: optional
    label: 修订并重新生成
    labelPosition: center
    waypoints:
      - x: 720
        'y': 440
      - x: 400
        'y': 460
      - x: 400
        'y': 180
  - from: release
    to: prepare
    type: primary
  - from: prepare
    to: native_route
    type: primary
  - from: native_route
    to: full_video
    type: primary
    label: 是 · 完整视频
    labelPosition: center
  - from: native_route
    to: frame_input
    type: primary
    label: 否 · 图像帧
    labelPosition: center
  - from: full_video
    to: infer
    type: primary
  - from: frame_input
    to: infer
    type: primary
  - from: infer
    to: extract
    type: primary
  - from: extract
    to: extraction_ok
    type: primary
  - from: extraction_ok
    to: candidate
    type: primary
    label: 是 · 候选答案
    labelPosition: center
  - from: extraction_ok
    to: extraction_error
    type: optional
    label: 否 · 调用异常
    labelPosition: center
  - from: candidate
    to: compare
    type: primary
    waypoints:
      - x: 240
        'y': 780
      - x: 720
        'y': 780
  - from: extraction_error
    to: compare
    type: optional
  - from: compare
    to: score
    type: primary
modules: []
