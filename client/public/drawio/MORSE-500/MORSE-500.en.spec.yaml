    to: implement
    type: primary
  - from: implement
    to: generate
    type: primary
  - from: generate
    to: auto_qc
    type: primary
  - from: auto_qc
    to: human_qc
    type: primary
    label: Pass
    labelPosition: center
  - from: auto_qc
    to: repair
    type: optional
    label: Fail · technical
    labelPosition: center
  - from: human_qc
    to: release
    type: primary
    label: Pass
    labelPosition: center
  - from: human_qc
    to: repair
    type: optional
    label: Fail · cognitive
    labelPosition: center
  - from: repair
    to: implement
    type: optional
    label: Revise and regenerate
    labelPosition: center
    waypoints:
      - x: 720
        'y': 440
      - x: 400
        'y': 460
      - x: 400
        'y': 180
  - from: release
    to: prepare
    type: primary
  - from: prepare
    to: native_route
    type: primary
  - from: native_route
    to: full_video
    type: primary
    label: Yes · full clip
    labelPosition: center
  - from: native_route
    to: frame_input
    type: primary
    label: No · frames
    labelPosition: center
  - from: full_video
    to: infer
    type: primary
  - from: frame_input
    to: infer
    type: primary
  - from: infer
    to: extract
    type: primary
  - from: extract
    to: extraction_ok
    type: primary
  - from: extraction_ok
    to: candidate
    type: primary
    label: Yes · candidate
    labelPosition: center
  - from: extraction_ok
    to: extraction_error
    type: optional
    label: No · exception
    labelPosition: center
  - from: candidate
    to: compare
    type: primary
    waypoints:
      - x: 240
        'y': 780
      - x: 720
        'y': 780
  - from: extraction_error
    to: compare
    type: optional
  - from: compare
    to: score
    type: primary
modules: []
