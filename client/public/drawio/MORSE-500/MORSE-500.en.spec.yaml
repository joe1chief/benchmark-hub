meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MORSE-500 Build Process
  description: >-
    Paper-aligned programmatic construction and multi-stage validation of 500 question-embedded videos spanning six
    reasoning categories, followed by accuracy evaluation.
  legend: >-
    Technical or cognitive quality findings trigger script or prototype refinement; each category typically needs two to
    three iterations.
nodes:
  - id: taxonomy
    label: |-
      Define Reasoning Taxonomy
      Abstract · Mathematical
      Physical · Planning
      Spatial · Temporal
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: adapt
    label: |-
      Identify and Adapt Tasks
      Benchmarks · ARC-AGI
      Math Animation · Robotics
      Real and Generated Physics
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: prototype
    label: |-
      Build Conceptual Prototypes
      Domain Experts Specify Challenge
      Use Vibe-coding Workflow
      Iterate on Task Semantics
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: implement
    label: |-
      Implement Generation Scripts
      Manim · Matplotlib
      OpenCV · MoviePy
      Video Generative Models
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: parameterize
    label: |-
      Parameterize Complexity
      Entity Count · Reasoning Depth
      Distractors · Temporal Dynamics
      Visual Noise and Occlusion
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: generate
    label: |-
      Generate Diverse Variants
      Deterministic Python Scripts
      Sample Independent Parameters
      Preserve Reproducible Labels
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: embed
    label: |-
      Compose Video Tasks
      Embed Question in the Video
      Require Temporal Extraction
      Avoid Separate Text Prompt Cues
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: auto_qc
    label: |-
      Run Automated Validation
      Require at Least 512p and Codec
      Check Content Completeness
      Cross-check Parameter and Label
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: refine_technical
    label: |-
      Repair Technical Findings
      Rendering or Animation Artifacts
      Missing Visual Elements
      Parameter-label Mismatches
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: human_qc
    label: |-
      Authors Review Random Slices
      Check Clarity and One Answer
      Verify Visual-semantic Alignment
      Confirm Solvable Difficulty
    type: user
    size: xl
    position:
      x: 980
      'y': 420
  - id: refine_quality
    label: |-
      Refine Cognitive Quality
      Fix Timing and Visual Contrast
      Handle Generation Edge Cases
      Repeat Two to Three Rounds
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      Assemble MORSE-500
      500 Videos · 3.1 Hours
      64 A · 84 M · 64 P
      100 Plan · 108 S · 80 T
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: inference
    label: |-
      Run Standard Inference
      Native Models Use Full Video
      Others Use 2 FPS · Max 32 Frames
      Resize Long Side to 512 Pixels
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: score
    label: |-
      Compute Accuracy
      Prompt: "Answer the question in this video."
      Qwen2.5-72B-AWQ Extracts Answer
      String-match with Gold Label
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: taxonomy
    to: adapt
    type: primary
  - from: adapt
    to: prototype
    type: primary
  - from: prototype
    to: implement
