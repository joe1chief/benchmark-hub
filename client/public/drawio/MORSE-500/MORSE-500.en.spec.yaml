  - from: implement
    to: parameterize
    type: primary
  - from: parameterize
    to: generate
    type: primary
  - from: generate
    to: embed
    type: primary
  - from: embed
    to: auto_qc
    type: primary
  - from: auto_qc
    to: refine_technical
    type: primary
  - from: refine_technical
    to: human_qc
    type: primary
  - from: human_qc
    to: refine_quality
    type: primary
  - from: refine_quality
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: score
    type: primary
modules: []
