  title: HalluLens 动态测试集构建流程
  description: 依据 arXiv:2504.17550v1 整理三项外在幻觉任务的动态构建分支；PreciseWikiQA 主论文流程会重新生成不可回答的问题，推理与评分留在图外。
  legend: >-
    论文 §3.1.2 对不可回答的 PreciseWikiQA 问题重新生成，但官方批处理代码以 continue 直接过滤；图中明确保留这项论文—代码差异。超过 10 词的答案被过滤；LongWiki 仅保留可回答且模拟答案不少于
    4 句的题。
