    type: primary
  - from: longwiki
    to: dynamic_suite
    type: primary
  - from: mixed
    to: dynamic_suite
    type: primary
  - from: generated
    to: dynamic_suite
    type: primary
  - from: intrinsic
    to: intrinsic_set
    type: secondary
  - from: dynamic_suite
    to: inference
    type: primary
  - from: intrinsic_set
    to: inference
    type: secondary
  - from: inference
