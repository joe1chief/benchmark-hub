meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: ChartEditBench 数据集构建流程
  description: 对齐 arXiv:2602.15758v1 §3.2.1–§3.5，展示初始图表生成、五轮有效编辑链、构建期重试、独立 QA 资产与人工核验。
  legend: 实线主链在五轮编辑均有效后保留样本。每个渲染图表另生成 5 个 VQA，用于未来图表理解资产，并非编辑数据集收录门槛； 每条链 30 个 VQA 是由六个渲染状态推导所得，论文未披露发布总量。
