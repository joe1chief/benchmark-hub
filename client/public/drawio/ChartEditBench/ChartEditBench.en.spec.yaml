meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: ChartEditBench Dataset Build Process
  description: >-
    Initial-chart generation, validated five-edit chains, construction-time retries, separately disclosed QA assets, and
    human verification from arXiv:2602.15758v1 Sections 3.2.1–3.5.
  legend: >-
    The solid spine retains a chain after five valid edits. Five VQAs are generated for every rendered chart as a
    separate future chart-understanding asset, not an inclusion gate. Thirty VQAs per chain is derived from six rendered
    states; the paper does not disclose the released VQA total.
