meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ADR-Bench Build and Evaluation Process
  description: >-
    Paper-aligned dual-lane construction: 70 general queries selected from real user/business scenarios and 40
    finance/law queries co-designed and cross-validated with expert rubrics, followed by track-specific evaluation.
  legend: General and professional construction lanes merge only at the 110-query suite; evaluation splits by track.
nodes:
  - id: real_scenarios
    label: |-
      Real User + Business Scenarios
      Chinese deep-research needs
      Complex, open-ended deliverables
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: general_screen
    label: |-
      Manual General-Task Screening
      Test • filter • revise
      Keep diverse representative needs
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: general_70
    label: |-
      General Track
      70 selected queries
      7 domains × 10
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: professional_experts
    label: |-
      Finance + Law Experts
      High-stakes professional needs
      Domain-specific deliverables
    type: user
    size: xl
    position:
      x: 40
      'y': 440
  - id: co_design
    label: |-
      Co-Design Query + Rubric
      Experts enumerate positive
      and negative criteria
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: cross_validate
    label: |-
      Expert Cross-Validation
      Atomic • verifiable • unambiguous
      Independent • task-aligned
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: professional_40
    label: |-
      Professional Track
      Finance 20 + law 20
      40 query-rubric packages
    type: database
    size: xl
    position:
      x: 880
      'y': 440
  - id: suite
    label: |-
      ADR-Bench
      110 Chinese queries
      70 general + 40 professional
    type: database
    size: xl
    position:
      x: 1120
      'y': 260
  - id: reports
    label: |-
      Generate Research Reports
      ReAct: ≤30 turns, 16k tokens/turn
      Commercial systems: default web setup
    type: document
    size: xl
    position:
      x: 1360
      'y': 260
  - id: route
    label: Evaluation Track?
    type: decision
    size: xl
    position:
      x: 1600
      'y': 260
  - id: general_eval
    label: |-
      Blind Human Pairwise Review
      Five classes
      Left / right / both good
      Fair / poor
      Four axes
      Complete / deep / fit / readable
    type: process
    size: xl
    position:
      x: 1840
      'y': 80
  - id: professional_eval
    label: |-
      Automated Rubric Evaluation
      Positive + negative expert criteria
      Fatal negative hit → score 0
    type: process
    size: xl
    position:
      x: 1840
      'y': 440
  - id: aggregate
    label: |-
      Aggregate Track Outcomes
      General: preference + Elo-style views
      Professional: rubric and risk scores
    type: process
    size: xl
    position:
      x: 2080
      'y': 260
  - id: result
    label: |-
      ADR-Bench Results
      User preference + professional quality
      Overall, dimension, and domain views
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 260
edges:
  - from: real_scenarios
    to: general_screen
    type: primary
  - from: general_screen
    to: general_70
    type: primary
  - from: professional_experts
    to: co_design
    type: primary
  - from: co_design
    to: cross_validate
    type: primary
  - from: cross_validate
    to: professional_40
    type: primary
  - from: general_70
    to: suite
    type: primary
  - from: professional_40
    to: suite
    type: primary
  - from: suite
    to: reports
    type: primary
  - from: reports
    to: route
    type: primary
  - from: route
    to: general_eval
    type: primary
    label: General • 70
  - from: route
    to: professional_eval
    type: primary
    label: Finance / law • 40
  - from: general_eval
    to: aggregate
    type: primary
  - from: professional_eval
    to: aggregate
    type: primary
  - from: aggregate
    to: result
    type: primary
modules: []
