meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ADR-Bench Build and Evaluation Process
  description: >-
    Paper-aligned user-scenario study, expert query drafting and refinement, nine-domain dual-track composition, blind
    human comparison for general tasks, and rubric-based automated evaluation for professional tasks.
  legend: >-
    The top row builds the 110-query Chinese benchmark; the bottom row branches into the paper's general and
    professional evaluation protocols before combined reporting.
nodes:
  - id: study
    label: |-
      Study Real Deep-Research Usage
      Everyday User Needs and Business Scenarios
      Target Complex, Open-Ended Chinese Research Requests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: draft
    label: |-
      Domain Experts Draft Initial Queries
      Cover Realistic Research Deliverables
      Include General and High-Stakes Professional Needs
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: refine
    label: |-
      Multiple Test–Filter–Revise Rounds
      Remove Queries Unsuitable for Deep Research
      Manually Select Diverse, Representative General Tasks
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: domains
    label: |-
      Organize 9 Domains into 2 Tracks
      General: 7 Domains × 10 = 70 Queries
      Professional: Finance 20 + Law 20 = 40 Queries
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: rubric_quality
    label: |-
      Professional Rubric Quality Control
      Experts Co-Design Tasks and Enumerated Rubrics
      Atomic • Verifiable • Unambiguous • Independent • Aligned
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: suite
    label: |-
      ADR-Bench
      110 Chinese Deep-Research Queries
      70 General + 40 Finance / Law Professional Tasks
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: reports
    label: |-
      Generate Final Research Reports
      ReAct Agents: Up to 30 Turns and 16k Tokens per Turn
      Commercial Systems: Default Web Configurations
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: route
    label: Evaluation Track?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 440
  - id: general_eval
    label: |-
      General Track: Blind Human Pairwise Review
      Left Better / Right Better / Both Good / Fair / Poor
      Completeness • Depth • Requirement Fitness • Readability
    type: process
    size: xl
    position:
      x: 880
      'y': 350
  - id: professional_eval
    label: |-
      Professional Track: Automated Rubric Evaluation
      Expert-Cross-Validated Positive and Negative Criteria
      Critical Professional Errors Can Make a Report Unusable
    type: process
    size: xl
    position:
      x: 880
      'y': 530
  - id: aggregate
    label: |-
      Aggregate Track-Specific Outcomes
      General: Win / Tie / Loss, Dimensions, and Elo-Style Ratings
      Professional: Rubric Scores with Explicit Risk Penalties
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: result
    label: |-
      ADR-Bench Results
      Practical User Preference + Professional Knowledge Quality
      Report Overall, Dimension, Domain, and Professional-Tier Views
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: study
    to: draft
    type: primary
  - from: draft
    to: refine
    type: primary
  - from: refine
    to: domains
    type: primary
  - from: domains
    to: suite
    type: primary
  - from: domains
    to: rubric_quality
    type: primary
  - from: rubric_quality
    to: suite
    type: primary
  - from: suite
    to: reports
    type: primary
  - from: reports
    to: route
    type: primary
  - from: route
    to: general_eval
    type: primary
  - from: route
    to: professional_eval
    type: primary
  - from: general_eval
    to: aggregate
    type: primary
  - from: professional_eval
    to: aggregate
    type: primary
  - from: aggregate
    to: result
    type: primary
modules: []
