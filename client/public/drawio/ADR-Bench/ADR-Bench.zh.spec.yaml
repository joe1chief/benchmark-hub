meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ADR-Bench 构建与评测流程
  description: 按论文分为两条构建泳道：从真实用户/业务场景人工筛选 70 道通用题，以及金融/法律专家共创并交叉验证 query 与 rubric 的 40 道专业题，之后按轨道分别评测。
  legend: 通用与专业构建泳道仅在 110 题数据集处汇合；评测阶段再按轨道分流。
nodes:
  - id: real_scenarios
    label: |-
      真实用户 + 业务场景
      中文深度研究需求
      复杂开放式交付物
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: general_screen
    label: |-
      人工筛选通用题
      测试 • 过滤 • 修订
      保留多样且有代表性的需求
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: general_70
    label: |-
      通用轨
      人工筛选 70 题
      7 个领域 × 10
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: professional_experts
    label: |-
      金融 + 法律专家
      高风险专业需求
      领域专属交付物
    type: user
    size: xl
    position:
      x: 40
      'y': 440
  - id: co_design
    label: |-
      共创 Query + Rubric
      专家枚举正向
      与负向判据
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: cross_validate
    label: |-
      专家交叉验证
      原子 • 可验证 • 无歧义
      独立 • 与任务对齐
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: professional_40
    label: |-
      专业轨
      金融 20 + 法律 20
      40 组 query-rubric
    type: database
    size: xl
    position:
      x: 880
      'y': 440
  - id: suite
    label: |-
      ADR-Bench
      110 道中文查询
      70 通用 + 40 专业
    type: database
    size: xl
    position:
      x: 1120
      'y': 260
  - id: reports
    label: |-
      生成研究报告
      ReAct：≤30 轮，每轮 16k tokens
      商业系统：默认联网配置
    type: document
    size: xl
    position:
      x: 1360
      'y': 260
  - id: route
    label: 选择评测轨道？
    type: decision
    size: xl
    position:
      x: 1600
      'y': 260
  - id: general_eval
    label: |-
      人工盲审成对比较
      五类：左优/右优/均好/一般/差
      四维：完整/深度/需求适配/可读性
    type: process
    size: xl
    position:
      x: 1840
      'y': 80
  - id: professional_eval
    label: |-
      自动 Rubric 评测
      专家正向 + 负向判据
      命中致命负向项 → 得分 0
    type: process
    size: xl
    position:
      x: 1840
      'y': 440
  - id: aggregate
    label: |-
      汇总分轨结果
      通用：偏好 + Elo 风格视图
      专业：Rubric 与风险得分
    type: process
    size: xl
    position:
      x: 2080
      'y': 260
  - id: result
    label: |-
      ADR-Bench 结果
      用户偏好 + 专业质量
      总体、维度和领域视图
    type: terminal
    size: xl
    position:
      x: 2320
      'y': 260
edges:
  - from: real_scenarios
    to: general_screen
    type: primary
  - from: general_screen
    to: general_70
    type: primary
  - from: professional_experts
    to: co_design
    type: primary
  - from: co_design
    to: cross_validate
    type: primary
  - from: cross_validate
    to: professional_40
    type: primary
  - from: general_70
    to: suite
    type: primary
  - from: professional_40
    to: suite
    type: primary
  - from: suite
    to: reports
    type: primary
  - from: reports
    to: route
    type: primary
  - from: route
    to: general_eval
    type: primary
    label: 通用 • 70
  - from: route
    to: professional_eval
    type: primary
    label: 金融 / 法律 • 40
  - from: general_eval
    to: aggregate
    type: primary
  - from: professional_eval
    to: aggregate
    type: primary
  - from: aggregate
    to: result
    type: primary
modules: []
