meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ADR-Bench 构建与评测流程
  description: 对齐论文的用户场景调研、专家问题起草与修订、九领域双轨构成、通用题盲审人工对比及专业题 rubric 自动评测流程。
  legend: 上排构建 110 题中文基准；下排分流至论文的通用与专业评测协议，再合并报告。
nodes:
  - id: study
    label: |-
      调研真实深度研究用法
      日常用户需求与业务场景
      聚焦复杂、开放式中文研究请求
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: draft
    label: |-
      领域专家起草初始问题
      覆盖真实研究交付物
      同时纳入通用需求与高风险专业需求
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: refine
    label: |-
      多轮测试—过滤—修订
      移除不适合深度研究的问题
      人工筛选多样、有代表性的通用任务
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: domains
    label: |-
      将 9 个领域组织为双轨
      通用：7 个领域 × 10 = 70 题
      专业：金融 20 + 法律 20 = 40 题
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: rubric_quality
    label: |-
      专业 rubric 质量控制
      专家共同设计任务及枚举式 rubric
      原子性 • 可验证 • 无歧义 • 独立 • 对齐
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: suite
    label: |-
      ADR-Bench
      110 个中文深度研究问题
      70 个通用题 + 40 个金融 / 法律专业题
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: reports
    label: |-
      生成最终研究报告
      ReAct 智能体：最多 30 轮，每轮 16k token
      商业系统：使用默认网页配置
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: route
    label: 选择评测轨道？
    type: decision
    size: xl
    position:
      x: 1160
      'y': 440
  - id: general_eval
    label: |-
      通用轨：盲审人工两两对比
      左优 / 右优 / 都好 / 都一般 / 都差
      信息完整 • 内容深度 • 需求契合 • 可读性
    type: process
    size: xl
    position:
      x: 880
      'y': 350
  - id: professional_eval
    label: |-
      专业轨：自动化 rubric 评测
      经专家交叉验证的正向与负向标准
      严重专业错误可使整份报告判为不可用
    type: process
    size: xl
    position:
      x: 880
      'y': 530
  - id: aggregate
    label: |-
      汇总各轨专属结果
      通用：胜 / 平 / 负、分维度及 Elo 风格评级
      专业：带明确风险惩罚的 rubric 得分
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: result
    label: |-
      ADR-Bench 结果
      真实用户偏好 + 专业知识质量
      报告总体、维度、领域与专业分层视图
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: study
    to: draft
    type: primary
  - from: draft
    to: refine
    type: primary
  - from: refine
    to: domains
    type: primary
  - from: domains
    to: suite
    type: primary
  - from: domains
    to: rubric_quality
    type: primary
  - from: rubric_quality
    to: suite
    type: primary
  - from: suite
    to: reports
    type: primary
  - from: reports
    to: route
    type: primary
  - from: route
    to: general_eval
    type: primary
  - from: route
    to: professional_eval
    type: primary
  - from: general_eval
    to: aggregate
    type: primary
  - from: professional_eval
    to: aggregate
    type: primary
  - from: aggregate
    to: result
    type: primary
modules: []
