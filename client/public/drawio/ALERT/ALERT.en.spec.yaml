meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ALERT Build and Evaluation Process
  description: >-
    Paper-aligned curation of ALERT user-item contexts and criteria, pairwise recommendation-explanation evaluation by
    first dividing the criteria, then applying ALERT-Gen or ALERT-Disc per criterion, aggregating preferences, and
    reporting win rate. A separate meta-evaluation lane keeps interruption and expert-correlation studies parallel.
  legend: >-
    The top row builds the 2,761-interaction benchmark. The main evaluation lane follows paper Figure 3: divide the four
    criteria, apply one evaluator architecture to each criterion, then aggregate four preferences. The separate meta
    lane forks into independent §4.2 interruption and §4.3 expert-correlation experiments; only §4.3 feeds the no-tie
    expert-accuracy summary.
nodes:
  - id: source
    label: |-
      Amazon Reviews 2023
      15 E-Commerce Categories
      Purchase Records
      Implicit Transaction Preferences
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: context
    label: |-
      Build Recommendation Context
      Latest Purchase = Target Item
      Title • Price • Merchant
      Earlier Purchases = History
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: filter
    label: |-
      Apply Data Quality Controls
      Title ≥ 6 Alphabetic Characters
      Users with 5–20 Purchases
      5 Stars • ≤200 per Category
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: dataset
    label: |-
      Retain ALERT Dataset
      2,761 User–Item Interactions
      15 E-Commerce Categories
      No Demographics or User IDs
    type: database
    size: xl
    position:
      x: 880
      'y': 100
  - id: criteria
    label: |-
      Develop 4 Evaluation Criteria
      E-Commerce Editorial Team
      Refined through User Study
      Reason • Clarity • Appeal • Tone
    type: user
    size: xl
    position:
      x: 1160
      'y': 100
  - id: pair
    label: |-
      Prepare Explanation Pair
      Candidate vs PreferenceLogic
      User History + Target Item
      Carry All 4 Criteria
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: route
    label: |-
      Evaluator Architecture
      for Each Criterion?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 460
  - id: gen
    label: |-
      ALERT-Gen
      Claude-3-Sonnet + CoT
      Output A / B / C (Tie)
      Swap Explanation Positions
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: disc
    label: |-
      ALERT-Disc
      ArmoRM Scores Both
      Criterion-Specific Reward
      Higher Score Wins
    type: process
    size: xl
    position:
      x: 880
      'y': 560
  - id: divide
    label: |-
      Divide 4 Criteria First
      Reasoning • Clarity
      Narrative • Tone
      Create 4 Focused Comparisons
    type: process
    size: xl
    position:
      x: 1440
      'y': 460
  - id: vote
    label: |-
      Aggregate by Majority Vote
      Combine 4 Criterion Votes
      Final A / B / Tie Judgment
    type: process
    size: xl
    position:
      x: 600
      'y': 460
  - id: result
    label: |-
      ALERT Benchmark Result
      Win Rate vs PreferenceLogic
      % Interactions Candidate Wins
      Report Gen and Disc Separately
    type: terminal
    size: xl
    position:
      x: 320
      'y': 460
  - id: meta_suite
