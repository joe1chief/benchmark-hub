meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ALERT Build Process
  description: >-
    Paper-aligned recommendation explanation benchmark construction and LLM-judge validation workflow for ALERT, based
    on Li et al. 2025.
  legend: >-
    Solid arrows show dataset construction and evaluator validation; dashed arrows mark feedback from meta-evaluation
    into criteria refinement.
nodes:
  - id: source
    label: |-
      Amazon purchase signals
      15 e-commerce categories
      5-star user-item interactions
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: quality_filter
    label: |-
      Dataset quality filter
      title length at least 6 letters
      users with 5 to 20 transactions
    type: decision
    size: xl
    position:
      x: 300
      'y': 70
  - id: balanced_sample
    label: |-
      Balanced sampling
      max 200 behaviors per category
      2,761 retained interactions
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: benchmark_context
    label: |-
      Benchmark context
      latest purchase as target item
      history profile from purchases
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: criteria
    label: |-
      Evaluation criteria
      editorial team and user studies
      reasoning, clarity, narrative, tone
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: evaluators
    label: |-
      LLM-powered judges
      ALERT-Gen CoT comparison
      ALERT-Disc criterion scores
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: aggregate
    label: |-
      Divide and aggregate
      judge each criterion separately
      majority-vote final preference
    type: process
    size: xl
    position:
      x: 1080
      'y': 160
  - id: meta_eval
    label: |-
      Reliability validation
      negative examples and expert labels
      70% expert-human concordance
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: source
    to: quality_filter
    type: primary
  - from: quality_filter
    to: balanced_sample
    type: primary
  - from: balanced_sample
    to: benchmark_context
    type: primary
  - from: benchmark_context
    to: criteria
    type: primary
  - from: criteria
    to: evaluators
    type: data
  - from: evaluators
    to: aggregate
    type: primary
  - from: aggregate
    to: meta_eval
    type: primary
  - from: meta_eval
    to: criteria
    type: optional
    label: validate alignment
modules: []
