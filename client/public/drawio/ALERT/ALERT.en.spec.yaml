meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ALERT Build and Evaluation Process
  description: >-
    Paper-aligned curation of ALERT user-item contexts and criteria, pairwise recommendation-explanation evaluation
    through the ALERT-Gen or ALERT-Disc architecture, divide-and-aggregate voting, win-rate reporting, and
    human-alignment meta-evaluation.
  legend: >-
    The top row builds the 2,761-interaction benchmark. The bottom row branches to one of two official evaluator
    architectures, then applies the same four-criterion majority-vote protocol.
nodes:
  - id: source
    label: |-
      Start from Amazon Reviews 2023
      Purchase Records across 15 E-Commerce Categories
      Use Implicit Preferences from Real Transactions
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: context
    label: |-
      Construct Recommendation Contexts
      Most Recent Purchase = Target Item
      Title + Price + Merchant; Earlier Purchases = User History
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: filter
    label: |-
      Apply Dataset Quality Controls
      Title ≥ 6 Alphabetic Characters • Users with 5–20 Purchases
      Keep 5-Star Purchases • Cap Each Category at 200 Behaviors
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: dataset
    label: |-
      Retain the ALERT Dataset
      2,761 User–Item Interactions in 15 Categories
      Purchase-History Profiles; No Demographics or User IDs
    type: database
    size: xl
    position:
      x: 880
      'y': 100
  - id: criteria
    label: |-
      Develop 4 Evaluation Criteria
      E-Commerce Editorial Team + User-Study Refinement
      Reasoning • Clear / Concise • Engaging • Neutral Tone
    type: user
    size: xl
    position:
      x: 1160
      'y': 100
  - id: pair
    label: |-
      Form a Pairwise Explanation Comparison
      Candidate Model vs PreferenceLogic Baseline
      Provide User History, Target Item, and One Criterion
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: route
    label: Evaluator Architecture?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 460
  - id: gen
    label: |-
      ALERT-Gen
      Claude-3-Sonnet Chain-of-Thought Comparison
      Output A / B / C (Tie); Systematically Swap Positions
    type: process
    size: xl
    position:
      x: 1160
      'y': 360
  - id: disc
    label: |-
      ALERT-Disc
      ArmoRM Scores Both Explanations
      Higher Criterion-Specific Reward Wins
    type: process
    size: xl
    position:
      x: 1160
      'y': 560
  - id: divide
    label: |-
      Divide by Evaluation Criterion
      Judge Reasoning, Clarity, Narrative, and Tone Separately
      Obtain Four Focused Preferences
    type: process
    size: xl
    position:
      x: 880
      'y': 460
  - id: vote
    label: |-
      Aggregate by Majority Vote
      Combine the Four Criterion Preferences
      Produce the Final A / B / Tie Judgment
    type: process
    size: xl
    position:
      x: 600
      'y': 460
  - id: result
    label: |-
      ALERT Benchmark Result
      Win Rate = % Interactions Where Candidate Beats Baseline
      Report ALERT-Gen and ALERT-Disc Comparisons
    type: terminal
    size: xl
    position:
      x: 320
      'y': 360
  - id: meta
    label: |-
      Meta-Evaluate Evaluator Reliability
      Controlled Data / Prompt Interruptions + 3 Expert Annotators
      About 70% Concordance with Expert Human Judgment
    type: user
    size: xl
    position:
      x: 320
      'y': 560
edges:
  - from: source
    to: context
    type: primary
  - from: context
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: criteria
    type: primary
  - from: criteria
    to: pair
    type: primary
  - from: pair
    to: route
    type: primary
  - from: route
    to: gen
    type: primary
  - from: route
    to: disc
    type: primary
  - from: gen
    to: divide
    type: primary
  - from: disc
    to: divide
    type: primary
  - from: divide
    to: vote
    type: primary
  - from: vote
    to: result
    type: primary
  - from: vote
    to: meta
    type: primary
modules: []
