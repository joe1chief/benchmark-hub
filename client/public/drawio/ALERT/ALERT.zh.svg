<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1627px" height="831px" viewBox="0 0 1627 831"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="2"><g><path d="M 8 23 C 8 14.72 52.77 8 108 8 C 134.52 8 159.96 9.58 178.71 12.39 C 197.46 15.21 208 19.02 208 23 L 208 93 C 208 101.28 163.23 108 108 108 C 52.77 108 8 101.28 8 93 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 208 23 C 208 31.28 163.23 38 108 38 C 52.77 38 8 31.28 8 23" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(108,50.7) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>从 Amazon Reviews 2023 开始</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>覆盖 15 个电商类别的购买记录</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>用真实交易中的隐式偏好</tspan></text></g></g></g></g><g data-cell-id="3"><g><rect x="288" y="8" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(388,38.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>构建推荐上下文</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>最近一次购买 = 目标商品</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>标题 + 价格 + 商家；更早购买 = 用户历史</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="568" y="8" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(668,38.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>应用数据质量控制</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>标题 ≥ 6 个字母 • 用户有 5–20 次购买</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>仅保留五星购买 • 每类最多 200 条行为</tspan></text></g></g></g></g><g data-cell-id="5"><g><path d="M 848 23 C 848 14.72 892.77 8 948 8 C 974.52 8 999.96 9.58 1018.71 12.39 C 1037.46 15.21 1048 19.02 1048 23 L 1048 93 C 1048 101.28 1003.23 108 948 108 C 892.77 108 848 101.28 848 93 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1048 23 C 1048 31.28 1003.23 38 948 38 C 892.77 38 848 31.28 848 23" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(948,50.7) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>保留 ALERT 数据集</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>15 类共 2,761 个用户–商品交互</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>仅用购买历史画像；不含人口统计或用户 ID</tspan></text></g></g></g></g><g data-cell-id="6"><g><ellipse cx="1228" cy="58" rx="100" ry="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(25, 118, 210);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1228,25) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>制定 4 项评测准则</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>电商编辑团队设计</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>经用户研究优化</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>推理一致性 • 清晰简洁</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>叙事吸引力 • 中性语气</tspan></text></g></g></g></g><g data-cell-id="7"><g><path d="M 1408 8 L 1608 8 L 1608 93 Q 1558 66 1508 93 Q 1458 120 1408 93 L 1408 23 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1508,16.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>准备两两解释比较</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>候选模型 vs PreferenceLogic 基线</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>提供用户历史与目标商品</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>携带全部 4 项准则</tspan></text></g></g></g></g><g data-cell-id="8"><g><path d="M 1228 368 L 1328 418 L 1228 468 L 1128 418 Z" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(255, 152, 0);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="26.4" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1228,404.8) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>每项准则选择</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>哪种评估器架构？</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="848" y="272" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(948,302.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>ALERT-Gen</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Claude-3-Sonnet 思维链两两比较</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>输出 A / B / C（平局）；系统交换位置</tspan></text></g></g></g></g><g data-cell-id="10"><g><rect x="848" y="472" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(948,502.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>ALERT-Disc</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>ArmoRM 分别为两个解释打分</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>准则对应奖励分更高者获胜</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1408" y="368" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1508,391.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>先拆分 4 项评测准则</tspan></text><text y=