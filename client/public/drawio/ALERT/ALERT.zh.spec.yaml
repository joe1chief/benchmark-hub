meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ALERT 构建与评测流程
  description: 对齐论文的 ALERT 用户–商品上下文与准则构建：先拆分四项准则，再固定采用同一 ALERT-Gen 或 ALERT-Disc 评估器覆盖全部四项准则，聚合偏好并报告胜率；独立元评测支线并行展示干扰测试与专家相关性研究。
  legend: >-
    上排构建含 2,761 个交互的基准。主评测链严格遵循论文图 3：先拆分四项准则，再由同一评估器覆盖全部 4 项准则，最后聚合四个偏好。独立元评测支线并行分为 §4.2 干扰实验与 §4.3 专家相关性实验；仅 §4.3
    连接到不含平局的专家准确率。
nodes:
  - id: source
    label: |-
      从 Amazon Reviews 2023 开始
      覆盖 15 个电商类别的购买记录
      用真实交易中的隐式偏好
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: context
    label: |-
      构建推荐上下文
      最近一次购买 = 目标商品
      标题 + 价格 + 商家；更早购买 = 用户历史
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: filter
    label: |-
      应用数据质量控制
      标题 ≥ 6 个字母 • 用户有 5–20 次购买
      仅保留五星购买 • 每类最多 200 条行为
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: dataset
    label: |-
      保留 ALERT 数据集
      15 类共 2,761 个用户–商品交互
      不含敏感人口统计信息
      不发布用户 ID
    type: database
    size: xl
    position:
      x: 880
      'y': 100
  - id: criteria
    label: |-
      制定 4 项评测准则
      电商编辑团队设计
      经用户研究优化
      推理一致性 • 清晰简洁
      叙事吸引力 • 中性语气
    type: user
    size: xl
    position:
      x: 1160
      'y': 100
  - id: pair
    label: |-
      准备两两解释比较
      候选模型 vs PreferenceLogic 基线
      提供用户历史与目标商品
      携带全部 4 项准则
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: route
    label: |-
      同一评估器
      覆盖全部 4 项准则？
    type: decision
    size: xl
    position:
      x: 1160
      'y': 460
  - id: gen
    label: |-
      ALERT-Gen
      Claude-3-Sonnet 思维链两两比较
      输出 A / B / C（平局）；系统交换位置
    type: process
    size: xl
    position:
      x: 880
      'y': 360
  - id: disc
    label: |-
      ALERT-Disc
      ArmoRM 分别为两个解释打分
      准则对应奖励分更高者获胜
    type: process
    size: xl
    position:
      x: 880
      'y': 560
  - id: divide
    label: |-
      先拆分 4 项评测准则
      推理 • 清晰度
      叙事 • 语气
      形成 4 个聚焦比较
    type: process
    size: xl
    position:
      x: 1440
      'y': 460
  - id: vote
    label: |-
      多数投票聚合
      合并四项准则偏好
      生成最终 A / B / 平局判断
    type: process
    size: xl
    position:
      x: 600
      'y': 460
  - id: result
    label: |-
      ALERT 基准结果
      胜率 = 候选解释优于基线的交互占比
      分别报告 ALERT-Gen 与 ALERT-Disc 比较
    type: terminal
    size: xl
    position:
      x: 320
      'y': 460
  - id: meta_suite
    label: |-
      单独开展元评测
      ALERT-Gen + ALERT-Disc
      不属于基准计分下游
    type: user
    size: xl
    position:
      x: 880
      'y': 800
  - id: interruption_test
    label: |-
      §4.2 劣质解释检测
      受控数据干扰
      受控提示干扰
      半合成 • 无需新增标注
    type: process
    size: xl
    position:
      x: 1160
      'y': 800
  - id: expert_correlation
    label: |-
      §4.3 专家相关性研究
      88 对解释
      3 位专业标注者
      对比自动评估器
    type: process
    size: xl
    position:
      x: 600
      'y': 800
  - id: no_tie_accuracy
    label: |-
      不含平局的专家准确率
      ALERT-Gen = 0.667
      ALERT-Disc = 0.711
    type: terminal
    size: xl
    position:
      x: 320
      'y': 800
edges:
  - from: source
    to: context
    type: primary
  - from: context
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: criteria
    type: primary
  - from: criteria
    to: pair
    type: primary
  - from: pair
    to: divide
    type: primary
  - from: divide
    to: route
    type: primary
  - from: route
    to: gen
    type: primary
  - from: route
    to: disc
    type: primary
  - from: gen
    to: vote
    type: primary
  - from: disc
    to: vote
    type: primary
  - from: vote
    to: result
    type: primary
  - from: meta_suite
    to: interruption_test
    type: secondary
  - from: meta_suite
    to: expert_correlation
    type: secondary
  - from: expert_correlation
    to: no_tie_accuracy
    type: secondary
modules: []
