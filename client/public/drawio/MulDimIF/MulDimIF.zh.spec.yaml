meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MulDimIF 构建与评测流程
  description: 对齐论文展示多维约束框架、可控指令生成、双人交叉复核、代码校验器构建、测试评测与 GRPO 改进。
  legend: MulDimIF 发布 9,106 条可用代码验证的英文数据，包括 7,906 条训练指令和按四个难度均衡的 1,200 条测试指令。
nodes:
  - id: goal
    label: |-
      定义指令遵循维度
      约束形式 · 类型 · 难度
      同时支持评测与训练
      输出必须可由代码验证
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: source
    label: |-
      采样原始指令
      从 ShareGPT 随机抽取
      使用英文单轮提示
      保留原始任务意图
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: framework
    label: |-
      应用 MulDimIF 框架
      3 种形式：示例 · 列表 · 融入
      4 类约束 · 13 个子类
      4 个难度等级
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: expand
    label: |-
      用 GPT-4o 扩展约束
      选择尚未覆盖的类别
      加入一至两个约束
      从等级 I 递进到 IV
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: conflict
    label: |-
      检测无效约束集合
      检查新约束是否成功加入
      检查约束是否相互兼容
      丢弃失败项并继续有效项
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: rewrite
    label: |-
      重写为随机选定的形式
      列表式或自然融入式
      示例式加入三组匹配问答
      保留全部可验证约束
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: review
    label: |-
      人工复核每条数据
      六名标注员持续四周
      每条至少两人交叉验证
      修改直至两人均通过
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: validators
    label: |-
      构建 Python 验证代码
      DeepSeek-V3 按类别生成初稿
      两名标注员复核并修订
      双人通过后才接收
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: release
    label: |-
      发布 9,106 条验证数据
      训练 7,906 · 测试 1,200
      测试集每个难度 300 条
      每条数据均带验证代码
    type: database
    size: xl
    position:
      x: 1220
      'y': 500
  - id: evaluate
    label: |-
      评测测试集
      六个家族共 18 个 LLM
      贪心解码 · 仅检查最终答案
      用代码检查约束满足情况
    type: process
    size: xl
    position:
      x: 980
      'y': 400
  - id: train
    label: |-
      用 GRPO 改进模型
      训练六个不超过 14B 的模型
      奖励为满足的约束数
      重新检查通用能力
    type: process
    size: xl
    position:
      x: 980
      'y': 650
  - id: report
    label: |-
      报告多维评测结果
      按约束形式和类别统计准确率
      比较等级 I 至 IV
      比较 GRPO 训练前后表现
    type: terminal
    size: xl
    position:
      x: 740
      'y': 525
edges:
  - from: goal
    to: source
    type: primary
  - from: source
    to: framework
    type: primary
  - from: framework
    to: expand
    type: primary
  - from: expand
    to: conflict
    type: primary
  - from: conflict
    to: rewrite
    type: primary
  - from: rewrite
    to: review
    type: primary
  - from: review
    to: validators
    type: primary
  - from: validators
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: release
    to: train
    type: primary
  - from: evaluate
    to: report
    type: primary
  - from: train
    to: report
    type: primary
modules: []
