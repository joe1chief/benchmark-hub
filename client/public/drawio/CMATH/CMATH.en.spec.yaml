  layout: horizontal
  routing: orthogonal
  title: CMATH Build Process
  description: >-
    Paper-aligned construction of CMATH: Chinese elementary math word problems are collected from online workbooks and
    exams, converted to text, cleaned, validated, annotated with grade and answer metadata, and evaluated with zero-shot
    numerical matching plus a distractor robustness subset.
  legend: Solid arrows show collection, cleaning, annotation, release, and evaluation.
