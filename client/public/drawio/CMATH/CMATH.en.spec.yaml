meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CMATH Build Process
  description: >-
    Paper-aligned CMATH flow. Chinese elementary-school workbooks and exams are digitized, filtered, cleaned, validated,
    and annotated into 1,689 grade-stratified word problems; models are scored by zero-shot numeral matching and a
    separately constructed 60-problem distractor robustness test.
  legend: Solid arrows trace dataset construction, main evaluation, and the parallel robustness branch.
