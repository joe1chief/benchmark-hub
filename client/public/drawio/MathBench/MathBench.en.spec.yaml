meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathBench Build Process
  description: >-
    Paper-aligned bilingual graded-corpus construction, circular screening, and dual Chat or Base evaluation in
    MathBench.
  legend: >-
    Solid arrows trace the three-level taxonomy, theory and application sourcing, bilingual QC, the 3,709-item release,
    and CircularEval or PPL scoring.
nodes:
  - id: taxonomy
    label: |-
      Build Three-level Taxonomy
      Stage · Subject Area · Topic
      Span Arithmetic to College Math
      Cover Five Learning Stages
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Collect Two Question Tracks
      Theory from Textbooks · Web
      Applications from Exams · Contests
      Add Licensed Open-source Sets
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: normalize
    label: |-
      Normalize Questions and Answers
      Match Each Education Stage
      Convert Complex Answers to 4-way MCQ
      Create Confusable Distractors
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: bilingual
    label: |-
      Build Chinese · English Versions
      Graduate Students Process Items
      Preserve Theory · Application
      Align Stage · Area · Topic
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: gpt_screen
    label: |-
      Screen with GPT-4 CircularEval
      Rotate Options Four Times
      Detect Errors · Unanswerable Items
      Detect Multi-answer · Bad Difficulty
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: manual_review
    label: |-
      Manually Review Suspect Items
      Focus on CE-0 · CE-1 · CE-2
      Repair Stem · Answer · Options
      Ensure One Correct Answer
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: release
    label: |-
      Release MathBench
      3,709 Bilingual Questions
      MathBench-T: 2,209 Theory
      MathBench-A: 1,500 Application
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: chat_setup
    label: |-
      Configure Chat Evaluation
      Zero-shot CoT for MCQs
      Few-shot CoT for Open Answers
      Greedy Decode · 2,048 Tokens
    type: document
    size: xl
    position:
      x: 1220
      'y': 300
  - id: circular_eval
    label: |-
      Run CircularEval
      Permute Four Choices Four Times
      Parse the Choice Every Run
      Reduce Position Bias · Guessing
    type: process
    size: xl
    position:
      x: 980
      'y': 300
  - id: base_ppl
    label: |-
      Configure Base-model Evaluation
      Supply Few-shot Examples
      Compute Candidate Perplexities
      Select the Lowest-PPL Choice
    type: process
    size: xl
    position:
      x: 1460
      'y': 540
  - id: score
    label: |-
      Compute Protocol-specific Accuracy
      Chat: Require Four Correct Rotations
      Base: Use the Lowest-PPL Choice
      Compare Either with Ground Truth
    type: process
    size: xl
    position:
      x: 980
      'y': 540
  - id: report
    label: |-
      Aggregate Fine-grained Results
      Report Stage · Area · Topic
      Compare Theory · Application
      Compare Chinese · English
    type: terminal
    size: xl
    position:
      x: 740
      'y': 540
edges:
  - from: taxonomy
    to: sources
    type: primary
  - from: sources
    to: normalize
    type: primary
  - from: normalize
    to: bilingual
    type: primary
  - from: bilingual
    to: gpt_screen
    type: primary
  - from: gpt_screen
    to: manual_review
    type: primary
  - from: manual_review
    to: release
    type: primary
  - from: release
    to: chat_setup
    type: primary
  - from: release
    to: base_ppl
    type: primary
  - from: chat_setup
    to: circular_eval
    type: primary
  - from: circular_eval
    to: score
    type: primary
  - from: base_ppl
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
