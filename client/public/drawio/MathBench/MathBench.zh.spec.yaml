meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathBench 构建流程
  description: 与论文对齐地展示 MathBench 的双语分级题库构建、循环筛查以及 Chat/Base 双轨评测。
  legend: 实线箭头依次表示三级知识体系、理论与应用题采集、双语质检、3709 题发布，以及 CircularEval 或 PPL 评分。
nodes:
  - id: taxonomy
    label: |-
      建立三级知识体系
      阶段 · 学科领域 · 主题
      覆盖算术至大学数学
      共五个学习阶段
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      收集两类题目来源
      理论题来自教材与网络
      应用题来自考试和竞赛
      补充许可开源数据集
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: normalize
    label: |-
      规范题目与答案
      按教育阶段匹配难度
      复杂答案改为四选一
      构造高混淆度干扰项
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: bilingual
    label: |-
      构建中英双语版本
      研究生处理与标注
      保留定义定理与应用题
      对齐阶段领域及主题
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: gpt_screen
    label: |-
      使用 GPT-4 循环筛查
      每题进行四次选项轮换
      检查错误与不可回答
      检查多解及难度异常
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: manual_review
    label: |-
      人工复核可疑题目
      聚焦 CE-0 · CE-1 · CE-2
      修正题干答案与选项
      保证唯一正确答案
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: release
    label: |-
      发布 MathBench
      共 3,709 道双语题
      理论子集 2,209 题
      应用子集 1,500 题
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: chat_setup
    label: |-
      配置 Chat 模型评测
      选择题零样本思维链
      开放题少样本思维链
      贪心生成至多 2,048 词元
    type: document
    size: xl
    position:
      x: 1220
      'y': 300
  - id: circular_eval
    label: |-
      执行 CircularEval
      对四选一题轮换选项四次
      每次解析模型选项
      消除位置偏差与猜测
    type: process
    size: xl
    position:
      x: 980
      'y': 300
  - id: base_ppl
    label: |-
      配置 Base 模型评测
      使用少样本示例
      计算各候选答案困惑度
      选择最低困惑度选项
    type: process
    size: xl
    position:
      x: 1460
      'y': 540
  - id: score
    label: |-
      按模型协议计算准确率
      Chat 须四次轮换全对
      Base 采用最低困惑度选项
      最终均与标准答案比较
    type: process
    size: xl
    position:
      x: 980
      'y': 540
  - id: report
    label: |-
      汇总细粒度结果
      按阶段领域与主题报告
      比较理论与应用能力
      比较中文与英文表现
    type: terminal
    size: xl
    position:
      x: 740
      'y': 540
edges:
  - from: taxonomy
    to: sources
    type: primary
  - from: sources
    to: normalize
    type: primary
  - from: normalize
    to: bilingual
    type: primary
  - from: bilingual
    to: gpt_screen
    type: primary
  - from: gpt_screen
    to: manual_review
    type: primary
  - from: manual_review
    to: release
    type: primary
  - from: release
    to: chat_setup
    type: primary
  - from: release
    to: base_ppl
    type: primary
  - from: chat_setup
    to: circular_eval
    type: primary
  - from: circular_eval
    to: score
    type: primary
  - from: base_ppl
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
