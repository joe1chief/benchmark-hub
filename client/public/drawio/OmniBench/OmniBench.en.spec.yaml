meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniBench Build and Evaluation Process
  description: >-
    Paper-aligned construction of a tri-modal image-audio-text benchmark whose questions require complementary visual
    and acoustic evidence.
  legend: >-
    This OmniBench is the 1,142-question universal omni-language benchmark, not the later same-name virtual-agent
    benchmark; video is not an input modality here.
nodes:
  - id: scope
    label: |-
      Define Tri-modal Understanding
      Input: Image · Audio · Text
      Reconstruct a Shared Context
      Output a Text Answer
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      Build a Reasoning Taxonomy
      Temporal-spatial Entity
      Causal Inference
      Abstract Concept · Eight Task Types
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: team
    label: |-
      Form the Annotation Team
      Sixteen Annotators
      Five Quality Inspectors
      Higher-education Backgrounds
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: mcq
    label: |-
      Author Four-option MCQs
      Exactly One Correct Answer
      At Least One Confusing Distractor
      Avoid Trivial Patterns
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: dependency
    label: |-
      Require Both Image and Audio
      Reject Single-modality Answers
      Use Complementary Evidence
      Preserve Text Question Context
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: constraints
    label: |-
      Apply Data Constraints
      Image Resolution at Least 480P
      Audio Duration at Most 30 Seconds
      Limit Repeated Sources and Prompts
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: rationales
    label: |-
      Annotate Supporting Evidence
      Audio Transcript or Music Caption
      Image-specific Rationale
      Audio-specific Rationale
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: human_qc
    label: |-
      Cross-inspect by Humans
      Give Explicit Failure Reasons
      Return Failed Samples
      Revise Targeted Problems
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: model_qc
    label: |-
      Run LLaVA-1.6-34B Checks
      Image plus Text Only
      Transcript plus Text Only
      Text Only Repeated Three Times
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: gate
    label: |-
      Enforce Multimodal Necessity
      Accept Only Rejection or Errors
      Recycle Revisable Samples
      Discard Hard-to-recycle Items
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: release
    label: |-
      Release OmniBench
      1,142 Question-answer Pairs
      Speech · Sound Events · Music
      Three Categories · Eight Tasks
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: full_eval
    label: |-
      Run Full Tri-modal Evaluation
      Provide Image and Audio
      Ask Text Question with Four Options
      Extract Answer Letter
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: ablations
    label: |-
      Run Modality Ablations
      Remove Image or Audio
      Use Human Audio Transcripts
      Use Generated Image Captions
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Accuracy
      Exact Match Correct Option Letter
      Compare Full and Ablated Inputs
      Include Human Musician Baseline
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: taxonomy
    type: primary
  - from: taxonomy
    to: team
    type: primary
  - from: team
    to: mcq
    type: primary
  - from: mcq
    to: dependency
    type: primary
  - from: dependency
    to: constraints
    type: primary
  - from: constraints
    to: rationales
    type: primary
  - from: rationales
    to: human_qc
    type: primary
  - from: human_qc
    to: model_qc
    type: primary
  - from: model_qc
    to: gate
    type: primary
  - from: gate
    to: release
    type: primary
  - from: release
    to: full_eval
    type: primary
  - from: full_eval
    to: ablations
    type: primary
  - from: ablations
    to: report
    type: primary
modules: []
