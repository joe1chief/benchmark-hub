meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniBench 构建与评测流程
  description: 对齐论文与固定官方源，呈现 1,142 题 OmniBench 的构建、三模态必要性迭代检查、发布与评测，并明确解析器、数据包装、任务数和许可边界。
  legend: >-
    固定证据为 arXiv:2409.15272v6、multimodal-art-projection/OmniBench 提交 1f14e7f49c9a 与 Hugging Face 数据提交
    84dc3923e0f6；实线表示数据或评测流程，虚线表示证据与来源差异。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv v6 · e68151f006ae
      Git 1f14e7f49c9a
      HF 84dc3923e0f6
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      定义三模态任务
      输入图像 + 音频 + 文本
      重建语境 · 输出文本答案
      使用静态图像 · 不以视频为输入
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: taxonomy
    label: |-
      建立推理分类
      三大类 · 八类任务
      时空实体 · 因果推断
      抽象概念
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: sources
    label: |-
      收集多模态材料
      网络图像或视频 · 人工智能生成
      自制图像 · 网络视频
      声音事件 · 对话录音
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: team
    label: |-
      组建标注团队
      16 名标注员 · 5 名质检员
      全职工业数据员工
      均有高等教育背景
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: author
    label: |-
      编写四选一问题
      唯一正确答案 · 高迷惑干扰项
      避免简单模式
      必须同时依赖图像与音频
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: constraints
    label: |-
      应用多样性约束
      图像至少 854×480 · 音频至多 30 秒
      每位说话者至多出现五次
      相似环境语境至多三题
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: rationales
    label: |-
      标注支撑证据
      音频转写或音乐描述
      图像专属理由
      音频专属理由
    type: document
    size: xl
    position:
      x: 1700
      'y': 40
  - id: human_qc
    label: |-
      交叉检查每个样例
      记录详细失败原因
      退回未通过样例
      支持定向修订
    type: process
    size: xl
    position:
      x: 1940
      'y': 40
  - id: model_qc
    label: |-
      使用 LLaVA-1.6-34B 检查
      图像 + 文本 · 转写 + 文本
      纯文本重复测试三次
      检查有限信息可解性
    type: process
    size: xl
    position:
      x: 2180
      'y': 40
  - id: gate
    label: |-
      检验多模态必要性
      在每种有限信息设置中
      均拒答或答错
      确认两种模态都不可缺
    type: decision
    size: xl
    position:
      x: 2420
      'y': 40
  - id: revise
    label: |-
      修订未通过样例
      编辑问题或材料
      返回人工检查
    type: process
    size: xl
    position:
      x: 2180
      'y': 280
  - id: discard
    label: |-
      丢弃难以回收的样例
      共 121 条问答
      迭代质检中占 9.58%
    type: terminal
    size: xl
    position:
      x: 2700
      'y': 280
  - id: release
    label: |-
      定稿 OmniBench
      1,142 题 · 语音 771 · 声音事件 265 · 音乐 106
      八类任务 · 868 题无需修订 · 占 76%
      21.1% 需要一至两轮修订
    type: database
    size: xl
    position:
      x: 2460
      'y': 520
  - id: publication
    label: |-
      发布数据与媒体
      固定 Git JSONL · 1,142 条
      HF 以训练集名包装 · 1,142 个连续编号
      每题四个选项且标答在选项中
    type: database
    size: xl
    position:
      x: 2180
      'y': 520
  - id: eval_gate
    label: |-
      选择评测设置
      模型或人工基线
    type: decision
    size: xl
    position:
      x: 1900
      'y': 520
  - id: full
    label: |-
      完整三模态设置
      图像 + 音频 + 文本
      文本问题带四个选项
    type: process
    size: xl
    position:
      x: 1620
      'y': 300
  - id: ablation
    label: |-
      执行模态消融
      移除图像或移除音频
      检验必要性与稳健性
    type: process
    size: xl
    position:
      x: 1620
      'y': 440
  - id: textual
    label: |-
      使用文本近似模态
      图像描述 + 音频
      图像 + 音频转写
      图像描述 + 音频转写
    type: process
    size: xl
    position:
      x: 1620
      'y': 580
  - id: human
    label: |-
      设置人工专家基线
      三名音乐专业人员
      取平均准确率
    type: process
    size: xl
    position:
      x: 1620
      'y': 720
  - id: prompt
    label: |-
      使用发布的提示模板
      根据给定图像与音频作答
      只选择一个答案
      四个选项为 A 至 D
    type: process
    size: xl
    position:
      x: 1320
      'y': 440
  - id: parser
    label: |-
      解析模型回答
      括号字母 → 独立字母 → 点号字母
      仅回答超过五个词元时匹配选项文本
      多个点号候选并列时取首个候选
      计分脚本回退为不可用答案
    type: process
    size: xl
    position:
      x: 1040
      'y': 440
  - id: report
    label: |-
      计分脚本意图汇报
      答对数 ÷ 1,142 · 随机基线 25%
      空问题单独计为无效回答
      分别统计语音 · 声音事件 · 音乐
    type: terminal
    size: xl
    position:
      x: 760
      'y': 440
  - id: code_boundary
    label: |-
      发布代码边界
      演示：缺失 XLSX · option / correct answer
      数据：JSONL · options / answer
      演示逐行 JSON · 计分 json.load
      标答：711 对 · 274 N/A · 157 误 · 第 12 号断言
      自述 7 类 · 论文/数据 8 类
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 420
      'y': 300
  - id: license_boundary
    label: |-
      许可边界
      论文伦理章节写 CC-BY-NC
      检查清单又写 MIT
      Git 与 HF 数据卡均未标许可
    type: document
    size: xl
    position:
      x: 420
      'y': 580
