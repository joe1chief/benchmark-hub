meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniBench 构建与评测流程
  description: 对齐论文构建图像、音频与文本三模态基准，要求每道题必须同时依赖互补的视觉和听觉证据。
  legend: 此处为 1,142 题的全模态语言模型基准，而非后来同名的虚拟智能体基准；本基准不以视频作为输入模态。
nodes:
  - id: scope
    label: |-
      定义三模态理解任务
      输入：图像 · 音频 · 文本
      重建一致跨模态语境
      输出文本答案
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      建立推理任务分类
      时间空间实体
      因果推断
      抽象概念 · 共八类任务
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: team
    label: |-
      组建标注团队
      16 名标注员
      5 名质量检查员
      均具高等教育背景
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: mcq
    label: |-
      编写四选一问题
      仅有一个正确答案
      至少一个高迷惑干扰项
      避免简单答案模式
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: dependency
    label: |-
      强制依赖图像与音频
      拒绝单模态可答样例
      使用跨模态互补证据
      保留文本问题语境
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: constraints
    label: |-
      应用数据约束
      图像分辨率不低于 480P
      音频时长不超过 30 秒
      限制重复来源与相似问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: rationales
    label: |-
      标注支撑证据
      提供音频转写或音乐描述
      给出图像专属理由
      给出音频专属理由
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: human_qc
    label: |-
      执行人工交叉检查
      记录明确失败原因
      退回未通过样例
      定向修订问题
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: model_qc
    label: |-
      运行 LLaVA-1.6-34B 检查
      仅图像加文本
      仅音频转写加文本
      纯文本重复测试三次
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: gate
    label: |-
      检验跨模态必要性
      仅接受拒答或答错样例
      回收可修订数据
      丢弃难以修复的样例
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: release
    label: |-
      发布 OmniBench
      1,142 条问答
      语音 · 声音事件 · 音乐
      三大类 · 八类任务
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: full_eval
    label: |-
      执行完整三模态评测
      同时提供图像与音频
      文本问题含四个选项
      提取答案字母
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: ablations
    label: |-
      执行模态消融
      移除图像或音频
      用人工音频转写替代
      用模型图像描述替代
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告准确率
      精确匹配正确选项字母
      比较完整与消融输入
      加入音乐家人类基线
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: taxonomy
    type: primary
  - from: taxonomy
    to: team
    type: primary
  - from: team
    to: mcq
    type: primary
  - from: mcq
    to: dependency
    type: primary
  - from: dependency
    to: constraints
    type: primary
  - from: constraints
    to: rationales
    type: primary
  - from: rationales
    to: human_qc
    type: primary
  - from: human_qc
    to: model_qc
    type: primary
  - from: model_qc
    to: gate
    type: primary
  - from: gate
    to: release
    type: primary
  - from: release
    to: full_eval
    type: primary
  - from: full_eval
    to: ablations
    type: primary
  - from: ablations
    to: report
    type: primary
modules: []
