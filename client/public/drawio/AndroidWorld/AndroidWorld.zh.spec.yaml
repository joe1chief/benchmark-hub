meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AndroidWorld 构建与评测流程
  description: 对齐论文的 Android 任务构建、受控随机参数实例化、在线 Agent 交互、持久设备状态奖励和鲁棒性评测流程。
  legend: 116 项指人工编写的任务模板，不是 116 条静态样本。随机参数可生成数百万目标实例；优先从持久系统/应用状态判定成功， 仅在无法检查状态时使用界面元素。
nodes:
  - id: apps
    label: |-
      选择 20 个真实 Android 应用
      开源 F-Droid + 系统内置应用
      可离线 • 无需登录 • 数据存于设备
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: tasks
    label: |-
      编写 116 个实用任务模板
      笔记、日历、消息、地图与系统工具
      含修改状态与查询状态两类任务
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: annotate
    label: |-
      人工任务标注
      亲自执行并确认每个任务可解
      难度 • 类别 • 人类步数 • 用时
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: classes
    label: |-
      实现 TaskEval 类
      随机参数生成器 + 自然语言目标
      初始化 • 成功检查 • 清理
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: environment
    label: |-
      固定可复现设备环境
      Pixel 6 模拟器 • Android 13 • 固定应用版本
      时间重置为 2023-10-15 15:34 UTC
    type: database
    size: xl
    position:
      x: 1160
      'y': 100
  - id: taskeval
    label: |-
      发布 AndroidWorld 任务套件
      20 个应用中的 116 个模板
      受控随机种子可生成数百万变体
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: instantiate
    label: |-
      实例化一个在线任务
      按种子采样参数与初始状态
      渲染具体自然语言目标
    type: document
    size: xl
    position:
      x: 1440
      'y': 470
  - id: observations
    label: |-
      提供 Android 观察与动作
      AndroidEnv / ADB 的截图 + 无障碍树
      点击 • 长按 • 滑动 • 输入 • 导航 • 有限 API
    type: process
    size: xl
    position:
      x: 1160
      'y': 470
  - id: agent
    label: |-
      运行 Agent 交互循环
      观察 → 推理 → JSON 动作 → 观察结果
      成功或达到任务步数上限时停止
    type: process
    size: xl
    position:
      x: 880
      'y': 470
  - id: reward
    label: |-
      计算持久功能奖励
      检查文件、应用数据库与系统设置
      必要时查界面元素；组合任务可给部分奖励
    type: process
    size: xl
    position:
      x: 600
      'y': 470
  - id: metrics
    label: |-
      评测人类与基线 Agent
      M3A / M3A-Simple / Android 版 SeeAct
      成功率：最佳 Agent 30.6% • 人类 80.0%
    type: process
    size: xl
    position:
      x: 320
      'y': 470
  - id: robustness
    label: |-
      分析鲁棒性
      三个种子 + 同参数/异参数试验
      95% Wilson 区间；Pixel 5 / Android 12 交叉检查
    type: terminal
    size: xl
    position:
      x: 40
      'y': 470
edges:
  - from: apps
    to: tasks
    type: primary
  - from: tasks
    to: annotate
    type: primary
  - from: annotate
    to: classes
    type: primary
  - from: classes
    to: environment
    type: primary
  - from: environment
    to: taskeval
    type: primary
  - from: taskeval
    to: instantiate
    type: primary
  - from: instantiate
    to: observations
    type: primary
  - from: observations
    to: agent
    type: primary
  - from: agent
    to: reward
    type: primary
  - from: reward
    to: metrics
    type: primary
  - from: metrics
    to: robustness
    type: primary
modules: []
