meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AndroidWorld Paper-Aligned Build Process
  description: >-
    Construction and independent seeded evaluation aligned with AndroidWorld v5 Sections 3.2-3.5, 4-5, Appendix D, and
    the official repository.
  legend: >-
    The 116 TaskEval entries are dynamic templates over fixed apps and device versions; evaluation instantiates fresh
    seeded tasks and checks durable state.
nodes:
  - id: fixed_environment
    label: |-
      Fix 20 Android Apps
      Pixel 6 • Android 13
      Fixed App Versions
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: templates
    label: |-
      Implement 116 TaskEval Templates
      Parameterized Goals and State
      Init • Success • Teardown
    type: document
    size: xl
    position:
      x: 320
      'y': 100
  - id: execution_annotation
    label: |-
      6 Annotators Execute Tasks
      Label Steps and Difficulty
      Find and Fix 30+ Bugs
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: dynamic_release
    label: |-
      Release Dynamic AndroidWorld
      116 Templates across 20 Apps
      Millions of Goal Instances
    type: database
    size: xl
    position:
      x: 880
      'y': 100
  - id: seed_instance
    label: |-
      Instantiate an Independent Seed
      Sample Parameters and State
      Render One Concrete Goal
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: observation_action
    label: |-
      Expose Observation and Action
      Screenshot • Accessibility Tree
      Gestures • Text • Navigation
    type: process
    size: xl
    position:
      x: 1160
      'y': 430
  - id: agent_loop
    label: |-
      Run the Agent Loop
      Observe • Reason • Act
      Stop at Success or Limit
    type: process
    size: xl
    position:
      x: 880
      'y': 430
  - id: durable_reward
    label: |-
      Compute Durable-State Reward
      Files • Databases • Settings
      UI Fallback When Needed
    type: process
    size: xl
    position:
      x: 600
      'y': 430
  - id: robustness
    label: |-
      Measure Robustness
      Same and Different Parameters
      Seeds • Device Cross-Check
    type: process
    size: xl
    position:
      x: 320
      'y': 430
  - id: report
    label: |-
      Report Task Success
      Human and Agent Baselines
      Wilson Confidence Intervals
    type: terminal
    size: xl
    position:
      x: 40
      'y': 430
edges:
  - from: fixed_environment
    to: templates
    type: primary
  - from: templates
    to: execution_annotation
    type: primary
  - from: execution_annotation
    to: dynamic_release
    type: primary
  - from: dynamic_release
    to: seed_instance
    type: primary
  - from: seed_instance
    to: observation_action
    type: primary
  - from: observation_action
    to: agent_loop
    type: primary
  - from: agent_loop
    to: durable_reward
    type: primary
  - from: durable_reward
    to: robustness
    type: primary
  - from: robustness
    to: report
    type: primary
modules: []
