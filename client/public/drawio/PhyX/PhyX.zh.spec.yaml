meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PhyX 构建与评测流程
  description: 依据论文重绘四阶段采集、三级质量控制、3,300 到 3,000 的筛选、双题型与三文本视图、 testmini 比例抽样以及通用三级评测流程。
  legend: 最终 3,000 个独立问题形成 6,000 个 OE 与 MC 问题和 18,000 个核心题型视图实例； testmini 按比例抽取 1,000 个问题和 6,000 个实例。
nodes:
  - id: step_1
    label: |-
      调研核心物理学科
      梳理真实视觉推理缺口
      选择六个物理领域
      确立基准覆盖范围
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      定义分类体系
      6 个领域 · 25 个子领域
      6 种物理推理类型
      包含模型落地与预测推理
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      招募专家标注者
      由 STEM 研究生收集数据
      遵循详细标注协议
      面向大学级困难问题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      收集视觉物理问题
      使用允许再发布的来源材料
      避免答案紧邻题目
      降低数据污染风险
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      配对两种题型
      每个开放题转换为选择题
      每个选择题转换为开放题
      两种题型各占一半
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      创建三种文本视图
      Full-Text 保留原始描述
      去冗余版移除图中重复信息
      Text-Minimal 仅保留核心问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      生成图像描述
      对每张图使用 GPT-4o
      形成自包含文字描述
      支持纯文本 LLM 评测
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      汇总 3,300 个候选问题
      组合题型与平行视图
      保留图像和标准答案
      保留领域与推理标签
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      检测潜在重复问题
      分析词汇重叠
      标记相似问题
      将候选送交专家复核
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      由物理博士生复核
      确认并移除重复问题
      验证科学准确性
      检查场景的数据偏差
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      过滤最短的 10%
      移除上下文过少的短题
      定稿 3,000 个独立问题
      形成 18,000 个核心实例
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      构建 testmini 子集
      按物理领域比例抽样
      选取 1,000 个问题
      形成 6,000 个核心实例
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      生成并抽取答案
      零样本思维链提示
      输入图像或 GPT-4o 描述
      应用规则式答案抽取
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      判分并报告准确率
      DeepSeek-V3 判断开放题
      选择题先匹配字母再回退 Judge
      按题型视图领域推理切片
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
