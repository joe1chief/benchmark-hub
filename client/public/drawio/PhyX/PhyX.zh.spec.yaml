meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PhyX 论文对齐构建与评测流程
  description: 以论文 v2 为主线重绘构建和评测合同；当前 GitHub 与 Hugging Face 发布边界仅通过虚线证据边展示。
  legend: 实线复现论文流程；虚线标注来源、范围、提示词、许可、发布快照与实现漂移，不代表新增论文步骤。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv 2505.15929v2 · fc4a3a5a69d6
      Git 2cee68b17643 · 评测 3994c9615bcf
      HF 5a23a2762d06 · 卡片 5a72326b9392
      项目页 1e9652dcde32
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      定义物理覆盖范围
      六个领域 · 25 个子领域
      六种推理类型
      真实视觉情境落地
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: annotators
    label: |-
      招募 STEM 研究生
      担任专家标注者
      全部问题使用英文
      每题包含一张真实情境图像
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: source_policy
    label: |-
      选择允许使用的来源
      免费可访问在线资源
      教材及多种其他材料
      避免答案紧邻题目
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: question_pair
    label: |-
      配对两种题型
      每个开放题转换为选择题
      每个选择题转换为开放题
      选择题四项且仅一项正确
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: text_views
    label: |-
      创建三种平行视图
      Full-Text 原始文本
      去冗余版移除图文重复信息
      Text-Minimal 仅保留核心问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: caption
    label: |-
      用 GPT-4o 描述每张图
      覆盖细粒度视觉内容
      形成自包含文字描述
      支持纯文本 LLM 评测
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: candidates
    label: |-
      汇总候选池
      共 3,300 个问题
      来自多种来源
      保留答案图像与标签
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: cross_check
    label: |-
      执行标注质量核验
      标注者相互交叉检查
      定期随机抽样复核
      团队讨论歧义项
    type: process
    size: xl
    position:
      x: 1700
      'y': 320
  - id: duplicate_scan
    label: |-
      检测潜在重复题
      分析词汇重叠
      标记相似问题
      交由人工复核
    type: process
    size: xl
    position:
      x: 1460
      'y': 320
  - id: phd_review
    label: |-
      物理博士生人工复核
      确认并移除重复题
      验证科学准确性
      消除数据集偏差
    type: process
    size: xl
    position:
      x: 1220
      'y': 320
  - id: length_filter
    label: |-
      按文本长度筛选
      移除最短的 10%
      保留上下文充分的难题
      完成三级清洗
    type: process
    size: xl
    position:
      x: 980
      'y': 320
  - id: dataset
    label: |-
      定稿 PhyX
      3,000 个独立问题
      6,000 个成对开放题与选择题
      18,000 个核心题型视图实例
    type: database
    size: xl
    position:
      x: 740
      'y': 320
  - id: testmini
    label: |-
      构建 testmini
      按比例随机抽样
      覆盖六个物理领域
      1,000 个问题 · 6,000 个实例
    type: database
    size: xl
    position:
      x: 500
      'y': 320
  - id: eval_query
    label: |-
      选择评测视图
      输入图像或 GPT-4o 描述
      原文去冗余或最简文本
      开放题或选择题格式
    type: document
    size: xl
    position:
      x: 260
      'y': 320
  - id: cot
    label: |-
      生成模型预测
      零样本逐步推理指令
      使用附录 D.1 思维链提示
      保留原始推理输出
    type: process
    size: xl
    position:
      x: 20
      'y': 320
  - id: extract
    label: |-
      抽取最终答案
      规则优先抽取方框内容
      匹配最终或正确答案表达
      选择题搜索 A 到 D 选项
    type: process
    size: xl
    position:
      x: 20
      'y': 600
  - id: format_gate
    label: |-
      当前是哪种题型？
      开放题或选择题
      复用同一通用流程
    type: decision
    size: xl
    position:
      x: 260
      'y': 600
  - id: mc_match
    label: |-
      匹配选择题字母
      比较抽取的 A 到 D
      直接返回二元正确性
      否则调用 Judge 回退
    type: process
    size: xl
    position:
      x: 500
      'y': 600
  - id: oe_judge
    label: |-
      判断开放题语义等价
      DeepSeek-V3 对比标准答案
      多次重复调用 LLM
      论文要求每次均判断成功
    type: process
    size: xl
    position:
      x: 500
      'y': 800
  - id: mc_fallback
    label: |-
      判断含糊的选择题输出
      仅在字母直接匹配失败时使用
      复用同一 LLM Judge 模板
      返回二元正确性
    type: process
    size: xl
    position:
      x: 740
      'y': 600
  - id: accuracy
    label: |-
      汇总二元正确性
      计算准确率
      每个评测切片独立计分
      不使用部分得分
    type: database
    size: xl
    position:
      x: 980
      'y': 600
  - id: report
    label: |-
      报告细粒度准确率
      开放题与选择题 · 三种文本视图
      六个领域 · 六种推理类型
      对比模型与人类专家
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 600
  - id: prompt_boundary
    label: |-
      提示词与解析器披露边界
      论文披露思维链与正则逻辑
      披露 Judge 描述和推理类型提示
      发布代码补充少样本 Judge 细节
    type: document
    size: xl
    position:
      x: 20
      'y': 1000
  - id: release_boundary
    label: |-
      HF 快照 · 5a23a2762d06
      默认拆分为 3,000 与 1,000 条
      仅发布四个默认 TSV 文件
      另含多语言与带步骤配置
    type: database
    size: xl
    position:
      x: 740
      'y': 1000
  - id: code_boundary
    label: |-
      发布评测器 · 2cee68b17643
      五次重试温度从 0.0 到 2.0
      首个可解析判断即返回
      不等于论文的全次一致合同
    type: document
    size: xl
    position:
      x: 260
      'y': 1000
  - id: license_boundary
    label: |-
      分发边界
      Git 与 HF 声明 MIT
      上游来源条款仍然适用
      版权与合理使用规则不变
    type: document
    size: xl
    position:
      x: 740
      'y': 180
  - id: scope_boundary
    label: |-
      基准范围边界
      大学级英文问题
      真实视觉物理情境
      不等同于纯示意图知识回忆
    type: document
    size: xl
    position:
      x: 260
      'y': 180
