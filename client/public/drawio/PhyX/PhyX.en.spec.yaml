    size: xl
    position:
      x: 20
      'y': 320
  - id: extract
    label: |-
      Extract the Definitive Answer
      Rule-based Boxed Content First
      Final or Correct Answer Regex
      MC Searches an A to D Option
    type: process
    size: xl
    position:
      x: 20
      'y': 600
  - id: format_gate
    label: |-
      Which Question Format?
      Open-ended or Multiple-choice
      Use One Universal Pipeline
    type: decision
    size: xl
    position:
      x: 260
      'y': 600
  - id: mc_match
    label: |-
      Match the MC Option Letter
      Compare Extracted A to D
      Return Binary Correctness
      Otherwise Invoke Judge Fallback
    type: process
    size: xl
    position:
      x: 500
      'y': 600
  - id: oe_judge
    label: |-
      Judge Open-ended Equivalence
      DeepSeek-V3 Compares with Ground Truth
      Repeat the LLM Multiple Attempts
      Paper Requires All Attempts to Succeed
    type: process
    size: xl
    position:
      x: 500
      'y': 800
  - id: mc_fallback
    label: |-
      Judge Ambiguous MC Output
      Only When Direct Letter Match Fails
      Reuse the Same LLM Judge Template
      Return Binary Correctness
    type: process
    size: xl
    position:
      x: 740
      'y': 600
  - id: accuracy
    label: |-
      Aggregate Binary Correctness
      Compute Accuracy
      One Score per Evaluation Slice
      No Partial-credit Metric
    type: database
    size: xl
    position:
      x: 980
      'y': 600
  - id: report
    label: |-
      Report Fine-grained Accuracy
      OE versus MC · Three Text Views
      Six Domains · Six Reasoning Types
      Compare Models and Human Experts
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 600
  - id: prompt_boundary
    label: |-
      Prompt and Parser Disclosure
      Paper Discloses CoT and Regex Logic
      Judge Caption and Reasoning-type Prompts
      Released Code Adds Few-shot Judge Details
    type: document
    size: xl
    position:
      x: 20
      'y': 1000
  - id: release_boundary
    label: |-
      HF Snapshot · 5a23a2762d06
      Default Splits 3,000 and 1,000
      Four Default TSV Files Only
      Also Multilingual and With-steps Configs
    type: database
    size: xl
    position:
      x: 740
      'y': 1000
  - id: code_boundary
    label: |-
      Released Evaluator · 2cee68b17643
      Five Retries at Temperatures 0.0 to 2.0
      Returns the First Parseable Verdict
      Not the Paper's All-attempt Consensus
    type: document
    size: xl
    position:
      x: 260
      'y': 1000
  - id: license_boundary
    label: |-
      Distribution Boundary
      Git and HF Declare MIT
      Upstream Source Terms Still Apply
      Copyright and Fair-use Rules Remain
    type: document
    size: xl
    position:
      x: 740
      'y': 180
  - id: scope_boundary
    label: |-
      Benchmark Scope Boundary
      University-level English Questions
      Realistic Visual Physics Scenarios
      Not Schematic-only Recall Tasks
    type: document
    size: xl
    position:
      x: 260
      'y': 180
