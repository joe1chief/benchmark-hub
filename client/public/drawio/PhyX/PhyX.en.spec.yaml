meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PhyX Paper-aligned Build and Evaluation Process
  description: >-
    Paper-v2 construction and evaluation contract with the current GitHub and Hugging Face release boundaries shown
    separately as dashed evidence links.
  legend: >-
    Solid arrows reproduce the paper pipeline. Dashed arrows mark source, scope, prompt, license, release-snapshot, and
    released-code boundaries; they are not additional paper stages.
