meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Step-Audio-Edit Benchmark Build and Evaluation Process
  description: >-
    Step-Audio-Edit-Benchmark evaluates emotion, speaking style, and paralinguistic control with zero-shot voice
    cloning. Its eight speakers comprise two male and two female speakers per language: Chinese voices from
    Wenet-Speech4TTS and English voices from GLOBE-V2 and Libri-Light. The emotion set has five categories and 50
    content-matched Chinese plus 50 English prompts per category. The speaking-style set has seven categories with the
    same per-language count and target-matched content. Ten paralinguistic labels each have 50 relevant LLM-generated
    Chinese and 50 English samples. Crossing the 2,200 bilingual text samples with four speakers per language produces
    8,800 evaluation audios. Gemini-2.5-Pro classifies emotion among five choices and style among seven; category
    accuracy is averaged across speakers. For paralinguistics it applies a dedicated 1-to-3 rubric, explicitly checking
    required event insertion and omission, and the benchmark reports the overall mean judge score.
  legend: >-
    Source: Step-Audio-EditX Technical Report arXiv:2511.03601 Section 5.1; official
    stepfun-ai/Step-Audio-Edit-Benchmark repository. Solid arrows show the main flow explicitly supported by the paper
    or official documentation.
