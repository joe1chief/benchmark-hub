  layout: horizontal
  routing: orthogonal
  title: Step-Audio-Edit Benchmark 构建与评测流程
  description: >-
    Step-Audio-Edit-Benchmark用零样本声音克隆评测情感、说话风格和副语言控制。8名说话者按每种语言2男2女组成：中文声音来自Wenet-Speech4TTS，英文声音来自GLOBE-V2和Libri-Light。情感集含5类，每类各有50条中文与50条英文且文本内容匹配目标情感；说话风格集含7类，沿用相同的逐语言数量并让内容匹配目标风格；10个副语言标签各含50条相关LLM生成中文样本和50条英文样本。2200条双语文本与每种语言4名说话者组合后生成8800段评测音频。Gemini-2.5-Pro在5类情感和7类风格中做分类，逐类准确率在说话者间平均；副语言采用专门的1到3分量表，明确检查目标事件是否插入以及常见的遗漏失败，最终报告整体平均评分。
  legend: >-
    来源：Step-Audio-EditX Technical Report arXiv:2511.03601 Section 5.1; official stepfun-ai/Step-Audio-Edit-Benchmark
    repository。实线箭头表示论文或官方资料明确支持的主流程。
