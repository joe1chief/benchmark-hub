meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OneMillion-Bench 构建与评测流程
  description: 对齐论文通过多专家构建、对抗筛选、量规设计和分层计分评测高经济价值专业智能体任务。
  legend: 名称来自 Global 集约 1,008,370 美元的估算经济价值；基准实际含 400 题，英文全球语境与中文本地语境各 200 题。
nodes:
  - id: scope
    label: |-
      定义高价值专业范围
      金融 · 法律 · 医疗
      自然科学 · 工业
      37 个子域 · 92 个三级类别
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: task
    label: |-
      阶段一 · 专家创建任务
      编写实用半开放任务
      提供参考推理过程
      附加详细评分量规
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: design
    label: |-
      落实任务设计原则
      允许多种有效方法
      答案不随时间变化
      使用客观可量化标准
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: adversarial
    label: |-
      执行并发对抗测试
      覆盖不同前沿智能体家族
      应用专家通过阈值
      仅保留多个智能体失败的任务
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: peer
    label: |-
      阶段二 · 独立同行评审
      同一子域第二位专家
      检查清晰度与专业性
      核验公平性与设计一致性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: consensus
    label: |-
      迭代修订至专家共识
      交换结构化反馈
      统一任务与参考答案
      统一评测标准
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: third
    label: |-
      阶段三 · 解决争议
      第三位专家审计风险样例
      调整未达共识条目
      保证数据可靠性
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: difficulty
    label: |-
      执行难度双向截断
      移除所有智能体均解出的任务
      复查全部低分任务
      修订不可能完成的任务
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: rubrics
    label: |-
      编码专家评分量规
      标准 · 权重 · 能力标签
      来源与引用
      非对称权重范围 -20 至 10
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布 OneMillion-Bench
      400 题 · 每领域 80 题
      英文全球集 200 · 中国集 200
      五大领域 · 专家工作流
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: run
    label: |-
      运行不同智能体系统
      基础语言模型
      启用网页搜索的智能体
      深度研究智能体
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: judge
    label: |-
      逐量规判定回答
      网页搜索 · 推理
      表达 · 指令遵循
      同时应用奖励与负向惩罚
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      计算基准分数
      加权并截断的专家分数
      二元通过率
      保留逐量规结果
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告专业就绪度
      按领域与量规类型平均
      五领域等权计算总分
      关联得分与经济价值
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
