meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OneMillion-Bench 构建与评测流程
  description: 对齐论文第一版的专家任务构建、对抗筛选、量规计分与经济价值报告，并将固定公开数据和 README 评测示例作为独立发布边界。
  legend: 基准含 400 题，五个领域各含 40 道 Global 题与 40 道中文题。虚线表示证据或发布漂移，不属于主构建评测流程。
nodes:
  - id: evidence
    label: |-
      固定的一手证据
      arXiv 2603.07980v1 · PDF 97b53e25372e
      HF 5cf9d5005e2e · README 9590b6bfccff
      第 2.1–3.2、4.1 节 · 附录 B–C
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      定义高价值专业范围
      金融 · 法律 · 医疗
      自然科学 · 工业
      超过 2,000 个专家工时
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: task
    label: |-
      阶段一 · 专家创建任务
      编写实用半开放任务
      提供参考推理过程
      定义客观加权量规
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: adversarial
    label: |-
      执行对抗验证
      测试多个前沿智能体家族
      应用专家通过阈值
      保留多个智能体失败的任务
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: peer
    label: |-
      阶段二 · 独立同行评审
      同一子域的第二位专家
      检查清晰度与专业性
      审核原则与量规公平性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: consensus
    label: |-
      迭代修订至专家共识
      交换结构化反馈
      统一任务与参考答案
      统一评测标准
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: third
    label: |-
      阶段三 · 解决风险样例
      第三位专家审计争议
      调整未解决条目
      保障数据可靠性
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: difficulty
    label: |-
      执行难度双向截断
      移除所有智能体均解出的任务
      复查所有智能体均低分的任务
      修订不可能完成的任务
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: rubrics
    label: |-
      编码专家量规
      标准 · 有符号权重 · 标签
      来源与引用
      论文权重范围 -20 至 +10
    type: document
    size: xl
    position:
      x: 1940
      'y': 40
  - id: release
    label: |-
      发布 400 个任务
      每领域 80 题 · 每语言 40 题
      Global 200 · 中文 200
      五个仅测试集配置
    type: database
    size: xl
    position:
      x: 1940
      'y': 420
  - id: release_boundary
    label: |-
      固定数据边界
      HF 5cf9d5005e2e · Apache-2.0
      共 400 行 · 每题 11 至 37 条量规
      金融与法律的中英文题目不同
      其余三领域使用中英文配对
    type: document
    size: xl
    position:
      x: 1940
      'y': 800
  - id: systems
    label: |-
      运行不同智能体系统
      17 个基础模型
      对应的网页搜索变体
      三个深度研究智能体
    type: process
    size: xl
    position:
      x: 1700
      'y': 420
  - id: judge
    label: |-
      判定逐条量规满足情况
      同时应用奖励与惩罚
      事实 · 分析 · 指令遵循
      结构与格式
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: expert_score
    label: |-
      计算专家分数
      累加满足项的有符号权重
      除以全部正权重上限
      将单题分数截断到 [0, 1]
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: pass_rate
    label: |-
      计算通过率
      单题分数至少 0.7 即通过
      平均二元通过指示值
      Global 与中文集分别统计
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: aggregate
    label: |-
      聚合诊断分数
      先平均每个领域内的题目
      再等权平均五个领域
      另按量规类型求平均
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: economic
    label: |-
      报告经济就绪度
      Global 工作量价值 1,008,370 美元
      中文工作量价值 921,832 元
      比较价值、专家分数与通过率
    type: terminal
    size: xl
    position:
      x: 500
      'y': 420
  - id: drift
    label: |-
      论文与发布集漂移
      正文 37/86 · 图与附录 37/92
      HF 三个领域复用中英文配对 case_id
      HF 数据出现 +12 的正权重
      README 按 en 过滤但数据为 global/cn
      评测实现不完整
    type: document
    size: xl
    position:
      x: 260
      'y': 420
edges:
  - from: evidence
    to: scope
    type: secondary
    style:
      dashed: true
  - from: scope
    to: task
    type: primary
  - from: task
    to: adversarial
    type: primary
  - from: adversarial
    to: peer
    type: primary
  - from: peer
    to: consensus
    type: primary
  - from: consensus
    to: third
    type: primary
  - from: third
    to: difficulty
    type: primary
  - from: difficulty
    to: rubrics
    type: primary
  - from: rubrics
    to: release
    type: primary
  - from: release
    to: systems
    type: primary
  - from: systems
    to: judge
    type: primary
  - from: judge
    to: expert_score
    type: primary
  - from: expert_score
    to: pass_rate
    type: primary
  - from: pass_rate
    to: aggregate
    type: primary
  - from: aggregate
    to: economic
    type: primary
  - from: release
    to: release_boundary
    type: secondary
    style:
      dashed: true
  - from: economic
    to: drift
    type: secondary
    style:
      dashed: true
modules: []
