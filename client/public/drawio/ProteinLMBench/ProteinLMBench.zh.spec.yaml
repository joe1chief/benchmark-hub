meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProteinLMBench 构建与评测流程
  description: 按论文从下载的蛋白质研究论文出发，经LLM产题、机器与作者验证、随机抽样、质量控制后构建选择题并按准确率评测。
  legend: 论文规定944道带解释的人工标注六选一题，从超过10万条蛋白质问答池随机抽取，且未建议训练验证测试划分。
nodes:
  - id: step_1
    label: |-
      汇集公开蛋白质来源
      PubMed与PubMed Central文献
      UniProt · RefSeq · SIFTS
      Enzyme Nomenclature资源
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      下载研究论文
      保留蛋白质相关科学文本
      删除与蛋白质无关的文献
      准备用于产题的文档
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      使用LLM起草问题
      阅读已下载研究论文
      生成相关蛋白质问题
      生成答案与解释
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      构建候选问答池
      汇总蛋白质相关问答对
      覆盖知识与序列推理
      形成超过10万条问答对
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      执行机器验证
      应用自定义Python检查
      识别格式错误或噪声记录
      验证生成候选题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      执行人工验证
      论文作者审核候选题
      检查问题和答案正确性
      人工标注保留题目
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      过滤并降低噪声
      运行验证与质量控制
      修正检测到的异常
      移除损坏信息
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      随机抽取基准题
      从超过10万条问答池抽样
      因人力限制控制审核规模
      保留944道题
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      格式化每条评测样例
      保存问题与答案选项
      保存正确选项
      附带正确答案解释
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      以六选一为目标格式
      平衡正确选项位置
      覆盖选项1至选项6
      保留论文报告的统计口径
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      冻结ProteinLMBench
      蛋白质性质预测
      蛋白质描述
      序列理解 · 不设推荐划分
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      执行模型推理
      评测基础与训练后LLM设置
      提供一道题及其选项
      收集模型选择的答案
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      对照标准答案
      规范化模型选择的选项
      逐题标记正确或错误
      聚合全部944道题
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告准确率
      正确题数除以944
      比较无训练 · SFT · SSL-SFT
      使用单一基准总分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
