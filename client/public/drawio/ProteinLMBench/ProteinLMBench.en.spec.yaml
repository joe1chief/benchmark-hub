  layout: horizontal
  routing: orthogonal
  title: ProteinLMBench Build and Evaluation Process
  description: >-
    Paper-aligned creation of protein multiple-choice questions from downloaded research papers using LLM drafting,
    machine and author validation, random sampling, quality control, and accuracy-based evaluation.
  legend: >-
    The paper specifies 944 manually annotated six-choice questions with explanations, randomly sampled from a pool of
    more than 100,000 protein question-answer pairs; it recommends no train, validation, or test split.
