meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FOFO 构建流程
  description: 与论文对齐的 AI-人工协作构建、固定版本发布审计及完整格式准确率评测链路。
  legend: 实线按 arXiv:2402.18667v1 展示从领域体系、494 条指令发布到模型提示封装、GPT-4 格式判定、JSON 解析、准确率聚合及论文人工验证的完整流程。
nodes:
  - id: evidence
    label: |-
      证据边界：arXiv:2402.18667v1
      FoFo @ 140b1661
      测试集 SHA 8f4cddcb
      论文方法 + 固定公开发布物审计
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: domain_taxonomy
    label: |-
      专家给出适合智能体的子领域种子
      GPT-4 扩展，人工迭代并重新归组
      10 个领域 × 5 个子领域 = 50
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: format_candidates
    label: |-
      GPT-4 为每个子领域提出 5 种专用格式
      500 个候选三元组 · 254 个唯一字符串
      要求人类可读，初始排除通用格式
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: format_review
    label: |-
      专家评估、重生成或移除候选格式
      加回 JSON / XML / CSV
      以及 Markdown / YAML
      再确定领域-格式清单
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: instruction_authoring
    label: |-
      GPT-4 为每个三元组写 FORMAT-INSTRU
      明确格式配置与真实任务
      提供虚拟上下文或允许模型自行补全
    type: process
    size: xl
    position:
      x: 1080
      'y': 120
  - id: release
    label: |-
      人工逐条核验、编辑、移除或重生成
      发布：494 条指令 · 248 种格式
      指令平均长度 2,908 字符
    type: database
    size: xl
    position:
      x: 1340
      'y': 120
  - id: prompting
    label: |-
      按模型家族封装每条指令
      Alpaca · Vicuna · Mistral
      Zephyr · OpenChat
      其他模型直接使用原始指令
    type: process
    size: xl
    position:
      x: 1340
      'y': 390
  - id: generation
    label: |-
      每条指令生成一个回答
      temperature 0.7 · top-p 1
      最多 5,120 token
      解码并剥离提示，Zephyr 单独切分
    type: process
    size: xl
    position:
      x: 1080
      'y': 390
  - id: judge
    label: |-
      GPT-4 评审 · 最多 1,024
      temperature 0
      为每个回答输出二元判定与理由
      缺少任一格式要求即失败
    type: process
    size: xl
    position:
      x: 820
      'y': 390
  - id: parser_metric
    label: |-
      json_parser 提取
      format_correctness
      仅保留二元 0/1 标签
      准确率 = 100 × n_correct / n_total
    type: process
    size: xl
    position:
      x: 560
      'y': 390
  - id: human_audit
    label: |-
      人工复核 100 个模型回答
      84/100 与 GPT-4 一致
      16 个分歧均为评审假阳性
    type: terminal
    size: xl
    position:
      x: 300
      'y': 390
edges:
  - from: evidence
    to: domain_taxonomy
    type: primary
  - from: domain_taxonomy
    to: format_candidates
    type: primary
  - from: format_candidates
    to: format_review
    type: primary
  - from: format_review
    to: instruction_authoring
    type: primary
  - from: instruction_authoring
    to: release
    type: primary
  - from: release
    to: prompting
    type: primary
  - from: prompting
    to: generation
    type: primary
  - from: generation
    to: judge
    type: primary
  - from: judge
    to: parser_metric
    type: primary
  - from: parser_metric
    to: human_audit
    type: primary
modules: []
