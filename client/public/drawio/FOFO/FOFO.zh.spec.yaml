meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FOFO 构建流程
  description: 按论文还原 FOFO 的人机协作构建与“全部格式要求均满足”的评测流程。
  legend: 实线箭头遵循 arXiv:2402.18667，依次展示领域扩展、格式生成、专家修订、FORMAT-INSTRU构造、模型生成、GPT-4二元判断和人工一致性验证。
nodes:
  - id: domain_seed
    label: |-
      专家提供适合AI智能体的子领域种子
      GPT-4扩展并归纳为超级领域
      人工反复再生成与复核
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: taxonomy
    label: |-
      固化领域分类体系
      10个领域×每领域5个子领域
      覆盖医疗、金融、软件、法律、艺术等
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: format_generation
    label: |-
      GPT-4为每个子领域提出5种文本格式
      要求人可理解、领域专用并附示例
      初步排除通用TXT/CSV/JSON/XML
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: format_review
    label: |-
      专家评估、再生成或移除格式
      再加入通用JSON/XML/CSV/Markdown/YAML
      最终248种数据格式
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: instruction_generation
    label: |-
      GPT-4按三元组编写FORMAT-INSTRU
      真实复杂任务 + 精确格式配置
      附虚拟上下文或允许补全缺失细节
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: instruction_review
    label: |-
      人工逐条核验、编辑、移除或再生成
      最终494条FORMAT-INSTRU
      平均指令长度2,908字符
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: generation
    label: |-
      对每条测试指令生成一次回答
      使用各模型官方提示格式
      采样温度0.7 · 最多5,120新tokens
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: evaluation
    label: |-
      GPT-4给二元格式判断与解释
      缺少任一要求即整题失败
      报告格式准确率；人工复核84/100一致
    type: terminal
    size: xl
    position:
      x: 1860
      'y': 250
edges:
  - from: domain_seed
    to: taxonomy
    type: primary
  - from: taxonomy
    to: format_generation
    type: primary
  - from: format_generation
    to: format_review
    type: primary
  - from: format_review
    to: instruction_generation
    type: primary
  - from: instruction_generation
    to: instruction_review
    type: primary
  - from: instruction_review
    to: generation
    type: primary
  - from: generation
    to: evaluation
    type: primary
modules: []
