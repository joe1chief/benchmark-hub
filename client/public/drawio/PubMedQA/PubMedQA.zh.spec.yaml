meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PubMedQA 构建流程
  description: >-
    对齐论文的 PubMedQA 流程：从 PubMed 结构化摘要构建专家标注 PQA-L、规则筛选 PQA-U 和启发式生成 PQA-A 三条支路；模型可跨三种资源分阶段训练，但正式基准在 PQA-L
    测试集上评估是/否/不确定推理的准确率和宏 F1。
  legend: 实线箭头表示自然问题与启发式生成问题支路、三个发布子集、训练和 PQA-L 评测协议。
nodes:
  - id: pubmed
    label: |-
      PubMed 结构化摘要
      标题 + 正文 + 结论
    type: database
    size: large
    position:
      x: 40
      'y': 300
  - id: natural_titles
    label: |-
      自然问题标题
      标题含问号
      摘要具有结论部分
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: natural_instance
    label: |-
      pre-PQA-U 样本
      问题 = 标题
      上下文 = 去掉结论的摘要
      长答案 = 摘要结论
    type: document
    size: xl
    position:
      x: 600
      'y': 80
  - id: expert_annotation
    label: |-
      两位医学博士候选人标注
      一人看长答案；一人不看
      分歧则讨论，无法一致则移除
    type: user
    size: xl
    position:
      x: 900
      'y': 20
  - id: pqa_l
    label: |-
      PQA-L：1,000 个专家标注
      500 个做十折交叉验证
      500 个留作测试
    type: database
    size: xl
    position:
      x: 1200
      'y': 20
  - id: answerable_filter
    label: |-
      PQA-U 规则筛选
      排除疑问词和多实体选择题
      可答性一致率超过 93%
    type: process
    size: xl
    position:
      x: 900
      'y': 240
  - id: pqa_u
    label: |-
      PQA-U
      61.2K 个未标注样本
      可用是 / 否 / 不确定回答
    type: database
    size: xl
    position:
      x: 1200
      'y': 240
  - id: statement_titles
    label: |-
      陈述句标题文章
      NP-(VBP/VBZ) 句法模式
      必须有结构化结论
    type: process
    size: xl
    position:
      x: 320
      'y': 520
  - id: artificial_convert
    label: |-
      启发式问题转换
      前移 / 添加系词或助动词
      按动词否定状态标注是 / 否
    type: process
    size: xl
    position:
      x: 600
      'y': 520
  - id: pqa_a
    label: |-
      PQA-A：211.3K 个启发式生成样本
      训练 200K / 验证 11.3K
      是 92.8% / 否 7.2%
    type: database
    size: xl
    position:
      x: 900
      'y': 520
  - id: training
    label: |-
      可选分阶段训练
      PQA-A 预训练 → PQA-U 伪标注
      → PQA-L 微调
    type: process
    size: xl
    position:
      x: 1500
      'y': 300
  - id: evaluate
    label: |-
      PQA-L 需推理测试
      输入：问题 + 上下文
      推理时隐藏结论
    type: process
    size: xl
    position:
      x: 1800
      'y': 300
  - id: prediction
    label: |-
      预测一个标签
      是 / 否 / 不确定
    type: process
    size: large
    position:
      x: 2080
      'y': 300
  - id: metric
    label: |-
      测试准确率
      三标签宏 F1
    type: terminal
    size: large
    position:
      x: 2320
      'y': 300
edges:
  - from: pubmed
    to: natural_titles
    type: primary
  - from: pubmed
    to: statement_titles
    type: primary
  - from: natural_titles
    to: natural_instance
    type: primary
  - from: natural_instance
    to: expert_annotation
    type: primary
  - from: expert_annotation
    to: pqa_l
    type: primary
  - from: natural_instance
    to: answerable_filter
    type: primary
  - from: answerable_filter
    to: pqa_u
    type: primary
  - from: statement_titles
    to: artificial_convert
    type: primary
  - from: artificial_convert
    to: pqa_a
    type: primary
  - from: pqa_l
    to: training
    type: primary
  - from: pqa_u
    to: training
    type: primary
  - from: pqa_a
    to: training
    type: primary
  - from: training
    to: evaluate
    type: primary
  - from: evaluate
    to: prediction
    type: primary
  - from: prediction
    to: metric
    type: primary
modules: []
