meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PubMedQA Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of the three PubMedQA subsets, the asymmetric two-annotator PQA-L protocol,
    rule-filtered PQA-U, heuristic PQA-A, and reasoning-required PQA-L evaluation.
  legend: >-
    Solid arrows reproduce paper-disclosed construction and evaluation. Dashed arrows mark fixed evidence,
    official-release, evaluator-implementation, and license boundaries.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 1909.06146v1
      PDF 190af87fa13a
      Official Code 1cbae8e92f72
    type: document
    size: xl
    position: { x: 20, y: 340 }
    style: { fontSize: 9 }
  - id: pubmed_pool
    label: |-
      PubMed Article Pool
      Structured Abstracts
      Title · Body · Conclusion
    type: database
    size: xl
    position: { x: 260, y: 340 }
  - id: natural_gate
    label: |-
      Select Natural Questions
      Title Contains Question Mark
      Structured Abstract Has
      a Conclusive Section
    type: process
    size: xl
    position: { x: 500, y: 80 }
    style: { fontSize: 9 }
  - id: natural_instance
    label: |-
      Build pre-PQA-U Instance
      Question = Original Title
      Context = Abstract without Conclusion
      Long Answer = Conclusion
    type: document
    size: xl
    position: { x: 740, y: 80 }
    style: { fontSize: 9 }
  - id: pqal_sample
    label: |-
      Randomly Sample Candidates
      for Expert PQA-L Annotation
    type: process
    size: xl
    position: { x: 980, y: -60 }
  - id: answerability_gate
    label: |-
      Yes · No · Maybe Answerable?
      Remove Non-answerable Items
      before Expert Labeling
    type: process
    size: xl
    position: { x: 1220, y: -60 }
  - id: annotator_one
    label: |-
      Annotator 1 · M.D. Candidate
      Sees Question + Context
      + Long Answer
      Reasoning-free Label
    type: user
    size: xl
    position: { x: 1460, y: -200 }
    style: { fontSize: 9 }
  - id: annotator_two
    label: |-
      Annotator 2 · M.D. Candidate
      Sees Question + Context Only
      Long Answer Is Hidden
      Reasoning-required Label
    type: user
    size: xl
    position: { x: 1460, y: 80 }
    style: { fontSize: 9 }
  - id: agreement_gate
    label: |-
      Compare Two Labels
      Same Label Becomes
      the Ground Truth
    type: process
    size: xl
    position: { x: 1700, y: -60 }
  - id: discussion
    label: |-
      If Labels Differ
      Annotators Discuss
      Seek One Agreed Label
    type: process
    size: xl
    position: { x: 1940, y: 180 }
  - id: removed_item
    label: |-
      Remove Candidate
      Non-answerable or
      No Agreement Reached
    type: terminal
    size: xl
    position: { x: 2180, y: 380 }
  - id: pqa_l
    label: |-
      PQA-L
      1,000 Expert-labeled Items
      Yes 55.2% · No 33.8%
      Maybe 11.0%
    type: database
    size: xl
    position: { x: 2180, y: -60 }
    style: { fontSize: 9 }
  - id: pqa_l_split
    label: |-
      Fixed PQA-L Split
      500 Random Items for
      10-fold Cross-validation
      Remaining 500 Test Items
    type: database
    size: xl
    position: { x: 2420, y: -60 }
    style: { fontSize: 9 }
  - id: eval_input
    label: |-
      Reasoning-required Test
      Input Question + Context
      Conclusion Remains Hidden
    type: process
    size: xl
    position: { x: 2660, y: -60 }
  - id: predict
    label: |-
      Predict One Label
      Yes · No · Maybe
      for Every Test PMID
    type: process
    size: xl
    position: { x: 2900, y: -60 }
  - id: metrics
    label: |-
      PQA-L Test Report
      Accuracy
      Macro-F1 over Three Labels
    type: terminal
    size: xl
    position: { x: 3140, y: -60 }
  - id: pqa_u_filter
    label: |-
      Rule-filter pre-PQA-U
      Remove Wh-word Questions
      and Multi-entity Selections
      Answerability Agreement
      More than 93% vs Annotator 1
    type: process
    size: xl
    position: { x: 980, y: 400 }
    style: { fontSize: 9 }
  - id: pqa_u
    label: |-
      PQA-U
      61.2K Unlabeled Items
      Retained as Answerable by
      Yes · No · Maybe
    type: database
    size: xl
    position: { x: 1220, y: 400 }
    style: { fontSize: 9 }
  - id: statement_gate
    label: |-
      Select Statement Titles
      NP-(VBP/VBZ) POS Pattern
      Structured Abstract Has
      a Conclusive Section
    type: process
    size: xl
    position: { x: 500, y: 760 }
    style: { fontSize: 9 }
  - id: artificial_convert
    label: |-
      Heuristic PQA-A Conversion
      Move or Add Copula/Auxiliary
      Revise into a Question
      Label by Verb Negation
    type: process
    size: xl
    position: { x: 740, y: 760 }
    style: { fontSize: 9 }
  - id: pqa_a
    label: |-
      PQA-A
      211.3K Artificial Items
      Yes 92.8% · No 7.2%
      No Maybe Labels
    type: database
    size: xl
    position: { x: 980, y: 760 }
    style: { fontSize: 9 }
  - id: pqa_a_split
    label: |-
      PQA-A Split
      Random 200K Training
      Remaining 11.3K Validation
    type: database
    size: xl
    position: { x: 1220, y: 760 }
  - id: release_snapshot
    label: |-
      Fixed Official Release
      Commit 1cbae8e92f72
      PQA-L 1,000 Records
      ori_pqal 8b3276be8942
      Test GT 939fe566f090
    type: document
    size: xl
    position: { x: 2180, y: 720 }
    style: { fontSize: 9 }
  - id: evaluator_boundary
    label: |-
      Evaluator Implementation
      evaluation.py 2838af5bb0ac
      Requires Exactly Test PMIDs
      sklearn Accuracy + Macro-F1
    type: document
    size: xl
    position: { x: 3140, y: 480 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      Release Terms Boundary
      Repository LICENSE Is MIT
      License SHA 8e75abc6136b
    type: document
    size: xl
    position: { x: 2420, y: 980 }
    style: { fontSize: 9 }
