meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SimpleQA Verified Build and Evaluation Process
  description: >-
    SimpleQA Verified filters and corrects OpenAI's 4,326-item SimpleQA to create a 1,000-prompt no-tool
    parametric-factuality benchmark. The authors retain one question per source document, then apply Gemini-embedding
    and TF-IDF de-duplication, remove sources whose publishers opt out via crawler controls, and rebalance answer types
    and topics. Search-augmented model ensembles reconcile conflicting nonnumeric answers and numeric answers within a
    five-percent margin; numeric ground truths are rewritten with item-specific acceptable ranges. Frontier-model
    difficulty filtering retains 1,000 hard prompts. Manual review then repairs URLs and date precision and adds
    reasoning and multi-step metadata. Models answer with standard API settings and no tools. GPT-4.1 grades each
    response correct, incorrect, or not attempted using a revised prompt that handles numeric ranges, extra information,
    hedging, and varied refusal styles. Accuracy, correct-given-attempted, attempted rate, hedged rate, and their
    harmonic F1 are reported.
  legend: >-
    Source: SimpleQA Verified arXiv:2509.07968 Sections 2-3 and Appendix A; official Google DeepMind Kaggle benchmark.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
