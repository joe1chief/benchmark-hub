  title: SimpleQA Verified 构建与评测流程
  description: >-
    SimpleQA
    Verified把OpenAI原SimpleQA的4326题筛选与纠错为1000条无工具参数知识事实性提示。作者先保证每个来源文档只保留一题，再用Gemini嵌入和TF-IDF去重，移除发布者通过爬虫控制选择退出的来源，并平衡答案类型与主题。搜索增强模型集成用于调和非数值冲突来源，并以5%范围检查数值来源；数值真值被改写为逐题可接受区间。随后通过前沿模型难度筛选保留1000道难题，人工复核URL和日期精度并补充推理与多步元数据。模型使用标准API配置且不调用工具作答，GPT-4.1用改进提示把回答判为正确、错误或未作答，并处理数值区间、附加信息、含糊候选和多种拒答方式。最终报告Accuracy、作答条件准确率、作答率、含糊率及前两者的调和F1。
  legend: >-
    来源：SimpleQA Verified arXiv:2509.07968 Sections 2-3 and Appendix A; official Google DeepMind Kaggle
    benchmark。实线箭头表示论文或官方资料明确支持的主流程。
