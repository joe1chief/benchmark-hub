meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Mars-Bench 构建流程
  description: >-
    依据论文重绘的 Mars-Bench 流程：按可用性与宽松许可筛选既有火星科学数据，选出覆盖分类、分割和目标检测的 20 个轨道器与火星车数据集；在行星科学专家及原作者参与下整理、重构、去重、平衡并纠正数据，提供统一加载器
    和常用标注格式；有官方训练/验证/测试划分则保留，否则按标准方法创建；再派生跨域、比例子集和少样本版本， 调优三种训练策略并用七个随机种子重训，最终报告任务指标、归一化 IQM 与自举 95% 置信区间。
  legend: 实线表示保留的数据；点线分支表示被论文筛选门排除的数据集。
