meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MARS-Bench 构建流程
  description: >-
    依据论文重绘的 MARS-Bench 流程：从 ESPN 收集英文 NBA/NHL 逐事件记录与赛后统计，并从虎扑收集中文 NBA
    数据；标准化每场完整比赛；人工设计指令遵循、上下文检索、信息推理和任务切换问题；通过正则选择上下文、派生唯一答案并构建加权证据清单；执行抽样核验、作者独立交叉复核和 DeepSeek-V3-0324
    辅助一致性检查；先组装增量对话，再形成 120 场比赛与 4,010 次查询，最后由 LLM 裁判仅依据加权检查清单评估零样本逐轮回复。
  legend: 实线表示构建与评测主流程；点线支路仅把赛后统计送入答案核验。
nodes:
  - id: sources
    label: |-
      体育数据来源
      ESPN 英文 NBA/NHL
      虎扑中文 NBA
    type: database
    size: large
    position:
      x: 40
      'y': 120
  - id: standardize
    label: |-
      标准化完整比赛
      实况 • 阵容 • 统计
    type: process
    size: large
    position:
      x: 250
      'y': 120
  - id: model_input
    label: |-
      模型输入
      逐事件实况 + 阵容
    type: document
    size: large
    position:
      x: 460
      'y': 120
  - id: taxonomy
    label: |-
      四类任务
      指令 • 检索 • 推理 • 切换
    type: process
    size: large
    position:
      x: 670
      'y': 120
  - id: questions
    label: |-
      人工设计问题
      按比赛节次与任务
    type: process
    size: large
    position:
      x: 880
      'y': 120
  - id: answers
    label: |-
      正则筛选上下文
      派生唯一参考答案
    type: process
    size: large
    position:
      x: 1090
      'y': 120
  - id: checklists
    label: |-
      加权证据清单
      事实项 + 首检条件
    type: process
    size: large
    position:
      x: 1300
      'y': 120
  - id: sample_check
    label: |-
      抽样核验
      每种题型 5 题
      核验答案抽取
    type: process
    size: large
    position:
      x: 1510
      'y': 280
  - id: cross_review
    label: |-
      作者独立
      交叉复核
    type: process
    size: large
    position:
      x: 1510
      'y': 420
  - id: consistency
    label: |-
      DeepSeek-V3-0324
      辅助一致性检查
    type: process
    size: large
    position:
      x: 1300
      'y': 420
  - id: dataset
    label: |-
      MARS-Bench
      120 场 • 4,010 次查询
      平均 33.42 轮
    type: database
    size: large
    position:
      x: 880
      'y': 420
  - id: dialogue
    label: |-
      组装增量对话
      每节 5 个比分轮次
      插入分类问题
    type: process
    size: large
    position:
      x: 1090
      'y': 420
  - id: target
    label: |-
      目标模型零样本作答
      每轮均需响应
    type: process
    size: large
    position:
      x: 670
      'y': 420
  - id: judge
    label: |-
      仅按清单评分
      参考答案只作上下文
      首检条件可归零
    type: process
    size: large
    position:
      x: 460
      'y': 420
  - id: report
    label: |-
      分任务与总体
      准确率（%）
    type: terminal
    size: large
    position:
      x: 250
      'y': 420
  - id: verification_stats
    label: |-
      仅用于核验
      赛后统计
    type: database
    size: large
    position:
      x: 1300
      'y': 280
edges:
  - from: sources
    to: standardize
    type: primary
  - from: standardize
    to: model_input
    type: primary
  - from: standardize
    to: verification_stats
    type: data
    waypoints:
      - x: 355
        'y': 315
      - x: 1270
        'y': 315
  - from: model_input
    to: taxonomy
    type: primary
  - from: taxonomy
    to: questions
    type: primary
  - from: questions
    to: answers
    type: primary
  - from: verification_stats
    to: sample_check
    type: data
    style:
      exitX: 1
      exitY: 0.5
      exitDx: 0
      exitDy: 0
      entryX: 0
      entryY: 0.5
      entryDx: 0
      entryDy: 0
  - from: answers
    to: checklists
    type: primary
  - from: checklists
    to: sample_check
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      exitDx: 0
      exitDy: 0
      entryX: 0.5
      entryY: 0
      entryDx: 0
      entryDy: 0
  - from: sample_check
    to: cross_review
    type: primary
  - from: cross_review
    to: consistency
    type: primary
  - from: consistency
    to: dialogue
    type: primary
  - from: dialogue
    to: dataset
    type: primary
  - from: dataset
    to: target
    type: primary
  - from: target
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
