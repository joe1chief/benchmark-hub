meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Mars-Bench Build Process
  description: >-
    Paper-aligned Mars-Bench workflow: screen existing Mars science datasets for usability and permissive licensing;
    select 20 orbital and rover datasets across classification, segmentation, and object detection; organize,
    restructure, deduplicate, rebalance, and correct them with planetary-science experts and original authors; provide
    unified loaders and common annotation formats; preserve official train/validation/test splits or create standard
    ones; derive cross-domain, partitioned, and few-shot versions; tune three training regimes; retrain seven seeds; and
    report task metrics plus normalized IQM and bootstrapped 95% confidence intervals.
  legend: Solid arrows show retained data; the dotted branch shows datasets excluded by the paper's gates.
