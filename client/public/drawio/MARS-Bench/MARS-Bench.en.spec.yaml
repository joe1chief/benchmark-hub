meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MARS-Bench Build Process
  description: >-
    Paper-aligned MARS-Bench workflow: collect English NBA and NHL play-by-play records plus post-game statistics from
    ESPN and Chinese NBA records from Hupu; standardize each complete game; manually design Instruction Following,
    Context Retrieval, Information Reasoning, and Task Switching questions; derive unique answers with
    regular-expression context selection and weighted evidence checklists; apply sampling, independent author
    cross-review, and DeepSeek-V3-0324-assisted consistency checks; assemble incremental dialogues; finalize 120 games
    and 4,010 queries; then score zero-shot model responses solely against the weighted checklist.
  legend: >-
    Solid arrows show construction and evaluation flow; the dotted branch carries post-game statistics only for answer
    verification.
nodes:
  - id: sources
    label: |-
      Sports Sources
      ESPN EN NBA/NHL
      Hupu ZH NBA
    type: database
    size: large
    position:
      x: 40
      'y': 120
  - id: standardize
