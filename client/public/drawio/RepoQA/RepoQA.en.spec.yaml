meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RepoQA Build and Evaluation Process
  description: >-
    Paper-aligned construction and evaluation of 500 multilingual Searching Needle Function tasks from
    dependency-ordered real repositories and explicit name-free function descriptions.
  legend: >-
    Read task construction left-to-right, then retrieval evaluation right-to-left; each of five languages contributes
    ten repositories and each repository contributes ten depth-controlled needle functions.
nodes:
  - id: repositories
    label: |-
      50 Popular GitHub Repositories
      Python / C++ / Java / TypeScript / Rust
      10 per Language; >= 100 Stars
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: quality
    label: |-
      Repository Quality Gate
      Topic Diversity + Packaged Project
      Unit Tests or CI/CD Pipeline
    type: decision
    size: xl
    position:
      x: 320
      'y': 100
  - id: dependencies
    label: |-
      Entry-Directory Analysis
      Keep Main-Package Source Files
      Annotate File Dependencies
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: candidates
    label: |-
      Dependency-Ordered Candidate Pool
      Concatenate Sources Topologically
      64 Chunks; Unique Name; Body < 2,000 Bytes
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: descriptions
    label: |-
      Needle Description Annotation
      GPT-4-Turbo Writes Four Sections
      Hide Function and Variable Names
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      RepoQA SNF Release
      10 Needles per Repository
      500 Tasks across 5 Languages
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: placement
    label: |-
      Depth-Controlled 16k Context
      Place Needles at 10%...100%
      Surround with Topological Repository Code
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: prompt
    label: |-
      Searching Needle Function Prompt
      Instruction + Code + Description
      Repeat Instruction at the End
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: output
    label: |-
      Model Repeats Exact Function
      Return Code in a Fenced Block
      No Repository Tools or Agent Loop
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: parse
    label: |-
      Tree-Sitter Post-Processing
      Extract First Syntactically Valid Block
      Compare against All Context Functions
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: match
    label: |-
      Retrieval Success Gate
      Needle Has Highest Smoothed BLEU
      Needle Similarity > 0.8
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      RepoQA Retrieval Accuracy
      Overall and per Language
      Optional Comment-Free Comparison
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: repositories
    to: quality
    type: primary
  - from: quality
    to: dependencies
    type: primary
  - from: dependencies
    to: candidates
    type: primary
  - from: candidates
    to: descriptions
    type: primary
  - from: descriptions
    to: release
    type: primary
  - from: release
    to: placement
    type: primary
  - from: placement
    to: prompt
    type: primary
  - from: prompt
    to: output
    type: primary
  - from: output
    to: parse
    type: primary
  - from: parse
    to: match
    type: primary
  - from: match
    to: report
    type: primary
modules: []
