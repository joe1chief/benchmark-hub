  layout: horizontal
  routing: orthogonal
  title: RepoQA Data Construction, Retrieval Task, and Scoring
  description: >-
    Based on arXiv v1, pinned official code, and the default release; separates repository selection,
    function/description construction, SNF prompt assembly, and BLEU scoring.
  legend: >-
    The top two rows construct benchmark data; row three covers release and runtime task assembly; row four scores
    output. The isolated card marks an undisclosed QA gate. Edges carry no text.
