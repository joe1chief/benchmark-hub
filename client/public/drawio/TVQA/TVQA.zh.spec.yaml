meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TVQA 构建与评测流程
  description: >-
    TVQA从三种类型的6部长篇电视剧中收集925集视频，共461小时。每集切成60或90秒片段，并移动边界以避免截断字幕句子；字幕再与剧本对齐以补充说话人姓名。Amazon Mechanical
    Turk标注者同时观看视频和带姓名字幕，每段编写7个使用when、before或after定位线索的自由复合问题；每题标出精确START和END时间戳，并给出1个正确答案和4个干扰项。在线检查器约束两段式问题格式；数据按每批500个视频采集，每批从每位标注者提交内容中抽3组问答，检查问题、答案和时间戳的语义正确性。最终发布21793段视频上的152545道五选一问答。评测分别使用完整片段与真实时间定位片段，结合视频和字幕证据预测5个选项之一并报告准确率。
  legend: 来源：TVQA EMNLP 2018 paper Sections 3 and 5 at ACL Anthology。实线箭头表示论文或官方资料明确支持的主流程。
