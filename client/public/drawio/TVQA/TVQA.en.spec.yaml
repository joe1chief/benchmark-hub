meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TVQA Build and Evaluation Process
  description: >-
    TVQA begins with 925 episodes from six long-running television shows in three genres, totaling 461 hours. Episodes
    are segmented into 60- or 90-second clips and boundaries are shifted so subtitle sentences are not split. Subtitles
    are aligned with transcripts to add speaker names. Amazon Mechanical Turk workers see each clip with named subtitles
    and write seven free-form compositional questions using when, before, or after grounding cues. For every question
    they mark exact START and END timestamps and provide one correct answer plus four distractors. An online checker
    enforces the two-part question form; collection proceeds in batches of 500 videos, and three submitted QA pairs per
    worker are sampled from every batch to check questions, answers, and timestamps. The released dataset contains
    152,545 five-way QA pairs over 21,793 clips. Evaluation compares full-clip and ground-truth localized-clip settings,
    combines video and subtitle evidence, predicts one of five answers, and reports accuracy.
  legend: >-
    Source: TVQA EMNLP 2018 paper Sections 3 and 5 at ACL Anthology. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
