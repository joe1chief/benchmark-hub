  layout: horizontal
  routing: orthogonal
  title: MMVU Paper-v1 Construction, Release, and Accuracy Evaluation
  description: >-
    Evidence-bounded expert construction from arXiv:2501.12380v1, with paper conflicts, public-validation versus
    hidden-test scope, fixed repository behavior, structured-grader failures, and undeclared dataset licensing shown
    explicitly.
  legend: >-
    Solid arrows follow construction and scoring; dashed data arrows show release or provenance boundaries. Only the
    1,000-item validation split is public; the 2,000-item test annotations remain author-held.
