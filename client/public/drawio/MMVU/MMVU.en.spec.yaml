meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMVU Build Process
  description: >-
    Paper-aligned expert construction of 3,000 knowledge-intensive video questions across 27 subjects, with
    textbook-guided annotation, expert validation, and GPT-4o accuracy assessment.
  legend: Every retained item must require the video rather than question text alone or a single frame.
nodes:
  - id: study
    label: |-
      Run Subject User Study
      Recruit 133 College and Graduate Students
      Curate Two Examples Each
      Collect Design Feedback
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: subjects
    label: |-
      Select Subject Coverage
      Authors Review Examples
      Retain 27 Subjects
      Span Four Disciplines
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: experts
    label: |-
      Recruit and Train Experts
      67 Annotators Total
      At Least Two per Subject
      Complete Protocol Training
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: concepts
    label: |-
      Review Authoritative Textbooks
      Inspect Every Chapter
      Find Dynamic Key Concepts
      Cover Breadth and Depth
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: videos
    label: |-
      Source Concept-linked Videos
      Search YouTube CC Content
      Verify License via Data API
      Mark Relevant Time Span
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: visual_gate
    label: |-
      Enforce Visual Dependence
      Remove Audio Tracks
      Require Minimal On-screen Text
      Exclude Lecture Shortcuts
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: questions
    label: |-
      Author Two or Three Questions
      Mix MCQ and Open-ended QA
      Apply Domain Knowledge
      Record Start and End Times
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: mcq
    label: |-
      Construct MCQ Options
      Write Four Plausible Distractors
      Keep Five Choices Total
      Randomly Shuffle Options
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: rationale
    label: |-
      Annotate Expert Solutions
      List Required Domain Knowledge
      Link Concepts to Wikipedia
      Write Step-by-step Rationale
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: compensation
    label: |-
      Protect Annotation Quality
      Compensate by Time Spent
      Avoid Throughput Pressure
      Mean Annotation Time 20m17s
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: validation
    label: |-
      Perform Expert Validation
      Verify Answer and Annotation
      Reject Text-only or One-frame QA
      Revise before Exclusion
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: qc_result
    label: |-
      Resolve Quality Findings
      Revise 523 Examples
      Exclude 72 Still Misaligned
      Retain Video-required Items
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: release
    label: |-
      Assemble MMVU
      3,000 QA · 1,529 Videos
      1,858 MCQ · 1,142 Open
      Validation 1K · Hidden Test 2K
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: evaluate
    label: |-
      Evaluate 32 Models with Accuracy
      Use CoT or Direct Prompts
      GPT-4o Extracts Final Answer
      Judge against Ground Truth
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: study
    to: subjects
    type: primary
  - from: subjects
    to: experts
    type: primary
  - from: experts
    to: concepts
    type: primary
  - from: concepts
    to: videos
    type: primary
  - from: videos
    to: visual_gate
    type: primary
  - from: visual_gate
    to: questions
    type: primary
  - from: questions
    to: mcq
    type: primary
  - from: mcq
    to: rationale
    type: primary
  - from: rationale
    to: compensation
    type: primary
  - from: compensation
    to: validation
    type: primary
  - from: validation
    to: qc_result
    type: primary
  - from: qc_result
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
modules: []
