    type: primary
  - from: video_gate
    to: questions
    type: primary
    label: 通过全部控制项
  - from: video_gate
    to: resample_video
    type: primary
    label: 拒绝并重新搜集
  - from: resample_video
    to: videos
    type: primary
  - from: questions
    to: question_type
    type: primary
  - from: question_type
    to: mcq
    type: primary
    label: 选择题
  - from: question_type
    to: open
    type: primary
    label: 开放题
  - from: mcq
    to: solutions
    type: primary
  - from: open
    to: solutions
    type: primary
  - from: solutions
    to: validation
    type: primary
  - from: validation
