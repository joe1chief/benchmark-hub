meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMVU 构建流程
  description: 按论文以专家流程构建覆盖 27 个学科主题的 3,000 道知识密集型视频问题，并执行教材引导标注、专家质检与 GPT-4o 准确率判定。
  legend: 每个保留样本都必须依赖视频理解，不能仅凭问题文本或单帧作答。
nodes:
  - id: study
    label: |-
      开展学科选择用户研究
      招募 133 名大学及研究生
      每人编写两个示例
      收集构建体验反馈
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: subjects
    label: |-
      选择学科覆盖范围
      作者人工分析示例
      保留 27 个学科主题
      覆盖四大核心学科
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: experts
    label: |-
      招募并培训专家
      共 67 名专家标注员
      每主题至少两名专家
      完成正式协议培训
    type: user
    size: xl
    position:
      x: 500
      'y': 40
  - id: concepts
    label: |-
      审阅权威教材
      逐章检查教材内容
      寻找需动态呈现的概念
      同时保证知识广度与深度
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: videos
    label: |-
      搜集概念相关视频
      检索 YouTube CC 内容
      用 Data API 核验许可
      标注相关起止时间
    type: database
    size: xl
    position:
      x: 980
      'y': 40
  - id: visual_gate
    label: |-
      强制依赖视觉理解
      移除音轨以阻断捷径
      要求屏幕文字尽量少
      排除讲座等文本捷径
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: questions
    label: |-
      每视频编写两至三题
      混合选择题与开放题
      要求应用领域知识
      记录题目起止时间
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: mcq
    label: |-
      构造选择题选项
      编写四个可信干扰项
      每题共五个选项
      随机打乱选项顺序
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: rationale
    label: |-
      标注专家解答
      列出所需领域知识
      将概念链接至维基页面
      编写逐步推理依据
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: compensation
    label: |-
      以机制保障标注质量
      按实际工时支付报酬
      避免按数量赶工
      单题平均标注 20分17秒
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: validation
    label: |-
      执行人类专家验证
      核验答案与全部标注
      排除文本或单帧可答题
      优先修订而非直接删除
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: qc_result
    label: |-
      处理质检结果
      修订 523 个样本
      剔除仍不合格的 72 个
      仅保留必须看视频的题
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: release
    label: |-
      汇总 MMVU
      3,000 题 · 1,529 个视频
      1,858 选择题 · 1,142 开放题
      验证 1K · 隐藏测试 2K
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: evaluate
    label: |-
      以准确率评测 32 个模型
      使用思维链或直接提示
      GPT-4o 抽取最终答案
      对照标准答案判断正误
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: study
    to: subjects
    type: primary
  - from: subjects
    to: experts
    type: primary
  - from: experts
    to: concepts
    type: primary
  - from: concepts
    to: videos
    type: primary
  - from: videos
    to: visual_gate
    type: primary
  - from: visual_gate
    to: questions
    type: primary
  - from: questions
    to: mcq
    type: primary
  - from: mcq
    to: rationale
    type: primary
  - from: rationale
    to: compensation
    type: primary
  - from: compensation
    to: validation
    type: primary
  - from: validation
    to: qc_result
    type: primary
  - from: qc_result
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
modules: []
