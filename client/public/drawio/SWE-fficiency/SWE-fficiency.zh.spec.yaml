meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-fficiency 构建流程
  description: 对齐论文的性能 PR 挖掘、正确性覆盖、工作负载标注、受控执行与专家归一化评分流程。
  legend: 上排从左向右完成五阶段构建，下排从右向左完成正确性与加速评测。
nodes:
  - id: repos
    label: |-
      九个热门 Python 仓库
      数据科学 / 机器学习 / HPC
      挖掘性能优化 PR
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: attributes
    label: |-
      阶段二：属性过滤
      包含 perf / speedup / benchmark
      不改测试，且有实质 AST 变更
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: coverage
    label: |-
      阶段三：覆盖正确性测试
      固定依赖 Docker + coverage.py
      动态行覆盖 + 静态符号解析
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: workload
    label: |-
      阶段四：人工性能工作负载
      参考 PR 描述与讨论
      必须展示可测量改进
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: execution
    label: |-
      阶段五：受控执行
      容器化 + 资源固定
      运行单元测试与性能负载
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: stability
    label: |-
      可复现性过滤
      性能改进 > 2 倍测量标准差
      多次运行 SR 漂移 < 0.5%
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-fficiency
      498 个性能优化任务
      专家补丁 + 工作负载 + 覆盖测试
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      智能体接收完整代码库
      慢速性能工作负载
      定位瓶颈与相关测试
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: patch
    label: |-
      生成性能优化补丁
      补丁必须成功应用
      全部覆盖单元测试必须通过
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: runtime
    label: |-
      测量工作负载运行时间
      模型加速 = 修改前 / 模型修改后
      专家加速 = 修改前 / 专家修改后
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metric
    label: |-
      加速比率
      SR = 模型加速 / 专家加速
      用调和平均数聚合
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: repos
    to: attributes
    type: primary
  - from: attributes
    to: coverage
    type: primary
  - from: coverage
    to: workload
    type: primary
  - from: workload
    to: execution
    type: primary
  - from: execution
    to: stability
    type: primary
  - from: stability
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: patch
    type: primary
  - from: patch
    to: runtime
    type: primary
  - from: runtime
    to: metric
    type: primary
modules: []
