meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-fficiency Build Process
  description: >-
    Paper-aligned performance-PR mining, correctness coverage, workload annotation, controlled execution, and
    expert-normalized scoring.
  legend: Read the five-stage construction row left-to-right, then the correctness and speed evaluation row right-to-left.
nodes:
  - id: repos
    label: |-
      Nine Popular Python Repositories
      Data Science / ML / HPC
      Mine Performance Pull Requests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: attributes
    label: |-
      Stage II: Attribute Filter
      perf / speedup / benchmark Keywords
      No Test Changes; Meaningful AST Edit
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: coverage
    label: |-
      Stage III: Covering Tests
      Pinned Docker + coverage.py
      Dynamic Lines + Static Symbol Resolution
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: workload
    label: |-
      Stage IV: Manual Workload
      Use PR Description and Discussion
      Demonstrate Measurable Improvement
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: execution
    label: |-
      Stage V: Controlled Execution
      Container + Resource Pinning
      Unit Tests and Workload
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: stability
    label: |-
      Reproducibility Filter
      Improvement > 2x Measurement Std Dev
      SR Drift < 0.5% Across Runs
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      SWE-fficiency
      498 Optimization Tasks
      Expert Patch + Workload + Covering Tests
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Agent Receives Full Codebase
      Slow Performance Workload
      Locate Bottleneck and Relevant Tests
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: patch
    label: |-
      Generate Optimization Patch
      Apply Patch Successfully
      All Covering Unit Tests Must Pass
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: runtime
    label: |-
      Measure Workload Runtime
      LM Speedup = Pre / Post-LM
      Gold Speedup = Pre / Post-Gold
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metric
    label: |-
      Speedup Ratio
      SR = LM Speedup / Gold Speedup
      Aggregate by Harmonic Mean
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: repos
    to: attributes
    type: primary
  - from: attributes
    to: coverage
    type: primary
  - from: coverage
    to: workload
    type: primary
  - from: workload
    to: execution
    type: primary
  - from: execution
    to: stability
    type: primary
  - from: stability
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: patch
    type: primary
  - from: patch
    to: runtime
    type: primary
  - from: runtime
    to: metric
    type: primary
modules: []
