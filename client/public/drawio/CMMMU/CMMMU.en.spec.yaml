meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CMMMU Build Process
  description: >-
    Paper-aligned construction and evaluation of CMMMU. Organizers and educated annotators curate college-level Chinese
    multimodal questions from license-compliant sources, apply expert and contamination filters, balance sparse fields,
    and release a 12K benchmark scored by rule-based answer extraction and micro-average accuracy.
  legend: Solid arrows trace source curation, three quality gates, release, and evaluation.
