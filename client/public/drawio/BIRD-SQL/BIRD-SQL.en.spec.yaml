meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIRD-SQL Build Process
  description: >-
    Paper-aligned construction of a large, noisy, knowledge-grounded text-to-SQL benchmark through real database
    curation, qualified crowd annotation, double-blind SQL writing, expert consensus, and efficiency-aware execution.
  legend: Read the annotation row left-to-right, then the released dataset and executable evaluation row right-to-left.
nodes:
  - id: databases
    label: |-
      Real Large Databases
      80 Open DBs from Kaggle / Relation.vit / Tables
      15 Newly Curated Hidden-Test DBs
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: descriptions
    label: |-
      Database Preparation
      Standardize Schemas and Constraints
      Write Table / Column / Value Descriptions
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: workers
    label: |-
      Qualified Annotation Teams
      Experts Teach and Test Crowdworkers
      Retain 11 Native Question Writers + SQL Experts
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: questions
    label: |-
      Natural-Language Questions
      Use Database + Description Files
      Record Required External-Knowledge Evidence
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: doubleblind
    label: |-
      Double-Blind SQL Annotation
      Two Independent SQL Writers per Question
      Execute Both and Compare Result Sets
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: expert
    label: |-
      Expert Consensus and Examination
      Resolve Mismatches; Check Executability / Non-NULL
      Verify Text-Knowledge-SQL Alignment
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      BIRD-SQL Release
      12,751 Pairs / 95 DBs / 33.4 GB / 37 Domains
      69 Train / 11 Dev / 15 Hidden Test DBs
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: input
    label: |-
      Grounded Text-to-SQL Input
      Question Q + Database D
      External Knowledge K + Schema Descriptions
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: generate
    label: |-
      Model Generates SQL
      Fine-Tuned or Zero-Shot / In-Context Models
      Knowledge and Chain-of-Thought Variants
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      Execute Predicted and Gold SQL
      Compare Result Sets for Validity
      Measure Relative Query Runtime
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      Correctness and Efficiency
      Execution Accuracy (EX)
      Valid Efficiency Score (VES)
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: databases
    to: descriptions
    type: primary
  - from: descriptions
    to: workers
    type: primary
  - from: workers
    to: questions
    type: primary
  - from: questions
    to: doubleblind
    type: primary
  - from: doubleblind
    to: expert
    type: primary
  - from: expert
    to: dataset
    type: primary
  - from: dataset
    to: input
    type: primary
  - from: input
    to: generate
    type: primary
  - from: generate
    to: execute
    type: primary
  - from: execute
    to: report
    type: primary
modules: []
