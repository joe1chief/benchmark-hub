meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BioASQ Build Process
  description: >-
    Paper-aligned two-lane protocol for the first BioASQ biomedical semantic-indexing and question-answering challenge,
    based on BMC Bioinformatics 16:138 (PMC4450488).
  legend: >-
    The upper lane is Task 1a. The lower lane keeps Task 1b Phase A question-only input separate from Phase B official
    gold evidence; the optional dashed edge permits a team's own Phase-A output or rerun.
nodes:
  - id: sources
    label: |-
      Biomedical Knowledge Sources
      MEDLINE / PubMed
      PubMed Central
      MeSH + Ontologies + Databases
      RDF Triples
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: task1a_train
    label: |-
      Build Task 1a Training Data
      Title + Abstract + Existing MeSH Labels
      Indexed before 1 March 2013
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: task1a_test
    label: |-
      Select Subsequent MEDLINE Records
      3 Batches × 6 Weeks
      Unique New Articles
      90-Day MeSH-Index Journals
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: task1a_submit
    label: |-
      Run Online Semantic Indexing
      Predict MeSH within 21 Hours
      No Curator Labels at Submission
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: task1a_gold
    label: |-
      Await NLM Curators
      Reveal True MeSH
      as Labels Arrive
      Freeze at Challenge End
    type: user
    size: xl
    position:
      x: 1160
      'y': 40
  - id: task1a_metrics
    label: |-
      Score Task 1a Classification
      Flat Micro-F1
      Hierarchical LCA F Measure
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: experts
    label: |-
      Biomedical Experts
      Author Real Questions
      Yes/No • Factoid • List • Summary
      Ground Answers in Literature
    type: user
    size: xl
    position:
      x: 320
      'y': 560
  - id: qa_gold
    label: |-
      Task 1b Gold Benchmark
      29 Dev + 282 Test Questions
      Types • Concepts • Articles
      Snippets • Triples • Answers
    type: database
    size: xl
    position:
      x: 600
      'y': 560
  - id: phase_a_input
    label: |-
      Phase A Input Only
      Question Text + Type
      Official Evidence Hidden
      Official Answers Hidden
    type: document
    size: xl
    position:
      x: 880
      'y': 400
  - id: phase_a
    label: |-
      Task 1b Phase A Retrieval
      Return Concepts + Articles
      Snippets + RDF Triples
      Limits: 100 / 100 / 100 / 1,000
    type: process
    size: xl
    position:
      x: 1160
      'y': 400
  - id: phase_a_metrics
    label: |-
      Score Phase A Retrieval
      MAP Is Primary
      GMAP • Precision • Recall
      F Measure Supplementary
      Offset-Aware Snippet Match
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: phase_b
    label: |-
      Task 1b Phase B Answering
      Official Gold Concepts / Articles
      Snippets / Triples Are Primary
      Own Phase-A Output / Rerun Allowed
      Exact + Ideal Answers
    type: process
    size: xl
    position:
      x: 1160
      'y': 680
  - id: exact_metrics
    label: |-
      Score Exact Answers
      Yes/No Accuracy
      Factoid MRR • Primary
      List Mean F • Primary
      Summary: No Exact Answer
    type: process
    size: xl
    position:
      x: 1440
      'y': 620
  - id: ideal_metrics
    label: |-
      Score Ideal Answers
      Four Expert Ratings • 1–5
      Recall • Precision
      Repetition • Readability
      ROUGE Is Exploratory
    type: process
    size: xl
    position:
      x: 1440
      'y': 820
  - id: results
    label: |-
      Publish BioASQ Results
      Task 1a + Task 1b Leaderboards
      Public Data + Evaluation Service
      Runs + Baselines
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 400
edges:
  - from: sources
    to: task1a_train
    type: primary
  - from: sources
    to: task1a_test
    type: primary
    waypoints:
      - x: 160
        'y': 180
      - x: 600
        'y': 180
  - from: task1a_train
    to: task1a_submit
    type: data
    waypoints:
      - x: 320
        'y': 240
      - x: 880
        'y': 240
  - from: task1a_test
    to: task1a_submit
    type: primary
  - from: task1a_submit
    to: task1a_gold
    type: primary
  - from: task1a_gold
    to: task1a_metrics
    type: data
  - from: task1a_metrics
    to: results
    type: primary
  - from: sources
    to: experts
    type: primary
  - from: experts
    to: qa_gold
    type: primary
  - from: experts
    to: phase_a_input
    type: primary
    waypoints:
      - x: 540
        'y': 520
      - x: 820
        'y': 520
      - x: 820
        'y': 450
  - from: phase_a_input
    to: phase_a
    type: primary
  - from: phase_a
    to: phase_a_metrics
    type: primary
  - from: phase_a_metrics
    to: results
    type: primary
  - from: phase_a
    to: phase_b
    type: optional
  - from: qa_gold
    to: phase_b
    type: data
  - from: phase_b
    to: exact_metrics
    type: primary
  - from: phase_b
    to: ideal_metrics
    type: primary
  - from: exact_metrics
    to: results
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: ideal_metrics
    to: results
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.5
      entryY: 1
modules: []
