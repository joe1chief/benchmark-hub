meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BioASQ 构建流程
  description: 严格对齐 BMC Bioinformatics 16:138（PMC4450488），用双泳道展示首届 BioASQ 生物医学语义索引与问答协议。
  legend: 上泳道为 Task 1a；下泳道把 Task 1b Phase A 仅问题输入与 Phase B 官方金标准证据分离，虚线表示可选复用自身 Phase-A 输出或重跑。
nodes:
  - id: sources
    label: |-
      整合生物医学知识来源
      MEDLINE / PubMed 与 PubMed Central
      MeSH、本体、数据库与 RDF 三元组
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: task1a_train
    label: |-
      构建 Task 1a 训练数据
      标题 + 摘要 + 已有 MeSH 标签
      索引日期早于 2013 年 3 月 1 日
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: task1a_test
    label: |-
      选择后续 MEDLINE 记录
      3 批 × 每批 6 周 • 新文章不重复
      选择预计 90 天内获 MeSH 的期刊
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: task1a_submit
    label: |-
      运行在线语义索引
      21 小时内预测 MeSH 标题
      提交时不可见人工标签
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: task1a_gold
    label: |-
      等待 NLM 人工索引标签
      逐步揭示真实 MeSH
      挑战结束时冻结已获标签
    type: user
    size: xl
    position:
      x: 1160
      'y': 40
  - id: task1a_metrics
    label: |-
      评分 Task 1a 分类
      平面 Micro-F1
      分层最低公共祖先 F Measure
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: experts
    label: |-
      生物医学专家编写真实问题
      是非 • 事实 • 列表 • 摘要
      用论文与本体建立答案依据
    type: user
    size: xl
    position:
      x: 320
      'y': 560
  - id: qa_gold
    label: |-
      构建 Task 1b 金标准基准
      29 道开发题 + 282 道测试题
      类型 • 概念 • 论文 • 片段 • 三元组 • 答案
    type: database
    size: xl
    position:
      x: 600
      'y': 560
  - id: phase_a_input
    label: |-
      仅发布 Phase A 输入
      问题文本 + 问题类型
      隐藏官方金标证据与答案
    type: document
    size: xl
    position:
      x: 880
      'y': 400
  - id: phase_a
    label: |-
      运行 Task 1b Phase A 检索
      返回概念、论文、片段与 RDF 三元组
      每题上限 100 / 100 / 100 / 1,000
    type: process
    size: xl
    position:
      x: 1160
      'y': 400
  - id: phase_a_metrics
    label: |-
      评分 Phase A 检索
      MAP 为主指标
      GMAP • Precision • Recall
      F Measure 为附加指标
      片段使用 offset 感知匹配
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: phase_b
    label: |-
      运行 Task 1b Phase B 作答
      官方金标概念 / 论文
      片段 / 三元组为主输入
      可用自身 Phase-A 输出或重跑
      生成精确与理想答案
    type: process
    size: xl
    position:
      x: 1160
      'y': 680
  - id: exact_metrics
    label: |-
      评分精确答案
      是非准确率 • 事实型 MRR 为主
      列表平均 F 为主 • 摘要题无精确答案
    type: process
    size: xl
    position:
      x: 1440
      'y': 620
  - id: ideal_metrics
    label: |-
      评分理想答案
      专家四项维度按 1–5 分评分
      召回 • 精确 • 重复 • 可读性
      ROUGE 仅作探索
    type: process
    size: xl
    position:
      x: 1440
      'y': 820
  - id: results
    label: |-
      发布 BioASQ 挑战结果
      语义索引与问答榜单
      公开数据、评测服务、运行结果与基线
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 400
edges:
  - from: sources
    to: task1a_train
    type: primary
  - from: sources
    to: task1a_test
    type: primary
    waypoints:
      - x: 160
        'y': 180
      - x: 600
        'y': 180
  - from: task1a_train
    to: task1a_submit
    type: data
    waypoints:
      - x: 320
        'y': 240
      - x: 880
        'y': 240
  - from: task1a_test
    to: task1a_submit
    type: primary
  - from: task1a_submit
    to: task1a_gold
    type: primary
  - from: task1a_gold
    to: task1a_metrics
    type: data
  - from: task1a_metrics
    to: results
    type: primary
  - from: sources
    to: experts
    type: primary
  - from: experts
    to: qa_gold
    type: primary
  - from: experts
    to: phase_a_input
    type: primary
    waypoints:
      - x: 540
        'y': 520
      - x: 820
        'y': 520
      - x: 820
        'y': 450
  - from: phase_a_input
    to: phase_a
    type: primary
  - from: phase_a
    to: phase_a_metrics
    type: primary
  - from: phase_a_metrics
    to: results
    type: primary
  - from: phase_a
    to: phase_b
    type: optional
  - from: qa_gold
    to: phase_b
    type: data
  - from: phase_b
    to: exact_metrics
    type: primary
  - from: phase_b
    to: ideal_metrics
    type: primary
  - from: exact_metrics
    to: results
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: ideal_metrics
    to: results
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.5
      entryY: 1
modules: []
