  title: OlmoBaseEval Build and Evaluation Process
  description: >-
    Paper-aligned construction of compute-efficient base-model development suites through task clustering, scaling
    proxies, and signal-to-noise analysis, followed by reproducible OLMES evaluation.
  legend: >-
    Base Easy provides low-compute BPB proxies, while Base Main tracks six capability clusters at larger scale. Four
    held-out benchmarks guard against overfitting to the development suite.
