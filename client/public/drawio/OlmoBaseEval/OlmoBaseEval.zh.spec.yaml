meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlmoBaseEval 构建与评测流程
  description: 对齐 OLMo 3 论文的 OlmoBaseEval 构建流程：通过任务聚类、缩放代理和信噪比分析形成计算高效的基础模型开发套件，并由 OLMES 复现评测。
  legend: Base Easy 为低计算预算提供 BPB 代理指标，Base Main 在较大规模追踪六个能力簇；另以四个留出基准防止对开发套件过拟合。
nodes:
  - id: goal
    label: |-
      定义开发决策目标
      指导预训练与中训练
      识别小模型的真实改进
      抵抗基准噪声
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: candidates
    label: |-
      选择宽覆盖候选任务
      科学与通用知识
      医学与实验室知识
      数学与代码能力
    type: database
    size: xl
    position:
      x: 260
      'y': 70
  - id: score_pool
    label: |-
      构建模型分数池
      2.3 万条基准结果
      70 个外部开放权重模型
      比较各任务的模型排序
    type: database
    size: xl
    position:
      x: 500
      'y': 70
  - id: cluster
    label: |-
      聚类相似评测
      Ward 方差最小化
      合并模型排序相近的任务
      人工选择聚类粒度阈值
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: align
    label: |-
      人工对齐任务格式
      将可执行代码任务归在一起
      多选拆分 STEM 与非 STEM
      形成六个能力簇
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: scaling
    label: |-
      分析缩放行为
      25 个 OLMo 2 缩放模型
      70 个开放权重模型
      覆盖低到高计算规模
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: easy
    label: |-
      构建 Base Easy 代理
      面向小于 10 亿参数模型
      用 BPB 评分标准续写
      要求与 Main 排序一致
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: main
    label: |-
      构建 Base Main 套件
      STEM 多选 · 非 STEM 多选 · GenQA
      数学 · 代码 · 代码 FIM
      在大规模保留提升空间
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: snr
    label: |-
      测量信噪比
      OLMo 2 最后 50 个检查点
      10 个同计算规模外部模型
      五次中训练预备运行
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: refine
    label: |-
      调整高噪声评测
      1K 子集扩为完整测试集
      删除 BoolQ · 单列 CruxEval
      调整生成参数与 pass@k 样本数
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: additions
    label: |-
      加入四个新组件
      BasicSkills：六项任务
      Gen2MC 与 17 语言 MT MBPP
      对聊天数据计算掩码困惑度
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: suite
    label: |-
      组装 OlmoBaseEval
      共 43 项任务
      Base Easy 与 Base Main
      服务预训练与中训练决策
    type: database
    size: xl
    position:
      x: 500
      'y': 450
  - id: heldout
    label: |-
      独立留出四项基准
      发布前不用于评测
    type: decision
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      使用 OLMES 可复现评测
      固定 vLLM 与任务配置
      BPB · 正确率 · F1 · pass@k
      报告能力簇宏平均
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: goal
    to: candidates
    type: primary
  - from: candidates
    to: score_pool
    type: primary
  - from: score_pool
    to: cluster
    type: primary
  - from: cluster
    to: align
    type: primary
  - from: align
    to: scaling
    type: primary
  - from: scaling
    to: easy
    type: primary
  - from: easy
    to: main
    type: primary
  - from: main
    to: snr
    type: primary
  - from: snr
    to: refine
    type: primary
  - from: refine
    to: additions
    type: primary
  - from: additions
    to: suite
    type: primary
  - from: suite
    to: heldout
    type: primary
  - from: heldout
    to: report
    type: primary
modules: []
