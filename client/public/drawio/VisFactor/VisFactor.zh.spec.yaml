meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisFactor — FRCT 筛选、数字化与计分流程
  description: >-
    VisFactor 从 FRCT 的 72 个子测验出发，先去除 4 个绘图和 3 个语音任务，再去除 45 个纯文本任务，保留覆盖十种因素的 20 个视觉子测验。GPT-4o 与 Gemini-2.5-Flash
    独立改写说明，人工依据手册调和；图像以 300 dpi 扫描裁剪，答案键逐字复制。固定集含 808 题、3,046 个查询。另一条独立算法产线为 12 个子测验生成、校验并控制难度。附录 A.2
    依次规定直接归一化、五选项拆解、组合一致性、对称变体与 SS3/VZ3 特殊计分，最后对 20 个子测验分数取平均。
  legend: >-
    来源：arXiv:2502.16435v4, Section 2.2 (pp.4-5), Appendices A.1-A.2, and Appendix D. Counts are pinned to v4: 39
    evaluated models. Only 12 of 20 subtests support parametric unlimited generation.。实线箭头表示论文或官方资料明确支持的主流程。
