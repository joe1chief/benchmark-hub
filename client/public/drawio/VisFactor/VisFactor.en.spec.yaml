meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisFactor — FRCT Selection, Digitization, and Scoring
  description: >-
    VisFactor starts from 72 FRCT subtests, removes four drawing and three speech tasks, then removes 45 text-only tasks
    to retain 20 visual subtests spanning ten factors. GPT-4o and Gemini-2.5-Flash rewrite instructions independently,
    humans reconcile them with the manual, 300-dpi scans are cropped, and answer keys are copied verbatim. The fixed set
    has 808 questions and 3,046 queries. A separate algorithmic pipeline generates and validates difficulty-controlled
    instances for 12 subtests. Appendix A.2 applies direct normalization, decomposed five-option queries, grouped
    consistency, symmetry variants, and specialized SS3/VZ3 scoring before averaging the 20 subtest scores.
  legend: >-
    Source: arXiv:2502.16435v4, Section 2.2 (pp.4-5), Appendices A.1-A.2, and Appendix D. Counts are pinned to v4: 39
    evaluated models. Only 12 of 20 subtests support parametric unlimited generation.. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
