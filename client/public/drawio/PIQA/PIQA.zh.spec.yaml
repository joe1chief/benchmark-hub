meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIQA 构建流程
  description: 论文对齐的 PIQA 流程：合格标注员使用 Instructables 六类提示编写物理目标、有效方案和微妙的无效干扰方案， 独立验证移除低一致性样本，AFLite 削弱标注伪影，最终 21,035 道二选一题按准确率评测。
  legend: 实线箭头表示提示来源、人工创建与验证、AFLite 去偏、数据集汇总和评测。
nodes:
  - id: sources
    label: |-
      Instructables 种子
      服装 / 户外 / 手工
      家居 / 食物 / 工坊
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: qualification
    label: |-
      标注员资格测试
      识别规范目标-方案对
      要求得分 >80%
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: goal
    label: |-
      每个种子编写两例
      物理目标 + 有效方案
      写明前置条件 / 成功状态
    type: document
    size: xl
    position:
      x: 560
      'y': 200
  - id: trick
    label: |-
      编写无效干扰方案
      句法与主题相似
      包含微妙物理错误
    type: process
    size: xl
    position:
      x: 820
      'y': 200
  - id: validation
    label: |-
      独立验证
      移除低一致性样本
      取消低一致性标注员资格
    type: user
    size: xl
    position:
      x: 1080
      'y': 200
  - id: aflite
    label: |-
      AFLite 伪影削减
      用 5K 样本微调 BERT-Large
      线性分类器集成
      删除标签可预测样本
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: dataset
    label: |-
      PIQA：21,035 对
      >16K 训练 / ~2K 开发 / ~3K 测试
      英文
    type: database
    size: xl
    position:
      x: 1600
      'y': 200
  - id: task
    label: |-
      二选一物理问答
      目标 + 有效 / 无效方案
      选择唯一正确答案
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: score
    label: |-
      准确率
      人类基线按多数票计算
      模型与人类对比分析
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 200
edges:
  - from: sources
    to: qualification
    type: primary
  - from: qualification
    to: goal
    type: primary
  - from: goal
    to: trick
    type: primary
  - from: trick
    to: validation
    type: primary
  - from: validation
    to: aflite
    type: primary
  - from: aflite
    to: dataset
    type: primary
  - from: dataset
    to: task
    type: primary
  - from: task
    to: score
    type: primary
modules: []
