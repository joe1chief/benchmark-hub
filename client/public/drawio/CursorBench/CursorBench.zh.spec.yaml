meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CursorBench 3.2 已公开的构建与评测流程
  description: 对齐官方方法文章与实时排行榜，展示任务采集、版本漂移、智能体判分、公开报告、线上验证、污染提示与非公开边界。
  legend: 实线表示离线套件与公开报告；虚线表示受控线上交叉核对、仅属于报告的 CursorBench-3 快照及披露提示。
nodes:
  - id: evidence_boundary
    label: |-
      主证据与披露边界
      Composer 2 报告 2603.24477v2
      官方博客 + 线上 3.2 页面
      无公开仓库、数据集或题量
      页面获取于 2026-07-18
    type: document
    size: xl
    position:
      x: 40
      'y': 230
  - id: sessions
    label: |-
      真实 Cursor 会话
      主要来自内部工程工作
      自然开发者请求与代码修改
    type: database
    size: xl
    position:
      x: 320
      'y': 230
  - id: blame
    label: |-
      Cursor Blame
      将提交代码追溯至智能体请求
    type: process
    size: xl
    position:
      x: 600
      'y': 230
  - id: pairs
    label: |-
      自然任务对
      开发者请求 + 标准解决方案
    type: document
    size: xl
    position:
      x: 880
      'y': 230
  - id: curate
    label: |-
      筛选内部与受控来源
      每隔数月刷新
      跟踪开发工作流变化
    type: process
    size: xl
    position:
      x: 1160
      'y': 230
  - id: versions
    label: |-
      3.0：编辑 · 重构 · 修复
      3.1：理解 · 找错 · 规划 · 审查
      并调整部分编辑任务评分
      3.2：指令遵循 · 高级工具使用
    type: document
    size: xl
    position:
      x: 1440
      'y': 230
  - id: suite
    label: |-
      当前套件：CursorBench 3.2
      发布于 2026 年 7 月 8 日
      来自真实会话的模糊多文件任务
    type: database
    size: xl
    position:
      x: 1720
      'y': 230
  - id: run
    label: |-
      初始化代码库与初始任务提示
      按生产环境方式运行智能体
    type: process
    size: xl
    position:
      x: 2000
      'y': 230
  - id: graders
    label: |-
      智能体裁判评估欠指定任务
      裁判规则和提示保持私有
    type: process
    size: xl
    position:
      x: 2280
      'y': 230
  - id: axes
    label: |-
      内部评测维度
      正确性 · 代码质量
      效率 · 交互行为
    type: process
    size: xl
    position:
      x: 2560
      'y': 230
  - id: online
    label: |-
      受控线上交叉核对
      开发者结果代理指标与消融
      与已披露套件构建流程分离
    type: process
    size: xl
    position:
      x: 2560
      'y': 20
  - id: leaderboard
    label: |-
      公开 CursorBench 3.2 排行榜
      得分 · 单题成本 · Token · 步数
    type: process
    size: xl
    position:
      x: 2840
      'y': 230
  - id: contamination
    label: |-
      Grok 4.5 见过旧 Cursor 快照
      具体影响不明
      该数据已移除，适用于未来模型
    type: document
    size: xl
    position:
      x: 2840
      'y': 20
  - id: cost
    label: |-
      公开输入、缓存读取、缓存写入、
      输出单价 × 各任务 Token 用量
      按得分的同一任务权重求平均
    type: process
    size: xl
    position:
      x: 3120
      'y': 230
  - id: boundary
    label: |-
      任务数和题目属于私有信息
      裁判提示、执行框架、得分权重
      均未公开
    type: document
    size: xl
    position:
      x: 2000
      'y': 430
  - id: snapshot
    label: |-
      CursorBench-3 论文快照
      中位改动 181 行 · 提示 390 字符
      不是当前 3.2 规模或题量
    type: document
    size: xl
    position:
      x: 1440
      'y': 430
  - id: version_rule
    label: |-
      仅在同一评测版本内比较分数
      结果存在方差，小差距未必有意义
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 230
