meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CursorBench 构建流程
  description: 与官方资料对齐的内部任务采集、评分、排行榜及线上验证闭环。
  legend: 实线表示离线评测主流程；虚线表示刷新、线上验证及非公开边界。
nodes:
  - id: sessions
    label: |-
      真实 Cursor 会话
      内部工程工作
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: blame
    label: |-
      Cursor Blame
      将提交代码追溯至智能体请求
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: pairs
    label: |-
      自然任务对
      开发者请求 + 标准解决方案
    type: document
    size: xl
    position:
      x: 560
      'y': 210
  - id: curate
    label: |-
      筛选受控来源
      每隔数月刷新
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: suite
    label: |-
      CursorBench 3.1
      模糊 · 多文件 · 多工具 · 多步骤
    type: database
    size: xl
    position:
      x: 1080
      'y': 210
  - id: coverage
    label: |-
      任务覆盖
      编辑 · 重构 · 修复 · 理解 · 规划 · 审查
    type: process
    size: xl
    position:
      x: 1340
      'y': 210
  - id: run
    label: |-
      运行编程智能体
      初始化代码库 + 简短任务提示
    type: process
    size: xl
    position:
      x: 1600
      'y': 210
  - id: graders
    label: |-
      智能体裁判
      接受多种有效解法
    type: process
    size: xl
    position:
      x: 1860
      'y': 210
  - id: axes
    label: |-
      评测维度
      正确性 · 代码质量 · 效率 · 交互
    type: process
    size: xl
    position:
      x: 2120
      'y': 210
  - id: leaderboard
    label: |-
      公开排行榜
      得分 · 单题成本 · Token · 步数
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 210
  - id: online
    label: |-
      受控线上评测
      开发者结果代理指标 + 消融
    type: process
    size: xl
    position:
      x: 2120
      'y': 20
  - id: version
    label: |-
      版本规则
      仅在同一评测版本内比较分数
    type: document
    size: xl
    position:
      x: 2640
      'y': 210
  - id: boundary
    label: |-
      非公开边界
      任务、裁判规则、样例数均未发布
    type: document
    size: xl
    position:
      x: 1080
      'y': 360
edges:
  - from: sessions
    to: blame
    type: primary
  - from: blame
    to: pairs
    type: primary
  - from: pairs
    to: curate
    type: primary
  - from: curate
    to: suite
    type: primary
  - from: suite
    to: coverage
    type: primary
  - from: coverage
    to: run
    type: primary
  - from: run
    to: graders
    type: primary
  - from: graders
    to: axes
    type: primary
  - from: axes
    to: leaderboard
    type: primary
  - from: leaderboard
    to: version
    type: primary
  - from: axes
    to: online
    type: optional
  - from: online
    to: curate
    type: optional
  - from: suite
    to: boundary
    type: optional
modules: []
