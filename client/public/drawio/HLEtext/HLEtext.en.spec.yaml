meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HLEtext Build Process
  description: HLE paper construction followed by the text-only selection and evaluation protocol reported by Step 3.5 Flash.
  legend: >-
    HLEtext is the image-free subset of HLE used in the Step report, not a separate source dataset. The HLE paper states
    that around 14% of questions require images but does not publish an exact HLEtext row count.
nodes:
  - id: experts
    label: |-
      Recruit nearly 1,000 subject experts
      500+ institutions · 50 countries
      cover more than 100 academic subjects
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: submit
    label: |-
      Submit closed-ended expert questions
      question · answer · rationale · subject · affiliation
      support exact match, multiple choice, and images
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: criteria
    label: |-
      Enforce precise expert-level questions
      unambiguous · solvable · non-searchable
      original/nontrivial synthesis with verifiable answer
    type: process
    size: xl
    position:
      x: 640
      'y': 80
  - id: model_filter
    label: |-
      Precheck with several frontier LLMs
      more than 70K attempts
      about 13K model-stumping questions proceed
    type: process
    size: xl
    position:
      x: 940
      'y': 80
  - id: review
    label: |-
      Run two-stage expert review
      round 1 gives each item 1-3 reviews/refinement
      round 2 organizer/expert approval
    type: process
    size: xl
    position:
      x: 1240
      'y': 520
  - id: hle
    label: |-
      Release current HLE
      2,500 public questions plus private held-out set
      24% MC · remainder exact match · around 14% image
    type: database
    size: xl
    position:
      x: 1540
      'y': 300
  - id: text_filter
    label: |-
      Select the text-only HLE subset
      remove questions that require image comprehension
      preserve both multiple-choice and exact-match items
    type: process
    size: xl
    position:
      x: 1840
      'y': 300
  - id: run
    label: |-
      Run Step 3.5 Flash HLEtext evaluation
      use HLE's official metric/judgment protocol
      report pass@1 from one generation per problem
    type: process
    size: xl
    position:
      x: 2140
      'y': 520
  - id: judge
    label: |-
      Judge generated answers with gpt-oss-120b
      compare against HLE references
      accept semantically equivalent answer forms
    type: process
    size: xl
    position:
      x: 2440
      'y': 520
  - id: score
    label: |-
      Report HLEtext accuracy
      keep the text-only scope explicit
      do not present it as full multimodal HLE
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 300
edges:
  - from: experts
    to: submit
    type: primary
  - from: submit
    to: criteria
    type: primary
  - from: criteria
    to: model_filter
    type: primary
  - from: model_filter
    to: review
    type: primary
  - from: review
    to: hle
    type: primary
  - from: hle
    to: text_filter
    type: primary
  - from: text_filter
    to: run
    type: primary
  - from: run
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
