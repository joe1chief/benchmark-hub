meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HLEtext Build Process
  description: >-
    HLE construction followed by the text-only evaluation view reported for Step 3.5 Flash, with unpublished selection
    and runner details explicitly bounded.
  legend: >-
    HLEtext is the Step report's label for a text-only HLE view, not a separate dataset release. Solid arrows combine
    arXiv:2501.14249v10 construction with arXiv:2602.10604v2 evaluation; dashed arrows mark public evidence limits.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      HLE paper arXiv:2501.14249v10
      HLE repo @ 26dca2e
      cais/hle @ 5a81a4c
      Step report arXiv:2602.10604v2
      Step GitHub @ 21d85a
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: experts
    label: |-
      HLE expert contributors
      nearly 1,000 experts
      500+ institutions · 50 countries
      more than 100 subjects
    type: database
    size: xl
    position:
      x: 40
      'y': 360
  - id: submission
    label: |-
      Create an original expert item
      question + exact answer
      detailed rationale + subject
      contributor name + affiliation
    type: process
    size: xl
    position:
      x: 340
      'y': 360
  - id: criteria
    label: |-
      Quality and format gate
      precise / unambiguous / solvable
      non-searchable; short / verifiable
      English; not subjective/open-ended
    type: process
    size: xl
    position:
      x: 640
      'y': 360
  - id: difficulty
    label: |-
      Frontier-model stumping filter
      exact match: all models fail
      MC: at most one model succeeds
      70K attempts -> ~13K candidates
    type: process
    size: xl
    position:
      x: 940
      'y': 360
  - id: review
    label: |-
      Round 1: 1-3 graduate experts
      verify and refine each candidate
      Round 2: trained expert / organizer
      public feedback follows release
    type: process
    size: xl
    position:
      x: 1240
      'y': 360
  - id: hle
    label: |-
      Official HLE public test: 2,500
      24% MC; remainder exact-match
      ~14% require images
    type: database
    size: xl
    position:
      x: 1540
      'y': 360
  - id: report_boundary
    label: |-
      HLEtext publication boundary
      Step model HF @ ab446a3
      reporting label; no separate dataset
      exact selector / row count absent
      eval code / run logs not released
    type: document
    size: xl
    position:
      x: 1840
      'y': 20
  - id: text_scope
    label: |-
      Select the text-only HLE view
      Step report calls it HLEtext
      exact filter and row count
      are not disclosed
    type: process
    size: xl
    position:
      x: 1840
      'y': 360
  - id: vanilla
    label: |-
      Vanilla Step 3.5 Flash
      one generation per HLE problem
      pass@1 · max sequence 256k
      temperature=1.0 · top-p=1.0
    type: process
    size: xl
    position:
      x: 2140
      'y': 140
  - id: pacore
    label: |-
      PaCoRe test-time scaling
      K = [4, 4, 4, 4]
      parallel trajectories + coordination
      same 256k / temperature / top-p
    type: process
    size: xl
    position:
      x: 2140
      'y': 580
  - id: judge
    label: |-
      Official HLE LLM-judging protocol
      judge model: gpt-oss-120b
      exact Step prompt / parser
      are undisclosed
    type: process
    size: xl
    position:
      x: 2440
      'y': 360
  - id: score
    label: |-
      Report HLEtext accuracy
      vanilla Step 3.5 Flash: 23.1
      PaCoRe: 27.9
      Table 5 comparison
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 360
