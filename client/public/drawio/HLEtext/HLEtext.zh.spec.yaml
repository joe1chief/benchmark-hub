meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HLEtext 构建流程
  description: 从 HLE 构建衔接到 Step 3.5 Flash 报告的纯文本评测视图，并显式标出未公开的筛选与 runner 细节。
  legend: HLEtext 是 Step 报告对 HLE 纯文本视图的称呼，不是单独的数据集发布。实线结合 arXiv:2501.14249v10 的构建和 arXiv:2602.10604v2 的评测；虚线标示公开证据边界。
nodes:
  - id: evidence
    label: |-
      固定证据边界
      HLE 论文 arXiv:2501.14249v10
      HLE 仓库 @ 26dca2e
      cais/hle @ 5a81a4c
      Step 报告 arXiv:2602.10604v2
      Step GitHub @ 21d85a
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: experts
    label: |-
      HLE 专家贡献者
      近 1,000 名专家
      500+ 家机构 · 50 个国家
      覆盖 100+ 个学科
    type: database
    size: xl
    position:
      x: 40
      'y': 360
  - id: submission
    label: |-
      创作原创专家题目
      题目 + 精确答案
      详细解析 + 学科
      贡献者姓名 + 机构
    type: process
    size: xl
    position:
      x: 340
      'y': 360
  - id: criteria
    label: |-
      质量与格式门槛
      精确 / 无歧义 / 可解
      不可搜索；简短 / 可验证
      仅英语；不接受主观 / 开放式任务
    type: process
    size: xl
    position:
      x: 640
      'y': 360
  - id: difficulty
    label: |-
      前沿模型难度筛选
      精确匹配：全部模型失败
      选择题：最多一个模型成功
      70K 次尝试 -> 约 13K 候选
    type: process
    size: xl
    position:
      x: 940
      'y': 360
  - id: review
    label: |-
      第一轮：1-3 名研究生专家
      验证并完善每道候选题
      第二轮：受训专家 / 组织者批准
      发布后继续接收公开反馈
    type: process
    size: xl
    position:
      x: 1240
      'y': 360
  - id: hle
    label: |-
      官方 HLE 公开测试集：2,500
      24% 选择题；其余精确匹配
      约 14% 需要图像
    type: database
    size: xl
    position:
      x: 1540
      'y': 360
  - id: report_boundary
    label: |-
      HLEtext 公开边界
      Step 模型 HF @ ab446a3
      只是报告标签；无独立数据集
      精确筛选器 / 行数未公开
      评测代码 / 运行日志未公开
    type: document
    size: xl
    position:
      x: 1840
      'y': 20
  - id: text_scope
    label: |-
      选择 HLE 纯文本视图
      Step 报告称其为 HLEtext
      精确筛选规则与行数
      均未披露
    type: process
    size: xl
    position:
      x: 1840
      'y': 360
  - id: vanilla
    label: |-
      原生 Step 3.5 Flash
      每道 HLE 题一次生成
      pass@1 · 最大序列 256k
      temperature=1.0 · top-p=1.0
    type: process
    size: xl
    position:
      x: 2140
      'y': 140
  - id: pacore
    label: |-
      PaCoRe 测试时扩展
      K = [4, 4, 4, 4]
      并行轨迹 + 多轮协调
      同一 256k / temperature / top-p
    type: process
    size: xl
    position:
      x: 2140
      'y': 580
  - id: judge
    label: |-
      官方 HLE LLM 判断协议
      评委模型：gpt-oss-120b
      Step 的精确提示词 / 解析器
      均未披露
    type: process
    size: xl
    position:
      x: 2440
      'y': 360
  - id: score
    label: |-
      报告 HLEtext 准确率
      原生 Step 3.5 Flash：23.1
      PaCoRe：27.9
      对应论文表 5
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 360
edges:
  - from: evidence
    to: experts
    type: data
  - from: evidence
    to: report_boundary
    type: data
  - from: experts
    to: submission
    type: primary
  - from: submission
    to: criteria
    type: primary
  - from: criteria
    to: difficulty
    type: primary
  - from: difficulty
    to: review
    type: primary
  - from: review
    to: hle
    type: primary
  - from: hle
    to: text_scope
    type: primary
  - from: report_boundary
    to: text_scope
    type: data
  - from: text_scope
    to: vanilla
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: text_scope
    to: pacore
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: vanilla
    to: judge
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.25
      entryY: 0
  - from: pacore
    to: judge
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.75
      entryY: 1
  - from: judge
    to: score
    type: primary
modules: []
