meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HLEtext 构建流程
  description: 先按 HLE 论文构建全集，再按 Step 3.5 Flash 报告选择纯文本子集并评测。
  legend: HLEtext 是 Step 报告使用的 HLE 无图子集，而非独立来源数据集。HLE 论文仅说明约 14% 题目需要图像，没有公布 HLEtext 的精确行数。
nodes:
  - id: experts
    label: |-
      招募近 1,000 名学科专家
      来自 500 多家机构、50 个国家
      覆盖 100 多个学术学科
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: submit
    label: |-
      提交封闭式专家题目
      题目 · 答案 · 解析 · 学科 · 机构
      支持精确短答、选择题和图像
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: criteria
    label: |-
      执行精确的专家级题目准则
      无歧义 · 可解 · 不可快速检索
      原创/非平凡综合并有可核答案
    type: process
    size: xl
    position:
      x: 640
      'y': 80
  - id: model_filter
    label: |-
      用多个前沿 LLM 预检
      记录超过 7 万次模型作答
      约 1.3 万道难倒模型的题进入评审
    type: process
    size: xl
    position:
      x: 940
      'y': 80
  - id: review
    label: |-
      运行两阶段专家评审
      第一轮每题 1-3 次评审与迭代
      第二轮由组织者/专家批准
    type: process
    size: xl
    position:
      x: 1240
      'y': 520
  - id: hle
    label: |-
      发布当前 HLE
      2,500 道公开题及一个私有保留集
      24% 选择题 · 其余短答 · 约 14% 含图
    type: database
    size: xl
    position:
      x: 1540
      'y': 300
  - id: text_filter
    label: |-
      选择 HLE 纯文本子集
      去除需要理解图片的题目
      同时保留选择题与精确短答案题
    type: process
    size: xl
    position:
      x: 1840
      'y': 300
  - id: run
    label: |-
      运行 Step 3.5 Flash HLEtext 评测
      使用 HLE 官方指标/裁判协议
      每题生成一次并报告 pass@1
    type: process
    size: xl
    position:
      x: 2140
      'y': 520
  - id: judge
    label: |-
      用 gpt-oss-120b 判断生成答案
      与 HLE 参考答案比较
      接受语义等价的答案形式
    type: process
    size: xl
    position:
      x: 2440
      'y': 520
  - id: score
    label: |-
      报告 HLEtext 准确率
      明确限定为纯文本范围
      不将其表述为完整多模态 HLE
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 300
edges:
  - from: experts
    to: submit
    type: primary
  - from: submit
    to: criteria
    type: primary
  - from: criteria
    to: model_filter
    type: primary
  - from: model_filter
    to: review
    type: primary
  - from: review
    to: hle
    type: primary
  - from: hle
    to: text_filter
    type: primary
  - from: text_filter
    to: run
    type: primary
  - from: run
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
