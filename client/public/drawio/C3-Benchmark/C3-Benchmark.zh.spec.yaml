meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C3-Benchmark 构建流程
  description: 与论文一致地从 400 个公开 API 工具、50 个类别扩展到 1,600 个工具/函数；经过 LLM 描述修订、参数类型扩展、 五位专家验证、多角色任务生成与数据审核；工具依赖、隐藏信息和决策历史只出现在评测挑战分支中。
  legend: 实线表示构建与评测；虚线数据箭头提供对照条件。
nodes:
  - id: api_tools
    label: |-
      收集 400 个公开 API 工具
      从公开 API 描述开始
      建立初始工具清单
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: categories
    label: |-
      将工具分为 50 个类别
      覆盖多样的现实能力
      组织工具空间
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: tool_functions
    label: |-
      扩展到 1,600 个工具 / 函数
      保留可调用 Schema
      准备描述与参数
    type: database
    size: xl
    position:
      x: 540
      'y': 420
  - id: description_revision
    label: |-
      LLM 描述修订
      混元 TurboS 补充约束细节
      明确工具适用条件与方式
    type: process
    size: xl
    position:
      x: 790
      'y': 420
  - id: parameter_expansion
    label: |-
      扩展参数类型
      枚举 • 数组 • 对象
      提升 Schema 多样性
    type: process
    size: xl
    position:
      x: 1040
      'y': 420
  - id: tool_review
    label: |-
      五位 LLM-Agent 专家验证工具
      检查描述准确性
      检查参数多样性
    type: user
    size: xl
    position:
      x: 1290
      'y': 420
  - id: framework
    label: |-
      五角色生成框架
      用户 • 规划器 • AI Agent • 工具 • 检查器
      生成合成多任务交互
    type: process
    size: xl
    position:
      x: 1540
      'y': 420
  - id: task_authoring
    label: |-
      编写相关任务
      首任务生成 5 个候选
      专家选择/修订；后续任务参考 22 个示例
    type: process
    size: xl
    position:
      x: 1790
      'y': 420
  - id: trajectory_generation
    label: |-
      生成任务执行过程
      混元模型生成动作与观察
      覆盖单任务与相关多任务对话
    type: process
    size: xl
    position:
      x: 2040
      'y': 420
  - id: data_review
    label: |-
      验证生成数据
      自检 • 多轮检查 • 交叉检查
      高级专家复核 + 10% 抽样
    type: user
    size: xl
    position:
      x: 2290
      'y': 420
  - id: release
    label: |-
      发布 C3-Benchmark
      256 条单任务 + 768 条多任务
      2–4 个相关任务 • 336 种策略切换
    type: database
    size: xl
    position:
      x: 2540
      'y': 420
  - id: challenge1
    label: |-
      挑战 1：工具依赖
      DFS / 拓扑排序枚举有效路径
      增量匹配复杂工具关系
    type: process
    size: xl
    position:
      x: 2790
      'y': 40
  - id: challenge2
    label: |-
      挑战 2：隐藏信息
      省略 • 指代 • 长上下文条件
      正确用户与摘要历史；仅评最后任务
    type: process
    size: xl
    position:
      x: 2790
      'y': 420
  - id: challenge3
    label: |-
      挑战 3：决策历史
      注入正确的先前动作与观察
      与挑战 2 对比
    type: process
    size: xl
    position:
      x: 2790
      'y': 800
  - id: metrics
    label: |-
      计算鲁棒性指标
      Accuracy • AP • OP Rate
      PTF • VF • DDD
    type: process
    size: xl
    position:
      x: 3040
      'y': 420
  - id: report
    label: |-
      对比 49 个 Agent
      诊断工具、上下文、长度与策略影响
      发布数据、Harness 与排行榜
    type: terminal
    size: xl
    position:
      x: 3290
      'y': 420
edges:
  - from: api_tools
    to: categories
    type: primary
  - from: categories
    to: tool_functions
    type: primary
  - from: tool_functions
    to: description_revision
    type: primary
  - from: description_revision
    to: parameter_expansion
    type: primary
  - from: parameter_expansion
    to: tool_review
    type: primary
  - from: tool_review
    to: framework
    type: primary
  - from: framework
    to: task_authoring
    type: primary
  - from: task_authoring
    to: trajectory_generation
    type: primary
  - from: trajectory_generation
    to: data_review
    type: primary
  - from: data_review
    to: release
    type: primary
  - from: release
    to: challenge1
    type: primary
  - from: release
    to: challenge2
    type: primary
  - from: release
    to: challenge3
    type: primary
  - from: challenge1
    to: metrics
    type: primary
  - from: challenge2
    to: metrics
    type: primary
  - from: challenge3
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
