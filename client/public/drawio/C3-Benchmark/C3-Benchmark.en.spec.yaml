meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C3-Benchmark Build Process
  description: >-
    Paper-aligned tool-schema funnel from 400 public API tools through 50 categories to 1,600 tools/functions, followed
    by LLM description revision, parameter expansion, five-expert verification, multi-role task generation, data review,
    and three evaluation-only challenges for tool dependencies, hidden information, and decision history.
  legend: Solid arrows show construction and evaluation; dashed data arrows carry comparison conditions.
nodes:
  - id: api_tools
    label: |-
      Collect 400 Public API Tools
      Start from Public API Descriptions
      Build the Initial Tool Inventory
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: categories
    label: |-
      Group Tools into 50 Categories
      Cover Diverse Real-world Capabilities
      Organize the Tool Space
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: tool_functions
    label: |-
      Expand to 1,600 Tools / Functions
      Retain Callable Schemas
      Prepare Descriptions and Parameters
    type: database
    size: xl
    position:
      x: 540
      'y': 420
  - id: description_revision
    label: |-
      LLM Description Revision
      HunYuan-TurboS Adds Constraint Details
      Clarify When and How Tools Apply
    type: process
    size: xl
    position:
      x: 790
      'y': 420
  - id: parameter_expansion
    label: |-
      Expand Parameter Types
      Enums • Arrays • Objects
      Increase Schema Diversity
    type: process
    size: xl
    position:
      x: 1040
      'y': 420
  - id: tool_review
    label: |-
      Five LLM-agent Experts Verify Tools
      Check Description Accuracy
      Check Parameter Diversity
    type: user
    size: xl
    position:
      x: 1290
      'y': 420
  - id: framework
    label: |-
      Five-role Generation Framework
      User • Planner • AI Agent • Tool • Checker
      Generate Synthetic Multi-task Interactions
    type: process
    size: xl
    position:
      x: 1540
      'y': 420
  - id: task_authoring
    label: |-
      Author Related Tasks
      Generate Five First-task Candidates
      Experts Select / Revise; Later Tasks Use 22 Examples
    type: process
    size: xl
    position:
      x: 1790
      'y': 420
  - id: trajectory_generation
    label: |-
      Generate Task Executions
      HunYuan Models Produce Actions + Observations
      Cover Single-task and Related Multi-task Dialogues
    type: process
    size: xl
    position:
      x: 2040
      'y': 420
  - id: data_review
    label: |-
      Verify Generated Data
      Self-check • Multi-round • Cross-check
      Senior Expert Review + 10% Sampling
    type: user
    size: xl
    position:
      x: 2290
      'y': 420
  - id: release
    label: |-
      Release C3-Benchmark
      256 Single-task + 768 Multi-task Entries
      2–4 Related Tasks • 336 Policy Switches
    type: database
    size: xl
    position:
      x: 2540
      'y': 420
  - id: challenge1
    label: |-
      Challenge 1: Tool Dependencies
      DFS / Topological Valid-path Enumeration
      Incremental Matching of Complex Tool Relations
    type: process
    size: xl
    position:
      x: 2790
      'y': 40
  - id: challenge2
    label: |-
      Challenge 2: Hidden Information
      Omit • Reference • Long-context Conditions
      Correct User + Summary History; Score Final Task
    type: process
    size: xl
    position:
      x: 2790
      'y': 420
  - id: challenge3
    label: |-
      Challenge 3: Decision History
      Inject Correct Prior Actions + Observations
      Compare with Challenge 2
    type: process
    size: xl
    position:
      x: 2790
      'y': 800
  - id: metrics
    label: |-
      Compute Robustness Metrics
      Accuracy • AP • OP Rate
      PTF • VF • DDD
    type: process
    size: xl
    position:
      x: 3040
      'y': 420
  - id: report
    label: |-
      Compare 49 Agents
      Diagnose Tool, Context, Length, and Policy Effects
      Publish Data, Harness, and Leaderboard
    type: terminal
    size: xl
    position:
      x: 3290
      'y': 420
