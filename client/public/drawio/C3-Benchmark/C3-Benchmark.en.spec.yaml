  title: C3-Benchmark Build Process
  description: >-
    Paper-aligned construction of C3-Bench: public API tools are refined, a five-role generation framework creates
    multi-task agent data with sampled trajectories, hidden information, and policy switches, human experts refine and
    cross-check the data, and the benchmark evaluates three robustness challenges with fine-grained metrics.
  legend: >-
    Solid arrows show tool preparation, multi-role generation, expert refinement, challenge construction, and
    evaluation.
