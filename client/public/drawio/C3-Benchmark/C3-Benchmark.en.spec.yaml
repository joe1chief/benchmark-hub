meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: C3-Bench Build Process
  description: >-
    Paper-aligned multi-role construction of related multi-task agent trajectories, expert refinement, three controlled
    robustness challenges over tools, hidden information, and decision history, and fine-grained path and stability
    metrics.
  legend: >-
    Solid arrows show generation and evaluation; dashed arrows show real-log design signals or injected correct history,
    never copied user-log test data.
nodes:
  - id: design_signals
    label: |-
      Analyze Real User Logs for Design Signals
      Related Follow-Ups, Hidden Context, and Policy Changes
      Test Data Do Not Come from User Logs
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: tool_space
    label: |-
      Prepare Diverse Tool Schemas
      Record Parameter and Logical Dependencies
      Support Serial, Parallel, and Combined Calls
    type: database
    size: xl
    position:
      x: 40
      'y': 400
  - id: framework
    label: |-
      Run the Five-Role Generation Framework
      User • Planner • AI Agent • Tool • Checker
      Fifteen Role Subtypes and Heuristic Rules
    type: user
    size: xl
    position:
      x: 320
      'y': 220
  - id: sample
    label: |-
      Sample a Desired Decision Trajectory
      Assign Single, Multi, Chat, or Clarification Policy
      Cover Serial, Parallel, and Mixed Multi-Tool Forms
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: questions
    label: |-
      Generate User Questions
      Random HunYuan-Series Model plus Few-Shot Examples
      Keep 2 to 4 Related Tasks Human-Like
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: execution
    label: |-
      Generate the Correct Execution Process
      HunYuan-TurboS Produces Actions and Observations
      Checker Verifies Plans, Tools, and Parallel Logic
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: hiding
    label: |-
      Assign an Information-Hiding Strategy
      Omit • Reference • Long-Context Dependency
      Preserve Required Facts in Prior Tasks
    type: process
    size: xl
    position:
      x: 880
      'y': 400
  - id: expert_qc
    label: |-
      Five LLM Research Experts Refine Data
      Self-Check • Cross-Check • Senior Final Review
      Raise Accuracy from about 60% to Nearly 100%
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: release
    label: |-
      Assemble C3-Bench Test Data
      256 Single-Task and 768 Multi-Task Entries
      Uniformly Cover 336 Policy-Switch Types
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: challenge1
    label: |-
      Challenge 1 • Complex Tool Relationships
      DFS Topological Sort Enumerates Valid Paths
      Incremental Decision-Tree Matching Tests Calls
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: challenge2
    label: |-
      Challenge 2 • Critical Hidden Information
      Give Correct User Tasks and Summaries Only
      Score the Final Task across Omit, Reference, and Long
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: challenge3
    label: |-
      Challenge 3 • Variable Decision Trajectories
      Inject Correct Prior Actions and Observations
      Compare Every Policy Transition against Challenge 2
    type: process
    size: xl
    position:
      x: 1720
      'y': 400
  - id: metrics
    label: |-
      Compute Fine-Grained Robustness Metrics
      Accuracy • Accomplish Progress • Optimal Path Rate
      PTF • Volatility Factor • Debiased Descent Direction
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: report
    label: |-
      Compare 49 Fast, Slow, and Specialized Agents
      Diagnose Tool Dependency, Context, Task-Length, and Policy Effects
      Publish Data, Generation Framework, Harness, and Leaderboard
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 220
