    type: primary
  - from: agreement
    to: annotate
    type: primary
  - from: annotate
    to: dataset
    type: primary
  - from: dataset
    to: splits
    type: primary
  - from: splits
    to: baselines
    type: primary
  - from: baselines
    to: transfer
    type: primary
  - from: transfer
    to: report
    type: primary
modules: []
