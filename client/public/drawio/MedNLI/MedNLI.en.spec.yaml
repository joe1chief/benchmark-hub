meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedNLI Construction, Release, and Evaluation
  description: >-
    Paper- and release-aligned clinical NLI workflow from MIMIC-III notes through premise sampling, clinician-authored
    hypotheses, the pilot validity and agreement checks, single-annotation scale-up, premise-disjoint splits, the
    credentialed PhysioNet release, and label-aware accuracy evaluation.
  legend: >-
    Solid arrows are construction or scored evaluation paths. Dashed arrows expose evidence, access, implementation, and
    paper-experiment boundaries. The paper uses MIMIC-III v1.3, whereas PhysioNet v1.0.0 names MIMIC-III v1.4 as its
    parent; this version difference is preserved rather than silently reconciled. A redacted test label cannot be scored
    by the released code path.
