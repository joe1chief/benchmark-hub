meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedNLI Build and Evaluation Process
  description: >-
    Paper-aligned clinical NLI construction from de-identified MIMIC-III notes through section and sentence extraction,
    clinician-authored hypotheses, pilot agreement, invalid-premise removal, leakage-safe splits, and accuracy
    evaluation.
  legend: >-
    Four clinicians annotated 4,683 premises over six weeks; each retained premise receives one entailment, neutral, and
    contradiction hypothesis, producing 14,049 unique pairs with no premise shared across splits.
nodes:
  - id: source
    label: |-
      Source MIMIC-III v1.3
      38,597 De-identified Patients
      2,078,705 English Clinical Notes
      Access via the Derived-data Repository
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: sections
    label: |-
      Segment Note Sections
      Use Rule-based Header Formatting
      Identify Clinical Note Structure
      Select Past Medical History
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: sentences
    label: |-
      Create Candidate Premises
      Apply Biomedical LingPipe Splitter
      Form a Sentence Pool
      Randomly Sample Premises
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: prompt
    label: |-
      Present Premise Alone
      Permit Medical Knowledge
      Permit Common Sense
      Do Not Expose Other Note Context
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: hypotheses
    label: |-
      Clinicians Write Three Hypotheses
      Definitely True: Entailment
      Might Be True: Neutral
      Definitely False: Contradiction
    type: user
    size: xl
    position:
      x: 980
      'y': 40
  - id: pilot
    label: |-
      Run the Annotation Pilot
      Two Board-certified Radiologists
      100 Unique Premises Each
      Refine Clinician Guidelines
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: discard
    label: |-
      Remove Invalid Premises
      Clinician Judgment
      Exclude Uninformative Artifacts
      Pilot Removes 16 Premises
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: agreement
    label: |-
      Cross-label the Pilot Pairs
      Compare 552 Generated Pairs
      Definitely · Maybe · Definitely Not
      Cohen Kappa: 0.78
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: annotate
    label: |-
      Complete Expert Annotation
      Recruit Two Additional Clinicians
      Four Clinicians Total
      4,683 Premises over Six Weeks
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: dataset
    label: |-
      Form MedNLI
      14,049 Unique Sentence Pairs
      Balanced Three-way NLI Labels
      Clinical Terminology and Reasoning
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: splits
    label: |-
      Split without Premise Overlap
      Train: 11,232 Pairs
      Development: 1,395 Pairs
      Test: 1,422 Pairs
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: baselines
    label: |-
      Train Clinical NLI Baselines
      Feature Model · Bag of Words
      InferSent · ESIM
      Keep Hyperparameters Comparable
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: transfer
    label: |-
      Add Transfer and Domain Knowledge
      Transfer from SNLI and MultiNLI
      Use Biomedical and MIMIC Embeddings
      Test UMLS-informed Methods
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Evaluate on the Held-out Test Set
      Predict Three NLI Labels
      Report Classification Accuracy
      Compare Domain Adaptation Gains
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
