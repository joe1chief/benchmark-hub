meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CURE-Bench Disclosed Build and Evaluation Process
  description: >-
    Official-site, fixed starter-kit, and TxAgent-v1 aligned generation basis, competition phases, two tracks,
    submission schema, disclosed evaluation plan, and explicit non-public boundaries.
  legend: >-
    Solid arrows distinguish the TxAgent basis reused by CURE from competition execution; dashed arrows mark expert
    validity review. TxAgent counts are not transferred to CURE, whose 12-family and 13-task counts conflict.
