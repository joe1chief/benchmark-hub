      Validated Question + ToolUniverse
      Helper · Tool Provider · Solver
      Evaluate Answer, Calls, and Trace
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: toolgen
    label: |-
      TxAgent ToolGen → ToolUniverse
      API Docs → Specifications → Checker Tests
      Human Verification before Tool Inclusion
    type: process
    size: xl
    position:
      x: 880
      'y': 370
  - id: dataset_boundary
    label: |-
      Site Says “Thousands” of Examples
      Exact Count, Prompts, Filters, and Splits
      Are Not Disclosed
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: phase
    label: |-
      Phase 1: Validation and Test Datasets
      Phase 2 Final Test Set: Private
      Sizes and Immutable Revision Absent
    type: document
    size: xl
    position:
      x: 1720
      'y': 220
  - id: track
    label: Two Competition Tracks
    type: decision
    size: xl
    position:
      x: 2000
      'y': 220
  - id: internal
    label: |-
      Track 1: Internal Parameters Only
      No External Tools, APIs, or Retrieval
      Return Answer and Reasoning Trace
    type: process
    size: xl
    position:
      x: 2280
      'y': 70
  - id: agentic
    label: |-
      Track 2: Biomedical Tools via ToolUniverse
      Reasoning Trace Includes a Tool Log
      External Real-Time Information Allowed
    type: process
    size: xl
    position:
      x: 2280
      'y': 370
  - id: submission
    label: |-
      Three Question Types
      Multiple Choice · Open-Ended MC · Open-Ended
      CSV: ID · Prediction · Reasoning · Choice
      ZIP Metadata: Model · Track · Tokens · Tools
    type: document
    size: xl
    position:
      x: 2560
      'y': 220
  - id: metrics
    label: |-
      Correctness: Direct · Accumulated · Open-Ended
      Robustness: Rephrasing · Option Order
      Efficiency: Token and Tool Usage
    type: process
    size: xl
    position:
      x: 2840
      'y': 220
  - id: judge
    label: |-
      Collaborative Agentic Judge
      Factuality via Retrieval Checks
      Clinical Relevance and Appropriateness
    type: process
    size: xl
    position:
      x: 3120
      'y': 70
  - id: experts
    label: |-
      Top 5–10 Submissions: Expert Validity Check
      Clinicians · Researchers · Pharmacists
      May Disqualify Metric Hacking
    type: user
    size: xl
    position:
      x: 3120
      'y': 370
  - id: ranking
    label: |-
      Final Ranking: Predefined Weighted Sum
      Exact Weights and Judge Settings Not Public
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 220
