      Patients · Diseases · Drugs
      Treatment · Safety · Drug Information
    type: database
    size: xl
    position:
      x: 320
      'y': 220
  - id: taxonomy_boundary
    label: |-
      Official Page Names 12 Task Families
      Its Evaluation Text Says 13 Tasks
      The Two Counts Are Unreconciled
    type: document
    size: xl
    position:
      x: 600
      'y': 220
  - id: questiongen
    label: |-
      TxAgent QuestionGen
      Documents → Extract → Question + Answer
      Check Grounding, Solvability, Reasonableness
      Only Validated Questions Continue
    type: process
    size: xl
    position:
      x: 880
      'y': 70
  - id: tracegen
