meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CURE-Bench 构建流程
  description: 与官方资料对齐的基准生成、双赛道评测和验证流程。
  legend: 实线表示公开流程；虚线表示验证环节。官方未公开精确数据规模和指标权重。
nodes:
  - id: scope
    label: |-
      治疗决策范围
      患者 · 疾病 · 药物
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: tasks
    label: |-
      十二类任务
      治疗 · 安全 · 标签 · 监管
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: questiongen
    label: |-
      QuestionGen
      生成临床可信问题
    type: process
    size: xl
    position:
      x: 560
      'y': 210
  - id: tracegen
    label: |-
      TraceGen
      生成有依据的多步轨迹
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: toolgen
    label: |-
      ToolGen
      生成生物医学工具与检索能力
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: dataset
    label: |-
      已验证样例
      问题 · 轨迹 · 工具解法
    type: database
    size: xl
    position:
      x: 1340
      'y': 210
  - id: track
    label: 两条评测赛道
    type: decision
    size: xl
    position:
      x: 1600
      'y': 210
  - id: internal
    label: |-
      赛道一
      仅使用模型内部知识
    type: process
    size: xl
    position:
      x: 1860
      'y': 70
  - id: agentic
    label: |-
      赛道二
      外部工具 + 实时信息
    type: process
    size: xl
    position:
      x: 1860
      'y': 350
  - id: submission
    label: |-
      提交记录
      推理轨迹 · 答案 · Token · 模型信息
    type: document
    size: xl
    position:
      x: 2120
      'y': 210
  - id: metrics
    label: |-
      加权指标
      正确性 · 鲁棒性 · 效率
    type: process
    size: xl
    position:
      x: 2380
      'y': 210
  - id: judge
    label: |-
      智能体裁判
      事实性 + 临床相关性
    type: process
    size: xl
    position:
      x: 2640
      'y': 80
  - id: experts
    label: |-
      人类专家验证
      复核头部提交
    type: user
    size: xl
    position:
      x: 2640
      'y': 340
  - id: score
    label: |-
      最终排名
      预定义加权总分
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 210
edges:
  - from: scope
    to: tasks
    type: primary
  - from: tasks
    to: questiongen
    type: primary
  - from: questiongen
    to: tracegen
    type: primary
  - from: tracegen
    to: toolgen
    type: primary
  - from: toolgen
    to: dataset
    type: primary
  - from: dataset
    to: track
    type: primary
  - from: track
    to: internal
    type: primary
  - from: track
    to: agentic
    type: primary
  - from: internal
    to: submission
    type: primary
  - from: agentic
    to: submission
    type: primary
  - from: submission
    to: metrics
    type: primary
  - from: metrics
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: metrics
    to: experts
    type: optional
  - from: experts
    to: score
    type: optional
modules: []
