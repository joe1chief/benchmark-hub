meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-MMMU 多阶段筛选、问答来源与知识增益流程
  description: >-
    Video-MMMU从6个学科大类、30个科目中的450个大学主题出发，每个主题由GPT-4o生成10条检索词，再经标注者音视频质量/相关性检查、GPT-4o十帧深度评估与领域专家课程匹配复核，得到300个视频。每个视频各配1道感知、理解和适应题，每题10个选项。感知/理解题由人工编写；科学、工程、医学、商业的适应题来自MMMU/MMMU-Pro，艺术/人文适应题由人工编写案例。问答交叉检查、OpenAI
    o1语言和真值核验、领域专家复核，以及Gemini 1.5 Pro音频帮助度标注后得到900题。三条轨道用正则抽取和微平均准确率评分；只有适应轨道另做看视频前后对照，计算归一化知识增益与由错转对/由对转错率。
  legend: 来源：Video-MMMU arXiv:2501.13826 and official EvolvingLMMs-Lab/VideoMMMU repository。实线箭头表示论文或官方资料明确支持的主流程。
