meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-MMMU Multi-Stage Curation, QA Provenance, and Knowledge Gain
  description: >-
    Video-MMMU starts from 450 college topics in 30 subjects and six disciplines, generates ten GPT-4o search queries
    per topic, and filters YouTube candidates through annotator audiovisual/relevance checks, GPT-4o ten-frame depth
    assessment, and domain-expert curriculum review to obtain 300 videos. Each video receives one Perception,
    Comprehension, and Adaptation question with ten options. Perception/Comprehension are human-authored; Adaptation
    uses MMMU/MMMU-Pro in Science, Engineering, Medicine, and Business and human case studies in Art/Humanities. QA
    cross-check, OpenAI o1 language/ground-truth verification, domain-expert review, and Gemini 1.5 Pro
    audio-helpfulness tagging yield 900 questions. Regex extraction and micro-accuracy score the three tracks; only
    Adaptation is additionally tested before/after video using normalized knowledge gain and
    wrong-to-right/right-to-wrong rates.
  legend: >-
    Source: Video-MMMU arXiv:2501.13826 and official EvolvingLMMs-Lab/VideoMMMU repository. Solid arrows show the main
    flow explicitly supported by the paper or official documentation.
