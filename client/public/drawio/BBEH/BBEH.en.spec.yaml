meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIG-Bench Extra Hard Build Process
  description: >-
    Paper-aligned BBEH capability mapping, semi-adversarial difficulty calibration, full and Mini packaging,
    deterministic parsing, and aggregation from arXiv:2502.19187v2.
  legend: Solid arrows show accepted construction and evaluation; the dashed loop repeats until both references are below 70%.
nodes:
  - id: bbh_audit
    label: |-
      Audit Saturated BBH
      Shortcut-Prone / Near-Solved Tasks
      Keep 23 Reasoning Domains
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: skill_map
    label: |-
      Map BBH Reasoning Capabilities
      Preserve All 23 Task Domains
      Define a Harder Target for Each Domain
    type: process
    size: xl
    position:
      x: 320
      'y': 180
  - id: harder_tasks
    label: |-
      Build 23 Harder Counterparts
      Semi-Adversarial Revision or Replacement
      Add Compositionality without Reusing BBH Items
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: candidates
    label: |-
      Generate Candidate Questions
      Check Answerability and Deterministic Answers
      Match the Intended Reasoning Capability
    type: process
    size: xl
    position:
      x: 880
      'y': 180
  - id: ref_models
    label: |-
      Two Reference Models
      Gemini 1.5 Flash
      Gemini Thinking Experimental
    type: process
    size: xl
    position:
      x: 1160
      'y': 20
  - id: difficulty_gate
    label: |-
      Both Reference Models Below 70%?
      Required Separately for Every Task
      Pass → Freeze Task • Fail → Harden Again
    type: decision
    size: xl
    position:
      x: 1160
      'y': 180
  - id: harden
    label: |-
      Revise or Replace the Task
      Remove Shortcuts • Add Necessary Reasoning
      Return to Candidate Generation
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: full_set
    label: |-
      Full BBEH: 4,520 Examples
      23 Tasks • Usually 200 per Task
      Disambiguation QA = 120
    type: database
    size: xl
    position:
      x: 1440
      'y': 180
  - id: mini
    label: |-
      BBEH Mini
      20 Examples per Task
      23 × 20 = 460
    type: database
    size: xl
    position:
      x: 1160
      'y': 460
  - id: prompt
    label: |-
      Fixed Evaluation Suffix
      Step-by-Step Reasoning Instruction
      Fixed Final-Answer Prefix and Format
    type: document
    size: xl
    position:
      x: 1440
      'y': 740
  - id: extract
    label: |-
      Deterministic Parser Cleaning
      Extract Final Answer • Minimal Normalization
      Apply Task-Specific Exact-Match Rules
    type: process
    size: xl
    position:
      x: 1160
      'y': 740
  - id: task_accuracy
    label: |-
      Per-Task Accuracy
      Score Every Full or Mini Example
      Preserve Task-Level Performance Vector
    type: process
    size: xl
    position:
      x: 880
      'y': 740
  - id: harmonic
    label: |-
      Full BBEH Aggregate
      Adjusted Harmonic Mean
      Penalize Uneven Cross-Task Performance
    type: document
    size: xl
    position:
      x: 600
      'y': 620
  - id: micro
    label: |-
      BBEH Mini Aggregate
      Micro Average
      Appropriate for 20 Examples per Task
    type: document
    size: xl
    position:
      x: 600
      'y': 860
  - id: report
    label: |-
      Publish BBEH Results
      Full Adjusted Harmonic Mean
      Mini Micro Average and Per-Task Accuracies
    type: terminal
    size: xl
    position:
      x: 320
      'y': 740
edges:
  - from: bbh_audit
    to: skill_map
    type: primary
  - from: skill_map
    to: harder_tasks
    type: primary
  - from: harder_tasks
    to: candidates
    type: primary
  - from: candidates
    to: difficulty_gate
    type: primary
  - from: ref_models
    to: difficulty_gate
    type: primary
  - from: difficulty_gate
    to: harden
    type: optional
  - from: harden
    to: candidates
    type: optional
  - from: difficulty_gate
    to: full_set
    type: primary
  - from: full_set
    to: mini
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: full_set
    to: prompt
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: mini
    to: prompt
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: prompt
    to: extract
    type: primary
  - from: extract
    to: task_accuracy
    type: primary
  - from: task_accuracy
    to: harmonic
    type: primary
  - from: task_accuracy
    to: micro
    type: primary
  - from: harmonic
    to: report
    type: primary
  - from: micro
    to: report
    type: primary
modules: []
