meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlignBench Build Process
  description: >-
    Paper-aligned AlignBench v1.1 workflow under the report label AlignmentBench: real Chinese scenarios pass four query
    rules and an eight-category taxonomy; GPT-4 references are human-revised with web evidence, three model families
    remove the easier half, and 683 queries are judged point-wise on task-specific dimensions with a calibrated 1-10
    score.
  legend: Solid arrows show curation and evaluation; the upper branch adds evidence for knowledge-intensive references.
