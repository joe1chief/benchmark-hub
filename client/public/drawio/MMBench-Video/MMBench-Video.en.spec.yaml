meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-Video Build Process
  description: >-
    Paper-aligned construction of 1,998 free-form QA pairs over 609 long-form multi-shot YouTube videos, including
    temporal-indispensability filtering and GPT-4 scoring.
  legend: Random single-frame trials identify questions that can be answered without temporal video evidence.
nodes:
  - id: collect
    label: |-
      Collect YouTube Videos
      Cover 16 Major Categories
      Preserve Titles and Subtitles
      Favor Diverse Web Content
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: clips
    label: |-
      Select Long Multi-shot Clips
      Reject Videos under 30 Seconds
      Limit QA Evidence to Six Minutes
      Retain Real-world Topics
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: taxonomy
    label: |-
      Define a Three-level Taxonomy
      Perception and Reasoning
      Nine Level-two Capabilities
      26 Leaf Capabilities
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: author
    label: |-
      Human-author Multiple QA per Video
      Target One or More Leaf Skills
      Encourage Temporal Questions
      Provide Detailed Gold Answers
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: guidelines
    label: |-
      Apply Five Authoring Guidelines
      Avoid Explicit Timestamps
      Use Diverse Free-form Language
      Keep Questions Capability-aligned
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: crosscheck
    label: |-
      Cross-validate Every QA Pair
      Check Accuracy and Guidelines
      Confirm Ground-truth Detail
      Prepare Temporal Filtering
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: frames
    label: |-
      Probe Temporal Indispensability
      Sample One Random Frame
      Run GPT-4V with Four Seeds
      Produce Four Candidate Answers
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: filter
    label: |-
      Filter Static Questions
      GPT-4 Scores the Four Answers
      Remove Mean Score at Least 2.5
      Discard 246 Questions
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: dataset
    label: |-
      Assemble MMBench-Video
      609 Videos · 1,998 QA Pairs
      Mean Duration 165.4 Seconds
      Mean 32.6 Shots per Video
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: infer
    label: |-
      Generate Video-model Answers
      Sample Chronological Frames
      Optionally Include Subtitles
      Preserve Free-form Responses
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: judge
    label: |-
      Judge with GPT-4
      Compare Candidate and Gold Answer
      Use Semantic Content Similarity
      Ignore Grammatical Differences
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Report Zero-to-three Scores
      Zero Incorrect · Three Correct
      Aggregate Overall and by Ability
      Evaluate Holistic Video Skill
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: clips
    type: primary
  - from: clips
    to: taxonomy
    type: primary
  - from: taxonomy
    to: author
    type: primary
  - from: author
    to: guidelines
    type: primary
  - from: guidelines
    to: crosscheck
    type: primary
  - from: crosscheck
    to: frames
    type: primary
  - from: frames
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: infer
    type: primary
  - from: infer
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
