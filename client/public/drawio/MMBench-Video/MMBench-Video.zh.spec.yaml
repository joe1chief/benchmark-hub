meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-Video 证据对齐的构建与评测流程
  description: 重建论文中的长视频人工问答构建、时序必要性过滤和公开发布流程，并呈现论文同期 VLMEvalKit 的推理、解析、评判、失败与聚合合同。
  legend: 实线表示构建与评测主路径；判断分支显式标注条件结果；中间未连接卡片独立保留构建、发布与实现审计发现。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      论文 · arXiv 2406.14515v3
      数据 · 78bfb7c7 · 1,998 行
      VLMEvalKit · 796dc7cd
      首次集成 · 2024-06-26
    type: document
    size: xl
    position:
      x: 80
      'y': 224
  - id: collect
    label: |-
      志愿者收集 YouTube 视频
      参考 YouTube-8M 的类别
      保留标题 · 点击量 · 字幕
      覆盖多样长时网页内容
    type: database
    size: xl
    position:
      x: 352
      'y': 224
  - id: duration_gate
    label: 视频时长至少 30 秒？
    type: decision
    size: xl
    position:
      x: 624
      'y': 224
  - id: reject_short
    label: |-
      拒绝短视频
      时长不足 30 秒
    type: terminal
    size: xl
    position:
      x: 896
      'y': 32
  - id: clip
    label: |-
      定义问答证据片段
      收集视频本身不设时长上限
      每组问答最多使用六分钟
    type: process
    size: xl
    position:
      x: 896
      'y': 224
  - id: taxonomy
    label: |-
      建立三级能力体系
      一级 · 感知 / 推理
      九项二级 · 26 项叶子能力
      新增三项视频专属二级能力
    type: document
    size: xl
    position:
      x: 1168
      'y': 224
  - id: author
    label: |-
      人工为每个视频编写多题
      每题标注一项或多项叶子能力
      鼓励时序必要问题
      自由表达 · 详细标准答案
    type: user
    size: xl
    position:
      x: 1440
      'y': 224
  - id: crosscheck
    label: |-
      执行五项准则并交叉核验
      不写绝对时间戳 · 改用相对时间
      多样 / 对话式措辞
      验证准确性与准则遵循
    type: process
    size: xl
    position:
      x: 1712
      'y': 224
  - id: frames
    label: |-
      探测时序必要性
      每题使用四个不同随机种子
      每次随机抽取一帧
      GPT-4V 生成四个回答
    type: process
    size: xl
    position:
      x: 1984
      'y': 224
  - id: mean_score
    label: |-
      GPT-4 逐次评判
      语义相似度 · 零至三分
      计算每题四次得分均值
    type: process
    size: xl
    position:
      x: 2256
      'y': 224
  - id: temporal_gate
    label: 四次平均分至少为 2.5？
    type: decision
    size: xl
    position:
      x: 2528
      'y': 224
  - id: exclude_static
    label: |-
      排除静态可答问题
      共移除 246 组问答
    type: terminal
    size: xl
    position:
      x: 2800
      'y': 32
  - id: manual_verify
    label: |-
      人工复核
      检查 LVLM 过滤后的问题
      保留确需时序信息的问答
    type: process
    size: xl
    position:
      x: 2800
      'y': 224
  - id: dataset
    label: |-
      汇总论文基准
      609 个视频 · 1,998 组问答
      平均 165.4 秒 · 32.6 个镜头
      叶子能力可多标签
    type: database
    size: xl
    position:
      x: 3072
      'y': 224
  - id: release
    label: |-
      在 Hugging Face 发布完整包
      完整快照 · 78bfb7c7
      数据至 ef35e21d 未变化
      论文：CC BY-NC 4.0
      数据卡：CC BY 4.0 · 冲突
    type: document
    size: xl
    position:
      x: 3344
      'y': 224
  - id: artifact_drift
    label: |-
      发布产物差异
      论文 · 16 类 · TSV · 19 种 video_type
      1,998 行 · 609 视频 · 26 叶子能力
      无缺失 / 重复索引
      正文 ≥ 30 秒 · Datasheet 最短 16.9 秒
    type: document
    size: xl
    position:
      x: 80
      'y': 544
  - id: construction_gaps
    label: |-
      未披露的构建细节
      志愿者数量 / 培训 / 分工
      视频检索与纳入协议
      交叉核验一致性 / 仲裁
      人工复核准则与数量
    type: document
    size: xl
    position:
      x: 352
      'y': 544
  - id: current_boundary
    label: |-
      后续工具边界 · 7055d301
      数据下载仍未固定 revision
      新增原生视频输入路径
      核心提示仍无字幕字段
      Pack 解析器与评分器等价保留
    type: document
    size: xl
    position:
      x: 624
      'y': 544
  - id: sampling
    label: |-
      首版官方均匀采帧
      默认 F = 8 · 可覆盖
      索引 int(i × N / (F + 1))
      按时间顺序取内部帧
    type: process
    size: xl
    position:
      x: 3344
      'y': 864
  - id: inference
    label: |-
      构造候选模型提示
      Pack · 同视频全部问题 → JSON
      No-pack · 单题 → 直接文本
      代码未加入字幕字段
      信息不足也必须回答
    type: process
    size: xl
    position:
      x: 3072
      'y': 864
  - id: pack_parse
    label: |-
      解析候选输出
      Pack · 必须恰有一个 JSON 对象
      单左花括号时逐行宽松回退
      缺键 / 解析 / 生成失败 → None
      No-pack · 不解析回答
    type: process
    size: xl
    position:
      x: 2800
      'y': 864
  - id: judge
    label: |-
      GPT-4 系列语义评判
      论文 · GPT-4 与零至三分量表
      首版代码默认 · gpt-4-1106-preview
      忽略语法 · 要求单个整数
    type: user
    size: xl
    position:
      x: 2528
      'y': 864
  - id: score_gate
    label: |-
      istype 内先对响应执行不安全的 eval
      求值结果是否为 int？
    type: decision
    size: xl
    position:
      x: 2256
      'y': 864
  - id: valid_score
    label: |-
      使用 int(响应) 转换
      纯整数文本 → 保存得分
      不强制零至三分范围
      表达式可能已执行并在转换时中止
    type: process
    size: xl
    position:
      x: 1984
      'y': 736
  - id: invalid_score
    label: |-
      保存 −1 哨兵值
      缺预测 / 评判失败 / 非整数文本
      进入共享聚合
    type: process
    size: xl
    position:
      x: 1984
      'y': 992
  - id: metrics
    label: |-
      聚合多标签均值
      每个得分 · ALL 使用 max(x, 0)
      VALID 仅保留 x ≥ 0
      26 叶子 · 九项二级能力
      感知 · 推理 · 总体
    type: process
    size: xl
    position:
      x: 1712
      'y': 864
  - id: output
    label: |-
      Rating JSON
      粗粒度 / 细粒度 · ALL / VALID
      名义零至三分量表上的平均分
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 864
edges:
  - from: evidence
    to: collect
    type: primary
  - from: collect
    to: duration_gate
    type: primary
  - from: duration_gate
    to: reject_short
    type: primary
    label: 否
    labelPosition: end
  - from: duration_gate
    to: clip
    type: primary
    label: 是
    labelPosition: end
  - from: clip
    to: taxonomy
    type: primary
  - from: taxonomy
    to: author
    type: primary
  - from: author
    to: crosscheck
    type: primary
  - from: crosscheck
    to: frames
    type: primary
  - from: frames
    to: mean_score
    type: primary
  - from: mean_score
    to: temporal_gate
    type: primary
  - from: temporal_gate
    to: exclude_static
    type: primary
    label: 是
    labelPosition: end
  - from: temporal_gate
    to: manual_verify
    type: primary
    label: 否
    labelPosition: end
  - from: manual_verify
    to: dataset
    type: primary
  - from: dataset
    to: release
    type: primary
  - from: release
    to: sampling
    type: primary
  - from: sampling
    to: inference
    type: primary
  - from: inference
    to: pack_parse
    type: primary
  - from: pack_parse
    to: judge
    type: primary
  - from: judge
    to: score_gate
    type: primary
  - from: score_gate
    to: valid_score
    type: primary
    label: 真
    labelPosition: end
  - from: score_gate
    to: invalid_score
    type: primary
    label: 假
    labelPosition: end
  - from: valid_score
    to: metrics
    type: primary
  - from: invalid_score
    to: metrics
    type: primary
  - from: metrics
    to: output
    type: primary
modules: []
