meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-Video 构建流程
  description: 按论文重建 609 个长时多镜头 YouTube 视频上的 1,998 个自由问答对，包括时序必要性过滤与 GPT-4 评分。
  legend: 随机单帧重复实验用于识别无需时序视频证据即可回答的问题。
nodes:
  - id: collect
    label: |-
      收集 YouTube 视频
      覆盖 16 个主要类别
      保留标题与字幕
      强调多样网页内容
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: clips
    label: |-
      选择长时多镜头片段
      去除短于 30 秒的视频
      问答证据最多来自六分钟
      保留真实世界主题
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: taxonomy
    label: |-
      定义三级能力体系
      感知与推理两大类
      九项二级能力
      26 项叶子能力
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: author
    label: |-
      人工为每个视频编写多题
      每题对应一项或多项能力
      鼓励时序必要问题
      提供详细标准答案
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: guidelines
    label: |-
      执行五项编写准则
      避免写入明确时间戳
      使用多样自由表达
      问题与能力分类对齐
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: crosscheck
    label: |-
      交叉验证每个问答对
      检查准确性与准则遵循
      确认标准答案细节
      准备时序过滤
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: frames
    label: |-
      探测时序必要性
      随机抽取单帧
      GPT-4V 用四个种子作答
      得到四个候选回答
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: filter
    label: |-
      过滤静态问题
      GPT-4 评分四个回答
      平均分至少 2.5 即移除
      共丢弃 246 题
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: dataset
    label: |-
      汇总 MMBench-Video
      609 个视频 · 1,998 个问答对
      平均时长 165.4 秒
      每个视频平均 32.6 个镜头
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: infer
    label: |-
      生成视频模型回答
      按时间顺序采样多帧
      可选加入字幕
      保留自由文本回答
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: judge
    label: |-
      使用 GPT-4 评判
      对比候选与标准答案
      依据语义内容相似度
      忽略语法差异
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      报告零至三分
      零分错误 · 三分完全正确
      汇总整体与各能力得分
      评估整体视频理解
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: clips
    type: primary
  - from: clips
    to: taxonomy
    type: primary
  - from: taxonomy
    to: author
    type: primary
  - from: author
    to: guidelines
    type: primary
  - from: guidelines
    to: crosscheck
    type: primary
  - from: crosscheck
    to: frames
    type: primary
  - from: frames
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: infer
    type: primary
  - from: infer
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
