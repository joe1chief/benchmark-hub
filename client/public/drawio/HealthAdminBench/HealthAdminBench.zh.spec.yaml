meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthAdminBench 构建流程
  description: 与论文一致的四个医疗行政 GUI 环境、135 个任务、1,698 个子任务及严格智能体验证流程。
  legend: 135 个任务包括事前授权 60、申诉与拒付 60、耐用医疗设备 15。整题成功要求所有二元子任务验证器均通过， 整题层面不提供部分分。
nodes:
  - id: observe
    label: |-
      基于真实工作流取材
      超过 100 小时医院跟岗观察
      参考 MedHELM 行政与工作流类别
    type: user
    size: xl
    position:
      x: 40
      'y': 360
  - id: environments
    label: |-
      构建四个确定性 GUI 沙箱
      EHR · 两个支付方门户 · 传真系统
      合成患者 · 模式/政策失败条件
    type: database
    size: xl
    position:
      x: 340
      'y': 100
  - id: task_design
    label: |-
      在职医疗管理员设计任务
      指定现实目标与完成状态
      覆盖跨系统收入周期工作
    type: process
    size: xl
    position:
      x: 340
      'y': 620
  - id: task_route
    label: |-
      分配工作流与难度
      简单 · 中等 · 困难
      保留跨系统依赖
    type: decision
    size: xl
    position:
      x: 640
      'y': 620
  - id: prior
    label: |-
      事前授权 · 60 个任务
      资格 · EHR 证据 · 支付方表单
      满足条件则提交否则停止
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: appeals
    label: |-
      申诉与拒付 · 60 个任务
      分诊 · 重提或申诉 · 记录
      处理歧义与高价值案例
    type: database
    size: xl
    position:
      x: 940
      'y': 600
  - id: dme
    label: |-
      耐用医疗设备订单 · 15 个任务
      取记录 · 传真材料 · 记录结果
      材料缺失或无效时停止
    type: database
    size: xl
    position:
      x: 940
      'y': 900
  - id: audit
    label: |-
      正式审计 40 个授权/申诉任务
      每题由两名收入周期专家独立评审
      将术语与约束修正推广到同类任务
    type: process
    size: xl
    position:
      x: 1240
      'y': 450
  - id: dme_test
    label: |-
      迭代测试设备订单工作流
      演练文档传递与阻断条件
      验证标准化提交逻辑
    type: process
    size: xl
    position:
      x: 1240
      'y': 900
  - id: subtasks
    label: |-
      拆解 135 个任务
      得到 1,698 个固定可验证子任务
      六类检索/操作/推理能力
    type: database
    size: xl
    position:
      x: 1540
      'y': 620
  - id: benchmark
    label: |-
      打包可复现基准
      类型输入 · 政策检查 · 失败模式
      任务定义与预期最终状态
    type: database
    size: xl
    position:
      x: 1840
      'y': 360
  - id: agent
    label: |-
      运行计算机操作智能体循环
      截图或无障碍树观察
      点击 · 输入 · 选择 · 传递文件
    type: process
    size: xl
    position:
      x: 2140
      'y': 360
  - id: memory
    label: |-
      维持长程状态
      跨步骤持久草稿记忆
      任务描述加门户通用指导
    type: process
    size: xl
    position:
      x: 2440
      'y': 360
  - id: verifier_route
    label: |-
      验证最终门户状态
      每个子任务返回二元通过/失败
      分流结构化与自由文本检查
    type: decision
    size: xl
    position:
      x: 2740
      'y': 360
  - id: deterministic
    label: |-
      确定性检查 · 1,177
      对门户状态执行 JMESPath 查询
      精确字段 · 文件 · 终止动作
    type: process
    size: xl
    position:
      x: 3040
      'y': 140
  - id: llm_judge
    label: |-
      LLM 检查 · 521
      GPT-5.4 判定记录与申诉理由
      抽查 60 项与人工一致率 93.3%
    type: process
    size: xl
    position:
      x: 3040
      'y': 580
  - id: score
    label: |-
      报告可靠性
      子任务成功率 · 全子任务整题成功率
      95% 自助法置信区间
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 360
edges:
  - from: observe
    to: environments
    type: primary
  - from: observe
    to: task_design
    type: primary
  - from: task_design
    to: task_route
    type: primary
  - from: task_route
    to: prior
    type: primary
  - from: task_route
    to: appeals
    type: primary
  - from: task_route
    to: dme
    type: secondary
  - from: prior
    to: audit
    type: primary
  - from: appeals
    to: audit
    type: primary
  - from: dme
    to: dme_test
    type: secondary
  - from: audit
    to: subtasks
    type: primary
  - from: dme_test
    to: subtasks
    type: secondary
  - from: environments
    to: benchmark
    type: primary
  - from: subtasks
    to: benchmark
    type: primary
  - from: benchmark
    to: agent
    type: primary
  - from: agent
    to: memory
    type: primary
  - from: memory
    to: verifier_route
    type: primary
  - from: verifier_route
    to: deterministic
    type: primary
  - from: verifier_route
    to: llm_judge
    type: secondary
  - from: deterministic
    to: score
    type: primary
  - from: llm_judge
    to: score
    type: secondary
modules: []
