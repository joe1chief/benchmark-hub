meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthAdminBench Build Process
  description: >-
    Paper-aligned construction of four healthcare-administration GUI environments, 135 tasks, 1,698 subtasks, and strict
    agent verification.
  legend: >-
    The 135 tasks comprise 60 Prior Authorization, 60 Appeals and Denials, and 15 DME workflows. Full-task success
    requires every binary subtask verifier to pass; no partial credit is given at the task level.
nodes:
  - id: observe
    label: |-
      Ground workflows in practice
      more than 100 hours of hospital shadowing
      use MedHELM Administration and Workflow
    type: user
    size: xl
    position:
      x: 40
      'y': 360
  - id: environments
    label: |-
      Build four deterministic GUI sandboxes
      EHR · two payer portals · fax system
      synthetic patients · schema/policy failures
    type: database
    size: xl
    position:
      x: 340
      'y': 100
  - id: task_design
    label: |-
      Practicing administrators design tasks
      specify realistic goals and end states
      cover multi-system revenue-cycle work
    type: process
    size: xl
    position:
      x: 340
      'y': 620
  - id: task_route
    label: |-
      Assign workflow and difficulty
      easy · medium · hard
      preserve cross-system dependencies
    type: decision
    size: xl
    position:
      x: 640
      'y': 620
  - id: prior
    label: |-
      Prior Authorization · 60 tasks
      eligibility · EHR evidence · payer forms
      submit or halt when requirements fail
    type: database
    size: xl
    position:
      x: 940
      'y': 300
  - id: appeals
    label: |-
      Appeals and Denials · 60 tasks
      triage · resubmit or appeal · document
      handle ambiguous and high-value cases
    type: database
    size: xl
    position:
      x: 940
      'y': 600
  - id: dme
    label: |-
      DME Order Processing · 15 tasks
      retrieve records · fax documents · record
      stop on missing or invalid documentation
    type: database
    size: xl
    position:
      x: 940
      'y': 900
  - id: audit
    label: |-
      Formally audit 40 PA/appeal tasks
      two revenue-cycle experts per task
      propagate terminology and constraint fixes
    type: process
    size: xl
    position:
      x: 1240
      'y': 450
  - id: dme_test
    label: |-
      Iteratively test DME workflows
      exercise document transfer and blockers
      validate standardized submission logic
    type: process
    size: xl
    position:
      x: 1240
      'y': 900
  - id: subtasks
    label: |-
      Decompose 135 tasks
      1,698 fixed verifiable subtasks
      six retrieval/action/reasoning types
    type: database
    size: xl
    position:
      x: 1540
      'y': 620
  - id: benchmark
    label: |-
      Package reproducible benchmark
      typed inputs · policy checks · failure modes
      task definitions and expected final state
    type: database
    size: xl
    position:
      x: 1840
      'y': 360
  - id: agent
    label: |-
      Run a computer-use agent loop
      screenshot or accessibility-tree observation
      click · type · select · transfer files
    type: process
    size: xl
    position:
      x: 2140
      'y': 360
  - id: memory
    label: |-
      Maintain long-horizon state
      persistent scratch memory between steps
      task description plus portal guidance
    type: process
    size: xl
    position:
      x: 2440
      'y': 360
  - id: verifier_route
    label: |-
      Verify resulting portal state
      every subtask returns binary pass/fail
      route structured and free-text checks
    type: decision
    size: xl
    position:
      x: 2740
      'y': 360
  - id: deterministic
    label: |-
      Deterministic checks · 1,177
      JMESPath queries over portal state
      exact fields · files · terminal actions
    type: process
    size: xl
    position:
      x: 3040
      'y': 140
  - id: llm_judge
    label: |-
      LLM checks · 521
      GPT-5.4 judges notes and rationales
      93.3% agreement on 60 checked subtasks
    type: process
    size: xl
    position:
      x: 3040
      'y': 580
  - id: score
    label: |-
      Report reliability
      subtask success · all-subtasks task success
      95% bootstrap confidence intervals
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 360
