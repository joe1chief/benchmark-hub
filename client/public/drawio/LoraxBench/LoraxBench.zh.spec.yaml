meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LoraxBench 构建流程
  description: 按论文与官方发布复原 LoraxBench：将六类印尼语 NLP 任务扩展到印尼语和 19 种本地语言及语域变体， 经母语者翻译复核后，以任务专属方法评测，并明确记录不同数据量口径。
  legend: arXiv:2508.12459 表 3 相加为 84,711 条测试数据，但正文写作 84,895；官方 Hugging Face 发布共 87,011 行，因为还包含 2,300 条 TyDi-QA 训练样本。
nodes:
  - id: languages
    label: |-
      定义语言覆盖范围
      印尼语 + 19 种本地语言
      增加正式与日常语域
      共 23 个语言/语域子集
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      汇集印尼语源任务
      TyDi-QA · IndoNLI · COPAL-ID
      IndoCulture
      保留本土文化语境
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: tydi
    label: |-
      改造 TyDi-QA
      阅读理解保留文章
      开放问答移除文章
      各子集保留测试集及 100 条训练题
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: other_tasks
    label: |-
      形成另外四类任务
      NLI 来自专家编写的 IndoNLI 测试集
      翻译取自 IndoNLI 前提句
      因果推理与文化问答采用多选题
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: cleanup
    label: |-
      按数据源执行清洗
      删除 6 道不可回答的开放问答
      删除偏向雅加达的 COPAL-ID 题
      将 IndoCulture 整理为 510 题
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: translate
    label: |-
      由母语者翻译
      每种语言使用专业译者
      按任务要求连接本地语言与印尼语
      采用统一任务指南
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: review
    label: |-
      由第二位母语者复核
      检查语言和文化有效性
      通过团队会议对齐判断
      每种语言 8–31 位标注者
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: checks
    label: |-
      运行翻译自动检查
      标记异常文本长度
      标记数字不一致
      将可疑项送回修正
    type: process
    size: xl
    position:
      x: 1700
      'y': 420
  - id: retranslate
    label: |-
      修正被标记的翻译
      重译已确认的错误
      重新检查修正记录
      保留语言与语域标签
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: release
    label: |-
      发布官方数据
      Hugging Face 共 87,011 行
      含 2,300 条 TyDi-QA 训练数据
      测试表合计 · 84,711
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: formats
    label: |-
      构造六类任务输入
      分类与多项选择
      抽取式及开放式生成
      本地语言到印尼语翻译
    type: document
    size: xl
    position:
      x: 860
      'y': 420
  - id: evaluate
    label: |-
      运行模型评测
      五类任务使用零样本设置
      阅读理解使用少样本示例
      比较标准、语言与词典提示
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: metrics
    label: |-
      使用任务专属指标
      非翻译任务采用准确率
      开放问答 · 答案子串匹配
      翻译 · ChrF++
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      报告多语言结果
      按任务与语言分解
      比较正式与日常语域
      分析不同提示策略差距
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: languages
    to: sources
    type: primary
  - from: sources
    to: tydi
    type: primary
  - from: tydi
    to: other_tasks
    type: primary
  - from: other_tasks
    to: cleanup
    type: primary
  - from: cleanup
    to: translate
    type: primary
  - from: translate
    to: review
    type: primary
  - from: review
    to: checks
    type: primary
  - from: checks
    to: retranslate
    type: primary
  - from: retranslate
    to: release
    type: primary
  - from: release
    to: formats
    type: primary
  - from: formats
    to: evaluate
    type: primary
  - from: evaluate
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
