meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LoraxBench Build Process
  description: >-
    Paper-v1 and pinned-release reconstruction of LoraxBench: six parallel Indonesian-source task branches, retention of
    Indonesian release records for the five non-translation tasks, professional native-speaker translation into 22 local
    variants, assembly of the task configs, and the paper-specified evaluation workflow with explicit public gaps.
    Machine translation uses the 22 local variants as sources with Indonesian targets.
  legend: >-
    Solid arrows show paper-backed construction or evaluation flow. Dashed data arrows show provenance, the retained
    Indonesian path, correction side path, count reconciliation, appendix analysis, and public limitations. Counts were
    independently verified against the seven pinned Parquet files.
