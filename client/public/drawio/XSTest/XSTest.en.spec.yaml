meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XSTest Safe/Unsafe Contrast Construction and Manual Evaluation
  description: >-
    XSTest defines ten safe-prompt types and hand-crafts 25 one-sentence English questions per type, using dictionaries
    and GPT-4 only for ideation. Minimal edits create unsafe contrasts; T6/T7 and T9/T10 each share a contrast, yielding
    250 safe and 200 unsafe prompts. Models run at temperature 0 and max 256 tokens. Three authors manually label Full
    Compliance, Partial Refusal, or Full Refusal with two labels per response and three-way consensus for disagreements.
  legend: >-
    Source: XSTest arXiv:2308.01263v3 / NAACL 2024, Sections 3.1-3.3, Table 1, Sections 4.1-4.2, Tables 3-5, and
    Appendices A-C; official repository https://github.com/paul-rottger/xstest. Count pin: 250 safe plus 200 unsafe;
    Section 4.3 contains a 200-safe typo contradicted by the abstract, Section 3.3, Table 1, and repository data. Paper
    evaluation is manual; repository automation is optional only.. Solid arrows show the main flow explicitly supported
    by the paper or official documentation.
