meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XSTest 安全/不安全对照构建与人工评测流程
  description: >-
    XSTest定义10类安全提示，每类手工写25个单句英文问题，在线词典与GPT-4仅用于启发。通过最小编辑生成不安全对照，T6/T7与T9/T10各共享一类对照，因此得到250条安全与200条不安全提示。模型以温度0、最大256
    tokens运行。3名作者人工标注完全配合、部分拒绝或完全拒绝，每个回答由2人标注，分歧由3人讨论达成共识。
  legend: >-
    来源：XSTest arXiv:2308.01263v3 / NAACL 2024, Sections 3.1-3.3, Table 1, Sections 4.1-4.2, Tables 3-5, and Appendices
    A-C; official repository https://github.com/paul-rottger/xstest. Count pin: 250 safe plus 200 unsafe; Section 4.3
    contains a 200-safe typo contradicted by the abstract, Section 3.3, Table 1, and repository data. Paper evaluation
    is manual; repository automation is optional only.。实线箭头表示论文或官方资料明确支持的主流程。
