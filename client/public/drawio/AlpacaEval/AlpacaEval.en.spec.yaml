meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Original AlpacaEval Build Process
  description: >-
    The original AlpacaEval simplifies the fixed AlpacaFarm evaluation set, regenerates text-davinci-003 references, and
    measures model win rate with randomized temperature-zero alpaca_eval_gpt4 pairwise judgments.
  legend: >-
    The top row constructs the fixed 805-example evaluation set; the lower rows compare candidate and fixed reference
    responses and aggregate preferences without the later AlpacaEval-LC regression.
nodes:
  - id: alpaca_farm
    label: |-
      AlpacaFarm Evaluation Set
      Fixed 805 Examples
      Source Evaluation Distribution
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: merge_fields
    label: |-
      Simplify Prompt Fields
      1/4 Self-Instruct Examples Affected
      Merge Instruction + Input
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: reference_regeneration
    label: |-
      Regenerate text-davinci-003 References
      Without the AlpacaFarm Length Limit
      Preserve One Reference per Instruction
    type: process
    size: xl
    position:
      x: 600
      'y': 80
  - id: dataset
    label: |-
      Fixed AlpacaEval Set
      805 Instructions + References
      Original Evaluation Contract
    type: database
    size: xl
    position:
      x: 880
      'y': 80
  - id: candidate
    label: |-
      Evaluated Model
      Answer Every Instruction
      Candidate Responses
    type: process
    size: xl
    position:
      x: 600
      'y': 360
  - id: reference
    label: |-
      Fixed Reference Responses
      text-davinci-003
      Same 805 Instructions
    type: document
    size: xl
    position:
      x: 880
      'y': 360
  - id: randomize
    label: |-
      Randomize Response Order
      Candidate / Reference
      Control Position Bias
    type: process
    size: xl
    position:
      x: 600
      'y': 640
  - id: judge
    label: |-
      alpaca_eval_gpt4 Judge
      GPT-4 • Temperature = 0
      Pairwise Preference Prompt
    type: process
    size: xl
    position:
      x: 320
      'y': 640
  - id: preference
    label: |-
      Parse Preference
      Candidate Win / Reference Win
      Tie = 0.5 for Each Side
    type: document
    size: xl
    position:
      x: 40
      'y': 640
  - id: score
    label: |-
      Aggregate 805 Judgments
      Mean Win Rate + Standard Error
      Candidate versus text-davinci-003
    type: process
    size: xl
    position:
      x: 40
      'y': 920
  - id: report
    label: |-
      Original AlpacaEval Report
      Win Rate and Standard Error
      Automatic Evaluation Result
    type: terminal
    size: xl
    position:
      x: 320
      'y': 920
edges:
  - from: alpaca_farm
    to: merge_fields
    type: primary
  - from: merge_fields
    to: reference_regeneration
    type: primary
  - from: reference_regeneration
    to: dataset
    type: primary
  - from: dataset
    to: candidate
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: dataset
    to: reference
    type: data
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.75
      entryY: 0
  - from: candidate
    to: randomize
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: reference
    to: randomize
    type: primary
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.75
      entryY: 0
  - from: randomize
    to: judge
    type: primary
  - from: judge
    to: preference
    type: primary
  - from: preference
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
