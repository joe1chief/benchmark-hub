meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard v2.0 Build Process
  description: >-
    Source-aligned v2.0 prompt composition and automatic preference-evaluation workflow based on arXiv:2406.11939 and
    the official lmarena/arena-hard-auto repository.
  legend: >-
    The Arena-Hard paper defines the live-data benchmark pipeline; the official v2.0 release adds its exact fresh prompt
    counts, creative-writing split, judge configurations, and style-controlled reporting.
nodes:
  - id: arena_data
    label: |-
      Start from Chatbot Arena Data
      Fresh Real-World User Queries
      Preserve Open-Ended Diversity
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: hard_prompts
    label: |-
      Curate Hard-Prompt Split
      500 Fresh Challenging Queries
      Software • Math • Real-World Problems
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: creative_prompts
    label: |-
      Curate Creative-Writing Split
      250 Arena Queries
      Separate Creative Evaluation
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: release
    label: |-
      Release Arena-Hard v2.0
      750 Total Prompts
      Category Labels and Reference Data
    type: database
    size: xl
    position:
      x: 600
      'y': 170
  - id: answers
    label: |-
      Generate Model Answers
      Candidate and Reference Systems
      Cache Answers by Prompt and Model
    type: process
    size: xl
    position:
      x: 880
      'y': 170
  - id: hard_judge
    label: |-
      Judge Hard Prompts Pairwise
      Gemini 2.5 Official Configuration
      GPT-4.1 Fast Stable Alternative
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
  - id: creative_judge
    label: |-
      Judge Creative Writing
      GPT-4.1 and Gemini 2.5 Independently
      Aggregate the Judge Ensemble
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: style_features
    label: |-
      Compute Style Features
      Response Length • Markdown Density
      Attach Features to Model Answers
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: judgments
    label: |-
      Store Pairwise Judgments
      Candidate Better • Tie • Reference Better
      Cache by Prompt, Models, and Judge
    type: database
    size: xl
    position:
      x: 1440
      'y': 300
  - id: aggregation
    label: |-
      Aggregate Evaluation Results
      Hard Split Uses Style Control
      Creative Split Uses Judge Ensemble
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
  - id: win_rate
    label: |-
      Compute Model Win Rate
      Bootstrap Confidence Intervals
      Compare against the Reference Model
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: quality_metrics
    label: |-
      Validate Benchmark Quality
      Separability with Confidence
      Agreement with Human Preference
    type: process
    size: xl
    position:
      x: 880
      'y': 600
  - id: report
    label: |-
      Publish Arena-Hard v2.0 Leaderboard
      Hard and Creative Results
      Scores with Confidence Intervals
    type: terminal
    size: xl
    position:
      x: 600
      'y': 600
edges:
  - from: arena_data
    to: hard_prompts
    type: primary
  - from: arena_data
    to: creative_prompts
    type: data
  - from: hard_prompts
    to: release
    type: primary
  - from: creative_prompts
    to: release
    type: primary
  - from: release
    to: answers
    type: primary
  - from: answers
    to: hard_judge
    type: primary
  - from: answers
    to: creative_judge
    type: data
  - from: hard_judge
    to: style_features
    type: primary
  - from: hard_judge
    to: judgments
    type: data
  - from: creative_judge
    to: judgments
    type: primary
  - from: style_features
    to: aggregation
    type: data
  - from: judgments
    to: aggregation
    type: primary
  - from: aggregation
    to: win_rate
    type: primary
  - from: win_rate
    to: quality_metrics
    type: primary
  - from: quality_metrics
    to: report
    type: primary
modules: []
