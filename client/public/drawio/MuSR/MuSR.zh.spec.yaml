meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuSR 构建与评测流程
  description: 对齐论文展示从领域模板和递归推理树到分章节叙事、质量校验、数据发布与推理评测的神经符号合成转自然语言流程。
  legend: 官方版本含 564 篇英文叙事和 756 道问题，覆盖谋杀谜案、物体放置与团队分配三类任务。
nodes:
  - id: goal
    label: |-
      定义多步软推理任务
      使用自然自由文本叙事
      需要常识与社会推断
      形成长链多步解答
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: templates
    label: |-
      实例化三类领域模板
      谋杀：手段 · 动机 · 机会
      物体：移动 · 观察 · 干扰
      团队：技能 · 协作 · 效率
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: facts
    label: |-
      创建结构化种子事实
      黄金事实 F 决定答案
      多样性事实 G 改变场景
      设定领域专属要求
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: trees
    label: |-
      递归补全推理树
      GPT-4 展开每个结论
      子节点共同蕴含父节点
      继续展开到场景级叶子
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: tree_validation
    label: |-
      应用推理树校验器 V
      拒绝空洞推导
      阻断推理捷径
      失败的展开重新生成
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: leaves
    label: |-
      划分推理树叶子
      场景事实 S(T) 写入故事
      常识事实 C(T) 保持隐含
      保留黄金推导链
    type: database
    size: xl
    position:
      x: 1220
      'y': 230
  - id: chapters
    label: |-
      按章节生成叙事
      把 S(T) 划成主题块
      GPT-4 为每块撰写章节
      拼接并润色各章节
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: story_validation
    label: |-
      校验故事事实一致性
      检查每条场景事实均被蕴含
      重写不一致章节
      保持自然叙事风格
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: release
    label: |-
      汇总官方发布数据
      564 篇叙事 · 756 道问题
      谋杀 250 · 物体 64 / 256
      团队分配 250 · 英文
    type: database
    size: xl
    position:
      x: 1220
      'y': 500
  - id: quality
    label: |-
      验证数据集质量
      测试规则启发式基线
      人工子集检查可解性
      确认叙事连贯与高准确率
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: evaluate
    label: |-
      评测语言模型
      常规 · CoT · CoT+
      单样本与少样本 CoT+
      领域专属神经符号方法
    type: process
    size: xl
    position:
      x: 740
      'y': 500
  - id: report
    label: |-
      报告推理准确率
      分别统计三类领域
      比较提示与推理方法
      刻画人类与模型差距
    type: terminal
    size: xl
    position:
      x: 500
      'y': 500
edges:
  - from: goal
    to: templates
    type: primary
  - from: templates
    to: facts
    type: primary
  - from: facts
    to: trees
    type: primary
  - from: trees
    to: tree_validation
    type: primary
  - from: tree_validation
    to: leaves
    type: primary
  - from: leaves
    to: chapters
    type: primary
  - from: chapters
    to: story_validation
    type: primary
  - from: story_validation
    to: release
    type: primary
  - from: release
    to: quality
    type: primary
  - from: quality
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
