meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuSR Build and Evaluation Process
  description: >-
    Paper-aligned neurosymbolic synthetic-to-natural generation from domain templates and recursive reasoning trees to
    chaptered narratives, validation, release, and reasoning evaluation.
  legend: >-
    The official release contains 564 English narratives and 756 questions across murder mystery, object placement, and
    team allocation.
nodes:
  - id: goal
    label: |-
      Define Multistep Soft Reasoning
      Natural Free-text Narratives
      Commonsense and Social Inference
      Long Multi-step Solutions
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: templates
    label: |-
      Instantiate Three Domain Templates
      Murder: Means · Motive · Opportunity
      Object: Moves · Views · Distractions
      Team: Skills · Compatibility · Efficiency
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: facts
    label: |-
      Create Structured Seed Facts
      Gold Facts F Determine the Answer
      Diversity Facts G Vary the Scenario
      Set Domain-specific Requirements
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: trees
    label: |-
      Recursively Complete Reasoning Trees
      GPT-4 Expands Each Conclusion
      Children Jointly Entail the Parent
      Continue to Scenario-level Leaves
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: tree_validation
    label: |-
      Apply Tree Validators V
      Reject Vacuous Deductions
      Block Reasoning Shortcuts
      Retry Failed Expansions
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: leaves
    label: |-
      Partition Reasoning-tree Leaves
      Scenario Facts S(T) Enter the Story
      Commonsense Facts C(T) Stay Implicit
      Preserve the Gold Derivation
    type: database
    size: xl
    position:
      x: 1220
      'y': 230
  - id: chapters
    label: |-
      Generate Narrative by Chaptering
      Split S(T) into Thematic Chunks
      GPT-4 Writes One Chapter per Chunk
      Concatenate and Smooth Chapters
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: story_validation
    label: |-
      Validate Story Fact Consistency
      Check Every Scenario Fact Is Entailed
      Rewrite Inconsistent Chapters
      Keep Naturalistic Narratives
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: release
    label: |-
      Assemble the Official Release
      564 Narratives · 756 Questions
      Murder 250 · Object 64 / 256
      Team Allocation 250 · English
    type: database
    size: xl
    position:
      x: 1220
      'y': 500
  - id: quality
    label: |-
      Validate Dataset Quality
      Test Rule-based Heuristics
      Human Subset Checks Solvability
      Confirm Coherence and High Accuracy
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: evaluate
    label: |-
      Evaluate Language Models
      Regular · CoT · CoT+
      One-shot and Few-shot CoT+
      Domain-specific Neurosymbolic Methods
    type: process
    size: xl
    position:
      x: 740
      'y': 500
  - id: report
    label: |-
      Report Reasoning Accuracy
      Score Each of the Three Domains
      Compare Prompting and Methods
      Characterize the Human-model Gap
    type: terminal
    size: xl
    position:
      x: 500
      'y': 500
edges:
  - from: goal
    to: templates
    type: primary
  - from: templates
    to: facts
    type: primary
  - from: facts
    to: trees
    type: primary
  - from: trees
    to: tree_validation
    type: primary
  - from: tree_validation
    to: leaves
    type: primary
  - from: leaves
    to: chapters
    type: primary
  - from: chapters
    to: story_validation
    type: primary
  - from: story_validation
    to: release
    type: primary
  - from: release
    to: quality
    type: primary
  - from: quality
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
