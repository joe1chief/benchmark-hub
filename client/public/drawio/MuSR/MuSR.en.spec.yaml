meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuSR Build and Evaluation Process
  description: >-
    Paper-v2-aligned template construction, GPT-4 reasoning-tree completion, domain-specific story realization,
    solvability validation, release, and accuracy evaluation, with fixed-code drift and public-release boundaries.
  legend: >-
    Primary evidence is frozen to arXiv:2310.16049v2 and official repository commit b1f4d416. Solid lines are paper
    paths; dashed lines are retries or audit boundaries. Team Allocation uses neither chaptering nor validators.
nodes:
  - id: evidence
    label: |-
      Freeze Evidence + Task
      Paper · arXiv 2310.16049v2 · Sections 3–5
      Appendix G.1/H.1/I · Repo b1f4d416
      Input x + qi + Choices
      Predict ai through Multistep Reasoning
      F and T Hidden at Test
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 640
  - id: domain_gate
    label: |-
      Select a Domain Template
      Build Gold Facts F
      Template Questions and Answers
      Add Diversity Facts G
    type: decision
    size: xl
    position:
      x: 500
      'y': 640
  - id: murder_template
    label: |-
      Murder Mystery Template
      Two Suspects
      Murderer · Means + Motive + Opportunity
      Innocent · Two Guilt Facts
      Plus One Irrelevant Suspicious Fact
      Paper Maximum Tree Depth · 4
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 760
      'y': 80
  - id: object_template
    label: |-
      Object Placements Template
      Three People · Three Moves · Two Items
      One Item Moves Twice
      Non-mover Observes with p = 0.33
      Answer · Last Observed Location
      Paper Maximum Tree Depth · 3
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 760
      'y': 520
  - id: team_template
    label: |-
      Team Allocation Template
      Three People · Two Tasks
      Skill and Pair Scores · 0 / 1 / 2
      Optimize Skill + Teamwork
      Best Beats Runner-up by at Least 2
      Paper Maximum Tree Depth · 2
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 760
      'y': 960
  - id: seed_facts
    label: |-
      Instantiate Structured Inputs
      F Determines Every Gold Answer
      G Comes from Curated Lists or LLMs
      G Must Appear in the Narrative
      Output of Stage 1 · Tuple (F, G)
    type: process
    size: xl
    position:
      x: 1040
      'y': 520
  - id: tree_expand
    label: |-
      Complete Reasoning Trees T
      GPT-4 Recursively Expands Each fi
      Children Jointly Entail Their Parent
      Condition on Scenario and G
      Repeat toward Domain Target Depth
    type: process
    size: xl
    position:
      x: 1280
      'y': 520
  - id: validator_gate
    label: |-
      Does This Domain Use
      Tree Validators?
      Murder + Object · Yes
      Team Allocation · No
    type: decision
    size: xl
    position:
      x: 1520
      'y': 520
  - id: validate
    label: |-
      Validate Each Deduction
      Enforce Expected Structure
      Block Keywords and Shortcuts
      Reject Vacuous Transitions
      Domain-specific Validator Set V
    type: process
    size: xl
    position:
      x: 1780
      'y': 120
  - id: validity_gate
    label: |-
      Valid Deduction Sample?
      Track Attempts for This Deduction
    type: decision
    size: xl
    position:
      x: 2020
      'y': 120
  - id: retry
    label: |-
      Retry the Same Deduction
      Append Validator Feedback
      Resample with the LLM
      Up to Three Prompt Retries
    type: process
    size: xl
    position:
      x: 2260
      'y': 20
  - id: prune
    label: |-
      Prune after No Valid Sample
      Stop Expanding This Branch
      Current Deduction Becomes a Leaf
      Continue the Remaining Tree
    type: process
    size: xl
    position:
      x: 2260
      'y': 320
  - id: leaf_split
    label: |-
      Partition Reasoning-tree Leaves
      Scenario Facts S(T) Enter the Story
      Commonsense Facts C(T) Stay Implicit
      Leaves Deductively Support F
    type: database
    size: xl
    position:
      x: 2260
      'y': 640
  - id: story_gate
    label: |-
      Realize S(T) as a Narrative x
      Which Domain-specific Route?
    type: decision
    size: xl
    position:
      x: 2500
      'y': 640
  - id: murder_story
    label: |-
      Write Murder Chapters
      Split Facts by Suspect / Answer Choice
      GPT-4 Writes and Validates Chapters
      Concatenate Shuffled Suspect Chapters
      Add an Introductory Scene
    type: process
    size: xl
    position:
      x: 2780
      'y': 120
  - id: object_story
    label: |-
      Write Object-placement Chapters
      Opening + Move + Observation Sections
      Carry the Story So Far Forward
      Check Facts and Rewrite as Needed
      Concatenate the Chapters
    type: process
    size: xl
    position:
      x: 2780
      'y': 640
  - id: team_story
    label: |-
      Write Team Story in One Pass
      Include Skill and Relationship Facts
      No Chaptering · No Tree Validators
      Rewrite the Introduction Only
      Do Not Reveal the Best Assignment
    type: process
    size: xl
    position:
      x: 2780
      'y': 1120
  - id: release
    label: |-
      Assemble the Official Release
      564 Narratives · 756 Questions
      Murder · 250 Narratives / Questions
      Object · 64 Narratives / 256 Questions
      Team · 250 Narratives / Questions
    type: database
    size: xl
    position:
      x: 3060
      'y': 640
  - id: quality
    label: |-
      Validate End-to-end Solvability
      Rule Baselines · 50.0 / 35.9 / None
      Seven Annotators · Triple Annotation
      34 Murder · 40 Object · 34 Team
      Majority · 94.1 / 95.0 / 100.0
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 3300
      'y': 640
  - id: scope_boundary
    label: |-
      Validation + Release Boundary
      Human Check · Answer Derivability Only
      No Formal Fluency / Coherence / Commonsense Test
      Repo MIT · JSON Has No License Field
      No Tags / Checksums / Formal Leaderboard
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 3300
      'y': 1040
  - id: eval_gate
    label: |-
      Choose Paper Evaluation Route
      Regular · CoT · CoT+
      1-shot / 3-example Few-shot CoT+
      Main · Zero-shot CoT+
      Prompting vs Domain-specific?
    type: decision
    size: xl
    style:
      fontSize: 8
    position:
      x: 3780
      'y': 640
  - id: prompting
    label: |-
      Run Prompting Baselines
      Regular · Direct Answer
      CoT · Step-by-step
      CoT+ · Domain Reasoning Hint
      One / Three Solved Examples
    type: process
    size: xl
    position:
      x: 4020
      'y': 360
  - id: neurosymbolic
    label: |-
      Run Domain-specific Methods
      Murder · Decomposed Prompting
      Object · SymbolicTOM
      Team · PAL
      No Single Shared Method
    type: process
    size: xl
    position:
      x: 4020
      'y': 900
  - id: inference
    label: |-
      Generate an Answer per Question
      Paper Models Use Their Defaults
      Released GPT-4 Config · T = 1
      top-p = 1 · max tokens = 2400
      Optional Self-consistency Voting
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 4260
      'y': 640
  - id: parse
    label: |-
      Parse the Released Output
      Take Last Nonempty answer: Line
      Lowercase the Text
      Gold Digit Anywhere Wins
      Else Take First Choice Digit Present
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 4500
      'y': 640
  - id: parse_gate
    label: |-
      Does Parsed Text Contain
      Any Valid Choice Digit?
    type: decision
    size: xl
    position:
      x: 4740
      'y': 640
  - id: random_fallback
    label: |-
      Apply Released Parser Fallback
      Randomly Sample One Choice
      Seeded Globally with 0
      Count It like a Parsed Answer
    type: process
    size: xl
    position:
      x: 4980
      'y': 980
  - id: accuracy
    label: |-
      Compute Accuracy
      Majority Choice if Repeated Samples
      Correct Questions / Total Questions
      Report Each Domain Separately
    type: process
    size: xl
    position:
      x: 4980
      'y': 640
  - id: code_drift
    label: |-
      Fixed-code Reproduction Boundary
      Eval Expects murder_mysteries.json
      Release Has murder_mystery.json
      Murder Script Depth 3 vs Paper 4
      Unchanged Script Cannot Run All Domains
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 4500
      'y': 1040
  - id: report
    label: |-
      Report MuSR Results
      Accuracy by Three Domains
      Prompt and Method Comparisons
      Human-majority Ceiling
      Cite Exact Paper and Code Revision
    type: terminal
    size: xl
    position:
      x: 5220
      'y': 640
