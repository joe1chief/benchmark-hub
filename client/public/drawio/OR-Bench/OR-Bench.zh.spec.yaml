meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OR-Bench 构建与评测流程
  description: 对齐论文的构建管线：将有害种子改写成无害的边界提示，经多模型集成审核与回答恢复后，发布互补的有用性和安全性评测集。
  legend: OR-Bench 同时衡量安全对齐的两面：无害的过度拒答提示应有较低拒答率，而有毒对照集应有较高拒答率。
nodes:
  - id: categories
    label: |-
      定义 10 类常见拒答主题
      暴力 · 隐私 · 仇恨
      性内容 · 违法 · 自残
      欺骗及其他伤害
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: seeds
    label: |-
      生成有害种子
      使用 Mixtral 8×7B
      每类 2,000 条种子
      每批生成 20 条
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: dedupe
    label: |-
      去除重复种子
      合并各生成批次
      保留类别覆盖
      留存有毒对照来源
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: rewrite
    label: |-
      每个种子改写五次
      Mixtral 8×7B 配五个示例
      避免“安全”或“合法”提示词
      避免虚构式表达
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: moderate
    label: |-
      审核每条改写提示
      GPT-4 Turbo · Llama 3 70B
      Gemini 1.5 Pro
      先解释再分类
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: vote
    label: |-
      采用集成多数票
      纳入多数判安全的提示
      降低单一模型族偏差
      暂存被判有害的提示
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: recover
    label: |-
      恢复过敏误判
      Mistral 7B 回答被拦提示
      集成审核器复审回答
      回答安全则恢复原提示
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: partition
    label: |-
      按最终安全标签分流
      安全或恢复 → 无害池
      其余有害项 → 有毒池
      保留类别元数据
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release_main
    label: |-
      发布互补数据集
      OR-Bench-80K：安全提示
      OR-Bench-Toxic：约 600 条
      同测有用性与安全性
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: screen
    label: |-
      筛选无害提示难度
      查询各族最大或最新模型
      按模型族汇总结果
      记录安全提示拒答情况
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: hard
    label: |-
      选出 OR-Bench-Hard-1K
      安全但频繁被拒答
      每个模型族的头部模型中
      至少三个拒答
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: query
    label: |-
      评测 32 个大模型
      覆盖八个模型族
      公共 API · 温度 0.0
      不使用系统提示
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: judge
    label: |-
      识别模型是否拒答
      80K 全集用关键词匹配
      Hard 与 Toxic 用 GPT-4
      同查安全和有用性
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告拒答率
      安全提示越低越好
      有毒提示越高越好
      按 10 个类别细分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: categories
    to: seeds
    type: primary
  - from: seeds
    to: dedupe
    type: primary
  - from: dedupe
    to: rewrite
    type: primary
  - from: rewrite
    to: moderate
    type: primary
  - from: moderate
    to: vote
    type: primary
  - from: vote
    to: recover
    type: primary
  - from: recover
    to: partition
    type: primary
  - from: partition
    to: release_main
    type: primary
  - from: release_main
    to: screen
    type: primary
  - from: screen
    to: hard
    type: primary
  - from: hard
    to: query
    type: primary
  - from: query
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
