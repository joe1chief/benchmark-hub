meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Humanity's Last Code Exam 构建与评测流程
  description: 按论文分别呈现 ICPC 与 IOI 子集的构建过程，再进入各自的官方测试评测路径，并单列自我识别任务。
  legend: 实线表示论文主流程，虚线表示证据或独立分析路径；ICPC 超时节点保留论文与当前仓库命令的差异，不做静默合并。
nodes:
  - id: icpc_source
    label: |-
      ICPC 官方输入
      官方 PDF + 官方测试
      世界总决赛 2011-2023
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: icpc_extract
    label: |-
      ICPC 题面提取
      人工复制官方 PDF
      ChatGPT 仅做格式统一
    type: document
    size: xl
    position:
      x: 360
      'y': 80
  - id: icpc_gate
    label: |-
      ICPC 筛选后 146 题（2011-2023）
      移除缺失或损坏测试
      排除不兼容交互题
    type: process
    size: xl
    position:
      x: 680
      'y': 80
  - id: ioi_source
    label: |-
      IOI 官方输入
      Codeforces IOI 数据 + 官方测试
      奥赛题目 2010-2024
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: ioi_extract
    label: |-
      IOI 题面提取
      抓取 Codeforces IOI 数据
      ChatGPT 清理与重排
    type: document
    size: xl
    position:
      x: 360
      'y': 300
  - id: ioi_gate
    label: |-
      IOI 筛选后 89 题（2010-2024）
      保留完整官方测试集
      排除仅输出题
    type: process
    size: xl
    position:
      x: 680
      'y': 300
  - id: release
    label: |-
      HLCE 代码题套件
      共 235 题
      146 道 ICPC + 89 道 IOI
    type: database
    size: xl
    position:
      x: 1000
      'y': 190
  - id: generate
    label: |-
      生成代码候选
      每题 5 个回答
      OpenRouter 默认超参数
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: eval_route
    label: |-
      按竞赛类型分流
      ICPC：离线标准 I/O
      IOI：官方在线判题
    type: decision
    size: xl
    position:
      x: 680
      'y': 520
  - id: protocol_boundary
    label: |-
      论文 / 仓库协议边界
      论文附录：30 秒超时
      仓库 README 命令：60 秒
    type: document
    size: xl
    position:
      x: 680
      'y': 740
  - id: icpc_judge
    label: |-
      ICPC Python 判题框架
      标准输入 / 输出
      通过全部官方测试
    type: process
    size: xl
    position:
      x: 360
      'y': 440
  - id: ioi_judge
    label: |-
      IOI Codeforces 提交机器人
      官方判题得分必须为 100
      任何部分分都视为失败
    type: process
    size: xl
    position:
      x: 360
      'y': 640
  - id: passk
    label: |-
      代码生成指标
      Pass@1 与 Pass@5
      1 - C(n-c,k) / C(n,k)
    type: process
    size: xl
    position:
      x: 40
      'y': 540
  - id: self_recognition
    label: |-
      独立自我识别任务
      判断自身代码是否正确
      指标：AUC
    type: process
    size: xl
    position:
      x: 1000
      'y': 940
  - id: report
    label: |-
      HLCE 结果
      代码正确性使用 Pass@k
      自我识别使用 AUC
    type: terminal
    size: xl
    position:
      x: 40
      'y': 940
edges:
  - from: icpc_source
    to: icpc_extract
    type: primary
  - from: icpc_extract
    to: icpc_gate
    type: primary
  - from: icpc_gate
    to: release
    type: primary
  - from: ioi_source
    to: ioi_extract
    type: primary
  - from: ioi_extract
    to: ioi_gate
    type: primary
  - from: ioi_gate
    to: release
    type: primary
  - from: release
    to: generate
    type: primary
  - from: generate
    to: eval_route
    type: primary
  - from: eval_route
    to: icpc_judge
    type: primary
  - from: eval_route
    to: ioi_judge
    type: primary
  - from: protocol_boundary
    to: icpc_judge
    type: data
    waypoints:
      - x: 920
        'y': 790
      - x: 920
        'y': 580
      - x: 460
        'y': 580
  - from: icpc_judge
    to: passk
    type: primary
  - from: ioi_judge
    to: passk
    type: primary
  - from: generate
    to: self_recognition
    type: data
  - from: passk
    to: report
    type: primary
  - from: self_recognition
    to: report
    type: secondary
modules: []
