meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Humanity's Last Code Exam Build and Evaluation Process
  description: >-
    Paper-aligned construction of HLCE from ICPC World Finals and IOI problems, followed by its harmonized standard-I/O
    and interactive evaluation plus the separate self-recognition task.
  legend: >-
    Read the benchmark-construction row left-to-right, then the evaluation row right-to-left; counts and year ranges
    preserve the paper's distinct ICPC and IOI subsets.
nodes:
  - id: sources
    label: |-
      Elite Contest Sources
      ICPC World Finals + IOI
      Overall Coverage: 2010-2024
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: icpc_extract
    label: |-
      ICPC Statement Extraction
      Manually Copy Official PDFs
      ChatGPT Formatting Standardization
    type: document
    size: xl
    position:
      x: 320
      'y': 100
  - id: icpc_gate
    label: |-
      ICPC Official-Test Gate
      Remove Missing / Corrupted Tests
      Exclude Incompatible Interactive Tasks
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: ioi_extract
    label: |-
      IOI Statement Extraction
      Scrape Codeforces IOI Dump
      ChatGPT Cleaning and Reformatting
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: ioi_gate
    label: |-
      IOI Official-Test Gate
      Collect Complete Test Cases
      Exclude Output-Only Problems
    type: decision
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      HLCE Release: 235 Problems
      146 ICPC (2011-2023)
      89 IOI (2010-2024)
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Model Evaluation Input
      Problem Statement + Constraints
      C++ / Python Competition Setting
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: generate
    label: |-
      Code Generation Task
      Generate 5 Responses per Problem
      Default OpenRouter Hyperparameters
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: judge
    label: |-
      Harmonized Online-Offline Judge
      ICPC: Python Standard-I/O Harness
      IOI: Codeforces Submission Bot
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness
    label: |-
      Functional Correctness
      ICPC: All Official Tests Pass
      IOI: Score 100; Partial Scores Fail
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: self_recognition
    label: |-
      Separate Self-Recognition Task
      Judge Whether Own Code Is Correct
      Python Evaluation Framework
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      HLCE Results
      Code: Pass@1 and Pass@5
      Self-Recognition: AUC
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: icpc_extract
    type: primary
  - from: icpc_extract
    to: icpc_gate
    type: primary
  - from: icpc_gate
    to: ioi_extract
    type: primary
  - from: ioi_extract
    to: ioi_gate
    type: primary
  - from: ioi_gate
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: generate
    type: primary
  - from: generate
    to: judge
    type: primary
  - from: judge
    to: correctness
    type: primary
  - from: correctness
    to: self_recognition
    type: primary
  - from: self_recognition
    to: report
    type: primary
modules: []
