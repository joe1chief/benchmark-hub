meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Humanity's Last Code Exam Build and Evaluation Process
  description: >-
    Paper-aligned parallel construction of the ICPC and IOI subsets, followed by their distinct official-test evaluation
    paths and the separate self-recognition task.
  legend: >-
    Solid arrows are the paper protocol; dotted arrows expose evidence or a separate analysis path. The ICPC timeout
    node preserves the paper-versus-current-repository command difference instead of silently reconciling it.
nodes:
  - id: icpc_source
    label: |-
      ICPC Official Inputs
      Official PDFs + Official Tests
      World Finals 2011-2023
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: icpc_extract
    label: |-
      ICPC Statement Extraction
      Manually Copy Official PDFs
      ChatGPT Formatting Only
    type: document
    size: xl
    position:
      x: 360
      'y': 80
  - id: icpc_gate
    label: |-
      ICPC Gate: 146 (2011-2023)
      Remove Missing / Corrupted Tests
      Exclude Incompatible Interactive Tasks
    type: process
    size: xl
    position:
      x: 680
      'y': 80
  - id: ioi_source
    label: |-
      IOI Official Inputs
      Codeforces IOI Dump + Official Tests
      Olympiad Tasks 2010-2024
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: ioi_extract
    label: |-
      IOI Statement Extraction
      Web-Scrape the Codeforces Dump
      ChatGPT Cleanup and Reformatting
    type: document
    size: xl
    position:
      x: 360
      'y': 300
  - id: ioi_gate
    label: |-
      IOI Gate: 89 (2010-2024)
      Keep Complete Official Test Sets
      Exclude Output-Only Problems
    type: process
    size: xl
    position:
      x: 680
      'y': 300
  - id: release
    label: |-
      HLCE Code Suite
      235 Problems Total
      146 ICPC + 89 IOI
    type: database
    size: xl
    position:
      x: 1000
      'y': 190
  - id: generate
    label: |-
      Generate Code Candidates
      5 Responses per Problem
      OpenRouter Default Hyperparameters
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: eval_route
    label: |-
      Route by Contest Family
      ICPC: Offline Standard I/O
      IOI: Official Online Judge
    type: decision
    size: xl
    position:
      x: 680
      'y': 520
  - id: protocol_boundary
    label: |-
      Paper / Repository Boundary
      Paper Appendix: 30 s Timeout
      Repo README Command: 60 s
    type: document
    size: xl
    position:
      x: 680
      'y': 740
  - id: icpc_judge
    label: |-
      ICPC Python Harness
      Standard Input / Output
      Pass All Official Tests
    type: process
    size: xl
    position:
      x: 360
      'y': 440
  - id: ioi_judge
    label: |-
      IOI Codeforces Submission Bot
      Official Judge Score Must Equal 100
      Any Partial Score Is a Failure
    type: process
    size: xl
    position:
      x: 360
      'y': 640
  - id: passk
    label: |-
      Code-Generation Metrics
      Pass@1 and Pass@5
      1 - C(n-c,k) / C(n,k)
    type: process
    size: xl
    position:
      x: 40
      'y': 540
  - id: self_recognition
    label: |-
      Separate Self-Recognition Task
      Judge Whether Own Code Is Correct
      Metric: AUC
    type: process
    size: xl
    position:
      x: 1000
      'y': 940
  - id: report
    label: |-
      HLCE Results
      Code Correctness via Pass@k
      Self-Recognition via AUC
    type: terminal
    size: xl
    position:
      x: 40
      'y': 940
edges:
  - from: icpc_source
    to: icpc_extract
    type: primary
  - from: icpc_extract
    to: icpc_gate
    type: primary
  - from: icpc_gate
    to: release
    type: primary
  - from: ioi_source
    to: ioi_extract
    type: primary
  - from: ioi_extract
    to: ioi_gate
    type: primary
  - from: ioi_gate
    to: release
    type: primary
  - from: release
    to: generate
    type: primary
  - from: generate
    to: eval_route
    type: primary
  - from: eval_route
    to: icpc_judge
    type: primary
  - from: eval_route
    to: ioi_judge
    type: primary
  - from: protocol_boundary
    to: icpc_judge
    type: data
    waypoints:
      - x: 920
        'y': 790
      - x: 920
        'y': 580
      - x: 460
        'y': 580
  - from: icpc_judge
    to: passk
    type: primary
  - from: ioi_judge
    to: passk
    type: primary
  - from: generate
    to: self_recognition
    type: data
  - from: passk
    to: report
    type: primary
  - from: self_recognition
    to: report
    type: secondary
modules: []
