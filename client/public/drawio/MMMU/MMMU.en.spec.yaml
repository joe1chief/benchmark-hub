meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMMU Build Process
  description: >-
    Paper-aligned MMMU workflow: consult university majors to select six disciplines, 30 subjects, and 183 subfields
    where visual inputs matter; recruit over 50 specialist university students; collect or author about 13K licensed
    multimodal questions from textbooks, lecture materials, and online sources while avoiding immediately available
    answers; deduplicate by lexical overlap and source-URL similarity with author adjudication; correct format and
    typos; assign four difficulty levels and remove roughly 10% very-easy items; retain 11,550 questions with 30 image
    types; split 150/900/10,500; and report zero-shot rule-parsed micro accuracy.
  legend: Solid arrows show curation; the lower branch removes items outside the expert-level difficulty goal.
