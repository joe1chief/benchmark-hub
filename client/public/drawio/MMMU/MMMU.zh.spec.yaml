meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMMU 证据对齐构建与评测流程
  description: >-
    依据 arXiv:2311.16502v4、论文时期官方代码与 Hugging Face 快照，重建许可合规的约 1.3 万题收集、清洗、 11,550 题发布 schema
    与划分、模型特定零样本提示、两类官方解析器、无效答案处理及真实微平均准确率分母。
  legend: 实线表示构建和成功评测路径；带标签分支保留真实的排除、题型和解析失败结果；证据卡区分论文时期快照与后续可变发布。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      论文 · 2311.16502v4
      代码 · f3e473e1
      数据 · ff942ca8
      Apache-2.0
    type: document
    size: xl
    position:
      x: 160
      'y': 40
  - id: scope
    label: |-
      确定专家级范围
      六大学科门类
      30 个科目
      183 个以上子领域
      视觉输入必须有价值
    type: process
    size: xl
    position:
      x: 392
      'y': 40
  - id: recruit
    label: |-
      招募 50 多名学生
      专业与科目匹配
      包含共同作者
      人工收集
      英文 · 大学难度
    type: user
    size: xl
    position:
      x: 624
      'y': 40
  - id: collect
    label: |-
      收集或自拟题目
      免费网页 · 测验
      教材 · 讲义
      保持来源多样
      避开易检索答案
    type: process
    size: xl
    position:
      x: 856
      'y': 40
  - id: raw
    label: |-
      形成原始题池
      约 1.3 万道题
      每题一张或多张图
      选择题或短开放题
      遵守来源权利
    type: database
    size: xl
    position:
      x: 1088
      'y': 40
  - id: dedup
    label: |-
      识别重复候选
      词汇重合
      来源 URL 相似度
      作者裁决
      删除确认重复题
    type: process
    size: xl
    position:
      x: 1088
      'y': 360
  - id: format
    label: |-
      共同作者质量检查
      统一格式
      修正错字
      复核歧义
      随机抽样审计
    type: process
    size: xl
    position:
      x: 856
      'y': 360
  - id: difficulty
    label: |-
      是否过易？
      标注四档难度
      非常容易 · 容易
      中等 · 困难
      检查设计标准
    type: decision
    size: xl
    position:
      x: 624
      'y': 360
  - id: drop_easy
    label: |-
      排除非常容易题
      约占原始题池 10%
      低于预期难度
      不进入基准
    type: terminal
    size: xl
    position:
      x: 624
      'y': 520
  - id: final_set
    label: |-
      最终 MMMU
      11,550 道题
      10,861 选择 · 689 开放
      30 类图像
      覆盖 6 / 30 / 183
    type: database
    size: xl
    position:
      x: 392
      'y': 360
  - id: schema
    label: |-
      Schema 字段分组摘要
      精确字段名见审核备注
      id · question · options
      answer · explanation
      图像 · 类型 · 难度 · 子领域
    type: document
    size: xl
    position:
      x: 160
      'y': 360
  - id: split
    label: |-
      按科目划分
      开发集 · 每科 5 题共 150
      验证集 · 900
      测试集 · 10,500
      开发集支持少样本
    type: process
    size: xl
    position:
      x: 160
      'y': 680
  - id: prompt
    label: |-
      执行零样本评测
      优先模型默认提示
      否则在验证集调提示
      LLaVA 示例 · 温度为零
      解析随机种子 42
    type: process
    size: xl
    position:
      x: 392
      'y': 680
  - id: qtype
    label: |-
      题目类型？
      选择题
      或开放题
    type: decision
    size: xl
    position:
      x: 624
      'y': 920
  - id: parse_mc
    label: |-
      解析选择题回答
      优先 (A) 再找独立 A
      超过 5 词再匹配选项文本
      多候选取最后出现者
      与标准字母精确匹配
    type: process
    size: xl
    position:
      x: 856
      'y': 760
  - id: mc_valid
    label: |-
      找到选择题候选？
      解析搜索已穷尽
    type: decision
    size: xl
    position:
      x: 1088
      'y': 760
  - id: mc_random
    label: |-
      随机选项补救
      random.choice 选项
      全局种子 42
      仍计入分母
    type: process
    size: xl
    position:
      x: 1320
      'y': 920
  - id: mc_score
    label: |-
      选择题计分
      解析或随机字母
      与标准答案精确相等
      正确为 1 · 否则 0
    type: process
    size: xl
    position:
      x: 1552
      'y': 760
  - id: parse_open
    label: |-
      解析开放题回答
      提取结论短语和数值
      字符串转小写
      数值保留两位小数
      候选去重
    type: process
    size: xl
    position:
      x: 856
      'y': 1080
  - id: open_valid
    label: |-
      找到标准答案匹配？
      字符串包含
      或数值相等
    type: decision
    size: xl
    position:
      x: 1088
      'y': 1080
  - id: open_wrong
    label: |-
      开放题记错
      不做随机补救
      得分为 0
      仍计入分母
    type: process
    size: xl
    position:
      x: 1320
      'y': 1240
  - id: open_score
    label: |-
      开放题计分
      任一标准化答案匹配
      正确为 1
      否则 0
    type: process
    size: xl
    position:
      x: 1552
      'y': 1080
  - id: aggregate
    label: |-
      报告微平均准确率
      正确数 / 已评测行数
      跨科目按题量加权
      缺失预测不会被官方脚本
      补入分母
    type: terminal
    size: xl
    position:
      x: 1784
      'y': 920
