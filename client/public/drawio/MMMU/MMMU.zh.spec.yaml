meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMMU 构建流程
  description: >-
    依据论文重绘的 MMMU 流程：调研常见大学专业，选出视觉输入有价值的六大学科、30 个科目和 183 个子领域； 招募 50 多名对应专业大学生，从教材、讲义与在线资源收集或自拟约 1.3 万道许可合规的多模态题，并尽量避开
    答案可立即检索的题；通过词汇重合和来源 URL 相似度找重复题，由作者裁决，再检查格式和错字；标注四档难度， 移除约 10% 过易题；最终保留含 30 类图像的 11,550 题，按 150/900/10,500
    划分，以零样本规则解析计算微平均准确率。
  legend: 实线表示数据筛选主流程；下方分支移除不符合专家级难度目标的题目。
