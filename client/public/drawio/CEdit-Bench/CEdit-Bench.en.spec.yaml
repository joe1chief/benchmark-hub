    Technical-report- and dataset-card-aligned construction of 1,464 bilingual Chinese-English image-editing pairs in 15
    fine-grained categories, integrating and extending prior benchmarks with newly curated data and GPT-4o-based
    semantic-consistency, perceptual-quality, and overall evaluation.
  legend: >-
    Solid arrows show benchmark construction and image-editing evaluation; dashed arrows carry complementary source
    data.
