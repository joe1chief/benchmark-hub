meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CEdit-Bench 构建流程
  description: 按技术报告与官方数据卡构建 1,464 对中英双语图像编辑样本：整合并扩展既有基准、补充新数据，覆盖 15 个细粒度类别， 再由 GPT-4o 评估语义一致性、感知质量与总体表现。
  legend: 实线表示基准构建与图像编辑评测，虚线表示互补来源数据汇入流程。
nodes:
  - id: prior_benchmarks
    label: |-
      审查既有图像编辑基准
      GEdit • ImgEdit • Kontext • Reason-Edit
      识别结构、视角与参考生成等缺口
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: new_data
    label: |-
      补充策划新的编辑数据
      提高任务与指令多样性
      覆盖既有套件遗漏的能力
    type: database
    size: xl
    position:
      x: 40
      'y': 340
  - id: integrate
    label: |-
      整合并扩展数据来源
      统一图像编辑样本
      保留细粒度任务意图
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: bilingual
    label: |-
      构建双语编辑样本对
      输入图像 • 英文指令
      语义对应的中文指令
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: content_categories
    label: |-
      内容级编辑
      主体替换 13% • 添加 11% • 移除 9%
      PS Human / 人像编辑 5% • 动作变化 6%
    type: document
    size: xl
    position:
      x: 940
      'y': 0
  - id: appearance_categories
    label: |-
      外观与上下文编辑
      文字 9% • 背景 5% • 风格 3% • 材质 6%
      色调 7% • 颜色 4%
    type: document
    size: xl
    position:
      x: 940
      'y': 180
  - id: advanced_categories
    label: |-
      高阶结构编辑
      参考生成 10% • 视角变化 7%
      结构编辑 4% • 目标检测 1%
    type: document
    size: xl
    position:
      x: 940
      'y': 360
  - id: package
    label: |-
      封装数据字段
      key • input_image • instruction_en
      instruction_cn • task_type
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: release
    label: |-
      发布 CEdit-Bench
      1,464 对中英双语编辑样本
      15 个细粒度类别 • MIT 许可证
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: edit_model
    label: |-
      运行图像编辑模型
      输入图像与一种语言的编辑指令
      生成编辑后图像
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: judge
    label: |-
      使用 GPT-4o 评测
      对照输入图像、指令与编辑结果
      判断指令完成度与视觉质量
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: semantic
    label: |-
      语义一致性
      G_SC
      保留未编辑内容并满足编辑意图
    type: process
    size: xl
    position:
      x: 2440
      'y': 40
  - id: perceptual
    label: |-
      感知质量
      G_PQ
      评价真实感与视觉连贯性
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: overall
    label: |-
      总体得分
      G_O
      综合编辑成功与图像质量
    type: process
    size: xl
    position:
      x: 2440
      'y': 400
  - id: report
    label: |-
      报告各类别与总体结果
      在 15 类编辑任务上比较模型
      分析双语指令遵循质量
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
edges:
  - from: prior_benchmarks
    to: integrate
    type: primary
  - from: new_data
    to: integrate
    type: data
  - from: integrate
    to: bilingual
    type: primary
  - from: bilingual
    to: content_categories
    type: primary
  - from: bilingual
    to: appearance_categories
    type: primary
  - from: bilingual
    to: advanced_categories
    type: primary
  - from: content_categories
    to: package
    type: primary
  - from: appearance_categories
    to: package
    type: primary
  - from: advanced_categories
    to: package
    type: primary
  - from: package
    to: release
    type: primary
  - from: release
    to: edit_model
    type: primary
  - from: edit_model
    to: judge
    type: primary
  - from: judge
    to: semantic
    type: primary
  - from: judge
    to: perceptual
    type: primary
  - from: judge
    to: overall
    type: primary
  - from: semantic
    to: report
    type: primary
  - from: perceptual
    to: report
    type: primary
  - from: overall
    to: report
    type: primary
modules: []
