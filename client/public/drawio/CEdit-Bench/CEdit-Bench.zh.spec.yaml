meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: vertical
  routing: orthogonal
  title: CEdit-Bench 构建流程
  description: 按技术报告与官方数据卡构建 1,464 对中英双语图像编辑样本：整合并扩展既有基准、补充新数据，覆盖 15 个细粒度类别。技术报告只公开 GPT-4o 与三项指标视图，未发布裁判提示词、详细评分细则或分数公式。
  legend: 实线表示基准构建与图像编辑评测，虚线表示互补来源数据汇入流程。
nodes:
  - id: prior_benchmarks
    label: |-
      审查既有图像编辑基准
      GEdit • ImgEdit • Kontext • Reason-Edit
      识别结构、视角与参考生成等缺口
    type: database
    size: xl
    position:
      x: 550
      'y': 130
  - id: new_data
    label: |-
      补充策划新的编辑数据
      提高任务与指令多样性
      覆盖既有套件遗漏的能力
    type: database
    size: xl
    position:
      x: 1150
      'y': 130
  - id: integrate
    label: |-
      整合并扩展数据来源
      统一图像编辑样本
      保留细粒度任务意图
    type: process
    size: xl
    position:
      x: 850
      'y': 355
  - id: bilingual
    label: |-
      构建双语编辑样本对
      输入图像 • 英文指令
      语义对应的中文指令
    type: process
    size: xl
    position:
      x: 850
      'y': 580
  - id: content_categories
    label: |-
      内容级编辑
      主体替换 13% • 添加 11% • 移除 9%
      人像编辑 5% • 动作变化 6%
    type: document
    size: xl
    position:
      x: 300
      'y': 805
  - id: appearance_categories
    label: |-
      外观与上下文编辑
      文字 9% • 背景 5% • 风格 3% • 材质 6%
      色调 7% • 颜色 4%
    type: document
    size: xl
    position:
      x: 750
      'y': 805
  - id: advanced_categories
    label: |-
      高阶结构编辑
      参考生成 10% • 视角变化 7%
      结构编辑 4% • 目标检测 1%
    type: document
    size: xl
    position:
      x: 1200
      'y': 805
  - id: package
    label: |-
      封装数据字段
      key • input_image • instruction_en
      instruction_cn • task_type
    type: process
    size: xl
    position:
      x: 850
      'y': 1030
  - id: release
    label: |-
      发布 CEdit-Bench
      1,464 对中英双语编辑样本
      15 个细粒度类别 • MIT 许可证
    type: database
    size: xl
    position:
      x: 850
      'y': 1255
  - id: edit_model
    label: |-
      运行图像编辑模型
      输入图像与一种语言的编辑指令
      生成编辑后图像
    type: process
    size: xl
    position:
      x: 850
      'y': 1480
  - id: judge
    label: |-
      使用 GPT-4o 自动评测
      技术报告未发布裁判提示词
      详细评分细则与分数公式未披露
    type: process
    size: xl
    position:
      x: 850
      'y': 1705
  - id: semantic
    label: |-
      已报告的指标视图
      语义一致性 • G_SC
      具体操作定义未披露
    type: process
    size: xl
    position:
      x: 400
      'y': 1930
  - id: perceptual
    label: |-
      已报告的指标视图
      感知质量 • G_PQ
      具体操作定义未披露
    type: process
    size: xl
    position:
      x: 850
      'y': 1930
  - id: overall
    label: |-
      已报告的指标视图
      总体得分 • G_O
      聚合公式未披露
    type: process
    size: xl
    position:
      x: 1300
      'y': 1930
  - id: report
    label: |-
      按基准语言报告模型结果
      展示 G_SC • G_PQ • G_O
      不推断未发布的裁判公式
    type: terminal
    size: xl
    position:
      x: 850
      'y': 2155
