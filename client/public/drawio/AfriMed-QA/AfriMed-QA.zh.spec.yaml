      - x: 1920
        'y': 100
      - x: 1960
        'y': 100
      - x: 1960
        'y': 260
  - from: trainee
    to: item_qa
    type: primary
  - from: consumer
    to: item_qa
    type: primary
    waypoints:
      - x: 1920
        'y': 620
      - x: 1960
        'y': 620
      - x: 1960
        'y': 420
  - from: item_qa
    to: dataset
    type: primary
  - from: dataset
    to: models
    type: primary
  - from: models
    to: responses
    type: primary
  - from: responses
    to: quantitative
    type: primary
  - from: dataset
    to: random_questions
