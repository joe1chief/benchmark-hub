    waypoints:
      - x: 2200
        'y': 420
      - x: 2200
        'y': 900
      - x: 2080
        'y': 900
  - from: random_questions
    to: human_responses
    type: primary
  - from: human_responses
    to: human
    type: primary
  - from: quantitative
    to: axes
    type: primary
  - from: human
    to: axes
    type: primary
  - from: axes
    to: report
    type: primary
modules: []
