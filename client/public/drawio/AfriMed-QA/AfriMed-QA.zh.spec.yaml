meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AfriMed-QA 构建流程
  description: 对齐 arXiv:2411.15640v4 第 3.1-4.3 节、表 2 与附录 A 的贡献者准入、三类问题收集、逐题审核及评测流程。
  legend: 所有问题贡献都在贡献者资质审核之后；人工评测先随机抽取 3,000 个问题，再为这些问题收集模型回答。
nodes:
  - id: goal
    label: |-
      定义泛非医学问答基准
      16 国 • 32 个专科
      考试、简答与消费者需求
    type: process
    size: xl
    position:
      x: 40
      'y': 300
  - id: contributors
    label: |-
      招募并核验资质
      621 名贡献者
      60 多所医学院
    type: user
    size: xl
    position:
      x: 320
      'y': 300
  - id: sample_review
    label: |-
      临床团队质量审核
      问题、答案与解析
      对照权威临床资料核验
      评价贡献者工作
    type: user
    size: xl
    position:
      x: 600
      'y': 300
  - id: quality_gate
    label: 正面评价至少 80%？
    type: decision
    size: xl
    position:
      x: 880
      'y': 300
  - id: not_authorized
    label: |-
      不授予数据贡献权限
      未达到准入阈值
    type: terminal
    size: xl
    position:
      x: 880
      'y': 40
  - id: authorized
    label: |-
      角色分级贡献权限
      临床资质用于受限项目
      每位贡献者最多 300 题
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: type
    label: 选择问题收集路线
    type: decision
    size: xl
    position:
      x: 1440
      'y': 300
  - id: expert
    label: |-
      专家医学题目
      3,910 道选择 + 359 道简答
      教授与考试来源
    type: document
    size: xl
    position:
      x: 1720
      'y': 40
  - id: trainee
    label: |-
      学员与临床人员题目
      129 道选择 + 877 道简答
      答案、解析与元数据
    type: document
    size: xl
    position:
      x: 1720
      'y': 300
  - id: consumer
    label: |-
      消费者问题
      10,000 个问题
      472 种病症与主诉
    type: document
    size: xl
    position:
      x: 1720
      'y': 560
  - id: item_qa
    label: |-
      审核每一道题
      问题、答案与解析
      临床与参考资料核验
    type: user
    size: xl
    position:
      x: 2000
      'y': 300
  - id: dataset
    label: |-
      发布 15,275 题
      专家 4,269 + 众包 11,006
      5,444 份人工解释
    type: database
    size: xl
    position:
      x: 2280
      'y': 300
  - id: models
    label: |-
      选择 30 个大模型
      17 个开源 + 13 个闭源
      通用与生物医学模型
    type: process
    size: xl
    position:
      x: 2280
      'y': 760
  - id: responses
    label: |-
      生成全基准回答
      默认 API 或检查点配置
      保留问题子集信息
    type: process
    size: xl
    position:
      x: 2000
      'y': 650
  - id: quantitative
    label: |-
      计算自动指标
      选择题精确准确率
      BERTScore • QuestEval • ROUGE
    type: process
    size: xl
    position:
      x: 1720
      'y': 650
  - id: random_questions
    label: |-
      随机抽取 3,000 个问题
      先选问题
      用于人工评测
    type: document
    size: xl
    position:
      x: 2000
      'y': 950
  - id: human_responses
    label: |-
      收集抽样问题的模型回答
      保持模型身份盲化
    type: process
    size: xl
    position:
      x: 1720
      'y': 950
  - id: human
    label: |-
      双盲人工评分
      379 人 • 五分量表
      共 37,435 次评分
    type: user
    size: xl
    position:
      x: 1440
      'y': 950
  - id: axes
    label: |-
      综合评测证据
      临床人员与消费者维度
      正确性、本地化与危害
    type: process
    size: xl
    position:
      x: 1160
      'y': 800
  - id: report
    label: |-
      报告 AfriMed-QA 结果
      国家 • 专科 • 问题类型
      模型与解释条件分解
    type: terminal
    size: xl
    position:
      x: 880
      'y': 800
