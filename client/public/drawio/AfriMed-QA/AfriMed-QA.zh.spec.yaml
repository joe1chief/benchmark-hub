meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AfriMed-QA 构建与评测流程
  description: 按论文呈现通过社区参与收集泛非医学选择题、简答题与消费者问题，执行临床质量控制，再开展定量及双盲 人工评测的完整流程。
  legend: 当前论文快照含 15,275 题，并非取整后的 15,000：专家题 4,269，众包题 11,006。人工评测为临床人员与 非临床人员设置不同维度，而非只看准确率。
nodes:
  - id: goal
    label: |-
      定义泛非医学问答基准
      英文 • 本地临床语境 • 32 个专科
      专家考试题 + 简答题 + 消费者需求
    type: process
    size: xl
    position:
      x: 40
      'y': 240
  - id: contributors
    label: |-
      招募并核验 621 名贡献者
      16 个国家、60 多所医学院
      核验临床资质 • 每人最多 300 题
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: type
    label: 采用哪条问题收集路线？
    type: decision
    size: xl
    position:
      x: 600
      'y': 240
  - id: expert
    label: |-
      专家医学题
      教授贡献 3,910 道选择题 + 359 道简答题
      非洲来源 • 正确答案 • 临床相关性
    type: document
    size: xl
    position:
      x: 880
      'y': 20
  - id: trainee
    label: |-
      临床众包题
      学员/临床人员贡献 129 道选择题 + 877 道简答题
      选项、答案、解释与元数据
    type: document
    size: xl
    position:
      x: 880
      'y': 240
  - id: consumer
    label: |-
      消费者问题
      基于 472 种疾病与主诉收集 10,000 问
      源自本地社区经验；由临床人员作答
    type: document
    size: xl
    position:
      x: 880
      'y': 460
  - id: quality
    label: |-
      临床质量审核
      对照权威资料交叉检查题目、答案与解释
      仅正向评分至少 80% 的贡献者可继续提交
    type: user
    size: xl
    position:
      x: 1160
      'y': 240
  - id: dataset
    label: |-
      发布 15,275 道 AfriMed-QA
      专家 4,269 + 众包 11,006
      5,444 题具人工答案/解释
      CC-BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: models
    label: |-
      选择 30 个多样化 LLM
      17 个开源 + 13 个闭源 • 3B 至 540B+
      通用、医学、小型、大型与混合专家模型
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: responses
    label: |-
      用基础提示生成答案
      默认 API/检查点设置
      比较国家、专科、子集与解释条件
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: eval_type
    label: 采用哪条评测路线？
    type: decision
    size: xl
    position:
      x: 1440
      'y': 760
  - id: quantitative
    label: |-
      定量评测
      选择题：单字母精确准确率
      简答/消费者题：BERTScore • QuestEval • ROUGE-Lsum
    type: process
    size: xl
    position:
      x: 1160
      'y': 580
  - id: human
    label: |-
      双盲人工评测
      随机 3,000 个回答 • 五点评分
      379 名评分者：58 名临床 + 321 名非临床
      共 37,435 次评分
    type: user
    size: xl
    position:
      x: 1160
      'y': 940
  - id: axes
    label: |-
      合并自动与人工证据
      保留准确率与相似度指标
      临床：正确、本地化、遗漏、幻觉与伤害
      消费者：相关、有帮助与本地化
    type: process
    size: xl
    position:
      x: 880
      'y': 760
  - id: report
    label: |-
      报告准确率、相似度与人工评分
      按国家、专科、题型、模型类别
      以及有无解释拆分
    type: terminal
    size: xl
    position:
      x: 600
      'y': 760
edges:
  - from: goal
    to: contributors
    type: primary
  - from: contributors
    to: type
    type: primary
  - from: type
    to: expert
    type: primary
  - from: type
    to: trainee
    type: primary
  - from: type
    to: consumer
    type: primary
  - from: expert
    to: quality
    type: primary
  - from: trainee
    to: quality
    type: primary
  - from: consumer
    to: quality
    type: primary
  - from: quality
    to: dataset
    type: primary
  - from: dataset
    to: models
    type: primary
  - from: models
    to: responses
    type: primary
  - from: responses
    to: eval_type
    type: primary
  - from: eval_type
    to: quantitative
    type: primary
  - from: eval_type
    to: human
    type: primary
  - from: quantitative
    to: axes
    type: primary
  - from: human
    to: axes
    type: primary
  - from: axes
    to: report
    type: primary
modules: []
