meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AfriMed-QA Construction and Evaluation Workflow
  description: >-
    Paper-aligned workflow for community-participatory collection and clinical quality control of Pan-African medical
    MCQs, short-answer questions, and consumer queries, followed by quantitative and blinded human evaluation.
  legend: >-
    The current paper snapshot contains 15,275 questions, not a rounded 15,000: 4,269 expert items and 11,006
    crowdsourced items. Human evaluation uses separate clinician and non-clinician axes rather than accuracy alone.
nodes:
  - id: goal
    label: |-
      Define a Pan-African Medical QA Benchmark
      English • Local Clinical Context • 32 Specialties
      Expert Exams + Short Answers + Consumer Needs
    type: process
    size: xl
    position:
      x: 40
      'y': 240
  - id: contributors
    label: |-
      Recruit and Verify 621 Contributors
      More than 60 Medical Schools across 16 Countries
      Clinician Credentials Checked • Maximum 300 Items Each
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: type
    label: Which Question-Collection Track?
    type: decision
    size: xl
    position:
      x: 600
      'y': 240
  - id: expert
    label: |-
      Expert Medical Items
      Professors Contribute 3,910 MCQs + 359 SAQs
      African Sources • Correct Answers • Clinical Relevance
    type: document
    size: xl
    position:
      x: 880
      'y': 20
  - id: trainee
    label: |-
      Crowdsourced Clinical Items
      Trainees/Clinicians Contribute 129 MCQs + 877 SAQs
      Options, Answers, Rationales, and Metadata
    type: document
    size: xl
    position:
      x: 880
      'y': 240
  - id: consumer
    label: |-
      Consumer Queries
      10,000 Questions from 472 Conditions and Complaints
      Local Community Experience; Clinicians Supply Answers
    type: document
    size: xl
    position:
      x: 880
      'y': 460
  - id: quality
    label: |-
      Clinical Quality Review
      Cross-Check Questions, Answers, and Rationales
      against Authoritative References
      Only Contributors with at Least 80% Positive Ratings Continue
    type: user
    size: xl
    position:
      x: 1160
      'y': 240
  - id: dataset
    label: |-
      Release 15,275 AfriMed-QA Items
      Expert 4,269 + Crowdsourced 11,006
      Human Answers/Explanations for 5,444 Questions
      CC-BY-NC-SA 4.0
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: models
    label: |-
      Select 30 Diverse LLMs
      17 Open + 13 Proprietary • 3B to 540B+
      General, Biomedical, Small, Large, and MoE
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: responses
    label: |-
      Generate Answers with Base Prompts
      Default API/Checkpoint Settings
      Compare Countries, Specialties, Subsets, and Explanations
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: eval_type
    label: Which Evaluation Track?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 760
  - id: quantitative
    label: |-
      Quantitative Evaluation
      MCQ: Single-Letter Exact Accuracy
      SAQ/CQ: BERTScore • QuestEval • ROUGE-Lsum
    type: process
    size: xl
    position:
      x: 1160
      'y': 580
  - id: human
    label: |-
      Double-Blind Human Evaluation
      Random 3,000 Responses • 5-Point Ratings
      379 Raters: 58 Clinicians + 321 Non-Clinicians
      37,435 Total Ratings
    type: user
    size: xl
    position:
      x: 1160
      'y': 940
  - id: axes
    label: |-
      Integrate Automated and Human Evidence
      Preserve Accuracy and Similarity Metrics
      Clinicians: Correct, Localized, Omissions, Hallucinations, Harm
      Consumers: Relevant, Helpful, and Localized
    type: process
    size: xl
    position:
      x: 880
      'y': 760
  - id: report
    label: |-
      Report Accuracy, Similarity, and Human Ratings
      Break Down by Country, Specialty, Question Type,
      Model Class, and Explanation Condition
    type: terminal
    size: xl
    position:
      x: 600
      'y': 760
