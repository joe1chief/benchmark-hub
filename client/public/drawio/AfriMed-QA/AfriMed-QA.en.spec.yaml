meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AfriMed-QA Build Process
  description: >-
    Paper-aligned contributor qualification, three-track question collection, item review, and evaluation from
    arXiv:2411.15640v4 Sections 3.1-4.3, Table 2, and Appendix A.
  legend: >-
    Contributor qualification precedes all question collection. The human-evaluation subset is formed by sampling 3,000
    questions before model responses are collected.
nodes:
  - id: goal
    label: |-
      Define Pan-African Medical QA
      16 Countries • 32 Specialties
      Exams, SAQs, Consumer Needs
    type: process
    size: xl
    position:
      x: 40
      'y': 300
  - id: contributors
    label: |-
      Recruit and Check Credentials
      621 Contributors
      60+ Medical Schools
    type: user
    size: xl
    position:
      x: 320
      'y': 300
  - id: sample_review
    label: |-
      Clinician Quality Review
      Questions • Answers • Rationales
      Cross-Check Authoritative Sources
      Rate Contributor Work
    type: user
    size: xl
    position:
      x: 600
      'y': 300
  - id: quality_gate
    label: At Least 80% Positive?
    type: decision
    size: xl
    position:
      x: 880
      'y': 300
  - id: not_authorized
    label: |-
      No Dataset Contribution Access
      Approval Threshold Not Met
    type: terminal
    size: xl
    position:
      x: 880
      'y': 40
  - id: authorized
    label: |-
      Role-Gated Contribution Access
      Clinician Credentials for Restricted Work
      Maximum 300 Items per Contributor
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: type
    label: Select Collection Track
    type: decision
    size: xl
    position:
      x: 1440
      'y': 300
  - id: expert
    label: |-
      Expert Medical Items
      3,910 MCQs + 359 SAQs
      Professors and Exam Sources
    type: document
    size: xl
    position:
      x: 1720
      'y': 40
  - id: trainee
    label: |-
      Trainee and Clinician Items
      129 MCQs + 877 SAQs
      Answer, Rationale, Metadata
    type: document
    size: xl
    position:
      x: 1720
      'y': 300
  - id: consumer
    label: |-
      Consumer Queries
      10,000 Questions
      472 Conditions and Complaints
    type: document
    size: xl
    position:
      x: 1720
      'y': 560
  - id: item_qa
    label: |-
      Review Every Item
      Question, Answer, Rationale
      Clinical and Reference Checks
    type: user
    size: xl
    position:
      x: 2000
      'y': 300
  - id: dataset
    label: |-
      Release 15,275 Items
      Expert 4,269 + Crowd 11,006
      5,444 Human Explanations
    type: database
    size: xl
    position:
      x: 2280
      'y': 300
  - id: models
    label: |-
      Select 30 LLMs
      17 Open + 13 Proprietary
      General and Biomedical
    type: process
    size: xl
    position:
      x: 2280
      'y': 760
  - id: responses
    label: |-
      Generate Benchmark Answers
      Default API or Checkpoint
      Preserve Question Subsets
    type: process
    size: xl
    position:
      x: 2000
      'y': 650
  - id: quantitative
    label: |-
      Compute Automated Metrics
      MCQ Exact Accuracy
      BERTScore • QuestEval • ROUGE
    type: process
    size: xl
    position:
      x: 1720
      'y': 650
  - id: random_questions
    label: |-
      Randomly Sample 3,000 Questions
      Select Questions First
      for Human Evaluation
    type: document
    size: xl
    position:
      x: 2000
      'y': 950
  - id: human_responses
    label: |-
      Collect LLM Responses
      on the Sampled Questions
      Preserve Model Identity Blinding
    type: process
    size: xl
    position:
      x: 1720
      'y': 950
  - id: human
    label: |-
      Double-Blind Human Ratings
      379 Raters • 5-Point Scale
      37,435 Total Ratings
    type: user
    size: xl
    position:
      x: 1440
      'y': 950
  - id: axes
    label: |-
      Integrate Evaluation Evidence
      Clinician and Consumer Axes
      Accuracy, Locality, Harm
    type: process
    size: xl
    position:
      x: 1160
      'y': 800
  - id: report
    label: |-
      Report AfriMed-QA Results
      Country • Specialty • Type
      Model and Explanation Breakdowns
    type: terminal
    size: xl
    position:
      x: 880
      'y': 800
edges:
  - from: goal
    to: contributors
    type: primary
  - from: contributors
    to: sample_review
    type: primary
  - from: sample_review
    to: quality_gate
    type: primary
  - from: quality_gate
    to: not_authorized
    type: optional
    label: Below 80%
  - from: quality_gate
    to: authorized
    type: primary
    label: At least 80%
  - from: authorized
    to: type
    type: primary
  - from: type
    to: expert
    type: primary
  - from: type
    to: trainee
    type: primary
  - from: type
    to: consumer
    type: primary
  - from: expert
    to: item_qa
    type: primary
    waypoints:
      - x: 1920
        'y': 100
      - x: 1960
        'y': 100
      - x: 1960
        'y': 260
  - from: trainee
    to: item_qa
    type: primary
  - from: consumer
    to: item_qa
    type: primary
    waypoints:
      - x: 1920
        'y': 620
      - x: 1960
        'y': 620
      - x: 1960
        'y': 420
  - from: item_qa
    to: dataset
    type: primary
  - from: dataset
    to: models
    type: primary
  - from: models
    to: responses
    type: primary
  - from: responses
    to: quantitative
    type: primary
  - from: dataset
    to: random_questions
    type: data
    waypoints:
      - x: 2200
        'y': 420
      - x: 2200
        'y': 900
      - x: 2080
        'y': 900
  - from: random_questions
    to: human_responses
    type: primary
  - from: human_responses
    to: human
    type: primary
  - from: quantitative
    to: axes
    type: primary
  - from: human
    to: axes
    type: primary
  - from: axes
    to: report
    type: primary
modules: []
