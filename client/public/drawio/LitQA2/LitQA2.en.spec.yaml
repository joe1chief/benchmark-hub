meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LitQA2 Build Process
  description: >-
    Reconstructs the expert-authored LitQA2 question pipeline and the exact PaperQA2 measurement protocol reported in
    arXiv:2409.13740.
  legend: >-
    LitQA2 grows the original 47-question LitQA set by 100 and then 101 questions. Accuracy counts correct answers over
    all questions, precision over answered questions, and recall tracks attribution to the benchmark's source DOI.
nodes:
  - id: papers
    label: |-
      Identify Recent Scientific Papers
      Published within the Past 36 Months
      Prefer Obscure Intermediate Findings
      Record the Intended Source DOI
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: draft
    label: |-
      Draft an Expert Multiple-choice Question
      Answer Requires Main-body Context
      Not Answerable from Title or Abstract
      Requires Reasoning · Not a Direct Quote
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: choices
    label: |-
      Build Plausible Answer Choices
      Distractors Fit the Paper or Domain
      Include Insufficient Information
      Permit Intentionally Unanswerable Items
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: challenge
    label: |-
      Challenge Each Draft
      Probe ChatGPT 3.5 or 4 with Logging Off
      Search the Wording in Google Scholar
      Revise Easily Answered or Searchable Items
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: review
    label: |-
      Calibrate and Review Authors
      Closely Review Each New Author's First ~10
      Rework or Reject Weak Questions
      Continue Author Review before Merging
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      Assemble LitQA2
      Original LitQA · 47
      First Addition · 100 → 147
      Second Addition · 101 → 248 Total
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: randomize
    label: |-
      Randomize Answer Order
      Shuffle Choices for Every Call
      Preserve the Ideal Answer Mapping
      Prevent Position-specific Shortcuts
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: run
    label: |-
      Run the Evaluated System
      One PaperQA Call per Question
      Three Full Runs of All Questions
      Temperature 0 in Reported Tests
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: extract
    label: |-
      Extract a Single-letter Answer
      Use GPT-4-0613
      Apply the Published Extraction Prompt
      Parse the Returned Choice Letter
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: grade
    label: |-
      Grade the Parsed Choice
      Correct Answer · Correct
      Insufficient Information · Unsure
      Null Ideal + Insufficient · Correct
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: metrics
    label: |-
      Compute Three Metrics
      Accuracy · Correct / All Questions
      Precision · Correct / Answered
      Recall · Correct Source DOI Attributed
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report LitQA2 Results
      Aggregate Three-run Variation
      Compare Old 147 vs New 101
      Keep Human Tool-use Baseline Separate
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: papers
    to: draft
    type: primary
  - from: draft
    to: choices
    type: primary
  - from: choices
    to: challenge
    type: primary
  - from: challenge
    to: review
    type: primary
  - from: review
    to: release
    type: primary
  - from: release
    to: randomize
    type: primary
  - from: randomize
    to: run
    type: primary
  - from: run
    to: extract
    type: primary
  - from: extract
    to: grade
    type: primary
  - from: grade
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
