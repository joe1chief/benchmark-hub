meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LitQA2 Build Process
  description: >-
    Paper-v2-aligned construction of the 248 expert-authored LitQA2 questions, the exact reported measurement protocol,
    and the separately identified current public/gated release split and implementation drift.
  legend: >-
    Solid arrows show paper-backed construction or measurement. The release branch records the current reproduction
    manifest and is not the paper's old-147/new-101 development chronology. Unconnected cards preserve disclosed gaps
    and current-code drift instead of silently treating them as the paper protocol.
nodes:
  - id: source_lock
    label: |-
      Fix Reproducible Evidence
      Paper 2409.13740v2
      paper-qa d7675d7b · Aviary 1c061dbc
      Public/Gated Data 5c77cec6/e9ee5486
    type: document
    module: construction
    size: xl
    position:
      x: 32
      'y': 240
    style:
      fontSize: 9
  - id: recent_papers
    label: |-
      Select Recent Source Papers
      Published within Previous 36 Months
      Prefer Obscure Intermediate Findings
      Record Intended Source DOI
    type: database
    module: construction
    size: xl
    position:
      x: 304
      'y': 240
  - id: draft_question
    label: |-
      Experts Draft Multiple-choice Items
      Answer Requires Main-body Context
      Not Answerable from Title or Abstract
      Requires Reasoning · Not a Direct Quote
    type: user
    module: construction
    size: xl
    position:
      x: 576
      'y': 240
  - id: distractors
    label: |-
      Construct Plausible Distractors
      Use Other Paper Facts or Domain Knowledge
      Store Ideal Answer or null
      Permit Intentionally Unanswerable Items
    type: process
    module: construction
    size: xl
    position:
      x: 848
      'y': 240
  - id: challenge
    label: |-
      Challenge Drafts
      Periodic ChatGPT 3.5/4 · Logging Off
      Often Search Wording in Google Scholar
      Test Alternative-source Answerability
    type: process
    module: construction
    size: xl
    position:
      x: 1120
      'y': 240
  - id: reject_item
    label: |-
      Remove from Consideration
      Failed Author Quality Review
      Do Not Merge into Corpus
    type: terminal
    module: construction
    size: large
    position:
      x: 1664
      'y': 424
  - id: calibration
    label: |-
      Author Calibration and Ongoing Review
      Closely Review First ~10 New-author Items
      Accept · Rework · Remove?
    type: decision
    module: construction
    size: xl
    position:
      x: 1664
      'y': 240
  - id: release_248
    label: |-
      Assemble LitQA2 · 248 Questions
      Original LitQA 47
      First Release +100 → 147
      Later Unseen Addition +101 → 248
      Question · Ideal/null · Distractors · DOI
    type: database
    module: construction
    size: xl
    position:
      x: 1936
      'y': 240
    style:
      fontSize: 9
  - id: current_manifest
    label: |-
      paper-qa Reproduction Manifest
      Secondary ID Partition · Not HF Splits
      Selects Train159 + Eval40 from 199
      Selects Test49 from Gated Corpus
    type: document
    module: release
    size: xl
    position:
      x: 304
      'y': 720
  - id: public_199
    label: |-
      Pinned HF LAB-Bench Corpus
      One Physical train Split · 199 Rows
      No Physical eval or test Split
      HF 5c77cec6 · CC BY-SA 4.0
    type: database
    module: release
    size: xl
    position:
      x: 576
      'y': 624
  - id: gated_49
    label: |-
      Auto-gated Test Corpus · 49
      aviary-paper-data Test Split
      HF e9ee5486 · Share-contact Gate
    type: database
    module: release
    size: xl
    position:
      x: 576
      'y': 816
  - id: release_boundary
    label: |-
      Partly Public Release
      199 Ungated · 49 Auto-gated
      Dataset License · CC BY-SA 4.0
      No Official Live Leaderboard
    type: document
    module: release
    size: xl
    position:
      x: 848
      'y': 720
  - id: missing_contracts
    label: |-
      Construction Details Not Published
      Exact Sampling Frame / Candidate Count
      Challenge Prompts / Generation Settings
      Acceptance Rate / Reviewer Agreement
      Full Rejection and Revision Log
    type: document
    module: release
    size: xl
    position:
      x: 1120
      'y': 864
    style:
      fontSize: 9
  - id: eval_prep
    label: |-
      Prepare Each Paper-v2 Call
      Question + All Answer Choices
      Include “Insufficient Information…”
      Randomize Order for Every Call
    type: process
    module: measurement
    size: xl
    position:
      x: 1936
      'y': 1200
  - id: paper_run
    label: |-
      Run a PaperQA Configuration
      One paperqa Call per Question
      3 Complete Runs of All 248
      Temperature 0 · Configuration Varies
    type: process
    module: measurement
    size: xl
    position:
      x: 1664
      'y': 1200
  - id: extract_letter
    label: |-
      GPT-4-0613 Letter Extractor
      Extract the single letter answer
      from the following question and answer
      {prompt_output('QA')}
      Single Letter Answer:
    type: process
    module: measurement
    size: xl
    position:
      x: 1392
      'y': 1200
    style:
      fontSize: 9
  - id: grade_choice
    label: |-
      Grade Parsed Choice
      Matches Ideal → Correct
      Insufficient → Unsure
      Ideal null + Insufficient → Correct
    type: process
    module: measurement
    size: xl
    position:
      x: 1120
      'y': 1200
  - id: metrics
    label: |-
      Compute LitQA2 Metrics
      Accuracy = Correct / All
      Precision = Correct / Answered
      DOI Recall = Correct-source Attribution / All
    type: formula
    module: measurement
    size: xl
    position:
      x: 848
      'y': 1200
  - id: paper_report
    label: |-
      Report Paper-v2 Evaluation
      Three-run Results by Configuration
      Compare Old147 vs Unseen New101
      Human Tool-use Baseline Separately
    type: terminal
    module: measurement
    size: xl
    position:
      x: 576
      'y': 1200
  - id: implementation_drift
    label: |-
      Current Defaults ≠ Paper-v2 Protocol
      paper-qa d767 · Different Prompt Constant
      Aviary 1c061 · gpt-4o-mini + Option Text
      Choice Shuffle Requires Explicit Seed
      Do Not Mix with Reported Paper Results
    type: document
    module: measurement
    size: xl
    position:
      x: 304
      'y': 1392
    style:
      fontSize: 9
edges:
  - from: source_lock
    to: recent_papers
    type: primary
  - from: recent_papers
    to: draft_question
    type: primary
  - from: draft_question
    to: distractors
    type: primary
  - from: distractors
    to: challenge
    type: primary
  - from: challenge
    to: calibration
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: calibration
    to: release_248
    type: primary
    label: Accept
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: calibration
    to: challenge
    type: optional
    label: Rework
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.5
      entryY: 1
  - from: calibration
    to: reject_item
    type: optional
    label: Remove
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: release_248
    to: current_manifest
    type: data
    label: Current split manifest
    waypoints:
      - x: 2064
        'y': 560
      - x: 432
        'y': 560
      - x: 432
        'y': 720
  - from: current_manifest
    to: public_199
    type: primary
    label: Source corpus · 199
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: current_manifest
    to: gated_49
    type: optional
    label: Source test corpus
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: public_199
    to: release_boundary
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: gated_49
    to: release_boundary
    type: optional
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: release_248
    to: eval_prep
    type: primary
    label: Paper-v2 measurement
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: eval_prep
    to: paper_run
    type: primary
  - from: paper_run
    to: extract_letter
    type: primary
  - from: extract_letter
    to: grade_choice
    type: primary
  - from: grade_choice
    to: metrics
    type: primary
  - from: metrics
    to: paper_report
    type: primary
modules:
  - id: construction
    label: Build
    color: $primaryLight
  - id: release
    label: Release
    color: $warningLight
  - id: measurement
    label: Evaluate
    color: $secondaryLight
