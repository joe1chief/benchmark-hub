  title: SysBench-ISR 构建与评测流程
  description: >-
    SysBench-ISR不是独立的基准数据集。GLM-4.5报告使用原始SysBench的指令满足率切片做指令遵循评测，并把训练曲线标为SysBench-ISR。底层SysBench定义6类原子约束，先用启发式规则与聚类清理数千条在线系统消息，再由21名受训标注者选出500条系统消息。GPT-4o辅助生成五轮对话；标注者重写对话，标注对齐与不对齐指令以及并行与依赖会话，并为每条指令编写约束检查表。多专家复核后冻结500个会话、2500轮对话。评测时目标模型接收系统消息、对话历史和当前指令；高级LLM验证器结合相同上下文与检查表，逐个二元判断相关约束。只有一条指令关联的全部约束都满足，该指令才计为满足，最后在指令间求平均得到ISR。GLM-4.5报告的是这一指标切片，而不是新的SysBench-ISR数据集。
  legend: >-
    来源：GLM-4.5 arXiv:2508.06471 Sections 3.3 and 4.2.4, including Figure 9; SysBench arXiv:2408.10943 Section 3 and
    Appendix A; official PKU-Baichuan-MLSystemLab/SysBench repository。实线箭头表示论文或官方资料明确支持的主流程。
