meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HEAD-QA 构建流程
  description: 以固定版本证据还原 HEAD-QA 西班牙文与英文视图的构建，并接入官方仓库中的精确评测器契约。
  legend: 实线依据 arXiv:1906.04701v1；虚线固定官方仓库与 Hugging Face 发布物。这个 2019 年基准没有发布规范 LLM 提示词或生成配置。
nodes:
  - id: evidence
    label: |-
      固定证据边界
      arXiv:1906.04701v1
      aghie/head-qa @ da54ff2
      dvilares/head_qa @ d444ead
      数据集脚本版本 1.1.0
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: exams
    label: |-
      收集西班牙公共医疗考试
      医疗系统专业岗位资格考试
      使用 2013 年起的官方试卷
    type: database
    size: xl
    position:
      x: 40
      'y': 320
  - id: domains
    label: |-
      保留六个医疗领域
      医学 · 药学 · 心理学
      护理 · 生物学 · 化学
    type: process
    size: xl
    position:
      x: 320
      'y': 320
  - id: clean
    label: |-
      按来源实施排除
      放射物理的 PDF 公式难以可靠解析
      移除考试后被官方作废的题目
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: schema
    label: |-
      官方记录 schema
      name / year / category / qid
      qtext / ra / 可选 image
      answers 包含 aid + atext
    type: document
    size: xl
    position:
      x: 880
      'y': 320
  - id: split
    label: |-
      官方按年份切分
      2013-14 训练：2,657
      2015 验证：1,366
      后续测试：2,742 · 总计 6,765
    type: database
    size: xl
    position:
      x: 1160
      'y': 320
  - id: spanish
    label: |-
      西班牙文视图：同一 6,765 行
      2013-14：五个选项
      后续考试：四个选项
      约 14% 医学题引用图像
    type: process
    size: xl
    position:
      x: 1460
      'y': 100
  - id: translate
    label: |-
      用 Google API 翻译成英文
      翻译题干与答案文本
      保留 ID / 标签 / 图像 / 切分
    type: process
    size: xl
    position:
      x: 1460
      'y': 540
  - id: audit
    label: |-
      抽检 60 条随机翻译
      双语充分性：4.35 / 5
      第二位充分性：4.71 / 5
      英语母语流畅度：4 / 5
    type: process
    size: xl
    position:
      x: 1740
      'y': 540
  - id: run_es
    label: |-
      论文西班牙文基线
      Length / Random / Blind / IR
      不使用题目引用的图像
      无规范 LLM 提示词或生成配置
    type: process
    size: xl
    position:
      x: 2020
      'y': 100
  - id: run_en
    label: |-
      论文英文 / 跨语言实验
      使用翻译后的题目与选项
      Length / Random / Blind / IR / DrQA
      官方代码中 DrQA 仅用于英文
      无规范 LLM 提示词或生成配置
    type: process
    size: xl
    position:
      x: 2020
      'y': 540
  - id: parser
    label: |-
      官方 eval.py 契约
      预测行 = qid + 答案 ID
      真值行 = qid + 答案 ID
      "-" 表示未作答
    type: process
    size: xl
    position:
      x: 2320
      'y': 320
  - id: score
    label: |-
      准确率 + 宏观 P/R/F1
      官方 POINTS 计分
      答对 × 3 · 答错 × -1
      未作答贡献 0
    type: terminal
    size: xl
    position:
      x: 2620
      'y': 320
edges:
  - from: evidence
    to: exams
    type: data
  - from: exams
    to: domains
    type: primary
  - from: domains
    to: clean
    type: primary
  - from: clean
    to: schema
    type: primary
  - from: schema
    to: split
    type: primary
  - from: split
    to: spanish
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: split
    to: translate
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: spanish
    to: run_es
    type: primary
  - from: translate
    to: audit
    type: primary
  - from: audit
    to: run_en
    type: primary
  - from: run_es
    to: parser
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.25
      entryY: 0
  - from: run_en
    to: parser
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.75
      entryY: 1
  - from: parser
    to: score
    type: primary
modules: []
