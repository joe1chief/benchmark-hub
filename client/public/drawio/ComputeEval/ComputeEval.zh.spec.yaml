meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComputeEval 构建与评测流程
  description: >-
    ComputeEval 的官方引用中未找到独立论文；目录原 arXiv 链接实际是只引用 ComputeEval 的 OptiML 方法论文。NVIDIA 官方 2026.1 快照 19ba74f 含 566 题、7 个领域组，其中
    CUDA C++ 518 题、CUDA Python 48 题，499 题带性能负载。任务由 NVIDIA
    工程师编写，部分使用前沿模型辅助，但所有题目与标签均经人工复核；辅助占比及逐题来源未披露。每题包含提示、可见上下文、构建/测试命令、隐藏测试、参考解与可选性能负载；CI
    用已知正确解验证编译、测试与规格。模型看不到测试或参考解；隔离评测先编译并核验必需 API 与隐藏测试，仅对正确候选做延迟、吞吐量和相对基线加速比剖析，并报告 Pass@k。
  legend: 来源：官方仓库快照 19ba74f；README、DATASET_CARD.md、DOMAIN_MAP.md 与 CHANGELOG.md 的 2026.1 版本。实线箭头表示官方资料明确支持的主流程。
