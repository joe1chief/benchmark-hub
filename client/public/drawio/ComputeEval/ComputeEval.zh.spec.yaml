meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComputeEval 构建与评测流程
  description: 依据 NVIDIA 官方资料呈现 ComputeEval 2026.1：从专家主导的混合题目编写、隐藏测试封装与参考解 CI， 到隔离的正确性验证和可选 GPU 性能剖析。
  legend: 上行从左到右阅读版本化基准构建，下行从右到左阅读模型评测；橙色节点标示证据边界， 因为目录原 arXiv 链接对应 OptiML 而非 ComputeEval。
nodes:
  - id: evidence
    label: |-
      证据边界
      未发现独立 ComputeEval 论文
      采用 NVIDIA 博客、官方仓库与数据卡
    type: decision
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      混合式题目编写
      NVIDIA 工程师 + 前沿模型辅助
      所有题目与标签均经人工复核
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: domains
    label: |-
      七个 CUDA 领域组
      518 道 CUDA C++ + 48 道 CUDA Python
      Runtime / Kernel / GPU 库 / cuTile
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: contract
    label: |-
      自包含题目合同
      提示、上下文与构建/测试命令
      隐藏测试、参考解与可选性能负载
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: ci
    label: |-
      持续集成质量门禁
      参考解必须编译并通过
      验证测试框架、规格与必需 API
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      版本化 2026.1 数据包
      566 道题覆盖 7 个领域组
      其中 499 道带性能负载
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generate
    label: |-
      生成阶段可见信息
      提示、上下文、构建与硬件要求
      隐藏测试和参考解不可见
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: workspace
    label: |-
      隔离评测工作区
      写入上下文、候选解与隐藏测试
      Docker 或显式本地执行模式
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: compile
    label: |-
      编译与静态合同检查
      执行 build_command
      按需核验 source_references
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness
    label: |-
      隐藏功能正确性测试
      编译成功后执行 test_command
      退出码为 0 即通过，否则失败
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: performance
    label: |-
      仅处理正确候选解
      可选 benchmark_command 与 CUPTI / NCU
      耗时、吞吐量与相对基线加速比
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      ComputeEval 结果
      总体及分领域 Pass@k
      延迟、加速比、SM 与 DRAM 吞吐量
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: evidence
    to: author
    type: primary
  - from: author
    to: domains
    type: primary
  - from: domains
    to: contract
    type: primary
  - from: contract
    to: ci
    type: primary
  - from: ci
    to: release
    type: primary
  - from: release
    to: generate
    type: primary
  - from: generate
    to: workspace
    type: primary
  - from: workspace
    to: compile
    type: primary
  - from: compile
    to: correctness
    type: primary
  - from: correctness
    to: performance
    type: primary
  - from: performance
    to: report
    type: primary
modules: []
