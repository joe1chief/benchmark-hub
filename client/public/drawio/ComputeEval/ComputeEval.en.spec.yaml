meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComputeEval Build and Evaluation Process
  description: >-
    Official-source-aligned construction and evaluation of NVIDIA ComputeEval 2026.1, from hybrid expert authoring and
    hidden-test packaging through reference-solution CI, isolated correctness checks, and optional GPU performance
    profiling.
  legend: >-
    Read the versioned benchmark-construction row left-to-right, then the model evaluation row right-to-left; orange
    marks the evidence boundary because the catalog's former arXiv link describes OptiML rather than ComputeEval.
nodes:
  - id: evidence
    label: |-
      Evidence Boundary
      No Standalone ComputeEval Paper Located
      NVIDIA Blog + Repository + Dataset Card
    type: decision
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      Hybrid Problem Authoring
      NVIDIA Engineers + Frontier-Model Assistance
      Every Problem and Label Human-Reviewed
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: domains
    label: |-
      Seven CUDA Domain Groups
      518 CUDA C++ + 48 CUDA Python
      Runtime / Kernels / Libraries / cuTile
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: contract
    label: |-
      Self-Contained Problem Contract
      Prompt + Context + Build/Test Commands
      Hidden Tests + Reference + Optional Performance Workload
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: ci
    label: |-
      Continuous-Integration Quality Gate
      Reference Solution Must Compile and Pass
      Validate Harness + Specification + Required APIs
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Versioned 2026.1 Datapack
      566 Problems across 7 Groups
      499 Include Performance Workloads
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generate
    label: |-
      Generation-Time View
      Show Prompt / Context / Build + Hardware Rules
      Keep Tests and Reference Solutions Hidden
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: workspace
    label: |-
      Isolated Evaluation Workspace
      Materialize Context + Candidate + Held-Out Tests
      Docker or Explicit Local Execution Mode
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: compile
    label: |-
      Compile and Static Contract Checks
      Run build_command
      Verify Declared source_references when Required
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness
    label: |-
      Held-Out Functional Correctness
      Run test_command after Successful Build
      Exit Code 0 = Pass; Otherwise Fail
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: performance
    label: |-
      Passing Solutions Only
      Optional benchmark_command via CUPTI / NCU
      Timing / Throughput / Baseline Speedup
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      ComputeEval Results
      Pass@k Overall and by Group
      Latency / Speedup / SM and DRAM Throughput
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
