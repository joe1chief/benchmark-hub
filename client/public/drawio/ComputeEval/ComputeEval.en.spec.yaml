meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComputeEval Build and Evaluation Process
  description: >-
    ComputeEval has no standalone paper located in its official citation; the previous catalog arXiv link is the
    unrelated OptiML method paper, which only cites ComputeEval. NVIDIA's official 2026.1 release has 566 problems
    across seven groups: 518 CUDA C++ and 48 CUDA Python, with performance workloads for 499 problems. NVIDIA engineers
    author the tasks, sometimes with frontier-model assistance, and human engineers review every problem and label. Each
    contract contains a prompt, visible context, build/test commands, held-out tests, a reference solution, and optional
    performance workload. CI compiles and runs known-good solutions and validates specifications. Models see no tests or
    references; isolated evaluation compiles candidates, checks required APIs and held-out tests, and profiles only
    correct solutions for latency, throughput, and baseline speedup alongside pass@k.
  legend: >-
    Source: NVIDIA technical blog; official README, DATASET_CARD.md, DOMAIN_MAP.md, and CHANGELOG.md for release 2026.1.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
nodes:
  - id: evidence
    label: |-
      Evidence Boundary
      No Standalone ComputeEval Paper Located
      NVIDIA Blog + Repository + Dataset Card
    type: process
    size: xl
    position:
      x: 40
      'y': 100
  - id: author
    label: |-
      Hybrid Problem Authoring
      NVIDIA Engineers + Frontier-Model Assistance
      Every Problem and Label Human-Reviewed
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: domains
    label: |-
      Seven CUDA Domain Groups
      518 CUDA C++ + 48 CUDA Python
      Runtime / Kernels / Libraries / cuTile
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: contract
    label: |-
      Self-Contained Problem Contract
      Prompt + Context + Build/Test Commands
      Hidden Tests + Reference + Optional Performance Workload
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: ci
    label: |-
      Continuous-Integration Quality Gate
      Reference Solution Must Compile and Pass
      Validate Harness + Specification + Required APIs
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Versioned 2026.1 Datapack
      566 Problems across 7 Groups
      499 Include Performance Workloads
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: generate
    label: |-
      Generation-Time View
      Show Prompt / Context / Build + Hardware Rules
      Keep Tests and Reference Solutions Hidden
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: workspace
    label: |-
      Isolated Evaluation Workspace
      Materialize Context + Candidate + Held-Out Tests
      Docker or Explicit Local Execution Mode
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: compile
    label: |-
      Do Build and Contract Checks Pass?
      Run build_command + Required source_references Checks
      Only Then Run test_command
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness
    label: |-
      Do Held-Out Functional Tests Pass?
      Run test_command after Successful Build
      Exit Code 0 = Pass
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: performance
    label: |-
      Passing Solutions Only
      Optional benchmark_command via CUPTI / NCU
      Timing / Throughput / Baseline Speedup
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      ComputeEval Results
      Pass@k Overall and by Group
      Latency / Speedup / SM and DRAM Throughput
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
