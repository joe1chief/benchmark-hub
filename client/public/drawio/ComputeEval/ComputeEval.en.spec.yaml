    to: author
    type: primary
  - from: author
    to: domains
    type: primary
  - from: domains
    to: contract
    type: primary
  - from: contract
    to: ci
    type: primary
  - from: ci
    to: release
    type: primary
  - from: release
    to: generate
    type: primary
  - from: generate
    to: workspace
    type: primary
  - from: workspace
    to: compile
    type: primary
  - from: compile
    to: correctness
    type: primary
  - from: correctness
    to: performance
    type: primary
  - from: performance
    to: report
    type: primary
modules: []
