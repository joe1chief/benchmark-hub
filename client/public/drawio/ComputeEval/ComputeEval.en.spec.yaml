meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComputeEval Build and Evaluation Process
  description: >-
    ComputeEval has no standalone paper located in its official citation; the previous catalog arXiv link is the
    unrelated OptiML method paper, which only cites ComputeEval. NVIDIA's official 2026.1 snapshot at 19ba74f has 566
    problems across seven groups: 518 CUDA C++ and 48 CUDA Python, with performance workloads for 499 problems. NVIDIA
    engineers author the tasks, sometimes with frontier-model assistance, and human engineers review every problem and
    label; the assistance share and per-problem provenance are not disclosed. Each contract contains a prompt, visible
    context, build/test commands, held-out tests, a reference solution, and optional performance workload. CI compiles
    and runs known-good solutions and validates specifications. Models see no tests or references; isolated evaluation
    compiles candidates, checks required APIs and held-out tests, and profiles only correct solutions for latency,
    throughput, and baseline speedup alongside pass@k.
  legend: >-
    Source: official repository snapshot 19ba74f; README, DATASET_CARD.md, DOMAIN_MAP.md, and CHANGELOG.md for release
    2026.1. Solid arrows show the main flow explicitly supported by the paper or official documentation.
