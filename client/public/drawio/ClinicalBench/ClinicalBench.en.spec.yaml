  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClinicalBench Build Process
  description: >-
    Paper-v2-aligned ClinicalBench flow: fixed MIMIC versions, first-visit cohort filtering, stratified splits and
    training-only balancing feed matched traditional-ML and open-source-LLM comparisons across three prediction tasks.
  legend: Solid arrows follow the paper experiment; the dashed branch records the current README's MIMIC-IV version drift.
