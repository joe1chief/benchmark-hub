meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ZeroBench Adversarial Construction and Exact-Match Evaluation
  description: >-
    More than 20 creators hand-craft 140 difficult visual candidates, iteratively improve them with o1 pro/QVQ probes,
    and submit them to independent review that broadens answer spaces and removes unsuitable formats. Adversarial
    filtering removes any candidate solved by any baseline, leaving 100 v1 questions; subquestions are derived from
    natural reasoning steps. Community red-teaming modifies 23% into v2, followed by a clarity-only v3 patch. Evaluation
    uses brace-delimited final answers, exact match, macro subquestion scoring, pass@k, and pass^k.
  legend: >-
    Source: ZeroBench arXiv:2502.09696v3, Sections 3.1-3.3, Table 1, Sections 4.1-4.2, Table 2, and Appendix F; official
    project https://zerobench.github.io/, repository https://github.com/jonathan-roberts1/zerobench, and dataset
    https://huggingface.co/datasets/jonathan-roberts1/zerobench. Version pin: paper construction creates v1 then
    community-red-team v2, and paper experiments use v2; the current project v3 only clarifies two main questions and
    three associated subquestions without changing scores.. Solid arrows show the main flow explicitly supported by the
    paper or official documentation.
