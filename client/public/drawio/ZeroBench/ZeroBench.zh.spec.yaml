meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ZeroBench 对抗构建与精确匹配评测流程
  description: >-
    20多名创建者手工设计140个困难视觉候选，结合o1
    pro/QVQ探测迭代改进，再由独立审查扩展答案空间并移除不合适格式。对抗过滤删除被任一基线答对的候选，留下100道v1主问题；子问题来自自然推理步骤。社区红队将23%的主问题修改为v2，之后v3仅做清晰度补丁。评测从花括号提取最终答案，采用精确匹配、按主问题宏平均的子问题分、pass@k与pass^k。
  legend: >-
    来源：ZeroBench arXiv:2502.09696v3, Sections 3.1-3.3, Table 1, Sections 4.1-4.2, Table 2, and Appendix F; official
    project https://zerobench.github.io/, repository https://github.com/jonathan-roberts1/zerobench, and dataset
    https://huggingface.co/datasets/jonathan-roberts1/zerobench. Version pin: paper construction creates v1 then
    community-red-team v2, and paper experiments use v2; the current project v3 only clarifies two main questions and
    three associated subquestions without changing scores.。实线箭头表示论文或官方资料明确支持的主流程。
