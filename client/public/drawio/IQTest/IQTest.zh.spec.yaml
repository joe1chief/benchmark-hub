meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: IQTest 构建流程
  description: 对齐 MathVista 论文中三项新标注数据之一的 IQTest：从在线学习平台收集智力测试图形，独立标注并复核， 接入 MathVista 发布，再沿统一答案抽取协议评分。
  legend: 99.2% 一致率统计覆盖 IQTest、FunctionQA、PaperQA 共 736 个新标问题；IQTest 自身包含 228 个样本。
nodes:
  - id: gap
    label: |-
      识别 MathVista 覆盖缺口
      智力测试图形上的逻辑推理
      归纳 · 抽象 · 模式预测
      结合视觉上下文进行计算
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: source
    label: |-
      收集智力测试图形
      来源为在线学习平台
      保留视觉问题上下文
      形成 228 个 IQTest 样本
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: annotate
    label: |-
      人工问答标注
      由 STEM 领域研究生执行
      编写问题、选项或数值目标
      记录正确答案
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: triple
    label: |-
      三人独立复核
      每项新数据由三位评审独立检查
      比较各自标注答案
      将分歧送入消歧流程
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: consensus
    label: |-
      质量复核与共识
      736 个新标问题初始一致率 99.2%
      仅 6 个答案存在分歧
      全体团队讨论解决每个分歧
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: dataset
    label: |-
      最终 IQTest 子集 · 228
      智力测试图形问答
      英文 · 小学年级标签
      逻辑与算术推理
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: split
    label: |-
      接入 MathVista
      标注题型、答案、语言、来源
      类别、任务、年级、视觉上下文与技能
      按分布保持策略划分 Testmini / Test
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: run
    label: |-
      生成模型回答
      输入智力测试图形 + 问题
      携带选项与任务元数据
      支持选择题与自由回答
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: extract
    label: |-
      抽取短答案
      已是短答案时直接按规则抽取
      否则使用 GPT-4 答案抽取器
      200 题研究中准确率超过 99.5%
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: normalize
    label: |-
      归一化预测
      将选项字母映射为选项文本
      解析整数或数值回答
      对齐规定的答案格式
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: metric
    label: |-
      汇报确定性准确率
      归一化后严格相等
      汇报总体与来源细粒度得分
      隐藏 Test 标签通过在线平台评测
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: gap
    to: source
    type: primary
  - from: source
    to: annotate
    type: primary
  - from: annotate
    to: triple
    type: primary
  - from: triple
    to: consensus
    type: primary
  - from: consensus
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: run
    type: primary
  - from: run
    to: extract
    type: primary
  - from: extract
    to: normalize
    type: primary
  - from: normalize
    to: metric
    type: primary
modules: []
