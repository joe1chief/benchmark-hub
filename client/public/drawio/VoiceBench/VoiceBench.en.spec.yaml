meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VoiceBench — Spoken Data Construction, Robustness, and Metrics
  description: >-
    VoiceBench paper-v3 adapts seven capability datasets with 636/200/553/455/3,074/345/520 samples. Capability and
    robustness are parallel benchmark components. CommonEval and SD-QA use real spoken instructions; the synthetic-only
    capability path normalizes TTS text with GPT-4o, generates audio with Google TTS, manually checks correctness and
    the 30-second limit, and rewrites text when needed. Robustness seeds are source-constrained: AlpacaEval supplies
    speed, age, volume, pitch, environment, content-error, and synthetic-accent variants (with Google/Melo TTS), while
    SD-QA supplies real-accent speech. Evaluation compares ground-truth text (T.) with speech (S.) and uses
    task-specific metrics. The paper reports an Overall column, but neither the paper nor official evaluation code
    publishes the aggregation formula.
  legend: >-
    Source: arXiv:2410.17196v3, Sections 3.1-3.2, Tables 2-3, and the official repository
    https://github.com/MatthewCYM/VoiceBench. The paper defines capability and robustness as parallel benchmark
    components. GPT-4o text normalization, Google TTS, manual correctness validation, rewriting when needed, and the
    30-second cap apply to the synthetic path; CommonEval and SD-QA use real speech. Table 3 reports an Overall column,
    but neither the paper nor the official evaluation code publishes its aggregation formula.. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
