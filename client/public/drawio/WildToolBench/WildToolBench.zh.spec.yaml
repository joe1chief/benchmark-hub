meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildToolBench 多任务Session构建、DAG质检与评测
  description: >-
    WildToolBench 分析大规模真实用户工具日志，归纳场景与三类挑战：组合任务工具编排、通过对话推断隐藏意图、以及指令转换下的自适应策略切换。原始日志不发布，仅均匀抽样为受控 User Agent 提供 few-shot
    范例，并改变句法、风格、背景、长度和难度。基准收集1,600+个公开 API，清洗为400个 tool lists，覆盖广泛参数类型并由5名专家修复。256个 session
    每个包含4个相互关联的任务：首任务从四类中选择，随后三个任务体现部分信息省略、指代依赖或长距离依赖。Assistant 轨迹先自动检查，再由5名专家修正，之后人工标注依赖 DAG。9名专家历时1个月，每轮随机复核20%，四轮 QC
    会解决冲突、改写过度规整的对话、丰富意图切换并修正调用，直至抽检错误率为0且冲突全部解决。最终1,024个任务覆盖8个大类和24个子类，平均每个 session 5.27轮、1.92个工具调用步骤。评测报告 Task
    Accuracy、四任务全对的 Session Accuracy、Optimal Path Rate 与 Accomplishment Progress Rate。
  legend: >-
    来源：WildToolBench, Benchmarking LLM Tool-Use in the Wild, arXiv:2604.06185v1 (2026-02-13; ICLR 2026), Sections
    3.1-3.6, Sections 4.1-4.2, the dependency-DAG algorithm appendix, and Appendix C; official repository
    https://github.com/yupeijei1997/WildToolBench. Hard identity guard: WildToolBench is not WildBench arXiv:2406.04770
    and is unrelated to https://github.com/allenai/WildBench. Count units must remain explicit: 256 scenarios/sessions x
    4 linked tasks = 1,024 tasks; the four tasks are not independent rows. API counts are reported as 1,600+ collected
    public APIs, approximately 1,600 APIs retained across 400 tool lists. The human dependency DAG is annotated only
    after trajectory correction, and the 62% -> 78% -> 86% -> 94% -> 100% sequence is a QC progression, not a model
    score.。实线箭头表示论文或官方资料明确支持的主流程。
