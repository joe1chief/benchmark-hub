meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildClawBench 可执行任务策划与四 Harness 评测流程
  description: >-
    WildClawBench 将每个任务封装为 Markdown/YAML 规范、工作区资产、rubric、可执行 grader 以及仅在退出后挂载的隐藏评分材料。八名研究者与专家通过前沿模型试跑、分差不低于 0.2
    的区分度门槛、题面/轨迹/评分器联合审查和稳定复现复检迭代，最终保留 60 个可执行任务。运行时同一任务分发到 OpenClaw、Claude Code、Codex 和 Hermes 的隔离 Docker
    环境；超时保留部分产物，隐藏 ground truth 仅在退出后挂载，最多三条证据通道再进入 rubric 与按任务数加权的评分。
  legend: >-
    来源：WildClawBench arXiv:2605.10912v1 (2026-05-11), Sections 3.1-3.4, Figure 4, Tables 1-2; official repository
    https://github.com/internlm/WildClawBench, May-2026 release. The benchmark compares four practical harness
    configurations with their own system prompts, tool schemas, and context; it does not impose one identical system
    prompt.。实线箭头表示论文或官方资料明确支持的主流程。
