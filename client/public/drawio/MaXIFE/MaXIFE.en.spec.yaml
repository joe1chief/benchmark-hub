meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MaXIFE Build Process
  description: >-
    Paper-aligned multilingual question and instruction construction, dual translation quality control, and hybrid
    evaluation in MaXIFE.
  legend: >-
    Solid arrows trace requirements collection, question and instruction expansion, 23-language construction, rule or
    model verification, and loose or strict aggregation.
nodes:
  - id: questionnaire
    label: |-
      Gather Real-user Needs
      Survey In-group Researchers
      Include Other Researchers
      Consult Natives · Linguists
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: expand_questions
    label: |-
      Expand Basic Questions
      Use GPT-4o and
      Claude-3.5 Sonnet
      Retain 795 Questions
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: select_instructions
    label: |-
      Select Verifiable Instructions
      Keep 47 High-quality Types
      Cover Single · Mixed Constraints
      Enable Automatic Checking
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: taxonomy
    label: |-
      Organize Instruction Taxonomy
      11 Categories · 47 Subtypes
      Templatize 18 Scalable Types
      Control Mix and Coverage
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: translate_questions
    label: |-
      Translate Basic Questions
      Expand English to 22 Languages
      Start with LLM Translation
      Native Review and Correction
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: translate_instructions
    label: |-
      Translate Constraint Instructions
      Use Professional Native Translators
      Require English Proficiency
      Preserve Language-specific Forms
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: translation_qc
    label: |-
      Run Human Language QC
      Check Uniqueness and Grammar
      Remove Ambiguity
      Preserve Parallel Meaning
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      Finalize MaXIFE
      795 Prompts per Language
      1–3 Instructions per Question
      18,285 Instances · 23 Languages
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: resource_levels
    label: |-
      Label Language Resources
      Combine Four Dimensions
      Add Expert · Native Feedback
      High · Medium · Low Resource
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: inference
    label: |-
      Generate Model Responses
      Set Temperature to Zero
      Cover 795 × 23 Prompts
      Test English-to-target Instructions
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: route_eval
    label: |-
      Route by Instruction Type
      Score Each Instruction 0–1
      Deterministic Checks Use Rules
      Semantic Checks Use a Judge
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: rule_eval
    label: |-
      Apply Rule-based Checks
      Seven Categories · 32 Subtypes
      Localize Numerals · Punctuation
      Binary or Tiered Scoring
    type: process
    size: xl
    position:
      x: 500
      'y': 300
  - id: model_eval
    label: |-
      Apply Model-based Checks
      Cover the Other 15 Instructions
      Use Specialized Judge Prompts
      Claude-3.5 Sonnet Scores
    type: process
    size: xl
    position:
      x: 500
      'y': 540
  - id: scores
    label: |-
      Aggregate Evaluation Results
      Loose: Mean over 1,667 Checks
      Strict: Non-perfect Becomes Zero
      Report Language · Type · Resource
    type: terminal
    size: xl
    position:
      x: 260
      'y': 420
