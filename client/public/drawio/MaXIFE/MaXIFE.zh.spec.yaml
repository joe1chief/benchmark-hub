meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MaXIFE 构建流程
  description: 与论文对齐地展示 MaXIFE 的多语言问题和指令构建、双轨翻译质检及混合评测流程。
  legend: 实线箭头依次表示需求收集、问题与指令扩展、23 语种构建、规则或模型核验，以及宽松分数与严格分数汇总。
nodes:
  - id: questionnaire
    label: |-
      收集真实用户需求
      调研组内与其他研究者
      邀请母语者和语言专家
      汇总基础问题种子
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: expand_questions
    label: |-
      扩展基础问题
      使用 GPT-4o 与
      Claude-3.5 Sonnet
      筛得 795 个问题
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: select_instructions
    label: |-
      筛选可验证指令
      保留 47 个高质量类型
      覆盖单项与组合约束
      为自动核验奠定基础
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: taxonomy
    label: |-
      组织指令体系
      11 个大类与 47 个子类
      模板化 18 个可扩展类型
      控制组合与覆盖范围
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: translate_questions
    label: |-
      翻译基础问题
      英文扩展至另 22 种语言
      先由大模型机器翻译
      再由母语者审校纠正
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: translate_instructions
    label: |-
      翻译约束指令
      使用专业母语译者
      译者同时精通英语
      保留语言特定表达
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: translation_qc
    label: |-
      执行人工语言质检
      检查唯一性和语法词汇
      消除歧义并保持平行性
      修订全部语言版本
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      定稿 MaXIFE
      23 种语言各 795 个提示
      每题组合 1–3 条指令
      共 18,285 条语言实例
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: resource_levels
    label: |-
      标注语言资源等级
      综合四个资源维度
      结合专家和母语者反馈
      划分高 · 中 · 低资源
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: inference
    label: |-
      生成模型回答
      温度设为 0
      覆盖 795 × 23 个提示
      另测英文指令跨语言遵循
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: route_eval
    label: |-
      按指令类型路由评测
      每条指令得到 0–1 分
      可确定核验走规则路径
      语义判断走模型路径
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: rule_eval
    label: |-
      执行规则核验
      覆盖 7 类 32 个子类
      适配各语言数字与标点
      使用二元或分级评分
    type: process
    size: xl
    position:
      x: 500
      'y': 300
  - id: model_eval
    label: |-
      执行模型核验
      覆盖其余 15 类指令
      使用专用裁判提示
      Claude-3.5 Sonnet 判分
    type: process
    size: xl
    position:
      x: 500
      'y': 540
  - id: scores
    label: |-
      汇总评测结果
      宽松分数平均 1,667 项
      严格分数将非满分置零
      按语言类别与资源量报告
    type: terminal
    size: xl
    position:
      x: 260
      'y': 420
edges:
  - from: questionnaire
    to: expand_questions
    type: primary
  - from: expand_questions
    to: select_instructions
    type: primary
  - from: select_instructions
    to: taxonomy
    type: primary
  - from: taxonomy
    to: translate_questions
    type: primary
  - from: translate_questions
    to: translate_instructions
    type: primary
  - from: translate_instructions
    to: translation_qc
    type: primary
  - from: translation_qc
    to: release
    type: primary
  - from: release
    to: resource_levels
    type: primary
  - from: resource_levels
    to: inference
    type: primary
  - from: inference
    to: route_eval
    type: primary
  - from: route_eval
    to: rule_eval
    type: primary
  - from: route_eval
    to: model_eval
    type: primary
  - from: rule_eval
    to: scores
    type: primary
  - from: model_eval
    to: scores
    type: primary
modules: []
