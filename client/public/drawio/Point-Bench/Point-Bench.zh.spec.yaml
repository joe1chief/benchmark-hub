meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Point-Bench 构建与评测流程
  description: 按PointArena论文构建五类共982组高难语言引导指向样例，包括模型难度过滤SAM辅助掩码标注独立复核和二元成功评分。
  legend: Point-Bench是PointArena的静态图像部分。图像发布于2025年4月20日之后，各模型分类结果取三次独立零样本运行的均值。
nodes:
  - id: step_1
    label: |-
      定义语言引导指向任务
      输入RGB图像与文本查询
      预测目标坐标点
      不依赖框评估视觉落点
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      收集近期公开图像
      使用2025-04-20后发布图像
      降低模型数据暴露可能
      保留多样真实场景
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      均衡五类任务
      空间 · 可供性 · 计数
      可操纵 · 推理
      匹配各类特定场景需求
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      众包编写自然查询
      向标注者展示抽样图像
      编写符合类别的请求
      可操纵类避免显式物体名
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      探测查询难度
      询问三个匿名多模态模型
      评测每条候选查询
      把输出交给人工评审
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      保留高难有效查询
      人工评审核实正确性
      至多允许一个模型答对
      剔除简单或歧义问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      标记目标点
      标注者识别全部目标
      在预期物体上放置点
      保留目标数量
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      生成初始目标掩码
      用标注点提示SAM
      分割预期目标物体
      产生二元掩码候选
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      人工细化掩码
      编辑错误掩码区域
      移除非预期部分
      让每个掩码对齐目标
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      独立核验掩码
      使用另一组标注者
      检查目标覆盖与边界
      修正剩余标注错误
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      发布982组图文样例
      保存查询与目标掩码
      保留五类标签
      保留计数目标数量
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      运行标准零样本指向
      要求输出x-y坐标格式
      每条查询预测K个点
      非计数任务要求一个点
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      应用二元成功标准
      要求K等于目标数K星
      每个掩码至少被一点覆盖
      非计数多输出时仅取第一点
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告Point-Bench成功率
      16个模型评测全部982组
      运行三次独立试验
      汇总五类均值与标准差
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: step_1
    to: step_2
    type: primary
  - from: step_2
    to: step_3
    type: primary
  - from: step_3
    to: step_4
    type: primary
  - from: step_4
    to: step_5
    type: primary
  - from: step_5
    to: step_6
    type: primary
  - from: step_6
    to: step_7
    type: primary
  - from: step_7
    to: step_8
    type: primary
  - from: step_8
    to: step_9
    type: primary
  - from: step_9
    to: step_10
    type: primary
  - from: step_10
    to: step_11
    type: primary
  - from: step_11
    to: step_12
    type: primary
  - from: step_12
    to: step_13
    type: primary
  - from: step_13
    to: step_14
    type: primary
modules: []
