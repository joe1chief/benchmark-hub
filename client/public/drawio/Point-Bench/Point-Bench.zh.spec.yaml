meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Point-Bench 构建与评测流程
  description: 按固定来源重建Point-Bench图像与查询收集、三模型难度筛选、SAM辅助目标掩码标注、独立核验及论文定义的逐区域成功评分。
  legend: 实线复现PointArena论文中的静态Point-Bench流程。虚线标识固定证据、公开数据快照、论文与发布实现漂移以及许可证边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2505.09990v2
      PDF f2b79d4f8656
      官方代码 16dab315e6e4
      HF数据 77ec5dca697b
    type: document
    size: xl
    position:
      x: 20
      'y': 300
    style:
      fontSize: 10
  - id: task_formulation
    label: |-
      定义语言引导指向
      输入RGB图像I与查询q
      预测K个图像坐标点
      以K星个二元
      目标区域监督
    type: document
    size: xl
    position:
      x: 260
      'y': 300
    style:
      fontSize: 9
  - id: recent_images
    label: |-
      收集近期公开图像
      发布于 2025-04-20 之后
      使用适合类别的场景
      PixMo图像带参考点
      用于可操控类任务
    type: database
    size: xl
    position:
      x: 500
      'y': 300
    style:
      fontSize: 9
  - id: category_scope
    label: |-
      组织五个类别
      空间 · 可供性 · 计数
      可操控 · 推理
      论文称类别均匀划分
      场景选择引导查询类型
    type: process
    size: xl
    position:
      x: 740
      'y': 300
    style:
      fontSize: 9
  - id: query_authoring
    label: |-
      众包编写自然查询
      展示抽样的类别图像
      允许标注者自由提问
      贴合类别主题
      可操控类避免物体名称
    type: process
    size: xl
    position:
      x: 980
      'y': 300
    style:
      fontSize: 9
  - id: model_probe
    label: |-
      探测每条候选查询
      收集三个匿名
      多模态模型的预测
      人工评估者判断
      哪些预测正确
    type: process
    size: xl
    position:
      x: 1220
      'y': 300
    style:
      fontSize: 9
  - id: hardness_gate
    label: |-
      应用难度门槛
      统计模型正确预测数
      仅当三个模型中
      零个或一个正确时接受
    type: process
    size: xl
    position:
      x: 1460
      'y': 300
  - id: excluded_query
    label: |-
      排除较易候选
      超过一个模型
      被判定为正确
      不加入Point-Bench
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 40
  - id: target_points
    label: |-
      标注预期目标
      使用同一个Gradio界面
      直接在图像上
      放置目标点
      保留目标数量
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
    style:
      fontSize: 9
  - id: sam_masks
    label: |-
      生成初始掩码
      用选定目标点
      提示SAM
      为预期目标产生
      二元区域
    type: process
    size: xl
    position:
      x: 1940
      'y': 300
    style:
      fontSize: 9
  - id: refine_masks
    label: |-
      人工细化掩码
      提交前编辑
      或移除部分区域
      使用网格界面
      保持与查询一致
    type: process
    size: xl
    position:
      x: 2180
      'y': 300
    style:
      fontSize: 9
  - id: verify_masks
    label: |-
      独立核验掩码
      另一组标注者
      检查每个掩码
      是否准确对应
      用户生成的查询
    type: process
    size: xl
    position:
      x: 2420
      'y': 300
    style:
      fontSize: 9
  - id: paper_dataset
    label: |-
      论文最终Point-Bench
      982组图像查询对
      像素级目标掩码
      五个任务驱动类别
      静态真值评测
    type: database
    size: xl
    position:
      x: 2660
      'y': 300
  - id: zero_shot_eval
    label: |-
      运行零样本评测
      16个开源与闭源模型
      每个模型使用相同982组
      标准输出为x y
      兼容模型原生坐标格式
    type: process
    size: xl
    position:
      x: 2900
      'y': 300
    style:
      fontSize: 9
  - id: task_mode
    label: |-
      按任务模式分支
      非计数任务要求一个点
      计数任务要求
      多个目标点
    type: process
    size: xl
    position:
      x: 3140
      'y': 300
  - id: non_counting
    label: |-
      解析非计数输出
      保留单个预测点
      如返回额外点
      仅评测第一个
    type: process
    size: xl
    position:
      x: 3380
      'y': 100
  - id: counting
    label: |-
      解析计数输出
      保留预测点集合
      为K星个目标区域
      保留K个预测
    type: process
    size: xl
    position:
      x: 3380
      'y': 500
  - id: paper_success
    label: |-
      应用论文成功标准
      要求K等于K星
      每个目标区域至少包含
      一个预测点
      每条样例记二元得分
    type: process
    size: xl
    position:
      x: 3620
      'y': 300
    style:
      fontSize: 9
  - id: report
    label: |-
      报告Point-Bench成功率
      每个模型独立运行三次
      报告均值与标准差
      分类别得分与平均值
      覆盖全部982组
    type: terminal
    size: xl
    position:
      x: 3860
      'y': 300
    style:
      fontSize: 9
  - id: release_snapshot
    label: |-
      固定公开数据快照
      HF 77ec5dca697b
      data.json SHA eb747f8f9c6d
      图像LFS SHA a82914086ddc
      掩码LFS SHA a2c93869e659
    type: document
    size: xl
    position:
      x: 2660
      'y': 760
    style:
      fontSize: 9
  - id: release_counts
    label: |-
      发布类别事实
      affordable 198 · 计数196
      推理193 · 空间195
      可操控200 · 合计982
      affordable与论文类别名不同
    type: document
    size: xl
    position:
      x: 2900
      'y': 980
    style:
      fontSize: 9
  - id: implementation_boundary
    label: |-
      论文与代码评分边界
      发布版每条仅有一个掩码文件
      评测器检查数量以及
      每个点是否落入该掩码
      未检查各区域恰被覆盖一次
    type: document
    size: xl
    position:
      x: 3620
      'y': 860
    style:
      fontSize: 9
  - id: license_boundary
    label: |-
      许可证边界
      固定代码无LICENSE文件
      固定HF卡片未声明许可证
      公开访问不等于已明确
      图像或数据集复用条款
    type: document
    size: xl
    position:
      x: 2660
      'y': 1200
    style:
      fontSize: 9
edges:
  - from: source_evidence
    to: task_formulation
    type: secondary
    style:
      dashed: true
  - from: task_formulation
    to: recent_images
    type: primary
  - from: recent_images
    to: category_scope
    type: primary
  - from: category_scope
    to: query_authoring
    type: primary
  - from: query_authoring
    to: model_probe
    type: primary
  - from: model_probe
    to: hardness_gate
    type: primary
  - from: hardness_gate
    to: excluded_query
    type: primary
  - from: hardness_gate
    to: target_points
    type: primary
  - from: target_points
    to: sam_masks
    type: primary
  - from: sam_masks
    to: refine_masks
    type: primary
  - from: refine_masks
    to: verify_masks
    type: primary
  - from: verify_masks
    to: paper_dataset
    type: primary
  - from: paper_dataset
    to: zero_shot_eval
    type: primary
  - from: zero_shot_eval
    to: task_mode
    type: primary
  - from: task_mode
    to: non_counting
    type: primary
  - from: task_mode
    to: counting
    type: primary
  - from: non_counting
    to: paper_success
    type: primary
  - from: counting
    to: paper_success
    type: primary
  - from: paper_success
