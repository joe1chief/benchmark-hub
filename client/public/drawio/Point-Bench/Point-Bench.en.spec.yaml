      steerable 200 · Total 982
      affordable Differs from Paper Name
    type: document
    size: xl
    position:
      x: 2900
      'y': 980
    style:
      fontSize: 9
  - id: implementation_boundary
    label: |-
      Paper-to-code Scoring Boundary
      Release Has One Mask File per Item
      Evaluator Checks Count and Whether
      Every Point Lies in That Mask
