meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Point-Bench Build and Evaluation Process
  description: >-
    PointArena paper-aligned construction of 982 difficult language-guided pointing pairs across five categories,
    including model hardness filtering, SAM-assisted mask annotation, independent verification, and binary success
    scoring.
  legend: >-
    Point-Bench is the static-image component of PointArena. Images were posted after April 20, 2025, and every
    model-category result is averaged over three independent zero-shot runs.
nodes:
  - id: step_1
    label: |-
      Define Language-Guided Pointing
      Input an RGB image and text query
      Predict target coordinate points
      Evaluate grounding without boxes
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      Gather Recent Public Images
      Use images posted after 2025-04-20
      Reduce likely model-data exposure
      Preserve diverse real-world scenes
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      Balance Five Categories
      Spatial · affordance · counting
      steerable · reasoning
      Match category-specific scene needs
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      Crowdsource Natural Queries
      Show annotators sampled images
      Write category-aligned requests
      Avoid explicit names in steerable items
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      Probe Query Difficulty
      Ask three anonymized MLLMs
      Evaluate each draft query
      Send outputs to human judges
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      Keep Hard Valid Queries
      Human judges verify correctness
      Accept at most one model correct
      Reject easy or ambiguous prompts
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      Mark Target Points
      Annotators identify all targets
      Place points on intended objects
      Preserve target multiplicity
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      Generate Initial Target Masks
      Seed SAM with annotated points
      Segment the intended objects
      Produce binary mask candidates
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      Refine the Masks Manually
      Edit incorrect mask regions
      Remove unintended portions
      Align every mask with its target
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      Independently Verify Masks
      Use a separate annotator group
      Check target coverage and boundaries
      Correct remaining annotation errors
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      Release 982 Text-Image Pairs
      Store query and target masks
      Keep five category labels
      Preserve counting target counts
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      Run Standardized Zero-Shot Pointing
      Request coordinates in x-y format
      Predict K points per query
      Use one point for non-counting tasks
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      Apply Binary Success Criteria
      Require K equal to target count K star
      Cover every mask with a point
      Use only first extra non-counting point
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      Report Point-Bench Success Rate
      Evaluate 16 MLLMs on all 982 pairs
      Run three independent trials
      Mean and deviation over five categories
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
