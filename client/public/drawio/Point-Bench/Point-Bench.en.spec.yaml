meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Point-Bench Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of Point-Bench image and query collection, three-model hardness selection,
    SAM-assisted target-mask annotation, independent verification, and paper-defined region-wise success scoring.
  legend: >-
    Solid arrows reproduce the PointArena paper's static Point-Bench workflow. Dashed arrows identify fixed evidence,
    the public data snapshot, paper-to-release implementation drift, and license boundaries.
