    type: process
    size: xl
    position:
      x: 3380
      'y': 500
  - id: paper_success
    label: |-
      Apply Paper Success Criteria
      Require K Equals K-star
      Every Target Region Must Contain
      at Least One Predicted Point
      Score Each Item as Binary
    type: process
    size: xl
    position:
      x: 3620
      'y': 300
    style:
      fontSize: 9
  - id: report
    label: |-
      Report Point-Bench Success Rate
