meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenExam Build Process
  description: Paper-and-release-aligned taxonomy, image curation, annotation, Mini sampling, generation, judging, and scoring.
  legend: >-
    Dashed arrow denotes pinned evidence; solid arrows follow arXiv:2509.14232v5 and the official release. The 250-item
    Mini count is pinned by paper Figure 8 and the released mini_sample_ids.txt.
nodes:
  - id: evidence
    label: |-
      Primary evidence
      arXiv:2509.14232v5
      repo 6f324dd1 · data 0782259d
    type: document
    size: xl
    position:
      x: 40
      'y': 100
  - id: taxonomy
    label: |-
      Define ISCED-F-aligned taxonomy
      10 subjects · four levels
      10/40/132/236 categories
    type: process
    size: xl
    position:
      x: 300
      'y': 100
  - id: collect
    label: |-
      Collect 40K candidate images
      exam/textbook Web search
      seven subject datasets + descriptions
    type: database
    size: xl
    position:
      x: 560
      'y': 100
  - id: heuristic_filter
    label: |-
      Apply heuristic filtering
      duplicates · low resolution · watermarks
      non-English text
    type: process
    size: xl
    position:
      x: 820
      'y': 100
  - id: gpt_filter
    label: |-
      GPT-5 rates four aspects
      text richness · domain · complexity
      subject density → retain 6.5K
    type: process
    size: xl
    position:
      x: 1080
      'y': 100
  - id: draft
    label: |-
      GPT-5 drafts exam prompts
      atomic yes/no scoring questions
      weights sum to 1
    type: process
    size: xl
    position:
      x: 1340
      'y': 100
  - id: review
    label: |-
      Three PhD annotators cross-validate
      image · prompt · scoring points
      remove or repair imprecise items
    type: process
    size: xl
    position:
      x: 1340
      'y': 400
  - id: release
    label: |-
      Release GenExam-Full: 1,000
      10 subjects · ground-truth images
      mean 74.8 words · 6.9 scoring points
    type: database
    size: xl
    position:
      x: 1080
      'y': 400
  - id: mini
    label: |-
      Derive GenExam-Mini: 250
      level-3 stratified sampling
      match Full subject distribution
    type: database
    size: xl
    position:
      x: 820
      'y': 400
  - id: generate
    label: |-
      Generate one image per prompt
      each model's default T2I setup
      run Full or Mini
    type: process
    size: xl
    position:
      x: 560
      'y': 400
  - id: judge
    label: |-
      GPT-5-2025-08-07 · low effort
      prompt + generated + reference images
      yes/no points; three global 0–2 ratings
    type: process
    size: xl
    position:
      x: 300
      'y': 400
  - id: score
    label: |-
      Report Strict and Relaxed scores
      Strict: all points yes; globals all 2
      Relaxed: semantic × .7
      + each global rating × .1 / 2
    type: terminal
    size: xl
    position:
      x: 40
      'y': 400
