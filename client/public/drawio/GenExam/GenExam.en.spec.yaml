meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenExam Build Process
  description: Paper-aligned multidisciplinary image collection, annotation, expert review, and strict/relaxed evaluation flow.
  legend: >-
    GenExam turns subject-specific drawing questions into a text-to-image exam with ground-truth images and per-sample
    scoring points; counts and formulas follow arXiv:2509.14232.
nodes:
  - id: taxonomy
    label: |-
      Define an ISCED-F-aligned taxonomy
      10 subjects · four levels
      10/40/132/236 categories by level
    type: process
    size: xl
    position:
      x: 40
      'y': 300
  - id: collect
    label: |-
      Collect about 40K candidate images
      exams/textbooks via taxonomy Web search
      plus 7 subject-knowledge datasets
    type: database
    size: xl
    position:
      x: 340
      'y': 300
  - id: filter
    label: |-
      Apply heuristic filters
      remove duplicates · low resolution · watermarks
      and non-English text
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: gpt_filter
    label: |-
      GPT-5 rates four image aspects
      text richness · domain · complexity
      subject-knowledge density → retain 6.5K
    type: process
    size: xl
    position:
      x: 940
      'y': 300
  - id: draft
    label: |-
      GPT-5 drafts exam-style prompts
      create atomic yes/no scoring questions
      weight each set to sum to 1
    type: process
    size: xl
    position:
      x: 1240
      'y': 300
  - id: review
    label: |-
      Three PhD annotators cross-validate
      image · prompt · scoring points
      remove duplicates and repair imprecision
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: release
    label: |-
      Release 1,000 exam samples
      10 subjects · ground-truth image
      mean 74.8 words and 6.9 scoring points
    type: database
    size: xl
    position:
      x: 1840
      'y': 300
  - id: mini
    label: |-
      Derive GenExam-Mini
      level-3 stratified sampling
      keep a similar full-set distribution · 487 items
    type: database
    size: xl
    position:
      x: 2140
      'y': 300
  - id: generate
    label: |-
      Generate one image from each prompt
      use each model's default T2I settings
      evaluate full set or Mini
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: judge
    label: |-
      GPT-5 judge uses the reference image
      answer scoring points → semantic 0–1
      rate spelling/logic/readability 0–2
    type: process
    size: xl
    position:
      x: 2740
      'y': 300
  - id: score
    label: |-
      Report strict and relaxed scores
      strict requires semantic 1
      and spelling, logic, readability all 2
      relaxed weights 0.7/0.1/0.1/0.1
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 300
edges:
  - from: taxonomy
    to: collect
    type: primary
  - from: collect
    to: filter
    type: primary
  - from: filter
    to: gpt_filter
    type: primary
  - from: gpt_filter
    to: draft
    type: primary
  - from: draft
    to: review
    type: primary
  - from: review
    to: release
    type: primary
  - from: release
    to: mini
    type: primary
  - from: mini
    to: generate
    type: primary
  - from: generate
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
