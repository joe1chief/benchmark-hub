meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Design2Code 构建流程
  description: 依据论文呈现从 C4 整理真实网页截图到代码测试集的过程，以及通过高层与元素级视觉指标比较渲染页面、 再以人类成对偏好验证指标的评测协议。
  legend: 上行从左到右阅读主基准构建，下行从右到左阅读截图到代码评测；橙色节点区分 C4 主集与独立来源的 HARD 集。
nodes:
  - id: c4
    label: |-
      C4 验证集网页链接
      抓取真实世界网页
      将全部 CSS 内联为单个 HTML 文件
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: raw
    label: |-
      初始真实网页池
      127.9k 个自包含 HTML 页面
      保留真实布局与内容复杂度
    type: database
    size: xl
    position:
      x: 320
      'y': 100
  - id: auto_filter
    label: |-
      自动过滤与去重
      移除过长或过于简单页面
      127.9k -> 14k 个候选
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: isolate
    label: |-
      转换为可评测页面
      移除外部依赖
      用占位符替换多媒体内容
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: manual
    label: |-
      两位作者人工筛选
      先共同标注 200 页并达 75% 一致率
      审查 7k 页的质量、安全、格式与多样性
    type: user
    size: xl
    position:
      x: 1160
      'y': 100
  - id: sets
    label: |-
      两套评测集
      主集：484 个 C4 真实网页
      独立 HARD：80 个 GitHub 网页并沿用同类过滤
    type: decision
    size: xl
    position:
      x: 1440
      'y': 100
  - id: screenshot
    label: |-
      模型输入
      参考网页截图
      直接、文本增强或自修订提示
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: code
    label: |-
      多模态代码生成
      生成 HTML 与 CSS 实现
      不向模型暴露参考源码
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: render
    label: |-
      浏览器渲染
      执行生成的页面实现
      捕获生成网页截图
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: match
    label: |-
      页面元素检测与匹配
      文本块与非文本块
      按文本相似度做匈牙利匹配
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      自动视觉指标
      块匹配、文本、位置与颜色
      高层 CLIP 相似度
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: human
    label: |-
      人工验证与报告
      100 个样本 x 5 人并取多数票
      指标预测成对偏好的准确率为 79.9%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: c4
    to: raw
    type: primary
  - from: raw
    to: auto_filter
    type: primary
  - from: auto_filter
    to: isolate
    type: primary
  - from: isolate
    to: manual
    type: primary
  - from: manual
    to: sets
    type: primary
  - from: sets
    to: screenshot
    type: primary
  - from: screenshot
    to: code
    type: primary
  - from: code
    to: render
    type: primary
  - from: render
    to: match
    type: primary
  - from: match
    to: metrics
    type: primary
  - from: metrics
    to: human
    type: primary
modules: []
