meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Design2Code Build Process
  description: >-
    Paper-aligned curation of real-world screenshot-to-code test pages from C4, followed by rendered-page comparison
    using high-level and element-level visual metrics validated against human pairwise preferences.
  legend: >-
    Read the main benchmark curation row left-to-right, then the screenshot-to-code evaluation row right-to-left; orange
    distinguishes the main C4 set from the separately sourced HARD set.
nodes:
  - id: c4
    label: |-
      C4 Validation Web Links
      Scrape Real-World Pages
      Inline All CSS into One HTML File per Page
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: raw
    label: |-
      Initial Real-Web Pool
      127.9k Self-Contained HTML Pages
      Preserve Real Layout and Content Complexity
    type: database
    size: xl
    position:
      x: 320
      'y': 100
  - id: auto_filter
    label: |-
      Automatic Filtering + Deduplication
      Remove Pages Too Long or Too Simple
      127.9k -> 14k Candidates
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: isolate
    label: |-
      Make Pages Evaluation-Ready
      Remove External Dependencies
      Replace Multimedia with Placeholders
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: manual
    label: |-
      Two-Author Manual Curation
      Align on 200 Pages at 75% Agreement
      Review 7k for Quality / Safety / Format / Diversity
    type: user
    size: xl
    position:
      x: 1160
      'y': 100
  - id: sets
    label: |-
      Two Evaluation Sets
      Main: 484 C4 Real Pages
      Separate HARD: 80 GitHub Pages via Same Filters
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: screenshot
    label: |-
      Model Input
      Reference Webpage Screenshot
      Direct / Text-Augmented / Self-Revision Prompts
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: code
    label: |-
      Multimodal Code Generation
      Produce HTML + CSS Implementation
      No Reference Source Code Exposed
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: render
    label: |-
      Browser Rendering
      Execute Generated Implementation
      Capture Generated Webpage Screenshot
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: match
    label: |-
      Element Detection and Matching
      Text + Non-Text Blocks
      Hungarian Assignment from Text Similarity
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: metrics
    label: |-
      Automatic Visual Metrics
      Block-Match / Text / Position / Color
      High-Level CLIP Similarity
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: human
    label: |-
      Human Validation and Reporting
      100 Examples x 5 Annotators + Majority Vote
      Metrics Predict Pairwise Preference at 79.9% Accuracy
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: c4
    to: raw
    type: primary
  - from: raw
    to: auto_filter
    type: primary
  - from: auto_filter
    to: isolate
    type: primary
  - from: isolate
    to: manual
    type: primary
  - from: manual
    to: sets
    type: primary
  - from: sets
    to: screenshot
    type: primary
  - from: screenshot
    to: code
    type: primary
  - from: code
    to: render
    type: primary
  - from: render
    to: match
    type: primary
  - from: match
    to: metrics
    type: primary
  - from: metrics
    to: human
    type: primary
modules: []
