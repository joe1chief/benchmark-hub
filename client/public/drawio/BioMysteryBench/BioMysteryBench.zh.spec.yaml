meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BioMysteryBench v11 构建流程
  description: 对齐 Anthropic 2026-04-29 方法文章与官方 Hugging Face 发布，展示当前 v11 构建、人类基线、答案键审计、反作弊环境及五次全有或全无评分。
  legend: 实线表示共用路径；虚线表示无人答对题目进入额外质量复核。
nodes:
  - id: raw_data
    label: |-
      真实原始或最小处理组学数据
      测序 • 蛋白质组 • 代谢组
      客观可控属性或经正交验证的元数据
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: experts
    label: |-
      领域专家编写科研谜题
      开放式研究分析
      避免主观科学结论
    type: user
    size: xl
    position:
      x: 320
      'y': 180
  - id: objective_truth
    label: |-
      锚定客观真值
      数据可控属性或正交验证
      与方法无关的生物学结论
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: validation
    label: |-
      强制提交验证 Notebook
      证明数据中确实存在所需信号
      在公开打包前验证答案
    type: process
    size: xl
    position:
      x: 880
      'y': 180
  - id: package
    label: |-
      打包每道题
      问题 • 匿名数据 • 答案 Rubric
      允许域名与数据使用条款
    type: document
    size: xl
    position:
      x: 1160
      'y': 180
  - id: human_trials
    label: |-
      最多五位领域专家从头作答
      记录相互独立的尝试
      不接触基准答案键
    type: user
    size: xl
    position:
      x: 1440
      'y': 180
  - id: solvability
    label: |-
      至少一位人类答对？
      是 → 人类可解
      零人答对 → 额外质量复核
    type: decision
    size: xl
    position:
      x: 1720
      'y': 180
  - id: hard_qc
    label: |-
      零人答对题目额外复核
      基准构建者与其他专家
      区分坏题和真正的人类困难题
    type: process
    size: xl
    position:
      x: 1720
      'y': 460
  - id: historical_v8
    label: |-
      历史 v8 发布
      99 题：76 题可解 / 23 题困难
      2026 年 4 月文章对应版本
    type: database
    size: xl
    position:
      x: 1440
      'y': 540
  - id: v11_audit
    label: |-
      2026 年 6 月全量答案键审计
      专家生物信息学家重跑每道题
      多模型复核 • 删除 9 题 • 修订 24 题
    type: process
    size: xl
    position:
      x: 1160
      'y': 540
  - id: release
    label: |-
      当前 BioMysteryBench v11
      90 题 = 73 题人类可解 + 17 题人类困难
      官方完整数据集修订版
    type: database
    size: xl
    position:
      x: 880
      'y': 540
  - id: access_policy
    label: |-
      反作弊与访问策略
      禁止通过 Accession ID 反向查找来源
      允许标准数据库、序列注释、参考基因组与 BLAST
    type: document
    size: xl
    position:
      x: 600
      'y': 540
  - id: environment
    label: |-
      可安装工具的生物信息学容器
      标准工具 • pip • conda
      可访问 NCBI、Ensembl 等标准资源
    type: process
    size: xl
    position:
      x: 320
      'y': 540
  - id: solve
    label: |-
      智能体每题运行五次 Episode
      可选择任意有效分析路径
      交替执行计算与生物学推理
    type: process
    size: xl
    position:
      x: 40
      'y': 540
  - id: grade
    label: |-
      最终答案 Rubric 全有或全无评分
      只评分正确的生物学结论
      不评分分析方法
    type: process
    size: xl
    position:
      x: 40
      'y': 820
  - id: report
    label: |-
      汇报正确率与求解一致性
      分开统计 73 道可解题与 17 道困难题
      展示每题 0/5 至 5/5 的次数
    type: terminal
    size: xl
    position:
      x: 320
      'y': 820
edges:
  - from: raw_data
    to: experts
    type: primary
  - from: experts
    to: objective_truth
    type: primary
  - from: objective_truth
    to: validation
    type: primary
  - from: validation
    to: package
    type: primary
  - from: package
    to: human_trials
    type: primary
  - from: human_trials
    to: solvability
    type: primary
  - from: solvability
    to: hard_qc
    type: optional
  - from: solvability
    to: historical_v8
    type: primary
  - from: hard_qc
    to: historical_v8
    type: optional
  - from: historical_v8
    to: v11_audit
    type: primary
  - from: v11_audit
    to: release
    type: primary
  - from: release
    to: access_policy
    type: primary
  - from: access_policy
    to: environment
    type: primary
  - from: environment
    to: solve
    type: primary
  - from: solve
    to: grade
    type: primary
  - from: grade
    to: report
    type: primary
modules: []
