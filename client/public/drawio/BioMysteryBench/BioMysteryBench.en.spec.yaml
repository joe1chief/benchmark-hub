meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BioMysteryBench Build Process
  description: >-
    Official-methodology-aligned construction and evaluation of 99 objective bioinformatics mysteries from messy,
    real-world omics data, with validation notebooks, expert human baselines, method-agnostic final-answer grading, and
    separate human-solvable and human-difficult reporting.
  legend: >-
    Solid arrows show task construction and evaluation; dashed arrows carry validation or expert-QC evidence into the
    released benchmark.
nodes:
  - id: raw_data
    label: |-
      Gather Raw or Minimally Processed Omics Data
      WGS • RNA-seq • scRNA-seq • Methylation • ChIP-seq
      Metagenomics • Hi-C • Proteomics • Metabolomics
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: experts
    label: |-
      Domain Experts Author Research Mysteries
      Draw from Diverse Bioinformatics Fields
      Use Real Experimental or Clinical Data
    type: user
    size: xl
    position:
      x: 320
      'y': 220
  - id: objective_truth
    label: |-
      Anchor Each Answer to Objective Ground Truth
      Controlled Data Property or Orthogonally Validated Metadata
      Avoid Subjective Scientific Conclusions
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: validation
    label: |-
      Submit a Validation Notebook
      Demonstrate that the Required Signal Exists
      Verification May Be Easier than Discovery
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: package
    label: |-
      Package Each Problem
      Question • Anonymized Data Archive • Answer Rubric
      Allowed Network Domains and Data-Use Terms
    type: document
    size: xl
    position:
      x: 880
      'y': 220
  - id: human_trials
    label: |-
      Ask up to Five Domain Experts to Solve from Scratch
      Mark Human-Solvable after One Correct Human Answer
      Retain Unsolved Items for Additional QC
    type: user
    size: xl
    position:
      x: 1160
      'y': 40
  - id: hard_qc
    label: |-
      Re-QC Human-Unsolved Problems
      Benchmarkers and Additional Experts Review Validity
      Remove Four Malformed or Broken Questions
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: release
    label: |-
      Release 99 BioMysteryBench Problems
      76 Human-Solvable • 23 Human-Difficult
      Full Data About 159 GB • CC BY 4.0 Task Materials
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: environment
    label: |-
      Prepare a Bioinformatics Container
      Minimal Canonical Tools • pip and conda Installation
      Access Approved Databases such as NCBI and Ensembl
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: solve
    label: |-
      Agent Performs End-to-End Analysis
      Interleave Computation with Biological Reasoning
      Choose Any Valid Analytical Route
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: grade
    label: |-
      Grade the Final Biological Conclusion
      Match the Objective Answer Rubric, Not the Method
      Run Five Episodes per Problem
    type: process
    size: xl
    position:
      x: 2280
      'y': 220
  - id: report
    label: |-
      Report Accuracy and Solve Consistency
      Separate 76 Solvable from 23 Difficult Problems
      Bootstrap within Problems and Show 0/5 to 5/5 Counts
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 220
