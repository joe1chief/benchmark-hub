meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BioMysteryBench v11 Build Process
  description: >-
    Current-v11 construction, human baselining, answer-key audit, anti-cheat environment, and all-or-nothing
    five-episode evaluation, aligned to Anthropic's 2026-04-29 methodology and official Hugging Face releases.
  legend: Solid arrows are the common path; dashed arrows route zero-human-correct tasks through additional QC.
nodes:
  - id: raw_data
    label: |-
      Raw or Minimally Processed Real Omics Data
      Sequencing • Proteomics • Metabolomics
      Objective Controlled Property or Validated Metadata
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: experts
    label: |-
      Domain Expert Authors a Mystery
      Open-Ended Research Analysis
      Avoid Subjective Scientific Conclusions
    type: user
    size: xl
    position:
      x: 320
      'y': 180
  - id: objective_truth
    label: |-
      Anchor the Objective Ground Truth
      Controlled Data Property or Orthogonal Validation
      Method-Agnostic Biological Conclusion
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: validation
    label: |-
      Mandatory Validation Notebook
      Demonstrate that the Required Signal Exists
      Verify the Answer before Public Packaging
    type: process
    size: xl
    position:
      x: 880
      'y': 180
  - id: package
    label: |-
      Package Each Problem
      Question • Anonymized Data • Answer Rubric
      Allowed Domains and Data-Use Terms
    type: document
    size: xl
    position:
      x: 1160
      'y': 180
  - id: human_trials
    label: |-
      Up to Five Domain Experts Solve from Scratch
      Record Independent Attempts
      No Benchmark Answer-Key Access
    type: user
    size: xl
    position:
      x: 1440
      'y': 180
  - id: solvability
    label: |-
      At Least One Human Correct?
      Yes → Human-Solvable
      Zero Correct → Additional QC
    type: decision
    size: xl
    position:
      x: 1720
      'y': 180
  - id: hard_qc
    label: |-
      Additional Zero-Correct QC
      Benchmarkers and Additional Experts
      Distinguish Broken from Genuinely Human-Hard
    type: process
    size: xl
    position:
      x: 1720
      'y': 460
  - id: historical_v8
    label: |-
      Historical v8 Release
      99 Problems: 76 Solvable / 23 Difficult
      Basis of the April 2026 Article
    type: database
    size: xl
    position:
      x: 1440
      'y': 540
  - id: v11_audit
    label: |-
      June 2026 Full Answer-Key Audit
      Every Problem Rerun by Expert Bioinformaticians
      Multiple Model Runs • Remove 9 • Revise 24
    type: process
    size: xl
    position:
      x: 1160
      'y': 540
  - id: release
    label: |-
      Current BioMysteryBench v11
      90 Problems = 73 Human-Solvable + 17 Human-Hard
      Official Full Dataset Revision
    type: database
    size: xl
    position:
      x: 880
      'y': 540
  - id: access_policy
    label: |-
      Anti-Cheat and Access Policy
      Accession-ID Reverse Lookup Is Prohibited
      Standard Databases, Annotation, References, and BLAST Allowed
    type: document
    size: xl
    position:
      x: 600
      'y': 540
  - id: environment
    label: |-
      Tool-Installable Bioinformatics Container
      Canonical Tools • pip • conda
      Approved Access to NCBI, Ensembl, and Standard Resources
    type: process
    size: xl
    position:
      x: 320
      'y': 540
  - id: solve
    label: |-
      Agent Solves Five Episodes per Problem
      Choose Any Valid Analytical Route
      Interleave Computation and Biological Reasoning
    type: process
    size: xl
    position:
      x: 40
      'y': 540
  - id: grade
    label: |-
      All-or-Nothing Final-Answer Rubric
      Score the Correct Biological Conclusion
      Do Not Grade the Analysis Method
    type: process
    size: xl
    position:
      x: 40
      'y': 820
  - id: report
    label: |-
      Report Accuracy and Solve Consistency
      Separate 73 Solvable from 17 Human-Hard
      Show Per-Problem 0/5 through 5/5 Counts
    type: terminal
    size: xl
    position:
      x: 320
      'y': 820
