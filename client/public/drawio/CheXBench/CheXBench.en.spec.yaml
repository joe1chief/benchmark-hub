meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CheXBench Build Process
  description: >-
    Paper-aligned CheXbench flow: 35-task taxonomy and 32 public datasets are engineered with official split boundaries;
    held-out cases form eight benchmark task types, while CheXinstruct/CheXagent training and the eight-radiologist
    reader study remain clearly separated from benchmark construction and scoring.
  legend: Solid arrows show benchmark construction and scoring; dashed arrows show model-training and clinical-study context.
nodes:
