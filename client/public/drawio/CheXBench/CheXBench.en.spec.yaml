      Accuracy • mIoU • mAP
      CheXbert-F1 • BERTScore • RadGraph-F1
      ROUGE-L for Findings Summarization
    type: process
    size: xl
    position:
      x: 2140
      'y': 400
  - id: report
    label: |-
      Report CheXbench Results
      Compare Eight Tasks across Three Axes
      Keep Clinical Utility Separate
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 400
