    label: |-
      Define 35 CXR Interpretation Tasks
      35 Tasks across 5 Categories
      Coarse-grained Image Perception
      Fine-grained Image Perception • Text Generation
      Question Answering • Miscellaneous
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: sources
    label: |-
      Collect 32 Public CXR Datasets
      1,077,494 Unique Images
      Reports • Labels • Boxes • Captions
    type: database
    size: xl
    position:
      x: 40
      'y': 520
  - id: engineering
    label: |-
      Manual Quality + Automated Engineering
      Filter Low-quality or Irrelevant Samples
      GPT-4 Restructures Free-form Reports
      Unify Files, Labels, and Task Mappings
    type: process
    size: xl
    position:
      x: 340
      'y': 320
  - id: split
    label: |-
      Preserve Official or Traditional Splits
      Keep Train, Validation, and Test Separate
      Prevent Leakage across Derived Tasks
    type: process
    size: xl
    position:
      x: 640
      'y': 320
  - id: instruct
    label: |-
      Training Context: CheXinstruct
      8,466,352 Instruction–Image–Response Triplets
      Sample from 10 Templates per Task
    type: database
    size: xl
    position:
      x: 940
      'y': 40
  - id: train
    label: |-
      Train CheXagent in Three Stages
      Clinical-text Language Decoder
      CXR–Report Image Encoder
      Joint Vision–Language Instruction Tuning
    type: process
    size: xl
    position:
      x: 1540
      'y': 40
  - id: axes
    label: |-
      Build Held-out CheXbench
      8 Task Types on 3 Evaluation Axes
      Image Perception • Reasoning • Generation
    type: document
    size: xl
    position:
      x: 940
      'y': 320
  - id: perception
    label: |-
      Image Perception: 3 Task Types
      View Classification: 600
      Temporal Classification: 62
      Disease Identification: 2,684
    type: database
    size: xl
    position:
      x: 1240
      'y': 200
  - id: reasoning
    label: |-
      Image–Text Reasoning: 3 Task Types
      Fine-grained Reasoning: 380
      VQA: 238 • Phrase Grounding: 149
    type: database
    size: xl
    position:
      x: 1240
      'y': 400
  - id: generation
    label: |-
      Text Generation: 2 Task Types
      Findings Generation: 2,451
      Findings Summarization: 1,394
    type: database
    size: xl
    position:
      x: 1240
      'y': 600
  - id: inputs
    label: |-
      Standardize Evaluation Inputs
      Instruction + One or More CXRs (+ Text)
      Multiple-choice • Boxes • Free Text
    type: process
    size: xl
    position:
      x: 1540
      'y': 400
  - id: models
    label: |-
      Compare Foundation and Task Models
      General-domain • Medical-domain • Proprietary
      CheXagent Enters via the Separate Training Path
    type: process
    size: xl
    position:
      x: 1840
      'y': 400
  - id: metrics
    label: |-
