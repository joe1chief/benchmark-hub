meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CheXBench Build Process
  description: >-
    Paper-aligned CheXBench flow: 35 CXR tasks and 32 public datasets undergo manual and automated engineering; held-out
    source splits form an eight-task, three-axis benchmark, while the separate CheXinstruct path trains CheXagent for
    comparison and an eight-radiologist reader study tests downstream clinical utility.
  legend: >-
    Solid arrows show benchmark construction and evaluation; dashed arrows show the separate model-training and
    clinical-study context.
nodes:
  - id: taxonomy
    label: |-
      Define 35 Clinically Relevant CXR Tasks
      Coarse/fine Perception • QA • Text Generation
      Miscellaneous Image–text Capabilities
    type: document
    size: xl
    position:
      x: 40
      'y': 40
  - id: sources
    label: |-
      Collect 32 Public CXR Datasets
      Images, Reports, Labels, Boxes, and Captions
      Diverse Institutions and Countries
    type: database
    size: xl
    position:
      x: 40
      'y': 400
  - id: engineering
    label: |-
      Manual + Automated Data Engineering
      Verify Quality; Unify Heterogeneous Structures
      Restructure Reports and Map Source Labels to Tasks
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: split
    label: |-
      Preserve Official Source Splits
      Hold Evaluation Cases out of Training
      Prevent Leakage between CheXinstruct and CheXBench
    type: decision
    size: xl
    position:
      x: 640
      'y': 220
  - id: instruct
    label: |-
      Training Context: CheXinstruct
      8.5M Instruction–Image–Response Triplets
      Ten Manually Defined Instruction Templates per Task
    type: database
    size: xl
    position:
      x: 940
      'y': 40
  - id: train
    label: |-
      Train CheXagent in Three Stages
      Clinical-text LM • CXR–report Vision Encoder
      Joint Vision-language Instruction Tuning
    type: process
    size: xl
    position:
      x: 1240
      'y': 40
  - id: axes
    label: |-
      Build CheXBench on Three Evaluation Axes
      Image Perception • Image–text Reasoning
      Text Generation
    type: document
    size: xl
    position:
      x: 940
      'y': 400
  - id: tasks
    label: |-
      Eight Clinically Relevant Task Types
      Views/Temporal/Disease • Fine-grained/VQA/Grounding
      Findings Generation and Summarization
    type: database
    size: xl
    position:
      x: 1240
      'y': 400
  - id: inputs
    label: |-
      Standardize Evaluation Inputs
      Instruction + One or More CXRs (+ Text if Required)
      Multiple-choice, Localization, and Free-text Outputs
    type: process
    size: xl
    position:
      x: 1540
      'y': 400
  - id: models
    label: |-
      Compare Foundation Models
      General-domain + Medical-domain Baselines
      CheXagent Uses the Separate Training Path
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: metrics
    label: |-
      Apply Task-specific Metrics
      Accuracy • mIoU/mAP • CheXbert-F1
      BERTScore • RadGraph-F1 • ROUGE-L
    type: process
    size: xl
    position:
      x: 2140
      'y': 220
  - id: expert_review
    label: |-
      Expert Review of Generated Findings
      Radiologists Compare Clinical Correctness
      Complement Automatic Text-generation Scores
    type: user
    size: xl
    position:
      x: 2440
      'y': 220
  - id: reader
    label: |-
      Separate Clinical Reader Study
      Eight Radiologists Draft/Edit Reports
      Measure Time, Writing Efficiency, and Quality
    type: user
    size: xl
    position:
      x: 2140
      'y': 440
  - id: report
    label: |-
      Report CheXBench Results
      Performance across Eight Tasks and Three Axes
      Keep Benchmark Results Separate from Reader-study Utility
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
