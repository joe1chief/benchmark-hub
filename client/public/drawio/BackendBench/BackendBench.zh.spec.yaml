meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BackendBench 构建流程
  description: 严格对齐 BackendBench 官方仓库的自定义 PyTorch backend 构建与评测实现；该项目没有独立论文，因此以软件合同和发布方法为一手来源。
  legend: 实线表示 backend 构建与评分主流程；虚线传递真实模型 trace、人工审计或正确性/性能反馈。
nodes:
  - id: pytorch_surface
    label: |-
      定义 PyTorch 算子范围
      271 个算子用于 OpInfo 正确性
      过滤随机、内存分配与不支持算子
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: hf_traces
    label: |-
      收集真实 Hugging Face 模型 trace
      124 个性能算子
      保留高频、大型、真实 tensor shape
    type: database
    size: xl
    position:
      x: 40
      'y': 440
  - id: directories
    label: |-
      为每个算子创建可审计目录
      空实现 stub 与版本化尝试
      生成代码不能修改评测框架
    type: document
    size: xl
    position:
      x: 320
      'y': 220
  - id: variants
    label: |-
      映射 PyTorch 算子变体
      函数式 • 原地 • 预分配 out
      一个 kernel 覆盖所有注册形式
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: generate
    label: |-
      编写自定义 kernel 实现
      人工或 LLM • Triton / PyTorch / CuTeDSL / Helion
      严格遵守算子签名与语义
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: refine
    label: |-
      按反馈迭代 kernel 尝试
      LLM 默认最多五次
      先修编译和正确性，再优化速度
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
  - id: register
    label: |-
      编译并注册 backend
      torch.library CUDA dispatch 覆盖
      无需改模型代码即可运行现有模型
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: smoke
    label: |-
      运行 Smoke 门禁
      加载每个可用实现
      拒绝编译、dispatch 或基本执行失败
    type: decision
    size: xl
    position:
      x: 1440
      'y': 220
  - id: opinfo
    label: |-
      运行 OpInfo 正确性套件
      每算子平均 13 个测试
      空 tensor • NaN/Inf • dtype • 广播 • 极值
    type: process
    size: xl
    position:
      x: 1720
      'y': 40
  - id: facto
    label: |-
      可选运行 FACTO 套件
      补充生成式边界测试
      复用参考实现对 backend 的正确性合同
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: torchbench
    label: |-
      运行 TorchBench trace 套件
      每算子平均 110 个真实 shape 测试
      同一输入下对比 PyTorch eager
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: correctness
    label: |-
      验证数值正确性
      嵌套结构 • equal_nan • atol/rtol 1e-2
      算子必须通过全部正确性测试
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: performance
    label: |-
      安全测量正确 kernel 的性能
      triton.do_bench 同步与 warmup
      相对 eager 的几何平均加速
    type: process
    size: xl
    position:
      x: 2000
      'y': 400
  - id: aggregate
    label: |-
      汇总 backend 分数
      全测试通过的算子平均通过率
      几何平均加速 • 正确且快于 p 的 Perf@p
    type: process
    size: xl
    position:
      x: 2280
      'y': 220
  - id: report
    label: |-
      发布可复现运行产物
      全量结果 • 算子级 CSV • 失败测试
      正确性、性能与 Perf@p 汇总
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 220
edges:
  - from: pytorch_surface
    to: directories
    type: primary
  - from: directories
    to: variants
    type: primary
  - from: variants
    to: generate
    type: primary
  - from: generate
    to: refine
    type: primary
  - from: generate
    to: register
    type: primary
  - from: refine
    to: register
    type: primary
  - from: register
    to: smoke
    type: primary
  - from: smoke
    to: opinfo
    type: primary
  - from: smoke
    to: facto
    type: optional
  - from: smoke
    to: torchbench
    type: primary
  - from: hf_traces
    to: torchbench
    type: data
  - from: opinfo
    to: correctness
    type: primary
  - from: facto
    to: correctness
    type: optional
  - from: torchbench
    to: correctness
    type: primary
  - from: torchbench
    to: performance
    type: primary
  - from: correctness
    to: aggregate
    type: primary
  - from: performance
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
