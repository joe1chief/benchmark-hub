meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BackendBench Build Process
  description: >-
    Official-repository-aligned construction and evaluation of custom PyTorch backends; BackendBench has no standalone
    paper, so the software implementation and launch methodology are the primary source.
  legend: >-
    Solid arrows show backend construction and scoring; dashed arrows carry real-model traces, human audit, or
    correctness/performance feedback into kernel refinement.
