    type: database
    size: xl
    position:
      x: 40
      'y': 440
  - id: directories
    label: |-
      Create One Inspectable Directory per Operator
      Empty Implementation Stub and Versioned Attempts
      Keep Evaluation Harness Outside Generated Code
    type: document
    size: xl
    position:
      x: 320
      'y': 220
  - id: variants
    label: |-
      Map PyTorch Operator Variants
      Functional • In-Place • Preallocated Out
