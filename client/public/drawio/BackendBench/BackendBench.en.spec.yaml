meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BackendBench Build Process
  description: >-
    Official-repository-aligned construction and evaluation of custom PyTorch backends at commit
    2a8d7e19e2c13c789ff2dceb44883ea8ea04dab4; BackendBench has no standalone paper.
  legend: >-
    Solid arrows show construction, one mutually exclusive --suite choice, and suite-local reporting. The dashed arrow
    supplies real-model tensor traces to TorchBench; the branches are not merged into one cross-suite score.
nodes:
  - id: pytorch_surface
    label: |-
      PyTorch Operator Surface
      271 OpInfo Operators
      Filter Random / Allocation
      and Unsupported Ops
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: hf_traces
    label: |-
      Real Hugging Face Traces
      124 Performance Operators
      Frequent + Large
      Real Tensor Shapes
    type: database
    size: xl
    position:
      x: 40
      'y': 760
  - id: directories
    label: |-
      One Directory per Operator
      Empty Implementation Stub
      Versioned Attempts
      Harness Kept Outside
      Generated Code
    type: document
    size: xl
    position:
      x: 320
      'y': 300
  - id: variants
    label: |-
      Map Operator Variants
      Functional • In-Place
      Preallocated Out
      One Kernel for All Forms
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: generate
    label: |-
      Write Custom Kernel
      Human or LLM
      Triton • PyTorch
      CuTeDSL • Helion
      Match Signature + Semantics
    type: process
    size: xl
    position:
      x: 880
      'y': 300
  - id: refine
    label: |-
      Iterate Kernel Attempts
      Default Five LLM Attempts
      Fix Compile + Correctness
      Then Optimize Speed
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: register
    label: |-
      Compile + Register Backend
      torch.library CUDA Dispatch
      Run Existing Models
      without Model-Code Changes
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: suite_selector
    label: |-
      One --suite per Run
      Smoke • OpInfo
      FACTO • TorchBench
    type: decision
    size: xl
    position:
      x: 1440
      'y': 300
  - id: smoke
    label: |-
      Smoke Suite
      Load Selected Implementation
      Compile + Dispatch + Basic Run
    type: process
    size: xl
    position:
      x: 1720
      'y': 100
  - id: opinfo
    label: |-
      OpInfo Correctness Suite
      Average 13 Tests / Operator
      Zero Size • NaN/Inf • Dtypes
      Broadcast • Extremes
    type: process
    size: xl
    position:
      x: 1720
      'y': 300
  - id: facto
    label: |-
      FACTO Correctness Suite
      Generated Edge Cases
      Reference vs Backend
      Same Correctness Contract
    type: process
    size: xl
    position:
      x: 1720
      'y': 500
  - id: torchbench
    label: |-
      TorchBench Trace Suite
      Average 110 Tests / Operator
      Real Model Tensor Shapes
      Compare with PyTorch Eager
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: smoke_report
    label: |-
      Smoke Run Report
      Selected Suite Only
      Compile / Dispatch / Execution
    type: process
    size: xl
    position:
      x: 2000
      'y': 100
  - id: opinfo_report
    label: |-
      OpInfo Correctness Report
      All Tests per Operator
      equal_nan • atol/rtol 1e-2
      No Cross-Suite Aggregation
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: facto_report
    label: |-
      FACTO Correctness Report
      Generated Cases per Operator
      Same Numerical Tolerances
      No Cross-Suite Aggregation
    type: process
    size: xl
    position:
      x: 2000
      'y': 500
  - id: correctness
    label: |-
      TorchBench correctness[]
      Pair by Test Index
      Nested Structures • equal_nan
      atol/rtol 1e-2
    type: process
    size: xl
    position:
      x: 2000
      'y': 700
  - id: performance
    label: |-
      TorchBench performance[]
      triton.do_bench
      Synchronization + Warmup
      Eager-Relative Speedups
    type: process
    size: xl
    position:
      x: 2000
      'y': 900
  - id: paired_arrays
    label: |-
      Pair Suite-Local Arrays
      correctness[i] + performance[i]
      Same TorchBench Test Index
      Compute Metrics in This Run
    type: process
    size: xl
    position:
      x: 2280
      'y': 800
  - id: correctness_rate
    label: |-
      Correctness Metric
      Mean All-Tests Operator Pass
      Every Test Must Pass
    type: process
    size: xl
    position:
      x: 2560
      'y': 600
  - id: perf_p
    label: |-
      Perf@p
      Correct AND Speedup > p
      Uses Paired Arrays
    type: process
    size: xl
    position:
      x: 2560
      'y': 800
  - id: geomean
    label: |-
      Performance Geometric Mean
      Failed Implementation = 1×
      No Correctness Gate
    type: process
    size: xl
    position:
      x: 2560
      'y': 1000
  - id: report
    label: |-
      Publish Per-Suite Artifacts
      Selected --suite Results
      Per-Operator CSV + Failures
      No Cross-Suite Score Merge
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 500
