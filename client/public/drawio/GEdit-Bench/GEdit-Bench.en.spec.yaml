meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GEdit-Bench Build Process
  description: Paper-, dataset-, and evaluator-aligned collection, privacy handling, bilingual release, and VIEScore flow.
  legend: >-
    Evidence is pinned to arXiv:2504.17761v5, repository 4cca05df, and dataset 50766778. Paper v5 is internally
    inconsistent: Figure 7 and one prose sentence say GPT-4o, while Section 4.2.1 and Tables 2-3 say GPT-4.1; the pinned
    evaluator uses GPT-4.1.
nodes:
  - id: evidence
    label: |-
      Evidence snapshot
      paper 2504.17761v5
      repo 4cca05df · data 50766778
      paper GPT-4o/GPT-4.1 conflict
      fixed eval GPT-4.1
    type: document
    size: xl
    position:
      x: 40
      'y': 160
  - id: collect
    label: |-
      Collect >1K real edit cases
      public Internet sources
      include Reddit-style requests
      retain genuine editing intent
    type: database
    size: xl
    position:
      x: 296
      'y': 160
  - id: taxonomy
    label: |-
      Manually assign 11 categories
      filter same-purpose instructions
      preserve task diversity
      retain 606 image-request pairs
    type: process
    size: xl
    position:
      x: 552
      'y': 160
  - id: deidentify
    label: |-
      De-identify user images
      reverse-search public engines
      substitute a public matching image
      else modify instruction, keep intent
    type: process
    size: xl
    position:
      x: 808
      'y': 160
  - id: release
    label: |-
      Pair one EN + one ZH instruction
      release 1,212 rows from 606 pairs
      image/raw image/task/language fields
      Intersection_exist flag included
    type: database
    size: xl
    position:
      x: 1064
      'y': 160
  - id: generation
    label: |-
      Generate edited images
      source image + EN or ZH request
      open and proprietary editors
      missing output files are skipped
    type: process
    size: xl
    position:
      x: 1064
      'y': 400
  - id: views
    label: |-
      Form reporting views
      full: up to 606 per language
      failed/missing outputs excluded
      common: EN 434 · ZH 422
    type: process
    size: xl
    position:
      x: 808
      'y': 400
  - id: viescore
    label: |-
      Judge original + edit + request
      GPT-4.1 and Qwen2.5-VL-72B
      output SC and PQ arrays, 0–10
      task mode: tie
    type: process
    size: xl
    position:
      x: 552
      'y': 400
  - id: parser
    label: |-
      Parse score arrays
      retry once; then fallback/guess
      SC=min list · PQ=min list
      O=sqrt(SC × PQ)
    type: process
    size: xl
    position:
      x: 296
      'y': 400
  - id: aggregate
    label: |-
      Mean within each category
      overall = unweighted mean
      across all 11 category means
      apply same rule to common subset
    type: terminal
    size: xl
    position:
      x: 40
      'y': 400
edges:
  - from: evidence
    to: collect
    type: primary
  - from: collect
    to: taxonomy
    type: primary
  - from: taxonomy
    to: deidentify
    type: primary
  - from: deidentify
    to: release
    type: primary
  - from: release
    to: generation
    type: primary
  - from: generation
    to: views
    type: primary
  - from: views
    to: viescore
    type: primary
  - from: viescore
    to: parser
    type: primary
  - from: parser
    to: aggregate
    type: primary
modules: []
