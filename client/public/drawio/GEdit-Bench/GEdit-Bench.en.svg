line-font-size="11" x="0"><tspan>Collect &gt;1K real edit cases</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>public Internet sources</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>include Reddit-style requests</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>retain genuine editing intent</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="512" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(612,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Manually assign 11 categories</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>filter same-purpose instructions</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>preserve task diversity</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>retain 606 image-request pairs</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="768" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(868,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>De-identify user images</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>reverse-search public engines</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>substitute a public matching image</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>else modify instruction, keep intent</tspan></text></g></g></g></g><g data-cell-id="6"><g><path d="M 1024 15 C 1024 6.72 1068.77 0 1124 0 C 1150.52 0 1175.96 1.58 1194.71 4.39 C 1213.46 7.21 1224 11.02 1224 15 L 1224 85 C 1224 93.28 1179.23 100 1124 100 C 1068.77 100 1024 93.28 1024 85 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1224 15 C 1224 23.28 1179.23 30 1124 30 C 1068.77 30 1024 23.28 1024 15" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1124,36.1) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Pair one EN + one ZH instruction</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>release 1,212 rows from 606 pairs</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>image/raw image/task/language fields</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>Intersection_exist flag included</tspan></text></g></g></g></g><g data-cell-id="7"><g><rect x="1024" y="240" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1124,263.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Generate edited images</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>source image + EN or ZH request</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>open and proprietary editors</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>missing output files are skipped</tspan></text></g></g></g></g><g data-cell-id="8"><g><rect x="768" y="240" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(868,263.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Form reporting views</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>full: up to 606 per language</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>failed/missing outputs excluded</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>common: EN 434 · ZH 422</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="512" y="240" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(612,263.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Judge original + edit + request</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>GPT-4.1 and Qwen2.5-VL-72B</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>output SC and PQ arrays, 0–10</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>task mode: tie</tspan></text></g></g></g></g><g data-cell-id="10"><g><rect x="256" y="240" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(356,263.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Parse score arrays</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>retry once; then fallback/guess</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>SC=min list · PQ=min list</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>O=sqrt(SC × PQ)</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="0" y="240" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(100,263.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Mean within each category</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>overall = unweighted mean</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>across all 11 category means</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>apply same rule to common subset</tspan></text></g></g></g></g><g data-cell-id="12"><g><path d="M 200 25 L 246.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 254.32 25 L 246.82 28.75 L 246.82 21.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="13"><g><path d="M 456 25 L 502.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 510.32 25 L 502.82 28.75 L 502.82 21.25 Z" fill="#4