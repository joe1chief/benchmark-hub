meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeepSeek LeetCode 构建流程
  description: 对齐论文与官方发布的近期竞赛题收集、公开测试执行和 Pass@1 评测流程。
  legend: 实线表示官方披露的构建与评测主流程；推理菱形保留直接模式和思维链模式。
nodes:
  - id: evidence_boundary
    label: |-
      证据边界
      arXiv 2401.14196v2 · §4.1
      表 5 · 仓库 2f9fd859
      数据 b96d7574
      无独立基准论文
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: contests
    label: |-
      近期 LeetCode 竞赛题
      2023 年 7 月至 2024 年 1 月
      降低预训练重合
      但不能排除污染
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: benchmark
    label: |-
      公开发布的 Python 题集
      180 题 · 简单 45
      中等 91 · 困难 44
      无训练或验证划分
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: tests
    label: |-
      公开可执行测试
      每题 100 个 assert 断言
      随记录一并发布
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: prompt
    label: |-
      组装指令
      题目描述
      补全以下代码
      Python 代码模板
    type: document
    size: xl
    position:
      x: 1080
      'y': 250
  - id: mode
    label: 推理模式？
    type: decision
    size: xl
    position:
      x: 1340
      'y': 250
  - id: direct_prompt
    label: |-
      直接模式
      使用基础补全指令
    type: document
    size: xl
    position:
      x: 1600
      'y': 90
  - id: cot_prompt
    label: |-
      思维链模式
      追加分步大纲
      然后编写代码
    type: document
    size: xl
    position:
      x: 1600
      'y': 410
  - id: inference
    label: |-
      每题生成单输出
      温度 0 · 最大 1,024 Token
      每个样例仅一个结果
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: extract
    label: |-
      提取首个 Python 代码块
      回退时截取以下标记前缀
      def · class · if · # · print
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: execute
    label: |-
      HumanEval 式执行
      每个补全限时 10 秒
      全部 100 个测试通过才算成功
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: score
    label: |-
      Pass@1 = 题目通过均值
      报告总体与难度分层
      每题仅一个补全
      保留数据污染说明
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: evidence_boundary
    to: contests
    type: primary
  - from: contests
    to: benchmark
    type: primary
  - from: benchmark
    to: tests
    type: primary
  - from: tests
    to: prompt
    type: primary
  - from: prompt
    to: mode
    type: primary
  - from: mode
    to: direct_prompt
    type: primary
    label: 直接
    labelPosition: center
  - from: mode
    to: cot_prompt
    type: primary
    label: 思维链
    labelPosition: center
  - from: direct_prompt
    to: inference
    type: primary
  - from: cot_prompt
    to: inference
    type: primary
  - from: inference
    to: extract
    type: primary
  - from: extract
    to: execute
    type: primary
  - from: execute
    to: score
    type: primary
modules: []
