meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveMathBench Build Process
  description: >-
    Paper-aligned LiveMathBench workflow: curate recent CNMO, Chinese college-entrance, AMC, and Putnam problems; remove
    unsuitable items and convert single-choice questions into open problem-solving tasks; provide paired English and
    Chinese versions; derive a hard split from low QwQ-32B-Preview and o1-mini accuracy; then use 48 samples per
    question, answer judging, Greedy Accuracy, G-Pass@16 thresholds, and mG-Pass@16 to measure potential and stability.
  legend: Solid arrows show the main flow; the lower branch is the model-selected hard subset.
