meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveMathBench 构建流程
  description: >-
    依据论文重绘的 LiveMathBench 流程：整理最新的全国中学生数学奥赛、高考、美国数学竞赛与 Putnam 竞赛题， 移除不合适题目并把单选题改为开放式解答题，为每题提供中英文配对版本，再依据 QwQ-32B-Preview
    与 o1-mini 的低准确率派生困难子集；评测时每题采样 48 次，经答案裁判后报告贪心准确率、G-Pass@16 各阈值 与 mG-Pass@16，以同时衡量能力潜力和稳定性。
  legend: 实线表示主流程；下方分支表示由模型表现筛出的困难子集。
