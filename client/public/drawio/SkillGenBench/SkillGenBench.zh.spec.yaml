  title: "SkillGenBench 构建与评测流程"
  description: "SkillGenBench把固定仓库快照与长文档转化为187个仓库驱动和文档驱动的技能生成任务。五阶段构建流程先把来源抽象为知识图谱，再提出场景、生成函数式任务与隐藏测试，删除无需过程抽取即可完成或在完整语料下过于简单的任务，并用迭代改进的参考技能验证保留任务，最后人工核验。评测区分任务条件式与任务无关式生成，要求标准化技能工件，并在固定环境和固定执行器中运行确定性隐藏检查与工件诊断，报告pass@3。"
  legend: "来源：arXiv:2605.18693 Figure 2 and benchmark-construction and evaluation-protocol sections。实线箭头表示论文或官方资料明确支持的主流程。"
