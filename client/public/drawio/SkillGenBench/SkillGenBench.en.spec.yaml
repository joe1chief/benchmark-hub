meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SkillGenBench Build and Evaluation Process
  description: >-
    SkillGenBench turns fixed repository snapshots and long-form documents into 187 repository- and document-grounded
    skill-generation tasks. Its five construction stages abstract sources into knowledge graphs, propose scenarios,
    generate function-style tasks and hidden tests, remove tasks that are solvable without procedural extraction or
    trivial with the complete corpus, and validate survivors with iteratively refined reference skills before human
    verification. Evaluation separates task-conditioned from task-agnostic generation, requires standardized skill
    artifacts, and runs them in pinned environments with fixed executors, deterministic hidden checks, artifact
    diagnostics, and pass@3 reporting.
  legend: >-
    Source: arXiv:2605.18693 Figure 2 and benchmark-construction and evaluation-protocol sections. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
