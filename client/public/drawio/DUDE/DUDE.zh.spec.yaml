      NLS = 1 − LD / max(1, |G|, |P|)
      附录公式 3 · 逐答案 NLS ≥ 0.5
      多个标准答案取最大 · 再对题取平均
      列表：匈牙利匹配 · 顺序无关
    type: process
    size: xl
    position:
      x: 3680
      'y': 100
  - id: calibration
