meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MIA-Bench 构建流程
  description: 按论文重建 400 个图像-提示对的分层多模态指令创建过程，以及 GPT-4o 对各指令组件逐项评估遵循程度的流程。
  legend: 八类子指令在五个采集期复杂度层级中组合；每条提示的组件权重总和为 10，最终报告 0 至 100 的分类分数与总分。
nodes:
  - id: sources
    label: |-
      汇集多样图像来源
      COCO 2017 验证集 · SBU
      TextVQA · Flickr
      动物 · 食物 · 艺术 · 文本等
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: sample
    label: |-
      抽样并策展图像
      从三个数据集随机抽样
      选择多主题 Flickr 照片
      覆盖广泛真实场景
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: content_labels
    label: |-
      用 GPT-4V 标注图像内容
      记录视觉主题
      分析主要内容类别
      支持提示多样性
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: author
    label: |-
      人工编写分层提示
      组合多个子指令
      要求精确遵循指定模式
      保持开放式回答
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: gate
    label: |-
      执行三项提示原则
      人类可回答且正确
      不泄露答案
      必须依赖图像求解
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: types
    label: |-
      标记八类子指令
      描述 · 长度 · 提及 · 体裁
      语法 · 数学 · 视角 · OCR
      保留每个组件边界
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: complexity
    label: |-
      丰富采集复杂度
      基础 · 中级 · 高级
      创意 · 复杂
      层级仅用于数据采集
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: weights
    label: |-
      分配组件权重
      每个子指令 · 1 至 10
      反映重要性与难度
      每条提示总和为 10
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: dataset
    label: |-
      汇总 MIA-Bench
      400 个图像-提示对
      分层组合式指令
      组件类型与权重
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: respond
    label: |-
      生成多模态模型回答
      输入图像与完整提示
      保留自由文本输出
      论文评测 29 个模型
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: judge
    label: |-
      使用 GPT-4o 评判
      检查每个子指令
      评估遵循程度
      应用对应最高权重
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: aggregate
    label: |-
      汇总指令遵循程度
      加总加权组件分数
      报告八类分项得分
      报告总分 · 0 至 100
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: sample
    type: primary
  - from: sample
    to: content_labels
    type: primary
  - from: content_labels
    to: author
    type: primary
  - from: author
    to: gate
    type: primary
  - from: gate
    to: types
    type: primary
  - from: types
    to: complexity
    type: primary
  - from: complexity
    to: weights
    type: primary
  - from: weights
    to: dataset
    type: primary
  - from: dataset
    to: respond
    type: primary
  - from: respond
    to: judge
    type: primary
  - from: judge
    to: aggregate
    type: primary
modules: []
