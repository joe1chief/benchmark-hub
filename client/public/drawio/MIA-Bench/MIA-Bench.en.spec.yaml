meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MIA-Bench Build Process
  description: >-
    Reconstructs the paper's creation of 400 image-prompt pairs with layered multimodal instructions and its GPT-4o
    component-wise instruction-adherence evaluation.
  legend: >-
    Eight sub-instruction types are composed at five collection-time complexity levels. Each prompt's component weights
    sum to 10; category and total scores are reported on a 0-100 scale.
nodes:
  - id: sources
    label: |-
      Gather Diverse Image Sources
      COCO 2017 Validation · SBU
      TextVQA · Flickr
      Animals · Food · Art · Text · More
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: sample
    label: |-
      Sample and Curate Images
      Random Samples from Three Datasets
      Themed Flickr Photographs
      Cover Broad Real-world Scenarios
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: content_labels
    label: |-
      Label Image Content with GPT-4V
      Record the Visual Topic
      Analyze Top Content Categories
      Support Prompt Diversity
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: author
    label: |-
      Manually Author Layered Prompts
      Compose Multiple Sub-instructions
      Require Precise Requested Patterns
      Keep Responses Open-ended
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: gate
    label: |-
      Enforce Three Prompt Principles
      Human-answerable Correctness
      No Answer Leakage
      Image-dependent Solution
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: types
    label: |-
      Tag Eight Sub-instruction Types
      Description · Length · Mention · Genre
      Grammar · Math · Perspective · OCR
      Preserve Each Component Boundary
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: complexity
    label: |-
      Diversify Collection Complexity
      Basic · Intermediate · Advanced
      Creative · Complex
      Use Levels for Collection Only
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: weights
    label: |-
      Assign Component Weights
      Each Sub-instruction · 1 to 10
      Reflect Significance and Difficulty
      Sum Every Prompt to 10
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: dataset
    label: |-
      Assemble MIA-Bench
      400 Image-Prompt Pairs
      Layered Compositional Instructions
      Component Types and Weights
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: respond
    label: |-
      Generate an MLLM Response
      Provide the Image and Full Prompt
      Preserve Free-form Output
      Evaluate 29 Models in the Paper
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: judge
    label: |-
      Judge with GPT-4o
      Check Every Sub-instruction
      Score Degree of Compliance
      Apply Its Maximum Weight
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: aggregate
    label: |-
      Aggregate Instruction Adherence
      Sum Weighted Component Scores
      Report Eight Category Scores
      Report Total Score · 0 to 100
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
