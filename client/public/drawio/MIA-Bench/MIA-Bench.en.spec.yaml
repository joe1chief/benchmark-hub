meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MIA-Bench Evidence-aligned Build Process
  description: >-
    Reconstructs benchmark construction, the pinned public release, and the executable GPT-4o evaluator from
    arXiv:2407.01509v5 and official repository commit 5422852d98cb167390da9501200360860435efb1.
  legend: >-
    Solid primary arrows trace the normal Build and Evaluate paths; dashed data arrows trace the fixed release; optional
    branches terminate excluded evaluation rows; dependency arrows point to evidence caveats. Section 3.2 SFT data is
    outside the benchmark-build scope.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper v5 · ICLR 2025
      Repo 5422852d · No Tags
      Checked 2026-07-21
    type: document
    module: build
    size: xl
    position:
      x: 96
      'y': 240
  - id: sources
    label: |-
      Define Four Image Sources
      COCO 2017 Validation · SBU
      TextVQA · Flickr
      400 Final Image-prompt Pairs
    type: database
    module: build
    size: xl
    position:
      x: 368
      'y': 240
  - id: sampling
    label: |-
      Select Source Images
      Random: COCO · SBU · TextVQA
      Flickr: Diverse Themes Reported
      Flickr Selection Method Unreported
    type: process
    module: build
    size: xl
    position:
      x: 640
      'y': 240
  - id: content_labels
    label: |-
      Label Image Content
      GPT-4V Topics Support Figure 4
      Content Labels Absent from Public JSON
      Label Prompt / Snapshot Unreleased
    type: process
    module: build
    size: xl
    position:
      x: 912
      'y': 240
  - id: author
    label: |-
      Manually Author Instructions
      Diverse · Challenging · Open-ended
      Compose Multiple Requests / Constraints
      One Instruction per Image
    type: user
    module: build
    size: xl
    position:
      x: 1184
      'y': 240
  - id: construction_gaps
    label: |-
      Undisclosed Construction Contracts
      Source Quotas / Random Seed
      Annotator Count / Training
      No Published QC / Reject / Adjudicate
      GPT-4V Prompt / Version / Decoding
    type: document
    module: build
    size: xl
    position:
      x: 1184
      'y': 40
    style:
      fontSize: 9
  - id: qc
    label: |-
      Follow Three Authoring Principles
      Correctness: Human-answerable
      No Answer Leakage
      Image-dependent Answer
      No Acceptance / Rejection Gate Published
    type: process
    module: build
    size: xl
    position:
      x: 1456
      'y': 240
  - id: decompose
    label: |-
      Decompose Each Instruction
      Store Atomic Sub-instructions
      Preserve Their Ordered Boundaries
      Record num_of_component
    type: process
    module: build
    size: xl
    position:
      x: 1728
      'y': 240
  - id: taxonomy
    label: |-
      Assign Two Collection Taxonomies
      Eight Paper Categories
      Five Complexity Labels
      Complexity Is Not a Reported Metric
    type: process
    module: build
    size: xl
    position:
      x: 2000
      'y': 240
  - id: weights
    label: |-
      Assign Maximum Component Weights
      Significance + Difficulty · 1–10
      Paper Rule: Per-item Sum = 10
      If Present: Description Gets 6 (2) or 4 (3+)
    type: process
    module: build
    size: xl
    position:
      x: 2272
      'y': 240
    style:
      fontSize: 9
  - id: dataset
    label: |-
      Construct Paper Benchmark
      400 Image-prompt Pairs
      Image + Instruction + Components
      Types + Weights + Complexity
    type: database
    module: build
    size: xl
    position:
      x: 2272
      'y': 560
  - id: release_fields
    label: |-
      Pinned JSON Release · f75671cd
      400 Rows · 398 Unique Instructions
      image · instruction · type
      num_of_component · components
      component_weight · component_type
      image_name: 80 Rows · 21 Values
    type: database
    module: release
    size: xl
    position:
      x: 2000
      'y': 560
    style:
      fontSize: 9
  - id: release_audit
    label: |-
      Release Integrity Audit
      Components per Item: 2 / 3 / 4 / 5
      Counts: 204 / 155 / 40 / 1
      Repeated Category within Item: 22
    type: document
    module: release
    size: xl
    position:
      x: 1728
      'y': 560
    style:
      fontSize: 9
  - id: weight_drift
    label: |-
      Paper Weight-rule Audit · Zero-based Rows
      Description Violations: 3 · 9 · 31
      308 · 316 · 372
      Row 261: Two Description Components
      Sum = 8: Rows 241 · 247
    type: document
    module: release
    size: xl
    position:
      x: 1456
      'y': 560
    style:
      fontSize: 9
  - id: taxonomy_drift
    label: |-
      Paper Names ↔ Release Keys
      description ↔ describe
      genre ↔ linguistics · OCR ↔ textual
      Others Use Normalized Snake Case
    type: document
    module: release
    size: xl
    position:
      x: 1184
      'y': 560
    style:
      fontSize: 9
  - id: image_boundary
    label: |-
      Image-access Boundary
      400 Unique Image Strings
      399 HTTP(S) · Zero-based Row 193 No Scheme
      URL-only · No Image Bundle
      README: Unstable URLs · Three Fixes
      No Per-row Source Field
    type: document
    module: release
    size: xl
    position:
      x: 912
      'y': 560
    style:
      fontSize: 9
  - id: openness
    label: |-
      Public-release Boundary
      Data + Notebook + One-row Example
      Repository Carries Custom Apple License
      No Dependency Lock / Tests
      No Reference Answers / Judge Outputs
    type: document
    module: release
    size: xl
    position:
      x: 640
      'y': 560
    style:
      fontSize: 9
  - id: candidate
    label: |-
      Run Candidate MLLM Inference
      README Contract: url + text
      Use text = "error" on Failure
      One-row Example Instead Uses
      question_id + prompt + text
    type: process
    module: evaluate
    size: xl
    position:
      x: 2272
      'y': 880
    style:
      fontSize: 9
  - id: positional_join
    label: |-
      Load Benchmark + Candidate JSONL
      Iterates Candidate Row Count
      Pair Instructions by Row Position
      Ignore Benchmark image
      Judge Receives Candidate url
      No URL / Length / Order Validation
    type: process
    module: evaluate
    size: xl
    position:
      x: 2000
      'y': 880
    style:
      fontSize: 9
  - id: error_gate
    label: Candidate text Is "error"?
    type: decision
    module: evaluate
    size: xl
    position:
      x: 1728
      'y': 880
  - id: judge_prompt
    label: |-
      NO → Build Fixed English Judge Prompt
      Instruction + Ordered Components
      Per-component Maximum Weights
      Candidate Response + Strictness
      Require First-sentence Score Format
    type: process
    module: evaluate
    size: xl
    position:
      x: 1456
      'y': 880
    style:
      fontSize: 9
  - id: judge_call
    label: |-
      Call Multimodal GPT-4o Judge
      User Text + Candidate-row url
      No System Message · max_tokens 2,000
      Up to Five Bare-except Attempts
      Snapshot / Other Decoding Unpinned
    type: user
    module: evaluate
    size: xl
    position:
      x: 1184
      'y': 880
    style:
      fontSize: 9
  - id: parse
    label: |-
      Parse First Sentence Only
      Period → Comma → Colon / Slash
      Integer Ratio per Category + Total
      No Bounds / Count / Sum Checks
      No Eight-category Coverage Guard
    type: process
    module: evaluate
    size: xl
    position:
      x: 912
      'y': 880
    style:
      fontSize: 9
  - id: failure_skip
    label: |-
      YES / Failed / Malformed → Exclude
      "error" or Five Failures: Initial Integer
      Malformed Judge Reply: String
      Broad Parser Exception: Silent
      Removed from Means; Denominator Shrinks
    type: terminal
    module: evaluate
    size: xl
    position:
      x: 1456
      'y': 1120
    style:
      fontSize: 9
  - id: judge_drift
    label: |-
      Judge-version Drift · Paper v5
      mini-2024-07-18 · 4o-2024-05-13
      4o-2024-11-20 · chatgpt-4o-latest
      Scores Differ; Eight-model Rank Stable
      Table 3: 0–100 · Tables 6–9: 0–1
      Runs ≈1%; Notebook: "gpt-4o"
    type: document
    module: evaluate
    size: xl
    position:
      x: 1184
      'y': 1400
    style:
      fontSize: 9
  - id: overwrite
    label: |-
      Category Aggregation Caveat
      score_dict Uses Category as Key
      Repeated Types Overwrite Earlier Ones
      22 Released Items Can Trigger This
      total_score Is Parsed Separately
    type: document
    module: evaluate
    size: xl
    position:
      x: 912
      'y': 1400
    style:
      fontSize: 9
  - id: aggregate
    label: |-
      Average Successfully Parsed Ratios
      Per-category Arithmetic Means
      total_score Arithmetic Mean
      Notebook Output Range: 0–1
    type: formula
    module: evaluate
    size: xl
    position:
      x: 640
      'y': 880
  - id: report
    label: |-
      Reporting-scale Contract
      Method + Tables 1 / 3: 0–100
      Notebook + Tables 6–9: 0–1
      Main Total = Mean Raw Score ÷ 10 × 100
      Eight Categories · All 400 Claimed
      Complexity Labels Not Reported
    type: terminal
    module: evaluate
    size: xl
    position:
      x: 368
      'y': 880
    style:
      fontSize: 9
  - id: evaluator_gaps
    label: |-
      Reproduction Boundary
      Paper Table Judge Snapshot Unfixed
      Example Schema Conflicts with Notebook
      No Complete-set Guard / Error Report
      Hosted Submission Protocol Absent
    type: document
    module: evaluate
    size: xl
    position:
      x: 96
      'y': 880
    style:
      fontSize: 9
edges:
  - from: evidence
    to: sources
    type: primary
  - from: sources
    to: sampling
    type: primary
  - from: sampling
    to: content_labels
    type: primary
  - from: content_labels
    to: author
    type: primary
  - from: author
    to: qc
    type: primary
  - from: author
    to: construction_gaps
    type: dependency
    style:
      exitX: 0.5
      exitY: 0
      entryX: 0.5
      entryY: 1
  - from: qc
    to: decompose
    type: primary
  - from: decompose
    to: taxonomy
    type: primary
  - from: taxonomy
    to: weights
    type: primary
  - from: weights
    to: dataset
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: dataset
    to: release_fields
    type: data
  - from: release_fields
    to: release_audit
    type: data
  - from: release_audit
    to: weight_drift
    type: data
  - from: weight_drift
    to: taxonomy_drift
    type: data
  - from: taxonomy_drift
    to: image_boundary
    type: data
  - from: image_boundary
    to: openness
    type: data
  - from: dataset
    to: candidate
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: candidate
    to: positional_join
    type: primary
  - from: positional_join
    to: error_gate
    type: primary
  - from: error_gate
    to: judge_prompt
    type: primary
  - from: judge_prompt
    to: judge_call
    type: primary
  - from: judge_call
    to: parse
    type: primary
  - from: parse
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
  - from: report
    to: evaluator_gaps
    type: dependency
  - from: error_gate
    to: failure_skip
    type: optional
    waypoints:
      - x: 1728
        'y': 1056
      - x: 1576
        'y': 1056
  - from: judge_call
    to: failure_skip
    type: optional
    waypoints:
      - x: 1320
        'y': 1040
      - x: 1416
        'y': 1040
      - x: 1416
        'y': 1120
  - from: parse
    to: failure_skip
    type: optional
    waypoints:
      - x: 1048
        'y': 1280
      - x: 1456
        'y': 1280
modules:
  - id: build
    label: Build
    color: $primaryLight
  - id: release
    label: Release
    color: $secondaryLight
  - id: evaluate
    label: Evaluate
    color: $accentLight
