      + Patch Instructions
      No Speculation
      Present Tense Only
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1320
      'y': 320
  - id: qa
    label: |-
      Reproducibility + Deduplication QA
      Re-run PoC on Both Versions
      Same Patch / Similar Crash-stack
      Removal
      Audit 300 = 150 Retained + 150 Removed
      96 Projects · κ=0.82±0.03
      Precision 96%
    type: process
    size: xl
    style:
      fontSize: 9
    position:
