  title: CyberGym Build and Evaluation Process
  description: >-
    ICLR-2026 paper-v3-aligned reconstruction of OSS-Fuzz patch pairs, prompt-bounded description curation, audited
    release materialization, four information levels, and the dual-version sanitizer oracle.
  legend: >-
    Solid arrows show benchmark construction and scoring; the dashed data arrow isolates post-benchmark impact
    reporting.
