      pre/post code · ground-truth PoC · patch
    type: document
    size: xl
    position:
      x: 560
      'y': 210
  - id: describe
    label: |-
      GPT-4.1 description
      rephrase informative patch message
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: quality
