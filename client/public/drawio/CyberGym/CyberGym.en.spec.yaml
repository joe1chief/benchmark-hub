meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CyberGym Build Process
  description: >-
    Paper-aligned OSS-Fuzz sourcing, patch-pair reconstruction, executable PoC task evaluation, and separate
    security-impact analysis.
  legend: >-
    Solid arrows show benchmark construction and success scoring; dashed arrows show follow-up analysis beyond the
    benchmark metric.
