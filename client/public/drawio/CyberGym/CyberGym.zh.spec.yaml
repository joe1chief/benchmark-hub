meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CyberGym 构建流程
  description: 与论文对齐的 OSS-Fuzz 来源、补丁版本对重建、可执行 PoC 任务评测及独立安全影响分析。
  legend: 实线表示构建与成功率评分；虚线表示不属于 benchmark 指标的后续安全分析。
nodes:
  - id: ossfuzz
    label: |-
      OSS-Fuzz / ARVO
      真实历史漏洞
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: patch
    label: |-
      定位精确补丁提交
      对修复前最后一天二分搜索
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: elements
    label: |-
      样例元素
      修复前后代码 · 标准 PoC · 补丁
    type: document
    size: xl
    position:
      x: 560
      'y': 210
  - id: describe
    label: |-
      GPT-4.1 漏洞描述
      改写信息充分的补丁消息
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: quality
    label: |-
      质量保证
      信息充分 · 可复现 · 去重
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: benchmark
    label: |-
      CyberGym
      1,507 个漏洞 · 188 个项目
    type: database
    size: xl
    position:
      x: 1340
      'y': 210
  - id: levels
    label: |-
      难度等级 0–3
      逐级增加描述 · 堆栈 · 补丁上下文
    type: document
    size: xl
    position:
      x: 1600
      'y': 210
  - id: task
    label: |-
      主要 Level-1 输入
      修复前代码 + 漏洞描述
    type: document
    size: xl
    position:
      x: 1860
      'y': 210
  - id: agent
    label: |-
      智能体编写 PoC
      提交、观察并迭代改进
    type: process
    size: xl
    position:
      x: 2120
      'y': 210
  - id: pre
    label: |-
      修复前版本执行
      必须触发 sanitizer 崩溃
    type: process
    size: xl
    position:
      x: 2380
      'y': 110
  - id: post
    label: |-
      修复后版本执行
      必须不触发 sanitizer 崩溃
    type: process
    size: xl
    position:
      x: 2640
      'y': 110
  - id: verdict
    label: 同时满足两项条件？
    type: decision
    size: xl
    position:
      x: 2900
      'y': 210
  - id: success
    label: |-
      成功率
      成功 PoC 数 / 1,507 个样例
    type: terminal
    size: xl
    position:
      x: 3160
      'y': 210
  - id: impact
    label: |-
      独立安全影响分析
      17 个不完整补丁 · 共确认 35 个零日漏洞
    type: document
    size: xl
    position:
      x: 2900
      'y': 390
edges:
  - from: ossfuzz
    to: patch
    type: primary
  - from: patch
    to: elements
    type: primary
  - from: elements
    to: describe
    type: primary
  - from: describe
    to: quality
    type: primary
  - from: quality
    to: benchmark
    type: primary
  - from: benchmark
    to: levels
    type: primary
  - from: levels
    to: task
    type: primary
  - from: task
    to: agent
    type: primary
  - from: agent
    to: pre
    type: primary
  - from: pre
    to: post
    type: primary
  - from: post
    to: verdict
    type: primary
  - from: verdict
    to: success
    type: primary
  - from: verdict
    to: impact
    type: optional
modules: []
