meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Med-HALT 构建流程
  description: 对齐论文、发布数据与当前代码，展示三类推理幻觉测试和四类记忆幻觉测试的构造，并明确发布数据质检、解析器、判分、分母、复现与许可边界。
  legend: >-
    实线表示保留数据与评测器意图路径；虚线表示其他测试分支、论文未披露的发布语义、复现缺口与访问限制。来源：CoNLL 2023、 arXiv:2307.15343v2、Git 2fed21e、HF d1e8d04；审计日期
    2026-07-21。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      CoNLL 2023 · arXiv v2
      Git 2fed21e · HF d1e8d04
      审计日期：2026-07-21
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: india
    label: |-
      汇集 MedMCQA 考试题
      AIIMS PG：6,660 题
      NEET PG：2,855 题
      印度合计：9,515 题
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: other_exams
    label: |-
      加入三个考试数据池
      西班牙 HeadQA：4,068 题
      论文：美国 2,801 · 台湾 2,482
      发布数据的 source 标签不同
    type: database
    size: xl
    position:
      x: 300
      'y': 260
  - id: exam_pool
    label: |-
      合并医学选择题
      四个地域来源
      共 18,866 道基础题
      未发布构建脚本与随机种子
    type: database
    size: xl
    position:
      x: 580
      'y': 150
  - id: rht_route
    label: 构造哪类推理测试？
    type: decision
    size: xl
    position:
      x: 860
      'y': 150
  - id: fct_build
    label: |-
      错误置信测试 FCT
      选择题加建议的学生选项
      18,866 行 · 18,865 个索引不一致
      按选项文本比较为 18,858 行
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: nota_build
    label: |-
      以上皆非测试 NOTA
      将金标位置替换为以上皆非
      18,866 行 · 金标均为以上皆非
      222 行另有第二个以上皆非
    type: process
    size: xl
    position:
      x: 1140
      'y': 240
  - id: fake_build
    label: |-
      虚假问题测试
      人类专家与 GPT-3.5 混合生成
      仅 1,858 行，并非 18,866 行
      混合比例、提示与复核均未披露
    type: process
    size: xl
    position:
      x: 1140
      'y': 440
  - id: rht_release
    label: |-
      固定三份 RHT CSV
      共发布 39,590 行
      论文正文称每项 RHT 有 18,866 行
      表 7 与发布版确认 Fake 为 1,858 行
    type: database
    size: xl
    position:
      x: 1420
      'y': 240
  - id: pubmed
    label: |-
      汇集 PubMed 数据池
      4,916 个唯一 PMID
      年份为 2015 至 2023
      摘要 · PMID · 标题 · URL
    type: database
    size: xl
    position:
      x: 20
      'y': 600
  - id: pubmed_mix
    label: |-
      检查发布版混合数据
      2,927 条 real_data / Yes
      1,989 条 fake_data / Unknown
      合成负例方法未披露
    type: process
    size: xl
    position:
      x: 300
      'y': 600
  - id: mht_route
    label: 构造哪类记忆映射？
    type: decision
    size: xl
    position:
      x: 580
      'y': 600
  - id: mht_links
    label: |-
      生成链接目标
      摘要 → PubMed 链接：4,916 行
      标题 → PubMed 链接：4,916 行
      提示要求 url 或 Unknown
    type: process
    size: xl
    position:
      x: 860
      'y': 500
  - id: mht_titles
    label: |-
      生成标题目标
      PMID → 论文标题：4,916 行
      链接 → 论文标题：4,916 行
      提示要求 paper_title 或 Unknown
    type: process
    size: xl
    position:
      x: 860
      'y': 720
  - id: mht_release
    label: |-
      固定四份 MHT CSV
      共发布 19,664 行
      1,989 条假数据的标题目标为 Unknown
      但其 PMID 与 URL 实际存在
    type: database
    size: xl
    position:
      x: 1140
      'y': 620
  - id: release
    label: |-
      固定七份发布 CSV
      总计 59,254 行
      Git 与 HF 逐文件 SHA-256 一致
      未提供数据集构建代码
    type: database
    size: xl
    position:
      x: 1700
      'y': 400
  - id: access
    label: |-
      访问与许可边界
      可公开下载 · 数据仅限研究
      项目页另称仅限非商业用途
      HF 称 Apache-2.0 · Git 无 LICENSE
    type: document
    size: xl
    position:
      x: 1700
      'y': 680
  - id: prompt
    label: |-
      构造当前任务提示
      全部七项任务 · v0 · 两样本
      一个默认样本加一个任务样本
      Python 样本抽取未设随机种子
    type: document
    size: xl
    position:
      x: 20
      'y': 1040
  - id: generation
    label: |-
      生成模型输出
      TGI · 温度 0.6 · Top-p 0.95
      最多 128 个新 token · seed 42
      停止序列：Stop Here
    type: process
    size: xl
    position:
      x: 300
      'y': 1040
  - id: parse
    label: |-
      解析预测文本
      仅取首行 · 删除 Stop Here
      修复引号 · ast.literal_eval
      失败后正则重建键值
    type: process
    size: xl
    position:
      x: 580
      'y': 1040
  - id: schema_gate
    label: |-
      是否具备评测器输入合同？
      需要 gpt_output 与 testbed_data
    type: decision
    size: xl
    position:
      x: 860
      'y': 1040
  - id: repro_gap
    label: |-
      当前 main 的复现缺口
      转换器写入平铺字段与 output
      eval_full 需要旧版嵌套字段
      未发布适配器
    type: loss
    size: xl
    position:
      x: 860
      'y': 1320
  - id: score_route
    label: 使用哪条判分规则？
    type: decision
    size: xl
    position:
      x: 1140
      'y': 1040
  - id: fct_score
    label: |-
      判定 FCT 修正答案
      搜索八种 answer 键名
      小写后与金标精确相等
      忽略 yes/no 与解释字段
    type: process
    size: xl
    position:
      x: 1420
      'y': 920
  - id: exact_score
    label: |-
      判定 NOTA 与四项 MHT
      读取 cop、paper_title 或 url
      小写后精确字符串匹配
      不 strip、不模糊匹配、不规范化 URL
    type: process
    size: xl
    position:
      x: 1420
      'y': 1140
  - id: fake_score
    label: |-
      判定虚假问题的 cop
      用拒答关键词子串白名单
      包含未知、以上皆非、无意义等词
      缺少键时产生异常
    type: process
    size: xl
    position:
      x: 1420
      'y': 1360
  - id: counting
    label: |-
      应用代码计数合同
      分别累计正确与错误
      exception_count 单独记录
      total = correct + wrong
    type: process
    size: xl
    position:
      x: 1700
      'y': 1140
  - id: accuracy
    label: |-
      计算准确率
      100 × correct / (correct + wrong)
      解析或缺键异常被排除
      此指标不会把异常计为错误
    type: process
    size: xl
    position:
      x: 1980
      'y': 1040
  - id: pointwise
    label: |-
      计算仓库 Score
      (correct + p × wrong) / 100
      p = 1 或 −0.25
      论文公式 1 则写为除以 N
    type: process
    size: xl
    position:
      x: 1980
      'y': 1280
  - id: report
    label: |-
      写入逐任务 results.csv
      Accuracy · Precision · Recall · F1
      仓库 Score 可以超过 100
      论文 family Avg 为任务非加权平均
    type: terminal
    size: xl
    position:
      x: 2260
      'y': 1140
