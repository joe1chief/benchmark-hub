  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Med-HALT Build Process
  description: >-
    Paper- and official-project-aligned multinational medical exams, PubMed memory data, three reasoning hallucination
    tests, four memory hallucination tests, and dual-metric evaluation for Med-HALT.
  legend: >-
    Solid arrows trace 18,866 reasoning samples and 4,916 memory samples, seven test modalities, structured-output
    parsing, and accuracy plus pointwise-score reporting.
