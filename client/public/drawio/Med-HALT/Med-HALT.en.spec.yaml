meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Med-HALT Build Process
  description: >-
    Paper-, release-, and current-code-aligned construction of three reasoning and four memory hallucination tests, with
    explicit release-QC, parser, scoring, denominator, reproducibility, and license boundaries.
  legend: >-
    Solid arrows trace retained data and executable evaluator intent. Dashed arrows mark alternate test branches,
    undocumented release semantics, reproduction gaps, and access constraints. Sources: CoNLL 2023, arXiv:2307.15343v2,
    Git 2fed21e, and HF d1e8d04; audited 2026-07-21.
