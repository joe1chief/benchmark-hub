    size: xl
    position:
      x: 20
      'y': 40
  - id: otherexams
    label: |-
      Add Three Medical Exams
      Spain HeadQA · 4,068
      US MedQA · 2,801
      Taiwan MedQA · 2,482
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: rhtpool
    label: |-
