    type: decision
    size: xl
    position:
      x: 860
      'y': 1040
  - id: repro_gap
    label: |-
      Current Main Reproduction Gap
      Converter Writes Flat Fields plus output
      eval_full Expects Nested Legacy Fields
      No Adapter Is Published
    type: loss
    size: xl
    position:
      x: 860
      'y': 1320
  - id: score_route
    label: Which Scoring Rule?
    type: decision
    size: xl
    position:
      x: 1140
      'y': 1040
  - id: fct_score
    label: |-
      Score FCT Corrected Answer
      Search Eight Answer-key Variants
      Lowercase Exact Match to Gold
      Ignore yes/no and Explanations
    type: process
    size: xl
    position:
      x: 1420
      'y': 920
  - id: exact_score
    label: |-
      Score NOTA and Four MHTs
      cop, paper_title, or url
      Lowercase Exact String Match
      No Strip, Fuzzy, or URL Normalization
    type: process
    size: xl
    position:
      x: 1420
      'y': 1140
  - id: fake_score
    label: |-
      Score Fake-question cop
      Substring Whitelist for Refusal Terms
      Includes Unknown, NOTA, Nonsense
      Missing Key Raises an Exception
    type: process
    size: xl
    position:
      x: 1420
      'y': 1360
  - id: counting
    label: |-
      Apply Code Counting Contract
      Count Correct and Wrong
      Track exception_count Separately
      total = correct + wrong
    type: process
    size: xl
    position:
      x: 1700
      'y': 1140
  - id: accuracy
    label: |-
      Compute Accuracy
      100 × correct / (correct + wrong)
      Parse or Key Exceptions Are Excluded
      Not Counted as Wrong in This Metric
    type: process
    size: xl
    position:
      x: 1980
      'y': 1040
  - id: pointwise
    label: |-
      Compute Repository Score
      (correct + p × wrong) / 100
      p = 1 or −0.25
      Paper Eq. 1 Instead Says Divide by N
    type: process
    size: xl
    position:
      x: 1980
      'y': 1280
  - id: report
    label: |-
      Write Per-task results.csv
      Accuracy · Precision · Recall · F1
      Repository Score Can Exceed 100
      Paper Family Avg Is Unweighted by Task
    type: terminal
    size: xl
    position:
      x: 2260
      'y': 1140
