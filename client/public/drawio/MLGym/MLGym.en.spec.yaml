meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLGym-Bench Build Process
  description: >-
    Reconstructs the paper's curation and configuration of 13 open-ended AI research tasks, their sandboxed Gym
    execution contract, and four-run Best Attempt/Submission performance-profile evaluation.
  legend: >-
    Task metrics differ by domain, so aggregate comparison uses performance profiles and area under the performance
    profile. Validate is reusable; submit is terminal; every run is capped at 50 agent-environment interactions.
nodes:
  - id: curate
    label: |-
      Curate 13 Open-ended Research Tasks
      Computer Vision · NLP
      Reinforcement Learning · Game Theory
      SAT and Tabular Prediction
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: task_contract
    label: |-
      Define Each Task by Configuration
      Dataset · Optional Starter Code
      Read-only Evaluation Script
      Dependencies · Timeouts · Memory
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: artifacts
    label: |-
      Specify Flexible Artifacts
      Model Weights · Predictions
      RL Policies · Strategy Functions
      Task-specific Submission Rules
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: environment
    label: |-
      Build a Gymnasium Environment
      Start a Local Docker Machine
      Install Task Dependencies
      Copy Code and Data to a Workspace
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: safety
    label: |-
      Enforce Reproducible Permissions
      Run as a Non-root Agent User
      Keep Datasets Read-only
      Block Edits to Evaluation Code
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: harness
    label: |-
      Attach the Agent Harness
      Search · View · Edit · Shell Tools
      Validate and Submit Commands
      Identical Experimental Settings
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: research_loop
    label: |-
      Run the Research Loop
      Form Hypotheses · Edit Code
      Train · Analyze · Iterate
      Maximum 50 Interaction Steps
    type: user
    size: xl
    position:
      x: 1420
      'y': 420
  - id: validate
    label: |-
      Validate Intermediate Attempts
      Run the Task Evaluation Script
      Return Test Metrics as Feedback
      Permit Repeated Validation
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: submit
    label: |-
      Submit the Final Artifact
      Submit Command Ends the Run
      Otherwise Autosubmit Last State
      Enforce Task Training Timeout
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: replicate
    label: |-
      Repeat Four Independent Runs
      Use Different Seeds
      Log Every Valid Attempt
      Preserve Final Submissions
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: profiles
    label: |-
      Build Two Performance Profiles
      Best Attempt@4 · Any Validation
      Best Submission@4 · Final Artifacts
      Compare Relative Task Performance
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report Cross-task Results
      Area Under Performance Profile
      Raw Task-specific Metrics
      Cost and Reliability Analyses
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: curate
    to: task_contract
    type: primary
  - from: task_contract
    to: artifacts
    type: primary
  - from: artifacts
    to: environment
    type: primary
  - from: environment
    to: safety
    type: primary
  - from: safety
    to: harness
    type: primary
  - from: harness
    to: research_loop
    type: primary
  - from: research_loop
    to: validate
    type: primary
  - from: validate
    to: submit
    type: primary
  - from: submit
    to: replicate
    type: primary
  - from: replicate
    to: profiles
    type: primary
  - from: profiles
    to: report
    type: primary
modules: []
