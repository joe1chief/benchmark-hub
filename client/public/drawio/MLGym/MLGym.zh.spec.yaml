meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MLGym-Bench 构建、发布、智能体执行与评估流程
  description: >-
    基于 arXiv:2502.14499v1、论文提交前官方仓库的最后一次提交 075634859ec3ab16c56ca87678ec0fe564a27470 与公开 HEAD 9d40c1b 重建。图中将论文的 13 任务基准、
    可变输入、快照中不可直接运行的启动脚本、发布版排名行为和后续漂移明确分开。
  legend: 实线表示构建、执行与计分主流程；虚线表示可选验证、继续研究或后续源码漂移。论文定义与 发布代码的回退行为分别标注。
nodes:
  - id: b1
    label: |-
      B1 · 范围与任务
      论文注册表 13 项任务
      未报告选择方法
    type: database
    size: xl
    position:
      x: 80
      'y': 120
  - id: b2
    label: |-
      B2 · 数据与划分
      HF 加 Drive/本地
      无哈希和全局 QC
    type: database
    size: xl
    position:
      x: 360
      'y': 120
  - id: b3
    label: |-
      B3 · 任务契约
      YAML、评估器、超时
      工件类型与指标方向
    type: document
    size: xl
    position:
      x: 640
      'y': 120
  - id: r1
    label: |-
      R1 · 固定论文快照
      arXiv v1 · 0756348
      18 任务 / 7 数据 YAML
    type: document
    size: xl
    position:
      x: 920
      'y': 120
  - id: r2
    label: |-
      R2 · 公开边界
      代码、配置、261 组运行
      可变数据与 latest 镜像
    type: document
    size: xl
    position:
      x: 1200
      'y': 120
  - id: r3
    label: |-
      R3 · 启动入口失配
      Agent YAML、别名、3SAT 路径
      过期 --config_file
    type: document
    size: xl
    position:
      x: 1200
      'y': 360
  - id: d1
    label: |-
      D1 · 后续 HEAD
      9d40c1b · 19/8 YAML
      1,506 个文件不同
    type: document
    size: xl
    position:
      x: 1480
      'y': 120
  - id: e1
    label: |-
      E1 · 构建工作区
      非 root Docker/Podman
      数据与评估器只读
    type: process
    size: xl
    position:
      x: 920
      'y': 360
  - id: e2
    label: |-
      E2 · 启动框架
      SWE-Agent ReAct
      每步一命令；验证/提交
    type: user
    size: xl
    position:
      x: 640
      'y': 360
  - id: e3
    label: |-
      E3 · 研究循环
      编辑、训练、分析
      50 步；任务超时
    type: user
    size: xl
    position:
      x: 360
      'y': 360
  - id: d2
    label: |-
      D2 · 验证？
      运行评估器后继续
      可跳过或重复
    type: decision
    size: xl
    position:
      x: 80
      'y': 360
  - id: e4
    label: |-
      E4 · 记录尝试
      追加有效指标
      显示基线与当前值
    type: process
    size: xl
    position:
      x: 80
      'y': 600
  - id: d3
    label: |-
      D3 · 终止？
      提交、限额或错误
      否则继续
    type: decision
    size: xl
    position:
      x: 360
      'y': 600
  - id: e5
    label: |-
      E5 · 终止评估
      提交或自动提交
      仅追加有效指标
    type: process
    size: xl
    position:
      x: 640
      'y': 600
  - id: e6
    label: |-
      E6 · 运行分类
      无有效分数：失败
      已有分数 + 错误：未完成
    type: document
    size: xl
    position:
      x: 920
      'y': 600
  - id: e7
    label: |-
      E7 · 保存证据
      .traj 与 results.json
      工作区导出仍为 TODO
    type: document
    size: xl
    position:
      x: 1200
      'y': 600
  - id: s1
    label: |-
      S1 · 解析指标
      按任务解析 stdout JSON
      注册表指定方向
    type: process
    size: xl
    position:
      x: 1200
      'y': 840
  - id: s2
    label: |-
      S2 · 汇集四次运行
      论文：独立种子
      发布代码仍用种子 42
    type: document
    size: xl
    position:
      x: 920
      'y': 840
  - id: s3
    label: |-
      S3 · 两种 @4 视图
      最佳尝试：任一有效值
      论文最终；代码 agent[-1]
    type: process
    size: xl
    position:
      x: 640
      'y': 840
  - id: s4
    label: |-
      S4 · 性能剖面与报告
      基线可行性 + ε = 0.05
      阶梯 AUP 与原始指标
    type: terminal
    size: xl
    position:
      x: 360
      'y': 840
