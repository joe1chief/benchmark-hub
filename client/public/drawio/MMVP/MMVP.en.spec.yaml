meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMVP Build Process
  description: >-
    Paper-aligned construction of 150 CLIP-blind image pairs and 300 direct questions, followed by paired
    visual-grounding evaluation across nine systematic visual patterns.
  legend: A pair receives credit only when both independently presented questions are answered correctly.
nodes:
  - id: corpus
    label: |-
      Collect Image Corpus
      ImageNet-1K
      LAION-Aesthetics
      Form Candidate Image Pairs
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: clip
    label: |-
      Encode with CLIP
      CLIP ViT-L-14
      Compute Pairwise Embeddings
      Measure Cosine Similarity
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: dino
    label: |-
      Encode with DINOv2
      DINOv2 ViT-L-14
      Vision-only Reference
      Measure Cosine Similarity
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: filter
    label: |-
      Apply Blind-pair Filter
      CLIP Similarity above 0.95
      DINOv2 Similarity below 0.6
      Retain Disagreement Pairs
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: inspect
    label: |-
      Inspect Pairs Manually
      Locate Stark Visual Difference
      Identify Detail Missed by CLIP
      Select Diagnostic Content
    type: user
    size: xl
    position:
      x: 1140
      'y': 40
  - id: questions
    label: |-
      Write Paired Questions
      One Question per Image
      Probe the Missed Detail
      Keep Direct and Unambiguous
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: release
    label: |-
      Assemble MMVP-MLLM
      150 Image Pairs
      300 Questions
      Two Questions per Pair
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: categorize
    label: |-
      Generalize Failure Patterns
      Prompt GPT-4 with Q and Options
      Categorize Visual Features
      Identify Nine Patterns
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: patterns
    label: |-
      Cover Nine Visual Patterns
      Direction · Presence · State
      Count · Position · Appearance
      Structure · Text · Viewpoint
    type: document
    size: xl
    position:
      x: 860
      'y': 420
  - id: inference
    label: |-
      Query Each Item Independently
      Present One Image and Question
      Remove Chat-history Bias
      Record One Answer per Question
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: human
    label: |-
      Run Human Study
      Randomize All 300 Questions
      Measure Question Simplicity
      Mean Question Accuracy 95.7%
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Compute Paired Accuracy
      Require Both Answers Correct
      Otherwise Pair Scores Zero
      Report Model-human Gap
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: corpus
    to: clip
    type: primary
  - from: clip
    to: dino
    type: primary
  - from: dino
    to: filter
    type: primary
  - from: filter
    to: inspect
    type: primary
  - from: inspect
    to: questions
    type: primary
  - from: questions
    to: release
    type: primary
  - from: release
    to: categorize
    type: primary
  - from: categorize
    to: patterns
    type: primary
  - from: patterns
    to: inference
    type: primary
  - from: inference
    to: human
    type: primary
  - from: human
    to: score
    type: primary
modules: []
