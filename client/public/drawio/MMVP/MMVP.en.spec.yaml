meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMVP Paper-v2 Construction and Paired-Scoring Process
  description: >-
    Evidence-aligned construction from arXiv:2401.06209v2, followed by the fixed official-repository GPT-4 grading path
    and separately bounded pattern, human-study, release, and license evidence.
  legend: >-
    Solid arrows follow construction and scoring; dashed data arrows mark analyses or release evidence. Human 95.7% is
    reported per question and is not the repository's both-questions-correct pair metric.
