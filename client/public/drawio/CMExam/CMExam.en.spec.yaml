  layout: horizontal
  routing: orthogonal
  title: CMExam Build Process
  description: >-
    Paper-aligned construction and evaluation of CMExam. Authentic Chinese medical licensing questions are filtered and
    deduplicated, split 8:1:1, enriched with solution explanations and five expert-reviewed test annotations, then used
    for answer prediction, explanation generation, and human-machine comparison.
  legend: Solid arrows trace dataset construction and the two official evaluation tasks.
