  layout: horizontal
  routing: orthogonal
  title: Inverse IFEval Build Process
  description: >-
    Paper-aligned five-stage human-in-the-loop construction: reverse common SFT paradigms, build unanimously reviewed
    expert seeds, generate and filter multi-domain candidates, calibrate bilingual rubrics, then optimize a judge
    matrix.
  legend: >-
    The benchmark contains 506 English and 506 Chinese instructions. Twenty candidates are generated initially for each
    domain-type combination; the final judge reaches 98% validation accuracy against human scores.
