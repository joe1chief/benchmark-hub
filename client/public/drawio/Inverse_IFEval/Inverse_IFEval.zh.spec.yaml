meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Inverse IFEval 构建流程
  description: 对齐论文的五阶段人机协作流程：反转常见 SFT 范式，构建全票通过的专家种子，多领域生成与过滤， 校准双语评分标准，最后优化分类型裁判矩阵。
  legend: 数据集包含 506 条英文与 506 条中文指令；每个领域×类型初始生成 20 个候选，最终裁判相对人工分数的验证准确率达到 98%。
nodes:
  - id: observe
    label: |-
      1 · 观察与反转
      分析常见 SFT 数据范式
      准确 · 最佳实践 · 易读
      正确 · 固定模式回答
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: types
    label: |-
      推导 8 类反直觉指令
      问题纠错 · 故意文本缺陷
      无注释代码 · 反常格式
      故意答错 · 指令归纳 · 中途修改 · 反事实
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: seeds
    label: |-
      2 · 专家种子构建
      由 LLM 训练专家编写示例
      覆盖每一种反直觉类型
      建立分类型质量基线
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: seed_review
    label: |-
      跨职能种子复核
      产品 · 工程 · 运营背景
      独立判断合格 / 不合格
      仅纳入全票合格的种子
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: templates
    label: |-
      3 · 生成设计
      每类指令使用专用模板
      预定义 23 个领域分类
      数学 · 物理 · 法律 · 文学 · 生物等
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: generate
    label: |-
      多模型候选生成
      使用多个先进大模型协作
      每个领域×类型初始生成 20 题
      保留类型与领域元数据
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: filter
    label: |-
      4 · 自动过滤
      应用长度约束
      检测语义相似度
      删除低质量或重复候选
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: coverage
    label: |-
      修复覆盖与稳健性
      定位覆盖不足的领域
      定向追加候选问题
      使用跨模型一致性验证
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: human
    label: |-
      5 · 专家人工验证
      检查类型一致性
      删除歧义与逻辑矛盾
      校准细粒度评分标准
    type: user
    size: xl
    position:
      x: 860
      'y': 380
  - id: dataset
    label: |-
      最终 Inverse IFEval · 1,012
      中文 506 + 英文 506
      8 种类型 · 23 个领域
      指令 + 标签 + 标准化 rubric
    type: database
    size: xl
    position:
      x: 580
      'y': 380
  - id: judge
    label: |-
      优化 LLM-as-a-Judge
      每类指令选择最佳裁判模型
      每类选择最佳模板结构
      详细系统逻辑 + 少量示例
    type: process
    size: xl
    position:
      x: 300
      'y': 380
  - id: report
    label: |-
      验证评测并汇报
      每题配对两个模型回答
      使用人工核验的标准分数
      裁判准确率 88% → 98% · 总体得分
    type: terminal
    size: xl
    position:
      x: 20
      'y': 380
edges:
  - from: observe
    to: types
    type: primary
  - from: types
    to: seeds
    type: primary
  - from: seeds
    to: seed_review
    type: primary
  - from: seed_review
    to: templates
    type: primary
  - from: templates
    to: generate
    type: primary
  - from: generate
    to: filter
    type: primary
  - from: filter
    to: coverage
    type: primary
  - from: coverage
    to: human
    type: primary
  - from: human
    to: dataset
    type: primary
  - from: dataset
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
