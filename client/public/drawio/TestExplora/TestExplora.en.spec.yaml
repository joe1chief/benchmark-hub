meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TestExplora Build and Evaluation Process
  description: >-
    Paper-aligned issue-PR acquisition, reachability and code-quality gates, automated repository environments,
    executable bug oracles, proactive test generation, and F2P-centered evaluation.
  legend: >-
    Read benchmark construction left-to-right, then test-generation evaluation right-to-left; a discovered bug requires
    a generated test that passes the fixed repository and fails the buggy base version.
nodes:
  - id: sources
    label: |-
      High-Quality GitHub Sources
      Repositories with More Than 1,000 Stars
      Crawl 12,227 Issue-PR Patches
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: split
    label: |-
      Patch Decomposition
      Separate Test Patch Pt and Code Patch Pc
      Parse Changed Functions and Test Calls
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: reachability
    label: |-
      Reachability + Quality Gate
      Tests Must Reach Repaired Functions by Explicit Calls
      Remove Doctoring, TODO, or pass Implementations
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: environment
    label: |-
      Automated Build Environment
      GitHub Actions Runner Images + System Toolchains
      Merge Requirements; Poetry / PDM / pip Setup
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: oracle_docs
    label: |-
      Executable Oracle + Documentation
      Gold Tests Fail on Base and Pass after Pc
      DocAgent Documents Entry Intent / Inputs / Errors
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      TestExplora Release
      1,552 PRs / 2,389 Tasks / 482 Repositories
      Lite: 330 PRs / 517 Tasks
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: scenario
    label: |-
      White- or Black-Box Input
      Documentation Always Provided
      White: Implementation + Dependencies; Black: Signatures
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: generate
    label: |-
      Proactive Test Generation
      Write Repository-Level Test Cases
      Emit an Applicable Test Patch
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: head
    label: |-
      Fixed-Version Execution
      Apply Pc and Run Generated Tests
      Test-Level Head Pass Rate Measures Intent Fidelity
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: base
    label: |-
      Buggy-Base Execution
      Run the Same Passing Tests before Pc
      PR Succeeds If at Least One Test Now Fails
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: coverage
    label: |-
      Code-Coverage Diagnostics
      Entry Coverage (EC)
      Change-Focused Coverage (CFG)
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      TestExplora Results
      Head Pass + PR-Level Fail-to-Pass Rate
      EC / CFG + Number of Generated Tests
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: split
    type: primary
  - from: split
    to: reachability
    type: primary
  - from: reachability
    to: environment
    type: primary
  - from: environment
    to: oracle_docs
    type: primary
  - from: oracle_docs
    to: release
    type: primary
  - from: release
    to: scenario
    type: primary
  - from: scenario
    to: generate
    type: primary
  - from: generate
    to: head
    type: primary
  - from: head
    to: base
    type: primary
  - from: base
    to: coverage
    type: primary
  - from: coverage
    to: report
    type: primary
modules: []
