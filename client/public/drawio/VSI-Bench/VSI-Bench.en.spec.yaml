meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VSI-Bench Construction and Mixed-Metric Evaluation
  description: >-
    VSI-Bench unifies videos and 3D object metadata from the ScanNet, ScanNet++, and ARKitScenes validation sets.
    Metadata-driven templates generate seven tasks automatically while route planning is human-authored; iterative
    human-in-the-loop review traces bad videos, source annotations, templates, and ambiguous QA back to their source.
    The release contains 288 videos and more than 5,000 QA pairs across eight tasks. Multiple-choice tasks use accuracy,
    numerical tasks use Mean Relative Accuracy, and cognitive-map prompting is an analysis intervention.
  legend: >-
    Source: VSI-Bench arXiv:2412.14171, benchmark construction and evaluation sections; official nyu-visionx/VSI-Bench
    dataset. Solid arrows show the main flow explicitly supported by the paper or official documentation.
