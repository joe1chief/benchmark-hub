meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveDRBench Build Process
  description: >-
    Paper-aligned construction of refreshable deep-research tasks through problem inversion, category-specific claim
    ground truth, full-web system runs, nested-claim matching, and modified precision, recall, and F1 evaluation.
  legend: >-
    Counts follow arXiv:2508.04183v1: 100 tasks across eight scientific and world-event categories. Deep research is
    isolated as high-search, high-reasoning claim generation rather than judged as long-form report writing.
nodes:
  - id: definition
    label: |-
      Define the Deep-research Regime
      Require High Search Fan-out
      Require Nontrivial Reasoning and Synthesis
      Separate Claims from Long-form Reporting
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: desiderata
    label: |-
      Specify Refreshable Task Desiderata
      Need Many Sources and Objective Answers
      Resist One-page and Parametric-memory Solutions
      Cover Diverse Domains and User Needs
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: seed
    label: |-
      Select Reasoning Seed Problems
      Start with Document or Long-context QA
      Retain the Ground-truth Answer and Evidence
      Include Scientific and Public-event Sources
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: inversion
    label: |-
      Invert the Original Problem
      Turn Answer Properties into Search Clues
      Ask for the Matching Event or Entity
      Force Discovery across the Open Web
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: refine
    label: |-
      Refine for a Unique Verifiable Answer
      Add Discriminating Properties as Needed
      Update Supporting Documents for Alternatives
      Preserve a Pipeline that Can Be Refreshed
    type: decision
    size: xl
    position:
      x: 1140
      'y': 40
  - id: categories
    label: |-
      Curate Eight Task Categories
      SciFacts · NovelDS · PriorArt
      Entities · Flights and Subcategories
      Balance Scientific and World-event Domains
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: gold
    label: |-
      Construct Category-specific Gold Claims
      Derive Answers from Source Documents
      Scrape Structured Lists for World Events
      Store Entity Names and Nested Claim Structure
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: verify
    label: |-
      Finalize Ground Truth Manually
      Inspect Agent Answers Missing from Initial Gold
      Add Valid Alternative Answers
      Freeze Reproducible Claim Lists for Scoring
    type: user
    size: xl
    position:
      x: 1700
      'y': 420
  - id: release
    label: |-
      Release LiveDRBench
      100 Tasks across Eight Categories
      Typical Task Needs about 20 Information Units
      Designed to Require at Least 10 Searches
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: systems
    label: |-
      Run Deep-research and Search Systems
      Permit Retrieval from the Full Web
      Compare 3 Proprietary DR Systems
      Add Reasoning and Non-reasoning Baselines
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: parse
    label: |-
      Normalize Generated Research Outputs
      Extract Claims and Subclaims as JSON
      Use GPT-4 Parsing when Output Is Unstructured
      Evaluate the Claim Layer before Report Style
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: agreement
    label: |-
      Match Generated and Gold Claims
      Use the Published GPT-4o Agreement Prompt
      Score Semantic Claim Correctness
      Preserve Parent and Subclaim Relations
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: metrics
    label: |-
      Compute Modified Precision and Recall
      Weight Parent Claims by Subclaim Quality
      Zero a Claim if Parent or All Children Fail
      Combine the Two Measures as F1
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report Performance and Trace Behavior
      Precision · Recall · F1 by Category
      Count Sources and Search Fan-out
      Analyze Branching and Backtracking
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: definition
    to: desiderata
    type: primary
  - from: desiderata
    to: seed
    type: primary
  - from: seed
    to: inversion
    type: primary
  - from: inversion
    to: refine
    type: primary
  - from: refine
    to: categories
    type: primary
  - from: categories
    to: gold
    type: primary
  - from: gold
    to: verify
    type: primary
  - from: verify
    to: release
    type: primary
  - from: release
    to: systems
    type: primary
  - from: systems
    to: parse
    type: primary
  - from: parse
    to: agreement
    type: primary
  - from: agreement
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
