meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LiveDRBench 构建流程
  description: 按论文复原 LiveDRBench：通过问题反转构建可更新的深度研究任务，建立分类特定的标准论点，在全网检索环境运行系统， 最后以嵌套论点匹配和修正后的精确率、召回率与 F1 评分。
  legend: 数量依据 arXiv:2508.04183v1：共 100 个任务、八个科学与世界事件类别。基准将深度研究界定为高检索、 高推理的论点生成，而不是按长报告文风评分。
nodes:
  - id: definition
    label: |-
      界定深度研究任务
      要求高检索扇出
      要求非平凡推理与信息综合
      将论点生成与长报告写作分离
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: desiderata
    label: |-
      制定可更新任务要求
      需要多来源且答案客观
      无法靠单页或参数记忆直接作答
      覆盖多领域与多类用户需求
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: seed
    label: |-
      选择推理种子问题
      从文档或长上下文问答出发
      保留标准答案及其证据
      纳入科学与公共事件来源
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: inversion
    label: |-
      反转原始问题
      将答案属性改写为检索线索
      询问符合条件的事件或实体
      迫使系统跨开放网络发现答案
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: refine
    label: |-
      精炼为唯一且可验证的答案
      必要时加入区分性属性
      若有同答案文档则补充证据
      保持流水线可周期更新
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: categories
    label: |-
      整理八个任务类别
      SciFacts · NovelDS · PriorArt
      Entities · Flights 及其子类别
      平衡科学与世界事件领域
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: gold
    label: |-
      构建分类特定的标准论点
      从源文档推导答案
      为世界事件抓取结构化列表
      保存实体名称与嵌套论点结构
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: verify
    label: |-
      人工完成标准答案
      检查初始答案外的智能体输出
      加入有效的替代答案
      固化可复现的评分论点列表
    type: user
    size: xl
    position:
      x: 1700
      'y': 420
  - id: release
    label: |-
      发布 LiveDRBench
      八个类别共 100 个任务
      典型任务约需 20 个信息单元
      设计目标为至少需要 10 次检索
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: systems
    label: |-
      运行深度研究与检索系统
      允许从完整互联网检索
      比较 3 个闭源深度研究系统
      加入推理与非推理检索基线
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: parse
    label: |-
      规范化系统生成的研究输出
      抽取论点与子论点 JSON
      非结构化输出用 GPT-4 解析
      在报告文风之前评测论点层
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: agreement
    label: |-
      匹配生成论点与标准论点
      使用论文公开的 GPT-4o 一致性提示
      判断论点语义正确性
      保留父论点与子论点关系
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: metrics
    label: |-
      计算修正后的精确率与召回率
      以子论点质量加权父论点
      父论点或全部子论点失败则记零
      将两项指标合成为 F1
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      报告性能与推理轨迹行为
      按类别报告精确率、召回率、F1
      统计来源数与检索扇出
      分析分支搜索与回溯
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: definition
    to: desiderata
    type: primary
  - from: desiderata
    to: seed
    type: primary
  - from: seed
    to: inversion
    type: primary
  - from: inversion
    to: refine
    type: primary
  - from: refine
    to: categories
    type: primary
  - from: categories
    to: gold
    type: primary
  - from: gold
    to: verify
    type: primary
  - from: verify
    to: release
    type: primary
  - from: release
    to: systems
    type: primary
  - from: systems
    to: parse
    type: primary
  - from: parse
    to: agreement
    type: primary
  - from: agreement
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
