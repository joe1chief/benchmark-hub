meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VBench-2.0 Build and Evaluation Process
  description: >-
    VBench-2.0 shifts video-generation evaluation from superficial plausibility to intrinsic faithfulness. It defines
    five top-level dimensions—human fidelity, controllability, creativity, physics, and commonsense—and decomposes them
    into fine-grained capabilities with tailored prompts. Candidate models generate videos for the frozen suites. Each
    capability uses an evaluator selected from generalist VLM/LLM judges or specialist anomaly and vision methods.
    Extensive human annotations calibrate and validate metric alignment. Results are aggregated at capability and
    dimension levels to reveal whether videos obey anatomy, composition, physical laws, prompt controls, and commonsense
    rather than merely looking smooth.
  legend: >-
    Source: VBench-2.0 arXiv:2503.21755, Sections 3-5; official Vchitect/VBench repository. Solid arrows show the main
    flow explicitly supported by the paper or official documentation.
