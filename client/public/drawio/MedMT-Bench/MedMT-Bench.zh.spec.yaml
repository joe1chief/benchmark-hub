meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedMT-Bench 构建与评测流程
  description: 对齐论文展示开放医学文本与图像、五智能体对话合成、逐场景衔接、专业医学编辑、原子测试点及经验证的 LLM 评判所组成的混合构建流程。
  legend: 基准覆盖诊前、诊中、诊后三阶段和五类困难指令遵循能力；最终问题须通过多模型失败筛选和两层专家交叉复核。
nodes:
  - id: scope
    label: |-
      定义评测范围
      诊前 · 诊中 · 诊后
      五类指令遵循能力
      覆盖 24 个医学科室
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      收集开放医学来源
      文本与图像
      映射至科室和场景
      为图像合成专属临床问题
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: preprocess
    label: |-
      预处理原始问题
      规范化来源内容
      分配健康咨询任务
      分配治疗与康复监测任务
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: system
    label: |-
      创建场景提示词
      系统智能体定义角色
      编码工作流要求
      编码医学安全约束
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: dialogue
    label: |-
      合成多轮对话
      用户智能体模拟真实用户
      响应智能体服务特定场景
      生成长对话历史
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: challenge
    label: |-
      演化困难末轮问题
      生成智能体瞄准一个能力维度
      注入噪声 · 歧义 · 冲突
      同步生成原子测试点
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: verify
    label: |-
      核验合成候选
      验证智能体调用多个模型
      过滤薄弱或不可用问题
      保留可能具有挑战的样本
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stages
    label: |-
      逐场景扩展
      先构建诊前阶段
      抽取画像传入下一阶段
      延续至诊中和诊后
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: edit
    label: |-
      执行专业医学编辑
      约 20 名全职医学硕博编辑
      修正连贯性与场景标签
      纠正医学和评分问题
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: review
    label: |-
      执行两层交叉复核
      同一任务分配给不同评审
      第三评审解决分歧
      丢弃不合理样本
    type: user
    size: xl
    position:
      x: 980
      'y': 420
  - id: dataset
    label: |-
      定稿 MedMT-Bench
      400 个用例 · 九个子场景
      平均 22 轮 · 最长 52 轮
      保留多个模型均答错的问题
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: inference
    label: |-
      运行 17 个前沿模型
      文本与图文子集
      保持推理参数一致
      记录末轮响应
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: judge
    label: |-
      按原子测试点评判
      Gemini-2.5-Pro · 温度 0
      每条标准二元判断是或否
      使用实例专属评分标准
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告细粒度准确率
      按用例聚合测试标准
      按阶段和能力维度拆分
      人机一致率 91.94%
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scope
    to: sources
    type: primary
  - from: sources
    to: preprocess
    type: primary
  - from: preprocess
    to: system
    type: primary
  - from: system
    to: dialogue
    type: primary
  - from: dialogue
    to: challenge
    type: primary
  - from: challenge
    to: verify
    type: primary
  - from: verify
    to: stages
    type: primary
  - from: stages
    to: edit
    type: primary
  - from: edit
    to: review
    type: primary
  - from: review
    to: dataset
    type: primary
  - from: dataset
    to: inference
    type: primary
  - from: inference
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
