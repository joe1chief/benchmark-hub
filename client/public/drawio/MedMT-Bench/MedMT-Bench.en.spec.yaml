    Paper-aligned hybrid construction with open medical text and images, five-agent dialogue synthesis, scene-by-scene
    progression, professional medical editing, atomic test points, and validated LLM judging.
  legend: >-
    The benchmark spans pre-, in-, and post-diagnosis stages and five difficult instruction-following dimensions; final
    questions survive multi-model failure screening and two-layer expert cross-review.
