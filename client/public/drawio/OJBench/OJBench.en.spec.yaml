meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OJBench Build and Evaluation Process
  description: >-
    Paper-aligned construction from NOI and ICPC tasks, full organizer-test validation, complete special-judge removal,
    NOI-only verified translation with an explicit ICPC bypass, source-specific difficulty labeling, fenced-code
    parsing, and full-judge Pass@1/Pass@8 scoring.
  legend: >-
    The upper lane builds the benchmark left-to-right. NOI alone passes through GPT-4o translation; ICPC bypasses that
    step. Both then use source-specific difficulty rules before merging into the 232-problem release. The lower lane
    evaluates eight Python and C++ candidates under the published 10-second and 1-GiB judge limits.
