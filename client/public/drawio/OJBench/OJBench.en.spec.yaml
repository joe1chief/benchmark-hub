meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OJBench Build and Evaluation Process
  description: >-
    Paper-aligned collection, full-test validation, difficulty labeling, bilingual execution, and Pass@n evaluation of
    competition-level NOI and ICPC programming problems.
  legend: >-
    Read benchmark construction left-to-right, then model evaluation right-to-left; the 232-problem release contains 159
    NOI and 73 ICPC tasks and is judged on every available official test.
nodes:
  - id: sources
    label: |-
      Competition-Level Sources
      Luogu NOI + Official ICPC Website
      Statements + Organizer Test Cases
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: test_gate
    label: |-
      Full-Test Validation Gate
      Run Correct Contestant Submissions
      Remove Incomplete / Erroneous Test Sets
    type: decision
    size: xl
    position:
      x: 320
      'y': 100
  - id: judge_gate
    label: |-
      Standard-Judge Compatibility
      Require Direct Output Comparison
      Remove Tasks with Unavailable Special Judges
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: translation
    label: |-
      NOI English Translation
      GPT-4o Translates Descriptions
      Manual Meaning and Format Verification
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: difficulty
    label: |-
      Source-Specific Difficulty
      NOI: Solver Votes 2-3 / 4-5 / 6-7
      ICPC: Acceptance + Attempt Score Thresholds
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      OJBench: 232 Problems
      159 NOI + 73 ICPC
      36 Easy / 79 Medium / 117 Hard
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      Competition Problem Input
      Description + Constraints + I/O Examples
      Request a Complete Program
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: sample
    label: |-
      Eight Candidate Solutions
      API or vLLM + Official Model Settings
      Up to 64k Tokens for Reasoning Models
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: languages
    label: |-
      Dual-Language Assessment
      Generate Python and C++ Programs
      Preserve Competition Time Constraints
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      Execute Entire Official Test Set
      Compile / Run in the Judge Environment
      Avoid Small-Test False Positives
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: correctness
    label: |-
      Exact Correctness Gate
      Every Test Case Must Pass
      Any Failure Rejects the Candidate
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      OJBench Results
      Pass@1 and Pass@8
      By Language and Difficulty
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: test_gate
    type: primary
  - from: test_gate
    to: judge_gate
    type: primary
  - from: judge_gate
    to: translation
    type: primary
  - from: translation
    to: difficulty
    type: primary
  - from: difficulty
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: sample
    type: primary
  - from: sample
    to: languages
    type: primary
  - from: languages
    to: execute
    type: primary
  - from: execute
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
modules: []
