meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OJBench 构建与评测流程
  description: 按论文展示竞赛级 NOI 与 ICPC 题目的收集、完整测试验证、难度标注、双语言执行与 Pass@n 评测。
  legend: 先从左到右阅读基准构建，再从右到左阅读模型评测；232 题由 159 道 NOI 与 73 道 ICPC 组成，并使用全部官方测试判题。
nodes:
  - id: sources
    label: |-
      竞赛级来源
      洛谷 NOI + ICPC 官方网站
      题面 + 主办方测试用例
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: test_gate
    label: |-
      完整测试验证门
      运行选手正确提交
      移除不完整或错误测试集
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: judge_gate
    label: |-
      标准判题兼容性
      要求可直接比较输出
      移除缺少特殊判题器的任务
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: translation
    label: |-
      NOI 英文翻译
      GPT-4o 翻译题面
      人工核验含义与格式
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: difficulty
    label: |-
      分来源难度标注
      NOI：解题者投票 2-3 / 4-5 / 6-7
      ICPC：通过率 + 尝试率阈值
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      OJBench：232 题
      159 道 NOI + 73 道 ICPC
      简单 36 / 中等 79 / 困难 117
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      竞赛题输入
      题面 + 约束 + 输入输出示例
      要求生成完整程序
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: sample
    label: |-
      8 个候选解
      API 或 vLLM + 模型官方设置
      推理模型最多 64k Token
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: languages
    label: |-
      双语言评测
      生成 Python 与 C++ 程序
      保留竞赛时间约束
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      执行全部官方测试
      在判题环境编译 / 运行
      避免少量测试导致假阳性
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: correctness
    label: |-
      精确正确性门
      必须通过每个测试用例
      任一失败即拒绝候选
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      OJBench 结果
      Pass@1 与 Pass@8
      按语言和难度报告
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: sources
    to: test_gate
    type: primary
  - from: test_gate
    to: judge_gate
    type: primary
  - from: judge_gate
    to: translation
    type: primary
  - from: translation
    to: difficulty
    type: primary
  - from: difficulty
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: sample
    type: primary
  - from: sample
    to: languages
    type: primary
  - from: languages
    to: execute
    type: primary
  - from: execute
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
modules: []
