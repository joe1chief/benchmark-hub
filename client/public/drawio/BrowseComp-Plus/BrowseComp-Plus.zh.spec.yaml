meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BrowseComp-Plus 构建流程
  description: >-
    按论文把 1,266 道 BrowseComp 问题转为固定 100,195 篇去重语料上的 830 道人工验证查询，加入困难负样本、 evidence/gold qrels、受控检索器-Agent
    运行、答案与引用评分以及独立检索诊断。
  legend: 实线表示语料构建与 Agent 评测，虚线把语料统计和 Qrels 送入诊断报告。
nodes:
  - id: original
    label: |-
      从原始 BrowseComp 出发
      1,266 个复杂问答对
      替代动态黑盒网页评测
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: o3_mining
    label: |-
      使用 OpenAI o3 与网页搜索
      生成线索、候选 URL 与证据片段
      抓取候选页面
    type: process
    size: xl
    position:
      x: 320
      'y': 220
  - id: initial_filter
    label: |-
      过滤幻觉 URL 与抓取失败
      为 1,142 个查询保留初始证据
      把证据链送入人工复核
    type: decision
    size: xl
    position:
      x: 600
      'y': 220
  - id: human_verify
    label: |-
      14 位学生标注员验证证据
      超过 400 小时 • 一致率超过 80%
      检查每条线索与完整作答链
    type: user
    size: xl
    position:
      x: 880
      'y': 40
  - id: verified
    label: |-
      得到 830 个验证查询
      标记推理必需的 Evidence 文档
      标记同时含最终答案的 Gold 文档
    type: database
    size: xl
    position:
      x: 1160
      'y': 40
  - id: decompose
    label: |-
      GPT-4o 分解每个查询
      平均生成七条搜索子查询
      定位主题相关的干扰文档
    type: process
    size: xl
    position:
      x: 880
      'y': 400
  - id: hard_negatives
    label: |-
      用 Google Search API 挖掘困难负样本
      主题相关但不能帮助得到最终答案
      增加检索难度
    type: process
    size: xl
    position:
      x: 1160
      'y': 400
  - id: corpus
    label: |-
      构建固定去重语料
      830 个查询共 100,195 篇文档
      平均 6.1 Evidence • 76.28 负样本 • 2.9 Gold
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: retrievers
    label: |-
      配置受控检索器
      BM25 • Qwen3-Embedding 0.6B / 4B / 8B
      ReasonIR 8B • Oracle 证据上下文
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: topk
    label: |-
      每次搜索返回 Top-5
      每条结果截断到 512 Token
      可选 get-document 工具打开全文
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: agent
    label: |-
      Deep-Research Agent 迭代搜索
      规划查询 • 阅读结果 • 交叉核验证据
      返回最终答案与文档引用
    type: process
    size: xl
    position:
      x: 2280
      'y': 220
  - id: answer_score
    label: |-
      评分端到端作答
      归一化答案准确率与 Recall
      统计搜索调用次数与 Agent 成本
    type: process
    size: xl
    position:
      x: 2560
      'y': 40
  - id: citation_score
    label: |-
      评分引用落地性
      对 Positive 文档计算 Precision 与 Recall
      保留逐查询指标
    type: process
    size: xl
    position:
      x: 2560
      'y': 220
  - id: retrieval_score
    label: |-
      评分独立检索
      Evidence 与 Gold Recall@5 / 100 / 1000
      对公开 Qrels 计算 NDCG@10
    type: process
    size: xl
    position:
      x: 2560
      'y': 400
  - id: report
    label: |-
      报告受控 Agent 与检索器结果
      解耦检索、推理、引用与上下文
      比较 BM25、稠密检索、Oracle 与消融
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 220
edges:
  - from: original
    to: o3_mining
    type: primary
  - from: o3_mining
    to: initial_filter
    type: primary
  - from: initial_filter
    to: human_verify
    type: primary
  - from: human_verify
    to: verified
    type: primary
  - from: initial_filter
    to: decompose
    type: primary
  - from: decompose
    to: hard_negatives
    type: primary
  - from: verified
    to: corpus
    type: primary
  - from: hard_negatives
    to: corpus
    type: primary
  - from: corpus
    to: retrievers
    type: primary
  - from: retrievers
    to: topk
    type: primary
  - from: topk
    to: agent
    type: primary
  - from: agent
    to: answer_score
    type: primary
  - from: agent
    to: citation_score
    type: primary
  - from: retrievers
    to: retrieval_score
    type: primary
  - from: answer_score
    to: report
    type: primary
  - from: citation_score
    to: report
    type: primary
  - from: retrieval_score
    to: report
    type: primary
modules: []
