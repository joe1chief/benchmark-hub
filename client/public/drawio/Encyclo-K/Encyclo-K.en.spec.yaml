  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Encyclo-K Build Process
  description: >-
    Revision-pinned textbook statement curation, deceptive false-statement synthesis, dynamic question assembly, and
    exact option parsing.
  legend: >-
    Solid arrows follow the paper's three construction stages; the dashed arrow pins paper, repository, and dataset.
    Section 3.1.1 has 43 source subfields, while the final collection has 44 fields / 62 subfields.
