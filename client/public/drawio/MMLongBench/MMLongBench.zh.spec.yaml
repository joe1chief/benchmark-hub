meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMLongBench 构建流程
  description: 按论文将 16 个现有数据集的 13,331 个样本整理为五类长上下文视觉语言任务，并为每个样本提供五档标准跨模态长度。
  legend: 各任务分别采用准确率、子串精确匹配或基于 GPT-4o 的流畅度 F1，并非使用单一统一指标。
nodes:
  - id: source
    label: |-
      选择 16 个现有数据集
      覆盖自然与合成图像
      复用已有高质量标注
      不再新增众包标注
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: categories
    label: |-
      组织五类任务
      视觉 RAG · NIAH · ICL
      PDF 摘要
      长文档视觉问答
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: vrag
    label: |-
      构建视觉 RAG 上下文
      维基文本切为百词段落
      在不同深度插入金标准证据
      添加干扰段直至目标长度
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: niah
    label: |-
      改造 NIAH 任务
      控制负例图像或网页文本
      混合文本与图像针
      测试检索 · 计数 · 推理
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: icl
    label: |-
      构建多样例上下文学习
      五档依次使用 5 · 10 · 20 · 40 · 50 类
      平衡上下文示例数量
      随机映射整数标签
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: summary
    label: |-
      渲染摘要任务 PDF
      使用 GovReport 与 Multi-LexSum
      将参考摘要分解为原子事实
      准备模型评判指标
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: docvqa
    label: |-
      改造长文档视觉问答
      使用三个文档问答数据集
      保留包含答案的页面
      通过页面截断控制长度
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: tokenize
    label: |-
      统一计算跨模态词元
      按视觉编码器计算图像块
      应用像素重排
      合并图像与文本词元
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: lengths
    label: |-
      标准化五档输入长度
      8K · 16K · 32K 词元
      64K · 128K 词元
      支持继续扩展长度
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: dataset
    label: |-
      汇总 MMLongBench
      共 13,331 个样本
      五类任务 · 16 个数据集
      每样本提供多档长度
    type: database
    size: xl
    position:
      x: 580
      'y': 420
  - id: evaluate
    label: |-
      评测 46 个长上下文模型
      每档抽样 4,050 个样本
      每模型运行五档长度
      合计 20,250 次评测
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      按任务报告指标
      准确率与子串精确匹配
      摘要采用 GPT-4o 流畅度 F1
      按任务与长度汇总
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: categories
    type: primary
  - from: categories
    to: vrag
    type: primary
  - from: vrag
    to: niah
    type: primary
  - from: niah
    to: icl
    type: primary
  - from: icl
    to: summary
    type: primary
  - from: summary
    to: docvqa
    type: primary
  - from: docvqa
    to: tokenize
    type: primary
  - from: tokenize
    to: lengths
    type: primary
  - from: lengths
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
