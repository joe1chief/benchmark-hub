meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMLongBench Build Process
  description: >-
    Paper-aligned assembly of 13,331 examples from 16 existing datasets into five long-context vision-language task
    categories, each delivered at five standardized cross-modal token lengths.
  legend: >-
    Evaluation uses task-appropriate Accuracy, Substring Exact Match, or GPT-4o-based Fluency-F1 rather than one
    universal metric.
