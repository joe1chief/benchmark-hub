meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMLongBench v3 Build and Evaluation Process
  description: >-
    Paper-v3 and fixed-release reconstruction of 13,331 examples from 16 source datasets, including five task-specific
    builders, unified cross-modal length control, paper-era prompts and parsers, failure handling, and the exact
    4,050-per-length evaluation denominator.
  legend: >-
    Solid arrows are the paper/repository execution path; dotted arrows mark provenance or drift. Decision-edge outcomes
    use English labels. The academic-color theme supplies the default 11pt node font. MMLongBench-Doc is one source
    dataset inside this suite, not the separately scored MMLongBench-Doc benchmark pipeline.
nodes:
  - id: evidence
    label: |-
      Fixed Evidence Boundary
      arXiv 2505.10610v3 · 6 Oct 2025
      Code 69044ca · Data 0c008eb
      13,331 Rows · 16 Source Datasets
    type: document
    size: xl
    position:
      x: 40
      'y': 520
  - id: category_route
    label: |-
      Which Long-context
      Task Category?
    type: decision
    size: xl
    position:
      x: 320
      'y': 520
  - id: vrag_build
    label: |-
      Visual RAG · 2,272 Rows
      InfoSeek Lead + ViQuAE KILT Gold
      Wikipedia 2019-08-01 · 100 Words
      BM25 → GTE-large Hard Negatives
      3 Permutations / 6 Gold Depths
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: niah_build
    label: |-
      NIAH · 5,536 Rows
      VH-Single / Multi + MM-NIAH
      Ret · Count · Reason, Text + Image
      Web Text in 100-word Chunks
      Add Distractors to Length L
    type: process
    size: xl
    position:
      x: 600
      'y': 260
  - id: icl_build
    label: |-
      Many-shot ICL · 1,958 Rows
      Cars · Food101 · SUN397 · iNat2021
      5/10/20/40/50 Classes by Length
      Random IDs 0…N−1 · Balanced Rounds
      Truncate Only the Last Round
    type: process
    size: xl
    position:
      x: 600
      'y': 480
  - id: summ_build
    label: |-
      PDF Summarization · 387 Rows
      GovReport: GAO Only; Remove Summary
      Multi-LexSum: Rebuild PDFs from HTML
      Remove Answer HTML; Truncate from End
      Drop >128K + 24K · 15,951 Claims
    type: process
    size: xl
    position:
      x: 600
      'y': 700
  - id: doc_build
    label: |-
      Long-document VQA · 3,178 Rows
      MMLongBench-Doc · LongDocURL · SlideVQA
      Correct Answer Formats; Drop Unrecoverable
      Drop String Answers Longer than 5 Words
      Keep Original Document ID in Question
    type: process
    size: xl
    position:
      x: 600
      'y': 920
  - id: doc_length_gate
    label: |-
      Document Longer
      than Target L?
    type: decision
    size: xl
    position:
      x: 880
      'y': 920
  - id: doc_truncate
    label: |-
      Truncate Both Sides Evenly
      Preserve Every Answer Page
      Stop at Target Length L
    type: process
    size: xl
    position:
      x: 1160
      'y': 840
  - id: doc_pad
    label: |-
      Alternate Left / Right Padding
      Sample Negative Documents
      Last Padding PDF May Be Page-truncated
      Prefix “Based on Document {ID}…”
    type: process
    size: xl
    position:
      x: 1160
      'y': 1020
  - id: token_count
    label: |-
      Unified Cross-modal Token Count
      Text = Llama2 Tokenizer
      Image = 14×14 Patches
      Apply 2×2 Pixel Unshuffle
      Sum Text + Visual Tokens
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: length_versions
    label: |-
      Materialize Five Lengths
      8K · 16K · 32K · 64K · 128K
      Binary K = 2¹⁰
      Same Semantic Example at Each L
    type: process
    size: xl
    position:
      x: 2000
      'y': 520
  - id: release
    label: |-
      MMLongBench Paper Release
      13,331 Examples · Five Categories
      MMLongBench-Doc Slice = 961 Rows
      ≠ Stand-alone 1,082-row Release
      MIT Card; Source Licenses Still Apply
    type: database
    size: xl
    position:
      x: 2280
      'y': 520
  - id: denominator
    label: |-
      Evaluation Denominator per Length
      VRAG 900 · NIAH 2,250 · ICL 400
      Summarization 200 · DocVQA 300
      Total = 4,050 Cases at Each L
    type: process
    size: xl
    position:
      x: 2560
      'y': 520
  - id: inference
    label: |-
      Evaluate 46 LCVLMs
      Greedy Candidate Decoding
      Five Input Lengths per Model
      4,050 × 5 = 20,250 Runs
      Untestable Capacity Cases = N/A
    type: user
    size: xl
    position:
      x: 2840
      'y': 520
  - id: metric_route
    label: |-
      Which Category-specific
      Parser and Metric?
    type: decision
    size: xl
    position:
      x: 3120
      'y': 520
  - id: vrag_metric
    label: |-
      Visual RAG Metric
      Parse “Answer:” then First Line
      Normalize Case / Punctuation / Articles
      Substring Exact Match
      900 Cases per Length
    type: process
    size: xl
    position:
      x: 3400
      'y': 40
  - id: niah_metric
    label: |-
      NIAH Metrics
      VH = Binary Accuracy
      MM Text Ret/Reason = SubEM
      MM Image Ret/Reason = Choice Accuracy
      Count = Exact Sum; Modalities Averaged
    type: process
    size: xl
    position:
      x: 3400
      'y': 260
  - id: icl_metric
    label: |-
      ICL Metric
      Require “label: {integer}”
      Fallback to Last, then First Number
      Exact Class Accuracy
      400 Cases per Length
    type: process
    size: xl
    position:
      x: 3400
      'y': 480
  - id: summ_judge
    label: |-
      GPT-4o Summary Judge
      Gold → Pre-generated Atomic Claims
      Candidate → Sentence Precision
      Claim Recall + Binary Fluency
      T=0.1 · max_tokens=4096
    type: process
    size: xl
    position:
      x: 3400
      'y': 700
  - id: summ_parse_gate
    label: |-
      Last JSON Object Parses
      for All Three Calls?
    type: decision
    size: xl
    position:
      x: 3680
      'y': 700
  - id: summ_formula
    label: |-
      Summary Score
      Recall = Found Claims / Gold Claims
      Precision = Supported / Sentences
      F1 = Harmonic Mean
      Fluency-F1 = Fluency × F1
    type: formula
    size: xl
    position:
      x: 3960
      'y': 620
  - id: summ_skip
    label: |-
      Summary Judge Failure Handling
      Request: Retry 5×, Then Raise
      Invalid JSON: Skip This Sample
      Aggregate Rows with gpt4-scores Only
      Zero Scored Rows → Raise Error
    type: terminal
    size: xl
    position:
      x: 3960
      'y': 800
  - id: doc_parse
    label: |-
      DocVQA Direct Parser
      Prefer Text after “Answer:”
      Otherwise Use First Output Line
      No GPT-4o Answer Extractor in v3
    type: process
    size: xl
    position:
      x: 3400
      'y': 1060
  - id: doc_format
    label: Reference Answer Format?
    type: decision
    size: xl
    position:
      x: 3680
      'y': 1120
  - id: doc_string
    label: |-
      String / None
      Regex-sensitive Value → SubEM
      Otherwise Token F1
    type: process
    size: xl
    position:
      x: 3960
      'y': 1000
  - id: doc_integer
    label: |-
      Integer
      Extract All Finite Integers
      Any Exact Match → 1, Else 0
    type: process
    size: xl
    position:
      x: 3960
      'y': 1140
  - id: doc_float
    label: |-
      Float
      Extract All Finite Numbers
      Accept x/100, x, or 100x
      Relative Tolerance = 1%
    type: process
    size: xl
    position:
      x: 3960
      'y': 1280
  - id: doc_list
    label: |-
      List
      Paper: Greedy Best Element Match
      Average Element Scores
      Pinned Code Scores Each Gold Element
      against Full Parsed Prediction
    type: process
    size: xl
    position:
      x: 3960
      'y': 1420
  - id: report
    label: |-
      Report by Dataset, Category, Length
      Accuracy · SubEM · Fluency-F1
      DocVQA Rule Score
      Do Not Convert N/A into Failure
      v1.1 LLM Judge Is Outside This Pin
    type: terminal
    size: xl
    position:
      x: 4240
      'y': 520
