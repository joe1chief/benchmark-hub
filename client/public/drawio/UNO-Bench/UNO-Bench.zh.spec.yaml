meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: UNO-Bench 构建与评测流程
  description: >-
    UNO-Bench在44类任务和5种模态组合上联合衡量单模态与全模态智能。作者人工整理1250个全模态样本，并核验98%的跨模态可解性，再加入2480个增强单模态样本，形成3730条评测集。题型包括选择题和多步开放题。压缩评测集在保持论文所报一致性的同时加速公共benchmark评测。通用评分模型支持6种题型，并经人工验证达到95%评分准确率。结果对照单模态与全模态得分，用于分析组合定律与瓶颈效应。
  legend: 来源：UNO-Bench arXiv:2510.18915; official meituan-longcat/UNO-Bench repository。实线箭头表示论文或官方资料明确支持的主流程。
