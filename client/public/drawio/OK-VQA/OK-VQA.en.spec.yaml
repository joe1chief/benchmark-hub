meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OK-VQA Build and Evaluation Process
  description: >-
    Paper-aligned crowdsourcing and filtering of external-knowledge visual questions over COCO images, followed by the
    official five-answer VQA scoring protocol and knowledge-category reporting.
  legend: >-
    OK-VQA requires information unavailable from the image and question alone. Five answer annotations are each counted
    twice to match the standard ten-answer VQA metric, after Porter stemming.
nodes:
  - id: images
    label: |-
      Sample Natural COCO Images
      Use Original Train and Validation Splits
      About 80K and 40K Images
      Preserve Visually Complex Scenes
    type: database
    size: xl
    position:
      x: 20
      'y': 70
  - id: questions
    label: |-
      Crowdsource Knowledge Questions
      MTurk Round 1
      Ask Questions to Fool a Smart Robot
      Require Image Relation and Outside Knowledge
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: answers
    label: |-
      Collect Open-ended Answers
      MTurk Round 2
      Five Independent Workers per Pair
      Preserve Multiple Valid Answers
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: knowledge_filter
    label: |-
      Manually Filter for Knowledge
      Remove Counting and Detection Questions
      Remove Image-independent or Nonsensical Items
      86,700 → 34,921 Questions
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: bias_filter
    label: |-
      Reduce Answer-frequency Bias
      Cap Repeated Modal Answers
      Remove Items beyond Five Instances
      Emphasize Long-tail Answers
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: agreement
    label: |-
      Any Agreement?
      Drop Zero-agreement Items
    type: decision
    size: xl
    position:
      x: 1220
      'y': 40
  - id: split
    label: |-
      Preserve COCO-derived Splits
      9,009 Training Questions
      5,046 Test Questions
      No Synthetic Knowledge Corpus
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: categories
    label: |-
      Annotate Knowledge Categories
      Five Workers per Question
      Ten Defined Categories
      Plurality Label or Other
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release OK-VQA
      14,055 Questions · 14,031 Images
      Five Answers per Question
      Open-ended External-knowledge VQA
    type: database
    size: xl
    position:
      x: 1220
      'y': 450
  - id: input
    label: |-
      Present Image and Question
      Recognize Relevant Visual Content
      Identify Missing Knowledge
      Retrieve and Integrate Outside Facts
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: predict
    label: |-
      Generate an Open Answer
      No Multiple-choice Options
      Use Image and External Knowledge
      Compare with Human Answers
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: stem
    label: |-
      Normalize Answer Morphology
      Apply Porter Stemming
      Merge Plural and Conjugated Forms
      Retain Semantic Answer Content
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      Apply Standard VQA Score
      Duplicate Each of Five Answers Twice
      Match Ten-annotation Convention
      Award Agreement-based Credit
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report OK-VQA Performance
      Overall VQA Score
      Ten Knowledge Categories
      Plus Other Category Breakdown
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
