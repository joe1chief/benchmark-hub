meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ToolBench 构建与评测流程
  description: >-
    ToolBench从RapidAPI收集并过滤49类16464个真实API。ChatGPT依据API文档与人工种子示例，在单工具、同类别多工具和跨类别多工具三种采样策略下生成多样指令，并过滤API不相关或幻觉调用的指令。随后ChatGPT调用实时API，深度优先决策树搜索探索替代路径，只保留可执行的解题轨迹。评测时先由神经检索器选择候选API，再由智能体推理并调用工具；ToolEval通过ChatGPT多数投票计算通过率，并通过成对比较计算胜率，最后用人工核验评估器可靠性。
  legend: 来源：ToolLLM/ToolBench arXiv:2307.16789, Sections 3-4; official OpenBMB/ToolBench repository。实线箭头表示论文或官方资料明确支持的主流程。
