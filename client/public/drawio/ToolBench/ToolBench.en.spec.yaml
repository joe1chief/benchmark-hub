meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ToolBench Build and Evaluation Process
  description: >-
    ToolBench collects and filters 16,464 real APIs in 49 RapidAPI categories. ChatGPT generates diverse instructions
    from API documentation and human-written seed examples under single-tool, same-category multi-tool, and
    cross-category multi-tool sampling strategies. Generated instructions are filtered for relevant, non-hallucinated
    APIs. ChatGPT then calls live APIs while depth-first decision-tree search explores alternative paths; only
    executable solution traces are retained. At evaluation time a neural retriever selects candidate APIs, the agent
    reasons and calls tools, and ToolEval uses ChatGPT majority voting for pass rate plus pairwise comparison for win
    rate, with human checks validating the evaluator.
  legend: >-
    Source: ToolLLM/ToolBench arXiv:2307.16789, Sections 3-4; official OpenBMB/ToolBench repository. Solid arrows show
    the main flow explicitly supported by the paper or official documentation.
