meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProtocolQA Open-Ended 构建与评测流程
  description: 按系统卡把FutureHouse ProtocolQA中的108道选择题改写为真实的湿实验故障排除简答题，以pass@1评测模型并建立19名科学家的新专家基线。
  legend: 这是OpenAI的108题开放式衍生版本，不是原始135题ProtocolQA选择题，也不是LAB-Bench论文中另做的20题开放回答分析。
nodes:
  - id: step_1
    label: |-
      从FutureHouse ProtocolQA出发
      使用已发表实验方案场景
      保留常见湿实验流程
      来源为135题选择题子任务
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      选择108道来源题
      从ProtocolQA固定选择子集
      保留实验故障排除范围
      保持一个预期纠正答案
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      移除多项选择选项
      消除答案选项提示
      阻止依靠排除干扰项
      要求自由回忆与推理
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      改写为简答任务
      替换选择题措辞
      要求直接给出纠正操作
      无选项时仍保持可回答
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      保留严重方案错误
      保留有意破坏的步骤
      使用常见已发表实验方案
      保持明确的失败原因
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      描述湿实验结果
      陈述观察到的失败输出
      把结果关联到错误步骤
      提供真实故障排除上下文
    type: document
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      询问如何修复流程
      要求开放式回答
      聚焦实际实验方案修复
      不泄露理想答案
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      冻结108题评测集
      只使用开放式简答
      比选择题更难且更真实
      评测湿实验故障排除能力
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      招募专家基线组
      纳入19名博士科学家
      要求超过一年湿实验经验
      为该变体采集新基线
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      让专家回答同一批题
      给出简短纠正建议
      评分每名专家表现
      得到共识与中位数基线
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      执行模型评测
      逐题提供开放式问题
      收集一个简答完成
      pass@1只使用一次尝试
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      判断任务是否通过
      标记模型回答是否合格
      对照预期修复措施
      此处未公开评分器细节
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      聚合pass@1
      统计108题中的通过数
      报告单次尝试通过率
      一致比较不同模型变体
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      对比专家基线
      专家共识基线：57%
      专家中位数基线：42%
      报告模型与专家差距
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
