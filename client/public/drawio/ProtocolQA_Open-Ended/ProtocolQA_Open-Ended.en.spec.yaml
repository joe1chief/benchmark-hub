  title: ProtocolQA Open-Ended Build and Evaluation Process
  description: >-
    System-card-aligned conversion of 108 FutureHouse ProtocolQA multiple-choice questions into realistic short-answer
    wet-lab troubleshooting tasks, with model pass@1 evaluation and a new 19-scientist expert baseline.
  legend: >-
    This is OpenAI's 108-item open-ended derivative, not the original 135-item ProtocolQA MCQ set and not the separate
    20-item open-response analysis in the LAB-Bench paper.
