meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VIBE Build and Evaluation Process
  description: >-
    MiniMax's VIBE (Visual & Interactive Benchmark for Execution) is a full-stack application benchmark, not the
    unrelated image-editing paper currently linked by this record. The official release curates 200 zero-to-one
    application specifications with difficulty and domain metadata across Web, scientific simulation, native Android,
    native iOS, and backend stacks. A coding agent builds each application in a containerized real execution
    environment. A vision-enabled Agent-as-a-Verifier acts as an autonomous QA tester, first checking
    compilation/build/launch, then completing user interactions and business workflows, and finally judging layout,
    hierarchy, color, and overall aesthetics. Scores remain separated into execution, interaction, and visual layers.
  legend: >-
    Source: Official MiniMax VIBE benchmark article and MiniMaxAI/VIBE dataset card; no standalone VIBE paper is cited
    by the release. Solid arrows show the main flow explicitly supported by the paper or official documentation.
