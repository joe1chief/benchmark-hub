meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Finance Agent Benchmark Build Process
  description: Paper-aligned expert construction, rubric development, tool-using agent evaluation, and class-balanced scoring.
  legend: >-
    Solid arrows follow arXiv:2508.00828. Rubrics are derived from expert answers and reviewed manually; final
    correctness requires every rubric check and no contradiction.
nodes:
  - id: taxonomy
    label: |-
      Consult 7 financial-industry experts
      banks · hedge funds · private equity / startups
      define 9 practical task categories and difficulty
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: questions
    label: |-
      Experts author 537 real research questions
      require multiple public documents / SEC filings
      focus on documents published from 2024 onward
    type: document
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotations
    label: |-
      Attach expert supervision to each question
      ground-truth answer · necessary sources
      step-by-step solution / calculation trajectory
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: review
    label: |-
      A different expert peer-reviews each item
      correct or remove calculation/content errors
      authors standardize formatting in a final review
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: rubrics
    label: |-
      GPT-4o extracts atomic answer rubrics
      authors verify every generated criterion
      add a whole-answer contradiction rubric
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: splits
    label: |-
      Preserve category distributions across splits
      public validation 50 · private validation 150
      fully private test 337
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: harness
    label: |-
      Run the same ReAct-style agent harness
      Google Search · EDGAR Search · Parse HTML
      Retrieve Information via a key-value store
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: judge
    label: |-
      LLM judge scores each rubric separately
      apply conjunction across required checks
      reject any conflict with the expert answer
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: metrics
    label: |-
      Report accuracy with uncertainty
      primary: equal-weight mean of 9 category accuracies
      also naive accuracy, time, tool use, and cost
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: taxonomy
    to: questions
    type: primary
  - from: questions
    to: annotations
    type: primary
  - from: annotations
    to: review
    type: primary
  - from: review
    to: rubrics
    type: primary
  - from: rubrics
    to: splits
    type: primary
  - from: splits
    to: harness
    type: primary
  - from: harness
    to: judge
    type: primary
  - from: judge
    to: metrics
    type: primary
modules: []
