meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Finance Agent Benchmark 构建流程
  description: 与论文对齐的专家构建、评分规则、智能体协议及明确的公开/私有发布边界。
  legend: 实线按 arXiv:2508.00828v1 展示；虚线把 50 行公开数据与固定的 2026 仓库执行器同论文协议分开。受限评分实现未在公开仓库发布。
nodes:
  - id: evidence
    label: |-
      证据边界：arXiv:2508.00828v1
      finance-agent @ 82337852
      公开集 SHA 901e8cff
      论文协议 + 固定 2026 仓库审计
    type: document
    size: xl
    position:
      x: 40
      'y': 180
  - id: taxonomy
    label: |-
      咨询 7 位金融行业从业者
      定义 9 类真实分析师任务
      从简单检索到困难市场分析
    type: process
    size: xl
    position:
      x: 300
      'y': 180
  - id: questions
    label: |-
      专家编写 537 道多文档问题
      使用 2024 年起的开放网页 / SEC 来源
      覆盖检索、推理、建模与分析
    type: document
    size: xl
    position:
      x: 560
      'y': 180
  - id: annotations
    label: |-
      附上专家答案与必要来源
      记录逐步求解轨迹
      问题必须可由公开数据回答
    type: database
    size: xl
    position:
      x: 820
      'y': 180
  - id: peer_review
    label: |-
      异人专家检查每个样例
      纠正或移除计算/内容错误
      作者最后统一格式
    type: process
    size: xl
    position:
      x: 1080
      'y': 180
  - id: rubric_generation
    label: |-
      GPT-4o 提示返回 JSON 数组
      从答案抽取原子 operator/criteria 检查
      作者人工复核并加入矛盾项
    type: process
    size: xl
    position:
      x: 1340
      'y': 180
  - id: splits
    label: |-
      保持 9 类任务的分布
      公开验证 50 · 私有验证 150
      完全私有测试 337 · 指标使用全部 537
    type: database
    size: xl
    position:
      x: 1600
      'y': 180
  - id: paper_prompt
    label: |-
      论文运行：相同用户提示，无系统提示
      以 FINAL ANSWER 和来源结束
      temperature 0 · 支持时最多 16,384
    type: process
    size: xl
    position:
      x: 1860
      'y': 180
  - id: tools
    label: |-
      ReAct 风格智能体使用四个工具
      GoogleSearch · EdgarSearch
      ParseHTML · RetrieveInformation
      后者访问键值存储
    type: process
    size: xl
    position:
      x: 2120
      'y': 180
  - id: judge
    label: |-
      LLM 评审逐项评分原子规则
      仅当全部正确性检查通过
      且与专家答案无矛盾时才正确
    type: process
    size: xl
    position:
      x: 2380
      'y': 180
  - id: metrics
    label: |-
      主指标：9 类准确率等权平均
      同时报告朴素逐题准确率
      以及时间、工具使用与单题成本
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 180
  - id: public_release
    label: |-
      公开仓库仅给出 50 行
      public.csv：200 条正确性 + 50 条矛盾
      私有样例与 Vals 评分均受限
    type: database
    size: xl
    position:
      x: 1860
      'y': 470
  - id: repo_protocol
    label: |-
      固定 2026 仓库的日期为 2025-04-07
      submit_final_result · 32,000
      最多 50 轮
      评分实现与解析器均缺失
    type: document
    size: xl
    position:
      x: 2120
      'y': 470
edges:
  - from: evidence
    to: taxonomy
    type: primary
  - from: taxonomy
    to: questions
    type: primary
  - from: questions
    to: annotations
    type: primary
  - from: annotations
    to: peer_review
    type: primary
  - from: peer_review
    to: rubric_generation
    type: primary
  - from: rubric_generation
    to: splits
    type: primary
  - from: splits
    to: paper_prompt
    type: primary
  - from: paper_prompt
    to: tools
    type: primary
  - from: tools
    to: judge
    type: primary
  - from: judge
    to: metrics
    type: primary
  - from: splits
    to: public_release
    type: secondary
  - from: public_release
    to: repo_protocol
    type: secondary
modules: []
