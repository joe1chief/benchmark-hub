meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Finance Agent Benchmark 构建流程
  description: 按论文还原专家构题、评分准则开发、工具型智能体评测和类别平衡计分流程。
  legend: 实线箭头遵循 arXiv:2508.00828；评分准则由专家答案生成并经人工复核，全部准则通过且无矛盾才判为正确。
nodes:
  - id: taxonomy
    label: |-
      咨询7位金融行业专家
      银行 · 对冲基金 · 私募股权 / 初创公司
      定义9类实务任务及难度
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: questions
    label: |-
      专家编写537道真实研究问题
      要求查阅多份公开文档 / SEC申报文件
      聚焦2024年及以后发布的文档
    type: document
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotations
    label: |-
      为每题附加专家监督信息
      标准答案 · 必需来源文档
      分步解法 / 计算推理轨迹
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: review
    label: |-
      每题由另一位专家交叉复核
      修正或移除计算与内容错误
      论文作者终审并统一格式
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: rubrics
    label: |-
      GPT-4o 抽取原子答案准则
      作者人工核验每一条生成准则
      另加入整段答案矛盾检查
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: splits
    label: |-
      各划分保持任务类别分布
      公开验证集50 · 私有验证集150
      完全私有测试集337
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: harness
    label: |-
      统一运行 ReAct 风格智能体框架
      Google搜索 · EDGAR搜索 · HTML解析
      通过键值存储检索信息
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: judge
    label: |-
      LLM 评委逐条判断评分准则
      所有必需检查采用合取规则
      与专家答案有任一矛盾即判错
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: metrics
    label: |-
      报告带不确定性的准确率
      主指标为9类准确率的等权平均
      另报普通准确率、耗时、工具使用与成本
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 250
edges:
  - from: taxonomy
    to: questions
    type: primary
  - from: questions
    to: annotations
    type: primary
  - from: annotations
    to: review
    type: primary
  - from: review
    to: rubrics
    type: primary
  - from: rubrics
    to: splits
    type: primary
  - from: splits
    to: harness
    type: primary
  - from: harness
    to: judge
    type: primary
  - from: judge
    to: metrics
    type: primary
modules: []
