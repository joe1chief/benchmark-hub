  title: "SUPERChem 构建与评测流程"
  description: "SUPERChem从化学竞赛、文献改编与专家原创中策划500道覆盖多个子领域的推理密集型选择题。每道题都有对齐的多模态版与纯文本版，以及被拆成加权检查点的专家解题路径。由领域专家执行三阶段审核并以AI辅助校验，剔除缺陷和歧义题并降低污染风险。评测在两种格式上运行模型，抽取最终答案计算pass@1准确率，再把问题、选项、带检查点标签的专家路径和候选推理交给Gemini 2.5 Pro。评判器按语义等价标记检查点命中，RPF为这些命中的加权召回率。最终比较准确率、RPF、模态影响、细粒度化学能力画像及40.3%人类基线。"
  legend: "来源：SUPERChem arXiv:2512.01274 Sections 3-4.5; official superchem.pku.edu.cn site and ZehuaZhao/SUPERChem dataset card。实线箭头表示论文或官方资料明确支持的主流程。"
