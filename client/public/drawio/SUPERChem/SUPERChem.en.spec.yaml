  layout: horizontal
  routing: orthogonal
  title: "SUPERChem Build and Evaluation Process"
  description: "SUPERChem curates 500 reasoning-intensive chemistry multiple-choice problems from chemistry competitions, literature adaptation, and expert authorship across diverse subfields. Each item has aligned multimodal and text-only forms plus an expert solution path decomposed into weighted checkpoints. A three-stage domain-expert review process with AI-assisted validation removes flawed or ambiguous items and mitigates contamination. Evaluation runs models on both forms, extracts a final answer for pass@1 accuracy, and sends the question, options, checkpoint-tagged expert path, and candidate reasoning to Gemini 2.5 Pro. The judge marks semantic checkpoint matches, and RPF is the weighted recall of those matches. Results compare accuracy, RPF, modality effects, fine-grained chemistry profiles, and a 40.3% human baseline."
  legend: "Source: SUPERChem arXiv:2512.01274 Sections 3-4.5; official superchem.pku.edu.cn site and ZehuaZhao/SUPERChem dataset card. Solid arrows show the main flow explicitly supported by the paper or official documentation."
