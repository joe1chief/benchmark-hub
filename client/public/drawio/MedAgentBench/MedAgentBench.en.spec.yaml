    label: Synthetic demographics
    labelPosition: center
  - from: fhir_resources
    to: environment
    type: primary
    label: 785,207 resources
    labelPosition: center
  - from: environment
    to: benchmark_release
    type: primary
    label: Unpinned latest FHIR image
    labelPosition: center
  - from: benchmark_release
