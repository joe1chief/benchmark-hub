    type: primary
    label: Query · GET only
    labelPosition: center
  - from: grader_type
    to: action_grade
    type: primary
    label: Action · POST required
    labelPosition: center
  - from: query_grade
    to: correctness
    type: primary
    label: Reference comparison
    labelPosition: center
  - from: action_grade
    to: correctness
    type: primary
    label: Payload rules
    labelPosition: center
