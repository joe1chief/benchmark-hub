    label: Released task JSON
    labelPosition: center
  - from: source_assets
    to: benchmark_release
    type: primary
    label: Pinned Git assets
    labelPosition: center
  - from: cohort
    to: extract
    type: primary
    label: 100 patient profiles
    labelPosition: center
  - from: extract
