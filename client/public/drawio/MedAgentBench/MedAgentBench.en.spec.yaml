    label: Yes · valid JSON
    labelPosition: center
  - from: post_json
    to: post_reject
    type: optional
    label: No · invalid JSON
    labelPosition: center
  - from: post_accept
    to: output_type
    type: primary
    label: Accepted feedback · next round
    labelPosition: center
    waypoints:
      - x: 980
        'y': 680
      - x: 1540
        'y': 680
  - from: post_reject
    to: output_type
    type: optional
    label: Invalid feedback · next round
    labelPosition: center
    waypoints:
