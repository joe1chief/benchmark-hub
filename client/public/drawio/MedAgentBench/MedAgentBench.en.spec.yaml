meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentBench Build Process
  description: >-
    MedAgentBench pairs 300 physician-authored clinical tasks with a synthetic-identity 100-patient STARR cohort
    transformed into 785,207 FHIR records, exposes nine functions through an AgentBench-compatible HAPI FHIR
    environment, and separately verifies 150 query and 150 action tasks before reporting success rates.
  legend: >-
    Source: arXiv:2501.14654 Sections 3-4 and official stanfordmlgroup/MedAgentBench repository; physician tasks,
    STARR-to-FHIR environment, AgentBench harness, and success scoring. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
nodes:
  - id: tasks
    label: |-
      Author Tasks with Two Physicians
      Submit 300 Clinical Tasks
      Curate Complexity and Relevance
      Cover Inpatient and Outpatient
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      Organize the Task Taxonomy
      Ten Specific Categories
      Group into Seven Broad Types
      Span Retrieval · Record · Orders
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: cohort
    label: |-
      Select a STARR Patient Cohort
      Use a Deidentified Warehouse
      Randomly Sample 100 Patients
      Anchor on Morning Sodium Labs
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: extract
    label: |-
      Extract Five Years of EHR Data
      Labs and Six Vital-sign Types
      Diagnoses · Procedures · Meds
      Cut Off at 2023-11-13
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: deid
    label: |-
      Add Usable Synthetic Identity
      Create Unique Seven-digit MRNs
      Faker Names · Phones · Addresses
      Retain Patient-level Time Jitter
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: resources
    label: |-
      Map Data to FHIR Resources
      Observation and Procedure
      Condition and MedicationRequest
      Produce 785,207 Records
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: environment
    label: |-
      Build an Interactive EHR
      Use HAPI FHIR JPA
      Persist H2 and Parallel POST
      Package a Reproducible Docker Image
    type: cloud
    size: xl
    position:
      x: 1460
      'y': 40
  - id: harness
    label: |-
      Integrate the AgentBench Harness
      Expose Nine FHIR Functions
      Permit One Function per Turn
      Support GET · POST · FINISH
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: interaction
    label: |-
      Execute the Agent Loop
      GET: Send Request and Return Raw Response
      POST: Validate JSON Payload and Indicate Success
      FINISH: Save the Trajectory for Grading
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      Task Family?
      150 Query-Based Tasks
      150 Action-Based Tasks
    type: decision
    size: xl
    position:
      x: 980
      'y': 420
  - id: querygrade
    label: |-
      Grade Query-based Tasks
      Manually Write Reference Solutions
      Compare the Agent Final Response
      Check Expected Value and Format
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: actiongrade
    label: |-
      Grade Action-based Tasks
      Inspect the Proposed POST Payload
      Apply Manually Written Rule-based Sanity Checks
      Assess Payload Correctness
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      Assign Binary Task Success
      Mark Each Task Pass or Fail
      Aggregate Overall Success Rate
      Report Query SR and Action SR
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Publish MedAgentBench Results
      Compare 12 Representative Models
      Analyze Variation by Task Type
      Preserve Reproducible Trajectories
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: tasks
    to: taxonomy
    type: primary
  - from: taxonomy
    to: cohort
    type: primary
  - from: cohort
    to: extract
    type: primary
  - from: extract
    to: deid
    type: primary
  - from: deid
    to: resources
    type: primary
  - from: resources
    to: environment
    type: primary
  - from: environment
    to: harness
    type: primary
  - from: harness
    to: interaction
    type: primary
  - from: interaction
    to: split
    type: primary
  - from: split
    to: querygrade
    type: primary
    label: Query · GET retrieval
    labelPosition: center
  - from: actiongrade
    to: score
    type: primary
  - from: score
    to: report
    type: primary
  - from: split
    to: actiongrade
    type: primary
    label: Action · POST modification
    labelPosition: center
    waypoints:
      - x: 980
        'y': 650
      - x: 500
        'y': 650
  - from: querygrade
    to: score
    type: primary
    waypoints:
      - x: 740
        'y': 250
      - x: 260
        'y': 250
modules: []
