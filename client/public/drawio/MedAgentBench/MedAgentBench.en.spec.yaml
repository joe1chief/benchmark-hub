meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentBench Build Process
  description: >-
    Paper- and official-code-aligned physician task design, STARR patient processing, FHIR environment construction,
    agent interaction, and success-rate scoring for MedAgentBench.
  legend: >-
    Solid arrows trace 300 tasks, 100 patients and 785,207 records, nine FHIR functions, 150 query plus 150 action
    tasks, and three success-rate views.
nodes:
  - id: tasks
    label: |-
      Author Tasks with Two Physicians
      Submit 300 Clinical Tasks
      Curate Complexity and Relevance
      Cover Inpatient and Outpatient
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      Organize the Task Taxonomy
      Ten Specific Categories
      Group into Seven Broad Types
      Span Retrieval · Record · Orders
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: cohort
    label: |-
      Select a STARR Patient Cohort
      Use a Deidentified Warehouse
      Randomly Sample 100 Patients
      Anchor on Morning Sodium Labs
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: extract
    label: |-
      Extract Five Years of EHR Data
      Labs and Six Vital-sign Types
      Diagnoses · Procedures · Meds
      Cut Off at 2023-11-13
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: deid
    label: |-
      Add Usable Synthetic Identity
      Create Unique Seven-digit MRNs
      Faker Names · Phones · Addresses
      Retain Patient-level Time Jitter
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: resources
    label: |-
      Map Data to FHIR Resources
      Observation and Procedure
      Condition and MedicationRequest
      Produce 785,207 Records
    type: database
    size: xl
    position:
      x: 1220
      'y': 40
  - id: environment
    label: |-
      Build an Interactive EHR
      Use HAPI FHIR JPA
      Persist H2 and Parallel POST
      Package a Reproducible Docker Image
    type: cloud
    size: xl
    position:
      x: 1460
      'y': 40
  - id: harness
    label: |-
      Integrate the AgentBench Harness
      Expose Nine FHIR Functions
      Permit One Function per Turn
      Support GET · POST · FINISH
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: interaction
    label: |-
      Execute a High-level Agent Loop
      Plan Requests and Read Responses
      Modify the Virtual EHR if Needed
      Return a Structured Final Result
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: split
    label: |-
      Separate Two Task Families
      150 Query-based Tasks
      150 Action-based Tasks
      Actions May Start with GET
    type: decision
    size: xl
    position:
      x: 980
      'y': 420
  - id: querygrade
    label: |-
      Grade Query-based Tasks
      Manually Write Reference Solutions
      Compare the Agent Final Response
      Check Expected Value and Format
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: actiongrade
    label: |-
      Grade Action-based Tasks
      Inspect the POST Payload
      Run Manual Rule-based Sanity Checks
      Verify the EHR Modification
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      Assign Binary Task Success
      Mark Each Task Pass or Fail
      Aggregate Overall Success Rate
      Report Query SR and Action SR
    type: decision
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Publish MedAgentBench Results
      Compare 12 Representative Models
      Analyze Variation by Task Type
      Preserve Reproducible Trajectories
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
