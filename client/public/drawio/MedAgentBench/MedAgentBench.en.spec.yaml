meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentBench Build Process
  description: >-
    Paper-v2 and pinned-code reconstruction of physician task curation, STARR record filtering, FHIR environment
    release, eight-round agent interaction, external reference grading, and pass-at-1 success-rate accounting.
  legend: >-
    Solid arrows carry retained tasks, records, or successful control flow. Dashed arrows show record removal, invalid
    output, fallback feedback, or failed scoring. Sources: arXiv:2501.14654v2 and Git 99260117.
nodes:
  - id: task_authors
    label: |-
      Two Internal-medicine Physicians
      Author 300 Clinical Tasks
      Inpatient and Outpatient Scope
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      Curate Tasks
      Complexity and Clinical Relevance
      10 Specific · 7 Broad Categories
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: task_pool
    label: |-
      Freeze Task Pool
      Patient-specific Instructions
      MRN · Timing · Codes · Context
      300 Tasks
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: source_assets
    label: |-
      Pin Current Release Assets
      test_data_v2: 300 · funcs_v1: 9
      Legacy test_data_v1: 100
      Box Grader and Docker latest Unpinned
    type: document
    size: xl
    position:
      x: 860
      'y': 40
  - id: cohort
    label: |-
      Sample STARR Cohort
      Deidentified and Patient-jittered
      100 Inpatients with Morning Sodium
      Anchor: 2023-11-13
    type: database
    size: xl
    position:
      x: 20
      'y': 300
  - id: extract
    label: |-
      Extract Five-year EHR Window
      Labs · Six Vitals · Procedures
      Diagnoses · Medication Orders
      Cutoff: 2018-11-13
    type: process
    size: xl
    position:
      x: 300
      'y': 300
  - id: record_rule
    label: |-
      Record QC Rule?
      Procedure · Diagnosis · Medication
    type: decision
    size: xl
    position:
      x: 580
      'y': 300
  - id: impute_quantity
    label: |-
      Impute Procedure Quantity
      Missing Quantity → 1
    type: process
    size: lg
    position:
      x: 580
      'y': 520
  - id: discard_record
    label: |-
      Remove Record
      Missing CPT or Description
      Incomplete Diagnosis · PRN Medication
    type: loss
    size: xl
    position:
      x: 860
      'y': 520
  - id: retained_records
    label: |-
      Retain Clean Clinical Records
      Preserve Patient-level Time Jitter
    type: database
    size: xl
    position:
      x: 860
      'y': 300
  - id: synthetic_identity
    label: |-
      Add Synthetic Identity
      Deduplicated S + Seven-digit MRN
      Faker US Names · Phones · Addresses
    type: process
    size: xl
    position:
      x: 1140
      'y': 300
  - id: fhir_resources
    label: |-
      Map to FHIR Resources
      Observation · Procedure · Condition
      MedicationRequest
      785,207 Total Records
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: environment
    label: |-
      Easy-Setup Interactive EHR
      HAPI FHIR JPA · Persistent H2
      Parallel Profile Upload
      README Pulls Unpinned latest; No Dockerfile or Digest
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: benchmark_release
    label: |-
      Release MedAgentBench
      300 Tasks · 100 Patient Profiles
      Nine FHIR Functions
      AgentBench-compatible Harness
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: prompt
    label: |-
      Build Agent Prompt
      Instruction · Context · Nine Schemas
      One GET, POST, or FINISH per Round
      Maximum Eight Rounds
    type: document
    size: xl
    position:
      x: 1980
      'y': 760
  - id: output_type
    label: Response Prefix?
    type: decision
    size: xl
    position:
      x: 1420
      'y': 760
  - id: get_request
    label: |-
      Execute GET
      Append _format=json
      Return Raw Data or Error
    type: process
    size: xl
    position:
      x: 1140
      'y': 580
  - id: post_json
    label: POST Payload JSON-loadable?
    type: decision
    size: xl
    position:
      x: 1140
      'y': 780
  - id: post_accept
    label: |-
      Accept Payload Syntax
      Do Not Mutate FHIR Server
      Return Success Message
    type: process
    size: xl
    position:
      x: 860
      'y': 720
  - id: post_reject
    label: |-
      Reject Payload Syntax
      Return Invalid POST Message
    type: loss
    size: xl
    position:
      x: 860
      'y': 900
  - id: finish_record
    label: |-
      Detect FINISH by startswith
      Strip the FINISH(...) Wrapper
      Save Raw Inner Text as result
      Save Full Interaction History
    type: document
    size: xl
    position:
      x: 1140
      'y': 1020
  - id: runtime_failure
    label: |-
      Runtime Failure
      Invalid Action · Context or Task Error
      Eight-round Limit Reached
    type: loss
    size: xl
    position:
      x: 1420
      'y': 1020
  - id: grader_type
    label: |-
      Task Grader Type?
      External refsol.py by Task Prefix
    type: decision
    size: xl
    position:
      x: 860
      'y': 1080
  - id: query_grade
    label: |-
      Grade Query Task
      Compare FINISH Response
      Manually Curated Reference Answer
    type: process
    size: xl
    position:
      x: 580
      'y': 980
  - id: action_grade
    label: |-
      Grade Action Task
      Rule-based POST-payload Checks
      Grader Exception → False
    type: process
    size: xl
    position:
      x: 580
      'y': 1160
  - id: correctness
    label: Grader Returns True?
    type: decision
    size: xl
    position:
      x: 300
      'y': 1080
  - id: pass_task
    label: Count Correct
    type: process
    size: lg
    position:
      x: 20
      'y': 980
  - id: fail_task
    label: |-
      Count Failure
      Null Result Also Fails
    type: loss
    size: lg
    position:
      x: 20
      'y': 1160
  - id: report
    label: |-
      Report pass@1 Success Rate
      Pinned Code: Correct / All 300 Results
      Paper: Overall · Query · Action SR
      Current overall.json Emits Overall Only
    type: terminal
    size: xl
    position:
      x: 300
      'y': 1360
edges:
