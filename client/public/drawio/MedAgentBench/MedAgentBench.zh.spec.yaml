meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAgentBench 构建流程
  description: 对齐论文第 2 版与固定代码版本，展示医生任务策展、STARR 记录筛选、FHIR 环境发布、八轮智能体交互、外置参考评分及 pass@1 成功率分母。
  legend: 实线表示保留的任务、记录或成功控制流；虚线表示记录移除、无效输出、反馈回路或评分失败。来源：arXiv:2501.14654v2 与 Git 99260117。
nodes:
  - id: task_authors
    label: |-
      两名内科医生设计任务
      编写 300 项临床任务
      覆盖住院与门诊场景
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      策展临床任务
      按复杂度与临床价值筛选
      10 个具体类别 · 7 个广义类别
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: task_pool
    label: |-
      冻结任务池
      患者特定指令
      MRN · 时间 · 编码 · 场景上下文
      共 300 项
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: source_assets
    label: |-
      固定当前发布资产
      test_data_v2：300 · funcs_v1：9
      仍保留旧版 test_data_v1：100
      Box 评分器与 Docker latest 未固定
    type: document
    size: xl
    position:
      x: 860
      'y': 40
  - id: cohort
    label: |-
      抽取 STARR 患者队列
      已去标识并按患者扰动时间
      100 名有晨间钠检验的住院患者
      锚定日期：2023-11-13
    type: database
    size: xl
    position:
      x: 20
      'y': 300
  - id: extract
    label: |-
      抽取五年 EHR 窗口
      检验 · 六类生命体征 · 操作
      诊断 · 药物医嘱
      截止日期：2018-11-13
    type: process
    size: xl
    position:
      x: 300
      'y': 300
  - id: record_rule
    label: |-
      记录符合哪条质控规则？
      操作 · 诊断 · 药物医嘱
    type: decision
    size: xl
    position:
      x: 580
      'y': 300
  - id: impute_quantity
    label: |-
      填补操作数量
      数量缺失 → 1
    type: process
    size: lg
    position:
      x: 580
      'y': 520
  - id: discard_record
    label: |-
      移除记录
      缺少 CPT 或描述
      诊断不完整 · PRN 药物
    type: loss
    size: xl
    position:
      x: 860
      'y': 520
  - id: retained_records
    label: |-
      保留清洗后的临床记录
      保持患者级时间扰动
    type: database
    size: xl
    position:
      x: 860
      'y': 300
  - id: synthetic_identity
    label: |-
      添加合成身份
      去重的 S + 七位数字 MRN
      Faker 生成美国姓名电话地址
    type: process
    size: xl
    position:
      x: 1140
      'y': 300
  - id: fhir_resources
    label: |-
      映射为 FHIR 资源
      Observation · Procedure · Condition
      MedicationRequest
      共 785,207 条记录
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: environment
    label: |-
      按论文的便捷设置构建交互式 EHR
      HAPI FHIR JPA · 持久化 H2
      并行上传患者档案
      README 拉取未固定 latest；仓库无 Dockerfile 或摘要
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: benchmark_release
    label: |-
      发布 MedAgentBench
      300 项任务 · 100 份患者档案
      九个 FHIR 函数
      兼容 AgentBench 的框架
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: prompt
    label: |-
      构造智能体提示
      指令 · 上下文 · 九个函数模式
      每轮仅一次 GET、POST 或 FINISH
      最多八轮
    type: document
    size: xl
    position:
      x: 1980
      'y': 760
  - id: output_type
    label: 响应以什么前缀开头？
    type: decision
    size: xl
    position:
      x: 1420
      'y': 760
  - id: get_request
    label: |-
      执行 GET
      追加 _format=json
      返回原始数据或错误
    type: process
    size: xl
    position:
      x: 1140
      'y': 580
  - id: post_json
    label: POST 载荷能否解析为 JSON？
    type: decision
    size: xl
    position:
      x: 1140
      'y': 780
  - id: post_accept
    label: |-
      接受载荷语法
      不实际修改 FHIR 服务
      返回执行成功提示
    type: process
    size: xl
    position:
      x: 860
      'y': 720
  - id: post_reject
    label: |-
      拒绝载荷语法
      返回 POST 无效提示
    type: loss
    size: xl
    position:
      x: 860
      'y': 900
  - id: finish_record
    label: |-
      用 startswith 识别 FINISH
      去除 FINISH(...) 外层
      将内部原始文本保存为 result
      同时保存完整交互轨迹
    type: document
    size: xl
    position:
      x: 1140
      'y': 1020
  - id: runtime_failure
    label: |-
      运行失败
      无效动作 · 上下文或任务错误
      达到八轮上限
    type: loss
    size: xl
    position:
      x: 1420
      'y': 1020
  - id: grader_type
    label: |-
      使用哪类任务评分器？
      外置 refsol.py 按任务前缀选择
    type: decision
    size: xl
    position:
      x: 860
      'y': 1080
  - id: query_grade
    label: |-
      评分查询任务
      比较 FINISH 回复
      人工策展参考答案
    type: process
    size: xl
    position:
      x: 580
      'y': 980
  - id: action_grade
    label: |-
      评分动作任务
      基于规则检查 POST 载荷
      评分器异常 → false
    type: process
    size: xl
    position:
      x: 580
      'y': 1160
  - id: correctness
    label: 评分器是否返回 true？
    type: decision
    size: xl
    position:
      x: 300
      'y': 1080
  - id: pass_task
    label: 正确数加一
    type: process
    size: lg
    position:
      x: 20
      'y': 980
  - id: fail_task
    label: |-
      计为失败
      空结果同样失败
    type: loss
    size: lg
    position:
      x: 20
      'y': 1160
  - id: report
    label: |-
      报告 pass@1 成功率
      固定代码：正确数 / 全部 300 个结果
      论文：总体 · 查询 · 动作成功率
      当前 overall.json 仅输出总体值
    type: terminal
    size: xl
    position:
      x: 300
      'y': 1360
edges:
  - from: task_authors
    to: taxonomy
    type: primary
    label: 提交 300 项任务
    labelPosition: center
  - from: taxonomy
    to: task_pool
    type: primary
    label: 已策展任务体系
    labelPosition: center
  - from: task_pool
    to: source_assets
    type: primary
    label: 发布任务 JSON
    labelPosition: center
  - from: source_assets
    to: benchmark_release
    type: primary
    label: 固定 Git 资产
    labelPosition: center
  - from: cohort
    to: extract
    type: primary
    label: 100 份患者档案
    labelPosition: center
  - from: extract
    to: record_rule
    type: primary
    label: 原始临床记录
    labelPosition: center
  - from: record_rule
    to: retained_records
    type: primary
    label: 完整或允许保留
    labelPosition: center
  - from: record_rule
    to: impute_quantity
    type: optional
    label: 仅操作数量缺失
    labelPosition: center
  - from: impute_quantity
    to: retained_records
    type: primary
    label: 数量 = 1
    labelPosition: center
  - from: record_rule
    to: discard_record
    type: optional
    label: 无效或 PRN
    labelPosition: center
  - from: retained_records
    to: synthetic_identity
    type: primary
    label: 已筛选记录
    labelPosition: center
  - from: synthetic_identity
    to: fhir_resources
    type: primary
    label: 合成人口信息
    labelPosition: center
  - from: fhir_resources
    to: environment
    type: primary
    label: 785,207 条资源
    labelPosition: center
  - from: environment
    to: benchmark_release
    type: primary
    label: 未固定 latest 的持久化 FHIR 镜像
    labelPosition: center
  - from: benchmark_release
    to: prompt
    type: primary
    label: 启动一项基准任务
    labelPosition: center
    waypoints:
      - x: 2100
        'y': 180
      - x: 2100
        'y': 700
  - from: prompt
    to: output_type
    type: primary
    label: 一次模型响应
    labelPosition: center
  - from: output_type
    to: get_request
    type: primary
    label: GET 请求
    labelPosition: center
  - from: output_type
    to: post_json
    type: primary
    label: POST 请求
    labelPosition: center
  - from: output_type
    to: finish_record
    type: primary
    label: FINISH 结束
    labelPosition: center
  - from: output_type
    to: runtime_failure
    type: optional
    label: 其他 · 错误 · 超限
    labelPosition: center
  - from: get_request
    to: output_type
    type: primary
    label: 原始或错误反馈 · 下一轮
    labelPosition: center
    waypoints:
      - x: 1260
        'y': 500
      - x: 1540
        'y': 500
  - from: post_json
    to: post_accept
    type: primary
    label: 是 · JSON 有效
    labelPosition: center
  - from: post_json
    to: post_reject
    type: optional
    label: 否 · JSON 无效
    labelPosition: center
  - from: post_accept
    to: output_type
    type: primary
    label: 已接受反馈 · 下一轮
    labelPosition: center
    waypoints:
      - x: 980
        'y': 680
      - x: 1540
        'y': 680
  - from: post_reject
    to: output_type
    type: optional
    label: 无效反馈 · 下一轮
    labelPosition: center
    waypoints:
      - x: 980
        'y': 960
      - x: 1540
        'y': 960
  - from: finish_record
    to: grader_type
    type: primary
    label: 结果与完整轨迹
    labelPosition: center
  - from: grader_type
    to: query_grade
    type: primary
    label: 查询 · 仅 GET
    labelPosition: center
  - from: grader_type
    to: action_grade
    type: primary
    label: 动作 · 需要 POST
    labelPosition: center
  - from: query_grade
    to: correctness
    type: primary
    label: 参考答案比较
    labelPosition: center
  - from: action_grade
    to: correctness
    type: primary
    label: 载荷规则检查
    labelPosition: center
  - from: correctness
    to: pass_task
    type: primary
    label: 是 · true
    labelPosition: center
  - from: correctness
    to: fail_task
    type: optional
    label: 否 · false
    labelPosition: center
  - from: runtime_failure
    to: fail_task
    type: optional
    label: 无可评分结果
    labelPosition: center
    waypoints:
      - x: 1540
        'y': 1280
      - x: 140
        'y': 1280
  - from: pass_task
    to: report
    type: primary
    label: 分子分母均加一
    labelPosition: center
    waypoints:
      - x: 140
        'y': 1320
      - x: 420
        'y': 1320
  - from: fail_task
    to: report
    type: optional
    label: 仅分母加一
    labelPosition: center
modules: []
