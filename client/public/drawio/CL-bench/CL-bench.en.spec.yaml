meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CL-bench Build Process
  description: >-
    Paper-aligned CL-bench flow: domain experts construct contamination-resistant knowledge contexts, context-dependent
    and sometimes sequential tasks, and multi-dimensional binary rubrics; strict GPT-5.1 verification then counts a task
    solved only when every rubric passes.
  legend: Solid arrows show expert construction and evaluation; branches show context taxonomy and verifier validation.
nodes:
  - id: sources
    label: |-
      Gather Realistic Context Sources
      Manuals • Papers • Data • Rules • Procedures
      No External Retrieval Needed at Evaluation
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: novelty
    label: |-
      Create New or Long-tail Knowledge
      Fictional Creation • Modified Real Content
      Niche and Emerging Specialized Content
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: taxonomy
    label: |-
      Cover Four Context Categories
      Domain • Rule • Procedure • Empirical/Simulation
      Balance 18 Fine-grained Subcategories
    type: process
    size: xl
    position:
      x: 640
      'y': 40
  - id: contexts
    label: |-
      Expert-author 500 Complex Contexts
      Mean 20 Expert-hours per Context
      Mean 10.4K Tokens • Maximum 65K
    type: document
    size: xl
    position:
      x: 640
      'y': 400
  - id: tasks
    label: |-
      Design 1,899 Context-dependent Tasks
      Clear • Specific • Accurate • Challenging
      Required Knowledge Must Be in the Context
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: sequence
    label: |-
      Encode Sequential Dependencies
      51.1% of Tasks Span Multiple Turns
      Later Tasks May Depend on Earlier Solutions
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: rubrics
    label: |-
      Write 31,607 Binary Rubrics
      16.6 per Task on Average
      Correctness • Completeness • Procedure • Format
    type: document
    size: xl
    position:
      x: 1540
      'y': 220
  - id: qc
    label: |-
      Apply Expert Quality Control
      Double-check Rubrics + Random-sample Verification
      Refine Context, Tasks, Solutions, and Criteria
    type: decision
    size: xl
    position:
      x: 1840
      'y': 220
  - id: release
    label: |-
      Release CL-bench
      500 Contexts • 1,899 Tasks • 31,607 Rubrics
      Context-free Solving Rate below 1%
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: solve
    label: |-
      Run Frontier Language Models
      Provide System Prompt + Context + Task History
      Collect Solutions across Three Runs
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: verify
    label: |-
      GPT-5.1 Verifies Every Rubric
      Binary Yes/No Judgment per Criterion
      Task Passes Only If All Rubrics Pass
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
  - id: reliability
    label: |-
      Validate the Automatic Verifier
      >90% Agreement with Two Other Verifiers
      >90% Accuracy on 100 Human-audited Solutions
    type: decision
    size: xl
    position:
      x: 3040
      'y': 40
  - id: report
    label: |-
      Report Task Solving Rate
      Overall + Four Categories + 18 Subcategories
      Mean of Ten Frontier Models: 17.2%
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
