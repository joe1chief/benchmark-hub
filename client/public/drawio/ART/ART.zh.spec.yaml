meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ART 构建与评测流程
  description: 按论文呈现从 EHR 挖掘高风险失败场景、围绕不变患者数据合成措辞、验证临床忠实度，再执行无状态 FHIR 评测的四阶段流程。
  legend: 600 题包含检索、聚合、阈值/条件任务各 200 题。结果对按 GPT-4o-mini / Claude 3.5 Sonnet 顺序报告；精确匹配不验证推理路径。
nodes:
  - id: failures
    label: |-
      分析 MedAgentBench 失败
      检索 • 聚合
      阈值 / 条件逻辑
    type: process
    size: xl
    position:
      x: 40
      'y': 260
  - id: ehr
    label: |-
      挖掘单机构 EHR
      FHIR R5 格式记录
      50,000 条记录 • 695 位患者
    type: database
    size: xl
    position:
      x: 320
      'y': 260
  - id: mode
    label: 选择失败模式
    type: decision
    size: xl
    position:
      x: 600
      'y': 260
  - id: retrieval
    label: |-
      检索场景
      ≤3 次读数 • 2 小时内聚集
      23–25 小时边界
      覆盖 11 种化验代码
    type: process
    size: xl
    position:
      x: 880
      'y': 20
  - id: aggregation
    label: |-
      24 小时聚合场景
      有效窗口内至少 3 次读数
      血糖 • 血钾 • 血钠
    type: process
    size: xl
    position:
      x: 880
      'y': 260
  - id: conditional
    label: |-
      条件场景
      7 档数值 • HGB / HCT / CR
      年龄与性别相关阈值
      检索 → 判断 → 干预
    type: process
    size: xl
    position:
      x: 880
      'y': 500
  - id: generate
    label: |-
      LLM 仅合成措辞
      患者数值与时间保持不变
      每种失败模式生成 200 题
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: automatic_audit
    label: |-
      对照源 EHR 验证
      核对数值 • 窗口 • 阈值
      验证后才纳入
    type: process
    size: xl
    position:
      x: 1440
      'y': 260
  - id: clinical_audit
    label: |-
      临床 HITL 审核
      审核代表性子集
      事实 • 逻辑 • 临床语境
    type: user
    size: xl
    position:
      x: 1720
      'y': 260
  - id: dataset
    label: |-
      平衡 ART 评测集
      检索 200 • 聚合 200
      条件 200 • 共 600 题
    type: database
    size: xl
    position:
      x: 2000
      'y': 260
  - id: environment
    label: |-
      实时 FHIR 兼容 EHR 运行
      使用 MedAgentBench 框架
      无状态 • 温度 0 • 无历史
    type: process
    size: xl
    position:
      x: 2000
      'y': 760
  - id: agents
    label: |-
      评测两个医疗 Agent
      GPT-4o-mini
      Claude 3.5 Sonnet
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: score
    label: |-
      精确匹配成功率
      对照 EHR 标准答案
      按失败模式分别报告
    type: process
    size: xl
    position:
      x: 1440
      'y': 760
  - id: report
    label: |-
      论文报告成功率
      GPT-4o-mini / Claude 3.5
      检索 100 / 100
      聚合 28 / 64
      条件 32 / 38
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 650
  - id: limitation
    label: |-
      指标限制
      精确匹配不验证
      推理路径是否正确
    type: document
    size: xl
    position:
      x: 1160
      'y': 870
edges:
  - from: failures
    to: ehr
    type: primary
  - from: ehr
    to: mode
    type: primary
  - from: mode
    to: retrieval
    type: primary
  - from: mode
    to: aggregation
    type: primary
  - from: mode
    to: conditional
    type: primary
  - from: retrieval
    to: generate
    type: primary
  - from: aggregation
    to: generate
    type: primary
  - from: conditional
    to: generate
    type: primary
  - from: generate
    to: automatic_audit
    type: primary
  - from: automatic_audit
    to: clinical_audit
    type: primary
  - from: clinical_audit
    to: dataset
    type: primary
  - from: dataset
    to: environment
    type: primary
  - from: environment
    to: agents
    type: primary
  - from: agents
    to: score
    type: primary
  - from: score
    to: report
    type: primary
  - from: score
    to: limitation
    type: secondary
modules: []
