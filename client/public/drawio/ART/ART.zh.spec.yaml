meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ART 构建与评测流程
  description: 按论文呈现从真实 EHR 格式数据中挖掘高风险临床场景、生成平衡的行动式推理任务基准、审核临床忠实度， 并在实时 FHIR 环境中评测医疗 Agent 的完整流程。
  legend: 此处 ART 指行动式推理任务，而非自动化红队。论文评测共 600 题：检索、时间聚合、阈值或条件推理各 200 题，患者数据保持真实且不被改写。
nodes:
  - id: failures
    label: |-
      分析医疗 Agent 失败
      对照 MedAgentBench 输出与标准任务
      检索 • 聚合 • 条件逻辑
    type: process
    size: xl
    position:
      x: 40
      'y': 260
  - id: ehr
    label: |-
      挖掘真实 EHR 格式观测
      695 名患者的 50,000 条记录
      保留化验值、时间戳与人口学信息
    type: database
    size: xl
    position:
      x: 320
      'y': 260
  - id: mode
    label: |-
      场景识别 Agent
      该病例针对哪类失败模式？
    type: decision
    size: xl
    position:
      x: 600
      'y': 260
  - id: retrieval
    label: |-
      检索场景
      11 种化验代码 • 稀疏或密集读数
      最新值与 23-25 小时边界案例
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: aggregation
    label: |-
      聚合场景
      24 小时内至少 3 个有效测量
      血糖 • 血钾 • 血钠
    type: process
    size: xl
    position:
      x: 880
      'y': 260
  - id: conditional
    label: |-
      阈值与条件场景
      七档数值范围 + 人口学阈值
      检索 → 比较 → 条件执行
    type: process
    size: xl
    position:
      x: 880
      'y': 480
  - id: generate
    label: |-
      任务生成 Agent
      GPT-4o-mini / Claude 3.5 改写措辞与上下文
      真实临床数值保持不变
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: dataset
    label: |-
      打包平衡的 ART 基准
      每类 200 题，共 600 题
      指令 • 上下文 • 标准答案 • 匿名 MRN
    type: database
    size: xl
    position:
      x: 1440
      'y': 260
  - id: automatic_audit
    label: |-
      自动回查源 EHR
      复核数值、时间窗口与阈值
      剔除任何与来源不一致的任务
    type: process
    size: xl
    position:
      x: 1440
      'y': 680
  - id: clinical_audit
    label: |-
      人在回路临床审核
      专家检查代表性子集
      事实相关性 • 逻辑 • 阈值一致性
    type: user
    size: xl
    position:
      x: 1160
      'y': 680
  - id: environment
    label: |-
      运行实时临床环境
      MedAgentBench + FHIR R5 API 调用
      无状态 • 温度 0 • 无对话历史
    type: process
    size: xl
    position:
      x: 880
      'y': 680
  - id: agents
    label: |-
      评测两个医疗 Agent
      GPT-4o-mini 与 Claude 3.5 Sonnet
      执行检索、聚合与条件动作
    type: process
    size: xl
    position:
      x: 600
      'y': 680
  - id: score
    label: |-
      精确匹配成功率
      最终结果对比 EHR 派生标准答案
      本研究不逐步判定推理过程
    type: process
    size: xl
    position:
      x: 320
      'y': 680
  - id: report
    label: |-
      报告各失败模式差距
      检索 100% / 100%
      聚合 28% / 64% • 条件 32% / 38%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 680
edges:
  - from: failures
    to: ehr
    type: primary
  - from: ehr
    to: mode
    type: primary
  - from: mode
    to: retrieval
    type: primary
  - from: mode
    to: aggregation
    type: primary
  - from: mode
    to: conditional
    type: primary
  - from: retrieval
    to: generate
    type: primary
  - from: aggregation
    to: generate
    type: primary
  - from: conditional
    to: generate
    type: primary
  - from: generate
    to: dataset
    type: primary
  - from: dataset
    to: automatic_audit
    type: primary
  - from: automatic_audit
    to: clinical_audit
    type: primary
  - from: clinical_audit
    to: environment
    type: primary
  - from: environment
    to: agents
    type: primary
  - from: agents
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
