meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ART Construction and Evaluation Workflow
  description: >-
    Paper-aligned four-stage workflow for mining failure-prone EHR scenarios, synthesizing wording around unchanged
    patient data, validating clinical fidelity, and running stateless FHIR evaluation.
  legend: >-
    The 600-task evaluation contains 200 retrieval, 200 aggregation, and 200 threshold/conditional tasks. Reported
    result pairs are ordered GPT-4o-mini / Claude 3.5 Sonnet. Exact match does not validate the reasoning path.
nodes:
  - id: failures
    label: |-
      Analyze MedAgentBench Failures
      Retrieval • Aggregation
      Threshold / Conditional Logic
    type: process
    size: xl
    position:
      x: 40
      'y': 260
  - id: ehr
    label: |-
      Mine Single-Institution EHR
      FHIR R5-Formatted Records
      50,000 Records • 695 Patients
    type: database
    size: xl
    position:
      x: 320
      'y': 260
  - id: mode
    label: Choose Failure Mode
    type: decision
    size: xl
    position:
      x: 600
      'y': 260
  - id: retrieval
    label: |-
      Retrieval Scenarios
      ≤3 Readings • Clusters within 2 h
      23–25 h Boundaries
      11 Laboratory Codes
    type: process
    size: xl
    position:
      x: 880
      'y': 20
  - id: aggregation
    label: |-
      24 h Aggregation Scenarios
      Valid Windows with ≥3 Readings
      Glucose • Potassium • Sodium
    type: process
    size: xl
    position:
      x: 880
      'y': 260
  - id: conditional
    label: |-
      Conditional Scenarios
      7 Value Bands • HGB / HCT / CR
      Age- and Sex-Specific Thresholds
      Retrieve → Judge → Intervene
    type: process
    size: xl
    position:
      x: 880
      'y': 500
  - id: generate
    label: |-
      LLM Rephrasing Only
      Patient Values and Times Unchanged
      200 Tasks per Failure Mode
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: automatic_audit
    label: |-
      Validate against Source EHR
      Check Values • Windows • Thresholds
      Complete Before Inclusion
    type: process
    size: xl
    position:
      x: 1440
      'y': 260
  - id: clinical_audit
    label: |-
      Clinical HITL Review
      Representative Subset
      Facts • Logic • Clinical Context
    type: user
    size: xl
    position:
      x: 1720
      'y': 260
  - id: dataset
    label: |-
      Balanced ART Evaluation Set
      Retrieval 200 • Aggregation 200
      Conditional 200 • Total 600
    type: database
    size: xl
    position:
      x: 2000
      'y': 260
  - id: environment
    label: |-
      Live FHIR-Compliant EHR Run
      MedAgentBench Framework
      Stateless • Temperature 0 • No History
    type: process
    size: xl
    position:
      x: 2000
      'y': 760
  - id: agents
    label: |-
      Evaluate Two Medical Agents
      GPT-4o-mini
      Claude 3.5 Sonnet
    type: process
    size: xl
    position:
      x: 1720
      'y': 760
  - id: score
    label: |-
      Exact-Match Success Rate
      Compare with EHR Ground Truth
      Report by Failure Mode
    type: process
    size: xl
    position:
      x: 1440
      'y': 760
  - id: report
    label: |-
      Reported Success Rate
      GPT-4o-mini / Claude 3.5
      Retrieval 100 / 100
      Aggregation 28 / 64
      Conditional 32 / 38
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 650
  - id: limitation
    label: |-
      Metric Limitation
      Exact Match Does Not Verify
      the Reasoning Path
    type: document
    size: xl
    position:
      x: 1160
      'y': 870
