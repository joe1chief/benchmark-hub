meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ART Construction and Evaluation Workflow
  description: >-
    Paper-aligned workflow for mining failure-prone clinical scenarios from real EHR-formatted data, generating a
    balanced Action-based Reasoning Task benchmark, auditing clinical fidelity, and evaluating medical agents through a
    live FHIR environment.
  legend: >-
    ART means Action-based Reasoning Task, not automated red teaming. The released study evaluates 600 tasks: 200
    retrieval, 200 temporal-aggregation, and 200 threshold or conditional tasks grounded in unchanged patient data.
nodes:
  - id: failures
    label: |-
      Analyze Medical-Agent Failures
      Compare MedAgentBench Outputs with Gold Tasks
      Retrieval • Aggregation • Conditional Logic
    type: process
    size: xl
    position:
      x: 40
      'y': 260
  - id: ehr
    label: |-
      Mine Real EHR-Formatted Observations
      50,000 Records from 695 Patients
      Preserve Labs, Timestamps, and Demographics
    type: database
    size: xl
    position:
      x: 320
      'y': 260
  - id: mode
    label: |-
      Scenario Identification Agent
      Which Failure Mode Does the Case Target?
    type: decision
    size: xl
    position:
      x: 600
      'y': 260
  - id: retrieval
    label: |-
      Retrieval Scenarios
      11 Lab Codes • Sparse or Clustered Readings
      Latest Value and 23-25 h Edge Cases
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: aggregation
    label: |-
      Aggregation Scenarios
      At Least 3 Valid Measurements in 24 h
      Glucose • Potassium • Sodium
    type: process
    size: xl
    position:
      x: 880
      'y': 260
  - id: conditional
    label: |-
      Threshold and Conditional Scenarios
      Seven Value Ranges + Demographic Thresholds
      Retrieve → Compare → Conditionally Act
    type: process
    size: xl
    position:
      x: 880
      'y': 480
  - id: generate
    label: |-
      Task Generation Agent
      GPT-4o-mini / Claude 3.5 Vary Wording and Context
      Authentic Clinical Values Remain Unchanged
    type: process
    size: xl
    position:
      x: 1160
      'y': 260
  - id: dataset
    label: |-
      Package the Balanced ART Benchmark
      200 Tasks per Failure Mode = 600 Total
      Instruction • Context • Ground Truth • Anonymous MRN
    type: database
    size: xl
    position:
      x: 1440
      'y': 260
  - id: automatic_audit
    label: |-
      Automatic Source-EHR Validation
      Recheck Values, Time Windows, and Thresholds
      Reject Any Task Inconsistent with Its Origin
    type: process
    size: xl
    position:
      x: 1440
      'y': 680
  - id: clinical_audit
    label: |-
      Human-in-the-Loop Clinical Audit
      Experts Review a Representative Subset
      Factual Relevance • Logic • Threshold Consistency
    type: user
    size: xl
    position:
      x: 1160
      'y': 680
  - id: environment
    label: |-
      Run the Live Clinical Environment
      MedAgentBench + FHIR R5 API Calls
      Stateless • Temperature 0 • No Conversation History
    type: process
    size: xl
    position:
      x: 880
      'y': 680
  - id: agents
    label: |-
      Evaluate Two Medical Agents
      GPT-4o-mini and Claude 3.5 Sonnet
      Execute Retrieval, Aggregation, and Conditional Actions
    type: process
    size: xl
    position:
      x: 600
      'y': 680
  - id: score
    label: |-
      Exact-Match Success Rate
      Compare Final Result with EHR-Derived Ground Truth
      No Step-Wise Reasoning Credit in This Study
    type: process
    size: xl
    position:
      x: 320
      'y': 680
  - id: report
    label: |-
      Report Failure-Mode Gaps
      Retrieval 100% / 100%
      Aggregation 28% / 64% • Conditional 32% / 38%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 680
