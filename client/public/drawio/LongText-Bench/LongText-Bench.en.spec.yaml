meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongText-Bench Evidence-aligned Build Process
  description: >-
    Reconstructs the prompt-construction and released evaluation contracts from X-Omni arXiv:2507.22058v1 Appendix A,
    official code commit 2b8237bb3789638c290eeda3e83ed81bd3652c3b, and public dataset revision
    429e30e9c1e0dea535038ae4238ea6ec42823098.
  legend: >-
    Primary arrows trace the paper-backed construction and evaluation path; data arrows connect the two fixed language
    views and generated PNGs. Boundary cards distinguish observed release facts from undisclosed protocols, evaluator
    quirks, and the static Hugging Face results table.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper v1 · Appendix A
      Code 2b8237bb · Data 429e30e9
      Checked 2026-07-21
    type: document
    size: xl
    position:
      x: 128
      'y': 240
  - id: scenarios
    label: |-
      Define Eight Text-rich Scenarios
      Sign · Label · Print · Webpage
      Slide · Poster · Caption · Dialogue
      No Source Corpus Is Reported
    type: database
    size: xl
    position:
      x: 400
      'y': 240
  - id: gpt4o
    label: |-
      Generate 20 Prompts per Scenario
      GPT-4o · 10 Short + 10 Long
      Image-generation Captions
      Exact Prompt + Decoding Unreleased
    type: process
    size: xl
    position:
      x: 672
      'y': 240
  - id: manual_qc
    label: |-
      Manually Review Every Prompt
      Review the Generated Captions
      Adjust Rendered-text Lengths
      Seek a Balanced Distribution
    type: user
    size: xl
    position:
      x: 944
      'y': 240
  - id: paper_total
    label: |-
      Paper Construction Output
      8 × 20 = 160 Prompts
      80 Short + 80 Long by Design
      English + Chinese Rendering Scope
    type: database
    size: xl
    position:
      x: 1216
      'y': 240
  - id: release_snapshot
    label: |-
      Pinned Public Release · 429e30e9
      EN 160 + ZH 160 Rows
      Shared IDs · Category · Length
      prompt · text[] · text_length
      No Train / Dev / Test Split
    type: database
    size: xl
    position:
      x: 1488
      'y': 240
    style:
      fontSize: 9
  - id: construction_gaps
    label: |-
      Undisclosed Construction Contracts
      GPT-4o Snapshot / Prompt / Decoding
      Chinese Adaptation / Translation Route
      Annotator Count / Reject / Adjudicate
      No Further Filter or QC Protocol
    type: document
    size: xl
    position:
      x: 944
      'y': 48
    style:
      fontSize: 9
  - id: length_stats
    label: |-
      Length Labels Are Distributional
      EN Short 10–30 · Long Mostly 30–50
      ZH Short Mostly 20–40 · Long Usually >60
      Fixed Release Contains Label Outliers
      These Are Not Hard Acceptance Gates
    type: document
    size: xl
    position:
      x: 1488
      'y': 48
    style:
      fontSize: 9
  - id: en_file
    label: |-
      English Language View
      text_prompts.jsonl · 160 IDs
      Eight Scenarios × 20
      80 Short + 80 Long
    type: document
    size: xl
    position:
      x: 1760
      'y': 112
  - id: zh_file
    label: |-
      Chinese Language View
      text_prompts_zh.jsonl · 160 IDs
      Same IDs / Category / Length
      Content Is Not Literal Translation
    type: document
    size: xl
    position:
      x: 1760
      'y': 408
  - id: candidate
    label: |-
      Candidate Image Generator
      Full Language-specific Prompt as Input
      Generate Four Images per Prompt ID
      No Benchmark-side Prompt Truncation
    type: process
    size: xl
    position:
      x: 2128
      'y': 260
  - id: generation_gap
    label: |-
      Generation Contract Not Standardized
      Candidate Model / Checkpoint
      Resolution · Seed · Sampler · Guidance
      Rewriting / Safety-rejection Handling
      Not Fixed by Paper or Evaluator
    type: document
    size: xl
    position:
      x: 2128
      'y': 48
    style:
      fontSize: 9
  - id: sample_files
    label: |-
      Expected per Language · 160 × 4
      640 PNGs · 1,280 for Both Views
      prompt_id_repeat_id.png
      IDs 0–199 with Two 20-ID Gaps
    type: document
    size: xl
    position:
      x: 2128
      'y': 560
  - id: ingest
    label: |-
      Official MODE = en or zh
      Select Matching JSONL + Folder
      Sort Every *.png in Folder
      Parse ID before Underscore or Dot
      Map ID to prompt + text[]
    type: process
    size: xl
    position:
      x: 1856
      'y': 560
    style:
      fontSize: 9
  - id: ocr
    label: |-
      Qwen2.5-VL-7B-Instruct OCR
      Image + Fixed English OCR Prompt
      Return Text Only · Avoid Repetition
      Prompt Empty Reply · "No text recognized"
      max_new_tokens = 1,024
    type: process
    size: xl
    position:
      x: 1584
      'y': 560
    style:
      fontSize: 9
  - id: cleanup
    label: |-
      OCR Cleanup Drift
      Targets addCriterion + "No text recognized."
      Loop Reuses Original OCR; First Removal Is Lost
      Period-suffixed Reply Can Be Removed
      Prompted No-period Reply Remains
      Store OCR + GT
    type: process
    size: xl
    position:
      x: 1312
      'y': 560
    style:
      fontSize: 9
  - id: normalize_mode
    label: Normalize by Evaluation MODE?
    type: decision
    size: xl
    position:
      x: 1040
      'y': 560
  - id: en_norm
    label: |-
      English-mode Normalization
      Keep CJK / Latin / Digits / Spaces
      Remove Punctuation · Collapse Spaces
      Lowercase · Split on Whitespace
    type: process
    size: xl
    position:
      x: 720
      'y': 464
  - id: zh_norm
    label: |-
      Chinese-mode Normalization
      Keep CJK / Latin / Digits
      Remove Punctuation + All Spacing
      Each Remaining Character Is One Unit
    type: process
    size: xl
    position:
      x: 720
      'y': 656
  - id: match
    label: |-
      Unordered Counter Intersection
      Cap Duplicates at Minimum Multiplicity
      Discard Segment and Relative Order
      Do Not Penalize Extra OCR Units
    type: process
    size: xl
    position:
      x: 400
      'y': 560
  - id: image_ratio
    label: |-
      Per-image Text Accuracy
      matched GT units / all GT units
      Recall-like Coverage · No Edit Distance
      Code Key Is text_accuray
    type: formula
    size: xl
    position:
      x: 128
      'y': 560
  - id: micro_score
    label: |-
      Official Text Score per MODE
      Σ Image Matches / Σ Image GT Units
      Micro-average over Ingested Images
      Not a Mean over Prompts or Repeats
    type: formula
    size: xl
    position:
      x: 128
      'y': 872
  - id: language_report
    label: |-
      One Run Reports One Language
      scores.txt · Four Decimal Places
      No Complete-set or Repeat-count Guard
      Missing / Extra PNGs Reweight Samples
      and Can Change the Score
    type: process
    size: xl
    position:
      x: 400
      'y': 872
  - id: leaderboard
    label: |-
      Pinned HF Static Leaderboard
      11 Model Rows · No Human Upper Bound
      English · Chinese · Avg
      Avg = (English + Chinese) / 2
      No Submission or Live-update Protocol
    type: terminal
    size: xl
    position:
      x: 672
      'y': 872
    style:
      fontSize: 9
  - id: openness
    label: |-
      Release / Openness Boundary
      Public Apache-2.0 Code + Prompt JSONL
      No Official Generated-image Bundle
      Static Table, Not Hosted Evaluation
      No Human Reference Score
    type: document
    size: xl
    position:
      x: 944
      'y': 872
    style:
      fontSize: 9
  - id: runner_gap
    label: |-
      Reproduction Caveats · 2b8237bb
      Qwen Model Name Has No Revision Pin
      README Pins Transformers 4.52.0
      eval.sh Writes results.jsonl
      but Calls Missing results.json
    type: document
    size: xl
    position:
      x: 1216
      'y': 872
    style:
      fontSize: 9
edges:
  - from: evidence
    to: scenarios
    type: primary
  - from: scenarios
    to: gpt4o
