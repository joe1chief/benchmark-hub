meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongText-Bench Build Process
  description: >-
    Reconstructs the X-Omni paper's bilingual long-text prompt curation and the released OCR-based Text Accuracy
    evaluator.
  legend: >-
    The official release contains 160 English prompts and 160 corresponding Chinese records sharing prompt IDs: 160
    bilingual prompt concepts, or 320 language records. Every prompt-language pair is rendered four times for
    evaluation.
nodes:
  - id: scenarios
    label: |-
      Define Eight Text-rich Scenarios
      Signs · Labeled Objects · Print · Web
      Slides · Posters · Captions · Dialogues
      Cover Practical Long-text Layouts
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: generate
    label: |-
      Generate English Prompt Candidates
      Use GPT-4o for Each Scenario
      20 Prompts per Scenario
      10 Short + 10 Long
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: bilingual
    label: |-
      Build Corresponding Chinese Records
      Share Category · Length · Prompt ID
      Preserve the Intended Rendered Text
      Keep English and Chinese Views Separate
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: lengths
    label: |-
      Balance Text-length Bands
      EN Short 10–30 · Long 30–50 Words
      ZH Short 20–40 Characters
      ZH Long Typically over 60 Characters
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: review
    label: |-
      Manually Review Every Prompt
      Check Scene and Text Coherence
      Adjust Rendered-text Lengths
      Improve Distribution Balance
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: release
    label: |-
      Release LongText-Bench
      160 Bilingual Prompt Concepts
      160 EN + 160 ZH Language Records
      prompt · text · category · length · ID
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: render
    label: |-
      Generate Evaluation Images
      Use Each Language-specific Prompt
      Sample Four Images per Prompt
      Save as prompt_id_repeat_id.png
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: ocr
    label: |-
      Recognize Text with Qwen2.5-VL-7B
      Ask for Text Content Only
      Avoid Repeating Recognized Content
      Generate up to 1,024 New Tokens
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: normalize
    label: |-
      Normalize OCR and Ground Truth
      Remove Punctuation and Symbols
      EN · Lowercase and Collapse Spaces
      ZH · Keep Chinese / Alphanumeric Chars
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: match
    label: |-
      Match as Unordered Multisets
      EN Units · Words
      ZH Units · Characters
      Ignore Relative Segment Order
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: score
    label: |-
      Compute Image Text Accuracy
      Matched Ground-truth Units
      Divided by All Ground-truth Units
      Do Not Use Edit Distance
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report LongText-Bench Scores
      Micro-average over All Images
      Aggregate Four Repeats per Prompt
      English · Chinese · Overall Average
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: scenarios
    to: generate
    type: primary
  - from: generate
    to: bilingual
    type: primary
  - from: bilingual
    to: lengths
    type: primary
  - from: lengths
    to: review
    type: primary
  - from: review
    to: release
    type: primary
  - from: release
    to: render
    type: primary
  - from: render
    to: ocr
    type: primary
  - from: ocr
    to: normalize
    type: primary
  - from: normalize
    to: match
    type: primary
  - from: match
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
