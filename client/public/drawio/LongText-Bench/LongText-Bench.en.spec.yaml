    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: en_file
    to: candidate
    type: data
    waypoints:
      - x: 1992
        'y': 162
      - x: 1992
        'y': 310
  - from: zh_file
    to: candidate
    type: data
    waypoints:
      - x: 2032
        'y': 458
      - x: 2032
        'y': 310
  - from: candidate
    to: generation_gap
    type: dependency
    style:
      exitX: 0.5
      exitY: 0
      entryX: 0.5
      entryY: 1
  - from: candidate
    to: sample_files
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: sample_files
    to: ingest
    type: data
  - from: ingest
    to: ocr
    type: data
  - from: ocr
    to: cleanup
    type: primary
  - from: cleanup
    to: normalize_mode
    type: primary
  - from: normalize_mode
    to: en_norm
    type: primary
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.5
  - from: normalize_mode
    to: zh_norm
    type: primary
    style:
      exitX: 0
      exitY: 0.75
      entryX: 1
      entryY: 0.5
  - from: en_norm
    to: match
    type: primary
    waypoints:
      - x: 688
        'y': 514
      - x: 688
        'y': 590
  - from: zh_norm
    to: match
    type: primary
    waypoints:
      - x: 648
        'y': 706
      - x: 648
        'y': 630
  - from: match
