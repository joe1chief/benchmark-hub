meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCP-Atlas Build and Evaluation Process
  description: >-
    Paper-v3 reconstruction of the expert-authored real-server benchmark, its five-layer QA and 500/500 release, the
    primary answer-only claim-scoring path, and independently audited public-data, harness, and live-leaderboard
    boundaries.
  legend: >-
    Solid arrows show the paper-backed construction and primary evaluation flow. Dashed data arrows show release
    evidence, artifact audits, post-hoc diagnostics, cross-judge sensitivity, and the mutable leaderboard boundary.
    Paper, public dataset, public harness, and live leaderboard are separate snapshots and must not be merged.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      arXiv 2602.00933v3 · 2026-05-19
      PDF SHA-256 2cd00f60…
      Git b6edd44 · HF b5bcde2
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: ecosystem
    label: |-
      Select the Server Ecosystem
      36 Production MCP Servers
      220 Tools Used across All Tasks
      Five Domains · No Synthetic Stubs
    type: database
    size: xl
    position:
      x: 320
      'y': 120
  - id: author
    label: |-
      Experts Author 1,000 Tasks
      Mean 4.6 Expert-hours per Task
      Tool-dependent · Stable · Unambiguous
      Natural Single-turn English Prompts
    type: user
    size: xl
    position:
      x: 600
      'y': 120
  - id: tool_env
    label: |-
      Curate Each Tool Environment
      Expose 6–37 Tools · Mean 15.2
      Required 2–8 · Mean 4.1
      Plausible Distractors · Mean 11.1
      Hide Server, Tool, and Parameter Names
    type: process
    size: xl
    position:
      x: 880
      'y': 120
    style:
      fontSize: 9
  - id: trajectory
    label: |-
      Execute a Reference Trajectory
      Minimal Sufficient Evidence Path
      Paper Reports Mean 9.8 Steps
      Verify Solvability + Tool Dependence
      Never a Pass / Fail Target
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
    style:
      fontSize: 9
  - id: claims
    label: |-
      Author the Grounded Claim Rubric
      Atomic Independently Verifiable Facts
      Full-set Mean 4.7 · Range 1–23
      Ground Every Claim in Tool Outputs
      Alternative Valid Paths Get Credit
    type: document
    size: xl
    position:
      x: 1440
      'y': 120
    style:
      fontSize: 9
  - id: qa
    label: |-
      Apply Five QA Layers
      1 Expert Execution · 2 Domain Review
      3 Leakage Review · 4 LLM Verification
      5 Random-sample Manual Audit
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: split
    label: |-
      Randomly Split 1,000 Tasks
      Public 500: Reproducibility
      Private 500: Exposure Monitoring
      Holdout Protects Leaderboard Integrity
    type: database
    size: xl
    position:
      x: 2000
      'y': 120
  - id: public_release
    label: |-
      Pin the Public Data Artifact
      HF b5bcde2 · 500 Parquet Rows
      TASK · ENABLED_TOOLS · PROMPT
      GTFA_CLAIMS · TRAJECTORY
      CC BY 4.0 · Private Rows Absent
    type: database
    size: xl
    position:
      x: 2000
      'y': 520
    style:
      fontSize: 9
  - id: public_stats
    label: |-
      Public Parquet Audit
      7–37 Enabled Tools · Mean 15.20
      2–8 Distinct Called Tools · Mean 4.11
      3–17 Tool Calls · Mean 4.85
      1–23 Claims · Mean 3.90
    type: document
    size: xl
    position:
      x: 1720
      'y': 520
    style:
      fontSize: 9
  - id: card_drift
    label: |-
      HF Card vs Parquet
      Card Says 10–25 Tools · 3–6 Calls
      Six Rows Fall outside 10–25
      Fifty Rows Exceed Six Calls
      Use Parquet, Not Card, for Counts
    type: document
    size: xl
    position:
      x: 1440
      'y': 520
    style:
      fontSize: 9
  - id: schema_gap
    label: |-
      Public Schema Audit
      Five ENABLED_TOOLS Rows Use Objects
      Other Rows Use Tool-name Strings
      One GTFA_CLAIMS List Is Malformed
      Dependencies Are Not Explicit Fields
    type: document
    size: xl
    position:
      x: 1160
      'y': 520
    style:
      fontSize: 9
  - id: repo_release
    label: |-
      Audit the Public Harness
      Git b6edd44 · TypeScript v2
      Registry Snapshot: 1.2.7 @ sha256:24e6ed…
      run_eval Passes Tag · run_all Uses Local latest
      Sandbox URL Does Not Validate Digest
    type: service
    size: xl
    position:
      x: 880
      'y': 520
    style:
      fontSize: 9
  - id: release_gap
    label: |-
      Paper / Public Harness Boundary
      Paper: Apache-2.0 · Repo: MIT
      Paper: Up to Five Task Retries
      Outer LLM Call: 3 Attempts · 2 Retries
      LiteLLM 401 / 429: Up to 5 Retries
    type: document
    size: xl
    position:
      x: 600
      'y': 520
    style:
      fontSize: 9
  - id: isolation_gap
    label: |-
      Environment Isolation Boundary
      Sec. 3.1: Restart between Runs
      Appendix: Restart between Tasks
      Public v2: Shared Sandbox; No Reset
      Live APIs Still Drift Upstream
    type: document
    size: xl
    position:
      x: 320
      'y': 520
    style:
      fontSize: 9
  - id: eval_input
    label: |-
      Choose a Public or Private Task
      Single-turn Prompt + Exposed Tool Set
      Targets Mixed with Distractors
      Full Paper Run Uses All 1,000 Tasks
    type: database
    size: xl
    position:
      x: 2000
      'y': 920
  - id: matched
    label: |-
      Hold Task-level Conditions Fixed
      Same Prompt · Tools · 100-call Budget
      Same Rubric · Final-answer Protocol
      Provider-specific Adapter Only
      No Model-specific Scaffolding
    type: process
    size: xl
    position:
      x: 1720
      'y': 920
    style:
      fontSize: 9
  - id: agent_loop
    label: |-
      Run the Tool-using Agent
      Discover Tools · Call Live Endpoints
      Consume Results / Errors · Continue
      At the Limit, Grade Partial Response
      Emit One Final Text Answer
    type: process
    size: xl
    position:
      x: 1440
      'y': 920
    style:
      fontSize: 9
  - id: primary_judge
    label: |-
      Primary Claim Judge
      Gemini 3.1 Pro Preview
      One Independent Call per Claim
      Claim + Final Answer Only
      Fulfilled 1 · Partial 0.5 · Missing 0
    type: process
    size: xl
    position:
      x: 1160
      'y': 920
    style:
      fontSize: 9
  - id: coverage
    label: |-
      Compute Answer-only Coverage
      Mean of Independent Claim Scores
      Reference Trajectory Is Excluded
      Pass iff Coverage ≥ 0.75
    type: formula
    size: xl
    position:
      x: 880
      'y': 920
  - id: aggregate
    label: |-
      Aggregate the 1,000 Tasks
      Pass Rate = Mean Task Pass
      10,000 Bootstrap Resamples
      95% CI: 2.5th / 97.5th Percentiles
    type: process
    size: xl
    position:
      x: 600
      'y': 920
  - id: paper_report
    label: |-
      Paper-v3 Reporting Boundary
      20 Models · Six Providers
      Primary Judge Defines Main Results
      Best Pass@0.75 = 82.2%
    type: terminal
    size: xl
    position:
      x: 320
      'y': 920
  - id: judge_sensitivity
    label: |-
      Cross-judge Sensitivity Only
      GPT-5.4 + Claude Opus 4.6
      Independently Rescore Every Task
      Report 2.1–4.6 pp Ranges
      Do Not Average into Main Results
    type: document
    size: xl
    position:
      x: 1160
      'y': 1220
    style:
      fontSize: 9
  - id: diagnostics
    label: |-
      Diagnose Only Failed Tasks
      Coverage < 0.75 · Post-hoc Only
      4 Tool-call + 7 Cognitive Modes
      Never Changes Pass / Fail
    type: process
    size: xl
    position:
      x: 880
      'y': 1220
  - id: live_boundary
    label: |-
      Mutable Leaderboard Boundary
      April: Gemini 2.5 + Original Prompt
      Transient-error Retry + 100 Calls
      v3: Gemini 3.1 · Claim + Answer Only
      Current Rows Extend beyond the Paper
    type: document
    size: xl
    position:
      x: 320
      'y': 1220
    style:
      fontSize: 9
