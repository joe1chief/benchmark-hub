meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCP-Atlas Build Process
  description: >-
    Reconstructs the expert-authored real-server task pipeline, five-layer quality assurance, claims-based scoring, and
    public-private release protocol in arXiv:2602.00933v3.
  legend: >-
    Reference trajectories establish solvability and support diagnostics; they are never used for pass/fail scoring. A
    task passes only from its final-answer claim coverage at the 0.75 threshold.
nodes:
  - id: ecosystem
    label: |-
      Select the Production Ecosystem
      36 Real MCP Servers · 220 Tools
      Five Application Domains
      Authentic Endpoints · No Mock Stubs
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: contain
    label: |-
      Make Runs Reproducible
      Containerize and Pin Versions
      Sandbox Filesystems · Allow-list Egress
      Restart Servers between Runs
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: author
    label: |-
      Experts Author 1,000 Tasks
      Single-turn Natural-language Requests
      Do Not Name Servers or Tools
      Do Not Reveal Parameters
    type: user
    size: xl
    position:
      x: 580
      'y': 40
  - id: tools
    label: |-
      Configure Each Tool Environment
      Expose 6–37 Tools · Mean 15.2
      Only 2–8 Relevant · Mean 4.1
      Add Plausible Semantic Distractors
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: workflows
    label: |-
      Require Realistic Workflows
      Multi-hop Output Dependencies
      Branching and Conditional Logic
      98.6% Use at Least Two Servers
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: reference
    label: |-
      Execute a Reference Trajectory
      Minimal Correct Solution Path
      Mean 9.8 Tool-call Steps
      Check Solvability and Tool Dependence
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: claims
    label: |-
      Write the Claim Rubric
      Atomic Facts Grounded in Tool Outputs
      Mean 4.7 Claims · Range 1–23
      Accept Alternative Valid Trajectories
    type: document
    size: xl
    position:
      x: 1420
      'y': 420
  - id: qa
    label: |-
      Apply Five QA Layers
      Expert Execution · Domain Review
      Leakage Review · LLM Verification
      Random-sample Manual Audit
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: split
    label: |-
      Randomly Split All Tasks
      500-task Public Split
      500-task Private Split
      Preserve Integrity and Monitor Exposure
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: execute
    label: |-
      Run Agents under Matched Conditions
      Same Prompt and Exposed Tool Set
      Same Tool-call Budget and Rubric
      Same Final-answer Protocol
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: score
    label: |-
      Score the Final Answer by Claims
      Three Independent LLM Judges
      Fulfilled 1 · Partial 0.5 · Missing 0
      Coverage = Mean Claim Score
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report MCP-Atlas Results
      Pass When Coverage ≥ 0.75
      Pass Rate with 95% Confidence Interval
      Diagnose Failures with 11 Categories
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
