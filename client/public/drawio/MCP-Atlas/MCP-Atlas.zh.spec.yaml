meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MCP-Atlas 构建与评测流程
  description: 按论文 v3 还原专家编写的真实服务器基准、五层质检与 500/500 发布方式、主答案声明评分链路，并独立审计公开数据、 公开 harness 与实时榜单边界。
  legend: 实线表示论文支持的构建与主评测流程；虚线数据箭头表示发布证据、资产审计、事后诊断、跨评判器敏感性分析和动态榜单边界。 论文、公开数据、公开 harness 与实时榜单属于不同快照，不应混合解释。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv 2602.00933v3 · 2026-05-19
      PDF SHA-256 2cd00f60…
      Git b6edd44 · HF b5bcde2
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: ecosystem
    label: |-
      选择服务器生态
      36 个生产级 MCP 服务器
      全部任务共使用 220 个工具
      五个领域 · 不使用合成模拟桩
    type: database
    size: xl
    position:
      x: 320
      'y': 120
  - id: author
    label: |-
      专家编写 1,000 个任务
      每题平均投入 4.6 个专家工时
      工具依赖 · 稳定 · 无歧义
      自然的单轮英文提示
    type: user
    size: xl
    position:
      x: 600
      'y': 120
  - id: tool_env
    label: |-
      配置每题工具环境
      暴露 6–37 个工具 · 均值 15.2
      必需 2–8 个 · 均值 4.1
      可信干扰项 · 均值 11.1
      隐去服务器、工具和参数名
    type: process
    size: xl
    position:
      x: 880
      'y': 120
    style:
      fontSize: 9
  - id: trajectory
    label: |-
      执行参考轨迹
      最小充分证据路径
      论文称平均 9.8 步
      验证可解性与工具依赖
      从不作为通过判定目标
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
    style:
      fontSize: 9
  - id: claims
    label: |-
      编写有依据的声明评分标准
      原子且可独立核验的事实
      全量均值 4.7 条 · 范围 1–23 条
      每条声明均基于工具输出
      其他有效轨迹同样可得分
    type: document
    size: xl
    position:
      x: 1440
      'y': 120
    style:
      fontSize: 9
  - id: qa
    label: |-
      执行五层质量检查
      1 专家执行 · 2 领域复审
      3 泄露复审 · 4 LLM 自动核验
      5 随机样本人工审计
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: split
    label: |-
      随机拆分 1,000 个任务
      公开 500 题：支持复现
      私有 500 题：监控暴露
      留出集维护榜单完整性
    type: database
    size: xl
    position:
      x: 2000
      'y': 120
  - id: public_release
    label: |-
      固定公开数据资产
      HF b5bcde2 · 500 行 Parquet
      TASK · ENABLED_TOOLS · PROMPT
      GTFA_CLAIMS · TRAJECTORY
      CC BY 4.0 · 不含私有题
    type: database
    size: xl
    position:
      x: 2000
      'y': 520
    style:
      fontSize: 9
  - id: public_stats
    label: |-
      公开 Parquet 实测
      暴露 7–37 个工具 · 均值 15.20
      调用 2–8 种工具 · 均值 4.11
      3–17 次工具调用 · 均值 4.85
      1–23 条声明 · 均值 3.90
    type: document
    size: xl
    position:
      x: 1720
      'y': 520
    style:
      fontSize: 9
  - id: card_drift
    label: |-
      HF 卡片与 Parquet 不一致
      卡片称 10–25 个工具 · 3–6 次调用
      六行超出 10–25 范围
      五十行超过六次调用
      计数应以 Parquet 为准
    type: document
    size: xl
    position:
      x: 1440
      'y': 520
    style:
      fontSize: 9
  - id: schema_gap
    label: |-
      公开数据结构审计
      五行 ENABLED_TOOLS 使用对象
      其余行使用工具名字符串
      一行 GTFA_CLAIMS 列表格式损坏
      依赖关系没有独立字段
    type: document
    size: xl
    position:
      x: 1160
      'y': 520
    style:
      fontSize: 9
  - id: repo_release
    label: |-
      审计公开 Harness
      Git b6edd44 · TypeScript v2
      镜像仓库快照：1.2.7 @ sha256:24e6ed…
      run_eval 传标签 · run_all 用本地 latest
      沙盒 URL 不校验镜像摘要
    type: service
    size: xl
    position:
      x: 880
      'y': 520
    style:
      fontSize: 9
  - id: release_gap
    label: |-
      论文与公开 Harness 边界
      论文：Apache-2.0 · 仓库：MIT
      论文：每题最多重试五次
      外层 LLM 调用：3 次尝试 · 最多重试 2 次
      LiteLLM 401/429：最多重试 5 次
    type: document
    size: xl
    position:
      x: 600
      'y': 520
    style:
      fontSize: 9
  - id: isolation_gap
    label: |-
      环境隔离边界
      第 3.1 节：每轮评测间重启
      附录：每题之间重启
      公开 v2：共享沙盒且未重置
      实时 API 仍会产生上游漂移
    type: document
    size: xl
    position:
      x: 320
      'y': 520
    style:
      fontSize: 9
  - id: eval_input
    label: |-
      选择公开或私有任务
      单轮提示 + 暴露工具集
      目标工具与干扰工具混合
      论文完整评测使用全部 1,000 题
    type: database
    size: xl
    position:
      x: 2000
      'y': 920
  - id: matched
    label: |-
      固定任务级评测条件
      相同提示 · 工具 · 100 次调用预算
      相同评分标准 · 最终答案协议
      仅底层适配器随提供方变化
      不使用模型专属脚手架
    type: process
    size: xl
    position:
      x: 1720
      'y': 920
    style:
      fontSize: 9
  - id: agent_loop
    label: |-
      运行工具型智能体
      发现工具 · 调用实时端点
      消费结果或错误并继续
      达到上限时仍评分部分响应
      最终输出一份文本答案
    type: process
    size: xl
    position:
      x: 1440
      'y': 920
    style:
      fontSize: 9
  - id: primary_judge
    label: |-
      主声明评判器
      Gemini 3.1 Pro Preview
      每条声明独立调用一次
      仅输入声明与最终答案
      满足 1 · 部分满足 0.5 · 未满足 0
    type: process
    size: xl
    position:
      x: 1160
      'y': 920
    style:
      fontSize: 9
  - id: coverage
    label: |-
      计算仅基于答案的覆盖率
      独立声明得分取均值
      参考轨迹不参与评分
      覆盖率 ≥ 0.75 才通过
    type: formula
    size: xl
    position:
      x: 880
      'y': 920
  - id: aggregate
    label: |-
      汇总 1,000 个任务
      通过率为任务通过值均值
      执行 10,000 次 Bootstrap 重采样
      95% CI 取 2.5 与 97.5 百分位
    type: process
    size: xl
    position:
      x: 600
      'y': 920
  - id: paper_report
    label: |-
      论文 v3 汇报边界
      20 个模型 · 六个提供方
      主评判器定义主要结果
      最佳 Pass@0.75 = 82.2%
    type: terminal
    size: xl
    position:
      x: 320
      'y': 920
  - id: judge_sensitivity
    label: |-
      跨评判器仅做敏感性分析
      GPT-5.4 + Claude Opus 4.6
      对每个任务独立重新评分
      报告 2.1–4.6 个百分点范围
      不取平均生成主结果
    type: document
    size: xl
    position:
      x: 1160
      'y': 1220
    style:
      fontSize: 9
  - id: diagnostics
    label: |-
      只诊断未通过任务
      覆盖率 < 0.75 · 仅事后分析
      4 类工具调用 + 7 类认知故障
      从不改变通过判定
    type: process
    size: xl
    position:
      x: 880
      'y': 1220
  - id: live_boundary
    label: |-
      动态榜单边界
      四月：Gemini 2.5 + 原始提示
      瞬态错误重试 + 100 次调用
      v3：Gemini 3.1 · 仅声明与答案
      当前榜单行已超出论文范围
    type: document
    size: xl
    position:
      x: 320
      'y': 1220
    style:
      fontSize: 9
edges:
  - from: evidence
    to: ecosystem
    type: primary
  - from: ecosystem
    to: author
    type: primary
  - from: author
    to: tool_env
    type: primary
  - from: tool_env
    to: trajectory
    type: primary
  - from: trajectory
    to: claims
    type: primary
  - from: claims
    to: qa
    type: primary
  - from: qa
    to: split
    type: primary
  - from: split
    to: public_release
    type: data
  - from: public_release
    to: public_stats
    type: data
  - from: public_stats
    to: card_drift
    type: data
  - from: card_drift
    to: schema_gap
    type: data
  - from: evidence
    to: repo_release
    type: data
  - from: repo_release
    to: release_gap
    type: data
  - from: release_gap
    to: isolation_gap
    type: data
  - from: split
    to: eval_input
    type: primary
  - from: eval_input
    to: matched
    type: primary
  - from: matched
    to: agent_loop
    type: primary
  - from: agent_loop
    to: primary_judge
    type: primary
  - from: primary_judge
    to: coverage
    type: primary
  - from: coverage
    to: aggregate
    type: primary
  - from: aggregate
    to: paper_report
    type: primary
  - from: primary_judge
    to: judge_sensitivity
    type: data
  - from: coverage
    to: diagnostics
    type: data
  - from: paper_report
    to: live_boundary
    type: data
modules: []
