meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FullStack Bench Build Process
  description: Paper-aligned multilingual data construction, quality control, difficulty labeling, and SandboxFusion evaluation.
  legend: >-
    Solid arrows follow arXiv:2412.00535 Sections 2–3 from source collection through 3,374 bilingual problems and
    execution-based Pass@1; FullStack Bench here is the published ByteDance benchmark, not an internal model-report
    eval.
nodes:
  - id: sources
    label: |-
      Collect programming source material
      GitHub snippets · code documents/books · XLCoST
      plus expert-authored domain questions
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: annotation
    label: |-
      LLM-assisted, human-verified annotation
      create instruction + reference solution
      create language-specific unit tests and labels
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: review
    label: |-
      Annotators assess every item
      difficulty · ambiguity · solvability
      cross-refine; consensus or senior adjudication
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: difficulty
    label: |-
      Six-model voting sets difficulty
      remove items solved by all six models
      1 solver = hard · 5–6 = easy · else medium
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: domains
    label: |-
      Derive real-world domain taxonomy
      label 500K Stack Overflow questions
      keep 11 domains covering 88.1% + Others
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: bilingual
    label: |-
      Build bilingual, multilingual-code pairs
      translate each Chinese/English prompt counterpart
      16 languages from Bash and C++ to SQL/TypeScript
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: release
    label: |-
      FullStack Bench release
      3,374 problems · 15,168 unit tests
      question + tests + reference solution + labels
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: generation
    label: |-
      Generate model completion from benchmark prompt
      SandboxFusion extracts code from the response
      combine it with predefined unit tests
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: execute
    label: |-
      Execute synthesized program in SandboxFusion
      language/dependency-aware environment
      capture compiler, runtime, and test outcomes
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: score
    label: |-
      Judge execution and report Pass@1
      passing unit-test execution means correct
      analyze by language, domain, and difficulty
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
