meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FullStack Bench Build Process
  description: Pinned paper, repository, and dataset flow from multilingual construction through SandboxFusion Pass@1.
  legend: >-
    Solid arrows follow arXiv:2412.00535v6, bytedance/FullStackBench revision a3c99a9e, and the Hugging Face dataset
    revision 11e2e64d. The public release does not include the original authoring scripts or six-model vote outputs.
nodes:
  - id: evidence
    label: |-
      Evidence: arXiv:2412.00535v6
      repo @ a3c99a9e
      HF data @ 11e2e64d
      paper + pinned public-release audit
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: sources
    label: |-
      Collect programming source material
      GitHub snippets · documents/books
      XLCoST + expert-authored questions
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: annotation
    label: |-
      LLM-assisted, human-verified
      create instructions + reference solutions
      create language-specific unit tests
      and labels
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: quality_control
    label: |-
      Assess difficulty, ambiguity, solvability
      exchange items for cross-refinement
      resolve by consensus/senior annotator
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: difficulty_vote
    label: |-
      Vote with six specified models
      discard items all six answer correctly
      1 = hard · 5 = easy · 2–4 = medium
    type: process
    size: xl
    position:
      x: 1080
      'y': 120
  - id: domain_taxonomy
    label: |-
      LLM-label 500K Stack Overflow items
      top 11 cover 88.1% + Others
      GPT labels constructed questions
    type: process
    size: xl
    position:
      x: 1340
      'y': 120
  - id: bilingual
    label: |-
      Translate each source prompt
      into the other language
      1,687 English + 1,687 Chinese
      preserve code in 16 languages
    type: process
    size: xl
    position:
      x: 1600
      'y': 120
  - id: release
    label: |-
      Release 3,374 records
      15,168 unit tests
      16 languages · 11 domains + Others
      question + tests + solution + labels
    type: database
    size: xl
    position:
      x: 1600
      'y': 420
  - id: prompting
    label: |-
      Use problem text as user prompt
      model-default system · temperature 0
      max 2,048 completion tokens
      inference is external
    type: process
    size: xl
    position:
      x: 1340
      'y': 420
  - id: extraction
    label: |-
      Non-Java extraction priority
      complete fenced > incomplete fenced
      > heuristic; target language first
    type: process
    size: xl
    position:
      x: 1080
      'y': 420
  - id: execution
    label: |-
      Java: split classes/enums/interfaces
      into named files; run JUnit
      others: append predefined tests
      execute with language dependencies
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: metric
    label: |-
      Official runner: English 1,687 only
      accepted = successful sandbox result
      Pass@1 = Σ accepted / len(results)
      not fixed at bilingual 3,374
    type: terminal
    size: xl
    position:
      x: 560
      'y': 420
edges:
  - from: evidence
    to: sources
    type: primary
  - from: sources
    to: annotation
    type: primary
  - from: annotation
    to: quality_control
    type: primary
  - from: quality_control
    to: difficulty_vote
    type: primary
  - from: difficulty_vote
    to: domain_taxonomy
    type: primary
  - from: domain_taxonomy
    to: bilingual
    type: primary
  - from: bilingual
    to: release
    type: primary
  - from: release
    to: prompting
    type: primary
  - from: prompting
    to: extraction
    type: primary
  - from: extraction
    to: execution
    type: primary
  - from: execution
    to: metric
    type: primary
modules: []
