meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FullStack Bench 构建流程
  description: 按论文对齐的多语言数据构建、质量控制、难度标注与 SandboxFusion 评测流程。
  legend: 实线箭头对应 arXiv:2412.00535 第 2–3 节，从来源收集到 3,374 道双语题及执行式 Pass@1；此处指字节跳动公开论文基准，而非模型报告内部评测。
nodes:
  - id: sources
    label: |-
      收集编程素材
      GitHub 代码 · 编程文档/书籍 · XLCoST
      再由领域专家原创问题
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: annotation
    label: |-
      LLM 辅助、人工核验标注
      生成指令 + 参考解答
      生成语言专用单测与标签
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: review
    label: |-
      标注员逐题评估
      难度 · 歧义 · 可解性
      交叉精炼；共识或资深标注员裁决
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: difficulty
    label: |-
      六模型投票确定难度
      删除六个模型全部答对的题
      1 个答对=难 · 5–6 个=易 · 其余=中
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: domains
    label: |-
      推导真实开发领域分类
      标注 50 万条 Stack Overflow 问题
      保留覆盖 88.1% 的 11 类 + 其他
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: bilingual
    label: |-
      构建双语题与多语言代码
      中英文题面互译形成对应版本
      16 种语言：Bash/C++ 至 SQL/TypeScript
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: release
    label: |-
      FullStack Bench 发布集
      3,374 道题 · 15,168 个单测
      题面 + 单测 + 参考解 + 标签
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: generation
    label: |-
      模型根据基准提示生成回复
      SandboxFusion 从回复中抽取代码
      与预定义单测合成可执行程序
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: execute
    label: |-
      在 SandboxFusion 中执行程序
      适配语言与依赖的隔离环境
      捕获编译、运行与测试结果
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: score
    label: |-
      判定执行结果并报告 Pass@1
      单测执行通过即为正确
      按语言、领域和难度分析
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
edges:
