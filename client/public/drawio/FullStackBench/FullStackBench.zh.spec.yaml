    type: primary
  - from: domains
    to: bilingual
    type: primary
  - from: bilingual
    to: release
    type: primary
  - from: release
    to: generation
    type: primary
  - from: generation
    to: execute
    type: primary
  - from: execute
    to: score
    type: primary
modules: []
