meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FullStack Bench 构建流程
  description: 按固定论文、仓库与数据集版本，从多语言构建到 SandboxFusion Pass@1 的完整流程。
  legend: 实线箭头对应 arXiv:2412.00535v6、bytedance/FullStackBench 修订 a3c99a9e 与 Hugging Face 数据修订 11e2e64d；公开发布物不含原始命题脚本或六模型投票输出。
nodes:
  - id: evidence
    label: |-
      证据：arXiv:2412.00535v6
      仓库 @ a3c99a9e · HF 数据 @ 11e2e64d
      论文方法 + 固定公开发布物审计
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: sources
    label: |-
      收集编程素材
      GitHub 代码 · 文档/书籍 · XLCoST
      再由领域专家原创问题
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: annotation
    label: |-
      LLM 辅助、人工核验标注
      生成指令 + 参考解答
      生成语言专用单测与标签
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: quality_control
    label: |-
      评估难度、歧义与可解性
      交换题目做交叉精炼
      以共识或资深标注员裁决分歧
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: difficulty_vote
    label: |-
      六模型投票；全部答对项删除
      1 个答对 = 难 · 5 个答对 = 易
      2–4 个答对 = 中
    type: process
    size: xl
    position:
      x: 1080
      'y': 120
  - id: domain_taxonomy
    label: |-
      用 LLM 标注 50 万条 Stack Overflow 问题
      保留覆盖 88.1% 的前 11 类 + 其他
      再由 GPT 标注构建后的题目
    type: process
    size: xl
    position:
      x: 1340
      'y': 120
  - id: bilingual
    label: |-
      将每道原始题翻译为另一种语言
      英文 1,687 条 + 中文 1,687 条
      保留覆盖 16 种语言的多语言代码
    type: process
    size: xl
    position:
      x: 1600
      'y': 120
  - id: release
    label: |-
      发布 3,374 条记录与 15,168 个单测
      16 种编程语言 · 11 个领域 + 其他
      题面 + 单测 + 参考解答 + 标签
    type: database
    size: xl
    position:
      x: 1600
      'y': 420
  - id: prompting
    label: |-
      题目文本作为用户提示
      使用模型默认系统提示 · temperature 0
      最多生成 2,048 token；外部完成推理
    type: process
    size: xl
    position:
      x: 1340
      'y': 420
  - id: extraction
    label: |-
      非 Java 提取优先级
      完整围栏代码块 > 不完整围栏
      > 启发式；先取目标语言
    type: process
    size: xl
    position:
      x: 1080
      'y': 420
  - id: execution
    label: |-
      Java：拆分全部类/枚举/接口
      写入同名文件并运行 JUnit
      其他语言：拼接预定义单测
      按执行语言带依赖运行
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: metric
    label: |-
      官方脚本仅跑英文 1,687 条
      accepted = 沙箱执行成功
      Pass@1 = accepted 总数
      / len(results)
      分母不是双语 3,374 条固定值
    type: terminal
    size: xl
    position:
      x: 560
      'y': 420
edges:
  - from: evidence
    to: sources
    type: primary
  - from: sources
    to: annotation
    type: primary
  - from: annotation
    to: quality_control
    type: primary
  - from: quality_control
    to: difficulty_vote
    type: primary
  - from: difficulty_vote
    to: domain_taxonomy
    type: primary
  - from: domain_taxonomy
    to: bilingual
    type: primary
  - from: bilingual
    to: release
    type: primary
  - from: release
    to: prompting
    type: primary
  - from: prompting
    to: extraction
    type: primary
  - from: extraction
    to: execution
    type: primary
  - from: execution
    to: metric
    type: primary
modules: []
