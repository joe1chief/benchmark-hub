meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Gaia2 构建流程
  description: 与论文一致的 Gaia2 ARE 环境、人工场景、增强、执行和写操作验证流程。
  legend: 实线箭头对应 arXiv:2602.11964。800 个人工核心场景与从 Gaia2-mini 派生的 320 个 Noise/A2A 增强场景相互区分，合计评测 1,120 个场景。
nodes:
  - id: are
    label: |-
      构建异步 ARE 抽象
      有状态应用 · 时间管理 · 事件/DAG
      通知 · 场景 · 写操作验证
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: mobile
    label: |-
      实例化 Mobile 环境
      12 个应用 · 101 个工具 · 10 个用户宇宙
      PersonaHub 播种并跨应用依赖传播
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: content
    label: |-
      填充一致的长程状态
      40 万–80 万结构化/非结构化 tokens
      模型生成期间模拟时间持续推进
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: author
    label: |-
      人工编写 oracle 场景 DAG
      写操作 + 环境事件 + 初始状态
      分别突出执行/搜索/歧义/适应/时间能力
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: validate
    label: |-
      多轮独立验证
      一致性检查 + 图结构 guardrail
      用基线智能体校准难度
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: core
    label: |-
      汇总 800 个独立核心场景
      五个人工能力分集
      策划 160 场景的 Gaia2-mini 子集
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: augment
    label: |-
      对 mini 应用两种环境增强
      Noise：工具失败/签名变化/垃圾事件
      A2A：用按需应用智能体替换应用
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: release
    label: |-
      最终 Gaia2 评测套件
      800 核心 + 320 增强 = 1,120 场景
      五个核心视图 + Noise + Agent2Agent
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: run
    label: |-
      所有模型使用同一 ReAct 式脚手架
      每步一个 JSON 工具调用 + 通知 hooks
      温度 0.5 · 每轮16K · 运行3次 · 最多200步
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: verify
    label: |-
      ARE 验证器检查每个写操作
      精确/灵活参数 · 因果 · 时序 · 完整性
      450 轨迹上一致率 0.98、精确率 0.99
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: score
    label: |-
      按分集和总体报告 Pass@1
      对各能力分集取平均
      同时分析成本、时延和鲁棒性权衡
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: are
    to: mobile
    type: primary
  - from: mobile
    to: content
    type: primary
  - from: content
    to: author
    type: primary
  - from: author
    to: validate
    type: primary
  - from: validate
    to: core
    type: primary
  - from: core
    to: augment
    type: primary
  - from: augment
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: verify
    type: primary
  - from: verify
    to: score
    type: primary
modules: []
