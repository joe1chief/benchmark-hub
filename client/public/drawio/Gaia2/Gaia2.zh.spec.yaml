  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Gaia2 构建流程
  description: 基于论文与固定版本发布物的场景构建、验证、增强、执行和写操作校验流程。
  legend: 虚线箭头表示固定版本证据；实线箭头表示构建与评测流程。五个公开数据配置不同于两个从 mini 派生的评测增强。
nodes:
