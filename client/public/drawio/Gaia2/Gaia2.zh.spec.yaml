      一手证据
      arXiv:2602.11964v1
      仓库 79463674 · 数据 78ea3bdb
    type: document
    size: xl
    position:
      x: 40
      'y': 100
  - id: are_mobile
    label: |-
      构建 ARE Mobile
      12 个应用 · 101 个工具 · 10 个宇宙
      每个宇宙 40万–80万 token
    type: process
    size: xl
    position:
      x: 300
      'y': 100
  - id: annotation
