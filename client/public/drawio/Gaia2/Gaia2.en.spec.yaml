meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Gaia2 Build Process
  description: >-
    Paper-aligned ARE environment, human scenario, augmentation, execution, and write-action verification flow for
    Gaia2.
  legend: >-
    Solid arrows follow arXiv:2602.11964. The 800 human-authored core scenarios are distinct from the 320 Noise/A2A
    augmentations derived from Gaia2-mini, giving 1,120 evaluated scenarios.
nodes:
  - id: are
    label: |-
      Build the asynchronous ARE abstractions
      stateful apps · time manager · events/DAGs
      notifications · scenarios · write verification
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: mobile
    label: |-
      Instantiate the Mobile environment
      12 apps · 101 tools · 10 user universes
      PersonaHub seeds and cross-app dependency propagation
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: content
    label: |-
      Populate coherent long-horizon state
      400K–800K structured/unstructured tokens
      simulated time advances during model generation
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: author
    label: |-
      Humans author oracle scenario DAGs
      write actions + environment events + initial state
      isolate Execution/Search/Ambiguity/Adaptability/Time
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: validate
    label: |-
      Independently validate in multiple rounds
      consistency check + graph guardrails
      calibrate difficulty with a baseline agent
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: core
    label: |-
      Assemble 800 unique core scenarios
      five human-authored capability splits
      curate a 160-scenario Gaia2-mini subset
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: augment
    label: |-
      Apply two environment augmentations to mini
      Noise: tool failures/signature changes/spam events
      A2A: replace apps with on-demand app-agents
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: release
    label: |-
      Final Gaia2 evaluation suite
      800 core + 320 augmented = 1,120 scenarios
      seven views: five core + Noise + Agent2Agent
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: run
    label: |-
      Run the same ReAct-style scaffold
      one JSON tool call/step + notification hooks
      temperature 0.5 · 16K/turn · 3 runs · ≤200 steps
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: verify
    label: |-
      ARE Verifier checks every write action
      exact/flexible arguments · causality · timing · completeness
      0.98 agreement and 0.99 precision on 450 trajectories
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: score
    label: |-
      Report Pass@1 by split and overall
      average across capability splits
      also analyze cost, latency, and robustness trade-offs
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 250
edges:
  - from: are
    to: mobile
    type: primary
  - from: mobile
    to: content
    type: primary
  - from: content
    to: author
    type: primary
  - from: author
    to: validate
    type: primary
  - from: validate
    to: core
    type: primary
  - from: core
    to: augment
    type: primary
  - from: augment
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: verify
    type: primary
  - from: verify
    to: score
    type: primary
modules: []
