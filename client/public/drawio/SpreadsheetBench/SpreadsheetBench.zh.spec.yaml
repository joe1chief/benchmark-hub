meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SpreadsheetBench 构建与评测流程
  description: >-
    SpreadsheetBench从ExcelForum、Chandoo、MrExcel和ExcelGuru的真实电子表格操作帖子开始。作者保留已解决、软件无关、可行、可测试且具有代表性并附带电子表格的问题。GPT-4把分散论坛讨论改写为自洽指令，再由标注者核验；标注者还识别论坛解法、应用公式或VBA并指定单元格级或工作表级答案位置。每条适合多测例的指令包含原始输入输出表格，再制作两个数据经修改且覆盖边界情况的输入输出测试对。改写问题、修改表格数值和移动答案位置共同缓解泄漏。20名Excel专家参与标注，2名验证者与2名作者执行两轮质检。最终发布912条指令和2729个测试用例。模型为每条指令生成一个代码解法并应用到全部关联表格，输出精确匹配即通过；软OJ按测试用例给部分分，硬OJ要求全部测试通过，并评测单轮与最多5轮推理。
  legend: >-
    来源：SpreadsheetBench arXiv:2406.14991 Sections 2.1-2.4 and Appendix B; official RUCKBReasoning/SpreadsheetBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
