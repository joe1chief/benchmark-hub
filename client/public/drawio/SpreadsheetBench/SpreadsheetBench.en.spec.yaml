meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SpreadsheetBench Build and Evaluation Process
  description: >-
    SpreadsheetBench starts from real spreadsheet-manipulation posts on ExcelForum, Chandoo, MrExcel, and ExcelGuru. The
    authors retain solved, software-independent, feasible, testable, and representative questions with spreadsheet
    attachments. GPT-4 rewrites scattered forum threads into self-contained instructions, which annotators verify;
    annotators also identify forum solutions, apply formulas or VBA, and specify cell- or sheet-level answer positions.
    Each suitable instruction receives the original input-output spreadsheet plus two data-modified corner-case test
    pairs. Rewritten questions, changed spreadsheet values, and shifted answer positions mitigate leakage. Twenty Excel
    specialists annotate; two validators and two authors perform two quality rounds. The release has 912 instructions
    and 2,729 test cases. A model generates one code solution per instruction, which is applied to every associated
    spreadsheet. Exact output matches are accepted. Soft OJ scoring grants per-test partial credit, while hard OJ
    scoring requires every test to pass; single- and up-to-five-round inference settings are evaluated.
  legend: >-
    Source: SpreadsheetBench arXiv:2406.14991 Sections 2.1-2.4 and Appendix B; official RUCKBReasoning/SpreadsheetBench
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
