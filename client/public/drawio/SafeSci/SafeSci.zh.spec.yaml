meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafeSci 构建与评测流程
  description: >-
    SafeSci把科学安全分为安全知识与安全风险，并在7个领域设计125项任务。SafeSciBench中90%以上来自结构化科学记录：LLM为全部任务起草1.5万余个模板，人工核验后通过占位符填入元数据。其余非结构化文献由Generator生成问题，答案必须是源片段中的原句，再由Validator检查严格对应。最终基准包含25万余条测试查询，另有与测试元素不重叠的150万条SafeSciTrain指令用于安全微调。评测在多次运行中随机抽样，选择题与判断题使用准确率，分子和序列生成使用领域指标，风险请求使用拒绝率或安全率。
  legend: >-
    来源：SafeSci arXiv:2603.01589v2 Sections 3.1-3.4, Table 2, and Appendix B; official yangyangyang127/SafeSci
    repository。实线箭头表示论文或官方资料明确支持的主流程。
