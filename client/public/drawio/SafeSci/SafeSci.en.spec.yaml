meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafeSci Build and Evaluation Process
  description: >-
    SafeSci separates scientific safety knowledge from safety risk and designs 125 tasks across seven fields. More than
    90% of SafeSciBench comes from structured scientific records: LLMs draft over 15,000 task templates, humans verify
    them, and metadata is inserted through placeholders. For the remaining unstructured literature, a Generator creates
    questions whose answers must be verbatim source sentences and a Validator checks strict correspondence. The final
    benchmark has more than 250,000 test queries, while 1.5 million non-overlapping SafeSciTrain instructions support
    safety tuning. Evaluation randomly samples subsets across repeated runs and uses accuracy for MCQ/TFQ,
    domain-specific molecular and sequence metrics for generation, and refusal or safety rate for risk requests.
  legend: >-
    Source: SafeSci arXiv:2603.01589v2 Sections 3.1-3.4, Table 2, and Appendix B; official yangyangyang127/SafeSci
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
