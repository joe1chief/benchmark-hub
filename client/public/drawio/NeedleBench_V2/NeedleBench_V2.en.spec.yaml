meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NeedleBench V2 Build Process
  description: >-
    Paper-v3- and fixed-OpenCompass-aligned construction and scoring of bilingual information-sparse retrieval and
    reasoning tasks plus the information-dense Ancestral Trace Challenge.
  legend: >-
    Solid arrows are construction and scoring paths. Dashed arrows are filler-data inputs or release boundaries.
    Sparse-task and ATC metrics remain separate; the paper does not define one combined score across both branches.
nodes:
  - id: scope
    label: |-
      Define Bilingual Long-context Evaluation
      Synthetic Retrieval and Reasoning
      Information-sparse and Information-dense
      Adaptive Context Lengths
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: synthetic
    label: |-
      Generate Synthetic Information Units
      Fictional Facts and Kinship Relations
      Random Names and Templates
      Avoid Real-world and Pretraining Knowledge
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: density_gate
    label: |-
      Which Information-density
      Scenario?
    type: decision
    size: xl
    position:
      x: 600
      'y': 300
  - id: haystacks
    label: |-
      Sparse-task Filler Corpora
      English: Paul Graham Essays
      Chinese: Domain Modeling Evaluation
      Irrelevant Text Only in Sparse Tasks
    type: database
    size: xl
    position:
      x: 1160
      'y': 300
  - id: sparse_tasks
    label: |-
      Instantiate Three Sparse Tasks
      S-RT: One Fact
      M-RT: Multiple Facts
      M-RS: Two to Five Kinship Facts
    type: document
    size: xl
    position:
      x: 880
      'y': 60
  - id: sparse_insert
    label: |-
      Insert Needles at Controlled Depths
      Single or Multiple Key Units
      Spread Multi-needle Inputs
      Preserve Target Context Length
    type: process
    size: xl
    position:
      x: 1160
      'y': 60
  - id: sparse_configs
    label: |-
      Sweep Official V2 Configurations
      4k · 8k · 32k · 128k
      200k · 256k · 1,000k
      GPT-4 Tokenizer · Length Buffer · R=10
    type: process
    size: xl
    position:
      x: 1440
      'y': 60
  - id: sparse_inference
    label: |-
      Run Candidate Model
      Read Complete Haystack and Query
      Produce Task-specific Answer
      Keep Full Instructions after Buffering
    type: process
    size: xl
    position:
      x: 1720
      'y': 60
  - id: sparse_parser_gate
    label: |-
      Which Sparse-task
      Output Contract?
    type: decision
    size: xl
    position:
      x: 2000
      'y': 60
  - id: retrieval_score
    label: |-
      Score S-RT and M-RT
      Keyword-aware Exact Match
      Full Credit if Any Core Keyword Appears
      Otherwise Zero
    type: process
    size: xl
    position:
      x: 2280
      'y': 0
  - id: reasoning_score
    label: |-
      M-RS: Paper versus Fixed Code
      Paper: boxed + Keyword-aware EM
      Fixed: boxed Cleanup + Exact Equality
      Record Scoring Drift
    type: process
    size: xl
    position:
      x: 2280
      'y': 200
  - id: sparse_average
    label: |-
      Aggregate Sparse Results
      Mean Length × Depth × R per Task
      Equal Mean of Three Tasks
      S-RT · M-RT · M-RS
      Replaces Earlier Weighted Mean
    type: process
    size: xl
    position:
      x: 2560
      'y': 100
  - id: atc_names
    label: |-
      Sample n+1 Unique Names
      English or Chinese Name Pool
      Form a Sequential Family Chain
      Ground Truth Is Programmatic
    type: database
    size: xl
    position:
      x: 880
      'y': 560
  - id: atc_relations
    label: |-
      Generate n Relationship Statements
      Random Kinship Term and Template
      Generation Weight 1 or 2
      Accumulate Total Generation Distance
    type: process
    size: xl
    position:
      x: 1160
      'y': 560
  - id: atc_shuffle
    label: |-
      Randomly Shuffle Relationships
      Join into Continuous Context
      Remove Positional Bias
      Every Sentence Is Relevant
    type: process
    size: xl
    position:
      x: 1440
      'y': 560
  - id: atc_questions
    label: |-
      Create Four ATC Question Types
      Eldest Ancestor · N-th Ancestor
      N-th Descendant · Relation Distance
      Derive Exact Ground Truth
    type: process
    size: xl
    position:
      x: 1720
      'y': 560
  - id: atc_scale
    label: |-
      Scale ATC by Powers of Two
      2 · 4 · 8 · 16 · 32
      64 · 128 · 256 · 512 Needles
      Repeat Every Configuration R=10
    type: process
    size: xl
    position:
      x: 2000
      'y': 560
  - id: atc_inference
    label: |-
      Run Candidate Model on Dense Context
      Integrate Every Relationship
      Follow the Selected Question Type
      Put Final Answer in boxed Output
    type: process
    size: xl
    position:
      x: 2280
      'y': 560
  - id: atc_parser
    label: |-
      Released ATC Parser
      Extract boxed Answer Only
      Strip LaTeX · Slashes · Quotes · Tildes
      Missing boxed Answer Becomes None
    type: process
    size: xl
    position:
      x: 2560
      'y': 560
  - id: atc_accuracy
    label: |-
      Compute ATC Exact Match
      Trim Prediction and Reference
      Exact String Equality
      Accuracy Percentage at Each Needle Count
    type: process
    size: xl
    position:
      x: 2840
      'y': 560
  - id: atc_metrics
    label: |-
      Paper-defined ATC Metrics
      Needle-weighted Accuracy
      ENL-50: Max N at ≥50%
      Fixed V2: Per-N Exact Scores Only
    type: process
    size: xl
    position:
      x: 3120
      'y': 560
  - id: report
    label: |-
      Report Long-context Capability
      Keep Sparse and ATC Results Separate
      Compare Languages and Context Lengths
      Analyze Continuous-reasoning Failures
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 300
  - id: source_boundary
    label: |-
      Paper and Code Boundary
      arXiv v3 SHA-256 ae3779…
      OpenCompass 34da831… · Apache-2.0
      V2 Code and Configs Public
      needlebench Payload Not in Git
    type: document
    size: xl
    position:
      x: 3400
      'y': 760
