meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NeedleBench V2 构建与评测流程
  description: 对齐论文与 OpenCompass 的双语合成信息稀疏检索和推理任务，以及信息密集的祖先追溯挑战，并采用不同计分协议。
  legend: NeedleBench V2 支持 4k 至 1,000k 上下文配置；ATC 按二次幂从 2 扩展到 512 条合成亲属关系针，并移除无关填充文本。
nodes:
  - id: goal
    label: |-
      定义长上下文评测
      检索与多步推理
      中文与英文
      改变信息密度
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: synthetic
    label: |-
      生成合成针信息
      虚构事实与亲属关系
      避免预训练知识重叠
      随机化姓名与模板
    type: process
    size: xl
    position:
      x: 260
      'y': 230
  - id: sparse_inputs
    label: |-
      构建信息稀疏输入
      英文使用 Paul Graham 随笔干草
      中文使用领域建模数据干草
      在受控深度插入针信息
    type: database
    size: xl
    position:
      x: 500
      'y': 60
  - id: atc_chain
    label: |-
      构建信息密集家族链
      采样 n+1 个唯一姓名
      父母权重一 · 祖父母权重二
      每句话均与答案相关
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: sparse_tasks
    label: |-
      实例化三项稀疏任务
      单针检索
      多针检索
      2–5 条合成针的多针推理
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: atc_shuffle
    label: |-
      表述并打乱亲属关系
      使用多样语言模板
      消除位置偏差
      由家族结构计算标准答案
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: sparse_configs
    label: |-
      扫描稀疏测试配置
      上下文 4k · 8k · 32k · 128k
      200k · 256k · 1,000k
      长度 · 深度 · 十次重复 · 截断缓冲
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: atc_questions
    label: |-
      创建四类 ATC 问题
      最年长与第 n 代祖先
      第 n 代后裔 · 关系距离
      从 2 扩展到 512 条针
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: sparse_score
    label: |-
      计算信息稀疏任务分数
      关键词感知精确匹配
      跨长度 · 深度 · 重复取平均
      三项任务等权平均
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: atc_score
    label: |-
      计算 ATC 推理分数
      对 boxed 内答案做精确匹配
      按针数量加权准确率
      报告 ENL-50 有效推理深度
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: report
    label: |-
      报告长上下文能力
      分开呈现稀疏与密集结果
      比较语言与上下文长度
      分析连续推理失败模式
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 230
edges:
  - from: goal
    to: synthetic
    type: primary
  - from: synthetic
    to: sparse_inputs
    type: primary
  - from: synthetic
    to: atc_chain
    type: primary
  - from: sparse_inputs
    to: sparse_tasks
    type: primary
  - from: atc_chain
    to: atc_shuffle
    type: primary
  - from: sparse_tasks
    to: sparse_configs
    type: primary
  - from: atc_shuffle
    to: atc_questions
    type: primary
  - from: sparse_configs
    to: sparse_score
    type: primary
  - from: atc_questions
    to: atc_score
    type: primary
  - from: sparse_score
    to: report
    type: primary
  - from: atc_score
    to: report
    type: primary
modules: []
