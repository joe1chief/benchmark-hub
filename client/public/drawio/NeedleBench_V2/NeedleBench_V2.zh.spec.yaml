meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NeedleBench V2 构建流程
  description: 对齐论文 v3 与固定 OpenCompass 源码的双语信息稀疏检索/推理任务和信息密集祖先追溯挑战构建与计分流程。
  legend: 实线表示构建与计分路径；虚线表示填充数据输入或发布边界。信息稀疏任务和 ATC 指标分别报告， 论文未定义跨两条分支的单一综合分数。
nodes:
  - id: scope
    label: |-
      定义双语长上下文评测
      合成检索与推理任务
      覆盖信息稀疏与信息密集场景
      自适应上下文长度
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: synthetic
    label: |-
      生成合成信息单元
      虚构事实与亲属关系
      随机姓名和模板
      避免真实世界及预训练知识
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: density_gate
    label: |-
      选择哪种
      信息密度场景？
    type: decision
    size: xl
    position:
      x: 600
      'y': 300
  - id: haystacks
    label: |-
      稀疏任务填充语料
      英文：Paul Graham 随笔
      中文：领域建模评测语料
      无关文本仅用于稀疏任务
    type: database
    size: xl
    position:
      x: 1160
      'y': 300
  - id: sparse_tasks
    label: |-
      实例化三类稀疏任务
      S-RT：单事实检索
      M-RT：多事实检索
      M-RS：2–5 条亲属事实推理
    type: document
    size: xl
    position:
      x: 880
      'y': 60
  - id: sparse_insert
    label: |-
      在受控深度插入针
      单个或多个关键信息单元
      分散多针输入
      保持目标上下文长度
    type: process
    size: xl
    position:
      x: 1160
      'y': 60
  - id: sparse_configs
    label: |-
      遍历官方 V2 配置
      4k · 8k · 32k · 128k
      200k · 256k · 1,000k
      GPT-4 分词器 · 长度缓冲 · R=10
    type: process
    size: xl
    position:
      x: 1440
      'y': 60
  - id: sparse_inference
    label: |-
      运行候选模型
      阅读完整填充文本与问题
      生成任务指定格式答案
      缓冲后仍保留完整指令
    type: process
    size: xl
    position:
      x: 1720
      'y': 60
  - id: sparse_parser_gate
    label: |-
      使用哪种稀疏任务
      输出合同？
    type: decision
    size: xl
    position:
      x: 2000
      'y': 60
  - id: retrieval_score
    label: |-
      计分 S-RT 与 M-RT
      关键词感知精确匹配
      出现任一核心关键词即满分
      否则为零
    type: process
    size: xl
    position:
      x: 2280
      'y': 0
  - id: reasoning_score
    label: |-
      M-RS：论文与固定代码
      论文：boxed + 关键词感知 EM
      固定：boxed 清洗 + 严格相等
      记录计分差异
    type: process
    size: xl
    position:
      x: 2280
      'y': 200
  - id: sparse_average
    label: |-
      汇总稀疏任务结果
      各任务平均长度 × 深度 × R
      三项任务等权平均
      S-RT · M-RT · M-RS
      取代早期加权均值
    type: process
    size: xl
    position:
      x: 2560
      'y': 100
  - id: atc_names
    label: |-
      抽取 n+1 个唯一姓名
      英文或中文姓名池
      组成顺序家庭链
      程序化生成标准答案
    type: database
    size: xl
    position:
      x: 880
      'y': 560
  - id: atc_relations
    label: |-
      生成 n 条亲属关系陈述
      随机关系词和语言模板
      代际权重为 1 或 2
      累计总代际距离
    type: process
    size: xl
    position:
      x: 1160
      'y': 560
  - id: atc_shuffle
    label: |-
      随机打乱亲属关系
      拼接成连续上下文
      消除位置偏差
      每句话都与答案相关
    type: process
    size: xl
    position:
      x: 1440
      'y': 560
  - id: atc_questions
    label: |-
      创建四类 ATC 问题
      最年长祖先 · 第 N 代祖先
      第 N 代后代 · 关系距离
      推导精确标准答案
    type: process
    size: xl
    position:
      x: 1720
      'y': 560
  - id: atc_scale
    label: |-
      按 2 的幂扩展 ATC
      2 · 4 · 8 · 16 · 32
      64 · 128 · 256 · 512 条针
      每种配置重复 R=10
    type: process
    size: xl
    position:
      x: 2000
      'y': 560
  - id: atc_inference
    label: |-
      在密集上下文上运行候选模型
      整合每一条亲属关系
      按所选问题类型作答
      最终答案放入 boxed 框
    type: process
    size: xl
    position:
      x: 2280
      'y': 560
  - id: atc_parser
    label: |-
      已发布 ATC 解析器
      仅提取 boxed 框内答案
      去除 LaTeX · 斜杠 · 引号 · 波浪号
      缺少 boxed 答案时返回 None
    type: process
    size: xl
    position:
      x: 2560
      'y': 560
  - id: atc_accuracy
    label: |-
      计算 ATC 精确匹配
      去除预测与答案首尾空白
      要求字符串完全相等
      按针数报告准确率百分比
    type: process
    size: xl
    position:
      x: 2840
      'y': 560
  - id: atc_metrics
    label: |-
      论文定义的 ATC 指标
      按针数加权准确率
      ENL-50：准确率 ≥50% 的最大 N
      固定 V2：仅逐针数精确分数
    type: process
    size: xl
    position:
      x: 3120
      'y': 560
  - id: report
    label: |-
      报告长上下文能力
      分别保留稀疏任务和 ATC 结果
      比较语言与上下文长度
      分析连续推理失败
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 300
  - id: source_boundary
    label: |-
      论文与代码边界
      arXiv v3 SHA-256 ae3779…
      OpenCompass 34da831… · Apache-2.0
      V2 代码与配置公开
      Git 中不含 needlebench 数据载荷
    type: document
    size: xl
    position:
      x: 3400
      'y': 760
edges:
  - from: scope
    to: synthetic
    type: primary
  - from: synthetic
    to: density_gate
    type: primary
  - from: density_gate
    to: sparse_tasks
    type: primary
    label: 信息稀疏
    labelPosition: center
  - from: density_gate
    to: atc_names
    type: primary
    label: 信息密集
    labelPosition: center
  - from: sparse_tasks
    to: sparse_insert
    type: primary
  - from: haystacks
    to: sparse_insert
    type: secondary
    style:
      dashed: true
    label: 仅作填充
    labelPosition: center
  - from: sparse_insert
    to: sparse_configs
    type: primary
  - from: sparse_configs
    to: sparse_inference
    type: primary
  - from: sparse_inference
    to: sparse_parser_gate
    type: primary
  - from: sparse_parser_gate
    to: retrieval_score
    type: primary
    label: S-RT 或 M-RT
    labelPosition: center
  - from: sparse_parser_gate
    to: reasoning_score
    type: primary
    label: M-RS 推理
    labelPosition: center
  - from: retrieval_score
    to: sparse_average
    type: primary
  - from: reasoning_score
    to: sparse_average
    type: primary
  - from: atc_names
    to: atc_relations
    type: primary
  - from: atc_relations
    to: atc_shuffle
    type: primary
  - from: atc_shuffle
    to: atc_questions
    type: primary
  - from: atc_questions
    to: atc_scale
    type: primary
  - from: atc_scale
    to: atc_inference
    type: primary
  - from: atc_inference
    to: atc_parser
    type: primary
  - from: atc_parser
    to: atc_accuracy
    type: primary
  - from: atc_accuracy
    to: atc_metrics
    type: primary
  - from: sparse_average
    to: report
    type: primary
    label: 稀疏分支
    labelPosition: center
    waypoints:
      - x: 2700
        'y': 100
      - x: 3500
        'y': 100
  - from: atc_metrics
    to: report
    type: primary
    label: 密集分支
    labelPosition: center
  - from: report
    to: source_boundary
    type: secondary
    style:
      dashed: true
    label: 来源边界
    labelPosition: center
modules: []
