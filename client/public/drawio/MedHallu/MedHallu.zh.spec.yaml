meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHallu 构建与评测流程
  description: 对齐论文展示从 10,000 条 PubMedQA 记录到受控幻觉生成、多模型质量筛选、蕴含校验、TextGrad 优化、 难度分层及二元检测评测的完整流程。
  legend: 来源恰为 1,000 条 pqa_labeled 与随机抽取的 9,000 条 pqa_artificial；失败候选最多经历五次生成尝试， 之后才进入语义相似度回退。
nodes:
  - id: source
    label: |-
      获取 PubMedQA 记录
      pqa_labeled：1,000 条专家样本
      pqa_artificial：随机 9,000 条
      输入共 10,000 个问答对
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: inputs
    label: |-
      组装生成输入
      医学问题
      相关知识上下文
      标准答案
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: categories
    label: |-
      定义四类医学幻觉
      误解问题
      信息不完整
      机制错配 · 方法或证据捏造
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: generate
    label: |-
      生成候选幻觉答案
      Qwen2.5-14B 自选幻觉类型
      温度 0.3 至 0.7 · top-p 0.95
      最长 512 词元 · 答案长度 ±10%
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality
    label: |-
      执行判别式质量检查
      比较候选答案与标准答案
      GPT-4o mini · Gemma2-9B
      Qwen2.5-7B 独立投票
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: correctness
    label: |-
      两层过滤是否均通过？
      质量：至少骗过一个模型
      正确性：不与标答语义等价
      双向 DeBERTa 阈值 0.75
    type: decision
    size: xl
    position:
      x: 1220
      'y': 40
  - id: difficulty
    label: |-
      通过或重试合格：划分难度
      按骗过的判别模型数计
      一个：简单 · 两个：中等
      三个：困难
    type: process
    size: xl
    position:
      x: 980
      'y': 280
  - id: refine
    label: |-
      未通过：优化候选
      使用 GPT-4o mini 驱动 TextGrad
      应用质量与正确性反馈
      提升可信度与自然度
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: retry
    label: |-
      仅重试未通过候选
      根据 TextGrad 反馈重新生成
      重复两层过滤
      首次通过即停 · 最多五次尝试
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: fallback
    label: |-
      五次尝试耗尽：执行回退
      保留全部失败尝试
      选择与标准答案余弦相似度最高者
      将所选样本标为简单
    type: process
    size: xl
    position:
      x: 980
      'y': 560
  - id: dataset
    label: |-
      发布 MedHallu
      10,000 个医学问答对
      正确答案与幻觉答案
      简单 · 中等 · 困难三档
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: settings
    label: |-
      运行两类检测设置
      无知识零样本
      提供标准知识的上下文设置
      比较通用与医学大模型
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: detect
    label: |-
      判断每个问题与答案
      幻觉或非幻觉
      分析可选的不确定类别
      按难度层级拆分结果
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告检测表现
      F1 与精确率
      总体及分难度成绩
      衡量知识与拒答带来的增益
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: inputs
    type: primary
  - from: inputs
    to: categories
    type: primary
  - from: categories
    to: generate
    type: primary
  - from: generate
    to: quality
    type: primary
  - from: quality
    to: correctness
    type: primary
  - from: correctness
    to: difficulty
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 1
      entryY: 0.25
  - from: correctness
    to: refine
    type: primary
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: refine
    to: retry
    type: primary
  - from: retry
    to: difficulty
    type: primary
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.75
  - from: retry
    to: fallback
    type: primary
    style:
      exitX: 0
      exitY: 0.75
      entryX: 1
      entryY: 0.25
  - from: fallback
    to: dataset
    type: primary
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.75
  - from: difficulty
    to: dataset
    type: primary
    style:
      exitX: 0
      exitY: 0.75
      entryX: 1
      entryY: 0.25
  - from: dataset
    to: settings
    type: primary
  - from: settings
    to: detect
    type: primary
  - from: detect
    to: report
    type: primary
modules: []
