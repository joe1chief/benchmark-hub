meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHallu Paper and Released-Code Process
  description: >-
    Paper-aligned construction and detection evaluation, with the fixed official code and dataset paths shown separately
    wherever they do not reproduce the paper protocol.
  legend: >-
    Solid arrows are reported or executable paths. Dashed arrows mark provenance, rights, implementation drift, or
    failure behavior. Paper contradictions and unreported details remain explicit.
nodes:
  - id: evidence
    label: |-
      Evidence and Version Pins
      arXiv:2502.14302v1
      Git 3c49c8b · HF 5150604
      Audited 2026-07-21
    type: document
    size: xl
    position:
      x: 20
      'y': 160
  - id: source_mix
    label: |-
      Paper Source Mix · 10,000
      pqa_labeled: 1,000 Expert Items
      pqa_artificial: 9,000 Random Items
      PubMedQA Question + Context + Gold
    type: database
    size: xl
    position:
      x: 300
      'y': 160
  - id: inputs
    label: |-
      Assemble Generation Record
      Question · Relevant Knowledge
      Ground-truth Answer
    type: document
    size: xl
    position:
      x: 580
      'y': 160
  - id: categories
    label: |-
      Define Four Hallucination Types
      Misinterpretation · Incompleteness
      Mechanism Misattribution
      Method or Evidence Fabrication
    type: document
    size: xl
    position:
      x: 860
      'y': 160
  - id: generate
    label: |-
      Paper Candidate Generation
      Qwen2.5-14B · T .3–.7
      top-p .95 · max 512
      Gold Length ±10%
      Tagged Answer + Justification
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1140
      'y': 160
  - id: quality
    label: |-
      Paper Quality Filter · Conflicts
      Shared: GPT-4o-mini
      Main: Gemma2-9B
      + Qwen2.5-7B
      Appendix E: Gemma2-2B
      + Llama3.2-3B
      Figure 2/S4 ≥1 · S3 Majority
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1420
      'y': 160
  - id: correctness
    label: |-
      Paper Correctness Conflict
      S3: RoBERTa
      Threshold Unreported
      S4: DeBERTa · Threshold .75
      Appendix C Adds Llama-3.1
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1700
      'y': 160
  - id: initial_gate
    label: |-
      Candidate Passes the Claimed
      Quality and Non-equivalence Gates?
    type: decision
    size: xl
    position:
      x: 1980
      'y': 160
  - id: difficulty
    label: |-
      Assign Paper Difficulty
      Models Fooled: 1 Easy · 2 Medium
      3 Hard
    type: process
    size: xl
    position:
      x: 2260
      'y': 40
  - id: textgrad
    label: |-
      Refine Failed Candidate
      GPT-4o-mini-backed TextGrad
      Feed Quality + Correctness Feedback
    type: process
    size: xl
    position:
      x: 2260
      'y': 300
  - id: retry_gate
    label: |-
      Refined Candidate Passes
      Both Claimed Filters?
    type: decision
    size: xl
    position:
      x: 2540
      'y': 300
  - id: attempt_gate
    label: |-
      Five Total Generation Attempts
      Exhausted?
    type: decision
    size: xl
    position:
      x: 2820
      'y': 300
  - id: fallback
    label: |-
      Paper Fallback after Five Tries
      Maximum Cosine Similarity
      to Gold Answer
      Assign Easy
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 3100
      'y': 300
  - id: release
    label: |-
      MedHallu Public Release
      10,000 English QA Pairs
      Correct + Hallucinated Answers
      Easy · Medium · Hard
    type: database
    size: xl
    position:
      x: 3100
      'y': 40
  - id: repo_build_drift
    label: |-
      Pinned Generator Drift
      First 9,000 Artificial · T .8
      2B + 3B · No Main-path NLI
      Parser Drops Category
      Row Errors Skipped
      5 Loops → Up to 10 Candidates
      No Seed
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 440
  - id: rights
    label: |-
      Publication Boundary
      UT Austin · UNC · Drexel
      Git/HF MIT · Site Rights Reserved
      Public Assets · Results Page
      No Submission Leaderboard
    type: document
    size: xl
    position:
      x: 3380
      'y': 160
  - id: eval_route
    label: |-
      Which Evaluation Contract
      Is Being Audited?
    type: decision
    size: xl
    position:
      x: 3100
      'y': 640
  - id: paper_settings
    label: |-
      Paper Detection Settings
      Zero-shot without Knowledge
      Context-aware:
      PubMedQA Knowledge
      Input-output; Not-sure Separate
      Pair Sampling Unreported
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 2820
      'y': 540
  - id: paper_prompt
    label: |-
      Paper Binary Judge Prompt
      Output 0: Factual · 1: Hallucinated
      Integer Only
      Parse-failure Handling Unreported
    type: document
    size: xl
    position:
      x: 2540
      'y': 540
  - id: paper_infer
    label: |-
      Paper Model Execution
      General + Medical LLMs
      OpenAI API or HF Pipeline · T≈.2–.3
      Seed and Model Revisions Unreported
    type: process
    size: xl
    position:
      x: 2260
      'y': 540
  - id: paper_metrics
    label: |-
      Paper Detection Report
      Overall F1 + Precision
      Easy / Medium / Hard F1
      10,000-sample Table
      Denominators Unreported
      Not-sure Reported Separately
    type: terminal
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 540
  - id: repo_schema
    label: |-
      Pinned Runner Input Gap
      HF Release: Title-case
      Runner: Lowercase
      Generator CSV Only
      No Release Adapter
      No Binary Runner
    type: loss
    size: xl
    style:
      fontSize: 9
    position:
      x: 2820
      'y': 900
  - id: repo_pair
    label: |-
      Pinned Runner Builds Evaluation Pair
      Unseeded Random Choice per Row
      Gold Answer or Hallucinated Answer
      Derive Ground-truth Class from Choice
    type: process
    size: xl
    position:
      x: 2540
      'y': 900
  - id: repo_infer
    label: |-
      Released Three-class vLLM
      0 Factual · 1 Hallucinated
      2 Not Sure
      T.3 · p.95 · max512 · TP4
      float16 · GPU Memory .85
      Revisions Unpinned
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2260
      'y': 900
  - id: repo_parser
    label: |-
      Released Parser Order
      1 / not / non → Class 1
      not sure / pass / skip / 2
      → Class 2
      Else → Class 0
      “not sure” Therefore → Class 1
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1980
      'y': 900
  - id: repo_class
    label: |-
      Parsed Class
      0 or 1, or 2?
    type: decision
    size: xl
    position:
      x: 1700
      'y': 900
  - id: repo_scored
    label: |-
      Score Classes 0 and 1
      Exclude Class 2 from Overall
      and Tier Denominators
    type: process
    size: xl
    position:
      x: 1420
      'y': 780
  - id: repo_abstain
    label: |-
      Count Parsed Class 2 Separately
      Report Abstention Percentage
    type: process
    size: xl
    position:
      x: 1420
      'y': 1020
  - id: repo_failure
    label: |-
      Evaluator Subprocess Failure
      Print Error · Emit No Result Row
    type: loss
    size: xl
    position:
      x: 1980
      'y': 1220
  - id: repo_report
    label: |-
      Pinned Runner Report
      Overall Precision · Recall · F1
      Tier Accuracy · Precision · Recall · F1
      Abstention Percentage
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 900
