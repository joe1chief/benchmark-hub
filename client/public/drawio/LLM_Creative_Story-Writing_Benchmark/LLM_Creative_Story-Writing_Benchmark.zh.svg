an></text><text y="37.4" data-line-font-size="11" x="0"><tspan>仅保留实际完成的输出</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>标记覆盖不全</tspan></text></g></g></g></g><g data-cell-id="7"><g><rect x="1440" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1540,23.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>调度同题直接比较</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>相同 prompt 与实际约束</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>稀疏且增量扩展的模型对图</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>缺失输出不补分</tspan></text></g></g></g></g><g data-cell-id="8"><g><ellipse cx="1540" cy="402" rx="100" ry="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(25, 118, 210);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1540,375.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>按两种可见顺序评判</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>使用多个评判模型</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>保留量表内与量表外证据</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>降低位置效应</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="1152" y="352" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="