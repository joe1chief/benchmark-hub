meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LLM Creative Story-Writing Benchmark Build Process
  description: >-
    Evidence-bounded process for constructing 400 constrained story briefs and producing the current sparse,
    version-bridged pairwise leaderboard.
  legend: >-
    Evidence boundary: the current public bundle is pinned to repository snapshot
    aaa0c11a8b4416fecbd6d215820d0792d4f03dbd. Historical official snapshot 6ac3820205c8b0a45b74634be5e4ebf97c84ce8a
    documents brief selection and parser/aggregation contracts; snapshot 0286ecfcac37fbb3e19be4465662264de1e3ea98
    documents dual-order averaging, side-bias correction, and 95% CIs. The current bundle publishes prompts, published
    story texts, charts, and README results, but not current v2/v3 judge prompts, parser/aggregation code, raw
    judgments, evaluator roster/bridge thresholds, or exact formula implementation.
nodes:
  - id: candidate_sets
    label: |-
      Construct Candidate Element Sets
      Ten Categories · Ten Sampled Options Each
      Deterministic Seed 42
      Historical Official Pipeline Docs
    type: process
    size: xl
    position:
      x: 24
      'y': 40
  - id: propose_rate
    label: |-
      LLMs Propose and Rate Sets
      Up to One Category May Be None
      Validate and Deduplicate · Rate 1–10
      Rank by Normalized Mean
    type: user
    size: xl
    position:
      x: 312
      'y': 40
  - id: publish_prompts
    label: |-
      Select and Publish 400 Fixed Briefs
      400 Unique Prompt Templates
      Ten Categories · 9–10 Active Constraints
      Norm Mean → Raw Mean → Seeded Tie-break
    type: document
    size: xl
    position:
      x: 600
      'y': 40
  - id: output_contract
    label: |-
      Apply the Story Output Contract
      600–800 English Words · Plain ASCII
      [story] Tags · Cumulative Sentence Counts
      Integrate Every Active Constraint
    type: document
    size: xl
    position:
      x: 888
      'y': 40
  - id: generate
    label: |-
      Generate Model Stories
      Attempt up to 400 Briefs per Model
      Retain Completed Outputs Only
      Mark Partial Coverage
    type: process
    size: xl
    position:
      x: 1176
      'y': 40
  - id: match
    label: |-
      Schedule Matched Direct Comparisons
      Same Prompt and Active Constraints
      Sparse, Incrementally Expanded Pair Graph
      No Imputation for Missing Outputs
    type: process
    size: xl
    position:
      x: 1464
      'y': 40
  - id: dual_order
    label: |-
      Judge Both Visible Story Orders
      Multiple Evaluator Models
      Rubric-aligned + Beyond-rubric Evidence
      Reduce Position Effects
    type: user
    size: xl
    position:
      x: 1464
      'y': 392
  - id: version_bridge
    label: |-
      Validate Evaluator-Version Bridges
      Shared Prompts + Bridge Matchups
      Combine Compatible v2/v3 Evidence Only
      Current Roster and Thresholds Not Public
    type: process
    size: xl
    position:
      x: 1176
      'y': 392
  - id: parser_contract
    label: |-
      Historical Parser Contract
      Winner · Margin · Signed Margin [-10, 10]
      Reject Unparseable Outputs · Keep Provenance
      Current v2/v3 Prompt and Parser Not Public
    type: document
    size: xl
    position:
      x: 888
      'y': 392
  - id: pair_aggregate
    label: |-
      Apply Documented Pair Aggregation
      Correct Evaluator Side-A Bias
      Average Opposite-order Judgments
      Aggregate by Story + Unordered Model Pair
    type: process
    size: xl
    position:
      x: 600
      'y': 392
  - id: global_rating
    label: |-
      Fit Global Relative Ratings
      Thurstone Least Squares on Signed Margins
      BT Retained as a Diagnostic
      Estimate Win Chance versus the Pool
    type: process
    size: xl
    position:
      x: 312
      'y': 392
  - id: bootstrap_publish
    label: |-
      Bootstrap and Publish
      Resample Stories + Evaluators
      Historical: 300 · Seed 12345 · 95% CI
      Current: Score · Win Chance · Uncertainty
    type: terminal
    size: xl
    position:
      x: 24
      'y': 392
