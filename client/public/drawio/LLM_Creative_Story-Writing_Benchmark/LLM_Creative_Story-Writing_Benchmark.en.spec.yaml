meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LLM Creative Story-Writing Benchmark Build Process
  description: >-
    Official-repository-aligned process for 400 constrained creative briefs, matched story comparisons in both visible
    orders, side-bias correction, global pairwise scoring, and bootstrap uncertainty.
  legend: >-
    This diagram follows repository snapshot 0286ecf. Earlier absolute 0–10 and 18-dimension ratings are archived; the
    current public ranking uses head-to-head comparisons and a Thurstone comparison graph.
nodes:
  - id: prompts
    label: |-
      Publish 400 Fixed Creative Briefs
      Ten Required Narrative Elements
      600–800 Words · Plain ASCII English
      Story Tags and Cumulative Word Counts
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: generate
    label: |-
      Generate One Story per Brief and Model
      Integrate Every Required Element Naturally
      Follow the Shared Format and Length Contract
      Retain Completed Stories Only
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: match
    label: |-
      Build Matched Story Pairs
      Same Creative Brief and Required Elements
      Compare Only Models with Completed Stories
      No Score Imputation for Refusals
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: dual_order
    label: |-
      Judge Both Visible Story Orders
      Multiple Independent Evaluator LLMs
      Rubric-aligned and Beyond-rubric Observations
      Reduce Left-versus-right Position Effects
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: parse
    label: |-
      Parse Pairwise Judgments
      Winner Labels and Signed Margins
      Keep Evaluator and Story Identity
      Reject Unparseable Evaluator Outputs
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: correct
    label: |-
      Correct Side-position Bias
      Estimate the Measured Side Effect
      Adjust Signed Comparison Margins
      Average Opposite-order Judgments per Story
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: aggregate
    label: |-
      Aggregate the Comparison Graph
      Combine Story-level Pair Margins
      Fit Global Thurstone Comparison Scores
      Derive Win Probability versus the Pool
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: bootstrap
    label: |-
      Estimate Uncertainty
      Resample Both Stories and Evaluators
      Compute 95% Confidence Intervals
      Preserve Partial-coverage Markers
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: report
    label: |-
      Publish the Creative-writing Leaderboard
      Comparison Score · Win Probability · 95% CI
      Evaluator-agreement Correlations
      Word-count Compliance as a Diagnostic
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 380
