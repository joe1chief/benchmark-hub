meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LLM 创意故事写作基准构建流程
  description: 在明确证据边界下构造 400 个约束故事简报，并形成当前采用版本桥接的稀疏成对比较排行榜。
  legend: >-
    证据边界：当前公开包固定到仓库快照 aaa0c11a8b4416fecbd6d215820d0792d4f03dbd。历史官方快照 6ac3820205c8b0a45b74634be5e4ebf97c84ce8a
    记录简报筛选及解析/聚合合同；快照 0286ecfcac37fbb3e19be4465662264de1e3ea98 记录双顺序平均、位置偏差修正与 95% CI。当前包公开 prompt、 部分故事文本、图表和 README
    结果，但不公开当前 v2/v3 评判 prompt、解析/聚合代码、原始判断、评判器名单、 桥接阈值或精确公式实现。
nodes:
  - id: candidate_sets
    label: |-
      构造候选元素组合
      十类元素 · 每类抽取十个候选
      固定随机种子 42
      历史官方流程文档
    type: process
    size: xl
    position:
      x: 24
      'y': 40
  - id: propose_rate
    label: |-
      LLM 提议并评分元素组合
      最多一类可为 None
      校验并去重 · 按 1–10 分评分
      按归一化均分排序
    type: user
    size: xl
    position:
      x: 312
      'y': 40
  - id: publish_prompts
    label: |-
      筛选并发布 400 个固定简报
      400 个唯一 prompt 模板
      十类元素 · 每题 9–10 个实际约束
      归一化均分 → 原始均分 → 固定种子破平局
    type: document
    size: xl
    position:
      x: 600
      'y': 40
  - id: output_contract
    label: |-
      应用故事输出合同
      600–800 个英文词 · 纯 ASCII
      [story] 标签 · 逐句累计词数
      自然整合所有实际约束
    type: document
    size: xl
    position:
      x: 888
      'y': 40
  - id: generate
    label: |-
      生成模型故事
      每个模型最多尝试 400 个简报
      仅保留实际完成的输出
      标记覆盖不全
    type: process
    size: xl
    position:
      x: 1176
      'y': 40
  - id: match
    label: |-
      调度同题直接比较
      相同 prompt 与实际约束
      稀疏且增量扩展的模型对图
      缺失输出不补分
    type: process
    size: xl
    position:
      x: 1464
      'y': 40
  - id: dual_order
    label: |-
      按两种可见顺序评判
      使用多个评判模型
      保留量表内与量表外证据
      降低位置效应
    type: user
    size: xl
    position:
      x: 1464
      'y': 392
  - id: version_bridge
    label: |-
      验证评判协议版本桥接
      共享题目 + 桥接对局
      仅合并兼容的 v2/v3 证据
      当前名单与阈值未公开
    type: process
    size: xl
    position:
      x: 1176
      'y': 392
  - id: parser_contract
    label: |-
      历史解析器合同
      胜者 · 差值 · [-10, 10] 带符号差值
      拒绝不可解析输出 · 保留溯源
      当前 v2/v3 prompt/parser 未公开
    type: document
    size: xl
    position:
      x: 888
      'y': 392
  - id: pair_aggregate
    label: |-
      应用已公开的成对汇总方法
      修正评判器 A 侧偏差
      平均相反显示顺序的判断
      按故事与无序模型对汇总
    type: process
    size: xl
    position:
      x: 600
      'y': 392
  - id: global_rating
    label: |-
      拟合全局相对排名
      对带符号差值做 Thurstone 风格最小二乘
      BT 仅保留为诊断
      估计相对模型池的获胜概率
    type: process
    size: xl
    position:
      x: 312
      'y': 392
  - id: bootstrap_publish
    label: |-
      Bootstrap 并发布
      重采样故事与评判器
      历史：300 次 · seed 12345 · 95% CI
      当前：比较分 · 胜率 · 不确定区间与诊断
    type: terminal
    size: xl
    position:
      x: 24
      'y': 392
edges:
  - from: candidate_sets
    to: propose_rate
    type: primary
  - from: propose_rate
    to: publish_prompts
    type: primary
  - from: publish_prompts
    to: output_contract
    type: primary
  - from: output_contract
    to: generate
    type: primary
  - from: generate
    to: match
    type: primary
  - from: match
    to: dual_order
    type: primary
  - from: dual_order
    to: version_bridge
    type: primary
  - from: version_bridge
    to: parser_contract
    type: primary
  - from: parser_contract
    to: pair_aggregate
    type: primary
  - from: pair_aggregate
    to: global_rating
    type: primary
  - from: global_rating
    to: bootstrap_publish
    type: primary
modules: []
