meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LLM 创意故事写作基准构建流程
  description: 对齐官方仓库的 400 个受约束创意简报、双显示顺序配对评判、位置偏差修正、 全局成对比较得分与自助法不确定性流程。
  legend: 本图依据官方仓库快照 0286ecf。早期 0–10 绝对评分与 18 维评分已归档； 当前公开排名使用正面对比和 Thurstone 比较图。
nodes:
  - id: prompts
    label: |-
      发布 400 个固定创意简报
      每题包含十个必需叙事元素
      600–800 词 · 纯 ASCII 英文
      故事标签与逐句累计词数
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: generate
    label: |-
      每个模型为每个简报生成一个故事
      自然融入全部必需元素
      遵守统一格式与长度合同
      仅保留实际完成的故事
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: match
    label: |-
      构造成对匹配故事
      使用相同创意简报与必需元素
      仅比较均已完成故事的模型
      不为拒答结果填充分数
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: dual_order
    label: |-
      评判两种可见故事顺序
      使用多个独立评判大模型
      分离量表内与量表外观察
      降低左右位置影响
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: parse
    label: |-
      解析成对评判
      提取胜者标签与带符号差值
      保留评判器与故事标识
      排除无法解析的评判输出
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: correct
    label: |-
      修正位置偏差
      估计实测左右侧影响
      调整带符号比较差值
      对同一故事的反向顺序评判取平均
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: aggregate
    label: |-
      汇总全局比较图
      合并故事级模型对差值
      拟合全局 Thurstone 比较得分
      推导相对模型池的获胜概率
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: bootstrap
    label: |-
      估计不确定性
      同时重采样故事与评判器
      计算 95% 置信区间
      保留覆盖不全模型标记
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: report
    label: |-
      发布创意写作排行榜
      比较得分 · 获胜概率 · 95% 区间
      评判器一致性相关系数
      词数合规仅作为诊断项
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 380
edges:
  - from: prompts
    to: generate
    type: primary
  - from: generate
    to: match
    type: primary
  - from: match
    to: dual_order
    type: primary
  - from: dual_order
    to: parse
    type: primary
  - from: parse
    to: correct
    type: primary
  - from: correct
    to: aggregate
    type: primary
  - from: aggregate
    to: bootstrap
    type: primary
  - from: bootstrap
    to: report
    type: primary
modules: []
