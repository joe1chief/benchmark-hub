meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Minimal-LinuxBench 构建与评测流程
  description: 对齐系统卡展示已披露的私有 LinuxBench 子集改编、随机评测样本、主要与选择性攻击协议、 轨迹监控、结果比例及明确的发布边界。
  legend: 实线表示已披露的主要设定；虚线表示选择性迁移实验或未披露边界。 选择性结果的三元组依次对应基线、选择性和高度选择性提示条件。
nodes:
  - id: goal
    label: |-
      定义规避监督问题
      高风险软件环境
      隐蔽完成副任务
      模拟真实部署场景
    type: document
    size: xl
    position:
      x: 20
      'y': 360
  - id: source
    label: |-
      接收私有 LinuxBench
      Redwood Research AI 控制场景
      主任务与副任务配对
      私下共享给 Anthropic
    type: database
    size: xl
    position:
      x: 260
      'y': 360
  - id: adapt
    label: |-
      改编 LinuxBench 子集
      1,948 个主任务/副任务对
      保留高风险软件情境
      子集改编不等于完整基准合同
    type: process
    size: xl
    position:
      x: 500
      'y': 360
  - id: construction_boundary
    label: |-
      明确保留构建未知项
      任务来源与配对规则未披露
      环境与验证协议未披露
      无公开解析器或评分器合同
    type: document
    size: xl
    position:
      x: 740
      'y': 880
  - id: sample
    label: |-
      随机抽取 200 个任务对
      少量样本在评测前失败
      有效分母略低于 200
      报告时保留该说明
    type: database
    size: xl
    position:
      x: 740
      'y': 360
  - id: protocol_gate
    label: |-
      运行哪种攻击协议？
      主要 · 每条轨迹均尝试
      选择性 · 有把握时才尝试
    type: decision
    size: xl
    position:
      x: 980
      'y': 360
  - id: main_prompt
    label: |-
      配置主要攻击
      三种攻击系统提示
      每条轨迹均尝试副任务
      明示完整轨迹会被监控
    type: document
    size: xl
    position:
      x: 1260
      'y': 80
  - id: selective_prompt
    label: |-
      配置选择性攻击迁移
      使用表现最佳的 Mythos 检查点
      人工编写并迭代优化提示
      在 SHADE-Arena 而非 Minimal-Linux 上优化
    type: document
    size: xl
    position:
      x: 1260
      'y': 640
  - id: rollout
    label: |-
      运行智能体轨迹
      应用已配置的攻击协议
      仅主要设定 · 不启用扩展思考
      仅主要设定 · 比较早期检查点与纯有用模型
    type: process
    size: xl
    position:
      x: 1540
      'y': 360
  - id: transcript
    label: |-
      准备用于监控的交互轨迹
      仅主要设定 · 完整轨迹且包含助手轮次
      其他轨迹内容未说明
      序列化与工具模式未披露
    type: database
    size: xl
    position:
      x: 1780
      'y': 360
  - id: monitor
    label: |-
      应用轨迹监控器
      仅主要设定 · 比较无 CoT 与含 CoT 监控器
      早期 · 无 CoT；当前 · 含 CoT
      监控器实现未发布
    type: process
    size: xl
    position:
      x: 2020
      'y': 360
  - id: score
    label: |-
      计算三项结果比例
      副任务完成
      被监控器标记
      隐蔽成功 = 完成且未被发现
    type: process
    size: xl
    position:
      x: 2260
      'y': 360
  - id: main_results
    label: |-
      报告主要设定
      样本中有 69 个副任务完成
      Mythos 隐蔽率 · 无 CoT 11.4% · 含 CoT 2.7%
      95% Wilson 置信区间
    type: terminal
    size: xl
    position:
      x: 2500
      'y': 80
  - id: selective_results
    label: |-
      报告选择性迁移
      完成 · 42.8 / 18.8 / 20.8%
      告警 · 77.2 / 39.8 / 39.9%
      隐蔽 · 4.8 / 1.1 / 1.2%
    type: terminal
    size: xl
    position:
      x: 2500
      'y': 640
  - id: release_boundary
    label: |-
      保留发布边界
      非公开内部评测
      未发布代码、数据、版本或许可
      无提交流程或排行榜
    type: document
    size: xl
    position:
      x: 1780
      'y': 880
  - id: report
    label: |-
      发布系统卡证据
      图 4.4.3.2.A 与 4.4.3.3.A
      Wilson 95% 区间 · 误差条较大
      良性误报约 2% · 拒答影响可忽略
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 360
edges:
