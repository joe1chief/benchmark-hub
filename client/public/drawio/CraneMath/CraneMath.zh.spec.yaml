meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CraneMath 训练语料构建与验证流程
  description: 按 Olmo 3 对齐的流程：以许可更宽松的模型复现 SwallowMath、发布 CraneMath，并通过中期训练 microanneal 验证，而不是把它当成独立 benchmark。
  legend: 橙色表示语料与 benchmark 的身份边界；下方节点仅表示数据消融。
nodes:
  - id: source
    label: |-
      FineMath4+ 自然产生的
      高质量数学网页文本
      对比池含 9.61B tokens
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: recipe
    label: |-
      复现 SwallowMath 重写配方
      使用其公开提示
      避免 Llama 许可证限制
    type: document
    size: xl
    position:
      x: 320
      'y': 190
  - id: rewrite
    label: |-
      用 Qwen3-32B 重写 FineMath4+
      独立生成许可更宽松的复现数据
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: corpus
    label: |-
      CraneMath 源数据池
      5.62B 英文合成数学 tokens
      发布 6.55M 文档
    type: database
    size: xl
    position:
      x: 880
      'y': 190
  - id: identity
    label: CraneMath 是独立评测集吗？
    type: decision
    size: xl
    position:
      x: 1160
      'y': 190
  - id: boundary
    label: |-
      没有测试划分、逐题准确率、推理提示
      或 CraneMath 专属评分协议
      它是中期训练数据
    type: document
    size: xl
    position:
      x: 1440
      'y': 40
  - id: mix
    label: |-
      Olmo 3 第二阶段 Dolmino 混合
      CraneMath 占 100B-token 混合的 5.63%
      发布混合列出 7.24M 文档
    type: process
    size: xl
    position:
      x: 1440
      'y': 310
  - id: anneal
    label: |-
      数据质量 Microanneal
      从已见 6T 预训练 tokens 的基础模型出发
      50% 网页数据与 50% 候选源混合
    type: process
    size: xl
    position:
      x: 1720
      'y': 310
  - id: compare
    label: |-
      对比退火前基线、FineMath4+、
      SwallowMath、CraneMath、双份 CraneMath
      以及 CraneMath 加原始文档
    type: process
    size: xl
    position:
      x: 2000
      'y': 310
  - id: metrics
    label: |-
      测量 MATH、GSM8K 与 MMLU 变化
      主分析中 CraneMath 原始提升为
      MATH 18.5、GSM8K 27.4 分
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 310
  - id: conclusion
    label: |-
      验证训练数据效用
      不报告 CraneMath 准确率
      也不在该语料上排列模型
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 310
edges:
  - from: source
    to: recipe
    type: primary
  - from: recipe
    to: rewrite
    type: primary
  - from: rewrite
    to: corpus
    type: primary
  - from: corpus
    to: identity
    type: primary
  - from: identity
    to: boundary
    type: primary
  - from: identity
    to: mix
    type: primary
  - from: mix
    to: anneal
    type: primary
  - from: anneal
    to: compare
    type: primary
  - from: compare
    to: metrics
    type: primary
  - from: metrics
    to: conclusion
    type: primary
modules: []
