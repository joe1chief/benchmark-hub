meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Wiki-to-RCQA Data Build and Validation
  description: >-
    Wiki-to-RCQA is an OLMo 3 midtraining data source, not a standalone benchmark. The official recipe cleans prepared
    Wikipedia, excludes list and disambiguation pages and invalid short pages, extracts summaries and sections, keeps
    sections under 300 words intact, splits longer sections into paragraphs, and drops passages below 20 words. For each
    passage it samples one of four prompts with probabilities DEFAULT 0.10, SPAN 0.25, PPHRASE 0.25, and DROP 0.40,
    chooses one to eight questions as a function of passage length, and asks Qwen2.5-32B-Instruct to synthesize QA
    pairs. The pool has 4.22B tokens and 22.3M documents. A 10B-token microanneal incorporating the 4.2B-token source
    improves the GenQA cluster by nearly two points against a 10B web-only baseline, concentrated on DROP, SQuAD, and
    CoQA; 3.0B tokens, 3 percent of the 100B final midtraining mix, are selected. No independent Accuracy or F1 protocol
    is reported.
  legend: >-
    Source: OLMo 3 arXiv:2512.13961v2, Sections 3.5.1-3.5.2 and Table 5; official recipe README, prompt templates, and
    wikiclean script under https://github.com/allenai/dolma3/tree/main/datasets/dolma3_dolmino_mix/wiki_to_rcqa;
    official data-pool card https://huggingface.co/datasets/allenai/dolma3_dolmino_pool. Scope pin: Wiki-to-RCQA is a
    synthetic midtraining dataset validated by microannealing, not an independent evaluation benchmark.. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
