meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Wiki-to-RCQA 数据构建与验证流程
  description: >-
    Wiki-to-RCQA是OLMo
    3的中训练数据源，不是独立评测基准。官方recipe清洗已准备的Wikipedia，排除列表页、消歧页及无效短页面，抽取摘要与章节；少于300词的章节整体保留，较长章节按段落切分，少于20词的段落淘汰。每个段落按DEFAULT
    0.10、SPAN 0.25、PPHRASE 0.25、DROP
    0.40的概率抽取一种提示，并根据段落长度选择1至8个问题，再由Qwen2.5-32B-Instruct合成问答。数据池含42.2亿token和2230万文档。把该42亿token数据源纳入100亿token微退火后，相对100亿纯网页基线在GenQA任务簇提升近2分，主要集中在DROP、SQuAD和CoQA；最终选择30亿token，占100B中训练混合的3%。官方没有独立Accuracy或F1协议。
  legend: >-
    来源：OLMo 3 arXiv:2512.13961v2, Sections 3.5.1-3.5.2 and Table 5; official recipe README, prompt templates, and
    wikiclean script under https://github.com/allenai/dolma3/tree/main/datasets/dolma3_dolmino_mix/wiki_to_rcqa;
    official data-pool card https://huggingface.co/datasets/allenai/dolma3_dolmino_pool. Scope pin: Wiki-to-RCQA is a
    synthetic midtraining dataset validated by microannealing, not an independent evaluation
    benchmark.。实线箭头表示论文或官方资料明确支持的主流程。
