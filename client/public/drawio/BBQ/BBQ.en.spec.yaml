meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BBQ Build Process
  description: >-
    Paper-aligned BBQ workflow: authors hand-write sourced bias templates across nine categories, expand each into
    ambiguous/disambiguated and negative/non-negative conditions with balanced label order and UNKNOWN choices, validate
    every template at a four-of-five threshold, and report accuracy plus context-specific bias scores.
  legend: >-
    Every template is checked with one question from each of four conditions and five raters per question; all four must
    reach at least 4/5. Dashed arrows repeat all four checks after revision.
nodes:
  - id: bias_sources
    label: |-
      Attested Harmful Bias Sources
      Research / News / Wikipedia
      First-hand Accounts
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: templates
    label: |-
      Author Templates
      Nine Bias Categories
      Two Intersectional Categories
      ≥25 per Category
    type: user
    size: xl
    position:
      x: 320
      'y': 220
  - id: conditions
    label: |-
      Four-condition Cluster
      Ambiguous / Disambiguated Context
      Negative / Non-negative Question
    type: document
    size: xl
    position:
      x: 600
      'y': 220
  - id: expansion
    label: |-
      Slot + Order Expansion
      Target / Non-target Labels Balanced
      Two People per Instance
      1 of 10 UNKNOWN Phrases
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: validation
    label: |-
      Validate All Four Conditions
      One Question per Condition
      5 Raters per Question
    type: user
    size: xl
    position:
      x: 1160
      'y': 220
  - id: agreement
    label: |-
      All Four ≥4/5?
      Pass / Revise
    type: decision
    size: xl
    position:
      x: 1440
      'y': 220
  - id: revise
    label: |-
      Revise Failed Template
      Regenerate All Four Conditions
      Resample and Rerate Four Questions
    type: process
    size: xl
    position:
      x: 1440
      'y': 20
  - id: dataset
    label: |-
      Release BBQ
      58,492 Unique Three-Choice Questions
      Balanced Four-Condition Expansions
    type: database
    size: xl
    position:
      x: 1720
      'y': 220
  - id: model
    label: |-
      QA Model
      Choose Person or UNKNOWN
      Exact-match to Answer Option
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: ambiguous
    label: |-
      Ambiguous Context
      Insufficient Evidence
      Correct Answer = UNKNOWN
    type: process
    size: xl
    position:
      x: 1440
      'y': 420
  - id: disambiguated
    label: |-
      Disambiguated Context
      Evidence Identifies One Person
      Bias-aligned or Bias-conflicting Gold
    type: process
    size: xl
    position:
      x: 1440
      'y': 620
  - id: responses
    label: |-
      Response Groups
      Bias-target / Non-target / UNKNOWN
      Split by Question Valence
    type: document
    size: xl
    position:
      x: 1160
      'y': 520
  - id: accuracy
    label: |-
      Accuracy
      Per Category + Context
      Disambiguated: Aligned vs Conflicting
    type: terminal
    size: xl
    position:
      x: 880
      'y': 420
  - id: bias_score
    label: |-
      Bias Scores
      sDIS = 2 × Biased / Non-UNKNOWN − 1
      sAMB = (1 − Accuracy) × sDIS
    type: terminal
    size: xl
    position:
      x: 880
      'y': 620
  - id: report
    label: |-
      Report BBQ Evaluation
      Accuracy by Context and Category
      sDIS and sAMB Bias Scores
    type: terminal
    size: xl
    position:
      x: 600
      'y': 520
edges:
  - from: bias_sources
    to: templates
    type: primary
  - from: templates
    to: conditions
    type: primary
  - from: conditions
    to: expansion
    type: primary
  - from: expansion
    to: validation
    type: primary
  - from: validation
    to: agreement
    type: primary
  - from: agreement
    to: dataset
    type: primary
    label: pass
  - from: agreement
    to: revise
    type: optional
    label: fail
  - from: revise
    to: conditions
    type: optional
    waypoints:
      - x: 1440
        'y': 100
      - x: 600
        'y': 100
  - from: dataset
    to: model
    type: primary
  - from: model
    to: ambiguous
    type: primary
  - from: model
    to: disambiguated
    type: primary
  - from: ambiguous
    to: responses
    type: primary
  - from: disambiguated
    to: responses
    type: primary
  - from: responses
    to: accuracy
    type: primary
  - from: responses
    to: bias_score
    type: primary
  - from: accuracy
    to: report
    type: primary
  - from: bias_score
    to: report
    type: primary
modules: []
