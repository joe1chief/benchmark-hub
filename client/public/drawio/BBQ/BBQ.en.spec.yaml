meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BBQ Build Process
  description: >-
    Paper-aligned BBQ workflow: authors hand-write sourced bias templates across nine categories, expand each into
    ambiguous/disambiguated and negative/non-negative conditions with balanced label order and UNKNOWN choices, validate
    every template at a four-of-five threshold, and report accuracy plus context-specific bias scores.
  legend: Solid arrows show template construction, four-condition expansion, validation, and two-context evaluation.
nodes:
  - id: bias_sources
    label: |-
      Attested Harmful Bias Sources
      Research / News / Wikipedia
      First-hand Accounts
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: templates
    label: |-
      Author-written Templates
      Nine Bias Categories
      + Two Intersectional Categories
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: conditions
    label: |-
      Four-condition Cluster
      Ambiguous / Disambiguated Context
      Negative / Non-negative Question
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: expansion
    label: |-
      Slot + Order Expansion
      Target / Non-target Labels Balanced
      Two People + UNKNOWN Choice
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: dataset
    label: |-
      BBQ Candidate Set
      58,492 Unique Examples
      25+ Templates per Category
    type: database
    size: xl
    position:
      x: 1160
      'y': 240
  - id: validation
    label: |-
      Template Validation
      Sample One Item per Condition
      Five Raters; Require ≥4/5
      Otherwise Edit + Revalidate All Four
    type: user
    size: xl
    position:
      x: 1440
      'y': 240
  - id: model
    label: |-
      QA Model
      Choose Person or UNKNOWN
      Exact-match to Answer Option
    type: process
    size: xl
    position:
      x: 1740
      'y': 240
  - id: ambiguous
    label: |-
      Ambiguous Context
      Insufficient Evidence
      Correct Answer = UNKNOWN
    type: process
    size: xl
    position:
      x: 2020
      'y': 60
  - id: disambiguated
    label: |-
      Disambiguated Context
      Evidence Identifies One Person
      Bias-aligned or Bias-conflicting Gold
    type: process
    size: xl
    position:
      x: 2020
      'y': 420
  - id: responses
    label: |-
      Response Groups
      Bias-target / Non-target / UNKNOWN
      Split by Question Valence
    type: document
    size: xl
    position:
      x: 2300
      'y': 240
  - id: accuracy
    label: |-
      Accuracy
      Per Category + Context
      Disambiguated: Aligned vs Conflicting
    type: terminal
    size: xl
    position:
      x: 2580
      'y': 60
  - id: bias_score
    label: |-
      Bias Scores
      sDIS = 2 × Biased / Non-UNKNOWN − 1
      sAMB = (1 − Accuracy) × sDIS
    type: terminal
    size: xl
    position:
      x: 2580
      'y': 420
edges:
  - from: bias_sources
    to: templates
    type: primary
  - from: templates
    to: conditions
    type: primary
  - from: conditions
    to: expansion
    type: primary
  - from: expansion
    to: dataset
    type: primary
  - from: dataset
    to: validation
    type: primary
  - from: validation
    to: model
    type: primary
  - from: model
    to: ambiguous
    type: primary
  - from: model
    to: disambiguated
    type: primary
  - from: ambiguous
    to: responses
    type: primary
  - from: disambiguated
    to: responses
    type: primary
  - from: responses
    to: accuracy
    type: primary
  - from: responses
    to: bias_score
    type: primary
modules: []
