meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DiscoX Build Process
  description: >-
    DiscoX uses a 133-person team (115 domain experts and 18 linguistic specialists) and 1,330 person-hours. Authentic
    professional texts must exceed 1,500 Chinese characters or English words and receive verifiable grammar,
    terminology, topic-term, and culture rubrics, averaging 9.38 per task. The 665 candidates undergo linguistic peer
    review; both SOTA filters must fail at least eight rubrics. Domain experts refine and balance the final 200 tasks:
    100 in each direction, 121 academic and 79 non-academic across seven fields. Metric-S gives non-translation outputs
    zero, then judges accuracy, fluency, and appropriateness separately, hierarchically deduplicates root errors, and
    applies 60/20/20 maxima with 2/5/10/50 severity deductions.
  legend: >-
    Source: DiscoX Sections 2.1-2.2 and 3.1-3.4, Figures 3-4; official ByteDance-Seed/DiscoX repository and dataset.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
