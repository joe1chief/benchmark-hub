meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Disco-X Build Process
  description: Paper- and release-aligned expert curation, protocol variants, and exact Metric-S scoring.
  legend: >-
    Solid arrows show the canonical construction and valid-translation path; the dotted branch is the
    instruction-failure zero gate.
nodes:
  - id: evidence_boundary
    label: |-
      Evidence boundary
      arXiv 2511.10984v2 · OpenReview
      OTCfZ6h8Pe · repo fab17983
      HF dataset f6d3d51d
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: source_team
    label: |-
      Authentic texts + curation team
      115 domain experts + 18 linguists
      1,330 person-hours
      ≥1,500 ZH characters or EN words
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotate
    label: |-
      Expert rubric annotation
      grammar · topic terms · terminology
      culture-loaded words
      average 9.38 verifiable rubrics
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: pool
    label: |-
      Candidate pool
      665 discourse-translation tasks
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: review_gate
    label: |-
      Linguistic peer review
      professionalism + rubric clarity
      both SOTA models must fail
      at least 8 predefined rubrics
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: select
    label: |-
      Domain-expert selection and repair
      use model errors to refine tasks
      balance direction, field, and scenario
      retain about 30% of candidates
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: benchmark
    label: |-
      Disco-X release · 200 tasks
      100 EN→ZH + 100 ZH→EN
      121 academic + 79 non-academic
      7 fields · mean 1,712.17 tokens
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: protocol
    label: Released protocol variant?
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: main_setting
    label: |-
      Main paper setting
      simple translation prompt
      Gemini-2.5-Pro Metric-S judge
    type: document
    size: xl
    position:
      x: 2120
      'y': 90
  - id: detailed_setting
    label: |-
      Dec 2025 release variant
      detailed prompt + Gemini-3-Pro
      scores are not the same setting
      do not compare directly
    type: document
    size: xl
    position:
      x: 2120
      'y': 410
  - id: translate
    label: |-
      Candidate translation
      preserve discourse coherence
      expert terminology and intent
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: instruction
    label: |-
      Valid translation output?
      reject non-translation
      continuation or summary as zero
    type: decision
    size: xl
    position:
      x: 2640
      'y': 250
  - id: instruction_zero
    label: |-
      Instruction-following failure
      Disco-X score = zero
      stop quality estimation
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 610
  - id: route
    label: |-
      Metric-S quality estimation
      run three judges in parallel
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: accuracy
    label: |-
      Accuracy judge
      omission · mistranslation
      untranslated · over-translation
      expert rubrics are accuracy checks
    type: process
    size: xl
    position:
      x: 3160
      'y': 10
  - id: fluency
    label: |-
      Fluency judge
      phrasing · grammar · coherence
      terminology consistency
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: appropriateness
    label: |-
      Appropriateness judge
      style · tone · literary merit
      cultural adaptation
    type: process
    size: xl
    position:
      x: 3160
      'y': 490
  - id: dedup
    label: |-
      Hierarchical root-cause dedup
      1. extremely critical Accuracy first
      2. expert checkpoint / rubric next
      3. remaining overlaps → causal root
    type: process
    size: xl
    position:
      x: 3420
      'y': 250
  - id: score
    label: |-
      Score = Acc + Flu + App
      Acc = max(0, 60 − deductions)
      −5 rubric/ordinary-major · −10 critical
      −50 extreme; Flu = max(0, 20 −2/issue)
      App = max(0, 20 −5/issue)
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 250
  - id: validation
    label: |-
      Metric validation analysis
      50 cases · expert consistency 70.3%
      3 trials are stability analysis
    type: terminal
    size: xl
    position:
      x: 3940
      'y': 250
