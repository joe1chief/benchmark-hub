    Paper-aligned professional-text curation, expert rubric filtering, bilingual task selection, and Metric-S
    multi-agent evaluation.
  legend: >-
    Solid arrows trace the 665-to-200 selection funnel and the three Metric-S quality branches before deduplication and
    severity scoring.
