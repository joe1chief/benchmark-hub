meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DiscoX 构建流程
  description: 对齐论文的专业文本策展、专家评分点过滤、双语任务选择与 Metric-S 多智能体评测流程。
  legend: 实线箭头展示从 665 到 200 的筛选漏斗，以及去重和严重度计分前的三条 Metric-S 质量分支。
nodes:
  - id: team
    label: |-
      133 人策展团队
      115 位领域专家 + 18 位语言专家
      共投入 1,330 人时
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: source
    label: |-
      真实专业文本
      学术 + 非学术场景
      中文至少 1,500 字或英文至少 1,500 词
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotate
    label: |-
      领域专家标注
      语法 · 主题词 · 术语 · 文化负载词
      平均 9.38 条可验证评分点
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: pool
    label: |-
      初始候选池
      665 个长文翻译任务
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: peer
    label: |-
      语言专家同行评审
      检查文本专业性与评分点清晰度
    type: decision
    size: xl
    position:
      x: 1080
      'y': 250
  - id: difficulty
    label: |-
      两个先进模型难度门
      两个模型均须至少失败 8 条预设评分点
    type: decision
    size: xl
    position:
      x: 1340
      'y': 250
  - id: select
    label: |-
      领域专家选择与精修
      平衡领域 · 修正文稿和评分点
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: benchmark
    label: |-
      DiscoX
      200 题 · 英译中 100 + 中译英 100
      学术 121 + 非学术 79 · 7 个领域
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: translate
    label: |-
      候选系统翻译
      保持篇章连贯与专业术语准确
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: instruction
    label: |-
      指令遵循预检
      非翻译 / 续写 / 摘要输出直接记零
    type: decision
    size: xl
    position:
      x: 2380
      'y': 250
  - id: route
    label: Metric-S 质量评估
    type: decision
    size: xl
    position:
      x: 2640
      'y': 250
  - id: accuracy
    label: |-
      准确性裁判
      遗漏 · 未翻译 · 误译
      过度翻译 · 专家评分点
    type: process
    size: xl
    position:
      x: 2900
      'y': 10
  - id: fluency
    label: |-
      流畅性裁判
      措辞 · 语法 · 连贯性
      术语一致性
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: appropriateness
    label: |-
      得体性裁判
      风格 · 语气 · 文学性
      文化适配
    type: process
    size: xl
    position:
      x: 2900
      'y': 490
  - id: dedup
    label: |-
      分层错误去重
      将每个表象错误归因到唯一根因
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: score
    label: |-
      总分 = 准确性 + 流畅性 + 得体性
      满分分别为 60 / 20 / 20
      严重度扣分 2 / 5 / 10 / 50
    type: terminal
    size: xl
    position:
      x: 3420
      'y': 250
edges:
  - from: team
    to: source
    type: primary
  - from: source
    to: annotate
    type: primary
  - from: annotate
    to: pool
    type: primary
  - from: pool
    to: peer
    type: primary
  - from: peer
    to: difficulty
    type: primary
  - from: difficulty
    to: select
    type: primary
  - from: select
    to: benchmark
    type: primary
  - from: benchmark
    to: translate
    type: primary
  - from: translate
    to: instruction
    type: primary
  - from: instruction
    to: route
    type: primary
  - from: route
    to: accuracy
    type: primary
  - from: route
    to: fluency
    type: primary
  - from: route
    to: appropriateness
    type: primary
  - from: accuracy
    to: dedup
    type: primary
  - from: fluency
    to: dedup
    type: primary
  - from: appropriateness
    to: dedup
    type: primary
  - from: dedup
    to: score
    type: primary
modules: []
