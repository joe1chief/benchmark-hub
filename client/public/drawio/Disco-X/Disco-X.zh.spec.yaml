meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Disco-X 构建流程
  description: 对齐论文与发布版本的专家策展、协议分支和 Metric-S 精确评分流程。
  legend: 实线表示标准构建与有效翻译路径；虚线分支表示指令失败直接归零。
nodes:
  - id: evidence_boundary
    label: |-
      证据边界
      arXiv 2511.10984v2
      OpenReview OTCfZ6h8Pe
      仓库 fab17983
      HF 数据 f6d3d51d
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: source_team
    label: |-
      真实文本与策展团队
      115 位领域专家 + 18 位语言专家
      1,330 人时
      至少 1,500 汉字或英文词
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotate
    label: |-
      专家评分点标注
      语法 · 主题词 · 术语
      文化负载词
      平均 9.38 个可验证评分点
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: pool
    label: |-
      候选池
      665 个语篇翻译任务
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: review_gate
    label: |-
      语言专家同行评审
      检查专业性与评分点清晰度
      两个 SOTA 模型都须失败
      至少 8 个预定义评分点
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: select
    label: |-
      领域专家筛选与修订
      依据模型错误修复任务
      平衡方向、领域和场景
      保留约 30% 候选
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: benchmark
    label: |-
      Disco-X 发布集 · 200 题
      英译中 100 + 中译英 100
      学术 121 + 非学术 79
      7 领域 · 平均 1,712.17 Token
    type: database
    size: xl
    position:
      x: 1600
      'y': 250
  - id: protocol
    label: 发布协议版本？
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: main_setting
    label: |-
      论文主设置
      简单翻译提示
      Gemini-2.5-Pro Metric-S 裁判
    type: document
    size: xl
    position:
      x: 2120
      'y': 90
  - id: detailed_setting
    label: |-
      2025 年 12 月发布分支
      详细提示 + Gemini-3-Pro
      分数不可视作同一设置
      不应直接比较
    type: document
    size: xl
    position:
      x: 2120
      'y': 410
  - id: translate
    label: |-
      候选翻译
      保持语篇连贯
      保持专家术语与原意
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: instruction
    label: |-
      是有效翻译输出？
      非翻译、续写或摘要
      均直接记零分
    type: decision
    size: xl
    position:
      x: 2640
      'y': 250
  - id: instruction_zero
    label: |-
      指令遵循失败
      Disco-X 得分为零
      停止质量评估
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 610
  - id: route
    label: |-
      Metric-S 质量评估
      三类裁判并行运行
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: accuracy
    label: |-
      准确性裁判
      遗漏 · 误译
      未翻译 · 过度翻译
      专家评分点归准确性
    type: process
    size: xl
    position:
      x: 3160
      'y': 10
  - id: fluency
    label: |-
      流畅性裁判
      表达 · 语法 · 连贯性
      术语一致性
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: appropriateness
    label: |-
      适切性裁判
      风格 · 语气 · 文学质量
      文化适配
    type: process
    size: xl
    position:
      x: 3160
      'y': 490
  - id: dedup
    label: |-
      分层根因去重
      1. 极严重准确性错误最高优先
      2. 专家 checkpoint / 评分点次之
      3. 其余重叠归因到因果根因
    type: process
    size: xl
    position:
      x: 3420
      'y': 250
  - id: score
    label: |-
      得分 = Acc + Flu + App
      Acc = max(0, 60 − 扣分)
      评分点/普通严重 −5 · 严重 −10
      极严重 −50；Flu=max(0,20−2/项)
      App=max(0,20−5/项)
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 250
  - id: validation
    label: |-
      指标验证分析
      50 个案例 · 专家一致性 70.3%
      3 次试验仅用于稳定性分析
    type: terminal
    size: xl
    position:
      x: 3940
      'y': 250
edges:
  - from: evidence_boundary
    to: source_team
    type: primary
  - from: source_team
    to: annotate
    type: primary
  - from: annotate
    to: pool
    type: primary
  - from: pool
    to: review_gate
    type: primary
  - from: review_gate
    to: select
    type: primary
  - from: select
    to: benchmark
    type: primary
  - from: benchmark
    to: protocol
    type: primary
  - from: protocol
    to: main_setting
    type: primary
    label: 论文主设置
    labelPosition: center
  - from: protocol
    to: detailed_setting
    type: primary
    label: 详细发布分支
    labelPosition: center
  - from: main_setting
    to: translate
    type: primary
  - from: detailed_setting
    to: translate
    type: primary
  - from: translate
    to: instruction
    type: primary
  - from: instruction
    to: route
    type: primary
    label: 有效翻译
    labelPosition: center
  - from: instruction
    to: instruction_zero
    type: optional
    label: 无效 · 归零
    labelPosition: center
  - from: route
    to: accuracy
    type: primary
  - from: route
    to: fluency
    type: primary
  - from: route
    to: appropriateness
    type: primary
  - from: accuracy
    to: dedup
    type: primary
  - from: fluency
    to: dedup
    type: primary
  - from: appropriateness
    to: dedup
    type: primary
  - from: dedup
    to: score
    type: primary
  - from: score
    to: validation
    type: optional
modules: []
