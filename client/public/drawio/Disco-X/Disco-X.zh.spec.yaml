meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DiscoX 构建流程
  description: >-
    DiscoX 由 133 人团队构建，包括 115 位领域专家和 18 位语言专家，共投入 1,330 人时。真实专业文本须超过 1,500 中文字符或英文词，并标注可验证的语法、术语、主题词和文化评分点，平均每题 9.38
    条。665 个候选先经语言同行评审，且两个先进模型都必须至少失败八条评分点；领域专家再精修和平衡为 200 题，双向各 100 题，其中学术 121、非学术 79，覆盖七领域。Metric-S
    将非翻译输出直接记零，再分别评估准确性、流畅性、得体性，分层去重根因错误，并采用 60/20/20 满分与 2/5/10/50 严重度扣分。
  legend: >-
    来源：DiscoX Sections 2.1-2.2 and 3.1-3.4, Figures 3-4; official ByteDance-Seed/DiscoX repository and
    dataset。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
  - id: team
    label: |-
      133 人策展团队
      115 位领域专家 + 18 位语言专家
      共投入 1,330 人时
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: source
    label: |-
      真实专业文本
      学术 + 非学术场景
      中文至少 1,500 字或英文至少 1,500 词
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotate
    label: |-
      领域专家标注
      语法 · 主题词 · 术语 · 文化负载词
      平均 9.38 条可验证评分点
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: pool
    label: |-
      初始候选池
      665 个长文翻译任务
    type: database
    size: xl
    position:
      x: 820
      'y': 250
  - id: peer
    label: |-
      语言专家同行评审
      检查文本专业性与评分点清晰度
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: difficulty
    label: |-
      两个先进模型难度门
      两个模型均须至少失败 8 条预设评分点
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: select
    label: |-
      领域专家选择与精修
      平衡领域 · 修正文稿和评分点
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: benchmark
    label: |-
      DiscoX
      200 题 · 英译中 100 + 中译英 100
      学术 121 + 非学术 79 · 7 个领域
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: translate
    label: |-
      候选系统翻译
      保持篇章连贯与专业术语准确
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: instruction
    label: |-
      输出是否遵循翻译指令？
      必须生成翻译
      非翻译 / 续写 / 摘要 = 0
    type: decision
    size: xl
    position:
      x: 2380
      'y': 250
  - id: route
    label: |-
      Metric-S 质量评估
      同时运行准确性、流畅性与得体性评审
    type: process
    size: xl
    position:
      x: 2640
      'y': 250
  - id: accuracy
    label: |-
      准确性裁判
      遗漏 · 未翻译 · 误译
      过度翻译 · 专家评分点
    type: process
    size: xl
    position:
      x: 2900
      'y': 10
  - id: fluency
    label: |-
      流畅性裁判
      措辞 · 语法 · 连贯性
      术语一致性
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: appropriateness
    label: |-
      得体性裁判
      风格 · 语气 · 文学性
      文化适配
    type: process
    size: xl
    position:
      x: 2900
      'y': 490
  - id: dedup
    label: |-
      分层错误去重
      将每个表象错误归因到唯一根因
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: score
    label: |-
      总分 = 准确性 + 流畅性 + 得体性
      满分分别为 60 / 20 / 20
      严重度扣分 2 / 5 / 10 / 50
    type: terminal
    size: xl
    position:
      x: 3420
      'y': 250
  - id: instruction_zero
    label: |-
      指令遵循失败
      非翻译 / 续写 / 摘要
      Disco-X 得分 = 0
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 570
edges:
  - from: team
    to: source
    type: primary
  - from: source
    to: annotate
    type: primary
  - from: annotate
    to: pool
    type: primary
  - from: pool
    to: peer
    type: primary
  - from: peer
    to: difficulty
    type: primary
  - from: difficulty
    to: select
    type: primary
  - from: select
    to: benchmark
    type: primary
  - from: benchmark
    to: translate
    type: primary
  - from: translate
    to: instruction
    type: primary
  - from: instruction
    to: route
    type: primary
    label: 翻译输出
    labelPosition: center
  - from: route
    to: accuracy
    type: primary
  - from: route
    to: fluency
    type: primary
  - from: route
    to: appropriateness
    type: primary
  - from: accuracy
    to: dedup
    type: primary
  - from: fluency
    to: dedup
    type: primary
  - from: appropriateness
    to: dedup
    type: primary
  - from: dedup
    to: score
    type: primary
  - from: instruction
    to: instruction_zero
    type: optional
    label: 无效输出 · 记零
    labelPosition: center
modules: []
