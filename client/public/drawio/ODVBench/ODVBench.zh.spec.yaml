meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ODV-Bench 构建与评测流程
  description: 对齐论文，从 1,190 段第一视角自动驾驶视频构建 6,322 个多选问题，经过半自动视频筛选、元标注复核、十二项在线任务设计，并以时间戳因果约束下的准确率评测。
  legend: ODV-Bench 指在线自动驾驶视频理解。评测时模型只能处理每个提问时间戳及其之前到达的帧，未来帧不得作为上下文。
nodes:
  - id: collect
    label: |-
      汇集六个驾驶数据集
      第一视角自动驾驶视频
      从日常驾驶到事故事件
      覆盖多个国家与场景
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: select
    label: |-
      选择任务相关视频
      过滤已有数据标注
      加入 YOLO 目标检测
      再由人工检查补充
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: meta
    label: |-
      生成元标注
      高质量原标注直接转换
      其余用 VLLM 加 YOLO 粗标
      覆盖空间 · 时间 · 语义
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: human
    label: |-
      结构化人工核验
      人工检查粗标结果
      修正时空细节
      保留精确任务证据
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: categories
    label: |-
      定义三类驾驶场景
      静态：247 段 · 1,639 问
      动态：162 段 · 2,973 问
      事件：781 段 · 1,710 问
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: static
    label: |-
      定义六项静态目标任务
      实时感知 · 历史记忆
      驾驶决策 · 关键信息抽取
      幻觉检测 · 交通变化检测
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: future
    label: |-
      定义六项动态与事件任务
      动作 · 位置 · 距离预测
      风险预测 · 风险分析
      事故原因问答
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: templates
    label: |-
      用模板生成问题
      为十二项任务设计专属模板
      填入精确元标注
      绑定问题与查询时间戳
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: choices
    label: |-
      生成多选题选项
      使用任务专属选项池
      加入合理但误导的干扰项
      每题保留二至四个选项
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: quality
    label: |-
      执行多轮人工复审
      检查问题清晰度与准确性
      检查干扰项合理性
      修正无效问答对
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: sample
    label: |-
      平衡场景与任务类型
      按视频长度比例抽样
      尽量扩大场景覆盖
      保留在线查询时序
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      发布 ODV-Bench
      1,190 段独立视频 · 5–90 秒
      6,322 个问答对
      平均查询时间 18.9 秒
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: evaluate
    label: |-
      以在线视频模式评测
      按每秒一帧处理流式视频
      只使用查询时刻之前内容
      回答每个多选问题
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      分层报告准确率
      十二项任务准确率
      静态 · 动态 · 事件类平均值
      按问题数加权的总体准确率
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: select
    type: primary
  - from: select
    to: meta
    type: primary
  - from: meta
    to: human
    type: primary
  - from: human
    to: categories
    type: primary
  - from: categories
    to: static
    type: primary
  - from: static
    to: future
    type: primary
  - from: future
    to: templates
    type: primary
  - from: templates
    to: choices
    type: primary
  - from: choices
    to: quality
    type: primary
  - from: quality
    to: sample
    type: primary
  - from: sample
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
