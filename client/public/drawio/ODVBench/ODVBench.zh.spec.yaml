meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ODV-Bench 论文 v1 构建、评测与发布边界
  description: 对齐论文 v1 的六源数据集四阶段构建、标注分支与人工关卡、按查询时间因果评测，并以固定发布边界保留 6,322 与 6,348 条目的差异。
  legend: 实线表示论文披露的构建或评测流程；虚线表示固定的论文/发布证据，不是额外处理步骤。论文 v1 报告 6,322 题，固定官方发布为 6,348 题。
nodes:
  - id: scope
    label: |-
      固定 ODV-Bench 范围
      arXiv 2509.24871v1 · 图 3 · 第 4 节
      OnlineIT 训练流程不在构建范围
      论文未披露排除或去重
      OnlineIT-drive 用于 FT-drive
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: source_sets
    label: |-
      汇集六个驾驶来源
      ROAD-Waymo · MM-AU
      WayveScenes101 · BDD100K
      BiRViT-1K · D²-City
      从日常驾驶覆盖到事故
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: video_select
    label: |-
      选择任务相关视频
      过滤已有数据标注
      加入 YOLO 目标检测
      再由人工检查补充
    type: process
    size: xl
    position:
      x: 500
      'y': 250
  - id: annotation_gate
    label: |-
      来源标注是否
      足够且适用？
    type: decision
    size: xl
    position:
      x: 740
      'y': 250
  - id: direct_convert
    label: |-
      转换现有标签
      使用标注充分的数据源
      映射为任务专属字段
      保留时空证据
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: coarse_generate
    label: |-
      生成粗粒度元标注
      使用 VLLM 加 YOLO
      补充空间 · 时间 · 语义
      形成可人工编辑的建议
    type: process
    size: xl
    position:
      x: 980
      'y': 460
  - id: human_verify
    label: |-
      执行结构化人工核验
      检查粗标建议
      修正时空细节
      确认任务相关证据
    type: process
    size: xl
    position:
      x: 1220
      'y': 460
  - id: verified_meta
    label: |-
      确定细粒度标注
      合并直接转换与人工核验路径
      要求空间细节准确
      要求时间与语义细节准确
    type: database
    size: xl
    position:
      x: 1460
      'y': 250
  - id: taxonomy
    label: |-
      划分论文中的三类场景
      静态：247 段 · 1,639 题
      动态：162 段 · 2,973 题
      事件：781 段 · 1,710 题
    type: document
    size: xl
    position:
      x: 1700
      'y': 250
  - id: tasks
    label: |-
      定义全部十二项在线任务
      静态：RTP · PTM · DDM
      静态：KIE · HD · TCD
      动态：AP · LP · DP
      事件：RP · RA · ARA
    type: process
    size: xl
    position:
      x: 1940
      'y': 250
  - id: templates
    label: |-
      生成问题
      人工编写任务模板
      填入已核验标注
      绑定查询时间戳
    type: document
    size: xl
    position:
      x: 2180
      'y': 250
  - id: options
    label: |-
      构造候选选项
      使用任务选项池加 LLM
      加入合理干扰项
      保留二至四个选项
    type: process
    size: xl
    position:
      x: 2420
      'y': 250
  - id: option_handling
    label: |-
      执行选项处理
      保持选项长度相近
      打乱选项顺序
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
  - id: qa_review
    label: |-
      执行多轮人工复审
      核验清晰度与答案准确性
      检查干扰项合理性
      修正无效问答对
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: sample
    label: |-
      平衡基准样本
      按视频长度分配问题
      尽量扩大场景多样性
      平衡场景与任务类型
    type: process
    size: xl
    position:
      x: 3140
      'y': 250
  - id: paper_release
    label: |-
      固定论文 v1 基准
      1,190 段视频 · 5–90 秒
      6,322 题 · 平均查询 18.9 秒
      静态 1,639 · 动态 2,973
      事件 1,710
    type: database
    size: xl
    position:
      x: 3380
      'y': 250
  - id: released_data
    label: |-
      固定当前官方数据发布
      HF 5dcf37c… 与 Annodata ca769c2…
      1,190 段视频 · 6,348 行
      动态 2,999：比论文 v1 多 26 行
    type: database
    size: xl
    position:
      x: 3380
      'y': 500
  - id: stream_contract
    label: |-
      强制 ODV 因果访问
      在查询时间戳截断输入
      不提供未来内容
      基准通用合同
    type: process
    size: xl
    position:
      x: 3620
      'y': 250
  - id: decode
    label: |-
      应用论文与代码设置
      StreamForest：1 FPS
      离线基线：固定帧数
      选项字母 · 16 token · 温度 0
      top-p 1 · 单 beam · 不采样
    type: document
    size: xl
    position:
      x: 3860
      'y': 250
  - id: code_score
    label: |-
      应用发布版选项解析器
      提取首个 A–E
      匹配候选索引
      输出任务 / 子任务准确率
      空输出不计入仓库分母
    type: process
    size: xl
    position:
      x: 4100
      'y': 250
  - id: paper_report
    label: |-
      报告论文指标
      十二项任务准确率
      静态 / 动态 / 事件类均值
      按题计算总体准确率
    type: terminal
    size: xl
    position:
      x: 4340
      'y': 250
  - id: source_boundary
    label: |-
      论文 / 代码 / 访问边界
      PDF 4ffbc524… · 代码 f9d1467…
      数据 5dcf37c… · 标注 ca769c2…
      Apache-2.0 · MIT 卡片
      视频权利 / 映射在外部
    type: document
    size: xl
    position:
      x: 4340
      'y': 500
    style:
      fontSize: 9
edges:
  - from: scope
    to: source_sets
    type: primary
  - from: source_sets
    to: video_select
    type: primary
  - from: video_select
    to: annotation_gate
    type: primary
  - from: annotation_gate
    to: direct_convert
    type: primary
    label: 充分
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
  - from: annotation_gate
    to: coarse_generate
    type: primary
    label: 不足
    labelPosition: center
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
  - from: direct_convert
    to: verified_meta
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
  - from: coarse_generate
    to: human_verify
    type: primary
  - from: human_verify
    to: verified_meta
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
  - from: verified_meta
    to: taxonomy
    type: primary
  - from: taxonomy
    to: tasks
    type: primary
  - from: tasks
    to: templates
    type: primary
  - from: templates
    to: options
    type: primary
  - from: options
    to: option_handling
    type: primary
  - from: option_handling
    to: qa_review
    type: primary
  - from: qa_review
    to: sample
    type: primary
  - from: sample
    to: paper_release
    type: primary
  - from: paper_release
    to: stream_contract
    type: primary
  - from: stream_contract
    to: decode
    type: primary
  - from: decode
    to: code_score
    type: primary
  - from: code_score
    to: paper_report
    type: primary
  - from: paper_release
    to: released_data
    type: secondary
    label: 固定发布
    labelPosition: center
    style:
      dashed: true
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
  - from: paper_report
    to: source_boundary
    type: secondary
    label: 来源边界
    labelPosition: center
    style:
      dashed: true
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      exitDx: 0
      exitDy: 0
      entryDx: 0
      entryDy: 0
modules: []
