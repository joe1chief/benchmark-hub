      Offline Baselines: Fixed Frames
      Option Letter · 16 Tokens · Temp 0
      Top-p 1 · One Beam · No Sampling
    type: document
    size: xl
    position:
      x: 3860
      'y': 250
  - id: code_score
    label: |-
      Apply Released Option Parser
      Extract First A–E
      Match Candidate Index
      Print Task / Subtask Accuracy
      Omit Empty Outputs from Denominator
    type: process
    size: xl
    position:
      x: 4100
      'y': 250
  - id: paper_report
    label: |-
      Report Paper Metrics
      Twelve Task Accuracies
      Static / Dynamic / Event Means
      Overall Accuracy by Question
    type: terminal
    size: xl
    position:
      x: 4340
      'y': 250
  - id: source_boundary
    label: |-
      Paper / Code / Access Boundary
      PDF 4ffbc524… · Code f9d1467…
      Data 5dcf37c… · Anno ca769c2…
      Apache-2.0 · MIT Cards
      Video Rights / Mapping External
    type: document
    size: xl
    position:
      x: 4340
      'y': 500
    style:
      fontSize: 9
