meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ODV-Bench Build and Evaluation Process
  description: >-
    Paper-aligned construction of 6,322 multiple-choice questions from 1,190 first-person autonomous-driving clips,
    using semi-automatic video selection, verified meta-annotations, twelve online tasks, and timestamp-causal accuracy.
  legend: >-
    ODV-Bench means online autonomous-driving video understanding. During evaluation, a model may only process frames
    available at or before each query timestamp; future frames are not valid context.
nodes:
  - id: collect
    label: |-
      Curate Six Driving Datasets
      First-person Autonomous-driving Video
      Routine Conditions to Accidents
      Multiple Countries and Scenarios
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: select
    label: |-
      Select Task-relevant Videos
      Filter Existing Annotations
      Add YOLO-based Detection
      Complete with Manual Inspection
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: meta
    label: |-
      Generate Meta-annotations
      Convert Strong Existing Labels Directly
      Otherwise Use VLLM plus YOLO
      Capture Space · Time · Semantics
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: human
    label: |-
      Verify Structured Annotations
      Humans Check Coarse Proposals
      Correct Spatiotemporal Details
      Retain Precise Task Evidence
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: categories
    label: |-
      Define Three Scenario Categories
      Static: 247 Clips · 1,639 QA
      Dynamic: 162 Clips · 2,973 QA
      Events: 781 Clips · 1,710 QA
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: static
    label: |-
      Specify Six Static-target Tasks
      Real-time Perception · Past Memory
      Decision-making · Key Extraction
      Hallucination · Change Detection
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: future
    label: |-
      Specify Six Dynamic/Event Tasks
      Action · Location · Distance Prediction
      Risk Prediction · Risk Analysis
      Accident Reason Answering
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: templates
    label: |-
      Generate Questions from Templates
      Tailor Templates to All 12 Tasks
      Fill Precise Meta-annotations
      Bind Questions to Query Times
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: choices
    label: |-
      Create Multiple-choice Options
      Draw from Task-specific Option Pools
      Add Plausible Misleading Distractors
      Keep Two to Four Choices
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: quality
    label: |-
      Run Multiple Manual Review Rounds
      Verify Question Clarity and Accuracy
      Check Distractor Plausibility
      Correct Invalid QA Pairs
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: sample
    label: |-
      Balance Scenarios and Task Types
      Sample Proportionally to Video Length
      Maximize Scenario Coverage
      Preserve Online Query Timing
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      Release ODV-Bench
      1,190 Unique Clips · 5–90 Seconds
      6,322 QA Pairs
      Mean Query Time 18.9 Seconds
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: evaluate
    label: |-
      Evaluate in Online Video Mode
      Process Streaming Frames at 1 FPS
      Use Only Content before Query Time
      Answer Each Multiple-choice Question
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Accuracy by Hierarchy
      Twelve Task Accuracies
      Static · Dynamic · Event Averages
      Question-weighted Overall Accuracy
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: select
    type: primary
  - from: select
    to: meta
    type: primary
  - from: meta
    to: human
    type: primary
  - from: human
    to: categories
    type: primary
  - from: categories
    to: static
    type: primary
  - from: static
    to: future
    type: primary
  - from: future
    to: templates
    type: primary
  - from: templates
    to: choices
    type: primary
  - from: choices
    to: quality
    type: primary
  - from: quality
    to: sample
    type: primary
  - from: sample
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
