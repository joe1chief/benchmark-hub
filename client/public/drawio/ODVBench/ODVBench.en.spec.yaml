meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ODV-Bench Paper-v1 Construction, Evaluation, and Release Boundary
  description: >-
    Paper-v1-aligned four-stage construction from six driving datasets, explicit annotation branches and human gates,
    query-time causal evaluation, and a pinned-release boundary that preserves the 6,322-versus-6,348 item discrepancy.
  legend: >-
    Solid arrows are paper-disclosed construction or evaluation flow. Dashed arrows are pinned publication/release
    evidence, not additional processing. Paper v1 reports 6,322 questions; the pinned official release has 6,348.
