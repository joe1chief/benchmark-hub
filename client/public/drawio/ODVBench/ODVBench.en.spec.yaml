      1,190 Clips · 5–90 Seconds
      6,322 MCQ · Mean Query 18.9 s
      Static 1,639 · Dynamic 2,973
      Event 1,710
    type: database
    size: xl
    position:
      x: 3380
      'y': 250
  - id: released_data
    label: |-
