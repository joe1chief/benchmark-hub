      BIG-Bench Evaluation Pool
      209 Evaluation Tasks
      Uneven Data and Metadata Coverage
    type: database
    size: xl
    position:
      x: 40
      'y': 140
  - id: structure_filter
    label: |-
      Structural Eligibility
      Remove >3 Subtasks: 209 → 187
      Remove <103 Examples: 187 → 130
    type: process
    size: xl
    position:
      x: 320
      'y': 140
  - id: baseline_filter
    label: |-
      Comparable Evaluation Tasks
      Require Human Baseline: 130 → 85
      Keep MC / Exact Match: 85 → 78
    type: process
    size: xl
    position:
      x: 600
      'y': 140
  - id: hardness_filter
    label: |-
      Hardness + Scope Review
      Remove Model > Human: 78 → 36
      Drop 13 Extreme / Out-of-Scope: 36 → 23
    type: process
    size: xl
    position:
      x: 880
      'y': 140
  - id: dataset
    label: |-
      Package BIG-Bench Hard
      23 Tasks • 27 Subtasks
      6,511 Evaluation Examples
    type: database
    size: xl
    position:
      x: 1160
      'y': 140
  - id: examples
    label: |-
      Task Example Counts
      Usually 250 per Task
      Exceptions: 187 • 146 • 178
    type: document
    size: xl
    position:
      x: 1440
      'y': 140
  - id: human_cot
    label: |-
      Human CoT Exemplars
      Three per Task
      Reasoning + Final-Answer Format
    type: user
    size: xl
    position:
      x: 1720
      'y': 140
  - id: answer_only
    label: |-
      Few-Shot Answer-Only Prompt
      Same BBH Task Examples
      Produce the Final Answer Directly
    type: process
    size: xl
    position:
      x: 1560
      'y': 440
  - id: cot_prompt
    label: |-
      Few-Shot Chain-of-Thought Prompt
      Use Three Human CoT Exemplars
      Reason before the Final Answer
    type: process
    size: xl
    position:
      x: 1880
      'y': 440
  - id: decode
    label: |-
      PaLM • InstructGPT • Codex
      Greedy • Temperature = 0
      Same Evaluation Examples
    type: process
    size: xl
    position:
      x: 1720
      'y': 700
  - id: extract
    label: |-
      Deterministic Extraction
      Read Text after “the answer is”
      Normalize per Task
    type: process
    size: xl
    position:
      x: 1440
      'y': 700
  - id: score
    label: |-
      BBH Scoring
      Exact Match + Task Accuracy
      Unweighted Mean over 23 Tasks
    type: process
    size: xl
    position:
      x: 1160
      'y': 700
  - id: report
    label: |-
      Compare Answer-Only versus CoT
      Against Average Human
      Analyze Model-Scale Effects
    type: terminal
    size: xl
    position:
      x: 880
      'y': 700
