meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIG-Bench Hard Build Process
  description: >-
    True BBH task selection, dataset packaging, human CoT exemplar authoring, parallel answer-only and CoT prompting,
    deterministic extraction, and exact-match aggregation from arXiv:2210.09261v1.
  legend: The upper row constructs BBH; the two lower branches compare answer-only and chain-of-thought prompting.
nodes:
