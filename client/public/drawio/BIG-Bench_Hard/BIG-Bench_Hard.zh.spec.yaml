meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIG-Bench Extra Hard 构建流程
  description: 对齐论文的 BBEH 流程：从 23 项 BBH 饱和审计，经半对抗难度校准、确定性答案抽取， 到完整集与 Mini 集的分层聚合。
  legend: 实线表示构建与评测；虚线循环表示持续加难，直到两个参考模型准确率都低于 70%。
nodes:
  - id: bbh_audit
    label: |-
      审计BBH
      饱和与捷径
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: skill_map
    label: |-
      保持覆盖
      23个推理领域
    type: process
    size: xl
    position:
      x: 280
      'y': 240
  - id: harder_tasks
    label: |-
      逐项替换
      更难同域任务
    type: process
    size: xl
    position:
      x: 520
      'y': 240
  - id: candidates
    label: |-
      构造候选
      长上下文与多跳
    type: process
    size: xl
    position:
      x: 760
      'y': 240
  - id: ref_models
    label: |-
      参考模型
      Flash与Thinking
    type: process
    size: xl
    position:
      x: 1000
      'y': 80
  - id: difficulty_gate
    label: |-
      两个模型
      都低于70%？
    type: decision
    size: xl
    position:
      x: 1000
      'y': 240
  - id: harden
    label: |-
      增加难度
      或替换任务
    type: process
    size: xl
    position:
      x: 760
      'y': 440
  - id: full_set
    label: |-
      完整BBEH
      23项任务
      每项200；DQA 120
    type: database
    size: xl
    position:
      x: 1240
      'y': 240
  - id: mini
    label: |-
      BBEH Mini
      每项20，共460
    type: database
    size: xl
    position:
      x: 1480
      'y': 60
  - id: prompt
    label: |-
      逐步推理后缀
      固定终答前缀
    type: document
    size: xl
    position:
      x: 1480
      'y': 240
  - id: extract
    label: |-
      抽取并清洗
      确定性匹配
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: task_accuracy
    label: |-
      分任务
      准确率
    type: process
    size: xl
    position:
      x: 1960
      'y': 240
  - id: harmonic
    label: |-
      完整BBEH
      调整调和平均
    type: document
    size: xl
    position:
      x: 2200
      'y': 100
  - id: micro
    label: |-
      BBEH Mini
      微平均
    type: document
    size: xl
    position:
      x: 2200
      'y': 380
  - id: report
    label: |-
      模型报告
      通用推理能力
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 240
edges:
  - from: bbh_audit
    to: skill_map
    type: primary
  - from: skill_map
    to: harder_tasks
    type: primary
  - from: harder_tasks
    to: candidates
    type: primary
  - from: candidates
    to: difficulty_gate
    type: primary
  - from: ref_models
    to: difficulty_gate
    type: primary
  - from: difficulty_gate
    to: harden
    type: optional
  - from: harden
    to: candidates
    type: optional
  - from: difficulty_gate
    to: full_set
    type: primary
  - from: full_set
    to: mini
    type: primary
  - from: full_set
    to: prompt
    type: primary
  - from: mini
    to: prompt
    type: primary
  - from: prompt
    to: extract
    type: primary
  - from: extract
    to: task_accuracy
    type: primary
  - from: task_accuracy
    to: harmonic
    type: primary
  - from: task_accuracy
    to: micro
    type: primary
  - from: harmonic
    to: report
    type: primary
  - from: micro
    to: report
    type: primary
modules: []
