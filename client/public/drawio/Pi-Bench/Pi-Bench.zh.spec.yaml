meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: π-Bench 论文对齐构建与评测流程
  description: 依据论文 v3 重绘构建、意图终态交互与 PROC/COMP 评测；提示词、发布、许可和论文后聚合漂移均以虚线边界展示。
  legend: 实线复现论文合同；虚线标注固定来源与发布实现边界，不代表新增论文步骤。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv 2605.14678v3 · f435e09ef007
      Git 383910b16987 · 说明 aeb39fc6eb78
      HF 116ae739261d · 任务 95807131f24d
      发布 100 条任务记录
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: personas
    label: |-
      构建五类稳定 Persona
      研究员 · 营销人员 · 药剂师
      法律实习生 · 金融从业者
      定义例程偏好与长期目标
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: episodes
    label: |-
      创建长程 Episode
      每个 Persona 对应一个 Episode
      每个 Episode 含 20 个会话
      每个会话对应一个多轮任务
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: environment
    label: |-
      构建持久环境
      工作区跨会话共享
      187 个独立工具
      21 个可复用技能
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: workflow_tasks
    label: |-
      派生工作流任务
      来自真实工作例程与材料
      要求产生具体交付物
      人工复核真实性与可行性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: dependencies
    label: |-
      设计跨会话依赖
      每个 Episode 含六个强依赖组
      每组由两至三个任务构成
      另含五个大体独立任务
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: starts
    label: |-
      编写自然的欠规格开端
      用户发出的初始请求
      或环境触发信号
      信息足以启动但仍保留缺口
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: hidden_intents
    label: |-
      标注 524 个可恢复意图
      表达潜在约束与偏好
      可在会话内或跨会话持续
      可从证据推断询问并执行
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: checklists
    label: |-
      定义可核验 Checklist
      510 个 Rubric 项 · 168 个规则项
      表达具体细粒度义务
      保证条件必要且充分
    type: database
    size: xl
    position:
      x: 1700
      'y': 320
  - id: graders
    label: |-
      实现两类评分器
      模型 Rubric 判断开放内容
      确定性核验文件字符串与工具
      验证 Schema 与客观条件
    type: process
    size: xl
    position:
      x: 1460
      'y': 320
  - id: reference_review
    label: |-
      执行并复核每个任务
      专家产出参考解答
      核验文件工具技能与评分器
      确保流程正确且边界清晰
    type: process
    size: xl
    position:
      x: 1220
      'y': 320
  - id: release
    label: |-
      定稿 π-Bench
      100 个任务 · 五类 Persona
      100 个多轮会话
      持久跨会话工作流
    type: database
    size: xl
    position:
      x: 980
      'y': 320
  - id: user_config
    label: |-
      配置评测参与者
      统一 Nanobot 派生脚手架
      GPT-5.4 模拟用户和 Rubric Judge
      温度为零 · 默认解码 · 开启思考
    type: process
    size: xl
    position:
      x: 740
      'y': 320
  - id: repeat3
    label: |-
      运行三条独立轨迹
      每个任务重复三次
      保留会话历史与产物
      报告均值与标准差
    type: process
    size: xl
    position:
      x: 500
      'y': 320
  - id: session_start
    label: |-
      启动一个基准会话
      加载 Persona 记忆和工作区
      发送初始请求或触发信号
      隐藏已标注意图
    type: document
    size: xl
    position:
      x: 260
      'y': 320
  - id: agent_act
    label: |-
      被测 Agent 响应
      推理澄清并调用工具
      创建或修改产物
      更新持久工作区
    type: process
    size: xl
    position:
      x: 20
      'y': 320
  - id: observe
    label: |-
      模拟用户观察进展
      检查回复与工具调用
      检查工作区更新与产物
      更新意图跟踪状态
    type: process
    size: xl
    position:
      x: 20
      'y': 700
  - id: status_gate
    label: |-
      分配唯一意图终态
      当前意图如何解决？
      检查本轮全部证据
    type: decision
    size: xl
    position:
      x: 260
      'y': 700
  - id: completed
    label: |-
      已完成意图
      行动或产物满足意图
      用户未显式披露
      Agent 直接完成
    type: process
    size: xl
    position:
      x: 500
      'y': 520
  - id: inferred
    label: |-
      已推断意图
      Agent 提出定向问题
      用户在下一轮披露
      Agent 随后可执行
    type: process
    size: xl
    position:
      x: 500
      'y': 700
  - id: provided
    label: |-
      用户提供意图
      Agent 未解决也未定向询问
      用户主动补充缺失需求
      交互随后继续
    type: process
    size: xl
    position:
      x: 500
      'y': 880
  - id: terminal_gate
    label: |-
      所有意图都已终态？
      已完成已推断或用户提供
      同时要求 Agent 最终回复
    type: decision
    size: xl
    position:
      x: 740
      'y': 700
  - id: proc
    label: |-
      计算主动性 PROC
      已完成与已推断意图之和
      除以全部隐藏意图
      行动与定向询问同等计分
    type: database
    size: xl
    position:
      x: 980
      'y': 560
  - id: comp
    label: |-
      计算完成度 COMP
      每个 Checklist 项二元计分
      使用模型 Rubric 或确定性程序
      对会话 Checklist 取均值
    type: database
    size: xl
    position:
      x: 980
      'y': 840
  - id: report
    label: |-
      报告两种不同能力
      PROC 衡量需求发现
      COMP 衡量正确产物与决策
      三次运行取均值并报告偏差
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 700
  - id: prompt_boundary
    label: |-
      公开提示词与解析器边界
      仓库包含模拟用户提示词
      包含意图与 Checklist Judge
      包含 XML 解析和工具规则评分器
    type: document
    size: xl
    position:
      x: 1460
      'y': 520
  - id: paper_metric_boundary
    label: |-
      论文 v3 指标合同
      会话 PROC 不加权
      会话 COMP 不加权
      再对三条独立轨迹取均值
    type: document
    size: xl
    position:
      x: 1220
      'y': 1040
  - id: code_metric_boundary
    label: |-
      发布代码 · 383910b16987
      依赖扩展后的意图覆盖
      可选 Checklist 权重
      按依赖组大小加权总体聚合
    type: document
    size: xl
    position:
      x: 1460
      'y': 1040
  - id: release_boundary
    label: |-
      HF 快照 · 116ae739261d
      100 条 tasks.jsonl
      仅公开任务 YAML
      完整基准位于 GitHub
    type: database
    size: xl
    position:
      x: 980
      'y': 180
  - id: license_boundary
    label: |-
      运行与许可边界
      仓库声明 Apache-2.0
      运行依赖外部凭据
      仅用环境变量且不得写入密钥
    type: document
    size: xl
    position:
      x: 1220
      'y': 180
