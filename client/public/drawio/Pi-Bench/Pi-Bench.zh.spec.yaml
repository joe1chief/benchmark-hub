meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: π-Bench 构建与评测流程
  description: 依据论文重绘专家 Persona、持久跨会话工作流、可恢复隐藏意图、可验证 Checklist、 模拟用户意图跟踪、重复轨迹以及 PROC 与 COMP 评分流程。
  legend: π-Bench 包含 5 个各 20 会话的 Episode 和 100 个任务，并含 524 个隐藏意图、 510 个 Rubric 项、168 个规则项、187 个独立工具和 21 个技能。
nodes:
  - id: step_1
    label: |-
      选择五种职业角色
      研究员 · 营销人员 · 法律实习生
      药剂师 · 金融从业者
      覆盖不同长程工作流
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      构建稳定 Persona
      与领域专家共同设计
      定义例程与偏好
      加入工作方式与长期目标
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      从真实工作中派生任务
      使用专家例程与支撑材料
      要求产生具体交付物
      人工复核真实性与可行性
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      构建持久环境
      项目文件跨会话保留
      提供 187 个独立工具
      提供 21 个可复用技能
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      创建五个 20 会话 Episode
      每个 Persona 对应一个 Episode
      每个多轮会话对应一个任务
      最终共 100 个任务
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      设计会话依赖
      每个 Episode 有六个强依赖组
      每组包含两至三个任务
      另加五个大体独立任务
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      编写欠规格的任务开端
      使用自然初始请求
      允许环境事件触发会话
      隐藏可恢复的需求
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      标注隐藏意图
      共 524 个潜在需求
      可在会话内或跨会话持续
      可通过行动或澄清恢复
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      执行参考解答
      人工专家运行并复核任务
      编写 510 个 Rubric 检查项
      编写 168 个确定性规则项
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      配置交互循环
      使用相同 Nanobot 派生脚手架
      GPT-5.4 模拟用户温度为 0
      观察消息工具与工作区
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      运行三条独立轨迹
      使用默认解码并开启思考
      持久保存会话历史与产物
      保留结构化工具记录
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      跟踪意图终态
      已完成 · 已推断 · 用户提供
      优先直接完成再定向询问
      所有意图终态后停止
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      计算主动性 PROC
      计入已完成与已推断意图
      排除由用户直接提供的意图
      衡量 Agent 主导的需求发现
    type: database
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      计算完成度 COMP
      Rubric 严格判断 YES 或 NO
      合并确定性规则结果
      报告均值与标准差
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
