      Git 383910b16987 · README aeb39fc6eb78
      HF 116ae739261d · Tasks 95807131f24d
      100 Released Task Rows
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: personas
    label: |-
      Construct Five Stable Personas
      Researcher · Marketer · Pharmacist
      Law Trainee · Financier
      Routines Preferences and Long-term Goals
    type: document
    size: xl
    position:
      x: 260
      'y': 40
  - id: episodes
    label: |-
      Create Long-horizon Episodes
      One Episode per Persona
      20 Sessions per Episode
      One Multi-turn Task per Session
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: environment
    label: |-
      Build Persistent Environments
      Shared Workspace across Sessions
      187 Unique Tools
      21 Reusable Skills
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: workflow_tasks
    label: |-
      Derive Workflow-grounded Tasks
      Authentic Work Routines and Materials
      Require Concrete Deliverables
      Human-reviewed for Realism and Feasibility
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: dependencies
    label: |-
      Design Cross-session Dependencies
      Six Strong Groups per Episode
      Two to Three Tasks per Strong Group
      Five Largely Independent Tasks
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: starts
    label: |-
      Write Natural Underspecified Starts
      User-issued Initial Requests
      Or Environment-triggered Signals
      Minimally Sufficient to Make Progress
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: hidden_intents
    label: |-
      Annotate 524 Recoverable Intents
      Latent Constraints and Preferences
      Session-local or Persistent
      Infer Elicit and Act from Evidence
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: checklists
    label: |-
      Define Verifiable Checklists
      510 Rubric Items · 168 Rule Items
      Concrete Fine-grained Obligations
      Necessary and Sufficient Criteria
    type: database
    size: xl
    position:
      x: 1700
      'y': 320
  - id: graders
    label: |-
      Implement Two Grader Types
      Rubric Model for Open-ended Content
      Deterministic File String and Tool Checks
      Verify Schemas and Objective Conditions
    type: process
    size: xl
    position:
      x: 1460
      'y': 320
  - id: reference_review
    label: |-
      Execute and Review Every Task
      Experts Produce Reference Solutions
      Verify Files Tools Skills and Graders
      Keep Workflow Correct and Well-scoped
    type: process
    size: xl
    position:
      x: 1220
      'y': 320
  - id: release
    label: |-
      Finalize Pi-Bench
      100 Tasks · Five Personas
      100 Multi-turn Sessions
      Persistent Cross-session Workflows
    type: database
    size: xl
    position:
      x: 980
      'y': 320
  - id: user_config
    label: |-
      Configure the Evaluation Actors
      Same Nanobot-derived Agent Scaffold
      GPT-5.4 User Agent and Rubric Grader
      Temperature Zero · Default Decode · Thinking
    type: process
    size: xl
    position:
      x: 740
      'y': 320
  - id: repeat3
    label: |-
      Run Three Independent Trajectories
      Repeat Every Task Three Times
      Preserve Session History and Artifacts
      Report Means and Standard Deviations
    type: process
    size: xl
    position:
      x: 500
      'y': 320
  - id: session_start
    label: |-
      Start One Benchmark Session
      Load Persona Memory and Workspace
      Send Initial Request or Trigger
      Hide the Annotated Intents
    type: document
    size: xl
    position:
      x: 260
      'y': 320
  - id: agent_act
    label: |-
      Evaluated Agent Responds
      Reason Clarify and Use Tools
      Create or Revise Artifacts
      Update the Persistent Workspace
    type: process
    size: xl
    position:
      x: 20
      'y': 320
  - id: observe
    label: |-
      Simulated User Observes Progress
      Response and Tool Calls
      Workspace Updates and Artifacts
      Update Intent Tracking State
    type: process
    size: xl
    position:
      x: 20
      'y': 700
  - id: status_gate
    label: |-
      Assign Exactly One Terminal Status
      How Was This Intent Resolved?
      Inspect the Current Turn Evidence
    type: decision
    size: xl
    position:
      x: 260
      'y': 700
  - id: completed
    label: |-
      Completed Intent
      Action or Artifact Satisfies It
      No Explicit User Disclosure
      Agent Resolves It Directly
    type: process
    size: xl
    position:
      x: 500
      'y': 520
  - id: inferred
    label: |-
      Inferred Intent
      Agent Asks a Focused Question
      User Reveals It in the Next Turn
      Agent Can Then Act
    type: process
    size: xl
    position:
      x: 500
      'y': 700
  - id: provided
    label: |-
      Provided Intent
      No Resolution or Targeted Question
      User Supplies the Missing Requirement
      Interaction Can Continue
    type: process
    size: xl
    position:
      x: 500
      'y': 880
  - id: terminal_gate
    label: |-
      Are All Intents Terminal?
      Completed Inferred or Provided
      Require the Agent's Final Response
    type: decision
    size: xl
    position:
      x: 740
      'y': 700
  - id: proc
    label: |-
      Compute Proactivity PROC
      Completed plus Inferred Intents
      Divide by All Hidden Intents
      Equal Credit for Action and Elicitation
    type: database
    size: xl
    position:
      x: 980
      'y': 560
  - id: comp
    label: |-
      Compute Completeness COMP
      Binary 0 or 1 per Checklist Item
      Rubric Model or Deterministic Program
      Mean over the Session Checklist
    type: database
    size: xl
    position:
      x: 980
      'y': 840
  - id: report
    label: |-
      Report Two Distinct Capabilities
      PROC Requirement Discovery
      COMP Correct Artifacts and Decisions
      Average Three Runs with Deviations
    type: terminal
    size: xl
    position:
      x: 1220
      'y': 700
  - id: prompt_boundary
    label: |-
      Public Prompt and Parser Boundary
      Repo Includes User-agent Prompts
      Intent Judges and Checklist Judge
      XML Parsers and Tool-rule Evaluators
    type: document
    size: xl
    position:
      x: 1460
      'y': 520
  - id: paper_metric_boundary
    label: |-
      Paper-v3 Metric Contract
      Unweighted Per-session PROC
      Unweighted Per-session COMP
      Then Average Three Independent Runs
    type: document
    size: xl
    position:
      x: 1220
      'y': 1040
  - id: code_metric_boundary
    label: |-
      Released Code · 383910b16987
      Dependency-expanded Intent Coverage
      Optional Criterion Weights
      Group-size-weighted Overall Aggregation
    type: document
    size: xl
    position:
      x: 1460
      'y': 1040
  - id: release_boundary
    label: |-
      HF Snapshot · 116ae739261d
      100-row tasks.jsonl
      Exposes Task YAML Only
      Full Benchmark Lives in GitHub
    type: database
    size: xl
    position:
      x: 980
      'y': 180
  - id: license_boundary
    label: |-
      Operational and License Boundary
      Repository Declares Apache-2.0
      Runtime Needs External Credentials
      Use Environment Variables · No Secrets
    type: document
    size: xl
    position:
      x: 1220
      'y': 180
