meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Pi-Bench Paper-aligned Build and Evaluation Process
  description: >-
    Paper-v3 construction, terminal-intent interaction, and PROC/COMP evaluation with public prompt, release, license,
    and post-paper aggregation boundaries shown as dashed evidence links.
  legend: >-
    Solid arrows reproduce the paper contract. Dashed arrows annotate fixed sources and released-code boundaries rather
    than adding steps to the paper pipeline.
