meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NExT-QA Build and Evaluation Process
  description: >-
    Paper-v2 and released-code-aligned selection, staged annotation, acceptance filtering, five-option distractor
    construction, separate multiple-choice and open-ended scoring, and explicit release boundaries.
  legend: >-
    NExT-QA keeps 5,440 videos and 52,044 free-answer pairs. Its 47,692 five-option subset and the full open-ended task
    have distinct scorers and no paper-defined combined score.
nodes:
  - id: scope
    label: |-
      Define Explanatory Video QA
      Visible Causal and Temporal Actions
      Rich Object Interactions
      Real-world Daily Activities
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: videos
    label: |-
      Select 6,000 VidOR Videos
      Originally Drawn from YFCC-100M
      Prefer Longer Interaction-rich Clips
      No Fixed Actor or Activity Category
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: split
    label: |-
      Random Video-level Split
      Train · Validation · Test = 7:1:2
      Split before Question Annotation
      Avoid Cross-split Video Reuse
    type: database
    size: xl
    position:
      x: 500
      'y': 250
  - id: guidance
    label: |-
      Train and Supervise 100 Undergraduates
      Type Chosen from a Drop-down Menu
      Suggest ≤22-word Questions · ≤6-word Answers
      Report Videos Unsuitable for Good Questions
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: annotation
    label: |-
      Annotate in Three Stages over One Year
      Causal Questions First
      Temporal Questions Second
      Descriptive Questions Last
    type: process
    size: xl
    position:
      x: 980
      'y': 250
  - id: qa_roles
    label: |-
      Separate Question and Answer Roles
      Answerer Checks Question Quality
      Repair a Bad Question when Possible
      Answer Only with Visible Objective Evidence
    type: process
    size: xl
    position:
      x: 1220
      'y': 250
  - id: acceptance_gate
    label: |-
      Answerable and Objective
      from Visible Video Evidence?
    type: decision
    size: xl
    position:
      x: 1460
      'y': 250
  - id: reject_annotation
    label: |-
      Delete Unusable Question
      Subjective · Unanswerable
      or Missing Visible Evidence
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 500
  - id: postprocess
    label: |-
      Post-process Accepted Annotations
      Remove Confirmed Boring Videos
      Balance Yes and No in Validation/Test
      Delete Counting Answers above Twenty
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
  - id: release
    label: |-
      Retain 5,440 Videos · 52,044 QA Pairs
      Train 3,870 · Validation 570 · Test 1,000
      Causal 48% · Temporal 29% · Descriptive 23%
      Preserve Short Free-text Answers
    type: database
    size: xl
    position:
      x: 1940
      'y': 250
  - id: task_gate
    label: |-
      Which Evaluation
      Task Contract?
    type: decision
    size: xl
    position:
      x: 2180
      'y': 250
  - id: mc_group
    label: |-
      Build Multiple-choice Candidates
      Exclude Binary Questions
      Group by Annotated Question Type
      Retrieve Top 50 Similar Questions with Sentence-BERT
    type: process
    size: xl
    position:
      x: 2420
      'y': 40
  - id: mc_filter
    label: |-
      Filter Candidate Answers
      Remove Lemma Duplicates without Stop Words
      Remove Answer Similarity >0.9
      Discard Easy Candidates with Similarity <0.2
    type: process
    size: xl
    position:
      x: 2660
      'y': 40
  - id: mc_manual
    label: |-
      Form Every Five-option Tuple
      Sample Four Qualified Distractors
      Insert the Correct Answer Evenly
      Manually Check and Amend All Tuples
    type: process
    size: xl
    position:
      x: 2900
      'y': 40
  - id: mc_eval
    label: |-
      Score 47,692 Multiple-choice Items
      Exact Option-index Equality
      Fine Type · Causal · Temporal · Descriptive
      Overall Accuracy · Human 88.38% on Validation
    type: process
    size: xl
    position:
      x: 3140
      'y': 40
  - id: oe_task
    label: |-
      Define Open-ended Generation
      No Candidate Options
      Use All 52,044 QA Pairs
      Generate a Short Free-text Answer
    type: process
    size: xl
    position:
      x: 2420
      'y': 460
  - id: oe_eval
    label: |-
      Use the Released NExT-OE Scorer
      Custom Stop-word Removal · Lemmatization
      Exact Match for Binary and Counting
      WUPS@0 Otherwise · Max over Added Reference if Present
    type: process
    size: xl
    position:
      x: 2660
      'y': 460
  - id: report
    label: |-
      Report NExT-QA Results Separately
      Multiple-choice Accuracy
      Open-ended WUPS by Causal/Temporal/Descriptive
      No Combined Cross-task Score in the Paper
    type: terminal
    size: xl
    position:
      x: 3380
      'y': 250
  - id: source_boundary
    label: |-
      Paper and Release Boundary
      arXiv v2 SHA c2c951…
      NExT-QA 2432e97… · NExT-OE a83f8f5… · MIT
      QA and Scorers Public · Raw Videos via Drive
      Logs and Construction Scripts Not Released
    type: document
    size: xl
    position:
      x: 3380
      'y': 500
