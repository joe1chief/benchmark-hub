meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NExT-QA Build and Evaluation Process
  description: >-
    Paper-aligned selection of interaction-rich VidOR videos, three-stage manual annotation, quality control, hard
    multi-choice distractor generation, open-ended answer generation, and type-wise evaluation.
  legend: >-
    NExT-QA contains 5,440 videos and 52,044 open-ended question-answer pairs; causal, temporal, and descriptive
    questions account for 48, 29, and 23 percent respectively.
nodes:
  - id: goal
    label: |-
      Define Explanatory Video QA
      Causal and Temporal Actions
      Rich Object Interactions
      Real-world Daily Activities
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: videos
    label: |-
      Select 6,000 VidOR Videos
      Source from YFCC-100M
      Prefer Longer Interaction-rich Clips
      Split Train · Val · Test as 7:1:2
    type: database
    size: xl
    position:
      x: 260
      'y': 230
  - id: annotation
    label: |-
      Run Three Annotation Stages
      100 Trained Undergraduates
      One Year under Supervision
      Causal then Temporal then Descriptive
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: qa_control
    label: |-
      Separate Question and Answer Roles
      Answerers Fix or Delete Bad Questions
      Require Visible and Objective Evidence
      Target 22-word Questions · 6-word Answers
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: postprocess
    label: |-
      Post-process Annotations
      Remove Confirmed Boring Videos
      Balance Yes and No in Val and Test
      Delete Counts above Twenty
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: release
    label: |-
      Retain 5,440 Videos · 52,044 QA
      Train 3,870 · Val 570 · Test 1,000
      Causal 48 · Temporal 29 · Descriptive 23 Percent
      Preserve Short Free-text Answers
    type: database
    size: xl
    position:
      x: 1220
      'y': 230
  - id: mc_group
    label: |-
      Group Non-binary Questions by Type
      Retrieve Top 50 Similar Questions
      Use Sentence-BERT Cosine Similarity
      Collect Their Answers as Candidates
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: open_task
    label: |-
      Define Open-ended QA
      No Candidate Options
      Generate Short Phrase Answers
      Use All 52,044 QA Pairs
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: mc_filter
    label: |-
      Filter Distractor Candidates
      Remove Lemma Duplicates
      Remove Similarity above 0.9
      Keep Hard Negatives above 0.2
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: open_eval
    label: |-
      Evaluate Generated Answers
      Remove Stop Words and Lemmatize
      WUPS Semantic Similarity
      Accuracy for Binary and Counting
    type: process
    size: xl
    position:
      x: 1700
      'y': 420
  - id: mc_manual
    label: |-
      Form and Check Five Options
      Sample Four Qualified Distractors
      Insert Correct Answer Evenly
      Manually Amend Every Tuple
    type: process
    size: xl
    position:
      x: 1940
      'y': 40
  - id: mc_eval
    label: |-
      Evaluate Multi-choice QA
      47,692 Five-option Questions
      Exact Choice Accuracy
      Compare Visual and Blind Baselines
    type: process
    size: xl
    position:
      x: 2180
      'y': 40
  - id: report
    label: |-
      Report NExT-QA Results
      Causal · Temporal · Descriptive
      Multi-choice Accuracy · Open WUPS
      Compare with Human Performance
    type: terminal
    size: xl
    position:
      x: 2420
      'y': 230
edges:
  - from: goal
    to: videos
    type: primary
  - from: videos
    to: annotation
    type: primary
  - from: annotation
    to: qa_control
    type: primary
  - from: qa_control
    to: postprocess
    type: primary
  - from: postprocess
    to: release
    type: primary
  - from: release
    to: mc_group
    type: primary
  - from: release
    to: open_task
    type: primary
  - from: mc_group
    to: mc_filter
    type: primary
  - from: open_task
    to: open_eval
    type: primary
  - from: mc_filter
    to: mc_manual
    type: primary
  - from: mc_manual
    to: mc_eval
    type: primary
  - from: mc_eval
    to: report
    type: primary
  - from: open_eval
    to: report
    type: primary
modules: []
