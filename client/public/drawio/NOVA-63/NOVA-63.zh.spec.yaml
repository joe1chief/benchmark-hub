meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NOVA-63 构建与评测流程
  description: 对齐论文的四阶段母语多学科问题整理流程，包括 LLM 辅助格式化、质量与元数据标注、多模型难度筛选、补充和最终均衡。
  legend: EMNLP 官方论文 PDF 报告 89,107 道母语问题，覆盖 14 种语言、八个语系与 63 个二级学科，每个语言-学科单元保留 50 至 150 题。
nodes:
  - id: goal
    label: |-
      定义原生多语言基准
      避免机器翻译腔
      均衡不同学科
      统一难度标准
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: collection
    label: |-
      收集母语问题
      本地教育网站
      学术出版物与考试
      中学至研究生难度
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: formatting
    label: |-
      规范化问题格式
      LLM 上下文示例抽取
      题干 · 选项 · 答案
      区分多选题与自由问答
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: extraction_review
    label: |-
      人工核验 LLM 抽取
      检查组成与格式
      删除不完整记录
      保留母语原始表达
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: quality
    label: |-
      标注并过滤质量
      可读性 · 完整性 · 清晰度
      不依赖缺失媒体或上下文
      任一维度不合格即删除
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: classify
    label: |-
      添加多维元数据
      13 个一级 · 63 个二级
      262 个三级学科
      记忆型或推理型
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: difficulty
    label: |-
      执行多模型难度筛选
      对话与推理模型
      小模型不超过 14B · 大模型超过 14B
      记录准确率与错误选项
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: hard_filter
    label: |-
      保留困难问题
      大模型准确率低于 50%
      标记反常规模效应
      标记错误选项集中现象
    type: process
    size: xl
    position:
      x: 1700
      'y': 230
  - id: abnormal_review
    label: |-
      人工复核可疑问题
      小模型准确率超过大模型 1.2 倍
      总正确率低于 30% 且
      某错误选项超过 50%
    type: process
    size: xl
    position:
      x: 1700
      'y': 500
  - id: supplement
    label: |-
      补充问题不足的学科
      把 2,425 道困难问答转为多选题
      用模型错误答案生成干扰项
      重新分配跨学科问题
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: final_review
    label: |-
      执行最终母语人工审核
      相关性 · 流畅度 · 原创性
      完整性 · 翻译痕迹
      删除未通过问题
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: balance
    label: |-
      均衡每种语言与学科
      每单元至少 50 题
      上限 150 并随机抽样超额问题
      在二级学科层面协调
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: release
    label: |-
      发布 89,107 道母语问题
      14 种语言 · 八个语系
      63 个二级学科
      原生多选基准
    type: database
    size: xl
    position:
      x: 740
      'y': 500
  - id: evaluate
    label: |-
      评测 62 个大模型
      基础 · 对话 · 推理模型
      零样本与少样本多选提示
      以选项准确率计分
    type: process
    size: xl
    position:
      x: 500
      'y': 500
  - id: report
    label: |-
      报告细粒度准确率
      问题 · 二级 · 一级学科平均
      主要分数采用一级学科均值
      分析语言和学科差距
    type: terminal
    size: xl
    position:
      x: 260
      'y': 500
edges:
  - from: goal
    to: collection
    type: primary
  - from: collection
    to: formatting
    type: primary
  - from: formatting
    to: extraction_review
    type: primary
  - from: extraction_review
    to: quality
    type: primary
  - from: quality
    to: classify
    type: primary
  - from: classify
    to: difficulty
    type: primary
  - from: difficulty
    to: hard_filter
    type: primary
  - from: hard_filter
    to: abnormal_review
    type: primary
  - from: abnormal_review
    to: supplement
    type: primary
  - from: supplement
    to: final_review
    type: primary
  - from: final_review
    to: balance
    type: primary
  - from: balance
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
