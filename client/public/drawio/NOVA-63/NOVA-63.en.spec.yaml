meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NOVA-63 Build Process
  description: >-
    ACL-PDF-aligned four-stage native multilingual collection, metadata annotation, difficulty screening,
    supplementation, final selection, and evaluation workflow.
  legend: >-
    Solid arrows are disclosed construction, rejection, and evaluation paths. Dashed arrows are sample audits,
    model-panel inputs, or publication/release boundaries. The authoritative ACL PDF reports 89,107 questions; the ACL
    landing-page abstract currently reports a different total.
nodes:
  - id: native_sources
    label: |-
      Native Speakers Collect Local Questions
      Educational Sites · Publications · Exams
      Secondary School through Postgraduate
      Verify Native and Cultural Authenticity
    type: database
    size: xl
    position:
      x: 320
      'y': 80
  - id: format
    label: |-
      LLM In-context Format Normalization
      Extract Question · Options · Answer
      Classify MCQ or Free-form QA
      Remove HTML and Extraneous Content
    type: process
    size: xl
    position:
      x: 600
      'y': 80
  - id: extraction_review
    label: |-
      Sample-based Human Extraction Audit
      Check Multimedia Filtering · Preservation
      Completeness and Formatting
      Not a Per-item Human Gate
    type: process
    size: xl
    position:
      x: 880
      'y': 260
  - id: extraction_gate
    label: |-
      Extraction Complete
      and Independently Usable?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 80
  - id: discard_extract
    label: |-
      Reject Extraction Failure
      Missing Components or Context
      Unusable Formatting
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 260
  - id: quality_filter
    label: |-
      LLM Quality Annotation
      Readability 1–3 · Completeness 0–1
      Clarity and Consistency 1–3
      Record Scores with Reasons
    type: process
    size: xl
    position:
      x: 1440
      'y': 80
  - id: quality_gate
    label: |-
      At Maximum on Every Criterion?
      Readability 3 · Completeness 1
      Clarity and Consistency 3
    type: decision
    size: xl
    position:
      x: 1720
      'y': 80
  - id: discard_quality
    label: |-
      Reject Quality Failure
      Missing Media or Context
      Poor Readability or Ambiguity
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 260
  - id: classify
    label: |-
      Add Multi-faceted Metadata
      13 Primary · 63 Secondary · 262 Tertiary
      Hierarchical Closest-match Classification
      Recitation-based or Reasoning-based
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: model_panel
    label: |-
      Difficulty Model Panel
      Chat and Reasoning Models
      Small ≤14B · Large >14B
      Zero-shot · Seed 42 · Temperature 0
    type: document
    size: xl
    position:
      x: 1440
      'y': 650
  - id: model_annotation
    label: |-
      Run Model Difficulty Annotation
      Record Correctness and Chosen Options
      Parse JSON then Answer-based Fallbacks
      Drop Explicit Multimedia Questions
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: difficulty_gate
    label: |-
      Large-model Accuracy
      Below 50%?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 440
  - id: discard_easy
    label: |-
      Reject Insufficient Difficulty
      Large-model Accuracy ≥50%
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 650
  - id: abnormal_gate
    label: |-
      Suspicious Pattern?
      Small > Large or Concentrated Wrong Option
      Native Expert Review
    type: decision
    size: xl
    position:
      x: 880
      'y': 440
  - id: manual_validation
    label: |-
      Native Expert Manual Validation
      Check Language · Ambiguity · Missing Media
      Verify Reference Answer
      Relevant Postgraduate Expertise
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: validation_gate
    label: |-
      Final Appendix Threshold
      or Review Error?
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: discard_abnormal
    label: |-
      Reject Suspicious Item
      Appendix Threshold Rules or
      Native Review Finds an Error
    type: terminal
    size: xl
    position:
      x: 320
      'y': 650
  - id: selected_pool
    label: |-
      Initial Difficult Valid Pool
      Coordinate Counts at
      Secondary-discipline Level
    type: database
    size: xl
    position:
      x: 40
      'y': 440
  - id: supplement_gate
    label: |-
      Secondary-discipline
      Pool Needs Supplementation?
    type: decision
    size: xl
    position:
      x: 40
      'y': 900
  - id: qa_conversion
    label: |-
      Convert Selected QA to MCQ
      Judge Model Answers against Gold
      Use Common Model Errors as Distractors
      2,425 Converted Questions
    type: process
    size: xl
    position:
      x: 320
      'y': 800
  - id: conversion_rescreen
    label: |-
      Reapply All Earlier Standards
      Quality and Difficulty Screening
      Manually Review Every Conversion
      Check Native Fluency and Translationese
    type: process
    size: xl
    position:
      x: 600
      'y': 800
  - id: interdisciplinary
    label: |-
      Reassign Interdisciplinary Questions
      LLM Judges Potential Overlap
      Move Item to the Smaller Pool
      Balance Secondary Disciplines
    type: process
    size: xl
    position:
      x: 320
      'y': 1040
  - id: final_review
    label: |-
      Final Manual Review
      Discipline Relevance · Text Quality
      Machine-translation Artifacts
      Completeness and Obvious Logic Errors
    type: process
    size: xl
    position:
      x: 880
      'y': 900
  - id: final_gate
    label: |-
      Pass Every Final
      Review Criterion?
    type: decision
    size: xl
    position:
      x: 1160
      'y': 900
  - id: discard_final
    label: |-
      Reject Final-review Failure
      Low Relevance or Quality
      Translation Artifact or Incompleteness
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 1100
  - id: balance
    label: |-
      Balance Language × Secondary Discipline
      Maintain at Least 50 Questions
      Cap at 150 Questions
      Randomly Sample Any Excess
    type: process
    size: xl
    position:
      x: 1440
      'y': 900
  - id: release
    label: |-
      NOVA-63 Paper Benchmark
      89,107 Native MCQs · 14 Languages
      Eight Families · 63 Secondary Disciplines
      50–150 per Language-discipline Cell
    type: database
    size: xl
    position:
      x: 1720
      'y': 900
  - id: evaluate
    label: |-
      Evaluate 62 LLMs
      Chat/Reasoning: Zero-shot Answer Ending
      Base: Five-shot Option Probabilities
      Base Samples Reused within a Discipline
    type: process
    size: xl
    position:
      x: 1720
      'y': 1260
  - id: score
    label: |-
      Report Exact-option Accuracy
      Question · Secondary · Primary Averages
      Main Result Uses Primary-discipline Mean
      Avoid Overweighting Larger Disciplines
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 1260
  - id: publication_boundary
    label: |-
      Publication and Release Boundary
      ACL PDF SHA-256 630e3a… Reports 89,107
      ACL Page Abstract Currently Says 93,536
      HF Revision 7bfc985… Has README Only
      MIT Card Says Dataset Is Under Review
    type: document
    size: xl
    position:
      x: 2000
      'y': 1480
