meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NOVA-63 Build and Evaluation Process
  description: >-
    Paper-aligned four-stage curation of native multilingual academic questions with LLM-assisted formatting, quality
    and metadata annotation, multi-model difficulty screening, supplementation, and final balancing.
  legend: >-
    The authoritative EMNLP paper PDF reports 89,107 native questions across 14 languages, eight language families, and
    63 secondary disciplines, with 50 to 150 questions per language-discipline cell.
nodes:
  - id: goal
    label: |-
      Define a Native Multilingual Benchmark
      Avoid Translationese
      Balance Academic Disciplines
      Enforce Consistent Difficulty
    type: document
    size: xl
    position:
      x: 20
      'y': 230
  - id: collection
    label: |-
      Collect Native-language Questions
      Local Educational Websites
      Academic Publications and Exams
      Secondary School through Postgraduate
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: formatting
    label: |-
      Normalize Question Formats
      LLM In-context Extraction
      Question · Options · Answer
      Classify as MCQ or Free-form QA
    type: process
    size: xl
    position:
      x: 500
      'y': 230
  - id: extraction_review
    label: |-
      Manually Verify LLM Extraction
      Check Components and Formatting
      Remove Incomplete Records
      Preserve Native Wording
    type: process
    size: xl
    position:
      x: 740
      'y': 230
  - id: quality
    label: |-
      Annotate and Filter Quality
      Readability · Completeness · Clarity
      No Missing Media or Context
      Discard Any Deficient Question
    type: process
    size: xl
    position:
      x: 980
      'y': 230
  - id: classify
    label: |-
      Add Multi-faceted Metadata
      13 Primary · 63 Secondary
      262 Tertiary Disciplines
      Recitation- or Reasoning-based
    type: process
    size: xl
    position:
      x: 1220
      'y': 230
  - id: difficulty
    label: |-
      Run Multi-model Difficulty Screening
      Chat and Reasoning Models
      Small at Most 14B · Large above 14B
      Record Accuracy and Wrong Options
    type: process
    size: xl
    position:
      x: 1460
      'y': 230
  - id: hard_filter
    label: |-
      Retain Difficult Questions
      Large-model Accuracy below 50 Percent
      Flag Scaling-law Reversals
      Flag Concentrated Wrong Options
    type: process
    size: xl
    position:
      x: 1700
      'y': 230
  - id: abnormal_review
    label: |-
      Manually Review Suspicious Items
      Small Accuracy above 1.2 Times Large
      Below 30 Percent Correct plus
      One Wrong Option above 50 Percent
    type: process
    size: xl
    position:
      x: 1700
      'y': 500
  - id: supplement
    label: |-
      Supplement Sparse Disciplines
      Convert 2,425 Hard QA Items to MCQ
      Use Model Errors as Distractors
      Reassign Interdisciplinary Questions
    type: process
    size: xl
    position:
      x: 1460
      'y': 500
  - id: final_review
    label: |-
      Conduct Final Native Review
      Relevance · Fluency · Originality
      Completeness · Translation Artifacts
      Delete Failed Questions
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: balance
    label: |-
      Balance Every Language and Discipline
      Minimum 50 Questions
      Cap at 150 and Randomly Sample Excess
      Coordinate at Secondary Discipline Level
    type: process
    size: xl
    position:
      x: 980
      'y': 500
  - id: release
    label: |-
      Release 89,107 Native Questions
      14 Languages · Eight Families
      63 Secondary Disciplines
      Native Multiple-choice Benchmark
    type: database
    size: xl
    position:
      x: 740
      'y': 500
  - id: evaluate
    label: |-
      Evaluate 62 LLMs
      Base · Chat · Reasoning Models
      Zero- and Few-shot MCQ Prompts
      Score Exact Option Accuracy
    type: process
    size: xl
    position:
      x: 500
      'y': 500
  - id: report
    label: |-
      Report Fine-grained Accuracy
      Question · Secondary · Primary Averages
      Use Primary-discipline Mean as Main Score
      Analyze Language and Discipline Gaps
    type: terminal
    size: xl
    position:
      x: 260
      'y': 500
edges:
  - from: goal
    to: collection
    type: primary
  - from: collection
    to: formatting
    type: primary
  - from: formatting
    to: extraction_review
    type: primary
  - from: extraction_review
    to: quality
    type: primary
  - from: quality
    to: classify
    type: primary
  - from: classify
    to: difficulty
    type: primary
  - from: difficulty
    to: hard_filter
    type: primary
  - from: hard_filter
    to: abnormal_review
    type: primary
  - from: abnormal_review
    to: supplement
    type: primary
  - from: supplement
    to: final_review
    type: primary
  - from: final_review
    to: balance
    type: primary
  - from: balance
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
