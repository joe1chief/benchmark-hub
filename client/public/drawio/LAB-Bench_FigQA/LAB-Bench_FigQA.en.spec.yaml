meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench FigQA Build Process
  description: >-
    Paper-aligned construction of the LAB-Bench scientific-figure subset through paper collection, figure isolation,
    expert question writing, optional model brainstorming, iterative review, and multimodal selective MCQ evaluation.
  legend: >-
    The paper reports 226 total FigQA questions. The current public 80% split contains 181 items; questions expose only
    the figure image and must not require its caption or surrounding paper text.
nodes:
  - id: papers
    label: |-
      Assemble Biology Paper Sources
      Authors Select Papers of Interest
      Build a Larger Contractor Paper Trove
      Preserve Source DOI Metadata
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: figures
    label: |-
      Identify Scientific Figures
      Authors Select and Screenshot Figures
      LabelBox Annotators Isolate Figure Images
      Link Image · Caption Boxes · DOI
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: interface
    label: |-
      Serve Figures in an Airtable Interface
      Show Image and Source Metadata
      Support Drafting and Revision
      Track Author and Review Status
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: draft
    label: |-
      Experts Draft Figure Questions
      Authors and Contracted Biologists
      Require Multi-element Figure Reasoning
      Write One Ideal and Plausible Distractors
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: prototype
    label: |-
      Optionally Request GPT-4 Turbo Ideas
      Use Suggestions as Brainstorming Seeds
      Identify Hard-to-interpret Figure Regions
      Never Accept Model Drafts Unchecked
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: constraints
    label: |-
      Enforce Figure-only Answerability
      Not Solvable from Text Printed in Figure
      No Caption or Paper Text Required
      Correct Fundamental Model Inaccuracies
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: review
    label: |-
      Review and Revise Expert Drafts
      Calibrate New Writers on First 5–10 Items
      Author Review Before Corpus Merge
      Revise · Approve · Reject
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: dataset
    label: |-
      Assemble FigQA · 226 Questions
      Figure Image · MCQ · Ideal · Distractors
      Source and Subtask Metadata
      Multimodal Figure-reasoning Tasks
    type: database
    size: xl
    position:
      x: 1700
      'y': 380
  - id: split
    label: |-
      Apply LAB-Bench 80/20 Split
      181 Questions in Current Public Set
      Retain Private Items for Contamination
      Keep Public-private Results Comparable
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: evaluate
    label: |-
      Evaluate Multimodal Models
      Provide Figure Image and MCQ Only
      Zero-shot Chain-of-thought · No Tools
      Allow Insufficient-information Response
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: metrics
    label: |-
      Score FigQA over Three Runs
      Accuracy = Correct / All
      Precision = Correct / Attempted
      Coverage = Attempted / All
    type: terminal
    size: xl
    position:
      x: 860
      'y': 380
edges:
