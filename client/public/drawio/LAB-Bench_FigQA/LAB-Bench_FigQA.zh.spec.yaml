meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LAB-Bench FigQA 构建流程
  description: 对齐论文的 LAB-Bench 科学图像子集构建流程，从论文收集、图像分离、专家出题、可选模型启发、 迭代审核，到允许拒答的多模态选择题评测。
  legend: 论文报告 FigQA 总计 226 题，当前约 80% 的公开拆分包含 181 题；每题只展示图像， 不应依赖图注或论文正文才能作答。
nodes:
  - id: papers
    label: |-
      汇集生物学论文来源
      作者按研究兴趣选择论文
      为外部专家构建更大论文池
      保留来源 DOI 元数据
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: figures
    label: |-
      识别科学论文图像
      作者选择并截图论文图
      标注平台人员分离图像
      关联图像 · 图注框 · DOI
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: interface
    label: |-
      在标注界面呈现图像
      展示图像与来源元数据
      支持问题草拟与修订
      跟踪作者和审核状态
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: draft
    label: |-
      专家编写图像问题
      论文作者与签约生物专家
      要求整合图中多个元素推理
      编写一个标准答案与合理干扰项
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: prototype
    label: |-
      可选请求 GPT-4 Turbo 提供灵感
      仅把建议作为头脑风暴种子
      发现难以理解的图像区域
      不直接接受未审核模型草稿
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: constraints
    label: |-
      强制仅凭图像可回答
      不能只读取图中文字作答
      不需要图注或论文正文
      修正模型建议中的根本错误
    type: document
    size: xl
    position:
      x: 1420
      'y': 40
  - id: review
    label: |-
      复核并修订专家草稿
      用最初 5–10 题校准新出题者
      合并语料前持续由作者审核
      修订 · 接收 · 拒绝
    type: user
    size: xl
    position:
      x: 1700
      'y': 40
  - id: dataset
    label: |-
      汇总 FigQA · 226 题
      图像 · 选择题 · 标准答案 · 干扰项
      来源与子任务元数据
      多模态科学图像推理任务
    type: database
    size: xl
    position:
      x: 1700
      'y': 380
  - id: split
    label: |-
      应用 LAB-Bench 约 80/20 拆分
      当前公开集合包含 181 题
      私有保留题用于污染监测
      保持公开与私有结果可比较
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: evaluate
    label: |-
      评测多模态模型
      仅提供图像与选择题
      零样本思维链 · 不提供工具
      允许回答信息不足
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: metrics
    label: |-
      三次运行后计算 FigQA 指标
      准确率 = 正确数 / 全部题目
      精确率 = 正确数 / 已作答数
      覆盖率 = 已作答数 / 全部题目
    type: terminal
    size: xl
    position:
      x: 860
      'y': 380
edges:
  - from: papers
    to: figures
    type: primary
  - from: figures
    to: interface
    type: primary
  - from: interface
    to: draft
    type: primary
  - from: draft
    to: prototype
    type: primary
  - from: prototype
    to: constraints
    type: primary
  - from: constraints
    to: review
    type: primary
  - from: review
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: evaluate
    type: primary
  - from: evaluate
    to: metrics
    type: primary
modules: []
