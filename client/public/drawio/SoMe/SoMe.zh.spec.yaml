meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SoMe 构建与评测流程
  description: >-
    SoMe定义8个社交媒体智能体任务，分为帖子中心、用户中心和综合三类。它通过商业数据、微博抓取和开放数据集，从32个社交平台及外部网站收集公开数据，形成9164284条帖子、6591个用户画像和25686篇事实核查报告。Qwen2.5-VL-72B生成图像视频描述与OCR文本，GPT-4o生成ASR文本。用户行为预测、评论模拟和内容推荐通过模板从观测数据直接生成查询与真值，不编辑既有结果；事件检测、流式摘要、情绪分析和社交问答由Qwen3-32B支持多轮人机交互标注；错误信息检测合并LIAR-RAW与RAWFC。全部生成真值由10名专业标注者人工过滤核验，最终得到17869条查询。平台提供8个MCP兼容数据访问与分析工具，智能体接收任务查询后调用工具并在噪声长上下文社交数据上推理。三个开放任务用LLM语义比较，其余五个任务先由LLM抽取关键答案再对真值算准确率；所有任务报告归一化得分与任务完成率，再对8项任务取平均。
  legend: >-
    来源：SoMe arXiv:2512.14720 Section 3, Tables 1-2, Section 4, and Appendices; official LivXue/SoMe
    repository。实线箭头表示论文或官方资料明确支持的主流程。
