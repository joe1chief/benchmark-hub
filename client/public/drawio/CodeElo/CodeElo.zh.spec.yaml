meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CodeElo 构建、官方判题与等级分流程
  description: 对齐论文的 CodeElo 流程，明确保留论文 54 场比赛评测集与更大的固定 Hugging Face 发布版之间的差异， 再展示 Codeforces 官方判题与 Elo 估算。
  legend: 实线表示论文评测主路径；虚线保留公开发布版的版本边界。
nodes:
  - id: evidence
    label: |-
      证据边界
      arXiv:2501.01257v2
      仓库 0bffc84 • HF 45a2cbb
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: source
    label: |-
      Codeforces 评级比赛
      2024-05-04 至 2024-11-04
      近期时间窗降低污染
    type: database
    size: xl
    position:
      x: 320
      'y': 240
  - id: collection
    label: |-
      收集并分类题目
      分区 • 难度 Rating • 35 个标签
      对模型隐藏算法标签
    type: process
    size: xl
    position:
      x: 600
      'y': 240
  - id: paper_set
    label: |-
      论文评测集
      排除 Div. 1 • 54 场比赛
      387 道题 • 原始 HTML
    type: database
    size: xl
    position:
      x: 880
      'y': 80
  - id: hf_release
    label: |-
      固定 HF 公开发布版
      57 场比赛 • 408 条记录
      含 21 道 Div. 1 • Markdown
    type: database
    size: xl
    position:
      x: 880
      'y': 400
  - id: paper_prompt
    label: |-
      论文 CoT 提示
      生成完整 C++ 程序
      原始 HTML • 隐藏标签
    type: document
    size: xl
    position:
      x: 1160
      'y': 80
  - id: release_use
    label: |-
      公开版边界
      过滤 21 道 Div. 1 后为 387
      Markdown ≠ 原始 HTML 提示
    type: document
    size: xl
    position:
      x: 1160
      'y': 400
  - id: inference_route
    label: 选择推理路径
    type: decision
    size: xl
    position:
      x: 1440
      'y': 80
  - id: open_source
    label: |-
      开源模型解码
      温度 0.7 • top_p 0.8 • top_k 20
      重复惩罚 1.1
      4,096 tokens；QwQ 32,768
    type: process
    size: xl
    position:
      x: 1720
      'y': 0
  - id: proprietary
    label: |-
      闭源模型
      提供商 API 默认参数
      使用相同 C++ CoT 提示
    type: process
    size: xl
    position:
      x: 1720
      'y': 160
  - id: runner_parse
    label: |-
      固定仓库解析器
      提取首个围栏代码块
      无语言标签时默认 C++
      仓库 0bffc84
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: attempt_execution
    label: |-
      固定尝试执行
      每题最多 8 次
      生成并提交全部可解析候选
      出现 AC 后也不提前停止
    type: process
    size: xl
    position:
      x: 2280
      'y': 80
  - id: official_judge
    label: |-
      直接提交 Codeforces 判题
      隐藏测试 • 特殊/交互评测器
      平台时间 + 内存限制
      必须通过全部测试
    type: process
    size: xl
    position:
      x: 2560
      'y': 80
  - id: contest_score
    label: |-
      重建比赛得分
      失败尝试降低得分 / 增加罚分
      不计提交时间罚时
      首次通过时计分
    type: process
    size: xl
    position:
      x: 2840
      'y': 80
  - id: elo
    label: |-
      人类可比 Elo
      将模型插入人类排名
      二分搜索期望等级分
      平均 54 场比赛等级分
    type: process
    size: xl
    position:
      x: 3120
      'y': 80
  - id: report
    label: |-
      CodeElo 报告
      Elo + 人类百分位
      Pass@1 / 2 / 4 / 8
      披露所用资产变体
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 240
edges:
  - from: evidence
    to: source
    type: primary
  - from: source
    to: collection
    type: primary
  - from: collection
    to: paper_set
    type: primary
  - from: collection
    to: hf_release
    type: data
  - from: paper_set
    to: paper_prompt
    type: primary
  - from: paper_prompt
    to: inference_route
    type: primary
  - from: inference_route
    to: open_source
    type: primary
  - from: inference_route
    to: proprietary
    type: primary
  - from: open_source
    to: runner_parse
    type: primary
  - from: proprietary
    to: runner_parse
    type: primary
  - from: runner_parse
    to: attempt_execution
    type: primary
  - from: attempt_execution
    to: official_judge
    type: primary
  - from: official_judge
    to: contest_score
    type: primary
  - from: contest_score
    to: elo
    type: primary
  - from: elo
    to: report
    type: primary
  - from: hf_release
    to: release_use
    type: data
  - from: release_use
    to: report
    type: data
modules: []
