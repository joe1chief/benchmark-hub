meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CodeElo Build and Rating Process
  description: >-
    Paper-aligned collection of recent rated Codeforces contests, direct official-platform judging, contest scoring, and
    human-comparable Elo estimation.
  legend: Read the benchmark construction row left-to-right, then the judging and rating row right-to-left.
nodes:
  - id: contests
    label: |-
      Rated Codeforces Contests
      May 4 to November 4, 2024
      Exclude Div. 1-Only Contests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: dataset
    label: |-
      CodeElo Problem Set
      54 Contests / 387 Problems
      Divisions, Ratings, and Algorithm Tags
    type: database
    size: xl
    position:
      x: 320
      'y': 100
  - id: parse
    label: |-
      Parse and Preserve Problems
      Description / I-O / Examples / Notes
      Present Original HTML for Formulas and Layout
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: prompt
    label: |-
      Competition Coding Prompt
      Ask for Reasoning + Complete C++ Program
      Hide Algorithm Tags During Testing
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: sample
    label: |-
      Generate up to Eight Attempts
      Parse the Final Fenced Code Block
      Retain Attempt Order per Problem
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: submit
    label: |-
      Direct Official Submission
      Automated Bot Sends Code to Codeforces
      Academic Virtual-Participation Protocol
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: judge
    label: |-
      Codeforces Official Judgment
      Hidden Tests + Special / Interactive Judges
      Platform Time and Memory Limits
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: score
    label: |-
      Reconstruct Contest Score
      Accepted Only After All Platform Tests Pass
      Penalize Failed Attempts Before Acceptance
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: rank
    label: |-
      Place Model among Human Ranks
      Compare Model Rank with n Participants
      Solve Expected Rating by Binary Search
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: aggregate
    label: |-
      Aggregate across 54 Contests
      Average Contest-Level Elo Ratings
      Preserve Contest-Level Variation
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      Human-Comparable Report
      Elo Rating + Human Percentile
      Pass@1 / @2 / @4 / @8 and Tag Analysis
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: contests
    to: dataset
    type: primary
  - from: dataset
    to: parse
    type: primary
  - from: parse
    to: prompt
    type: primary
  - from: prompt
    to: sample
    type: primary
  - from: sample
    to: submit
    type: primary
  - from: submit
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: score
    to: rank
    type: primary
  - from: rank
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
