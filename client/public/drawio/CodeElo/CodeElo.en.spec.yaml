    Paper-aligned CodeElo workflow that preserves the material difference between the 54-contest paper evaluation and
    the larger pinned Hugging Face release before tracing official Codeforces judging and Elo estimation.
  legend: Solid arrows show the paper evaluation path; dashed arrows preserve the public-release version boundary.
