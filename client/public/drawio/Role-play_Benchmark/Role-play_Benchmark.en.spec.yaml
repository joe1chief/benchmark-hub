meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Role-play_Benchmark Build and Evaluation Process
  description: >-
    Role-play Benchmark has no standalone paper, so the diagram follows MiniMax's official dataset card and technical
    blog while marking that evidence boundary. The internal pipeline clusters more than one million NPC/user prompts
    with embeddings, aggregates semantic tags with an LLM, verifies them with humans, and samples Chinese and English
    settings. A model-on-model user simulator then runs 100-turn self-play three times per setting. Only NPC outputs are
    judged, in 20-turn chunks, across Basics, Logic, Knowledge, Diversity, Content Logic, and Interaction with regular
    human calibration. Worlds, Stories, and User Preferences contribute 50%, 25%, and 25%. The public partial release
    contains 50 Chinese and 45 English seeds with 3,135 dialogue sessions.
  legend: >-
    Source: MiniMax role-play-bench dataset card and MiniMax-M2-her technical blog Sections 2.1-2.2; no standalone
    benchmark paper is published. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
