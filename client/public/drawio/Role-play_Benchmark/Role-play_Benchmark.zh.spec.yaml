meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Role-play_Benchmark 构建与评测流程
  description: >-
    Role-play
    Benchmark没有独立论文，因此流程图依据MiniMax官方数据卡和技术博客，并明确这一证据边界。内部流程先对超过100万个NPC与用户提示做嵌入聚类，由LLM聚合语义标签并经人工验证，再抽样中英文角色设定。模型对模型的用户模拟器随后为每个设定执行100轮自博弈并重复三次。评测仅检查NPC输出，把对话切为20轮片段，在基础、逻辑、知识、多样性、内容逻辑和交互六维度打分并定期以人类偏好校准。Worlds、Stories与User
    Preferences权重分别为50%、25%、25%。公开的部分子集含50个中文和45个英文种子以及3135个对话会话。
  legend: >-
    来源：MiniMax role-play-bench dataset card and MiniMax-M2-her technical blog Sections 2.1-2.2; no standalone benchmark
    paper is published。实线箭头表示论文或官方资料明确支持的主流程。
