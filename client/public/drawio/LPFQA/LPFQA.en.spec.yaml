meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LPFQA Build and Evaluation Process
  description: >-
    Paper-v2 construction from expert-vetted professional-forum screenshots through VLM extraction, explicit validity
    and quality gates, question-type routing, domain-expert verification, pilot-model difficulty calibration, and the
    Appendix-B/Hugging-Face binary judge contract.
  legend: >-
    Solid arrows show the arXiv-v2 main flow; labeled branches show keep/discard decisions. Unconnected document cards
    are evidence or artifact boundaries, not process stages. Primary paper: arXiv:2511.06346v2 (2026-01-08). Official
    public artifact: m-a-p/LPFQA at revision 8bf9f2ee879396909f940b512c9239be121a2505. The paper-v2 contract has 430
    tasks, while that earlier public snapshot has 502 records and no published item mapping to the 430-task set.
