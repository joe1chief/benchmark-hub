meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LPFQA Build Process
  description: >-
    Paper-aligned three-stage construction from recent professional-forum screenshots through VLM/LLM structuring,
    expert verification, pilot-model difficulty calibration, and binary judge evaluation.
  legend: >-
    The diagram uses the paper's 430-task release. The official Hugging Face repository later expanded to 502 records;
    that later expansion is documented separately and is not back-projected into the paper pipeline.
nodes:
  - id: forum_curation
    label: |-
      Expert-curate Professional Forums
      Submit Domain, URL, and Sample Discussions
      Cross-review Specialization and Authenticity
      Keep Permitted or Non-prohibited Sources
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: crawl
    label: |-
      Crawl More Than 50 Vetted Forums
      More Than 2,000 Threads from Seven Months
      Require Posts after January 2025
      Cover Real Long-tail Professional Questions
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: screenshots
    label: |-
      Store Discussions as Screenshots
      Preserve Layout and Formatting
      Preserve Question–answer Relationships
      Avoid Loss from Heterogeneous Web Pages
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: vlm_extract
    label: |-
      Use a VLM for Structured Extraction
      Extract Question · Candidate Answers
      Capture Explanations and Context
      Map Content to Predefined Fields
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: llm_filter
    label: |-
      Apply LLM Answer-quality Filtering
      Remove Vague or Missing-answer Threads
      Remove Controversial or Incorrect Answers
      Require One Valid Unambiguous Answer
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: format
    label: |-
      Standardize Question Format
      Knowledge Tasks: One Correct plus 4–6 Distractors
      Reasoning or Calculation: Short Answer
      Rewrite for Clarity and Formal Rigor
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: candidates
    label: |-
      Retain About 1,000 Candidate Tasks
      Original Professional Grounding
      Rewritten Question and Reference Answer
      Domain and Question-type Metadata
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: expert_verify
    label: |-
      Perform Expert Manual Verification
      209-expert Project Panel
      Check Long-tail Value · Clarity · Correctness
      Discard Any Failing Task
    type: user
    size: xl
    position:
      x: 1700
      'y': 380
  - id: calibrate
    label: |-
      Calibrate Difficulty with Pilot Models
      Evaluate Each Item with 6–8 SOTA LLMs
      Use Model Pass Rate for Tier Assignment
      Remove Overly Trivial Items
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: release
    label: |-
      Release Paper LPFQA · 430 Tasks
      249 Multiple-choice · 181 Short-answer
      7 Primary · 21 Secondary Domains
      Easy 137 · Medium 133 · Hard 160
    type: database
    size: xl
    position:
      x: 1140
      'y': 380
  - id: judge
    label: |-
      Judge Each Model Answer
      Provide Question, Expert Reference, and Model Output
      Verify Final-answer Semantic Equivalence
      Binary Semantic-equivalence Verdict
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: report
    label: |-
      Report LPFQA Accuracy
      Mean Binary Correctness over 430 Tasks
      Primary-domain and Difficulty Breakdowns
      Analyze Knowledge and Reasoning Failures
    type: terminal
    size: xl
    position:
      x: 580
      'y': 380
edges:
  - from: forum_curation
    to: crawl
    type: primary
  - from: crawl
    to: screenshots
    type: primary
  - from: screenshots
    to: vlm_extract
    type: primary
  - from: vlm_extract
    to: llm_filter
    type: primary
  - from: llm_filter
    to: format
    type: primary
  - from: format
    to: candidates
    type: primary
  - from: candidates
    to: expert_verify
    type: primary
  - from: expert_verify
    to: calibrate
    type: primary
  - from: calibrate
    to: release
    type: primary
  - from: release
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
