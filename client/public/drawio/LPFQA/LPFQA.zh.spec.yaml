meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LPFQA 构建流程
  description: 对齐论文的三阶段构建流程，从近期专业论坛截图出发，经视觉与语言模型结构化、 专家验证、先导模型难度校准和二元评判完成。
  legend: 本图采用论文发布的 430 个任务。官方 Hugging Face 仓库后来扩展为 502 条记录； 后续扩展单独记录，不反向写入论文流程。
nodes:
  - id: forum_curation
    label: |-
      由专家整理专业论坛
      提交领域分类链接和讨论样例
      交叉审核专业性与真实性
      仅保留允许或未禁止使用的来源
    type: user
    size: xl
    position:
      x: 20
      'y': 40
  - id: crawl
    label: |-
      抓取 50 多个已审核论坛
      七个月内 2,000 多个讨论串
      要求帖子发布于 2025 年 1 月后
      覆盖真实专业长尾问题
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: screenshots
    label: |-
      将讨论保存为截图
      保留页面布局与格式
      保留问题答案关系
      避免异构网页转文本造成信息损失
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: vlm_extract
    label: |-
      使用视觉语言模型结构化抽取
      抽取问题与候选答案
      获取解释与上下文
      映射到预定义字段
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: llm_filter
    label: |-
      使用大模型过滤答案质量
      删除模糊或缺失答案讨论
      删除有争议或错误答案
      要求一个有效且无歧义的答案
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: format
    label: |-
      标准化问题格式
      知识题：一个正确项加 4–6 个干扰项
      推理或计算题：简答题
      重写以提高清晰性和形式严谨性
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: candidates
    label: |-
      保留约 1,000 个候选任务
      保留原始专业场景依据
      重写问题与参考答案
      添加领域和题型元数据
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: expert_verify
    label: |-
      执行专家人工验证
      项目专家组共 209 人
      检查长尾价值清晰度与正确性
      丢弃任何不合格任务
    type: user
    size: xl
    position:
      x: 1700
      'y': 380
  - id: calibrate
    label: |-
      使用先导模型校准难度
      每题交给 6–8 个前沿大模型
      根据模型通过率划分等级
      删除过于简单的任务
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: release
    label: |-
      发布论文版 LPFQA · 430 题
      249 道选择题 · 181 道简答题
      7 个一级 · 21 个二级领域
      简单 137 · 中等 133 · 困难 160
    type: database
    size: xl
    position:
      x: 1140
      'y': 380
  - id: judge
    label: |-
      评判每个模型答案
      提供问题专家参考答案与模型输出
      验证最终答案语义等价性
      输出二元语义等价判断
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: report
    label: |-
      汇报 LPFQA 准确率
      430 题二元正确性的平均值
      一级领域与难度等级拆分
      分析知识与推理错误
    type: terminal
    size: xl
    position:
      x: 580
      'y': 380
edges:
  - from: forum_curation
    to: crawl
    type: primary
  - from: crawl
    to: screenshots
    type: primary
  - from: screenshots
    to: vlm_extract
    type: primary
  - from: vlm_extract
    to: llm_filter
    type: primary
  - from: llm_filter
    to: format
    type: primary
  - from: format
    to: candidates
    type: primary
  - from: candidates
    to: expert_verify
    type: primary
  - from: expert_verify
    to: calibrate
    type: primary
  - from: calibrate
    to: release
    type: primary
  - from: release
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
