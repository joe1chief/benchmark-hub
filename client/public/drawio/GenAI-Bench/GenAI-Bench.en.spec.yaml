meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenAI-Bench Build Process
  description: Paper-aligned community preference collection, cleaning, release, and MLLM-judge evaluation flow for GenAI-Bench.
  legend: >-
    This is the GenAI-Arena preference benchmark from arXiv:2406.04485, not the separate 1,600-prompt compositional
    text-to-visual benchmark with the same name. Arena Elo ranks generators; GenAI-Bench accuracy evaluates judges.
nodes:
  - id: integrate
    label: |-
      Integrate 35 open generative models
      text-to-image · image editing · text-to-video
      standardize code, prompts, and fixed inference settings
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: prompts
    label: |-
      Build prompt and output pool
      live user prompts + ImagenHub/VBench samples
      precompute model outputs in GenAI-Museum
    type: process
    size: xl
    position:
      x: 340
      'y': 250
  - id: battle
    label: |-
      Run anonymous same-task battles
      randomly choose two model outputs
      present them side-by-side without identities
    type: process
    size: xl
    position:
      x: 640
      'y': 250
  - id: vote
    label: |-
      Collect four-way community votes
      left better · right better
      tie good · both bad
    type: process
    size: xl
    position:
      x: 940
      'y': 250
  - id: audit
    label: |-
      Audit human-vote quality
      authors review 350 sampled votes; 303 valid
      93.07% clearly or vaguely reasonable
    type: process
    size: xl
    position:
      x: 1240
      'y': 250
  - id: clean
    label: |-
      Clean arena votes with Llama Guard
      remove NSFW and technical failures
      retain task, prompt, output pair, models, and vote
    type: process
    size: xl
    position:
      x: 1540
      'y': 250
  - id: release
    label: |-
      Release GenAI-Bench preference pairs
      image generation 1,735 · editing 919
      video generation 1,069 · total 3,723
    type: database
    size: xl
    position:
      x: 1840
      'y': 250
  - id: judge
    label: |-
      Prompt an MLLM as the preference judge
      provide prompt plus the two generated contents
      require one of the same four exact labels
    type: process
    size: xl
    position:
      x: 2140
      'y': 250
  - id: score
    label: |-
      Exact-match MLLM vote to human vote
      report accuracy for three tasks and average
      random four-class baseline is about 25%
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 250
edges:
  - from: integrate
    to: prompts
    type: primary
  - from: prompts
    to: battle
    type: primary
  - from: battle
    to: vote
