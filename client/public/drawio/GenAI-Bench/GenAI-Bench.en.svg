11" x="0"><tspan>Parse first greedy [[.*]] match</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>accept A&gt;&gt;B/A&gt;B and B&gt;&gt;A/B&gt;A</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>tie: A=B or A=B=Good</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>both bad: A=B or A=B=Bad</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="520" y="304" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(620,334.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Mean boolean accuracy</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>each task + three-task average</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Bradley–Terry ranks are separate</tspan></text></g></g></g></g><g data-cell-id="12"><g><path d="M 200 25 L 246.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 254.32 25 L 246.82 28.75 L 246.82 21.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="13"><g><path d="M 456 25 L 510.82 25" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 518.32 25 L 510.82 28.75 L 510.82 21.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="14"><g><path d="M 720 25 L 766.82 25" fill="n