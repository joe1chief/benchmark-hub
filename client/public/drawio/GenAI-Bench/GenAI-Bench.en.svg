 · video</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>live + ImagenHub/VBench prompts</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="520" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(620,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Anonymous same-task pair battle</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>left / right / tie good / both bad</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>revealed identities discard the vote</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="776" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(876,17) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Filter and expert-audit votes</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>sample 350: 303 valid</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>17 NSFW · 30 technical</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>231 clear · 51 vague · 21 wrong</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>reasonable: 93.07%</tspan></text></g></g></g></g><g data-cell-id="6"><g><path d="M 1040 15 C 1040 6.72 1084.77 0 1140 0 C 1166.52 0 1191.96 1.58 1210.71 4.39 C 1229.46 7.21 1240 11.02 1240 15 L 1240 85 C 1240 93.28 1195.23 100 1140 100 C 1084.77 100 104