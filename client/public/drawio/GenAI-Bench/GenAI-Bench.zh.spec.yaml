meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenAI-Bench 构建流程
  description: 与论文一致的 GenAI-Bench 社区偏好收集、清洗、发布和 MLLM 裁判评测流程。
  legend: 本图对应 arXiv:2406.04485 的 GenAI-Arena 偏好基准，而不是另一个含 1,600 提示词的同名组合式文生视觉基准。 Arena 的 Elo 排生成模型，GenAI-Bench 的准确率则评估裁判模型。
nodes:
  - id: integrate
    label: |-
      集成 35 个开源生成模型
      文生图 · 图像编辑 · 文生视频
      统一代码、提示和固定推理设置
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: prompts
    label: |-
      构建提示与输出池
      实时用户提示 + ImagenHub/VBench 样本
      在 GenAI-Museum 预计算模型输出
    type: process
    size: xl
    position:
      x: 340
      'y': 250
  - id: battle
    label: |-
      运行同任务匿名对战
      随机选择两个模型输出
      隐藏模型身份并排展示
    type: process
    size: xl
    position:
      x: 640
      'y': 250
  - id: vote
    label: |-
      收集四类社区投票
      左侧更好 · 右侧更好
      同样好 · 两者都差
    type: process
    size: xl
    position:
      x: 940
      'y': 250
  - id: audit
    label: |-
      审核人工投票质量
      作者复核 350 个样本，303 个有效
      93.07% 明显合理或基本合理
    type: process
    size: xl
    position:
      x: 1240
      'y': 250
  - id: clean
    label: |-
      使用 Llama Guard 清洗 Arena 投票
      删除 NSFW 和技术失败样本
      保留任务、提示、输出对、模型和投票
    type: process
    size: xl
    position:
      x: 1540
      'y': 250
  - id: release
    label: |-
      发布 GenAI-Bench 偏好对
      图像生成 1,735 · 图像编辑 919
      视频生成 1,069 · 合计 3,723
    type: database
    size: xl
    position:
      x: 1840
      'y': 250
  - id: judge
    label: |-
      提示 MLLM 充当偏好裁判
      输入提示和两个生成内容
      必须返回相同四类标签之一
    type: process
    size: xl
    position:
      x: 2140
      'y': 250
  - id: score
    label: |-
      将 MLLM 投票与人工投票精确匹配
      报告三项任务准确率及平均值
      四分类随机基线约为 25%
    type: terminal
    size: xl
    position:
      x: 2440
      'y': 250
edges:
  - from: integrate
    to: prompts
    type: primary
  - from: prompts
    to: battle
    type: primary
  - from: battle
    to: vote
    type: primary
  - from: vote
    to: audit
    type: primary
  - from: audit
    to: clean
    type: primary
  - from: clean
    to: release
    type: primary
  - from: release
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
modules: []
