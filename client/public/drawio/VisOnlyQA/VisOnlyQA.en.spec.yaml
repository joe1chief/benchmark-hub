meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisOnlyQA — Real/Synthetic Construction and Evaluation
  description: >-
    VisOnlyQA keeps separate real and synthetic factories. Humans author new questions over figures from MathVista,
    MMMU, ChartQA, and CharXiv, and a second annotator verifies every pair; annotators balance option labels, options
    are shuffled, and true/false questions receive negative counterparts. A manual audit of 100 randomly selected
    Eval-Real items found all valid. Independently, SyntheticGeometry, CLEVR, and SuperCLEVR metadata are processed by
    exact Python programs and templates without an LLM to produce Eval-Synthetic and Train. Version 3 releases 900 real
    and 700 synthetic evaluation items plus 70k synthetic training items.
  legend: >-
    Source: arXiv:2412.00947v3, Sections 3.1-3.3 (pp.4-5), Section 4 (p.6), and Appendix C (p.23); official repository:
    https://github.com/psunlpgroup/VisOnlyQA. Pin v3 counts (1,600 evaluation items), not the older 1,200-item
    description.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
