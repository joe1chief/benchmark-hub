meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisOnlyQA — 真实/合成数据构建与评测
  description: >-
    VisOnlyQA 保持真实与合成两条独立产线。人工基于 MathVista、MMMU、ChartQA、CharXiv 图像新编问题，每组问答均由第二名标注员核验；标注员平衡选项标签，选项会打乱，真假题还生成否定版本。对
    Eval-Real 随机抽取 100 题的人工审计全部有效。另一条产线独立使用 Python 精确处理 SyntheticGeometry、CLEVR、SuperCLEVR 元数据并套用模板，全程不使用 LLM，生成
    Eval-Synthetic 与 Train。v3 发布 900 道真实评测题、700 道合成评测题和 7 万道合成训练题。
  legend: >-
    来源：arXiv:2412.00947v3, Sections 3.1-3.3 (pp.4-5), Section 4 (p.6), and Appendix C (p.23); official repository:
    https://github.com/psunlpgroup/VisOnlyQA. Pin v3 counts (1,600 evaluation items), not the older 1,200-item
    description.。实线箭头表示论文或官方资料明确支持的主流程。
