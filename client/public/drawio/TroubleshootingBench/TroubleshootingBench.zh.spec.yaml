meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TroubleshootingBench 构建与评测流程
  description: >-
    TroubleshootingBench要求具有相关领域博士学位的湿实验专家转录自己实际做过、且网上不可获得的逐步生物实验方案；若受论文启发，必须显著修改多个步骤。每份方案列出必要设备和试剂。专家通过引入真实执行错误并描述失败结果，为每份方案编写3道简答题，重点考察动手操作中的隐性知识。100多份投稿经过跨专家质检和人工筛选，保留52份方案、156道题。12名独立相关领域博士专家在每方案1题的52题diamond
    set上建立人类基线，模型回答同一题集；以专家第80百分位得分作为指示阈值，论文结果附bootstrap 95%置信区间。
  legend: >-
    来源：OpenAI gpt-oss Model Safety paper Appendix A; official OpenAI Deployment Safety Hub TroubleshootingBench
    description。实线箭头表示论文或官方资料明确支持的主流程。
