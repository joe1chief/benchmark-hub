meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CommonEval Build and Evaluation Process
  description: >-
    Paper-aligned workflow for CommonEval, the 200-item real-speech open-ended QA subset of VoiceBench.
    Information-seeking questions are manually collected from Mozilla Common Voice recordings, then evaluated in paired
    text and speech settings.
  legend: Solid arrows trace construction and the paired input settings; both branches share the same content-quality judge.
