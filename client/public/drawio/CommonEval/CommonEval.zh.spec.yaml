  - from: collect
    to: release
    type: primary
  - from: release
    to: text_input
    type: primary
  - from: release
    to: speech_input
    type: primary
  - from: text_input
    to: assistant
    type: primary
  - from: speech_input
    to: assistant
    type: primary
  - from: assistant
    to: judge
    type: primary
  - from: judge
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
