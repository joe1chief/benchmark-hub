meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CommonEval 构建与评测流程
  description: 按论文还原 CommonEval：它是 VoiceBench 中包含 200 条真人语音的开放式问答子集。研究者从 Mozilla Common Voice 录音中 人工收集信息寻求类问题，再在文本与语音两种设置下配对评测。
  legend: 实线表示数据构建和两种输入设置；两条分支共用同一个内容质量评估器。
nodes:
  - id: commonvoice
    label: |-
      Mozilla Common Voice
      多样说话人与个人设备
      真实录音条件
    type: database
    size: xl
    position:
      x: 40
      'y': 190
  - id: collect
    label: |-
      人工收集
      识别信息寻求类问题
      保留真人录制语音
    type: user
    size: xl
    position:
      x: 320
      'y': 190
  - id: dataset
    label: |-
      VoiceBench 中的 CommonEval
      200 道开放式问答
      平均 8.06 词 / 4.83 秒音频
    type: database
    size: xl
    position:
      x: 600
      'y': 190
  - id: identity
    label: 真人语音子集
    type: decision
    size: xl
    position:
      x: 880
      'y': 190
  - id: text_input
    label: |-
      文本设置
      输入标准文本指令
    type: document
    size: xl
    position:
      x: 1160
      'y': 70
  - id: speech_input
    label: |-
      语音设置
      输入原始真人语音指令
    type: document
    size: xl
    position:
      x: 1160
      'y': 310
  - id: assistant
    label: |-
      语音助手生成回答
      端到端音频模型或 ASR + LLM
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: content
    label: |-
      评估文本回答内容
      不评分语音输出质量
    type: process
    size: xl
    position:
      x: 1720
      'y': 190
  - id: judge
    label: |-
      GPT-4o-mini 评估器
      对照标准指令
      将回答质量评为 1 到 5 分
    type: process
    size: xl
    position:
      x: 2000
      'y': 190
  - id: report
    label: |-
      报告 CommonEval GPT 得分
      比较文本、语音及处理差距
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 190
edges:
  - from: commonvoice
    to: collect
    type: primary
  - from: collect
    to: dataset
    type: primary
  - from: dataset
    to: identity
    type: primary
  - from: identity
    to: text_input
    type: primary
  - from: identity
    to: speech_input
    type: primary
  - from: text_input
    to: assistant
    type: primary
  - from: speech_input
    to: assistant
    type: primary
  - from: assistant
    to: content
    type: primary
  - from: content
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
