meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CommonEval 构建与评测流程
  description: 对 VoiceBench 中 200 条真人录音 CommonEval 子集进行版本钉住，并展示文本/语音双设置和官方三次采样 GPT 裁判聚合。
  legend: 实线表示标准构建与评测；两条输入模态分支共用同一回答评测链。
nodes:
  - id: evidence
    label: |-
      VoiceBench arXiv:2410.17196v3
      代码 d9c570e / 数据 b02edce
      Parquet SHA256 3a02af9…
    type: document
    size: xl
    position:
      x: 40
      'y': 190
  - id: commonvoice
    label: |-
      Mozilla Common Voice
      多样说话人使用个人设备
      真实场景真人录音
    type: database
    size: xl
    position:
      x: 320
      'y': 190
  - id: collect
    label: |-
      人工收集
      筛选信息寻求类问题
      保留原始真人语音
    type: user
    size: xl
    position:
      x: 600
      'y': 190
  - id: release
    label: |-
      CommonEval test：200 条真人录音
      平均 8.06 词 / 4.83 秒音频
      标准集合非合成 TTS
    type: database
    size: xl
    position:
      x: 880
      'y': 190
  - id: text_input
    label: |-
      文本设置
      标准文本指令
    type: document
    size: xl
    position:
      x: 1160
      'y': 50
  - id: speech_input
    label: |-
      语音设置
      原始真人音频指令
    type: document
    size: xl
    position:
      x: 1160
      'y': 330
  - id: assistant
    label: |-
      语音助手生成回答
      端到端音频模型或 ASR + LLM
      保留文本回答内容
    type: process
    size: xl
    position:
      x: 1440
      'y': 190
  - id: judge
    label: |-
      论文裁判：gpt-4o-mini-2024-07-18
      按指令对内容打 1–5 分
      采样 3 次；温度 0.5；top_p 0.95
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: aggregate
    label: |-
      每题 3 次评分取均值
      再对 200 题取平均
      官方 Open Evaluator
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: report
    label: |-
      报告文本与语音得分
      处理差距；仅评价回答内容
      不评价语音输出质量
    type: terminal
    size: xl
    position:
      x: 880
      'y': 500
edges:
  - from: evidence
    to: commonvoice
    type: primary
  - from: commonvoice
    to: collect
