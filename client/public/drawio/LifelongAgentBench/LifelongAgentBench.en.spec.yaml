meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LifelongAgentBench Build Process
  description: >-
    Paper-aligned construction of skill-grounded, interdependent task streams in database, operating-system, and
    knowledge-graph environments, followed by strict-order experience replay and group self-consistency evaluation.
  legend: >-
    The three branches are real benchmark environments. Tasks must execute sequentially; only successful recent
    trajectories enter the replay memory used by the evaluated agent.
nodes:
  - id: skills
    label: |-
      Define Atomic Environment Skills
      Database · 22 SQL Skills
      Operating System · 29 Bash Commands
      Knowledge Graph · 7 Logical Operations
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: sample
    label: |-
      Sample Skill-grounded Task Plans
      Boost Rare Skills Probabilistically
      Vary Complexity · Noise · Skill Overlap
      Preserve Inter-task Dependencies
    type: process
    size: xl
    position:
      x: 300
      'y': 260
  - id: db_tasks
    label: |-
      Build Database Tasks
      DeepSeek-R1 Uses Sampled SQL Skills
      Initialize Tables in Fresh Dockerized MySQL
      Query · Insert · Delete · Update
    type: process
    size: xl
    position:
      x: 580
      'y': 20
  - id: db_verify
    label: |-
      Verify Database Labels
      Execute Generated SQL in MySQL
      Compare Query Results for Read Tasks
      Hash Database State for Write Tasks
    type: process
    size: xl
    position:
      x: 900
      'y': 20
  - id: os_tasks
    label: |-
      Build Operating-system Tasks
      Use an Ubuntu Container Environment
      Compose Bash-command Skill Sequences
      Reset from the Original Image per Task
    type: process
    size: xl
    position:
      x: 580
      'y': 260
  - id: os_verify
    label: |-
      Verify Operating-system Labels
      Execute the Expected Bash Workflow
      Run a Task-specific Evaluation Script
      Accept Only a Zero Exit Status
    type: process
    size: xl
    position:
      x: 900
      'y': 260
  - id: kg_tasks
    label: |-
      Build Knowledge-graph Tasks
      Start from GrailQA S-expressions
      Map Logical Forms to Agent Actions
      Produce SPARQL-compatible Operations
    type: process
    size: xl
    position:
      x: 580
      'y': 500
  - id: kg_verify
    label: |-
      Verify Knowledge-graph Labels
      Execute the Logical Action Sequence
      Compare Returned SPARQL Outputs
      Retain Reproducible Answer States
    type: process
    size: xl
    position:
      x: 900
      'y': 500
  - id: stream
    label: |-
      Package Unified Lifelong Task Streams
      Shared Agent · Environment · Controller APIs
      Enforce Strict Sequential Execution
      Manually Review a 10% Task Sample
    type: database
    size: xl
    position:
      x: 1220
      'y': 260
  - id: replay
    label: |-
      Evaluate Experience Replay
      Baseline with No Retrieved Experience
      Replay Recent 1 · 4 · 8 · 16 · 32 · 64
      Store Only Successful Trajectories
    type: process
    size: xl
    position:
      x: 1500
      'y': 260
  - id: gsc
    label: |-
      Apply Group Self-consistency
      Partition Retrieved Experiences into Groups
      Predict Independently per Group
      Majority-vote to Reduce Tokens and OOM
    type: process
    size: xl
    position:
      x: 1780
      'y': 260
  - id: report
    label: |-
      Report Lifelong-agent Success
      Task Success Requires Correct Action Completion
      Break Down DB · OS · KG Environments
      Compare Replay Depth · Groups · Token Cost
    type: terminal
    size: xl
    position:
      x: 2060
      'y': 260
