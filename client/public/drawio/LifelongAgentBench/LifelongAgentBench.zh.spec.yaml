meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LifelongAgentBench 构建流程
  description: 对齐论文，在数据库、操作系统和知识图谱三种环境中构建技能驱动且相互依赖的任务流， 再按严格顺序执行经验回放与分组自一致性评测。
  legend: 三条分支对应真实评测环境。任务必须顺序执行；只有近期成功轨迹会进入被测智能体使用的回放记忆。
nodes:
  - id: skills
    label: |-
      定义环境原子技能
      数据库 · 22 项 SQL 技能
      操作系统 · 29 个 Bash 命令
      知识图谱 · 7 种逻辑操作
    type: database
    size: xl
    position:
      x: 20
      'y': 260
  - id: sample
    label: |-
      采样技能驱动的任务计划
      以概率机制提升稀有技能占比
      改变复杂度 · 噪声 · 技能重叠
      保留任务间依赖关系
    type: process
    size: xl
    position:
      x: 300
      'y': 260
  - id: db_tasks
    label: |-
      构建数据库任务
      DeepSeek-R1 使用采样 SQL 技能造题
      在全新 Docker MySQL 中初始化表
      查询 · 插入 · 删除 · 更新任务
    type: process
    size: xl
    position:
      x: 580
      'y': 20
  - id: db_verify
    label: |-
      校验数据库标签
      在 MySQL 中执行生成的 SQL
      读取任务比较查询结果
      写入任务哈希数据库状态
    type: process
    size: xl
    position:
      x: 900
      'y': 20
  - id: os_tasks
    label: |-
      构建操作系统任务
      使用 Ubuntu 容器环境
      组合 Bash 命令技能序列
      每个任务从原始镜像重置
    type: process
    size: xl
    position:
      x: 580
      'y': 260
  - id: os_verify
    label: |-
      校验操作系统标签
      执行预期 Bash 工作流
      运行任务专属评估脚本
      仅接受退出码为 0
    type: process
    size: xl
    position:
      x: 900
      'y': 260
  - id: kg_tasks
    label: |-
      构建知识图谱任务
      从 GrailQA S-expression 出发
      将逻辑形式映射为智能体动作
      生成兼容 SPARQL 的操作
    type: process
    size: xl
    position:
      x: 580
      'y': 500
  - id: kg_verify
    label: |-
      校验知识图谱标签
      执行逻辑动作序列
      比较返回的 SPARQL 输出
      保留可复现的答案状态
    type: process
    size: xl
    position:
      x: 900
      'y': 500
  - id: stream
    label: |-
      打包统一的终身任务流
      共用智能体 · 环境 · 控制器接口
      强制按严格顺序执行
      人工复核 10% 的任务样本
    type: database
    size: xl
    position:
      x: 1220
      'y': 260
  - id: replay
    label: |-
      评测经验回放
      设置不检索经验的基线
      回放近期 1 · 4 · 8 · 16 · 32 · 64 条经验
      只保存成功轨迹
    type: process
    size: xl
    position:
      x: 1500
      'y': 260
  - id: gsc
    label: |-
      应用分组自一致性
      将检索经验划分成多个组
      各组独立预测
      以多数投票降低 Token 与 OOM
    type: process
    size: xl
    position:
      x: 1780
      'y': 260
  - id: report
    label: |-
      汇报终身智能体成功率
      正确执行动作并完成任务才算成功
      按数据库 · 操作系统 · 知识图谱拆分
      比较回放深度 · 分组数 · Token 成本
    type: terminal
    size: xl
    position:
      x: 2060
      'y': 260
edges:
  - from: skills
    to: sample
    type: primary
  - from: sample
    to: db_tasks
    type: primary
  - from: sample
    to: os_tasks
    type: primary
  - from: sample
    to: kg_tasks
    type: primary
  - from: db_tasks
    to: db_verify
    type: primary
  - from: os_tasks
    to: os_verify
    type: primary
  - from: kg_tasks
    to: kg_verify
    type: primary
  - from: db_verify
    to: stream
    type: primary
  - from: os_verify
    to: stream
    type: primary
  - from: kg_verify
    to: stream
    type: primary
  - from: stream
    to: replay
    type: primary
  - from: replay
    to: gsc
    type: primary
  - from: gsc
    to: report
    type: primary
modules: []
