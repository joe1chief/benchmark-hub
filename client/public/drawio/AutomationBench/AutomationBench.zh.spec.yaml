meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutomationBench 论文对齐构建流程
  description: 依据 AutomationBench v1，展示工作流形态聚类、分配到六个预定义领域、模拟 API 与严格评测。
  legend: 官方基准分数严格全有或全无；部分完成度仅作为训练或诊断旁注，绝不进入排行榜分数。
nodes:
  - id: workflow_patterns
    label: |-
      收集工作流模式
      抽象交互形态
      移除客户特定数据
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: cluster_shapes
    label: |-
      聚类工作流模式形态
      归并相似动作图
      保留多样结构
    type: process
    size: xl
    position:
      x: 320
      'y': 180
  - id: assign_domains
    label: |-
      分配到六个预定义业务领域
      销售 • 营销 • 支持
      运营 • 财务 • 人力资源
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: task_generation
    label: |-
      生成候选任务
      加入应用与约束
      保留工作流形态
    type: process
    size: xl
    position:
      x: 880
      'y': 180
  - id: hardening
    label: |-
      加固并验证任务
      干扰项 • 隐藏状态
      检查确定性奖励
    type: process
    size: xl
    position:
      x: 1160
      'y': 180
  - id: api_world
    label: |-
      构建模拟 API 世界
      约 500 个端点
      覆盖 47 个应用
    type: database
    size: xl
    position:
      x: 1440
      'y': 180
  - id: release
    label: |-
      发布 600 个公开任务
      600+ 个留出任务
      覆盖全部六个领域
    type: database
    size: xl
    position:
      x: 1720
      'y': 180
  - id: agent_run
    label: |-
      运行一条自主请求
      搜索并调用 API
      持久化跨应用变更
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: end_state
    label: |-
      检查最终世界状态
      正向与负向断言
      拒绝撒网式操作
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: official_score
    label: |-
      官方全有或全无评分
      全部断言必须通过
      基准分数无部分得分
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: partial_note
    label: |-
      部分得分仅为旁注
      仅用于训练与诊断
      不计入官方分数
    type: document
    size: xl
    position:
      x: 1160
      'y': 800
  - id: report
    label: |-
      报告严格任务通过率
      私有集排行榜
      记录平均成本
    type: terminal
    size: xl
    position:
      x: 880
      'y': 520
edges:
  - from: workflow_patterns
    to: cluster_shapes
    type: primary
  - from: cluster_shapes
    to: assign_domains
    type: primary
  - from: assign_domains
    to: task_generation
    type: primary
  - from: task_generation
    to: hardening
    type: primary
  - from: hardening
    to: api_world
    type: primary
  - from: api_world
    to: release
    type: primary
  - from: release
    to: agent_run
    type: primary
  - from: agent_run
    to: end_state
    type: primary
  - from: end_state
    to: official_score
    type: primary
  - from: official_score
    to: partial_note
    type: optional
    label: 仅诊断
  - from: official_score
    to: report
    type: primary
modules: []
