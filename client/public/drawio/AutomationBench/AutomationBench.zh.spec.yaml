meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutomationBench 构建流程
  description: 基于 arXiv:2604.18934，展示 Zapier 跨应用 REST API 工作流基准的论文对齐构建与评测流程。
  legend: 实线表示任务构建与执行；虚线传递 API 结构、保存的世界状态和确定性验证合同。
nodes:
  - id: workflow_patterns
    label: |-
      提取真实工作流模式
      来自 Zapier Agent 负反馈的流程形态
      不使用 PII 或客户机密数据
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: domain_clusters
    label: |-
      聚类六类业务领域
      销售 • 营销 • 运营
      支持 • 财务 • 人力资源
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: task_generation
    label: |-
      合成候选任务
      Opus 4.6 • GPT-5.3 Codex • Gemini 3
      多轮改进真实性、难度与应用多样性
    type: process
    size: xl
    position:
      x: 320
      'y': 220
  - id: hardening
    label: |-
      加固过易任务
      干扰数据 • 隐藏信息 • 近似名称
      带优先级覆盖的分层业务策略
    type: process
    size: xl
    position:
      x: 320
      'y': 400
  - id: task_contract
    label: |-
      强制任务合同
      可观察状态变更 • 确定性检查
      结构化决策 • 单条自主指令
    type: document
    size: xl
    position:
      x: 600
      'y': 220
  - id: qc
    label: |-
      验证可解性与奖励
      提示模式 • 抽样检查 • 重复审计
      用强化学习发现奖励投机策略
    type: decision
    size: xl
    position:
      x: 880
      'y': 400
  - id: api_catalog
    label: |-
      复刻公开 API 形态
      47 个应用约 500 个端点
      分页 • 必填字段 • 常见 4xx 错误
    type: database
    size: xl
    position:
      x: 880
      'y': 40
  - id: simulated_world
    label: |-
      构建模拟应用世界
      Pydantic 模型作为状态真值
      虚构 CRM、邮箱、日历等数据
    type: database
    size: xl
    position:
      x: 880
      'y': 220
  - id: release
    label: |-
      发布 AutomationBench
      600 个公开任务 • 每领域 100 个
      600+ 个额外加固的私有留出任务
    type: database
    size: xl
    position:
      x: 1160
      'y': 220
  - id: agent_input
    label: |-
      启动全新任务世界
      只给一条自然语言请求
      不允许澄清 • 最多 50 步
    type: document
    size: xl
    position:
      x: 1440
      'y': 40
  - id: search_execute
    label: |-
      Agent 自主发现并调用 API
      BM25 Search 返回前 5 个结构
      Execute 发送方法、URL 与请求体
    type: process
    size: xl
    position:
      x: 1440
      'y': 220
  - id: app_state
    label: |-
      协调跨应用工作流
      读取策略与干扰记录
      持久化创建、更新、消息和事件
    type: database
    size: xl
    position:
      x: 1440
      'y': 400
  - id: end_state
    label: |-
      只检查最终世界状态
      正向与负向精确断言
      不限制调用顺序但拒绝撒网式操作
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: score
    label: |-
      应用全有或全无任务分数
      正式分数不提供部分得分
      另行记录诊断性完成度
    type: process
    size: xl
    position:
      x: 2000
      'y': 220
  - id: report
    label: |-
      发布私有集排行榜
      严格任务通过率 • 平均美元成本
      公开集用于研究与复现
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 220
edges:
  - from: workflow_patterns
    to: domain_clusters
    type: primary
  - from: domain_clusters
    to: task_generation
    type: primary
  - from: task_generation
    to: hardening
    type: primary
  - from: hardening
    to: task_contract
    type: primary
  - from: task_contract
    to: qc
    type: primary
  - from: task_contract
    to: simulated_world
    type: primary
  - from: api_catalog
    to: simulated_world
    type: data
  - from: simulated_world
    to: release
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: agent_input
    type: primary
  - from: agent_input
    to: search_execute
    type: primary
  - from: api_catalog
    to: search_execute
    type: data
  - from: search_execute
    to: app_state
    type: primary
  - from: app_state
    to: search_execute
    type: data
  - from: app_state
    to: end_state
    type: primary
  - from: qc
    to: end_state
    type: data
  - from: end_state
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
