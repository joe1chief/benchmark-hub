meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutomationBench Paper-Aligned Build Process
  description: >-
    Workflow-shape clustering, assignment to six predefined domains, simulated APIs, and strict evaluation aligned with
    AutomationBench v1.
  legend: >-
    The official benchmark score is all-or-nothing. Partial completion is retained only as a training or diagnostic
    aside and never enters the leaderboard score.
nodes:
  - id: workflow_patterns
    label: |-
      Gather Workflow Patterns
      Abstract Interaction Shapes
      Remove Customer-Specific Data
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: cluster_shapes
    label: |-
      Cluster Workflow-Pattern Shapes
      Group Similar Action Graphs
      Retain Diverse Structures
    type: process
    size: xl
    position:
      x: 320
      'y': 180
  - id: assign_domains
    label: |-
      Assign to Six Predefined Domains
      Sales • Marketing • Support
      Operations • Finance • HR
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: task_generation
    label: |-
      Generate Candidate Tasks
      Add Apps and Constraints
      Preserve Workflow Shape
    type: process
    size: xl
    position:
      x: 880
      'y': 180
  - id: hardening
    label: |-
      Harden and Validate Tasks
      Distractors • Hidden State
      Check Deterministic Rewards
    type: process
    size: xl
    position:
      x: 1160
      'y': 180
  - id: api_world
    label: |-
      Build Simulated API Worlds
      About 500 Endpoints
      47 Applications
    type: database
    size: xl
    position:
      x: 1440
      'y': 180
  - id: release
    label: |-
      Release 600 Public Tasks
      600+ Held-Out Tasks
      Cover All Six Domains
    type: database
    size: xl
    position:
      x: 1720
      'y': 180
  - id: agent_run
    label: |-
      Run One Autonomous Request
      Search and Call APIs
      Persist Cross-App Changes
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: end_state
    label: |-
      Inspect Final World State
      Positive + Negative Assertions
      Reject Shotgun Actions
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: official_score
    label: |-
      Official All-or-Nothing Score
      All Assertions Must Pass
      No Partial Benchmark Credit
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: partial_note
    label: |-
      Partial Credit Is an Aside
      Training and Diagnostic Only
      Excluded from Official Score
    type: document
    size: xl
    position:
      x: 1160
      'y': 800
  - id: report
    label: |-
      Report Strict Task Pass Rate
      Private-Set Leaderboard
      Track Average Cost
    type: terminal
    size: xl
    position:
      x: 880
      'y': 520
edges:
  - from: workflow_patterns
    to: cluster_shapes
    type: primary
  - from: cluster_shapes
    to: assign_domains
    type: primary
  - from: assign_domains
    to: task_generation
    type: primary
  - from: task_generation
    to: hardening
    type: primary
  - from: hardening
    to: api_world
    type: primary
  - from: api_world
    to: release
    type: primary
  - from: release
    to: agent_run
    type: primary
  - from: agent_run
    to: end_state
    type: primary
  - from: end_state
    to: official_score
    type: primary
  - from: official_score
    to: partial_note
    type: optional
    label: Diagnostic only
  - from: official_score
    to: report
    type: primary
modules: []
