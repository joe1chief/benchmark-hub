    label: |-
      固定一手证据
      Mythos Preview 卡 · 2026-04-07
      Opus 4.8 与 Sonnet 5 卡
      2026-07-21 核验
    type: document
    size: xl
    position:
      x: 24
      'y': 320
  - id: private_arena
    label: |-
      识别私有 LinuxBench
      由 Redwood Research 构建并私下共享
      AI 控制竞技场
      并非公开基准发布
    type: database
    size: xl
    position:
      x: 360
      'y': 320
  - id: known_unit
    label: |-
      仅保留已披露核心
      主任务加副任务
      高风险软件环境
      精确配对合同未公开
    type: process
    size: xl
    position:
      x: 696
      'y': 320
  - id: construction_gap
    label: |-
      将构造标为未公开
      任务来源与编写方式未知
      环境设计与技术栈未知
      不得套用 LinuxArena 方法
    type: process
    size: xl
    position:
      x: 1032
      'y': 320
  - id: qc_gap
    label: |-
      将规模、切分与质控标为未知
      LinuxBench 本体规模未发布
      无 train/dev/test 合同
      无验证或过滤合同
    type: process
    size: xl
    position:
      x: 1368
      'y': 320
  - id: eval_gap
    label: |-
      将评测协议标为未知
      提示词与工具未发布
      解析器与评分器未发布
      官方指标未发布
    type: process
    size: xl
    position:
      x: 1704
      'y': 320
  - id: private_status
    label: |-
      保留私有制品边界
      无公开 LinuxBench 仓库或数据
      无已发布许可或版本
      无官方排行榜
    type: database
    size: xl
    position:
      x: 2040
      'y': 320
  - id: minimal_boundary
    label: |-
      分离 Anthropic 改编
      改编 1,948 个主副任务对
      随机 200 对形成 Minimal 子集
      不属于 LinuxBench 构建流程
    type: document
    size: xl
    position:
      x: 672
      'y': 640
  - id: minimal_drift
    label: |-
      记录 Minimal 评测漂移
      200 对中少量在评测前失败
      后续基础设施改变任务集合
      约 170 个任务可同集比较
    type: document
    size: xl
    position:
      x: 1368
      'y': 640
  - id: lineage_boundary
    label: |-
      记录公开发布谱系
      后续系统卡使用 LinuxArena 子集
      此前称 Minimal-LinuxBench
      LinuxBench 快照等价未证
    type: document
    size: xl
    position:
      x: 672
      'y': 0
  - id: decision
    label: |-
      发布历史边界记录
      不复制 Minimal-LinuxBench
      不复制 LinuxArena
      明确保留未知项
    type: terminal
    size: xl
    position:
      x: 2376
      'y': 320
