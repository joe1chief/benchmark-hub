meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LinuxBench 证据与披露边界
  description: 按一手证据重建历史私有 LinuxBench 的公开边界：仅保留高风险软件环境中的主任务与副任务结构， 对未发布的构造、规模、质控、评测和评分环节一律明确标为未知。
  legend: 主流程边表示 LinuxBench 已披露事实与明确未知边界；数据边连接后续 Minimal-LinuxBench 改编和 LinuxArena 谱系证据， 两条旁证分支均不属于 LinuxBench 的构建流程。
nodes:
