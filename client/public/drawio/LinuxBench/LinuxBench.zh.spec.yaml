meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LinuxBench / Minimal-LinuxBench 构建流程
  description: 按 Claude Mythos Preview 系统卡公开边界，从私有 LinuxBench 任务对中采样， 运行三种受监控攻击提示，并测量隐蔽完成副任务的风险。
  legend: >-
    LinuxBench 是 Redwood Research 的私有 AI 控制竞技场，没有公开构建论文。系统卡披露 1,948 个主/副任务对， 并随机抽取 200 对形成
    Minimal-LinuxBench；本图不推测未公开的上游细节。
nodes:
  - id: private_source
    label: |-
      从私有 LinuxBench 出发
      Redwood Research AI 控制竞技场
      配对有用主任务与有害副任务
      上游构建细节未公开
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: pair_pool
    label: |-
      使用系统卡披露的任务池
      共 1,948 个主任务—副任务对
      Linux 环境执行智能体动作
      保留任务专属成功信号
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: sample
    label: |-
      创建 Minimal-LinuxBench
      随机抽取 200 个任务对
      同时保留主目标与隐藏副目标
      用于部署风险测试
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: precheck
    label: |-
      初始化并预检每个任务
      少量任务在评测前失败
      有效样本数略低于 200
      仍保留论文披露的 200 对口径
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: model
    label: |-
      运行 Claude Mythos Preview
      不启用扩展思考
      向智能体提供主目标与副目标
      记录完整工具使用轨迹
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: prompts
    label: |-
      评测三种攻击系统提示词
      均明确整段轨迹会被监控
      三种提示相似但独立运行
      鼓励隐蔽完成副任务
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: transcript
    label: |-
      组装监控器输入
      提供完整交互轨迹
      包含可见的助手推理轮次
      包含工具调用与环境返回
    type: document
    size: xl
    position:
      x: 1700
      'y': 40
  - id: monitors
    label: |-
      比较轨迹监控器
      早期部署使用 no-CoT 监控器
      当前评测使用 without-CoT 监控器
      对比旧检查点与 helpful-only 模型
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: outcomes
    label: |-
      判定主任务 · 副任务 · 检出结果
      检查副任务是否完成
      检查监控器是否告警
      记录拒绝与执行失败
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: score
    label: |-
      计算成功隐蔽完成率
      攻击必须完成副任务
      同一次运行还必须避开监控告警
      比例越高表示部署风险越高
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: report
    label: |-
      汇报 Minimal-LinuxBench 结果
      Mythos Preview 完成 69/200 个副任务
      比较三种提示词与监控器变体
      给出 Wilson 95% 置信区间
    type: terminal
    size: xl
    position:
      x: 860
      'y': 380
edges:
  - from: private_source
    to: pair_pool
    type: primary
  - from: pair_pool
    to: sample
    type: primary
  - from: sample
    to: precheck
    type: primary
  - from: precheck
    to: prompts
    type: primary
  - from: prompts
    to: model
    type: primary
  - from: model
    to: transcript
    type: primary
  - from: transcript
    to: monitors
    type: primary
  - from: monitors
    to: outcomes
    type: primary
  - from: outcomes
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
