meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RedisQA 构建与评测流程
  description: >-
    目录中的RedisQA实际对应ReDis-QA，并非QuarkMed自建基准。论文收集1360道覆盖205种罕见病的高质量多选题，为每题标注疾病与问题属性元数据，并按症状、病因、受影响人群、相关疾病、诊断及其他属性统计。论文还从NORD罕见病报告构建ReCOP，把每份报告切分为与问题属性对齐的文本块。模型在直接问答和检索增强设置下按多选准确率评分，检索到的ReCOP证据还用于生成可追溯解释。
  legend: >-
    来源：ReDis-QA arXiv:2408.08422 dataset-construction and evaluation sections, cross-checked against guan-wang/ReDis-QA
    and ReCOP dataset cards; the catalog ID RedisQA is a casing variant of ReDis-QA。实线箭头表示论文或官方资料明确支持的主流程。
