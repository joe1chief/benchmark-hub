meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AetherCode Build Process
  description: >-
    Paper-aligned curation of premier OI and ICPC problems, human-solution-backed test construction, expert auditing,
    and four-sample evaluation.
  legend: Read the curation row left-to-right, then the test-quality and evaluation row right-to-left.
nodes:
  - id: competitions
    label: |-
      Premier Competition Sources
      OI: IOI / NOI / USACO
      ICPC: World Finals / Regionals / CCPC
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: statements
    label: |-
      Standardize Problem Packages
      PDF to Markdown + LaTeX
      Manual Proofreading + Metadata
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: solutions
    label: |-
      Human Solution Corpus
      More Than 30,000 Submissions
      At Least 5 Correct per Problem
      At Least 20 Incorrect per Problem
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: categorize
    label: |-
      Categorize and Screen Problems
      Difficulty / Year / Scope / Algorithms
      No Visual Input; Flag Special Judges
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: automatic
    label: |-
      Initial Test Suites
      Official Cases When Available
      Otherwise Generator-Validator
      Manual Validator Check
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: experts
    label: |-
      Targeted Expert Test Design
      67 Competitive Programmers
      Craft Cases to Reject Wrong Solutions
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: audit
    label: |-
      Elite Manual Quality Audit
      All Problems Reviewed for Corner Cases
      Custom Checkers Expert-Reviewed
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: quality
    label: |-
      Test Suite as Binary Classifier
      TPR: Correct Solutions Pass
      TNR: Incorrect Solutions Are Rejected
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: dataset
    label: |-
      AetherCode v1: 456 Problems
      159 Easy • 145 Medium
      132 Hard • 20 Extreme
      2024: 400 • Jan-May 2025: 56
    type: database
    size: xl
    position:
      x: 880
      'y': 440
  - id: evaluate
    label: |-
      Model Evaluation
      Four Samples per Problem
      Maximum Output 32,768 Tokens
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      Reliability and Scores
      Collected Solutions: 100% TPR + TNR
      Pass@1 / Pass@2 / Pass@4
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: competitions
    to: statements
    type: primary
  - from: statements
    to: solutions
    type: primary
  - from: solutions
    to: categorize
    type: primary
  - from: categorize
    to: automatic
    type: primary
  - from: automatic
    to: experts
    type: primary
  - from: experts
    to: audit
    type: primary
  - from: audit
    to: quality
    type: primary
  - from: quality
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
