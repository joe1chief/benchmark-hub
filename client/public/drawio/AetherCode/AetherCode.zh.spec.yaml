meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AetherCode 构建流程
  description: 基于 arXiv:2508.16402 对齐的 AetherCode 基准整理与评估流程。
  legend: 实线表示数据构建和评估主流程；虚线表示测试套件质量检查与专家审计反馈。
nodes:
  - id: contests
    label: |-
      顶级编程竞赛
      OI / IOI / ICPC / CCPC
      全球竞赛题源
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: collection
    label: |-
      题目采集
      题面、解答提交
      官方测试、元数据
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: conversion
    label: |-
      格式转换
      PDF 转 Markdown + LaTeX
      人工校对题面
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: taxonomy
    label: |-
      专家分类
      难度分层
      算法与领域标签
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: auto_tests
    label: |-
      自动测试生成
      Generator-Validator Agent
      人工确认 validator
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_tests
    label: |-
      专家测试标注
      67 位竞赛编程专家
      精英团队质量审计
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: suite
    label: |-
      最终基准套件
      456 道题
      TPR / TNR 均为 100%
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      模型评测
      每题运行 4 次
      按类别统计 Pass@k
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: contests
    to: collection
    type: primary
  - from: collection
    to: conversion
    type: primary
  - from: conversion
    to: taxonomy
    type: primary
  - from: taxonomy
    to: auto_tests
    type: primary
  - from: auto_tests
    to: expert_tests
    type: data
    label: 生成测试
  - from: expert_tests
    to: auto_tests
    type: optional
    label: validator 修正
  - from: expert_tests
    to: suite
    type: primary
    label: 合并测试集
  - from: suite
    to: evaluation
    type: primary
modules: []
