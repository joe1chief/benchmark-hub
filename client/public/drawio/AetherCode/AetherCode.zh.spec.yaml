meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AetherCode 构建流程
  description: 对齐论文的顶级 OI 与 ICPC 赛题整理、基于人类提交的测试构造、专家审计及四次采样评测流程。
  legend: 先从左到右阅读构建行，再从右到左阅读测试质量与评测行。
nodes:
  - id: competitions
    label: |-
      顶级竞赛来源
      OI：IOI / NOI / USACO
      ICPC：全球总决赛 / 区域赛 / CCPC
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: statements
    label: |-
      标准化题目包
      PDF 转 Markdown + LaTeX
      人工校对并收集官方元数据
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: solutions
    label: |-
      人类解答语料
      超过 30,000 份提交
      每题至少 5 份正确 + 20 份错误解答
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: categorize
    label: |-
      题目分类与筛选
      难度 / 年份 / 范围 / 算法类别
      排除视觉输入；标注特殊评测题
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: automatic
    label: |-
      初始测试套件
      有官方用例时收集并标准化
      生成器-验证器 + 人工核验验证器
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: experts
    label: |-
      专家定向设计测试
      67 名竞赛编程专家
      构造能拒绝错误解答的用例
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: audit
    label: |-
      顶尖团队人工质量审计
      所有题目复核边界与特殊情况
      专家审查自定义 Checker
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: quality
    label: |-
      将测试套件视作二分类器
      TPR：正确解答通过
      TNR：错误解答被拒绝
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: dataset
    label: |-
      AetherCode v1：456 题
      简单159 / 中等145 / 困难132 / 极难20
      2024 年400 + 2025年1-5月56
    type: database
    size: xl
    position:
      x: 880
      'y': 440
  - id: evaluate
    label: |-
      模型评测
      每题采样四次
      最大输出 32,768 Token
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      可靠性与得分
      收集解答集上 TPR 与 TNR 均为 100%
      Pass@1 / Pass@2 / Pass@4
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: competitions
    to: statements
    type: primary
  - from: statements
    to: solutions
    type: primary
  - from: solutions
    to: categorize
    type: primary
  - from: categorize
    to: automatic
    type: primary
  - from: automatic
    to: experts
    type: primary
  - from: experts
    to: audit
    type: primary
  - from: audit
    to: quality
    type: primary
  - from: quality
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
modules: []
