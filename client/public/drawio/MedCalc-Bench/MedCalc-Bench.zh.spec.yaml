  layout: horizontal
  routing: orthogonal
  title: MedCalc-Bench-Verified 数据集构建流程
  description: >-
    论文披露的评测集与训练集并行构建流程：从 55 个 MDCalc 热门计算任务和 Open-Patients 病历出发，经 GPT 辅助筛选与属性提取；评测分支增加医学核验与缺失病历补齐，训练分支的 GPT-4
    抽取不做人工核验，两者共同进入后续 Verified 版本线。
  legend: >-
    实线箭头表示构建依赖或发布沿革。评测分支按补充材料 A 与官方 version-1.0 CSV 显示 11 个模板型、10 个临床人工型；主文 §2.2 将两个数量反写。论文训练集报告 40 个计算器，原始发布 CSV 因 1 条
    HOMA-IR 实为 41 个 ID。虚线注记这些来源冲突；下游推理、解析与评分不在图中。
