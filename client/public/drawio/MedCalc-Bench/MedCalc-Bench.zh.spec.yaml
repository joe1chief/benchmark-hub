meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedCalc-Bench 构建与评测流程
  description: 对齐论文与官方仓库，构建并评测 1,047 条人工复核医学计算样本，覆盖 55 个 MDCalc 任务、 七个子类型，并按规则型或公式型任务使用专属判分标准。
  legend: Open-Patients 为 34 个计算器提供合格病历；其余 21 个计算器分别通过公式模板或临床医生撰写 的规则型病历补齐，每个 20 条，再由计算器模板生成标准解答。
nodes:
  - id: calculators
    label: |-
      选择 55 个常用 MDCalc 任务
      覆盖临床常用计算器
      保留所需输入属性
      定义各计算器输出
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: taxonomy
    label: |-
      分类计算器逻辑
      19 个规则型 · 36 个公式型
      七种计算子类型
      实验室 · 体征 · 日期 · 剂量 + 三类规则
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: notes
    label: |-
      汇编 Open-Patients
      超过 18 万份公开病历
      PMC-Patients · MedQA-USMLE
      TREC CDS 与 Clinical Trials
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: eligibility
    label: |-
      识别合格患者病历
      使用 GPT-3.5-Turbo
      将病历匹配到计算器输入
      每个计算器最多 20 条
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: extraction
    label: |-
      提取所需属性
      使用 GPT-4
      从患者病历读取数值
      保留计算器专属字段
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: verification
    label: |-
      核验已提取样本
      医疗专业人员审查数值
      纠正属性提取错误
      覆盖 34 个有合格病历的计算器
    type: user
    size: xl
    position:
      x: 1220
      'y': 40
  - id: synthesis
    label: |-
      补齐其余 21 个任务
      10 个公式任务使用模板
      11 个规则任务由医生撰写病历
      每个缺失任务生成 20 条
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: gold
    label: |-
      生成标准解答
      模板覆盖全部 55 个计算器
      生成逐步解释
      生成最终数值或规则答案
    type: document
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      形成 MedCalc-Bench 测试集
      1,047 条人工复核样本
      病历 · 问题 · 实体
      标准解释与答案
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: models
    label: |-
      评测八个大语言模型
      两个医疗模型和六个通用模型
      测试知识 · 抽取 · 算术
      使用相同计算器任务
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: prompting
    label: |-
      应用三种提示设置
      零样本直接回答
      零样本思维链
      同任务示例的单样本思维链
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: score
    label: |-
      应用任务专属准确率
      规则与日期任务精确匹配
      实验室 · 体征 · 剂量误差 5% 内
      与标准答案比较
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: errors
    label: |-
      分析计算错误
      知识 · 抽取
      计算 · 其他
      验证错误分类器
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      发布基准结果
      总体准确率
      七个子类型准确率
      比较提示策略与模型
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: calculators
    to: taxonomy
    type: primary
  - from: taxonomy
    to: notes
    type: primary
  - from: notes
    to: eligibility
    type: primary
  - from: eligibility
    to: extraction
    type: primary
  - from: extraction
    to: verification
    type: primary
  - from: verification
    to: synthesis
    type: primary
  - from: synthesis
    to: gold
    type: primary
  - from: gold
    to: release
    type: primary
  - from: release
    to: models
    type: primary
  - from: models
    to: prompting
    type: primary
  - from: prompting
    to: score
    type: primary
  - from: score
    to: errors
    type: primary
  - from: errors
    to: report
    type: primary
modules: []
