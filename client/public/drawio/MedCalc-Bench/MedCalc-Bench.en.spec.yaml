  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedCalc-Bench Build and Evaluation Process
  description: >-
    Paper- and repository-aligned construction and evaluation of 1,047 manually reviewed medical-calculation instances
    spanning 55 MDCalc tasks, seven subtypes, and rule- or equation-specific scoring.
  legend: >-
    Open-Patients supplies eligible notes for 34 calculators; the remaining 21 receive 20 examples each through equation
    templates or clinician-written rule-based notes before calculator templates create gold solutions.
