meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HELMET Build Process
  description: >-
    Paper-aligned assembly of HELMET's seven application-centric long-context categories, controls, prompts, and
    metrics.
  legend: >-
    Branches distinguish how evidence-heavy applications, learned/long-document tasks, and synthetic recall control
    context length before they share robust prompting and task-appropriate evaluation.
nodes:
  - id: flaws
    label: |-
      Diagnose existing long-context benchmarks
      limited applications · short contexts
      unreliable metrics · base-model incompatibility
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: curate
    label: |-
      Set HELMET design requirements
      diverse application coverage · controllable length
      reliable evaluation for base/instruction models
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: evidence_tasks
    label: |-
      Curate three evidence-heavy categories
      RAG: NQ/TQA/PopQA/HotpotQA
      ALCE Cite · MS MARCO re-ranking
    type: process
    size: xl
    position:
      x: 680
      'y': 40
  - id: document_tasks
    label: |-
      Curate learned and document categories
      many-shot ICL: TREC/NLU/BANKING77/CLINC150
      NarrativeQA/InfiniteBench QA · two summaries
    type: process
    size: xl
    position:
      x: 680
      'y': 300
  - id: recall_tasks
    label: |-
      Curate synthetic recall category
      JSON key-value retrieval
      RULER MK Needle · MK UUID · MV
    type: process
    size: xl
    position:
      x: 680
      'y': 560
  - id: evidence_length
    label: |-
      Control evidence context length
      vary retrieved/ranked passage counts
      distribute gold passages or shuffle Hotpot pairs
    type: process
    size: xl
    position:
      x: 1020
      'y': 40
  - id: document_length
    label: |-
      Control learned/document length
      vary balanced ICL shots
      truncate long documents from the end
    type: process
    size: xl
    position:
      x: 1020
      'y': 300
  - id: recall_length
    label: |-
      Control synthetic length and placement
      generate JSON/RULER contexts at target sizes
      support 128K tokens and beyond
    type: process
    size: xl
    position:
      x: 1020
      'y': 560
  - id: prompt
    label: |-
      Apply robust task-specific prompting
      two-shot except variable-shot ICL/RULER defaults
      placeholder demos and stronger summary instruction
    type: process
    size: xl
    position:
      x: 1380
      'y': 300
  - id: direct_metrics
    label: |-
      Use reference/direct metrics where suitable
      SubEM · citation average · NDCG@10
      accuracy · ROUGE F1
    type: process
    size: xl
    position:
      x: 1720
      'y': 80
  - id: model_metrics
    label: |-
      Use GPT-4o reference-based metrics
      NarrativeQA fluency × normalized correctness
      summary atomic-claim precision/recall F1 × fluency
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: score
    label: |-
      Aggregate task/category results by length
      compare 59 long-context language models
      report a holistic profile, not one synthetic proxy
    type: terminal
    size: xl
    position:
      x: 2080
      'y': 300
edges:
  - from: flaws
    to: curate
    type: primary
  - from: curate
    to: evidence_tasks
    type: primary
  - from: curate
    to: document_tasks
    type: primary
  - from: curate
    to: recall_tasks
    type: primary
  - from: evidence_tasks
    to: evidence_length
    type: primary
  - from: document_tasks
    to: document_length
    type: primary
  - from: recall_tasks
    to: recall_length
    type: primary
  - from: evidence_length
    to: prompt
    type: primary
  - from: document_length
    to: prompt
    type: primary
  - from: recall_length
    to: prompt
    type: primary
  - from: prompt
    to: direct_metrics
    type: primary
  - from: prompt
    to: model_metrics
    type: primary
  - from: direct_metrics
    to: score
    type: primary
  - from: model_metrics
    to: score
    type: primary
modules: []
