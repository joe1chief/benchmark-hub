meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TrialBench Build and Evaluation Process
  description: >-
    TrialBench integrates ClinicalTrials.gov XML records with DrugBank, TrialTrove, ICD-10, and CCS resources. Trial
    interventions are linked to drug SMILES and molecular graphs, conditions to hierarchical disease codes, and outcomes
    to NCT identifiers. Task builders retain only information available before the target event, remove constant or
    all-null features, apply task-specific eligibility filters, and derive labels from dates, counts, events, TrialTrove
    records, or GPT-assisted extraction where documented. This produces 23 AI-ready datasets spanning eight
    clinical-trial prediction tasks and five modalities. Standard multimodal encoders feed task heads, and evaluation
    uses classification, regression, ranking, or generation metrics appropriate to each dataset.
  legend: >-
    Source: TrialBench arXiv:2407.00631, Sections 2-4 and Appendix; official TrialBench project. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
