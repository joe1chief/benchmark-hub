meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TrialBench 构建与评测流程
  description: >-
    TrialBench将ClinicalTrials.gov
    XML记录与DrugBank、TrialTrove、ICD-10和CCS资源整合。试验干预被链接到药物SMILES与分子图，疾病链接到层次化疾病编码，结局通过NCT编号关联。任务构建仅保留目标事件发生前可获得的信息，删除常量或全空特征，执行任务特定资格过滤，并按论文说明从日期、计数、事件、TrialTrove记录或GPT辅助抽取中生成标签。最终形成覆盖5种模态、8类临床试验预测任务的23个AI就绪数据集。评测以标准多模态编码器连接任务头，并按数据集采用分类、回归、排序或生成指标。
  legend: 来源：TrialBench arXiv:2407.00631, Sections 2-4 and Appendix; official TrialBench project。实线箭头表示论文或官方资料明确支持的主流程。
