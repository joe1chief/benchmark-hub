meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MVBench Build Process
  description: Paper-aligned construction and deterministic evaluation of 20 temporal video-understanding tasks in MVBench.
  legend: >-
    Solid arrows trace static-to-dynamic task design, public-video filtering, automatic MCQ generation, option leakage
    control, and exact accuracy scoring.
nodes:
  - id: static_tasks
    label: |-
      Start from Static Benchmarks
      Summarize Nine Spatial Tasks
      Use Them as Definitions
      Add Dynamic Video Goals
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: temporal_tasks
    label: |-
      Define 20 Temporal Tasks
      Cover Perception to Cognition
      Require Whole-video Reasoning
      Reject Single-frame Shortcuts
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: datasets
    label: |-
      Collect Public Video Data
      Use 11 Source Benchmarks
      Span First · Third Person
      Span Indoor · Outdoor Scenes
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: sensitivity
    label: |-
      Filter for Temporal Sensitivity
      Remove Negligible Motion
      Remove Overlong Context
      Keep Mostly 5–35 Second Clips
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: difficulty
    label: |-
      Balance Question Difficulty
      Shift STAR Clip Boundaries
      Cap CLEVRER Descriptions
      Avoid Too Easy or Too Hard
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: questions
    label: |-
      Generate Questions with ChatGPT
      Follow Each Task Definition
      Ground in Public Annotations
      Convert to Multiple Choice
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: candidates
    label: |-
      Construct Option Candidates
      Prefer Ground-truth Templates
      Use LLM for Open-ended QA
      Include Correct Distractors
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: options
    label: |-
      Process Answer Options
      Sample Three to Five Choices
      Shuffle Their Order
      Equalize Lengths with an LLM
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Finalize MVBench
      200 MCQs per Task
      4,000 MCQs across 20 Tasks
      Preserve Gold Video Labels
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompt
    label: |-
      Apply Temporal Evaluation Prompt
      Inspect Actions and Poses
      Inspect Object Motion and Detail
      Ask for One Best Option
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: extract
    label: |-
      Guarantee Option Extraction
      Parenthesize Choices
      Prefix with Best Option: (
      Achieve 100% Extraction Rate
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: accuracy
    label: |-
      Score against Gold Answers
      Use Deterministic Accuracy
      Avoid LLM Judge Bias
      Report Each Task and Average
    type: terminal
    size: xl
    position:
      x: 500
      'y': 420
edges:
  - from: static_tasks
    to: temporal_tasks
    type: primary
  - from: temporal_tasks
    to: datasets
    type: primary
  - from: datasets
    to: sensitivity
    type: primary
  - from: sensitivity
    to: difficulty
    type: primary
  - from: difficulty
    to: questions
    type: primary
  - from: questions
    to: candidates
    type: primary
  - from: candidates
    to: options
    type: primary
  - from: options
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: extract
    type: primary
  - from: extract
    to: accuracy
    type: primary
modules: []
