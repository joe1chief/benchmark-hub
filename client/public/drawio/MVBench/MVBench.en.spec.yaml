meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MVBench Evidence-aligned Build and Evaluation Process
  description: >-
    Separates the paper-v4 static-to-dynamic task design and automatic QA construction from the corrected public release
    and the separately versioned VideoChat2 reference notebook used for deterministic option scoring.
  legend: >-
    Solid arrows trace disclosed construction and evaluation. Decision branches carry explicit outcomes. Unconnected
    cards preserve release, rights, and paper-to-data boundaries without implying undocumented workflow steps.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper · arXiv 2311.17005v4
      Official Repo · 4dd8210b
      HF Dataset · 230a2d4f
      Audit Exact Revisions
    type: document
    size: xl
    position:
      x: 80
      'y': 192
  - id: spatial_tasks
    label: |-
      Expand Nine Spatial Task Categories
      Action · Object · Position · Scene
      Count · Attribute · Pose · Character
      Cognition → 20 Temporal Tasks
      Defeat Single-frame Shortcuts
    type: process
    size: xl
    position:
      x: 352
      'y': 192
  - id: sources
    label: |-
      Select 11 Public Video Datasets
      First / Third Person
      Indoor / Outdoor
      Real / Simulated Scenes
    type: database
    size: xl
    position:
      x: 624
      'y': 192
  - id: temporal_gate
    label: |-
      Temporally Sensitive Clip?
      Meaningful Motion
      Mainly 5-35 Seconds
    type: decision
    size: xl
    position:
      x: 896
      'y': 192
  - id: exclude
    label: |-
      Exclude Candidate
      Negligible Motion
      Excessive Context
      Fails Source-specific Rule
    type: terminal
    size: xl
    position:
      x: 896
      'y': 512
  - id: source_rules
    label: |-
      Apply Difficulty + Source Rules
      Proper, Distinguishable Answer?
      STAR · Shift Clip Start / End
      CLEVRER · Exclude >10 Conditions
    type: process
    size: xl
    position:
      x: 1168
      'y': 192
  - id: source_rule_gate
    label: Eligible after Difficulty + Source Rules?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 192
  - id: mcq_gate
    label: Usable MCQ Already Available?
    type: decision
    size: xl
    position:
      x: 1712
      'y': 192
  - id: direct_qa
    label: |-
      Directly Adopt Existing QA
      Preserve Ground-truth Answer
      Preserve Public Annotation
      Keep Task-specific Filtering
    type: process
    size: xl
    position:
      x: 1984
      'y': 32
  - id: generate_question
    label: |-
      Generate Questions with ChatGPT
      Follow the Temporal Task Definition
      Ground Questions in Video Annotation
      Appendix · 3-5 Questions when Needed
    type: process
    size: xl
    position:
      x: 1984
      'y': 352
  - id: candidate_gate
    label: Can Templates Supply Option Candidates?
    type: decision
    size: xl
    position:
      x: 2256
      'y': 352
  - id: template_options
    label: |-
      Build Template Candidates
      Use Ground-truth Annotations
      Example · Correct / Opposite / Unsure
      Example · Directions + Stationary
    type: process
    size: xl
    position:
      x: 2528
      'y': 256
  - id: llm_options
    label: |-
      Build Candidates with an LLM
      Unexpected Action / Open QA
      Convert Answer + Distractors
      Preserve Ground-truth Correctness
    type: process
    size: xl
    position:
      x: 2528
      'y': 448
  - id: sample_options
    label: |-
      Paper · Sample 3-5 Options
      Draw from Available Candidates
      Apply to Each Question
      Keep the Gold Answer
    type: process
    size: xl
    position:
      x: 2800
      'y': 192
  - id: shuffle_options
    label: |-
      Shuffle Option Order
      Break Position Regularities
      Preserve Gold Mapping
    type: process
    size: xl
    position:
      x: 3072
      'y': 192
  - id: length_balance
    label: |-
      Balance Option Lengths with an LLM
      Reduce Longer-answer Leakage
      Keep Similar Reasonable Lengths
    type: process
    size: xl
    position:
      x: 3344
      'y': 192
  - id: release
    label: |-
      Assemble Paper MVBench
      20 Temporal Tasks
      200 MCQs per Task
      4,000 MCQs Total
    type: database
    size: xl
    position:
      x: 3616
      'y': 192
  - id: release_snapshot
    label: |-
      Pinned Public Snapshot
      20 JSON Configs · 4,000 Rows
      Signature Fields · Question + Answer + Candidates
      Unique · 3,569 / 4,000
      Repeated · 151 Groups / 582 Rows
      1,000 Rows Carry Start / End
    type: document
    size: xl
    position:
      x: 80
      'y': 672
  - id: release_drift
    label: |-
      Paper-to-release Drift
      Paper Says 3-5 Options
      HF Has 5 One-option + 118 Two-option Rows
      Repo Notes ~30 Repeated QAs Replaced
    type: document
    size: xl
    position:
      x: 352
      'y': 672
  - id: rights_boundary
    label: |-
      Release and Rights Boundary
      HF Card · MIT + Use Acknowledgement
      Video Rights Stay with Original Sources
      320 NTU Videos Require Manual Access
    type: document
    size: xl
    position:
      x: 624
      'y': 672
  - id: eval_load
    label: |-
      Load Reference Notebook Input
      Task JSON + Source Video / Frames
      Preserve Raw Video Metadata
      Select VideoChat2 Evaluation Path
    type: process
    size: xl
    position:
      x: 3616
      'y': 864
  - id: bound_gate
    label: Start / End Bounds Present?
    type: decision
    size: xl
    position:
      x: 3344
      'y': 864
  - id: bounded_clip
    label: |-
      Restrict to Annotated Bounds
      Convert Seconds to Frame Range
      Uniform Segment Centers
    type: process
    size: xl
    position:
      x: 3072
      'y': 752
  - id: full_clip
    label: |-
      Use Full Video / Frame Sequence
      Keep Dataset-specific Decoder
      Uniform Segment Centers
    type: process
    size: xl
    position:
      x: 3072
      'y': 976
  - id: sample_frames
    label: |-
      VideoChat2 Notebook Reference
      Uniformly Sample 16 Frames
      Resize + Center-crop to 224
      Other Models Set Their Own Inputs
    type: process
    size: xl
    position:
      x: 2800
      'y': 864
  - id: eval_prompt
    label: |-
      Apply Paper Evaluation Prompt
      Attend to Cause / Sequence / Motion
      Append Only Give the Best Option
      Begin Answer with Best option: (
    type: document
    size: xl
    position:
      x: 2528
      'y': 864
  - id: decode_parse
    label: |-
      Deterministic Decode + Notebook Parse
      do_sample = False · max_new_tokens = 100
      Keep First Line · Prefix Return with (
      Lowercase / Split · Take First Tokens
    type: process
    size: xl
    position:
      x: 2256
      'y': 864
  - id: score_row
    label: |-
      Score Row Deterministically
      Option Tokens Contain Either Way · 1
      Strip Periods from Predicted Token
      Otherwise · 0
      Ignore Answer Content · No LLM Judge
    type: process
    size: xl
    position:
      x: 1984
      'y': 864
  - id: aggregate
    label: |-
      Aggregate Row-level Accuracy
      Per-task Correct / Total
      Overall Correct / 4,000
      Equal 200 Rows per Task
    type: process
    size: xl
    position:
      x: 1712
      'y': 864
  - id: report
    label: |-
      Report MVBench Results
      20 Task Accuracies
      Overall Average Accuracy
      No LLM Judge
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 864
