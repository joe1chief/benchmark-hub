meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MVBench 构建流程
  description: 与论文对齐地展示 MVBench 二十类时序视频理解任务的构建与确定性评测流程。
  legend: 实线箭头依次表示静态到动态任务设计、公开视频筛选、自动选择题生成、选项泄漏控制和精确准确率评分。
nodes:
  - id: static_tasks
    label: |-
      从静态基准出发
      总结九类空间任务
      将其作为定义参考
      加入动态视频目标
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: temporal_tasks
    label: |-
      定义 20 类时序任务
      覆盖感知到认知
      要求完整视频推理
      排除单帧捷径
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: datasets
    label: |-
      收集公开视频数据
      使用 11 个来源基准
      覆盖第一与第三人称
      覆盖室内与室外场景
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: sensitivity
    label: |-
      筛选时序敏感视频
      移除几乎无运动片段
      移除上下文过长视频
      主要保留 5–35 秒片段
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: difficulty
    label: |-
      平衡问题难度
      随机移动 STAR 片段边界
      限制 CLEVRER 描述条件
      避免过易或过难
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: questions
    label: |-
      用 ChatGPT 生成问题
      遵循各任务定义
      基于公开视频标注
      转换为多项选择题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: candidates
    label: |-
      构造候选选项
      优先使用标准标注模板
      开放问答由 LLM 转换
      加入正确答案与干扰项
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: options
    label: |-
      处理答案选项
      抽取三至五个选项
      随机打乱顺序
      用 LLM 统一合理长度
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      定稿 MVBench
      每个任务 200 道选择题
      20 个任务共 4,000 题
      保留视频标准标注
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompt
    label: |-
      应用时序评测提示
      检查人物动作与姿态
      检查物体细节与运动
      要求输出一个最佳选项
    type: document
    size: xl
    position:
      x: 980
      'y': 420
  - id: extract
    label: |-
      保证选项抽取
      为各选项添加圆括号
      使用 Best Option: ( 前缀
      达到 100% 抽取率
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: accuracy
    label: |-
      对照标准答案评分
      使用确定性准确率
      避免 LLM 评分偏差
      报告分任务与平均结果
    type: terminal
    size: xl
    position:
      x: 500
      'y': 420
edges:
  - from: static_tasks
    to: temporal_tasks
    type: primary
  - from: temporal_tasks
    to: datasets
    type: primary
  - from: datasets
    to: sensitivity
    type: primary
  - from: sensitivity
    to: difficulty
    type: primary
  - from: difficulty
    to: questions
    type: primary
  - from: questions
    to: candidates
    type: primary
  - from: candidates
    to: options
    type: primary
  - from: options
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: extract
    type: primary
  - from: extract
    to: accuracy
    type: primary
modules: []
