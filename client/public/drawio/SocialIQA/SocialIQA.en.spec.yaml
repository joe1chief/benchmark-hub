meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SocialIQA Build Process
  description: >-
    Paper-aligned SocialIQA workflow: ATOMIC events seed rewritten social contexts and inference questions, handwritten
    and question-switched negatives are collected in parallel, human majority validation and a stylistic classifier
    filter the three-choice tuples, and 37,588 examples are evaluated with accuracy.
  legend: >-
    Solid arrows show ATOMIC-based context creation, the two negative-answer branches, tuple validation, splitting, and
    evaluation.
nodes:
  - id: atomic
    label: |-
      ATOMIC Knowledge Graph
      24K Social Events
      Nine Inference Dimensions
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: rewrite
    label: |-
      MTurk Event Rewriting
      Add Names / Fill Placeholders
      Repair Grammar
    type: process
    size: xl
    position:
      x: 300
      'y': 240
  - id: positives
    label: |-
      Context + QA Creation
      Expand Context by 7-25 Words
      Edit Template + Two Correct Answers
    type: user
    size: xl
    position:
      x: 580
      'y': 240
  - id: hia
    label: |-
      HIA Negative Branch
      Two Handwritten Answers
      Topically Similar but Subtly Wrong
    type: process
    size: xl
    position:
      x: 880
      'y': 60
  - id: qsa
    label: |-
      QSA Negative Branch
      Switch to Related Inference Question
      Write Two Correct Answers to Wrong Question
    type: process
    size: xl
    position:
      x: 880
      'y': 420
  - id: tuple
    label: |-
      Three-choice Tuple
      Random Correct Answer
      Two Least-entailed Negatives
    type: document
    size: xl
    position:
      x: 1180
      'y': 240
  - id: validate
    label: |-
      Human Majority Validation
      Train: Three Workers
      Dev / Test: Second Pass with Five
    type: user
    size: xl
    position:
      x: 1460
      'y': 240
  - id: filter
    label: |-
      Dev / Test Difficulty Filter
      Deep Stylistic Classifier
      Remove Easier Examples
    type: process
    size: xl
    position:
      x: 1740
      'y': 240
  - id: dataset
    label: |-
      SocialIQA 37,588
      Train 33,410 / Dev 1,954
      Test 2,224; Context-disjoint
    type: database
    size: xl
    position:
      x: 2020
      'y': 240
  - id: predict
    label: |-
      Read Context + Question
      Score Three Candidate Answers
      Choose Highest Probability
    type: process
    size: xl
    position:
      x: 2300
      'y': 240
  - id: metric
    label: |-
      Test Accuracy
      Human Comparison on
      900 Dev + 900 Test Samples
    type: terminal
    size: xl
    position:
      x: 2580
      'y': 240
edges:
  - from: atomic
    to: rewrite
    type: primary
  - from: rewrite
    to: positives
    type: primary
  - from: positives
