  - from: positives
    to: qsa
    type: primary
  - from: hia
    to: tuple
    type: primary
  - from: qsa
    to: tuple
    type: primary
  - from: tuple
    to: validate
    type: primary
  - from: validate
    to: filter
    type: primary
  - from: filter
    to: dataset
    type: primary
  - from: dataset
    to: predict
    type: primary
  - from: predict
    to: metric
    type: primary
modules: []
