meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JointAVBench Build Process
  description: >-
    Paper-aligned JointAVBench construction from the SF20K films through scene-level omni-modal captions, strictly
    correlated QA synthesis, automated and human quality control, label auditing, and deterministic MCQ accuracy.
  legend: >-
    The three-stage automated pipeline produces 3,974 MCQs; professional human verification and a post-audit retain
    2,853 questions without changing the retained benchmark size during label refinement.
nodes:
  - id: taxonomy
    label: |-
      Define Joint AV Requirements
      15 Tasks · 5 Cognitive Dimensions
      4 Audio Types · 3 Scene Spans
      Every Question Must Need Audio + Video
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: films
    label: |-
      Curate High-quality Film Sources
      Short-Films 20K: 1,072 Movies
      Remove Unavailable or Grayscale Videos
      Retain 1,046 Professional Films
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: scenes
    label: |-
      Identify Semantically Coherent Scenes
      Split Long Videos with PySceneDetect
      Merge Highly Similar Adjacent Scenes
      Preserve Rich Within-scene Context
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: visual
    label: |-
      Generate Visual Captions
      Qwen2.5-VL at 1 Frame per Second
      Static Objects and Characters
      Motion and Shot Transitions
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: audio
    label: |-
      Generate and Refine Audio Captions
      Speech · Vocal Traits · Sound · Music
      Reduce Caption Hallucinations
      Separate Sound-event and Music Content
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: qa
    label: |-
      Synthesize Strictly Correlated QA
      Templates for Temporal and Plot Tasks
      LLM Curation for General Tasks
      Supply Only Required Scenes and Modalities
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: checks
    label: |-
      General-to-specific Quality Control
      Modality and Logical-derivability Checks
      Sequence · Ambiguity · Audio-type Checks
      Reject Single-modality Shortcuts
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: distractors
    label: |-
      Generate Three Plausible Distractors
      Wrong Sources or Confused Details
      Preserve One Verified Correct Answer
      Form Four-option MCQs
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: generated
    label: |-
      Automated Candidate Set
      3,974 Multiple-choice Questions
      Question · Explanation · Four Options
      Video and Segment Metadata
    type: database
    size: xl
    position:
      x: 1420
      'y': 380
  - id: human
    label: |-
      Professional Human Verification
      Answer and Information Correctness
      Audio-visual Dependency and Difficulty
      Accept · Pending Review · Discard
    type: user
    size: xl
    position:
      x: 1140
      'y': 380
  - id: audit
    label: |-
      Post-audit Answer Refinement
      External LLM Independently Selects Option
      Combine with Human Label by Majority Vote
      Refine Labels Only; Remove No Samples
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: dataset
    label: |-
      Release JointAVBench · 2,853
      Human-verified MCQs · 71.8% Retained
      Average Video Duration: 97.2 Seconds
      Task, Audio-type, and Scene Metadata
    type: database
    size: xl
    position:
      x: 580
      'y': 380
  - id: evaluate
    label: |-
      Evaluate Joint Audio-visual Reasoning
      Randomize Option Order · 32 Frames
      Exact Correct-option Comparison
      Overall and 15-task Accuracy
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
