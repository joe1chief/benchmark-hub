meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JointAVBench 构建流程
  description: 对齐论文的 JointAVBench 构建流程：从 SF20K 影片生成场景级全模态描述，合成严格音视频相关问题， 经自动与人工质检、标签复审后，以确定性选择题准确率评测。
  legend: 三阶段自动流程生成 3,974 道选择题；专业人工复核与事后标签审计保留 2,853 题，标签精修不改变样本数。
nodes:
  - id: taxonomy
    label: |-
      定义联合音视频要求
      15 个任务 · 5 个认知维度
      4 类音频 · 3 类场景跨度
      每题必须同时依赖音频与视频
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: films
    label: |-
      筛选高质量影片来源
      Short-Films 20K：1,072 部影片
      去除不可用或灰度视频
      保留 1,046 部专业影片
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: scenes
    label: |-
      识别语义一致场景
      用 PySceneDetect 切分长视频
      合并高度相似的相邻场景
      保留丰富的场景内上下文
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: visual
    label: |-
      生成视觉描述
      Qwen2.5-VL 每秒采一帧
      描述静态物体与人物
      描述运动与镜头转换
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: audio
    label: |-
      生成并精修音频描述
      语音 · 声纹特征 · 声音事件 · 音乐
      降低描述幻觉
      分离声音事件与音乐内容
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: qa
    label: |-
      合成严格相关问答
      时序与情节任务使用模板
      通用任务由大模型策划
      仅提供指定场景与所需模态
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: checks
    label: |-
      从通用到专项的质量控制
      模态依赖与逻辑可推导检查
      顺序 · 歧义 · 音频类型检查
      排除单模态捷径
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: distractors
    label: |-
      生成三个可信干扰项
      错误来源或混淆细节
      保留一个已验证正确答案
      形成四选一问题
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: generated
    label: |-
      自动候选集
      3,974 道选择题
      问题 · 解释 · 四个选项
      视频与片段元数据
    type: database
    size: xl
    position:
      x: 1420
      'y': 380
  - id: human
    label: |-
      专业人工复核
      答案与信息正确性
      音视频依赖性与难度
      接受 · 待审 · 丢弃
    type: user
    size: xl
    position:
      x: 1140
      'y': 380
  - id: audit
    label: |-
      事后答案标签精修
      外部强模型独立选择答案
      与人工标签通过多数投票合并
      只修标签不删除样本
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: dataset
    label: |-
      发布 JointAVBench · 2,853 题
      人工复核选择题 · 保留率 71.8%
      平均视频时长 97.2 秒
      含任务音频类型与场景元数据
    type: database
    size: xl
    position:
      x: 580
      'y': 380
  - id: evaluate
    label: |-
      评测联合音视频推理
      随机打乱选项 · 统一 32 帧
      精确比较正确选项
      汇报总体与 15 任务准确率
    type: terminal
    size: xl
    position:
      x: 300
      'y': 380
edges:
  - from: taxonomy
    to: films
    type: primary
  - from: films
    to: scenes
    type: primary
  - from: scenes
    to: visual
    type: primary
  - from: visual
    to: audio
    type: primary
  - from: audio
    to: qa
    type: primary
  - from: qa
    to: checks
    type: primary
  - from: checks
    to: distractors
    type: primary
  - from: distractors
    to: generated
    type: primary
  - from: generated
    to: human
    type: primary
  - from: human
    to: audit
    type: primary
  - from: audit
    to: dataset
    type: primary
  - from: dataset
    to: evaluate
    type: primary
modules: []
