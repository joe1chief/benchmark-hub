    type: primary
  - from: scenes
    to: audio_base
    type: primary
  - from: audio_base
    to: audio_refine
    type: primary
  - from: visual
    to: qa
    type: primary
  - from: audio_refine
    to: qa
    type: primary
  - from: qa
    to: scope
    type: primary
  - from: scope
    to: qa_pool
    type: primary
  - from: qa_pool
    to: general_qc
    type: primary
  - from: general_qc
    to: specific_qc
    type: primary
  - from: specific_qc
    to: distractors
    type: primary
  - from: distractors
    to: automated
    type: primary
  - from: automated
    to: human_rating
    type: primary
  - from: human_rating
    to: human_filter
    type: primary
  - from: human_filter
    to: label_audit
    type: primary
  - from: label_audit
    to: dataset
    type: primary
  - from: dataset
