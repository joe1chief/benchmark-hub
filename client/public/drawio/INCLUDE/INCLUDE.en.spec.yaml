meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: INCLUDE Build Process
  description: >-
    Paper-aligned INCLUDE workflow: native speakers collect and verify local academic, professional, and licensing
    exams; 118,606 newly parsed questions merge with 78,637 existing-dataset questions into 197,243 native-language
    MCQAs, which receive academic and regional labels before standardized BASE and LITE evaluation subsets.
  legend: >-
    Solid arrows show collection, extraction, quality control, consolidation, labeling, subset sampling, and accuracy
    evaluation; the two parallel data branches sum exactly to the complete paper dataset.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Fixed Releases
      arXiv:2411.19799v1
      BASE d2e1f60 · LITE a027ccc
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: community
    label: |-
      Native Speakers + Regional Associations
      Collect Local-language Sources
      Preserve Native Scripts and Context
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: sources
    label: |-
      Three Exam-source Families
      Academic Exams
      Professional + Regional Licenses
    type: database
    size: xl
    position:
      x: 300
      'y': 240
  - id: extract
    label: |-
      Multi-format MCQA Extraction
      PDF + JavaScript / HTML + Other Forms
      Question + Options + Correct Answer
    type: process
    size: xl
    position:
      x: 560
      'y': 240
  - id: native_qc
    label: |-
      Native-speaker Quality Control
      Compare with Originals + Correct Errors
      Filter Image / Table Dependence
      Preserve Required Reference Context
    type: user
    size: xl
    position:
      x: 820
      'y': 240
  - id: filter
    label: |-
      Content Quality Gate
      Remove Image / Table-dependent Items
      Attach Required Reference Context
    type: process
    size: xl
    position:
      x: 1080
      'y': 240
  - id: new_data
    label: |-
      Newly Parsed and Verified Data
      118,606 MCQA Pairs
      From 1,926 Exam Sources
      60.2% of Complete INCLUDE
    type: database
    size: xl
    position:
      x: 1360
      'y': 60
  - id: existing
    label: |-
      78,637 Existing Benchmark Pairs
      Arabic / Chinese / Turkish / Persian MMLU
      VNHSGE + EXAMS
    type: database
    size: xl
    position:
      x: 1360
      'y': 440
  - id: complete
    label: |-
      Complete INCLUDE Dataset
      197,243 MCQAs · 44 Languages
      15 Scripts · 52 Countries · 58 Domains
    type: database
    size: xl
    position:
      x: 1640
      'y': 240
  - id: taxonomy
    label: |-
      Exam-level, Not Sample-level Labels
      Two-level Academic Taxonomy
      Language + Topic + Level + Country
    type: document
    size: xl
    position:
      x: 1920
      'y': 240
  - id: regionality
    label: |-
      Label Regional Knowledge
      Agnostic 34.4% · Explicit 18.8%
      Cultural 16.4% · Implicit 30.4%
    type: process
    size: xl
    position:
      x: 2200
      'y': 240
  - id: four_option
    label: |-
      Standardize to Four Options
      Fewer than Four: Omit Question
      More than Four: Prune to Four
    type: process
    size: xl
    position:
      x: 2480
      'y': 240
  - id: base
    label: |-
      INCLUDE-BASE Paper Subset
      Uniform 22,635 Four-option MCQAs
      Max 550 per Language
      500 Regional + 50 STEM
    type: database
    size: xl
    position:
      x: 2760
      'y': 60
  - id: lite
    label: |-
      INCLUDE-LITE Paper Subset
      10,770 Four-option MCQAs
      Max 250 · Region-specific Subjects Only
    type: database
    size: xl
    position:
      x: 2760
      'y': 440
  - id: prompt
    label: |-
      Evaluate Multiple Prompt Settings
      Temperature 0 · 5-shot: 512 Tokens
      Zero-shot CoT: 1,024 Tokens
      In-language / English ± Region Prefix
    type: process
    size: xl
    position:
      x: 3040
      'y': 240
  - id: parse
    label: |-
      Extract One of Four Options
      Format Failures Count as Incorrect
      Total vs Answer Accuracy
    type: process
    size: xl
    position:
      x: 3320
      'y': 240
  - id: report
    label: |-
      Report Accuracy
      Total vs Answer Accuracy
      Language / Domain / Regionality Analyses
    type: terminal
    size: xl
    position:
      x: 3600
      'y': 240
  - id: artifact_boundary
    label: |-
      Full / Public Release Boundary
      197,243 Complete Set Held Back
      BASE d2e1f60: 23,741 Test + 915 Val
      LITE a027ccc: 11,021 Public Rows
    type: document
    size: xl
    position:
      x: 3880
      'y': 240
