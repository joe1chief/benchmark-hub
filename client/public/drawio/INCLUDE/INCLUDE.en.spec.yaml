meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: INCLUDE Build Process
  description: >-
    Paper-aligned INCLUDE workflow: native speakers collect and verify local academic, professional, and licensing
    exams; 118,606 newly parsed questions merge with 78,637 existing-dataset questions into 197,243 native-language
    MCQAs, which receive academic and regional labels before standardized BASE and LITE evaluation subsets.
  legend: >-
    Solid arrows show collection, extraction, quality control, consolidation, labeling, subset sampling, and accuracy
    evaluation; the two parallel data branches sum exactly to the complete paper dataset.
nodes:
  - id: community
    label: |-
      Native Speakers + Regional Associations
      Collect Local-language Sources
      Preserve Native Scripts and Context
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: sources
    label: |-
      Three Exam-source Families
      Academic Exams
      Professional + Regional Licenses
    type: database
    size: xl
    position:
      x: 300
      'y': 240
  - id: extract
    label: |-
      Multi-format MCQA Extraction
      PDF + JavaScript / HTML + Other Forms
      Question + Options + Correct Answer
    type: process
    size: xl
    position:
      x: 560
      'y': 240
  - id: native_qc
    label: |-
      Native-speaker Quality Control
      Compare with Original Documents
      Manually Correct Parsing Errors
    type: user
    size: xl
    position:
      x: 820
      'y': 240
  - id: filter
    label: |-
      Content Quality Gate
      Remove Image / Table-dependent Items
      Attach Required Reference Context
    type: process
    size: xl
    position:
      x: 1080
      'y': 240
  - id: new_data
    label: |-
      Newly Parsed and Verified Data
      118,606 MCQA Pairs
      From 1,926 Exam Sources
    type: database
    size: xl
    position:
      x: 1360
      'y': 60
  - id: existing
    label: |-
      Consolidate Existing Benchmarks
      Arabic / Chinese / Turkish / Persian MMLU
      VNHSGE + EXAMS · 78,637 Pairs
    type: database
    size: xl
    position:
      x: 1360
      'y': 440
  - id: complete
    label: |-
      Complete INCLUDE Dataset
      197,243 MCQAs · 44 Languages
      15 Scripts · 52 Countries · 58 Domains
    type: database
    size: xl
    position:
      x: 1640
      'y': 240
  - id: metadata
    label: |-
      Annotate Exam-level Metadata
      Language + Topic + Level + Country
      Two-level Academic Taxonomy
    type: document
    size: xl
    position:
      x: 1920
      'y': 240
  - id: regionality
    label: |-
      Label Regional Knowledge
      Agnostic / Explicit / Cultural
      Implicit Regional
    type: process
    size: xl
    position:
      x: 2200
      'y': 240
  - id: base
    label: |-
      INCLUDE-BASE Paper Subset
      Uniform 22,635 Four-option MCQAs
      Max 550 per Language
    type: database
    size: xl
    position:
      x: 2480
      'y': 60
  - id: lite
    label: |-
      INCLUDE-LITE Paper Subset
      10,770 Four-option MCQAs
      Max 250 per Language · Regional Only
    type: database
    size: xl
    position:
      x: 2480
      'y': 440
  - id: prompt
    label: |-
      Evaluate Multiple Prompt Settings
      5-shot or Zero-shot Chain of Thought
      In-language / English ± Region Prefix
    type: process
    size: xl
    position:
      x: 2760
      'y': 240
  - id: parse
    label: |-
      Extract One of Four Options
      Separate Formatting Failures
      Preserve Language-level Slices
    type: process
    size: xl
    position:
      x: 3040
      'y': 240
  - id: report
    label: |-
      Report Accuracy
      Total vs Answer Accuracy
      Language / Domain / Regionality Analyses
    type: terminal
    size: xl
    position:
      x: 3320
      'y': 240
edges:
  - from: community
    to: sources
    type: primary
  - from: sources
    to: extract
    type: primary
  - from: extract
    to: native_qc
    type: primary
  - from: native_qc
    to: filter
    type: primary
  - from: filter
    to: new_data
    type: primary
  - from: sources
    to: existing
    type: secondary
  - from: new_data
    to: complete
    type: primary
  - from: existing
    to: complete
    type: secondary
  - from: complete
    to: metadata
    type: primary
  - from: metadata
    to: regionality
    type: primary
  - from: regionality
    to: base
    type: primary
  - from: regionality
    to: lite
    type: primary
  - from: base
    to: prompt
    type: primary
  - from: lite
    to: prompt
    type: primary
  - from: prompt
    to: parse
    type: primary
  - from: parse
    to: report
    type: primary
modules: []
