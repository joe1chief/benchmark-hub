tive + 500 negative</tspan></text></g></g></g></g><g data-cell-id="10"><g><rect x="1680" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1780,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Candidate Localized Caption</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>image + target mask</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>produce a detailed region description</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>no reference caption required</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1960" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(2060,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Meta-Llama-3.1-8B-Instruct</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>official text-only judge</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>temperature 0 · max 300 tokens</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>select one choice per question</tspan></text></g></g></g></g><g data-cell-id="12"><g><rect x="2240" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" 