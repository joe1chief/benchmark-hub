ench Report</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>mean per instance</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>positive mean · negative mean</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>final = average of positive and negative</tspan></text></g></g></g></g><g data-cell-id="15"><g><path d="M 50 100 L 50 334.82" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 50 342.32 L 46.25 334.82 L 53.75 334.82 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="16"><g><path d="M 200 369 L 270.82 369" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 278.32 369 L 270.82 372.75 L 270.82 365.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="17"><g><path d="M 480 369 L 520 369 L 520 377.3 L 584.16 377.33" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 591.66 377.33 L 584.15 381.08 L 584.16 373.58 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 66, 66);"/></g></g><g data-cell-id="18"><g><path d="M 726.67 377.33 L 800 377.3 L 800 145 L 830.82 145" fill="none" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(66, 66, 66);"/><path d="M 838.32 145 L 830.82 148.75 L 830.82 141.25 Z" fill="#424242" stroke="#424242" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(66, 66, 66); stroke: rgb(66, 6