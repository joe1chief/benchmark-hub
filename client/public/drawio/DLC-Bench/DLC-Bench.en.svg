73.5) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Objects365 v2 Validation Source</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>challenging object regions</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>human-annotated segmentation masks</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>one target region</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>per benchmark instance</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="280" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,367.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Allocate 100 Regions to Three VLMs</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>GPT-4o: 34</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>Gemini 1.5 Pro: 35</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>Claude 3.5 Sonnet: 31</tspan></text></g></g></g></g><g data-cell-id="5"><g><path d="M 660 344 L 760 394 L 660 444 L 560 394 Z" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(255, 152, 0);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,398.5) scale(1)"><text><tspan>Two question families</tspan></text></g></g></g></g><g data-cell-id="6"><g><path d="M 840 120 L 1040 120 L 1040 205 Q 990 178 940 205 Q 890 232 840 205 L 840 135 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,122) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Positive Detail Questions</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>object / part: color · shape</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>texture · material · size</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>manually add missing · revise inaccurate</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>remove hallucinated / ambiguous</tspan></text></g></g></g></g><g data-cell-id="7"><g><path d="M 840 560 L 1040 560 L 1040 645 Q 990 618 940 645 Q 890 672 840 645 L 840 575 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,562) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Negative Hallucination Questions</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>mislocalization: outside-mask objects</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>hallucination: typical parts</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>absent / not visible / occluded</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>avoid unsupported details</tspan></text></g></g></g></g><g data-cell-id="8"><g><rect x="1120" y="344" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="