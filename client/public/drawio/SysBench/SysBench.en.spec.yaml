meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SysBench Build and Evaluation Process
  description: >-
    SysBench starts from thousands of system messages in online logs and defines six atomic, verifiable constraint
    types: action, content, background, role, format, and style. Heuristic rules and clustering remove duplicates and
    noise. Twenty-one trained annotators select and refine 500 system messages for explicit tasks and diverse
    constraints. GPT-4o assists conversation generation; annotators retain and rewrite five user rounds per system
    message under expert guidelines. The 500 sessions contain 2,500 turns: 144 parallel and 356 dependent sessions, with
    1,951 aligned and 549 misaligned instructions and 2.38 constraints per instruction on average. Annotators write a
    checklist for every instruction, and multiple experts perform independent multi-round review. During evaluation, the
    target model receives the system message, conversation history, and current user instruction. An advanced-LLM
    verifier receives the same context plus the checklist and judges every relevant constraint as binary satisfied or
    not. Constraint Satisfaction Rate averages atomic checks, Instruction Satisfaction Rate requires all constraints in
    a response, and Session Stability Rate measures the consecutive fully satisfied prefix from the start of each
    dialogue.
  legend: >-
    Source: SysBench arXiv:2408.10943 Section 3 and Appendix A; official PKU-Baichuan-MLSystemLab/SysBench repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
