meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SysBench 构建与评测流程
  description: >-
    SysBench从在线日志中的数千条系统消息出发，定义6类原子且可验证的约束：动作、内容、背景、角色、格式和风格。启发式规则与聚类用于去重和清噪。21名受训标注者选择并完善500条系统消息，使任务描述明确且约束多样。GPT-4o辅助生成对话，标注者依据专家指南为每条系统消息保留并重写5轮用户交互。500个会话共2500轮，其中144个并行会话、356个依赖会话，包含1951条对齐指令和549条不对齐指令，平均每条指令关联2.38个约束。每条指令都有人工检查表，并由多名专家独立多轮复核。评测时，目标模型接收系统消息、对话历史和当前用户指令；高级LLM验证器再结合相同上下文与检查表，逐个二元判断相关约束是否满足。CSR平均原子约束结果，ISR要求一条回复满足全部约束，SSR衡量从会话开始连续完全满足约束的前缀长度。
  legend: >-
    来源：SysBench arXiv:2408.10943 Section 3 and Appendix A; official PKU-Baichuan-MLSystemLab/SysBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
