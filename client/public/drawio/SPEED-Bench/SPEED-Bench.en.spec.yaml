  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "SPEED-Bench Build and Evaluation Process"
  description: "SPEED-Bench has a qualitative split, a throughput split, and a unified measurement framework. The qualitative split aggregates 18 public sources into 11 categories, embeds candidates with text-embedding-3-large, and uses greedy selection plus local swaps to minimize pairwise similarity, retaining 80 prompts per category and 880 total. The throughput split draws real prompts from eight sources, groups them by low, mixed, or high entropy, and truncates or neutrally pads them into 1k, 2k, 8k, 16k, and 32k input-length buckets. Every bucket has 512 prompts per entropy group. The framework normalizes tokenization and prompt formatting outside SGLang, vLLM, and TensorRT-LLM, dispatches concurrent requests, and reports conditional acceptance rate, acceptance length, output TPS, user TPS, latency, and speedup."
  legend: "Source: SPEED-Bench arXiv:2604.09557 Sections 4-7 and Appendix B; official nvidia/SPEED-Bench dataset and measurement framework. Solid arrows show the main flow explicitly supported by the paper or official documentation."
