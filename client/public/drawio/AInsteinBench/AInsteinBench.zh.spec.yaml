meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AInsteinBench 构建流程
  description: 基于 arXiv:2512.21373 对齐的 AInsteinBench 科学代码基准构建与评估流程。
  legend: 实线表示从科学仓库到任务构建和可执行评估的主流程；虚线表示特征消融与专家复核反馈路径。
nodes:
  - id: repositories
    label: |-
      科学代码仓库
      PySCF、Qiskit、RDKit
      AMReX、OpenMM、Einstein Toolkit
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: pr_crawl
    label: |-
      PR 爬取
      issue 描述、base commit
      fix patch 与测试更新
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: feature_ablation
    label: |-
      特征任务合成
      消融科学模块
      补充测试相关 API 文档
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: environment
    label: |-
      环境重建
      历史依赖栈
      隔离 Docker 测试
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: filtering
    label: |-
      fail-to-pass 过滤
      base 通过、patched 失败
      fixed patch 通过
    type: decision
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_review
    label: |-
      领域专家复核
      科学相关性
      测试强度与难度分层
    type: user
    size: xl
    position:
      x: 820
      'y': 250
  - id: dataset
    label: |-
      AInsteinBench 任务
      244 个问题
      真实 PR 与特征实现
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: agent_eval
    label: |-
      coding agent 评估
      查看、编辑、跑测试
      solve rate 与失败分析
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: repositories
    to: pr_crawl
    type: primary
  - from: repositories
    to: feature_ablation
    type: data
  - from: pr_crawl
    to: environment
    type: primary
  - from: feature_ablation
    to: environment
    type: data
  - from: environment
    to: filtering
    type: primary
  - from: filtering
    to: expert_review
    type: primary
  - from: expert_review
    to: filtering
    type: optional
    label: 调整测试强度
  - from: expert_review
    to: dataset
    type: primary
  - from: dataset
    to: agent_eval
    type: primary
modules: []
