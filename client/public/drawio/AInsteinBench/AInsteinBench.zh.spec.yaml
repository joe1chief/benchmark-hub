meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AInsteinBench 双通道构建与评测流程
  description: 按论文保持历史 PR 与合成功能任务两条独立构建通道，分别通过专家复核后才合流为 244 项任务的发布集。
  legend: 上方通道挖掘历史功能 PR；下方通道合成消融任务。两者均须通过可执行验证与领域专家审核。
nodes:
  - id: repositories
    label: |-
      选择 6 个代码仓库
      科学计算软件
      覆盖多种领域
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: pr_crawl
    label: |-
      抓取已合并 PR
      科学功能变更
      测试与关联问题
    type: process
    size: xl
    position:
      x: 320
      'y': 20
  - id: pr_filter
    label: |-
      筛选历史 PR
      功能范围可复现
      保留任务工件
    type: process
    size: xl
    position:
      x: 600
      'y': 20
  - id: historical_env
    label: |-
      重建历史环境
      基础提交 + 依赖
      隔离执行
    type: process
    size: xl
    position:
      x: 880
      'y': 20
  - id: f2p
    label: |-
      验证失败转成功
      原测试通过
      新测试失败 • 修复后通过
    type: process
    size: xl
    position:
      x: 1160
      'y': 20
  - id: feature_pr_api
    label: |-
      构建功能 PR 任务
      新 API 来自修复补丁
      仅保留测试使用的签名
    type: document
    size: xl
    position:
      x: 1440
      'y': 20
  - id: historical_expert
    label: |-
      历史任务专家审核
      覆盖不足 / 过度覆盖
      假阳性 / 假阴性测试
    type: user
    size: xl
    position:
      x: 1720
      'y': 20
  - id: module_selection
    label: |-
      选择合成模块
      科学计算组件
      实现范围适中
    type: process
    size: xl
    position:
      x: 320
      'y': 340
  - id: ablation_prompt
    label: |-
      消融并生成提示
      移除原实现
      提供最小 API 上下文
    type: process
    size: xl
    position:
      x: 600
      'y': 340
  - id: synthetic_tests
    label: |-
      生成科学测试
      仿真 • 参数
      输出验证
    type: process
    size: xl
    position:
      x: 880
      'y': 340
  - id: reconstructed_verify
    label: |-
      验证重建环境
      任务测试可执行
      标准实现通过
    type: process
    size: xl
    position:
      x: 1160
      'y': 340
  - id: synthetic_expert
    label: |-
      合成任务专家审核
      覆盖不足 / 过度覆盖
      假阳性 / 假阴性测试
    type: user
    size: xl
    position:
      x: 1440
      'y': 340
  - id: release
    label: |-
      专家复核后发布
      244 项任务
      6 个代码仓库
    type: database
    size: xl
    position:
      x: 2000
      'y': 180
  - id: task
    label: |-
      初始化任务
      问题 + 基础仓库
      可执行环境
    type: document
    size: xl
    position:
      x: 2280
      'y': 180
  - id: agent
    label: |-
      运行编程代理
      检查 • 编辑 • 测试
      生成候选补丁
    type: process
    size: xl
    position:
      x: 2560
      'y': 180
  - id: evaluation
    label: |-
      执行验证
      科学任务测试
      仓库回归测试
    type: process
    size: xl
    position:
      x: 2840
      'y': 180
  - id: report
    label: |-
      AInsteinBench 报告
      问题解决率
      按仓库与类型拆分
    type: terminal
    size: xl
    position:
      x: 3120
      'y': 180
edges:
  - from: repositories
    to: pr_crawl
    type: primary
  - from: pr_crawl
    to: pr_filter
    type: primary
  - from: pr_filter
    to: historical_env
    type: primary
  - from: historical_env
    to: f2p
    type: primary
  - from: f2p
    to: feature_pr_api
    type: primary
  - from: feature_pr_api
    to: historical_expert
    type: primary
  - from: repositories
    to: module_selection
    type: primary
  - from: module_selection
    to: ablation_prompt
    type: primary
  - from: ablation_prompt
    to: synthetic_tests
    type: primary
  - from: synthetic_tests
    to: reconstructed_verify
    type: primary
  - from: reconstructed_verify
    to: synthetic_expert
    type: primary
  - from: historical_expert
    to: release
    type: primary
  - from: synthetic_expert
    to: release
    type: primary
  - from: release
    to: task
    type: primary
  - from: task
    to: agent
    type: primary
  - from: agent
    to: evaluation
    type: primary
  - from: evaluation
    to: report
    type: primary
modules: []
