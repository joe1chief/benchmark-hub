meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AInsteinBench Build and Evaluation Process
  description: >-
    Paper-aligned dual-source scientific-software task construction, historical environment reconstruction, fail-to-pass
    and expert verification, plus executable CodeAct-agent evaluation for AInsteinBench.
  legend: >-
    The upper branches create issue-resolution and synthesized feature tasks from six repositories; both converge on
    executable verification before the 244-problem release and agent evaluation.
nodes:
  - id: repositories
    label: |-
      Select 6 Scientific Repositories
      PySCF • Qiskit • Einstein Toolkit
      AMReX • OpenMM • RDKit
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: pr_tasks
    label: |-
      Mine Issue-Resolution Tasks
      Merged Scientific / Numerical PRs with Test Updates
      Extract Issue, Base Commit, Fix Patch, and Test Patch
    type: process
    size: xl
    position:
      x: 320
      'y': 70
  - id: feature_tasks
    label: |-
      Synthesize Feature-Implementation Tasks
      Ablate a Module / Source Component while Retaining Context
      Supply Only Test-Used Signatures as a Minimal API Block
    type: process
    size: xl
    position:
      x: 320
      'y': 290
  - id: environment
    label: |-
      Reconstruct Historical Environments
      Recover Dependencies, Builds, and Scientific Workflows
      Run Each Task in an Isolated Minimal Docker Image
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: f2p
    label: |-
      Enforce Fail-to-Pass Transitions
      Base Commit + Original Tests = PASS
      Add Test Patch = FAIL • Add Gold Fix = PASS
    type: process
    size: xl
    position:
      x: 880
      'y': 70
  - id: expert
    label: |-
      Domain-Expert Verification
      Check Scientific Relevance, Clarity, and Test Coverage
      Repair Tests; Score Scientific + Engineering Difficulty
    type: user
    size: xl
    position:
      x: 880
      'y': 290
  - id: release
    label: |-
      Release AInsteinBench
      244 Problems across 6 Repositories
      Easy / Medium / Hard from Combined Difficulty Scores
    type: database
    size: xl
    position:
      x: 1160
      'y': 180
  - id: task
    label: |-
      Initialize the Task Container
      Problem Statement + Base Repository State
      Reproduction Scripts and Scientific Test Suite
    type: document
    size: xl
    position:
      x: 1440
      'y': 500
  - id: agent
    label: |-
      Run a CodeAct Coding Agent
      Plan–Act Loop: Inspect, Edit, Install, and Test
      Iterate within the Isolated Scientific Environment
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: patch
    label: |-
      Produce the Candidate Patch
      Preserve Repository APIs and Numerical Behavior
      Submit the Final Working-Tree Changes
    type: process
    size: xl
    position:
      x: 880
      'y': 500
  - id: tests
    label: |-
      Execute Scientific Verification
      Run Reproduction Scripts + Task / Repository Tests
      Require the Hidden Fail-to-Pass Behavior to Succeed
    type: process
    size: xl
    position:
      x: 600
      'y': 500
  - id: report
    label: |-
      AInsteinBench Results
      Resolved-Problems Rate over 244 Tasks
      Break Down by Repository, Domain, Type, and Difficulty
    type: terminal
    size: xl
    position:
      x: 320
      'y': 500
edges:
  - from: repositories
    to: pr_tasks
    type: primary
  - from: repositories
    to: feature_tasks
    type: primary
  - from: pr_tasks
    to: environment
    type: primary
  - from: feature_tasks
    to: environment
    type: primary
  - from: environment
    to: f2p
    type: primary
  - from: f2p
    to: expert
    type: primary
  - from: expert
    to: release
    type: primary
  - from: release
    to: task
    type: primary
  - from: task
    to: agent
    type: primary
  - from: agent
    to: patch
    type: primary
  - from: patch
    to: tests
    type: primary
  - from: tests
    to: report
    type: primary
modules: []
