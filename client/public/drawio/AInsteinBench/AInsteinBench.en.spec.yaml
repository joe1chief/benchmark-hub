  title: AInsteinBench Dual-lane Build and Evaluation Process
  description: >-
    Paper-aligned historical-PR and synthetic-feature task construction remain independent through expert review and
    merge only into the reviewed 244-task release.
  legend: >-
    The upper lane mines historical feature PRs. The lower lane synthesizes ablation tasks. Both require executable
    verification and domain-expert audit before release.
