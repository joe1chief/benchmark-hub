meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SciCode 构建与评测流程
  description: 按论文展示科学家策划、分层问题拆解、真实工作流测试、三轮验证与可配置的科学研究代码顺序评测。
  legend: 先从左到右阅读基准构建，再从右到左阅读评测；仅当全部子问题和集成解都通过科学测试时，主问题才算通过。
nodes:
  - id: workflows
    label: |-
      科学家研究工作流
      16 个自然科学子领域
      论文使用过的内部脚本
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: selection
    label: |-
      研究级问题选择
      数值方法 + 模拟 + 分析
      聚焦真实科学编码需求
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: decomposition
    label: |-
      分层问题设计
      主目标 -> 有序子问题
      文档字符串定义输入输出
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: solutions
    label: |-
      科学家金标准工件
      NumPy / SciPy / SymPy 解答
      可选科学背景知识
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      两部分评测设计
      数值输入输出测试
      领域测试复现论文 / 理论
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: validation
    label: |-
      三轮质量控制
      至少 2 名同领域 + 1 名跨领域科学家
      GPT-4 失败分析与测试重设
    type: decision
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      SciCode 发布
      80 个主问题 / 338 个子问题
      开发 15/50｜测试 65/288
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: setup
    label: |-
      可配置评测设置
      提供或不提供金标准背景
      使用金标准或生成的前序解
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: generate
    label: |-
      零样本顺序生成
      各领域使用统一通用提示
      携带前序子问题代码
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      自动科学测试
      运行数值与领域专用用例
      对比科学家金标准
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: correctness
    label: |-
      分层正确性门
      子问题：自身测试通过
      主问题：全部子问题 + 集成解通过
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      SciCode Pass@1
      主问题与子问题级通过率
      标准设置：无背景 + 生成历史
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: workflows
    to: selection
    type: primary
  - from: selection
    to: decomposition
    type: primary
  - from: decomposition
    to: solutions
    type: primary
  - from: solutions
    to: tests
    type: primary
  - from: tests
    to: validation
    type: primary
  - from: validation
    to: release
    type: primary
  - from: release
    to: setup
    type: primary
  - from: setup
    to: generate
    type: primary
  - from: generate
    to: execute
    type: primary
  - from: execute
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
modules: []
