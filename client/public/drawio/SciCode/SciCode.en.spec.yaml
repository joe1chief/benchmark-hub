meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SciCode Build and Evaluation Process
  description: >-
    Paper-aligned scientist curation of real research workflows, hierarchical problem design, numerical and domain
    testing, three sequential quality-control rounds, and the standard sequential Pass@1 evaluation setting.
  legend: >-
    Construction proceeds left-to-right across the upper lane. The three quality-control rounds are ordered rather than
    parallel. Evaluation returns right-to-left below: the standard setting withholds background and carries generated
    previous solutions forward. A main problem passes only when all subproblems and the integrated solution pass.
nodes:
  - id: workflows
    label: |-
      Scientific Research Workflows
      Mainly Internal Scripts
      Many Used in Publications
      Not All Are Public
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coverage
    label: |-
      Natural-Science Coverage
      5 Domains • 16 Subfields
      Math • Physics • Chemistry
      Biology • Material Science
    type: database
    size: xl
    position:
      x: 320
      'y': 100
  - id: selection
    label: |-
      Select Research-Level Tasks
      Numerical Methods
      System Simulation
      Scientific Calculation
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: decomposition
    label: |-
      Hierarchical Problem Design
      Main Goal → Ordered Subproblems
