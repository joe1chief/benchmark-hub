    size: xl
    position:
      x: 2280
      'y': 520
  - id: generate
    label: |-
      Sequential Generation
      Solve Ordered Subproblems
      Carry Earlier Generated Code
      Then Integrate Main Solution
    type: process
    size: xl
    position:
      x: 2000
      'y': 520
  - id: execute
    label: |-
      Automatic Scientific Tests
      Run Numerical Cases
      Run Domain-Specific Cases
      Compare Scientist Ground Truth
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: correctness
