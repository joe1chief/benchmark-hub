meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SciCode Build and Evaluation Process
  description: >-
    Paper-aligned scientist curation, hierarchical problem decomposition, real-workflow testing, three-round validation,
    and configurable sequential evaluation of scientific research code.
  legend: >-
    Read benchmark construction left-to-right, then evaluation right-to-left; a main problem passes only when every
    subproblem and the integrated solution pass their scientific tests.
nodes:
  - id: workflows
    label: |-
      Scientists' Research Workflows
      16 Natural-Science Subfields
      Internal Scripts Used in Publications
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: selection
    label: |-
      Research-Level Problem Selection
      Numerical Methods + Simulation + Analysis
      Emphasize Real Scientific Coding Needs
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: decomposition
    label: |-
      Hierarchical Problem Design
      Main Objective -> Ordered Subproblems
      Docstrings Specify Inputs and Outputs
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: solutions
    label: |-
      Scientist Gold Artifacts
      Solutions with NumPy / SciPy / SymPy
      Optional Scientific Background
    type: document
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      Two-Part Evaluation Design
      Numerical Input-Output Tests
      Domain Tests Reproduce Papers / Theory
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: validation
    label: |-
      Three-Round Quality Control
      >=2 In-Domain + 1 Out-of-Domain Scientist
      GPT-4 Failure Analysis and Test Redesign
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: release
    label: |-
      SciCode Release
      80 Main / 338 Subproblems
      Dev: 15/50 | Test: 65/288
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: setup
    label: |-
      Configurable Evaluation Setup
      With or without Gold Background
      Gold or Generated Previous Solutions
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: generate
    label: |-
      Zero-Shot Sequential Generation
      Same General Prompt across Fields
      Carry Earlier Subproblem Code Forward
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: execute
    label: |-
      Automatic Scientific Testing
      Run Numerical and Domain-Specific Cases
      Compare with Scientist Ground Truth
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: correctness
    label: |-
      Hierarchical Correctness Gate
      Subproblem: Its Tests Pass
      Main: All Subs + Integrated Solution Pass
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      SciCode Pass@1
      Main- and Subproblem-Level Rates
      Standard: No Background + Generated History
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
