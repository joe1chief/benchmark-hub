meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVO-Bench Build and Evaluation Process
  description: >-
    Paper-backed construction and evaluation of OVO-Bench, with the current release, released scorer, license conflict,
    and paper-to-code drift kept separate from the paper protocol.
  legend: Solid arrows follow construction or evaluation. Dashed arrows trace fixed evidence, current artifacts, or drift.
nodes:
  - id: evidence
    label: |-
      Fix Review Evidence
      arXiv:2501.05510v2
      Git c34093f
      HF fec29e3
    type: document
    size: xl
    position:
      x: 40
      'y': 440
  - id: taxonomy
    label: |-
      Define Three Online Modes
      Backward Tracing
      Real-Time Visual Perception
      Forward Active Responding
    type: document
    size: xl
    position:
      x: 40
      'y': 80
  - id: task_split
    label: |-
      Enumerate the Task Split
      3 Backward · 6 Real-time · 3 Forward
      12 Tasks in the Body
      Figure 2 Caption Says 14
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: sources
    label: |-
      Select Validation/Test Sources
      EPM: QA-Ego4D · OpenEQA
      ASI: STAR · YouCook2
      CrossTask · HiREST · COIN
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: source_map
    label: |-
      Map Remaining Source Videos
      REC: Perception-Test · THUMOS
      SSR: COIN · CRR: MovieNet
      Real-time: Ego4D · plus YouTube
    type: database
    size: xl
    position:
      x: 600
      'y': 320
  - id: meta_gate
    label: |-
      Three Meta-annotation Paths
      Reuse Precise Labels
      Semi-automatic Timestamping
      Direct Human Annotation
    type: decision
    size: xl
    position:
      x: 880
      'y': 320
  - id: existing_meta
    label: |-
      Repurpose Accurate Event Timestamps
      Read Existing Dataset Metadata
      Keep Event Boundaries
      Map Labels to Target Tasks
    type: document
    size: xl
    position:
      x: 1160
      'y': 40
  - id: semi_auto
    label: |-
      Build Semi-automatic Timestamps
      Gemini-1.5 Proposes Coarse Timestamps
      Humans Inspect the Videos
      Human Refinement Fixes Boundaries
    type: process
    size: xl
    position:
      x: 1160
      'y': 320
  - id: human_meta
    label: |-
      Collect Meta-annotations from Volunteers
      SSR and CRR Questions
      Answers and Ground-truth Timestamps
      Follow Task-specific Guidance
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: refine
    label: |-
      Consolidate and Refine Metadata
      Inspect Every Source Video
      Correct Event Boundaries
      Validate Meta-annotations
    type: process
    size: xl
    position:
      x: 1440
      'y': 320
  - id: qa_generation
    label: |-
      Generate Candidate QAs
      Sample Random Short Clips
      GPT-4o Uses Human-refined Prompts
      Add Human-proposed Questions
    type: process
    size: xl
    position:
      x: 1720
      'y': 320
  - id: options
    label: |-
      Construct Backward and Real-time MCQs
      Use 2–5 Options
      Rule-based Transformations
      Visually Grounded Wrong Options
    type: process
    size: xl
    position:
      x: 2000
      'y': 320
  - id: manual_qc
    label: |-
      Perform Manual Quality Control
      Inspect Every QA
      Human Review of Distractors
      Shuffle Options to Remove Order Bias
    type: process
    size: xl
    position:
      x: 2280
      'y': 320
  - id: paper_release
    label: |-
      Freeze the Paper Release
      644 Unique Videos
      2,814 QA Meta-annotations
      Seven Domains · 12 Tasks
    type: database
    size: xl
    position:
      x: 2560
      'y': 320
  - id: eval_gate
    label: |-
      Select Online Evaluation Mode
      Backward and Real-time MCQs
      Forward Dense Queries
      Preserve Query Timing
    type: decision
    size: xl
    position:
      x: 2560
      'y': 720
  - id: bt_rt
    label: |-
      Evaluate Past and Present
      Clip Start to Query Time
      Timestamp-aware Prompt
      Multiple-choice Prediction
    type: process
    size: xl
    position:
      x: 2280
      'y': 600
  - id: forward_dense
    label: |-
      Evaluate Forward Response
      Densely Query the Timeline
      Model Chooses Wait or Answer
      REC · SSR · CRR
    type: process
    size: xl
    position:
      x: 2280
      'y': 840
  - id: paper_metric
    label: |-
      Apply Paper Forward Metrics
      REC Timing: p1 = 0.2 · p2 = 0.05
      SSR and CRR Judged by GPT-4o
      Timing Decay: p = 0.5
    type: process
    size: xl
    position:
      x: 2000
      'y': 720
  - id: paper_report
    label: |-
      Report the Paper Protocol
      Task and Mode Results
      Accuracy-based Main Table
      Compare Models and Humans
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 720
  - id: current_release
    label: |-
      Pin the Current JSON Edition
      1,640 Top-level Records
      3,035 Timestamp Tests
      README: 3,100 Queries
    type: database
    size: xl
    position:
      x: 2840
      'y': 1080
  - id: current_scorer
    label: |-
      Trace the Released Scorer
      No GPT-4o · No Timing-weighted Score
      REC: Digits Exactly Compared
      SSR/CRR: Yes/No Membership
    type: process
    size: xl
    position:
      x: 2560
      'y': 1080
  - id: current_report
    label: |-
      Aggregate Released Accuracy
      Per-task Means
      Three Mode Means
      Overall Mean of the Modes
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 1080
  - id: license_boundary
    label: |-
      Record License Boundaries
      Annotations: CC BY-NC-SA 4.0
      Git Code: MIT · HF Card: CC BY-SA 4.0
      Source-dataset Terms Still Apply
    type: document
    size: xl
    position:
      x: 2840
      'y': 1400
  - id: drift
    label: |-
      Material Drift
      Paper 2,814
      Current JSON 1,640 / 3,035
      README 3,100
      Paper Timing Metrics
      Released Accuracy-only Scorer
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 1080
