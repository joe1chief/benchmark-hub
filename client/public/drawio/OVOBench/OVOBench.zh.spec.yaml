meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVO-Bench 构建与评测流程
  description: 按论文复原 OVO-Bench 的构建与评测，并将当前版本、已发布计分器、许可证冲突和论文到代码的漂移 与论文协议分开呈现。
  legend: 实线表示构建或评测主流程；虚线表示固定证据、当前发布物或版本漂移。
nodes:
  - id: evidence
    label: |-
      固定审阅证据
      arXiv：2501.05510v2
      Git：c34093f
      HF：fec29e3
    type: document
    size: xl
    position:
      x: 40
      'y': 440
  - id: taxonomy
    label: |-
      定义三类在线模式
      向后追溯
      实时视觉感知
      向前主动响应
    type: document
    size: xl
    position:
      x: 40
      'y': 80
  - id: task_split
    label: |-
      列出任务划分
      3 个向后 · 6 个实时 · 3 个向前
      正文共 12 个任务
      图 2 图注却写 14 个
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: sources
    label: |-
      选择验证集或测试集来源
      EPM：QA-Ego4D · OpenEQA
      ASI：STAR · YouCook2
      CrossTask · HiREST · COIN
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: source_map
    label: |-
      映射其余源视频
      REC：Perception-Test · THUMOS
      SSR：COIN · CRR：MovieNet
      实时任务：Ego4D · 补充 YouTube
    type: database
    size: xl
    position:
      x: 600
      'y': 320
  - id: meta_gate
    label: |-
      三条元标注路径
      复用精确标注
      半自动时间戳
      直接人工标注
    type: decision
    size: xl
    position:
      x: 880
      'y': 320
  - id: existing_meta
    label: |-
      复用准确事件时间戳
      读取已有数据集元数据
      保留事件边界
      映射到目标任务
    type: document
    size: xl
    position:
      x: 1160
      'y': 40
  - id: semi_auto
    label: |-
      构建半自动时间戳
      Gemini-1.5 生成粗粒度时间戳
      人工查看视频
      人工精修事件边界
    type: process
    size: xl
    position:
      x: 1160
      'y': 320
  - id: human_meta
    label: |-
      收集志愿者元标注
      SSR 与 CRR 问题
      答案及真值时间戳
      遵循任务专属指南
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: refine
    label: |-
      汇总并精修元数据
      查看每个源视频
      修正事件边界
      验证元标注
    type: process
    size: xl
    position:
      x: 1440
      'y': 320
  - id: qa_generation
    label: |-
      生成候选问答
      随机抽取短视频片段
      GPT-4o 使用人工精修提示词
      补充人工提出的问题
    type: process
    size: xl
    position:
      x: 1720
      'y': 320
  - id: options
    label: |-
      构造向后与实时选择题
      每题 2–5 个选项
      规则变换
      基于视频的错误选项
    type: process
    size: xl
    position:
      x: 2000
      'y': 320
  - id: manual_qc
    label: |-
      执行人工质量检查
      检查每道问答
      人工审核干扰项
      打乱选项以消除顺序偏差
    type: process
    size: xl
    position:
      x: 2280
      'y': 320
  - id: paper_release
    label: |-
      固定论文版本
      644 个独立视频
      2,814 条问答元标注
      七个领域 · 12 个任务
    type: database
    size: xl
    position:
      x: 2560
      'y': 320
  - id: eval_gate
    label: |-
      选择在线评测模式
      向后与实时选择题
      向前密集查询
      保留查询时序
    type: decision
    size: xl
    position:
      x: 2560
      'y': 720
  - id: bt_rt
    label: |-
      评测过去与当前
      从片段起点到查询时刻
      带时间戳的提示
      预测选择题答案
    type: process
    size: xl
    position:
      x: 2280
      'y': 600
  - id: forward_dense
    label: |-
      评测未来响应
      沿时间线密集查询
      模型选择等待或作答
      REC · SSR · CRR
    type: process
    size: xl
    position:
      x: 2280
      'y': 840
  - id: paper_metric
    label: |-
      应用论文向前任务指标
      REC 时序：p1 = 0.2 · p2 = 0.05
      SSR 与 CRR 由 GPT-4o 判断
      时间衰减：p = 0.5
    type: process
    size: xl
    position:
      x: 2000
      'y': 720
  - id: paper_report
    label: |-
      报告论文协议结果
      任务与模式结果
      主表采用准确率指标
      比较模型与人类
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 720
  - id: current_release
    label: |-
      固定当前 JSON 版本
      1,640 条顶层记录
      3,035 个时间戳测试
      README：3,100 个查询
    type: database
    size: xl
    position:
      x: 2840
      'y': 1080
  - id: current_scorer
    label: |-
      追踪已发布计分器
      不用 GPT-4o · 没有时序加权分
      REC：拼接数字后精确比较
      SSR/CRR：判断是或否文本
    type: process
    size: xl
    position:
      x: 2560
      'y': 1080
  - id: current_report
    label: |-
      聚合已发布准确率
      各任务取均值
      三类模式分别取均值
      再对三类模式取总均值
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 1080
  - id: license_boundary
    label: |-
      记录许可证边界
      标注：CC BY-NC-SA 4.0
      Git 代码：MIT · HF 卡片：CC BY-SA 4.0
      仍须遵守源数据集条款
    type: document
    size: xl
    position:
      x: 2840
      'y': 1400
  - id: drift
    label: |-
      重大漂移
      论文 2,814
      当前 JSON 1,640 / 3,035
      README 3,100
      论文采用时序指标
      已发布实现只按准确率计分
    type: terminal
    size: xl
    position:
      x: 2000
      'y': 1080
edges:
  - from: evidence
    to: taxonomy
    type: secondary
    label: 固定证据
    style:
      dashed: true
      exitX: 0.5
      exitY: 0
      entryX: 0.5
      entryY: 1
  - from: taxonomy
    to: task_split
    type: primary
  - from: task_split
    to: sources
    type: primary
  - from: sources
    to: source_map
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: source_map
    to: meta_gate
    type: primary
  - from: meta_gate
    to: existing_meta
    type: primary
    label: 已有标注
    style:
      exitX: 1
      exitY: 0.2
      entryX: 0
      entryY: 0.5
  - from: meta_gate
    to: semi_auto
    type: primary
    label: Gemini 粗标
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: meta_gate
    to: human_meta
    type: primary
    label: 人工 SSR/CRR
    style:
      exitX: 1
      exitY: 0.8
      entryX: 0
      entryY: 0.5
  - from: existing_meta
    to: refine
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.2
  - from: semi_auto
    to: refine
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: human_meta
    to: refine
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.8
  - from: refine
    to: qa_generation
    type: primary
  - from: qa_generation
    to: options
    type: primary
  - from: options
    to: manual_qc
    type: primary
  - from: manual_qc
    to: paper_release
    type: primary
  - from: paper_release
    to: eval_gate
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: eval_gate
    to: bt_rt
    type: primary
    label: 过去与当前
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.5
  - from: eval_gate
    to: forward_dense
    type: primary
    label: 未来
    style:
      exitX: 0
      exitY: 0.75
      entryX: 1
      entryY: 0.5
  - from: bt_rt
    to: paper_metric
    type: primary
    style:
      exitX: 0
      exitY: 0.5
      entryX: 1
      entryY: 0.25
  - from: forward_dense
    to: paper_metric
    type: primary
    style:
      exitX: 0
      exitY: 0.5
      entryX: 1
      entryY: 0.75
  - from: paper_metric
    to: paper_report
    type: primary
  - from: paper_release
    to: current_release
    type: secondary
    label: 当前版本
    style:
      dashed: true
    waypoints:
      - x: 3020
        'y': 440
      - x: 3020
        'y': 960
  - from: current_release
    to: current_scorer
    type: primary
  - from: current_scorer
    to: current_report
    type: primary
  - from: paper_report
    to: drift
    type: secondary
    label: 论文协议
    style:
      dashed: true
    waypoints:
      - x: 1840
        'y': 960
  - from: current_report
    to: drift
    type: secondary
    label: 已发布实现
    style:
      dashed: true
  - from: current_release
    to: license_boundary
    type: secondary
    label: 许可证边界
    style:
      dashed: true
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
modules: []
