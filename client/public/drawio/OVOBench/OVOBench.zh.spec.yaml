meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVO-Bench 构建与评测流程
  description: 对齐论文构建带精确时间戳的在线理解任务，覆盖向后追溯、实时视觉感知与向前主动响应。
  legend: 论文版本包含 644 个视频、2,814 条问答元标注和 12 个任务；当前代码仓版本可能报告不同的查询数量。
nodes:
  - id: taxonomy
    label: |-
      定义三种在线模式
      向后追溯
      实时视觉感知
      向前主动响应
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      收集多样视频
      整理公开数据集
      自行抓取 YouTube 视频
      覆盖七类主要领域
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: splits
    label: |-
      选择防泄漏来源
      仅用验证集或测试集
      将来源映射至 12 个任务
      保留长视频在线语境
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: meta
    label: |-
      收集事件级元标注
      复用精确人工标签
      Gemini 生成粗时间戳
      志愿者标注真实时间戳
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: refine
    label: |-
      人工细化时间戳
      逐段检查源视频
      修正事件边界
      核验元标注精度
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: auto_qa
    label: |-
      自动生成候选问答
      随机采样短视频片段
      GPT-4o 筛选候选
      使用人工优化提示词
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: human_qa
    label: |-
      补充人工提出的问答
      降低模型偏好偏差
      覆盖困难 CRR 样例
      遵循逐任务标注指南
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: options
    label: |-
      构造视觉相关干扰项
      执行规则式变换
      生成视频落地错误选项
      避免答案信息泄漏
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: review
    label: |-
      人工复核并打乱选项
      检查干扰项有效性
      逐题人工检查
      消除选项顺序偏差
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布论文版 OVO-Bench
      644 个独立视频
      2,814 条问答元标注
      12 个任务 · 3 种模式
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: clips
    label: |-
      评测过去与当前理解
      输入开头至查询时刻片段
      使用带时间戳提示
      计算多选准确率
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: forward
    label: |-
      评测未来响应时机
      沿时间轴密集查询
      模型选择等待或回答
      追踪正确触发时刻
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: score
    label: |-
      执行逐任务评分
      结合准确率与时机分数
      GPT-4o 判定 SSR 与 CRR
      与参考答案比较
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告三类模式结果
      向后 · 实时 · 向前
      汇总十二个任务
      比较模型与人类表现
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: taxonomy
    to: sources
    type: primary
  - from: sources
    to: splits
    type: primary
  - from: splits
    to: meta
    type: primary
  - from: meta
    to: refine
    type: primary
  - from: refine
    to: auto_qa
    type: primary
  - from: auto_qa
    to: human_qa
    type: primary
  - from: human_qa
    to: options
    type: primary
  - from: options
    to: review
    type: primary
  - from: review
    to: release
    type: primary
  - from: release
    to: clips
    type: primary
  - from: clips
    to: forward
    type: primary
  - from: forward
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
