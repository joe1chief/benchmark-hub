meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OctoBench Build and Evaluation Process
  description: >-
    Paper-aligned construction of repository-grounded scaffold-aware coding tasks and binary checklists, followed by
    full-trajectory judging with instance-level and check-level compliance metrics.
  legend: >-
    OctoBench separates holistic Instance Success Rate (ISR), which requires every applicable check to pass, from
    Check-item Success Rate (CSR), which awards partial credit across independently judged constraints.
nodes:
  - id: sources
    label: |-
      Collect Instruction Sources
      Repository Policies · Skill Docs
      System and User Prompts · Memory
      Tool Schemas and Reminders
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: environment
    label: |-
      Package Executable Environments
      Normalize Constraint Artifacts
      Add Repository and Persistent State
      Build Self-contained Docker Images
    type: database
    size: xl
    position:
      x: 260
      'y': 70
  - id: scaffolds
    label: |-
      Instantiate Three Scaffolds
      Claude Code
      Kilo
      Droid
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: seed
    label: |-
      Author 72 Seed Instances
      Activate Intended Constraints
      Require Binary Verifiability
      Preserve Task Feasibility
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: expand
    label: |-
      Expand to 217 Instances
      Use Model-assisted Evolution
      Sample Generated Instances
      Validate Targeting and Reasonableness
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: reference
    label: |-
      Run Reference Agent
      GPT-5.1 Fixed Reference
      16 Independent Rollouts per Task
      Record Normalized Trajectories
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: propose
    label: |-
      Propose Atomic Checks
      Cover Every Evidenced Source
      Binary Success or Failure
      Include Triggered Hidden Constraints
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: consolidate
    label: |-
      Consolidate Checklists
      Deduplicate 16 Rollout Drafts
      Harmonize Categories
      Keep Only Present Source Types
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: audit
    label: |-
      Audit Checklist Quality
      Joint Human–LLM Review
      20% Manual Spot-check
      Stratified Double-annotator Audit
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      Release OctoBench
      34 Environments · 217 Tasks
      7,098 Checks · 32.7 per Task
      Plus 32 Conflict Instances
    type: database
    size: xl
    position:
      x: 980
      'y': 450
  - id: execute
    label: |-
      Execute Candidate Agents
      Use Packaged Repository Environments
      Route Calls through Proxy Logger
      Capture Responses and Tool Actions
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: normalize
    label: |-
      Normalize Full Trajectories
      Unified Messages and Tools Format
      Deduplicate Artifacts
      Truncate while Preserving Evidence
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: judge
    label: |-
      Judge Each Check Independently
      GPT-5.1 · Sonnet 4.5 · Gemini 3 Pro
      Inspect All Turns and Tool Calls
      Average the Three Judge Scores
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Compliance
      ISR: All Applicable Checks Pass
      CSR: Mean Check-item Success
      Overall avg@3 plus Category Views
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
