meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OctoBench 构建与评测流程
  description: 对齐论文的仓库落地脚手架指令遵循任务与二元检查表构建流程，以及基于完整轨迹的实例级和检查项级评测。
  legend: OctoBench 区分严格的实例成功率 ISR 与检查项成功率 CSR：前者要求某实例所有适用检查均通过，后者按独立检查项给予部分分。
nodes:
  - id: sources
    label: |-
      收集多源指令材料
      仓库策略文件与技能文档
      系统和用户提示及记忆
      工具模式与系统提醒
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: environment
    label: |-
      打包可执行环境
      规范化约束承载材料
      加入仓库与持久状态
      构建独立 Docker 镜像
    type: database
    size: xl
    position:
      x: 260
      'y': 70
  - id: scaffolds
    label: |-
      实例化三种脚手架
      Claude Code
      Kilo
      Droid
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: seed
    label: |-
      人工编写 72 个种子实例
      激活预期约束
      要求二元可核验
      保证任务可执行
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: expand
    label: |-
      扩展至 217 个实例
      使用模型辅助演化
      抽样检查生成实例
      核验目标性与合理性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: reference
    label: |-
      运行固定参考智能体
      使用 GPT-5.1
      每题独立运行 16 次
      记录规范化轨迹
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: propose
    label: |-
      提议原子检查项
      覆盖每个有证据的指令源
      结果仅为成功或失败
      纳入已触发的隐藏约束
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: consolidate
    label: |-
      合并检查表
      去重 16 次运行草案
      统一检查类别
      仅保留实际存在的指令源
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: audit
    label: |-
      审核检查表质量
      人类与模型联合复审
      人工抽查 20%
      分层双标注员审计
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布 OctoBench
      34 个环境 · 217 个任务
      7,098 项检查 · 每题平均 32.7 项
      另含 32 个冲突实例
    type: database
    size: xl
    position:
      x: 980
      'y': 450
  - id: execute
    label: |-
      执行候选智能体
      使用已打包仓库环境
      通过代理记录模型调用
      捕获回答与工具行为
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: normalize
    label: |-
      规范化完整轨迹
      统一消息与工具格式
      去重重复材料
      在保留证据下截断长输出
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: judge
    label: |-
      独立判断每个检查项
      GPT-5.1 · Sonnet 4.5 · Gemini 3 Pro
      检查全部轮次与工具调用
      取三个评判器平均分
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告指令遵循结果
      ISR：全部适用检查通过
      CSR：检查项成功率均值
      总体 avg@3 与分类结果
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: environment
    type: primary
  - from: environment
    to: scaffolds
    type: primary
  - from: scaffolds
    to: seed
    type: primary
  - from: seed
    to: expand
    type: primary
  - from: expand
    to: reference
    type: primary
  - from: reference
    to: propose
    type: primary
  - from: propose
    to: consolidate
    type: primary
  - from: consolidate
    to: audit
    type: primary
  - from: audit
    to: release
    type: primary
  - from: release
    to: execute
    type: primary
  - from: execute
    to: normalize
    type: primary
  - from: normalize
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
