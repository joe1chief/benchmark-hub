meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InfiniteBench Build Process
  description: >-
    Paper-aligned InfiniteBench workflow: realistic long novels, scripts, and repositories are manually processed into
    annotated tasks, synthetic retrieval/code/math contexts target four long-context abilities, and both branches form
    3,946 English and Chinese examples across 12 tasks with roughly 200K average tokens.
  legend: Solid arrows show realistic and synthetic construction branches, suite assembly, and task-specific evaluation.
nodes:
  - id: realistic_sources
    label: |-
      Realistic Long Sources
      Online Novels + Scripts
      PyPI Repositories (64K–256K)
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: realistic_processing
    label: |-
      Source Processing
      Filter + Entity Replacement
      Clean / Mask / Pad Scripts
      Flatten Code + Insert 1 Bug
    type: process
    size: xl
    position:
      x: 300
      'y': 80
  - id: human_tasks
    label: |-
      Five Human Pipelines
      Novel Sum / QA / MC
      Dialogue QA + Code.Debug
    type: user
    size: xl
    position:
      x: 560
      'y': 80
  - id: synthetic_sources
    label: |-
      Synthetic Contexts
      Retrieval + Code + Math
    type: database
    size: large
    position:
      x: 40
      'y': 400
  - id: ability_tasks
    label: |-
      Controlled Tasks
      Location / Resolution
      State / Sequential Processing
    type: process
    size: xl
    position:
      x: 300
      'y': 400
  - id: suite
    label: |-
      InfiniteBench Suite
      3,946 Examples / 12 Tasks
      5 Domains; English + Chinese
    type: database
    size: xl
    position:
      x: 820
      'y': 240
  - id: length
    label: |-
      Long-context Inputs
      Average ≈200K Tokens
      Beyond 100K on Average
    type: document
    size: xl
    position:
      x: 1080
      'y': 240
  - id: model_eval
    label: |-
      Long-context Model Runs
      Task-specific Prompts
    type: process
    size: large
    position:
      x: 1340
      'y': 240
  - id: metrics
    label: |-
      Task-specific Scores
      Accuracy / ROUGE-L-Sum
      Invalid MC Output = 0
    type: terminal
    size: xl
    position:
      x: 1600
      'y': 240
edges:
  - from: realistic_sources
    to: realistic_processing
    type: primary
  - from: realistic_processing
    to: human_tasks
    type: primary
  - from: human_tasks
    to: suite
    type: primary
  - from: synthetic_sources
    to: ability_tasks
    type: primary
  - from: ability_tasks
    to: suite
    type: primary
  - from: suite
    to: length
    type: primary
  - from: length
