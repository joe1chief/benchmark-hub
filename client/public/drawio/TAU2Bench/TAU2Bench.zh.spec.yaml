meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: τ²-bench 构建与评测流程
  description: >-
    τ²-bench扩展τ-bench，引入建模为Dec-POMDP的电信双控领域：代理与用户各有不同工具，共同改变动态状态。LLM生成产品需求文档、代理CRM模式、工具实现、模拟数据库和单元测试，人工修复至全部测试通过；同样流程构建模拟手机状态，以及用户侧15个读工具和15个写工具。每个电信原子子任务定义初始化、解法和断言函数；从互斥组中最多选择一个子任务进行组合，并自动验证必须执行全部解法后才成功。覆盖3种意图的15个子任务组生成2285题，再按意图与子任务数平衡抽取114题。LLM起草故障排查政策，人工联合完善工具、政策与原子任务，任务再随机分配无、简单或困难用户画像。加上继承的115个零售和50个航空任务，论文共评279题。电信以最终状态断言判定成功；每题零温运行4次并报告pass^k，无用户模式让代理控制全部工具，以区分推理错误与沟通协调错误。
  legend: >-
    来源：τ²-bench arXiv:2506.07982 Sections 3-4 and Appendices A-D; official sierra-research/tau2-bench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
