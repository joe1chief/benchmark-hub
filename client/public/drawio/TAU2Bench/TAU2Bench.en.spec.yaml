  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: τ²-bench Build and Evaluation Process
  description: >-
    τ²-bench extends τ-bench with a telecom dual-control domain modeled as a Dec-POMDP in which agent and user have
    distinct tools acting on shared dynamic state. LLMs generate a product requirements document, agent CRM schema, tool
    implementations, mock database, and unit tests; humans repair them until tests pass. The same process creates a
    mocked user phone, its state, and 15 read plus 15 write user tools. Each atomic telecom subtask defines
    initialization, solution, and assertion functions. At most one subtask from each mutually exclusive group is
    composed, and generated tasks are automatically checked to require every solution. Fifteen subtask groups across
    three intents yield 2,285 tasks; 114 are balanced by intent and subtask count. LLMs draft the troubleshooting
    policy, humans jointly refine tools, policy, and subtasks, and tasks receive None, Easy, or Hard personas. Together
    with the inherited 115 retail and 50 airline tasks, the paper evaluates 279 tasks. Telecom success is determined by
    final-state assertions. Each task runs four times at temperature zero; pass^k is reported, and no-user mode gives
    the agent all tools to separate reasoning errors from communication and coordination errors.
  legend: >-
    Source: τ²-bench arXiv:2506.07982 Sections 3-4 and Appendices A-D; official sierra-research/tau2-bench repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
