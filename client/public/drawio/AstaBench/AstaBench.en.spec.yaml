    to: adapt_filter
    type: primary
  - from: existing_evals
    to: adapt_filter
    type: data
  - from: new_evals
    to: adapt_filter
    type: data
  - from: adapt_filter
    to: suite
    type: primary
  - from: suite
    to: corpus
    type: primary
  - from: suite
    to: snippet
    type: primary
  - from: suite
    to: notebook
    type: primary
  - from: corpus
    to: runtime
    type: data
  - from: snippet
    to: runtime
    type: data
  - from: notebook
    to: runtime
    type: data
  - from: runtime
    to: agent_panel
    type: primary
  - from: agent_panel
    to: execution
    type: primary
  - from: execution
    to: scores_cost
    type: primary
  - from: scores_cost
