meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AstaBench Paper-Aligned Build Process
  description: >-
    Suite assembly, controlled tools, Inspect runtime, agent execution, and accuracy-cost analysis aligned with
    AstaBench v2.
  legend: >-
    Table 2 partitions all 11 Inspect tasks into four Corpus, one Snippet, and six Code bindings; no task receives all
    tools.
nodes:
  - id: product_requests
    label: |-
      Gather Product Requests
      Deployed Asta Agents
      Scientific User Needs
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: existing_evals
    label: |-
      Gather Existing Evaluations
      Literature • Code • Data
      Retain Official Contracts
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: new_evals
    label: |-
      Create New Evaluations
      Product-Grounded Tasks
      Fill Scientific Gaps
    type: database
    size: xl
    position:
      x: 40
      'y': 460
  - id: adapt_filter
    label: |-
      Adapt or Filter Sources
      Ensure Tool Answerability
      Apply Evidence Cutoffs
    type: process
    size: xl
    position:
      x: 320
      'y': 250
  - id: suite
    label: |-
      Package 11 Benchmarks
      2,404 Validation + Test Items
      Uniform Task Interfaces
    type: database
    size: xl
    position:
      x: 600
      'y': 250
  - id: corpus
    label: |-
      Corpus Tools • 4 Benchmarks
      PaperFinding • LitQA2-Search
      ScholarQA-CS2 • LitQA2-FullText
    type: database
    size: xl
    position:
      x: 880
      'y': 40
  - id: snippet
    label: |-
      Snippet Tool • 1 Benchmark
      ArxivDIGESTables-Clean
      Restricted to Problem Paper IDs
    type: process
    size: xl
    position:
      x: 880
      'y': 250
  - id: notebook
    label: |-
      Code Tools • 6 Benchmarks
      SUPER • CORE • DS-1000
      Discovery • E2E • E2E-Hard
    type: process
    size: xl
    position:
      x: 880
      'y': 460
  - id: runtime
    label: |-
      Register Tasks in Inspect
      Use Each Listed Tool Binding
      Preserve Task Contracts
    type: process
    size: xl
    position:
      x: 1160
      'y': 250
  - id: agent_panel
    label: |-
      Select Agents + Tool Configs
      General + Scientific Agents
      Match Supported Categories
    type: process
    size: xl
    position:
      x: 1440
      'y': 250
  - id: execution
    label: |-
      Execute Applicable Combinations
      Preserve Outputs and Usage
      Measure Runtime and Cost
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
  - id: scores_cost
    label: |-
      Compute Scores and Cost
      Task-Specific Accuracy
      Frozen Price Accounting
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: pareto
    label: |-
      Report Cost-Accuracy Pareto
      Leaderboard + Uncertainty
      Reproducibility Labels
    type: terminal
    size: xl
    position:
      x: 880
      'y': 600
edges:
