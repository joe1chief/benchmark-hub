meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AstaBench Build Process
  description: >-
    Paper-aligned scientific benchmark-suite assembly, reproducible tool environment, agent execution, and accuracy-cost
    reporting workflow based on arXiv:2510.21652.
  legend: >-
    AstaBench evaluates general and science-optimized agents across 11 benchmarks while controlling the search/code
    environment and reporting benchmark performance together with time-invariant cost.
nodes:
  - id: product_inputs
    label: |-
      Gather Product-Informed Tasks
      Requests from Deployed Asta Agents
      Real Scientific Research Use Cases
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: existing_evals
    label: |-
      Gather Scientific Evaluations
      Literature • Coding • Data Analysis
      Existing and Newly Created Datasets
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: assembly
    label: |-
      Assemble the Research Suite
      Adapt Source Datasets Where Needed
      Add Product-Grounded New Benchmarks
    type: process
    size: xl
    position:
      x: 320
      'y': 170
  - id: categories
    label: |-
      Cover Four Research Categories
      Literature Understanding • Code and Execution
      Data Analysis • End-to-End Discovery
    type: database
    size: xl
    position:
      x: 600
      'y': 170
  - id: benchmark_set
    label: |-
      Define 11 Benchmarks
      Search • QA • Reports • Tables • Experiments
      Reproduction • Hypotheses • Full Projects
    type: document
    size: xl
    position:
      x: 880
      'y': 170
  - id: answerability
    label: |-
      Filter for Tool Answerability
      Modify Cited Sets When Necessary
      Match Date Cutoffs and Available Evidence
    type: process
    size: xl
    position:
      x: 1160
      'y': 170
  - id: release
    label: |-
      Package AstaBench
      2,404 Test + Validation Questions
      Uniform General-Agent Interfaces
    type: database
    size: xl
    position:
      x: 1440
      'y': 170
  - id: corpus
    label: |-
      Provide Asta Scientific Corpus
      MCP Search and Full-Text Retrieval
      Enforce Date Cutoffs or Paper IDs
    type: process
    size: xl
    position:
      x: 1440
      'y': 420
  - id: notebook
    label: |-
      Provide Computational Notebook
      Stateful Python Cells in a Sandbox
      Five-Minute Per-Cell Timeout
    type: process
    size: xl
    position:
      x: 1440
      'y': 650
  - id: framework
    label: |-
      Standardize Evaluation Runtime
      Inspect Benchmark Implementations
      agent-eval Suite and Leaderboard Layer
    type: process
    size: xl
    position:
      x: 1160
      'y': 530
  - id: agents
    label: |-
      Select Agent Panel
      Nine Science-Optimized Asta Classes
      General and External Baselines
    type: process
    size: xl
    position:
      x: 880
      'y': 530
  - id: execution
    label: |-
      Execute 57 Agents across 22 Classes
      Use Standard or Declared Custom Tools
      Preserve Logs, Usage, and Task Outputs
    type: process
    size: xl
    position:
      x: 600
      'y': 530
  - id: scoring
    label: |-
      Score Each Benchmark
      Accuracy or Task-Specific Resolve Measure
      Report Standard Deviation
    type: process
    size: xl
    position:
      x: 320
      'y': 530
  - id: confounders
    label: |-
      Account for Confounders
      Frozen Price Map + Cache Discounts
      Agent Openness and Tooling Categories
    type: process
    size: xl
    position:
      x: 40
      'y': 530
  - id: report
    label: |-
      Publish Accuracy-Cost Leaderboard
      Score versus Normalized Dollar Cost
      Pareto Frontier and Reproducibility Labels
    type: terminal
    size: xl
    position:
      x: 40
      'y': 820
