meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AstaBench 论文对齐构建流程
  description: 依据 AstaBench v2，展示套件汇编、受控工具、Inspect 运行时、Agent 执行与准确率成本分析。
  legend: Table 2 将 11 个 Inspect 任务明确分为 4 个语料库、1 个片段和 6 个代码工具绑定；没有任务同时获得全部工具。
nodes:
  - id: product_requests
    label: |-
      收集产品请求
      来自已部署 Asta Agent
      真实科研用户需求
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: existing_evals
    label: |-
      收集既有评测
      文献 • 代码 • 数据
      保留官方任务合同
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: new_evals
    label: |-
      创建新增评测
      源于产品的任务
      补齐科研能力空白
    type: database
    size: xl
    position:
      x: 40
      'y': 460
  - id: adapt_filter
    label: |-
      改造或过滤来源
      确保工具可作答
      应用证据时间边界
    type: process
    size: xl
    position:
      x: 320
      'y': 250
  - id: suite
    label: |-
      打包 11 个基准
      2,404 道验证集与测试集题目
      统一任务接口
    type: database
    size: xl
    position:
      x: 600
      'y': 250
  - id: corpus
    label: |-
      语料库工具 • 4 个基准
      PaperFinding • LitQA2-Search
      ScholarQA-CS2 • LitQA2-FullText
    type: database
    size: xl
    position:
      x: 880
      'y': 40
  - id: snippet
    label: |-
      片段工具 • 1 个基准
      ArxivDIGESTables-Clean
      仅检索题目指定论文 ID
    type: process
    size: xl
    position:
      x: 880
      'y': 250
  - id: notebook
    label: |-
      代码工具 • 6 个基准
      SUPER • CORE • DS-1000
      Discovery • E2E • E2E-Hard
    type: process
    size: xl
    position:
      x: 880
      'y': 460
  - id: runtime
    label: |-
      在 Inspect 中注册任务
      使用上列逐任务工具绑定
      保留各任务合同
    type: process
    size: xl
    position:
      x: 1160
      'y': 250
  - id: agent_panel
    label: |-
      选择 Agent 与工具配置
      通用与科研 Agent
      匹配支持的任务类别
    type: process
    size: xl
    position:
      x: 1440
      'y': 250
  - id: execution
    label: |-
      执行适用的 Agent-任务组合
      保存输出与用量
      测量运行时间与成本
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
  - id: scores_cost
    label: |-
      计算分数与成本
      任务特定准确率
      固定价格核算
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: pareto
    label: |-
      报告成本-准确率 Pareto
      排行榜与不确定性
      可复现性标记
    type: terminal
    size: xl
    position:
      x: 880
      'y': 600
edges:
  - from: product_requests
    to: adapt_filter
    type: primary
  - from: existing_evals
    to: adapt_filter
    type: data
  - from: new_evals
    to: adapt_filter
    type: data
  - from: adapt_filter
    to: suite
    type: primary
  - from: suite
    to: corpus
    type: primary
  - from: suite
    to: snippet
    type: primary
  - from: suite
    to: notebook
    type: primary
  - from: corpus
    to: runtime
    type: data
  - from: snippet
    to: runtime
    type: data
  - from: notebook
    to: runtime
    type: data
  - from: runtime
    to: agent_panel
    type: primary
  - from: agent_panel
    to: execution
    type: primary
  - from: execution
    to: scores_cost
    type: primary
  - from: scores_cost
    to: pareto
    type: primary
modules: []
