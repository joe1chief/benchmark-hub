meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AstaBench 构建流程
  description: 基于 arXiv:2510.21652 对齐的科学基准套件组装、可复现工具环境、Agent 执行与准确率-成本汇报流程。
  legend: AstaBench 在 11 个基准上评测通用与科学优化 Agent，同时控制搜索/代码环境，并将任务表现与时间不变的标准化成本共同汇报。
nodes:
  - id: product_inputs
    label: |-
      收集产品驱动任务
      来自已部署 Asta Agent 的请求
      真实科学研究用例
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: existing_evals
    label: |-
      汇集科学评测数据
      文献 • 编程 • 数据分析
      已有与新构建数据集
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: assembly
    label: |-
      组装科学研究套件
      必要时适配来源数据集
      加入产品落地的新基准
    type: process
    size: xl
    position:
      x: 320
      'y': 170
  - id: categories
    label: |-
      覆盖四类研究能力
      文献理解 • 代码与执行
      数据分析 • 端到端发现
    type: database
    size: xl
    position:
      x: 600
      'y': 170
  - id: benchmark_set
    label: |-
      定义 11 个基准
      检索 • 问答 • 报告 • 表格 • 实验
      复现 • 假设发现 • 完整研究项目
    type: document
    size: xl
    position:
      x: 880
      'y': 170
  - id: answerability
    label: |-
      按工具可解性筛选
      必要时修改引用数据集
      对齐日期截止点与可用证据
    type: process
    size: xl
    position:
      x: 1160
      'y': 170
  - id: release
    label: |-
      封装 AstaBench
      测试与验证共 2,404 题
      统一通用 Agent 接口
    type: database
    size: xl
    position:
      x: 1440
      'y': 170
  - id: corpus
    label: |-
      提供 Asta Scientific Corpus
      MCP 检索与全文读取
      强制日期截止点或论文 ID
    type: process
    size: xl
    position:
      x: 1440
      'y': 420
  - id: notebook
    label: |-
      提供 Computational Notebook
      沙箱内有状态 Python 单元格
      每单元格五分钟超时
    type: process
    size: xl
    position:
      x: 1440
      'y': 650
  - id: framework
    label: |-
      标准化评测运行时
      Inspect 基准实现
      agent-eval 套件与排行榜层
    type: process
    size: xl
    position:
      x: 1160
      'y': 530
  - id: agents
    label: |-
      选择 Agent 面板
      九类科学优化 Asta Agent
      通用与外部基线
    type: process
    size: xl
    position:
      x: 880
      'y': 530
  - id: execution
    label: |-
      执行 22 类共 57 个 Agent
      使用标准或声明的自定义工具
      保存日志、用量与任务输出
    type: process
    size: xl
    position:
      x: 600
      'y': 530
  - id: scoring
    label: |-
      按基准评分
      准确率或任务特定解答指标
      报告标准差
    type: process
    size: xl
    position:
      x: 320
      'y': 530
  - id: confounders
    label: |-
      控制评测混淆因素
      冻结价格表 + 缓存折扣
      Agent 开放性与工具类别
    type: process
    size: xl
    position:
      x: 40
      'y': 530
  - id: report
    label: |-
      发布准确率-成本排行榜
      分数与标准化美元成本
      Pareto 前沿与可复现性标签
    type: terminal
    size: xl
    position:
      x: 40
      'y': 820
edges:
  - from: product_inputs
    to: assembly
    type: primary
  - from: existing_evals
    to: assembly
    type: data
  - from: assembly
    to: categories
    type: primary
  - from: categories
    to: benchmark_set
    type: primary
  - from: benchmark_set
    to: answerability
    type: primary
  - from: answerability
    to: release
    type: primary
  - from: release
    to: corpus
    type: primary
  - from: release
    to: notebook
    type: data
  - from: corpus
    to: framework
    type: primary
  - from: notebook
    to: framework
    type: primary
  - from: framework
    to: agents
    type: primary
  - from: agents
    to: execution
    type: primary
  - from: execution
    to: scoring
    type: primary
  - from: scoring
    to: confounders
    type: primary
  - from: confounders
    to: report
    type: primary
modules: []
