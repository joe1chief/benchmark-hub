meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AstaBench 构建流程
  description: 基于 arXiv:2510.21652，对齐 AstaBench 科研 Agent 套件、可复现 Asta Environment、标准评分层、 Agent 基线和排行榜的构建流程。
  legend: 实线表示基准套件构建与评测主流程；虚线表示可回答性、可复现性和混淆因素分析反馈。
nodes:
  - id: product_inputs
    label: |-
      产品化输入
      已部署 Asta 请求
      现有科研评测
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: principles
    label: |-
      基准原则
      整体科研能力
      可复现且计成本
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: suite_assembly
    label: |-
      套件组装
      11 个 benchmark
      四类科研任务
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: answerable_tasks
    label: |-
      可回答性过滤
      修改引用数据集
      确保工具可解
    type: decision
    size: xl
    position:
      x: 560
      'y': 160
  - id: environment
    label: |-
      Asta 环境
      科学语料工具
      Notebook 沙箱
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: tool_contract
    label: |-
      工具契约
      MCP 接口
      日期截断与论文 ID
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: agent_suite
    label: |-
      Agent 套件
      九类 Asta Agent
      多种基线 Agent
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 70
  - id: scoring
    label: |-
      评分层
      Inspect 加 agent-eval
      Rubric 或程序评分
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: leaderboard
    label: |-
      AstaBench 报告
      57 Agent / 22 类
      准确率-成本榜单
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: product_inputs
    to: principles
    type: primary
  - from: principles
    to: suite_assembly
    type: primary
  - from: suite_assembly
    to: answerable_tasks
    type: primary
  - from: answerable_tasks
    to: environment
    type: primary
  - from: answerable_tasks
    to: suite_assembly
    type: optional
    label: 修订或过滤
  - from: environment
    to: tool_contract
    type: primary
  - from: tool_contract
    to: agent_suite
    type: primary
  - from: agent_suite
    to: scoring
    type: primary
  - from: scoring
    to: leaderboard
    type: primary
  - from: leaderboard
    to: scoring
    type: optional
    label: 混淆因素分析
modules: []
