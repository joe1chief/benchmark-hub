meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KernelBench Build and Evaluation Process
  description: >-
    Paper-aligned KernelBench construction and evaluation: package 250 evaluation-only PyTorch tasks as three parallel
    difficulty partitions, generate ModelNew kernels, verify five randomized inputs, and measure exact fast_p scores on
    the paper's fixed L40S software and hardware environment.
  legend: >-
    The three colored task lanes are parallel partitions, not a serial transformation. Dashed arrows mark primary
    evidence, the fixed execution environment, and paper-versus-current artifact boundaries.
