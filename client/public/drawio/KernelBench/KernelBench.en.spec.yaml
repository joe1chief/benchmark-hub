      Paper Defines 250 Evaluation Tasks
    type: document
    size: xl
    position:
      x: 20
      'y': 360
  - id: workloads
    label: |-
      Curate Real PyTorch Workloads
      Modern Deep-learning Operators
      Operator Sequences and Models
      Level 3 Uses Popular Repositories
    type: database
    size: xl
    position:
      x: 300
      'y': 360
  - id: format
    label: |-
      Package Standard Task Artifact
      torch.nn.Module Model
      get_inputs + get_init_inputs
      Fix Shapes · Dtypes · Initialization
    type: document
    size: xl
    position:
      x: 580
      'y': 360
  - id: level1
    label: |-
