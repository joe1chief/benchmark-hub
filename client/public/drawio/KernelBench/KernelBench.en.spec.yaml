meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KernelBench Build and Evaluation Process
  description: >-
    Paper-aligned workload curation, three-level PyTorch task packaging, custom-kernel generation, randomized
    correctness checks, hardware timing, and fast_p scoring.
  legend: >-
    The top row enumerates task packaging and the paper's three benchmark partitions; the bottom row reads right-to-left
    through one-shot generation and target-GPU evaluation.
nodes:
  - id: workloads
    label: |-
      Real AI Workloads
      Modern Deep-Learning Operators and Models
      Level 3 Architectures from Popular GitHub Repositories
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: format
    label: |-
      Standard PyTorch Task Format
      torch.nn.Module Model with init + forward
      get_inputs + get_init_inputs Fix Shapes / Precision
    type: document
    size: xl
    position:
      x: 320
      'y': 100
  - id: level1
    label: |-
      Level 1 Partition: 100 Tasks
      Single Primitive Operations
      Convolution, Matmul, Loss, Activation, Normalization
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: level2
    label: |-
      Level 2 Partition: 100 Tasks
      Multi-Operator Sequences
      Fusion Opportunities beyond Separate Kernels
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: level3
    label: |-
      Level 3 Partition: 50 Tasks
      Full ML Architectures
      AlexNet, MiniGPT, and Other End-to-End Models
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Paper Benchmark: 250 Tasks
      Evaluation-Only; No Gold Kernels
      PyTorch Reference Is the Correctness / Timing Oracle
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: prompt
    label: |-
      One-Shot Optimization Prompt
      One Add Model / ModelNew Example
      Reference Model + Exact Input Generators
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: generate
    label: |-
      Greedy Kernel Generation
      Return ModelNew with Custom Optimizations
      CUDA / PTX / CUTLASS / Triton or Other Libraries
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: compile
    label: |-
      Compile and Execute
      Build Inline Extensions on the Target GPU
      Reject Compile, Runtime, Shape, or Value Failures
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: correctness
    label: |-
      Randomized Correctness Gate
      Compare Model and ModelNew Outputs
      All Five Random Inputs Must Match
    type: decision
    size: xl
    position:
      x: 600
      'y': 440
  - id: timing
    label: |-
      Target-GPU Timing
      Three Warm-Ups + 100 CUDA-Event Trials
      Mean Speedup = PyTorch Eager Time / ModelNew Time
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      KernelBench Results
      fast(p): Correct with Speedup Above p
      fast(0) = Correctness; fast(1) = Faster Than PyTorch
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: workloads
    to: format
    type: primary
  - from: format
    to: level1
    type: primary
  - from: level1
    to: level2
    type: primary
  - from: level2
    to: level3
    type: primary
  - from: level3
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: generate
    type: primary
  - from: generate
    to: compile
    type: primary
  - from: compile
    to: correctness
    type: primary
  - from: correctness
    to: timing
    type: primary
  - from: timing
    to: report
    type: primary
modules: []
