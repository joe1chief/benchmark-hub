      x: 880
      'y': 360
  - id: level3
    label: |-
      Level 3 · 50 Tasks
      Full ML Architectures
      End-to-end PyTorch Models
      Sourced from Popular Repositories
    type: process
    size: xl
    position:
      x: 880
      'y': 680
  - id: release
    label: |-
      Paper Contract · 250 Tasks
      L1 / L2 / L3 Are Parallel Partitions
      Evaluation-only PyTorch References
      No Gold / Optimized Kernels Supplied
    type: database
    size: xl
    position:
      x: 1180
      'y': 360
  - id: scope_boundary
    label: |-
      Paper Scope Boundary
      Pre-paper Repository History Had L4
      L4 Is Outside the Paper's 250 Tasks
      No Split / Dedup / Contamination Reported
    type: document
    size: xl
    position:
      x: 1180
      'y': 680
  - id: artifact_boundary
    label: |-
      Artifact / Revision Boundary
      Candidate Git 1f7b25b: Untagged
      Current Git 423217d: Material Task Drift
      HF v0.1 ca1464e: Includes 20 L4 Tasks
      Current Loader Accepts Only L1 / L2 / L3
    type: document
    size: xl
    position:
      x: 1480
      'y': 680
  - id: prompt
    label: |-
      One-shot Optimization Prompt
      One Addition Model / ModelNew Example
      Task Reference Model
      Exact Input Generators
    type: document
    size: xl
    position:
      x: 1480
      'y': 360
  - id: generate
    label: |-
      Greedily Decode ModelNew
      Replace PyTorch Ops with Custom GPU Code
      CUDA · PTX · CUTLASS · Triton
      Or Other Suitable Libraries
    type: process
    size: xl
    position:
      x: 1760
      'y': 360
  - id: environment
    label: |-
      Paper Evaluation Environment
      Bare-metal NVIDIA L40S · Ada
      48 GB · 300 W
      Python 3.10 · PyTorch 2.5.0+cu124
      CUDA 12.4
    type: document
    size: xl
    position:
      x: 2040
      'y': 40
  - id: compile
    label: |-
      Compile + Execute on Target GPU
      Compile Returned ModelNew Code
      Reject Compile / Runtime Failures
      Reject Shape / Value Failures
    type: process
    size: xl
    position:
      x: 2040
      'y': 360
  - id: correctness
    label: |-
      Randomized Correctness Gate
      Generate 5 Randomized Inputs
      Compare Model vs ModelNew Outputs
      All 5 Must Match → correct_i = 1
    type: process
    size: xl
    position:
      x: 2320
      'y': 360
  - id: timing
    label: |-
      Measure Target-GPU Latency
      3 Warm-ups + 100 CUDA-event Trials
      s_i = mean(T_Eager) / mean(T_New)
      Time Both on the Same L40S
    type: process
    size: xl
    position:
      x: 2600
      'y': 360
  - id: report
    label: |-
      Report fast_p over N = 250
      fast_p = (1/N) Σ 1[correct_i and s_i > p]
      fast_0 = Correctness Fraction
      fast_1 = Correct and Faster than Eager
    type: terminal
    size: xl
    position:
      x: 2880
      'y': 360
