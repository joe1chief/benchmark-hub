meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GAIA 构建流程
  description: 与论文一致的 GAIA 466 题构建与评测流程。
  legend: 实线箭头对应 arXiv:2311.12983 披露的命题、独立验证、难度分级、发布和准精确匹配评测阶段； 图中不暗示论文未规定的固定工具轨迹。
nodes:
  - id: design
    label: |-
      设定任务设计原则
      真实世界、对人类概念简单
      不易投机 · 唯一且简短的事实答案
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: sources
    label: |-
      选择稳定证据来源
      可信网页 · 随附文件 · 自包含谜题
      图像、表格、PDF、音频或视频
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: author
    label: |-
      人工编写每道问题
      论文作者与 Surge 付费标注员参与
      组合多源证据和所需助手能力
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: annotation
    label: |-
      命题者记录参考信息包
      短答案 · 工具 · 步骤 · 预计时间
      必要时记录网页日期或版本证据
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: validation
    label: |-
      两名新标注员独立作答
      三人答案一致才直接通过
      检查证据可访问性、表述与歧义
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: repair
    label: |-
      修订分歧题或删除题目
      68% 无需修改即可通过
      每个保留问题约投入 2 人时
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: levels
    label: |-
      划分三个难度等级
      L1：≤1 个工具且 ≤5 步 · L2：约 5–10 步
      L3：长操作序列和任意工具组合
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: release
    label: |-
      汇总 466 个已验证问题
      开发集：166 题并公开标注
      测试集：300 题，答案隐藏
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: run
    label: |-
      零样本运行通用助手
      按需推理、浏览、编程和调用工具
      按要求的最终格式返回答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: score
    label: |-
      按标准答案类型归一化输出
      对短答案执行准精确匹配
      报告分级与总体准确率
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
edges:
  - from: design
    to: sources
    type: primary
  - from: sources
    to: author
    type: primary
  - from: author
    to: annotation
    type: primary
  - from: annotation
    to: validation
    type: primary
  - from: validation
    to: repair
    type: primary
  - from: repair
    to: levels
    type: primary
  - from: levels
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
