meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GAIA Build Process
  description: Paper-aligned construction and evaluation flow for the 466-question GAIA benchmark.
  legend: >-
    Solid arrows follow the disclosed authoring, independent validation, difficulty assignment, release, and
    quasi-exact-match evaluation stages in arXiv:2311.12983; no undisclosed fixed tool trajectory is implied.
nodes:
  - id: design
    label: |-
      Set task-design principles
      real-world yet conceptually simple for humans
      non-gameable · concise unique factoid answer
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: sources
    label: |-
      Select stable evidence sources
      trusted web pages · attached files · puzzles
      images, spreadsheets, PDFs, audio or video
    type: database
    size: xl
    position:
      x: 300
      'y': 250
  - id: author
    label: |-
      Human authors craft each question
      paper authors plus paid Surge annotators
      combine sources and required assistant skills
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: annotation
    label: |-
      Author records the reference package
      short answer · tools · steps · estimated time
      dated/versioned web evidence where needed
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: validation
    label: |-
      Two new annotators answer independently
      validate only when all three answers agree
      check evidence access, wording, and ambiguity
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: repair
    label: |-
      Repair disagreements or remove the item
      68% accepted without correction
      about 2 human-hours per retained question
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: levels
    label: |-
      Assign one of three difficulty levels
      L1: ≤1 tool and ≤5 steps · L2: ~5–10 steps
      L3: long sequences and unrestricted tool mix
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: release
    label: |-
      Assemble 466 validated questions
      developer set: 166 with annotations
      test set: 300 questions with hidden answers
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: run
    label: |-
      Run a zero-shot general assistant
      reason, browse, code, and use tools as needed
      return the answer in the required final format
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: score
    label: |-
      Normalize by ground-truth answer type
      apply quasi-exact short-answer matching
      report accuracy by level and overall
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 250
edges:
  - from: design
    to: sources
    type: primary
  - from: sources
    to: author
    type: primary
  - from: author
    to: annotation
    type: primary
  - from: annotation
    to: validation
    type: primary
  - from: validation
    to: repair
    type: primary
  - from: repair
    to: levels
    type: primary
  - from: levels
    to: release
    type: primary
  - from: release
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
