meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-Holmes Construction and Reasoning Diagnostics
  description: >-
    Video-Holmes searches more than 2,500 one-to-five-minute YouTube suspense shorts, manually curates 270 films, and
    creates structured annotations covering plot segments, character relations, reasoning shots, supernatural elements,
    and themes. Seven reasoning tasks are defined, then DeepSeek-R1 generates questions, answers, and explanations from
    the formatted annotations; manual sampling inspection yields 1,837 questions. Models answer multiple-choice
    questions from full videos, with audio where supported. Seven-task accuracy is primary, while DeepSeek-R1 separately
    categorizes validated reasoning traces using VPE/VOE/RE/TRAW for wrong answers and TWAR/TRAR for right answers;
    frame, audio, CoT, and text-only variants are analysis experiments.
  legend: >-
    Source: Video-Holmes arXiv:2505.21374 and official TencentARC/Video-Holmes repository. Solid arrows show the main
    flow explicitly supported by the paper or official documentation.
