meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-Holmes 构建与推理诊断流程
  description: >-
    Video-Holmes从YouTube检索2500多部1至5分钟悬疑短片，人工筛选270部，并按剧情分段、人物关系、推理镜头、超自然元素与主题制作结构化标注。论文定义7类推理任务，再让DeepSeek-R1依据格式化标注生成问题、答案和解释，经人工抽样检查后得到1837题。模型基于完整视频回答多选题，支持时加入音频。主指标是7任务准确率；另由DeepSeek-R1对已验证推理轨迹分类，错答分VPE/VOE/RE/TRAW，答对分TWAR/TRAR；帧数、音频、思维链和纯文本设置仅是分析实验。
  legend: 来源：Video-Holmes arXiv:2505.21374 and official TencentARC/Video-Holmes repository。实线箭头表示论文或官方资料明确支持的主流程。
