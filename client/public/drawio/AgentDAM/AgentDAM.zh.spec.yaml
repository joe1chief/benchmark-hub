meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentDAM 构建流程
  description: 基于 arXiv:2503.09780 对齐的数据构建、端到端 Web Agent 执行与隐私-效用评测流程。
  legend: 基准在真实行动中测量数据最小化；即使无关敏感事实自然出现在任务相关用户数据中，Agent 也不应披露它们。
nodes:
  - id: principle
    label: |-
      操作化数据最小化原则
      仅在与任务相关且必要时
      使用潜在隐私数据
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: web_apps
    label: |-
      选择 VisualWebArena 应用
      Reddit • Shopping • GitLab
      隔离且逼真的网页副本
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: sensitive_taxonomy
    label: |-
      定义敏感数据分类
      六类潜在隐私事实
      区分任务相关与无关数据
    type: database
    size: xl
    position:
      x: 320
      'y': 300
  - id: task_templates
    label: |-
      设计八类任务
      Shopping 3 类 • GitLab 3 类 • Reddit 2 类
      要求向网页应用输入信息
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: human_seeds
    label: |-
      人工编写 123 个数据种子
      user_instruction + PLOT
      将 SENSITIVE_DATA 作为无关背景
    type: user
    size: xl
    position:
      x: 600
      'y': 300
  - id: synthesize
    label: |-
      合成长篇 user_data
      LLM 生成连贯聊天或笔记
      每个人工种子采样两次
    type: process
    size: xl
    position:
      x: 880
      'y': 170
  - id: dataset
    label: |-
      封装 AgentDAM
      2 × 123 = 246 个任务
      指令 • user_data • Agent 元数据
    type: database
    size: xl
    position:
      x: 1160
      'y': 170
  - id: setup
    label: |-
      重置自托管环境
      无障碍树或多模态视图
      SOM 标记或原始截图
    type: process
    size: xl
    position:
      x: 1440
      'y': 170
  - id: execute
    label: |-
      端到端运行 Web Agent
      观察指令、数据与页面
      持续执行操作直至终止
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: utility
    label: |-
      评估任务效用
      检查最终环境状态
      二元任务成功奖励
    type: process
    size: xl
    position:
      x: 1160
      'y': 420
  - id: privacy
    label: |-
      评估隐私
      GPT-4o CoT 评审每个操作
      二元非必要披露标签
    type: process
    size: xl
    position:
      x: 1160
      'y': 620
  - id: judge_validation
    label: |-
      验证隐私评审器
      四名人工评审员
      与 LLM 判断一致率 98%
    type: user
    size: xl
    position:
      x: 880
      'y': 620
  - id: metrics
    label: |-
      汇报隐私-效用权衡
      泄露率与隐私表现
      按应用和模态拆分任务成功率
    type: terminal
    size: xl
    position:
      x: 600
      'y': 500
  - id: mitigation
    label: |-
      比较隐私缓解方法
      前置过滤 • 后置过滤
      隐私提示 + CoT 示例
    type: process
    size: xl
    position:
      x: 320
      'y': 500
edges:
  - from: principle
    to: web_apps
    type: primary
  - from: principle
    to: sensitive_taxonomy
    type: data
  - from: web_apps
    to: task_templates
    type: primary
  - from: sensitive_taxonomy
    to: human_seeds
    type: primary
  - from: task_templates
    to: human_seeds
    type: data
  - from: human_seeds
    to: synthesize
    type: primary
  - from: synthesize
    to: dataset
    type: primary
  - from: dataset
    to: setup
    type: primary
  - from: setup
    to: execute
    type: primary
  - from: execute
    to: utility
    type: primary
  - from: execute
    to: privacy
    type: primary
  - from: privacy
    to: judge_validation
    type: data
  - from: utility
    to: metrics
    type: primary
  - from: judge_validation
    to: metrics
    type: primary
  - from: metrics
    to: mitigation
    type: primary
modules: []
