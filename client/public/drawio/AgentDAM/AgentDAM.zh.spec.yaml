meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentDAM 构建流程
  description: 基于 arXiv:2503.09780 对齐的 AgentDAM 构建与隐私评估流程。
  legend: 实线表示任务构建和端到端网页 agent 评估主流程；虚线表示 privacy judge 验证与缓解分析回路。
nodes:
  - id: sensitive_taxonomy
    label: |-
      敏感数据分类
      六类 private 信息
      区分相关和无关
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: environments
    label: |-
      WebArena 环境
      Reddit、GitLab、Shopping
      隔离但真实的网页副本
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: seeds
    label: |-
      人工 seed 编写
      user_instruction
      plot 和敏感事实
    type: user
    size: xl
    position:
      x: 300
      'y': 250
  - id: user_data
    label: |-
      合成 user_data
      相关隐私事实
      无关敏感信息
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: agent_loop
    label: |-
      网页 agent 执行
      观察指令、数据、页面
      行动直到任务完成
    type: process
    size: xl
    position:
      x: 820
      'y': 160
  - id: utility
    label: |-
      Utility reward
      环境状态检查
      目标任务成功率
    type: decision
    size: xl
    position:
      x: 1080
      'y': 70
  - id: privacy
    label: |-
      Privacy evaluator
      LLM judge 检查 actions
      与人工 98% 一致
    type: decision
    size: xl
    position:
      x: 1080
      'y': 250
  - id: metrics
    label: |-
      AgentDAM 指标
      utility 与 privacy score
      泄露率分析
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: sensitive_taxonomy
    to: environments
    type: primary
  - from: sensitive_taxonomy
    to: seeds
    type: data
  - from: environments
    to: user_data
    type: primary
  - from: seeds
    to: user_data
    type: primary
  - from: user_data
    to: agent_loop
    type: primary
  - from: agent_loop
    to: utility
    type: primary
  - from: agent_loop
    to: privacy
    type: primary
  - from: privacy
    to: agent_loop
    type: optional
    label: mitigation prompts
  - from: utility
    to: metrics
    type: primary
  - from: privacy
    to: metrics
    type: primary
modules: []
