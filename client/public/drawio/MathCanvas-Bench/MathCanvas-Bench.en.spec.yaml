meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathCanvas-Bench Construction and Evaluation
  description: >-
    Paper- and release-aligned workflow from the 632K multimodal problem pool to the 3,079-item public benchmark, the
    separately decontaminated 218,604-item training set, and the released GPT-4.1 answer evaluator.
  legend: >-
    Solid arrows show retained data and evaluation flow. Labeled branches expose paper-defined exclusions, weighted
    benchmark selection, training-only leakage removal, valid-evaluation filtering, and single-part versus multi-part
    scoring. The paper rounds the public benchmark to 3K; the pinned release contains exactly 3,079 records.
nodes:
  - id: collect
    label: |-
      Collect Multimodal Math Problems
      Textbooks · Exams · Websites
      Middle + High School
      Start with about 632K Pairs
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: relevance_review
    label: |-
      First GPT-5 Review
      Test Whether Images Aid Reasoning
      Normalize Mathematical Formulas
      into LaTeX
    type: process
    size: xl
    position:
      x: 380
      'y': 40
  - id: relevance_gate
    label: |-
      Does the Image Contribute
      to the Reasoning Process?
    type: decision
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality_review
    label: |-
      Second GPT-5 Review
      Check Correctness + Explicit Answer
      Check Image Clarity
      Exclude Drawing-only Tasks
    type: process
    size: xl
    position:
      x: 1100
      'y': 40
  - id: quality_gate
    label: |-
      Correct, Answered, Clear,
      and Not Drawing-only?
    type: decision
    size: xl
    position:
      x: 1460
      'y': 40
  - id: deduplicate
    label: |-
      Deduplicate Text and Images
      Retain Unique Problem–Solution Pairs
      About 303K → About 222K
      Threshold Not Reported
    type: process
    size: xl
    position:
      x: 1820
      'y': 40
  - id: image_enhance
    label: |-
      Standardize All Images
      Apply SwinIR Super-resolution
      Resize to 512 × 512
      Preserve Problem–Solution Pairing
    type: process
    size: xl
    position:
      x: 2180
      'y': 40
  - id: taxonomy
    label: |-
      Classify with GPT-4.1
      Eight Major Knowledge Categories
      Add Fine-grained Subcategories
      Prepare Category-aware Sampling
    type: process
    size: xl
    position:
      x: 2540
      'y': 40
  - id: quality_reject
    label: |-
      Exclude from Curated Corpus
      Irrelevant Image or Quality Failure
    type: terminal
    size: xl
    position:
      x: 1100
      'y': 260
  - id: mcq_gate
    label: |-
      Multiple-choice Problem?
      Benchmark Eligibility Gate
    type: decision
    size: xl
    position:
      x: 2540
      'y': 380
  - id: weighted_sample
    label: |-
      Weighted Benchmark Sampling
      Raise Each Category Share to Power 0.7
      Increase Rare-type Representation
      Target about 3K Problems
    type: process
    size: xl
    position:
      x: 2180
      'y': 380
  - id: sample_gate
    label: |-
      Selected for the Weighted
      Benchmark Sample?
    type: decision
    size: xl
    position:
      x: 1820
      'y': 380
  - id: benchmark_release
    label: |-
      Release MathCanvas-Bench
      Paper: 3K Problems
      Public Snapshot: 3,079 Records
      Eight Test Configurations
    type: database
    size: xl
    position:
      x: 1460
      'y': 380
  - id: training_candidates
    label: |-
      Form Training Candidates
      Benchmark-ineligible MCQs
      + Non-selected Open Problems
      Apply Leakage Check Only Here
    type: database
    size: xl
    position:
      x: 2180
      'y': 800
  - id: leakage_gate
    label: |-
      5-gram Jaccard Similarity > 0.4
      to Any Benchmark Question?
    type: decision
    size: xl
    position:
      x: 1820
      'y': 800
  - id: training_release
    label: |-
      Release MathCanvas-Instruct
      218,604 Training Problems
      Paper Reports About 219K
      No Detected Near-test Question
    type: database
    size: xl
    position:
      x: 1460
      'y': 800
  - id: leakage_remove
    label: |-
      Remove from Training Set
      Similarity Exceeds 0.4
      Benchmark Item Remains Unchanged
    type: terminal
    size: xl
    position:
      x: 1820
      'y': 1030
  - id: model_output
    label: |-
      Run the Evaluated LMM
      Input Question + Initial Images
      Generate Interleaved Visual–Text
      Reasoning and Final Answers
    type: document
    size: xl
    position:
      x: 1100
      'y': 380
  - id: judge_input
    label: |-
      Prepare Official Judge Input
      Concatenate Text Reasoning Steps Only
      Add Question + Ground-truth Answer
      Images Are Not Sent to the Judge
    type: process
    size: xl
    position:
      x: 740
      'y': 380
  - id: gpt_judge
    label: |-
      Judge with GPT-4.1-2025-04-14
      Parse Tagged Ground-truth Parts
      Extract Matching Predicted Answers
      Missing Answer → null + Incorrect
    type: process
    size: xl
    position:
      x: 380
      'y': 380
  - id: valid_evaluation_gate
    label: |-
      API + Schema Successful
      and One to Four Parts?
    type: decision
    size: xl
    position:
      x: 20
      'y': 380
  - id: parts_gate
    label: |-
      How Many Ground-truth
      Answer Parts?
    type: decision
    size: xl
    position:
      x: 20
      'y': 650
  - id: invalid_evaluation
    label: |-
      Exclude from Metric Denominator
      API/Schema Failure or Unsupported Count
      Record Error or Skipped-item Count
    type: terminal
    size: xl
    position:
      x: 740
      'y': 650
  - id: single_score
    label: |-
      Score One Answer Part
      Correct → 1 · Incorrect → 0
      Weighted Score Equals Binary Score
    type: process
    size: xl
    position:
      x: 20
      'y': 930
  - id: multi_score
    label: |-
      Score Two to Four Parts
      Each Later Part Gets 1.3× Weight
      Normalize Weights to Sum to 1
      Sum Weights of Correct Parts
    type: process
    size: xl
    position:
      x: 380
      'y': 930
  - id: metrics
    label: |-
      Aggregate Official Metrics
      Denominator: valid_evaluations
      Complete: Mean All-parts-correct
      Weighted: Mean Per-problem Score
    type: terminal
    size: xl
    position:
      x: 740
      'y': 930
edges:
  - from: collect
    to: relevance_review
    type: primary
  - from: relevance_review
