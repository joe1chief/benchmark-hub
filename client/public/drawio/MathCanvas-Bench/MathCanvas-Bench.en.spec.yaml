meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathCanvas-Bench Build Process
  description: >-
    Paper-aligned construction of MathCanvas-Bench from a multimodal math pool through the 3K release and dual-metric
    evaluation.
  legend: >-
    Solid arrows trace 632K-source collection, two GPT-5 filtering rounds, deduplication and enhancement, non-MCQ
    weighted sampling, leakage control, and answer-level scoring.
nodes:
  - id: collect
    label: |-
      Collect Multimodal Math Problems
      Use Textbooks · Exams · Websites
      Cover Middle · High School
      Start with 632K Solutions
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: relevance_filter
    label: |-
      Run First GPT-5 Filter
      Remove Irrelevant Images
      Normalize Math into LaTeX
      Retain about 367K Items
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: quality_filter
    label: |-
      Run Second GPT-5 Filter
      Remove Errors · Missing Answers
      Remove Bad Images · Drawing-only
      Retain about 303K Items
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: deduplicate
    label: |-
      Deduplicate Text and Images
      Compare Problem · Visual Content
      Merge or Remove Near Duplicates
      Produce about 222K Items
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: image_enhance
    label: |-
      Standardize Visual Inputs
      Apply SwinIR Super-resolution
      Resize Images to 512 × 512
      Improve Low-quality Figures
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: taxonomy
    label: |-
      Label Mathematical Categories
      Classify with GPT-4.1
      Assign Eight Major Categories
      Add Fine-grained Subcategories
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: benchmark_sample
    label: |-
      Form the Benchmark Candidate Pool
      Draw Candidates from 222K Items
      Exclude Every Multiple-choice Item
      Keep Open Visual-reasoning Tasks
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: weighted_sample
    label: |-
      Draw a Weighted 3K Sample
      Raise Each Category Share to 0.7
      Raise Rare Mathematical Types
      Preserve Natural Distribution
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: leakage
    label: |-
      Control Train–Benchmark Leakage
      Compute 5-gram Jaccard Similarity
      If Similarity Exceeds 0.4
      Remove the Training Question
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      Release MathCanvas-Bench
      3,000 Open-ended Problems
      Require Interleaved Visual · Text
      Keep about 219K Training Items
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: infer
    label: |-
      Run a Multimodal Model
      Input Problem and Original Image
      Allow Visual Intermediate Outputs
      Generate Interleaved Solutions
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: extract
    label: |-
      Extract Every Sub-answer
      Use GPT-4.1 for Final Answers
      Compare against Ground Truth
      Record Each Subquestion Correctness
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics
    label: |-
      Aggregate Two Metrics
      Complete: All Subanswers Correct
      Weighted: Increasing Item Weights
      Report Overall · Category Results
    type: terminal
    size: xl
    position:
      x: 260
      'y': 420
edges:
  - from: collect
    to: relevance_filter
    type: primary
  - from: relevance_filter
    to: quality_filter
    type: primary
  - from: quality_filter
    to: deduplicate
    type: primary
  - from: deduplicate
    to: image_enhance
    type: primary
  - from: image_enhance
    to: taxonomy
    type: primary
  - from: taxonomy
    to: benchmark_sample
    type: primary
  - from: benchmark_sample
    to: weighted_sample
    type: primary
  - from: weighted_sample
    to: leakage
    type: primary
  - from: leakage
    to: release
    type: primary
  - from: release
    to: infer
    type: primary
  - from: infer
    to: extract
    type: primary
  - from: extract
    to: metrics
    type: primary
modules: []
