  - from: leakage_gate
    to: leakage_remove
    type: optional
    label: Above 0.4 · remove
  - from: leakage_gate
    to: training_release
    type: primary
    label: At most 0.4 · retain
  - from: benchmark_release
    to: model_output
    type: primary
  - from: model_output
    to: judge_input
    type: primary
  - from: judge_input
    to: gpt_judge
    type: primary
  - from: gpt_judge
    to: valid_evaluation_gate
    type: primary
  - from: valid_evaluation_gate
    to: parts_gate
    type: primary
    label: Yes · valid evaluation
  - from: valid_evaluation_gate
    to: invalid_evaluation
    type: optional
    label: No · exclude denominator
    waypoints:
      - x: 120
        'y': 550
      - x: 840
        'y': 550
  - from: parts_gate
    to: single_score
    type: primary
    label: One part
  - from: parts_gate
    to: multi_score
    type: primary
    label: Two to four parts
  - from: single_score
    to: metrics
    type: primary
    waypoints:
      - x: 120
        'y': 1120
      - x: 840
        'y': 1120
  - from: multi_score
    to: metrics
    type: primary
modules: []
