meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SimpleVQA Build and Evaluation Process
  description: >-
    SimpleVQA is a bilingual factual visual-question-answering benchmark with 2,025 short-answer image-question pairs
    across nine tasks, nine domains, and 244 image types. Seed images and QA come from MM-Vet, MME, DynaMath,
    MMBench-CN, CCBench, and expert web search. GPT-4o rewrites or creates one-to-one factual QA, GPT-4 screens
    stability, uniqueness, and difficulty, and two professional annotators refine samples. Questions answered by all
    four of GPT-4o, GPT-4o-mini, Doubao-Vision-Pro, and ERNIE-VL are removed. Atomic recognition questions are generated
    for later error analysis. Every item is independently fact-checked by two experts against at least two URLs, with a
    third expert resolving disagreement. From 8,360 candidates, repeated filtering retains 2,025. Models receive an
    image and concise question; GPT-4o grades correct, not attempted, or incorrect. Correct-given-attempted and the
    harmonic F-score of correct and correct-given-attempted are reported by language, task, and domain, with a 569-item
    complex-fact subset used for atomic-fact analysis.
  legend: >-
    Source: SimpleVQA arXiv:2502.13059 Sections 2.1-2.5 and 3.1-3.3, Figures 2-4, and Appendix G; official
    SimpleVQA/SimpleVQA repository. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
