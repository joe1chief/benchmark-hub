meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVision Build Process
  description: >-
    Paper-v1 and official-code-aligned construction of MATH-Vision from real competitions, followed by the released
    deterministic parser, mathematical-equivalence scorer, and subject/level accuracy reports.
  legend: >-
    Solid arrows are retained construction or evaluation paths. Dashed arrows are exclusion, repair, alternate parsing,
    or incorrect-result paths. Sources: arXiv:2402.14804v1, Git a1f5cc3, HF 2837ddb3.
nodes:
  - id: competitions
    label: |-
      List Math Competitions
      International and National
      Grades 1 through 12
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: selection
    label: |-
      Suitable Competition?
      Frequent Visual Inputs
      Levels Can Be Categorized
    type: decision
    size: xl
    position:
      x: 300
      'y': 40
  - id: excluded_source
    label: |-
      Exclude Competition
      Rare Visuals or Excess Difficulty
      Example: IMO
    type: loss
    size: xl
    position:
      x: 300
      'y': 220
  - id: collect
    label: |-
      Select 19 Competitions
      Filter Online Image Problems
      Respect Copyright and Licenses
      Prefer Hard-to-retrieve Answers
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: extract
    label: |-
      Extract PDF Text and Images
      Mathpix API
      9,000 Questions Total
      3,500 with Image Context
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: alignment
    label: |-
      Text and Image Usable?
      Ten Senior STEM Annotators
      Cross-verified Results
    type: decision
    size: xl
    position:
      x: 1140
      'y': 40
  - id: repair_image
    label: |-
      Recapture Original Image
      Incomplete or Mispositioned
      Recheck Alignment
    type: process
    size: xl
    position:
      x: 1420
      'y': 220
  - id: stage1_keep
    label: |-
      Retain Quality-controlled Items
      Remove Missing Text · Wrong Images
      Remove Private or Offensive Content
      3,352 Problems Remain
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: dedup_screen
    label: |-
      Screen Potential Duplicates
      Lexical Overlap
      Levenshtein Distance
      Manual Review
    type: process
    size: xl
    position:
      x: 1700
      'y': 460
  - id: duplicate
    label: |-
      Duplicate Confirmed?
      Review Question and Image
    type: decision
    size: xl
    position:
      x: 1140
      'y': 460
  - id: discard
    label: |-
      Remove Item
      Invalid Content or Duplicate
    type: loss
    size: lg
    position:
      x: 1140
      'y': 660
  - id: curated
    label: |-
      Freeze Curated MATH-V
      3,040 Problems
      1,532 Multiple-choice
      1,508 Free-form
    type: database
    size: xl
    position:
      x: 860
      'y': 460
  - id: subjects
    label: |-
      Assign 16 Subjects
      Three Independent Groups
      GPT-4V · Gemini Pro Advice
      Expert Majority Consolidation
    type: user
    size: xl
    position:
      x: 580
      'y': 460
  - id: difficulty
    label: |-
      Assign Five Difficulty Levels
      Grades 1–2 / 3–6 / 7–8
      Grades 9–10 / 11+
      Then Manually Correct Boundaries
    type: user
    size: xl
    position:
      x: 300
      'y': 460
  - id: release
    label: |-
      Release MATH-Vision
      Full Test: 3,040
      Testmini: 304 (10%)
      English · 16 Subjects · 5 Levels
    type: database
    size: xl
    position:
      x: 20
      'y': 460
  - id: scope
    label: Evaluation Scope?
    type: decision
    size: lg
    position:
      x: 20
      'y': 840
  - id: full_set
    label: |-
      Full Test
      3,040 Problems
    type: document
    size: lg
    position:
      x: 300
      'y': 760
  - id: mini_set
    label: |-
      Testmini
      304 Problems
    type: document
    size: lg
    position:
      x: 300
      'y': 920
  - id: prompt
    label: |-
      Build Model Input
      Question · Options · Image
      Solve Step by Step
      Put One Final Answer in boxed
    type: document
    size: xl
    position:
      x: 580
      'y': 840
  - id: infer
    label: |-
      Generate Model Response
      Model-specific Decoding
      Save Response with Item ID
    type: process
    size: xl
    position:
      x: 860
      'y': 840
  - id: response_form
    label: Detected Response Form?
    type: decision
    size: xl
    position:
      x: 1140
      'y': 840
  - id: direct_parse
    label: |-
      Parse Terminal Choice or Number
      Choice Ending and “is …” Rules
    type: process
    size: xl
    position:
      x: 1420
      'y': 700
  - id: box_parse
    label: |-
      Parse boxed Answer
      Multiple Boxes → Last Box
    type: process
    size: xl
    position:
      x: 1420
      'y': 840
  - id: phrase_parse
    label: |-
      Parse Answer Phrase Fallback
      Final/Correct/Should-be Phrases
      Then find_math_answer
    type: process
    size: xl
    position:
      x: 1420
      'y': 980
  - id: normalize
    label: |-
      Normalize Mathematical Answer
      Lowercase · Strip Units and LaTeX
      Evaluate Tuples and Expressions
      Numeric Comparison Rounded to 2 dp
    type: process
    size: xl
    position:
      x: 1140
      'y': 1120
  - id: compare
    label: |-
      Equal to Gold?
      Answer Letter or Option Value
      Empty Never Matches
    type: decision
    size: xl
    position:
      x: 860
      'y': 1120
  - id: correct
    label: Record Correct
    type: process
    size: lg
    position:
      x: 580
      'y': 1040
  - id: incorrect
    label: Record Incorrect
    type: loss
    size: lg
    position:
      x: 580
      'y': 1200
  - id: report
    label: |-
      Report Accuracy
      Overall · 16 Subjects · 5 Levels
      Correct / All Evaluated Rows
    type: terminal
    size: xl
    position:
      x: 300
      'y': 1120
