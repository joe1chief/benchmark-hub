meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVision Build Process
  description: >-
    Paper- and official-code-aligned competition collection, four-stage human curation, and deterministic
    mathematical-answer evaluation for MathVision.
  legend: >-
    Solid arrows trace 19-competition selection, PDF extraction, alignment and deduplication, subject and level
    annotation, the 3,040-item release, answer normalization, and accuracy.
nodes:
  - id: competitions
    label: |-
      Select Real Math Competitions
      Cover 19 Visual-input Contests
      Span 12 Grade Levels
      Support Ordered Difficulty
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: copyright
    label: |-
      Control License · Leakage Risk
      Respect Copyright and Licenses
      Prefer Hard-to-retrieve Answers
      Separate Question · Answer Pages
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: extract
    label: |-
      Extract Problems from PDFs
      Parse Documents with Mathpix
      Preserve Text · Formula · Image
      Form an Initial Pool near 9K
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: stage1
    label: |-
      Stage 1 · Text–Image Alignment
      Ten Senior Science Annotators
      Remove Missing · Wrong · Unsafe
      Independently Cross-verify
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: stage1_result
    label: |-
      Finish Content-quality Filtering
      Verify Problem–Image Consistency
      Retain Independently Solvable Items
      Keep 3,352 Problems
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: stage2
    label: |-
      Stage 2 · Deduplication
      Prefilter by Lexical Overlap
      Add Levenshtein Distance
      Manually Review Near Duplicates
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: stage2_result
    label: |-
      Complete Duplicate Removal
      Preserve Contest Visual Challenges
      Avoid Counting Reworded Problems
      Produce 3,040 Problems
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage3
    label: |-
      Stage 3 · Subject Annotation
      Three Groups Label Independently
      Consult GPT-4V · Gemini Pro
      Aggregate into 16 Subjects
    type: user
    size: xl
    position:
      x: 1460
      'y': 420
  - id: stage4
    label: |-
      Stage 4 · Difficulty Annotation
      Use Contest Source · Grade
      Assign Levels One through Five
      Apply Human Expert Verification
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      Release MathVision
      3,040 Visual Math Problems
      1,532 Multiple-choice
      1,508 Free-form
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: testmini
    label: |-
      Choose the Evaluation Scope
      Full Test Set: 3,040 Problems
      Lightweight Testmini: 304
      Support Costly · Human Evaluation
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: infer
    label: |-
      Run a Multimodal Model
      Input Problem · Options · Image
      Ask for Step-by-step Solving
      Put the Final Answer in boxed
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: normalize
    label: |-
      Normalize the Final Answer
      Parse boxed · Common Answer Phrases
      Accept Choice Letter · Option Text
      Apply Mathematical Equivalence
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Aggregate Deterministic Accuracy
      Compare with Ground-truth Answers
      Report Overall · Subject · Level
      Compare Model · Human Performance
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
