meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathVision 构建流程
  description: 与论文及官方评测代码对齐地展示 MathVision 的竞赛题采集、四阶段人工策展与确定性数学答案评测。
  legend: 实线箭头依次表示 19 项竞赛筛选、PDF 抽取、对齐去重、学科难度标注、3040 题发布、答案规范化和准确率汇总。
nodes:
  - id: competitions
    label: |-
      选择真实数学竞赛
      覆盖 19 项视觉型赛事
      横跨 12 个年级层次
      保证可划分难度等级
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: copyright
    label: |-
      控制授权与污染风险
      遵守版权及许可要求
      优先答案不易直接检索题
      分离问题与答案来源页
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: extract
    label: |-
      从竞赛 PDF 抽取题目
      使用 Mathpix 解析文档
      保留题干公式与配图
      形成约 9K 道初始题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: stage1
    label: |-
      第一阶段：图文对齐
      十名高年级理科生标注
      移除缺文错图及不当内容
      独立交叉核验结果
    type: user
    size: xl
    position:
      x: 740
      'y': 40
  - id: stage1_result
    label: |-
      完成内容质量筛选
      检查题干与图像一致性
      保留可独立作答问题
      剩余 3,352 道题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: stage2
    label: |-
      第二阶段：去重
      用词汇重叠初筛候选
      结合 Levenshtein 距离
      人工复核近重复题
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: stage2_result
    label: |-
      完成重复项清理
      保留竞赛视觉难题
      避免同题改写重复计数
      得到 3,040 道题
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage3
    label: |-
      第三阶段：学科标注
      三组标注者独立分类
      GPT-4V 与 Gemini Pro 辅助
      聚合为 16 个数学学科
    type: user
    size: xl
    position:
      x: 1460
      'y': 420
  - id: stage4
    label: |-
      第四阶段：难度标注
      结合竞赛来源与年级
      划分一至五级难度
      由人工专家统一核验
    type: user
    size: xl
    position:
      x: 1220
      'y': 420
  - id: release
    label: |-
      发布 MathVision
      共 3,040 道视觉数学题
      1,532 道选择题
      1,508 道自由回答题
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: testmini
    label: |-
      选择评测数据范围
      完整测试集使用 3,040 题
      轻量 testmini 使用 304 题
      支持高成本模型与人工对比
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: infer
    label: |-
      运行多模态模型
      输入题干选项与配图
      要求逐步解决问题
      最终答案置于 boxed 中
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: normalize
    label: |-
      规范化模型最终答案
      解析 boxed 与常见答案短语
      兼容选项字母或选项文本
      使用数学等价性判定
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      汇总确定性准确率
      对照标准答案判断正误
      按总体学科与难度报告
      比较模型与人工表现差距
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: competitions
    to: copyright
    type: primary
  - from: copyright
    to: extract
    type: primary
  - from: extract
    to: stage1
    type: primary
  - from: stage1
    to: stage1_result
    type: primary
  - from: stage1_result
    to: stage2
    type: primary
  - from: stage2
    to: stage2_result
    type: primary
  - from: stage2_result
    to: stage3
    type: primary
  - from: stage3
    to: stage4
    type: primary
  - from: stage4
    to: release
    type: primary
  - from: release
    to: testmini
    type: primary
  - from: testmini
    to: infer
    type: primary
  - from: infer
    to: normalize
    type: primary
  - from: normalize
    to: report
    type: primary
modules: []
