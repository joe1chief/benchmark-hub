meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PopQA 构建与评测流程
  description: 按论文从Wikidata关系构建跨广泛流行度的14,267条开放域事实问题，补齐答案别名与页面访问量元数据，再做精确子串评分和流行度分析。
  legend: PopQA衡量事实问答准确率如何随实体流行度变化，并支持参数记忆检索增强与自适应检索比较；问题本身不提供证据段落。
nodes:
  - id: step_1
    label: |-
      定义流行度敏感问答
      探测事实参数记忆
      同时包含热门与长尾实体
      使用开放域问题
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: step_2
    label: |-
      选择16种Wikidata关系
      覆盖人物 · 地点 · 作品
      包含一对一与一对多关系
      保留可解释关系类型
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: step_3
    label: |-
      随机抽取知识三元组
      抽取主语关系宾语事实
      覆盖广泛流行度
      保留Wikidata标识符
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: step_4
    label: |-
      为每种关系编写模板
      人工表达关系含义
      使用自然问题形式
      同类问题保持措辞一致
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: step_5
    label: |-
      实例化自然问题
      用三元组主语替换占位符
      保持关系语义
      生成开放域问题
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      收集全部可接受宾语
      查找所有满足S-R-E的实体E
      支持多答案关系
      避免单一宾语答案捷径
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      扩展答案与实体元数据
      添加主语与宾语别名
      保存ID · URI · 维基标题
      保留关系类型
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      附加流行度信号
      查询维基百科月度访问量
      记录主语流行度
      记录宾语流行度元数据
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      发布14,267条问题
      保留问题与答案别名
      保留关系和实体元数据
      保留流行度用于分析
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      运行开放域问答
      不提供支撑段落
      使用零样本或少样本提示
      生成自由文本答案
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      比较记忆模式
      评测模型原始参数记忆
      添加BM25或Contriever检索
      添加GenRead或自适应检索
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      规范模型预测
      保留用于匹配的答案文本
      对照全部标准别名
      允许任一有效关系宾语
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      应用精确子串正确性
      精确匹配任一标准答案
      允许答案出现在预测子串中
      每题记为正确或错误
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      按流行度报告准确率
      总体及各关系Accuracy
      与页面访问量对数做相关
      比较不同检索策略
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
