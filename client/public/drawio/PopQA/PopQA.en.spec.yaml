    label: |-
      Fixed Official Evidence
      arXiv 2212.10511v4 · PDF 6de64bcf9b19
      Git 8172ab04794a · HF 098765c79ea1
      Shared TSV · SHA 9a5227f41bff
    type: document
    size: xl
    position:
      x: 80
      'y': 80
  - id: factual_scope
    label: |-
      Define Open-domain Factual QA
      Represent Facts as Subject · Relation · Object
      Ask Entity-centric Questions
      Provide No Ground-truth Paragraph
    type: document
    size: xl
    position:
      x: 340
      'y': 80
  - id: relations
    label: |-
      Select 16 Wikidata Relations
      occupation · place of birth · genre · father
      country · producer · director · capital of
      screenwriter · composer · color · religion
      sport · author · mother · capital
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: weighted_sampling
    label: |-
      Weight Sampling Toward Popularity
      Keep iff \(f > \exp(8R - 6)\)
      R Is Uniform on (0,1)
      f Is Exact-match Frequency
      800 MB C4 Sample · Subject Aliases
    type: process
    size: xl
    position:
      x: 860
      'y': 80
  - id: relation_cap
    label: |-
      Cap Each Relation
      Stop Each Relation at 2,000 Triples
      Increase Relation-type Diversity
    type: process
    size: xl
    position:
      x: 1120
      'y': 80
  - id: template_authoring
    label: |-
      Authors Manually Annotate Templates
      One Final Natural-language Template per Relation
      Appendix Table 2 Lists All 16 Templates
    type: document
    size: xl
    position:
      x: 1380
      'y': 80
  - id: question_instantiation
    label: |-
      Instantiate Each Question
      Substitute Subject S
      Use the Template for R
      Produce a Natural-language Question
    type: process
    size: xl
    position:
      x: 1640
      'y': 80
  - id: answer_closure
    label: |-
      Close the Acceptable Answer Set
      Include Every Entity E
      Where (S, R, E) Exists in Wikidata
      Use All Such Entities as Gold Answers
    type: process
    size: xl
    position:
      x: 1900
      'y': 80
  - id: pageviews
    label: |-
      Attach Popularity
      Query Wikipedia Monthly Page Views
      Use Subject Popularity as the Proxy
      Analyze Memorization by Subject Popularity
    type: process
    size: xl
    position:
      x: 1900
      'y': 380
  - id: fixed_release
    label: |-
      Package the Fixed Release
      14,267 Rows · 17 Columns
      Git TSV Equals HF test.tsv
      IDs · Aliases · URIs · Wikipedia Titles
      Question · Popularity · Possible Answers
    type: database
    size: xl
    position:
      x: 1640
      'y': 520
  - id: prompt_config
    label: |-
      Use the Paper Prompt
      Exact Text: Q: &lt;question&gt; A:
      GPT-3 Uses Zero-shot
      GPT-Neo and OPT Use 15-shot
      One Example from Each Other 15 Relations
    type: document
    size: xl
    position:
      x: 1380
      'y': 380
  - id: memory_gate
    label: |-
      Choose the Memory Regime
      Vanilla Parametric Memory
      BM25 · Contriever · GenRead
      Compare with the Same Questions
    type: process
    size: xl
    position:
      x: 1120
      'y': 380
  - id: vanilla
    label: |-
      Use Parametric Memory
      Use the Configured Zero- or 15-shot Prompt
      No Retrieved or Generated Context
    type: process
    size: xl
    position:
      x: 860
      'y': 240
  - id: retrieval
    label: |-
      Use an Augmented Context
      BM25: Keep Full Top Retrieved Passage
      Contriever: Split on ". "; Drop Final Segment
      GenRead: Wikipedia Background · Max 150 Tokens
      Then Append the QA Prompt
    type: process
    size: xl
    position:
      x: 860
      'y': 520
  - id: generate
    label: |-
      Generate a Free-form Answer
      Runner Allows 15 New Tokens
      GPT-3 Temperature 0 · Top-p 1
      Local Models Use Greedy Decoding
      Keep the First Output Line
    type: process
    size: xl
    position:
      x: 600
      'y': 380
  - id: code_scorer
    label: |-
      Apply the Fixed Runner Scorer
      Load possible_answers
      Test Original · lower · capitalize Gold
      Find Gold in the Prediction Substring
      No General Normalization
    type: process
    size: xl
    position:
      x: 340
      'y': 380
  - id: report
    label: |-
      Report PopQA Results
      Mean Accuracy · Per Relation
      Correlate Binary Correctness
      with Log Subject Popularity
    type: terminal
    size: xl
    position:
      x: 80
      'y': 380
  - id: adaptive_split
    label: |-
      Run Adaptive Retrieval Protocol
      75 Percent for Threshold Development
      25 Percent for Evaluation
      Repeat 100 Random Splits
    type: process
    size: xl
    position:
      x: 80
      'y': 700
  - id: threshold
    label: |-
      Learn a Per-relation Threshold
      Brute-force Popularity Thresholds
      Maximize Adaptive Accuracy
      Use Development Predictions Only
    type: process
    size: xl
    position:
      x: 600
      'y': 700
  - id: adaptive_gate
    label: |-
      Apply the Per-relation Threshold Policy
      Use Retrieval-augmented Prediction Below Threshold
      Use Parametric Prediction Otherwise
    type: process
    size: xl
    position:
      x: 860
      'y': 700
  - id: adaptive_report
    label: |-
      Report Adaptive Accuracy
      Average over 100 Splits
      Compare Accuracy and Retrieval Share
      Preserve Per-relation Thresholding
    type: terminal
    size: xl
    position:
      x: 1120
      'y': 700
  - id: release_boundary
    label: |-
      Release and Run-count Boundary
      Fixed TSV and Figure 4: 14,267
      Appendix B GPT-3 Runs: 14,282
      15-question Difference Is Unresolved
      Do Not Equate Run Snapshot with Fixed TSV
    type: document
    size: xl
    position:
      x: 1640
      'y': 820
  - id: prompt_boundary
    label: |-
      Invocation Drift
      Paper GPT-3: 0-shot · Runner: 15-shot
      README Omits --n_examples 0
      Contriever README: --ret_file
      Runner: --ret_path
    type: document
    size: xl
    position:
      x: 1380
      'y': 700
  - id: scorer_boundary
    label: |-
      Paper-to-runner Scorer Boundary
      Paper: Exact Gold Substring
      Runner Tests Three Gold Casings
      Prediction Is Not Lowercased
      No Token or Alias Normalizer
    type: document
    size: xl
    position:
      x: 340
      'y': 560
  - id: adaptive_boundary
    label: |-
      Adaptive Result Boundary
      Notebook Input Paths Are Blank
      No Pinned Result Files Are Included
      Threshold Logic Is Reproducible
      Published Results Are Not Recomputed Here
    type: document
    size: xl
    position:
      x: 1120
      'y': 980
