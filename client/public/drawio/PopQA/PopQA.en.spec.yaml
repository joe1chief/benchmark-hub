meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PopQA Build, Release, and Evaluation Process
  description: >-
    Paper-v4 reconstruction of weighted Wikidata triple sampling, relation templates, answer closure, page-view
    popularity, the pinned 14,267-row release, official runner semantics, and adaptive retrieval.
  legend: >-
    Solid arrows show paper construction or fixed implementation flow. Dashed arrows mark fixed evidence, release,
    prompt, scorer, and result-reproducibility boundaries; those callouts are not extra stages.
nodes:
