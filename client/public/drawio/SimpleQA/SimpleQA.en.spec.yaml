meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SimpleQA Build Process
  description: >-
    Paper-aligned SimpleQA workflow: human AI trainers write timeless single-answer questions with evidence, retain only
    questions that fool at least one of four OpenAI models, pass automated criteria checks and independent answer
    verification with two source domains, and evaluate 4,326 questions using a three-way grader and factuality metrics.
  legend: Solid arrows show question creation, adversarial and quality gates, independent verification, grading, and metrics.
nodes:
  - id: creators
    label: |-
      Human AI Trainers
      Write Short Fact-seeking Question
      + Reference Answer + Evidence Link
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: criteria
    label: |-
      Question Criteria
      One Indisputable Timeless Answer
      Specific Scope; Answerable by 2023-12-31
    type: document
    size: xl
    position:
      x: 320
      'y': 240
  - id: adversarial
    label: |-
      Four-model Adversarial Gate
      Trainer Grades Four Completions
      Keep only if ≥1 Is Incorrect
    type: process
    size: xl
    position:
      x: 620
      'y': 240
  - id: auto_checks
    label: |-
      Few-shot ChatGPT Checks
      Units / Timelessness / Single Answer
      Return Violations for Revision
    type: process
    size: xl
    position:
      x: 900
      'y': 240
  - id: rewrite
    label: |-
      Light Grammar Rewrite
      Improve Grammar + Punctuation
      Preserve Question Content
    type: process
    size: xl
    position:
      x: 1180
      'y': 240
  - id: verifier
    label: |-
      Independent Second Trainer
      Cannot See Creator's Answer
      Re-answer + Recheck Criteria
    type: user
    size: xl
    position:
      x: 1460
      'y': 240
  - id: agreement
    label: |-
      Verification Gate
      Answers Must Match by Classifier
      Require Two Unique Source Domains
    type: process
    size: xl
    position:
      x: 1740
      'y': 240
  - id: audit
    label: |-
      Third-trainer Quality Audit
      1,000 Random Examples
      Manual Review; Estimated Error ≈3%
    type: user
    size: xl
    position:
      x: 2020
      'y': 240
  - id: dataset
    label: |-
      SimpleQA
      4,326 English Questions
      Short Single Reference Answers
    type: database
    size: xl
    position:
      x: 2300
      'y': 240
  - id: model
    label: |-
      Model Produces
      Short Free-form Answer
    type: process
    size: large
    position:
      x: 2580
      'y': 240
  - id: grader
    label: |-
      Prompted ChatGPT Grader
      Predicted + Reference Answer
      Correct / Incorrect / Not Attempted
    type: process
    size: xl
    position:
      x: 2820
      'y': 240
  - id: metrics
    label: |-
      Overall Correct
      Correct Given Attempted
      F-score = Harmonic Mean
    type: terminal
    size: xl
    position:
      x: 3100
      'y': 240
edges:
  - from: creators
    to: criteria
    type: primary
  - from: criteria
    to: adversarial
    type: primary
  - from: adversarial
    to: auto_checks
    type: primary
  - from: auto_checks
    to: rewrite
    type: primary
  - from: rewrite
    to: verifier
    type: primary
  - from: verifier
    to: agreement
    type: primary
  - from: agreement
    to: audit
    type: primary
  - from: audit
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: grader
    type: primary
  - from: grader
    to: metrics
    type: primary
modules: []
