meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SimpleQA 构建流程
  description: >-
    对齐论文的 SimpleQA 流程：人工 AI 训练师编写含证据的时间不变单一答案题，仅保留至少难倒四个 OpenAI 模型之一的问题，经自动标准检查、独立答案验证和双来源域名门，最终对 4,326 题使用三分类 grader
    与事实性指标评测。
  legend: 实线箭头表示出题、对抗与质量门、独立验证、判分和指标汇总。
nodes:
  - id: creators
    label: |-
      人工 AI 训练师
      编写简短事实问题
      + 参考答案 + 证据链接
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: criteria
    label: |-
      问题标准
      单一、无争议、时间不变答案
      范围明确；截至 2023-12-31 可答
    type: document
    size: xl
    position:
      x: 320
      'y': 240
  - id: adversarial
    label: |-
      四模型对抗门
      训练师判定四份回复
      至少一份错误才保留
    type: process
    size: xl
    position:
      x: 620
      'y': 240
  - id: auto_checks
    label: |-
      Few-shot ChatGPT 检查
      单位 / 时间不变 / 单一答案
      违规题返回修改
    type: process
    size: xl
    position:
      x: 900
      'y': 240
  - id: rewrite
    label: |-
      轻量语法改写
      改善语法与标点
      不改变问题内容
    type: process
    size: xl
    position:
      x: 1180
      'y': 240
  - id: verifier
    label: |-
      独立第二训练师
      看不到出题者答案
      重新作答并复查标准
    type: user
    size: xl
    position:
      x: 1460
      'y': 240
  - id: agreement
    label: |-
      验证门
      分类器判定两人答案一致
      要求两个不同来源域名
    type: process
    size: xl
    position:
      x: 1740
      'y': 240
  - id: audit
    label: |-
      第三训练师质量审计
      随机 1,000 题
      人工复查；估计错误率约 3%
    type: user
    size: xl
    position:
      x: 2020
      'y': 240
  - id: dataset
    label: |-
      SimpleQA
      4,326 道英文问题
      简短单一参考答案
    type: database
    size: xl
    position:
      x: 2300
      'y': 240
  - id: model
    label: |-
      模型生成
      简短自由答案
    type: process
    size: large
    position:
      x: 2580
      'y': 240
  - id: grader
    label: |-
      Prompted ChatGPT 判分器
      预测答案 + 参考答案
      正确 / 错误 / 未尝试
    type: process
    size: xl
    position:
      x: 2820
      'y': 240
  - id: metrics
    label: |-
      总体正确率
      尝试题中的正确率
      F-score = 调和平均
    type: terminal
    size: xl
    position:
      x: 3100
      'y': 240
edges:
  - from: creators
    to: criteria
    type: primary
  - from: criteria
    to: adversarial
    type: primary
  - from: adversarial
    to: auto_checks
    type: primary
  - from: auto_checks
    to: rewrite
    type: primary
  - from: rewrite
    to: verifier
    type: primary
  - from: verifier
    to: agreement
    type: primary
  - from: agreement
    to: audit
    type: primary
  - from: audit
    to: dataset
    type: primary
  - from: dataset
    to: model
    type: primary
  - from: model
    to: grader
    type: primary
  - from: grader
    to: metrics
    type: primary
modules: []
