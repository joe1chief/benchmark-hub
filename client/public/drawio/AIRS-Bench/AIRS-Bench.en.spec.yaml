      SOTA papers + leaderboards
      Reproducible data and metrics
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: eligibility
    label: |-
      Verify Eligibility
      Clear objective and split
      Reproduce the metric
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: candidates
    label: |-
      Candidate Pool
      About 100 tasks
      About 85 papers
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: bands
