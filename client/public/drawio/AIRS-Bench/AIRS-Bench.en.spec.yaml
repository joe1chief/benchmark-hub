      4 difficulty bands
      ≈25 tasks per band
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: allocations
    label: |-
      Four band allocations
      Uniform + three skewed shapes
    type: process
    size: xl
    position:
      x: 1440
      'y': 80
  - id: search
    label: |-
      12 subset searches
      10,000 random samples
