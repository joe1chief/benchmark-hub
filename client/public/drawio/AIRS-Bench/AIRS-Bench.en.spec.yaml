meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench Selection and Evaluation Process
  description: >-
    Paper-aligned candidate stratification, allocation search, fidelity validation, task packaging, seeded agent runs,
    and Bradley-Terry fitted pairwise reporting for AIRS-Bench.
  legend: >-
    The upper row shows the benchmark-selection optimization. The lower row runs and evaluates agents on the resulting
    20-task suite.
