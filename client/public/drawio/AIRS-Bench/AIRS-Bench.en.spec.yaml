    type: process
    size: xl
    position:
      x: 1720
      'y': 80
  - id: final_selection
    label: |-
      Best: GA + {4,7,5,4}
      MAE 4e-3
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: validation
    label: |-
      Fidelity check
      Mean-score difference ≤ 0.02
      95% CI + rank preserved
    type: process
    size: xl
    position:
      x: 2280
      'y': 80
  - id: package
    label: |-
      AIRS-Bench release
      20 tasks • 17 papers
      16 datasets • 7 categories
    type: database
    size: xl
    position:
      x: 2560
      'y': 80
