meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench Selection, Packaging, and Evaluation
  description: >-
    Paper-aligned sourcing, manual SOTA verification, stratified subset optimization, fidelity validation, task
    packaging, seeded agent runs, and the three reported aggregate metrics.
  legend: >-
    The upper row constructs the representative 20-task suite. The lower row packages hidden-label tasks and reports
    valid submission rate, normalized score, and Bradley-Terry-fitted Elo.
