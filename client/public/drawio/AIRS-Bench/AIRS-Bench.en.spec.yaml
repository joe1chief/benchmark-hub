      Task metric + validity
    type: process
    size: xl
    position:
      x: 1720
      'y': 400
  - id: vsr
    label: |-
      Mean valid submission rate
      Equation 1
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: normalized
    label: |-
      Average normalized score
      Equations 2–3 • invalid = 0
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: rating
