      2020–2025 SOTA results
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: eligibility
    label: |-
      Eligibility screen
      Dataset available • train/test split
      HuggingFace preferred
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: manual_verification
    label: |-
      Manual task verification
      SOTA • metric • identical splits
      Update stronger result
    type: user
    size: xl
    position:
      x: 600
      'y': 80
  - id: candidates
    label: |-
      Full candidate pool
      ≈100 tasks
      ≈85 papers + datasets
    type: database
    size: xl
    position:
      x: 880
      'y': 80
  - id: bands
    label: |-
