    label: |-
      PapersWithCode 排行榜
      2020–2025 年 SOTA
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: eligibility
    label: |-
      资格筛选
      数据可得 • 具备训练/测试切分
      优先 HuggingFace
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: manual_verification
    label: |-
      人工任务核验
      SOTA • 指标 • 一致切分
      发现更优结果则更新
    type: user
    size: xl
    position:
      x: 600
      'y': 80
  - id: candidates
    label: |-
      完整候选池
      约 100 项任务
      约 85 个论文与数据集
    type: database
    size: xl
    position:
      x: 880
      'y': 80
  - id: bands
    label: |-
      按 Agent 表现排序
      4 个难度带
      每带约 25 项任务
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: allocations
    label: |-
      4 种难度带分配
      均匀 + 3 种偏斜方案
    type: process
    size: xl
    position:
      x: 1440
      'y': 80
  - id: search
    label: |-
      12 组子集搜索
      随机采样 10,000 次
      模拟退火 + GA
    type: process
    size: xl
    position:
      x: 1720
      'y': 80
  - id: final_selection
    label: |-
      最优：GA + {4,7,5,4}
      MAE 4e-3
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: validation
    label: |-
      保真验证
      平均分差 ≤ 0.02
      保留 95% CI 与排名
    type: process
    size: xl
    position:
      x: 2280
      'y': 80
  - id: package
    label: |-
