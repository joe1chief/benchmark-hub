meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench 筛选、封装与评测流程
  description: 按论文呈现任务来源、人工 SOTA 核验、分层子集优化、保真验证、任务封装、带种子的 Agent 运行及三项汇总指标。
  legend: 上排构建具有代表性的 20 任务套件；下排封装隐藏标签任务，并报告有效提交率、归一化分数和 Bradley-Terry 拟合 Elo。
nodes:
