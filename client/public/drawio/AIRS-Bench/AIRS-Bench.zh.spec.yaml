      无基线 • 隐藏测试标签
      隐藏 SOTA 方法与分数
    type: process
    size: xl
    position:
      x: 2280
      'y': 400
  - id: agent
    label: |-
      多种子 Agent 运行
      24 小时 • 单张 H200
      每任务-Agent 至少 10 次
    type: process
    size: xl
    position:
      x: 2000
      'y': 400
  - id: raw_score
    label: |-
      评测提交
      任务原始指标 + 有效性
    type: process
    size: xl
    position:
      x: 1720
      'y': 400
  - id: vsr
    label: |-
      平均有效提交率
      公式 1
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: normalized
    label: |-
      平均归一化分数
      公式 2–3 • 失败/无效 = 0
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: rating
    label: |-
      BT 拟合 Elo
      逐任务成对比分
      Human SOTA 作为对手
    type: process
    size: xl
    position:
      x: 1440
      'y': 560
  - id: report
    label: |-
      AIRS-Bench 报告
      有效提交率 • 归一化分数 • Elo
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 400
