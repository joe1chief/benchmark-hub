meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench 构建与评测流程
  description: 对齐论文的 AIRS-Bench 科研 Agent 任务来源、核验、筛选、封装、Agent 执行、任务计分、非线性归一化与汇总报告流程。
  legend: 上排从约 100 个候选任务构建 20 项最终任务；下排在隐藏测试标签下执行 Agent， 并报告有效提交率、归一化分数和 Elo。
nodes:
  - id: source
    label: |-
      获取候选科研任务
      PapersWithCode 排行榜 + SOTA 论文
      优先 2020–2025 成果和 Hugging Face 数据
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: eligibility
    label: |-
      应用准入条件
      明确的机器学习目标 • 训练 / 测试划分
      数据可用且评测指标可复现
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: verify
    label: |-
      人工创建并核验每项任务
      对齐论文指标、划分和评测协议
      确认引用 SOTA；发现更优结果则更新
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: candidates
    label: |-
      建立候选任务池
      约 100 项任务
      来自约 85 篇机器学习论文和数据集
    type: database
    size: xl
    position:
      x: 880
      'y': 100
  - id: select
    label: |-
      筛选最终任务集
      考虑 Agent 表现与排序保真度
      保留 7 类分布并控制评测成本
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: package
    label: |-
      封装 20 项任务（17 篇论文 / 16 个数据集）
      project_description • metadata.yaml
      prepare / evaluate / evaluate_prepare 脚本
    type: document
    size: xl
    position:
      x: 1440
      'y': 100
  - id: environment
    label: |-
      准备 Agent 环境
      训练标签可见 • 测试标签隐藏
      不提供基线代码；可联网并使用缓存资源
    type: database
    size: xl
    position:
      x: 1440
      'y': 440
  - id: agent
    label: |-
      运行端到端科研 Agent
      AIRA-dojo One-Shot / Greedy 或 MLGym ReAct
      单张 H200、24 小时内开发、训练、验证并预测
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: raw_score
    label: |-
      评估提交的预测结果
      任务专用 evaluate.py 使用隐藏测试标签
      记录原始指标与提交有效性
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: normalize
    label: |-
      归一化每项任务分数
      φ(s) = −log10 |s − 最优值|
      最差观测运行 = 0 • 文献 SOTA = 1
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: aggregate
    label: |-
      跨任务与随机种子汇总
      平均归一化分数
      有效提交率 + 两两比较 Elo 评级
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      AIRS-Bench 结果
      比较 14 个模型–Scaffold Agent
      报告可靠性、科研质量和相对排序
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: source
    to: eligibility
    type: primary
  - from: eligibility
    to: verify
    type: primary
  - from: verify
    to: candidates
    type: primary
  - from: candidates
    to: select
    type: primary
  - from: select
    to: package
    type: primary
  - from: package
    to: environment
    type: primary
  - from: environment
    to: agent
    type: primary
  - from: agent
    to: raw_score
    type: primary
  - from: raw_score
    to: normalize
    type: primary
  - from: normalize
    to: aggregate
    type: primary
  - from: aggregate
    to: report
    type: primary
modules: []
