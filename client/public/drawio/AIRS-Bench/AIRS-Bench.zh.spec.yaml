meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench 选择与评测流程
  description: 按论文呈现候选任务分层、分配搜索、保真验证、任务打包、多种子代理运行以及 Bradley-Terry 成对评分拟合。
  legend: 上排展示基准选择优化；下排在得到的 20 项任务套件上运行并评测代理。
nodes:
  - id: source
    label: |-
      收集研究任务
      SOTA 论文与排行榜
      可复现数据和指标
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: eligibility
    label: |-
      验证准入条件
      目标和切分明确
      复现评测指标
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: candidates
    label: |-
      候选池
      约 100 项任务
      来自约 85 篇论文
    type: database
    size: xl
    position:
      x: 600
      'y': 100
  - id: bands
    label: |-
      按难度分层
      4 个难度带
      每带约 25 项任务
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: allocations
    label: |-
      定义 4 种分配
      不同难度分布
      候选套件形状
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: search
    label: |-
      搜索 12 种组合
      随机搜索 10,000 次
      模拟退火 + 遗传算法
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: final_selection
    label: |-
      采用遗传算法结果
      中等难度偏置 {4,7,5,4}
      MAE = 4e-3
    type: process
    size: xl
    position:
      x: 1720
      'y': 100
  - id: validation
    label: |-
      验证保真度
      分数差 ≤ .02
      保持置信区间与排名
    type: process
    size: xl
    position:
      x: 2000
      'y': 100
  - id: package
    label: |-
      打包最终套件
      20 任务 • 17 论文
      16 数据集 • 7 类别
    type: document
    size: xl
    position:
      x: 2280
      'y': 100
  - id: environment
    label: |-
      任务定义文件
      prepare + evaluate 脚本
      可选 utils.py 辅助文件
    type: document
    size: xl
    position:
      x: 2280
      'y': 440
  - id: agent
    label: |-
      运行研究代理
      运行 24 小时 • 单张 H200
      至少 10 个随机种子
    type: process
    size: xl
    position:
      x: 2000
      'y': 440
  - id: raw_score
    label: |-
      评分提交结果
      隐藏测试标签
      原始指标 + 有效性
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: aggregate
    label: |-
      汇总多次运行
      任务归一化分数
      置信区间
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: rating
    label: |-
      Bradley–Terry 拟合的 Elo 评分
      基于成对结果
      按种子比较
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: report
    label: |-
      AIRS-Bench 报告
      质量 + 可靠性
      拟合相对排名
    type: terminal
    size: xl
    position:
      x: 880
      'y': 440
edges:
  - from: source
    to: eligibility
    type: primary
  - from: eligibility
    to: candidates
    type: primary
  - from: candidates
    to: bands
    type: primary
  - from: bands
    to: allocations
    type: primary
  - from: allocations
    to: search
    type: primary
  - from: search
    to: final_selection
    type: primary
  - from: final_selection
    to: validation
    type: primary
  - from: validation
    to: package
    type: primary
  - from: package
    to: environment
    type: primary
  - from: environment
    to: agent
    type: primary
  - from: agent
    to: raw_score
    type: primary
  - from: raw_score
    to: aggregate
    type: primary
  - from: aggregate
    to: rating
    type: primary
  - from: rating
    to: report
    type: primary
modules: []
