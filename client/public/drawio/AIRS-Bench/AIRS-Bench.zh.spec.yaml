      20 项任务 • 17 篇论文
      16 个数据集 • 7 类
    type: database
    size: xl
    position:
      x: 2560
      'y': 80
  - id: task_files
    label: |-
      metadata + project_description
      prepare + evaluate_prepare + evaluate
      utils 可选 • AIRA-dojo / MLGym
    type: document
    size: xl
    position:
      x: 2560
      'y': 400
  - id: hidden_environment
    label: |-
