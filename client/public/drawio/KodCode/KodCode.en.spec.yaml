meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: KodCode Build Process
  description: >-
    Paper-aligned KodCode-V1 construction from twelve question subsets through within-subset semantic deduplication,
    solution-and-test self-verification, style conversion, and DeepSeek-R1 reject sampling for SFT data.
  legend: >-
    Solid arrows show dataset construction. Dashed arrows separate the paper's SFT and RL utility experiments,
    evaluation-only contamination handling, and later pinned public artifacts from the 447K paper dataset.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Version Boundary
      arXiv:2503.02951v2 · Findings ACL 2025
      Paper Dataset: KodCode-V1
      Git 3a98720: Later V2 Release Code
      V1-era Git 35bcc3d: Exactness Unproven
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      Synthesize 12 Paper Question Subsets
      Prefill · LeetCode · Codeforces · APPS
      TACO · Code Contests
      Algorithm · Data Structure
      Docs · Filter · Package · Evol
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: dedup
    label: |-
      Semantic Dedup within Each Subset
      all-mpnet-base-v2 Embeddings
      FAISS Nearest-neighbor Search
      Filter above a Preset Similarity Threshold
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: synthesize
    label: |-
      GPT-4o-0513 Generates Both Anew
      Python Solution + Pytest Unit Tests
      Question Is the Only Fixed Input
      Start Self-verification Attempts
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: execute
    label: |-
      Execute Generated Unit Tests
      Run Each Solution against Its Tests
      Measure Branches with pytest-cov
      Record Pass and Coverage per Attempt
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: verify
    label: |-
      Self-verification · Maximum 10 Attempts
      Retry Regenerates Solution + Tests
      from Scratch
      Require All Tests + 100% Branch Coverage
      Retry Coverage Must Not Decrease
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: difficulty
    label: |-
      Difficulty Label + Failure Gate
      Easy: Success Rate above 2/3
      Medium: 1/3 through 2/3 · Hard: below 1/3
      All Ten Attempts Fail: Discard Question
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: verified
    label: |-
      Step 2 Paper Output · 279K
      Verified Question-solution-test Triplets
      At Least One Attempt Passed the Gate
      Retain Easy · Medium · Hard Labels
    type: database
    size: xl
    position:
      x: 1980
      'y': 40
  - id: convert
    label: |-
      LLM-based Style Conversion
      Input Question + Solution + Tests
      Python Completion with Signatures + Examples
      Create 168K Additional Triplets
    type: process
    size: xl
    position:
      x: 2260
      'y': 40
  - id: paper_v1
    label: |-
      Paper KodCode-V1 · 447K
      279K Verified + 168K Converted
      Question-solution-test Triplets
      12 Subsets · Three Difficulty Labels
      Paired Tests Make Data RL-ready
    type: database
    size: xl
    position:
      x: 2540
      'y': 40
  - id: r1
    label: |-
      DeepSeek-R1 Response Synthesis
      Use Questions from the Verified Triplets
      Generate Chain-of-thought + Code
      Sample Three Responses per Question
    type: process
    size: xl
    position:
      x: 2540
      'y': 380
  - id: reject
    label: |-
      Test-based Reject Sampling
      Execute Each R1 Code on Paired Tests
      Keep Only Verifiably Correct Responses
      Rejected Responses Are Not SFT Positives
    type: process
    size: xl
    position:
      x: 2260
      'y': 380
  - id: sft_data
    label: |-
      Construct Paper KodCode-SFT
      Question + Accepted R1 CoT Response
      Three-attempt Test-verified Selection
      Separate from the 447K RL Triplets
    type: database
    size: xl
    position:
      x: 1980
      'y': 380
  - id: artifact_boundary
    label: |-
      Pinned Public HF Artifacts · Later State
      RL 97d81f0: Train 484,097 + Caution 3,335
      SFT 26c8a11: Train 268,211
      Incorrect 210,787 + Caution 4,439
      Public v1.1 Splits Are Not Paper's 447K V1
    type: document
    size: xl
    position:
      x: 2820
      'y': 40
  - id: rl_experiment
    label: |-
      Paper RL Utility Experiment Only
      Random 9.5K Train + 0.5K Validation
      GRPO · Binary All-tests-pass Reward
      Two Qwen2.5 7B Models · Not All 447K
    type: process
    size: xl
    position:
      x: 1700
      'y': 680
  - id: sft_experiment
    label: |-
      Paper SFT Utility Experiment Only
      Filter Length + Class-based Solutions
      50K Mixed Set + All 18K Hard Set
      Fine-tune Qwen2.5-Coder-32B
    type: process
    size: xl
    position:
      x: 1980
      'y': 820
  - id: contamination
    label: |-
      Contamination Analysis · Evaluation Only
      HumanEval · MBPP · BigCodeBench · LCB V5
      Cosine Similarity above 0.95 → 94 Overlaps
      Exclude from Evaluation, Not Training Data
    type: process
    size: xl
    position:
      x: 2260
      'y': 960
  - id: benchmark
    label: |-
      Downstream Data-utility Evaluation
      HumanEval and HumanEval+
      MBPP and MBPP+ · BigCodeBench
      LiveCodeBench V5 · Greedy Pass@1
    type: process
    size: xl
    position:
      x: 1700
      'y': 820
  - id: report
    label: |-
      Report Paper Utility Results
      Pass@1 by Benchmark
      Separate SFT and RL Comparisons
      94-overlap Exclusion Applies Here Only
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 820
