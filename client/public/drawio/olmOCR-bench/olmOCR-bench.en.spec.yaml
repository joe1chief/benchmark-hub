meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: olmOCR-Bench Build and Evaluation Process
  description: >-
    Paper-v3 reconstruction of seven source-specific PDF pipelines, deterministic unit-test evaluation, equal source
    macro-averaging, and fixed-release and current-code drift boundaries.
  legend: >-
    Solid edges are the paper build and evaluation protocol. Dashed edges attach fixed evidence or a disclosure,
    release, evaluator, or license boundary and are not extra benchmark stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2502.18443v3 · PDF d006f3f9100a
      Git f7cfe4c22098 · HF 54a96a6fb6a2
      Paper defines; snapshots audit code and data
    type: document
    size: xl
    position:
      x: 20
      'y': 460
  - id: benchmark_goal
    label: |-
      Define Deterministic OCR Facts
      Test faithful page linearization
      Preserve text, structure, and order
      Avoid full-reference or LLM judging
    type: document
    size: xl
    position:
      x: 280
      'y': 460
  - id: eligibility
    label: |-
      Apply the Paper Eligibility Filter
      Remove only if both conditions hold
      Contains PII and is not meant
      for public dissemination
      Appendix reuses the mix PII prompt
    type: process
    size: xl
    position:
      x: 540
      'y': 460
  - id: decontaminate
    label: |-
      Decontaminate against Training Data
      Compare with olmOCR-mix-0225
      Deduplicate at PDF URL level
      Keep benchmark documents separate
    type: process
    size: xl
    position:
      x: 800
      'y': 460
  - id: source_gate
    label: |-
      Select One of Seven PDF Sources
      Use a source-specific acquisition path
      Create simple machine-checkable facts
      Route every result to human review
    type: decision
    size: xl
    position:
      x: 1060
      'y': 460
  - id: arxiv_math
    label: |-
      Build arXiv Math Tests
      522 PDFs · 2,927 formula tests
      Single TeX source plus rendered PDF
      olmOCR · DP alignment · KaTeX · review
    type: process
    size: xl
    position:
      x: 1600
      'y': 20
  - id: old_scans_math
    label: |-
      Build Old-Scan Math Tests
      36 PDFs · 458 formula tests
      Public-domain Internet Archive books
      Random pages · olmOCR · manual formulas
    type: process
    size: xl
    position:
      x: 1600
      'y': 170
  - id: tables
    label: |-
      Build Table Tests
      188 PDFs · 1,020 relationship tests
      Internal crawl · Gemini Flash 2.0
      Random cells and manual review
    type: process
    size: xl
    position:
      x: 1600
      'y': 320
  - id: old_scans
    label: |-
      Build Old-Scan Text Tests
      98 PDFs · 526 tests from LoC
      Human transcripts drive order scripts
      Manual absence tests · second review
    type: process
    size: xl
    position:
      x: 1600
      'y': 470
  - id: headers_footers
    label: |-
      Build Header and Footer Tests
      266 PDFs · 753 absence tests
      DocLayout-YOLO abandon regions
      Mask · Gemini Flash 2.0 · manual bounds
    type: process
    size: xl
    position:
      x: 1600
      'y': 620
  - id: multi_column
    label: |-
      Build Multi-Column Tests
      231 PDFs · 884 order tests
      Visually sample the internal crawl
      Claude Sonnet 3.7 HTML · manual review
    type: process
    size: xl
    position:
      x: 1600
      'y': 770
  - id: long_tiny_text
    label: |-
      Build Long Tiny-Text Tests
      62 PDFs · 442 presence tests
      Dense Internet Archive pages
      Gemini Flash 2.0 · manual verification
    type: process
    size: xl
    position:
      x: 1600
      'y': 920
  - id: manual_review
    label: |-
      Generate and Review Source Tests
      Manual design and review
      GPT-4o prompting · typical T=0.1
      Humans correct facts and relations
      Exclude ambiguous or invalid cases
    type: process
    size: xl
    position:
      x: 2140
      'y': 460
  - id: paper_scope
    label: |-
      Freeze the Paper-v3 Table Scope
      Table 10: 1,403 PDFs · 7,010 core tests
      721 present · 823 absent · 1,061 order
      1,020 table · 3,385 formula
    type: database
    size: xl
    position:
      x: 2400
      'y': 460
  - id: fixed_release
    label: |-
      Package the Fixed HF Release
      1,403 PDFs · seven source JSONL files
      7,010 core plus 9 explicit baselines
      ODC-BY-1.0 at revision 54a96a6fb6a2
    type: database
    size: xl
    position:
      x: 2660
      'y': 460
  - id: run_ocr
    label: |-
      Run an OCR System per PDF Page
      Preserve the released single-page PDFs
      Emit Markdown or Unicode plain text
      Keep a natural reading order
    type: process
    size: xl
    position:
      x: 2660
      'y': 1400
  - id: normalize
    label: |-
      Normalize Comparable Text
      Collapse whitespace and strip emphasis
      Map quotes and hyphens to ASCII
      Normalize Unicode to NFC
    type: process
    size: xl
    position:
      x: 2400
      'y': 1400
  - id: test_gate
    label: |-
      Route to the Paper Test Families
      Five core categories plus baseline
      Evaluate simple page-level properties
      Every result is binary
    type: decision
    size: xl
    position:
      x: 1900
      'y': 1400
  - id: baseline
    label: |-
      Apply One Baseline per PDF
      Require alphanumeric output
      Reject ending n-gram repeats over 30
      Reject unexpected Chinese, Japanese,
      or emoji unless an exception applies
    type: process
    size: xl
    position:
      x: 1400
      'y': 1120
  - id: presence_absence
    label: |-
      Test Text Presence and Absence
      721 required · 823 forbidden spans
      Fuzzy match with optional first or last N
      Present is case-sensitive by default
    type: process
    size: xl
    position:
      x: 1400
      'y': 1280
  - id: reading_order
    label: |-
      Test Natural Reading Order
      1,061 before-and-after relations
      Fuzzy search both text segments
      Require a valid before position
    type: process
    size: xl
    position:
      x: 1400
      'y': 1440
  - id: table_accuracy
    label: |-
      Test Table Cell Relationships
      1,020 cell and neighbor facts
      Parse Markdown or HTML tables
      Complex spans require HTML structure
    type: process
    size: xl
    position:
      x: 1400
      'y': 1600
  - id: math_formula
    label: |-
      Test Math Formula Layout
      3,385 reference equations
      Render LaTeX with KaTeX
      Match symbols and relative boxes
    type: process
    size: xl
    position:
      x: 1400
      'y': 1760
  - id: source_rates
    label: |-
      Record Binary Results by Source
      Each fact passes or fails deterministically
      Seven document-source JSONL groups
      Baseline is eighth; compute each pass rate
    type: process
    size: xl
    position:
      x: 900
      'y': 1440
  - id: macro_score
    label: |-
      Macro-Average the Source Scores
      Give every source group equal weight
      Overall equals mean of group rates
      Do not micro-average all 7,010 facts
    type: process
    size: xl
    position:
      x: 640
      'y': 1440
  - id: confidence
    label: |-
      Report Overall and 95 Percent CI
      Paper Table 4 uses 10,000 bootstraps
      Paper does not state the resampling unit
      Compare OCR systems consistently
    type: terminal
    size: xl
    position:
      x: 380
      'y': 1440
  - id: source_boundary
    label: |-
      Construction Disclosure Boundary
      Internal source corpus is not identified
      Exact selection seeds are not disclosed
      Named LLMs lack immutable checkpoints
    type: document
    size: xl
    position:
      x: 1060
      'y': 940
  - id: release_boundary
    label: |-
      Paper-to-Release Count Boundary
      Prose says 1,402; Table 10 says 1,403
      Fixed JSONL has 7,019 physical records
      They are 7,010 core plus 9 baselines
    type: document
    size: xl
    position:
      x: 2920
      'y': 460
  - id: evaluator_drift
    label: |-
      Later Evaluator Drift Boundary
      Nine baselines remain in source groups
      Git adds format and footnote test types
      Majority repeats · 1,000 vs paper 10,000
    type: document
    size: xl
    position:
      x: 640
      'y': 1960
  - id: license_boundary
    label: |-
      Release and License Boundary
      Fixed dataset uses ODC-BY-1.0
      PDFs retain their source provenance
      Original upstream rights still apply
    type: document
    size: xl
    position:
      x: 2920
      'y': 880
