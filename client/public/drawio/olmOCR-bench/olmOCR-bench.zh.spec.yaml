      按来源编写单元测试
      人工标注公式与扫描件
      LLM起草表格与版式检查
      脚本编码阅读顺序检查
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: step_6
    label: |-
      人工核验每项测试
      检查页面证据与触发条件
      使用KaTeX验证公式
      复核生成与拆分测试
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: step_7
    label: |-
      发布1,403份PDF与7,010项测试
      存在721 · 缺失823
      阅读顺序1,061 · 表格1,020
      数学公式3,385
    type: database
    size: xl
    position:
      x: 1460
      'y': 40
  - id: step_8
    label: |-
      运行各OCR系统
      处理全部benchmark PDF
      输出Markdown或纯文本
      保持自然阅读顺序
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: step_9
    label: |-
      规范化OCR输出
      规范空白与Markdown强调
      规范引号与连字符
      应用Unicode NFC
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: step_10
    label: |-
      应用基线健全性测试
      要求含字母或数字内容
      拒绝结尾超过30的n-gram循环
      拒绝未标记的中日韩字符或Emoji
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: step_11
    label: |-
      测试文本存在与缺失
      定位必须出现的文本片段
      拒绝不应出现的页眉页脚
      执行位置条件
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: step_12
    label: |-
      测试结构与关系
      自然阅读顺序
      表格单元格关系
      公式符号与边界框关系
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: step_13
    label: |-
      计算二元结果
      每项单元测试通过或失败
      按PDF来源计算通过率
      保留来源级诊断
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: step_14
    label: |-
      报告最终基准分数
      对文档来源做宏平均
      Bootstrap 95%置信区间
      一致比较各OCR系统
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
