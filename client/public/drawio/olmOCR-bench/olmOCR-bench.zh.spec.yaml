  title: olmOCR-Bench 构建与评测流程
  description: 按论文构建发布版1,403份PDF与7,010项单元测试，随后进行规范化二元测试并对文档来源宏平均。
  legend: 论文一处正文写1,402份不同PDF，而v3发布表与公开benchmark采用1,403份；本图按发布版1,403份口径绘制。
