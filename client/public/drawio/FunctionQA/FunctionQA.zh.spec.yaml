meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FunctionQA 构建流程
  description: 按 MathVista 论文对齐的 400 题 FunctionQA 子集构建与确定性评测流程。
  legend: 实线箭头对应 arXiv:2310.02255 第 2.2–2.4、3.1 节；FunctionQA 是 MathVista 新建的视觉代数子集，并非 Intern-S1 中关于软件函数或工具的评测。
nodes:
  - id: gap
    label: |-
      确定缺失的视觉推理场景
      精细感知数学函数图像
      对变量、表达式、方程与函数做代数推理
    type: process
    size: xl
    position:
      x: 40
      'y': 250
  - id: annotation
    label: |-
      STEM 研究生人工编写题目
      组合函数图、问题与答案
      形成 400 道 FunctionQA
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: review
    label: |-
      三位评审独立核验新题
      MathVista 736 道新题整体一致率 99.2%
      6 个答案分歧全部经讨论达成共识
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: metadata
    label: |-
      统一 MathVista 元数据
      数学定向 · 教科书问答 · 函数图
      主要能力：代数推理
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: release
    label: |-
      在 MathVista 中发布 FunctionQA
      400 道视觉代数问题
      随 MathVista 划入 testmini/test，测试答案隐藏
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: response
    label: |-
      模型依据图像 + 查询作答
      先生成详细回复
      GPT-4 提取器抽取简短答案
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: score
    label: |-
      归一化为规定答案格式
      选项字母或数值自由回答
      计算确定性精确准确率
    type: terminal
    size: xl
    position:
      x: 1600
      'y': 250
edges:
  - from: gap
    to: annotation
    type: primary
  - from: annotation
    to: review
    type: primary
  - from: review
    to: metadata
    type: primary
  - from: metadata
    to: release
    type: primary
  - from: release
    to: response
    type: primary
  - from: response
    to: score
    type: primary
modules: []
