meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthBench Hard 构建流程
  description: 与论文一致的 1,000 条 HealthBench 困难子集选择流程及官方评分准则协议复用。
  legend: HealthBench Hard 是从 HealthBench 选择的子集，不是新编数据。选择流程使用五个前沿模型，先删除所有模型均为零分的样本， 再取跨提供方平均分最低的 1,000 条。
nodes:
  - id: full
    label: |-
      从完整 HealthBench 开始
      5,000 段对话与医生评分准则
      保留主题 · 维度 · 准则权重
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: models
    label: |-
      运行五个前沿模型
      o3 · Grok 3 · Gemini 2.5 Pro
      Claude 3.7 Sonnet · Llama 4 Maverick
    type: process
    size: xl
    position:
      x: 340
      'y': 300
  - id: score_candidates
    label: |-
      计算单样本分数
      模型裁判逐条检查评分准则
      使用官方正负分公式
    type: process
    size: xl
    position:
      x: 640
      'y': 300
  - id: all_zero
    label: |-
      删除全零分样本
      所有模型都无正分时过滤
      约去除 1.5% 可能过难题
    type: decision
    size: xl
    position:
      x: 940
      'y': 300
  - id: average
    label: |-
      跨模型提供方取平均
      降低针对单一模型的对抗选择
      按难度排序剩余样本
    type: process
    size: xl
    position:
      x: 1240
      'y': 300
  - id: select
    label: |-
      选择平均分最低 1,000 条
      对当前前沿模型保持困难
      为未来系统保留提升空间
    type: process
    size: xl
    position:
      x: 1540
      'y': 300
  - id: hard_set
    label: |-
      发布 HealthBench Hard
      1,000 段原始对话与评分准则
      不新增对话或准则标注
    type: database
    size: xl
    position:
      x: 1840
      'y': 300
  - id: inference
    label: |-
      生成被测响应
      回答最后一个用户消息
      保留完整对话上下文
    type: process
    size: xl
    position:
      x: 2140
      'y': 300
  - id: grade
    label: |-
      复用官方评分准则裁判
      逐条判断准则真或假
      每条给予全分或零分
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: example_score
    label: |-
      计算原始单样本分数
      满足的加权分除以最大正分
      负向准则可降低分数
    type: process
    size: xl
    position:
      x: 2740
      'y': 300
  - id: aggregate
    label: |-
      报告 HealthBench Hard 分数
      1,000 条均值裁剪至 0-1
      相同维度拆分与自助法不确定性
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 300
edges:
  - from: full
    to: models
    type: primary
  - from: models
    to: score_candidates
    type: primary
  - from: score_candidates
    to: all_zero
    type: primary
  - from: all_zero
    to: average
    type: primary
  - from: average
    to: select
    type: primary
  - from: select
    to: hard_set
    type: primary
  - from: hard_set
    to: inference
    type: primary
  - from: inference
    to: grade
    type: primary
  - from: grade
    to: example_score
    type: primary
  - from: example_score
    to: aggregate
    type: primary
modules: []
