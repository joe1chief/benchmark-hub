meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CIMemories Build Process
  description: >-
    Paper-aligned synthetic-profile, context, persona-labeling, consensus-filtering, and memory evaluation path, with a
    separate provenance branch for the pinned Hugging Face 71,883-row raw prompt artifact whose label column is blank or
    null and which is not the paper's filtered labeled evaluation set.
  legend: Solid arrows show the paper evaluation path; dashed data arrows lead to the separate public raw artifact.
nodes:
  - id: identities
    label: |-
      Create Synthetic Adult Identities
      Faker Profiles • Ages 21–70
      Use 10 Profiles in the Main Evaluation
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: events
    label: |-
      Sample Personal Events
      Three Events × Nine Domains
      Seven Attributes per Event at Most
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: memories
    label: |-
      Generate Personal Memories
      GPT-OSS-120B Produces Statements
      Main Profiles Average 147 Attributes
    type: document
    size: xl
    position:
      x: 540
      'y': 420
  - id: contexts
    label: |-
      Curate 49 Context Seeds
      Specify Goal • Recipient • Situation
      Pair Contexts with Candidate Attributes
    type: process
    size: xl
    position:
      x: 790
      'y': 180
  - id: personas
    label: |-
      Apply Three Westin Personas
      Fundamentalist • Pragmatic • Unconcerned
