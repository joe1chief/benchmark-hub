meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CIMemories Build Process
  description: >-
    Paper-aligned CIMemories flow: synthetic identities are expanded into event-derived personal memories, paired with
    curated goal-recipient contexts, labeled under Westin privacy personas with strict agreement filtering, and used to
    measure inappropriate disclosure and useful recall under repeated-task stress.
  legend: Solid arrows show benchmark construction and evaluation; dashed arrows show the retained-label release path.
nodes:
  - id: identities
    label: |-
      Create Synthetic User Identities
      Faker-generated Demographic Profiles
      Use 10 Profiles in the Main Evaluation
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: events
    label: |-
      Sample Personal Life Events
      Positive + Challenging Experiences
      Cover Nine Information Domains
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: memories
    label: |-
      Generate Attributes and Memories
      GPT-OSS-120B Produces Memory Statements
      About 147 Attributes per Profile on Average
    type: document
    size: xl
    position:
      x: 640
      'y': 220
  - id: contexts
    label: |-
      Curate 49 Social Task Contexts
      Specify Goal, Recipient, and Situation
      Pair Contexts with Candidate Attributes
    type: process
    size: xl
    position:
      x: 940
      'y': 40
  - id: personas
    label: |-
      Apply Westin Privacy Personas
      Fundamentalist • Pragmatic • Unconcerned
      Sample 10 GPT-5 Labels per Persona
    type: user
    size: xl
    position:
      x: 940
      'y': 400
  - id: labels
    label: |-
      Label Attribute Necessity and Risk
      Necessary for Task Completion?
      Inappropriate to Reveal to This Recipient?
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: consensus
    label: |-
      Enforce Zero-entropy Consensus
      Mix Persona Votes with Westin Priors
      Drop Ambiguous Attribute-context Pairs
    type: process
    size: xl
    position:
      x: 1540
      'y': 220
  - id: balance
    label: |-
      Require Both Label Types per Context
      Keep Necessary and Inappropriate Examples
      Remove Contexts Missing Either Category
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: instances
    label: |-
      Release CIMemories Instances
      71.9K Attribute-context Rows on Hub
      Memories + Task + Recipient + Gold Labels
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: runs
    label: |-
      Run Memory-augmented Models
      Prefix Task with Stored User Memories
      Sample Five Responses per Instance
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: judge
    label: |-
      Detect Revealed Attributes
      REVEAL Judge with DeepSeek-R1
      Match Response Content to Gold Attributes
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
  - id: metrics
    label: |-
      Compute Privacy and Utility
      Violation@5 for Inappropriate Disclosure
      Completeness for Necessary Information
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: stress
    label: |-
      Stress-test Persistent Memory
      Scale from 1 to 40 Tasks per User
      Repeat Each Task 1 to 5 Generations
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
