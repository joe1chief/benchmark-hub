    type: user
    size: xl
    position:
      x: 790
      'y': 660
  - id: labels
    label: |-
      Label Attribute–Context Pairs
      Necessary for Task Completion?
      Inappropriate for This Recipient?
    type: process
    size: xl
    position:
      x: 1040
      'y': 420
  - id: consensus
    label: |-
      Mix Persona Distributions with Westin Priors
      Keep Only Zero-entropy Necessary / Inappropriate Pairs
      Exclude Ambiguous Labels
    type: process
    size: xl
    position:
      x: 1290
      'y': 420
  - id: balance
    label: |-
      Filter Evaluation Contexts
      Require Both Necessary + Inappropriate Examples
      Drop Contexts Missing Either Label Type
    type: process
    size: xl
    position:
      x: 1540
      'y': 420
  - id: paper_eval
    label: |-
      Paper's Filtered Labeled Evaluation Set
      Gold Contextual-integrity Pairs
      Exact Retained Row Count Is Not Disclosed
    type: database
    size: xl
    position:
      x: 1790
      'y': 420
  - id: hf_raw
    label: |-
      Pinned Hugging Face Raw Artifact
      test.csv: 71,883 Prompt Rows
      label Is Blank / Null; Not the Gold Eval Set
    type: database
    size: xl
    position:
      x: 1540
      'y': 800
  - id: runs
    label: |-
      Run Memory-augmented Models
      Prefix Tasks with Stored User Memories
      Sample Five Responses per Instance
    type: process
    size: xl
    position:
      x: 2040
      'y': 420
  - id: judge
    label: |-
      Detect Revealed Attributes
      DeepSeek-R1 REVEAL Judge
      Match Responses to Gold Attributes
    type: process
    size: xl
    position:
      x: 2290
      'y': 420
  - id: metrics
    label: |-
      Compute Privacy + Utility
      Violation@5 for Inappropriate Disclosure
      Completeness for Necessary Information
    type: process
    size: xl
    position:
      x: 2540
      'y': 420
  - id: stress
    label: |-
      Stress-test Persistent Memory
      Scale 1–40 Tasks per User
      Repeat Each Task 1–5 Generations
    type: terminal
    size: xl
    position:
      x: 2790
      'y': 420
