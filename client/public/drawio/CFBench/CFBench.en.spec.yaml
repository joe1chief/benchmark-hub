  layout: horizontal
  routing: orthogonal
  title: CFBench Build Process
  description: >-
    Paper-aligned construction of CFBench: online logs and NLP tasks are mined for real-world instructions, atomic
    constraints are extracted and expanded into a 10-category taxonomy, balanced scenarios and constraints produce
    curated samples, annotators refine instructions, answers, and checklists, and GPT-4o-based checkpoint judging
    reports CSR, ISR, and PSR.
  legend: Solid arrows show constraint-system construction, sample assembly, human refinement, checklist judging, and metrics.
