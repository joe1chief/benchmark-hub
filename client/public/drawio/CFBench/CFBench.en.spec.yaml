meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CFBench Build Process
  description: >-
    Paper- and official-code-aligned construction of 1,000 Chinese complex constraint-following samples from real
    instructions and NLP tasks, with a 10-primary/25-subcategory constraint taxonomy, expert-refined independent
    checkpoints, 500 easy and 500 hard examples, GPT-4o judging, and executable CSR, ISR, and PSR definitions.
  legend: >-
    Solid arrows show dataset construction and evaluation; dashed arrows carry source evidence or quality-control
    feedback.
nodes:
  - id: sources
    label: |-
      Collect Real Instructions
      Online Service Logs and Existing NLP Tasks
      Cover Four NLP Types and Real-life Domains
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: filter
    label: |-
      Filter and Cluster the Instruction Pool
      Remove Noise and Redundancy
      Retain About 30,000 Representative Instructions
    type: process
    size: xl
    position:
      x: 340
      'y': 220
  - id: atomic
    label: |-
      Extract and Expand Atomic Constraints
      LLM-assisted Classification, Synthesis, and Evolution
      Produce More than 5,000 Unique Constraints
    type: process
    size: xl
    position:
      x: 640
      'y': 220
  - id: taxonomy
    label: |-
      Build the Constraint Type System
      10 Primary Categories
      More than 25 Fine-grained Subcategories
    type: document
    size: xl
    position:
      x: 940
      'y': 220
  - id: select
    label: |-
      Assess and Balance Candidate Instructions
      Constraint Types and Counts • Scenarios • Tasks
      Select 2,000 Refined Instructions
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: annotate
    label: |-
      Professional Annotators Refine Samples
      Instruction • Gold Answer • Constraint Labels
      Iterative Review with Expert Involvement
    type: user
    size: xl
    position:
      x: 1540
      'y': 100
  - id: checklist
    label: |-
      Decompose Requirements into Checkpoints
      One Independently Judgable Criterion per Requirement
      Mark Type and Priority: Primary or Secondary
    type: document
    size: xl
    position:
      x: 1540
      'y': 340
  - id: qc
    label: |-
      Validate Instructions, Answers, and Checklists
      Training • Cross-validation • Batch Validation
      Correct or Regenerate Unsatisfactory Samples
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: release
    label: |-
      Release 1,000 CFBench Samples
      500 Easy • 500 Hard
      200+ Scenarios • 20 Domains • 50+ NLP Tasks
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: inference
    label: |-
      Generate Model Responses
      Chinese Complex Constraint Instructions
      Maximum Generation Length 2,048 Tokens
    type: process
    size: xl
    position:
      x: 2440
      'y': 220
  - id: judge
    label: |-
      GPT-4o Judges Every Checkpoint
      Compare Prompt, Response, Gold, and Criteria
      Parse Binary Satisfaction Scores • Temperature 0
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: csr
    label: |-
      CSR
      Mean Binary Checkpoint Satisfaction
      Average across All Constraints and Samples
    type: process
    size: xl
    position:
      x: 3040
      'y': 40
  - id: isr
    label: |-
      ISR
      Instruction Counts as Satisfied Only If CSR = 1
      Average the All-checkpoints-pass Indicator
    type: process
    size: xl
    position:
      x: 3040
      'y': 220
  - id: psr
    label: |-
      PSR
      Require All Primary Needs; Score Secondary Needs
      Apply the Official Priority-aware Threshold Logic
    type: process
    size: xl
    position:
      x: 3040
      'y': 400
  - id: report
    label: |-
      Report CSR, ISR, and PSR
      Easy • Hard • Full Sets
      Break Down by Constraint, Domain, and NLP Task
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
