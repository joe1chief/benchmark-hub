meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Cybench 构建流程
  description: 与论文对齐的专业 CTF 筛选、任务验证、交互式智能体执行及引导/无引导评分流程。
  legend: 实线表示构建与评测主流程；两个分支区分无引导和子任务引导模式。
nodes:
  - id: sources
    label: |-
      四个近期 CTF 竞赛
      专业挑战题池
    type: database
    size: xl
    position:
      x: 40
      'y': 210
  - id: select
    label: |-
      筛选 40 个任务
      有意义 · 6 类题型 · 难度跨度大
    type: process
    size: xl
    position:
      x: 300
      'y': 210
  - id: package
    label: |-
      任务包
      描述 · 起始文件 · 判分器
    type: document
    size: xl
    position:
      x: 560
      'y': 210
  - id: environment
    label: |-
      隔离环境
      Kali Linux + 本地文件 + 远程服务
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: subtasks
    label: |-
      中间子任务
      顺序式问题 / 答案检查点
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: solution
    label: |-
      标准解题脚本
      精确复现 Flag
    type: document
    size: xl
    position:
      x: 1340
      'y': 210
  - id: verify
    label: |-
      CI 与环境检查
      可构建 · 服务存活 · 可解
    type: decision
    size: xl
    position:
      x: 1600
      'y': 210
  - id: interaction
    label: |-
      智能体交互循环
      Bash 动作 → 观察 → 记忆
    type: process
    size: xl
    position:
      x: 1860
      'y': 210
  - id: mode
    label: 评测模式
    type: decision
    size: xl
    position:
      x: 2120
      'y': 210
  - id: unguided
    label: |-
      无引导模式
      单一目标 · 最终二元成功
    type: process
    size: xl
    position:
      x: 2380
      'y': 70
  - id: guided
    label: |-
      子任务模式
      顺序引导 + 最终任务
    type: process
    size: xl
    position:
      x: 2380
      'y': 350
  - id: evaluator
    label: |-
      答案判分器
      提交答案与答案键比较
    type: process
    size: xl
    position:
      x: 2640
      'y': 210
  - id: metrics
    label: |-
      Cybench 报告
      无引导 · 引导 · 子任务% · FST · Token/时间
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 210
edges:
  - from: sources
    to: select
    type: primary
  - from: select
    to: package
    type: primary
  - from: package
    to: environment
    type: primary
  - from: environment
    to: subtasks
    type: primary
  - from: subtasks
    to: solution
    type: primary
  - from: solution
    to: verify
    type: primary
  - from: verify
    to: interaction
    type: primary
  - from: interaction
    to: mode
    type: primary
  - from: mode
    to: unguided
    type: primary
  - from: mode
    to: guided
    type: primary
  - from: unguided
    to: evaluator
    type: primary
  - from: guided
    to: evaluator
    type: primary
  - from: evaluator
    to: metrics
    type: primary
modules: []
