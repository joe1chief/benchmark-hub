meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XORQA-IN Translation, Views, and Protocol Overrides
  description: >-
    IndicGenBench samples Bengali/Telugu XOR-TyDi sources, uses 100 train and 500 dev seeds plus a 539-example
    public-dev-derived test seed, and expands them through two-stage professional human translation to 28 Indic
    languages. Each record supports XORQA-IN-EN and XORQA-IN-XX views. IndicGenBench uses SQuAD token F1 with principal
    one-shot prompting, while Gemma 3 overrides this to character F-score with five shots; the diagram keeps those
    protocols separate.
  legend: >-
    Source: The site wording (Gemma 3; in-en/in-xx) identifies IndicGenBench XORQA-IN, not original XOR-TyDi. Primary
    construction: IndicGenBench arXiv:2404.16816v2, Table 1, Section 2 Cross-Lingual Question-Answering: XORQA-IN,
    Section 3 Evaluation Metrics, Appendix Table 15, and Table 18; official data
    https://github.com/google-research-datasets/indic-gen-bench. Gemma 3 arXiv:2503.19786 Tables 14 and 19 supplies the
    reuse protocol. Original XOR QA arXiv:2010.11856 is upstream provenance only. Appendix Table 15 mislabels both rows
    IN-XX; the English-output row is IN-EN by Section 2.. Solid arrows show the main flow explicitly supported by the
    paper or official documentation.
