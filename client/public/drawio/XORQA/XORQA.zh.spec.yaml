meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XORQA-IN 翻译、双视图与协议覆盖流程
  description: >-
    IndicGenBench从XOR-TyDi的孟加拉语/泰卢固语样例中抽取100个train与500个dev种子，并因原test不公开而从公开dev选539个test种子，再经两阶段专业人工翻译扩展到28种印度语言。每条记录支持XORQA-IN-EN和XORQA-IN-XX两个视图。IndicGenBench使用SQuAD
    token F1与主要one-shot协议，而Gemma 3改用5-shot字符F分；流程图必须分开两套协议。
  legend: >-
    来源：The site wording (Gemma 3; in-en/in-xx) identifies IndicGenBench XORQA-IN, not original XOR-TyDi. Primary
    construction: IndicGenBench arXiv:2404.16816v2, Table 1, Section 2 Cross-Lingual Question-Answering: XORQA-IN,
    Section 3 Evaluation Metrics, Appendix Table 15, and Table 18; official data
    https://github.com/google-research-datasets/indic-gen-bench. Gemma 3 arXiv:2503.19786 Tables 14 and 19 supplies the
    reuse protocol. Original XOR QA arXiv:2010.11856 is upstream provenance only. Appendix Table 15 mislabels both rows
    IN-XX; the English-output row is IN-EN by Section 2.。实线箭头表示论文或官方资料明确支持的主流程。
