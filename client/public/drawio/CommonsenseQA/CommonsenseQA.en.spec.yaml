meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CommonsenseQA Build Process
  description: >-
    Paper-aligned CommonsenseQA workflow: filtered ConceptNet triplets are grouped into same-source/same-relation
    three-target sets, qualified crowdworkers write discriminative questions and two hard distractors, disjoint workers
    verify quality, and 12,247 five-choice questions use a primary random split and accuracy.
  legend: >-
    Solid arrows show ConceptNet filtering, subgraph construction, crowdsourced questions and distractors, verification,
    optional context, and evaluation.
nodes:
  - id: conceptnet
    label: |-
      ConceptNet
      32M Commonsense Triplets
    type: database
    size: large
    position:
      x: 40
      'y': 200
  - id: filter
    label: |-
      Filter General / Weak Edges
      Keep 236,208 (q, r, a) Triplets
    type: process
    size: xl
    position:
      x: 280
      'y': 200
  - id: group
    label: |-
      Group Same Source q + Relation r
      Three Semantically Similar Targets
      ≈43K Question Sets
    type: process
    size: xl
    position:
      x: 540
      'y': 200
  - id: questions
    label: |-
      AMT Question Writing
      3 Questions per Set
      One Target Correct per Question
      Avoid Surface Clues
    type: user
    size: xl
    position:
      x: 800
      'y': 200
  - id: worker_gate
    label: |-
      Formulator Quality Gate
      ≥75% Questions Pass Verification
    type: process
    size: xl
    position:
      x: 1060
      'y': 200
  - id: distractors
    label: |-
      Add Two Hard Distractors
      One Same-relation ConceptNet Target
      One Worker-written Plausible Option
      Total: 5 Choices
    type: process
    size: xl
    position:
      x: 1320
      'y': 200
  - id: verification
    label: |-
      Disjoint Verification Workers
      2 Workers per Question
      Keep if ≥1 Answers Correctly
      Filter 15%
    type: user
    size: xl
    position:
      x: 1580
      'y': 200
  - id: context
    label: |-
      Optional Web Context
      Question + Each Candidate Query
      100 Snippets × 5 Answers
    type: document
    size: xl
    position:
      x: 1840
      'y': 200
  - id: dataset
    label: |-
      CommonsenseQA
      16,242 Formulated → 12,247 Final
      Five-choice English Questions
    type: database
    size: xl
    position:
      x: 2100
      'y': 200
  - id: split
    label: |-
      Primary Random Split
      Train 80% / Dev 10% / Test 10%
      Also Concept-disjoint Split
    type: database
    size: xl
    position:
      x: 2360
      'y': 200
  - id: score
    label: |-
      Choose One Answer
      Test Accuracy
      Human Majority-vote Baseline
    type: terminal
    size: xl
    position:
      x: 2620
      'y': 200
edges:
  - from: conceptnet
    to: filter
    type: primary
  - from: filter
    to: group
    type: primary
  - from: group
    to: questions
    type: primary
  - from: questions
    to: worker_gate
    type: primary
  - from: worker_gate
    to: distractors
    type: primary
  - from: distractors
    to: verification
    type: primary
  - from: verification
    to: context
    type: primary
  - from: context
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: score
    type: primary
modules: []
