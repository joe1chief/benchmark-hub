  title: SingleCellBench 构建与评测流程
  description: >-
    SingleCellBench是LatchBio评测变体，目前仅见于Claude Sonnet
    5官方系统卡，没有独立基准论文。系统卡说明它包含195个问题，用于测试单细胞RNA测序数据分析，覆盖细胞类型标注、差异表达分析和批次效应校正等标准流程，并报告该变体的模型汇总得分。一手材料没有披露195题的来源或标注方式、数据划分、提示与工具设置、参考答案格式、逐题评分量表或聚合公式。因此流程图把少量已披露的任务范围事实与明确的未披露方法边界分开，而不虚构构建流程。
  legend: 来源：Claude Sonnet 5 System Card Section 8.14.2 LatchBio Bioinformatics, p.142。实线箭头表示论文或官方资料明确支持的主流程。
