meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Blueprint-Bench Build Process
  description: >-
    Paper-aligned construction and evaluation of 50 apartment-photo spatial reconstruction tasks, standardized
    four-color floor plans, three model-generation pathways, deterministic computer-vision extraction, and a weighted
    room-connectivity similarity score.
  legend: >-
    Solid arrows show dataset construction, generation, and scoring; dashed arrows add human and random baselines to the
    final comparison.
nodes:
  - id: listings
    label: |-
      Collect Apartment Listings
      Interior Photo Sequences
      Official Listing Floor Plans
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: dataset
    label: |-
      Select 50 Apartments
      Approximately 20 Interior Photos Each
      Adapt the Official Floor Plan as Ground Truth
    type: process
    size: xl
    position:
      x: 320
      'y': 220
  - id: format
    label: |-
      Standardize Ground-Truth Floor Plans
      Nine Rendering Rules
      Black Walls • Green Doors • Red Room Centers • White Background
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: package
    label: |-
      Package the Evaluation Input
      Photo Sequence plus Formatting Instructions
      Keep Most Apartments Private; Release Code and a Sample
    type: document
    size: xl
    position:
      x: 880
      'y': 220
  - id: image_model
    label: |-
      Image-Generation Path
      Generate the Floor Plan Image in One Pass
      Follow the Same Nine Rules
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
  - id: llm
    label: |-
      Multimodal LLM Path
      Infer Rooms, Connectivity, and Relative Scale
      Generate SVG Code and Convert It to an Image
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: agent
    label: |-
      Agent Path in a Linux Container
      Read Images from a Folder • Write a Required Image File
      May Inspect and Iteratively Refine Its Drawing
    type: process
    size: xl
    position:
      x: 1160
      'y': 400
  - id: raster
    label: |-
      Normalize the Submitted Floor Plan Image
      Enforce Scorable Pixel Colors and Geometry
      Invalid Formatting Is Reflected in the Score
    type: document
    size: xl
    position:
      x: 1440
      'y': 220
  - id: extract
    label: |-
      Deterministically Extract Spatial Structure
      HSV Red-Center Detection • Flood-Fill Room Segmentation
      Green-Door Scan • Areas and Size Ranks
    type: process
    size: xl
    position:
      x: 1720
      'y': 220
  - id: graph
    label: |-
      Create Structured Floor-Plan JSON
      Room Connectivity Graph • Door Positions and Orientations
      Room IDs Ranked from Largest to Smallest
    type: database
    size: xl
    position:
      x: 2000
      'y': 220
  - id: components
    label: |-
      Compute Six Similarity Components
      Edge Jaccard • Degree Correlation • Graph Density
      Room Count • Door Count • Door Orientation
    type: process
    size: xl
    position:
      x: 2280
      'y': 220
  - id: baselines
    label: |-
      Build Comparison Baselines
      Human Reconstruction on 12 Apartments
      Random Typical Floor Plans without Photo Input
    type: user
    size: xl
    position:
      x: 2280
      'y': 440
  - id: score
    label: |-
      Weighted Similarity Score from 0 to 1
      50% Edge • 20% Degree • 10% Density • 10% Rooms
      5% Doors • 5% Door Orientation
    type: decision
    size: xl
    position:
      x: 2560
      'y': 220
  - id: report
    label: |-
      Compare LLMs, Image Models, Agents, and Baselines
      Aggregate across 50 Apartments and Repeated Epochs
      Update the Public Spatial-Intelligence Leaderboard
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 220
edges:
  - from: listings
    to: dataset
    type: primary
  - from: dataset
    to: format
    type: primary
  - from: format
    to: package
    type: primary
  - from: package
    to: image_model
    type: primary
  - from: package
    to: llm
    type: primary
  - from: package
    to: agent
    type: primary
  - from: image_model
    to: raster
    type: primary
  - from: llm
    to: raster
    type: primary
  - from: agent
    to: raster
    type: primary
  - from: raster
    to: extract
    type: primary
  - from: extract
    to: graph
    type: primary
  - from: graph
    to: components
    type: primary
  - from: components
    to: score
    type: primary
  - from: baselines
    to: score
    type: data
  - from: score
    to: report
    type: primary
modules: []
