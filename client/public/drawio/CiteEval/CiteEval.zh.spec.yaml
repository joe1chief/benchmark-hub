meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: CiteBench 人工标注基准构建流程
  description: 展示完整 LFQA 数据池、论文披露的响应预处理，以及以完整响应为单位、在上下文中逐句判断的三次盲审，最终形成 200/1,000 指标划分。
  legend: 每次盲审都接收完整响应/样本，并在全部上下文可见时逐句处理。仅“检索”语句接受引用编辑与评分；“用户知识”“响应知识”“参数知识”三类标为 N/A。
