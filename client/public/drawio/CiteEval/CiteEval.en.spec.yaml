meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CiteEval Build Process
  description: >-
    Paper-aligned CiteEval flow: long-form QA queries, fixed retrieval contexts, and responses from four models are
    annotated at statement level for attribution, citation edits, and 1-to-5 ratings; quality-controlled labels then
    train and validate CiteEval-Auto before full-context and cited-context RAG benchmarking.
  legend: Solid arrows show data construction, human annotation, metric development, and benchmark evaluation.
nodes:
  - id: principles
    label: |-
      Define Three Evaluation Principles
      Use Full Retrieval Context
      Include Beyond-retrieval Contexts + Fine-grained Ratings
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: queries
    label: |-
      Sample Long-form QA Queries
      ASQA • ELI5 • MS MARCO • LFRQA
      948 Development + 3,000 Test Queries
    type: database
    size: xl
    position:
      x: 340
      'y': 220
  - id: retrieval
    label: |-
      Fix the Retrieval Evidence
      Provide 10 Passages per Query
      Preserve the Full Context for Evaluation
    type: database
    size: xl
    position:
      x: 640
      'y': 220
  - id: responses
    label: |-
      Generate Human-study Responses
      100 Queries × 3 Sources × 4 Models
      GPT-4o/mini + Llama-3-70B/8B = 1,200
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: statements
    label: |-
      Parse Statements and Citations
      Split Responses with NLTK
      Extract Citation Markers [1] through [10]
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: attribution
    label: |-
      Annotate Supporting Context
      Retrieval • User • Response • Parametric
      Mark N/A for Non-applicable Beyond-retrieval Sources
    type: user
    size: xl
    position:
      x: 1540
      'y': 40
  - id: edits
    label: |-
      Record Critical Citation Edits
      Add Missing Citations
      Delete Unsupported or Unnecessary Citations
    type: user
    size: xl
    position:
      x: 1540
      'y': 220
  - id: ratings
    label: |-
      Assign Fine-grained Ratings
      Score Citation Quality from 1 to 5
      Evaluate Full and Cited Context Scenarios
    type: user
    size: xl
    position:
      x: 1540
      'y': 400
  - id: qc
    label: |-
      Quality-control Human Labels
      Three Blind Passes + Majority/Mean Aggregation
      Linguist Validation after Three Pilot Rounds
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: split
    label: |-
      Split Metric-development Data
      200 Responses for Metric Development
      1,000 Responses for Meta-evaluation
    type: database
    size: xl
    position:
      x: 2140
      'y': 220
  - id: auto_context
    label: |-
      Automate Context Attribution
      Model Which Context Supports Each Statement
      Cover Retrieval and Beyond-retrieval Evidence
    type: process
    size: xl
    position:
      x: 2440
      'y': 40
  - id: ensemble
    label: |-
      Build CiteEval-Auto
      ITERCOE + EDITDIST Ensemble
      Combine Model Reasoning and Edit Distance
    type: process
    size: xl
    position:
      x: 2440
      'y': 400
  - id: validate
    label: |-
      Meta-evaluate against Human Scores
      GPT-4o + MLR Configuration
      Reach Pearson Correlation 0.731
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 220
  - id: benchmark
    label: |-
      Benchmark Diverse RAG Systems
      Compare Full-context and Cited-context Scores
      Diagnose and Iteratively Improve Citations
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
