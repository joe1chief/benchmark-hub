  layout: horizontal
  routing: orthogonal
  title: ScienceQA Build and Evaluation Process
  description: >-
    The Science QA entry in the Olmo 3 report describes scientific tool-use SFT data, not the older multimodal ScienceQA
    benchmark and not a separately scored evaluation suite. It has two query classes: paper-content questions grounded
    in abstracts or full text, and citation-graph questions about authors, venues, and citations. GPT-5 creates few-shot
    citation-query templates and instantiates them with real paper entities. For content questions, a GPT-5 agent uses
    the Ai2 Scholar Corpus server to retrieve papers and formulate questions answerable from the retrieved text. A
    GPT-4.1-mini agent with the same server then produces tool-use trajectories for both classes; the saved tool outputs
    are actual environment responses rather than synthetic completions. These trajectories enter Dolci Instruct SFT. The
    report does not separately disclose this subset's size, split, standalone scorer, or evaluation metric.
  legend: >-
    Source: Olmo 3 arXiv:2512.13961 Appendix A.7.2 Science QA. Solid arrows show the main flow explicitly supported by
    the paper or official documentation.
