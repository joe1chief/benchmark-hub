  layout: horizontal
  routing: orthogonal
  title: ScienceQA 构建与评测流程
  description: >-
    Olmo 3报告中的Science
    QA指科学工具调用监督微调数据，不是早期多模态ScienceQA基准，也不是一个单独计分的评测套件。它包含两类查询：基于摘要或全文的论文内容问答，以及围绕作者、会议期刊和引用关系的引文图谱问答。GPT-5以少样本方式创建引文查询模板并用真实论文实体实例化；对内容问答，配备Ai2
    Scholar
    Corpus服务器的GPT-5智能体检索相关论文，并生成可由检索文本回答的问题。随后，使用同一服务器的GPT-4.1-mini智能体为两类查询生成工具调用轨迹，保存的工具输出是真实环境响应而非合成补全。这些轨迹进入Dolci
    Instruct监督微调；报告没有单独披露该子集的规模、划分、独立评分器或评测指标。
  legend: 来源：Olmo 3 arXiv:2512.13961 Appendix A.7.2 Science QA。实线箭头表示论文或官方资料明确支持的主流程。
