meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScanBench Build and Evaluation Process
  description: >-
    ScanBench converts 303 clinical cases from 12 departments into the progressive workflow Inquiry, Lab Testing, and
    Diagnosis. Its inquiry ground truth contains 8,857 checklist items, averaging 29.23 per case, partitioned into Level
    2 critical and Level 1 supplementary evidence. The lab station uses a unified action space of 38 examination
    categories and labels tests as essential or optional. During evaluation, a model first interviews a standardized
    patient; GPT-4.1 checks coverage of OSCE-derived clinical points and the SCAN framework scores Safety
    Stratification, Information Clarification, Associative Questioning, and Normative Output. The model then proposes a
    differential and selects tests, scored by weighted F1 with higher essential-test recall weight, before a final
    diagnosis is matched hierarchically against ICD-10.
  legend: >-
    Source: Baichuan-M3 arXiv:2602.06570 Sections 4.1.1-4.1.2 and Figure 4. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
