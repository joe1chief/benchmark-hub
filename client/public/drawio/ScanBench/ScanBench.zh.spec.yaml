meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScanBench 构建与评测流程
  description: >-
    ScanBench把来自12个科室的303个临床病例转换为问诊、辅助检查和诊断三个递进阶段。问诊真值包含8857个检查项，平均每例29.23项，并区分二级关键证据与一级补充证据；辅助检查阶段使用38类统一动作空间，并把检查标为必要或可选。评测时模型先与标准化患者多轮问诊，由GPT-4.1核验OSCE关键临床点，SCAN框架评估安全分层、信息澄清、关联追问与规范输出；随后模型提出鉴别诊断并选择检查，以提高必要检查召回权重的加权F1评分；最终诊断按ICD-10层级匹配，奖励正确叶节点并惩罚跨分支预测。
  legend: 来源：Baichuan-M3 arXiv:2602.06570 Sections 4.1.1-4.1.2 and Figure 4。实线箭头表示论文或官方资料明确支持的主流程。
