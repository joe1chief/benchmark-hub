meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench 构建流程
  description: >-
    按论文对齐的 MMBench 流程：以感知和推理的三级能力体系指导志愿者从互联网与公开验证集图像采题， 通过两种带人工复核的过滤机制去除纯文本可答和错误样本，形成 3,217 题并制作人工核验的中文版，按 4:6 切分后以
    CircularEval 和稳健选项抽取计算准确率。
  legend: 实线表示构建与评测主流程；下方答案路径表示启发式匹配失败后的 GPT-4 回退。
nodes:
  - id: l1
    label: |-
      一级能力
      感知与推理
    type: database
    size: large
    position:
      x: 40
      'y': 240
  - id: taxonomy
    label: |-
      6 个二级类别
      20 个三级能力
    type: process
    size: large
    position:
      x: 240
      'y': 240
  - id: examples
    label: |-
      每个三级能力
      先编 10–20 道示例
    type: document
    size: large
    position:
      x: 440
      'y': 240
  - id: volunteers
    label: |-
      学生志愿者
      扩充图像选择题
    type: user
    size: large
    position:
      x: 840
      'y': 240
  - id: sources
    label: |-
      互联网超 80%
      公开验证集图像约 20%
    type: database
    size: large
    position:
      x: 640
      'y': 240
  - id: text_filter
    label: |-
      多数 LLM 纯文本答对
      再由人工复核
    type: decision
    size: large
    position:
      x: 1040
      'y': 240
  - id: wrong_filter
    label: |-
      所有 VLM 均答错
      再由人工复核
    type: decision
    size: large
    position:
      x: 1240
      'y': 240
  - id: curated
    label: |-
      3,217 道题
      每项三级能力至少 125 题
    type: database
    size: large
    position:
      x: 1440
      'y': 240
  - id: bilingual
    label: |-
      GPT-4 翻译中文版
      人工核验
    type: process
    size: large
    position:
      x: 1640
      'y': 240
  - id: split
    label: |-
      开发集 40%：答案公开
      测试集 60%：答案保密
    type: document
    size: large
    position:
      x: 1840
      'y': 240
  - id: circular
    label: |-
      CircularEval
      N 次循环轮换选项
    type: process
    size: large
    position:
      x: 2040
      'y': 240
  - id: heuristic
    label: |-
      启发式选项
      是否匹配成功
    type: decision
    size: large
    position:
      x: 2240
      'y': 120
  - id: gpt4
    label: |-
      未匹配时
      GPT-4 抽取选项
    type: process
    size: large
    position:
      x: 2240
      'y': 380
  - id: all_passes
    label: |-
      N 次轮换
      必须全部答对
    type: decision
    size: large
    position:
      x: 2440
      'y': 240
  - id: score
    label: |-
      CircularEval
      Top-1 准确率
    type: terminal
    size: large
    position:
      x: 2640
      'y': 240
edges:
  - from: l1
    to: taxonomy
    type: primary
  - from: taxonomy
    to: examples
    type: primary
  - from: examples
    to: sources
    type: primary
  - from: sources
    to: volunteers
    type: primary
  - from: volunteers
    to: text_filter
    type: primary
  - from: text_filter
    to: wrong_filter
    type: primary
  - from: wrong_filter
    to: curated
    type: primary
  - from: curated
    to: bilingual
    type: primary
  - from: bilingual
    to: split
    type: primary
  - from: split
    to: circular
    type: primary
  - from: circular
    to: heuristic
    type: primary
  - from: heuristic
    to: all_passes
    type: primary
  - from: heuristic
    to: gpt4
    type: data
  - from: gpt4
    to: all_passes
    type: primary
  - from: all_passes
    to: score
    type: primary
modules: []
