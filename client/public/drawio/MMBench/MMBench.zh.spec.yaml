meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench 构建与评测边界
  description: >-
    带版本边界的 MMBench 家族流程：把 arXiv v4/v5 所述 v1.1 构建过程，与早期论文的 2,974 题及 v1.0 实际发布的 2,948
    题分开；同时明确中英文对应、CircularEval、选项抽取、逻辑题计分、字段与可变发布资产。
  legend: 实线表示论文 v1.1 的构建与评测生命周期；虚线仅连接版本、字段、答案可见性或发布代码审计事实， 不会给主计分分母增加样本。
nodes:
  - id: taxonomy
    label: |-
      三级能力体系
      2 个 L1 / 6 个 L2
      20 个 L3 能力
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      作者冷启动样例
      每个 L3 能力
      10–20 道 MCQ
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      学生志愿者扩充
      超 80% 来自互联网
      约 20% 用公开验证集图像
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      图像多选题
      问题 + 可选提示
      2–4 个选项 + 答案
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      纯文本可答过滤
      正文：LLM 多数通过
      附录 B：3/3 + 人工
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      错题过滤
      5 个 VLM 均未答对
      CircularEval + 人工
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: curated
    label: |-
      MMBench v1.1
      3,217 道逻辑题
      每个 L3 至少 125 题
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: english
    label: |-
      英文原版
      问题逐项对齐
      选项顺序一致
    type: document
    size: xl
    position:
      x: 1720
      'y': 80
  - id: translate
    label: |-
      GPT-4 翻译
      保留专名、符号
      与代码不变
    type: process
    size: xl
    position:
      x: 1720
      'y': 480
  - id: chinese
    label: |-
      中文对应版
      经人工核验
      题目与答案一致
    type: user
    size: xl
    position:
      x: 2000
      'y': 480
  - id: release
    label: |-
      v1.1 划分
      DEV 1,292 / TEST 1,925
      名义比例 4:6
    type: database
    size: xl
    position:
      x: 2280
      'y': 280
  - id: prompt
    label: |-
      零样本开放式生成
      图像 + 可选提示
      问题 + 选项
    type: process
    size: xl
    position:
      x: 2560
      'y': 280
  - id: heuristic
    label: |-
      启发式方法
      抽出选项了吗
    type: decision
    size: xl
    position:
      x: 2840
      'y': 120
  - id: gpt
    label: |-
      论文回退
      gpt-4-0125
      匹配选项或 Z
    type: process
    size: xl
    position:
      x: 2840
      'y': 480
  - id: circular
    label: |-
      CircularEval
      循环轮换 N 个选项
      各轮全对才算正确
    type: process
    size: xl
    position:
      x: 3120
      'y': 280
  - id: score
    label: |-
      逻辑题准确率
      总体微平均 + L2/L3
      每道原题计一个 hit
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 280
  - id: paper_lineage
    label: |-
      版本边界
      v1–v3 正文：2,974
      v1.0 文件：2,948
    type: document
    size: xl
    position:
      x: 1440
      'y': 760
  - id: schema_audit
    label: |-
      发布审计
      v1.0 与 v1.1 的字段
      和答案可见性不同
    type: document
    size: xl
    position:
      x: 2280
      'y': 760
  - id: code_audit
    label: |-
      发布代码注意项
      判题重试 3 次均失败
      随机有效选项或 Z
    type: document
    size: xl
    position:
      x: 3400
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: curated
    type: primary
  - from: wrong_qc
    to: curated
    type: primary
  - from: curated
    to: english
    type: primary
  - from: curated
    to: translate
    type: primary
  - from: translate
    to: chinese
    type: primary
  - from: english
    to: release
    type: primary
  - from: chinese
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 是
  - from: heuristic
    to: gpt
    type: primary
    label: 否
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: curated
    to: paper_lineage
    type: secondary
    style:
      dashed: true
  - from: release
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
