meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench Build and Evaluation Boundary
  description: >-
    Version-aware MMBench family workflow: the v1.1 construction described by arXiv v4/v5 is separated from the earlier
    2,974-question paper and the 2,948-question v1.0 release, while English/Chinese alignment, CircularEval, choice
    extraction, logical-item scoring, schemas, and mutable release artifacts remain explicit.
  legend: >-
    Solid arrows show the paper-v1.1 construction and evaluation lifecycle. Dashed arrows attach version, schema,
    label-visibility, or released-code audit facts; they do not add samples to the main denominator.
nodes:
  - id: taxonomy
    label: |-
      Three-level taxonomy
      2 L1 / 6 L2
      20 L3 abilities
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      Author seed set
      10–20 MCQs
      per L3 ability
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      Student volunteers
      >80% Internet
      ~20% public validation images
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      Image MCQs
      question + optional hint
      2–4 choices + answer
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      Text-only filter
      main: LLM majority
      Appendix B: 3 of 3 + human
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      Wrong-item filter
      none of 5 VLMs correct
      CircularEval + human
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: curated
    label: |-
      MMBench v1.1
      3,217 logical items
      at least 125 per L3
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: english
    label: |-
      English original
      aligned questions
      and option order
    type: document
    size: xl
    position:
      x: 1720
      'y': 80
  - id: translate
    label: |-
      GPT-4 translation
      keep names, symbols,
      and code unchanged
    type: process
    size: xl
    position:
      x: 1720
      'y': 480
  - id: chinese
    label: |-
      Chinese counterpart
      human verified
      same items and answers
    type: user
    size: xl
    position:
      x: 2000
      'y': 480
  - id: release
    label: |-
      v1.1 split
      DEV 1,292 / TEST 1,925
      nominal ratio 4:6
    type: database
    size: xl
    position:
      x: 2280
      'y': 280
  - id: prompt
    label: |-
      Zero-shot open generation
      image + optional hint
      question + choices
    type: process
    size: xl
    position:
      x: 2560
      'y': 280
  - id: heuristic
    label: |-
      Choice parsed
      by heuristic?
    type: decision
    size: xl
    position:
      x: 2840
      'y': 120
  - id: gpt
    label: |-
      Paper fallback
      gpt-4-0125
      match option or Z
    type: process
    size: xl
    position:
      x: 2840
      'y': 480
  - id: circular
    label: |-
      CircularEval
      rotate N choices
      all passes must be correct
    type: process
    size: xl
    position:
      x: 3120
      'y': 280
  - id: score
    label: |-
      Logical-item accuracy
      micro overall + L2/L3
      one hit per base question
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 280
  - id: paper_lineage
    label: |-
      Version boundary
      v1–v3: 2,974 prose
      v1.0 files: 2,948
    type: document
    size: xl
    position:
      x: 1440
      'y': 760
  - id: schema_audit
    label: |-
      Release audit
      v1.0 and v1.1 differ
      schema and label visibility
    type: document
    size: xl
    position:
      x: 2280
      'y': 760
  - id: code_audit
    label: |-
      Released-code caveat
      3 failed judge retries
      random valid choice or Z
    type: document
    size: xl
    position:
      x: 3400
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: curated
    type: primary
  - from: wrong_qc
    to: curated
    type: primary
  - from: curated
    to: english
    type: primary
  - from: curated
    to: translate
    type: primary
  - from: translate
    to: chinese
    type: primary
  - from: english
    to: release
    type: primary
  - from: chinese
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 'Yes'
  - from: heuristic
    to: gpt
    type: primary
    label: 'No'
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: curated
    to: paper_lineage
    type: secondary
    style:
      dashed: true
  - from: release
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
