meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench Build Process
  description: >-
    Paper-aligned MMBench workflow: a three-level perception/reasoning taxonomy guides volunteer collection from the
    Internet and public validation images, two human-backed filters remove text-only and wrong items, 3,217 questions
    receive verified Chinese versions and a 4:6 split, then CircularEval and robust choice extraction yield accuracy.
  legend: Solid arrows show construction and evaluation; the lower answer path is the GPT-4 fallback after heuristic matching.
