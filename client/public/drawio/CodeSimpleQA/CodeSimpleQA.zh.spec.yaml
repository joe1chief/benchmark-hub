meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CodeSimpleQA 构建流程
  description: 对齐论文且显式处理文本不一致的双语代码事实问答评测集构建；与 66.9M 训练语料严格分离， 并通过事实性答案等级评分。
  legend: 先从左到右阅读基准整理行，再从右到左阅读纯评测行；橙色表示论文文本校准。
nodes:
  - id: families
    label: |-
      论文报告的三类来源
      Code WebQA + 自构造问题
      人工编写的文档问答
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: documents
    label: |-
      人工编写的双语文档分支
      Stack Overflow / GitHub / 官方文档
      Python.org / MDN / CSDN / SegmentFault
    type: document
    size: xl
    position:
      x: 320
      'y': 100
  - id: annotate
    label: |-
      人工改写问答
      8名受训多语言标注员
      1,500个候选 -> 680组规范问答
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: review
    label: |-
      工程师独立复核
      事实性 / 清晰度 / 来源一致性
      至少3名复核者共识后保留312组
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: reconcile
    label: |-
      合并来源并校准计数
      Code WebQA + 自构造 + 312组人工问答
      一致报告1,498/英文782；一段写1,478/762
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: dataset
    label: |-
      CodeSimpleQA 评测集
      采用一致报告：1,498 = 英文782 + 中文716
      15+编程语言 / 21个计算机领域
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: boundary
    label: |-
      评测 / 训练边界
      不与 CodeSimpleQA-Instruct 混合
      后者是独立的66.9M条训练语料
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: answer
    label: |-
      模型回答代码事实问题
      英文与中文提示
      简洁、以文档为依据的回复
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: judge
    label: |-
      事实性裁判
      问题 + 预测 + 参考答案 / 来源
      检查完整包含与矛盾
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: grades
    label: |-
      三类答案等级
      正确（CO）/ 未尝试（NA）
      错误（IN）
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: report
    label: |-
      代码事实问答指标
      正确率 + 尝试中正确率
      F-Score与语言 / 领域分项
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
edges:
  - from: families
    to: documents
    type: primary
  - from: documents
    to: annotate
    type: primary
  - from: annotate
    to: review
    type: primary
  - from: review
    to: reconcile
    type: primary
  - from: reconcile
    to: dataset
    type: primary
  - from: dataset
    to: boundary
    type: primary
  - from: boundary
    to: answer
    type: primary
  - from: answer
    to: judge
    type: primary
  - from: judge
    to: grades
    type: primary
  - from: grades
    to: report
    type: primary
modules: []
