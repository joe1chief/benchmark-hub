meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Wiki Live Challenge 构建与双分支维基评测流程
  description: >-
    Wiki Live Challenge 将新建维基条目先经过人工专家完成的 Good Article 审核，以引用丰富度和结构深度排序 304 个候选，排除列表页后人工策划成覆盖 15 个领域的 100 篇条目。评测明确分为
    Wiki Writing 与 Wiki Fact：Gemini-2.5-Pro 按 39 条标准比较生成页和原页；Gemini-2.5-Flash 基于每条参考事实检索的 Top-10 陈述计算事实覆盖，另一条 Jina
    Reader 分支独立计算引用支持率。
  legend: >-
    来源：Wiki Live Challenge arXiv:2602.01590v2 (2026-02-03), Sections 3.1-3.2 and Figures 2-3; official repository
    https://github.com/WangShao2000/Wiki_Live_Challenge, release v1.0 snapshot 2025_Mar_Nov. The reproducible paper
    window is 2025-03-01 through 2025-12-01 and reference pages were frozen 2025-12-15; the README's generic six-month
    rolling-window language is a refresh-policy note, not this historical build window.。实线箭头表示论文或官方资料明确支持的主流程。
