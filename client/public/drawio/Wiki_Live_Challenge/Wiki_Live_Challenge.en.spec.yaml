meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Wiki Live Challenge Construction and Two-Branch Wiki Evaluation
  description: >-
    Wiki Live Challenge filters newly created Wikipedia pages through expert-reviewed Good Article status, ranks the
    resulting 304 candidates by citation richness and structural depth, rejects list pages, and curates 100 articles
    across 15 domains. Evaluation keeps Wiki Writing and Wiki Fact separate: Gemini-2.5-Pro compares generated and
    original articles on 39 criteria, while Gemini-2.5-Flash measures reference-fact coverage from top-10 statement
    retrieval and a separate Jina-backed branch measures citation support.
  legend: >-
    Source: Wiki Live Challenge arXiv:2602.01590v2 (2026-02-03), Sections 3.1-3.2 and Figures 2-3; official repository
    https://github.com/WangShao2000/Wiki_Live_Challenge, release v1.0 snapshot 2025_Mar_Nov. The reproducible paper
    window is 2025-03-01 through 2025-12-01 and reference pages were frozen 2025-12-15; the README's generic six-month
    rolling-window language is a refresh-policy note, not this historical build window.. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
