      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: human_set
    to: release
    type: secondary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: release
    to: eval_route
    type: primary
  - from: eval_route
    to: task_eval
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: eval_route
    to: general_eval
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: task_eval
