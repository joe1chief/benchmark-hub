meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GaokaoBench Build Process
  description: >-
    Paper-aligned GaokaoBench workflow: national exam PDFs from 2010-2022 are converted to JSON and LaTeX across nine
    subjects and 2,811 questions; objective and subjective paths use type-specific zero-shot prompts, regular matching,
    two-teacher scoring, or GPT-4-turbo judging before scoring-rate, 750-point, and agreement reporting.
  legend: Solid arrows separate objective automatic scoring from subjective human and LLM-as-judge evaluation.
