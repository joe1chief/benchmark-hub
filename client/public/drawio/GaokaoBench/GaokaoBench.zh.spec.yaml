meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GaokaoBench 构建流程
  description: >-
    按论文对齐的 GaokaoBench 流程：把 2010–2022 年全国高考试卷从 PDF 转成 JSON 与 LaTeX，形成九科 2,811 题； 客观题与主观题使用各自的零样本提示，分别经过规则匹配、双教师评分或
    GPT-4-turbo 裁判，再汇总得分率、750 分折算成绩和裁判一致性。
  legend: 实线区分客观题自动评分与主观题人工/LLM 裁判路径。
nodes:
  - id: exams
    label: |-
      2010–2022 年
      全国高考 PDF
    type: database
    size: large
    position:
      x: 40
      'y': 240
  - id: convert
    label: |-
      脚本 + 人工
      PDF 转 JSON
    type: process
    size: large
    position:
      x: 240
      'y': 240
  - id: latex
