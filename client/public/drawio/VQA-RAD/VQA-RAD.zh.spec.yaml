  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VQA-RAD 构建与评测流程
  description: >-
    VQA-RAD从开放的MedPix教学档案中均衡采样315张头部、胸部和腹部放射影像。临床医生编写自己会向同事询问的自然无引导问题并提供答案，再以自由形式和模板形式改写问题。所有图像-问题-答案对均经人工验证，并按图像、问题与答案类型分类。最终包含3515题：1515道自由题、733道改写题和1267道模板题。7对标注员评估75%的自由题与改写题，平均一致性F1为0.85。模型依据单张图像回答开放题与封闭题，分别及总体报告准确率。
  legend: 来源：VQA-RAD Scientific Data paper, Methods and Technical Validation; official released dataset。实线箭头表示论文或官方资料明确支持的主流程。
