meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VQA-RAD Build and Evaluation Process
  description: >-
    VQA-RAD samples 315 head, chest, and abdominal radiology images from the open MedPix teaching archive. Clinicians
    write natural unguided questions they would ask a colleague and provide answers, then paraphrase questions in
    free-form and template forms. All image-question-answer pairs are manually validated and categorized by image,
    question, and answer type. The final set has 3,515 questions: 1,515 free-form, 733 rephrased, and 1,267 framed.
    Seven annotator pairs evaluate 75 percent of free-form and rephrased questions, producing mean agreement F1 of 0.85.
    Models answer open- and closed-ended questions from a single image, with accuracy reported separately and overall.
  legend: >-
    Source: VQA-RAD Scientific Data paper, Methods and Technical Validation; official released dataset. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
