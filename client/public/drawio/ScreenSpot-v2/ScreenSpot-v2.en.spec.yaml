meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScreenSpot-v2 Build and Evaluation Process
  description: >-
    ScreenSpot-v2 is the quality-controlled revision introduced with OS-ATLAS. The authors audit all 1,272 original
    ScreenSpot samples and identify 144 erroneous cases, or 11.32 percent: 63 of 436 web, 28 of 334 desktop, and 53 of
    502 mobile samples. Problems include spelling or missing elements, ambiguous instructions with multiple valid
    targets, near-duplicate elements, and incorrect ground-truth boxes. Problematic questions are removed and replaced,
    referring-expression-style commands are rewritten as natural instructions, and mislabeled boxes are corrected while
    the total size remains 1,272. Evaluation can use the original instruction directly or a planner such as GPT-4o to
    elaborate it. A predicted point is correct when it falls inside the target box; box predictions can additionally be
    measured by IoU. Results are sliced by mobile, desktop, and web and by text versus icon/widget, then averaged.
  legend: >-
    Source: OS-ATLAS arXiv:2410.23218 Section 4.1 and Appendix C; official OS-Copilot/OS-Atlas repository. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
