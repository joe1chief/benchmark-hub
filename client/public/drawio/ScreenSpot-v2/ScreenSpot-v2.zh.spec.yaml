meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScreenSpot-v2 构建与评测流程
  description: >-
    ScreenSpot-v2是OS-ATLAS提出的质量修订版。作者审计原ScreenSpot全部1272条样本，发现144条错误，占11.32%，其中网页63/436、桌面28/334、移动端53/502。问题包括拼写或元素缺失、存在多个有效目标的歧义指令、高相似重复元素以及错误真值框。团队删除并替换问题样本，把指代表达式形式的命令改写为自然指令，纠正误标边界框，同时保持总规模1272不变。评测既可直接使用原始指令，也可由GPT-4o等规划器扩写；预测点落入目标框即为正确，框预测还可计算IoU。结果按移动端、桌面端、网页端及文本与图标控件切片并取平均。
  legend: >-
    来源：OS-ATLAS arXiv:2410.23218 Section 4.1 and Appendix C; official OS-Copilot/OS-Atlas
    repository。实线箭头表示论文或官方资料明确支持的主流程。
