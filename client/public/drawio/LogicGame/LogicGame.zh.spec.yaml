meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: LogicGame 构建与评测流程
  description: 基于 arXiv:2408.15778v4 与官方数据提交 4884edb6de726fe35debb656215ef429cd7e2f4d 的证据边界复原， 区分论文中的构建方法、当前双语发布合同，以及只部分公开的自动评测流程。
  legend: >-
    实线表示构建、封装、推理与评分主流程；虚线表示未披露合同、版本漂移或错误路径。数量按 304 道底层题目计， 每道题分别有中英文版本；公开 whole 行含 qid、contexts、level 与
    category，不含参考答案或示例。
nodes:
  - id: c1
    label: |-
      C1 · 收集规则遵循场景
      广泛调研与众包
      将明确规则和决策游戏化
      原创设计网上不可检索的问题
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: c2
    label: |-
      C2 · 专家人工命题
      设计新颖的域外问题
      尽量减少自然语言推断
      仅凭题内规则即可作答
    type: user
    module: construction
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 9
  - id: d1
    label: 推理域？
    type: decision
    module: construction
    size: xl
    position:
      x: 600
      'y': 192
  - id: c3
    label: |-
      C3E · 执行域 · 180 题
      19 个具名子类别
      确定性单步推断
      每个中间步骤均可验证
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 64
    style:
      fontSize: 9
  - id: c4
    label: |-
      C3P · 规划域 · 124 题
      12 个具名子类别
      寻找任一有效多步路径
      适当加入检查点或状态变量
    type: process
    module: construction
    size: xl
    position:
      x: 880
      'y': 320
    style:
      fontSize: 9
  - id: c5
    label: |-
      C4 · 完成参考与质控
      正确最终答案
      逐步参考过程
      保留可定义的确定性状态
      聚焦新颖性并降低歧义
    type: process
    module: construction
    size: xl
    position:
      x: 1160
      'y': 192
    style:
      fontSize: 9
  - id: c6
    label: |-
      构建细节未披露
      标注者数量与招募方式
      泄漏检索与拒绝流程
      一致性或裁决协议
      参考答案检查器实现
    type: document
    module: construction
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 9
  - id: p1
    label: |-
      P1 · 应用逐题 JSON 合同
      answer 为字符串列表
      多步题：process 为步骤列表
      简单 0 级题可省略 process
    type: document
    module: packaging
    size: xl
    position:
      x: 1160
      'y': 688
    style:
      fontSize: 9
  - id: p2
    label: |-
      P2 · 划分 0–3 级难度
      逐级增加规则复杂度与步数
      每级 76 题
      执行 45 + 规划 31
    type: process
    module: packaging
    size: xl
    position:
      x: 880
      'y': 688
    style:
      fontSize: 9
  - id: p3
    label: |-
      P3 · 每题编写两个示例
      示例题目与正确答案
      逐步过程与详细解释
      支持 0 / 1 / 2-shot 实验
    type: document
    module: packaging
    size: xl
    position:
      x: 600
      'y': 688
    style:
      fontSize: 9
  - id: p4
    label: |-
      P4 · 构建双语版本
      问题最初以中文编写
      翻译题目与指令
      生成中文与英文版本
    type: process
    module: packaging
    size: xl
    position:
      x: 320
      'y': 688
    style:
      fontSize: 9
  - id: p5
    label: |-
      P5 · 论文 v4 题目总量
      304 道底层题目 × 2 种语言
      执行 180 · 规划 124
      31 个具名子类别 · 4 个难度级
    type: database
    module: packaging
    size: xl
    position:
      x: 40
      'y': 688
    style:
      fontSize: 9
  - id: p6
    label: |-
      P6 · 当前官方数据发布
      官方数据固定 · 4884edb6
      whole：每语 304 条 qid/contexts/level/category
      dev：每语 10 条，含参考与示例
      Apache-2.0 · 未发布评分器代码
    type: database
    module: packaging
    size: xl
    position:
      x: 40
      'y': 944
    style:
      fontSize: 8
  - id: p7
    label: |-
      发布漂移与缺失的关联合同
      2024：每语 dev 60 + test 244
      后改为每语 dev 10 + whole 304
      2025：修正一条英文与一条中文提示
      中英文间没有共享配对键
    type: document
    module: packaging
    size: xl
    position:
      x: 320
      'y': 944
    style:
      fontSize: 9
  - id: e1
    label: |-
      E1 · 载入一种语言的题目
      规则 + 问题 + JSON 约束
      whole 公开 qid + contexts
      另含 level + category · 不含参考
    type: database
    module: evaluation
    size: xl
    position:
      x: 40
      'y': 1280
    style:
      fontSize: 9
  - id: e2
    label: |-
      E2 · 选择样例设置
      使用 0 / 1 / 2 个示例
      插入规则与问题之间
      完整示例库未公开
    type: process
    module: evaluation
    size: xl
    position:
      x: 320
      'y': 1280
    style:
      fontSize: 9
  - id: e3
    label: |-
      E3 · 生成模型响应
      temperature = 0
      最多 2,048 tokens
      其他参数使用默认值
      未说明 system / chat 包装
    type: process
    module: evaluation
    size: xl
    position:
      x: 600
      'y': 1280
    style:
      fontSize: 9
  - id: e4
    label: |-
      E4 · 提取 JSON 片段
      提示要求先输出推理过程
      再输出代码围栏中的 JSON
      先从响应中定位 JSON 片段
    type: process
    module: evaluation
    size: xl
    position:
      x: 880
      'y': 1280
    style:
      fontSize: 9
  - id: d2
    label: 成功提取 JSON 片段？
    type: decision
    module: evaluation
    size: xl
    position:
      x: 1160
      'y': 1280
  - id: e5
    label: |-
      E5 · 解析已提取 JSON
      将已定位片段解析为正式 JSON
      读取 answer 与可选 process
    type: process
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1120
    style:
      fontSize: 9
  - id: x1
    label: |-
      IFError · 提取失败
      无法从响应中提取 JSON 片段
      提取器具体实现未公开
    type: document
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1440
    style:
      fontSize: 9
  - id: d3
    label: 成功解析为正式 JSON？
    type: decision
    module: evaluation
    size: xl
    position:
      x: 1720
      'y': 1120
  - id: e6
    label: |-
      E6 · 与隐藏参考比对
      A-Acc：答案二值匹配
      P-Acc：字符级相似度
      无过程的 0 级题：P-Acc = A-Acc
      仅 A = 1 且 P = 1 时 AP-Acc = 1
    type: process
    module: evaluation
    size: xl
    position:
      x: 2000
      'y': 1120
    style:
      fontSize: 9
  - id: x2
    label: |-
      JSError · 解析失败
      已提取 JSON 无法解析
      解析器具体实现未公开
    type: document
    module: evaluation
    size: xl
    position:
      x: 2000
      'y': 1440
    style:
      fontSize: 9
  - id: e7
    label: |-
      E7 · 按语言聚合分数
      对 304 题取均值
      报告推理域 × 难度级与总分
      NIJ = AP / (1 − IFError − JSError)
      未发布精确匹配归一化实现
    type: formula
    module: evaluation
    size: xl
    position:
      x: 2280
      'y': 1120
    style:
      fontSize: 9
  - id: e8
    label: |-
      E8 · 结果与提交入口漂移
      GitHub：中英文 14 模型表
      4140 原版 → 6934 LogicGame-v2
      v2 修复运行 bug · 2025-03-31
      参考数据与评分程序私有 · 部分公开
    type: terminal
    module: evaluation
    size: xl
    position:
      x: 2560
      'y': 1120
    style:
      fontSize: 9
