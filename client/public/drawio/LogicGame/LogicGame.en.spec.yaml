      IFError · Extraction Failure
      No JSON Context Can Be Extracted
      Extractor Implementation Not Released
    type: document
    module: evaluation
    size: xl
    position:
      x: 1440
      'y': 1440
    style:
      fontSize: 9
  - id: d3
    label: Formal JSON Parsed?
    type: decision
    module: evaluation
    size: xl
    position:
      x: 1720
      'y': 1120
  - id: e6
    label: |-
      E6 · Compare with Hidden Reference
      A-Acc: Binary Answer Match
      P-Acc: Character-level Similarity
      No-process Level 0: P-Acc = A-Acc
      AP-Acc = 1 Only if A = 1 and P = 1
    type: process
    module: evaluation
    size: xl
    position:
      x: 2000
      'y': 1120
    style:
      fontSize: 9
  - id: x2
    label: |-
      JSError · Parsing Failure
      Extracted JSON Cannot Be Parsed
      Parser Implementation Not Released
    type: document
    module: evaluation
    size: xl
    position:
      x: 2000
      'y': 1440
    style:
      fontSize: 9
  - id: e7
    label: |-
      E7 · Aggregate Scores per Language
      Mean over 304 Problems
      Report Domain × Level + Overall
      NIJ = AP / (1 − IFError − JSError)
      Exact Match Normalisation Not Released
    type: formula
    module: evaluation
    size: xl
    position:
      x: 2280
      'y': 1120
    style:
      fontSize: 9
  - id: e8
    label: |-
      E8 · Results + Submission Drift
      GitHub: 14-model EN / ZH Tables
      4140 Original → 6934 LogicGame-v2
      v2 Fixes Running Bugs · 2025-03-31
      Private Ref + Scorer · Partly Public
    type: terminal
    module: evaluation
    size: xl
    position:
      x: 2560
      'y': 1120
    style:
      fontSize: 9
