  title: LogicGame Build Process
  description: >-
    Paper-aligned construction of bilingual rule-reasoning games across deterministic execution and strategic planning,
    with JSON answer/process constraints, four difficulty levels, exemplars, and process-aware automatic scoring.
  legend: >-
    Counts and protocol follow arXiv:2408.15778v4: 304 problems, Execution and Planning domains, levels 0–3, and Answer,
    Process, and Answer-Process Accuracy plus JSON and instruction-following error analysis.
