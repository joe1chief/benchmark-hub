meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: LogicGame Build and Evaluation Process
  description: >-
    Evidence-bounded reconstruction of LogicGame from arXiv:2408.15778v4 and official data commit
    4884edb6de726fe35debb656215ef429cd7e2f4d, separating paper construction claims, the current bilingual release
    contract, and the partially disclosed automatic evaluation.
  legend: >-
    Solid arrows show construction, packaging, inference, and scoring flow. Dashed arrows mark missing contracts,
    release drift, or error paths. Counts refer to 304 underlying problems with separate Chinese and English versions.
    Public whole rows expose qid, contexts, level, and category, but not references or examples.
nodes:
  - id: c1
    label: |-
      C1 · Collect Rule-following Scenarios
      Extensive Research + Crowdsourcing
      Gamify Explicit Rules and Decisions
      Design Problems Unavailable Online
    type: database
    module: construction
    size: xl
    position:
      x: 40
      'y': 192
    style:
      fontSize: 9
  - id: c2
    label: |-
      C2 · Expert Human Authoring
      Define Novel Out-of-domain Problems
      Minimise Natural-language Inference
      Require Rules Alone to Be Sufficient
    type: user
    module: construction
    size: xl
    position:
      x: 320
      'y': 192
    style:
      fontSize: 9
