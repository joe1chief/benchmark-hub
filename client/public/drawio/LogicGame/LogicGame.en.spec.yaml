      Reference-checker Implementation
    type: document
    module: construction
    size: xl
    position:
      x: 1440
      'y': 192
    style:
      fontSize: 9
  - id: p1
    label: |-
      P1 · Apply Item-specific JSON Contract
      answer = List of Strings
      Multi-step: process = Step List
      Simple Level 0 May Omit Process
