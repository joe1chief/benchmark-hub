      Define the Two-domain Taxonomy
      Execution Applies Rules to Current State
      Planning Searches Future Action Sequences
      Cover String · Matrix · Path · Logic Games
    type: process
    size: xl
    position:
      x: 300
      'y': 260
  - id: execution
    label: |-
      Author Execution Problems
      Use Deterministic Single-step Inferences
