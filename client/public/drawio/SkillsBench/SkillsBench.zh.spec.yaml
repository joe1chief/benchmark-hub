meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SkillsBench 构建与评测流程
  description: >-
    最新版SkillsBench
    v1.1论文从142位贡献者的400份提交中构建覆盖8个专业领域的87项任务。每项任务包含人工撰写指令、固定Docker环境与数据、独立整理的可复用Skills、保密oracle解法以及确定性的pytest或检查器验证器。自动门禁检查结构，要求oracle
    100%通过，筛查指令来源，并拒绝任务专用路径、魔法数字、oracle命令或预期输出等Skill答案泄漏。维护者随后复核真实性、数据、oracle与Skill质量、反作弊稳健性及Skills是否产生可测信号，最终保留87项。对每个模型与harness配置，BenchFlow创建全新固定容器，以温度0对每题分别运行无Skills和专家Skills两种匹配条件，各选3次试验；自生成Skills只在部分配置中单独报告。确定性通过/失败奖励先在每题内平均，再对87题宏平均，并在18种模型-harness配置上报告通过率、绝对Skill增益和归一化增益。
  legend: >-
    来源：SkillsBench arXiv:2602.12670 Sections 3-4 and Appendices B, D, and N; official benchflow-ai/skillsbench v1.1
    repository。实线箭头表示论文或官方资料明确支持的主流程。
