meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SkillsBench Build and Evaluation Process
  description: >-
    The current SkillsBench v1.1 paper builds 87 tasks across eight professional domains from 400 submissions by 142
    contributors. Each task packages a human-authored instruction, pinned Docker environment and data, independently
    curated reusable Skills, a withheld oracle solution, and a deterministic pytest or checker verifier. Automated gates
    validate structure, require the oracle to pass 100 percent, screen instruction provenance, and reject
    Skill-to-solution leakage such as task-specific paths, magic numbers, oracle commands, or expected outputs.
    Maintainers then review realism, data, oracle and Skill quality, anti-cheating robustness, and whether Skills create
    measurable signal; 87 tasks survive. For each model-harness configuration, BenchFlow creates fresh pinned containers
    and runs matched no-Skills and curated-Skills conditions for three selected trials per task at temperature zero; a
    self-generated-Skills arm is reported separately for selected configurations. Deterministic pass/fail rewards are
    averaged within task and then macro-averaged across 87 tasks. The paper reports pass rate, absolute Skill lift, and
    normalized gain over 18 model-harness configurations.
  legend: >-
    Source: SkillsBench arXiv:2602.12670 Sections 3-4 and Appendices B, D, and N; official benchflow-ai/skillsbench v1.1
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
