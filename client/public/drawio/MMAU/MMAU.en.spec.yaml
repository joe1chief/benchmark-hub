meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMAU Build Process
  description: >-
    Paper-aligned seven-step curation of 10,000 expert-reviewed audio multiple-choice questions spanning speech, sound,
    and music, followed by accuracy evaluation.
  legend: The seven named paper stages run from Source Selection through MMAU Finalization.
nodes:
  - id: source
    label: |-
      Step 1 · Source Selection
      Gather 13 Audio Corpora
      Speech · Sound · Music
      Prefer Real over Synthetic Audio
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      Step 2 · Task Curation
      Begin with 90 Candidate Tasks
      Consult Domain Experts
      Retain 27 Real-world Tasks
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: audio
    label: |-
      Select Plausible Audio Clips
      Align Clips with Final Tasks
      Iterate with Authors
      Preserve Domain Relevance
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: annotate
    label: |-
      Step 3 · Expert Annotation
      Write Questions and Gold Answers
      Require Real-world Reasoning
      Require Domain Knowledge
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: filter
    label: |-
      Step 4 · Expert Filtering
      Use a Separate Expert Team
      Remove Ambiguous or Over-complex QA
      Remove Low-quality Audio
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: options
    label: |-
      Step 5 · Option Augmentation
      Use GPT-4 for Distractors
      Condition on Audio and Question
      Increase MCQ Difficulty
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: review
    label: |-
      Step 6 · Expert Review
      Tag Required Task and Skills
      Remove Misleading Options
      Recheck Correct Answers
    type: user
    size: xl
    position:
      x: 1420
      'y': 420
  - id: counts
    label: |-
      Resolve Annotation Pool
      Begin with 11,000 QA Pairs
      Filter 800 · Review out 200
      Retain 10,000 Questions
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: finalize
    label: |-
      Step 7 · MMAU Finalization
      Balance All 27 Task Types
      Cover Speech · Sound · Music
      Label Easy · Medium · Hard
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: split
    label: |-
      Create Evaluation Splits
      Test-mini · 1,000 Questions
      Main Test · 9,000 Questions
      Mirror Task Distribution
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: infer
    label: |-
      Evaluate Audio-language Models
      Supply Audio and MCQ Prompt
      Select One Answer Option
      Cover 27 Audio Skills
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      Report Accuracy
      Exact Multiple-choice Correctness
      Sound · Music · Speech Results
      Overall Test-mini and Test Average
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
