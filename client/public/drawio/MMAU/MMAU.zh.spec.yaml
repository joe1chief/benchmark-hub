meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMAU 构建流程
  description: 按论文七步流程策展并专家复核 10,000 道覆盖语音、声音和音乐的音频多选题，随后以准确率评测。
  legend: 论文命名的七个阶段从来源选择一直推进到 MMAU 最终定稿。
nodes:
  - id: source
    label: |-
      步骤一 · 来源选择
      汇集 13 个音频语料库
      语音 · 声音 · 音乐
      优先真实录音而非合成音频
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      步骤二 · 任务策展
      从 90 个候选任务开始
      咨询领域专家
      保留 27 个真实任务
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: audio
    label: |-
      选择合适音频片段
      与最终任务对齐
      由作者多轮迭代
      保持领域相关性
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: annotate
    label: |-
      步骤三 · 专家标注
      编写问题与标准答案
      要求现实世界复杂推理
      要求领域知识
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: filter
    label: |-
      步骤四 · 专家过滤
      使用独立专家团队
      去除歧义或过度复杂问答
      去除低质量音频
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: options
    label: |-
      步骤五 · 选项增强
      用 GPT-4 生成干扰项
      基于音频和问题生成
      提升多选题难度
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: review
    label: |-
      步骤六 · 专家复核
      标记所需任务与技能
      去除误导性选项
      再次核对正确答案
    type: user
    size: xl
    position:
      x: 1420
      'y': 420
  - id: counts
    label: |-
      处理标注候选池
      初始 11,000 个问答对
      过滤 800 · 复核移除 200
      最终保留 10,000 题
    type: process
    size: xl
    position:
      x: 1140
      'y': 420
  - id: finalize
    label: |-
      步骤七 · MMAU 定稿
      平衡全部 27 类任务
      覆盖语音 · 声音 · 音乐
      标注简单 · 中等 · 困难
    type: database
    size: xl
    position:
      x: 860
      'y': 420
  - id: split
    label: |-
      创建评测拆分
      小测试集 · 1,000 题
      主测试集 · 9,000 题
      保持任务分布一致
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: infer
    label: |-
      评测音频语言模型
      提供音频与多选题提示
      选择一个答案选项
      覆盖 27 项音频技能
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: score
    label: |-
      报告准确率
      多选答案精确判定
      声音 · 音乐 · 语音分项
      小测试集与主测试集均值
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: tasks
    type: primary
  - from: tasks
    to: audio
    type: primary
  - from: audio
    to: annotate
    type: primary
  - from: annotate
    to: filter
    type: primary
  - from: filter
    to: options
    type: primary
  - from: options
    to: review
    type: primary
  - from: review
    to: counts
    type: primary
  - from: counts
    to: finalize
    type: primary
  - from: finalize
    to: split
    type: primary
  - from: split
    to: infer
    type: primary
  - from: infer
    to: score
    type: primary
modules: []
