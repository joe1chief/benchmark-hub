      未知 / 缺失 id 被跳过
      id 匹配时 · 空 / 缺预测记错
      仅以提交重叠项为分母 · 不强制 9,000 题
      重复 id 重复计数 · 零重叠报错
    type: document
    size: xl
    position:
      x: 616
      'y': 1168
  - id: legacy_scorer
