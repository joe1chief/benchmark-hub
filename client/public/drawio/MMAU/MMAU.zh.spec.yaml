meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMAU 证据对齐构建与评测流程
  description: 重建论文 v1 的七步策展流程、固定公开发布边界与论文规定的五次选项顺序多数票评测；虚线证据卡保留 后续项目页、数据发布和可执行评分器的漂移，不将其混入论文合同。
  legend: 实线箭头表示论文支持的构建与评测主流程；虚线数据箭头连接来源计数、已披露质控、公开发布事实、 版本冲突和可执行评分器注意事项。
