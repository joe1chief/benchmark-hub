meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XLRS-Bench 多产品标注与评测流程
  description: >-
    XLRS-Bench汇合6个遥感来源的1400张超高分辨率图像，经多轮人工交叉核验后形成三类产品：13个任务的纯人工VQA、2个任务的人工定位，以及GPT-4o辅助并由人工结合VQA证据精修的描述。6名双语专家翻译并交叉核对长文本。评测分别使用VQA准确率/OLUC集合精确匹配、定位Acc@IoU
    0.5/0.7，以及描述BLEU/METEOR/ROUGE-L。流程图必须披露摘要总数45942与Table 5逐行求和45838的冲突。
  legend: >-
    来源：XLRS-Bench arXiv:2503.23771v1, Figures 3-4, Sections 3.1-3.3 and 4.1-4.2, Tables 2-4, and Appendix A.4 Table 5;
    project https://xlrs-bench.github.io/home_page.html, repository https://github.com/AI9Stars/XLRS-Bench, and release
    collection https://huggingface.co/collections/initiacms/xlrs-bench. Version pin: full-paper 1,400-image bilingual
    benchmark, not the earlier VQA-only lite release or website scale_en=10,784. Required conflict: repeated headline
    total is 45,942, while literal Appendix Table 5 rows sum to 45,838.。实线箭头表示论文或官方资料明确支持的主流程。
