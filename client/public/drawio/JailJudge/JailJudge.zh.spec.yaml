meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JailJudge 构建流程
  description: >-
    对齐论文的 JailJudge 构建流程：多类有害提示与目标回答先形成候选配对，再分别进入人工标注的 JAILJUDGETEST 分支和 GPT-4 MultiAgent 训练真值分支，随后以 LoRA 微调 JAILJUDGE
    Guard 并评测裁判质量。
  legend: 实线表示构建与评测主流程；虚线表示证据输入或发布边界说明。BPA 不确定性超参数与 Guard 二元判定阈值分别标注，不能混用。
nodes:
  - id: evidence
    label: |-
      主要证据与固定版本
      arXiv:2410.12855v2
      官方 Git 8743c13
      数据集 HF edcd9ae
      Guard HF cf624b8
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: prompts
    label: |-
      六类有害提示来源
      原始 · 合成原始 · 合成对抗
      多语言 · 真实世界 · 欺骗性
      细化为 14 个 MLCommons 危害类别
    type: database
    size: xl
    position:
      x: 300
      'y': 40
  - id: responses
    label: |-
      收集多样目标回答
      闭源与开源大模型家族
      系统级与模型级防御
      随机分配提示；同时覆盖安全与不安全输出
    type: cloud
    size: xl
    position:
      x: 580
      'y': 40
  - id: pool
    label: |-
      形成候选提示-回答对
      覆盖度 · 多样性 · 平衡性
      先分叉测试与训练路径
      尚不是最终 35K+ 训练集
    type: database
    size: xl
    position:
      x: 860
      'y': 40
  - id: test_split
    label: |-
      选择留出的 JAILJUDGETEST 配对
      ID：4,500 条非多语言测试切分
      OOD：6,300 条 · 10 种语言
      OOD 样本全部不进训练集
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: annotation
    label: |-
      构建人工二元金标准
      按九项 MLCommons 政策培训
      人工标签与 GPT-4 交叉检查
      重标分歧项并执行多数投票
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: testsets
    label: |-
      发布人工标注测试集
      ID 4,500 · OOD 6,300
      金标准：越狱 True / False
    type: database
    size: xl
    position:
      x: 1700
      'y': 40
  - id: judging
    label: |-
      GPT-4 MultiAgent 初判
      3 个 Judging Agent
      各输出理由与 1–10 分
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: bpa
    label: |-
      不确定性感知证据聚合
      每个分数转 BPA；α = 0.1 表示不确定性
      Dempster 规则合并三个 BPA
      还原聚合分数与最接近理由
      α 不是二元越狱阈值
    type: process
    size: xl
    position:
      x: 1420
      'y': 380
  - id: voting
    label: |-
      3 个 Voting Agent
      审查聚合分数与理由
      接受 / 拒绝并解释
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: inference
    label: |-
      1 个 Inference Agent
      读取聚合初判与全部投票
      最终判断 · 理由 · 解释
      最终越狱分数 1–10
    type: process
    size: xl
    position:
      x: 1980
      'y': 380
  - id: train
    label: |-
      构建 JAILJUDGETRAIN 真值
      35K+ 条指令微调数据
      输入：提示 + 回答
      输出：推理解释 + 1–10 分
    type: document
    size: xl
    position:
      x: 2260
      'y': 380
  - id: guard
    label: |-
      LoRA 监督微调
      Llama-2-7B 基座
      输入：用户提示 + 模型回答
      输出：解释 + 1–10 分
      二元判定阈值：score > 2
    type: process
    size: xl
    position:
      x: 2540
      'y': 380
  - id: evaluate
    label: |-
      评测越狱裁判
      JAILJUDGE ID / OOD
      JBB Behaviors / WILDTEST
      MultiAgent · Guard · 基线
    type: process
    size: xl
    position:
      x: 2820
      'y': 40
  - id: metrics
    label: |-
      汇报裁判质量
      准确率 · 精确率 · 召回率 · F1
      GPT-4 EQ 1–5 · 人工 H-score
      按场景与语言细分
    type: terminal
    size: xl
    position:
      x: 3100
      'y': 40
  - id: artifact_boundary
    label: |-
      部分公开资产边界
      Git 代码公开 · 数据集需门控
      HF 数据 edcd9ae · auto/custom
      Guard HF cf624b8 单独固定
      不能宣称整包无门槛公开
    type: document
    size: xl
    position:
      x: 3100
      'y': 380
edges:
  - from: evidence
    to: prompts
    type: data
  - from: prompts
    to: responses
    type: primary
  - from: responses
    to: pool
    type: primary
  - from: pool
    to: test_split
    type: primary
  - from: test_split
    to: annotation
    type: primary
  - from: annotation
    to: testsets
    type: primary
  - from: pool
    to: judging
    type: primary
  - from: judging
    to: bpa
    type: primary
  - from: bpa
    to: voting
    type: primary
  - from: voting
    to: inference
    type: primary
  - from: inference
    to: train
    type: primary
  - from: train
    to: guard
    type: primary
  - from: testsets
    to: evaluate
    type: primary
  - from: guard
    to: evaluate
    type: primary
  - from: evaluate
    to: metrics
    type: primary
  - from: metrics
    to: artifact_boundary
    type: data
modules: []
