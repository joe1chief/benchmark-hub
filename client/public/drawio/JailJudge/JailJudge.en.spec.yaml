meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JailJudge Build Process
  description: >-
    Paper-aligned JailJudge construction from six harmful-prompt sources and diverse model responses through separate
    human-labeled test and MultiAgent supervision branches, JAILJUDGE Guard tuning, and judge evaluation.
  legend: >-
    The prompt-response pool branches into human-annotated ID/OOD tests and MultiAgent-generated training ground truth;
    both branches meet only during judge evaluation.
nodes:
  - id: prompts
    label: |-
      Build Six Harmful-prompt Sources
      Vanilla · Synthetic Vanilla · Adversarial
      Multilingual · In-the-wild · Deceptive
      Refine into 14 Hazard Categories
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: responses
    label: |-
      Collect Diverse Target Responses
      Closed-source and Open-source LLMs
      System-level and Model-level Defenses
      Include Both Safe and Unsafe Outputs
    type: cloud
    size: xl
    position:
      x: 300
      'y': 40
  - id: pool
    label: |-
      Form Prompt-response Pair Pool
      Coverage · Diversity · Balance
      JAILJUDGETRAIN Source Pairs
      35K+ Instruction-tuning Items
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: annotation
    label: |-
      Human Test Annotation
      Train Annotators on MLCommons Policies
      Manual Label + GPT-4 Cross-comparison
      Re-label Mismatches and Majority Vote
    type: user
    size: xl
    position:
      x: 860
      'y': 40
  - id: testsets
    label: |-
      Release JAILJUDGETEST
      ID: 4.5K+ Broad-risk Pairs
      OOD: 6K+ Pairs in 10 Languages
      Binary Human Gold Labels
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: judging
    label: |-
      MultiAgent Judging Stage
      Multiple Judging Agents
      Reasoning Explanation + Score 1–10
      Convert Scores to Evidence Masses
    type: process
    size: xl
    position:
      x: 580
      'y': 380
  - id: voting
    label: |-
      Evidence Aggregation and Voting
      Combine Judges with Dempster's Rule
      Voting Agents Accept or Reject
      Preserve Reasons and Uncertainty
    type: process
    size: xl
    position:
      x: 860
      'y': 380
  - id: inference
    label: |-
      Inference Agent
      Consume Aggregated Judge Results
      Consume All Voting Results
      Produce Final Reason + 1–10 Score
    type: process
    size: xl
    position:
      x: 1140
      'y': 380
  - id: groundtruth
    label: |-
      Construct Explainable Ground Truth
      Fine-grained Score and Reasoning
      Threshold alpha Gives Binary Label
      Supervise JAILJUDGETRAIN
    type: document
    size: xl
    position:
      x: 1420
      'y': 380
  - id: guard
    label: |-
      Instruction-tune JAILJUDGE Guard
      Llama-2-7B Base Model
      Input: User Prompt + Target Response
      Output: Explanation + Score 1–10
    type: process
    size: xl
    position:
      x: 1700
      'y': 380
  - id: evaluate
    label: |-
