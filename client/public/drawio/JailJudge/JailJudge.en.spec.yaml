meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JailJudge Build Process
  description: >-
    Paper-aligned JailJudge construction from diverse harmful-prompt and response pairs through a separately
    human-annotated JAILJUDGETEST branch and a GPT-4 MultiAgent ground-truth branch, followed by LoRA tuning of
    JAILJUDGE Guard and judge evaluation.
  legend: >-
    Solid arrows show construction and evaluation. Dashed arrows mark evidence inputs or release-boundary notes. The BPA
    uncertainty hyperparameter is kept distinct from the Guard binary-decision threshold.
