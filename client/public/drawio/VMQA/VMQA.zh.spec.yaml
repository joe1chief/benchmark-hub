  layout: horizontal
  routing: orthogonal
  title: VMQA 构建与评测流程
  description: >-
    此处VMQA是SecureBio Virology Capabilities
    Test的早期单选版本。Gemini模型卡披露其为外部知识与推理选择题，用作生物风险的必要但不充分代理指标，但没有公开早期题集的构建过程、准确规模或切分。模型接收每个SecureBio题目及其可能包含的视觉上下文，选择一个答案，并按严格单选准确率评分，再比较不同模型代际。后续322题VCT论文记录了相关的专家多模态病毒学故障排除方法，但其多选数据集不能与该早期VMQA变体视为同一数据集。
  legend: >-
    来源：Gemini 2.5 Pro model card CBRN section; SecureBio VMQA model-report index; successor VCT arXiv:2504.16137 for
    provenance only。实线箭头表示论文或官方资料明确支持的主流程。
