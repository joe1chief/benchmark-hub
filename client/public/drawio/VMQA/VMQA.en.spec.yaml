meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VMQA Build and Evaluation Process
  description: >-
    The cited VMQA is SecureBio's single-choice early version of the Virology Capabilities Test. The Gemini card
    discloses that it is an external knowledge-and-reasoning MCQ evaluation used as a necessary-but-not-sufficient proxy
    for biological risk, but does not publish the early question set's construction process, exact size, or split. The
    model receives each SecureBio item, including any supplied visual context, selects one answer, and is scored by
    exact single-choice accuracy. Results compare model generations. The later 322-question VCT paper documents related
    expert-authored multimodal virology troubleshooting methodology, but its multiple-response dataset must not be
    treated as identical to this early VMQA variant.
  legend: >-
    Source: Gemini 2.5 Pro model card CBRN section; SecureBio VMQA model-report index; successor VCT arXiv:2504.16137
    for provenance only. Solid arrows show the main flow explicitly supported by the paper or official documentation.
