meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuirBench 证据对齐的构建与评测流程
  description: >-
    依据 arXiv:2406.09411v2 及固定版本的官方代码和数据重建 MuirBench：按分类体系收集可答题， 创建语义差异最小且平衡配对的不可答题，执行元数据标注和两阶段质检，准确呈现发布字段、 VLMEvalKit
    风格提示词、官方解析器回退行为，以及论文与代码在候选顺序上的差异。
  legend: 实线箭头表示数据构建与已发布代码计分；带标签的分支保留来源和变换比例、淘汰路径、模型输入方式、 覆盖边界、解析结果与对错计分。虚线表示独立的人类评测协议。
