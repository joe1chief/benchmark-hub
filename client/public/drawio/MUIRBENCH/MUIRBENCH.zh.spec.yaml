meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuirBench 构建流程
  description: 与论文对齐地展示 MuirBench 多图理解数据构建与可答-不可答配对鲁棒评测流程。
  legend: 实线箭头依次表示三类可答数据来源、最小改动不可答配对、自动与专家质检以及确定性多项选择评测。
nodes:
  - id: taxonomy
    label: |-
      定义多图覆盖范围
      12 类理解任务
      10 类多图关系
      加入细粒度标签
    type: process
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      收集可回答数据
      现有数据占 40.8%
      派生数据占 21.7%
      新采集数据占 37.5%
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: harmonize
    label: |-
      统一为多图选择题
      复用现有问题
      生成或改写派生样本
      为不足任务人工出题
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: annotate
    label: |-
      标注数据属性
      任务与关系类别
      图像类型与输入位置
      每题包含 2 至 9 张图
    type: document
    size: xl
    position:
      x: 740
      'y': 40
  - id: pair
    label: |-
      创建不可回答配对
      替换或重排图像占 24.2%
      修改问题占 35.3%
      替换选项占 40.5%
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: automatic_qc
    label: |-
      执行自动质量检查
      验证格式与答案
      核验元数据和图像指代
      检查图像可访问性
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: expert_qc
    label: |-
      四名领域专家复核
      移除歧义问题
      移除不清晰图像
      质检后保留 86.3%
    type: user
    size: xl
    position:
      x: 1460
      'y': 40
  - id: release
    label: |-
      定稿配对基准
      2,600 题与 11,264 张图
      每题平均 4.3 张图
      可答与不可答成对
    type: database
    size: xl
    position:
      x: 1460
      'y': 420
  - id: setup
    label: |-
      配置模型评测
      遵循 VLMEvalKit
      温度 0 与重试 10 次
      单图模型先拼接多图
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: extract
    label: |-
      抽取预测选项
      使用预定义规则
      与标准选项比较
      保持确定性结果
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: accuracy
    label: |-
      计算准确率
      总体与分任务统计
      按关系类别拆分
      比较 20 个多模态 LLM
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: robustness
    label: |-
      分析配对鲁棒性
      可回答样本准确率
      不可回答样本准确率
      衡量两者性能差距
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: report
    label: |-
      报告 MuirBench 结果
      任务与关系及图像位置
      人类与模型对比
      拒答失败分析
    type: terminal
    size: xl
    position:
      x: 260
      'y': 420
edges:
  - from: taxonomy
    to: sources
    type: primary
  - from: sources
    to: harmonize
    type: primary
  - from: harmonize
    to: annotate
    type: primary
  - from: annotate
    to: pair
    type: primary
  - from: pair
    to: automatic_qc
    type: primary
  - from: automatic_qc
    to: expert_qc
    type: primary
  - from: expert_qc
    to: release
    type: primary
  - from: release
    to: setup
    type: primary
  - from: setup
    to: extract
    type: primary
  - from: extract
    to: accuracy
    type: primary
  - from: accuracy
    to: robustness
    type: primary
  - from: robustness
    to: report
    type: primary
modules: []
