meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MuirBench Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs MuirBench from arXiv:2406.09411v2 and pinned official code/data: taxonomy-driven answerable collection,
    balanced minimal-change unanswerable counterparts, metadata and two-stage quality control, exact release schema,
    VLMEvalKit-style prompting, the released parser's fallback behavior, and the paper-versus-code candidate-order
    drift.
  legend: >-
    Solid arrows trace dataset construction and released-code scoring. Labeled branches preserve source and transform
    proportions, rejection paths, model-input handling, coverage limits, parser outcomes, and correct/incorrect scores.
    The dashed path is the separate human evaluation protocol.
