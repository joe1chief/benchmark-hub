meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: vertical
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MLVU 构建、发布、推理与评分流程
  description: 依据 arXiv:2406.04264v3、论文同期仓库数据和当前官方发布做有证据边界的重建；将论文九任务、3,102 题口径与后来十一任务测试集扩展分开，并区分公开字段与未披露的构建元数据。
  legend: >-
    实线表示论文 v3
    生命周期，包括并行的任务构建以及相互独立的选择题/生成题评分分支。虚线仅连接发布或评测器审计背景，不表示下游处理；后续官方测试集漂移不计入论文九任务总量。图中分别标明论文事实、发布代码事实、可复算推断和未披露细节。
