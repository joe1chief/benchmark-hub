    label: |-
      R1 · 任务级质量控制
      VS：纯视觉/按时序/无角色名
      NQA/AO/AC：背景中无目标内容
      PQA/SSC：唯一线索/无直接提示
      SSC：非重复评分点
    type: process
    module: release
    size: xl
    position:
      x: 760
      'y': 440
    style:
      fontSize: 10
  - id: r2
    label: |-
