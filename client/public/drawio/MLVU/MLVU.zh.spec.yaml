      HF 视频/测试需通过门控
      CC BY-NC-SA 4.0 · 视频可变
    type: document
    module: release
    size: xl
    position:
      x: 320
      'y': 760
    style:
      fontSize: 10
  - id: r5
    label: |-
      R5 · 可复现版本锁定
      论文数据提交 4bcc3c0…
      开发 4a16523… · 评测 10b31fa…
      HEAD bc1a68d… · 无 Release
      HF 开发 06ddc388… · 测试 dc6616b2…
    type: database
    module: release
    size: xl
    position:
      x: 1040
      'y': 560
    style:
      fontSize: 10
  - id: r6
    label: |-
      R6 · 论文未披露构建细节
      无 986→1,730 的逐项转换清单
      无划分方法/互斥性声明
      无标注一致性/拒绝率
      无去重或训练污染扫描
    type: document
    module: release
    size: xl
    position:
      x: 1320
      'y': 760
    style:
      fontSize: 10
  - id: d1
    label: |-
      D1 · 后续测试集漂移
      论文 v3：9 类任务 · 测试 509 题
      当前增加体育/教程问答
      11 类任务 · 测试 588 · 总计 3,181
      不计入论文口径
    type: document
    module: release
    size: xl
    position:
      x: 760
      'y': 800
    style:
      fontSize: 10
  - id: e1
    label: |-
      E1 · 零样本评测
      使用官方实现/API
      图像 MLLM：多图帧序列
      视频 MLLM：各自官方采样
      不在 MLVU 上微调
    type: process
    module: evaluate
    size: xl
    position:
      x: 1040
      'y': 960
    style:
      fontSize: 10
  - id: e2
    label: |-
      E2 · 按模型采样
      均匀 N 帧或固定 N fps
      VideoChat2 16 · LLaMA-VID 1 fps
      GPT-4o 0.5 fps · Claude/Qwen 16
      无统一帧数预算
    type: process
    module: evaluate
    size: xl
    position:
      x: 1040
      'y': 1120
    style:
      fontSize: 10
  - id: e3
    label: |-
      E3 · 选择题提示
      视频/图像模型系统提示
      问题 + 候选选项
      答案提示：
      “Only choose the best option.
      Best option: (”
    type: process
    module: evaluate
    size: xl
    position:
      x: 760
      'y': 1280
    style:
      fontSize: 10
  - id: e4
    label: |-
      E4 · 生成任务提示
      不加入选择题答案提示
      VS：固定摘要问题
      SSC：唯一 “Please describe…” 提示
      输出自由文本
    type: process
    module: evaluate
    size: xl
    position:
      x: 1320
      'y': 1280
    style:
      fontSize: 10
  - id: e5
    label: |-
      E5 · GPT-4 裁判
      论文未说明版本/解码参数
      代码：gpt-4-turbo · temperature 0
      SSC：准确性 + 相关性
      VS：完整性 + 可靠性
    type: process
    module: evaluate
    size: xl
    position:
      x: 1320
      'y': 1440
    style:
      fontSize: 10
  - id: e6
    label: |-
      E6 · 任务级输出
      选择题：预测 + 正确选项
      SSC：准确性 + 相关性
      VS：完整性 + 可靠性
      开发/测试结果分开报告
    type: document
    module: evaluate
    size: xl
    position:
      x: 1040
      'y': 1600
    style:
      fontSize: 10
  - id: s1
    label: |-
      S1 · 选择题准确率
      预测与正确选项精确匹配
      Accuracy_t = Correct_t / Items_t
      TR · AR · NQA · ER · PQA · AO · AC
      不给部分分
    type: formula
    module: score
    size: xl
    position:
      x: 480
      'y': 1760
    style:
      fontSize: 10
  - id: s2
    label: |-
      S2 · M-Avg
      七类任务准确率的平均值
      不按题量加权的宏平均
      由论文表格复算和代码支持
      论文未直接打印此公式
    type: formula
    module: score
    size: xl
    position:
      x: 480
      'y': 1920
    style:
      fontSize: 10
  - id: s3
    label: |-
      S3 · SSC 分数
      准确性：按评分点给 1–5 分
      相关性：1–5 分
      SSC = 平均准确性 + 平均相关性
      有效范围：2–10
    type: formula
    module: score
    size: xl
    position:
      x: 1040
      'y': 1760
    style:
      fontSize: 10
  - id: s4
    label: |-
      S4 · VS 分数
      完整性 1–5 · 可靠性 1–5
      VS = 平均完整性 + 平均可靠性
      有效范围：2–10
      Figure 8 写 “Correctness”；代码用可靠性
    type: formula
    module: score
    size: xl
    position:
      x: 1600
      'y': 1760
    style:
      fontSize: 10
  - id: s5
    label: |-
      S5 · G-Avg
      (SSC 任务分 + VS 任务分) / 2
      两类任务不加权宏平均
      可由论文表格复算
      论文未直接打印此公式
    type: terminal
    module: score
    size: xl
    position:
      x: 1320
      'y': 1920
    style:
      fontSize: 10
  - id: s6
    label: |-
      S6 · 评测器缺口
      无种子/解码参数/重复次数/方差
      choice_bench.py 的 pred 未定义
      裁判脚本依赖脆弱文本查找
      无合并 G-Avg 的脚本
    type: document
    module: score
    size: xl
    position:
      x: 1600
      'y': 1560
    style:
      fontSize: 10
