      Human Questions · Summaries · Captions
      Reformat UCF-Crime and Ego4D
      GPT-4-assisted Needle QA · Synthetic Actions
    type: user
    size: xl
    position:
      x: 1420
      'y': 420
  - id: quality
    label: |-
      Apply Task-specific Quality Gates
      Avoid Answer Leakage and Audio Dependence
      Ensure Needle/Action Absent in Background
      Use Unique Clues and Scoring Points
