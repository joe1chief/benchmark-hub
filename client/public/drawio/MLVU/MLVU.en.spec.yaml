meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: vertical
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MLVU Construction, Release, Inference, and Scoring
  description: >-
    Evidence-bounded reconstruction from arXiv:2406.04264v3, its 2024 paper-era repository data, and the current
    official release. It keeps the paper's nine-task, 3,102-question benchmark separate from the later eleven-task test
    expansion and distinguishes released fields from undisclosed construction metadata.
  legend: >-
    Solid arrows show the paper-v3 lifecycle, including parallel task construction and separate MCQ/generation scoring
    branches. Dashed arrows attach release or evaluator audit context rather than downstream processing; later
    official-test drift is not part of the paper's nine-task totals. Paper facts, released-code facts, reproducible
    inferences, and unreported details are labelled separately.
