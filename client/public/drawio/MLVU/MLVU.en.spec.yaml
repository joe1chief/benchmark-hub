meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLVU Build Process
  description: >-
    Reconstructs the Universal Long Video Collection, nine-task manual/dataset-derived/synthetic annotation pipeline,
    exact dev/test release, and separate multiple-choice and generation evaluations.
  legend: >-
    MLVU contains 1,730 videos and 3,102 questions: 2,593 dev and 509 test. Dev multiple choice has four options; test
    has six. Generation scoring uses GPT-4 on two criteria per task.
nodes:
  - id: ulvc
    label: |-
      Build the Universal Long Video Collection
      Movies · TV · Documentaries
      Surveillance · Egocentric · Cartoons
      Games and Other Long-form Sources
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: prepare
    label: |-
      Select · Edit · Synthesize Videos
      Use Entire Videos or Long Segments
      Reduce Resolution or Clip as Needed
      Produce 1,730 Benchmark Videos
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: framework
    label: |-
      Define Three LVU Levels
      Holistic · Global Information
      Single Detail · One Critical Plot
      Multiple Details · Joint Evidence
    type: document
    size: xl
    position:
      x: 580
      'y': 40
  - id: holistic
    label: |-
      Create Holistic Tasks
      Topic Reasoning · 355
      Anomaly Recognition · 239
      Video Summarization · 257
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: single
    label: |-
      Create Single-detail Tasks
      Needle QA · 415 · Ego Reasoning · 405
      Plot QA · 589
      Sub-scene Captioning · 247
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: multi
