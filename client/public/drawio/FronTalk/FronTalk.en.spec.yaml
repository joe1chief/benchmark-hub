meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FronTalk Build Process
  description: >-
    Paper-aligned curation of multi-turn front-end dialogues with equivalent textual and visual feedback. Final-turn
    instruction following and first-time-user usability are primary evaluation branches; forgetting is supplementary,
    while simulator and evaluator human checks remain validation studies outside the scoring path.
  legend: >-
    Read construction left-to-right, then evaluation right-to-left. Side branches mark disclosure boundaries,
    supplementary analysis, or separate validation studies.
nodes:
  - id: c4
    label: |-
      Real-World Website Pool
      Sample 10,000 C4 Pages
      Exclude Low-Information
      Seeds Later
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: cluster
    label: |-
      Summarize + Cluster
      GPT-4o Content
      + Feature Summaries
      BERTopic Clusters
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sites
    label: |-
      Manual Site Selection
      One Informative Site
      per Prominent Cluster
      100 Diverse Seeds
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: intents
    label: |-
      Ten-Turn Intent + Tests
      GPT-4o Randomly Chooses
      Functional / Design
      Verifiable Tests per Intent
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: refine
    label: |-
      Manual Refinement
      All Tests Reviewed
      Remove 66 (1.7%)
      Edit 2,783 (73.4%)
      Sample 224: 90.1% -> 94.7%
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: curation_boundary
    label: |-
      Curation Boundary
      Initial Refiner Number
      + Qualifications
      Not Disclosed
    type: document
    size: xl
    position:
      x: 1160
      'y': 270
  - id: dataset
    label: |-
      FronTalk Release
      100 Dialogues / 1,000 Turns
      3,676 Refined Tests
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: simulator
    label: |-
      GPT-4o Simulators
      Text: Current Code
      + Original Intent
      Resolve Ambiguity / Redundancy
      Visual: Drawing Tools
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: sim_validation
    label: |-
      Simulator Validation
      114 Instructions
      411 Tests
      Text: 98% / 96%
      Visual: 76% / 97%
    type: user
    size: xl
    position:
      x: 1440
      'y': 760
  - id: generation
    label: |-
      Conversational Generation
      Current Instruction
      + Full History
      Update Front-End Code
      Every Turn
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: render
    label: |-
      Conversation Outputs
      Preserve Turn Websites
      Turn 10 Code
      = Final Website
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: instruction
    label: |-
      Final-Turn Scoring
      All Intents + Tests
      on Final Output
      Informed Web Agent
      + Image Tools
    type: process
    size: xl
    position:
      x: 600
      'y': 320
  - id: forgetting
    label: |-
      Forgetting Rate (Eq. 2)
      First T-1 Turns (t < T)
      FR = 1 - Σ(t<T) PC(o_T|i_t)
      / Σ(t<T) PC(o_t|i_t)
    type: process
    size: xl
    position:
      x: 880
      'y': 760
  - id: usability
    label: |-
      First-Time Usability
      Naive Agent Trajectory
      vs Curated Reference
      Pairwise UX Win Rate
    type: process
    size: xl
    position:
      x: 600
      'y': 560
  - id: report
    label: |-
      FronTalk Results
      Pass Rate + UX Win Rate
      Supplementary
      Forgetting Rate
    type: terminal
    size: xl
    position:
      x: 320
      'y': 440
  - id: eval_validation
    label: |-
      Human Validation
      218 Pass Cases
      82.0%; Kappa 62.7
      50 UX Pairs
      84.0%; Kappa 66.7
    type: user
    size: xl
    position:
      x: 40
      'y': 760
