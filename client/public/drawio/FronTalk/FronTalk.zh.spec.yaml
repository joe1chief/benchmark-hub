meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FronTalk 构建流程
  description: 依据论文呈现带等价文本与视觉反馈的多轮前端对话构建，以及通过网页智能体评估指令遵循、 遗忘和首次用户可用性的协议。
  legend: 上行从左到右阅读对话与测试构建，下行从右到左阅读对话式代码评测。
nodes:
  - id: c4
    label: |-
      真实世界网站池
      从 C4 抽样 10,000 个网页
      后续排除低信息种子页面
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: cluster
    label: |-
      网站摘要与聚类
      GPT-4o 生成内容和功能摘要
      BERTopic 识别主题簇
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: sites
    label: |-
      人工选择代表网站
      每个主要主题簇选一个有效网站
      得到 100 个多样化种子网站
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: intents
    label: |-
      十轮意图与测试生成
      GPT-4o 生成功能类或设计类意图
      每个意图配对可验证测试用例
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: refine
    label: |-
      人工精炼测试用例
      删除 66 个幻觉用例（1.7%）
      编辑 2,783 个（73.4%）；有效率 90.1% -> 94.7%
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: dataset
    label: |-
      FronTalk 发布集
      100 个对话 / 1,000 轮
      3,676 个经人工精炼的测试用例
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: simulator
    label: |-
      等价用户反馈
      文本模拟器依据历史消解意图
      视觉模拟器在当前截图上绘制标注
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: generation
    label: |-
      对话式代码生成
      依据当前指令与完整历史
      每轮生成更新后的前端代码
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: render
    label: |-
      渲染对话各轮输出
      保留每轮中间网站
      第 10 轮代码形成最终网站
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: instruction
    label: |-
      基于智能体的指令遵循评测
      网页智能体探索并执行测试用例
      图像工具支持视觉设计检查
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: forgetting
    label: |-
      多轮遗忘分析
      同时评估中间输出和最终输出
      检测此前通过但后来退化的功能
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: usability
    label: |-
      FronTalk 指标
      通过率与遗忘率
      首次用户轨迹成对比较得到可用性胜率
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: c4
    to: cluster
    type: primary
  - from: cluster
    to: sites
    type: primary
  - from: sites
    to: intents
    type: primary
  - from: intents
    to: refine
    type: primary
  - from: refine
    to: dataset
    type: primary
  - from: dataset
    to: simulator
    type: primary
  - from: simulator
    to: generation
    type: primary
  - from: generation
    to: render
    type: primary
  - from: render
    to: instruction
    type: primary
  - from: instruction
    to: forgetting
    type: primary
  - from: forgetting
    to: usability
    type: primary
modules: []
