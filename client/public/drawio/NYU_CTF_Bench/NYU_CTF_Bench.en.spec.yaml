meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NYU CTF Bench Build and Evaluation Process
  description: >-
    Paper-aligned validation of CSAW CTF challenges, source-separated server and file checks, reproducible packaging,
    source-separated loading, five complete independent solve runs, per-run exact hidden-flag checks, and any-of-five
    aggregation.
  legend: >-
    Construction runs left-to-right across the upper lane; evaluation returns right-to-left below. Server and file
    challenges follow alternative validation and loading routes. The archive spans 2011–2023, whereas Table 2 reports
    the retained 200 challenges from 2017–2023.
nodes:
  - id: source
    label: |-
      CSAW CTF Archive
      568 Challenges • 2011–2023
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: manual_gate
    label: |-
      Manual Solvability Gate
      Identify Maintenance-Related
      Missing Files Only
      Recheck Setup + Solvability
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: validation_route
    label: |-
      Validation Route
      Server or File Challenge?
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: server_gate
    label: |-
      Server Validation
      Start Container + Expose Port
      Test Internal and External
      Docker-Network Connectivity
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: file_gate
    label: |-
      File Validation
      Inspect Config + Source
      Check Required Information
      Is Present
    type: process
    size: xl
    position:
      x: 880
      'y': 200
  - id: standardize
    label: |-
      Standardize Challenge Package
      Docker Hub Images + Compose
      Source Assets + challenge.json
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Validated NYU CTF Bench
      200 Challenges • 2017–2023
      6 Categories
      crypto / forensics / pwn
      reverse / web / miscellaneous
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: contract
    label: |-
      challenge.json Contract
      Description • Listed Files
      Host + Port Visible
      Ground-Truth Flag Hidden
    type: document
    size: xl
    position:
      x: 1720
      'y': 100
  - id: load_route
    label: |-
      Loading Route
      Server or Local Files?
    type: decision
    size: xl
    position:
      x: 1720
      'y': 520
  - id: server_load
    label: |-
      Server-Challenge Load
      Pull Image with Compose
      Start Container
      Connect by Host + Port
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: file_load
    label: |-
      File-Challenge Load
      Copy to Temporary Folder
      Mount into Player Container
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
  - id: prompt
    label: |-
      Per-Run Prompt + Solve Loop
      Build Prompt from challenge.json
      Observe Tool Results until Stop
    type: document
    size: xl
    position:
      x: 880
      'y': 520
  - id: tools
    label: |-
      Per-Run Tool Interaction
      Up to 6 Category-Tailored Tools
      Command • Create / Inspect Files
      Disassemble • Decompile • Give Up
    type: process
    size: xl
    position:
      x: 600
      'y': 520
  - id: protocol
    label: |-
      Five-Run Evaluation Protocol
      5 Independent Runs per Challenge
      Each Executes Full Solve Loop
      48 h per LLM
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: exact_judge
    label: |-
      Per-Run Exact Flag Check
      check_flag Compares Equality
      Then Stop Containers + Clean Files
    type: process
    size: xl
    position:
      x: 320
      'y': 520
  - id: success
    label: |-
      Any-of-5 Aggregation
      Solved iff ≥1 Run Returns
      the Exact Hidden Flag
      Report Category + Failure Rates
    type: terminal
    size: xl
    position:
      x: 40
      'y': 520
edges:
  - from: source
    to: manual_gate
    type: primary
  - from: manual_gate
    to: validation_route
    type: primary
  - from: validation_route
    to: server_gate
    type: primary
    label: Server
  - from: validation_route
    to: file_gate
    type: primary
    label: Files
  - from: server_gate
    to: standardize
    type: primary
  - from: file_gate
    to: standardize
    type: primary
  - from: standardize
    to: release
    type: primary
  - from: release
    to: contract
    type: primary
  - from: contract
    to: load_route
    type: primary
  - from: load_route
    to: server_load
    type: primary
    label: Server
  - from: load_route
    to: file_load
    type: primary
    label: Files
  - from: server_load
    to: protocol
    type: primary
  - from: file_load
    to: protocol
    type: primary
  - from: protocol
    to: prompt
    type: primary
  - from: prompt
    to: tools
    type: primary
  - from: tools
    to: exact_judge
    type: primary
  - from: exact_judge
    to: success
    type: primary
modules: []
