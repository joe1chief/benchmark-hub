meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NYU CTF Bench Build and Evaluation Process
  description: >-
    Paper-aligned validation and container standardization of CSAW CTF challenges, followed by the automated LLM
    tool-use loop and exact hidden-flag judging used by NYU CTF Bench.
  legend: >-
    Read dataset construction left-to-right, then automated evaluation right-to-left; the source archive spans
    2011-2023, while the paper's validated 200-challenge table covers 2017-2023.
nodes:
  - id: source
    label: |-
      CSAW CTF Source Archive
      Initial Pool: 568 Challenges
      Archive Coverage: 2011-2023
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: manual_gate
    label: |-
      Manual Solvability Gate
      Verify Setup after Package Changes
      Recover Missing Maintenance Artifacts
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: server_gate
    label: |-
      Server-Challenge Validation
      Start Container and Expose Port
      Test Internal + External Connectivity
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: file_gate
    label: |-
      File-Challenge Validation
      Check Configurations + Source Files
      Ensure All Required Information Exists
    type: decision
    size: xl
    position:
      x: 880
      'y': 100
  - id: standardize
    label: |-
      Reproducible Packaging
      Load Docker Hub Images via Compose
      Integrate Source + Metadata + Assets
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      Validated NYU CTF Dataset
      200 Challenges from 2017-2023
      6 Categories: crypto / forensics / pwn / rev / web / misc
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: visibility
    label: |-
      Challenge Contract
      Model Sees Description + Listed Files + Host
      Ground-Truth Flag Remains Hidden
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: loader
    label: |-
      Automated Data Loader
      Start Server with Docker Compose
      Or Mount Local Files in Player Container
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: agent
    label: |-
      Autonomous LLM Solve Loop
      Prompt from challenge.json
      Observe Tool Outputs and Continue
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tools
    label: |-
      Six Function-Calling Tools
      Run / Create File / Disassemble / Decompile
      Check Flag / Give Up
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: judge
    label: |-
      Exact Success and Cleanup
      check_flag Matches Hidden Ground Truth
      Stop Containers and Remove Temp Resources
    type: decision
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      Automated CTF Results
      Solved-Challenge Rate by Category
      Failure Reasons across 5 Evaluated LLMs
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: source
    to: manual_gate
    type: primary
  - from: manual_gate
    to: server_gate
    type: primary
  - from: server_gate
    to: file_gate
    type: primary
  - from: file_gate
    to: standardize
    type: primary
  - from: standardize
    to: release
    type: primary
  - from: release
    to: visibility
    type: primary
  - from: visibility
    to: loader
    type: primary
  - from: loader
    to: agent
    type: primary
  - from: agent
    to: tools
    type: primary
  - from: tools
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
