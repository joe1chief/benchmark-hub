meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NYU CTF Bench 构建与评测流程
  description: 对齐论文的 CSAW CTF 挑战验证流程：区分服务端与文件型检查并完成可复现打包；每个挑战执行五次完整独立求解，每次均精确检查隐藏 Flag，最后按五次中任一次成功聚合。
  legend: 上方构建流程从左向右，下方评测流程从右向左。服务端与文件型挑战在验证和加载阶段分别走互斥分支。源档案覆盖 2011–2023 年，而论文表 2 中保留的 200 个挑战来自 2017–2023 年。
nodes:
  - id: source
    label: |-
      CSAW CTF 源档案
      568 个挑战 • 2011–2023
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: manual_gate
    label: |-
      人工可解性门控
      仅识别维护相关缺失文件
      重验配置与可解性
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: validation_route
    label: |-
      选择验证路径
      服务端还是文件型挑战？
    type: decision
    size: xl
    position:
      x: 600
      'y': 100
  - id: server_gate
    label: |-
      服务端验证
      启动容器并暴露端口
      测试 Docker 网络内外连通性
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: file_gate
    label: |-
      文件型验证
      检查配置与源文件
      确认必要信息齐全
    type: process
    size: xl
    position:
      x: 880
      'y': 200
  - id: standardize
    label: |-
      标准化挑战包
      Docker Hub 镜像 + Compose
      源资产 + challenge.json
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      验证后的 NYU CTF Bench
      200 个挑战 • 2017–2023
      6 类挑战
      密码 / 取证 / 二进制利用
      逆向 / Web / 杂项
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: contract
    label: |-
      challenge.json 契约
      描述 • 列出的文件
      主机与端口可见
      真实 Flag 隐藏
    type: document
    size: xl
    position:
      x: 1720
      'y': 100
  - id: load_route
    label: |-
      选择加载路径
      服务端还是本地文件？
    type: decision
    size: xl
    position:
      x: 1720
      'y': 520
  - id: server_load
    label: |-
      加载服务端挑战
      用 Compose 拉取镜像
      启动容器
      按主机与端口连接
    type: process
    size: xl
    position:
      x: 1440
      'y': 440
  - id: file_load
    label: |-
      加载文件型挑战
      复制到临时目录
      挂载进玩家容器
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
  - id: prompt
    label: |-
      每次运行的提示与求解循环
      从 challenge.json 构造提示
      读取工具结果直至停止
    type: document
    size: xl
    position:
      x: 880
      'y': 520
  - id: tools
    label: |-
      每次运行的工具交互
      至多 6 个按类别配置的工具
      命令 • 创建 / 检查文件
      反汇编 • 反编译 • 放弃
    type: process
    size: xl
    position:
      x: 600
      'y': 520
  - id: protocol
    label: |-
      五次运行评测协议
      每个挑战执行 5 次独立运行
      每次均执行完整求解循环
      每个 LLM 限时 48 小时
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: exact_judge
    label: |-
      每次运行的 Flag 精确检查
      check_flag 做相等比较
      随后停止容器并清理文件
    type: process
    size: xl
    position:
      x: 320
      'y': 520
  - id: success
    label: |-
      五次运行聚合
      至少 1 次返回精确隐藏 Flag
      即判定挑战求解成功
      报告类别与失败率
    type: terminal
    size: xl
    position:
      x: 40
      'y': 520
edges:
  - from: source
    to: manual_gate
    type: primary
  - from: manual_gate
    to: validation_route
    type: primary
  - from: validation_route
    to: server_gate
    type: primary
    label: 服务端
  - from: validation_route
    to: file_gate
    type: primary
    label: 文件型
  - from: server_gate
    to: standardize
    type: primary
  - from: file_gate
    to: standardize
    type: primary
  - from: standardize
    to: release
    type: primary
  - from: release
    to: contract
    type: primary
  - from: contract
    to: load_route
    type: primary
  - from: load_route
    to: server_load
    type: primary
    label: 服务端
  - from: load_route
    to: file_load
    type: primary
    label: 文件型
  - from: server_load
    to: protocol
    type: primary
  - from: file_load
    to: protocol
    type: primary
  - from: protocol
    to: prompt
    type: primary
  - from: prompt
    to: tools
    type: primary
  - from: tools
    to: exact_judge
    type: primary
  - from: exact_judge
    to: success
    type: primary
modules: []
