meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NYU CTF Bench 构建与评测流程
  description: 按论文展示 CSAW CTF 挑战的验证与容器标准化，以及 NYU CTF Bench 的自动 LLM 工具调用循环和隐藏 flag 精确判题。
  legend: 先从左到右阅读数据集构建，再从右到左阅读自动评测；源档案覆盖 2011-2023，论文中 200 个验证挑战表覆盖 2017-2023。
nodes:
  - id: source
    label: |-
      CSAW CTF 源档案
      初始池：568 个挑战
      档案覆盖：2011-2023
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: manual_gate
    label: |-
      人工可解性门
      软件包变化后重验部署
      恢复维护中缺失的工件
    type: user
    size: xl
    position:
      x: 320
      'y': 100
  - id: server_gate
    label: |-
      服务型挑战验证
      启动容器并暴露端口
      测试内部 + 外部连通性
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: file_gate
    label: |-
      文件型挑战验证
      检查配置与源文件
      确保必要信息完整
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: standardize
    label: |-
      可复现打包
      Compose 加载 Docker Hub 镜像
      集成源码 + 元数据 + 资产
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: release
    label: |-
      验证后的 NYU CTF 数据集
      2017-2023 共 200 个挑战
      6 类：密码 / 取证 / Pwn / 逆向 / Web / 其他
    type: database
    size: xl
    position:
      x: 1440
      'y': 100
  - id: visibility
    label: |-
      挑战合同
      模型可见描述 + 指定文件 + 主机
      真实 Flag 保持隐藏
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: loader
    label: |-
      自动数据加载器
      Docker Compose 启动服务
      或在玩家容器挂载本地文件
    type: process
    size: xl
    position:
      x: 1160
      'y': 440
  - id: agent
    label: |-
      自主 LLM 解题循环
      从 challenge.json 构造提示
      观察工具输出并继续
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: tools
    label: |-
      6 个函数调用工具
      运行 / 建文件 / 反汇编 / 反编译
      检查 Flag / 放弃
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: judge
    label: |-
      精确成功判定与清理
      check_flag 匹配隐藏真值
      停止容器并删除临时资源
    type: process
    size: xl
    position:
      x: 320
      'y': 440
  - id: report
    label: |-
      自动 CTF 结果
      分类别已解挑战率
      5 个受评 LLM 的失败原因
    type: terminal
    size: xl
    position:
      x: 40
      'y': 440
edges:
  - from: source
    to: manual_gate
    type: primary
  - from: manual_gate
    to: server_gate
    type: primary
  - from: server_gate
    to: file_gate
    type: primary
  - from: file_gate
    to: standardize
    type: primary
  - from: standardize
    to: release
    type: primary
  - from: release
    to: visibility
    type: primary
  - from: visibility
    to: loader
    type: primary
  - from: loader
    to: agent
    type: primary
  - from: agent
    to: tools
    type: primary
  - from: tools
    to: judge
    type: primary
  - from: judge
    to: report
    type: primary
modules: []
