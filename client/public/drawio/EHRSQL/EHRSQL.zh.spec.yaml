meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EHRSQL 构建流程
  description: 对齐论文的医院需求收集、模板与 SQL 构建、隐私保护数据库实例化、释义验证及可信执行评测。
  legend: 实线箭头展示真实医护话语如何转化为 MIMIC-III 与 eICU 的可执行自然语言—SQL 对，并包含不可回答题识别。
nodes:
  - id: poll
    label: |-
      建阳大学医院问卷
      1,742 条真实信息需求话语
      222 位有效医护受访者
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: templates
    label: |-
      过滤、分范围、合并并扩展
      无患者、单患者、患者群体问题
      230 个模板：可回答 174 + 不可回答 56
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: time
    label: |-
      设计自然语言—SQL 成对时间模板
      全局、事件内、精确时间过滤
      表达式、单位、区间与选项槽位
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: sql
    label: |-
      人工 SQL 标注
      4 名研究生 · 5 个月 · 多轮修订
      一人标注、每个数据库另设审核员
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: schema
    label: |-
      映射 MIMIC-III 与 eICU 模式
      优先层级嵌套查询而非 JOIN
      与问题及时间模板共用槽位
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: preprocess
    label: |-
      隐私保护数据库预处理
      新增费用表 · 时间平移至 2100—2105
      当前时间 2105-12-31 · 跨患者打乱数值
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: instantiate
    label: |-
      三阶段实例化模板
      操作值 → 时间模板 → 条件值
      一致填充自然语言与 SQL 槽位
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: execute
    label: |-
      执行生成 SQL
      从真实数据库记录采样
      可回答样本须至少得到一个有效答案
    type: decision
    size: xl
    position:
      x: 1860
      'y': 250
  - id: paraphrase
    label: |-
      扩展语言多样性
      人工释义均值 21 + T5 / 回译
      RoBERTa 语义过滤 + 困惑度及编辑距离去重
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: crowd
    label: |-
      三组众包质检门槛
      仅保留三组一致通过的释义
      每模板最终平均 47 个释义
    type: decision
    size: xl
    position:
      x: 2380
      'y': 250
  - id: dataset
    label: |-
      EHRSQL 数据集
      24,411 个问题—SQL 对 · 2 个数据库
      93.2% 使用时间 · 平均嵌套 2.7 层
    type: database
    size: xl
    position:
      x: 2640
      'y': 250
  - id: split
    label: |-
      每库保持模板覆盖的划分
      训练 9.3K · 验证 1.1K · 测试 1.8K
      不可回答仅在验证/测试，各占 33%
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: prediction
    label: |-
      可信语义解析
      生成 SQL 或按置信阈值拒答
      低置信 SQL 不发送至病历数据库
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: metrics
    label: |-
      可回答性与执行指标
      F1ans 及 Pexe、Rexe、F1exe
      仅执行结果正确才计为正确回答
    type: terminal
    size: xl
    position:
      x: 3420
      'y': 250
