meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EHRSQL Build Process
  description: >-
    Paper-aligned hospital-needs collection, template and SQL construction, privacy-aware database instantiation,
    paraphrase validation, and trustworthy execution evaluation.
  legend: >-
    Solid arrows trace real staff utterances into executable NL–SQL pairs for MIMIC-III and eICU, including
    unanswerable-question detection.
nodes:
  - id: poll
    label: |-
      Konyang University Hospital poll
      1,742 real information-seeking utterances
      222 valid staff respondents
    type: database
    size: xl
    position:
      x: 40
      'y': 250
  - id: templates
    label: |-
      Filter, scope, merge, and extend
      no-patient / individual / group questions
      230 templates: 174 answerable + 56 unanswerable
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: time
    label: |-
      Design paired NL–SQL time templates
      global · within-event · exact-time filters
      expression, unit, interval, and option slots
    type: document
    size: xl
    position:
      x: 560
      'y': 250
  - id: sql
    label: |-
      Manual SQL annotation
      4 graduate students · 5 months · revisions
      one labeler + per-database reviewer
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: schema
    label: |-
      Map MIMIC-III and eICU schemas
      prefer hierarchical nested queries over JOINs
      share slots with question / time templates
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: preprocess
    label: |-
      Privacy-aware database preprocessing
      add cost table · shift time to 2100–2105
      current time 2105-12-31 · shuffle patient values
    type: database
    size: xl
    position:
      x: 1340
      'y': 250
  - id: instantiate
    label: |-
      Instantiate each template in three stages
      operation value → time template → condition value
      combine NL and SQL slots consistently
    type: process
    size: xl
    position:
      x: 1600
      'y': 250
  - id: execute
    label: |-
      Execute generated SQL
      sample real database records
      keep answerable pairs only if ≥1 valid answer
    type: process
    size: xl
    position:
      x: 1860
      'y': 250
  - id: paraphrase
    label: |-
      Expand linguistic variety
      human paraphrases (mean 21) + T5 / back-translation
      RoBERTa meaning filter + perplexity / edit dedup
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: crowd
    label: |-
      Three-group crowd quality gate
      retain only unanimous-pass paraphrases
      mean 47 final paraphrases per template
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: dataset
    label: |-
      EHRSQL dataset
      24,411 question–SQL pairs · 2 databases
      93.2% use time · mean 2.7 nesting levels
    type: database
    size: xl
    position:
      x: 2640
      'y': 250
  - id: split
    label: |-
      Template-covered splits per database
      train 9.3K · validation 1.1K · test 1.8K
      unanswerable only in val/test, 33% each
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: prediction
    label: |-
      Trustworthy semantic parsing
      generate SQL or abstain via confidence threshold
      never send low-confidence SQL to EHR database
    type: process
    size: xl
    position:
      x: 3160
      'y': 250
  - id: metrics
    label: |-
      Answerability and execution metrics
      F1ans plus Pexe, Rexe, and F1exe
      executable answer must be correct to count
    type: terminal
    size: xl
    position:
      x: 3420
      'y': 250
edges:
  - from: poll
    to: templates
    type: primary
  - from: templates
    to: time
    type: primary
  - from: time
    to: sql
    type: primary
  - from: sql
    to: schema
    type: primary
  - from: schema
    to: preprocess
    type: primary
  - from: preprocess
    to: instantiate
    type: primary
  - from: instantiate
    to: execute
    type: primary
  - from: execute
    to: paraphrase
    type: primary
  - from: paraphrase
    to: crowd
    type: primary
  - from: crowd
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: prediction
    type: primary
  - from: prediction
    to: metrics
    type: primary
modules: []
