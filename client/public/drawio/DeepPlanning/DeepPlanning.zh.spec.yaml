meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeepPlanning 构建流程
  description: 对齐论文的三阶段构建流程，生成具有唯一可达最优解的旅行和购物任务，并采用代码化评测。
  legend: 实线箭头表示领域数据、分层逆向任务生成、人工质检、沙盒执行与规则检查。
nodes:
  - id: domains
    label: 两个规划领域
    type: decision
    size: xl
    position:
      x: 40
      'y': 210
  - id: travel_data
    label: |-
      旅行真实数据
      飞猪 · 高德地图 · 网络搜索
      交通 · 酒店 · 餐饮 · 景点
    type: database
    size: xl
    position:
      x: 300
      'y': 70
  - id: shopping_data
    label: |-
      合成购物数据
      价格 · 库存 · 销量 · 评分 · 促销
    type: database
    size: xl
    position:
      x: 300
      'y': 350
  - id: sandbox
    label: |-
      阶段一：数据库与工具箱
      旅行 9 个接口 · 购物 15 个接口
      隔离离线沙盒
    type: process
    size: xl
    position:
      x: 560
      'y': 210
  - id: layered
    label: |-
      阶段二：以解为中心逆向生成
      基础骨架 → 个性化约束
      → 隐式环境约束
    type: process
    size: xl
    position:
      x: 820
      'y': 210
  - id: unique
    label: |-
      调整数据库候选项
      保证唯一且可达的最优解
    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: query
    label: |-
      大模型自然语言化
      结构化约束 → 对话式用户请求
    type: process
    size: xl
    position:
      x: 1340
      'y': 210
  - id: qc
    label: |-
      阶段三：人工质量控制
      语言流畅 · 逻辑明确 · 解可达
    type: process
    size: xl
    position:
      x: 1600
      'y': 210
  - id: benchmark
    label: |-
      DeepPlanning
      旅行：120 中文 + 120 英文
      购物：120 英文
    type: database
    size: xl
    position:
      x: 1860
      'y': 210
  - id: agent
    label: |-
      智能体迭代调用工具
      输出行程报告或购物车 JSON
    type: process
    size: xl
    position:
      x: 2120
      'y': 210
  - id: route
    label: 按规划领域分流
    type: decision
    size: xl
    position:
      x: 2380
      'y': 210
  - id: travel_eval
    label: |-
      旅行代码检查
      Qwen-Plus-2507 解析 → 八维常识分
      个性化分 · 综合分 · 案例准确率
    type: process
    size: xl
    position:
      x: 2640
      'y': 70
  - id: shopping_eval
    label: |-
      购物代码检查
      购物车匹配分 · 严格案例准确率
    type: process
    size: xl
    position:
      x: 2640
      'y': 350
  - id: report
    label: |-
      可复现规划报告
      领域指标 + 平均案例准确率
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 210
edges:
  - from: domains
    to: travel_data
    type: primary
  - from: domains
    to: shopping_data
    type: primary
  - from: travel_data
    to: sandbox
    type: primary
  - from: shopping_data
    to: sandbox
    type: primary
  - from: sandbox
    to: layered
    type: primary
  - from: layered
    to: unique
    type: primary
  - from: unique
    to: query
    type: primary
  - from: query
    to: qc
    type: primary
  - from: qc
    to: benchmark
    type: primary
  - from: benchmark
    to: agent
    type: primary
  - from: agent
    to: route
    type: primary
  - from: route
    to: travel_eval
    type: primary
  - from: route
    to: shopping_eval
    type: primary
  - from: travel_eval
    to: report
    type: primary
  - from: shopping_eval
    to: report
    type: primary
modules: []
