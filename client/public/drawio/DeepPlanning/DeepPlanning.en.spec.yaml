  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeepPlanning Build Process
  description: Paper-aligned three-stage construction of uniquely solvable travel and shopping tasks with code-based evaluation.
  legend: >-
    Solid arrows trace domain data, layered reverse task generation, manual quality control, sandbox execution, and rule
