meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniMedVQA 构建与评测流程
  description: 对齐论文把真实医学图像分类数据转成分布平衡的多项选择问答，并使用两种互补分数评测。
  legend: OmniMedVQA 含 73 个数据集的 118,010 张图像和 127,995 条问答，覆盖 12 种成像模态和 20 多个解剖区域。
nodes:
  - id: sources
    label: |-
      收集 73 个医学数据集
      仅使用真实医学图像
      从分类标签出发
      保留数据集来源
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: coverage
    label: |-
      映射医学覆盖范围
      覆盖 12 种成像模态
      涉及 20 多个解剖区域
      附加模态与部位属性
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: templates
    label: |-
      建立逐数据集问答模板
      从原始类别生成问题
      使用模态与解剖属性
      产生候选问答条目
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: balance
    label: |-
      执行反比例采样
      估计每个模板的图像量
      降低大模板采样率
      避免重复问答偏差
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: types
    label: |-
      归入五类问题
      模态 · 解剖 · 疾病诊断
      病灶分级
      其他生物属性
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: rewrite
    label: |-
      用 GPT-3.5 改写问题
      改变表述与句法
      保持原始语义
      增加语言多样性
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: options
    label: |-
      生成错误候选项
      使用 GPT-3.5 生成干扰项
      每题提供 2 至 4 个选项
      形成多项选择题
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: qc
    label: |-
      执行人工双重检查
      检查条目有效性
      核验问题与选项
      保留医学语义
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      发布 OmniMedVQA
      118,010 张图像
      127,995 条问答
      五类问题 · 12 种模态
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompt
    label: |-
      构建问答提示
      组合图像与问题
      插入候选选项
      要求选择唯一答案
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: qa_score
    label: |-
      计算问答分数
      生成自由文本回答
      与候选项计算相似度
      选择最相似选项
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: prefix
    label: |-
      计算前缀分数
      把视觉特征前缀到文本
      逐问题选项计算似然
      选择最高似然选项
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: correct
    label: |-
      对照标准答案
      判断所选选项
      计算 VQA 准确率
      分别保留两种分数
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告零样本结果
      按五类问题汇总
      分析各成像模态
      报告总体问答与前缀分数
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: coverage
    type: primary
  - from: coverage
    to: templates
    type: primary
  - from: templates
    to: balance
    type: primary
  - from: balance
    to: types
    type: primary
  - from: types
    to: rewrite
    type: primary
  - from: rewrite
    to: options
    type: primary
  - from: options
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: qa_score
    type: primary
  - from: qa_score
    to: prefix
    type: primary
  - from: prefix
    to: correct
    type: primary
  - from: correct
    to: report
    type: primary
modules: []
