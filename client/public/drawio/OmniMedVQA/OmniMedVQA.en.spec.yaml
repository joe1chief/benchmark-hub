meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniMedVQA Build and Evaluation Process
  description: >-
    Paper-aligned conversion of real medical image classification datasets into balanced multiple-choice VQA and two
    complementary evaluation scores.
  legend: >-
    OmniMedVQA contains 118,010 images and 127,995 QA items from 73 datasets, covering 12 imaging modalities and more
    than 20 anatomical regions.
nodes:
  - id: sources
    label: |-
      Collect 73 Medical Datasets
      Use Real Medical Images
      Start from Classification Labels
      Retain Dataset Provenance
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: coverage
    label: |-
      Map Medical Coverage
      Twelve Imaging Modalities
      More Than Twenty Anatomies
      Attach Modality and Region Attributes
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: templates
    label: |-
      Create Dataset-specific Templates
      Derive Questions from Categories
      Use Modality and Anatomy Attributes
      Generate Candidate QA Items
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: balance
    label: |-
      Apply Inverse-proportional Sampling
      Estimate Images per Template
      Downsample Abundant Templates
      Avoid Repetitive QA Bias
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: types
    label: |-
      Organize Five Question Types
      Modality · Anatomy · Diagnosis
      Lesion Grading
      Other Biological Attributes
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: rewrite
    label: |-
      Refine Questions with GPT-3.5
      Vary Wording and Syntax
      Preserve Original Meaning
      Increase Linguistic Diversity
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: options
    label: |-
      Generate Incorrect Options
      Use GPT-3.5 Distractors
      Provide Two to Four Choices
      Form Multiple-choice Items
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: qc
    label: |-
      Perform Human Double Check
      Inspect Item Validity
      Verify Questions and Options
      Retain Medical Meaning
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release OmniMedVQA
      118,010 Images
      127,995 QA Items
      Five Types · Twelve Modalities
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: prompt
    label: |-
      Build the QA Prompt
      Combine Image and Question
      Insert Candidate Options
      Require One Selected Answer
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: qa_score
    label: |-
      Compute QA Score
      Generate a Free-form Response
      Match It to Candidate Similarity
      Select the Most Similar Option
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: prefix
    label: |-
      Compute Prefix-based Score
      Prefix Visual Features to Text
      Score Each Question-option Pair
      Select Highest Likelihood
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: correct
    label: |-
      Compare with Ground Truth
      Judge Selected Option
      Compute VQA Accuracy
      Keep Both Scores Separate
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Report Zero-shot Results
      Five Question Types
      Modality-level Analysis
      Overall QA and Prefix Scores
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: sources
    to: coverage
    type: primary
  - from: coverage
    to: templates
    type: primary
  - from: templates
    to: balance
    type: primary
  - from: balance
    to: types
    type: primary
  - from: types
    to: rewrite
    type: primary
  - from: rewrite
    to: options
    type: primary
  - from: options
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: prompt
    type: primary
  - from: prompt
    to: qa_score
    type: primary
  - from: qa_score
    to: prefix
    type: primary
  - from: prefix
    to: correct
    type: primary
  - from: correct
    to: report
    type: primary
modules: []
