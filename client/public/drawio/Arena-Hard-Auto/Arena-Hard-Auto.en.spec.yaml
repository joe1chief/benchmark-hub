meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto Build Process
  description: >-
    Paper-aligned BenchBuilder workflow: 200,000 Chatbot Arena prompts are cleaned, clustered, scored on seven
    qualities, gated and evenly sampled into 500 prompts; pairwise swapped-position judging then produces Bradley-Terry
    win rates, confidence intervals, separability, and human-preference alignment evidence.
  legend: >-
    Solid arrows show benchmark construction and model evaluation; the dashed branch is an independent audit of the
    GPT-4-Turbo prompt-quality labels and does not feed later benchmark scores.
