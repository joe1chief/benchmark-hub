meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto-v0.1 构建与评测
  description: >-
    论文 v2 构建与固定 v0.1 evaluator 实现：500 条困难提示依次经过采样后安全清理、位置互换成对游戏、五标签裁判解析、battle 加权、Bradley-Terry/Elo 尺度拟合与相对 gpt-4-0314
    的默认胜率报告。
  legend: 实线按 arXiv:2406.11939v2 构建与固定 v0.1 evaluator；虚线把冲突的 April blog / 仓库历史隔离为版本证据。
nodes:
