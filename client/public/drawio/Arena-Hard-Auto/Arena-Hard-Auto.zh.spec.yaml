meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto 构建流程
  description: >-
    论文对齐的 BenchBuilder 流程：20 万条 Chatbot Arena 提示经过清洗、聚类、七项质量评分、门控与均匀抽样，形成 500 条提示；随后用交换位置的成对评审得到 Bradley-Terry
    胜率、置信区间、可分性和人类偏好一致性证据。
  legend: 实线表示基准构建与模型评测；虚线分支是对 GPT-4-Turbo 提示质量标签的独立核验，不回流到后续基准得分。
nodes:
  - id: source
    label: |-
      Chatbot Arena 题池
      200,000 条提示
    type: database
    size: large
    position:
      x: 40
      'y': 140
  - id: cleanup
    label: |-
      初始过滤
      去重 / 单轮 / 英文
    type: process
    size: large
    position:
      x: 240
      'y': 140
  - id: topics
    label: |-
      BERTopic 流程
      嵌入 → UMAP → HDBSCAN
      4,000 个主题
    type: process
    size: xl
    position:
      x: 470
      'y': 140
  - id: quality
    label: |-
      GPT-4-Turbo 标注
      七项质量指标
    type: process
    size: large
    position:
      x: 710
      'y': 140
  - id: gate
    label: |-
      质量门控
      提示分 ≥ 6
      主题均分 ≥ 5
    type: decision
    size: large
    position:
      x: 930
      'y': 140
  - id: label_audit
    label: |-
      标签抽检：200 题
      三模型多数票
      一致率 85.6%
    type: document
    size: xl
    position:
      x: 710
      'y': 380
  - id: sample
    label: |-
      多样化抽样
      250 主题 × 2 题
    type: process
    size: large
    position:
      x: 1150
      'y': 140
  - id: safety
    label: |-
      安全清洗
      删除隐私与冒犯内容
    type: process
    size: large
    position:
      x: 1360
      'y': 140
  - id: dataset
    label: |-
      Arena-Hard-Auto
      500 条困难提示
    type: database
    size: large
    position:
      x: 1570
      'y': 140
  - id: responses
    label: |-
      候选模型对基线
      500 题回复
    type: process
    size: large
    position:
      x: 1780
      'y': 140
  - id: judge
    label: |-
      成对 LLM 评审
      思维链 + 交换位置
      每模型 1,000 次判断
    type: process
    size: xl
    position:
      x: 2000
      'y': 140
  - id: bt
    label: |-
      Bradley-Terry 拟合
      胜率 + 95% 置信区间
      可选风格控制
    type: formula
    size: xl
    position:
      x: 2240
      'y': 140
  - id: report
    label: |-
      基准有效性验证
      可分性 / 一致性
      Brier + 人类偏好对齐
    type: terminal
    size: xl
    position:
      x: 2480
      'y': 140
edges:
  - from: source
    to: cleanup
    type: primary
  - from: cleanup
    to: topics
    type: primary
  - from: topics
    to: quality
    type: primary
  - from: quality
    to: gate
    type: primary
  - from: quality
    to: label_audit
    type: optional
  - from: gate
    to: sample
    type: primary
  - from: sample
    to: safety
    type: primary
  - from: safety
    to: dataset
    type: primary
  - from: dataset
    to: responses
    type: primary
  - from: responses
    to: judge
    type: primary
  - from: judge
    to: bt
    type: primary
  - from: bt
    to: report
    type: primary
modules: []
