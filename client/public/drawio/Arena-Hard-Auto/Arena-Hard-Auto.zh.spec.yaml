    label: |-
      Chatbot Arena 查询池
      200,000 条众包提示
    type: database
    size: xl
    position:
      x: 40
      'y': 120
  - id: cleanup
    label: |-
      论文 v2 提示清理
      去重 • 单轮 • 英文
      精确快照与过滤规则未公开
    type: process
    size: xl
    position:
      x: 320
      'y': 120
  - id: topics
    label: |-
      论文 v2 主题建模
      text-embedding-3-small • UMAP • HDBSCAN
      4,000 个不同主题
      由 LLM 总结并命名
    type: process
    size: xl
    position:
      x: 600
      'y': 120
    style:
      fontSize: 10
  - id: quality
    label: |-
      论文 v2 质量标注
      GPT-4-Turbo • 七项标准
      逐条提示评分 0–7
    type: process
    size: xl
    position:
      x: 880
      'y': 120
  - id: v2_gate
    label: |-
      论文 v2 质量门槛
      保留提示得分 ≥ 6
      保留簇均分 ≥ 5
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
  - id: cluster_pool
    label: |-
      高质量主题簇池
      超过 500 个簇
      由论文 v2 门槛筛得
    type: process
    size: xl
    position:
      x: 1440
      'y': 120
  - id: sample
    label: |-
      多样性随机采样
      随机选择 250 个簇
      每簇 2 条 = 500 条
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: safety_cleanup
    label: |-
      采样后安全清理
      移除 PII / 冒犯性内容
      在 250 × 2 采样之后执行
    type: process
    size: xl
    position:
      x: 1720
      'y': 360
  - id: release
    label: |-
      Arena-Hard-Auto-v0.1
      官方 500 题发布
      250 个主题簇 × 每簇 2 题
    type: database
    size: xl
    position:
      x: 1720
      'y': 600
    style:
      fontSize: 10
  - id: responses
    label: |-
      候选模型与基线回复
      基线：gpt-4-0314
      在 500 条开放提示上生成
    type: process
    size: xl
    position:
      x: 1440
      'y': 600
    style:
      fontSize: 10
  - id: two_games
    label: |-
      每题执行两局裁判
      交换 A/B 位置
      500 × 2 = 每模型 1,000 次判断
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
    style:
      fontSize: 10
  - id: judge_prompt
    label: |-
      gpt-4-1106-preview • T = 0
      max_tokens = 4,096
      先生成自己的答案，再比较回复
    type: document
    size: xl
    position:
      x: 880
      'y': 600
    style:
      fontSize: 10
  - id: raw_judgment
    label: |-
      五个允许的裁判标签
      [[A>>B]] • [[A>B]] • [[A=B]]
      [[B>A]] • [[B>>A]]
    type: process
    size: xl
    position:
      x: 600
      'y': 600
    style:
      fontSize: 10
  - id: parser
    label: |-
      固定版本裁判解析器
      无标签 → continuation；最多 2 次
      单一 / 重复同标签 → 接受
      冲突标签 → 立即无效；不重试
    type: process
    size: xl
    position:
      x: 320
      'y': 600
  - id: normalized_battles
    label: |-
      归一化第二局位置
      明显胜负 ×3 • 轻微胜负 ×1
      保留平局 • 丢弃无效结果
    type: database
    size: xl
    position:
      x: 40
      'y': 600
  - id: bt_elo
    label: |-
      Bradley-Terry / Elo 尺度逻辑回归
      无正则估计
      锚定 gpt-4-0314 = 1,000
    type: formula
    size: xl
    position:
      x: 40
      'y': 880
    style:
      fontSize: 10
  - id: baseline_winrate
    label: |-
      转换为相对基线胜率
      相对 gpt-4-0314
      默认报告并非 Elo rating
    type: process
    size: xl
    position:
      x: 320
      'y': 880
  - id: bootstrap
    label: |-
      Bootstrap 不确定性
      100 轮 • 2.5 / 97.5 百分位
      得到 95% 置信区间
    type: process
    size: xl
    position:
      x: 600
      'y': 880
  - id: report
    label: |-
      Arena-Hard-Auto-v0.1 报告
      相对基线胜率 • 95% 置信区间
      可审计的成对判断到 BT 链
    type: terminal
    size: xl
    position:
      x: 880
      'y': 880
  - id: version_boundary
    label: |-
      仅作来源版本证据
      April blog / 仓库：均分 ≥ 6 • v1：GPT-3.5
      固定实现主题命名：gpt-4o-mini
      非论文 v2 主链
    type: document
    size: xl
    position:
      x: 1720
      'y': 880
    style:
      fontSize: 10
