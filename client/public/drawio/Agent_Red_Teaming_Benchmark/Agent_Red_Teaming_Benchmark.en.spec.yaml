meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent Red Teaming Benchmark Build Process
  description: >-
    Paper-aligned public-challenge collection, attack curation, and security evaluation workflow based on
    arXiv:2507.20526.
  legend: >-
    The 1.8 million challenge submissions are the collection pool; ART itself is the stricter curated subset of 4,700
    attacks across 44 target behaviors.
nodes:
  - id: scenarios
    label: |-
      Curate 44 Deployment Scenarios
      Agent • Simulated Tools • Adversarial Goal
      Detailed Policy and Success Criteria
    type: user
    size: xl
    position:
      x: 40
      'y': 170
  - id: categories
    label: |-
      Cover Four Policy-Violation Classes
      Confidentiality • Conflicting Objectives
      Prohibited Information • Prohibited Actions
    type: database
    size: xl
    position:
      x: 320
      'y': 170
  - id: competition
    label: |-
      Run Gray Swan Public Challenge
      March 8–April 6, 2025 • Four Waves
      22 Anonymized Frontier Agents
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: submissions
    label: |-
      Collect Red-Teamer Attacks
      Direct and Indirect Prompt Injection
      1.8 Million Submitted Interactions
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: challenge_judge
    label: |-
      Judge Challenge Policy Violations
      Automated Success Evaluation
      Human Appeal and Review Path
    type: process
    size: xl
    position:
      x: 1160
      'y': 170
  - id: successful_pool
    label: |-
      Form Successful-Attack Pool
      More Than 60,000 Policy Violations
      Preserve Behavior and Source Model
    type: database
    size: xl
    position:
      x: 1440
      'y': 170
  - id: strict_filter
    label: |-
      Apply Stricter LLM Judge
      Recheck Challenge Successes
      Retain High-Quality Working Injections
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: sampling
    label: |-
      Sample by Behavior–Model Pair
      Up to Five High-Quality Attacks
      Preserve All 44 Target Behaviors
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: benchmark
    label: |-
      Construct the ART Benchmark
      4,700 Selected Attacks
      44 Agent Deployment Settings
    type: database
    size: xl
    position:
      x: 880
      'y': 500
  - id: models
    label: |-
      Evaluate 19 Frontier Models
      Challenge Models + Unseen Models
      Gemini 2.5 Pro and o4-mini Included
    type: process
    size: xl
    position:
      x: 600
      'y': 500
  - id: query_budgets
    label: |-
      Replay Attacks at Query Budgets
      k = 1 • 10 • 100
      Check Any Violation per Behavior
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: asr
    label: |-
      Compute Behavior Attack Success Rate
      Fraction of Behaviors Broken by k Queries
      Lower Is Safer
    type: process
    size: xl
    position:
      x: 40
      'y': 500
  - id: transfer
    label: |-
      Analyze Attack Transferability
      Source Model → Other Target Models
      Cross-Behavior Universal Clusters
    type: process
    size: xl
    position:
      x: 40
      'y': 790
  - id: report
    label: |-
      Report Agent Security Findings
      ASR at k • Transfer and Universality
      Robustness vs Capability Correlations
    type: terminal
    size: xl
    position:
      x: 320
      'y': 790
  - id: release_status
    label: |-
      Paper Access Status
      Private Dynamic Leaderboard Planned
      No Public Release in This Source Revision
    type: document
    size: xl
    position:
      x: 600
      'y': 790
edges:
  - from: scenarios
    to: categories
    type: primary
  - from: categories
    to: competition
    type: primary
  - from: competition
    to: submissions
    type: primary
  - from: submissions
    to: challenge_judge
    type: primary
  - from: challenge_judge
    to: successful_pool
    type: primary
  - from: successful_pool
    to: strict_filter
    type: primary
  - from: strict_filter
    to: sampling
    type: primary
  - from: sampling
    to: benchmark
    type: primary
  - from: benchmark
    to: models
    type: primary
  - from: models
    to: query_budgets
    type: primary
  - from: query_budgets
    to: asr
    type: primary
  - from: asr
    to: transfer
    type: primary
  - from: transfer
    to: report
    type: primary
  - from: report
    to: release_status
    type: primary
modules: []
