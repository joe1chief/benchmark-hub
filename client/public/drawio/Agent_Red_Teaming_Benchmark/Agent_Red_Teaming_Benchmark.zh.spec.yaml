meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent Red Teaming Benchmark 构建流程
  description: 基于 arXiv:2507.20526 对齐的公开挑战赛采集、攻击筛选与安全评测流程。
  legend: 180 万次挑战赛提交是候选池；ART 基准本体是经过更严格筛选、覆盖 44 个目标行为的 4,700 条攻击子集。
nodes:
  - id: scenarios
    label: |-
      人工设计 44 个部署场景
      Agent • 模拟工具 • 对抗目标
      详细策略与成功判据
    type: user
    size: xl
    position:
      x: 40
      'y': 170
  - id: categories
    label: |-
      覆盖四类策略违规
      机密泄露 • 目标冲突
      禁止信息 • 禁止行动
    type: database
    size: xl
    position:
      x: 320
      'y': 170
  - id: competition
    label: |-
      运行 Gray Swan 公开挑战赛
      2025-03-08 至 04-06 • 四轮
      22 个匿名前沿 Agent
    type: process
    size: xl
    position:
      x: 600
      'y': 170
  - id: submissions
    label: |-
      收集红队攻击
      直接与间接提示注入
      180 万次提交交互
    type: database
    size: xl
    position:
      x: 880
      'y': 170
  - id: challenge_judge
    label: |-
      判定挑战赛策略违规
      自动成功评估
      提供人工申诉与复核路径
    type: process
    size: xl
    position:
      x: 1160
      'y': 170
  - id: successful_pool
    label: |-
      形成成功攻击候选池
      超过 60,000 次策略违规
      保留目标行为与来源模型
    type: database
    size: xl
    position:
      x: 1440
      'y': 170
  - id: strict_filter
    label: |-
      使用更严格的 LLM 评审器
      重新核验挑战赛成功样本
      保留高质量有效注入
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: sampling
    label: |-
      按行为-模型组合采样
      每组最多 5 条高质量攻击
      保留全部 44 个目标行为
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: benchmark
    label: |-
      构建 ART Benchmark
      4,700 条精选攻击
      44 个 Agent 部署场景
    type: database
    size: xl
    position:
      x: 880
      'y': 500
  - id: models
    label: |-
      评测 19 个前沿模型
      挑战赛模型 + 未见模型
      包含 Gemini 2.5 Pro 与 o4-mini
    type: process
    size: xl
    position:
      x: 600
      'y': 500
  - id: query_budgets
    label: |-
      按查询预算重放攻击
      k = 1 • 10 • 100
      判断每个行为是否至少违规一次
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: asr
    label: |-
      计算行为级攻击成功率
      k 次查询内被攻破的行为占比
      数值越低越安全
    type: process
    size: xl
    position:
      x: 40
      'y': 500
  - id: transfer
    label: |-
      分析攻击迁移性
      来源模型 → 其他目标模型
      跨行为通用攻击簇
    type: process
    size: xl
    position:
      x: 40
      'y': 790
  - id: report
    label: |-
      汇报 Agent 安全结果
      不同 k 的 ASR • 迁移性与通用性
      鲁棒性与能力相关性
    type: terminal
    size: xl
    position:
      x: 320
      'y': 790
  - id: release_status
    label: |-
      论文所述访问状态
      计划采用私有动态排行榜
      本版来源未显示已公开发布
    type: document
    size: xl
    position:
      x: 600
      'y': 790
edges:
  - from: scenarios
    to: categories
    type: primary
  - from: categories
    to: competition
    type: primary
  - from: competition
    to: submissions
    type: primary
  - from: submissions
    to: challenge_judge
    type: primary
  - from: challenge_judge
    to: successful_pool
    type: primary
  - from: successful_pool
    to: strict_filter
    type: primary
  - from: strict_filter
    to: sampling
    type: primary
  - from: sampling
    to: benchmark
    type: primary
  - from: benchmark
    to: models
    type: primary
  - from: models
    to: query_budgets
    type: primary
  - from: query_budgets
    to: asr
    type: primary
  - from: asr
    to: transfer
    type: primary
  - from: transfer
    to: report
    type: primary
  - from: report
    to: release_status
    type: primary
modules: []
