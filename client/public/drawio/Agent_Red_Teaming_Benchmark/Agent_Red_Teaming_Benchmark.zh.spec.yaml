meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Agent Red Teaming Benchmark 构建流程
  description: 基于 arXiv:2507.20526 对齐的 Agent Red Teaming Benchmark 构建与评估流程。
  legend: 实线表示公开竞赛数据收集和基准评估主流程；虚线表示筛选、申诉和判定检查点。
nodes:
  - id: scenarios
    label: |-
      红队竞赛设置
      44 个真实部署场景
      22 个前沿 AI agents
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: submissions
    label: |-
      公开竞赛
      180 万次对抗 prompts
      直接和间接注入
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: judging
    label: |-
      策略违规判定
      自动化判定标准
      人工申诉路径
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: successful
    label: |-
      成功攻击
      6 万+ 策略违规
      unsafe agent 行为
    type: database
    size: xl
    position:
      x: 560
      'y': 160
  - id: curate
    label: |-
      ART 精炼子集
      高质量 prompt injections
      4,700 条筛选攻击
    type: process
    size: xl
    position:
      x: 820
      'y': 160
  - id: evaluation
    label: |-
      基准评测
      19 个前沿 LLM agents
      1、10、100 次查询
    type: process
    size: xl
    position:
      x: 1080
      'y': 70
  - id: transfer
    label: |-
      迁移分析
      攻击跨模型复用
      共享漏洞热图
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: metrics
    label: |-
      ART 结果
      攻击成功率
      迁移性和 leaderboard
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: scenarios
    to: submissions
    type: primary
  - from: submissions
    to: judging
    type: data
    label: attacks
  - from: judging
    to: submissions
    type: optional
    label: 申诉与复核
  - from: judging
    to: successful
    type: primary
  - from: successful
    to: curate
    type: primary
  - from: curate
    to: evaluation
    type: primary
  - from: curate
    to: transfer
    type: data
  - from: evaluation
    to: metrics
    type: primary
  - from: transfer
    to: metrics
    type: primary
modules: []
