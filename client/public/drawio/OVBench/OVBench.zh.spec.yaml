meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVBench 构建与评测流程
  description: 按论文复原 OVBench 的构建与评测，并将固定公开版本和当前 LMMS 评测实现分开呈现，显式保留来源数量、 采帧率、分母和聚合方式的漂移。
  legend: 实线表示构建或评测主流程；虚线表示固定证据、发布物边界或版本漂移。
nodes:
  - id: evidence
    label: |-
      固定审阅证据
      arXiv：2501.00584v2
      Git：012712a
      HF：4d9ddfa
    type: document
    size: xl
    position:
      x: 40
      'y': 440
  - id: contexts
    label: |-
      定义三类时间语境
      过去 · 当前 · 未来
      每题锚定问题时间戳
      模拟在线视频使用
    type: document
    size: xl
    position:
      x: 40
      'y': 80
  - id: taxonomy
    label: |-
      6 类任务 · 16 个子任务
      空间 · 时间
      时空感知
      幻觉核验
      过去记忆 · 未来预测
    type: process
    size: xl
    position:
      x: 320
      'y': 80
  - id: source_count
    label: |-
      论文内部数量矛盾
      引言：七个数据集
      第 3.2 节：八个数据集
      六个领域
      不把两种口径强行合并
    type: database
    size: xl
    position:
      x: 600
      'y': 80
  - id: val_test
    label: |-
      仅选择验证集与测试集
      排除训练集
      降低潜在数据泄漏
      保留多样真实场景
    type: process
    size: xl
    position:
      x: 880
      'y': 80
  - id: existing_labels
    label: |-
      复用已有时空标注
      精确时间戳 · 边界框
      动作与对象标注
      轨迹信息
    type: document
    size: xl
    position:
      x: 1160
      'y': 80
  - id: qa_templates
    label: |-
      构造任务专属问答
      人工标注员重写
      任务专属模板
      保留查询时刻语义
    type: process
    size: xl
    position:
      x: 1440
      'y': 80
  - id: options
    label: |-
      构造流式干扰项
      同视频偏移时间戳
      相似问题或对象
      常见但错误的回答
    type: process
    size: xl
    position:
      x: 1720
      'y': 80
  - id: manual_qc
    label: |-
      执行人工质量检查
      检查问题清晰度
      检查选项歧义
      核验标注准确性
    type: process
    size: xl
    position:
      x: 2000
      'y': 80
  - id: trim_sampling
    label: |-
      裁剪并平衡样本
      从最早相关问题处开始
      按视频时长比例抽样
      场景多样性 · 任务平衡
    type: process
    size: xl
    position:
      x: 2000
      'y': 440
  - id: hf_release
    label: |-
      固定公开 HF 版本
      1,463 个视频 · 7,090 个问题
      2 选项：1,774 · 3 选项：72
      4 选项：5,244
    type: database
    size: xl
    position:
      x: 1720
      'y': 440
  - id: eval_gate
    label: |-
      选择评测上下文
      使用同一批时间戳选择题
      离线滑动窗口
      在线流式输入
    type: decision
    size: xl
    position:
      x: 1440
      'y': 440
  - id: sliding
    label: |-
      滑动窗口评测
      取此前 32 秒
      按 2 帧每秒采样
      最多 64 帧
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: streaming
    label: |-
      流式评测
      从片段起点到问题时间戳
      按 2 帧每秒采样
      累积当时可见上下文
    type: process
    size: xl
    position:
      x: 1160
      'y': 580
  - id: predict
    label: |-
      预测选择题答案
      运行离线或在线多模态模型
      保留每个子任务结果
      比较两种上下文策略
    type: process
    size: xl
    position:
      x: 880
      'y': 440
  - id: paper_scoring
    label: |-
      复现论文计分
      计算 16 个子任务准确率
      再取无权算术平均
      对齐论文表 2 的 AVG
    type: terminal
    size: xl
    position:
      x: 600
      'y': 440
  - id: repo_embedded
    label: |-
      固定 Git 内嵌 LMMS 数据
      1,441 个视频 · 7,005 条记录
      四个 LMMS 配置
      AVA · COIN · HiREST · TAO
    type: database
    size: xl
    position:
      x: 1720
      'y': 800
  - id: repo_harness
    label: |-
      追踪固定 LMMS 实现
      解析 A–E 或选项文本
      空预测不计入分母
      样本级微平均准确率
    type: process
    size: xl
    position:
      x: 1440
      'y': 800
  - id: artifact_boundary
    label: |-
      记录发布物与权利边界
      HF 卡片：MIT
      Git 根目录没有 LICENSE 文件
      源视频权利仍归上游
    type: document
    size: xl
    position:
      x: 2000
      'y': 800
  - id: drift
    label: |-
      重大漂移
      论文：七与八个数据集
      HF：十个存储前缀
      论文流式：2 帧每秒
      仓库脚本：8 帧每秒
      论文宏平均与评测实现微平均
    type: terminal
    size: xl
    position:
      x: 880
      'y': 800
edges:
  - from: evidence
    to: contexts
    type: secondary
    label: 固定证据
    style:
      dashed: true
      exitX: 0.5
      exitY: 0
      entryX: 0.5
      entryY: 1
  - from: contexts
    to: taxonomy
    type: primary
  - from: taxonomy
    to: source_count
    type: primary
  - from: source_count
    to: val_test
    type: primary
  - from: val_test
    to: existing_labels
    type: primary
  - from: existing_labels
    to: qa_templates
    type: primary
  - from: qa_templates
    to: options
    type: primary
  - from: options
    to: manual_qc
    type: primary
  - from: manual_qc
    to: trim_sampling
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: trim_sampling
    to: hf_release
    type: primary
  - from: hf_release
    to: eval_gate
    type: primary
  - from: eval_gate
    to: sliding
    type: primary
    label: 离线模型
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.5
  - from: eval_gate
    to: streaming
    type: primary
    label: 在线模型
    style:
      exitX: 0
      exitY: 0.75
      entryX: 1
      entryY: 0.5
  - from: sliding
    to: predict
    type: primary
    style:
      exitX: 0
      exitY: 0.5
      entryX: 1
      entryY: 0.25
  - from: streaming
    to: predict
    type: primary
    style:
      exitX: 0
      exitY: 0.5
      entryX: 1
      entryY: 0.75
  - from: predict
    to: paper_scoring
    type: primary
    label: 论文报告
  - from: hf_release
    to: repo_embedded
    type: secondary
    label: 固定 Git 评测数据
    style:
      dashed: true
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: repo_embedded
    to: repo_harness
    type: primary
  - from: hf_release
    to: artifact_boundary
    type: secondary
    label: 发布边界
    style:
      dashed: true
    waypoints:
      - x: 2140
        'y': 620
  - from: repo_embedded
    to: drift
    type: secondary
    label: 数据漂移
    style:
      dashed: true
    waypoints:
      - x: 1840
        'y': 980
      - x: 1000
        'y': 980
  - from: paper_scoring
    to: drift
    type: secondary
    label: 协议漂移
    style:
      dashed: true
    waypoints:
      - x: 720
        'y': 700
  - from: repo_harness
    to: drift
    type: secondary
    label: 实现漂移
    style:
      dashed: true
modules: []
