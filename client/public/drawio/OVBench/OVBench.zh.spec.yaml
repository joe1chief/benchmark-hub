meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVBench 构建与评测流程
  description: 对齐论文构建面向过去、当前与未来时空理解的在线视频基准，并分别以滑动窗口和流式设置开展评测。
  legend: OVBench 与 OVO-Bench 是不同基准；论文报告 1,463 个视频、约 7,000 条人工标注、6 类任务和 16 个子任务。
nodes:
  - id: contexts
    label: |-
      定义三种时间上下文
      过去 · 当前 · 未来
      按时间锚定每个查询
      刻画在线视频使用方式
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      制定六类核心任务
      空间与时间感知
      过去记忆 · 幻觉核验
      未来预测 · 共 16 个子任务
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: sources
    label: |-
      整理源数据集
      覆盖六类现实领域
      选择与任务匹配的视频集合
      最终包含 1,463 个视频
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: leakage
    label: |-
      仅使用验证集与测试集
      避免复用训练样本
      降低潜在数据泄漏
      保留多样场景
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: annotations
    label: |-
      复用细粒度标注
      精确时间戳
      边界框与运动轨迹
      动作 · 物体 · 事件
    type: document
    size: xl
    position:
      x: 980
      'y': 40
  - id: templates
    label: |-
      构造逐任务问答
      采用人工生成标注
      应用时空任务模板
      保持查询时刻语义
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: options
    label: |-
      生成流式干扰项
      取自同视频其他时间戳
      匹配相似问题或物体
      加入典型错误回答
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: manual
    label: |-
      执行人工质量检查
      检查问题清晰度
      检查选项歧义
      核验标注准确性
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: trim
    label: |-
      裁剪过长视频上下文
      从最早相关位置开始
      保留回答所需历史
      控制在线视频上下文长度
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: balance
    label: |-
      平衡基准分布
      按视频时长配置题量
      覆盖多样场景
      维持任务类型平衡
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: release
    label: |-
      发布 OVBench
      约 7,000 条标注
      1,463 个视频
      6 类任务 · 16 个子任务
    type: database
    size: xl
    position:
      x: 740
      'y': 420
  - id: settings
    label: |-
      配置两种评测模式
      滑窗：查询前 32 秒
      流式：开头至查询时刻
      统一按 2 FPS 采样
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: inference
    label: |-
      运行离线与在线多模态模型
      提供带时间戳的问题
      预测多项选择答案
      保留逐子任务结果
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      报告准确率
      汇总 16 个子任务
      比较滑窗与流式设置
      分析六类核心能力
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: contexts
    to: tasks
    type: primary
  - from: tasks
    to: sources
    type: primary
  - from: sources
    to: leakage
    type: primary
  - from: leakage
    to: annotations
    type: primary
  - from: annotations
    to: templates
    type: primary
  - from: templates
    to: options
    type: primary
  - from: options
    to: manual
    type: primary
  - from: manual
    to: trim
    type: primary
  - from: trim
    to: balance
    type: primary
  - from: balance
    to: release
    type: primary
  - from: release
    to: settings
    type: primary
  - from: settings
    to: inference
    type: primary
  - from: inference
    to: report
    type: primary
modules: []
