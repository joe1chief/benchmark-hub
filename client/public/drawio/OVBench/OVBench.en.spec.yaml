    label: |-
      Define Temporal Contexts
      Past · Current · Future
      Anchor Every Query in Time
      Model Online Video Use
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      Formulate Six Task Types
      Spatial and Temporal Perception
      Past Memory · Hallucination Check
      Future Prediction · 16 Subtasks
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: sources
    label: |-
      Curate Source Datasets
      Six Real-world Domains
      Task-aligned Video Collections
      1,463 Videos in the Release
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: leakage
    label: |-
      Use Validation and Test Splits
