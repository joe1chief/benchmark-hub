meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OVBench Build and Evaluation Process
  description: >-
    Paper-aligned construction of an online-video benchmark for past, current, and future spatiotemporal understanding,
    followed by sliding-window and streaming evaluation.
  legend: >-
    OVBench is distinct from OVO-Bench: the paper reports 1,463 videos and approximately 7,000 human annotations across
    6 task types and 16 subtasks.
nodes:
