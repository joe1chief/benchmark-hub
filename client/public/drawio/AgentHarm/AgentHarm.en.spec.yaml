meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentHarm Build Process
  description: >-
    Paper-aligned construction of harmful and benign agent tasks, synthetic tools, fine-grained rubrics, and jailbreak
    evaluation based on arXiv:2410.09024.
  legend: >-
    AgentHarm measures successful execution of malicious multi-step tasks, not harmful text alone; narrow semantic
    judges supplement deterministic rubric checks.
nodes:
  - id: taxonomy
    label: |-
      Define Harm Coverage
      11 Categories
      10 Base Behaviors per Category
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: base_behaviors
    label: |-
      Handwrite 110 Base Behaviors
      Explicitly Malicious • Digitally Realizable
      Multi-Step Dependencies • No Real Identities
    type: user
    size: xl
    position:
      x: 320
      'y': 280
  - id: independent_review
    label: |-
      Independent Human Review
      Every Question Checked by
      Someone Other Than Its Author
    type: user
    size: xl
    position:
      x: 600
      'y': 40
  - id: augmentation
    label: |-
      Create Four Harmful Variants
      Detailed • Open-Ended
      Each With and Without a First-Tool Hint
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: benign
    label: |-
      Rewrite Benign Counterparts
      Same Topics and Agent Skills
      Remove Specifically Malicious Intent
    type: process
    size: xl
    position:
      x: 600
      'y': 180
  - id: tools
    label: |-
      Implement 104 Synthetic Tools
      Standalone Inspect Functions
      No Side Effects or Real-World Harm
    type: process
    size: xl
    position:
      x: 600
      'y': 340
  - id: rubrics
    label: |-
      Write Fine-Grained Rubrics
      Target Calls • Order • Arguments
      Narrow Semantic Checks Where Needed
    type: document
    size: xl
    position:
      x: 600
      'y': 500
  - id: package
    label: |-
      Package AgentHarm
      440 Harmful Tasks + Benign Counterparts
      44 Validation • 264 Public • 132 Private
    type: database
    size: xl
    position:
      x: 880
      'y': 300
  - id: run_harmful
    label: |-
      Run Harmful-Agent Evaluation
      Direct Prompt • Forced Tool Call
      Universal Jailbreak Template
    type: process
    size: xl
    position:
      x: 1160
      'y': 180
  - id: run_benign
    label: |-
      Run Benign Capability Control
      Same Agentic Competencies
      Estimate Capability Without Refusals
    type: process
    size: xl
    position:
      x: 1160
      'y': 420
  - id: trace_checks
    label: |-
      Grade Complete Trajectories
      Deterministic Rubric Checks
      Partial Credit Across Criteria
    type: process
    size: xl
    position:
      x: 1440
      'y': 300
  - id: refusal
    label: |-
      Judge Refusals Separately
      Inspect Every Agent Message
      Track Non-Refused Performance
    type: process
    size: xl
    position:
      x: 1440
      'y': 650
  - id: score
    label: |-
      Report AgentHarm Results
      Harm Score • Refusal Rate
      Non-Refusal and Benign Capability
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 650
