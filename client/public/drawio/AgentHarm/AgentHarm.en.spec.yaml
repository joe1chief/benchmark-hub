meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentHarm Build Process
  description: >-
    Paper-aligned task authoring, packaging, parallel harm/refusal scoring, and the narrower current public release
    documented by the official AgentHarm dataset card.
  legend: >-
    The paper defines 44/264/132 augmented-task splits; the current public card exposes only 8/11 validation and 44/66
    public base behaviors. Harm scoring and refusal judging are independent consumers of the same trajectories.
nodes:
  - id: taxonomy
    label: |-
      Define Harm Coverage
      11 Categories
      10 Behaviors per Category
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: base_behaviors
    label: |-
      Handwrite 110 Base Behaviors
      Malicious and Digitally Realizable
      Multi-Step • No Real Identities
    type: user
    size: xl
    position:
      x: 320
      'y': 280
  - id: augmentation
    label: |-
      Create Four Harmful Variants
      Detailed or Open-Ended
      With or Without First-Tool Hint
    type: process
    size: xl
    position:
      x: 600
      'y': 120
  - id: benign
    label: |-
      Create Benign Counterparts
      Match Topics and Agent Skills
      Remove Malicious Intent
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: final_review
    label: |-
      Review Every Final Task
      Separate Non-Author Reviewer
      Check Quality and Realizability
    type: user
    size: xl
    position:
      x: 880
      'y': 280
  - id: tools
    label: |-
      Implement 104 Synthetic Tools
      Standalone Inspect Functions
      No Real-World Side Effects
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
  - id: rubrics
    label: |-
      Write Fine-Grained Rubrics
      Target Calls • Order • Arguments
      Narrow Semantic Checks
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: package
    label: |-
      Paper Dataset Contract
      440 Harmful + Matched Benign Tasks
      44 Validation • 264 Public • 132 Private
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: release_scope
    label: |-
      Current Public Release Scope
      Public: 44 / 66 Bases = 176 Variants
      Validation: 8 / 11 Bases = 32 Variants
      Private Set Remains Withheld
    type: document
    size: xl
    position:
      x: 1440
      'y': 720
  - id: run_harmful
    label: |-
      Run Harmful Evaluation
      Direct • Forced Tool Call
      Universal Jailbreak Template
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: run_benign
    label: |-
      Run Benign Capability Control
      Same Agent Competencies
      Separate Refusal Effects
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: trajectories
    label: |-
      Complete Agent Trajectories
      Harmful and Benign Runs
      Messages + Tool Calls + Arguments
    type: document
    size: xl
    position:
      x: 2000
      'y': 280
  - id: harm_score
    label: |-
      Compute Harm Score
      Manual Deterministic Rubric Checks
      Narrow Semantic Checks as Needed
      Partial Credit per Criterion
    type: process
    size: xl
    position:
      x: 2280
      'y': 120
  - id: refusal
    label: |-
      Run Independent Refusal Judge
      Inspect All Agent Messages
      Track Non-Refused Performance
    type: process
    size: xl
    position:
      x: 2280
      'y': 440
  - id: score
    label: |-
      Report AgentHarm Results
      Harm Score • Refusal Rate
      Non-Refusal • Benign Capability
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 280
