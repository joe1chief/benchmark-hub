meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentHarm Build Process
  description: >-
    Paper-aligned final-task authoring, independent review, tool and rubric packaging, and evaluation from
    arXiv:2410.09024v3 Sections 3.1-3.2 and Section 4.1.
  legend: >-
    Independent review applies after the four harmful variants and matched benign counterparts have become final tasks;
    it is not an early review of only the 110 base behaviors.
nodes:
  - id: taxonomy
    label: |-
      Define Harm Coverage
      11 Categories
      10 Behaviors per Category
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: base_behaviors
    label: |-
      Handwrite 110 Base Behaviors
      Malicious and Digitally Realizable
      Multi-Step • No Real Identities
    type: user
    size: xl
    position:
      x: 320
      'y': 280
  - id: augmentation
    label: |-
      Create Four Harmful Variants
      Detailed or Open-Ended
      With or Without First-Tool Hint
    type: process
    size: xl
    position:
      x: 600
      'y': 120
  - id: benign
    label: |-
      Create Benign Counterparts
      Match Topics and Agent Skills
      Remove Malicious Intent
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: final_review
    label: |-
      Review Every Final Task
      Separate Non-Author Reviewer
      Check Quality and Realizability
    type: user
    size: xl
    position:
      x: 880
      'y': 280
  - id: tools
    label: |-
      Implement 104 Synthetic Tools
      Standalone Inspect Functions
      No Real-World Side Effects
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
  - id: rubrics
    label: |-
      Write Fine-Grained Rubrics
      Target Calls • Order • Arguments
      Narrow Semantic Checks
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: package
    label: |-
      Package AgentHarm
      440 Harmful + Benign Matches
      44 Validation • 264 Public • 132 Private
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: run_harmful
    label: |-
      Run Harmful Evaluation
      Direct • Forced Tool Call
      Universal Jailbreak Template
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: run_benign
    label: |-
      Run Benign Capability Control
      Same Agent Competencies
      Separate Refusal Effects
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: trace_checks
    label: |-
      Grade Complete Trajectories
      Deterministic Rubric Checks
      Partial Credit per Criterion
    type: process
    size: xl
    position:
      x: 2000
      'y': 280
  - id: refusal
    label: |-
      Judge Refusals Separately
      Inspect Every Agent Message
      Track Non-Refused Performance
    type: process
    size: xl
    position:
      x: 2000
      'y': 650
  - id: score
    label: |-
      Report AgentHarm Results
      Harm Score • Refusal Rate
      Non-Refusal • Benign Capability
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 650
edges:
  - from: taxonomy
    to: base_behaviors
    type: primary
  - from: base_behaviors
    to: augmentation
    type: primary
  - from: augmentation
    to: benign
    type: data
  - from: augmentation
    to: final_review
    type: primary
  - from: benign
    to: final_review
    type: data
  - from: final_review
    to: tools
    type: primary
  - from: final_review
    to: rubrics
    type: data
  - from: tools
    to: package
    type: primary
  - from: rubrics
    to: package
    type: data
  - from: package
    to: run_harmful
    type: primary
  - from: package
    to: run_benign
    type: data
  - from: run_harmful
    to: trace_checks
    type: primary
  - from: run_benign
    to: trace_checks
    type: data
  - from: trace_checks
    to: refusal
    type: primary
  - from: refusal
    to: score
    type: primary
modules: []
