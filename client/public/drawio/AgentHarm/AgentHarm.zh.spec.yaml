meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AgentHarm 构建流程
  description: 对齐论文的任务编写与封装、危害和拒答并行评分，以及 AgentHarm 官方数据卡所述较窄的当前公开范围。
  legend: 论文定义 44/264/132 个增强任务划分；当前数据卡仅公开 8/11 个验证基础行为和 44/66 个公开测试基础行为。危害评分与拒答判断独立消费同一批完整轨迹。
nodes:
  - id: taxonomy
    label: |-
      定义危害覆盖范围
      11 个类别
      每类 10 个基础行为
    type: database
    size: xl
    position:
      x: 40
      'y': 280
  - id: base_behaviors
    label: |-
      人工编写 110 个基础行为
      恶意且可数字化执行
      多步骤 • 不含真实身份
    type: user
    size: xl
    position:
      x: 320
      'y': 280
  - id: augmentation
    label: |-
      创建四种有害变体
      详细或开放式
      带或不带首个工具提示
    type: process
    size: xl
    position:
      x: 600
      'y': 120
  - id: benign
    label: |-
      创建良性对应任务
      匹配主题与 Agent 技能
      移除恶意意图
    type: process
    size: xl
    position:
      x: 600
      'y': 440
  - id: final_review
    label: |-
      审核每个最终任务
      由非作者独立审核
      检查质量与可执行性
    type: user
    size: xl
    position:
      x: 880
      'y': 280
  - id: tools
    label: |-
      实现 104 个合成工具
      独立 Inspect 函数
      无真实世界副作用
    type: process
    size: xl
    position:
      x: 1160
      'y': 120
  - id: rubrics
    label: |-
      编写细粒度量规
      目标调用 • 顺序 • 参数
      必要时用窄语义检查
    type: document
    size: xl
    position:
      x: 1160
      'y': 440
  - id: package
    label: |-
      论文数据集合同
      440 个有害任务 + 匹配良性任务
      验证 44 • 公开 264 • 私有 132
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: release_scope
    label: |-
      当前官方卡公开范围
      公开：44 / 66 个基础行为 = 176 个变体
      验证：8 / 11 个基础行为 = 32 个变体
      私有集仍不公开
    type: document
    size: xl
    position:
      x: 1440
      'y': 720
  - id: run_harmful
    label: |-
      运行有害任务评测
      直接提示 • 强制工具调用
      通用越狱模板
    type: process
    size: xl
    position:
      x: 1720
      'y': 120
  - id: run_benign
    label: |-
      运行良性能力对照
      使用相同 Agent 能力
      分离拒答影响
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: trajectories
    label: |-
      完整 Agent 轨迹
      有害与良性任务运行
      消息 + 工具调用 + 参数
    type: document
    size: xl
    position:
      x: 2000
      'y': 280
  - id: harm_score
    label: |-
      计算危害分数
      人工编写的确定性量规检查
      必要时使用窄语义检查
      按准则给予部分分
    type: process
    size: xl
    position:
      x: 2280
      'y': 120
  - id: refusal
    label: |-
      独立运行拒答评审器
      检查所有 Agent 消息
      记录未拒答表现
    type: process
    size: xl
    position:
      x: 2280
      'y': 440
  - id: score
    label: |-
      报告 AgentHarm 结果
      危害分数 • 拒答率
      未拒答与良性能力
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 280
edges:
  - from: taxonomy
    to: base_behaviors
    type: primary
  - from: base_behaviors
    to: augmentation
    type: primary
  - from: augmentation
    to: benign
    type: data
  - from: augmentation
    to: final_review
    type: primary
  - from: benign
    to: final_review
    type: data
  - from: final_review
    to: tools
    type: primary
  - from: final_review
    to: rubrics
    type: data
  - from: tools
    to: package
    type: primary
  - from: rubrics
    to: package
    type: data
  - from: package
    to: run_harmful
    type: primary
  - from: package
    to: run_benign
    type: data
  - from: package
    to: release_scope
    type: data
  - from: run_harmful
    to: trajectories
    type: primary
  - from: run_benign
    to: trajectories
    type: data
  - from: trajectories
    to: harm_score
    type: primary
  - from: trajectories
    to: refusal
    type: data
  - from: harm_score
    to: score
    type: primary
  - from: refusal
    to: score
    type: data
modules: []
