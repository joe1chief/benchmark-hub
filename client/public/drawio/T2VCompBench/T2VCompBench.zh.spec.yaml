meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T2V-CompBench 构建与评测流程
  description: >-
    T2V-CompBench含1400条提示，7个类别各200条：一致属性绑定、动态属性绑定、空间关系、运动绑定、动作绑定、物体交互和生成计数。作者分析167万条去重后的VidProM提示，用WordNet元类组织概念，保留thing类对象而非stuff类，并收集260个名词、200个主动动词和80个属性。GPT-4生成自由文本提示及解析元数据；每条提示都含主动动词，人工随后核验过滤，在适用类别中加入20%的少见困难概念。评测为MLLM指标采6帧，为检测采16帧，为跟踪按每秒8帧处理。Grid-LLaVA基于六帧网格和思维链解耦问题评估一致属性、动作与交互；D-LLaVA逐帧检查动态属性的初始与最终状态；Grounding
    DINO结合几何规则评估空间与计数，SAM和Depth
    Anything辅助三维关系；DOT跟踪前景与背景相对运动。人工验证覆盖651段视频，每段由3名MTurk标注者评分，并以Kendall与Spearman相关选择各类别自动指标。
  legend: >-
    来源：T2V-CompBench arXiv:2407.14505v2 Sections 3-5 and Appendix; official KaiyueSun98/T2V-CompBench repository and
    t2v-compbench-2025 project page。实线箭头表示论文或官方资料明确支持的主流程。
