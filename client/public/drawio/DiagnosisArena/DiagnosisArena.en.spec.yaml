meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DiagnosisArena Build Process
  description: >-
    Paper-aligned medical case collection, diagnostic-only segmentation, iterative difficulty filtering, expert
    verification, and dual-format evaluation.
  legend: Solid arrows trace the 4,175-to-1,113 curation funnel and separate open-ended and multiple-choice scoring protocols.
nodes:
