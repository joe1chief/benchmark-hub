    size: xl
    position:
      x: 1600
      'y': 210
  - id: route
    label: Two evaluation formats
    type: decision
    size: xl
    position:
      x: 1860
      'y': 210
  - id: open
    label: |-
      Open-ended diagnosis
      generate five candidates in confidence order
    type: process
    size: xl
    position:
      x: 2120
      'y': 70
  - id: mcq
    label: |-
      Four-option MCQ
