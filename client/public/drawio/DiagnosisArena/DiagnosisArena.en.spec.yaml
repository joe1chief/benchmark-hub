      2 trials each; any correct → exclude
    type: decision
    size: xl
    position:
      x: 560
      'y': 210
  - id: clues
    label: |-
      AI-expert clue sufficiency
      retain only unanimous reasonable cases
      1,783 advance
    type: decision
    size: xl
    position:
      x: 820
      'y': 210
  - id: consensus
    label: |-
      DeepSeek-R1 verification
      8 samples + voting
