    type: process
    size: xl
    position:
      x: 1080
      'y': 210
  - id: physicians
    label: |-
      Board-certified physician review
      reject missing evidence or ambiguous diagnosis
    type: decision
    size: xl
    position:
      x: 1340
      'y': 210
  - id: benchmark
    label: |-
      DiagnosisArena
      1,113 paired cases · 28 specialties
      mean input length 545.02
