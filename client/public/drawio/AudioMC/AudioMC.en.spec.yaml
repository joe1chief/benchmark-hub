meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AudioMC Paper-Aligned Build Process
  description: Synthetic failure discovery, human recording, final-failure rubrics, and three-stage QC aligned with AudioMC v1.
  legend: >-
    About 65 percent of human attempts use a successful synthetic blueprint; direct human seeds form a second lane, and
    both lanes require an observed final-turn failure.
nodes:
  - id: axes
    label: |-
      Define Four Audio Axes
      Memory • Instruction Retention
      Coherence • Voice Editing
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: seeds
    label: |-
      Sample Synthetic Seeds
      Axis • Topic • Persona
      Set a Maximum Turn Count
    type: document
    size: xl
    position:
      x: 320
      'y': 220
  - id: planner
    label: |-
      Planner Proposes a Challenge
      Tester Produces Audio Turns
      Increase Difficulty after Success
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: synthetic_gate
    label: |-
      Failure before Max Turn?
      Loop While Target Succeeds
      Stop at Failure or Turn Limit
    type: decision
    size: xl
    position:
      x: 880
      'y': 220
  - id: discard
    label: |-
      Discard Non-Failure Attempts
      No Rubrics without Failure
      Record the Exclusion
    type: document
    size: xl
    position:
      x: 1720
      'y': 20
  - id: blueprint
    label: |-
      Keep the Failure Blueprint
      Strategy Rather Than Script
      Guide Human Attempts
    type: document
    size: xl
    position:
      x: 1160
      'y': 220
  - id: direct_human_seed
    label: |-
      Add Direct Human Seeds
      No Synthetic Blueprint
      Independent Creative Attempts
    type: database
    size: xl
    position:
      x: 1160
      'y': 500
  - id: human_recording
    label: |-
      Record Human Conversations
      About 65% Use a Blueprint
      Others Use Direct Seeds
    type: user
    size: xl
    position:
      x: 1440
      'y': 300
  - id: human_gate
    label: |-
      Final Human Turn Fails?
      Judge the Recorded Dialogue
      Keep Only Observed Failures
    type: decision
    size: xl
    position:
      x: 1720
      'y': 300
  - id: rubrics
    label: |-
      Write Final Failure Turn Rubrics
      Atomic • Accurate • Standalone
      Score Only the Last Turn
    type: document
    size: xl
    position:
      x: 1720
      'y': 650
  - id: qc
    label: |-
      Run Three-Stage QC
      Trained Review • Independent QC
      Internal Research Audit
    type: user
    size: xl
    position:
      x: 1440
      'y': 650
  - id: release
    label: |-
      Release 452 Conversations
      47 Speakers • 14.99 Hours
      1,712 Atomic Rubrics
    type: database
    size: xl
    position:
      x: 1160
      'y': 650
  - id: fixed_context
    label: |-
      Seed Fixed Conversation Context
      Generate the Final Reply Only
      Keep History Identical
    type: process
    size: xl
    position:
      x: 880
      'y': 650
  - id: score
    label: |-
      Judge Every Atomic Rubric
      Compute APR and ARS
      Require All Rubrics for APR
    type: process
    size: xl
    position:
      x: 600
      'y': 650
  - id: report
    label: |-
      Report AudioMC Results
      Overall + Four Axes
      Analyze Dialogue Failures
    type: terminal
    size: xl
    position:
      x: 320
      'y': 650
edges:
  - from: axes
    to: seeds
    type: primary
  - from: seeds
    to: planner
    type: primary
  - from: planner
    to: synthetic_gate
    type: primary
  - from: synthetic_gate
    to: planner
    type: optional
    label: Target succeeds
  - from: synthetic_gate
    to: discard
    type: optional
    label: No failure at limit
  - from: synthetic_gate
    to: blueprint
    type: primary
    label: Failure found
  - from: blueprint
    to: human_recording
    type: primary
  - from: direct_human_seed
    to: human_recording
    type: data
  - from: human_recording
    to: human_gate
    type: primary
  - from: human_gate
    to: rubrics
    type: primary
    label: Failure
  - from: human_gate
    to: discard
    type: optional
    label: No failure
  - from: rubrics
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: fixed_context
    type: primary
  - from: fixed_context
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
