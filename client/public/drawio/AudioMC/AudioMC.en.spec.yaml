meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Audio MultiChallenge Build Process
  description: >-
    Paper-aligned audio-native blueprint generation, human conversation collection, quality control, and fixed-context
    evaluation workflow based on arXiv:2512.14865.
  legend: >-
    Synthetic agents discover failure strategies, but the released benchmark audio is recorded by humans in unscripted
    3-8 turn conversations and scored only on the final turn against atomic rubrics.
nodes:
  - id: axes
    label: |-
      Define Four Audio Evaluation Axes
      Inference Memory • Instruction Retention
      Self Coherence • Voice Editing
    type: database
    size: xl
    position:
      x: 40
      'y': 170
  - id: seeds
    label: |-
      Sample Blueprint Seeds
      Evaluation Axis + Topic + Persona
      Include Audio-Cue and Editing Behaviors
    type: document
    size: xl
    position:
      x: 320
      'y': 170
  - id: planner
    label: |-
      Planner Designs a Failure Strategy
      o3 Reasoning Agent
      Increase Complexity after Success
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: tester
    label: |-
      Tester Produces User Prompts
      GPT-4o Text User Agent
      Convert Prompts with GPT-4o-mini TTS
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: synthetic_loop
    label: |-
      Probe Target Audio LMs
      GPT-4o Audio Preview or Gemini 2.5 Pro
      Iterate until Failure or Turn Limit
    type: process
    size: xl
    position:
      x: 880
      'y': 170
  - id: blueprint
    label: |-
      Extract Human-Friendly Blueprint
      Preserve the Axis-Specific Failure Logic
      Provide Strategy, Not a Script
    type: document
    size: xl
    position:
      x: 1160
      'y': 170
  - id: human_recording
    label: |-
      Record Human-in-the-Loop Dialogues
      3-8 Unscripted Turns
      Rewrite, Add Constraints, or Pivot Topics
    type: user
    size: xl
    position:
      x: 1440
      'y': 170
  - id: natural_audio
    label: |-
      Preserve Natural Audio
      Pauses • Noise • Backchannels • Disfluency
      Mid-Utterance and Prior-Turn Corrections
    type: process
    size: xl
    position:
      x: 1440
      'y': 500
  - id: rubrics
    label: |-
      Write Final-Turn Rubrics
      Atomic • Accurate • Self-Contained
      Mutually Exclusive Where Required
    type: document
    size: xl
    position:
      x: 1160
      'y': 500
  - id: qc
    label: |-
      Run Three-Stage Quality Control
      Trained Reviewers • Independent QC
      Internal Research-Team Audit
    type: user
    size: xl
    position:
      x: 880
      'y': 500
  - id: release
    label: |-
      Release Audio MultiChallenge
      452 Conversations • 47 Speakers • 15 Hours
      1,712 Instance-Specific Rubrics
    type: database
    size: xl
    position:
      x: 600
      'y': 500
  - id: fixed_context
    label: |-
      Seed the Fixed Conversation Context
      User Turns as Base64 Audio
      Assistant Turns as Raw Text
    type: process
    size: xl
    position:
      x: 320
      'y': 500
  - id: final_turn
    label: |-
      Generate Only the Final Response
      Identical History for Every Model
      Avoid Sequential Conversation Drift
    type: process
    size: xl
    position:
      x: 40
      'y': 500
  - id: judge
    label: |-
      Judge Every Atomic Criterion
      LLM-as-a-Judge over Text Response
      Binary Rubric Satisfaction
    type: process
    size: xl
    position:
      x: 40
      'y': 790
  - id: metrics
    label: |-
      Compute APR and ARS
      APR Requires All Rubrics per Task
      ARS Averages Criterion Satisfaction
    type: process
    size: xl
    position:
      x: 320
      'y': 790
  - id: report
    label: |-
      Report Audio Dialogue Gaps
      Overall and Four-Axis Results
      Analyze Audio Duration and Cue Retention
    type: terminal
    size: xl
    position:
      x: 600
      'y': 790
edges:
  - from: axes
    to: seeds
    type: primary
  - from: seeds
    to: planner
    type: primary
  - from: seeds
    to: tester
    type: data
  - from: planner
    to: synthetic_loop
    type: primary
  - from: tester
    to: synthetic_loop
    type: primary
  - from: synthetic_loop
    to: blueprint
    type: primary
  - from: blueprint
    to: human_recording
    type: primary
  - from: human_recording
    to: natural_audio
    type: primary
  - from: natural_audio
    to: rubrics
    type: primary
  - from: rubrics
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: fixed_context
    type: primary
  - from: fixed_context
    to: final_turn
    type: primary
  - from: final_turn
    to: judge
    type: primary
  - from: judge
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
