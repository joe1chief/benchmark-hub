meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AudioMC 构建流程
  description: 基于 arXiv:2512.14865，对齐 Audio MultiChallenge 的轴设计、agentic 失败蓝图、人机协同录音、 rubric 质检和固定上下文评测流程。
  legend: 实线表示数据构建和评测主流程；虚线表示质检、蓝图修订和评判一致性反馈。
nodes:
  - id: axes
    label: |-
      音频原生轴
      IM、IR、SC
      新增语音编辑
    type: document
    size: xl
    position:
      x: 40
      'y': 160
  - id: taxonomy
    label: |-
      轴-主题-人设
      人工整理分类
      目标失败模式
    type: database
    size: xl
    position:
      x: 300
      'y': 70
  - id: agentic_loop
    label: |-
      Agentic 蓝图循环
      Planner、Tester、TTS
      触发音频模型失败
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: blueprint
    label: |-
      人类可用蓝图
      提取核心陷阱
      轴专属指引
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: human_audio
    label: |-
      人类录音
      3 到 8 轮
      无脚本自然语音
    type: terminal
    size: xl
    position:
      x: 820
      'y': 70
  - id: rubrics
    label: |-
      原子 Rubric
      最终轮二元标准
      只衡量目标轴
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: qc
    label: |-
      三阶段质检
      训练 Reviewer
      独立团队审核
    type: decision
    size: xl
    position:
      x: 1080
      'y': 160
  - id: dataset
    label: |-
      AudioMC 数据集
      452 段对话
      47 说话人 / 1,712 Rubric
    type: database
    size: xl
    position:
      x: 1340
      'y': 70
  - id: evaluation
    label: |-
      固定上下文评测
      base64 音频历史
      o4 Mini 判分 APR/ARS
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
edges:
  - from: axes
    to: taxonomy
    type: primary
  - from: taxonomy
    to: agentic_loop
    type: primary
  - from: agentic_loop
    to: blueprint
    type: primary
  - from: blueprint
    to: human_audio
    type: primary
  - from: human_audio
    to: rubrics
    type: primary
  - from: rubrics
    to: qc
    type: primary
  - from: qc
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
  - from: qc
    to: human_audio
    type: optional
    label: 修订任务
  - from: evaluation
    to: rubrics
    type: optional
    label: 评判一致性审核
modules: []
