meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AudioMC 论文对齐构建流程
  description: 依据 AudioMC v1，展示合成失败发现、人工录制、最终失败轮量规与三阶段质量控制。
  legend: 约 65% 的人工尝试使用成功的合成蓝图；直接人工种子构成第二条路径，且两条路径都必须观察到最终轮失败。
nodes:
  - id: axes
    label: |-
      定义四个音频维度
      记忆 • 指令保持
      连贯性 • 语音编辑
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: seeds
    label: |-
      采样合成种子
      维度 • 主题 • 人设
      设置最大轮数
    type: document
    size: xl
    position:
      x: 320
      'y': 220
  - id: planner
    label: |-
      Planner 提出挑战策略
      Tester 生成音频轮次
      目标成功后增加难度
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: synthetic_gate
    label: |-
      失败是否早于最大轮数？
      目标成功时继续循环
      失败或达到轮数上限时停止
    type: decision
    size: xl
    position:
      x: 880
      'y': 220
  - id: discard
    label: |-
      丢弃未失败的尝试
      无失败则不生成量规
      记录排除原因
    type: document
    size: xl
    position:
      x: 1720
      'y': 20
  - id: blueprint
    label: |-
      保留失败蓝图
      提供策略而非脚本
      指导人工尝试
    type: document
    size: xl
    position:
      x: 1160
      'y': 220
  - id: direct_human_seed
    label: |-
      加入直接人工种子
      不使用合成蓝图
      独立创作尝试
    type: database
    size: xl
    position:
      x: 1160
      'y': 500
  - id: human_recording
    label: |-
      录制人工对话
      约 65% 使用合成蓝图
      其余使用直接人工种子
    type: user
    size: xl
    position:
      x: 1440
      'y': 300
  - id: human_gate
    label: |-
      人工最终轮失败？
      判断已录制对话
      仅保留观察到的失败
    type: decision
    size: xl
    position:
      x: 1720
      'y': 300
  - id: rubrics
    label: |-
      编写最终失败轮量规
      原子化 • 准确 • 自包含
      仅评分最后一轮
    type: document
    size: xl
    position:
      x: 1720
      'y': 650
  - id: qc
    label: |-
      运行三阶段质检
      训练后评审 • 独立质检
      内部研究团队审核
    type: user
    size: xl
    position:
      x: 1440
      'y': 650
  - id: release
    label: |-
      发布 452 段对话
      47 名说话人 • 14.99 小时
      1,712 条原子量规
    type: database
    size: xl
    position:
      x: 1160
      'y': 650
  - id: fixed_context
    label: |-
      注入固定对话上下文
      只生成最终轮回答
      保持历史完全一致
    type: process
    size: xl
    position:
      x: 880
      'y': 650
  - id: score
    label: |-
      逐条判断原子量规
      计算 APR 与 ARS
      APR 要求全部量规通过
    type: process
    size: xl
    position:
      x: 600
      'y': 650
  - id: report
    label: |-
      报告 AudioMC 结果
      总体与四维度结果
      分析对话失败
    type: terminal
    size: xl
    position:
      x: 320
      'y': 650
edges:
  - from: axes
    to: seeds
    type: primary
  - from: seeds
    to: planner
    type: primary
  - from: planner
    to: synthetic_gate
    type: primary
  - from: synthetic_gate
    to: planner
    type: optional
    label: 目标成功
  - from: synthetic_gate
    to: discard
    type: optional
    label: 到上限仍未失败
  - from: synthetic_gate
    to: blueprint
    type: primary
    label: 发现失败
  - from: blueprint
    to: human_recording
    type: primary
  - from: direct_human_seed
    to: human_recording
    type: data
  - from: human_recording
    to: human_gate
    type: primary
  - from: human_gate
    to: rubrics
    type: primary
    label: 失败
  - from: human_gate
    to: discard
    type: optional
    label: 未失败
  - from: rubrics
    to: qc
    type: primary
  - from: qc
    to: release
    type: primary
  - from: release
    to: fixed_context
    type: primary
  - from: fixed_context
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
