meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedAlign Build Process
  description: >-
    Paper-aligned three-stage clinician curation, OMOP-to-XML EHR preparation, BM25 pairing, expert references,
    six-model generation, and blinded clinical evaluation for MedAlign.
  legend: >-
    Solid arrows trace 1,314 raw instructions to 983, BM25 top-five retrieval over 77,200 patients, 303 relevant pairs
    and references, 276 EHRs, and human plus automated metrics.
nodes:
  - id: ehr
    label: |-
      Prepare Longitudinal EHRs
      Include Structured · Text Events
      Represent Data in OMOP CDM
      Convert Each Record to One XML
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: recruit
    label: |-
      Recruit Clinician Authors
      Fifteen Practicing Clinicians
      Cover Seven Medical Specialties
      Submit through an Online Form
    type: user
    size: xl
    position:
      x: 260
      'y': 40
  - id: collect
    label: |-
      Stage 1 · Collect Instructions
      Imagine Daily EHR Workflows
      Submit 1,314 Queries or Commands
      Add Patient and Clinical Context
    type: document
    size: xl
    position:
      x: 500
      'y': 40
  - id: dedup
    label: |-
      Clean and Tag Instructions
      Near-duplicate if ROUGE-L over 0.7
      Retain 983 after Deduplication
      Mark 407 Generally Applicable
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: query
    label: |-
      Stage 2 · Build Search Queries
      Use Generally Applicable Items
      Append Patient and Clinical Metadata
      Compare Random and BM25Okapi
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: retrieve
    label: |-
      Retrieve Relevant Patient EHRs
      Search a 77,200-patient Subsample
      Return BM25 Top Five per Query
      Reuse the Pool for Random Baseline
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: relevance
    label: |-
      Manually Judge Pair Relevance
      Authors Apply a Binary Review
      303 Queries Have a Relevant Top Five
      BM25 74% versus Random 38%
    type: decision
    size: xl
    position:
      x: 1460
      'y': 40
  - id: response
    label: |-
      Stage 3 · Write Expert Responses
      Prefer Same-specialty Non-authors
      Check Feasibility and Sufficiency
      Answer at the Latest EHR Timestamp
    type: user
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      Release the MedAlign Contract
      983 Clinical Instructions
      303 Expert Reference Responses
      Grounded in 276 Distinct EHRs
    type: database
    size: xl
    position:
      x: 1220
      'y': 420
  - id: models
    label: |-
      Run Six General-domain LLMs
      Include Closed and Open Models
      Reserve 256 Tokens for Output
      Retain the Most Recent EHR Context
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: mr
    label: |-
      Handle Long-record Context
      Over 80% Exceed 32k Tokens
      Refine Sequentially over 30k Chunks
      Update or Keep the Prior Response
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: human
    label: |-
      Blind Nine Clinician Evaluators
      Mark Clinical Correctness Binary
      Rank Relevance and Appropriateness
      Allow Ties · Shuffle Model Order
    type: user
    size: xl
    position:
      x: 500
      'y': 420
  - id: automated
    label: |-
      Run Automated NLG Metrics
      COMET · BERTScore · METEOR
      Add chrF · BLEU · ROUGE and More
      Derive Metric-based Rankings
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: report
    label: |-
      Aggregate Human and Auto Results
      Report Correct · Win Rate · Rank
      Compute Kendall Tau with Humans
      Analyze Context-length Effects
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: ehr
    to: recruit
    type: primary
  - from: recruit
    to: collect
    type: primary
  - from: collect
    to: dedup
    type: primary
  - from: dedup
    to: query
    type: primary
  - from: query
    to: retrieve
    type: primary
  - from: retrieve
    to: relevance
    type: primary
  - from: relevance
    to: response
    type: primary
  - from: response
    to: release
    type: primary
  - from: release
    to: models
    type: primary
  - from: models
    to: mr
    type: primary
  - from: mr
    to: human
    type: primary
  - from: human
    to: automated
    type: primary
  - from: automated
    to: report
    type: primary
modules: []
