  - from: catalog
    to: release
    type: optional
    label: All 983 instruction records
    labelPosition: end
    waypoints:
      - x: 1100
        'y': 250
      - x: 1100
        'y': 300
  - from: release
    to: release_boundary
    type: optional
    label: Restricted and drifted release
    labelPosition: end
  - from: release
    to: evaluation
    type: primary
  - from: evaluation
    to: context_gate
    type: primary
  - from: context_gate
