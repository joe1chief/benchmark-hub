meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SceneBench 构建与评测流程
  description: >-
    SceneBench是LongCat-Image报告内部Poster&SceneBench评测中的自然场景文字部分，并非另一个同名Scene-Bench数据集。作者联合整理500条覆盖海报排版和自然场景文字的提示，但没有披露场景子集的数量划分、来源配比、标注者或质检过程。自然场景样例关注把文字无缝融入真实环境，例如纹理表面的标牌、复杂光照下的店面。模型按提示生成图像，表8分别报告Poster、Real
    Scene及其平均分；报告没有披露这些内部得分的评分器、量表或精确聚合协议。
  legend: 来源：LongCat-Image arXiv:2512.07584 Section 5.1 Poster&SceneBench and Table 8。实线箭头表示论文或官方资料明确支持的主流程。
