  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SceneBench Build and Evaluation Process
  description: >-
    SceneBench is the natural-scene-text portion of the internal Poster&SceneBench evaluation in the LongCat-Image
    report, not the unrelated Scene-Bench dataset. The authors curate 500 prompts jointly covering poster typography and
    natural scene text; they do not disclose the split count, source mixture, annotators, or quality-control procedure
    for the scene subset. Natural-scene cases target seamless text integration into real environments such as signage on
    textured surfaces and shop fronts under complex lighting. Models generate images for the prompts, and Table 8
    reports separate Poster and Real Scene scores plus their average. The report does not disclose the scorer, rubric,
    or exact aggregation protocol behind those internal scores.
  legend: >-
    Source: LongCat-Image arXiv:2512.07584 Section 5.1 Poster&SceneBench and Table 8. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
