meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LABBench2 构建流程
  description: 对齐论文的 1,912 个真实生物研究任务构建流程，通过并行的专家与计算构建路线、任务专用质检、 多模态输入方式、工具增强评测和验证器完成。
  legend: 两个构建路线方框并行汇入同一数据集。图像与表格任务的数量包含同一组 101/100 个问题的 图像、完整论文和自主检索三种变体。
nodes:
  - id: scope
    label: |-
      定义五类真实科研能力
      文献理解与检索
      数据访问 · 分子生物学
      实验方案排错 · 实验规划
    type: document
    size: xl
    position:
      x: 20
      'y': 200
  - id: expert_track
    label: |-
      专家编写路线 · 1,426 个任务
      文献 · 专利 · 临床试验 · 补充材料 · 来源质量
      图像 101×3 · 表格 100×3
      实验方案 125 · 克隆规划 14
    type: user
    size: xl
    position:
      x: 300
      'y': 40
  - id: computational_track
    label: |-
      混合与程序构建路线 · 486 个任务
      数据访问 86：分析 1,000 篇预印本
      专家整理 43 个数据源
      序列任务：20 个模板 × 20 个变体 = 400
    type: process
    size: xl
    position:
      x: 300
      'y': 380
  - id: review
    label: |-
      应用任务专用质量控制
      签约专家与内部专家多轮审核
      检查是否只能由指定来源回答
      验证模板、答案与验证器
    type: user
    size: xl
    position:
      x: 620
      'y': 200
  - id: dataset
    label: |-
      汇总 LABBench2 · 1,912 个任务
      开放式科研问题
      科学论文 · 图像 · 数据文件
      来源、标准答案与评分器元数据
    type: database
    size: xl
    position:
      x: 940
      'y': 200
  - id: modes
    label: |-
      生成真实输入方式
      图表：图像 · 完整论文 · 自主检索
      序列：内嵌 · 文件 · 自主检索
      文献与数据库任务要求自主检索
    type: process
    size: xl
    position:
      x: 1260
      'y': 200
  - id: evaluate
    label: |-
      评测基础与工具增强系统
      首先在无工具条件运行
      再提供网络搜索与代码执行
      传递文件和检索到的上下文
    type: process
    size: xl
    position:
      x: 1580
      'y': 200
  - id: graders
    label: |-
      应用任务专用验证
      开放答案与来源一致性评分器
      序列任务的计算机模拟验证器
      解析克隆领域语言并端到端验证
    type: process
    size: xl
    position:
      x: 1580
      'y': 560
  - id: report
    label: |-
      汇报 LABBench2 准确率
      五类科研能力得分
      基础系统与工具增强系统对比
      输入方式与子任务拆分
    type: terminal
    size: xl
    position:
      x: 1260
      'y': 560
