meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DeepResearch Bench 构建与评测流程
  description: 对 USTC DeepResearch Bench 的论文 v1 数据构建与最终报告评测进行版本钉住，并保留精确的 RACE/FACT 公式、人类验证、黑箱轨迹边界和论文后裁判漂移。
  legend: 实线是论文 v1 协议；虚线传递来源、人类验证或被排除的版本漂移。
