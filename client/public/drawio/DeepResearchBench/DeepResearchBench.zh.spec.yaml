      论文 arXiv:2506.11763v1
      初始代码 @ 214741e
      查询 SHA256 62b197a…
      HF 产物 @ f7d27cd
    type: document
    size: xl
    position:
      x: 40
      'y': 320
  - id: version_drift
    label: |-
      论文后漂移 · 不纳入本图主流程
      main @ 469cce5 · 2026-05-11
      RACE GPT-5.5
      FACT GPT-5.4-mini
      旧 Gemini 分支 @ a5bbbe8
    type: document
    size: xl
    position:
      x: 300
      'y': 20
  - id: queries
    label: |-
      96,147 条真实用户查询
      联网搜索聊天机器人日志
      内部需求样本
    type: database
    size: xl
    position:
      x: 300
      'y': 320
  - id: privacy
    label: |-
      隐私匿名化
      移除用户标识与 IP 地址
      移除会话元数据
    type: process
    size: xl
    position:
      x: 560
      'y': 320
  - id: filter
    label: |-
      DeepSeek-V3-0324 过滤
      多轮搜索与信息收集
      分析并生成高质量报告
      保留 44,019 条查询
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: distribution
    label: |-
      WebOrganizer 分类体系
      DeepSeek-V3-0324 分类
      22 领域需求分布
    type: process
    size: xl
    position:
      x: 1080
      'y': 320
  - id: quota
    label: |-
      按比例压缩
      保持主题分布平衡
      确定 100 题领域配额
    type: process
    size: xl
    position:
      x: 1340
      'y': 320
  - id: experts
    label: |-
      博士或资深从业者
      至少 5 年领域经验
      提出前沿研究任务
    type: user
    size: xl
    position:
      x: 1600
      'y': 320
  - id: screen
    label: |-
      人工筛选与迭代修改
      质量 · 清晰度 · 复杂度
      真实性 · 深度研究匹配度
    type: process
    size: xl
    position:
      x: 1860
      'y': 320
  - id: benchmark
    label: |-
      DeepResearch Bench v1
      100 题 · 22 领域
      中文 50 + 英文 50
      每题均为单语
      评测提示 · 无训练/开发/测试划分
    type: database
    size: xl
    position:
      x: 2120
      'y': 320
  - id: agent
    label: |-
      外部研究智能体
      搜索轨迹由系统自行决定
      基准不标注内部轨迹
      只评最终带引用报告
    type: process
    size: xl
    position:
      x: 2380
      'y': 320
  - id: route
    label: |-
      两个互补的
      论文 v1 评测器
      报告质量 + 检索证据支撑
    type: decision
    size: xl
    position:
      x: 2640
      'y': 320
  - id: race_rubric
    label: |-
      论文 RACE · Gemini-2.5-pro
      COMP · DEPTH · INST · READ
      维度权重取 T 次试验均值
      任务特定评分标准
      标准权重之和为 1
    type: process
    size: xl
    position:
      x: 2900
      'y': 20
  - id: race_score
    label: |-
      参考：Gemini DR · 2025 年 4 月
      商业模型迭代无法确认
      加权 S_int(tgt), S_int(ref)
      S_final = S_int(tgt) /
      [S_int(tgt) + S_int(ref)]
    type: process
    size: xl
    position:
      x: 3160
      'y': 20
  - id: fact_extract
    label: |-
      论文 FACT · Gemini-2.5-flash
      提取陈述—链接对
      同一事实 + 同一链接
      去重后只保留一条
    type: process
    size: xl
    position:
      x: 2900
      'y': 400
  - id: fact_verify
    label: |-
      通过 Jina Reader 获取网页
      裁判判断证据是否支撑
      二元结果：支持 / 不支持
    type: process
    size: xl
    position:
      x: 3160
      'y': 400
  - id: fact_metrics
    label: |-
      Acc_t = N_s,t/N_u,t；无链接对则为零
      C. Acc = 对 Acc_t 取均值
      E. Cit = 求和 N_s,t / |T|
      只统计唯一且被支持的链接对
    type: process
    size: xl
    position:
      x: 3420
      'y': 400
  - id: human
    label: |-
      人类验证 · 50 个中文任务
      4 个智能体 × 每题 3 位专家
      70+ 位硕士领域专家
      225 人时 · 每人最多 3 个问题
      ICC ≥ 0 后保留 37 题
    type: user
    size: xl
    position:
      x: 3420
      'y': 700
  - id: report
    label: |-
      DeepResearch Bench 报告
      RACE 相对质量分
      引用准确率 · 有效引用数
      人类一致性证据
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 260
