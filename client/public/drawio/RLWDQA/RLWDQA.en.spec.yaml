meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RLWDQA Result-only Disclosure and Build-process Boundary
  description: >-
    Evidence-bounded audit of every RLWDQA occurrence in the Qwen3-VL Technical Report. The report exposes only two
    ablation-table result columns; it provides no standalone benchmark citation or reconstructible construction and
    evaluation procedure.
  legend: >-
    Solid arrows connect the two disclosed ablation contexts to their reported RLWDQA values. Dashed arrows identify
    evidence and disclosure boundaries; they are not inferred construction steps.
nodes:
