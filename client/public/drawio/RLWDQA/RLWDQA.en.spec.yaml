    label: |-
      Qwen3-VL Technical Report
      arXiv 2511.21631v2
      PDF SHA256 ee075d08e67d
      LaTeX TAR 4ce6bd67718d
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 8 }
  - id: occurrence_audit
    label: |-
      Full LaTeX Search
      Exactly Two RLWDQA Tokens
      Both Are Table Headers
      No Citation or Definition
    type: process
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: vit_context
    label: |-
      Table 11 · ViT Ablation
      Same 1.7B Qwen3 LLM
      1.5T-token Training
      Downstream VLM Comparison
    type: process
    size: xl
    position: { x: 500, y: 80 }
    style: { fontSize: 9 }
  - id: vit_result
    label: |-
      RLWDQA Result Only
      SigLIP-2 58.7
      Qwen3-ViT 66.1
      Metric Name Unstated
    type: terminal
    size: xl
    position: { x: 740, y: 80 }
    style: { fontSize: 9 }
