meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "ST-VQA Build and Evaluation Process"
  description: "ST-VQA combines 23,038 natural images from seven public vision datasets with 31,791 question-answer pairs. Images are selected to contain scene text, then crowd workers write questions whose answers are grounded in that text and the annotations are validated. The challenge publishes train and test data and defines three increasingly difficult settings: a small per-image answer dictionary, one shared 30,000-word dictionary built from roughly 22,000 ground-truth words plus 8,000 distractors, and an open-dictionary end-to-end task. All three are evaluated with Average Normalized Levenshtein Similarity, which gives partial credit for OCR-like edit errors and zeroes similarities below the official threshold."
  legend: "Source: ST-VQA arXiv:1905.13648 Sections 3-4, ICDAR competition arXiv:1907.00490, and official RRC challenge 11 task definitions. Solid arrows show the main flow explicitly supported by the paper or official documentation."
