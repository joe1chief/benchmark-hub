  title: "ST-VQA 构建与评测流程"
  description: "ST-VQA汇集7个公开视觉数据集中的23,038张自然图像，并标注31,791组问答。图像需包含场景文字，众包标注者据图中文字编写问题和答案，再进行验证。挑战发布训练与测试数据，并定义难度递增的三种设置：每张图一个较小答案词典、由约2.2万个标准答案词和8000个干扰词组成的3万词全局词典，以及无候选答案的开放词典端到端任务。三项任务统一使用平均归一化Levenshtein相似度，允许OCR式编辑误差获得部分分，并按官方阈值把低相似度置零。"
  legend: "来源：ST-VQA arXiv:1905.13648 Sections 3-4, ICDAR competition arXiv:1907.00490, and official RRC challenge 11 task definitions。实线箭头表示论文或官方资料明确支持的主流程。"
