meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlpacaEval 2.0 Evaluation Process
  description: >-
    The fixed 805-instruction pairwise evaluation randomizes output order only before judging, then restores the
    candidate/baseline direction before weighted and length-controlled win rates. Parallel evidence nodes disclose the
    paper-v2 L2 specification and pinned alpaca_eval 0.6.6 L1 implementation without treating them as one version.
  legend: >-
    Solid arrows are the shared evaluation semantics. Dashed evidence branches record source-specific fitting details
    and validation results; neither silently replaces the other.
nodes:
  - id: instructions
    label: |-
      Fixed Instruction Set
      805 AlpacaEval Prompts
    type: document
    size: large
    position:
      x: 40
      'y': 250
  - id: baseline
    label: |-
      Baseline Responses
      gpt-4-1106-preview
      Same 805 Instructions
    type: process
    size: large
    position:
      x: 280
      'y': 70
  - id: candidate
    label: |-
      Candidate Responses
      Evaluated Model Outputs
      Same 805 Instructions
    type: process
    size: large
    position:
      x: 280
      'y': 430
  - id: evaluator
    label: |-
      weighted_alpaca_eval_gpt4_turbo
      Randomize A/B Only Before Judging
      Single-Token Judge • Token Logprobs
    type: process
    size: xl
    position:
      x: 520
      'y': 250
    style:
      fontSize: 10
  - id: restore_direction
    label: |-
      Restore Candidate/Baseline
      Direction After Parsing
      If Swapped: preference ← 3 − preference
      Undo `output_1` / `output_2` Column Swap
    type: process
    size: xl
    position:
      x: 800
      'y': 250
    style:
      fontSize: 10
  - id: preferences
    label: |-
      Restored Preferences
      Baseline = `output_1`
      Candidate = `output_2`
      Candidate Win Probability = preference − 1
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
    style:
      fontSize: 10
  - id: raw_weighted
    label: |-
      Weighted Win Rate
      Mean of (Preference − 1)
      Candidate Win Semantics • 805 Instructions
    type: terminal
    size: large
    position:
      x: 1360
      'y': 60
  - id: glm
    label: |-
      Antisymmetric GLM
      Model Identity + Output Length
      Instruction Difficulty
    type: formula
    size: xl
    position:
      x: 1360
      'y': 300
  - id: paper_l2
    label: |-
      Paper v2 Statistical Specification
      5-fold CV • L2 Regularization
      Source: arXiv:2404.04475v2
    type: document
    size: xl
    position:
      x: 1640
      'y': 110
    style:
      fontSize: 10
  - id: official_l1
    label: |-
      Official 0.6.6 @ cd543a149df89434
      5-fold CV • L1 • liblinear
      Pinned glm_winrate.py Implementation
    type: document
    size: xl
    position:
      x: 1640
      'y': 500
    style:
      fontSize: 10
  - id: lc_counterfactual
    label: |-
      Length-Controlled Counterfactual
      Set the Length Term to Zero
      Retain Model and Instruction Terms
    type: process
    size: xl
    position:
      x: 1920
      'y': 300
  - id: semantics
    label: |-
      Candidate Win Semantics
      Self Comparison = 50%
      Swap Symmetry After Restoration
    type: document
    size: large
    position:
      x: 2200
      'y': 300
  - id: validation
    label: |-
      Paper Validation
      Gameability: 25% → 10%
      Arena ρ: .94 → .98
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 170
