meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlpacaEval 2.0 Build Process
  description: >-
    Paper-aligned AlpacaEval 2.0 workflow: 805 fixed instructions produce randomized GPT-4-Turbo pairwise judgments; the
    standard win rate and a regularized antisymmetric GLM yield raw and length-controlled scores, which are checked for
    win-rate semantics, lower verbosity gameability, and stronger Chatbot Arena agreement.
  legend: >-
    Solid arrows show response generation, judging, and score estimation; dashed arrows compare raw and
    length-controlled metrics against robustness and human-preference evidence.
