meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlpacaEval 2.0 构建流程
  description: 基于 arXiv:2404.04475 重绘的 AlpacaEval 2.0 成对自动评测与长度控制胜率流程。
  legend: 实线表示成对评测与长度控制胜率计算主流程；虚线表示与人类偏好基准的验证关系。
nodes:
  - id: instructions
    label: |-
      固定指令集
      805 条 Alpaca 演示提示
      覆盖用户交互
    type: document
    size: xl
    position:
      x: 40
      'y': 160
  - id: baseline
    label: |-
      基线模型回复
      GPT-4 turbo 基线
      每条指令一个回答
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: candidate
    label: |-
      候选模型回复
      待评估模型输出
      同一 805 条指令
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: evaluator
    label: |-
      GPT-4 turbo 评审器
      成对比较回复
      输出偏好概率
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: win_rate
    label: |-
      标准胜率
      期望偏好概率
      汇总 805 条指令
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: glm
    label: |-
      偏差控制 GLM
      模型身份
      长度差异与指令难度
    type: formula
    size: xl
    position:
      x: 820
      'y': 250
  - id: lc_win_rate
    label: |-
      长度控制胜率
      将长度差异设为零
      得到反事实偏好
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 160
  - id: validation
    label: |-
      鲁棒性验证
      降低长度可操纵性
      Chatbot Arena 相关性 0.98
    type: document
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: instructions
    to: baseline
    type: primary
  - from: instructions
    to: candidate
    type: primary
  - from: baseline
    to: evaluator
    type: primary
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: win_rate
    type: primary
  - from: evaluator
    to: glm
    type: data
  - from: glm
    to: lc_win_rate
    type: primary
  - from: lc_win_rate
    to: validation
    type: optional
    label: 对照人类偏好验证
modules: []
