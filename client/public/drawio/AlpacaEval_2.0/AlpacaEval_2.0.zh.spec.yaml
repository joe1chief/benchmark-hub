meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlpacaEval 2.0 构建流程
  description: >-
    论文对齐的 AlpacaEval 2.0 流程：805 条固定指令产生随机顺序的 GPT-4-Turbo 成对判断；标准胜率与带正则的 反对称 GLM 分别给出原始分和长度控制分，并验证胜率语义、降低长度可操纵性及提升与
    Chatbot Arena 的一致性。
  legend: 实线表示回复生成、评审与分数估计；虚线表示原始指标和长度控制指标与稳健性及人类偏好证据的对照。
nodes:
  - id: instructions
    label: |-
      固定指令集
      805 条 Alpaca 提示
    type: document
    size: large
    position:
      x: 40
      'y': 220
  - id: baseline
    label: |-
      基线回复
      GPT-4-1106-Preview
    type: process
    size: large
    position:
      x: 240
      'y': 60
  - id: candidate
    label: |-
      候选模型回复
      同一 805 条提示
    type: process
    size: large
    position:
      x: 240
      'y': 380
  - id: evaluator
    label: |-
      GPT-4-Turbo 评审
      随机呈现顺序
    type: process
    size: large
    position:
      x: 440
      'y': 220
  - id: ratings
    label: |-
      成对偏好结果
      每题偏好概率
    type: database
    size: large
    position:
      x: 640
      'y': 220
  - id: raw_win
    label: |-
      标准胜率
      805 题均值
    type: terminal
    size: large
    position:
      x: 840
      'y': 40
  - id: glm
    label: |-
      反对称 GLM
      模型 + 长度 + 题目
    type: formula
    size: large
    position:
      x: 840
      'y': 260
  - id: regularize
    label: |-
      拟合与正则化
      五折交叉验证 + L2
    type: process
    size: large
    position:
      x: 1040
      'y': 260
  - id: lc_win
    label: |-
      长度控制胜率
      长度项置零
    type: terminal
    size: large
    position:
      x: 1240
      'y': 260
  - id: semantics
    label: |-
      保持胜率语义
      自比 50%；交换对称
    type: document
    size: large
    position:
      x: 1440
      'y': 260
  - id: validation
    label: |-
      外部验证
      可操纵性 25% → 10%
      Arena ρ：.94 → .98
    type: terminal
    size: xl
    position:
      x: 1700
      'y': 140
edges:
  - from: instructions
    to: baseline
    type: primary
  - from: instructions
    to: candidate
    type: primary
  - from: baseline
    to: evaluator
    type: primary
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: ratings
    type: primary
  - from: ratings
    to: raw_win
    type: primary
  - from: ratings
    to: glm
    type: primary
  - from: glm
    to: regularize
    type: primary
  - from: regularize
    to: lc_win
    type: primary
  - from: lc_win
    to: semantics
    type: primary
  - from: raw_win
    to: validation
    type: optional
  - from: semantics
    to: validation
    type: optional
modules: []
