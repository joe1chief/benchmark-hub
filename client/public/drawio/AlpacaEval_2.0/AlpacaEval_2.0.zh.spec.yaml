meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AlpacaEval 2.0 评测流程
  description: 固定 805 条指令的成对评测仅在送审前随机交换输出顺序，解析后恢复候选/基线方向，再计算加权胜率与长度控制胜率；并列证据节点分别披露论文 v2 的 L2 规范与固定版本 alpaca_eval 0.6.6 的 L1 实现。
  legend: 实线表示共同评测语义；虚线证据分支记录不同来源的拟合细节与验证结果，任何一条都不会悄然替代另一条。
nodes:
  - id: instructions
    label: |-
      固定指令集
      805 条 AlpacaEval 提示
    type: document
    size: large
    position:
      x: 40
      'y': 250
  - id: baseline
    label: |-
      基线回复
      gpt-4-1106-preview
      使用同一 805 条指令
    type: process
    size: large
    position:
      x: 280
      'y': 70
  - id: candidate
    label: |-
      候选模型回复
      被测模型输出
      使用同一 805 条指令
    type: process
    size: large
    position:
      x: 280
      'y': 430
  - id: evaluator
    label: |-
      weighted_alpaca_eval_gpt4_turbo
      仅在送审前随机交换 A/B
      单 token 评审 • token logprob
    type: process
    size: xl
    position:
      x: 520
      'y': 250
    style:
      fontSize: 10
  - id: restore_direction
    label: |-
      恢复候选/基线方向
      仅在解析后执行
      若已交换：偏好值 ← 3 − 偏好值
      撤销 `output_1` / `output_2` 列交换
    type: process
    size: xl
    position:
      x: 800
      'y': 250
    style:
      fontSize: 10
  - id: preferences
    label: |-
      已恢复方向的成对偏好
      基线 = `output_1`
      候选 = `output_2`
      候选获胜概率 = 偏好值 − 1
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
    style:
      fontSize: 10
  - id: raw_weighted
    label: |-
      加权胜率
      均值：偏好值 − 1
      候选获胜语义 • 汇总 805 条指令
    type: terminal
    size: large
    position:
      x: 1360
      'y': 60
  - id: glm
    label: |-
      反对称 GLM
      模型身份 + 输出长度
      指令难度
    type: formula
    size: xl
    position:
      x: 1360
      'y': 300
  - id: paper_l2
    label: |-
      论文 v2 统计规范
      五折交叉验证 • L2 正则化
      来源：arXiv:2404.04475v2
    type: document
    size: xl
    position:
      x: 1640
      'y': 110
    style:
      fontSize: 10
  - id: official_l1
    label: |-
      官方 0.6.6 @ cd543a149df89434
      五折交叉验证 • L1 • liblinear
      固定版本 glm_winrate.py 实现
    type: document
    size: xl
    position:
      x: 1640
      'y': 500
    style:
      fontSize: 10
  - id: lc_counterfactual
    label: |-
      长度控制反事实
      将长度项置零
      保留模型与指令项
    type: process
    size: xl
    position:
      x: 1920
      'y': 300
  - id: semantics
    label: |-
      候选获胜语义
      自比结果 = 50%
      恢复方向后保持交换对称
    type: document
    size: large
    position:
      x: 2200
      'y': 300
  - id: validation
    label: |-
      论文验证结果
      可操纵性：25% → 10%
      Arena ρ：.94 → .98
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 170
edges:
  - from: instructions
    to: baseline
    type: primary
  - from: instructions
    to: candidate
    type: primary
  - from: baseline
    to: evaluator
    type: primary
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: restore_direction
    type: primary
  - from: restore_direction
    to: preferences
    type: primary
  - from: preferences
    to: raw_weighted
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: preferences
    to: glm
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: glm
    to: paper_l2
    type: optional
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: glm
    to: official_l1
    type: optional
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: glm
    to: lc_counterfactual
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: lc_counterfactual
    to: semantics
    type: primary
  - from: raw_weighted
    to: validation
    type: optional
    waypoints:
      - x: 1540
        'y': 20
      - x: 2380
        'y': 20
      - x: 2380
        'y': 190
  - from: semantics
    to: validation
    type: optional
modules: []
