meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Math-VR Build Process
  description: >-
    Paper-aligned creation of a bilingual visual-mathematics corpus and its held-out benchmark, with VLM filtering,
    GPT-assisted standardization, expert review, verified scoring points, and separate answer-correctness and partial
    scores.
  legend: >-
    arXiv:2510.11718 reports 89,075 unique questions (178,150 bilingual samples), split into 86,575 training and 2,500
    test questions; the bilingual benchmark contains 5,000 language-specific items from those 2,500 test questions.
nodes:
  - id: collect
    label: |-
      Collect about 900K Math Problems
      Secondary-school Level
      Public Websites
      Require an Image in the Solution
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: filter
    label: |-
      Filter Images with Qwen2.5-VL-72B
      Label the Role of Each Image
      Retain Mathematical Figures
      Drop Irrelevant / Text-only Images
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: standardize
    label: |-
      Standardize with GPT-4.1
      Transcribe Remaining Text Images
      Separate Question and Solution
      Rewrite Both in Markdown
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: qc_translate
    label: |-
      Verify and Translate with GPT-4.1
      Remove Incomplete / Incoherent Items
      Translate the Standardized Records
      Form Chinese–English Pairs
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: corpus
    label: |-
      Build the Math-VR Corpus
      89,075 Unique Questions
      86,575 Train + 2,500 Test
      178,150 Bilingual Samples
    type: database
    size: xl
    position:
      x: 1140
      'y': 40
  - id: taxonomy
    label: |-
      Label a Subject Hierarchy
      Geometry · Algebra · Calculus · Statistics
      Geometry Accounts for 81%
      29% Text · 71% Multimodal
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: candidates
    label: |-
      Form Benchmark Candidates
      Exclude Proofs and Most Multiple Choice
      Randomly Pool 3,000 Remaining Questions
      Target Nontrivial Visual Reasoning
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: human_review
    label: |-
      Conduct Expert Manual Review
      15 Senior STEM College Students
      Remove Minimal / Trivial Visual Reasoning
      Verify Questions and Answers
    type: user
    size: xl
    position:
      x: 1700
      'y': 420
  - id: benchmark
    label: |-
      Release the Bilingual Benchmark
      2,500 Unique Test Questions
      1,000 Text + 1,500 Multimodal
      5,000 Chinese / English Items
    type: database
    size: xl
    position:
      x: 1420
      'y': 420
  - id: rubric
    label: |-
      Build Verified Scoring References
      GPT-4.1 Summarizes the Answer
      Generate Critical Scoring Points
      Humans Verify Points and Difficulty Weights
    type: document
    size: xl
    position:
      x: 1140
      'y': 420
  - id: response
    label: |-
      Generate a Model Response
      Supply Text or Multimodal Question
      Preserve Bilingual Evaluation Split
      Record Full Reasoning and Final Answer
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: judge
    label: |-
      Judge with GPT-4.1
      AC · Binary Entire-answer Correctness
      PS · Weighted Scoring-point Hits
      Apply the Paper-defined PS Discount
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: validate
    label: |-
      Validate Automatic Judging
      1,000 Questions × 3 Model Answers
      Compare with Human Ratings
      κ / MCC for AC · Pearson / Spearman for PS
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report AC and PS
      Text · Multimodal · Overall
      Analyze Subject and Language Results
      Preserve Separate Metric Meanings
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: collect
    to: filter
    type: primary
  - from: filter
    to: standardize
    type: primary
  - from: standardize
    to: qc_translate
    type: primary
  - from: qc_translate
    to: corpus
    type: primary
  - from: corpus
    to: taxonomy
    type: primary
  - from: taxonomy
    to: candidates
    type: primary
  - from: candidates
    to: human_review
    type: primary
  - from: human_review
    to: benchmark
    type: primary
  - from: benchmark
    to: rubric
    type: primary
  - from: rubric
    to: response
    type: primary
  - from: response
    to: judge
    type: primary
  - from: judge
    to: validate
    type: primary
  - from: validate
    to: report
    type: primary
modules: []
