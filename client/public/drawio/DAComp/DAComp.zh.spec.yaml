meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DAComp 构建与评估流程
  description: 对齐论文 v1 的八位专家构建流程，分别呈现四种企业数据智能体任务合同及架构评分、执行评分和层次标准加 GSB 的评估路径。
  legend: 实线表示许可资产、DE/DA 任务设计、专家质检、发布和分任务评估。
nodes:
  - id: evidence
    label: |-
      论文 arXiv:2512.04324v1
      HF DE / Gold @ 8c4a189 / 11f04f0
      HF DA / Eval @ 2cc2214 / 30e915f
      论文未固定代码提交版本
    type: document
    size: xl
    position:
      x: 40
      'y': 480
  - id: assets
    label: |-
      8 位专家收集数据
      宽松许可资产
      Apache-2.0 / MIT 示例
      保持企业真实性
    type: database
    size: xl
    position:
      x: 296
      'y': 480
  - id: split
    label: 完整数据智能生命周期
    type: decision
    size: xl
    position:
      x: 552
      'y': 480
  - id: de_assets
    label: |-
      数据工程资产
      73 个企业 SaaS 领域
      每套模式约 400 列
      数据转换项目
      关系一致的合成数据
    type: database
    size: xl
    position:
      x: 808
      'y': 160
  - id: de_baseline
    label: |-
      经审核的 DE 基线
      选择开源 dbt 项目 · 无错误
      规范为纯 SQL
      展开宏 / 物化关系 · 冻结依赖
      资深工程师审计
      连接 · 粒度 · SCD · 测试
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1064
      'y': 160
  - id: de_route
    label: DE 任务合同
    type: decision
    size: xl
    position:
      x: 1320
      'y': 160
  - id: arch
    label: |-
      DE-架构 · 30 题
      从分析层出发
      提出 5 个候选业务需求
      数据工程师选 1 个
      可行且有挑战的需求
      高层需求 + 初始仓库
      → 工程规范
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1576
      'y': 0
  - id: impl
    label: |-
      DE-实现 · 30 题
      将审核基线逆向为单个
      data_contract.yaml
      完整 DAG + 语义
      详细规范 + 空仓库
      → 标准多层 SQL 仓库
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1576
      'y': 176
  - id: evol
    label: |-
      DE-演化 · 50 题
      在职数据工程师
      编写变更
      现有生产式仓库
      新业务 / 模式 / 窗口
      / 治理需求
      → 安全演化的多文件仓库
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1576
      'y': 352
  - id: da_assets
    label: |-
      数据分析资产
      100 个复杂 Web 数据库
      + 来自 DE 数据的语义层
      分析就绪表
    type: database
    size: xl
    position:
      x: 808
      'y': 800
  - id: da_design
    label: |-
      DA 任务设计 · 100 题
      每张表起草 8 个开放问题
      5 名标注者按真实性 + 难度投票
      保留前 2 个问题
      要求报告、洞察、行动建议 + 可视化
    type: process
    size: xl
    position:
      x: 1064
      'y': 800
  - id: quality
    label: |-
      八位专家质量控制
      真实性 · 质量 · 一致性
      DA 评分标准对齐讨论
      确定性 DE 标准仓库
      + 执行脚本
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1832
      'y': 480
  - id: benchmark
    label: |-
      DAComp · 210 题
      DE-架构 30 · DE-实现 30
      DE-演化 50 · DA 100
      DAComp-zh 使用相同任务集
      英文 / 中文发布产物
    type: database
    size: xl
    position:
      x: 2088
      'y': 480
  - id: eval_route
    label: 按任务类型分流
    type: decision
    size: xl
    position:
      x: 2344
      'y': 480
  - id: de_arch_eval
    label: |-
      DE-架构评估
      标准非层次评分 · 无 GSB
      业务对齐 + 语义准确
      技术可行 + 结构完整
      设计质量
    type: process
    size: xl
    position:
      x: 2600
      'y': 160
  - id: de_exec_eval
    label: |-
      DE-实现 / 演化 · DuckDB
      精确模式 + 数据
      CS：每节点使用标准上游
      CFS：使用预测上游；错误级联
      SR：全部组件完美
      DE-Evol 成功边界：CFS ≥ 80
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2600
      'y': 480
  - id: da_eval
    label: |-
      DA 评估 · 至少 3 名标注者 + 对齐
      有效路径 + 锚点值
      5 个多样 LLM 覆盖验证
      层次评分：完整性 · 准确性
      · 洞察力
      GSB：可读性 · 分析深度
      · 可视化 · 对比 5 份基线
      Gemini-2.5-Flash
      最终 0.6 评分 + 0.4 GSB
    type: process
    size: xl
    style:
      fontSize: 8
    position:
      x: 2600
      'y': 800
  - id: report
    label: |-
      DAComp 混合报告
      DE 架构评分
      CS · CFS · SR
      DA 层次评分 + GSB
      DE、DA 与总分
    type: terminal
    size: xl
    position:
      x: 2856
      'y': 480
