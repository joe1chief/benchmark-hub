  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MM-IFEval Construction, Release, Evaluation, and Evidence Boundaries
  description: >-
    Evidence-bounded reconstruction from arXiv:2504.07957v2 (PDF SHA-256
    e927327ac2e67bb0e51de125dd67efc77097d01fead107296f49affcd37d1ec5), official repository
    bb844a7f145934da4ed82077735736d02bfafca4, downloadable TSV MD5 973bb839961a449565073a5ee70ae7a6, and VLMEvalKit
    7055d3010c38ccb5dcae1bc9535ca19c7fe5d79f. It separates paper construction, public release, exact hybrid scoring,
    drift, and unresolved evidence boundaries.
  legend: >-
    Solid arrows trace construction, release consumption, and score aggregation. Dashed arrows mark the publication
    boundary and alternative C/P or C-constraint evaluation branches. Unconnected audit cards record evidence gaps; they
    are not processing stages.
