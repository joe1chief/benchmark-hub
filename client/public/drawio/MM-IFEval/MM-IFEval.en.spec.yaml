meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MM-IFEval Build Process
  description: >-
    Paper-aligned construction of 300 compose-level and 100 perception-level multimodal instruction-following questions,
    followed by the official three-method hybrid evaluation.
  legend: The evaluation combines deterministic functions, direct LLM judgment, and comparative LLM judgment.
nodes:
  - id: images
    label: |-
      Gather Diverse Image Sources
      Natural Scenes · User Interfaces
      Diagrams · Charts · Mathematics
      Include Existing QA Datasets
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: tasks
    label: |-
      Define Instruction Tasks
      Use 16 Task Descriptions
      Cover Real-world Applications
      Ground Tasks in Images
    type: document
    size: xl
    position:
      x: 300
      'y': 40
  - id: filter
    label: |-
      Filter Source Questions
      Remove Few-shot Examples
      Remove Multiple-choice Options
      Apply Regex and Length Limits
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: taxonomy
    label: |-
      Build the Constraint Pool
      Six Major Categories
      32 Constraint Subcategories
      Mix Multiple Requirements
    type: document
    size: xl
    position:
      x: 860
      'y': 40
  - id: integrate
    label: |-
      Integrate Constraints with an LLM
      Generate Concrete Requirements
      Preserve Task Correlation
      Filter Total Contradictions
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: annotate
    label: |-
      Human-annotate Eval Problems
      Compose-level Output Constraints
      Perception-level Visual Constraints
      Label P-level Ground Truth
    type: user
    size: xl
    position:
      x: 1420
      'y': 40
  - id: conflict
    label: |-
      Post-process Constraint Conflicts
      Ask an Extra LLM to Double-check
      Mitigate Incompatible Requirements
      Preserve Human Annotations
    type: process
    size: xl
    position:
      x: 1420
      'y': 420
  - id: dataset
    label: |-
      Assemble 400 Questions
      300 Compose-level Open-ended
      100 Perception-level with Gold
      Cover 13 P-level Image Classes
    type: database
    size: xl
    position:
      x: 1140
      'y': 420
  - id: respond
    label: |-
      Generate Model Responses
      Supply Image and Full Instruction
      Preserve All Constraints
      Score Each Problem
    type: process
    size: xl
    position:
      x: 860
      'y': 420
  - id: rules
    label: |-
      Run Rule-based Verification
      Cover 10 Verifiable Subcategories
      Extract Function Parameters
      Manually Validate the Mapping
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: judges
    label: |-
      Run Two LLM Judge Methods
      Directly Judge Clear Constraints
      Compare Against Unconstrained Output
      Handle Tone · Style · Role-play
    type: user
    size: xl
    position:
      x: 300
      'y': 420
  - id: report
    label: |-
      Report Hybrid Accuracy
      Compose-level Accuracy
      Perception-level Accuracy
      Average Across 400 Problems
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
