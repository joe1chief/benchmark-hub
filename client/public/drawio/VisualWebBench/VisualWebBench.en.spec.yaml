meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisualWebBench — Seven Task Factories and Metrics
  description: >-
    VisualWebBench starts from 12 SimilarWeb domains and 87 subdomains, manually selecting representative websites from
    the top five sites in each subdomain and excluding sites used by Mind2Web or WebArena; the resulting benchmark spans
    139 websites. Playwright renders 1280-pixel-wide screenshots, and seven task-specific pipelines produce 1,534
    samples. Verification and curation are collaboratively divided between two authors; the paper does not define a
    per-sample double-approval gate. The seven task counts are 134/314/46/245/413/281/101.
  legend: >-
    Source: arXiv:2404.05955v1, Sections 3.1-3.4 and Appendix B; official dataset:
    https://huggingface.co/datasets/visualwebbench/VisualWebBench. Section 3.2 specifies representative websites
    selected from each subdomain's top five, while Section 3.1 and the official dataset report 139 websites. Appendix B
    specifies collaborative verification and curation with a division of tasks by two authors, not a per-sample
    two-signature gate.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
