meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthSearchQA Build Process
  description: >-
    Version-aware construction and sampled human evaluation, reconciling the arXiv preprint with the final Nature
    article and its official question-only supplement.
  legend: >-
    Solid arrows show construction and evaluation. Dashed arrows mark pinned evidence, the preprint-to-final revision,
    and the separate non-medical rating branch.
nodes:
  - id: evidence
    label: |-
      Primary evidence
      arXiv:2212.13138v1
      Nature s41586-023-06291-2
      ESM SHA a89f6639
    type: document
    size: xl
    position:
      x: 40
      'y': 360
  - id: seeds
    label: |-
      Consumer-health seed list
      medical conditions + symptoms
    type: document
    size: xl
    position:
      x: 304
      'y': 360
  - id: retrieve
    label: |-
      Public search-engine questions
      shown to all users entering seed terms
    type: process
    size: xl
    position:
      x: 568
      'y': 360
  - id: preprint
    label: |-
      arXiv v1 snapshot
      3,375 question-only queries
      human intervals: 100 bootstrap replicas
    type: document
    size: xl
    position:
      x: 832
      'y': 360
  - id: artifact_boundary
    label: |-
      Final Nature revision
      3,173 questions · 1,000 bootstrap
      supersedes preprint counts
    type: document
    size: xl
    position:
      x: 1096
      'y': 360
  - id: release
    label: |-
      Official ESM workbook
      3,173 all · 140 study questions
      question-only · no answers
    type: database
    size: xl
    position:
      x: 1360
      'y': 360
  - id: sample
    label: |-
      Disjoint human-study sample
      100 HealthSearchQA · 20 LiveQA
      20 MedicationQA · disjoint from tuning
    type: process
    size: xl
    position:
      x: 1624
      'y': 360
  - id: answers
    label: |-
      Compared answer sources
      clinician reference · Flan-PaLM
      Med-PaLM responses
    type: process
    size: xl
    position:
      x: 1888
      'y': 360
  - id: blind
    label: |-
      Blinded clinical review
      source hidden from raters
      one of nine clinicians rates each answer
    type: user
    size: xl
    position:
      x: 2152
      'y': 360
  - id: clinician_axes
    label: |-
      Clinician ratings · 12 axes
      consensus · harm · comprehension
      bias and other safety / quality axes
    type: process
    size: xl
    position:
      x: 2416
      'y': 96
  - id: lay_axes
    label: |-
      Lay ratings
      five non-medical raters
      intent match · helpfulness
    type: user
    size: xl
    position:
      x: 2416
      'y': 624
  - id: bootstrap
    label: |-
      Study estimates
      1,000 bootstrap replicas
      95% percentile intervals
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 360
edges:
  - from: evidence
    to: seeds
    type: data
  - from: seeds
    to: retrieve
    type: primary
  - from: retrieve
    to: preprint
    type: primary
  - from: preprint
    to: artifact_boundary
    type: data
  - from: artifact_boundary
    to: release
    type: primary
  - from: release
    to: sample
    type: primary
  - from: sample
    to: answers
    type: primary
  - from: answers
    to: blind
    type: primary
  - from: blind
    to: clinician_axes
    type: primary
  - from: blind
    to: lay_axes
    type: secondary
  - from: clinician_axes
    to: bootstrap
    type: primary
  - from: lay_axes
    to: bootstrap
    type: secondary
modules: []
