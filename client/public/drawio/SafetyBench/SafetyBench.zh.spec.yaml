meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafetyBench 构建与评测流程
  description: >-
    SafetyBench从8类典型安全场景归纳出7个类别，并因跨语言差异较大而排除敏感话题。数据来自已有数据集转换、安全相关考试和ChatGPT扩增。研究者对约500份中学试卷做OCR和众包筛选，得到约2000题；数据不足的类别再生成约3500道ChatGPT题，以BLEU-4低于0.7筛查相似题并人工核验。问题通过百度API双向翻译，之后全部接受人工验证；GPT-4在抽样上与人工答案的一致率为97%，分歧样本重新检查，并由两位作者与第三位裁决者解决。最终11,435道双语选择题以零样本和五样本提示运行，解析选项后按总体、类别与语言报告准确率。
  legend: >-
    来源：SafetyBench arXiv:2309.07045 Sections 3-5 and Appendix; official thu-coai/SafetyBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
