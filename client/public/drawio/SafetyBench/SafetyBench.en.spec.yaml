meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SafetyBench Build and Evaluation Process
  description: >-
    SafetyBench derives seven categories from eight typical safety scenarios, excluding sensitive topics because they
    diverge strongly across languages. It combines transformed public datasets, safety-related exams, and ChatGPT
    augmentation. Roughly 500 middle-school exam papers are OCR-processed and crowd-filtered to about 2,000 questions.
    Underrepresented categories gain about 3,500 ChatGPT questions, filtered by BLEU-4 similarity below 0.7 and manually
    checked. Questions are translated in both directions with the Baidu API, then all items receive human validation;
    GPT-4 agrees on 97% of a sample, disagreements are rechecked, and two authors plus a third adjudicator resolve
    issues. The final 11,435 bilingual MCQs are evaluated zero- and five-shot by parsed option accuracy, including
    category and language analysis.
  legend: >-
    Source: SafetyBench arXiv:2309.07045 Sections 3-5 and Appendix; official thu-coai/SafetyBench repository. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
