meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: We-Math Dataset Build and Diagnostic Evaluation
  description: >-
    We-Math constructs a five-layer textbook-derived knowledge taxonomy with 99 nodes and 67 terminal concepts, then
    collects 6,524 new visual multiple-choice math problems from authoritative public sites, exams, and exercises.
    Eligible items are multi-concept or decomposable, image-question consistent, and have one correct answer with
    plausible distractors. Three experts label concepts and retain an item only when at least two agree; solution steps
    and step counts are annotated, and a second expert review checks the diagram, answer, and concept alignment.
    Composite items are decomposed into coherent concept-specific subproblems. Official scoring uses the 1,740-item
    Testmini split (1,215 one-step, 360 two-step, and 165 three-step), not the full 6,524-item pool. Evaluation
    standardizes multiple-choice output, parses it with regular expressions, classifies composite/subproblem correctness
    into IK, IG, CM, and RM, and reports Score_average = αS_IK + βS_IG + S_CM with default α=0 and β=0.5.
  legend: >-
    Source: We-Math arXiv:2407.01284, Sections 2.1 and 2.2, Section 3, and Appendices B.4-B.5; official repository
    https://github.com/We-Math/We-Math.. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
