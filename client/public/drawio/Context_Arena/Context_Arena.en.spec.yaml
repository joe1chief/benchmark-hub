meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Context Arena GDM-MRCRv2 Evaluation Process
  description: >-
    Current Context Arena workflow for the GDM MRCRv2 Full 8-needle view, with the historical OpenAI MRCR lineage kept
    as version-drift evidence rather than fed into the current run.
  legend: >-
    Solid arrows trace the current independent scoring path; the dotted branch records historical dashboard provenance
    only.
nodes:
  - id: evidence
    label: |-
      Michelangelo arXiv:2409.12640v2
      eval_hub Commit 67b7fd2
      contextarena.ai Observed 2026-07-18
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: history
    label: |-
      Historical OpenAI MRCR @ f4c69fa
      2 / 4 / 8 Needles; 2025-12-05 Bug Fix
      Prior Dashboard Source, Not Current Flow
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: construct
    label: |-
      Build Long User–Assistant Transcript
      Keys = Format + Topic + Style
      Distinct Responses Interleaved with Distractors
      Final Query Requests the ith Matching Response
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: current_release
    label: |-
      GDM MRCRv2 Release
      2 / 4 / 8 Needles; Files up to 8M Tokens
      Require a Unique Random 12-Character Prefix
    type: database
    size: xl
    position:
      x: 600
      'y': 300
  - id: arena_slice
    label: |-
      Current Arena: Full 8-Needle Only
      Eight Bins from 8K through 1M
      Run Counts Are Not Fixed at 100 per Bin
    type: database
    size: xl
    position:
      x: 880
      'y': 300
  - id: independent_run
    label: |-
      Run Each Model Independently
      No Head-to-Head Battle; No LLM Judge
      Report Tool Access for Comparability
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: hash
    label: |-
      Last Occurrence of the
      Required 12-Character Hash Found?
    type: decision
    size: xl
    position:
      x: 1440
      'y': 300
  - id: zero
    label: |-
      Hash Missing
      Per-Example Score = 0
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 100
  - id: compare
    label: |-
      Keep Content after the Last Hash
      difflib.SequenceMatcher vs. Target
      Ratio in [0, 1]
    type: process
    size: xl
    position:
      x: 1720
      'y': 500
  - id: bin_mean
    label: |-
      Mean Per-Example Ratio per Bin
      Pointwise Bin Score
    type: process
    size: xl
    position:
      x: 2000
      'y': 300
  - id: aggregate
    label: |-
      Pointwise + Cum AVG (Unweighted Bins)
      AUC = Normalized Trapezoid on Linear Endpoints
      Missing Bins Count as 0
    type: process
    size: xl
    position:
      x: 2280
      'y': 300
  - id: report
    label: |-
      Context Arena Dashboard
      Scores / Cum AVG / AUC at 128K and 1M
      Token Efficiency and Cost Are Auxiliary
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 300
