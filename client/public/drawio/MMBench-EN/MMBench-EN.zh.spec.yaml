meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-EN 构建流程
  description: >-
    对齐论文的 MMBench-EN 流程：三级能力体系指导志愿者收集，两路模型辅助质检得到 3,217 道英文图像多选题，以 4:6 划分开发/测试并隐藏测试答案，再经启发式/GPT-4 选项抽取和全轮正确的 CircularEval
    计算分能力准确率。
  legend: 实线箭头表示收集与评测；上、下分支是互补的两种质量控制。
nodes:
  - id: taxonomy
    label: |-
      三级能力体系
      感知 + 推理
      六个 L-2 / 二十个 L-3 能力
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: exemplars
    label: |-
      冷启动样例
      作者为每个 L-3 能力
      编写 10–20 道 MCQ
    type: process
    size: xl
    position:
      x: 320
      'y': 240
  - id: collection
    label: |-
      学生志愿者扩充
      超过 80% 来自互联网
      其余来自公开数据验证集
    type: user
    size: xl
    position:
      x: 600
      'y': 240
  - id: raw
    label: |-
      原始图像多选题
      图像 + 问题 + 2–4 个选项
      + 一个正确答案
    type: database
    size: xl
    position:
      x: 880
      'y': 240
  - id: text_qc
    label: |-
      纯文本可答质检
      多数强 LLM 纯文本答对
      → 人工核验；确属纯文本则移除
    type: process
    size: xl
    position:
      x: 1160
      'y': 60
  - id: wrong_qc
    label: |-
      错题质检
      所有强 VLM 都答错
      → 人工核验；题目有误则移除
    type: process
    size: xl
    position:
      x: 1160
      'y': 420
  - id: dataset
    label: |-
      英文 MMBench 精选集
      3,217 道题
      每个 L-3 能力至少 125 题
    type: database
    size: xl
    position:
      x: 1440
      'y': 240
  - id: split
    label: |-
      开发 / 测试 = 4:6
      开发：公开金标
      测试：隐藏金标
    type: document
    size: xl
    position:
      x: 1720
      'y': 240
  - id: model
    label: |-
      VLM 开放式预测
      图像 + 英文 MCQ 提示
    type: process
    size: large
    position:
      x: 2000
      'y': 240
  - id: extraction
    label: |-
      选项抽取
      先做启发式标签匹配
      GPT-4-0125 兜底；否则 Z
    type: process
    size: xl
    position:
      x: 2240
      'y': 240
  - id: circular
    label: |-
      CircularEval
      N 轮循环移动选项
      每一轮正确才算整题正确
    type: process
    size: xl
    position:
      x: 2520
      'y': 240
  - id: metric
    label: |-
      官方测试提交
      总体 + 20 项能力准确率
    type: terminal
    size: xl
    position:
      x: 2800
      'y': 240
edges:
  - from: taxonomy
    to: exemplars
    type: primary
  - from: exemplars
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: dataset
    type: primary
  - from: wrong_qc
    to: dataset
    type: primary
  - from: dataset
    to: split
    type: primary
  - from: split
    to: model
    type: primary
  - from: model
    to: extraction
    type: primary
  - from: extraction
    to: circular
    type: primary
  - from: circular
    to: metric
    type: primary
modules: []
