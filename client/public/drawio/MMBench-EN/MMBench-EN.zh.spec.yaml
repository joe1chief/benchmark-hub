meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-EN v1.0 构建流程
  description: >-
    将英文原版严格限定为 2023 年 10 月的 v1.0 文件：早期论文写 2,974 题，修订后的官方 DEV/TEST 下载实际包含 1,164 + 1,784 = 2,948 道逻辑题；MMBench v1.1
    是另一数据版本。
  legend: 实线表示 v1.0 英文版的构建、发布与评测生命周期；虚线只连接计数、字段、答案可见性或发布代码审计事实， 不进入计分分母。
nodes:
  - id: taxonomy
    label: |-
      三级能力体系
      2 个 L1 / 6 个 L2
      20 个 L3 能力
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: seeds
    label: |-
      作者冷启动样例
      每个 L3 能力
      10–20 道 MCQ
    type: process
    size: xl
    position:
      x: 320
      'y': 280
  - id: collection
    label: |-
      学生志愿者扩充
      超 80% 来自互联网
      约 20% 用公开验证集图像
    type: user
    size: xl
    position:
      x: 600
      'y': 280
  - id: raw
    label: |-
      英文图像多选题
      问题 + 可选提示
      2–4 个选项 + 答案
    type: database
    size: xl
    position:
      x: 880
      'y': 280
  - id: text_qc
    label: |-
      纯文本可答过滤
      LLM 共识筛查
      再由人工复核
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: wrong_qc
    label: |-
      错题过滤
      筛查 VLM 全部失败
      再由人工复核
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: paper_pool
    label: |-
      论文 v1–v3 题池
      2,974 道题
      20 个 L3 能力
    type: database
    size: xl
    position:
      x: 1440
      'y': 280
  - id: revision
    label: |-
      2023 年 10 月修订
      移除约 20 多道噪声题
      2,948 道逻辑题
    type: process
    size: xl
    position:
      x: 1720
      'y': 280
  - id: split
    label: |-
      MMBench-EN v1.0
      DEV 1,164：金标公开
      TEST 1,784：金标隐藏
    type: database
    size: xl
    position:
      x: 2000
      'y': 280
  - id: prompt
    label: |-
      零样本开放式生成
      图像 + 可选提示
      英文问题 + 选项
    type: process
    size: xl
    position:
      x: 2280
      'y': 280
  - id: heuristic
    label: |-
      启发式方法
      抽出选项了吗
    type: decision
    size: xl
    position:
      x: 2560
      'y': 120
  - id: gpt
    label: |-
      论文回退
      gpt-4-0125
      匹配选项或 Z
    type: process
    size: xl
    position:
      x: 2560
      'y': 480
  - id: circular
    label: |-
      CircularEval
      循环轮换 N 个选项
      各轮全对才算正确
    type: process
    size: xl
    position:
      x: 2840
      'y': 280
  - id: score
    label: |-
      逻辑题准确率
      总体微平均 + L2/L3
      测试集走官方提交
    type: terminal
    size: xl
    position:
      x: 3120
      'y': 280
  - id: count_audit
    label: |-
      计数边界
      正文 2,974 ≠ 文件 2,948
      v1.1 不属于此 ID
    type: document
    size: xl
    position:
      x: 1720
      'y': 760
  - id: schema_audit
    label: |-
      v1.0 TSV 审计
      保留 source/comment
      轮换行共享原题 ID
    type: document
    size: xl
    position:
      x: 2000
      'y': 760
  - id: code_audit
    label: |-
      发布代码注意项
      判题重试 3 次均失败
      随机有效选项或 Z
    type: document
    size: xl
    position:
      x: 3120
      'y': 760
edges:
  - from: taxonomy
    to: seeds
    type: primary
  - from: seeds
    to: collection
    type: primary
  - from: collection
    to: raw
    type: primary
  - from: raw
    to: text_qc
    type: primary
  - from: raw
    to: wrong_qc
    type: primary
  - from: text_qc
    to: paper_pool
    type: primary
  - from: wrong_qc
    to: paper_pool
    type: primary
  - from: paper_pool
    to: revision
    type: primary
  - from: revision
    to: split
    type: primary
  - from: split
    to: prompt
    type: primary
  - from: prompt
    to: heuristic
    type: primary
  - from: heuristic
    to: circular
    type: primary
    label: 是
  - from: heuristic
    to: gpt
    type: primary
    label: 否
  - from: gpt
    to: circular
    type: primary
  - from: circular
    to: score
    type: primary
  - from: revision
    to: count_audit
    type: secondary
    style:
      dashed: true
  - from: split
    to: schema_audit
    type: secondary
    style:
      dashed: true
  - from: score
    to: code_audit
    type: secondary
    style:
      dashed: true
modules: []
