meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Where2Place 基准构建与点预测评测流程
  description: >-
    Where2Place包含100张来自家庭与办公室的真实图像。为减少标注偏差，一组标注者编写相对场景实体描述空闲区域的指令，另一组独立依据指令标注目标掩码，两路标注形成完整的100组图像、指令与掩码三元组。Where2Place(h)是这100题内部重叠的30题子集，其关系类型未出现在RoboPoint合成训练数据中，并非与完整集互斥的划分。评测时模型直接预测一个或多个点，输出边界框的基线则通过均匀采样转换为点。准确率为落入目标掩码的预测点比例，Table
    2分别报告完整100题与重叠Hard 30题三次运行的均值和标准差。
  legend: >-
    来源：RoboPoint arXiv:2406.10721, Section 5.1 'Spatial Affordance Prediction,' especially the Benchmarks paragraph and
    Table 2; official project https://robo-point.github.io/, repository https://github.com/wentaoyuan/RoboPoint, and
    dataset https://huggingface.co/datasets/wentao-yuan/where2place. The paper explicitly states that 'a subset of 30
    examples (Where2Place(h))' contains relation types absent from the synthetic data, so Hard 30 overlaps the full
    100-example benchmark. Scope pin: this entry covers Where2Place, not RoboPoint's 660K-example synthetic
    training-data pipeline.。实线箭头表示论文或官方资料明确支持的主流程。
