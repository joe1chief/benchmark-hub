meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Where2Place Benchmark Build and Point Evaluation
  description: >-
    Where2Place contains 100 real-world images from homes and offices. To reduce annotation bias, one group writes an
    instruction describing a vacant region relative to scene entities, while a different group independently labels the
    target mask from that instruction. These annotations form the full 100 image-instruction-mask triples.
    Where2Place(h) is an overlapping subset of 30 examples from the full benchmark whose relation types do not occur in
    RoboPoint's synthetic training data; it is not a disjoint split. During evaluation, a model predicts one or more
    points directly, while bounding-box baselines are converted by evenly sampling points. Accuracy is the percentage of
    predicted points inside the target mask, and Table 2 reports mean and standard deviation over three runs for the
    full 100 examples and the overlapping Hard 30 subset.
  legend: >-
    Source: RoboPoint arXiv:2406.10721, Section 5.1 'Spatial Affordance Prediction,' especially the Benchmarks paragraph
    and Table 2; official project https://robo-point.github.io/, repository https://github.com/wentaoyuan/RoboPoint, and
    dataset https://huggingface.co/datasets/wentao-yuan/where2place. The paper explicitly states that 'a subset of 30
    examples (Where2Place(h))' contains relation types absent from the synthetic data, so Hard 30 overlaps the full
    100-example benchmark. Scope pin: this entry covers Where2Place, not RoboPoint's 660K-example synthetic
    training-data pipeline.. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
