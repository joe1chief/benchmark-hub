  layout: horizontal
  routing: orthogonal
  title: "RareBench 构建与评测流程"
  description: "RareBench结合1650份PUMCH电子病历和1122份公开罕见病病例，定义表型抽取、不完整信息诊断、常见病与罕见病鉴别、通用罕见病鉴别四项任务，各子集分别含87、33、527和2185例。论文整合四个公共知识库形成罕见病图谱，以基于信息量的随机游走生成表型向量用于动态三样本检索。模型在零样本、思维链、随机少样本和动态少样本提示下，用任务专属抽取指标或Top-k召回评测；另在75份高质量PUMCH病例上将GPT-4与50名专科医生比较。"
  legend: "来源：arXiv:2402.06341v2 Sections 3.1-3.4, 4-5 and Appendix A, cross-checked against chenxz1111/RareBench。实线箭头表示论文或官方资料明确支持的主流程。"
