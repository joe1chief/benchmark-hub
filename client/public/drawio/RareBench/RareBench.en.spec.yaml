meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RareBench Paper-aligned Build and Evaluation Process
  description: >-
    KDD 2024 workflow combining four public rare-disease sources with a privacy-protected PUMCH EHR cohort, allocating
    four task subsets, adding knowledge-graph-based dynamic prompting for universal differential diagnosis, and retaining
    each task's distinct metric contract.
  legend: >-
    Solid arrows show paper construction and evaluation. Dashed arrows isolate evidence, the physician study, code,
    release, and license boundaries; article, repository-code, and Hugging Face card licenses remain separately scoped
    from the unreleased full PUMCH cohort and upstream rights.
