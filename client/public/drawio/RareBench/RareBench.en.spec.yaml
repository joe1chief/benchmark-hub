  title: "RareBench Build and Evaluation Process"
  description: "RareBench combines 1,650 PUMCH EHRs with 1,122 public rare-disease cases and defines four tasks: phenotype extraction, diagnosis from incomplete information, common-versus-rare differential diagnosis, and universal rare-disease differential diagnosis. The task subsets contain 87, 33, 527, and 2,185 cases respectively. Four public knowledge bases are integrated into a rare-disease graph; an information-content random walk produces phenotype embeddings for dynamic three-shot retrieval. Models are evaluated with zero-shot, chain-of-thought, random few-shot, and dynamic few-shot prompting using task-specific extraction or Top-k recall measures. A separate study compares GPT-4 with 50 specialist physicians on 75 high-quality PUMCH cases."
  legend: "Source: arXiv:2402.06341v2 Sections 3.1-3.4, 4-5 and Appendix A, cross-checked against chenxz1111/RareBench. Solid arrows show the main flow explicitly supported by the paper or official documentation."
