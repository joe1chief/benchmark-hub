meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chinese SimpleQA Build Process
  description: >-
    Paper-aligned Chinese SimpleQA workflow: knowledge content across six topics and 99 subtopics is filtered, GPT-4o
    generates and verifies static single-answer QA pairs, RAG and four-model difficulty gates reduce 10,000 candidates,
    dual human search verification with third-party adjudication yields 3,000 questions, and five factuality metrics
    apply.
  legend: Solid arrows show automated generation/verification, difficulty filtering, human evidence checks, and grading.
