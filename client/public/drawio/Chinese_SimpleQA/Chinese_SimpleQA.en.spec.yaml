      Knowledge-rich Chinese Content
      6 Primary Topics • 99 Subtopics
      Wikipedia + Other
      Knowledge Fields
    type: database
    size: xl
    position:
      x: 40
      'y': 40
  - id: quality_filter
    label: |-
      Extract + Filter Source Text
      Quality-assessment Model
      Remove Low-quality Content
    type: process
    size: xl
    position:
      x: 320
      'y': 40
  - id: generate
    label: |-
      GPT-4o-0806 Generation
      Short Factual Question
      + Generated Reference Answer
    type: process
    size: xl
    position:
      x: 600
      'y': 40
  - id: criteria
    label: |-
      GPT-4o-0806 Criteria Check
      Objective • Unique • Timeless
      Challenging
      Answerable by 2023-12-31
    type: process
    size: xl
    position:
      x: 880
      'y': 40
  - id: rag
    label: |-
      RAG Factual Verification
      LlamaIndex + Google + Bing
      Reject Contradictory Evidence
    type: process
    size: xl
    position:
      x: 1160
      'y': 40
  - id: difficulty
