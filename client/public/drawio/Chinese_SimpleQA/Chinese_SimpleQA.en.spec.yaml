    type: database
    size: xl
    position:
      x: 880
      'y': 300
  - id: grader
    label: |-
      Three-way Grader
      Correct • Not Attempted • Incorrect
      CO • NA • IN
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: metrics
    label: |-
      Accuracy = CO / (CO + NA + IN)
      CGA = CO / (CO + IN)
      F = 2 × CO × CGA
      / (CO + CGA)
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 300
