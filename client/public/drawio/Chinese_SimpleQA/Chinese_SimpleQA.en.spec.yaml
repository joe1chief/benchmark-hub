meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chinese SimpleQA Build Process
  description: >-
    Paper-aligned Chinese SimpleQA flow: knowledge-rich Chinese content spanning 6 topics and 99 subtopics is filtered,
    GPT-4o-0806 generates and checks static single-answer QA pairs, RAG and four-model difficulty gates reduce 10,000
    candidates, and independent evidence-backed human review yields 3,000 questions for three-way grading.
  legend: Solid arrows show the disclosed automated construction, human adjudication, and evaluation sequence.
nodes:
