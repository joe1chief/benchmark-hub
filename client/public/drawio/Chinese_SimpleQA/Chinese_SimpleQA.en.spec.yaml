      Chinese Knowledge Content
      Six Primary Topics
      99 Fine-grained Subtopics
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: quality_filter
    label: |-
      Content Extraction + Filtering
      Quality Assessment Model
      Remove Low-quality Text
    type: process
    size: xl
    position:
      x: 320
      'y': 240
  - id: generate
    label: |-
      GPT-4o-0806 Generation
      Short Factual Question
      + Reference Answer
    type: process
    size: xl
    position:
      x: 600
      'y': 240
  - id: criteria
    label: |-
      LLM Criteria Verification
      Objective + Unique + Timeless
      Challenging; Answerable by 2023-12-31
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: rag
    label: |-
      RAG Factual Verification
      LlamaIndex + Google / Bing
      Reject Contradictory Evidence
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: difficulty
