meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Chinese SimpleQA 构建流程
  description: >-
    对齐论文的 Chinese SimpleQA 流程：从六主题和 99 子主题筛选中文知识内容，由 GPT-4o 生成并验证时间不变的单一答案问答对，经 RAG 和四模型难度门压缩 10,000
    个候选，再由两人检索验证、第三人裁决得到 3,000 题，最终使用五项事实性指标。
  legend: 实线箭头表示自动生成/验证、难度过滤、人工证据检查和判分。
nodes:
  - id: knowledge
    label: |-
      中文知识内容
      六个一级主题
      99 个细粒度子主题
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: quality_filter
    label: |-
      内容抽取 + 过滤
      质量评估模型
      移除低质量文本
    type: process
    size: xl
    position:
      x: 320
      'y': 240
  - id: generate
    label: |-
      GPT-4o-0806 生成
      简短事实问题
      + 参考答案
    type: process
    size: xl
    position:
      x: 600
      'y': 240
  - id: criteria
    label: |-
      LLM 标准验证
      客观 + 唯一 + 时间不变
      有难度；截至 2023-12-31 可答
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: rag
    label: |-
      RAG 事实验证
      LlamaIndex + Google / Bing
      存在矛盾证据则拒绝
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: difficulty
    label: |-
      四模型难度门
      GPT-4o / Llama-3-70B
      Qwen2.5-72B / GLM-4-Plus
      四个全答对则丢弃
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: automated_pool
    label: |-
      自动候选池
      初始 10,000 → 难度筛后 6,310
      规则 + RAG 再移除 2,840
    type: database
    size: xl
    position:
      x: 1740
      'y': 240
  - id: dual_human
    label: |-
      两位独立标注员
      复查标准 + 检索答案
      每人提供至少 2 个权威 URL
    type: user
    size: xl
    position:
      x: 2020
      'y': 240
  - id: adjudicate
    label: |-
      人工质量门
      任一认为标准不符则丢弃
      答案不一致则第三人裁决
    type: process
    size: xl
    position:
      x: 2300
      'y': 240
  - id: agreement
    label: |-
      最终一致性检查
      人工标注必须与
      LLM 生成参考答案完全一致
    type: process
    size: xl
    position:
      x: 2580
      'y': 240
  - id: dataset
    label: |-
      Chinese SimpleQA
      3,000 道中文问题
      人工验证最终集
    type: database
    size: xl
    position:
      x: 2860
      'y': 240
  - id: grader
    label: |-
      LLM 判分器
      正确 / 未尝试 / 错误
    type: process
    size: large
    position:
      x: 3140
      'y': 240
  - id: metrics
    label: |-
      CO / NA / IN
      尝试题中的正确率
      F-score 调和平均
    type: terminal
    size: xl
    position:
      x: 3380
      'y': 240
edges:
  - from: knowledge
    to: quality_filter
    type: primary
  - from: quality_filter
    to: generate
    type: primary
  - from: generate
    to: criteria
    type: primary
  - from: criteria
    to: rag
    type: primary
  - from: rag
    to: difficulty
    type: primary
  - from: difficulty
    to: automated_pool
    type: primary
  - from: automated_pool
    to: dual_human
    type: primary
  - from: dual_human
    to: adjudicate
    type: primary
  - from: adjudicate
    to: agreement
    type: primary
  - from: agreement
    to: dataset
    type: primary
  - from: dataset
    to: grader
    type: primary
  - from: grader
    to: metrics
    type: primary
modules: []
