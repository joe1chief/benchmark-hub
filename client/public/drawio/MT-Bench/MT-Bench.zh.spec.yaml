meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MT-Bench 构建流程
  description: >-
    论文对齐的 MT-Bench 流程：研究者在八类场景中人工设计 80 道两轮题，收集六个模型的完整对话和 58 位专家级标注员 约 3K 票以验证 LLM 判分，再由 GPT-4
    在完整对话上下文中逐轮单答案评分，并在需要时使用参考答案。
  legend: 实线箭头表示问题设计、判分器验证、标准逐轮评分和得分汇总。
nodes:
  - id: categories
    label: |-
      八类用户提示
      写作 / 角色扮演 / 抽取 / 推理
      数学 / 编码 / STEM / 人文
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: questions
    label: |-
      人工设计问题
      每类 10 道
      80 道题 × 两轮
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: conversations
    label: |-
      收集完整对话
      六个基线聊天模型
      每题保留两轮
    type: process
    size: xl
    position:
      x: 560
      'y': 200
  - id: human_votes
    label: |-
      受控人工评测
      58 位专家级标注员
      约 3K 对比投票
    type: user
    size: xl
    position:
      x: 820
      'y': 200
  - id: judge_study
    label: |-
      验证 LLM 判分
      成对 / 单答案 / 参考引导
      测试位置与冗长偏差
    type: process
    size: xl
    position:
      x: 1080
      'y': 200
  - id: standard_judge
    label: |-
      MT-Bench 标准判分器
      GPT-4 单答案评分
      兼顾扩展性与简洁性
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: context
    label: |-
      逐轮判分提示
      第二轮提供完整对话
      数学 / 推理提供参考答案
    type: document
    size: xl
    position:
      x: 1600
      'y': 200
  - id: grade
    label: |-
      解释判断
      每轮评分 1–10
      正确性 + 相关性 + 有用性
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: score
    label: |-
      MT-Bench 得分
      160 个轮次得分取平均
      分类 / 轮次明细
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 200
edges:
  - from: categories
    to: questions
    type: primary
  - from: questions
    to: conversations
    type: primary
  - from: conversations
    to: human_votes
    type: primary
  - from: human_votes
    to: judge_study
    type: primary
  - from: judge_study
    to: standard_judge
    type: primary
  - from: standard_judge
    to: context
    type: primary
  - from: context
    to: grade
    type: primary
  - from: grade
    to: score
    type: primary
modules: []
