meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MT-Bench Build Process
  description: >-
    Paper-aligned MT-Bench workflow: researchers manually design 80 two-turn questions across eight use cases, collect
    six-model conversations and about 3K votes from 58 expert-level humans to validate LLM judging, then use GPT-4
    single-answer grading on each turn with full conversation context and reference guidance where needed.
  legend: Solid arrows show question design, judge validation, standardized per-turn grading, and score aggregation.
nodes:
  - id: categories
    label: |-
      Eight User-prompt Categories
      Writing / Roleplay / Extraction / Reasoning
      Math / Coding / STEM / Humanities
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: questions
    label: |-
      Manual Question Design
      10 per Category
      80 Questions × 2 Turns
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: conversations
    label: |-
      Collect Full Conversations
      Six Baseline Chatbots
      Both Turns per Question
    type: process
    size: xl
    position:
      x: 560
      'y': 200
  - id: human_votes
    label: |-
      Controlled Human Evaluation
      58 Expert-level Labelers
      ≈3K Pairwise Votes
    type: user
    size: xl
    position:
      x: 820
      'y': 200
  - id: judge_study
    label: |-
      Validate LLM-as-Judge
      Pairwise / Single / Reference-guided
      Test Position + Verbosity Bias
    type: process
    size: xl
    position:
      x: 1080
      'y': 200
  - id: standard_judge
    label: |-
      Standard MT-Bench Judge
      GPT-4 Single-answer Grading
      Scalability + Simplicity
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: context
    label: |-
      Per-turn Judge Prompt
      Full Conversation for Turn 2
      Reference for Math / Reasoning
    type: document
    size: xl
    position:
      x: 1600
      'y': 200
  - id: grade
    label: |-
      Explain Judgment
      Score Each Turn 1–10
      Correctness + Relevance + Helpfulness
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: score
    label: |-
      MT-Bench Score
      Average over 160 Turn Scores
      Category / Turn Breakdown
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 200
edges:
  - from: categories
    to: questions
    type: primary
  - from: questions
    to: conversations
    type: primary
  - from: conversations
    to: human_votes
    type: primary
  - from: human_votes
    to: judge_study
    type: primary
  - from: judge_study
    to: standard_judge
    type: primary
  - from: standard_judge
    to: context
    type: primary
  - from: context
    to: grade
    type: primary
  - from: grade
    to: score
    type: primary
modules: []
