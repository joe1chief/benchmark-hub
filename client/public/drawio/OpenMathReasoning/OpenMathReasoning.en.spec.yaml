meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenMathReasoning Dataset Build Process
  description: >-
    Paper- and dataset-card-aligned construction of AoPS problems, long CoT solutions, tool-integrated reasoning data,
    and GenSelect examples.
  legend: >-
    The paper reports 540K problems at the pipeline stage. The official release card corrects the solution-bearing set
    to 306K problems and separately provides 193K problem-only records.
nodes:
  - id: source
    label: |-
      Collect AoPS Forum Discussions
      Use All Forums Except Middle School Math
      Retrieve 620K Discussions
      Preserve Mathematical Context
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: extract
    label: |-
      Extract Problems with Qwen2.5-32B
      Find All Problems in Each Post
      Allow Zero One or Multiple Problems
      Obtain 580K Problems
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: classify
    label: |-
      Classify Every Problem
      Proof versus Non-proof
      Multiple Choice or Binary
      Valid versus Invalid
    type: process
    size: xl
    position:
      x: 500
      'y': 40
  - id: filter
    label: |-
      Remove Bad Formats
      Drop Multiple Choice
      Drop Yes-or-no and Invalid Items
      Retain 550K at Paper Stage
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: transform
    label: |-
      Normalize Answerability
      Convert Proofs to Answer Questions
      Extract Final Answers When Possible
      Keep Unresolved-answer Cases
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: decontam
    label: |-
      Decontaminate Benchmarks
      LLM Compares Popular Math Tasks
      Remove Closely Resembling Problems
      Paper Pipeline Reports 540K
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: correction
    label: |-
      Reconcile Official Release
      Only 306K Problems Enter Solution Splits
      193K Items Stay Problem-only
      137K Proofs Were Lost by Pipeline Bug
    type: document
    size: xl
    position:
      x: 1460
      'y': 40
  - id: cot_generate
    label: |-
      Generate Long CoT Candidates
      DeepSeek-R1 and QwQ-32B
      Up to 32 per Problem
      Temperature 0.7 Top-p 0.95
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: cot_filter
    label: |-
      Filter CoT Solutions
      Check Expected Final Answer
      Qwen2.5-32B Equivalence Judge
      Use Majority Answer When Needed
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: cot_release
    label: |-
      Retain Long-reasoning Data
      2.7M DeepSeek-R1 Solutions
      0.5M QwQ-32B Solutions
      3.2M CoT Total
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: tir_seed
    label: |-
      Seed Tool-integrated Reasoning
      Prompt LIMO-Qwen-32B for Python
      Generate 1.2M Candidates
      Filter to 15K Stage-zero Samples
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: tir_iterate
    label: |-
      Iterate TIR Training and Generation
      Train QwQ then a Fourteen-billion Model
      Filter Correct Code-using Solutions
      Produce 1.7M TIR Samples
    type: process
    size: xl
    position:
      x: 500
      'y': 420
  - id: genselect
    label: |-
      Build GenSelect Data
      Rewrite Faithful Solution Summaries
      Compare Multiple Candidates
      Create 566K Selection Examples
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: release
    label: |-
      Release OpenMathReasoning
      CoT TIR GenSelect and Extra Problems
      About 5.68M Rows on Official Card
      Release Code and OpenMath-Nemotron Models
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
edges:
  - from: source
    to: extract
    type: primary
  - from: extract
    to: classify
    type: primary
  - from: classify
    to: filter
    type: primary
  - from: filter
    to: transform
    type: primary
  - from: transform
    to: decontam
    type: primary
  - from: decontam
    to: correction
    type: primary
  - from: correction
    to: cot_generate
    type: primary
  - from: cot_generate
    to: cot_filter
    type: primary
  - from: cot_filter
    to: cot_release
    type: primary
  - from: cot_release
    to: tir_seed
    type: primary
  - from: tir_seed
    to: tir_iterate
    type: primary
  - from: tir_iterate
    to: genselect
    type: primary
  - from: genselect
    to: release
    type: primary
modules: []
