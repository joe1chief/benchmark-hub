meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OpenMathReasoning Construction and Downstream Evaluation
  description: >-
    Paper-v1 and fixed-release alignment for AoPS problem processing, CoT, TIR, GenSelect, and external benchmark
    evaluation.
  legend: >-
    Primary edges show the paper workflow. Dashed edges mark fixed evidence, corrected release counts, licensing, and
    the fact that this is training data rather than a standalone benchmark.
