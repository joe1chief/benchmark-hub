meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BrowseComp 构建流程
  description: >-
    论文对齐的 BrowseComp 流程：人工标注员把稳定事实倒置成短答案问题，以模型、搜索和同伴难度检查把关并返修歧义题， 再从 1,287 道候选中移除 21 道问题任务；最终 1,266 题用于禁用 AI
    的人类实验和浏览智能体语义等价判分。
  legend: 实线箭头表示人工构建、难度验证、评测后清理及人类/智能体评测。
nodes:
  - id: criteria
    label: |-
      纯人工标注
      沿用 SimpleQA 标准
      单一 / 简短 / 稳定答案
      有证据支持
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: inversion
    label: |-
      种子事实 → 倒置问题
      组合大搜索空间线索
      难以找到；容易验证
    type: process
    size: xl
    position:
      x: 300
      'y': 240
  - id: challenge
    label: |-
      三项难度检查
      GPT-4o / o1 / 早期 DR 失败
      5 次 Google 首页无答案
      目标：他人 10 分钟内无法解答
    type: process
    size: xl
    position:
      x: 560
      'y': 240
  - id: peer_review
    label: |-
      第二位标注员抽样尝试
      找到其他答案 → 反馈
      作者题目解出率 >40% → 返修
    type: user
    size: xl
    position:
      x: 820
      'y': 240
  - id: candidates
    label: |-
      原始数据集
      1,287 道候选任务
    type: database
    size: large
    position:
      x: 1080
      'y': 240
  - id: zero_audit
    label: |-
      Deep Research 审计
      检查通过率 0% 的 118 题
    type: process
    size: large
    position:
      x: 1340
      'y': 240
  - id: clean
    label: |-
      移除 21 道问题任务
      格式错误 / 表述歧义
      或参考答案错误
    type: process
    size: xl
    position:
      x: 1600
      'y': 240
  - id: dataset
    label: |-
      BrowseComp
      最终 1,266 题
      简短参考答案
    type: database
    size: xl
    position:
      x: 1860
      'y': 240
  - id: human_study
    label: |-
      人类难度实验
      1,255 次尝试；禁用 AI
      至少搜索 2 小时才可放弃
      解出率 29.2%
    type: user
    size: xl
    position:
      x: 2120
      'y': 60
  - id: agent_runs
    label: |-
      浏览智能体运行
      持续且有创造性地搜索
      输出简短预测答案
    type: process
    size: xl
    position:
      x: 2120
      'y': 420
  - id: grader
    label: |-
      AI 语义等价判分
      使用与 HLE 相同的提示
    type: process
    size: large
    position:
      x: 2380
      'y': 240
  - id: score
    label: |-
      BrowseComp 准确率
      可选校准分析
    type: terminal
    size: large
    position:
      x: 2640
      'y': 240
edges:
  - from: criteria
    to: inversion
    type: primary
  - from: inversion
    to: challenge
    type: primary
  - from: challenge
    to: peer_review
    type: primary
  - from: peer_review
    to: candidates
    type: primary
  - from: candidates
    to: zero_audit
    type: primary
  - from: zero_audit
    to: clean
    type: primary
  - from: clean
    to: dataset
    type: primary
  - from: dataset
    to: human_study
    type: primary
  - from: dataset
    to: agent_runs
    type: primary
  - from: human_study
    to: grader
    type: data
  - from: agent_runs
    to: grader
    type: primary
  - from: grader
    to: score
    type: primary
modules: []
