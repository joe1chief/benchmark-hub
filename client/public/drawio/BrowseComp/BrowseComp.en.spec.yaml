meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BrowseComp Build Process
  description: >-
    Paper-aligned BrowseComp workflow: human trainers invert stable seed facts into short-answer questions, enforce
    model, search, and peer-difficulty checks, revise ambiguous items, and remove 21 faulty tasks from 1,287 candidates;
    the final 1,266 tasks support no-AI human studies and browsing-agent grading by semantic equivalence.
  legend: Solid arrows show human construction, challenge verification, post-evaluation cleaning, and human/agent evaluation.
nodes:
  - id: criteria
    label: |-
      Human Trainers Only
      SimpleQA-style Criteria
      Single / Short / Stable Answer
      Evidence-supported
    type: user
    size: xl
    position:
      x: 40
      'y': 240
  - id: inversion
    label: |-
      Seed Fact → Inverted Question
      Combine Large-space Clues
      Hard to Find; Easy to Verify
    type: process
    size: xl
    position:
      x: 300
      'y': 240
  - id: challenge
    label: |-
      Three Challenge Checks
      GPT-4o / o1 / Early DR Fail
      5 Google First Pages: No Answer
      Target: Another Person >10 min
    type: process
    size: xl
    position:
      x: 560
      'y': 240
  - id: peer_review
    label: |-
      Second-trainer Attempt on a Portion
      Alternative Answer → Feedback
      >40% Creator Solve Rate → Revise
    type: user
    size: xl
    position:
      x: 820
      'y': 240
  - id: candidates
    label: |-
      Original Dataset
      1,287 Candidate Tasks
    type: database
    size: large
    position:
      x: 1080
      'y': 240
  - id: zero_audit
    label: |-
      Deep Research Audit
      Review 118 Tasks at 0% Pass
    type: process
    size: large
    position:
      x: 1340
      'y': 240
  - id: clean
    label: |-
      Remove 21 Problems
      Wrong Format / Ambiguous
      or Incorrect Reference
    type: process
    size: xl
    position:
      x: 1600
      'y': 240
  - id: dataset
    label: |-
      BrowseComp
      1,266 Final Questions
      Short Reference Answers
    type: database
    size: xl
    position:
      x: 1860
      'y': 240
  - id: human_study
    label: |-
      Human Difficulty Study
      1,255 Attempts; No AI
      Give Up after ≥2 h
      29.2% Solved
    type: user
    size: xl
    position:
      x: 2120
      'y': 60
  - id: agent_runs
    label: |-
      Browsing-agent Runs
      Persistent + Creative Search
      Short Predicted Answer
    type: process
    size: xl
    position:
      x: 2120
      'y': 420
  - id: grader
    label: |-
      AI Semantic-equivalence Grader
      Same Prompt as HLE
    type: process
    size: large
    position:
      x: 2380
      'y': 240
  - id: score
    label: |-
      BrowseComp Accuracy
      Optional Calibration Analysis
    type: terminal
    size: large
    position:
      x: 2640
      'y': 240
edges:
  - from: criteria
    to: inversion
    type: primary
  - from: inversion
    to: challenge
    type: primary
  - from: challenge
    to: peer_review
    type: primary
  - from: peer_review
    to: candidates
    type: primary
  - from: candidates
    to: zero_audit
    type: primary
  - from: zero_audit
    to: clean
    type: primary
  - from: clean
    to: dataset
    type: primary
  - from: dataset
    to: human_study
    type: primary
  - from: dataset
    to: agent_runs
    type: primary
  - from: human_study
    to: grader
    type: data
  - from: agent_runs
    to: grader
    type: primary
  - from: grader
    to: score
    type: primary
modules: []
