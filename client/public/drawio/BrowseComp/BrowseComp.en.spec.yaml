  title: BrowseComp Build Process
  description: >-
    Paper-aligned construction of BrowseComp: human trainers create inverted, fact-seeking questions from seed facts,
    verify that contemporary models and simple Google searches cannot solve them, revise under second-trainer review,
    remove ambiguous or incorrect tasks, and grade short answers by semantic equivalence.
  legend: Solid arrows show the human construction, filtering, evaluation, and grading flow.
