meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SWE-Lancer 构建流程
  description: 对齐论文的自由职业任务筛选，以及独立贡献者与工程管理两条评测分支。
  legend: 从左向右阅读；决策节点将可执行工程任务与方案选择任务分开，最后统一报告经济指标。
nodes:
  - id: source
    label: |-
      1,488 个 Expensify Upwork 任务
      真实支付总额 100 万美元
      涉及 100 位专业工程师
    type: database
    size: xl
    position:
      x: 40
      'y': 300
  - id: screening
    label: |-
      人工资格与清晰度审查
      IC 由 3 人复核，管理任务由 2 人复核
      超过 5,000 美元 IC 任务由 10 人验证
    type: process
    size: xl
    position:
      x: 320
      'y': 300
  - id: task_type
    label: |-
      任务类型？
      生成补丁或选择方案
    type: decision
    size: xl
    position:
      x: 600
      'y': 300
  - id: ic_tasks
    label: |-
      独立贡献者任务分支
      764 题 / 414,775 美元
      Issue + 修复前代码库快照
    type: document
    size: xl
    position:
      x: 880
      'y': 80
  - id: ic_tests
    label: |-
      构建隐藏 Playwright 端到端测试
      三轮验证修复态通过 / 缺陷态失败
      统一 Docker 且禁止联网
    type: process
    size: xl
    position:
      x: 1160
      'y': 80
  - id: ic_eval
    label: |-
      模型生成代码库补丁
      可选用户工具记录操作轨迹
      由隐藏端到端测试评分
    type: process
    size: xl
    position:
      x: 1440
      'y': 80
  - id: mgmt_tasks
    label: |-
      软件工程管理任务分支
      724 题 / 585,225 美元
      Issue + 至少两个候选方案
    type: document
    size: xl
    position:
      x: 880
      'y': 520
  - id: mgmt_eval
    label: |-
      模型选择最佳方案
      对照原管理者选择
      额外工程师复核一致率 99%
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: mgmt_score
    label: |-
      管理任务解决判定
      所选方案与参考答案一致
      无需生成代码库补丁
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: metrics
    label: |-
      经济价值评测
      Pass@1 + 获得的总报酬
      赚取率；Diamond 公开集 500,800 美元
    type: terminal
    size: xl
    position:
      x: 1720
      'y': 300
edges:
  - from: source
    to: screening
    type: primary
  - from: screening
    to: task_type
    type: primary
  - from: task_type
    to: ic_tasks
    type: primary
  - from: ic_tasks
    to: ic_tests
    type: primary
  - from: ic_tests
    to: ic_eval
    type: primary
  - from: ic_eval
    to: metrics
    type: primary
  - from: task_type
    to: mgmt_tasks
    type: secondary
  - from: mgmt_tasks
    to: mgmt_eval
    type: secondary
  - from: mgmt_eval
    to: mgmt_score
    type: secondary
  - from: mgmt_score
    to: metrics
    type: secondary
modules: []
