  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OfficeQA Full Build and Evaluation Process
  description: >-
    Paper-aligned construction of the 246-question OfficeQA Full benchmark from a century-scale Treasury Bulletin
    corpus, including multi-round human and agent quality assurance and deterministic answer scoring.
  legend: >-
    OfficeQA Full contains 113 Easy and 133 Pro questions. The default reported correctness uses zero allowable absolute
    relative error after answer-format normalization.
