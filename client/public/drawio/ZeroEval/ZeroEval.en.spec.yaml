meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ZeroEval Repository Execution and Task-Specific Scoring
  description: >-
    ZeroEval is an evaluation framework, not a fixed dataset. At official repository commit
    8c1485edf12c6efb5f69135a562927c5ad484059, zero_eval_local.sh and zero_eval_api.sh route repository task/model
    configuration through unified inference, task templates, sharding, cache/resume, output merging, and task-specific
    evaluators. Local vLLM/Hugging Face backends generate directly, while only configured API-provider calls use the
    bounded retry handler (retry_limit=10). Distinct scorers handle MMLU-Redux, GSM8K/MATH, CRUX, ZebraLogic, and
    G-PlanET. Expected result counts are completeness gates, not a construction total; no paper-side annotator or QC
    pipeline exists to draw.
  legend: >-
    Source: No independent ZeroEval benchmark paper was found. Primary source is the official WildEval/ZeroEval
    repository pinned at commit 8c1485edf12c6efb5f69135a562927c5ad484059: README.md; CITATION.cff; zero_eval_local.sh;
    zero_eval_api.sh; src/unified_infer.py; src/unified_utils.py; src/task_configs.py; src/_TEMPLATES.py;
    src/templates/{MCQA,OEQA,ZEBRA_GRID}.py; src/merge_results.py; and
    src/evaluation/{eval_utils,mcqa_eval,math_eval,crux_eval,zebra_grid_eval,summarize}.py. CITATION.cff dates the
    software release to 2024-07-18. DeepSeek-V3 arXiv:2412.19437 Appendix/Table 19 is supporting evidence only: it
    borrows the Zero-Eval prompt format for MMLU-Redux rather than defining ZeroEval or running this repository end to
    end.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
