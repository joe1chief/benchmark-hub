meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PutnamBench 构建与评测流程
  description: >-
    基于固定来源重建 NeurIPS 2024 论文中的 Lean 4、Isabelle、Coq 人工形式化顺序、第二人复核、
    解答析出任务、证明助手核验与 pass@n 评测。
  legend: >-
    实线表示论文流程；虚线区分来源许可、近论文期与当前仓库快照、数量漂移和分语言许可边界。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2407.11214v2
      PDF 0a990ea2dcfe
      当前仓库 982b29ea89d5
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: putnam_sources
    label: |-
      收集 640 道 Putnam 原题
      原始英文题面
      按需保留数值解答
      每题都要求自然语言证明
    type: database
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: category_inventory
    label: |-
      论文类别清单 · 类别可重叠
      代数 253 · 分析 226
      数论 107 · 几何 68
      线性代数 51 · 抽象代数 28
      组合 26 · 概率 9 · 集合论 8
    type: document
    size: xl
    position: { x: 980, y: 780 }
    style: { fontSize: 9 }
  - id: factored_solutions
    label: |-
      为约 60% 的问题
      析出闭式解答
      将解答放在定理陈述之外
      保留寻找解答的难度
    type: process
    size: xl
    position: { x: 740, y: 300 }
    style: { fontSize: 9 }
  - id: human_team
    label: |-
      人工形式化团队
      2 名博士生 + 5 名本科生
      具备数学、计算机和证明助手经验
      每题每语言平均约 25 分钟
    type: user
    size: xl
    position: { x: 980, y: 300 }
    style: { fontSize: 9 }
  - id: lean_forms
    label: |-
      首先用 Lean 4 形式化
      论文记录 640 份
      使用 Mathlib 定义
      全部人工构造
    type: process
    size: xl
    position: { x: 1220, y: 80 }
    style: { fontSize: 9 }
  - id: isabelle_forms
    label: |-
      随后用 Isabelle 形式化
      论文记录 640 份
      适配 HOL 基础
      并非机械翻译
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: coq_forms
    label: |-
      最后用 Coq 形式化
      论文记录 412 份
      MathComp · Coquelicot · GeoCoq
      按语言特性适配
    type: process
    size: xl
    position: { x: 1700, y: 520 }
    style: { fontSize: 9 }
  - id: second_person_verify
    label: |-
      独立同伴复核
      每份形式化至少由
      第二个人检查一次
      平均约 10 分钟
    type: process
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: paper_dataset
    label: |-
      PutnamBench 论文口径
      640 道问题
      Lean 640 + Isabelle 640 + Coq 412
      共 1,692 份形式化
    type: database
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: task_gate
    label: |-
      选择评测任务
      解答析出问题支持
      两种不同设置
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: task_one
    label: |-
      任务一
      推断闭式解答
      将其改写进定理
      再证明正确性
      论文基线未评测此任务
    type: document
    size: xl
    position: { x: 2660, y: 80 }
    style: { fontSize: 9 }
  - id: task_two
    label: |-
      任务二
      已给出定理与解答
      生成一份证明
      证明其正确性
    type: document
    size: xl
    position: { x: 2660, y: 520 }
    style: { fontSize: 9 }
  - id: prover_attempts
    label: |-
      生成证明尝试
      每题最多 n 次尝试
      论文 GPT-4o 基线为 pass@10
      温度 0.7
    type: process
    size: xl
    position: { x: 2900, y: 300 }
    style: { fontSize: 9 }
  - id: proof_check
    label: |-
      在 Lean 4 · Isabelle · Coq
      执行候选证明
      由目标证明助手认证
      成功或失败
    type: process
    size: xl
    position: { x: 3140, y: 300 }
    style: { fontSize: 9 }
  - id: pass_n
    label: |-
      报告 pass@n
      n 次尝试内至少一份
      证明通过形式化认证
    type: terminal
    size: xl
    position: { x: 3380, y: 300 }
  - id: maa_boundary
    label: |-
      来源许可边界
      英文原始题面
      经美国数学协会 MAA
      授权收录
    type: document
    size: xl
    position: { x: 500, y: 780 }
    style: { fontSize: 9 }
  - id: near_paper_release
    label: |-
      近论文期仓库快照
      93869067a543 · 2024-11-04
      644 + 640 + 412 = 1,696
      与论文 1,692 不同
    type: document
    size: xl
    position: { x: 2180, y: 780 }
    style: { fontSize: 9 }
  - id: current_release
    label: |-
      当前审计快照
      982b29ea89d5
      覆盖 1962–2025 年
      672 + 640 + 412 = 1,724
    type: document
    size: xl
    position: { x: 2420, y: 1020 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      分语言许可边界
      Lean 4 + Isabelle · Apache-2.0
      Coq · MIT
      非形式化题面依据 MAA 授权
    type: document
    size: xl
    position: { x: 2660, y: 1260 }
    style: { fontSize: 9 }
edges:
  - { from: source_evidence, to: putnam_sources, type: secondary, style: { dashed: true } }
  - { from: putnam_sources, to: factored_solutions, type: primary }
  - from: putnam_sources
    to: category_inventory
    type: secondary
    style: { dashed: true }
    waypoints:
      - { x: 460, y: 620 }
      - { x: 1080, y: 620 }
  - { from: factored_solutions, to: human_team, type: primary }
  - { from: human_team, to: lean_forms, type: primary }
  - { from: lean_forms, to: isabelle_forms, type: primary }
  - { from: isabelle_forms, to: coq_forms, type: primary }
  - { from: coq_forms, to: second_person_verify, type: primary }
  - { from: second_person_verify, to: paper_dataset, type: primary }
  - { from: paper_dataset, to: task_gate, type: primary }
  - { from: task_gate, to: task_one, type: primary }
  - { from: task_gate, to: task_two, type: primary }
  - { from: task_two, to: prover_attempts, type: primary }
  - { from: prover_attempts, to: proof_check, type: primary }
  - { from: proof_check, to: pass_n, type: primary }
  - from: putnam_sources
    to: maa_boundary
    type: secondary
    style: { dashed: true }
    waypoints:
      - { x: 360, y: 700 }
      - { x: 600, y: 700 }
  - { from: paper_dataset, to: near_paper_release, type: secondary, style: { dashed: true } }
  - { from: near_paper_release, to: current_release, type: secondary, style: { dashed: true } }
  - { from: current_release, to: license_boundary, type: secondary, style: { dashed: true } }
modules: []
