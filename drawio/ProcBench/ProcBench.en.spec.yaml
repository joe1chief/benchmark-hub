meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ProcBench Build and Evaluation Process
  description: >-
    Paper-v1 reconstruction of generator-defined procedural tasks, controlled problem lengths, simultaneous state
    labels, GPT-4o typed extraction, and exact step-aware metrics, with explicit review and release boundaries.
  legend: >-
    Solid arrows show paper-and-code-disclosed construction or evaluation. Dashed arrows mark fixed evidence, release
    licensing, absent manual-review provenance, or parser-prompt boundaries; they are not extra workflow stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2410.03117v1
      PDF cf5f2ecc5ba3
      Git 06b98344a730
      HF 182e5139c73
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: design_goal
    label: |-
      Isolate Instruction Followability
      Fix the Path to the Goal
      Minimize Implicit Knowledge
      Measure Direct Multi-step Inference
    type: document
    size: xl
    position:
      x: 280
      'y': 40
  - id: task_criteria
    label: |-
      Apply Task Design Criteria
      State the Complete Procedure
      Make Each Human Step Simple
      Require Only Basic English
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: task_families
    label: |-
      Define 23 Distinct Families
      String, List and Integer States
      Varied State-transition Rules
      No Specialized Domain Knowledge
    type: database
    size: xl
    position:
      x: 800
      'y': 40
  - id: fixed_templates
    label: |-
      Write One Fixed Template per Task
      Give the Full Procedure
      Specify Concrete Input Fields
      Request Every Resulting State
    type: document
    size: xl
    position:
      x: 1060
      'y': 40
  - id: step_schedule
    label: |-
      Schedule Controlled Lengths
      Problem Lengths 2 through 25
      Ten Examples at Each Length
      240 Examples per Task Family
    type: process
    size: xl
    position:
      x: 1320
      'y': 40
  - id: task_generator
    label: |-
      Run Task-specific Generators
      Sample Strings, Lists or Numbers
      Apply Template-defined Operations
      Save Question Configuration
    type: process
    size: xl
    position:
      x: 1580
      'y': 40
  - id: length_gate
    label: |-
      Enforce Requested Step Count
      Compare Generated State Length
      Drop Any Mismatched Sample
      Resample until the Slot Is Filled
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: ground_truth
    label: |-
      Generate Ground Truth Together
      Save Initial State
      Save All Intermediate States
      Save Typed Final State
    type: database
    size: xl
    position:
      x: 2100
      'y': 40
  - id: benchmark_release
    label: |-
      Freeze Paper-defined ProcBench
      23 Families × 240 Examples
      5,520 Examples in Total
      Fixed Template plus Question
    type: database
    size: xl
    position:
      x: 2360
      'y': 40
  - id: length_splits
    label: |-
      Derive Length Cohorts
      Short: 2 to 6 Steps
      Medium: 7 to 16 Steps
      Long: 17 to 25 Steps
    type: process
    size: xl
    position:
      x: 2620
      'y': 40
  - id: model_prompt
    label: |-
      Prompt for the Full Sequence
      Provide Template plus Question
      Require Intermediate and Final States
      No Task-specific Helper Prompt
    type: process
    size: xl
    position:
      x: 2360
      'y': 560
  - id: raw_response
    label: |-
      Collect Free-form Model Output
      Preserve the Raw Answer
      Preserve Model Usage Metadata
      Pass Text to Shared Extraction
    type: document
    size: xl
    position:
      x: 2100
      'y': 560
  - id: extraction_schema
    label: |-
      Infer a Per-task Typed Schema
      Read Ground-truth Field Types
      intermediate: Typed List
      final: Integer, String or List
    type: process
    size: xl
    position:
      x: 1840
      'y': 560
  - id: gpt4o_parser
    label: |-
      Normalize with GPT-4o
      Model gpt-4o-2024-08-06
      Structured-output Pydantic Parse
      Exclude Final from Intermediate List
    type: process
    size: xl
    position:
      x: 1580
      'y': 560
  - id: parse_outcome
    label: |-
      Materialize Parsed Prediction
      Keep intermediate and final Fields
      Preserve Task-specific Types
      On Failure Insert Empty Prediction
    type: document
    size: xl
    position:
      x: 1320
      'y': 560
  - id: exact_comparison
    label: |-
      Compare State Elements Exactly
      Cast Integer or String Predictions
      Require Equal List Length and Order
      Stop Prefix at First Mismatch
    type: process
    size: xl
    position:
      x: 800
      'y': 560
  - id: prefix_match_length
    label: |-
      Compute Prefix Match Length
      Start from the First Predicted State
      Count Consecutive Exact Matches
      Stop on the First Error
    type: process
    size: xl
    position:
      x: 540
      'y': 360
  - id: prefix_accuracy
    label: |-
      Compute Prefix Accuracy
      Divide PML by the Longer Sequence
      Penalize Extra Predicted States
      Penalize Missing Predicted States
    type: process
    size: xl
    position:
      x: 280
      'y': 360
  - id: sequential_match
    label: |-
      Compute Sequential Match
      One Only When PA Equals One
      Zero Otherwise
      Require Full Sequence Equality
    type: process
    size: xl
    position:
      x: 20
      'y': 360
  - id: final_match
    label: |-
      Compute Final Match
      Compare Last Target and Prediction
      Ignore Earlier State Mismatches
      Return a Binary Indicator
    type: process
    size: xl
    position:
      x: 280
      'y': 760
  - id: aggregate_report
    label: |-
      Report Four Step-aware Metrics
      PML · PA · SM · FM
      Average by Model and Task
      Also Aggregate by Length Cohort
    type: terminal
    size: xl
    position:
      x: 20
      'y': 760
  - id: release_boundary
    label: |-
      Pinned Release and Licenses
      Git tree 7aaeabca63f9 · MIT
      HF tree 95499b2392f3 · CC BY 4.0
      23 Task Files · 5,520 Rows
      Code and Data Licenses Differ
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 2620
      'y': 320
  - id: review_boundary
    label: |-
      Review Provenance Boundary
      Generator Produces Exact Labels
      Length Mismatch Triggers Resampling
      No Human Review Stage Is Disclosed
      Do Not Infer Manual Annotation
    type: document
    size: xl
    position:
      x: 2100
      'y': 320
  - id: parser_boundary
    label: |-
      Parser Prompt Boundary
      Fixed GPT-4o Extraction Model
      Dynamic Typed Pydantic Schema
      Empty Output on Parse Failure
      Reported Metrics Include Its Effect
    type: document
    size: xl
    position:
      x: 1580
      'y': 920
