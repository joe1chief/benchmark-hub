meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: XLRS-Bench Multi-Product Annotation and Evaluation
  description: >-
    XLRS-Bench combines 1,400 ultra-high-resolution images from six remote-sensing sources, applies multi-round human
    cross-validation, and creates three products: 13-task all-human VQA, two-task human grounding, and GPT-4o-assisted
    captions refined by humans using VQA evidence. Six bilingual experts translate and cross-check long-form content.
    Evaluation routes VQA to accuracy/OLUC exact-set match, grounding to Acc@IoU 0.5/0.7, and captions to
    BLEU/METEOR/ROUGE-L. The diagram must disclose the 45,942 headline versus 45,838 Table-5 sum conflict.
  legend: >-
    Source: XLRS-Bench arXiv:2503.23771v1, Figures 3-4, Sections 3.1-3.3 and 4.1-4.2, Tables 2-4, and Appendix A.4 Table
    5; project https://xlrs-bench.github.io/home_page.html, repository https://github.com/AI9Stars/XLRS-Bench, and
    release collection https://huggingface.co/collections/initiacms/xlrs-bench. Version pin: full-paper 1,400-image
    bilingual benchmark, not the earlier VQA-only lite release or website scale_en=10,784. Required conflict: repeated
    headline total is 45,942, while literal Appendix Table 5 rows sum to 45,838.. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
