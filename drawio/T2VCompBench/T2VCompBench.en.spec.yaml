meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T2V-CompBench Build and Evaluation Process
  description: >-
    T2V-CompBench contains 1,400 prompts, with 200 prompts in each of seven categories: consistent attribute binding,
    dynamic attribute binding, spatial relationships, motion binding, action binding, object interactions, and
    generative numeracy. The authors analyze 1.67 million unique VidProM prompts, organize concepts with WordNet
    metaclasses, retain thing rather than stuff objects, and collect 260 nouns, 200 active verbs, and 80 attributes.
    GPT-4 generates free-form prompts and parsed metadata; every prompt includes an active verb, humans verify and
    filter the outputs, and challenging uncommon concepts make up 20 percent of relevant categories. Evaluation samples
    six frames for MLLM metrics, sixteen for detection, and videos at eight frames per second for tracking. Grid-LLaVA
    scores consistent attributes, actions, and interactions from six-frame grids with chain-of-thought and disentangled
    questions. D-LLaVA checks initial and final frames for dynamic attributes. Grounding DINO plus geometric rules
    scores spatial and numeric composition, with SAM and Depth Anything supporting 3D relations. DOT tracks foreground
    and background motion. Human validation covers 651 videos with three MTurk raters and uses Kendall and Spearman
    correlations to select the category-specific automatic metrics.
  legend: >-
    Source: T2V-CompBench arXiv:2407.14505v2 Sections 3-5 and Appendix; official KaiyueSun98/T2V-CompBench repository
    and t2v-compbench-2025 project page. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
