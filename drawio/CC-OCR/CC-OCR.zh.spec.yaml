meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CC-OCR 构建流程
  description: >-
    基于论文对齐 CC-OCR：整合已有基准、重标注数据和新采集图像，组织成四条 OCR 任务轨道与 39 个子集， 用文本、LaTeX、HTML、JSON、SMILES 等格式标注，并经模型预标注、交叉验证和人工修正后按任务指标评测
    LMM。
  legend: 实线箭头表示数据来源、任务轨道、标注、质量修订和 LMM 评测流程。
nodes:
  - id: sources
    label: 来源
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: tracks
    label: 轨道
    type: process
    size: xl
    position:
      x: 300
      'y': 160
  - id: subsets
    label: 子集
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: annotate
    label: 标注
    type: user
    size: xl
    position:
      x: 820
      'y': 160
  - id: formats
    label: 格式
    type: process
    size: xl
    position:
      x: 1080
      'y': 70
  - id: refine
    label: 修订
    type: decision
    size: xl
    position:
      x: 1080
      'y': 250
  - id: metrics
    label: 指标
    type: process
    size: xl
    position:
      x: 1340
      'y': 160
  - id: lmms
