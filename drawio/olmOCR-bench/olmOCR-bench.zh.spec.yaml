meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: olmOCR-Bench 构建与评测流程
  description: >-
    依据论文v3重建七类来源专用PDF流程、确定性单元测试评测和来源等权宏平均，并明确标出固定发布与现行代码漂移边界。
  legend: >-
    实线表示论文构建与评测协议；虚线连接固定证据或披露、发布、评测器及许可边界，并非额外基准阶段。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2502.18443v3 · PDF d006f3f9100a
      Git f7cfe4c22098 · HF 54a96a6fb6a2
      论文定协议，快照审计代码与数据
    type: document
    size: xl
    position:
      x: 20
      'y': 460
  - id: benchmark_goal
    label: |-
      定义确定性OCR事实
      测试忠实页面线性化
      保留文本、结构与顺序
      避免完整参考或大模型裁判
    type: document
    size: xl
    position:
      x: 280
      'y': 460
  - id: eligibility
    label: |-
      执行论文资格过滤
      仅移除同时满足两个条件的文档
      含个人信息且并非为公开传播而准备
      附录复用训练混合数据PII提示
    type: process
    size: xl
    position:
      x: 540
      'y': 460
  - id: decontaminate
    label: |-
      与训练数据去污染
      对照olmOCR-mix-0225
      在PDF URL层面去重
      保持基准文档隔离
    type: process
    size: xl
    position:
      x: 800
      'y': 460
  - id: source_gate
    label: |-
      选择七类PDF来源之一
      使用来源专用采集路径
      创建简单可机器核验事实
      所有结果均进入人工复核
    type: decision
    size: xl
    position:
      x: 1060
      'y': 460
  - id: arxiv_math
    label: |-
      构建arXiv数学测试
      522份PDF · 2,927项公式测试
      单一TeX源文件及渲染PDF
      olmOCR · 动态对齐 · KaTeX · 复核
    type: process
    size: xl
    position:
      x: 1600
      'y': 20
  - id: old_scans_math
    label: |-
      构建老扫描数学测试
      36份PDF · 458项公式测试
      Internet Archive公版教材
      随机页面 · olmOCR · 人工公式
    type: process
    size: xl
    position:
      x: 1600
      'y': 170
  - id: tables
    label: |-
      构建表格测试
      188份PDF · 1,020项关系测试
      内部爬取库 · Gemini Flash 2.0
      随机单元格并人工复核
    type: process
    size: xl
    position:
      x: 1600
      'y': 320
  - id: old_scans
    label: |-
      构建老扫描文本测试
      98份PDF · 526项LoC测试
      人工转录驱动顺序脚本
      人工缺失测试并二次复核
    type: process
    size: xl
    position:
      x: 1600
      'y': 470
  - id: headers_footers
    label: |-
      构建页眉页脚测试
      266份PDF · 753项缺失测试
      DocLayout-YOLO的abandon区域
      遮罩 · Gemini Flash 2.0 · 人工边界
    type: process
    size: xl
    position:
      x: 1600
      'y': 620
  - id: multi_column
    label: |-
      构建多栏测试
      231份PDF · 884项顺序测试
      从内部爬取库目视抽样
      Claude Sonnet 3.7 HTML · 人工复核
    type: process
    size: xl
    position:
      x: 1600
      'y': 770
  - id: long_tiny_text
    label: |-
      构建长篇微小文字测试
      62份PDF · 442项存在测试
      Internet Archive高密度页面
      Gemini Flash 2.0 · 人工核验
    type: process
    size: xl
    position:
      x: 1600
      'y': 920
  - id: manual_review
    label: |-
      生成并复核各来源测试
      人工设计与复核
      GPT-4o提示生成 · 通常T=0.1
      人工修正事实与关系
      排除歧义或无效案例
    type: process
    size: xl
    position:
      x: 2140
      'y': 460
  - id: paper_scope
    label: |-
      冻结论文v3表格口径
      表10：1,403份PDF · 7,010项核心测试
      存在721 · 缺失823 · 顺序1,061
      表格1,020 · 公式3,385
    type: database
    size: xl
    position:
      x: 2400
      'y': 460
  - id: fixed_release
    label: |-
      封装固定HF发布
      1,403份PDF · 七个来源JSONL
      7,010项核心加9项显式基线
      修订54a96a6fb6a2采用ODC-BY-1.0
    type: database
    size: xl
    position:
      x: 2660
      'y': 460
  - id: run_ocr
    label: |-
      逐PDF页面运行OCR系统
      保留已发布的单页PDF
      输出Markdown或Unicode纯文本
      保持自然阅读顺序
    type: process
    size: xl
    position:
      x: 2660
      'y': 1400
  - id: normalize
    label: |-
      规范化可比较文本
      合并空白并移除强调标记
      将引号与连字符映射为ASCII
      将Unicode规范化为NFC
    type: process
    size: xl
    position:
      x: 2400
      'y': 1400
  - id: test_gate
    label: |-
      路由至论文测试族
      五类核心测试加基线
      评估简单页面级属性
      每项结果均为二元值
    type: decision
    size: xl
    position:
      x: 1900
      'y': 1400
  - id: baseline
    label: |-
      每份PDF执行一项基线
      要求输出含字母数字
      拒绝末尾重复超过30次的n元组
      拒绝意外中文、日文或表情符号
      除非该PDF已有例外配置
    type: process
    size: xl
    position:
      x: 1400
      'y': 1120
  - id: presence_absence
    label: |-
      测试文本存在与缺失
      必须存在721 · 必须缺失823
      模糊匹配并可限制首尾N字符
      存在测试默认区分大小写
    type: process
    size: xl
    position:
      x: 1400
      'y': 1280
  - id: reading_order
    label: |-
      测试自然阅读顺序
      1,061项先后关系
      模糊搜索两个文本片段
      要求有效的先后位置
    type: process
    size: xl
    position:
      x: 1400
      'y': 1440
  - id: table_accuracy
    label: |-
      测试表格单元格关系
      1,020项单元格与邻接事实
      解析Markdown或HTML表格
      复杂跨行列结构需要HTML
    type: process
    size: xl
    position:
      x: 1400
      'y': 1600
  - id: math_formula
    label: |-
      测试数学公式版式
      3,385个参考方程
      使用KaTeX渲染LaTeX
      匹配符号及相对边界框
    type: process
    size: xl
    position:
      x: 1400
      'y': 1760
  - id: source_rates
    label: |-
      按来源记录二元结果
      每项事实确定性通过或失败
      七个文档来源JSONL分组
      基线为第八组并计算各组通过率
    type: process
    size: xl
    position:
      x: 900
      'y': 1440
  - id: macro_score
    label: |-
      宏平均来源分数
      每个来源组权重相同
      总分等于各组通过率均值
      不对7,010项事实做微平均
    type: process
    size: xl
    position:
      x: 640
      'y': 1440
  - id: confidence
    label: |-
      报告总分与95%置信区间
      论文表4使用10,000次Bootstrap
      论文未说明重采样单位
      一致比较各OCR系统
    type: terminal
    size: xl
    position:
      x: 380
      'y': 1440
  - id: source_boundary
    label: |-
      构建披露边界
      未标识内部来源语料库
      未公开确切选择种子
      已命名大模型无不可变检查点
    type: document
    size: xl
    position:
      x: 1060
      'y': 940
  - id: release_boundary
    label: |-
      论文至发布计数边界
      正文写1,402，表10写1,403
      固定JSONL有7,019条物理记录
      即7,010项核心加9项基线
    type: document
    size: xl
    position:
      x: 2920
      'y': 460
  - id: evaluator_drift
    label: |-
      后续评测器漂移边界
      九项基线仍归入其来源组
      Git新增格式与脚注测试类型
      多数重复通过 · 1,000而非论文10,000
    type: document
    size: xl
    position:
      x: 640
      'y': 1960
  - id: license_boundary
    label: |-
      发布与许可边界
      固定数据集采用ODC-BY-1.0
      PDF保留各自来源信息
      原始上游权利仍然适用
    type: document
    size: xl
    position:
      x: 2920
      'y': 880
