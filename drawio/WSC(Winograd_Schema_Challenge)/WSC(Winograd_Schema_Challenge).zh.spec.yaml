meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WSC273版本构成与KR 2012建议协议
  description: >-
    KR 2012把严格Winograd
    Schema定义为仅相差一两个特殊词的句对，其中歧义代词在两个变体中的正确先行词相反。理想候选题应让普通人显然可解、不能依赖选择限制捷径，并对简单语料统计保持Google-proof。论文建议未来候选题先由正常英语母语成人做经验测试，再接纳到隐藏挑战题库；因此该建议验收门必须同时包含通过和修订/淘汰分支。与此分开，专家创作的原始benchmark快照后来包含285个样例；WSC273取其前273个样例并排除后加入的12个，以二元先行词选择和准确率评测。流程图不宣称WSC273全部执行并通过了论文建议的未来母语者协议。
  legend: >-
    来源：Levesque, Davis, and Morgenstern, The Winograd Schema Challenge, KR 2012, Sections 4-6 and 8 for the constrained
    schema criteria and proposed native-speaker/hidden-challenge protocol; Kocijan et al., A Review of Winograd Schema
    Challenge Datasets and Approaches, arXiv:2004.13831, Section 2.1 for the WSC285/WSC273 version relationship;
    official NYU benchmark catalog https://cs.nyu.edu/~davise/Benchmarks/Text.html and hub
    https://cs.nyu.edu/~davise/papers/WinogradSchemas/WS.html. Version pin: WSC273 is the first 273 examples of the
    285-example benchmark snapshot; it is shown separately from the paper's proposed future hidden challenge and is not
    claimed to have passed that proposed empirical protocol.。实线箭头表示论文或官方资料明确支持的主流程。
