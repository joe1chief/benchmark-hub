meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GraphWalks Build Process
  description: >-
    Official-record operation semantics, prompt packaging, corrected labels, published extractor boundary, and intended
    set grading.
  legend: >-
    No construction paper or graph-generation code is public. Dashed arrow marks pinned dataset evidence; solid arrows
    use only the current released records and README at revision f338bb26.
nodes:
  - id: evidence
    label: |-
      Primary evidence · no paper
      HF card/data f338bb26
      README + released Parquet records
    type: document
    size: xl
    position:
      x: 40
      'y': 320
  - id: graphs
    label: |-
      Use released directed edge-list graphs
      10-char node IDs · every node degree ≥1
      sampling algorithm not published
    type: database
    size: xl
    position:
      x: 300
      'y': 320
  - id: bfs
    label: |-
      BFS operation definition
      exactly the target depth
      exclude start/intermediate/revisited nodes
    type: process
    size: xl
    position:
      x: 560
      'y': 80
  - id: parents
    label: |-
      Parents operation definition
      incoming neighbors only
      exclude the target itself
    type: process
    size: xl
    position:
      x: 560
      'y': 560
  - id: gold
    label: |-
      Use released answer_nodes sets
      label-generation/validation code
      is not published
    type: process
    size: xl
    position:
      x: 820
      'y': 320
  - id: prompt
    label: |-
      Serialize each user prompt
      rules + four worked examples
      edge list + operation + output contract
    type: process
    size: xl
    position:
      x: 1080
      'y': 320
  - id: schema
    label: |-
      Pinned actual schema
      prompt · answer_nodes · prompt_chars
      problem_type · date_added
      README table says stale answer / 3-shot
    type: database
    size: xl
    position:
      x: 1340
      'y': 320
  - id: release
    label: |-
      Release two Parquet context groups
      1,150 train: 550 BFS + 600 parents
      shorter file 750 · long file 400
    type: database
    size: xl
    position:
      x: 1600
      'y': 320
  - id: repair
    label: |-
      Apply 2026 correctness repair
      fix 24/400 short-file parent labels
      clarify BFS as exact depth
      24 rows dated 02-27-2026
    type: process
    size: xl
    position:
      x: 1860
      'y': 320
  - id: run
    label: |-
      Ask model to reason step by step
      last line must be
      Final Answer: [node1, node2, ...]
    type: process
    size: xl
    position:
      x: 1860
      'y': 640
  - id: parser
    label: |-
      Published extractor uses last line
      regex Final Answer: [...]
      strip("[]") keeps prefix in first item
      no corrected official parser is published
    type: process
    size: xl
    position:
      x: 1600
      'y': 640
  - id: metric
    label: |-
      Published intended set grading
      precision · recall · F1
      empty/empty gives F1 = 1
      extractor bug affects executable scores
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 640
