meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MicroVQA Build and Evaluation Process
  description: >-
    Paper-aligned construction from expert microscopy questions through exam-style conversion, RefineBot shortcut
    removal, creator review, and exact official accuracy parsing, with paper-versus-scaffold boundaries made explicit.
  legend: >-
    Twelve biology experts created 1,061 raw samples. The paper releases 1,042 fully creator-reviewed MCQs but does not
    report the nineteen-item attrition rule. The final gate requires GPT-4o-2024-08-06 and Claude-3.5-Sonnet-20241022 to
    both fail across two random seeds. Failed RefineBot cases retain their Stage-one MCQ.
nodes:
  - id: tasks
    label: |-
      Define Three Research Tasks
      Interview Nine Microscopy PIs
      and Postdocs
      Expert Image Understanding
      Hypothesis Generation
      Experiment Proposal
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: experts
    label: |-
      Recruit 12 Biology Experts
      Diverse Microscopy Fields
      About 90 Samples per Expert
      Estimated Expert Time
      About 600 Hours
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: images
    label: |-
      Source Redistributable Images
      Contributors' Own Experiments
      Open Databases and CC-BY Papers
      Publications from January 2024 Onward
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: raw
    label: |-
      Create 1,061 Raw VQA Samples
      Up to Six RGB Images or Video Frames
      Question · Detailed Answer · Distractors
      Experimental Context and Motivation
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality
    label: |-
      Review Contributor Quality
      Research Difficulty · Task Fit · Diversity
      Main Text · Feedback after 10 and 40
      Appendix E.1 · Initial Four to Six
    type: process
    size: xl
    position:
      x: 980
      'y': 40
  - id: gold
    label: |-
      Create 50 Gold-standard MCQs
      Physician-scientist Leads Design
      One-best-answer NBME Format
      Preserve the Raw QA Objective
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: dspy
    label: |-
      Optimize the Stage-one Prompt
      DSPy MIPROv2 · CoT + RAG · o1-mini
      Judge Meaning · NBME Format · Clues
      Meaning Receives the Highest Weight
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: stage1
    label: |-
      Generate Stage-one Exam MCQs
      Preserve Scientific Meaning
      Produce One Best Answer
      Add Plausible Similar-length Distractors
    type: process
    size: xl
    position:
      x: 1820
      'y': 40
  - id: refine
    label: |-
      Run One RefineBot Attempt
      GPT-4o No-image Evaluator + Reflector
      Rewriter Uses Accumulated Reflections
      Equivalence Checker
      At Most Five Iterations
    type: process
    size: xl
    position:
      x: 1820
      'y': 420
  - id: refine_gate
    label: |-
      RefineBot Attempt Succeeds?
      Evaluator Wrong · Meaning Preserved
    type: decision
    size: xl
    position:
      x: 1540
      'y': 420
  - id: dual_gate
    label: |-
      Final Difficulty Gate Passes?
      Both Named Models Fail · Two Seeds
    type: decision
    size: xl
    position:
      x: 1260
      'y': 420
  - id: gate_models
    label: |-
      Final-gate Model Pair
      GPT-4o-2024-08-06
      Claude-3.5-Sonnet-20241022
    type: document
    size: xl
    position:
      x: 1260
      'y': 240
  - id: rerun
    label: |-
      Rerun the Whole RefineBot Attempt
      Use a Different Random Seed
      Paper Gives No Total Rerun Cap
      Some MCQs Still Never Pass
    type: process
    size: xl
    position:
      x: 1540
      'y': 760
  - id: stage1_fallback
    label: |-
      Retain the Stage-one MCQ
      Used when RefineBot Never Passes
      No Successful Stage-two Rewrite
    type: process
    size: xl
    position:
      x: 1260
      'y': 760
  - id: manual
    label: |-
      Original Creator Reviews Final MCQ
      Review All 1,042 Released Questions
      Check Correct Answer and Distractors
      Apply Minimal Corrections when Needed
    type: process
    size: xl
    position:
      x: 980
      'y': 420
  - id: attrition
    label: |-
      Construction-count Boundary
      1,061 Raw → 1,042 Final
      Nineteen-item Attrition Rule
      Not Reported in Paper or Dataset Card
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: release
    label: |-
      Release MicroVQA Test Split
      1,042 MCQs · 423 Multi-image
      Three Scientific-reasoning Tasks
      CC BY-SA 4.0 Dataset
    type: database
    size: xl
    position:
      x: 500
      'y': 420
  - id: eval_prompt
    label: |-
      Build the Paper Evaluation Prompt
      Image + Question
      One-indexed Choices
      MMMU-Pro CoT except LLaVA Families
      Request “The answer is (X)”
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: parse
    label: |-
      Parse the First Exact Answer Match
      Case-sensitive “answer is” + One Digit
      Allow Optional Bold and Parentheses
      Subtract One
      No Match Becomes Minus One
    type: process
    size: xl
    position:
      x: 20
      'y': 420
  - id: metrics
    label: |-
      Report Official Metrics
      Mean Accuracy over
      Every Released Row
      Missing or Bad-format Output
      Is Incorrect
      Per-task · No-image
      Choices-only Analyses
    type: terminal
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 760
  - id: scaffold_gap
    label: |-
      Pinned Evaluator Reproduction Boundary
      Paper Gives LLaVA
      Special Prefix + Suffix
      Current Code Applies
      One Shared Prompt
      CLI Uses test
      Batch Helper Requests train
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 260
      'y': 760
