meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  canvas: auto
  grid:
    size: 8
    snap: true
  title: MLGym-Bench Construction, Release, Agent Execution, and Evaluation
  description: >-
    Evidence-bounded reconstruction from arXiv:2502.14499v1, the last official repository commit before paper submission
    (075634859ec3ab16c56ca87678ec0fe564a27470), and public HEAD 9d40c1b. It separates the 13-task paper benchmark from
    mutable inputs, broken snapshot launchers, released ranking behavior, and later drift.
  legend: >-
    Solid arrows show the main build, execution, and scoring path. Dashed arrows show optional validation, continued
    research, or later source drift. Paper definitions and released-code fallbacks are named separately.
