meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedSafetyBench Build and Evaluation Process
  description: >-
    Paper-aligned construction from nine AMA medical-ethics principles through two harmful-request generation branches,
    manual curation, safe-response authoring, stratified splits, physician validation, safety judging, and alignment.
  legend: >-
    Solid arrows show the paper's construction, validation, and evaluation paths. Dashed arrows identify released-code
    and maintained-release boundaries that must not be mistaken for executable paper-era pipeline stages.
nodes:
  - id: principles
    label: |-
      Define Medical-safety Scope
      Nine AMA Ethics Principles
      Violation = Harmful Request
      Medical-specific Risk Taxonomy
    type: document
    size: xl
    position:
      x: 20
      'y': 180
  - id: gpt4_prompt
    label: |-
      GPT-4 Generation Branch
      Prompt One Principle at a Time
      Request 20 Medical Questions
      Include Medical Jargon
    type: process
    size: xl
    position:
      x: 260
      'y': 40
  - id: gpt4_filter
    label: |-
      Filter GPT-4 Requests
      900 Requests Total
      100 per Principle
      Remove Duplicates and Irrelevance
      Retain Direct Ethical Violations
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 40
  - id: llama_gcg
    label: |-
      Llama-2 Generation Branch
      Llama-2-7b-chat
      Greedy Coordinate Gradient
      Affirmative-target Jailbreak
    type: process
    size: xl
    position:
      x: 260
      'y': 320
  - id: llama_filter
    label: |-
      Filter GCG Requests
      900 Requests across Nine Principles
      Per-principle Counts
      118/114/62/112/100
      48/122/128/96
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 320
  - id: merge
    label: |-
      Merge and Deduplicate
      1,800 Unique Items
      900 GPT-4 + 900 Llama-2
      Nine-principle Coverage
    type: database
    size: xl
    position:
      x: 740
      'y': 180
  - id: safe_response
    label: |-
      Write Safe Demonstrations
      GPT-4 Refuses Each Request
      Adds Brief Ethical Explanation
      Manual Verification and Editing
    type: process
    size: xl
    position:
      x: 980
      'y': 180
  - id: split
    label: |-
      Stratify by Nine Principles
      MedSafety-Eval 900
      MedSafety-Improve 900
      Each = 450 + 450 Sources
    type: process
    size: xl
    position:
      x: 1220
      'y': 180
  - id: validation
    label: |-
      Physician Validation
      25 Doctors × 25 Random Requests
      625 Ratings · 567/625 Unethical
      482/567 Match ≥2 Principles
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1460
      'y': 40
  - id: release_boundary
    label: |-
      Maintained-release Boundary
      Current Repo Adds 74,374
      Post-paper Llama-3 Requests
      Exclude from Paper Benchmark
    type: document
    size: xl
    position:
      x: 740
      'y': 420
  - id: eval_input
    label: |-
      Safety Evaluation Inputs
      MedSafety-Eval 900
      GenSafety-Eval 330
      Harmful Requests Only
      Safe References Withheld
    type: document
    size: xl
    position:
      x: 1460
      'y': 620
  - id: inference
    label: |-
      Generate Free-form Responses
      General and Medical LLMs
      Greedy Decoding
      OpenAI Temperature 0
      Maximum 512 Tokens
    type: process
    size: xl
    position:
      x: 1220
      'y': 620
  - id: judge
    label: |-
      GPT Safety Judge
      gpt-3.5-turbo-0125
      Temperature 0
      AMA / General Policy
      Emit #reason and #score
    type: process
    size: xl
    position:
      x: 980
      'y': 620
  - id: score
    label: |-
      Interpret Judge Scores
      1 = Full Refusal
      5 = Full Compliance
      Lower Is Safer
      Report Mean + SEM
    type: process
    size: xl
    position:
      x: 740
      'y': 620
  - id: code_gap
    label: |-
      Released Evaluator Boundary
      Raw #reason and #score Text
      No Score Parser or Aggregator
      Reproduction Must Implement It
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 980
      'y': 800
  - id: improve_sets
    label: |-
      Build Alignment Mixtures
      Medical Safety 900
      General Safety 900
      Combined Safety 1,800
    type: database
    size: xl
    position:
      x: 1220
      'y': 920
  - id: finetune
    label: |-
      Fine-tune Medical LLMs
      Medalpaca 7B / 13B
      Meditron 7B
      Compare Three Safety Mixtures
    type: process
    size: xl
    position:
      x: 980
      'y': 920
  - id: capability
    label: |-
      Check Capability Retention
      MedQA · MedMCQA
      PubMedQA · MMLU-Medical
      Three-shot In-context Learning
      Random Training Examples
      Mean over 10 Random Seeds
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 740
      'y': 920
  - id: report
    label: |-
      Report Safety and Utility
      Safety Mean + SEM
      Before / After Alignment
      Capability Accuracy
    type: terminal
    size: xl
    position:
      x: 500
      'y': 920
edges:
  - from: principles
    to: gpt4_prompt
    type: primary
  - from: gpt4_prompt
    to: gpt4_filter
    type: primary
  - from: principles
    to: llama_gcg
    type: primary
  - from: llama_gcg
    to: llama_filter
    type: primary
  - from: gpt4_filter
    to: merge
    type: primary
  - from: llama_filter
    to: merge
    type: primary
  - from: merge
    to: safe_response
    type: primary
  - from: safe_response
    to: split
    type: primary
  - from: split
    to: validation
    type: primary
  - from: split
    to: eval_input
    type: primary
  - from: eval_input
    to: inference
    type: primary
  - from: inference
    to: judge
    type: primary
  - from: judge
    to: score
    type: primary
  - from: score
    to: report
    type: primary
  - from: split
    to: improve_sets
    type: primary
    waypoints:
      - x: 1680
        'y': 240
      - x: 1680
        'y': 980
      - x: 1440
        'y': 980
  - from: improve_sets
    to: finetune
    type: primary
  - from: finetune
    to: capability
    type: primary
  - from: capability
    to: report
    type: primary
  - from: judge
    to: code_gap
    type: secondary
    style:
      dashed: true
  - from: llama_filter
    to: release_boundary
    type: secondary
    style:
      dashed: true
modules: []
