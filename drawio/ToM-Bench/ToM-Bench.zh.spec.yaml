meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TMBench 构建与评测流程
  description: >-
    TMBench从ATOMS心智理论分类体系出发，去除视觉和混合能力后保留6个维度、31项社会认知能力。8个经典心理学任务覆盖其中19项能力；接受心理学家培训的作者为这些任务原创2470题，并为剩余12项能力各补20题，共2860道选择题。故事、问题、正确答案和可信干扰项均从零编写。两轮交叉检查加第三人裁决达到99.4%一致率。中文原题由看不到答案的GPT-4翻译成英文，再经人工核验。模型回答二选一或四选一问题，按任务和能力两个视角报告准确率。
  legend: >-
    来源：TMBench arXiv:2402.15052, Sections 3-4 and Appendix B; official zhchen18/ToMBench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
