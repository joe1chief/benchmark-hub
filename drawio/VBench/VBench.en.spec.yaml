meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VBench Build and Evaluation Process
  description: >-
    VBench decomposes text-to-video generation quality into 16 hierarchical, disentangled dimensions spanning video
    quality and condition consistency. For each dimension, the authors design a targeted prompt suite across content
    categories and pair it with a specialized automatic metric. Candidate video models generate outputs from the same
    prompts. Human annotators receive dimension-specific instructions, compare generated videos while ignoring
    irrelevant qualities, and create preference data used to validate alignment between each automatic metric and human
    perception. VBench reports fine-grained dimension and content-category scores plus an overall quality and semantic
    score, exposing model-specific strengths and weaknesses.
  legend: >-
    Source: VBench arXiv:2311.17982, Sections 3-5; official Vchitect/VBench repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
