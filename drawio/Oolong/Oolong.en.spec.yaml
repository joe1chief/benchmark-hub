meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: Oolong Dual-Branch Dataset Build and Pinned Release
  description: >-
    The upper branch builds Oolong-synth from ten ICL datasets; the lower branch builds Oolong-real from CRD3
    conversations and CritRoleStats. Target-model inference, parsing, and scoring are outside the diagram.
  legend: >-
    Synth and Real are constructed independently and converge at pinned Hugging Face releases. Counts come from the
    paper, pinned code, and local release checks.
