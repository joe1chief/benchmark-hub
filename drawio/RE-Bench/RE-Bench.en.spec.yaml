meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RE-Bench Build and Evaluation Process
  description: >-
    Fixed-source reconstruction of RE-Bench environment creation, human and agent runs, per-run score selection,
    normalization, and best-of-k aggregation across seven open-ended AI R&D environments.
  legend: >-
    Solid arrows reproduce paper-disclosed creation and evaluation. Dashed arrows mark fixed evidence, official-release,
    MIT-license, and non-binding contamination-request boundaries.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2411.15114v2
      PDF 9d25c5ea6abf
      Official Repo 93b98062e55f
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 9 }
  - id: design_goals
    label: |-
      Set Evaluation Design Goals
      Feasibility · Ecological Validity
      Resistance to Saturation
      Human/Agent Direct Comparison
    type: document
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: idea_sources
    label: |-
      Generate Environment Ideas
      ML Practitioner Discussions
      Relevant Literature
      Prior METR Work Experience
    type: process
    size: xl
    position: { x: 500, y: 300 }
    style: { fontSize: 9 }
  - id: specification
    label: |-
      Specification Stage
      Written Task Description
      Scoring Function Proposal
      Starting-solution Proposal
    type: document
    size: xl
    position: { x: 740, y: 300 }
  - id: spec_review
    label: |-
      Review and Rework Specification
      Cover Key AI R&D Challenges
      Human Progress + High Ceiling
      Practical to Implement
    type: process
    size: xl
    position: { x: 980, y: 300 }
    style: { fontSize: 9 }
  - id: implementation
    label: |-
      Implementation Stage
      Build Full Evaluation Environment
      Add Internal High-scoring Solution
      Rework against Requirements
    type: process
    size: xl
    position: { x: 1220, y: 300 }
    style: { fontSize: 9 }
  - id: human_trials
    label: |-
      Baselining Stage
      Run Human Experts
      Observe Progress and Ceiling
      Identify Practical Failures
    type: user
    size: xl
    position: { x: 1460, y: 300 }
  - id: baseline_review
    label: |-
      Reassess Environment
      Keep · Revise · Drop
      Significant Adjustments Common
    type: process
    size: xl
    position: { x: 1700, y: 300 }
  - id: revision_loop
    label: |-
      Requirements Not Met
      Return to Specification
      for Another Revision
    type: process
    size: xl
    position: { x: 1460, y: 760 }
  - id: discarded
    label: |-
      Discard Failed Candidates
      More than 12 Specifications
      More than 5 Implementations
    type: terminal
    size: xl
    position: { x: 1700, y: 980 }
  - id: paper_suite
    label: |-
      RE-Bench V1 · Seven Environments
      LLM Foundry · Triton Kernel · Embedding
      Scaling Law · Restricted MLM
      GPT-2 QA · Rust Codecontests
      Open-ended ML Research Engineering
    type: database
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: environment_contract
    label: |-
      Package Each Environment
      Instructions + Resources + Scorer
      Poor Starting Solution Is Visible
      Strong Reference Solution Is Hidden
    type: document
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: actor_gate
    label: |-
      Run under Comparable Conditions
      Wall-clock Time Budget
      At Most 6 H100s per Environment
    type: process
    size: xl
    position: { x: 2420, y: 300 }
  - id: human_runs
    label: |-
      Human Expert Baseline
      71 Eight-hour Attempts
      61 Distinct Experts
      Same Environment Conditions
    type: user
    size: xl
    position: { x: 2660, y: 80 }
  - id: agent_runs
    label: |-
      AI Agent Attempts
      Vary Agent Design and Budget
      Work inside Same Task Interface
    type: process
    size: xl
    position: { x: 2660, y: 520 }
  - id: task_work
    label: |-
      Iterate on the Open-ended Task
      Edit Files · Run Code · Experiment
      Invoke Scorer during the Run
      Timestamp Scores in a Log
    type: process
    size: xl
    position: { x: 2900, y: 300 }
    style: { fontSize: 9 }
  - id: score_gate
    label: |-
      Select Per-run Raw Score
      Standard Environments versus
      Scaling Law Experiment
    type: process
    size: xl
    position: { x: 3140, y: 300 }
  - id: highest_log
    label: |-
      Six Standard Environments
      Take Highest Score Registered
      in the Score Log by Run End
    type: process
    size: xl
    position: { x: 3380, y: 80 }
  - id: scaling_final
    label: |-
      Scaling Law Experiment
      Agent Cannot See Achieved Score
      Only Final Submission Counts
    type: process
    size: xl
    position: { x: 3380, y: 520 }
  - id: normalize
    label: |-
      Linearly Normalize Each Task
      Raw y · Starting ys · Reference yr
      yn = (y - ys) / (yr - ys)
      Starting = 0 · Reference = 1
    type: process
    size: xl
    position: { x: 3620, y: 300 }
  - id: floor_score
    label: |-
      Apply Score Boundary
      Worse than Starting Becomes 0
      Scores Greater than 1 Are Allowed
    type: process
    size: xl
    position: { x: 4100, y: 300 }
  - id: normalized_score
    label: |-
      Per-run Normalized Score
      Comparable across
      Seven Environments
    type: database
    size: xl
    position: { x: 4340, y: 300 }
  - id: best_of_k
    label: |-
      Build score@k Samples
      Sample k Runs with Replacement
      within Each Environment
    type: process
    size: xl
    position: { x: 4580, y: 300 }
  - id: selection_gate
    label: |-
      Aggregate k Sampled Runs
      Observable-score Tasks versus
      Hidden-score Scaling Law
    type: process
    size: xl
    position: { x: 4820, y: 300 }
  - id: max_select
    label: |-
      Standard Environments
      Select Highest Score
      among k Sampled Runs
    type: process
    size: xl
    position: { x: 5060, y: 80 }
  - id: random_select
    label: |-
      Scaling Law Environment
      Score Is Unobservable
      Select One Sampled Run Randomly
    type: process
    size: xl
    position: { x: 5060, y: 520 }
  - id: score_report
    label: |-
      Report score@k
      Average Normalized Score
      across Seven Environments
      Compare Humans and Agents
    type: terminal
    size: xl
    position: { x: 5300, y: 300 }
    style: { fontSize: 9 }
  - id: release_snapshot
    label: |-
      Fixed Official Release
      Commit 93b98062e55f
      Seven Task Families
      suite_manifest 0f6205a46c61
    type: document
    size: xl
    position: { x: 1940, y: 1080 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      License Boundary
      Repository Uses MIT
      LICENSE 0651c2b4111f
    type: document
    size: xl
    position: { x: 2180, y: 1320 }
    style: { fontSize: 9 }
  - id: contamination_boundary
    label: |-
      Non-binding Release Request
      Avoid Training-set Contamination
      Avoid Publishing Unprotected Solutions
      Separate from MIT License Terms
    type: document
    size: xl
    position: { x: 1940, y: 1560 }
    style: { fontSize: 9 }
edges:
  - { from: source_evidence, to: design_goals, type: secondary, style: { dashed: true } }
  - { from: design_goals, to: idea_sources, type: primary }
  - { from: idea_sources, to: specification, type: primary }
  - { from: specification, to: spec_review, type: primary }
  - { from: spec_review, to: implementation, type: primary }
  - { from: implementation, to: human_trials, type: primary }
  - { from: human_trials, to: baseline_review, type: primary }
  - { from: baseline_review, to: paper_suite, type: primary }
  - { from: spec_review, to: revision_loop, type: primary }
  - { from: baseline_review, to: revision_loop, type: primary }
  - from: revision_loop
    to: specification
    type: primary
    style: { exitX: 0.5, exitY: 0, entryX: 0.5, entryY: 1 }
  - { from: spec_review, to: discarded, type: primary }
  - { from: baseline_review, to: discarded, type: primary }
  - { from: paper_suite, to: environment_contract, type: primary }
  - { from: environment_contract, to: actor_gate, type: primary }
  - { from: actor_gate, to: human_runs, type: primary }
  - { from: actor_gate, to: agent_runs, type: primary }
  - { from: human_runs, to: task_work, type: primary }
  - { from: agent_runs, to: task_work, type: primary }
  - { from: task_work, to: score_gate, type: primary }
  - { from: score_gate, to: highest_log, type: primary }
  - { from: score_gate, to: scaling_final, type: primary }
  - { from: highest_log, to: normalize, type: primary }
  - { from: scaling_final, to: normalize, type: primary }
  - { from: normalize, to: floor_score, type: primary }
  - { from: floor_score, to: normalized_score, type: primary }
  - { from: normalized_score, to: best_of_k, type: primary }
  - { from: best_of_k, to: selection_gate, type: primary }
  - { from: selection_gate, to: max_select, type: primary }
  - { from: selection_gate, to: random_select, type: primary }
  - { from: max_select, to: score_report, type: primary }
  - { from: random_select, to: score_report, type: primary }
  - { from: paper_suite, to: release_snapshot, type: secondary, style: { dashed: true } }
  - { from: release_snapshot, to: license_boundary, type: secondary, style: { dashed: true } }
  - { from: release_snapshot, to: contamination_boundary, type: secondary, style: { dashed: true } }
