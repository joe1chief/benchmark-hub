meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ArtifactsBench Build Process
  description: >-
    Paper-aligned candidate sourcing, filtering, checklist calibration, sandbox screenshot evaluation, and MLLM-as-Judge
    validation workflow for ArtifactsBench, based on arXiv:2507.04952.
  legend: >-
    Solid arrows show benchmark construction and automated evaluation; dashed arrows mark ambiguity repair, human
    validation, and WebDev Arena alignment.
nodes:
  - id: candidate_sources
    label: |-
      Candidate sources
      expert showcases
      SVG/web snippets and screenshots
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: filtering
    label: |-
      Sourcing and filtering
      remove invalid, trivial
      non-visual or non-interactive items
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: dedup
    label: |-
      Dedup and contamination control
      MinHash, semantic similarity
      screenshot perceptual hashing
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: rewriting
    label: |-
      Prompt rewriting
      expert clarity pass
      30/40/30 difficulty calibration
    type: document
    size: xl
    position:
      x: 560
      'y': 70
  - id: checklist
    label: |-
      Checklist calibration
      10 dimensions
      LLM draft and human refinement
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: dataset
    label: |-
      ArtifactsBench dataset
      1,825 executable queries
      nine topics and calibrated tiers
    type: database
    size: xl
    position:
      x: 820
      'y': 160
  - id: execution
    label: |-
      Sandbox execution
      Playwright 1024x768
      before, during, after screenshots
    type: terminal
    size: xl
    position:
      x: 1080
      'y': 70
  - id: judge
    label: |-
      MLLM-as-Judge
      checklist-guided dual referees
      code plus visual evidence
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: validation
    label: |-
      Alignment report
      280-instance human study
      94.4% WebDev Arena consistency
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: candidate_sources
    to: filtering
    type: primary
  - from: filtering
    to: dedup
    type: primary
  - from: dedup
    to: rewriting
    type: primary
  - from: dedup
    to: filtering
    type: optional
    label: re-author or discard
  - from: rewriting
    to: checklist
    type: primary
  - from: checklist
    to: dataset
    type: primary
  - from: dataset
    to: execution
    type: primary
  - from: execution
    to: judge
    type: primary
  - from: judge
    to: validation
    type: primary
  - from: validation
    to: checklist
    type: optional
    label: human and Arena calibration
modules: []
