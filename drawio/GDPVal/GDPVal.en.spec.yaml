meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GDPVal Build Process
  description: Paper-aligned sector selection, expert task authoring, quality control, release, and expert comparison.
  legend: >-
    Evidence is pinned to arXiv:2510.04374v1 and public dataset 11e7900c. The 1,320-task full set is private; the
    220-task gold set is public. The paper's automated grader is experimental and its implementation is not released.
nodes:
  - id: evidence
    label: |-
      Evidence snapshot
      paper 2510.04374v1
      public data 11e7900c
      grader code: not released
    type: document
    size: xl
    position:
      x: 40
      'y': 160
  - id: sectors
    label: |-
      Select Q2 2024 U.S. sectors
      each contributes >5% of GDP
      retain 9 sectors
    type: database
    size: xl
    position:
      x: 296
      'y': 160
  - id: occupations
    label: |-
      Select digital occupations
      GPT-4o classifies O*NET tasks
      weighted digital share ≥60%
      top compensation choices → 44 roles
    type: process
    size: xl
    position:
      x: 552
      'y': 160
  - id: experts
    label: |-
      Qualify occupation experts
      interview · checks · training · quiz
      <10% selected · ≥4 years
      average experience: 14 years
    type: process
    size: xl
    position:
      x: 808
      'y': 160
  - id: authoring
    label: |-
      Author realistic work tasks
      request + references + deliverable
      map to O*NET work activity
      value = time × median hourly wage
    type: process
    size: xl
    position:
      x: 1064
      'y': 160
  - id: qc
    label: |-
      Screen, review, and revise
      model flags are advisory only
      at least 3 human reviews
      5 human reviews on average
    type: process
    size: xl
    position:
      x: 1064
      'y': 400
  - id: release
    label: |-
      Full private set: 1,320 tasks
      30 per role · about 7 hours each
      public gold: 220 · 5 per role
      prompt/ref/deliverable/rubric fields
    type: database
    size: xl
    position:
      x: 808
      'y': 400
  - id: model_runs
    label: |-
      Generate complete deliverables
      prompt + reference files as input
      3 independent samples per task
    type: process
    size: xl
    position:
      x: 552
      'y': 400
  - id: human_grade
    label: |-
      Blind experts to provenance
      model versus human deliverable
      3 graders × 3 samples
      9 comparisons per task
    type: process
    size: xl
    position:
      x: 296
      'y': 400
  - id: metric
    label: |-
      Score win 1 · tie 0.5 · loss 0
      main: better-or-tied share
      appendix: better-only win rate
      report by occupation and overall
    type: terminal
    size: xl
    position:
      x: 40
      'y': 400
