meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VitaBench — 任务构建、代理循环与严格计分
  description: >-
    VitaBench 在三个真实应用领域中定义 66 个工具、明确的前后条件与依赖图，并用用户模拟器逐步披露需求。用户画像、复合真实请求、真实/合成环境数据及人工 rubric 汇入“多轮试跑—人工验收”循环，最终保留 400
    个任务：100 个跨领域任务和 300 个单领域任务（外卖、到店、OTA 各100）。评测让代理与用户模拟器和工具交互，直到输出 ###STOP### 或失败；再按重叠轨迹窗口更新持久 rubric
    状态，每题独立运行四次。严格成功要求所有 rubric 均满足，并报告 Avg@4、Pass@4、Pass^4。
  legend: >-
    来源：arXiv:2509.26490v2, Sections 3.2-3.3 (pp.4-6) and Section 4.1 (p.6); official repository:
    https://github.com/meituan-longcat/vitabench. The diagram is pinned to paper v2; later repository
    evaluator/database/result updates are maintenance drift, not paper evidence.。实线箭头表示论文或官方资料明确支持的主流程。
