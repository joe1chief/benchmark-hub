meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TempCompass Build and Evaluation Process
  description: >-
    TempCompass defines five temporal aspects—Action, Speed, Direction, Attribute Change, and Event Order—with ten
    fine-grained sub-aspects and nine static-content categories. Raw videos are collected from Shutterstock, balanced
    across content categories, and checked not to occur in WebVid. To prevent language-prior and single-frame shortcuts,
    the authors construct conflicting pairs or triplets that preserve static content but change a temporal property
    through reversal, spatial concatenation, or temporal concatenation. Humans annotate 500 semi-structured
    subject-plus-temporal meta-information records over 410 videos. ChatGPT gpt-3.5-turbo first generates
    multiple-choice questions; humans correct them, after which ChatGPT derives Yes/No QA, Caption Matching, and Caption
    Generation instructions that are again human-corrected. At least 3, 2, 3, and 4 instructions per meta-information
    item yield 7,540 total instructions. Quality verification gives 200 sampled instructions to three humans. Evaluation
    first uses task-specific rules to parse explicit options for the first three formats and sends unmatched responses
    to ChatGPT. Caption Generation is judged only by asking ChatGPT to answer the corresponding multiple-choice question
    from the generated caption, including a None option. Accuracy is reported by task and temporal aspect.
  legend: >-
    Source: TempCompass arXiv:2403.00476 Sections 3.1-3.4 and official llyx97/TempCompass repository. Solid arrows show
    the main flow explicitly supported by the paper or official documentation.
