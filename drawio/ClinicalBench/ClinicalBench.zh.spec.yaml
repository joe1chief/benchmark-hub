meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClinicalBench 构建流程
  description: 与论文 v2 对齐的 ClinicalBench 流程：固定 MIMIC 版本，筛选首次就诊队列，分层划分并仅平衡训练集，再在三项预测任务上公平比较传统机器学习与开源 LLM。
  legend: 实线遵循论文实验；虚线分支记录当前 README 的 MIMIC-IV 版本漂移。
nodes:
  - id: evidence_boundary
    label: |-
      论文与固定仓库边界
      arXiv 2411.06469v2 • §2
      §§3–5 • 附录 A–D
      官方仓库 e7828b1
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: release_drift
    label: |-
      当前仓库 README 漂移
      MIMIC-IV 3.0 下载入口
      论文合同仍为 v2.2
    type: document
    size: xl
    position:
      x: 340
      'y': 440
  - id: data
    label: |-
      论文数据版本
      MIMIC-III v1.4
      MIMIC-IV v2.2
      需授权临床数据库
    type: database
    size: xl
    position:
      x: 340
      'y': 220
  - id: tasks
    label: |-
      定义三类预测任务
      住院时长：三分类
      死亡：本次就诊二分类
      再入院：两周内二分类
    type: document
    size: xl
    position:
      x: 640
      'y': 220
  - id: cohort
    label: |-
      筛选患者队列
      仅保留每位患者首次就诊
      年龄 ≥18 • 无缺失值
    type: process
    size: xl
    position:
      x: 940
      'y': 220
  - id: split
    label: |-
      分层划分训练／验证／测试集
      提示法使用同一测试集
      ML 与微调使用同一划分
    type: process
    size: xl
    position:
      x: 1240
      'y': 220
  - id: balance
    label: |-
      通过欠采样重平衡标签
      仅处理训练集
      验证集与测试集保持不变
    type: process
    size: xl
    position:
      x: 1540
      'y': 220
  - id: structured
    label: |-
      准备结构化 ML 特征
      人口统计 • 诊断
      操作 • 用药／药物
    type: process
    size: xl
    position:
      x: 1840
      'y': 40
  - id: text
    label: |-
      将代码转换为文本
      ICD-9/10 诊断 + 操作
      ATC 用药／药物名称
    type: process
    size: xl
    position:
      x: 1840
      'y': 400
  - id: ml
    label: |-
      训练 11 个传统 ML 模型
      LR • SVM • 树模型 • XGBoost
      KNN • MLP
      Transformer • RNN
      标准监督训练
    type: terminal
    size: xl
    position:
      x: 2140
      'y': 40
  - id: llms
    label: |-
      评测 22 个开源 LLM
      14 个通用 + 8 个医疗模型
      排除闭源模型
      遵循 MIMIC 数据政策
    type: terminal
    size: xl
    position:
      x: 2140
      'y': 400
  - id: prompt
    label: |-
      比较提示策略
      直接提示 + 思维链
      自我反思 • 角色扮演
      上下文学习
    type: process
    size: xl
    position:
      x: 2440
      'y': 300
  - id: finetune
    label: |-
      任务专属微调
      LoRA Full + LoRA Last Layer
      训练 20 轮
      按验证集选择检查点
    type: process
    size: xl
    position:
      x: 2440
      'y': 500
  - id: predictions
    label: |-
      收集保留集预测
      ML 与 LLM 同场比较
      使用相同评测病例
      同时比较规模与温度
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: metrics
    label: |-
      应用任务专属指标
      住院时长：Macro F1 + AUROC
      死亡／再入院：F1 + AUROC
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
  - id: report
    label: |-
      报告五次运行 + 95% 置信区间
      混淆矩阵
      微调损失曲线
      跨策略结论
    type: terminal
    size: xl
    position:
      x: 3340
      'y': 220
edges:
  - from: evidence_boundary
    to: data
    type: primary
  - from: evidence_boundary
    to: release_drift
    type: data
  - from: data
    to: tasks
    type: primary
  - from: tasks
    to: cohort
    type: primary
  - from: cohort
    to: split
    type: primary
  - from: split
    to: balance
    type: primary
  - from: balance
    to: structured
    type: primary
  - from: balance
    to: text
    type: primary
  - from: structured
    to: ml
    type: primary
  - from: text
    to: llms
    type: primary
  - from: llms
    to: prompt
    type: primary
  - from: llms
    to: finetune
    type: primary
  - from: ml
    to: predictions
    type: primary
  - from: prompt
    to: predictions
    type: primary
  - from: finetune
    to: predictions
    type: primary
  - from: predictions
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
