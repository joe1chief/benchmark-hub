); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(620,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>T1 问题 + 可执行公共 API 动态答案</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>T2 官方直接事实，不做计算</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>T3 可靠表格 + 多源计算</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="776" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(876,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>50 名标注专家 + 20 名资深专家 = 70</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>至少硕士学历，保持金融从业身份</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>约 180 + 60 个专家工时</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1040" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1140,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>交叉核验申报文件、权威网站与数据库</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>明确定义/日期，规避易变指标</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>设置答案范围或明确容差</tspan></text></g></g></g></g><g data-cell-id="7"><g><rect x="1296" y="0" width="200" heig