6f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(645,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>T1 questions + executable public-API answers</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>T2 official direct facts; no calculation</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>T3 verified tables + multi-source calculation</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="801" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(901,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>50 annotators + 20 senior reviewers = 70</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>minimum Master's; active finance roles</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>about 180 + 60 expert-hours</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="1065" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1165,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Cross-check filings, authorities, databases</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>state definitions/dates; avoid unstable metrics</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>set answer ranges or explicit tolerances</tspan></text></g></g></g></g><g data-cell-id="7"><g><rect x="1321" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1421,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>1-2 other experts solve blind to the answer key</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>senior panel edits or arbitrates differences</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>ambiguous items are revised or discarded</tspan></text></g></g></g></g><g data-cell-id="8"><g><path d="M 1585 15 C 1585 6.72 1629.77 0 1685 0 C 1711.52 0 1736.96 1.58 1755.71 4.39 C 1774.46 7.21 1785 11.02 1785 15 L 1785 85 C 1785 93.28 1740.23 100 1685 100 C 1629.77 100 1585 93.28 1585 85 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1785 15 C 1785 23.28 1740.23 30 1685 30 C 1629.77 30 1585 23.28 1585 15" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1685,42.7) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Release: 635 bilingual questions</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Global 337 