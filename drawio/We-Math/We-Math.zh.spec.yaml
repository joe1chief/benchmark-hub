meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: We-Math 数据构建与诊断评测流程
  description: >-
    We-Math依据教材构建五层知识体系，含99个节点与67个叶子概念，再从权威公开网站、考试和练习中收集6524道全新的视觉数学多选题。合格题需包含多个概念或可分解、图文一致，并有唯一正确答案与有迷惑性的干扰项。三名专家标注概念，至少两人一致才保留；同时标注解题步骤与步数，第二轮专家复核图文、答案与概念对齐。复合题被拆为逻辑连贯的概念子题。正式计分使用1,740题Testmini（一步1,215题、二步360题、三步165题），而非直接使用6,524题全量池。评测统一多选输出并用正则解析，联合复合题与子题的正确性划分IK、IG、CM、RM，并按默认α=0、β=0.5计算Score_average
    = αS_IK + βS_IG + S_CM。
  legend: >-
    来源：We-Math arXiv:2407.01284, Sections 2.1 and 2.2, Section 3, and Appendices B.4-B.5; official repository
    https://github.com/We-Math/We-Math.。实线箭头表示论文或官方资料明确支持的主流程。
