meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BrowseComp-Plus Build Process
  description: >-
    Paper-aligned 1,266 → 1,142 → 1,005 → 830 filtering funnel, hard-negative mining only after human verification,
    fixed-corpus agent evaluation with GPT-4.1 judging, citation scoring, and a separate standalone retrieval contract.
  legend: Solid arrows show construction or end-to-end evaluation; dashed data arrows feed independent diagnostics.
nodes:
  - id: original
    label: |-
      Original BrowseComp
      1,266 Question-answer Pairs
      Start Evidence Collection
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: o3_gate
    label: |-
      Run o3 with Web Search
      124 Fail: Formatting or Abstention
      Exclude Failed Responses
    type: process
    size: xl
    position:
      x: 290
      'y': 420
  - id: after_o3
    label: |-
      Retain 1,142 Queries
      Structured Clues • URLs • Snippets
      Continue to Page Collection
    type: database
    size: xl
    position:
      x: 540
      'y': 420
  - id: scrape
    label: |-
      Scrape Every Cited URL
      Selenium + Trafilatura
      Extract Candidate Evidence Text
    type: process
    size: xl
    position:
      x: 790
      'y': 420
  - id: scrape_gate
    label: |-
      Validate Retrieved Pages
      137 Hallucinated URLs or Scrape Failures
      Exclude Unusable Queries
    type: process
    size: xl
    position:
      x: 1040
      'y': 420
  - id: after_scrape
    label: |-
      Retain 1,005 Queries
      Candidate Evidence Is Scrapeable
      Send Every Query to Human Review
    type: database
    size: xl
    position:
      x: 1290
      'y': 420
  - id: human_verify
    label: |-
      Human-verify Clues and Answerability
      14 Annotators • 400+ Hours • >80% Agreement
      Revise or Search ≥20 Minutes When Needed
    type: user
    size: xl
    position:
      x: 1540
      'y': 420
  - id: verified
    label: |-
      Final 830 Verified Queries
      Evidence Docs Support Reasoning
      Gold Docs Also Contain the Final Answer
    type: database
    size: xl
    position:
      x: 1790
      'y': 420
  - id: decompose
    label: |-
      GPT-4o Query Decomposition
      About Seven Sub-queries per Query
      Run Only on the Final 830
    type: process
    size: xl
    position:
      x: 2040
      'y': 820
  - id: hard_negatives
    label: |-
      Mine Hard Negatives
      SerpAPI: Up to 100 Results per Sub-query
      Keep Related but Non-supporting Documents
    type: process
    size: xl
    position:
      x: 2290
      'y': 820
  - id: corpus
    label: |-
      Fixed Deduplicated Corpus
      100,195 Documents for 830 Queries
      Evidence + Gold Qrels + Hard Negatives
    type: database
    size: xl
    position:
      x: 2540
      'y': 420
  - id: retrievers
    label: |-
      Configure Retrieval
      BM25 • Qwen3 Embedding • ReasonIR
      Oracle Evidence Context for Comparison
    type: process
    size: xl
    position:
      x: 2790
      'y': 420
  - id: topk
    label: |-
      Agent Search Interface
      Top 5 • 512 Tokens per Result
      Optional Full-document Tool
    type: process
    size: xl
    position:
      x: 3040
      'y': 420
  - id: agent
    label: |-
      Deep-research Agent
      Iterative Search and Cross-checking
      Final Answer with Document Citations
    type: process
    size: xl
    position:
      x: 3290
      'y': 420
  - id: end_to_end
    label: |-
      End-to-end Answer Evaluation
      GPT-4.1 Judge: Accuracy + Recall
      Search Calls + Calibration Error
    type: process
    size: xl
    position:
      x: 3540
      'y': 20
  - id: citation_score
    label: |-
      End-to-end Citation Evaluation
      Coverage + Count
      Citation Precision + Recall
    type: process
    size: xl
    position:
      x: 3540
      'y': 420
  - id: retrieval_score
    label: |-
      Standalone Retrieval Evaluation
      Evidence / Gold Recall@5, 100, 1000
      nDCG@10 against Released Qrels
    type: process
    size: xl
    position:
      x: 3540
      'y': 820
  - id: report
    label: |-
      Report Controlled Results
      Separate Retrieval, Answering, and Citations
      Compare Retrievers, Oracle, and Ablations
    type: terminal
    size: xl
    position:
      x: 3790
      'y': 420
