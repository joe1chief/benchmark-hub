meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: T2I-CompBench Build and Evaluation Process
  description: >-
    This entry follows the original NeurIPS 2023 T2I-CompBench conference version, not the later 8,000-prompt
    T2I-CompBench++. The original benchmark contains 6,000 prompts across three categories and six subcategories: 3,000
    attribute-binding prompts for color, shape, and texture; 2,000 relationship prompts for spatial and non-spatial
    relations; and 1,000 complex-composition prompts. Each subcategory has 1,000 prompts split into 700 training and 300
    test prompts with seen and unseen compositions balanced. Rules and ChatGPT generate template and natural prompts;
    color prompts combine CC-500, COCO, and ChatGPT sources, spatial prompts include seven relation types and
    contrastive swaps, and complex prompts cover four scenarios. Models generate ten images per prompt. Disentangled
    BLIP-VQA multiplies independent object-attribute probabilities, UniDet and geometric rules score spatial relations,
    CLIPScore evaluates non-spatial relations, and the 3-in-1 complex score averages CLIP, BLIP-VQA, and UniDet.
    MiniGPT4-CoT is an auxiliary unified metric. Human validation samples 25 prompts per subcategory, two images per
    prompt, and three MTurk raters who use a normalized five-point scale.
  legend: >-
    Source: Original T2I-CompBench conference paper arXiv:2307.06350v2 Sections 3-4 and 6.2; official
    Karine-Huang/T2I-CompBench repository and project page. This entry intentionally excludes the later T2I-CompBench++
    v3 expansion.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
