meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BABILong Build Process
  description: Paper-aligned generation and long-context evaluation workflow for BABILong, based on arXiv:2406.10149v2.
  legend: >-
    Solid arrows build data and score each method. Dashed arrows select retrieval or recurrent-memory baselines; direct,
    RAG, and recurrent evaluations retain their distinct paper-specified sample protocols.
nodes:
  - id: babi_simulation
    label: |-
      Generate bAbI Simulations
      Characters • Objects • Places
      Events • Synthetic Facts
      Ground-Truth Answers
    type: database
    size: xl
    position:
      x: 40
      'y': 220
  - id: task_suite
    label: |-
      Select QA1 through QA20
      Fact Chains • Induction • Deduction
      Counting • Lists/Sets • Space and Time
    type: process
    size: xl
    position:
      x: 320
      'y': 220
  - id: pg19
    label: |-
      Sample PG19 Books
      Natural Long-Form Narratives
      Draw Background Sentences
      in Original Order
    type: database
    size: xl
    position:
      x: 320
      'y': 40
  - id: interleave
    label: |-
      Hide Task Facts in Background Text
      Interleave Facts + Distractors
      Preserve Natural Order
      Preserve Task-Logical Order
    type: process
    size: xl
    position:
      x: 600
      'y': 220
  - id: length_control
    label: |-
      Add Background until Target Length
      Measure with the GPT-2 Tokenizer
      Adapt Fact Positions Algorithmically
    type: process
    size: xl
    position:
      x: 880
      'y': 220
  - id: release
    label: |-
      Pre-Generate Reproducible Splits
      0K • 4K • 8K • 16K • 32K • 64K
      128K • 512K • 1M • 10M Tokens
    type: database
    size: xl
    position:
      x: 1160
      'y': 220
  - id: direct_eval
    label: |-
      Run Long-Context LLMs Directly
      Locate Supporting Facts
      Memorize and Reason to the Answer
    type: process
    size: xl
    position:
      x: 1440
      'y': 40
  - id: rag_chunks
    label: |-
      Run RAG-C Baseline
      Retrieve 512-Token Chunks
      Pass Retrieved Evidence to the LLM
    type: process
    size: xl
    position:
      x: 1440
      'y': 220
  - id: rag_sentences
    label: |-
      Run RAG-S Baseline
      Retrieve Individual Sentences
      Test Multi-Hop and Temporal Failures
    type: process
    size: xl
    position:
      x: 1440
      'y': 400
  - id: recurrent_train
    label: |-
      Curriculum-Fine-Tune Memory Models
      RMT • ARMT • Mamba
      Gradually Increase Recurrent Segments
    type: process
    size: xl
    position:
      x: 1440
      'y': 620
  - id: recurrent_eval
    label: |-
      Evaluate Recurrent Memory
      Extrapolate beyond Training Lengths
      Test Selected Runs up to 50M Tokens
    type: process
    size: xl
    position:
      x: 1720
      'y': 620
  - id: score
    label: |-
      Direct QA1–QA5 Accuracy
      1,000 per Task / Length
      through 32K
      100 Beyond 32K
    type: process
    size: xl
    position:
      x: 2000
      'y': 40
  - id: rag_score
    label: |-
      RAG Exact Accuracy
      50 Examples
      per Task and Length
      Score RAG-C / RAG-S Separately
    type: process
    size: xl
    position:
      x: 2000
      'y': 310
  - id: recurrent_score
    label: |-
      Recurrent-Memory Accuracy
      Full Test Set through 1M
      100 Examples at 10M
      Selected Runs to 50M
    type: process
    size: xl
    position:
      x: 2000
      'y': 620
  - id: effective_context
    label: |-
      Diagnose Context Use
      One / Two / Three-Fact Tasks
      Accuracy Decay with Length
      Retrieval Order / Missing Facts
    type: process
    size: xl
    position:
      x: 2280
      'y': 550
  - id: method_compare
    label: |-
      Compare Independent Protocols
      Direct • RAG-C • RAG-S
      RMT • ARMT • Mamba
      Do Not Pool Sample Counts
    type: process
    size: xl
    position:
      x: 2280
      'y': 310
  - id: report
    label: |-
      Publish BABILong Results
      Task / Length / Method Accuracy
      Keep Protocol Sample Counts
      Selected 50M Extrapolation
    type: terminal
    size: xl
    position:
      x: 2560
      'y': 430
