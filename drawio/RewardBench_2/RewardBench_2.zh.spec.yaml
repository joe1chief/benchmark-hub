meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RewardBench_2 构建与评测流程
  description: >-
    RewardBench
    2是准确率型奖励模型基准，从约3000个候选提示中最终保留1865个，覆盖事实性、精确指令遵循、数学、安全、聚焦与并列答案六个领域。70%为此前未发布的WildChat真人提示；流程使用QuRater、主题分类器、人工检查，并以Tulu
    3对20个下游评测去污染，再对20个模型或人工产生的回答使用领域专属评判器、验证函数、多数投票、规则和人工复核。多数样例含一个优选与三个拒绝回答。五个领域按四选一准确率计分，Ties使用分布感知得分，总分为六领域无权平均。
  legend: >-
    来源：RewardBench 2 arXiv:2506.01937 Section 3 and Appendices G-I, cross-checked against
    allenai/reward-bench。实线箭头表示论文或官方资料明确支持的主流程。
