<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1603px" height="807px" viewBox="0 0 1603 807"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="2"><g><path d="M 0 15 C 0 6.72 44.77 0 100 0 C 126.52 0 151.96 1.58 170.71 4.39 C 189.46 7.21 200 11.02 200 15 L 200 85 C 200 93.28 155.23 100 100 100 C 44.77 100 0 93.28 0 85 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 200 15 C 200 23.28 155.23 30 100 30 C 44.77 30 0 23.28 0 15" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(100,42.7) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>从 Amazon Reviews 2023 开始</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>覆盖 15 个电商类别的购买记录</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>用真实交易中的隐式偏好</tspan></text></g></g></g></g><g data-cell-id="3"><g><rect x="280" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>构建推荐上下文</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>最近一次购买 = 目标商品</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>标题 + 价格 + 商家；更早购买 = 用户历史</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="560" y="0" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,30.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>应用数据质量控制</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>标题 ≥ 6 个字母 • 用户有 5–20 次购买</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>仅保留五星购买 • 每类最多 200 条行为</tspan></text></g></g></g></g><g data-cell-id="5"><g><path d="M 840 15 C 840 6.72 884.77 0 940 0 C 966.52 0 991.96 1.58 1010.71 4.39 C 1029.46 7.21 1040 11.02 1040 15 L 1040 85 C 1040 93.28 995.23 100 940 100 C 884.77 100 840 93.28 840 85 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1040 15 C 1040 23.28 995.23 30 940 30 C 884.77 30 840 23.28 840 15" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,36.1) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>保留 ALERT 数据集</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>15 类共 2,761 个用户–商品交互</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>不含敏感人口统计信息</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>不发布用户 ID</tspan></text></g></g></g></g><g data-cell-id="6"><g><ellipse cx="1220" cy="50" rx="100" ry="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(25, 118, 210);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1220,17) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>制定 4 项评测准则</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>电商编辑团队设计</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>经用户研究优化</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>推理一致性 • 清晰简洁</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>叙事吸引力 • 中性语气</tspan></text></g></g></g></g><g data-cell-id="7"><g><path d="M 1400 0 L 1600 0 L 1600 85 Q 1550 58 1500 85 Q 1450 112 1400 85 L 1400 15 Z" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(158, 158, 158);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1500,8.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>准备两两解释比较</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>候选模型 vs PreferenceLogic 基线</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>提供用户历史与目标商品</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>携带全部 4 项准则</tspan></text></g></g></g></g><g data-cell-id="8"><g><path d="M 1220 360 L 1320 410 L 1220 460 L 1120 410 Z" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 243, 224); stroke: rgb(255, 152, 0);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="26.4" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1220,396.8) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>同一评估器</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>覆盖全部 4 项准则？</tspan></text></g></g></g></g><g data-cell-id="9"><g><rect x="840" y="264" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,294.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>ALERT-Gen</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>Claude-3-Sonnet 思维链两两比较</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>输出 A / B / C（平局）；系统交换位置</tspan></text></g></g></g></g><g data-cell-id="10"><g><rect x="840" y="464" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,494.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>ALERT-Disc</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>ArmoRM 分别为两个解释打分</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>准则对应奖励分更高者获胜</tspan></text></g></g></g></g><g data-cell-id="11"><g><rect x="1400" y="360" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="52.8" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(1500,383.6) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>先拆分 4 项评测准则</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>推理 • 清晰度</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>叙事 • 语气</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>形成 4 个聚焦比较</tspan></text></g></g></g></g><g data-cell-id="12"><g><rect x="560" y="360" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,390.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>多数投票聚合</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>合并四项准则偏好</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>生成最终 A / B / 平局判断</tspan></text></g></g></g></g><g data-cell-id="13"><g><rect x="280" y="360" width="200" height="100" rx="50" ry="50" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" pointer-events="all" style="fill: rgb(236, 239, 241); stroke: rgb(96, 125, 139);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="39.599999999999994" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,390.2) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>ALERT 基准结果</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>胜率 = 候选解释优于基线的交互占比</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>分别报告 ALERT-Gen 与 ALERT-Disc 比较</tspan></text></g></g></g></g><g data-cell-id="14"><g><ellipse cx="940" cy="754" rx="100" ry="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(25, 118, 210);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHei