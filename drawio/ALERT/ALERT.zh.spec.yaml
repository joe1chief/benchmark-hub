meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ALERT 构建流程
  description: 基于 Li et al. 2025 论文重绘的 ALERT 推荐解释基准数据构建与 LLM 评审验证流程。
  legend: 实线表示数据集构建与评审器验证主流程；虚线表示元评测结果对评估准则的校准反馈。
nodes:
  - id: source
    label: |-
      亚马逊购买信号
      15 个电商类别
      五星用户-商品交互
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: quality_filter
    label: |-
      数据质量过滤
      标题至少 6 个字母
      用户有 5 至 20 次交易
    type: decision
    size: xl
    position:
      x: 300
      'y': 70
  - id: balanced_sample
    label: |-
      均衡采样
      每类最多 200 条行为
      保留 2,761 条交互
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: benchmark_context
    label: |-
      基准上下文
      最近购买作为目标商品
      购买历史构成用户画像
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: criteria
    label: |-
      解释评估准则
      编辑团队与用户研究共建
      推理、清晰、叙事、中性语气
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: evaluators
    label: |-
      LLM 自动评审器
      ALERT-Gen 思维链比较
      ALERT-Disc 按准则打分
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: aggregate
    label: |-
      分治与聚合
      每个准则独立判断
      多数投票得到最终偏好
    type: process
    size: xl
    position:
      x: 1080
      'y': 160
  - id: meta_eval
    label: |-
      可靠性验证
      负例与专家人工标注
      专家一致性达到 70%
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: source
    to: quality_filter
    type: primary
  - from: quality_filter
    to: balanced_sample
    type: primary
  - from: balanced_sample
    to: benchmark_context
    type: primary
  - from: benchmark_context
    to: criteria
    type: primary
  - from: criteria
    to: evaluators
    type: data
  - from: evaluators
    to: aggregate
    type: primary
  - from: aggregate
    to: meta_eval
    type: primary
  - from: meta_eval
    to: criteria
    type: optional
    label: 校验人类偏好对齐
modules: []
