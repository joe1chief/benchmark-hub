meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WorldVQA 原子视觉知识构建与评测流程
  description: >-
    10名资深标注员在原子隔离、百科覆盖、粒度对齐和视觉可靠性门槛下构造视觉知识样例。全球扩充先通过地区标注识别欠覆盖区域，再由GPT/Kimi联想搜索提出候选，最终由人工筛选整理。之后使用ISC与LAION/Common
    Crawl去重，再由5个前沿MLLM分层难度，Hard样例强制二次人工复核，并行执行Gemini-3-Pro视觉审计与盲审人工独立作答。最终3500对由GPT-oss-120b裁判，以准确率、尝试率、CGA和F分报告；People类别不计入八类总体分。
  legend: >-
    来源：WorldVQA arXiv:2602.02537v1, Sections 2.1-2.6, Table 2, Section 3.1, Table 3, and Appendix A; official project
    https://worldvqa2026.github.io/WorldVQA/, repository https://github.com/MoonshotAI/WorldVQA/, and dataset
    https://huggingface.co/datasets/moonshotai/WorldVQA. Version pin: 3,500 pairs and nine
    categories.。实线箭头表示论文或官方资料明确支持的主流程。
