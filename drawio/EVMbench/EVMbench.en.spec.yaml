meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: EVMbench Build Process
  description: >-
    Three-version-bounded smart-contract benchmark construction, source-specific curation, isolated grading, historical
    Detect-award weighting, and fixed aggregation.
  legend: >-
    Code4rena alone passes the o3/Solidity/date/license gate; Tempo is implemented separately before merging into the
    runnable 117/44/23 release.
nodes:
  - id: evidence
    label: |-
      Three-version evidence boundary
      CDN initial · 2026-02-19 · 120 / 45 / 24
      arXiv v1 · 2026-03-05 · 117 / 44 / 23
      fixed runnable repository shown below
    type: document
    size: xl
    position:
      x: 40
      'y': 20
  - id: code4rena
    label: |-
      Public Code4rena audit reports
      high-severity vulnerability candidates
      Tempo is not part of this gate
    type: database
    size: xl
    position:
      x: 40
      'y': 360
  - id: screen
    label: |-
      Code4rena-only gate
      o3 classifies loss-of-funds findings
      Solidity · July 2023 onward
      permissive license / redistribution permission
    type: process
    size: xl
    position:
      x: 300
      'y': 360
  - id: quality
    label: |-
      Code4rena + OtterSec quality control
      severe and reproducible findings
      fill missing tests / exploits
      manual rollouts · remove cheating paths
    type: process
    size: xl
    position:
      x: 560
      'y': 360
  - id: tempo
    label: |-
      Selected Tempo security scenarios
      separate from Code4rena reports
      bypass the Code4rena-only gate
    type: database
    size: xl
    position:
      x: 300
      'y': 700
  - id: tempo_qc
    label: |-
      Tempo separate implementation branch
      implement vulnerable scenarios and graders
      validate reproducible runnable tasks
    type: process
    size: xl
    position:
      x: 560
      'y': 700
  - id: merge
    label: |-
      Merge source-specific branches
      117 vulnerabilities in final set
      Patch 44 subset · Exploit 23 subset
    type: process
    size: xl
    position:
      x: 980
      'y': 430
  - id: release
    label: |-
      Fixed runnable release
      evmbench @ 2d5c7ab · frontier-evals @ 8ea5c65
      runnable: Detect 117 · Patch 44 · Exploit 23
      task_info.csv still has 120 stale rows
    type: database
    size: xl
    position:
      x: 1240
      'y': 430
  - id: oracles
    label: |-
      Build inaccessible oracle artifacts
      oracle patch + hidden exploit tests
      deploy scripts + oracle transactions
      verify oracle solutions score correctly
    type: process
    size: xl
    position:
      x: 1500
      'y': 430
  - id: environment
    label: |-
      Isolated Ubuntu 24.04
      Docker task container · no web
      repo · scope · known issues · sponsor hints
      separate inaccessible grader container
    type: process
    size: xl
    position:
      x: 1760
      'y': 430
  - id: modes
    label: |-
      Select benchmark mode
      Detect · Patch · Exploit
    type: decision
    size: xl
    position:
      x: 2020
      'y': 430
  - id: detect_agent
    label: |-
      Detect agent
      inspect scoped repository
      submit an audit report
    type: process
    size: xl
    position:
      x: 2280
      'y': 100
  - id: detect_grade
    label: |-
      Detect judge: unversioned gpt-5 alias
      reasoning effort high · snapshot not pinned
      match each ground-truth vulnerability
      recall; false positives not penalized
    type: document
    size: xl
    position:
      x: 2560
      'y': 100
  - id: detect_reward
    label: |-
      Detect financial reward
      matched vuln: historical payout median
      missing/invitational + Tempo = $0
      outputs: detect_award · detect_max_award
      award_rate_metric = Σ award / Σ max award
    type: document
    size: xl
    position:
      x: 2860
      'y': 100
  - id: patch_agent
    label: |-
      Patch agent
      modify vulnerable contract code
      submit repository changes
    type: process
    size: xl
    position:
      x: 2280
      'y': 430
  - id: patch_grade
    label: |-
      Restore protected tests
      existing tests must pass
      exclude vulnerability-dependent originals
      hidden exploit tests must fail
      per-vulnerability success
    type: document
    size: xl
    position:
      x: 2560
      'y': 430
  - id: exploit_agent
    label: |-
      Exploit agent
      funded key + local Anvil RPC
      submit an ordered transaction list
    type: process
    size: xl
    position:
      x: 2280
      'y': 760
  - id: exploit_grade
    label: |-
      Redeploy and replay in separate grader
      Rust checks state · balance · events
      Veto RPC blocks grader manipulation
      per-vulnerability exploit success
    type: document
    size: xl
    position:
      x: 2560
      'y': 760
  - id: attempt_mean
    label: |-
      Per-vulnerability attempt mean
      mean_v=(1/3) Σ_r score_vr
      three independent attempts
    type: process
    size: xl
    position:
      x: 2860
      'y': 430
  - id: headline
    label: |-
      Headline success rate
      Σ_v mean_v / Σ_v max_v
      aggregate after attempt averaging
    type: document
    size: xl
    position:
      x: 3140
      'y': 430
  - id: bootstrap
    label: |-
      Flat vulnerability bootstrap
      sample vulnerabilities with replacement
      10,000 resamples
      2.5th / 97.5th percentiles
    type: process
    size: xl
    position:
      x: 3420
      'y': 430
  - id: report
    label: |-
      Mode score report
      Detect · Patch · Exploit
      success + Detect award-rate intervals
      cost and tokens are secondary diagnostics
    type: terminal
    size: xl
    position:
      x: 3700
      'y': 430
