meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMAU Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the paper-v1 seven-step curation pipeline, the pinned public release boundary, and the paper-specified
    five-order majority-vote evaluation. Dashed evidence cards preserve later project-page, release, and
    executable-scorer drift instead of merging those claims into the paper contract.
  legend: >-
    Solid arrows trace the paper-backed construction and evaluation flow. Dashed data arrows connect source counts,
    disclosed quality controls, public-release facts, version conflicts, and executable-scorer caveats.
