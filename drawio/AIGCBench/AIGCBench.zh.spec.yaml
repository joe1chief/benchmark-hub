    label: 评测数据类型？
    type: decision
    size: xl
    position:
      x: 1860
      'y': 200
  - id: image_metrics
    label: |-
      图像-文本样本
      仅使用无参考视频指标
      没有参考视频
    type: process
    size: xl
    position:
      x: 2120
      'y': 20
  - id: video_metrics
    label: |-
      视频-文本样本
      有参考 + 无参考指标
      论文：4 个关键帧
      代码默认：5 个关键帧
    type: process
    size: xl
    position:
      x: 2120
      'y': 300
  - id: automatic
    label: |-
      自动指标报告
      4 维 • 11 个唯一指标
      Flow + DOVER 实现
      固定仓库代码中缺失
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 140
  - id: human_sample
    label: |-
      人工研究样本
      每种方法随机 30 个
      共五种方法
    type: process
    size: xl
    position:
      x: 1600
      'y': 560
  - id: human_vote
    label: |-
      42 名参与者
      票选四个维度中
      表现最佳的方法
    type: user
    size: xl
    position:
      x: 1860
      'y': 560
  - id: alignment
    label: |-
      定性一致性
      票选结果相对一致
      未报告相关统计量
    type: terminal
    size: xl
    position:
      x: 2640
      'y': 280
