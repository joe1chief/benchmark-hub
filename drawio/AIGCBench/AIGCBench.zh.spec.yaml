meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIGCBench 构建与证据边界内的验证流程
  description: 构建 3,928 个 I2V 样本后，按数据类型使用自动指标并另做人类票选；明确论文与代码的关键帧差异及各方法覆盖范围。
  legend: 实线表示构建与评测主流程；虚线数据边仅汇合彼此独立的证据报告。
nodes:
  - id: webvid
    label: |-
      WebVid 验证集
      按子类型采样 • 1,000
      视频-文本对
    type: database
    size: xl
    position:
      x: 40
      'y': 20
  - id: laion
    label: |-
      LAION-Aesthetics
      925 个图像-文本对
      论文：随机 • README：精选
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: text_corpus
    label: |-
      提示文本词库
      CivitAI 高频词
      + 其他候选词
    type: database
    size: xl
    position:
      x: 40
      'y': 420
  - id: compose
    label: |-
      随机组合 3,000 条
      主体 • 行为
      背景 • 风格
    type: process
    size: xl
    position:
      x: 300
      'y': 420
  - id: enrich
    label: |-
      GPT-4 扩写
      “让内容更生动
      且更丰富”
    type: process
    size: xl
    position:
      x: 560
      'y': 420
  - id: generate
    label: |-
      SDXL xl-base • 1280 × 720
      T2I-CompBench 过滤
      保留 Top 2,003 对
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: release
    label: |-
      汇成 AIGCBench
      1,000 + 925 + 2,003
      共 3,928 个样本
    type: database
    size: xl
    position:
      x: 1080
      'y': 200
  - id: i2v
    label: |-
      生成 I2V 输出
      五种受测方法
      Pika 仅 60 个样本
      30 WebVid + 30 生成样本
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: frame_policy
