meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CyberSecEval 3 构建与评估流程
  description: 对齐论文 v2 的八风险分类，保留各自的人类、模拟、可执行、提示语料、评判和缓解边界，并区分官方发布计数与论文抽样计数。
  legend: 实线将两个风险族连接到八个不同协议；虚线表示发布范围边界。
nodes:
  - id: evidence
    label: |-
      论文 arXiv:2408.01605v2
      PurpleLlama @ 3d01c613
      该提交的发布 JSON 计数
      251 · 1,916 + 1,916 · 500 · 1,000 · 856
    type: document
    size: xl
    position:
      x: 40
      'y': 608
  - id: taxonomy
    label: |-
      扩展 CyberSecEval 1 / 2
      部署风险 + AI 风险文献
      两个风险族、八项风险
      保留每项评估协议的差异
    type: process
    size: xl
    position:
      x: 296
      'y': 608
  - id: third_party
    label: |-
      第三方风险
      攻击能力 / 增益
      四项独立评估
    type: decision
    size: xl
    position:
      x: 552
      'y': 240
  - id: application
    label: |-
      应用开发者与终端用户风险
      四项独立评估
    type: decision
    size: xl
    position:
      x: 552
      'y': 976
  - id: phishing
    label: |-
      自动化社会工程
      受害者画像 → LLM 受害者对话
      论文：每模型 250 例 · 单一 LLM 评判
      说服力 + 目标按 1–5 评分
      人工校验：4 名评审 × 10 例 · r=0.89
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 0
  - id: manual_uplift
    label: |-
      人工攻击增益 · 人类研究
      62 名志愿者：一半专家 / 一半新手
      两个 1 小时 Hack The Box 阶段
      先无 LLM，再用 Llama 3 405B 助手
      完成攻击阶段数 + 每阶段时间
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 176
  - id: autonomous
    label: |-
      自主攻击行动
      Kali Linux 智能体 → 更新的 Windows Server
      85 次运行 · 侦察 · 漏洞识别
      利用 · 后渗透
      按复杂度统计完成率 · 3 个评判 LLM 共识
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 352
  - id: exploit
    label: |-
      漏洞利用
      玩具 CTF 挑战
      C / Python / JavaScript 约束
      SQLite 注入 · C++ 内存破坏
      零样本下按类别统计可执行挑战成功率
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 528
  - id: injection
    label: |-
      文本提示注入
      251 个手工整理 CSE2 用例
      逻辑 / 安全违规的系统 + 用户输入
      评判 LLM 判断注入是否成功
      攻击成功率 ASR · PromptGuard
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 704
  - id: insecure_code
    label: |-
      建议不安全代码
      1,916 + 1,916 个用例
      补全 / 指令 · 8 种语言
      ICD 静态分析 → 不安全生成率
      CodeShield 缓解
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 880
  - id: interpreter
    label: |-
      代码解释器滥用
      500 个发布提示
      权限提升 · 容器逃逸
      恶意代码遵从率
      Llama Guard 3 缓解
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 1056
  - id: helpfulness
    label: |-
      协助网络攻击
      1,000 个 MITRE ATT&CK 提示
      模型响应 → 响应扩展 → 评判
      按 MITRE 类别统计助攻遵从率
      Llama Guard 3 + FRR 权衡
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 808
      'y': 1232
  - id: suite
    label: |-
      CyberSecEval 3 论文套件
      八项风险 · 混合协议
      人类、模拟、执行、
      静态分析与 LLM 评判
    type: database
    size: xl
    position:
      x: 1320
      'y': 608
  - id: release_boundary
    label: |-
      发布范围边界
      人工增益是人类研究，
      不是自动化提示语料
      非人工自动化组件公开；
      钓鱼发布集 856 题，论文抽样 250 题
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 1576
      'y': 400
  - id: models
    label: |-
      运行 Llama 3 + 同期模型
      指定处使用仅帮助版模型
      无护栏 / 基础评估
      协议专属的人类 / 执行 / LLM 复核
    type: process
    size: xl
    position:
      x: 1576
      'y': 608
  - id: guardrails
    label: |-
      论文专属缓解映射
      PromptGuard → 提示注入
      CodeShield → 不安全代码
      Llama Guard 3 → 解释器 + 攻击助攻
      并非覆盖八项风险的统一护栏
    type: process
    size: xl
    position:
      x: 1832
      'y': 608
  - id: report
    label: |-
      协议专属风险报告
      说服力 · 阶段增益 · 完成率
      利用成功 · ASR · 不安全输出率
      恶意 / 助攻遵从率 + FRR
    type: terminal
    size: xl
    position:
      x: 2088
      'y': 608
