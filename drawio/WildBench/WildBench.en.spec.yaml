meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildBench Task, Checklist, WB-Reward, and WB-Score Pipeline
  description: >-
    WildBench filters WildChat-1M by length, turns, language, toxicity, semantic similarity, and device identity; three
    LLMs remove only unanimously easy tasks before a category-preserving 1,500 sample and human review yield 1,024 tasks
    in 12 categories. Two independent checklist drafts are merged into 5-10 verifiable questions. Evaluation preserves
    the distinct WB-Reward pairwise branch—including three baselines, five-level mapping, and optional length
    penalty—and the pointwise WB-Score branch with its published affine transform.
  legend: >-
    Source: WildBench arXiv:2406.04770v2 (2024-10-05), Sections 2.1-2.2 and 3.1-3.2, Figure 2; official repository
    https://github.com/allenai/WildBench and official dataset https://huggingface.co/datasets/WildEval/WildBench-V2.
    WildEval is the hosting organization/path, not the benchmark name.. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
