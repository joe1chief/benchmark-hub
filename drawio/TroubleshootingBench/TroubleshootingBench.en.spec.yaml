meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TroubleshootingBench Build and Evaluation Process
  description: >-
    TroubleshootingBench asks PhD wet-lab experts to transcribe step-by-step biological protocols they have personally
    used and that are not available online; publication-inspired protocols must substantially change several steps. Each
    protocol lists required equipment and reagents. Experts create three short-answer questions by introducing a
    realistic execution error and describing the failed outcome, targeting tacit hands-on knowledge. More than 100
    submitted protocols undergo cross-expert quality checking and manual filtering, leaving 52 protocols and 156
    questions. Twelve independent relevant PhD experts establish a human baseline on a 52-question diamond set, and
    models answer the same set. The 80th-percentile expert score is used as an indicative threshold, with bootstrapped
    95-percent confidence intervals in the paper.
  legend: >-
    Source: OpenAI gpt-oss Model Safety paper Appendix A; official OpenAI Deployment Safety Hub TroubleshootingBench
    description. Solid arrows show the main flow explicitly supported by the paper or official documentation.
