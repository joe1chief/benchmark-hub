      tasks.json SHA256 9cea452…
    type: document
    size: xl
    position:
      x: 40
      'y': 320
  - id: source
    label: |-
      OSS-Fuzz 经 ARVO 获取
      历史内存安全漏洞
      主要为 C/C++ 项目
      以 sanitizer 作为崩溃判定器
    type: database
    size: xl
    position:
      x: 296
      'y': 320
  - id: patch
    label: |-
      定位精确补丁提交
      OSS-Fuzz 项目每日更新
      搜索修复前最后一天
      二分查找标准 PoC
      首个不再崩溃的提交
    type: process
    size: xl
    position:
      x: 552
      'y': 320
  - id: elements
    label: |-
      恢复实例要素
      补丁前 + 补丁后代码
      标准 PoC + 补丁差异
      构建启用 sanitizer 的可执行文件
    type: document
    size: xl
    position:
      x: 808
      'y': 320
  - id: filter_prompt
    label: |-
      GPT-4.1 质量评判提示
      满足任一条件即可：
      至少 1 个完整句子描述漏洞或修复
      或给出漏洞位置
      拒绝多问题消息
      加入人工少样本示例
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 1064
      'y': 320
  - id: rephrase_prompt
    label: |-
      GPT-4.1 改写提示
      保留含义、函数名 + 文件名
      移除交叉引用 + 修补说明
      不得推测 · 只用现在时
    type: process
    size: xl
    position:
      x: 1320
      'y': 320
  - id: qa
    label: |-
      可复现性 + 去重质检
      在双版本重跑标准 PoC
      按同一补丁 / 相似崩溃栈去重
      审计 300 = 保留 150 + 剔除 150
      96 个项目 · κ=0.82±0.03 · 精度 96%
    type: process
    size: xl
    position:
      x: 1576
      'y': 320
  - id: benchmark
    label: |-
      CyberGym 发布集
      1,368 个 ARVO（≤2024-07-31）+ 139 个新增
      1,507 个漏洞 · 188 个项目
      披露日期 2017-01-01–2025-04-21
      固定 HF tasks.json @ bde190d
    type: database
    size: xl
    position:
      x: 1832
      'y': 320
  - id: levels
    label: 信息级别
    type: decision
    size: xl
    position:
      x: 2088
      'y': 320
  - id: level0
    label: |-
      Level 0 · 探索式
      仅补丁前代码
      无漏洞描述
    type: document
    size: xl
    position:
      x: 2344
      'y': 0
  - id: level1
    label: |-
      Level 1 · 主任务
      补丁前代码
      + 漏洞描述
    type: document
    size: xl
    position:
      x: 2344
      'y': 176
  - id: level2
    label: |-
      Level 2
      Level 1 输入
      + 标准崩溃栈
    type: document
    size: xl
    position:
      x: 2344
      'y': 352
  - id: level3
    label: |-
      Level 3 · 一日漏洞语境
      Level 2 + 标准补丁差异
      + 补丁后代码
    type: document
    size: xl
    position:
      x: 2344
      'y': 528
  - id: agent
    label: |-
      智能体生成 PoC
      使用 submit.sh 提交
      观察退出码 + 输出
      迭代改进 PoC
    type: process
    size: xl
    position:
      x: 2600
      'y': 320
  - id: oracle
    label: |-
      双版本执行判定
      补丁前：必须 sanitizer 崩溃
      补丁后：必须无 sanitizer 崩溃
      两条件共同锁定被修复漏洞
    type: process
    size: xl
    position:
      x: 2856
      'y': 320
  - id: metric
    label: |-
      基准指标
      成功 PoC / 1,507 个实例
      基于执行的成功率
      论文未报告训练 / 开发 / 测试划分
    type: terminal
    size: xl
    position:
      x: 3112
      'y': 320
  - id: impact_boundary
    label: |-
      独立影响边界 · 论文 v3 内部冲突
      摘要：34 个零日 + 18 个不完整补丁
      正文：17 个不充分补丁 + 10 + 25 = 35 个零日
      作为版本化论文漂移报告，
      不作为基准指标
    type: document
    size: xl
    position:
      x: 3368
      'y': 528
