meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CyberGym 构建与评估流程
  description: 对齐 ICLR 2026 论文 v3 的 OSS-Fuzz 补丁对重建、受提示约束的描述整理、审计发布、四级信息设置和双版本 sanitizer 判定。
  legend: 实线表示基准构建与评分；虚线数据箭头单独表示基准之后的安全影响分析。
