meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Arena-Hard-Auto-v0.1 Build and Evaluation
  description: >-
    Paper-v2 construction and pinned v0.1 evaluator implementation: 500 hard prompts flow through post-sampling safety
    cleanup, swapped pairwise games, the exact five-label verdict parser, weighted battles, Bradley-Terry/Elo-scale
    fitting, and the default win-rate report against gpt-4-0314.
  legend: >-
    Solid arrows follow arXiv:2406.11939v2 construction and the pinned v0.1 evaluator. The dashed note isolates the
    conflicting April-blog/repository history from the paper-v2 main chain.
