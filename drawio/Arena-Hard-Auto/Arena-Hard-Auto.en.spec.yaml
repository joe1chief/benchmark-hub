      Swap A/B Positions
      500 × 2 = 1,000 Judgments per Model
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
    style:
      fontSize: 10
  - id: judge_prompt
    label: |-
      gpt-4-1106-preview • T = 0
      max_tokens = 4,096
      First Produce Own Answer, Then Compare
    type: document
    size: xl
    position:
      x: 880
      'y': 600
    style:
      fontSize: 10
  - id: raw_judgment
    label: |-
      Five Allowed Verdict Labels
      [[A>>B]] • [[A>B]] • [[A=B]]
      [[B>A]] • [[B>>A]]
    type: process
    size: xl
    position:
      x: 600
      'y': 600
    style:
      fontSize: 10
  - id: parser
    label: |-
      Pinned Verdict Parser
      No Label → Continue; At Most 2 Attempts
      Single / Repeated Same Label → Accept
      Conflicting Labels → Invalid; No Retry
    type: process
    size: xl
    position:
      x: 320
      'y': 600
  - id: normalized_battles
    label: |-
      Normalize Second-Game Position
      Strong Win/Loss ×3 • Slight ×1
      Tie Preserved • Invalid Dropped
    type: database
    size: xl
    position:
      x: 40
      'y': 600
  - id: bt_elo
    label: |-
      Bradley-Terry / Elo-Scale Logistic Fit
      Unregularized Estimation
      Anchor gpt-4-0314 = 1,000
    type: formula
    size: xl
    position:
      x: 40
      'y': 880
    style:
      fontSize: 10
  - id: baseline_winrate
    label: |-
      Convert Fit to Win Rate
      Against gpt-4-0314
      Default Report Is Not Elo Rating
    type: process
    size: xl
    position:
      x: 320
      'y': 880
  - id: bootstrap
    label: |-
      Bootstrap Uncertainty
      100 Rounds • 2.5 / 97.5 Percentiles
      95% Confidence Interval
    type: process
    size: xl
    position:
      x: 600
      'y': 880
  - id: report
    label: |-
      Arena-Hard-Auto-v0.1 Report
      Win Rate vs Baseline • 95% CI
      Auditable Pairwise-to-BT Chain
    type: terminal
    size: xl
    position:
      x: 880
      'y': 880
