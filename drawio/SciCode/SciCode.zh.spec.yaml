meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SciCode 构建与评测流程
  description: 对齐论文的真实科研工作流收集、分层问题设计、数值与领域测试、三轮顺序质量控制，以及标准设置下的顺序生成与 Pass@1 评测流程。
  legend: 上方构建流程从左向右，三轮质控严格按顺序执行。下方评测从右向左：标准设置不提供科学背景，并携带模型生成的 前序解答；只有全部子问题和集成主解都通过时，主问题才算正确。
nodes:
  - id: workflows
    label: |-
      科学研究工作流
      主要为内部脚本
      许多用于论文
      并非全部公开
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: coverage
    label: |-
      自然科学覆盖
      5 个领域 • 16 个子领域
      数学 • 物理 • 化学
      生物 • 材料科学
    type: database
    size: xl
    position:
      x: 320
      'y': 100
  - id: selection
    label: |-
      选择研究级任务
      数值方法
      系统仿真
      科学计算
    type: user
    size: xl
    position:
      x: 600
      'y': 100
  - id: decomposition
    label: |-
      分层问题设计
      主目标 → 有序子问题
      Docstring 定义输入与输出
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: tests
    label: |-
      科学家金标准资产
      常用 NumPy / SciPy / SymPy
      数值测试 + 领域测试
      复现论文或理论
    type: document
    size: xl
    position:
      x: 1160
      'y': 100
  - id: in_domain_qc
    label: |-
      第 1 轮：同领域质控
      至少 2 名同领域科学家
      复核问题、代码与测试
      作者修订工作流
    type: user
    size: xl
    position:
      x: 1440
      'y': 100
  - id: cross_domain_qc
    label: |-
      第 2 轮：跨领域质控
      1 名跨领域科学家
      检查清晰度与信息充分性
      暴露隐含假设
    type: user
    size: xl
    position:
      x: 1720
      'y': 100
  - id: gpt4_qc
    label: |-
      第 3 轮：GPT-4 质控
      GPT-4 生成候选代码
      科学家分析错误
      重设计测试并返工工作流
    type: process
    size: xl
    position:
      x: 2000
      'y': 100
  - id: release
    label: |-
      SciCode 发布集
      80 个主问题 • 338 个子问题
      开发集 15/50 • 测试集 65/288
    type: database
    size: xl
    position:
      x: 2280
      'y': 100
  - id: standard
    label: |-
      标准设置
      无背景信息
      使用生成的前序解答
      零样本通用提示
    type: document
    size: xl
    position:
      x: 2280
      'y': 520
  - id: generate
    label: |-
      顺序生成
      依次求解有序子问题
      携带前序生成代码
      最后集成主解
    type: process
    size: xl
    position:
      x: 2000
      'y': 520
  - id: execute
    label: |-
      自动科学测试
      运行数值测试
      运行领域专用测试
      对比科学家金标准
    type: process
    size: xl
    position:
      x: 1720
      'y': 520
  - id: correctness
    label: |-
      分层正确性门控
      全部子问题必须通过
      且集成主解通过
    type: process
    size: xl
    position:
      x: 1440
      'y': 520
  - id: report
    label: |-
      SciCode Pass@1
      主问题 + 子问题通过率
      标准设置与较易变体
    type: terminal
    size: xl
    position:
      x: 1160
      'y': 520
edges:
  - from: workflows
    to: coverage
    type: primary
  - from: coverage
    to: selection
    type: primary
  - from: selection
    to: decomposition
    type: primary
  - from: decomposition
    to: tests
    type: primary
  - from: tests
    to: in_domain_qc
    type: primary
  - from: in_domain_qc
    to: cross_domain_qc
    type: primary
  - from: cross_domain_qc
    to: gpt4_qc
    type: primary
  - from: gpt4_qc
    to: release
    type: primary
  - from: release
    to: standard
    type: primary
  - from: standard
    to: generate
    type: primary
  - from: generate
    to: execute
    type: primary
  - from: execute
    to: correctness
    type: primary
  - from: correctness
    to: report
    type: primary
modules: []
