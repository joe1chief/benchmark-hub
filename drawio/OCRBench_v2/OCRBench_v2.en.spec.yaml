meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench v2 Build and Evaluation Process
  description: >-
    NeurIPS-final and fixed-code-aligned collection, professional annotation, three-person quality gate, public/private
    release split, task-routed scoring, and separate English eight-capability and Chinese five-capability macro
    averages.
  legend: >-
    Public data are available as 10,000 rows. The final paper withholds the independently collected private set for a
    periodically updated leaderboard; the fixed public mirror does not contain those private rows.
nodes:
  - id: scope
    label: |-
      Fix the Benchmark Scope
      Single-image Text-centric Tasks
      No Multi-page Long-context Evaluation
      Bilingual Coverage Varies by Task
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: collect
    label: |-
      Harvest and Screen 81 Datasets
      Text-rich Academic Sources
      Add Self-annotated and Private Sources
      Cover 31 Practical Scenarios
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: taxonomy
    label: |-
      Define 23 Tasks in 8 Capabilities
      Recognition · Referring · Spotting · Extraction
      Parsing · Calculation · Understanding · Reasoning
      Reuse Sources across Relevant Tasks
    type: process
    size: xl
    position:
      x: 500
      'y': 250
  - id: guidelines
    label: |-
      Establish Annotation Guidelines
      Include Common Number and Answer Variants
      Read Left-to-right then Top-to-bottom
      Normalize Coordinates to 0–1,000
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: annotate
    label: |-
      Annotate the Public Branch
      15 Professional Annotators
      Create Instruction–Response Pairs
      Add Required Coordinates
      Markdown · HTML · JSON · LaTeX
    type: process
    size: xl
    position:
      x: 1220
      'y': 60
  - id: review
    label: |-
      Cross-validate Public Rows
      Annotator 1 Completes · Annotator 2 Reviews
      Annotator 3 Judges Disagreement
      Exclude No-consensus Items · Correct about 1%
    type: process
    size: xl
    position:
      x: 1460
      'y': 60
  - id: release_gate
    label: |-
      Which Data Track?
      Public or Private
    type: decision
    size: xl
    position:
      x: 980
      'y': 250
  - id: public
    label: |-
      Publish 10,000 Instruction Rows
      About 9,500 Images · Paper Table 1
      7,400 English + 2,600 Chinese
      Fixed Public HF c7e7cdf…
    type: database
    size: xl
    position:
      x: 1700
      'y': 60
  - id: private_collect
    label: |-
      Collect Independent Private Set
      1,500 Images
      735 Captured + 765 Unlabeled
      Books · E-books · Scans · Web
      Match the Public 23-task Mix
    type: database
    size: xl
    position:
      x: 1220
      'y': 440
  - id: private_annotate
    label: |-
      Separately Annotate Private Set
      Check Private Labels
      Use Public Task Contracts
      Reserve for Clean Evaluation
      Final Paper Says: Not Released
    type: process
    size: xl
    position:
      x: 1460
      'y': 440
  - id: evaluate
    label: |-
      Run One-image Instruction Evaluation
      Store the Model Output in predict
      Parse the Task-specific Output Contract
      Apply the Released eval.py Router
    type: process
    size: xl
    position:
      x: 2180
      'y': 250
  - id: metric_gate
    label: |-
      Which Task-specific
      Evaluator Applies?
    type: decision
    size: xl
    position:
      x: 2420
      'y': 250
  - id: structured_metrics
    label: |-
      Structured/Relational Metrics
      Tables/Charts: TEDS
      Documents: STEDS
      KIE/Mapping: Parsed-dictionary F1
      Formulas: Released Normalizers
    type: process
    size: xl
    position:
      x: 2660
      'y': 0
  - id: spatial_reading_metrics
    label: |-
      Spatial/Long-reading Metrics
      Grounding: IoU
      Positioned VQA: ½ Content + ½ IoU
      Spotting: ICDAR Hmean @ IoU 0.5
      Long Reading: Mean BLEU · METEOR
      F1 · 1−NED
    type: process
    size: xl
    position:
      x: 2660
      'y': 250
  - id: count_vqa_metrics
    label: |-
      Counting/Basic VQA Metrics
      Character Count: Exact
      Word Count: Normalized L1
      Multiple Choice: Exact Option
      Short: Containment · Long: ANLS
    type: process
    size: xl
    position:
      x: 2660
      'y': 500
  - id: task_means
    label: |-
      Aggregate by Capability
      Mean Item Scores per Capability
      English: 21 Tasks → 8 Capabilities
      Chinese: 9 Tasks → 5 Capabilities
      Task Means: Diagnostics Only
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: language_gate
    label: |-
      Which Language-specific
      Capability Set?
    type: decision
    size: xl
    position:
      x: 3140
      'y': 250
  - id: en_macro
    label: |-
      English: 8 Capability Means
      Recognition · Referring · Spotting
      Extraction · Parsing · Calculation
      Understanding · Reasoning
      Unweighted Mean · 0–100
    type: process
    size: xl
    position:
      x: 3380
      'y': 60
  - id: cn_macro
    label: |-
      Chinese: 5 Capability Means
      Recognition · Extraction · Parsing
      Understanding · Reasoning
      No Chinese Mean for:
      Referring · Spotting · Calculation
    type: process
    size: xl
    position:
      x: 3380
      'y': 440
  - id: report
    label: |-
      Report English and Chinese Separately
      Per-capability + Macro Scores
      Public Results + Private Trends
      No Released Single Bilingual Score
    type: terminal
    size: xl
    position:
      x: 3620
      'y': 250
  - id: source_boundary
    label: |-
      Source/Rights Boundary
      NeurIPS 2fd3db… · arXiv 8f4980…
      Repo 86d091… · HF c7e7cdf…
      Public HF: 10,000 Rows
      Private: Paper Withheld · News Released
      HF MIT · Repo Research-only
    type: document
    size: xl
    position:
      x: 3860
      'y': 500
