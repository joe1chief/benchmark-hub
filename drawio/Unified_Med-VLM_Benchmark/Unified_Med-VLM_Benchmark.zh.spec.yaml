  title: Unified Med-VLM Benchmark 构建与评测流程
  description: >-
    Unified Med-VLM
    Benchmark是MedXIAOHE技术报告中定义的评测套件，并非独立数据集。它统一30多个公共与内部benchmark，覆盖视觉诊断与识别、医学影像、诊断、医学文本、报告生成和指令遵循。报告统一提示与输出格式，在适用场景要求结构化输出，沿用各组成benchmark的官方指标，并在报告评估对遗漏与无依据新增敏感时加入内部忠实度测试。所有模型使用相同协议运行，结果按能力分组报告，而不是压成论文未定义的单一分数。
  legend: 来源：MedXIAOHE arXiv:2602.12705, Unified Evaluation section and main benchmark table。实线箭头表示论文或官方资料明确支持的主流程。
