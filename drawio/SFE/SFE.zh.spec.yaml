meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SFE 构建与评测流程
  description: >-
    SFE按论文定义的三阶段构建。专家先在天文、化学、地球科学、生命科学和材料科学中确定高价值科研方向；每个学科由2至5名专家把具体任务映射到信号感知、属性理解或比较推理，以及选择题、精确匹配题或开放题。17种原生科研数据被渲染为图像，专家据此编写VQA，再翻译为中英文，进行科学正确性与认知层级的交叉审核，并执行规则化格式检查。最终得到覆盖66项任务的830组VQA。零样本评测使用温度0，文本答案采用相似度或LLM评判，定位任务采用执行成功率与IoU，并按学科、认知层级和语言报告。
  legend: 来源：SFE arXiv:2506.10521 Sections 3.1-3.2 and Appendix E; official PrismaX-Team/sfe repository。实线箭头表示论文或官方资料明确支持的主流程。
