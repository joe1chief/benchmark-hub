meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StableToolBench Build and Evaluation Process
  description: >-
    StableToolBench evolves ToolBench's 1,100 ToolEval2 test queries into a stable virtual-API and evaluation setup. The
    cache is initialized from ToolBench training and reproduced-test API histories, filters invalid records while
    retaining selected realistic exceptions, and had 164,980 filtered records at the paper snapshot. For each call, the
    server checks the cache, then tries the real API, then uses GPT-4-turbo to simulate unavailable responses from the
    API documentation with up to five cached few-shot examples; returned responses update the cache. GPT-4-turbo,
    Gemini-Pro, and Claude-2 independently judge every ToolBench query, and a majority-solvable rule retains 765 tasks.
    Models execute the queries through the virtual server. GPT-4-turbo grades answers solved, unsure, or unsolved.
    Solvable Pass Rate assigns 1, 0.5, or 0 respectively; Solvable Win Rate compares paired candidates, using
    deterministic solved-versus-unsolved wins and GPT-4-turbo for the remaining cases.
  legend: >-
    Source: StableToolBench arXiv:2403.07714 Sections 2-4 and Appendices D, F-H; official THUNLP-MT/StableToolBench
    repository. Solid arrows show the main flow explicitly supported by the paper or official documentation.
