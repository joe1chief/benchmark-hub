meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SysBench-ISR Build and Evaluation Process
  description: >-
    SysBench-ISR is not a separate benchmark dataset. The GLM-4.5 report uses the Instruction Satisfaction Rate slice of
    the original SysBench for instruction-following evaluation and shows it as the SysBench-ISR training curve. The
    underlying SysBench defines six atomic constraint types, cleans thousands of online system messages with heuristics
    and clustering, and has twenty-one trained annotators select 500 system messages. GPT-4o assists five-round
    conversation generation; annotators rewrite the conversations, label aligned and misaligned instructions plus
    parallel and dependent sessions, and write a constraint checklist for every instruction. Multi-expert review freezes
    500 sessions and 2,500 turns. During evaluation, the target model receives the system message, dialogue history, and
    current instruction. An advanced-LLM verifier uses the same context plus the checklist to judge every relevant
    constraint as satisfied or not. ISR counts an instruction only when all associated constraints are satisfied, then
    averages this binary result over instructions. GLM-4.5 reports this metric slice rather than a new SysBench-ISR
    dataset.
  legend: >-
    Source: GLM-4.5 arXiv:2508.06471 Sections 3.3 and 4.2.4, including Figure 9; SysBench arXiv:2408.10943 Section 3 and
    Appendix A; official PKU-Baichuan-MLSystemLab/SysBench repository. Solid arrows show the main flow explicitly
    supported by the paper or official documentation.
