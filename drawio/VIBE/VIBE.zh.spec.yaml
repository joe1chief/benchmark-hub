meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VIBE 构建与评测流程
  description: >-
    MiniMax的VIBE（Visual & Interactive Benchmark for
    Execution）是全栈应用benchmark，并非当前记录误链的图像编辑同名论文。官方发布整理200个从零构建应用的任务规格，并标注难度与领域，覆盖Web、科学仿真、原生Android、原生iOS和后端。编码智能体在容器化真实执行环境中构建应用；具视觉能力的Agent-as-a-Verifier作为自动QA测试员，先检查编译、构建与启动，再完成用户交互和业务流程，最后评判布局、层级、配色与整体美观。得分保持为执行、交互和视觉三层，而非混成未经说明的单一分数。
  legend: >-
    来源：Official MiniMax VIBE benchmark article and MiniMaxAI/VIBE dataset card; no standalone VIBE paper is cited by the
    release。实线箭头表示论文或官方资料明确支持的主流程。
