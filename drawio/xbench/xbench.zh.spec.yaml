meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: xbench 职业对齐的招聘与营销评测流程
  description: >-
    xbench先访谈专家的工作流、耗时与重要性，以可行性×可评测性筛选任务，从实时业务中采集需求，标注静态/动态任务，并记录专家耗时与价值用于独立的IRT/TMF分析。招聘分支构造50个Company
    Mapping、People-to-Info和Info-to-People案例；三类案例都须先通过公开信息可解性及自披露/可靠来源核验，且50题均已确认，再交给联网搜索智能体。营销分支从brief、初始推荐与客户最终选择构造50个匿名campaign，并用836个历史已选网红profile生成理想画像rubric。两条分支均使用Gemini-2.5-Flash裁判；职业任务parser与最终聚合未公开。
  legend: >-
    来源：xbench arXiv:2506.13651v1, Figures 1-6, Sections 3.1-3.3, Tables 1-7, Section 4.1, and Appendix A.1 Tables 11-17;
    official project https://xbench.org/. The website xbench_profession_v2.4.pdf is a standalone snapshot, not arXiv v2.
    Official repository https://github.com/xbench-ai/xbench-evals at inspected HEAD
    17c562192cc7e62215bfb98b65e9f8806fb95504 does not publish the Recruitment/Marketing data, runner, parser, or scorer.
    Required conflicts: Section 3.2 prose versus Figure 4 swaps Recruitment 44/30/26 category bindings, and Section 3.3
    prose versus Figure 6 swaps Marketing 68/16/16 bindings. Final aggregation and invalid-output rules are
    undisclosed.。实线箭头表示论文或官方资料明确支持的主流程。
