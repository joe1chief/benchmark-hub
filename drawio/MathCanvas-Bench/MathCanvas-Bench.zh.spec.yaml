meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathCanvas-Bench 构建与评测流程
  description: 按论文与公开数据对齐地展示从 63.2 万道多模态数学题到 3,079 题公开基准、单独去除泄漏后的 218,604 题训练集， 以及公开 GPT-4.1 答案评测器的完整流程。
  legend: 实线箭头表示保留的数据与评测主流程；带标签分支分别表示论文规定的剔除条件、加权基准抽样、仅作用于训练集的泄漏清理， 有效评测过滤及单答案与多答案的评分规则。论文将公开基准概称为 3K，固定版本实际包含 3,079 条记录。
nodes:
  - id: collect
    label: |-
      收集多模态数学题
      来源为教材、考试与网站
      覆盖初中与高中
      初始约 63.2 万组题目与解答
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: relevance_review
    label: |-
      第一轮 GPT-5 审查
      判断图像是否参与推理
      将数学公式统一规范为
      LaTeX 格式
    type: process
    size: xl
    position:
      x: 380
      'y': 40
  - id: relevance_gate
    label: |-
      图像是否对推理过程
      确有作用？
    type: decision
    size: xl
    position:
      x: 740
      'y': 40
  - id: quality_review
    label: |-
      第二轮 GPT-5 审查
      检查正确性与明确答案
      检查图像清晰度
      排除纯绘图任务
    type: process
    size: xl
    position:
      x: 1100
      'y': 40
  - id: quality_gate
    label: |-
      正确、有答案、图像清晰
      且并非纯绘图任务？
    type: decision
    size: xl
    position:
      x: 1460
      'y': 40
  - id: deduplicate
    label: |-
      对文本和图像去重
      保留唯一题目—解答对
      约 30.3 万 → 约 22.2 万
      论文未公开去重阈值
    type: process
    size: xl
    position:
      x: 1820
      'y': 40
  - id: image_enhance
    label: |-
      标准化全部图像
      使用 SwinIR 超分辨率
      统一缩放至 512 × 512
      保持题目与解答对应关系
    type: process
    size: xl
    position:
      x: 2180
      'y': 40
  - id: taxonomy
    label: |-
      使用 GPT-4.1 分类
      划分八个主要知识类别
      添加细粒度子类别
      为按类别抽样做准备
    type: process
    size: xl
    position:
      x: 2540
      'y': 40
  - id: quality_reject
    label: |-
      从整理语料中剔除
      图像无关或质量检查失败
    type: terminal
    size: xl
    position:
      x: 1100
      'y': 260
  - id: mcq_gate
    label: |-
      是否为多项选择题？
      基准候选资格门
    type: decision
    size: xl
    position:
      x: 2540
      'y': 380
  - id: weighted_sample
    label: |-
      执行基准加权抽样
      类别原占比取 0.7 次方
      提升稀有类别的代表性
      目标规模约三千题
    type: process
    size: xl
    position:
      x: 2180
      'y': 380
  - id: sample_gate
    label: |-
      是否被加权抽入
      基准样本？
    type: decision
    size: xl
    position:
      x: 1820
      'y': 380
  - id: benchmark_release
    label: |-
      发布 MathCanvas-Bench
      论文概称 3K 题
      公开固定版本为 3,079 条
      按八个测试类别发布
    type: database
    size: xl
    position:
      x: 1460
      'y': 380
  - id: training_candidates
    label: |-
      形成训练候选集
      不具基准资格的选择题
      加未抽中的开放式题
      仅对本分支执行泄漏检查
    type: database
    size: xl
    position:
      x: 2180
      'y': 800
  - id: leakage_gate
    label: |-
      与任一基准题的五元词组
      Jaccard 相似度是否大于 0.4？
    type: decision
    size: xl
    position:
      x: 1820
      'y': 800
  - id: training_release
    label: |-
      发布 MathCanvas-Instruct
      训练集实际 218,604 题
      论文概称约 21.9 万题
      未检出与测试题近似项
    type: database
    size: xl
    position:
      x: 1460
      'y': 800
  - id: leakage_remove
    label: |-
      从训练集中移除
      相似度超过 0.4
      基准题本身保持不变
    type: terminal
    size: xl
    position:
      x: 1820
      'y': 1030
  - id: model_output
    label: |-
      运行待评多模态模型
      输入题目与初始图像
      生成图文交错推理过程
      并给出最终答案
    type: document
    size: xl
    position:
      x: 1100
      'y': 380
  - id: judge_input
    label: |-
      准备官方裁判输入
      仅拼接文本推理步骤
      加入题目与标准答案
      不向裁判发送生成图像
    type: process
    size: xl
    position:
      x: 740
      'y': 380
  - id: gpt_judge
    label: |-
      使用 GPT-4.1-2025-04-14 裁判
      解析带编号标签的标准答案
      从全文匹配提取预测答案
      缺失答案记为空值且判错
    type: process
    size: xl
    position:
      x: 380
      'y': 380
  - id: valid_evaluation_gate
    label: |-
      API 与结构化解析成功
      且答案部分数为一至四？
    type: decision
    size: xl
    position:
      x: 20
      'y': 380
  - id: parts_gate
    label: |-
      标准答案包含
      几个答案部分？
    type: decision
    size: xl
    position:
      x: 20
      'y': 650
  - id: invalid_evaluation
    label: |-
      不计入指标分母
      API、结构化解析失败或部分数不支持
      分别记录错误数或跳过数
    type: terminal
    size: xl
    position:
      x: 740
      'y': 650
  - id: single_score
    label: |-
      评分单个答案部分
      正确记 1，错误记 0
      加权分等于二元得分
    type: process
    size: xl
    position:
      x: 20
      'y': 930
  - id: multi_score
    label: |-
      评分二至四个答案部分
      后一项权重为前一项的 1.3 倍
      归一化使权重和为 1
      累加所有正确项权重
    type: process
    size: xl
    position:
      x: 380
      'y': 930
  - id: metrics
    label: |-
      汇总官方指标
      分母为 valid_evaluations
      完整准确率取全答对指示均值
      加权准确率取逐题得分均值
    type: terminal
    size: xl
    position:
      x: 740
      'y': 930
edges:
  - from: collect
    to: relevance_review
    type: primary
  - from: relevance_review
    to: relevance_gate
    type: primary
  - from: relevance_gate
    to: quality_review
    type: primary
    label: 是 · 保留约 36.7 万
  - from: relevance_gate
    to: quality_reject
    type: optional
    label: 否 · 剔除
  - from: quality_review
    to: quality_gate
    type: primary
  - from: quality_gate
    to: deduplicate
    type: primary
    label: 是 · 保留约 30.3 万
  - from: quality_gate
    to: quality_reject
    type: optional
    label: 否 · 剔除
  - from: deduplicate
    to: image_enhance
    type: primary
  - from: image_enhance
    to: taxonomy
    type: primary
  - from: taxonomy
    to: mcq_gate
    type: primary
  - from: mcq_gate
    to: training_candidates
    type: optional
    label: 是 · 仅作训练
    waypoints:
      - x: 2640
        'y': 690
      - x: 2420
        'y': 690
  - from: mcq_gate
    to: weighted_sample
    type: primary
    label: 否 · 基准候选
  - from: weighted_sample
    to: sample_gate
    type: primary
  - from: sample_gate
    to: benchmark_release
    type: primary
    label: 已抽中 · 3,079 条
  - from: sample_gate
    to: training_candidates
    type: optional
    label: 未抽中 · 转训练
    waypoints:
      - x: 1920
        'y': 620
      - x: 2140
        'y': 620
  - from: training_candidates
    to: leakage_gate
    type: primary
  - from: leakage_gate
    to: leakage_remove
    type: optional
    label: 大于 0.4 · 移除
  - from: leakage_gate
    to: training_release
    type: primary
    label: 不超过 0.4 · 保留
  - from: benchmark_release
    to: model_output
    type: primary
  - from: model_output
    to: judge_input
    type: primary
  - from: judge_input
    to: gpt_judge
    type: primary
  - from: gpt_judge
    to: valid_evaluation_gate
    type: primary
  - from: valid_evaluation_gate
    to: parts_gate
    type: primary
    label: 是 · 有效评测
  - from: valid_evaluation_gate
    to: invalid_evaluation
    type: optional
    label: 否 · 不计入分母
    waypoints:
      - x: 120
        'y': 550
      - x: 840
        'y': 550
  - from: parts_gate
    to: single_score
    type: primary
    label: 一个部分
  - from: parts_gate
    to: multi_score
    type: primary
    label: 二至四个部分
  - from: single_score
    to: metrics
    type: primary
    waypoints:
      - x: 120
        'y': 1120
      - x: 840
        'y': 1120
  - from: multi_score
    to: metrics
    type: primary
modules: []
