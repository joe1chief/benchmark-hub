  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TallyQA Build and Evaluation Process
  description: >-
    TallyQA combines imported and newly collected open-ended counting questions. Questions beginning with How many and
    having integer answers from zero through fifteen are imported from VQA2 and Visual Genome; VQA2 items require
    agreement from at least five of ten annotators. The authors also import synthetic TDIUC questions and construct
    absent-object zero-count items. Targeted AMT tasks with about 800 annotators produce 19,500 complex questions over
    17,545 images; nonzero questions must include counterexamples and a separate task creates hard zero-answer
    questions. The authors manually remove low-quality or insufficiently complex items. A conservative linguistic
    classifier strips generic image phrases, applies spaCy POS tagging, and labels a question simple only when it
    contains one noun and no adjective or adverb. The final 287,907 questions comprise 211,430 simple and 76,477 complex
    items. Train has 249,318 questions; Test-Simple has 22,991 imported questions; Test-Complex has 15,598 human-vetted
    AMT questions. Test images come only from Visual Genome and do not overlap training. Evaluation predicts an
    open-ended integer and reports exact accuracy and RMSE separately on Test-Simple and Test-Complex.
  legend: >-
    Source: TallyQA AAAI 2019 paper Section 3 and official manoja328/TallyQA_dataset repository. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
