meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TreeBench Build and Evaluation Process
  description: >-
    TreeBench begins with 1,000 dense-object images sampled from SA-1B across ten categories. Eight LMM experts first
    screen category fit and image quality, retaining 647 images. OpenAI o3 and Gemini 2.5 Pro each propose three
    questions per image under perception and reasoning protocols. Human experts select, edit, or replace these
    proposals, write answer options and evidence bounding boxes, and remove items solved by all four strong VLM filters.
    Independent cross-validation yields 405 visual question-answer pairs covering ten competencies. Models must provide
    a multiple-choice answer and traceable evidence boxes; answer accuracy measures task correctness while mean IoU
    measures evidence localization quality, with perception and second-order reasoning results reported separately.
  legend: >-
    Source: TreeBench arXiv:2507.07999, Section 3; official Haochen-Wang409/TreeVGR and TreeBench dataset repositories.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
