meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Multi-LogiEval Build and Evaluation Process
  description: >-
    Paper-v3-aligned construction for propositional, first-order, and non-monotonic reasoning, with the Appendix H
    extension and published-source drift kept outside the 1,552-item core.
  legend: >-
    Solid arrows are the paper's core construction and evaluation path. Dashed arrows identify appendix-only or
    release-evidence boundaries and do not add samples to the 1,552-item core.
