      Eight NM Reasoning Patterns
      Depths One through Five
    type: database
    size: xl
    position:
      x: 280
      'y': 250
  - id: monotonic
    label: |-
      Build the PL and FOL Stream
      One Rule Defines Depth One
      Each Step Uses One Inference Rule
      Later Premises Reuse Earlier Conclusions
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: nonmonotonic
    label: |-
      Build the Non-monotonic Stream
      Start from Eight Default Patterns
