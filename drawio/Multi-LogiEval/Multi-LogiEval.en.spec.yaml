      Prompt Claude-2 Few-shot
      Rule · Format · Diversity · Two Tasks
      Five In-context Exemplars
      Not Five Outputs
      Generate Natural-language
      Context + Question
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: nonmonotonic_generation
    label: |-
      Prompt Claude-2 for NM Instances
