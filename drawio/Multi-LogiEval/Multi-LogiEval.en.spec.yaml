      Mix NM Conclusions with Classical Logic
    type: process
    size: xl
    position:
      x: 540
      'y': 460
  - id: monotonic_combos
    label: |-
      Compose Monotonic Rule Chains
      Conclusion i Feeds Premise i+1
      Create 71 Rule Combinations
      Cover Depths 2 through 5
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: nonmonotonic_combos
    label: |-
      Manually Compose NM + Classical Chains
      12 · 2 · 2 · 1 Combinations
      For Depths 2 · 3 · 4 · 5
      Use NM Rules with MP · MT · DS
    type: process
    size: xl
    position:
      x: 800
      'y': 460
