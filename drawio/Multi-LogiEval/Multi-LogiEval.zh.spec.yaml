meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Multi-LogiEval 构建与评测流程
  description: 对齐论文 v3 展示命题逻辑、一阶逻辑与非单调逻辑的构建；Appendix H 扩展与官方发布漂移 明确放在 1,552 条主集之外。
  legend: 实线表示论文主集的构建和评测路径；虚线表示附录或发布证据边界，不向 1,552 条主集增加样本。
nodes:
  - id: goal
    label: |-
      定义多步逻辑推理
      二元上下文蕴含任务
      明确设置一至五步深度
      分开三类逻辑体系
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: inventory
    label: |-
      整理逻辑构件
      33 条零变量或单变量规则
      用于 PL / FOL
      八种非单调推理模式
      覆盖一至五步深度
    type: database
    size: xl
    position:
      x: 280
      'y': 250
  - id: monotonic
    label: |-
      构建 PL 与 FOL 路径
      单条规则定义深度一
      每一步只使用一条推理规则
      后一步前提复用前一步结论
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: nonmonotonic
    label: |-
      构建非单调逻辑路径
      从八种默认推理模式开始
      每条链只使用一条非单调规则
      再把其结论与经典逻辑组合
    type: process
    size: xl
    position:
      x: 540
      'y': 460
  - id: monotonic_combos
    label: |-
      组合单调逻辑规则链
      第 i 步结论进入第 i+1 步前提
      创建 71 种规则组合
      覆盖深度二至五
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: nonmonotonic_combos
    label: |-
      人工组合非单调与经典逻辑链
      12 · 2 · 2 · 1 种组合
      分别对应深度 2 · 3 · 4 · 5
      配合 MP · MT · DS 规则
    type: process
    size: xl
    position:
      x: 800
      'y': 460
  - id: monotonic_generation
    label: |-
      少样本提示 Claude-2
      规则 · 格式 · 多样性 · 两项任务
      每种组合给五个上下文示例
      并非生成五条输出
      生成自然语言
      上下文与问题
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: nonmonotonic_generation
    label: |-
      提示 Claude-2 生成非单调数据
      定义任务和规则假设
      指定逻辑连接关系
      强制系统化输出格式
    type: process
    size: xl
    position:
      x: 1060
      'y': 460
  - id: candidates
    label: |-
      候选上下文—问题数据
      用真实实体
      替换符号标签
      扩展领域与概念集合
      按逻辑推导
      是或否的答案
    type: document
    size: xl
    position:
      x: 1320
      'y': 250
  - id: validate
    label: |-
      人工检查每一段上下文
      核对预期逻辑关系
      修正故事错误 · 语法 · 拼写
      深度一每条规则保留 10 条
      每种组合保留 15 或 20 条
    type: process
    size: xl
    position:
      x: 1580
      'y': 250
  - id: release
    label: |-
      论文主集：1,552 条验证数据
      PL 525 · FOL 535 · NM 492
      深度 1–5：410 · 442 · 310 · 280 · 110
      标签：是 1,126 · 否 426
    type: database
    size: xl
    position:
      x: 1840
      'y': 250
  - id: evaluate
    label: |-
      评测六个大语言模型
      使用零样本思维链提示
      输入提示词 + 上下文 + 问题
      预测是或否的二元蕴含标签
    type: process
    size: xl
    position:
      x: 1840
      'y': 560
  - id: report
    label: |-
      报告准确率
      按逻辑类型和深度拆分
      跟踪随深度增加的下降
      分析推理链的正确性
    type: terminal
    size: xl
    position:
      x: 1580
      'y': 560
  - id: extended_fol
    label: |-
      附录 H：七条多元一阶逻辑规则
      论文为 70 条且仅做单步推理
      另用三个大型模型单独评测
      不计入 1,552 条论文主集
    type: document
    size: xl
    position:
      x: 280
      'y': 680
  - id: release_boundary
    label: |-
      发布面边界 · 部分公开
      Git 6d55ade5… · MIT
      仅数据与说明
      固定树：主集 JSON 条目 1,556
      + 附录 H 条目 140
      未发布生成器或评测器代码
    type: document
    size: xl
    position:
      x: 2100
      'y': 560
edges:
  - from: goal
    to: inventory
    type: primary
  - from: inventory
    to: monotonic
    type: primary
  - from: inventory
    to: nonmonotonic
    type: primary
  - from: monotonic
    to: monotonic_combos
    type: primary
  - from: nonmonotonic
    to: nonmonotonic_combos
    type: primary
  - from: monotonic_combos
    to: monotonic_generation
    type: primary
  - from: nonmonotonic_combos
    to: nonmonotonic_generation
    type: primary
  - from: monotonic_generation
    to: candidates
    type: primary
  - from: nonmonotonic_generation
    to: candidates
    type: primary
  - from: candidates
    to: validate
    type: primary
  - from: validate
    to: release
    type: primary
  - from: release
    to: evaluate
    type: primary
  - from: evaluate
    to: report
    type: primary
  - from: inventory
    to: extended_fol
    type: secondary
    label: 附录 H，不计入主集
    style:
      dashed: true
    waypoints:
      - x: 400
        'y': 620
      - x: 400
        'y': 680
  - from: release
    to: release_boundary
    type: secondary
    label: 已发布内容
    style:
      dashed: true
    waypoints:
      - x: 2060
        'y': 410
      - x: 2220
        'y': 410
modules: []
