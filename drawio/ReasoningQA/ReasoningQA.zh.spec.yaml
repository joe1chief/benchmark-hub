  title: "ReasoningQA 构建与评测流程"
  description: "ReasoningQA并不是独立的LongCat基准论文，而是Baichuan-Audio报告引入的OpenAudioBench自建逻辑推理子集。官方数据卡列出202条音频样本；报告说明用GPT-4o依据参考答案评估每个回答，再计算准确率。音频模型可在语音到文本模式或非级联语音到语音模式下测试；后者将交错输出中的文本合并后评分。后续LongCat报告只在对比结果表中复用同名子集，没有披露另一条构建流程。"
  legend: "来源：Baichuan-Audio arXiv:2502.17239 Section 4.3 and Table 8, cross-checked against the baichuan-inc/OpenAudioBench dataset card; LongCat-Flash-Omni only reuses the subset in its result table。实线箭头表示论文或官方资料明确支持的主流程。"
