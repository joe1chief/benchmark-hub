meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VBench-2.0 构建与评测流程
  description: >-
    VBench-2.0把视频生成评测从表面可信推进到内在忠实。它定义人类保真、可控性、创造力、物理和常识5个顶层维度，并拆成细粒度能力与针对性提示。候选模型在冻结提示套件上生成视频；每项能力选择通用VLM/LLM裁判或专用异常检测与视觉方法进行评估。大量人工标注用于校准并验证指标一致性。结果按能力和维度汇总，用于判断视频是否遵守人体结构、组合关系、物理规律、提示控制与常识，而不只看起来流畅。
  legend: 来源：VBench-2.0 arXiv:2503.21755, Sections 3-5; official Vchitect/VBench repository。实线箭头表示论文或官方资料明确支持的主流程。
