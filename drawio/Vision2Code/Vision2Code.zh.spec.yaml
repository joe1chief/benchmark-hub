meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BenchCAD VISION2CODE — CAD 生成与评测流程
  description: >-
    站点中的该条目对应 BenchCAD 的 VISION2CODE 子任务。专家依据工业标准定义 106 类零件族，并用类型化的 schema、sampler、validator、builder 生成易/中/难参数及 CadQuery
    程序。编译失败、运行超过30秒、体积不超过10⁻⁶ mm³，或含负行列式反转变换的程序进入隔离区，其余再由专家目视签收，最终得到17,900个样本。评测从四个标准正投影视图重建 CadQuery，并报告 voxel
    IoU、Chamfer、Hausdorff、Feature-F1、关键操作召回率和执行率。论文未公开完整综合分公式，因此不作猜测。
  legend: >-
    来源：Pinned to arXiv:2605.10865 (BenchCAD), Sections 3.1-3.2 (pp.4-5) and Section 4.3 (p.6), specifically the
    VISION2CODE subtask. Do not conflate it with the independent paper arXiv:2605.11307. The paper names the composite
    metric components but does not publish a complete explicit VISION2CODE total-score formula.。实线箭头表示论文或官方资料明确支持的主流程。
