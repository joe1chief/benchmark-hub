meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BigO(Bench) Build Process
  description: >-
    Paper-aligned construction of empirical time-space complexity labels from correct Code Contests Python solutions,
    including dataclass parsing, sandbox profiling, non-negative curve fitting, validation, and three evaluation tasks.
  legend: >-
    The upper solid spine builds the release. Dataset and curated tests feed a separate validation audit; the three
    lower task branches are parallel evaluations, not a serial pipeline.
nodes:
  - id: source
    label: |-
      Code Contests Source Pool
      8,139 Problems
      1,485,888 Solutions
      Correct Python Only
      Public + Private Tests
    type: database
    size: xl
    position:
      x: 40
      'y': 100
  - id: dataclass
    label: |-
      Problem-Specific Input Dataclasses
      Llama 3.1 405B Generates Parsers
      Multi-Pass Back-Translation Covers 82%
    type: process
    size: xl
    position:
      x: 320
      'y': 100
  - id: filter
    label: |-
      Benchmark Filtering
      Working Dataclass Required
      At Least 50 Solutions
      Remove Unusual Types / Failures
    type: process
    size: xl
    position:
      x: 600
      'y': 100
  - id: expand
    label: |-
      Systematic Input Expansion
      Grow Arguments Independently / Jointly
      Random and Identity Strategies
    type: process
    size: xl
    position:
      x: 880
      'y': 100
  - id: profile
    label: |-
      Isolated Dynamic Profiling
      Bubblewrap Sandboxes
      cProfile Runtime + tracemalloc Memory
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: fit
    label: |-
      Infer Complexity Curves
      Non-Negative Least Squares
      Residual + Simplicity Bias
      Fit Empirical Coefficients
    type: process
    size: xl
    position:
      x: 1440
      'y': 100
  - id: dataset
    label: |-
      BigO(Bench) Release
      3,105 Problems
      1,190,250 Solutions
      Time / Space Classes + Coefficients
      Raw Profiles Included
    type: database
    size: xl
    position:
      x: 1720
      'y': 100
  - id: validate
    label: |-
      Framework Validation Audit
      Human Match: 92% Time
      Human Match: 84% Space
      Check Coverage + Test Labels
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: tests
    label: |-
      Curated Complexity Tests
      Time: 311 Problems / 640 Solutions
      11 Time Classes
      Space: 308 Problems / 636 Solutions
      5 Space Classes • 63 Overlap
    type: document
    size: xl
    position:
      x: 1440
      'y': 440
  - id: predict
    label: |-
      Task 1: Complexity Prediction
      Problem + Human Solution
      Sample 20 Model Outputs
      Predict Time / Space Big-O
    type: process
    size: xl
    position:
      x: 1160
      'y': 280
  - id: prediction_metric
    label: |-
      Task 1 • Unbiased Estimates
      Pass@k • Best@k • All@k
      over 20 Samples
      Time / Space Class Accuracy
    type: process
    size: xl
    position:
      x: 880
      'y': 280
  - id: generate
    label: |-
      Task 2: Constrained Generation
      Problem + Target Complexity
      Generate Correct Python
      within the Constraint
    type: process
    size: xl
    position:
      x: 1160
      'y': 480
  - id: generation_metric
    label: |-
      Task 2 Metrics over 20 Samples
      Pass@k • Best@k • All@k
      Correctness plus Complexity Constraint
    type: process
    size: xl
    position:
      x: 880
      'y': 480
  - id: rank
    label: |-
      Task 3: Coefficient Ranking
      Generate 20 Candidate Solutions
      Keep Best Correct Coefficient
      within the Same Big-O Class
    type: process
    size: xl
    position:
      x: 1160
      'y': 680
  - id: ranking_metric
    label: |-
      Task 3 Coefficient Score
      Best of 20 Attempts
      No Correct Solution = 0
      Coefficient Percentile vs Humans
    type: process
    size: xl
    position:
      x: 880
      'y': 680
  - id: report
    label: |-
      Report Three Parallel Tasks
      Prediction • Generation
      Coefficient Ranking
    type: terminal
    size: xl
    position:
      x: 600
      'y': 480
