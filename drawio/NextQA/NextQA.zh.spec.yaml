meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NExT-QA 构建与评测流程
  description: 对齐论文 v2 与公开代码的视频筛选、分阶段标注、验收过滤、五选一干扰项构造、选择题与开放题独立评分及发布边界。
  legend: NExT-QA 保留 5,440 个视频与 52,044 条自由回答问答；47,692 道五选一题和完整开放题使用不同评分器，论文未定义跨任务合并分数。
nodes:
  - id: scope
    label: |-
      定义解释型视频问答
      可见的因果与时序动作
      丰富的物体交互
      真实日常活动
    type: document
    size: xl
    position:
      x: 20
      'y': 250
  - id: videos
    label: |-
      筛选 6,000 个 VidOR 视频
      原始视频来自 YFCC-100M
      优先较长且交互丰富的片段
      不限定演员或活动类别
    type: database
    size: xl
    position:
      x: 260
      'y': 250
  - id: split
    label: |-
      按视频随机划分
      训练 · 验证 · 测试 = 7:1:2
      在题目标注之前完成划分
      避免视频跨划分复用
    type: database
    size: xl
    position:
      x: 500
      'y': 250
  - id: guidance
    label: |-
      培训并监督 100 名本科生
      从下拉菜单选择问题类型
      建议题干 ≤22 词 · 答案 ≤6 词
      上报无法提出好问题的视频
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: annotation
    label: |-
      一年内分三阶段标注
      先标注因果问题
      再标注时序问题
      最后标注描述问题
    type: process
    size: xl
    position:
      x: 980
      'y': 250
  - id: qa_roles
    label: |-
      分离问题与答案标注角色
      回答者先检查问题质量
      尽可能修复不合格问题
      仅依据可见客观证据作答
    type: process
    size: xl
    position:
      x: 1220
      'y': 250
  - id: acceptance_gate
    label: |-
      能否依据视频可见证据
      客观回答？
    type: decision
    size: xl
    position:
      x: 1460
      'y': 250
  - id: reject_annotation
    label: |-
      删除不可用问题
      主观 · 无法回答
      或缺少可见证据
    type: terminal
    size: xl
    position:
      x: 1460
      'y': 500
  - id: postprocess
    label: |-
      后处理已验收标注
      删除确认无聊的视频
      均衡验证与测试集的是非答案
      删除答案大于二十的计数题
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
  - id: release
    label: |-
      保留 5,440 个视频 · 52,044 条问答
      训练 3,870 · 验证 570 · 测试 1,000
      因果 48% · 时序 29% · 描述 23%
      保留简短自由文本答案
    type: database
    size: xl
    position:
      x: 1940
      'y': 250
  - id: task_gate
    label: |-
      采用哪种评测
      任务合同？
    type: decision
    size: xl
    position:
      x: 2180
      'y': 250
  - id: mc_group
    label: |-
      构造选择题候选答案
      排除二元问题
      按已标注题型分组
      用 Sentence-BERT 检索 50 个最相似问题
    type: process
    size: xl
    position:
      x: 2420
      'y': 40
  - id: mc_filter
    label: |-
      过滤候选答案
      忽略停用词后删除词形重复项
      删除答案相似度 >0.9 的候选
      淘汰相似度 <0.2 的简单负例
    type: process
    size: xl
    position:
      x: 2660
      'y': 40
  - id: mc_manual
    label: |-
      组成每组五选一题目
      采样四个合格干扰项
      均匀插入正确答案
      人工检查并修订全部题组
    type: process
    size: xl
    position:
      x: 2900
      'y': 40
  - id: mc_eval
    label: |-
      评分 47,692 道选择题
      精确比较选项索引
      细分题型 · 因果 · 时序 · 描述
      总准确率 · 人类验证集准确率 88.38%
    type: process
    size: xl
    position:
      x: 3140
      'y': 40
  - id: oe_task
    label: |-
      定义开放式生成任务
      不提供候选选项
      使用全部 52,044 条问答
      生成简短自由文本答案
    type: process
    size: xl
    position:
      x: 2420
      'y': 460
  - id: oe_eval
    label: |-
      使用公开的 NExT-OE 评分器
      自定义停用词过滤 · 词形还原
      二元题与计数题使用精确匹配
      其余用 WUPS@0 · 有补充答案时取最高分
    type: process
    size: xl
    position:
      x: 2660
      'y': 460
  - id: report
    label: |-
      分别报告 NExT-QA 结果
      选择题准确率
      因果/时序/描述开放题 WUPS
      论文未定义跨任务合并分数
    type: terminal
    size: xl
    position:
      x: 3380
      'y': 250
  - id: source_boundary
    label: |-
      论文与发布边界
      arXiv v2 SHA-256 c2c951…
      NExT-QA 2432e97… · NExT-OE a83f8f5… · MIT
      问答标注与评分器公开 · 原始视频经网盘提供
      标注日志与构建脚本未发布
    type: document
    size: xl
    position:
      x: 3380
      'y': 500
edges:
  - from: scope
    to: videos
    type: primary
  - from: videos
    to: split
    type: primary
  - from: split
    to: guidance
    type: primary
  - from: guidance
    to: annotation
    type: primary
  - from: annotation
    to: qa_roles
    type: primary
  - from: qa_roles
    to: acceptance_gate
    type: primary
  - from: acceptance_gate
    to: postprocess
    type: primary
    label: 验收
    labelPosition: center
  - from: acceptance_gate
    to: reject_annotation
    type: primary
    label: 删除
    labelPosition: center
  - from: postprocess
    to: release
    type: primary
  - from: release
    to: task_gate
    type: primary
  - from: task_gate
    to: mc_group
    type: primary
    label: 五选一
    labelPosition: center
  - from: task_gate
    to: oe_task
    type: primary
    label: 开放式
    labelPosition: center
  - from: mc_group
    to: mc_filter
    type: primary
  - from: mc_filter
    to: mc_manual
    type: primary
  - from: mc_manual
    to: mc_eval
    type: primary
  - from: oe_task
    to: oe_eval
    type: primary
  - from: mc_eval
    to: report
    type: primary
    label: 准确率
    labelPosition: center
  - from: oe_eval
    to: report
    type: primary
    label: 语义相似度
    labelPosition: center
  - from: report
    to: source_boundary
    type: secondary
    label: 来源边界
    labelPosition: center
    style:
      dashed: true
modules: []
