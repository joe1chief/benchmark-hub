meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  title: AutomationBench：数据构建与运行评测（1.0.6）
  description: 构建方法依据论文 v1；当前公开运行与评分依据官方仓库 4a8e1061254004d9dac807054eed33fad7d1ff14。私有评测只引用官方披露。
  legend: 数据构建与运行评测使用独立模块。实线表示主流程，虚线表示反馈、可选分支与支撑输入。提示仅用于构建期验证；公开、私有与 simple 成绩分开报告。
nodes:
  - id: workflow_patterns
    type: database
    module: construction
    label: |-
      收集工作流形态
      来自困难工作流的用户反馈
      不使用个人信息或客户机密
  - id: cluster_shapes
    type: process
    module: construction
    label: |-
      聚类工作流形态
      归并收集到的工作流模式
      论文未披露具体聚类算法
  - id: assign_domains
    type: process
    module: construction
    label: |-
      选取六个预定义领域的相关模式
      销售、营销、运营
      支持、财务、人力资源
  - id: task_generation
    type: process
    module: construction
    label: |-
      合成候选任务
      工作流模式提供合成灵感
      多轮修订真实性与应用多样性
  - id: task_contract
    type: document
    module: construction
    label: |-
      设计任务与断言契约
      单条指令与结构化业务状态
      明确策略和确定性检查
  - id: api_world
    type: database
    module: construction
    label: |-
      提供模拟 API 世界
      论文 v1 记载约 500 个端点
      47 个应用；Pydantic 保存世界状态
  - id: hardening
    type: process
    module: construction
    label: |-
      加固过易任务
      加入干扰项与相似记录名称
      信息需经工具获取，并遵守策略优先级
  - id: hint_audit
    type: document
    module: construction
    label: |-
      准备并审计提示清单
      给出端点指引与参数线索
      不包含实际参数值
  - id: validation
    type: process
    module: construction
    label: |-
      检查可解性并抽样审阅
      使用独立的带提示运行模式
      抽样检查与重复审计
  - id: reward_audit
    type: process
    module: construction
    label: |-
      用 RLVR 对奖励做压力测试
      发现奖励攻击策略
      反馈加固断言与奖励设计
  - id: revision
    type: document
    module: construction
    label: |-
      应用版本化公平性修订
      1.0.6：可发现性、格式与副作用要求
      私有任务难度也随版本调整
  - id: release
    type: database
    module: construction
    label: |-
      发布 600 个公开计分任务
      六个业务领域各 100 个任务
      仓库 1.0.6；默认 domains=all
  - id: private_tasks
    type: database
    module: construction
    label: |-
      保留更难的私有任务
      论文 v1 为 600+；任务未公开
      未从公开仓库核实当前私有规模
  - id: simple_tasks
    type: database
    module: construction
    label: |-
      提供 200 个 simple 基线任务
      基础的一步与两步工作流
      默认 domains=all 不包含此集合
  - id: initialize
    type: process
    module: evaluation
    label: |-
      初始化每个选定任务
      由 initial_state 创建新的 WorldState
      保留指令与任务契约身份
  - id: tool_mode
    type: process
    module: evaluation
    label: |-
      选择并记录工具接口
      api（CLI 默认）、zapier、limited_zapier
      受限模式仅暴露任务指定动作
  - id: agent_run
    type: process
    module: evaluation
    label: |-
      获取 Agent 的下一次响应
      按单条指令自主完成工作流
      CLI 默认最多 50 次模型响应
  - id: turn_gate
    type: decision
    module: evaluation
    label: |-
      继续调用工具还是结束轨迹？
      在轮次预算内处理工具请求
      停止运行不代表任务成功
  - id: search_tools
    type: process
    module: evaluation
    label: |-
      按请求发现工具
      api_search：BM25，默认 top_k=5
      Zapier 模式检索动作描述
  - id: execute_tools
    type: process
    module: evaluation
    label: |-
      执行请求的工具调用
      REST 请求或 Zapier 动作
      返回模拟 API 的观察结果
  - id: end_state
    type: process
    module: evaluation
    label: |-
      检查最终业务状态
      执行正向与负向断言
      同时检查哪些条件在初态已经通过
  - id: score_scope
    type: process
    module: evaluation
    label: |-
      确定有效计分断言
      显式排除项不计分
      保持初态已满足条件不获得免费分数
      破坏守卫条件计失败；excluded:false 可强制计分
  - id: assertion_ratio
    type: process
    module: evaluation
    label: |-
      计算 partial_credit
      通过数 ÷ 有效计分断言数；分母为零则为 0
      作为环境奖励，权重为 1
  - id: official_score
    type: process
    module: evaluation
    label: |-
      计算严格全有或全无通过分数
      仅 partial_credit = 1 时 task_completed_correctly = 1
      有效计分断言全部通过，且至少存在一项
  - id: partial_note
    type: terminal
    module: evaluation
    label: |-
      单独保留部分得分奖励
      仅用于训练与诊断
      不把 partial_credit 均值当作任务通过率
  - id: completion_gate
    type: decision
    module: evaluation
    label: |-
      检查导出结果中的中断轨迹
      末尾工具调用未执行，响应步数小于上限减 2
      默认启用 ensure-complete；最多补跑 3 轮
      禁用或使用 tasks/skip 切片时跳过
  - id: rerun_aborted
    type: process
    module: evaluation
    label: |-
      仅重新运行中断任务并合并
      沿用模型与工具集；按任务名合并
      未传递自定义 search_top_k
      保留已完成任务并再次检查
  - id: incomplete_result
    type: terminal
    module: evaluation
    label: |-
      保留并标记仍中断的结果
      有限补跑不保证全部完成
      仅看 auto-bench 退出码不能证明完整性
  - id: split_gate
    type: decision
    module: evaluation
    label: |-
      按选定数据集合分别报告
      六个公开计分域或 simple 基线
      记录版本、模型、工具集与完整性状态
  - id: run_cost
    type: process
    module: evaluation
    label: |-
      从运行中收集用量与成本
      模型 token 用量与配置的价格
      另行报告每任务平均美元成本
  - id: report
    type: terminal
    module: evaluation
    label: |-
      报告公开任务通过率
      对选定公开任务的 task_completed_correctly 求均值
      未切片的六域完整运行共 600 个任务
  - id: simple_report
    type: terminal
    module: evaluation
    label: |-
      报告 simple 运行框架诊断
      仅针对显式选定的 simple 任务
      不计入官方基准分数
  - id: private_report
    type: terminal
    module: evaluation
    label: |-
      查看官方私有集排行榜
      独立留出评测，难度随版本变化
      不可直接用公开集结果替代
