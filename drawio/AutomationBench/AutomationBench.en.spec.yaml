meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  title: "AutomationBench: Construction and Evaluation (1.0.6)"
  description: Construction follows paper v1; current public runtime and scoring follow official repository 4a8e1061254004d9dac807054eed33fad7d1ff14. Private evaluation remains externally reported.
  legend: Construction and evaluation are separate modules. Solid lines show the main flow; dashed lines mark feedback, optional variants, and supporting inputs. Hints are for construction validation. Public, private, and simple scores stay separate.
nodes:
  - id: workflow_patterns
    type: database
    module: construction
    label: |-
      Collect Workflow Shapes
      Difficult workflows from user feedback
      No PII or confidential customer data
  - id: cluster_shapes
    type: process
    module: construction
    label: |-
      Cluster Workflow Shapes
      Group the collected patterns
      Clustering algorithm is not disclosed
  - id: assign_domains
    type: process
    module: construction
    label: |-
      Select for Six Predefined Domains
      Sales, marketing, operations
      Support, finance, HR
  - id: task_generation
    type: process
    module: construction
    label: |-
      Synthesize Candidate Tasks
      Workflow patterns provide inspiration
      Revise realism and app variety
  - id: task_contract
    type: document
    module: construction
    label: |-
      Design Task and Assertion Contracts
      Single instruction and structured state
      Policies and deterministic checks
  - id: api_world
    type: database
    module: construction
    label: |-
      Provide Simulated API Worlds
      About 500 endpoints in paper v1
      47 apps; Pydantic world state
  - id: hardening
    type: process
    module: construction
    label: |-
      Harden Tasks That Are Too Easy
      Distractors and similar record names
      Tool-accessed information and policy priorities
  - id: hint_audit
    type: document
    module: construction
    label: |-
      Prepare and Audit Hint Sheets
      Endpoint guidance and parameter clues
      No actual parameter values
  - id: validation
    type: process
    module: construction
    label: |-
      Check Solvability and Sample Tasks
      Separate hinted runtime mode
      Sample inspection and repeated audits
  - id: reward_audit
    type: process
    module: construction
    label: |-
      Pressure-Test Rewards with RLVR
      Find reward-hacking strategies
      Strengthen assertion and reward design
  - id: revision
    type: document
    module: construction
    label: |-
      Apply Versioned Fairness Revisions
      v1.0.6: discovery, formatting, side effects
      Private task difficulty also revised
  - id: release
    type: database
    module: construction
    label: |-
      Publish 600 Scored Public Tasks
      100 tasks in each of six domains
      Repository 1.0.6; default domains=all
  - id: private_tasks
    type: database
    module: construction
    label: |-
      Hold Out Harder Private Tasks
      Paper v1: 600+; not publicly released
      Current private size is not verified
  - id: simple_tasks
    type: database
    module: construction
    label: |-
      Provide 200 Simple Baseline Tasks
      Foundational one- and two-step workflows
      Excluded from default domains=all
  - id: initialize
    type: process
    module: evaluation
    label: |-
      Initialize Each Selected Task
      Fresh WorldState from initial_state
      Keep prompt and task-contract identity
  - id: tool_mode
    type: process
    module: evaluation
    label: |-
      Select and Record the Tool Interface
      api (CLI default), zapier, limited_zapier
      Limited mode exposes task-specific actions
  - id: agent_run
    type: process
    module: evaluation
    label: |-
      Obtain the Next Agent Response
      Single-instruction autonomous workflow
      CLI default cap: 50 model responses
  - id: turn_gate
    type: decision
    module: evaluation
    label: |-
      Continue Tool Use or End the Rollout?
      Tool requests within the turn budget
      Stopping is not proof of task success
  - id: search_tools
    type: process
    module: evaluation
    label: |-
      Discover Tools When Requested
      api_search: BM25, default top_k=5
      Zapier mode searches action schemas
  - id: execute_tools
    type: process
    module: evaluation
    label: |-
      Execute Requested Tool Calls
      REST requests or Zapier actions
      Return simulated API observations
  - id: end_state
    type: process
    module: evaluation
    label: |-
      Inspect Final Business State
      Run positive and negative assertions
      Also check which conditions passed initially
  - id: score_scope
    type: process
    module: evaluation
    label: |-
      Resolve Effective Scored Assertions
      Explicit exclusions do not count
      Preserved free checks earn no credit
      Broken guards fail; excluded:false can force scoring
  - id: assertion_ratio
    type: process
    module: evaluation
    label: |-
      Compute partial_credit
      Passed / scored assertions; zero denominator gives 0
      Environment reward, weight 1
  - id: official_score
    type: process
    module: evaluation
    label: |-
      Compute Strict All-or-Nothing Pass
      task_completed_correctly = 1 iff partial_credit = 1
      Every scored assertion passes; at least one is scored
  - id: partial_note
    type: terminal
    module: evaluation
    label: |-
      Keep Fractional Reward Separately
      Training and diagnostic only
      Do not average partial_credit as the pass rate
  - id: completion_gate
    type: decision
    module: evaluation
    label: |-
      Check Aborted Rollouts in Exported Results
      Dangling tool-call ending; steps below cap minus 2
      Default ensure-complete; up to 3 rerun rounds
      Skipped when disabled or tasks/skip slices are used
  - id: rerun_aborted
    type: process
    module: evaluation
    label: |-
      Rerun Only Aborted Tasks and Merge
      Reuse model and toolset; merge by task name
      Custom search_top_k is not forwarded
      Keep completed tasks and repeat the check
  - id: incomplete_result
    type: terminal
    module: evaluation
    label: |-
      Retain and Flag Remaining Aborts
      Bounded reruns do not guarantee completion
      Main auto-bench exit status alone is insufficient
  - id: split_gate
    type: decision
    module: evaluation
    label: |-
      Report the Selected Dataset Separately
      Six scored public domains or simple baseline
      Record version, model, toolset, and completion status
  - id: run_cost
    type: process
    module: evaluation
    label: |-
      Collect Usage and Cost from the Run
      Model token usage and configured prices
      Report mean USD cost per task separately
  - id: report
    type: terminal
    module: evaluation
    label: |-
      Report Public Task Pass Rate
      Mean task_completed_correctly over selected public tasks
      600 tasks for an unsliced six-domain run
  - id: simple_report
    type: terminal
    module: evaluation
    label: |-
      Report Simple Harness Diagnostics
      Explicitly selected simple tasks only
      Excluded from the official benchmark score
  - id: private_report
    type: terminal
    module: evaluation
    label: |-
      Read the Official Private-Set Leaderboard
      Separate held-out evaluation and versioned difficulty
      Public results are not directly interchangeable
