data-line-font-size="11" x="0"><tspan>Versioned Biology Sources</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>DisGeNet / OMIM · Ensembl 110</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>MSigDB 2023.2 · miRDB 6.0</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>GTRD · ClinVar / ProteinGym</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>MGI/MouseMine · P-HIPSter/Enrichr</tspan></text></g></g></g></g><g data-cell-id="4"><g><rect x="280" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(380,321) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Define 10 Programmatic Subtasks</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>disease association · gene location</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>miRNA target · tumor / oncogenic</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>TFBS · variant tasks (two forms)</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>vaccine response · viral PPI</tspan></text></g></g></g></g><g data-cell-id="5"><g><rect x="560" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="79.2" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(660,314.4) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Generate Database-grounded Questions</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>pin source or evidence level</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>in each stem</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>derive one attributable</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>correct answer</tspan></text><text y="77" data-line-font-size="11" x="0"><tspan>preserve version-specific provenance</tspan></text></g></g></g></g><g data-cell-id="6"><g><rect x="840" y="304" width="200" height="100" rx="20" ry="20" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" pointer-events="all" style="fill: rgb(227, 242, 253); stroke: rgb(33, 150, 243);"/></g><g><g fill="#212121" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" data-blockTextHeight="66" font-size="11px" style="fill: rgb(33, 33, 33);"><g transform="translate(940,321) scale(1)"><text y="11" data-line-font-size="11" x="0"><tspan>Construct Hard Distractors</tspan></text><text y="24.2" data-line-font-size="11" x="0"><tspan>set differences · protein-coding complements</tspan></text><text y="37.4" data-line-font-size="11" x="0"><tspan>same chromosome, different cytoband</tspan></text><text y="50.6" data-line-font-size="11" x="0"><tspan>opposite ClinVar class</tspan></text><text y="63.8" data-line-font-size="11" x="0"><tspan>on the same sequence</tspan></text></g></g></g></g><g data-cell-id="7"><g><path d="M 1120 319 C 1120 310.72 1164.77 304 1220 304 C 1246.52 304 1271.96 305.58 1290.71 308.39 C 1309.46 311.21 1320 315.02 1320 319 L 1320 389 C 1320 397.28 1275.23 404 1220 404 C 1164.77 404 1120 397.28 1120 389 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(232, 245, 233); stroke: rgb(76, 175, 80);"/><path d="M 1320 319 C 1320 327.28 1275.23 334 1220 334 C 1164.77 334 1120 327.28 1120 319" fill="none" stroke="#4caf50" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(76, 175, 80);"/></g><g><g fill="#212121" font-family="