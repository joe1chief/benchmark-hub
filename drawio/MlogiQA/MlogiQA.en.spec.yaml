meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLogiQA Build and Evaluation Process
  description: >-
    Paper- and release-aligned construction of the 80-question, ten-language MLogiQA test set, followed by the reported
    prompt conditions, accuracy and CACR analysis, and explicit released-code reproducibility boundaries.
  legend: >-
    Solid arrows are the disclosed construction or evaluation path; dashed arrows lead to evidence or reproducibility
    boundaries. The paper says seven language families, while the Hugging Face card says eight. Published test rows
    align by ID and gold answer after normalizing ID types, but translated-file row order differs.
