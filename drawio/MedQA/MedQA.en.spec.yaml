meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedQA Construction, Release, and Evaluation
  description: >-
    Paper-, archive-, and code-aligned MedQA workflow covering multilingual medical-board question collection,
    deduplication and four-option normalization, exact question-level splits, OCR textbook corpora, human coverage
    audits, paper OpenQA experiments, and the narrower released Elasticsearch IR baseline.
  legend: >-
    Solid arrows are construction or scored evaluation paths. Dashed arrows expose evidence, diagnostics, licensing, and
    implementation boundaries; coverage and retrieval audits do not filter the release or enter the accuracy score. The
    GitHub MIT license covers code, while the paper conditions textbook release on a research-use-only license agreement
    and the Drive archive contains no separate license file.
