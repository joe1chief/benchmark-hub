meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: GenAI-Bench Build Process
  description: Versioned GenAI-Arena preference collection, filtering, v1 release, MLLM judging, parser, and accuracy workflow.
  legend: >-
    Dotted arrow denotes pinned evidence; solid arrows denote collection and evaluation. GenAI-Bench v1 test_v1 is kept
    separate from the later test split and from the unrelated 1,600-prompt benchmark of the same name.
nodes:
  - id: evidence
    label: |-
      Primary evidence
      arXiv:2406.04485v4
      repo f0b0334d · data 7981a194
    type: document
    size: xl
    position:
      x: 40
      'y': 100
  - id: arena_inputs
    label: |-
      Integrate 35 open models
      image generation · editing · video
      live + ImagenHub/VBench prompts
    type: database
    size: xl
    position:
      x: 300
      'y': 100
  - id: pair_vote
    label: |-
      Anonymous same-task pair battle
      left / right / tie good / both bad
      revealed identities discard the vote
    type: process
    size: xl
    position:
      x: 560
      'y': 100
  - id: vote_qc
    label: |-
      Filter and expert-audit votes
      sample 350: 303 valid
      17 NSFW · 30 technical
      231 clear · 51 vague · 21 wrong
      reasonable: 93.07%
    type: process
    size: xl
    position:
      x: 820
      'y': 100
  - id: v1_release
    label: |-
      Release v1 split test_v1
      image 1,735 · editing 919
      video 1,069 · total 3,723
    type: database
    size: xl
    position:
      x: 1080
      'y': 100
  - id: version_boundary
    label: |-
      Keep later test split separate
      3,192 + 983 + 1,911 = 6,086
      official code loads test_v1
      do not merge the two versions
    type: document
    size: xl
    position:
      x: 1340
      'y': 100
  - id: judge_input
    label: |-
      Assemble MLLM judge input
      prompt + output A + output B
      video maximum 8 frames
      video-capable: native video
      other MLLMs: sampled frames
    type: process
    size: xl
    position:
      x: 1340
      'y': 400
  - id: judge_prompt
    label: |-
      Apply task-specific criteria
      prompt following · naturalness
      artifacts · aesthetics · overediting
      temporal coherence · dynamic video
    type: process
    size: xl
    position:
      x: 1080
      'y': 400
  - id: parser
    label: |-
      Parse first greedy [[.*]] match
      accept A>>B/A>B and B>>A/B>A
      tie: A=B or A=B=Good
      both bad: A=B or A=B=Bad
    type: process
    size: xl
    position:
      x: 820
      'y': 400
  - id: metric
    label: |-
      Mean boolean accuracy
      each task + three-task average
      Bradley–Terry ranks are separate
    type: terminal
    size: xl
    position:
      x: 560
      'y': 400
edges:
  - from: evidence
    to: arena_inputs
    type: data
  - from: arena_inputs
    to: pair_vote
    type: primary
  - from: pair_vote
    to: vote_qc
    type: primary
  - from: vote_qc
    to: v1_release
    type: primary
  - from: v1_release
    to: version_boundary
    type: primary
  - from: version_boundary
    to: judge_input
    type: primary
  - from: judge_input
    to: judge_prompt
    type: primary
  - from: judge_prompt
    to: parser
    type: primary
  - from: parser
    to: metric
    type: primary
modules: []
