meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CiteBench 构建流程
  description: >-
    对齐 EMNLP 2023 论文的 CiteBench 流程：将 ABURAED、CHEN、LU、XING 在不做实例级筛选的前提下转换为统一引文生成格式，
    再以标准基线生成结果，并分别开展相似度、迁移、篇章和直接人工判断四条评测分支。
  legend: 实线箭头表示论文披露的数据统一、生成和四条评测分支。
nodes:
  - id: sources
    label: |-
      四个来源数据集
      ABURAED • CHEN（Delve + S2ORC）
      LU • XING
    type: database
    size: xl
    position:
      x: 40
      'y': 260
  - id: task
    label: |-
      引文文本生成
      n 个被引目标文档 + 施引来源文档
      及其上下文
      目标：原始引文文本
    type: document
    size: xl
    position:
      x: 340
      'y': 260
  - id: transform
    label: |-
      来源专属转换
      重建各官方数据集
      无实例级筛选
    type: process
    size: xl
    position:
      x: 640
      'y': 260
  - id: schema
    label: |-
      可选 &lt;abs&gt;…&lt;/abs&gt;：施引论文摘要
      &lt;ctx_b&gt;…&lt;/ctx_b&gt;：前文上下文
      无标签的被引论文摘要
      &lt;ctx_a&gt;…&lt;/ctx_a&gt;：后文上下文
    type: process
    size: xl
    position:
      x: 940
      'y': 260
  - id: anchors
    label: |-
      规范引文锚点
      目标文档按 [0]、[1]、… 递增
      输入与目标中的映射保持一致
      XING 非输入参考文献：#OTHEREFR
    type: process
    size: xl
    position:
      x: 1240
      'y': 260
  - id: splits
    label: |-
      五个发布子集
      训练 322,037 • 验证 23,016
      测试 13,712 • 合计 358,765
    type: database
    size: xl
    position:
      x: 1540
      'y': 260
  - id: baselines
    label: |-
      标准化基线
      LEAD • TextRank • LexRank
      LED Base / Large / Large-arXiv
      直接监督 + 来源迁移
    type: process
    size: xl
    position:
      x: 1840
      'y': 260
  - id: generation
    label: |-
      生成引文文本
      统一输入 + 原始目标
      联合训练或单数据集训练
    type: process
    size: xl
    position:
      x: 2140
      'y': 260
  - id: metrics
    label: |-
      HuggingFace ROUGE-1
      / ROUGE-2 / ROUGE-L
      不词干化、不做词形还原
      对标准引文文本计算 BERTScore
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 20
  - id: transfer
    label: |-
      跨数据集迁移
      *led-base-[X] 训练设置
      域内与跨数据集结果
    type: process
    size: xl
    position:
      x: 2460
      'y': 190
  - id: discourse
    label: |-
      引文篇章分析
      ACL-ARC 意图 + CORWA 功能
      以 KL 散度比较分布
    type: process
    size: xl
    position:
      x: 2460
      'y': 360
  - id: human
    label: |-
      人工评测：3 名标注者
      150 个输出 • XING + CHEN Delve
      5 分制可读性 + 一致性
      25 × 3 类模型 × 2 个数据集
    type: user
    size: xl
    position:
      x: 2460
      'y': 530
  - id: report
    label: |-
      多数据集基准报告
      相似度 • 迁移 • 篇章分析
      直接人工判断
    type: terminal
    size: xl
    position:
      x: 2780
      'y': 275
edges:
  - from: sources
    to: task
    type: primary
  - from: task
    to: transform
    type: primary
  - from: transform
    to: schema
    type: primary
  - from: schema
    to: anchors
    type: primary
  - from: anchors
    to: splits
    type: primary
  - from: splits
    to: baselines
    type: primary
  - from: baselines
    to: generation
    type: primary
  - from: generation
    to: metrics
    type: primary
    style:
      exitX: 0.25
      exitY: 0
      entryX: 0
      entryY: 0.5
  - from: generation
    to: transfer
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: generation
    to: discourse
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: generation
    to: human
    type: primary
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0
      entryY: 0.5
  - from: metrics
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.25
      entryY: 0
  - from: transfer
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.3
  - from: discourse
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.7
  - from: human
    to: report
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0.75
      entryY: 1
modules: []
