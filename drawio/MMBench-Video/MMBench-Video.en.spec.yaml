meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMBench-Video Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs the paper's human-authored long-video benchmark, temporal-indispensability filter, public release, and
    the paper-period VLMEvalKit inference, parsing, judging, failure, and aggregation contracts.
  legend: >-
    Solid arrows trace the construction and evaluation path. Decision branches carry explicit condition outcomes.
    Unconnected middle-row cards preserve independent construction, release, and implementation audit findings.
nodes:
  - id: evidence
    label: |-
      Freeze Primary Evidence
      Paper · arXiv 2406.14515v3
      Dataset · 78bfb7c7 · 1,998 Rows
      VLMEvalKit · 796dc7cd
      First Integration · 26 Jun 2024
    type: document
    size: xl
    position:
      x: 80
      'y': 224
  - id: collect
    label: |-
      Volunteer YouTube Collection
      YouTube-8M-inspired Categories
      Keep Titles · Click Metrics · Subtitles
      Diverse Long-form Web Content
    type: database
    size: xl
    position:
      x: 352
      'y': 224
  - id: duration_gate
    label: Video at Least 30 Seconds?
    type: decision
    size: xl
    position:
      x: 624
      'y': 224
  - id: reject_short
    label: |-
      Reject Short Video
      Duration under 30 Seconds
    type: terminal
    size: xl
    position:
      x: 896
      'y': 32
  - id: clip
    label: |-
      Define QA Evidence Clip
      No Collection Upper Bound
      Each QA Uses at Most Six Minutes
    type: process
    size: xl
    position:
      x: 896
      'y': 224
  - id: taxonomy
    label: |-
      Build Three-level Taxonomy
      L1 · Perception / Reasoning
      Nine L2 · 26 Leaf Abilities
      Three Video-specific L2 Added
    type: document
    size: xl
    position:
      x: 1168
      'y': 224
  - id: author
    label: |-
      Human-author Multiple QA per Video
      Tag One or More Leaf Abilities
      Encourage Temporal Questions
      Free-form · Detailed Gold Answers
    type: user
    size: xl
    position:
      x: 1440
      'y': 224
  - id: crosscheck
    label: |-
      Apply Five Rules and Cross-check
      No Absolute Timestamps · Use Relative Time
      Diverse / Conversational Wording
      Verify Accuracy and Rule Compliance
    type: process
    size: xl
    position:
      x: 1712
      'y': 224
  - id: frames
    label: |-
      Temporal-indispensability Probe
      Per QA · Four Distinct Seeds
      One Random Frame per Trial
      GPT-4V Produces Four Answers
    type: process
    size: xl
    position:
      x: 1984
      'y': 224
  - id: mean_score
    label: |-
      GPT-4 Grade Each Trial
      Semantic Similarity · 0 to 3
      Average Four Scores per Question
    type: process
    size: xl
    position:
      x: 2256
      'y': 224
  - id: temporal_gate
    label: Mean of Four Scores at Least 2.5?
    type: decision
    size: xl
    position:
      x: 2528
      'y': 224
  - id: exclude_static
    label: |-
      Exclude Static Question
      246 QA Pairs Removed
    type: terminal
    size: xl
    position:
      x: 2800
      'y': 32
  - id: manual_verify
    label: |-
      Manual Verification
      Review after LVLM Filtering
      Retain Temporally Needed QA Pairs
    type: process
    size: xl
    position:
      x: 2800
      'y': 224
  - id: dataset
    label: |-
      Assemble Paper Benchmark
      609 Videos · 1,998 QA Pairs
      Mean 165.4 s · 32.6 Shots
      Multi-label Leaf Dimensions
    type: database
    size: xl
    position:
      x: 3072
      'y': 224
  - id: release
    label: |-
      Release Full Hugging Face Package
      Complete Snapshot · 78bfb7c7
      Data Unchanged through ef35e21d
      Paper: CC BY-NC 4.0
      HF Card: CC BY 4.0 · Conflict
    type: document
    size: xl
    position:
      x: 3344
      'y': 224
  - id: artifact_drift
    label: |-
      Released Artifact Drift
      Paper · 16 Categories · TSV · 19 video_type
      1,998 Rows · 609 Videos · 26 Leaves
      No Missing / Duplicate Indices
      Main Text ≥ 30 s · Datasheet Min 16.9 s
    type: document
    size: xl
    position:
      x: 80
      'y': 544
  - id: construction_gaps
    label: |-
      Undisclosed Construction Details
      Volunteer Count / Training / Assignment
      Video Search and Inclusion Protocol
      Cross-check Agreement / Adjudication
      Manual Verification Criteria and Counts
    type: document
    size: xl
    position:
      x: 352
      'y': 544
  - id: current_boundary
    label: |-
      Later Toolkit Boundary · 7055d301
      Dataset Download Still Unpinned
      Native Video Input Path Added
      No Subtitle Field in Core Prompt
      Pack Parser and Scorer Remain Equivalent
    type: document
    size: xl
    position:
      x: 624
      'y': 544
  - id: sampling
    label: |-
      First Official Frame Sampling
      Default F = 8 unless Overridden
      Indices int(i × N / (F + 1))
      Chronological Interior Frames
    type: process
    size: xl
    position:
      x: 3344
      'y': 864
  - id: inference
    label: |-
      Build Candidate Prompt
      Pack · All Video Questions → JSON
      No-pack · One Question → Direct Text
      Code Has No Subtitle Field
      Always Return a Response
    type: process
    size: xl
    position:
      x: 3072
      'y': 864
  - id: pack_parse
    label: |-
      Parse Candidate Output
      Pack · Require One JSON Object
      Single-opening-brace Line Fallback
      Missing Key / Parse / Generation → None
      No-pack · No Response Parser
    type: process
    size: xl
    position:
      x: 2800
      'y': 864
  - id: judge
    label: |-
      GPT-4-family Semantic Judge
      Paper · GPT-4 and 0-to-3 Rubric
      First Code Default · gpt-4-1106-preview
      Ignore Grammar · Request One Integer
    type: user
    size: xl
    position:
      x: 2528
      'y': 864
  - id: score_gate
    label: |-
      Unsafe eval(Response) Runs inside istype
      Does It Return an int?
    type: decision
    size: xl
    position:
      x: 2256
      'y': 864
  - id: valid_score
    label: |-
      Convert with int(Response)
      Plain Integer Text → Store Score
      No Enforced 0-to-3 Range
      Eval-only Expression May Abort after Execution
    type: process
    size: xl
    position:
      x: 1984
      'y': 736
  - id: invalid_score
    label: |-
      Store −1 Sentinel
      Missing Prediction / Judge Failure / Text
      Enter Shared Aggregation
    type: process
    size: xl
    position:
      x: 1984
      'y': 992
  - id: metrics
    label: |-
      Aggregate Multi-label Means
      Every Score · ALL Uses max(x, 0)
      VALID Keeps x ≥ 0
      26 Leaves · Nine L2 Dimensions
      Perception · Reasoning · Overall
    type: process
    size: xl
    position:
      x: 1712
      'y': 864
  - id: output
    label: |-
      Rating JSON
      Coarse / Fine · ALL / VALID
      Means on the Nominal 0-to-3 Scale
    type: terminal
    size: xl
    position:
      x: 1440
      'y': 864
