meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AbstentionBench 构建与评测流程
  description: 对齐论文的候选筛选、定量均匀采样、六场景构建，以及拒答与回答正确性的条件判分流程。
  legend: 套件合并 16 个筛选数据集、3 个复制后移除上下文的变体和 UMWP。仅当回答未拒答且存在参考答案时才判正确性；判分器审计使用 300 条回答。
nodes:
  - id: candidate_search
    label: |-
      搜索候选数据集
      183 个候选 • 复核 82 项资源
    type: process
    size: xl
    position:
      x: 40
      'y': 40
  - id: selection
    label: |-
      数据集筛选门控
      数据公开可得
      许可允许再分发
    type: process
    size: xl
    position:
      x: 280
      'y': 40
  - id: general_datasets
    label: |-
      通用领域套件
      保留 16 个数据集
    type: database
    size: xl
    position:
      x: 520
      'y': 40
  - id: reasoning_sources
    label: |-
      推理题来源
      GPQA • GSM8K • MMLU-Math
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: abstain_variants
    label: |-
      构造 3 个 -Abstain 变体
      复制原始可回答样本
      删除使其可回答的上下文
    type: process
    size: xl
    position:
      x: 280
      'y': 240
  - id: umwp
    label: |-
      UMWP
      不可回答数学文字题
    type: database
    size: xl
    position:
      x: 280
      'y': 440
  - id: normalize
    label: |-
      固定均匀采样
      统一各组成部分
      每部分最多 3,500 题
    type: process
    size: xl
    position:
      x: 760
      'y': 240
  - id: scenarios
    label: |-
      划分 6 种场景
      可回答 / 不可回答
      参考答案可用性不同
    type: process
    size: xl
    position:
      x: 1000
      'y': 240
  - id: release
    label: |-
      AbstentionBench
      16 + 3 + 1 = 20 个数据集
      超过 3.5 万道不可回答题
    type: database
    size: xl
    position:
      x: 1240
      'y': 240
  - id: inference
    label: |-
      被测模型回答
      问题 + 生成答案
    type: process
    size: xl
    position:
      x: 1480
      'y': 240
  - id: judge_validation
    label: |-
      拒答判分器审计
      300 条人工标注回答
      Cohen's kappa = 0.88
    type: user
    size: xl
    position:
      x: 1720
      'y': 20
  - id: abstention_judge
    label: |-
      Llama 3.1 8B 判分器
      模型是否拒答？
    type: decision
    size: xl
    position:
      x: 1720
      'y': 240
  - id: reference_gate
    label: |-
      未拒答回答
      是否有参考答案？
    type: decision
    size: xl
    position:
      x: 1960
      'y': 240
  - id: correctness_judge
    label: |-
      正确性判分器
      对照参考答案
    type: process
    size: xl
    position:
      x: 2200
      'y': 80
  - id: metrics
    label: |-
      计算指标
      召回率 • 精确率 • F1 • 准确率
    type: process
    size: xl
    position:
      x: 2440
      'y': 240
  - id: report
    label: |-
      报告结果
      按数据集与场景汇总
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 240
edges:
  - from: candidate_search
    to: selection
    type: primary
  - from: selection
    to: general_datasets
    type: primary
  - from: reasoning_sources
    to: abstain_variants
    type: primary
  - from: general_datasets
    to: normalize
    type: primary
  - from: abstain_variants
    to: normalize
    type: primary
  - from: umwp
    to: normalize
    type: primary
  - from: normalize
    to: scenarios
    type: primary
  - from: scenarios
    to: release
    type: primary
  - from: release
    to: inference
    type: primary
  - from: inference
    to: abstention_judge
    type: primary
  - from: judge_validation
    to: abstention_judge
    type: data
  - from: abstention_judge
    to: metrics
    type: optional
    label: 已拒答
    waypoints:
      - x: 1840
        'y': 600
      - x: 2440
        'y': 600
      - x: 2440
        'y': 320
  - from: abstention_judge
    to: reference_gate
    type: primary
    label: 未拒答
  - from: reference_gate
    to: correctness_judge
    type: primary
    label: 有参考答案
  - from: reference_gate
    to: metrics
    type: optional
    label: 无参考答案
  - from: correctness_judge
    to: metrics
    type: primary
  - from: metrics
    to: report
    type: primary
modules: []
