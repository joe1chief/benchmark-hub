    type: primary
  - from: package
    to: agent
    type: primary
  - from: image_model
    to: submission
    type: primary
  - from: llm
    to: submission
    type: primary
  - from: agent
    to: submission
    type: primary
  - from: submission
    to: extract
    type: primary
  - from: extract
    to: graph
    type: primary
  - from: graph
    to: components
    type: primary
  - from: components
