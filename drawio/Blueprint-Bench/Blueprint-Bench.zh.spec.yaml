meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: vertical
  routing: orthogonal
  title: Blueprint-Bench 构建流程
  description: 按论文构建并评估 50 个公寓照片空间重建任务：九项规则四色平面图、三种模型生成路径、直接解析提交图像的计算机视觉结构抽取，以及加权房间连通性相似度评分。
  legend: 实线表示数据集构建、生成和评分，虚线把人类与随机基线加入最终比较。
nodes:
  - id: listings
    label: |-
      收集公寓房源材料
      室内照片序列
      房源官方平面图
    type: database
    size: xl
    position:
      x: 850
      'y': 130
  - id: dataset
    label: |-
      选取 50 套公寓
      每套约 20 张室内照片
      改编官方平面图作为金标准
    type: process
    size: xl
    position:
      x: 850
      'y': 340
  - id: format
    label: |-
      标准化金标准平面图
      九项绘制规则
      黑墙 • 绿门 • 红色房间中心 • 白底
    type: process
    size: xl
    position:
      x: 850
      'y': 550
  - id: package
    label: |-
      封装评测输入
      照片序列加格式说明
      大部分公寓保密，仅发布代码与样例
    type: document
    size: xl
    position:
      x: 850
      'y': 760
  - id: image_model
    label: |-
      图像生成模型路径
      单次生成平面图图像
      遵循同一套九项规则
    type: process
    size: xl
    position:
      x: 400
      'y': 970
  - id: llm
    label: |-
      多模态 LLM 路径
      推断房间、连通关系与相对尺度
      生成 SVG 代码并转换为图像
    type: process
    size: xl
    position:
      x: 850
      'y': 970
  - id: agent
    label: |-
      Linux 容器中的 Agent 路径
      从给定目录读取照片
      将图像保存到指定文件路径
    type: process
    size: xl
    position:
      x: 1300
      'y': 970
  - id: submission
    label: |-
      按同一套九项规则提交平面图
      黑 • 绿 • 红 • 白像素与规定几何
      不合规输出可能无法评分或无法按预期评分
    type: document
    size: xl
    position:
      x: 850
      'y': 1180
  - id: extract
    label: |-
      确定性抽取空间结构
      HSV 红点检测 • Flood-Fill 房间分割
      绿门扫描 • 面积与大小排序
    type: process
    size: xl
    position:
      x: 850
      'y': 1390
  - id: graph
    label: |-
      生成结构化平面图 JSON
      房间连通图 • 门位置与方向
      按面积从大到小分配房间 ID
    type: database
    size: xl
    position:
      x: 850
      'y': 1600
  - id: components
    label: |-
      计算六项相似度
      边 Jaccard • 度相关 • 图密度
      房间数 • 门数 • 门方向
    type: process
    size: xl
    position:
      x: 850
      'y': 1810
  - id: baselines
    label: |-
      构建比较基线
      人类在 12 套公寓上重建
      不看照片随机生成典型平面图
    type: user
    size: xl
    position:
      x: 1400
      'y': 1810
  - id: score
    label: |-
      0 到 1 的加权相似度
      边 50% • 度 20% • 密度 10% • 房间 10%
      门数 5% • 门方向 5%
    type: process
    size: xl
    position:
      x: 850
      'y': 2020
  - id: report
    label: |-
      比较 LLM、图像模型、Agent 与基线
      跨 50 套公寓汇总结果
      更新公开空间智能排行榜
    type: terminal
    size: xl
    position:
      x: 850
      'y': 2230
edges:
  - from: listings
    to: dataset
    type: primary
  - from: dataset
    to: format
    type: primary
  - from: format
    to: package
    type: primary
  - from: package
    to: image_model
    type: primary
  - from: package
    to: llm
    type: primary
  - from: package
    to: agent
    type: primary
  - from: image_model
    to: submission
    type: primary
  - from: llm
    to: submission
    type: primary
  - from: agent
    to: submission
    type: primary
  - from: submission
    to: extract
    type: primary
  - from: extract
    to: graph
    type: primary
  - from: graph
    to: components
    type: primary
  - from: components
    to: score
    type: primary
  - from: baselines
    to: score
    type: data
  - from: score
    to: report
    type: primary
modules: []
