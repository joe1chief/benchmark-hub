  title: GAIA Dataset Construction and Validation
  description: >-
    Human question design, independent validation, mismatch diagnosis, repair or removal, difficulty assignment, and
    release split from arXiv:2311.12983v1.
  legend: >-
    Two new annotators answer independently. Agreement or a diagnosed verifier error passes directly; repairable
    mismatches are revalidated, while non-repairable or failed-revalidation candidates are removed.
