meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TOMATO Build and Evaluation Process
  description: >-
    TOMATO first formalizes three principles for visual temporal reasoning: Multi-Frame Gain, Frame Order Sensitivity,
    and Frame Information Disparity. In a four-annotator pilot, each person proposes task types and writes twenty QA
    pairs per proposed type; GPT-4o checks the three principle metrics, yielding six tasks: rotation, direction,
    velocity and frequency, shape and trend, visual cues, and action count. Humans collect 171 Creative-Commons YouTube
    source videos and edit them by reversing, concatenating, changing speed, or mirroring to create 398 counterfactual
    clips. They add 214 videos from Music-AVQA, CLEVRER, TGIF-QA, and Perception Test, and create 805 benchmark-specific
    recorded or simulated videos. Annotators write and verify multiple-choice questions, producing 1,484 questions over
    1,417 videos across human-centric, real-world object-centric, and simulated scenarios. Evaluation normally samples
    sixteen frames, parses an exact option, reports accuracy by all six tasks and overall, and compares single-frame,
    shuffled-frame, and handpicked-frame conditions to compute the three temporal diagnostics. Human video and frame
    baselines are reported separately.
  legend: >-
    Source: TOMATO ICLR 2025 paper Sections 3-6 and Appendix G; official yale-nlp/TOMATO repository and dataset. Solid
    arrows show the main flow explicitly supported by the paper or official documentation.
