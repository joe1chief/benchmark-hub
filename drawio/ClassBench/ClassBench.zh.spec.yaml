meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ClassBench（AgentWorldModel-1K 环境）构建流程
  description: >-
    对齐 AWM 论文的 scheduling_2 发布记录构建流程：ClassBench 是一个生成的“音乐学校排课与考勤”环境，而不是独立基准。 它的十项任务驱动相互依赖的
    SQLite、接口与验证器合成，再经隔离执行、有限修复、发布、Agent 执行和结果标注。
  legend: 实线箭头表示合成与验证；虚线箭头表示数据依赖和有限次数的修复回路。
nodes:
  - id: seeds
    label: |-
      100 个常见领域名称
      作为有状态应用领域种子
      用于 Self-Instruct 扩展
    type: database
    size: xl
    position:
      x: 40
      'y': 260
  - id: scenarios
    label: |-
      Self-Instruct 场景扩展
      领域名称 → 应用描述
      有状态 CRUD 工作流
    type: process
    size: xl
    position:
      x: 340
      'y': 260
  - id: filter
    label: |-
      场景筛选 + 去重
      CRUD 分类器 • 嵌入余弦阈值 0.85
      通过类别上限保证多样性
    type: process
    size: xl
    position:
      x: 640
      'y': 260
  - id: classbench
    label: |-
      ClassBench：音乐学校排课与考勤
      发布场景 ID：scheduling&#95;2
      单个 AWM 环境，不是独立基准
    type: document
    size: xl
    position:
      x: 940
      'y': 260
  - id: tasks
    label: |-
      10 个 API 可解用户任务
      登录后场景 • 自包含
      任务定义后端所需行为
    type: document
    size: xl
    position:
      x: 1240
      'y': 260
  - id: database
    label: |-
      最小 SQLite Schema + 样例数据
      满足每个任务的执行前提
      不含认证字段
    type: database
    size: xl
    position:
      x: 1540
      'y': 20
  - id: interface
    label: |-
      两阶段接口合成
      API 规格 → Python 实现
      暴露 MCP 工具 + FastAPI 服务
    type: process
    size: xl
    position:
      x: 1840
      'y': 20
  - id: verifier
    label: |-
      每个任务一个验证器
      比较初始与最终数据库状态
      结构化信号 + 成功准则
      代码增强 LLM 判分器
    type: process
    size: xl
    position:
      x: 1540
      'y': 500
  - id: quality_gate
    label: |-
      隔离执行每个组件
      Schema / 数据错误率须低于 10%
      须达到 0% 环境启动错误率
      测试数据库 • 接口 • 验证器
    type: process
    size: xl
    position:
      x: 1840
      'y': 260
  - id: repair
    label: |-
      错误摘要 + 已生成代码
      反馈给 LLM • 最多 5 次重试
      耗尽后保留最佳尝试
    type: process
    size: xl
    position:
      x: 1840
      'y': 500
  - id: release
    label: |-
      AgentWorldModel-1K 发布
      1,000 个环境 • 10,000 个任务
      ClassBench = 1 个环境 • 10 个任务
    type: database
    size: xl
    position:
      x: 2140
      'y': 260
  - id: run
    label: |-
      运行多轮工具使用 Agent
      可重置的隔离 MCP 环境
      记录 Agent 轨迹 + 最终状态
    type: process
    size: xl
    position:
      x: 2440
      'y': 260
  - id: score
    label: |-
      轨迹 + 验证结果
      完成 • 部分完成
      Agent 错误 • 环境错误
    type: terminal
    size: xl
    position:
      x: 2740
      'y': 260
edges:
  - from: seeds
    to: scenarios
    type: primary
  - from: scenarios
    to: filter
    type: primary
  - from: filter
    to: classbench
    type: primary
  - from: classbench
    to: tasks
    type: primary
  - from: tasks
    to: database
    type: primary
  - from: tasks
    to: interface
    type: primary
    waypoints:
      - x: 1680
        'y': 258
      - x: 1680
        'y': 118
      - x: 1844
        'y': 118
      - x: 1844
        'y': 88
  - from: tasks
    to: verifier
    type: primary
  - from: database
    to: interface
    type: data
  - from: database
    to: verifier
    type: data
  - from: database
    to: quality_gate
    type: primary
  - from: interface
    to: quality_gate
    type: primary
  - from: verifier
    to: quality_gate
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.75
  - from: quality_gate
    to: repair
    type: primary
    label: 未通过
  - from: repair
    to: quality_gate
    type: data
    label: 重新测试
    style:
      exitX: 1
      exitY: 0.5
      entryX: 1
      entryY: 0.75
  - from: quality_gate
    to: release
    type: primary
    label: 通过
  - from: release
    to: run
    type: primary
  - from: run
    to: score
    type: primary
modules: []
