meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RareArena 论文对齐的构建与评测过程
  description: >-
    按《柳叶刀·数字健康》论文呈现从 2024 年 6 月 PubMed Central 版本，经候选抽取、诊断过滤、Orphanet 映射、
    检查前与检查后任务构建、人工质量审查、主要零样本评测及 500 例提示策略分析的完整流程。
  legend: >-
    实线表示论文流程；虚线隔离证据、映射抽查、发布历史、论文后的评分器与抽样子集漂移，以及许可边界。
nodes:
  - id: source_evidence
    label: |-
      《柳叶刀·数字健康》2026
      DOI 10.1016/j.landig.2025.100953
      官方仓库 Git 80e16b143872
      论文与代码交叉核对
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 8 }
  - id: pmc_release
    label: |-
      PubMed Central · 2024 年 6 月
      580 万篇文章
      复现 PMC-Patients
      抽取患者摘要
    type: database
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: candidate_pool
    label: |-
      正则表达式抽取
      潜在病例报告段落
      250,294 个候选病例
    type: database
    size: xl
    position: { x: 500, y: 300 }
    style: { fontSize: 9 }
  - id: case_filter
    label: |-
      医学专家设计过滤规则
      聚焦诊断 · 单一患者
      人类 · 出生后 · 死前诊断
      GPT-4o-2024-05-13
    type: process
    size: xl
    position: { x: 740, y: 300 }
    style: { fontSize: 9 }
  - id: filtered_cases
    label: |-
      过滤后的诊断病例
      保留 104,000 例
      抽取最终诊断
      作为标准答案
    type: database
    size: xl
    position: { x: 980, y: 300 }
    style: { fontSize: 9 }
  - id: coder_retrieval
    label: |-
      映射到 Orphanet
      CODER 诊断嵌入
      检索前十个术语
      按余弦相似度排序
    type: process
    size: xl
    position: { x: 1220, y: 300 }
    style: { fontSize: 9 }
  - id: gpt_mapping
    label: |-
      GPT-4o 选择最佳映射
      删除映射不充分的病例
      57,000 个诊断映射成功
      标准答案仍用抽取诊断
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: mapping_audit
    label: |-
      人工映射审计
      抽查 100 个映射诊断
      准确率 94%
      论文质量检查
    type: document
    size: xl
    position: { x: 1460, y: 760 }
    style: { fontSize: 9 }
  - id: test_extraction
    label: |-
      抽取诊断性检查
      可直接确认或强烈提示诊断
      清洗检查结果
      GPT-4o-2024-05-13
    type: process
    size: xl
    position: { x: 1700, y: 300 }
    style: { fontSize: 9 }
  - id: rds_truncation
    label: |-
      罕见病筛查 RDS
      截断至任何诊断性检查之前
      保留症状与常规检查
      无特定检查病例也可保留
    type: process
    size: xl
    position: { x: 1940, y: 40 }
    style: { fontSize: 9 }
  - id: rdc_truncation
    label: |-
      罕见病确认 RDC
      截断至最终诊断之前
      包含清洗后的诊断性检查结果
      必须有特定诊断性检查
    type: process
    size: xl
    position: { x: 1940, y: 520 }
    style: { fontSize: 9 }
  - id: rds_rephrase
    label: |-
      RDS 病例改写
      仅保留客观临床发现
      删除主观分析
      隐藏诊断与检查线索
    type: process
    size: xl
    position: { x: 2180, y: 40 }
    style: { fontSize: 9 }
  - id: rdc_rephrase
    label: |-
      RDC 病例改写
      仅保留客观临床发现
      删除主观分析
      隐藏最终诊断
    type: process
    size: xl
    position: { x: 2180, y: 520 }
    style: { fontSize: 9 }
  - id: rds_leakage
    label: |-
      RDS 泄漏检测
      检查病例与检查结果线索
      诊断名 · 同义词 · 缩写
      删除潜在泄漏病例
    type: process
    size: xl
    position: { x: 2420, y: 40 }
    style: { fontSize: 9 }
  - id: rdc_leakage
    label: |-
      RDC 泄漏检测
      诊断名 · 同义词 · 缩写
      删除潜在泄漏病例
      保留清洗后的检查结果
    type: process
    size: xl
    position: { x: 2420, y: 520 }
    style: { fontSize: 9 }
  - id: rds_release
    label: |-
      RDS 论文发布集
      49,760 个病例
      4,597 种罕见病
      检查前场景
    type: database
    size: xl
    position: { x: 2660, y: 40 }
    style: { fontSize: 9 }
  - id: rdc_release
    label: |-
      RDC 论文发布集
      22,901 个病例
      3,522 种罕见病
      检查后场景
    type: database
    size: xl
    position: { x: 2660, y: 520 }
    style: { fontSize: 9 }
  - id: human_review
    label: |-
      人工质量审查
      两名医生独立评审 · 第三人裁决
      100 例 · 每项任务 50 例
      泄漏 · 保真度 · 复杂度
    type: user
    size: xl
    position: { x: 2900, y: 300 }
    style: { fontSize: 9 }
  - id: model_prompt
    label: |-
      论文提示协议
      返回最可能的五种罕见病诊断
      温度 0.1
      按评测方案分支
    type: process
    size: xl
    position: { x: 3140, y: 300 }
    style: { fontSize: 9 }
  - id: zero_shot_primary
    label: |-
      主要全量基准评测
      所有模型使用同一零样本提示
      用于论文 RDS 与 RDC 主结果
    type: process
    size: xl
    position: { x: 3380, y: 80 }
    style: { fontSize: 9 }
  - id: prompt_subset
    label: |-
      提示策略分析
      随机 500 例子集
      比较思维链与少样本提示
      固定三个随机示例
      示例不在 500 例子集中
    type: process
    size: xl
    position: { x: 3380, y: 520 }
    style: { fontSize: 9 }
  - id: judge
    label: |-
      GPT-4o 对齐诊断术语
      2 分 = 同义诊断
      1 分 = 上位诊断
      0 分 = 未命中
    type: process
    size: xl
    position: { x: 3620, y: 300 }
    style: { fontSize: 9 }
  - id: metrics
    label: |-
      官方指标
      Top-1 召回率 · Top-5 召回率
      1 分或 2 分均算命中
      分别报告 RDS 与 RDC
    type: terminal
    size: xl
    position: { x: 3860, y: 300 }
    style: { fontSize: 9 }
  - id: version_history
    label: |-
      论文期发布历史
      数据 4a822f1f9c99 · 2024-11-03
      复现脚本 f8dc1fb2c088 · 2025-04-09
      评测更新 b18bc13492d9 · 2025-04-22
    type: document
    size: xl
    position: { x: 2660, y: 900 }
    style: { fontSize: 8 }
  - id: current_drift
    label: |-
      论文后的当前版本
      80e16b143872 · 2026-03-14
      更严格的 Orphanet 上位词评分器
      不是论文评分快照
    type: document
    size: xl
    position: { x: 2900, y: 900 }
    style: { fontSize: 8 }
  - id: sampled_sets
    label: |-
      论文后的抽样子集
      RDS 8,562 例 · 3,727 种疾病
      RDC 4,376 例 · 2,644 种疾病
      不是论文规模发布集
    type: document
    size: xl
    position: { x: 3140, y: 900 }
    style: { fontSize: 9 }
  - id: license_boundary
    label: |-
      数据集许可
      CC BY-NC-SA 4.0
      发布于 GitHub 与 Hugging Face
      非商业 · 相同方式共享
    type: document
    size: xl
    position: { x: 3380, y: 900 }
    style: { fontSize: 9 }
edges:
  - from: source_evidence
    to: pmc_release
    type: secondary
    style: { dashed: true }
  - from: pmc_release
    to: candidate_pool
    type: primary
  - from: candidate_pool
    to: case_filter
    type: primary
  - from: case_filter
    to: filtered_cases
    type: primary
  - from: filtered_cases
    to: coder_retrieval
    type: primary
  - from: coder_retrieval
    to: gpt_mapping
    type: primary
  - from: gpt_mapping
    to: mapping_audit
    type: secondary
    style: { dashed: true }
  - from: gpt_mapping
    to: test_extraction
    type: primary
  - from: test_extraction
    to: rds_truncation
    type: primary
  - from: test_extraction
    to: rdc_truncation
    type: primary
  - from: rds_truncation
    to: rds_rephrase
    type: primary
  - from: rdc_truncation
    to: rdc_rephrase
    type: primary
  - from: rds_rephrase
    to: rds_leakage
    type: primary
  - from: rdc_rephrase
    to: rdc_leakage
    type: primary
  - from: rds_leakage
    to: rds_release
    type: primary
  - from: rdc_leakage
    to: rdc_release
    type: primary
  - from: rds_release
    to: human_review
    type: primary
  - from: rdc_release
    to: human_review
    type: primary
  - from: human_review
    to: model_prompt
    type: primary
  - from: model_prompt
    to: zero_shot_primary
    type: primary
  - from: model_prompt
    to: prompt_subset
    type: primary
  - from: zero_shot_primary
    to: judge
    type: primary
  - from: prompt_subset
    to: judge
    type: primary
  - from: judge
    to: metrics
    type: primary
  - from: rds_release
    to: version_history
    type: secondary
    style: { dashed: true }
    waypoints:
      - { x: 2880, y: -80 }
      - { x: 4140, y: -80 }
      - { x: 4140, y: 800 }
      - { x: 2660, y: 800 }
  - from: rdc_release
    to: version_history
    type: secondary
    style: { dashed: true }
  - from: version_history
    to: current_drift
    type: secondary
    style: { dashed: true }
  - from: current_drift
    to: sampled_sets
    type: secondary
    style: { dashed: true }
  - from: sampled_sets
    to: license_boundary
    type: secondary
    style: { dashed: true }
modules: []
