meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: NL2Repo-Bench Build and Evaluation Process
  description: >-
    Paper-aligned repository selection, AST-assisted reverse engineering, four-part specification authoring, environment
    and quality verification, and hidden upstream-pytest evaluation of from-scratch repositories.
  legend: >-
    Solid arrows show task construction and agent evaluation. Dotted arrows carry the separately hidden Docker and
    upstream-test artifacts; API signatures are visible only because they are written inside the single specification.
nodes:
  - id: candidates
    label: |-
      Real-World Python Libraries
      GitHub Open-Source Repositories
      Modular Projects with Native pytest
    type: database
    size: xl
    position:
      x: 40
      'y': 80
  - id: selection
    label: |-
      Repository Selection Criteria
      300-120,000 LOC + >= 10 Stars
      Native pytest
      Created / Updated within 3 Years
    type: process
    size: xl
    position:
      x: 360
      'y': 80
  - id: baseline
    label: |-
      Human Clone-and-Test Gate
      Review Structure and Dependencies
      Retain Only if Native Tests
      All Pass
    type: user
    size: xl
    position:
      x: 680
      'y': 80
  - id: ast_inventory
    label: |-
      AST API Inventory
      Classes / Functions / Constants
      Signatures + Source Locations
      Exclude Tests
    type: process
    size: xl
    position:
      x: 1000
      'y': 80
  - id: behavior_review
    label: |-
      Annotator Behavior Review
      Inputs / Outputs / Constraints
      Import Paths and Tested Semantics
    type: user
    size: xl
    position:
      x: 1000
      'y': 300
  - id: specification
    label: |-
      Four-Part Specification
      Project Description + Supports
      API Usage Guide
      Implementation Nodes
    type: document
    size: xl
    position:
      x: 1320
      'y': 190
  - id: docker
    label: |-
      Dedicated Docker per Task
      Upstream Baseline Tests
      Fix Environment
      No Functional Source Changes
    type: process
    size: xl
    position:
      x: 680
      'y': 300
  - id: qa
    label: |-
      Multi-Stage Quality Assurance
      Expert Review + Static API Coverage
      Pilot Agents
      Senior-Engineer Refinement
    type: process
    size: xl
    position:
      x: 1640
      'y': 190
  - id: release
    label: |-
      NL2Repo-Bench: 104 Tasks / 9 Categories
      Easy <= 1500
      Medium 1500-4000; Hard >= 4000 LOC
      Difficulty Uses Original LOC
    type: database
    size: xl
    position:
      x: 1640
      'y': 500
  - id: agent_input
    label: |-
      Empty Workspace + Only One Spec
      No Separate Scaffold / Source / Tests
      API Signatures Only Inside the Spec
    type: document
    size: xl
    position:
      x: 1320
      'y': 500
  - id: build
    label: |-
      Autonomous Repository Construction
      Agent May Use Available Tools
      No Interaction-Round Limit
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: package
    label: |-
      Package Generated Workspace
      Install into Task Evaluation Image
      Keep Hidden Artifacts Outside Context
    type: process
    size: xl
    position:
      x: 680
      'y': 500
  - id: hidden_pytest
    label: |-
      Original Upstream pytest Suite
      --continue-on-collection-errors
      Execute All Collected Tests
    type: process
    size: xl
    position:
      x: 360
      'y': 500
  - id: avg_score
    label: |-
      Per-Task Continuous Score
      Average Test Pass Rate
      Mean over Repository Tests
    type: process
    size: xl
    position:
      x: 40
      'y': 400
  - id: full_pass
    label: |-
      Fully-Passed Pass@1 Count
      Entire Suite Passes in One Run
      Repository Count; Not Estimator
    type: process
    size: xl
    position:
      x: 360
      'y': 700
  - id: report
    label: |-
      NL2Repo-Bench Results
      Average Test-Pass Score
      Separate Full-Pass Count
    type: terminal
    size: xl
    position:
      x: 40
      'y': 860
edges:
  - from: candidates
    to: selection
    type: primary
  - from: selection
    to: baseline
    type: primary
  - from: baseline
    to: ast_inventory
    type: primary
  - from: ast_inventory
    to: behavior_review
    type: primary
  - from: behavior_review
    to: specification
    type: primary
  - from: baseline
    to: docker
    type: data
  - from: specification
    to: qa
    type: primary
  - from: docker
    to: qa
    type: data
    waypoints:
      - x: 780
        'y': 420
      - x: 1780
        'y': 420
      - x: 1780
        'y': 240
  - from: qa
    to: release
    type: primary
  - from: release
    to: agent_input
    type: primary
  - from: agent_input
    to: build
    type: primary
  - from: build
    to: package
    type: primary
  - from: package
    to: hidden_pytest
    type: primary
  - from: docker
    to: hidden_pytest
    type: data
  - from: hidden_pytest
    to: avg_score
    type: primary
  - from: hidden_pytest
    to: full_pass
    type: secondary
  - from: avg_score
    to: report
    type: primary
  - from: full_pass
    to: report
    type: secondary
modules: []
