    type: primary
  - from: segment
    to: refine
    type: primary
  - from: refine
    to: qc
    type: primary
  - from: weights
    to: qc
    type: data
    waypoints:
      - x: 884
        'y': -8
      - x: 1444
        'y': -8
  - from: qc
    to: refine
    type: optional
  - from: qc
    to: release
    type: primary
  - from: release
    to: release_boundary
    type: primary
  - from: release_boundary
    to: static_eval
    type: primary
  - from: static_eval
    to: static_metrics
    type: primary
  - from: release_boundary
    to: agentic_sample
    type: primary
  - from: agentic_sample
    to: agent_loop
    type: primary
  - from: release_boundary
    to: reference
