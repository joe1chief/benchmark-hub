meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BRIGHT-Pro Build Process
  description: Paper-aligned expert construction and two evaluation lanes with the pinned HF weight-scale boundary explicit.
  legend: >-
    Solid arrows show benchmark construction and evaluation; dashed arrows carry aspect weights, validated reference
    answers, or review feedback.
nodes:
  - id: bright_source
    label: |-
      Start from BRIGHT StackExchange
      739 Queries across Seven Domains
      Unified Corpus of 526,319 Documents
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: experts
    label: |-
      Assign Field-Specific Experts
      Use Community Answers
      as Starting Points
      Identify Premises Needed
      for Defensible Solutions
    type: user
    size: xl
    position:
      x: 320
      'y': 240
  - id: aspects
    label: |-
      Decompose Each Information Need
      Compact Non-Redundant
      Reasoning Aspects
      One- to Two-Sentence Rationale
      per Aspect
    type: process
    size: xl
    position:
      x: 600
      'y': 60
  - id: weights
    label: |-
      Paper Aspect Importance
      Likert 1 to 5
      Normalize Weights to Sum to One
      Dominant through
      Peripheral Evidence
    type: process
    size: xl
    position:
      x: 880
      'y': 60
  - id: reaudit
    label: |-
      Re-Audit Original BRIGHT Positives
      Assign Explicit Evidence to Aspects
      Discard Weak • Merge Overlap
      Trim Noise
    type: process
    size: xl
    position:
      x: 600
      'y': 300
  - id: collect
    label: |-
      Collect New Aspect Evidence
      Web Search or AI-Assisted Search
      Require Explicit and Precise
      Credible Support
    type: document
    size: xl
    position:
      x: 880
      'y': 300
  - id: segment
    label: |-
      Process Source Pages with FireCrawl
      Remove Boilerplate
      and Manually Trim Noise
      Split Multi-Aspect Pages into
      Single-Aspect Positive Passages
    type: process
    size: xl
    position:
      x: 1160
      'y': 300
  - id: refine
    label: |-
      Iteratively Refine Aspect Schema
      Add Missing Assumptions
      Split Broad Aspects
      Consolidate Redundant
      Reasoning Needs
    type: process
    size: xl
    position:
      x: 1160
      'y': 60
  - id: qc
    label: |-
      Run Independent Same-Field Review
      Check Granularity and Balance
      Weights and Coverage
      Recheck Evidence Credibility
      κ = 0.742 on 50
    type: decision
    size: xl
    position:
      x: 1440
      'y': 240
  - id: release
    label: |-
      Paper Benchmark Assembly
      739 Queries • 526,319 Documents
      2,763 Aspects • 5,272 Gold Passages
      Avg 3.74 Aspects • 7.13 Positives
    type: database
    size: xl
    position:
      x: 1720
      'y': 240
  - id: release_boundary
    label: |-
      Pinned HF Release Boundary
      2,763 Aspect Rows Use {1, 2, 3}
      Paper Says Likert 1–5
      HF Revision dbdc22b
    type: document
    size: xl
    position:
      x: 2000
      'y': 240
  - id: static_eval
    label: |-
      Run Static Ranked Retrieval
      One Ranked Passage List per Query
      Reward Complementary
      Aspect Coverage
    type: process
    size: xl
    position:
      x: 2280
      'y': 40
  - id: static_metrics
    label: |-
      Score Static Retrieval
      α-nDCG@k with α = 0.5
      Weighted A-Recall • NDCG@k
      Recall@k
    type: process
    size: xl
    position:
      x: 2560
      'y': 40
  - id: agentic_sample
    label: |-
      Fix Agentic Evaluation Sample
      175 Queries • 25 per Domain
      Fixed Random Seed 42
      Same Sample and Budgets
      for Every Retriever
    type: process
    size: xl
    position:
      x: 2280
      'y': 240
  - id: agent_loop
    label: |-
      Run Retriever inside Search Agent
      GPT-5-mini + Qwen3.5 Backends
      Top-5 per Round
      Fixed R = 1, 2, 3 or Adaptive Stop
    type: process
    size: xl
    position:
      x: 2560
      'y': 240
  - id: reference
    label: |-
      Build and Validate Reference Answers
      GPT-5 High Reasoning over
      Human Gold Evidence
      Blind Human Check on 40 Samples
    type: document
    size: xl
    position:
      x: 2280
      'y': 440
  - id: judge
    label: |-
      GPT-5 Judge for Cited Answers
      Aspect Coverage 0 / 0.5 / 1
      Overall Quality 1 to 5
      Completeness • Rounds
      AER Efficiency Reward
    type: process
    size: xl
    position:
      x: 2560
      'y': 440
  - id: report
    label: |-
      Report Retriever and Agent Utility
      Static Diversity
      Reasoning Completeness
      Final Quality and Search Rounds
      plus AER
    type: terminal
    size: xl
    position:
      x: 2840
      'y': 240
edges:
