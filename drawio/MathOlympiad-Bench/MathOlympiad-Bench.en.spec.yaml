meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MathOlympiad-Bench Construction and Evaluation
  description: >-
    Goedel-Prover-V2-paper-aligned workflow for human processing of Compfiles and IMOSLLean4 formalizations,
    statement-level Lean validation, the 360-record release, and whole-proof evaluation with optional verifier-guided
    self-correction.
  legend: >-
    Labeled branches expose repair and compilation loops. Benchmark construction validates formal statements with a
    sorry placeholder; evaluation replaces that placeholder with generated proofs and counts only accepted Lean
    compilations. The main paper reports Pass@32 while defining the general Pass@N metric.
nodes:
  - id: sources
    label: |-
      Collect Existing Formalizations
      Compfiles + IMOSLLean4
      Olympiad-level Mathematics
      Preserve Informal Source Text
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: composition
    label: |-
      Assemble Contest Coverage
      158 IMO · 1959–2024
      131 IMO Shortlist · 2006–2023
      68 National Olympiad · 3 Puzzles
    type: process
    size: xl
    position:
      x: 380
      'y': 40
  - id: issue_gate
    label: |-
      Source Record Has an Issue?
      Incomplete · Split across Files
      Multiple Theorems · Mathlib Conflict
    type: decision
    size: xl
    position:
      x: 740
      'y': 40
  - id: repair
    label: |-
      Human-process the Record
      Complete the Statement
      Consolidate Dependencies
      Split Theorems + Repair Mathlib
    type: user
    size: xl
    position:
      x: 1100
      'y': 300
  - id: normalize
    label: |-
      Normalize One Benchmark Record
      Exactly One Formal Theorem
      One Corresponding Informal Statement
      Preserve Assumptions and Meaning
    type: process
    size: xl
    position:
      x: 1100
      'y': 40
  - id: compile_statement
    label: |-
      Validate the Formal Statement
      Replace the Proof with by sorry
      Compile against the Target Mathlib
      Check Syntax + Environment
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: statement_gate
    label: |-
      Does the Statement Compile
      with the sorry Placeholder?
    type: decision
    size: xl
    position:
      x: 1820
      'y': 40
  - id: release
    label: |-
      Release MathOlympiad-Bench
      360 Human-verified Records
      Formal Theorem + Informal Statement
      Algebra · Number Theory · Combinatorics · Geometry
    type: database
    size: xl
    position:
      x: 2180
      'y': 40
  - id: overlap_audit
    label: |-
      Audit Shared IMO Problems
      Compare against MiniF2F
      At Least Three MiniF2F Weak/Mismatched Cases
      No Analogous Issue Observed Here
    type: terminal
    size: xl
    position:
      x: 2540
      'y': 300
  - id: setup
    label: |-
      Prepare Formal-proof Evaluation
      Lean 4.9.0-rc1
      Give Full Context + Theorem
      Draw N Independent Attempts
    type: document
    size: xl
    position:
      x: 2180
      'y': 600
  - id: generate
    label: |-
      Generate an Initial Whole Proof
      Paper Maximum: 30,000 Tokens
      Extract Proof from Model Output
      Compose a Candidate Lean File
    type: process
    size: xl
    position:
      x: 1820
      'y': 600
  - id: proof_gate
    label: |-
      Lean Compilation Complete
      and No apply? / exact? Tactic?
    type: decision
    size: xl
    position:
      x: 1460
      'y': 600
  - id: pass_sample
    label: |-
      Accept This Proof Attempt
      Record One Successful Sample
      Stop Correcting This Attempt
    type: process
    size: xl
    position:
      x: 1100
      'y': 600
  - id: correction_gate
    label: |-
      Self-correction Enabled
      and Fewer than Two Repairs Used?
    type: decision
    size: xl
    position:
      x: 1460
      'y': 880
  - id: revise
    label: |-
      Revise with Verifier Feedback
      Include Previous Output + Lean Errors
      Generate the Next Proof Attempt
      Total Output Budget: 40,000 Tokens
    type: process
    size: xl
    position:
      x: 1820
      'y': 880
  - id: fail_sample
    label: |-
      Mark This Attempt Unsuccessful
      Standard Mode or Repair Limit Reached
    type: process
    size: xl
    position:
      x: 1100
      'y': 880
  - id: aggregate
    label: |-
      Aggregate Pass@N
      Problem Passes if ≥1 of N Attempts Succeeds
      Main Comparison Uses N = 32
      Report Direct + Self-corrected Results
    type: terminal
    size: xl
    position:
      x: 740
      'y': 740
edges:
  - from: sources
    to: composition
    type: primary
  - from: composition
    to: issue_gate
    type: primary
  - from: issue_gate
    to: repair
    type: optional
    label: Issue found · repair
    waypoints:
      - x: 840
        'y': 220
      - x: 1200
        'y': 220
  - from: issue_gate
    to: normalize
    type: primary
    label: No issue · normalize
  - from: repair
    to: normalize
    type: primary
    label: Repaired
  - from: normalize
    to: compile_statement
    type: primary
  - from: compile_statement
    to: statement_gate
    type: primary
  - from: statement_gate
    to: release
    type: primary
    label: Compiles · retain
  - from: statement_gate
    to: repair
    type: optional
    label: Fails · repair
    waypoints:
      - x: 1940
        'y': 230
      - x: 1200
        'y': 230
  - from: release
    to: overlap_audit
    type: optional
    label: Shared cases · audit
    waypoints:
      - x: 2280
        'y': 220
      - x: 2640
        'y': 220
  - from: release
    to: setup
    type: primary
  - from: setup
    to: generate
    type: primary
  - from: generate
    to: proof_gate
    type: primary
  - from: proof_gate
    to: pass_sample
    type: primary
    label: Accepted
  - from: proof_gate
    to: correction_gate
    type: optional
    label: Failed
  - from: correction_gate
    to: revise
    type: primary
    label: Rounds remain · revise
  - from: correction_gate
    to: fail_sample
    type: optional
    label: Standard or limit · stop
  - from: revise
    to: proof_gate
    type: primary
    label: Recompile
    waypoints:
      - x: 1920
        'y': 780
      - x: 1560
        'y': 780
  - from: pass_sample
    to: aggregate
    type: primary
  - from: fail_sample
    to: aggregate
    type: optional
modules: []
