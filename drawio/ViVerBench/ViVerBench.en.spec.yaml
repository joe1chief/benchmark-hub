meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ViVerBench Construction, Expert Refinement, and Dual Scoring
  description: >-
    ViVerBench defines 16 tasks in six visual-verification categories. Its initial dataset combines a manual branch
    authored by 12 domain experts with programmatic generation and augmented open-source data, balances true and false
    items 1:1, and attaches ground-truth explanations to false items. A first group of five new experts reviews
    correctness and ambiguity and enhances difficulty before human evaluation by ten experts split into two groups of
    five. A separate second group of five new experts then rechecks frequently missed items; incorrect items are removed
    and ambiguities refined, yielding 3,594 samples. Rule-based accuracy checks only the true/false label; model-based
    accuracy additionally uses GPT-4.1 to verify explanation consistency when both ground truth and prediction are
    false.
  legend: >-
    Source: ViVerBench ICLR 2026 paper, Section 3 and Appendix A. Solid arrows show the main flow explicitly supported
    by the paper or official documentation.
