meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ComplexFuncBench Audio 派生评测流程
  description: Google DeepMind 对固定 ComplexFuncBench 文本发布版进行有据可查的音频适配：将既有提示转为音频并复用公开函数调用评分器，而非构建新数据集。
  legend: 实线表示文档明确披露的派生评测；未公开的合成细节会明确标注。
nodes:
  - id: evidence
    label: |-
      Google 报告：2026 年 3 月
      PDF SHA256 95d1144…
      基础代码 c37b284 / 数据 5dc7739
    type: document
    size: xl
    position:
      x: 40
      'y': 190
  - id: base_release
    label: |-
      复用固定 1,000 条文本提示
      复用既有公开评分器
      无新音频数据集发布
    type: database
    size: xl
    position:
      x: 320
      'y': 190
  - id: derived
    label: |-
      派生评测边界
      无新采样 / 划分 / 去重 / 标注
      未声称新增质检
    type: process
    size: xl
    position:
      x: 600
      'y': 190
  - id: audio_synth
    label: |-
      为既有提示逐条合成音频
      TTS 模型、音色与参数均未披露
      保持提示语义
    type: document
    size: xl
    position:
      x: 880
      'y': 190
  - id: protocol
    label: |-
      静态上下文多轮协议
      相互依赖的旅行预订调用
      保留基础任务序列
    type: process
    size: xl
    position:
      x: 880
      'y': 410
  - id: live_run
    label: |-
      Google 运行 Gemini Live API
      实时音频输入 + 函数调用
    type: process
    size: xl
    position:
      x: 600
      'y': 410
  - id: scorer
    label: |-
      应用公开的原始基准方法
      计算函数调用准确率
      未报告独立音频质量裁判
    type: process
    size: xl
    position:
      x: 320
      'y': 410
  - id: report
    label: |-
      函数调用准确率
      3.1 High 90.8% / 2.5 Dec 71.5%
      2.5 Sep 66.0%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 410
edges:
  - from: evidence
    to: base_release
    type: primary
  - from: base_release
    to: derived
    type: primary
  - from: derived
    to: audio_synth
    type: primary
  - from: audio_synth
    to: protocol
    type: primary
  - from: protocol
    to: live_run
    type: primary
  - from: live_run
    to: scorer
    type: primary
  - from: scorer
    to: report
    type: primary
modules: []
