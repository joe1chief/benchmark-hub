meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Legal Agent Benchmark Build Process
  description: >-
    Official-source reconstruction separating benchmark construction and release, public-harness execution and
    evaluation, and the independent private-holdout LAB-AA leaderboard.
  legend: >-
    No associated research paper was found. Solid arrows show the public MIT artifact and local evaluation path; the
    dashed branch mirrors its distribution in a separate 120-task private LAB-AA holdout. At pinned commit 845a088,
    README advertises 1,671 tasks, while same-revision evaluation docs still state 1,660 tasks and about 101,000
    criteria; no exact current criterion total is claimed.
nodes:
  - id: source
    label: |-
      Abstract Real Client Matters
      Start from Practicing-lawyer Work
      Use Synthetic People, Entities, Facts
      Cover 24 Representative Practice Areas
    type: user
    module: construction
    size: xl
    position:
      x: 32
      'y': 224
  - id: task
    label: |-
      Define Associate-level Assignments
      Partner-style Instructions · ~50 Words
      Use a Closed-universe Matter File
      Specify Reviewable Deliverables
    type: process
    module: construction
    size: xl
    position:
      x: 304
      'y': 224
  - id: documents
    label: |-
      Build Synthetic Matter Files
      Lawyer-guided and Reviewed Batches
      Mix Key and Peripheral Documents
      Plant Issues across Multiple Files
    type: document
    module: construction
    size: xl
    position:
      x: 576
      'y': 224
  - id: rubric
    label: |-
      Author Atomic Expert Criteria
      Binary · Equal Weight · No Gold Output
      match_criteria Defines Pass or Fail
      Scope to Deliverables · Sources Optional
    type: user
    module: construction
    size: xl
    position:
      x: 848
      'y': 224
  - id: package
    label: |-
      Package Each Self-contained Task
      tasks/[area]/[workflow]/[scenario]/
      task.json + documents/
      Title · Prompt · Work Type · Tags
      Deliverables · Criteria
    type: database
    module: construction
    size: xl
    position:
      x: 1120
      'y': 224
  - id: qc
    label: |-
      Run Content + Integrity Gates
      Lawyer Guidance and Document Review
      Valid JSON · Title · Criteria · Unique IDs
      Deliverable Lists · No Legacy Weights
    type: process
    module: construction
    size: xl
    position:
      x: 1392
      'y': 224
  - id: release
    label: |-
      Release Evolving MIT Repository
      Pinned README: 1,671 Tasks
      24 Practice Areas + Contracting
      Add M&A Diligence Extension
    type: database
    module: construction
    size: xl
    position:
      x: 1664
      'y': 224
  - id: boundary
    label: |-
      Separate Artifact Boundaries
      Public Tasks + Rubrics + Harness
      No Published Train/Dev/Test Split
      Private LAB-AA Holdout Is External
    type: document
    module: construction
    size: xl
    position:
      x: 1936
      'y': 224
  - id: load
    label: |-
      Harness Loads One Public Task
      task.json + Matter Documents
      System Prompt + Skills + Instructions
      Agent Rubric Access Automatically Fails
    type: process
    module: public_eval
    size: xl
    position:
      x: 32
      'y': 544
  - id: sandbox
    label: |-
      Create a Per-task Podman Sandbox
      --network=none · --cap-drop=ALL
      Documents Read-only
      Workspace + Output Writable
    type: process
    module: public_eval
    size: xl
    position:
      x: 304
      'y': 544
  - id: agent
    label: |-
      Run the Model–Tool Loop
      Bash · Read · Write · Edit · Glob · Grep
      Default Maximum: 200 Turns
      Save Deliverables · Transcript · Metrics
    type: process
    module: public_eval
    size: xl
    position:
      x: 576
      'y': 544
  - id: parse
    label: |-
      Resolve + Parse Deliverables
      Exact · Extension · Fuzzy · LLM Match
      DOCX · XLSX · PPTX · PDF → Text
      Load Only Criterion-scoped Files
    type: process
    module: public_eval
    size: xl
    position:
      x: 848
      'y': 544
  - id: judge
    label: |-
      Judge One Criterion per LLM Call
      Title + Output + match_criteria Prompt
      Default Sonnet 4.6 · Temperature 0
      Anthropic · Google · OpenAI · Mistral
      Return JSON Verdict + Reasoning
    type: process
    module: public_eval
    size: xl
    position:
      x: 1120
      'y': 544
  - id: score
    label: |-
      Apply Strict All-pass Scoring
      Each Criterion Passes or Fails
      Task = 1 Only When All Criteria Pass
      No Task-level Partial Credit
    type: process
    module: public_eval
    size: xl
    position:
      x: 1392
      'y': 544
  - id: report
    label: |-
      Write scores.json + report.html
      Headline: All-pass Task Rate
      Diagnostic: Pooled Criterion Rate
      Heatmap · Coverage · Tokens · Time · Cost
    type: terminal
    module: public_eval
    size: xl
    position:
      x: 1664
      'y': 544
  - id: private_holdout
    label: |-
      Use a Separate Private Holdout
      120 Tasks · 24 Practice Areas
      Mirror the Public Task Distribution
      Not Released with the MIT Repository
    type: database
    module: partner_leaderboard
    size: xl
    position:
      x: 1936
      'y': 864
  - id: lab_aa
    label: |-
      Publish Independent LAB-AA Leaderboard
      Artificial Analysis Stirrup Harness
      Single LLM Criterion Judge
      All-pass + Criterion Pass Rates
      Cost · Tokens · Speed · Turns
    type: terminal
    module: partner_leaderboard
    size: xl
    position:
      x: 2208
      'y': 864
