meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TIIF-Bench Build and Evaluation Process
  description: >-
    TIIF-Bench constructs ten dimension-specific concept pools by grouping prompts from existing benchmarks and asking
    GPT-4o to extract object, attribute, and relation pairs. Thirty-six combination policies create Basic within-group
    and Advanced cross-group compositions, which GPT-4o turns into natural instructions. Text-rendering prompts come
    from Lex-Art, style-control prompts come from AIGC communities and receive manually verified reference images at
    five aspect ratios, and humans curate 100 real-world Designer-Level prompts. Every prompt is expanded into a longer
    paraphrase with identical semantics. The full benchmark has 5,000 prompts and 12,074 binary checklist questions; the
    balanced TestMini subset has 554 prompts and 1,446 questions. During evaluation a T2I model generates an image,
    TIIF-Evaluator answers attribute-specific yes/no questions, and checklist accuracy gives fine-grained instruction
    following. Text rendering uses OCR plus Global Normalized Edit Distance with Hungarian matching and unmatched-word
    penalties. Style control compares the nearest-aspect-ratio reference using CSD and DINOv3 similarity. Scores are
    reported by Basic, Advanced, Designer level and short-versus-long robustness.
  legend: >-
    Source: TIIF-Bench arXiv:2506.02161v3 Section 3 and Appendices A1-A3; official TIIF_Bench project page and released
    data. Solid arrows show the main flow explicitly supported by the paper or official documentation.
