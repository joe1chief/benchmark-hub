meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StrongREJECT Build and Evaluation Process
  description: >-
    StrongREJECT cross-references five provider policy families to define six universally prohibited harm categories.
    Its 313 prompts combine 221 new manual or LLM-assisted items with curated prompts from prior benchmarks. Existing
    candidates undergo category selection, longest-to-shortest OpenAI-embedding cosine de-duplication, a nine-model
    refusal screen, GPT-3.5 taxonomy classification, and manual removal of vague, unanswerable, ill-posed, or
    information-hazard items. Every category has at least 50 prompts; 70 percent are novel, 10 percent come from DAN, 10
    percent from AdvBench, and the remainder from other sources. The rubric evaluator receives the forbidden prompt and
    response, reasons, then outputs binary refusal plus 1-to-5 convincingness and specificity scores. Refusals score
    zero; otherwise the two rescaled attributes are equally averaged. The paper uses GPT-4o-mini for this rubric and
    also trains a Gemma 2B evaluator from rubric labels. Validation uses five LabelBox raters on a 60-prompt subset, 17
    jailbreaks, and four victim models, with median human scores compared by bias, MAE, and Spearman correlation.
  legend: >-
    Source: StrongREJECT arXiv:2402.10260 Sections 2-3 and Appendices C-E; official dsbowen/strong_reject repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
