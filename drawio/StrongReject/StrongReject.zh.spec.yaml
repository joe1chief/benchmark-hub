meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: StrongREJECT 构建与评测流程
  description: >-
    StrongREJECT交叉比对5家模型提供商的政策体系，定义6类普遍禁止的伤害内容。313条提示由221条新写或LLM辅助样本与既有基准筛选样本组成。既有候选依次经过类别筛选、按长度从长到短的OpenAI嵌入余弦去重、9个哨兵模型拒答筛选、GPT-3.5分类和人工过滤，删除模糊、不可答、不成立或可能形成信息危害的条目。每类至少50题；70%为新题，DAN和AdvBench各占10%，其余来自其他来源。评分器输入禁止提示与模型回答，先给出理由，再输出二元拒答以及1至5分的说服力和具体性。拒答记0分；否则把后两项归一化后等权平均。论文用GPT-4o-mini运行该量表，并用量表标签训练Gemma
    2B开源评分器。验证由5名LabelBox标注员对60题子集、17种越狱和4个受测模型评分，以人工中位数通过偏差、MAE与Spearman相关比较自动评分器。
  legend: >-
    来源：StrongREJECT arXiv:2402.10260 Sections 2-3 and Appendices C-E; official dsbowen/strong_reject
    repository。实线箭头表示论文或官方资料明确支持的主流程。
