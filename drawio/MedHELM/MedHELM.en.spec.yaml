meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHELM Build and Evaluation Process
  description: >-
    Paper-v2 and fixed-source-aligned development of the clinician-validated medical taxonomy, 35-benchmark suite,
    nine-model evaluation, task-specific scoring, LLM-jury validation, aggregation, cost accounting, and release.
  legend: >-
    Paper: arXiv:2505.23802v2. Paper-aligned source snapshot: stanford-crfm/helm@2fcc2945. Dashed branches expose
    access, sensitivity-analysis, failure-denominator, normalization, or living-release boundaries.
nodes:
  - id: taxonomy_source
    label: |-
      Taxonomy Seed
      Medical Tasks from a JAMA Review
      Reorganized with Clinician MK
      Medical Relevance + Clear Boundaries
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: draft_taxonomy
    label: |-
      Draft the Initial Hierarchy
      Five Categories
      21 Subcategories
      98 Candidate Tasks
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: clinicians
    label: |-
      Recruit 29 Clinicians
      14 Specialties · Four Institutions
      Stanford 26 · Three Other Sites 1 Each
      Independent Survey Responses
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: survey
    label: |-
      Run the Two-Part Validation Survey
      Map 21 Subcategories to Five Categories
      Rate Comprehensiveness from 1 to 5
      Submit Free-Text Feedback
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: refine
    label: |-
      Analyze and Refine the Taxonomy
      Category-Mapping Agreement: 96.7%
      Mean Comprehensiveness: 4.21 of 5
      Incorporate 107 Comments
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: final_taxonomy
    label: |-
      Final Clinician-Validated Taxonomy
      Five Categories
      22 Subcategories
      121 Medical Tasks
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: origin_route
    label: |-
      Benchmark Source Type?
      Existing · Reformulated · New
    type: decision
    size: xl
    position:
      x: 1700
      'y': 120
  - id: existing
    label: |-
      Incorporate 17 Existing Benchmarks
      Draw from Public or Gated Sources
      Map Each Benchmark to the Taxonomy
      Retain Task-Appropriate Evaluation
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: reformulated
    label: |-
      Reformulate Five Data Collections
      Apply Standardized Prompt Templates
      Specify Evaluation Metrics
      Convert Data into LLM-Ready Benchmarks
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: new_benchmarks
    label: |-
      Construct 13 New Benchmarks
      Fill Administration and Workflow Gaps
      Twelve of 13 Use EHR Data
      Partner with Stanford Health Care
    type: database
    size: xl
    position:
      x: 1980
      'y': 300
  - id: suite
    label: |-
      Assemble the 35-Benchmark Suite
      Cover All 22 Subcategories
      13 Open-Ended · 22 Closed-Ended
      14 Public · 7 Gated · 14 Private
    type: database
    size: xl
    position:
      x: 1700
      'y': 560
  - id: access_boundary
    label: |-
      Access / Reproducibility Boundary
      Public: Openly Reproducible
      Gated: Approval Required
      Private: Organization Authorization
    type: document
    size: xl
    position:
      x: 1420
      'y': 560
  - id: item_contract
    label: |-
