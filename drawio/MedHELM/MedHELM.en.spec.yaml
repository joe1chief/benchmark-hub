      Gold-Quality Sensitivity Check
      GPT-4o-mini Flags Reformulated Golds
      More Issues in MIMIC-RRS
      and MTSamples Procedures
      Ranks Stable · Main Suite Unfiltered
    type: process
    size: xl
    position:
      x: 860
      'y': 560
  - id: models
    label: |-
      Paper's Nine Models
      DeepSeek R1 · o3-mini
      Claude 3.7 · Claude 3.5 · GPT-4o
      Gemini 2.0 Flash · GPT-4o mini
      Llama 3.3 70B · Gemini 1.5 Pro 001
    type: process
    size: xl
    position:
      x: 580
      'y': 560
  - id: execution
    label: |-
      Run HELM Task Adapters
      API or Local · Temperature 0
      Task-Specific Prompt, Parser, Token Limit
      PHI/HIPAA-Compliant Cluster
    type: process
    size: xl
    position:
      x: 300
      'y': 560
  - id: output_route
    label: |-
      Output Type?
      Closed-Ended
      or Open-Ended
    type: decision
    size: xl
    position:
      x: 20
      'y': 560
  - id: closed_metrics
    label: |-
      Closed-Ended Metrics
      Exact Match: Single Token or Numeric
      Micro-F1: Multi-Label
      Parsing / Failure Rules Vary by Scenario
    type: process
    size: xl
    position:
      x: 300
      'y': 800
  - id: open_output
    label: |-
      Open-Ended Jury Inputs
      Candidate + Benchmark-Specific Prompt
      Gold Only When Required
      ROUGE / BERTScore Are Secondary
    type: process
    size: xl
    position:
      x: 300
      'y': 1040
  - id: jury_parse
    label: |-
      Three-Model Jury · Scores 1 to 5
      GPT-4o · Claude 3.7 · Llama 3.3 70B
      Accuracy · Completeness/Structure · Clarity
      NoteExtract: Structure, Not Completeness
      Temp 0 · Max 4096 · No CoT
      Greedy-Brace JSON
    type: process
    size: xl
    position:
      x: 580
      'y': 1040
  - id: jury_valid
    label: |-
      Any Successful
      Juror Annotation?
    type: decision
    size: xl
    position:
      x: 860
      'y': 1040
  - id: jury_score
    label: |-
      Successful-Juror int(score) Aggregation
      Each Adds 3 Axes; Non-Integer May Truncate / Fail
      Failed Juror Removes All Three
      Paper Target: 3 Jurors × 3 Axes
    type: process
    size: xl
    position:
      x: 1140
      'y': 890
  - id: jury_failure
    label: |-
      Failure Boundary
      Empty Candidate or No Successful Juror → 0
      Bad JSON / Missing Key / API Error
      Drops the Whole Juror
    type: process
    size: xl
    position:
      x: 1140
      'y': 1180
  - id: clinician_validation
    label: |-
      Clinician Validation
      ACI-Bench 31 + MEDIQA-QA 25
      20 Clinicians · ≥2 per Instance
      ICC: Jury .47 · Human .43
      ROUGE .36 · BERTScore .44
    type: process
    size: xl
    position:
      x: 1700
      'y': 1040
  - id: benchmark_scores
    label: |-
      Per-Benchmark Scores
      Preserve Each Native Metric
      Open: Successful-Juror Rule
      No Universal Cross-Task Parser
    type: database
    size: xl
    position:
      x: 1420
      'y': 800
  - id: normalization_boundary
    label: |-
      Normalization / Missingness
      No Paper Formula for 0-to-1 View
      Leaderboard Keeps Original Scores
      Source Skips Missing or Non-Orderable Pairs
    type: document
    size: xl
    position:
      x: 1980
      'y': 1370
  - id: aggregate
    label: |-
      Cross-Benchmark Aggregation
      Paper: Equal Macro over 35
      Paper: Greater-or-Equal Score Is a Win
      Source: Half-Credit Ties · Available Pairs Only
    type: process
    size: xl
    position:
      x: 1700
      'y': 1370
  - id: cost
    label: |-
      Estimate Cost-Performance
      Inputs + Maximum Outputs
      Upper Bound · Prices at 2025-05-12
      Nine Models: $11,739.07
    type: process
    size: xl
    position:
      x: 1420
      'y': 1370
  - id: release_rights
    label: |-
      Release Framework + Leaderboard
      HELM Code: Apache 2.0
      14 Private Datasets Withheld
      Privacy · Regulation · Contamination
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 1370
  - id: release_drift
    label: |-
      Version and Drift Boundary
      Paper: MedHELM v2.0.0
      Audit Pin: HELM@2fcc2945
      Paper Pins No Commit or Result Hash
      latest Continues to Evolve
    type: document
    size: xl
    position:
      x: 860
      'y': 1370
