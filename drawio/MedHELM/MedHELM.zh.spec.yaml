meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedHELM 构建与评测流程
  description: 对齐论文 v2 与固定官方源码，展示临床专家验证的医学任务分类体系、35 基准套件、九模型评测、任务专用评分、 LLM 评审团验证、聚合、成本核算与发布流程。
  legend: 论文：arXiv:2505.23802v2。论文对齐源码快照：stanford-crfm/helm@2fcc2945。虚线分支用于显式标注 访问、敏感性分析、失败分母、归一化或持续更新发布的边界。
nodes:
  - id: taxonomy_source
    label: |-
      分类体系起点
      JAMA 综述中的医学任务
      与临床专家 MK 共同重组
      强调医学相关性与清晰边界
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: draft_taxonomy
    label: |-
      草拟初始层级结构
      五个大类
      21 个子类
      98 项候选任务
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: clinicians
    label: |-
      招募 29 名临床医生
      覆盖 14 个专科 · 四家机构
      Stanford 26 · 其余三家各 1
      独立填写调查问卷
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: survey
    label: |-
      开展两部分验证调查
      将 21 个子类映射到五个大类
      按 1 至 5 分评价完整性
      提交自由文本反馈
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: refine
    label: |-
      分析并修订分类体系
      大类映射一致率 96.7%
      完整性均分 4.21 / 5
      吸收 107 条意见
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: final_taxonomy
    label: |-
      形成临床专家验证的最终分类体系
      五个大类
      22 个子类
      121 项医学任务
    type: database
    size: xl
    position:
      x: 1420
      'y': 40
  - id: origin_route
    label: |-
      基准来源类型？
      现有 · 重构 · 新建
    type: decision
    size: xl
    position:
      x: 1700
      'y': 120
  - id: existing
    label: |-
      纳入 17 个现有基准
      来源为公开或受控数据
      将每个基准映射到分类体系
      保留适合任务的评测方法
    type: database
    size: xl
    position:
      x: 1420
      'y': 300
  - id: reformulated
    label: |-
      重构五个数据集合
      应用标准化提示模板
      明确评测指标
      转换为适合大模型评测的基准
    type: process
    size: xl
    position:
      x: 1700
      'y': 300
  - id: new_benchmarks
    label: |-
      新建 13 个基准
      补足管理与工作流任务空白
      其中 12 个使用电子病历数据
      与 Stanford Health Care 合作
    type: database
    size: xl
    position:
      x: 1980
      'y': 300
  - id: suite
    label: |-
      组装 35 基准套件
      覆盖全部 22 个子类
      13 个开放式 · 22 个封闭式
      14 个公开 · 7 个受控 · 14 个私有
    type: database
    size: xl
    position:
      x: 1700
      'y': 560
  - id: access_boundary
    label: |-
      访问 / 可复现边界
      公开：可公开复现
      受控：需要审批
      私有：需要所属机构授权
    type: document
    size: xl
    position:
      x: 1420
      'y': 560
  - id: item_contract
    label: |-
      基准条目合约
      上下文 · 提示 · 任务指标
      可选标准答案
      场景 + 运行规范适配具体任务
    type: document
    size: xl
    position:
      x: 1140
      'y': 560
  - id: gold_sensitivity
    label: |-
      标准答案质量敏感性检查
      GPT-4o-mini 标记重构基准答案
      问题较多：MIMIC-RRS
      + MTSamples Procedures
      排名稳定 · 不过滤主套件
    type: process
    size: xl
    position:
      x: 860
      'y': 560
  - id: models
    label: |-
      论文中的九个模型
      DeepSeek R1 · o3-mini
      Claude 3.7 · Claude 3.5 · GPT-4o
      Gemini 2.0 Flash · GPT-4o mini
      Llama 3.3 70B · Gemini 1.5 Pro 001
    type: process
    size: xl
    position:
      x: 580
      'y': 560
  - id: execution
    label: |-
      运行 HELM 任务适配器
      接口或本地端点 · 温度 0
      任务专用提示、解析器、词元上限
      PHI/HIPAA 合规集群
    type: process
    size: xl
    position:
      x: 300
      'y': 560
  - id: output_route
    label: |-
      输出类型？
      封闭式
      或开放式
    type: decision
    size: xl
    position:
      x: 20
      'y': 560
  - id: closed_metrics
    label: |-
      封闭式指标
      精确匹配：单词元或数值
      微平均 F1：多标签
      解析 / 失败规则因场景而异
    type: process
    size: xl
    position:
      x: 300
      'y': 800
  - id: open_output
    label: |-
      开放式评审输入
      候选回答 + 基准专用提示
      仅在需要时提供标准答案
      ROUGE / BERTScore 为辅助
    type: process
    size: xl
    position:
      x: 300
      'y': 1040
  - id: jury_parse
    label: |-
      三模型评审团 · 1 至 5 分
      GPT-4o · Claude 3.7 · Llama 3.3 70B
      评价准确性 · 完整性或结构 · 清晰度
      NoteExtract 评结构而非完整性
      温度 0 · 上限 4096 · 不用思维链
      贪心花括号 JSON
    type: process
    size: xl
    position:
      x: 580
      'y': 1040
  - id: jury_valid
    label: |-
      是否存在成功的
      评审模型标注？
    type: decision
    size: xl
    position:
      x: 860
      'y': 1040
  - id: jury_score
    label: |-
      成功评审 int(score) 聚合
      每人贡献三轴；非整数可能截断或失败
      评审失败时三个轴一并退出
      论文目标：3 名评审 × 3 个轴
    type: process
    size: xl
    position:
      x: 1140
      'y': 890
  - id: jury_failure
    label: |-
      失败边界
      候选为空或无成功评审时记 0 分
      JSON 无效 / 缺字段 / 接口报错
      会丢弃整名评审
    type: process
    size: xl
    position:
      x: 1140
      'y': 1180
  - id: clinician_validation
    label: |-
      临床医生验证
      ACI-Bench 31 例 + MEDIQA-QA 25 例
      20 名医生 · 每例至少 2 人
      ICC：评审团 .47 · 人类 .43
      ROUGE .36 · BERTScore .44
    type: process
    size: xl
    position:
      x: 1700
      'y': 1040
  - id: benchmark_scores
    label: |-
      逐基准得分
      保留各任务原生指标
      开放式：成功评审分母规则
      不存在统一的跨任务解析器
    type: database
    size: xl
    position:
      x: 1420
      'y': 800
  - id: normalization_boundary
    label: |-
      归一化 / 缺失值
      论文未给出零到一公式
      榜单保留原始分数
      源码跳过缺失或不可排序的比较
    type: document
    size: xl
    position:
      x: 1980
      'y': 1370
  - id: aggregate
    label: |-
      跨基准聚合
      论文：35 基准等权宏平均
      论文：得分大于等于对手即胜
      源码：平局半胜 · 仅算可用比较
    type: process
    size: xl
    position:
      x: 1700
      'y': 1370
  - id: cost
    label: |-
      估算成本与表现
      输入词元 + 最大输出词元
      上界 · 价格日期 2025-05-12
      九模型：11,739.07 美元
    type: process
    size: xl
    position:
      x: 1420
      'y': 1370
  - id: release_rights
    label: |-
      发布框架 + 排行榜
      HELM 代码采用 Apache 2.0
      14 个私有数据集不发布
      隐私 · 监管 · 污染防范
    type: terminal
    size: xl
    position:
      x: 1140
      'y': 1370
  - id: release_drift
    label: |-
      版本与漂移边界
      论文：MedHELM v2.0.0
      审计固定：HELM@2fcc2945
      论文未固定提交或结果哈希
      latest 会持续变化
    type: document
    size: xl
    position:
      x: 860
      'y': 1370
edges:
  - from: taxonomy_source
    to: draft_taxonomy
    type: primary
  - from: draft_taxonomy
    to: clinicians
    type: primary
  - from: clinicians
    to: survey
    type: primary
  - from: survey
    to: refine
    type: primary
  - from: refine
    to: final_taxonomy
    type: primary
  - from: final_taxonomy
    to: origin_route
    type: primary
  - from: origin_route
    to: existing
    type: primary
    label: 现有 · 17 个
    labelPosition: center
  - from: origin_route
    to: reformulated
    type: primary
    label: 重构 · 5 个
    labelPosition: center
  - from: origin_route
    to: new_benchmarks
    type: primary
    label: 新建 · 13 个
    labelPosition: center
  - from: existing
    to: suite
    type: primary
    waypoints:
      - x: 1520
        'y': 610
  - from: reformulated
    to: suite
    type: primary
  - from: new_benchmarks
    to: suite
    type: primary
    waypoints:
      - x: 2080
        'y': 610
  - from: suite
    to: access_boundary
    type: optional
  - from: access_boundary
    to: item_contract
    type: primary
  - from: item_contract
    to: gold_sensitivity
    type: optional
  - from: gold_sensitivity
    to: models
    type: primary
  - from: models
    to: execution
    type: primary
  - from: execution
    to: output_route
    type: primary
  - from: output_route
    to: closed_metrics
    type: primary
    label: 封闭式 · 22 个基准
    labelPosition: center
  - from: output_route
    to: open_output
    type: primary
    label: 开放式 · 13 个基准
    labelPosition: center
  - from: closed_metrics
    to: benchmark_scores
    type: primary
  - from: open_output
    to: jury_parse
    type: primary
  - from: jury_parse
    to: jury_valid
    type: primary
  - from: jury_valid
    to: jury_score
    type: primary
    label: 是 · 每名评审贡献三轴
    labelPosition: center
  - from: jury_valid
    to: jury_failure
    type: optional
    label: 否 · 记 0 分
    labelPosition: center
  - from: jury_score
    to: benchmark_scores
    type: primary
  - from: jury_failure
    to: benchmark_scores
    type: optional
    waypoints:
      - x: 1340
        'y': 1230
      - x: 1340
        'y': 850
  - from: jury_score
    to: clinician_validation
    type: optional
  - from: benchmark_scores
    to: normalization_boundary
    type: optional
    waypoints:
      - x: 1520
        'y': 1280
      - x: 2080
        'y': 1280
  - from: clinician_validation
    to: aggregate
    type: optional
    label: 仅作验证证据
    labelPosition: start
  - from: normalization_boundary
    to: aggregate
    type: primary
  - from: aggregate
    to: cost
    type: primary
  - from: cost
    to: release_rights
    type: primary
  - from: release_rights
    to: release_drift
    type: optional
modules: []
