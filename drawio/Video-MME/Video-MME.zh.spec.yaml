meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-MME 数据构建、复核回路与评测流程
  description: >-
    Video-MME建立6个YouTube领域和30个类别，平衡短于2分钟、4至15分钟和30至60分钟的视频，筛选900个视频并收集744份字幕和900条音轨。专家完整观看每个视频，编写3道四选一题，覆盖12类任务。另一位标注者复核语言、可答性、选项一致性和正确答案；随后Gemini
    1.5 Pro测试纯文本可答性，把可仅凭题干回答的样例退回修订。最终2700组问答在纯帧、帧加字幕、帧加音频三种设置下用真值直接计算准确率，并报告时长/领域准确率与模态增益。
  legend: 来源：Video-MME arXiv:2405.21075 and official MME-Benchmarks/Video-MME repository。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
