meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Video-MME Dataset Construction, Review Loop, and Evaluation
  description: >-
    Video-MME establishes six YouTube domains and 30 categories, balances short (<2 min), medium (4-15 min), and long
    (30-60 min) videos, and selects 900 videos with 744 subtitle files and 900 audio tracks. Expert annotators watch
    each full video and write three four-choice questions spanning 12 task types. A different annotator reviews
    language, answerability, option consistency, and the correct answer; Gemini 1.5 Pro then tests text-only
    answerability, returning answerable items for revision. The resulting 2,700 QA pairs are scored by direct
    ground-truth accuracy under frames-only, frames-plus-subtitles, and frames-plus-audio settings, with duration/domain
    accuracy and modality gains reported.
  legend: >-
    Source: Video-MME arXiv:2405.21075 and official MME-Benchmarks/Video-MME repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
