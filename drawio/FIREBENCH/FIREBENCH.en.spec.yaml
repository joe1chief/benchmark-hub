meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FIREBENCH Build Process
  description: >-
    Paper-versioned parallel construction of six enterprise instruction-following pools, category-specific grading, and
    six-way macro reporting.
  legend: >-
    Solid arrows follow arXiv:2603.04857v1. The paper's output-format arithmetic and the later public harness
    differences are disclosed rather than silently reconciled.
nodes:
  - id: evidence
    label: |-
      Fixed evidence boundary
      arXiv:2603.04857v1
      FireBench repo @ dad399d
      paper composition shown below
    type: document
    size: xl
    position:
      x: 40
      'y': 500
  - id: capabilities
    label: |-
      Define six production capabilities
      format · ordered responses
      item ranking · overconfidence
      positive / negative requirements
    type: document
    size: xl
    position:
      x: 340
      'y': 500
  - id: format
    label: |-
      Output format · Table 1: 1,300
      QA: 25 × 4 sources × 21 constraints
      paper reports 1,000 QA instances
      MHPP: 100 problems
      JSON / XML / Markdown = 300
    type: database
    size: xl
    position:
      x: 640
      'y': 0
  - id: ordered
    label: |-
      Ordered responses · 200 trials
      dual-role support sessions
      sample 10–15 fields from ~70
      one question per turn
      5–10 vetted values per field
    type: database
    size: xl
    position:
      x: 640
      'y': 200
  - id: ranking
    label: |-
      Item ranking · 200 trials
      20 realistic tables
      random sort attributes
      ascending / descending
      return all or top-N rows verbatim
    type: database
    size: xl
    position:
      x: 640
      'y': 400
  - id: confidence
    label: |-
      Overconfidence · 370 samples
      300 GPQA/HLE/SimpleQA paired trials
      normal + uncertainty-aware inference
      ~70 unanswerable long documents
    type: database
    size: xl
    position:
      x: 640
      'y': 600
  - id: positive
    label: |-
      Positive content · 200
      manually selected prompts from
      Arena Hard Auto 2.0
      GPT-5 creates mandatory requirements
      and verification rubrics
    type: database
    size: xl
    position:
      x: 640
      'y': 800
  - id: negative
    label: |-
      Negative content · 200
      the same Arena Hard Auto 2.0 prompts
      GPT-5 creates prohibited constraints
      and verification rubrics
    type: database
    size: xl
    position:
      x: 640
      'y': 1000
  - id: benchmark
    label: |-
      Assemble the paper benchmark
      Table 1 total: 2,470
      1,300 / 200 / 200 / 370 / 200 / 200
      six independent capability pools
    type: process
    size: xl
    position:
      x: 1000
      'y': 500
  - id: grading
    label: |-
      Select category-specific grading
      one binary result per sample
    type: decision
    size: xl
    position:
      x: 1300
      'y': 500
  - id: deterministic
    label: |-
      Programmatic grading
      format parser / regex
      structured output
      ordered values against ground truth
      ranking rows exactly after sorting
    type: process
    size: xl
    position:
      x: 1600
      'y': 100
  - id: abstention
    label: |-
      Overconfidence rule
      correct answer ↔ do not decline
      wrong answer ↔ explicitly decline
      insufficient document ↔ refusal only
    type: process
    size: xl
    position:
      x: 1600
      'y': 500
  - id: judge
    label: |-
      Content-requirement judge
      GPT-4.1 checks GPT-5 rubrics
      positive: every required element
      negative: every forbidden element
    type: process
    size: xl
    position:
      x: 1600
      'y': 900
  - id: score
    label: |-
      Report paper results
      accuracy for six categories
      overall = unweighted mean
      of the six accuracies
      compare 11 closed/open-weight
      models
    type: terminal
    size: xl
    position:
      x: 1950
      'y': 500
  - id: release_boundary
    label: |-
      Public harness @ dad399d
      QA: 12/source; 48 × 21 = 1,008
      main.py averages seven test-set scores
      content path invokes tested model
      not judge_model
    type: document
    size: xl
    position:
      x: 1950
      'y': 850
