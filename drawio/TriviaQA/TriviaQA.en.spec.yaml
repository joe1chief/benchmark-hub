meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TriviaQA Build Process
  description: >-
    Paper-aligned TriviaQA workflow: question-answer pairs from 14 trivia sites are paired retrospectively with Web and
    Wikipedia evidence, documents lacking an answer string are removed for distant supervision, human-verified subsets
    supplement 95,956 questions and 662,659 documents, and readers are scored with exact match and token F1.
  legend: >-
    Solid arrows show QA collection, Web/Wikipedia evidence branches, distant-supervision filtering, verification, and
    evaluation.
nodes:
  - id: trivia
    label: |-
      14 Trivia / Quiz-league Sites
      Collect QA Pairs
      Drop Questions <4 Tokens
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: qa_pool
    label: |-
      Trivia Question Pool
      Questions + Known Answers
    type: document
    size: large
    position:
      x: 300
      'y': 240
  - id: web_search
    label: |-
      Web Evidence
      Query Bing without Answer
      Top 50 URLs; Crawl Top 10
      Exclude Trivia / Bad Documents
    type: process
    size: xl
    position:
      x: 560
      'y': 60
  - id: wiki_search
    label: |-
      Wikipedia Evidence
      TAGME Links Question Entities
      Add Corresponding Pages
    type: process
    size: xl
    position:
      x: 560
      'y': 420
  - id: distant_filter
    label: |-
      Distant-supervision Filter
      Keep Documents Containing
      Correct Answer String
    type: process
    size: xl
    position:
      x: 840
      'y': 240
  - id: corpus
    label: |-
      TriviaQA Corpus
      95,956 QA Pairs
      662,659 Evidence Documents
      650K Web / 78K Wiki Examples
    type: database
    size: xl
    position:
      x: 1100
      'y': 240
  - id: split
    label: |-
      Random QA Split
      Train 80% / Dev 10% / Test 10%
      Web + Wikipedia Domains
    type: database
    size: xl
    position:
      x: 1360
      'y': 240
  - id: verify
    label: |-
      Human-verified Dev / Test
      Annotator Answers or Abstains
      Publish Clean Subsets
    type: user
    size: xl
    position:
      x: 1620
      'y': 240
  - id: reader
    label: |-
      Reading-comprehension Model
      Predict Answer from Evidence
    type: process
    size: large
    position:
      x: 1880
      'y': 240
  - id: metrics
    label: |-
      Exact Match + Token F1
      Accept Wikipedia Aliases
      Wiki: Question Level
      Web: Document Level
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 240
edges:
  - from: trivia
    to: qa_pool
    type: primary
  - from: qa_pool
    to: web_search
    type: primary
  - from: qa_pool
    to: wiki_search
    type: primary
  - from: web_search
    to: distant_filter
    type: primary
  - from: wiki_search
    to: distant_filter
    type: primary
  - from: distant_filter
    to: corpus
    type: primary
  - from: corpus
    to: split
    type: primary
  - from: split
    to: verify
    type: primary
  - from: verify
    to: reader
    type: primary
  - from: reader
    to: metrics
    type: primary
modules: []
