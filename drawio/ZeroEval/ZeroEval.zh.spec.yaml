meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ZeroEval 仓库执行与任务专属评分流程
  description: >-
    ZeroEval是评测框架而非固定数据集。在官方仓库提交8c1485edf12c6efb5f69135a562927c5ad484059中，zero_eval_local.sh与zero_eval_api.sh把仓库任务/模型配置接入统一推理、任务模板、分片、缓存/续跑、结果合并和任务专属评测器。本地vLLM/Hugging
    Face后端直接生成，仅已配置API提供商调用使用上限为10次的重试处理器。不同评分器分别处理MMLU-Redux、GSM8K/MATH、CRUX、ZebraLogic和G-PlanET。期望结果数是完整性门禁，不是构建总数；不存在可绘制的论文标注/QC流水线。
  legend: >-
    来源：No independent ZeroEval benchmark paper was found. Primary source is the official WildEval/ZeroEval repository
    pinned at commit 8c1485edf12c6efb5f69135a562927c5ad484059: README.md; CITATION.cff; zero_eval_local.sh;
    zero_eval_api.sh; src/unified_infer.py; src/unified_utils.py; src/task_configs.py; src/_TEMPLATES.py;
    src/templates/{MCQA,OEQA,ZEBRA_GRID}.py; src/merge_results.py; and
    src/evaluation/{eval_utils,mcqa_eval,math_eval,crux_eval,zebra_grid_eval,summarize}.py. CITATION.cff dates the
    software release to 2024-07-18. DeepSeek-V3 arXiv:2412.19437 Appendix/Table 19 is supporting evidence only: it
    borrows the Zero-Eval prompt format for MMLU-Redux rather than defining ZeroEval or running this repository end to
    end.。实线箭头表示论文或官方资料明确支持的主流程。
