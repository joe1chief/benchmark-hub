meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ResearchRubrics 构建与评测流程
  description: >-
    ResearchRubrics包含101个跨九领域的开放式单轮深度研究提示，以及2593条任务专属标准，每题通常20至43条。全部提示和标准均由人类编写且不使用LLM播种：第一位STEM专家起草，第二位迭代复核，第三位独立终审，总投入超过2800小时。标准覆盖六个维度，区分强制与可选要求，并采用带正负号的重要性权重。人工或模型评判器逐条判定标准符合度，三元协议允许部分得分，随后汇总加权标准符合率，并按领域、标准维度及任务复杂度报告。
  legend: >-
    来源：ResearchRubrics arXiv:2511.07685 Sections 3.1-3.4 and evaluation sections, cross-checked against
    scaleapi/researchrubrics。实线箭头表示论文或官方资料明确支持的主流程。
