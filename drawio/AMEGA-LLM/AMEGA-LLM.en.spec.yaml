meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMEGA-LLM Build Process
  description: >-
    Paper-aligned AMEGA benchmark construction and autonomous medical guideline-adherence evaluation workflow, based on
    npj Digital Medicine volume 7, article 358.
  legend: >-
    Solid arrows show case construction and model evaluation; dashed arrows mark reask, repeated judging, and human
    validation safeguards.
nodes:
  - id: guidelines
    label: |-
      Medical guideline base
      current clinical guidance
      physician expertise
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: cases
    label: |-
      Crafted clinical cases
      20 diagnostic scenarios
      13 specialties
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: questions
    label: |-
      Open-ended questions
      135 real clinical prompts
      diagnosis and treatment
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: criteria
    label: |-
      Weighted criteria
      1337 scoring elements
      guideline-derived checks
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: candidate
    label: |-
      Candidate model
      answers each case question
      may receive reask
    type: terminal
    size: xl
    position:
      x: 820
      'y': 70
  - id: evaluator
    label: |-
      GPT-4 evaluator
      parse answer and criteria
      extract clinical concepts
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: voting
    label: |-
      Repeated Boolean judging
      11 parallel attempts
      majority vote and confidence
    type: decision
    size: xl
    position:
      x: 1080
      'y': 160
  - id: scores
    label: |-
      Aggregated score report
      criterion to case score
      50-point case maximum
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: guidelines
    to: cases
    type: primary
  - from: cases
    to: questions
    type: primary
  - from: questions
    to: criteria
    type: primary
  - from: criteria
    to: candidate
    type: data
    label: case + question
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: voting
    type: primary
  - from: voting
    to: candidate
    type: optional
    label: reask if allowed
  - from: voting
    to: scores
    type: primary
  - from: scores
    to: evaluator
    type: optional
    label: expert spot checks
modules: []
