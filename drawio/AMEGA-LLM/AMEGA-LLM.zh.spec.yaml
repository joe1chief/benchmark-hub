meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AMEGA-LLM 构建流程
  description: 基于 npj Digital Medicine 7:358 重绘的 AMEGA 医学指南遵循评测构建与自动评分流程。
  legend: 实线表示病例构建和模型评测主流程；虚线表示 reask、重复评审与人工验证保护机制。
nodes:
  - id: guidelines
    label: |-
      医学指南基础
      当前临床指南
      医师专业经验
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: cases
    label: |-
      临床病例设计
      20 个诊断场景
      覆盖 13 个专科
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: questions
    label: |-
      开放式问题
      135 个临床交互问题
      诊断与治疗推理
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: criteria
    label: |-
      加权评分标准
      1337 个评分元素
      源自指南要求
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: candidate
    label: |-
      候选模型
      回答每个病例问题
      可触发 reask
    type: terminal
    size: xl
    position:
      x: 820
      'y': 70
  - id: evaluator
    label: |-
      GPT-4 评估器
      解析答案与标准
      抽取临床概念
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: voting
    label: |-
      重复布尔评审
      11 次并行评估
      多数投票与置信度
    type: decision
    size: xl
    position:
      x: 1080
      'y': 160
  - id: scores
    label: |-
      聚合得分报告
      标准到病例逐级汇总
      每病例最高 50 分
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: guidelines
    to: cases
    type: primary
  - from: cases
    to: questions
    type: primary
  - from: questions
    to: criteria
    type: primary
  - from: criteria
    to: candidate
    type: data
    label: 病例与问题
  - from: candidate
    to: evaluator
    type: primary
  - from: evaluator
    to: voting
    type: primary
  - from: voting
    to: candidate
    type: optional
    label: 允许时重新追问
  - from: voting
    to: scores
    type: primary
  - from: scores
    to: evaluator
    type: optional
    label: 专家抽查验证
modules: []
