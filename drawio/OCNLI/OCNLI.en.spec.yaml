meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCNLI Build and Evaluation Process
  description: >-
    Paper-v1 and fixed-release-aligned native-Chinese premise sourcing, four parallel elicitation strategies, five-label
    verification, controlled splits, no-majority handling, model and human evaluation, and count conflict.
  legend: >-
    Easy, medium, and hard denote the first, second, and third hypothesis written for a premise-label pair. They are
    elicitation-order labels, not independently assigned difficulty scores.
nodes:
  - id: source
    label: |-
      Collect Original Chinese Premises
      Government · News · Literature
      TV Talk Shows · Telephone Calls
      Written and Spoken Primary Sources
    type: database
    size: xl
    position:
      x: 20
      'y': 250
  - id: preprocess
    label: |-
      Preprocess Source Sentences
      Remove Chinese Callhome Annotation Marks
      Keep Sentences with 8–50 Characters
      Do Not Translate from English
    type: process
    size: xl
    position:
      x: 260
      'y': 250
  - id: writers
    label: |-
      Recruit 145 Hypothesis Writers
      Native Chinese Speakers
      Undergraduates and Graduates
      Chinese or Other Language Majors
    type: process
    size: xl
    position:
      x: 500
      'y': 250
  - id: protocol
    label: |-
      Adapt the MNLI Elicitation Protocol
      Entailment · Neutral · Contradiction
      Cap Hypothesis–Premise Overlap at 70%
      Limit Any One Writer's Contribution
    type: document
    size: xl
    position:
      x: 740
      'y': 250
  - id: strategy_gate
    label: |-
      Which Elicitation
      Condition?
    type: decision
    size: xl
    position:
      x: 980
      'y': 250
  - id: single
    label: |-
      SINGLE · MNLI-style
      One Hypothesis per NLI Label
      11,986 Reported Pairs
      No Easy/Medium/Hard Order
    type: process
    size: xl
    position:
      x: 1220
      'y': 0
  - id: multi
    label: |-
      MULTI
      Up to Three Hypotheses per Label
      First · Second · Third = Easy · Medium · Hard
      12,328 Reported Pairs
    type: process
    size: xl
    position:
      x: 1220
      'y': 160
  - id: encourage
    label: |-
      MULTI ENCOURAGE
      Bonus for Diverse Hypotheses
      Seek Contradictions without Negators
      16,584 Reported Pairs
    type: process
    size: xl
    position:
      x: 1220
      'y': 340
  - id: constraint
    label: |-
      MULTI CONSTRAINT
      At Most One of Three Contradictions Uses a Negator
      Random Checks · Lower Pay for Violations
      15,627 Reported Pairs
    type: process
    size: xl
    position:
      x: 1220
      'y': 500
  - id: corpus
    label: |-
      Form the Original OCNLI Corpus
      Paper Headline and Table Total: 56,486
      Four Displayed Subset Rows Sum to 56,525
      Preserve the 39-pair Paper Conflict
    type: database
    size: xl
    position:
      x: 1460
      'y': 250
  - id: verify
    label: |-
      Relabel a Subset of Each Condition
      SINGLE 1,919 · MULTI 1,994
      ENCOURAGE 3,000 · CONSTRAINT 3,000
      Four Independent Labels + Writer Label = Five
    type: process
    size: xl
    position:
      x: 1700
      'y': 250
  - id: agreement
    label: |-
      Check Verification Agreement
      At Least Three Votes Agree on 98.3–98.8%
      Compare Conditions and Elicitation Orders
      Retain All Five Labels as Evidence
    type: process
    size: xl
    position:
      x: 1940
      'y': 250
  - id: gold
    label: |-
      Assign the Reference Label
      Majority Vote across Five Labels
      Entailment · Neutral · Contradiction
      Mark No-majority Pairs as “-”
    type: process
    size: xl
    position:
      x: 2180
      'y': 250
  - id: split
    label: |-
      Create the Paper Main Split
      Randomize 6,000 Relabeled ENCOURAGE/CONSTRAINT Pairs
      Validation 3,000 + Test 3,000 · Balance Orders
      Send SINGLE/MULTI and Remaining Pairs to Training
    type: database
    size: xl
    position:
      x: 2420
      'y': 250
  - id: full_release
    label: |-
      Fixed Repository Release b53efde…
      Train 50,486 · Validation 3,000 · Test 3,000
      Test Inputs Public but Labels Withheld
      Train Has 49 “-” · Validation Has 50 “-”
    type: database
    size: xl
    position:
      x: 2660
      'y': 180
  - id: small_release
    label: |-
      Remove Premise Overlap with Validation/Test
      train.small Release: 30,286 Rows
      Repository Also Samples 10k and 3k Subsets
      Same Validation and Test Sets
    type: database
    size: xl
    position:
      x: 2660
      'y': 440
  - id: model_eval
    label: |-
      Predict One of Three NLI Labels
      CBOW · biLSTM · ESIM
      Chinese BERT-base · RoBERTa-large
      Evaluate Full 50k or Non-overlap 30k Training
    type: process
    size: xl
    position:
      x: 2900
      'y': 180
  - id: label_gate
    label: |-
      Reference Label
      Available and Not “-”?
    type: decision
    size: xl
    position:
      x: 3140
      'y': 180
  - id: exclude
    label: |-
      Do Not Score Locally
      Exclude “-” No-majority Items
      Hidden Test Labels Require CLUE Submission
    type: terminal
    size: xl
    position:
      x: 3140
      'y': 500
  - id: accuracy
    label: |-
      Compute Three-way Accuracy
      Exclude No-majority References
      Report Validation and Test Separately
      Paper Model Results Average Five Runs
    type: process
    size: xl
    position:
      x: 3380
      'y': 180
  - id: human
    label: |-
      Conservative Human Baseline
      20 Practice Items + 300 Random Test Items
      Five Uninvolved Undergraduates: 90.3%
      Five Linguistics PhDs: 89.3% · Undergrad Score Chosen
    type: process
    size: xl
    position:
      x: 3380
      'y': 0
  - id: report
    label: |-
      Report OCNLI Accuracy
      RoBERTa 78.2% versus Human 90.3%
      About a 12-point Human–Model Gap
      Compare Full and Non-overlap Training
    type: terminal
    size: xl
    position:
      x: 3620
      'y': 180
  - id: source_boundary
    label: |-
      Paper and Release Boundary
      arXiv v1 SHA-256 fa195f…
      Repository b53efde… · CC BY-NC 2.0
      News Premises Used with LCMC/ELRA Permission
      CLUE Leaderboard Handles Withheld Test Labels
    type: document
    size: xl
    position:
      x: 3620
      'y': 500
