meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ScreenSpot 构建与评测流程
  description: >-
    ScreenSpot是随SeeClick提出的原始GUI定位基准，不是ScreenSpot-Pro。4位有经验的计算机专业博士或硕士标注者分别负责移动端、桌面端或网页GUI，在日常使用中截取界面，对常用可点击区域标注边界框并编写英文指令。移动端和桌面端使用常见应用与操作，网页端从WebArena选择开发、购物、论坛和工具类网站；界面及元素为英文，并后处理移除个人信息。最终基准包含来自iOS、Android、macOS、Windows和网页的600多张截图、1200多条指令，并标注文本或图标/控件类型。模型接收截图和指令，坐标输出或边界框中心转换为预测点；预测点落入真值框即记为命中，按平台和元素类型报告点击准确率。
  legend: >-
    来源：SeeClick arXiv:2401.10935 Section 4 and Appendix B; official njucckevin/SeeClick
    repository。实线箭头表示论文或官方资料明确支持的主流程。
