meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: All-Angles 构建流程
  description: 基于 arXiv:2504.15280 重绘的 All-Angles 多视角场景基准构建与评估流程。
  legend: 实线表示场景选择、问题标注、配对问题构造和模型评测主流程；虚线表示人工质检反馈。
nodes:
  - id: scenes
    label: |-
      多视角数据来源
      Ego-Exo4D 与 EgoHumans
      90 个真实世界场景
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: tasks
    label: |-
      六类任务
      计数、属性、距离
      方向、操作、相机姿态
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: draft_questions
    label: |-
      MLLM 初始出题
      基于多视角视觉信息
      按任务模板生成问题
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: annotation
    label: |-
      人工标注
      8 名标注员检查图像
      删除无效或歧义项
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: answer_check
    label: |-
      答案与选项审查
      修正错误选项
      每题一个正确答案
    type: decision
    size: xl
    position:
      x: 820
      'y': 70
  - id: paired
    label: |-
      配对问题生成
      改写或调整视角顺序
      保持视觉对应关系
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: dataset
    label: |-
      All-Angles Bench
      2,132 个问答对
      85.3% 有配对问题
    type: document
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      多视角评测
      27 个 MLLM
      250 题人类子集
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: scenes
    to: tasks
    type: primary
  - from: tasks
    to: draft_questions
    type: primary
  - from: draft_questions
    to: annotation
    type: primary
  - from: annotation
    to: answer_check
    type: primary
  - from: answer_check
    to: paired
    type: primary
  - from: paired
    to: dataset
    type: primary
  - from: dataset
    to: evaluation
    type: primary
  - from: answer_check
    to: annotation
    type: optional
    label: 质检回路
modules: []
