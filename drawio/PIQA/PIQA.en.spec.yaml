meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PIQA Build Process
  description: >-
    Paper-aligned PIQA workflow: qualified annotators use six Instructables categories to write physical goals, valid
    solutions, and subtly invalid tricks; independent validation removes low-agreement items, AFLite reduces annotation
    artifacts, and 21,035 two-choice examples are scored by accuracy.
  legend: Solid arrows show prompt seeding, human creation and validation, AFLite debiasing, dataset assembly, and evaluation.
nodes:
  - id: sources
    label: |-
      Instructables Seeds
      Costume / Outside / Craft
      Home / Food / Workshop
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: qualification
    label: |-
      Annotator Qualification
      Identify Well-formed Pairs
      Required Score >80%
    type: user
    size: xl
    position:
      x: 300
      'y': 200
  - id: goal
    label: |-
      Write Two Examples per Seed
      Physical Goal + Valid Solution
      State Preconditions / Success
    type: document
    size: xl
    position:
      x: 560
      'y': 200
  - id: trick
    label: |-
      Create Invalid Trick
      Syntactically + Topically Similar
      Subtle Physical Error
    type: process
    size: xl
    position:
      x: 820
      'y': 200
  - id: validation
    label: |-
      Independent Validation
      Remove Low-agreement Examples
      De-qualify Low-agreement Workers
    type: user
    size: xl
    position:
      x: 1080
      'y': 200
  - id: aflite
    label: |-
      AFLite Artifact Reduction
      Fine-tune BERT-Large on 5K
      Linear-classifier Ensemble
      Drop Label-predictive Items
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: dataset
    label: |-
      PIQA: 21,035 Pairs
      >16K Train / ~2K Dev / ~3K Test
      English
    type: database
    size: xl
    position:
      x: 1600
      'y': 200
  - id: task
    label: |-
      Two-choice Physical QA
      Goal + Valid / Invalid Solutions
      Choose One Correct Answer
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: score
    label: |-
      Accuracy
      Human Baseline by Majority Vote
      Model vs Human Analysis
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 200
edges:
  - from: sources
    to: qualification
