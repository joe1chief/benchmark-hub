meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MTVQA Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs MTVQA from arXiv:2405.11985v5 and pinned official code/data, including the three-source image mix,
    multilingual OCR and regulatory filtering, native maker-checker annotation, ten-percent audit loop, exact release
    schema and splits, the paper prompt, and the released evaluator's true substring metric and failure boundaries.
  legend: >-
    Solid arrows trace construction and scoring. Labeled branches preserve source selection, rejection, correction,
    re-annotation, input failure, and score outcomes. The dashed branch is the separate human baseline.
