meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LifelongAgentBench Build Process
  description: >-
    Paper- and artifact-aligned construction of 1,396 skill-grounded tasks across database, operating-system, and
    knowledge-graph environments, followed by strict-order lifelong-agent evaluation.
  legend: >-
    The upper module is dataset construction; reject nodes are construction-time exclusions. The lower module is
    evaluation: only correct completed trajectories enter replay memory, and group self-consistency is an optional
    inference strategy rather than a metric.
nodes:
  - id: sources
    label: |-
      Fix Official Sources
      Paper v3 · 2025-05-30
      Code d6f19b42 · Data 75054b60
    type: document
    module: construction
    size: xl
    position:
      x: 32
      'y': 400
  - id: skills
    label: |-
      Define Atomic Skills
      DB 22 · OS 29 · KG 7
      Analysis Relation · Not a Gate
      as⁽ᵐ,ⁿ⁾[E⁽ⁱ⁾] = 2aₘaₙ
      ÷ (aₘ + aₙ)
      aₖ = as⁽ᵏ⁾[E⁽ⁱ⁾]
    type: process
    module: construction
    size: xl
    position:
      x: 304
      'y': 400
  - id: db_sample
    label: |-
      Sample SQL Skills
      Favor Infrequent Skills
      Weight ∝ 1 / (Count + 1)
      Target One-table Tasks
    type: process
    module: construction
    size: xl
    position:
      x: 576
      'y': 80
  - id: db_generate
    label: |-
      Generate Database Candidates
      DeepSeek-R1 / deepseek-reasoner
      SQL · Schema · Instruction · Rows
      Judge Instruction Consistency
    type: process
    module: construction
    size: xl
    position:
      x: 848
      'y': 80
  - id: db_gate
    label: |-
      Database Candidate Valid?
      SQL Parses and Uses Target Skills
      Query Executes Consistently
      Result or State Hash Is Defined
    type: decision
    module: construction
    size: xl
    position:
      x: 1120
      'y': 80
  - id: db_reject
    label: |-
      Reject DB Candidate
      Invalid or Inconsistent
    type: terminal
    module: construction
    size: large
    position:
      x: 1120
      'y': 208
  - id: db_release
    label: |-
      Select 500 DB Tasks
      From 1,306 Candidates
      Stratified Skill Coverage
      At Least 20 Uses per Skill
    type: database
    module: construction
    size: xl
    position:
      x: 1392
      'y': 80
  - id: os_sample
    label: |-
      Sample OS Target Skill
      29 Allowed Bash Commands
      Paper Target: 9–12 Commands
      Generator Does Not Enforce Count
    type: process
    module: construction
    size: xl
    position:
      x: 576
      'y': 400
  - id: os_generate
    label: |-
      Generate OS Candidate
      DeepSeek-R1 / deepseek-reasoner
      Instruction · Init · Ground Truth
      Task-specific Evaluator · Polish
    type: process
    module: construction
    size: xl
    position:
      x: 848
      'y': 400
  - id: os_gate
    label: |-
      OS Candidate Valid?
      Evaluator Is Nonzero before Solution
      Evaluator Is 0 after Ground Truth
      Target Skill Present · Timeout Passes
    type: decision
    module: construction
    size: xl
    position:
      x: 1120
      'y': 400
  - id: os_reject
    label: |-
      Reject OS Candidate
      Failed Script Gate
    type: terminal
    module: construction
    size: large
    position:
      x: 1120
      'y': 528
  - id: os_release
    label: |-
      Fixed HF Release: 500 OS Tasks
      Observed Command Count: 4–26
      339 within 9–12 · 161 outside
      Paper Target Is Not a Hard Filter
    type: database
    module: construction
    size: xl
    position:
      x: 1392
      'y': 400
  - id: kg_source
    label: |-
      Start from GrailQA
      S-expressions · Entities · Answers
      Not LLM-generated Task Plans
      Preserve Question Functions
    type: database
    module: construction
    size: xl
    position:
      x: 576
      'y': 720
  - id: kg_convert
    label: |-
      Convert to Constrained Actions
      Relations · Neighbors · Intersection
      Attributes · Argmax · Argmin · Count
      Execute through SPARQL
    type: process
    module: construction
    size: xl
    position:
      x: 848
      'y': 720
  - id: kg_gate
    label: |-
      KG Candidate Valid?
      Conversion Has No Action Error
      S-expression Executes Correctly
      Entity Names Pass Release Filter
    type: decision
    module: construction
    size: xl
    position:
      x: 1120
      'y': 720
  - id: kg_reject
    label: |-
      Reject KG Candidate
      Conversion or Execution Error
    type: terminal
    module: construction
    size: large
    position:
      x: 1120
      'y': 848
  - id: kg_release
    label: |-
      Select 396 KG Tasks
      Length 2–8: 50 Each
      Length 9: 46
      Extra Review for Length 7–9
    type: database
    module: construction
    size: xl
    position:
      x: 1392
      'y': 720
  - id: manual_review
    label: |-
      Review Each Environment
      Randomly Inspect 10% of Tasks
      Syntax · Logic · Practical Relevance
      Apply Pilot-test Configuration
    type: user
    module: construction
    size: xl
    position:
      x: 1664
      'y': 400
  - id: dataset_release
    label: |-
      Release 1,396 Tasks
      DB 500 · OS 500 · KG 396
      Three Public Parquet Files
      HF Viewer: default / train
    type: database
    module: construction
    size: xl
    position:
      x: 1936
      'y': 400
  - id: framework
    label: |-
      Configure Six Components
      Model Pool · Agent · Environment
      History Factory · Controller · Callbacks
      Local or Transparent-RPC Deployment
    type: process
    module: evaluation
    size: xl
    position:
      x: 32
      'y': 1360
  - id: sequence
    label: |-
      Execute Tasks in Fixed Order
      Controller Restores Checkpoints
      Never Parallelize Task Sequence
      Accumulate Experience over Time
    type: process
    module: evaluation
    size: xl
    position:
      x: 304
      'y': 1360
  - id: db_eval
    label: |-
      Database Runtime + Score
      One MySQL Container per Run · Create / Drop DB
      Action: Operation / Answer · Max 3 Rounds
      SELECT Result · Writes State MD5
    type: process
    module: evaluation
    size: xl
    position:
      x: 1392
      'y': 1120
  - id: os_eval
    label: |-
      OS Runtime + Score
      Fresh Ubuntu Container per Task
      Act: bash / Act: finish · Max 5 Rounds
      Evaluator Exit 0 Means Success
    type: process
    module: evaluation
    size: xl
    position:
      x: 1392
      'y': 1360
  - id: kg_eval
    label: |-
      KG Runtime + Score
      Seven Action APIs · Max 15 Rounds
      Final Answer: Variable #n
      Exact Match · F1 · Executable Rate
    type: process
    module: evaluation
    size: xl
    position:
      x: 1392
      'y': 1600
  - id: success_gate
    label: |-
      Correct and Completed?
      Binary Task Reward
    type: decision
    module: evaluation
    size: large
    position:
      x: 1664
      'y': 1360
  - id: replay_memory
    label: |-
      Store Successful Trajectory
      Recent FIFO Experience Memory
      Failed Tasks Are Not Stored
    type: database
    module: evaluation
    size: xl
    position:
      x: 1936
      'y': 1240
  - id: replay
    label: |-
      Compare Experience Replay
      Baseline N = 0
      Tested N: 1 · 2 · 4 · 8 · 16 · 32 · 64
      Inject Recent Successful Trajectories
    type: process
    module: evaluation
    size: xl
    position:
      x: 576
      'y': 1360
  - id: gsc
    label: |-
      Optional GSC after Inference
      Public Callback: DB + OS Only
      Original + Grouped Candidates
      Majority Vote May Replace Action
    type: process
    module: evaluation
    size: xl
    position:
      x: 1120
      'y': 1240
  - id: agent_infer
    label: |-
      Generate Original Agent Response
      Fixed Prompt + Current Observation
      Environment-specific Parser Format
      Callback Receives This Response
    type: process
    module: evaluation
    size: xl
    position:
      x: 848
      'y': 1360
  - id: report
    label: |-
      Report Task Success Rate
      Break Down DB · OS · KG
      Skill · Difficulty · Replay Depth
      Groups · Input Tokens · OOM
    type: terminal
    module: evaluation
    size: xl
    position:
      x: 2208
      'y': 1360
edges:
  - from: sources
    to: skills
    type: primary
  - from: skills
    to: db_sample
    type: primary
    label: DB taxonomy
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: skills
    to: os_sample
    type: primary
    label: OS taxonomy
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: skills
    to: kg_source
    type: primary
    label: KG actions
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: db_sample
    to: db_generate
    type: primary
  - from: db_generate
    to: db_gate
    type: primary
  - from: db_gate
    to: db_release
    type: primary
    label: Pass
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: db_gate
    to: db_reject
    type: optional
    label: Reject
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: os_sample
    to: os_generate
    type: primary
  - from: os_generate
    to: os_gate
    type: primary
  - from: os_gate
    to: os_release
    type: primary
    label: Pass
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: os_gate
    to: os_reject
    type: optional
    label: Reject
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: kg_source
    to: kg_convert
    type: primary
  - from: kg_convert
    to: kg_gate
    type: primary
  - from: kg_gate
    to: kg_release
    type: primary
    label: Pass
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: kg_gate
    to: kg_reject
    type: optional
    label: Reject
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: db_release
    to: manual_review
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: os_release
    to: manual_review
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: kg_release
    to: manual_review
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: manual_review
    to: dataset_release
    type: primary
  - from: dataset_release
    to: framework
    type: primary
    label: Evaluate
    waypoints:
      - x: 2064
        'y': 1000
      - x: 144
        'y': 1000
      - x: 144
        'y': 1360
  - from: framework
    to: sequence
    type: primary
  - from: sequence
    to: replay
    type: primary
  - from: replay
    to: agent_infer
    type: primary
    label: Original inference
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: agent_infer
    to: gsc
    type: optional
    label: DB / OS only
    style:
      exitX: 0.5
      exitY: 0
      entryX: 0
      entryY: 0.5
  - from: agent_infer
    to: db_eval
    type: primary
    label: DB · no grouping
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: agent_infer
    to: os_eval
    type: primary
    label: OS · no grouping
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: agent_infer
    to: kg_eval
    type: primary
    label: KG · no public GSC
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: gsc
    to: db_eval
    type: primary
    label: Voted DB action
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.25
  - from: gsc
    to: os_eval
    type: primary
    label: Voted OS action
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.25
  - from: db_eval
    to: success_gate
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: os_eval
    to: success_gate
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: kg_eval
    to: success_gate
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
  - from: success_gate
    to: replay_memory
    type: primary
    label: 'Yes'
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: success_gate
    to: report
    type: optional
    label: No · no store
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.75
  - from: replay_memory
    to: report
    type: primary
    label: Logged
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: replay_memory
    to: replay
    type: data
    label: Available to later tasks
    waypoints:
      - x: 2064
        'y': 1040
      - x: 688
        'y': 1040
      - x: 688
        'y': 1360
modules:
  - id: construction
    label: Build
    color: $primaryLight
  - id: evaluation
    label: Evaluate
    color: $secondaryLight
