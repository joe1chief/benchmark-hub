meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LingoQA 构建流程
  description: 按 arXiv v4 与 ECCV 正式论文展示动作/场景训练分支、留出人工评测集、独立 Lingo-Judge 训练， 以及固定官方实现中的精确评分合同。
  legend: 实线表示论文支持的数据集或 Judge 构建，虚线表示下游候选模型评测，菱形端连接表示已发布 Judge 依赖。 漂移卡保留论文正文、表 3、README 与当前公开 parquet 之间尚未解释的数量差异，不静默择一。
nodes:
  - id: sessions
    label: |-
      录制驾驶行程
      单前视 RGB 相机
      基准输入不含激光雷达
    type: database
    size: xl
    position:
      x: 128
      'y': 248
  - id: clips
    label: |-
      4 秒场景 · 1 Hz
      跨 4 秒共 5 帧
      人脸与车牌已匿名化
    type: process
    size: xl
    position:
      x: 400
      'y': 248
  - id: train_branch
    label: 训练集构建分支？
    type: decision
    size: xl
    position:
      x: 800
      'y': 248
  - id: action_seed
    label: |-
      动作分支 · 显著行为变化
      减速 · 加速 · 变道 · 转弯
      操作员标注情境与行为
      信号灯 · 检测 · 天气
      速度 · 方向盘 · 道路类型
    type: user
    size: xl
    position:
      x: 944
      'y': 88
    style:
      fontSize: 9
  - id: action_gpt
    label: |-
      动作/理由模板
      示例问题 + 答案提示
      GPT-3.5 改写 · 作答 · 扩展
    type: process
    size: xl
    position:
      x: 1216
      'y': 88
  - id: action_balance
    label: |-
      按动作与行为策略类别重平衡
      每类最多采样 500 个事件
      论文正文称 24,577 个动作片段
    type: process
    size: xl
    position:
      x: 1488
      'y': 88
  - id: scenery_seed
    label: |-
      场景分支 · 3 段各 30 分钟
      ELAN 每秒密集描述
      约 15 类描述
    type: user
    size: xl
    position:
      x: 944
      'y': 408
  - id: scenery_gpt
    label: |-
      GPT-4 思维链提示
      生成感知问题与答案
      每场景约 43 条问答
    type: process
    size: xl
    position:
      x: 1216
      'y': 408
  - id: paper_total
    label: |-
      论文总体数据标题数
      范围尚无法对齐
      2.8 万场景 · 41.99 万问答
      动作 + 场景 · 9 项能力
      自由回答平均 17.2 词
    type: database
    size: xl
    position:
      x: 1760
      'y': 248
    style:
      fontSize: 9
  - id: count_drift
    label: |-
      规模漂移 · 论文与发布工件
      正文动作 167,774 · 表 3 267.8K
      表 3 场景 152.5K · 合计 420.3K
      README 对调分支数量与比例
      parquet 413,829 问答 · 27,999 片段
    type: document
    size: xl
    position:
      x: 2032
      'y': 88
    style:
      fontSize: 9
  - id: missing_contracts
    label: |-
      论文披露缺口与文字冲突
      动作段：改写 · 作答 · 扩展
      后文却称 GPT-3.5 仅改写
      生成提示词与参数未公开
      训练生成物 QC / 拒绝率未披露
    type: document
    size: xl
    position:
      x: 2032
      'y': 408
    style:
      fontSize: 9
  - id: heldout
    label: |-
      留出评测数据
      100 个短视频场景
      每场景 5 道独立问题
    type: database
    size: xl
    position:
      x: 400
      'y': 720
  - id: human_qa
    label: |-
      20+ 名内部人工评估员
      编写问题与答案
      共 500 道独立人工问题
    type: user
    size: xl
    position:
      x: 672
      'y': 720
  - id: double_label
    label: |-
      初始答案双标
      同一评估员不重复看到同题
    type: user
    size: xl
    position:
      x: 944
      'y': 720
  - id: qc_gate
    label: 存在语义分歧或错误？
    type: decision
    size: xl
    position:
      x: 1216
      'y': 720
  - id: relabel
    label: 争议样本再标注两次
    type: user
    size: xl
    position:
      x: 1216
      'y': 872
  - id: majority
    label: |-
      按多数语义裁决
      最大限度保留措辞多样性
    type: process
    size: xl
    position:
      x: 1760
      'y': 872
  - id: eval_release
    label: |-
      评测集发布
      500 题 · 1,000 条参考答案
      每题 2 个正确且多样的答案
    type: database
    size: xl
    position:
      x: 1488
      'y': 720
  - id: model_input
    label: |-
      候选模型
      5 帧 + 问题
      生成自由文本答案
    type: process
    size: xl
    position:
      x: 2032
      'y': 1088
  - id: predictions_csv
    label: |-
      predictions.csv · 500 个答案
      question_id · segment_id
      answer
    type: document
    size: xl
    position:
      x: 1760
      'y': 1088
  - id: judge_prompt
    label: |-
      官方 Judge 预处理
      参考答案/预测：小写并去首尾空白
      问题保持原样
      [CLS] · Question · Answer
      Student · max_length=128
    type: process
    size: xl
    position:
      x: 1488
      'y': 1088
    style:
      fontSize: 9
  - id: judge_logits
    label: |-
      已发布 Lingo-Judge
      DeBERTa-V3 文本分类器
      每个参考答案输出一个原始 logit
      不输入视频
    type: process
    size: xl
    position:
      x: 1216
      'y': 1088
  - id: max_logit
    label: |-
      每题两个参考答案
      论文公式漏 q · 实现包含 q
      zᵢ = maxⱼ f(qᵢ, rᵢⱼ, aᵢ)
      正确当且仅当 zᵢ > 0
    type: formula
    size: xl
    position:
      x: 944
      'y': 1088
  - id: accuracy
    label: |-
      LingoQA 准确率（%）
      100 / 500 × Σᵢ 1[zᵢ > 0]
    type: formula
    size: xl
    position:
      x: 672
      'y': 1088
  - id: report
    label: |-
      LingoQA 准确率报告
      完整提交 N = 500
      官方代码仅警告匹配数不足
    type: terminal
    size: xl
    position:
      x: 400
      'y': 1088
  - id: judge_data
    label: |-
      Judge 训练数据
      早期模型预测
      评测问题 + 参考答案
      人工正确性标签
    type: database
    size: xl
    position:
      x: 672
      'y': 1376
  - id: judge_lora
    label: |-
      DeBERTa-V3 + LoRA
      类别标记上的线性头
      训练规模/划分/LoRA 参数未披露
    type: process
    size: xl
    position:
      x: 944
      'y': 1376
  - id: judge_release
    label: |-
      主动学习修正
      重标废弃模型的错判
      已发布 Judge 版本
      a1a6e2194fd1aedaba02
      bde82316a6b73753d1d5
    type: process
    size: xl
    position:
      x: 1216
      'y': 1376
    style:
      fontSize: 9
  - id: judge_evidence
    label: |-
      Judge 验证证据
      留出准确率 95.0%
      17 个系统 · 15 个模型 + 2 组人工
      Spearman .950 · Pearson .993
    type: document
    size: xl
    position:
      x: 1488
      'y': 1376
    style:
      fontSize: 9
  - id: release_boundary
    label: |-
      发布与开放边界
      部分公开 · Drive 数据 + HF Judge
      自定义非商业 · 可撤销许可证
      无候选 VLM 提示词/解析器/代码
      无官方实时排行榜
    type: document
    size: xl
    position:
      x: 1760
      'y': 1376
    style:
      fontSize: 9
edges:
  - from: sessions
    to: clips
    type: primary
  - from: clips
    to: train_branch
    type: primary
  - from: clips
    to: heldout
    type: primary
  - from: train_branch
    to: action_seed
    type: primary
    waypoints:
      - x: 800
        'y': 88
  - from: train_branch
    to: scenery_seed
    type: primary
    waypoints:
      - x: 800
        'y': 408
  - from: action_seed
    to: action_gpt
    type: primary
  - from: action_gpt
    to: action_balance
    type: primary
  - from: action_balance
    to: paper_total
    type: primary
    waypoints:
      - x: 1760
        'y': 88
  - from: scenery_seed
    to: scenery_gpt
    type: primary
  - from: scenery_gpt
    to: paper_total
    type: primary
    waypoints:
      - x: 1760
        'y': 408
  - from: heldout
    to: human_qa
    type: primary
  - from: human_qa
    to: double_label
    type: primary
  - from: double_label
    to: qc_gate
    type: primary
  - from: qc_gate
    to: eval_release
    type: primary
    label: 无问题
  - from: qc_gate
    to: relabel
    type: primary
    label: 分歧 / 错误
  - from: relabel
    to: majority
    type: primary
  - from: majority
    to: eval_release
    type: primary
    waypoints:
      - x: 1760
        'y': 720
  - from: eval_release
    to: judge_prompt
    type: data
  - from: eval_release
    to: model_input
    type: data
    waypoints:
      - x: 1488
        'y': 560
      - x: 2032
        'y': 560
      - x: 2032
        'y': 920
  - from: model_input
    to: predictions_csv
    type: data
  - from: predictions_csv
    to: judge_prompt
    type: data
  - from: judge_prompt
    to: judge_logits
    type: data
  - from: judge_logits
    to: max_logit
    type: data
  - from: max_logit
    to: accuracy
    type: data
  - from: accuracy
    to: report
    type: data
  - from: judge_data
    to: judge_lora
    type: primary
  - from: judge_lora
    to: judge_release
    type: primary
  - from: judge_release
    to: judge_logits
    type: dependency
modules: []
