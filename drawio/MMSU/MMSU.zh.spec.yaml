meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMSU 证据对齐的构建与评测流程
  description: 按论文 v3 重建四阶段基准构建、已披露的双人复核与修订循环、5,000 条公开数据，并单独呈现具备版本边界的官方推理、解析、失败和准确率代码。
  legend: 实线表示构建与评测流程；判定分支标注明确结果；中间未连线卡片仅记录发布、可复现性及论文到代码的边界，不暗示论文未披露的步骤。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      论文 · arXiv 2506.04779v3
      官方仓库 · 217d1d3f
      HF 数据集 · 548e2283
      审计精确版本
    type: document
    size: xl
    position:
      x: 80
      'y': 192
  - id: framework
    label: |-
      阶段 1 · 语言学框架
      咨询语言学专家
      六个具名子领域
      定义 47 项语音任务
    type: user
    size: xl
    position:
      x: 352
      'y': 192
  - id: questions
    label: |-
      阶段 2 · 整理选择题
      权威语言学教材
      使用在线来源补充
      保持语言现象覆盖
    type: database
    size: xl
    position:
      x: 624
      'y': 192
  - id: options
    label: |-
      专家参与的选项扩充
      专业知识指导提示词
      GPT-4o 生成候选选项
      后续再由人工审核
    type: process
    size: xl
    position:
      x: 896
      'y': 192
  - id: source_route
    label: |-
      阶段 3 · 匹配音频来源
      优先真实录音
      补齐音系 / 语义缺口
      保留来源类型统计
    type: process
    size: xl
    position:
      x: 1168
      'y': 192
  - id: open_audio
    label: |-
      开源音频
      3,837 条 · 76.74%
      附录 B 列出的来源数据集
      构成基准音频主体
    type: database
    size: xl
    position:
      x: 1440
      'y': 32
  - id: custom_audio
    label: |-
      定制录音
      672 条 · 13.44%
      专业演员补音系缺口
      另含 15 名多样真实说话人
    type: user
    size: xl
    position:
      x: 1440
      'y': 192
  - id: synthetic
    label: |-
      合成音频补充
      491 条 · 9.82%
      Azure 多音色 TTS
      选择 20 种声音
    type: process
    size: xl
    position:
      x: 1440
      'y': 352
  - id: merge_audio
    label: |-
      对齐音频 + 文本 + 选择题
      保留任务 / 来源上下文
    type: process
    size: s
    position:
      x: 1744
      'y': 224
  - id: pair_review
    label: |-
      阶段 4 · 双人人工复核
      五组 · 每组两名标注员
      每组负责 1,000 条
      独立检查四项标准
    type: user
    size: xl
    position:
      x: 1984
      'y': 192
  - id: pair_gate
    label: 两名标注员都通过该条目？
    type: decision
    size: xl
    position:
      x: 2256
      'y': 192
  - id: revise
    label: |-
      处理被标记条目
      过滤低质量 / 歧义样本
      或重录 / 重写 / 修改选项
      仅保留的修订样本回流
    type: process
    size: xl
    position:
      x: 2256
      'y': 448
  - id: cross_review
    label: |-
      跨组复核轮次
      首轮覆盖全部 5,000 条
      全量打乱数据
      每 1,000 条改交另一组
    type: process
    size: xl
    position:
      x: 2528
      'y': 192
  - id: objection_gate
    label: 本轮复核后仍有异议？
    type: decision
    size: xl
    position:
      x: 2800
      'y': 192
  - id: revise_round
    label: |-
      修订并重新复核
      重复打乱后的交叉审核
      论文报告共 2–3 轮
    type: process
    size: xl
    position:
      x: 2800
      'y': 448
  - id: expert_final
    label: |-
      专家 + 团队最终复核
      三名语言学专家
      检查语言学现象对齐
      最多做 20 处轻微调整
    type: user
    size: xl
    position:
      x: 3072
      'y': 192
  - id: dataset
    label: |-
      汇总 MMSU v3
      5,000 道选择题 · 47 项任务
      感知 2,580 · 推理 2,420
      平均音频时长 · 7.01 秒
    type: database
    size: xl
    position:
      x: 3344
      'y': 192
  - id: release_boundary
    label: |-
      公开发布边界
      HF 548e2283 · 公开 / 无门槛
      单一 train 划分 · 5,000 行
      13 个字段 · 数据卡 MIT
    type: document
    size: xl
    position:
      x: 80
      'y': 640
  - id: construction_gaps
    label: |-
      未披露的构建细节
      来源数据版本 / 抽样方法
      GPT-4o 快照 / 解码设置
      候选与淘汰数量
      逐条来源 / 权利映射
    type: document
    size: xl
    position:
      x: 352
      'y': 640
  - id: evaluator_boundary
    label: |-
      论文到代码的边界
      论文未规定回答解析器
      当前代码于 2026 年 2 月加入
      数据下载未锁定 revision
      模型接入 / 解码由用户实现
    type: document
    size: xl
    position:
      x: 624
      'y': 640
  - id: paper_eval
    label: |-
      论文 v3 评测
      22 个模型 · 12 SpeechLLM + 10 OmniLLM
      随机且平衡 A–D 答案位置
      所有模型使用同一优化提示词
    type: process
    size: xl
    position:
      x: 3344
      'y': 896
  - id: repo_infer
    label: |-
      当前官方推理脚手架
      固定“只回答 A、B、C 或 D”
      模型实现由用户提供
      回答与数据字段写入 JSONL
    type: process
    size: xl
    position:
      x: 3072
      'y': 896
  - id: load_jsonl
    label: |-
      读取提交的 JSONL 行
      JSON 解析失败行被跳过
      不检查 5,000 个 ID 是否齐全
      不按 ID 关联重复 / 未知行
    type: process
    size: xl
    position:
      x: 2800
      'y': 896
  - id: first_gate
    label: 首字符是大写 A–D？
    type: decision
    size: xl
    position:
      x: 2528
      'y': 896
  - id: second_gate
    label: 长度 > 1 且倒数第二字符是 A–D？
    type: decision
    size: xl
    position:
      x: 2256
      'y': 1088
  - id: compare_gate
    label: |-
      所选选项文本与 answer_gt 比较
      完全匹配 → 单条贡献 1
      不匹配 → 单条贡献 0
    type: process
    size: xl
    position:
      x: 1984
      'y': 768
  - id: invalid_gate
    label: 回答为空或字面值“None”？
    type: decision
    size: xl
    position:
      x: 1984
      'y': 1088
  - id: skipped
    label: |-
      整行跳过
      非空但格式错误
      回答规范化异常
      不进入准确率分母
    type: terminal
    size: xl
    position:
      x: 1712
      'y': 1248
  - id: metrics
    label: |-
      计算微平均准确率
      按 category + sub-category
      类别均值与总体准确率
      分母取决于实际接纳的行
    type: process
    size: xl
    position:
      x: 1440
      'y': 896
  - id: report
    label: |-
      报告 MMSU 准确率
      感知 / 推理分项
      语义 · 音系 · 副语言学
      论文人类基线 · 1,000 条
    type: terminal
    size: xl
    position:
      x: 1168
      'y': 896
edges:
  - from: evidence
    to: framework
    type: primary
  - from: framework
    to: questions
    type: primary
  - from: questions
    to: options
    type: primary
  - from: options
    to: source_route
    type: primary
  - from: source_route
    to: open_audio
    type: primary
    label: 开源 · 76.74%
    labelPosition: end
  - from: source_route
    to: custom_audio
    type: primary
    label: 定制 · 13.44%
    labelPosition: end
  - from: source_route
    to: synthetic
    type: primary
    label: 合成 · 9.82%
    labelPosition: end
  - from: open_audio
    to: merge_audio
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.2
  - from: custom_audio
    to: merge_audio
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5
  - from: synthetic
    to: merge_audio
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.8
  - from: merge_audio
    to: pair_review
    type: primary
  - from: pair_review
    to: pair_gate
    type: primary
  - from: pair_gate
    to: cross_review
    type: primary
    label: 两人都通过
    labelPosition: end
  - from: pair_gate
    to: revise
    type: primary
    label: 任一人标记
    labelPosition: end
  - from: revise
    to: pair_review
    type: secondary
    label: 保留的修订样本
    labelPosition: start
  - from: cross_review
    to: objection_gate
    type: primary
  - from: objection_gate
    to: expert_final
    type: primary
    label: 无异议
    labelPosition: end
  - from: objection_gate
    to: revise_round
    type: primary
    label: 仍有异议
    labelPosition: end
  - from: revise_round
    to: cross_review
    type: secondary
  - from: expert_final
    to: dataset
    type: primary
  - from: dataset
    to: paper_eval
    type: primary
  - from: paper_eval
    to: repo_infer
    type: primary
  - from: repo_infer
    to: load_jsonl
    type: primary
  - from: load_jsonl
    to: first_gate
    type: primary
  - from: first_gate
    to: compare_gate
    type: primary
    label: 是 · 首字符
    labelPosition: start
  - from: first_gate
    to: second_gate
    type: primary
    label: 否
    labelPosition: end
  - from: second_gate
    to: compare_gate
    type: primary
    label: 是 · 倒数第二字符
    labelPosition: start
  - from: second_gate
    to: invalid_gate
    type: primary
    label: 否
    labelPosition: end
  - from: compare_gate
    to: metrics
    type: primary
  - from: invalid_gate
    to: metrics
    type: primary
    label: 空值 / “None”
    labelPosition: start
    style:
      exitX: 0
      exitY: 0.25
      entryX: 1
      entryY: 0.75
  - from: invalid_gate
    to: skipped
    type: primary
    label: 其他错误格式
    labelPosition: start
  - from: metrics
    to: report
    type: primary
modules: []
