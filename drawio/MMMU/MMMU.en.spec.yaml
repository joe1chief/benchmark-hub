      Paper · 2311.16502v4
      Code · f3e473e1
      Data · ff942ca8
      Apache-2.0
    type: document
    size: xl
    position:
      x: 160
      'y': 40
  - id: scope
    label: |-
      Define Expert Scope
      Six Disciplines
      30 Subjects
      More Than 183 Subfields
      Visual Input Must Matter
    type: process
    size: xl
    position:
      x: 392
      'y': 40
  - id: recruit
    label: |-
      Recruit 50+ Students
      Matching University Majors
      Include Coauthors
      Manual Collection
      English · College Level
    type: user
    size: xl
    position:
      x: 624
      'y': 40
  - id: collect
    label: |-
      Collect or Author Questions
      Free Web · Quizzes
      Textbooks · Lectures
      Diverse Sources
      Avoid Easy-to-find Answers
    type: process
    size: xl
    position:
      x: 856
      'y': 40
  - id: raw
    label: |-
      Build Raw Pool
      About 13K Questions
      One or More Images
      MC or Short Open Answer
      Respect Source Rights
    type: database
    size: xl
    position:
      x: 1088
      'y': 40
  - id: dedup
    label: |-
      Detect Duplicate Candidates
      Lexical Overlap
      Source URL Similarity
      Author Adjudication
      Remove Confirmed Duplicates
    type: process
    size: xl
    position:
      x: 1088
      'y': 360
  - id: format
    label: |-
      Coauthor Quality Checks
      Standardize Format
      Correct Typos
      Review Ambiguities
      Audit Random Samples
    type: process
    size: xl
    position:
      x: 856
      'y': 360
  - id: difficulty
    label: |-
      Very Easy?
      Four-level Annotation
