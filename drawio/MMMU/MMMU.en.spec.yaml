    type: process
    size: xl
    position:
      x: 856
      'y': 1080
  - id: open_valid
    label: |-
      Gold Match Found?
      String Substring
      or Numeric Equality
    type: decision
    size: xl
    position:
      x: 1088
      'y': 1080
  - id: open_wrong
    label: |-
      Mark Open Item Wrong
      No Random Remedy
      Score = 0
      Still Enters Denominator
    type: process
    size: xl
    position:
      x: 1320
      'y': 1240
  - id: open_score
    label: |-
      Score Open Item
      Any Normalized Gold Match
      Correct = 1
      Otherwise 0
    type: process
    size: xl
    position:
      x: 1552
      'y': 1080
  - id: aggregate
    label: |-
      Report Micro Accuracy
      Correct / Evaluated Rows
      Weighted Across Subjects
      Omitted Predictions Are Not Added
      to Official Script Denominator
    type: terminal
    size: xl
    position:
      x: 1784
      'y': 920
