      6 / 30 / 183 Coverage
    type: database
    size: xl
    position:
      x: 392
      'y': 360
  - id: schema
    label: |-
      Schema Field Groups
      Exact Keys in Audit Note
      id · question · options
      answer · explanation
      images · type · difficulty · subfield
    type: document
    size: xl
    position:
      x: 160
      'y': 360
  - id: split
    label: |-
      Split by Subject
      Dev · 5 Each = 150
      Validation · 900
      Test · 10,500
      Dev Supports Few-shot
    type: process
    size: xl
    position:
      x: 160
      'y': 680
  - id: prompt
