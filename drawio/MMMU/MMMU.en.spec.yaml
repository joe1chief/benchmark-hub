    position:
      x: 1320
      'y': 920
  - id: mc_score
    label: |-
      Score MC Item
      Parsed or Random Letter
      Exact Equality to Gold
      Correct = 1 · Else 0
    type: process
    size: xl
    position:
      x: 1552
      'y': 760
  - id: parse_open
    label: |-
      Parse Open Response
      Conclusion Clauses and Numbers
      Lowercase Strings
      Numbers Rounded to 2 Decimals
