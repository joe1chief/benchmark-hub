      About 10% of Raw Pool
      Below Intended Difficulty
      Not in Benchmark
    type: terminal
    size: xl
    position:
      x: 624
      'y': 520
  - id: final_set
    label: |-
      Final MMMU
      11,550 Questions
      10,861 MC · 689 Open
