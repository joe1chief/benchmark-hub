meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MMMU Evidence-aligned Build and Evaluation Process
  description: >-
    Reconstructs MMMU from arXiv:2311.16502v4, the paper-era official repository and Hugging Face snapshots, including
    the licensed 13K-question collection, cleaning, 11,550-item release schema and splits, model-specific zero-shot
    prompting, both official parsers, invalid-answer handling, and the true micro-accuracy denominator.
  legend: >-
    Solid arrows trace construction and successful evaluation. Labeled branches preserve actual reject, question-type,
    and parser-failure outcomes. The evidence card separates the paper-era snapshots from later mutable releases.
