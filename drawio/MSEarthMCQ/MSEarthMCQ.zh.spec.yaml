meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MSEarthMCQ 构建流程
  description: 按论文第 3 版，从 40 万余篇地球科学 PDF 出发，经图像挖掘、GPT-4o 生成、三阶段模型投票、专家筛选，最终对 2,784 道选择题执行准确率评测。
  legend: 阶段 A 的分支互斥；MiniLM 后处理为可选步骤，仅重试首次判错的结果行；处理异常不生成结果行。 来源：arXiv:2505.20740v3 及官方代码提交 d3ad753。
nodes:
  - id: papers
    label: |-
      解析并分类论文
      40 万余份 OpenDataLab PDF
      MinerU JSON · CC BY 4.0
      五大地球圈层
    type: database
    size: xl
    position:
      x: 20
      'y': 40
  - id: filter
    label: |-
      筛选地球观测图像
      Qwen2.5-VL-72B · 重复抽样
      保留稳定正例 · 约 8.3 万篇论文
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: align
    label: |-
      对齐图像、图注与正文
      正则匹配图号 · 引用段落超过两个句子
      64,560 篇论文 · 289,891 幅图像
    type: process
    size: xl
    position:
      x: 580
      'y': 40
  - id: refine
    label: |-
      用 GPT-4o 精炼图注
      图像 · 原始图注 · 论文上下文
      仅处理上下文有效的数据
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: generate
    label: |-
      生成候选选择题
      GPT-4o · 图像 · 两种图注
      四个选项 · 论文证据约束推理
    type: process
    size: xl
    position:
      x: 1140
      'y': 40
  - id: phase_a
    label: |-
      阶段 A 投票结果？
      原始图注 · 五个多模态大模型
    type: decision
    size: xl
    position:
      x: 1420
      'y': 40
  - id: phase_b
    label: |-
      阶段 B：正确率 >60%？
      精炼图注 · 同一组五个模型
      通过则归为专业题
    type: decision
    size: xl
    position:
      x: 1140
      'y': 420
  - id: phase_c
    label: |-
      阶段 C：正确率 >60%？
      GPT-4o · InternVL2.5-78B
      Qwen2.5-VL-72B · 通过则归为困难题
    type: decision
    size: xl
    position:
      x: 860
      'y': 420
  - id: sample
    label: |-
      抽取 3,000 道选择题
      阶段 A 900 · B 1,800 · C 300
      全部送交专家复核
    type: process
    size: xl
    position:
      x: 580
      'y': 420
  - id: expert_valid
    label: |-
      专家复核是否有效？
      地球科学硕士层次专家
      问题完整 · 答案正确
    type: decision
    size: xl
    position:
      x: 300
      'y': 420
  - id: release
    label: |-
      发布 MSEarthMCQ
      剔除 216 题后保留 2,784 题
      发现题 2,117 · 感知题 667
      单图 1,255 · 多图 1,529
    type: database
    size: xl
    position:
      x: 20
      'y': 420
  - id: discard
    label: |-
      剔除候选题
      过于简单、有缺陷、
      信息不完整或答案错误
    type: loss
    size: xl
    position:
      x: 860
      'y': 720
  - id: model_answer
    label: |-
      执行结构化选择题推理
      图像 · 问题 · 原始图注
      要求输出 JSON 答案与解释
    type: process
    size: xl
    position:
      x: 20
      'y': 900
  - id: row_ok
    label: 是否生成评测结果行？
    type: decision
    size: lg
    position:
      x: 300
      'y': 920
  - id: omitted
    label: |-
      省略处理异常项
      不写入结果行
    type: loss
    size: lg
    position:
      x: 300
      'y': 1120
  - id: initial_compare
    label: |-
      执行首次精确比较
      正则选项，否则使用原始答案文本
      对比标准选项或选项内容
    type: process
    size: xl
    position:
      x: 580
      'y': 900
  - id: initial_correct
    label: 首次判定是否正确？
    type: decision
    size: lg
    position:
      x: 860
      'y': 920
  - id: optional_retry
    label: 是否执行可选后处理？
    type: decision
    size: lg
    position:
      x: 1140
      'y': 920
  - id: similarity
    label: |-
      all-MiniLM-L6-v2 语义相似度
      选择文本最相近的选项
    type: process
    size: xl
    position:
      x: 1100
      'y': 1100
  - id: retry_compare
    label: |-
      再次比较最相近选项
      可将首次错误翻为正确
    type: process
    size: xl
    position:
      x: 1380
      'y': 1100
  - id: score
    label: |-
      报告准确率
      正确数 / 已评测且可映射的结果行
      汇总总体及各分析切片
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 900
edges:
  - from: papers
    to: filter
    type: primary
  - from: filter
    to: align
    type: primary
  - from: align
    to: refine
    type: primary
  - from: refine
    to: generate
    type: primary
  - from: generate
    to: phase_a
    type: primary
  - from: phase_a
    to: discard
    type: optional
    label: 全部正确
    labelPosition: center
    waypoints:
      - x: 1600
        'y': 200
      - x: 1600
        'y': 770
      - x: 1060
        'y': 770
  - from: phase_a
    to: phase_b
    type: primary
    label: 错误率 >40%
    labelPosition: end
    style:
      exitX: 0.75
      exitY: 1
      entryX: 1
      entryY: 0.5
  - from: phase_a
    to: sample
    type: primary
    label: 其余
    labelPosition: center
    waypoints:
      - x: 1520
        'y': 300
      - x: 680
        'y': 300
  - from: phase_b
    to: sample
    type: primary
    label: 通过 >60%
    labelPosition: center
    waypoints:
      - x: 1240
        'y': 260
      - x: 680
        'y': 260
  - from: phase_b
    to: phase_c
    type: primary
    label: 未通过 ≤60%
    labelPosition: center
  - from: phase_c
    to: sample
    type: primary
    label: 通过 >60%
    labelPosition: center
  - from: phase_c
    to: discard
    type: optional
    label: 未通过 ≤60%
    labelPosition: center
  - from: sample
    to: expert_valid
    type: primary
  - from: expert_valid
    to: release
    type: primary
    label: 有效
    labelPosition: center
  - from: expert_valid
    to: discard
    type: optional
    label: 无效
    labelPosition: center
    waypoints:
      - x: 400
        'y': 680
      - x: 860
        'y': 680
  - from: release
    to: model_answer
    type: primary
  - from: model_answer
    to: row_ok
    type: primary
  - from: row_ok
    to: initial_compare
    type: primary
    label: 是 · 保留该行
    labelPosition: center
  - from: row_ok
    to: omitted
    type: optional
    label: 否 · 处理异常
    labelPosition: center
  - from: initial_compare
    to: initial_correct
    type: primary
  - from: initial_correct
    to: score
    type: primary
    label: 是 · 计为正确
    labelPosition: center
    waypoints:
      - x: 960
        'y': 840
      - x: 1520
        'y': 840
  - from: initial_correct
    to: optional_retry
    type: optional
    label: 否 · 首次错误
    labelPosition: center
  - from: optional_retry
    to: score
    type: primary
    label: 否 · 保持错误
    labelPosition: center
  - from: optional_retry
    to: similarity
    type: optional
    label: 是 · 指令遵循较差
    labelPosition: center
  - from: similarity
    to: retry_compare
    type: optional
  - from: retry_compare
    to: score
    type: optional
  - from: omitted
    to: score
    type: optional
    label: 从分母中排除
    labelPosition: center
    waypoints:
      - x: 400
        'y': 1300
      - x: 1520
        'y': 1300
modules: []
