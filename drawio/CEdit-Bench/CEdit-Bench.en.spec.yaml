  layout: vertical
  routing: orthogonal
  title: CEdit-Bench Build Process
  description: >-
    Technical-report- and dataset-card-aligned construction of 1,464 bilingual Chinese-English image-editing pairs in 15
    fine-grained categories, integrating and extending prior benchmarks with newly curated data. The technical report
    names GPT-4o and three metric views but does not publish the judge prompt, detailed rubric, or score formula.
  legend: >-
    Solid arrows show benchmark construction and image-editing evaluation; dashed arrows carry complementary source
    data.
