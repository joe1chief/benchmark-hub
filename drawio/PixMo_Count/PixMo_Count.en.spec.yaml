meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PixMo-Count Build and Evaluation Process
  description: >-
    Paper-v2 construction of detector-derived counting QA, human-verified evaluation splits, the fixed official
    release, and the paper and pinned-code counting branches, with undisclosed construction details kept explicit.
  legend: >-
    Solid edges are the disclosed build or evaluation flow. Dashed edges carry evidence, release, license, or
    reproducibility boundaries and are not additional pipeline stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2409.17146v2 · PDF 54c5e78b4066
      Git 793fa387edfd · HF ebf51cf70e45
      Paper builds; snapshots verify release
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: web_images
    label: |-
      Start from Web Images
      Paper states web images only
      Exact source corpus is not disclosed
      Do not import PixMo-Cap topic claims
    type: database
    size: xl
    position:
      x: 280
      'y': 40
  - id: detic
    label: |-
      Run a Non-VLM Detector
      Paper cites the Detic work
      Dataset card explicitly names Detic
      Produce candidate object detections
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: confidence
    label: |-
      Apply Strict Confidence Thresholding
      Retain high-confidence detections
      Paper does not publish the threshold
      Keep this as a disclosed filter gate
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: dominant_class
    label: |-
      Choose One Class per Image
      Count detections by object class
      Select the class with the most boxes
      Define one counting target
    type: process
    size: xl
    position:
      x: 1060
      'y': 40
  - id: centers_qa
    label: |-
      Derive Points and Counting QA
      Convert boxes to object centers
      Count the selected class instances
      Pair image, label, count, and points
    type: document
    size: xl
    position:
      x: 1320
      'y': 40
  - id: diversity_filter
    label: |-
      Filter Accuracy and Diversity
      Official card discloses this pass
      Remove inaccurate or redundant data
      Exact rules remain unpublished
    type: process
    size: xl
    position:
      x: 1580
      'y': 40
  - id: candidate_pool
    label: |-
      Form the Candidate Pool
      Keep eligible counts from 0 through 10
      Reserve counts 2 through 10 for review
      Remaining records can train counting
    type: database
    size: xl
    position:
      x: 1840
      'y': 40
  - id: eval_sample
    label: |-
      Sample Evaluation Candidates
      Follow CountBenchQA methodology
      Take 120 samples for each count
      Cover counts 2 through 10
    type: database
    size: xl
    position:
      x: 2100
      'y': 40
  - id: human_verify
    label: |-
      Manually Verify Counts
      Inspect every sampled candidate
      Confirm object identity and total
      Nine counts yield 1,080 reviewed items
    type: process
    size: xl
    position:
      x: 2360
      'y': 40
  - id: eval_release
    label: |-
      Create Validation and Test Splits
      Validation 540 · test 540
      Both cover counts 2 through 10
      Released evaluation rows omit points
    type: database
    size: xl
    position:
      x: 2620
      'y': 40
  - id: train_release
    label: |-
      Finalize the Training Split
      Use remaining counts 0 through 10
      Paper reports about 36k images
      Fixed release contains 36,916 rows
    type: database
    size: xl
    position:
      x: 2100
      'y': 360
  - id: fixed_release
    label: |-
      Package the Fixed Official Dataset
      Train 36,916 · validation 540 · test 540
      URL · SHA-256 · count · label · points
      ODC-BY-1.0; image URLs may repeat
    type: database
    size: xl
    position:
      x: 1840
      'y': 360
  - id: eval_setup
    label: |-
      Run the Paper Counting Evaluation
      Table 1 uses the held-out test split
      Table 4 PCQA uses validation
      Keep 12 crops for counting tasks
    type: process
    size: xl
    position:
      x: 1580
      'y': 360
  - id: strategy_gate
    label: |-
      Select a Counting Strategy
      Compare four paper ablations
      Use the same PCQA validation set
      Score each branch by its paper rule
    type: decision
    size: xl
    position:
      x: 1320
      'y': 360
  - id: count_only
    label: |-
      Generate the Count Only
      Emit no object-center explanation
      PCQA validation Accuracy 80.2
      Paper comparison branch
    type: process
    size: xl
    position:
      x: 1060
      'y': 160
  - id: point_then_count
    label: |-
      Point, Then Generate the Count
      Emit ordered object-center points first
      PCQA validation Accuracy 86.3
      Paper default and best branch
    type: process
    size: xl
    position:
      x: 1060
      'y': 320
  - id: count_then_point
    label: |-
      Count, Then Generate Points
      Reverse the explanation order
      PCQA validation Accuracy 77.6
      Paper comparison branch
    type: process
    size: xl
    position:
      x: 1060
      'y': 480
  - id: pointing_regex
    label: |-
      Generate Points for Regex Counting
      Emit point coordinates without a count
      Keep this paper comparison branch
      Separate it from the text-count parser
    type: process
    size: xl
    position:
      x: 1060
      'y': 640
  - id: parse_points
    label: |-
      Count Emitted Points by Regex
      Apply the paper regex to coordinates
      Do not invoke PointCountEval parsing
      PCQA validation Accuracy 85.4
    type: process
    size: xl
    position:
      x: 540
      'y': 640
  - id: parse_count
    label: |-
      Parse Branches That Emit a Count
      Pinned code reads final integer or word
      It also accepts "a total of N"
      Report correct · close · valid · per-count
    type: process
    size: xl
    position:
      x: 800
      'y': 360
  - id: accuracy
    label: |-
      Report Counting Accuracy
      Exact predicted count equals reference
      Table 1 reports held-out test results
      Table 4 reports strategy ablations
    type: terminal
    size: xl
    position:
      x: 540
      'y': 360
  - id: construction_boundary
    label: |-
      Construction Disclosure Boundary
      Detector checkpoint and config unknown
      Threshold and diversity rules unknown
      Source sampling and split seed unknown
    type: document
    size: xl
    position:
      x: 280
      'y': 820
  - id: release_boundary
    label: |-
      Paper-to-Release Boundary
      Paper says 36k; fixed data has 36,916
      Evaluation points are intentionally absent
      Card arXiv tag identifies Detic, not Molmo
    type: document
    size: xl
    position:
      x: 1840
      'y': 820
  - id: evaluator_boundary
    label: |-
      Evaluator Reproducibility Boundary
      Git exposes loader, templates, and parser
      It does not expose data construction
      VLMEvalKit excludes PixMo-Count
    type: document
    size: xl
    position:
      x: 1580
      'y': 820
  - id: license_boundary
    label: |-
      Release and License Boundary
      ODC-BY-1.0 research release
      Images remain externally hosted by URL
      Verify downloads with released SHA-256
    type: document
    size: xl
    position:
      x: 2100
      'y': 820
