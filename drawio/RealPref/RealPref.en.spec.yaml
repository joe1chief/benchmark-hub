meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "RealPref Build and Evaluation Process"
  description: "RealPref samples and manually filters 100 PersonaHub personas, extends them with demographics, biographies, and life events, and creates ten original plus three rationally inferred generalized preferences per user for 1,300 preferences. Each preference is expressed through four modes ranging from explicit to implicit. Preference, life-event, and random sessions are concatenated into histories averaging roughly 2K to 247K tokens. Original and generalized preferences receive multiple-choice, true-or-false, and open-ended queries. Classification tasks use accuracy, while open answers are judged against granular rubrics; results are sliced by expression type, context length, and unseen-scenario generalization."
  legend: "Source: arXiv:2603.04191 Sections 3-4, cross-checked against GG14127/RealPref generation pipeline and dataset schema. Solid arrows show the main flow explicitly supported by the paper or official documentation."
