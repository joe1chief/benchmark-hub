meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlmoBaseEval 论文构建与评测合同
  description: 按论文 v2 还原低噪声 OlmoBaseEval 开发套件的构建过程，并把固定 OLMES 实现快照作为独立的论文—代码边界展示。
  legend: 实线表示论文构建与评测主流程；虚线表示一手证据、独立留出设计分支，以及不得混入论文 43 项口径的实现漂移。
