    size: xl
    position:
      x: 20
      'y': -160
  - id: objective
    label: |-
      定义开发评测目标
      支持预训练与中训练决策
      在小计算量下识别信号
      降低基准噪声
    type: document
    size: xl
    position:
      x: 20
      'y': 100
  - id: candidate_tasks
    label: |-
      选择宽覆盖候选任务
      科学与通用知识
      医学与实验室知识
      数学与代码
    type: database
    size: xl
    position:
      x: 260
      'y': 100
  - id: score_pool
    label: |-
      构建分数池
      2.3 万条基准分数
      70 个外部开放权重模型
      比较任务级模型排序
    type: database
    size: xl
    position:
      x: 500
      'y': 100
  - id: rank_similarity
    label: |-
      衡量任务相似度
      模型排序相近即视为相似
      Ward 方差最小化
      迭代层次合并
    type: process
    size: xl
    position:
      x: 740
      'y': 100
  - id: task_clusters
    label: |-
      形成能力任务簇
      人工选择聚类阈值
      把同格式任务移到同簇
      最终形成六个能力簇
    type: process
    size: xl
    position:
      x: 980
      'y': 100
  - id: scaling
    label: |-
      分析缩放信号
      10¹⁸ 至 10²⁵ 训练 FLOPs
      25 个 OLMo 2 缩放模型
      70 个开放权重模型
    type: process
    size: xl
    position:
      x: 1220
      'y': 100
  - id: heldout
    label: |-
      预留四项独立留出任务
      MMLU Pro · DeepMind Math
      LBPP · BigBench Hard
      发布前从未使用
    type: process
    size: xl
    position:
      x: 2180
      'y': -180
  - id: base_easy
    label: |-
      构建 Base Easy 代理
      使用标准或人工续写
      负对数似然 / UTF-8 字节数
      面向 10 亿参数以下决策
    type: process
    size: xl
    position:
      x: 1460
      'y': 80
  - id: base_main
    label: |-
      构建 Base Main
      STEM 多选 · 非 STEM 多选 · GenQA
      数学 · 代码 · 代码 FIM
      留出项之前论文共 39 行
    type: process
    size: xl
    position:
      x: 1460
      'y': 400
  - id: snr
    label: |-
      测量信噪比
      OLMo 2 13B 最后 50 个检查点
      10 个计算量匹配的外部模型
      训练量约为 4×10²³ FLOPs
      五次中训练预备运行
    type: process
    size: xl
    position:
      x: 1700
      'y': 400
  - id: refine
    label: |-
      调整高噪声评测
      1K 子集扩为完整集合
      移除 BoolQ · 保留 CruxEval
      移出宏平均并调整 pass@k
    type: process
    size: xl
    position:
      x: 1940
      'y': 400
  - id: new_benchmarks
    label: |-
      加入四个新组件
      BasicSkills：六项任务
      Gen2MC：五项问答
      每项人工抽查 200 条验证样本
      MT MBPP：17 种代码语言
      掩码困惑度：UltraChat + WildChat
    type: process
    size: xl
    position:
      x: 2180
      'y': 400
  - id: release_count
    label: |-
      固定论文 v2 套件
      共 43 个具名评测项
      Base Main 39 项 + 留出 4 项
      Base Easy 复用标准续写
    type: database
    size: xl
    position:
      x: 2420
      'y': 120
  - id: paper_eval
    label: |-
      执行论文评测合同
      开发使用 vLLM 0.9.0.1
      终稿使用 vLLM 0.11.0
      按任务固定样本示例与格式
      数学/代码温度与 top-p 均为 0.6
    type: process
    size: xl
    position:
      x: 2660
      'y': 120
  - id: repo_drift
    label: |-
      固定 OLMES 代码边界
      OLMES 5a51f502d463
      Main 38 项 + 留出 4 项 = 42
      缺少 MATH 500 · 使用 mt_mbpp_v2fix
      Apache-2.0
    type: document
    size: xl
    position:
      x: 2660
      'y': 420
  - id: report
    label: |-
      报告开发决策信号
      BPB · 正确率 · F1 · pass@k
      六个能力簇宏平均
      留出任务单独报告
    type: terminal
    size: xl
    position:
      x: 2900
      'y': 120
