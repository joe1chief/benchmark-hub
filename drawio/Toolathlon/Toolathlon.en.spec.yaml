  title: Toolathlon Data Construction and Execution Evaluation
  description: >-
    Reconstructs the paper's app and tool selection, two-stage task sourcing, per-task asset implementation, and author
    review, while keeping containerized agent execution and deterministic state evaluation in a separate lower lane.
