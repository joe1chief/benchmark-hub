meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SimpleVQA 构建与评测流程
  description: >-
    SimpleVQA是双语事实性视觉问答基准，包含2025组短答案图像问题，覆盖9类任务、9个领域和244种图像类型。种子图像与问答来自MM-Vet、MME、DynaMath、MMBench-CN、CCBench及专家网页搜索。GPT-4o改写或生成一一对应的事实问答，GPT-4筛查稳定性、唯一性和难度，随后两名专业标注者完善样本。凡GPT-4o、GPT-4o-mini、Doubao-Vision-Pro和ERNIE-VL都能答对的问题均被删除，并为后续错误分析生成原子识别问题。每题由两名专家独立依据至少两个URL事实核验，分歧交第三名专家裁决。经过多轮筛选，8360条候选最终保留2025条。模型输入图像与简短问题，GPT-4o把回答判为正确、未作答或错误；按语言、任务和领域报告作答条件准确率及正确率与作答条件准确率的调和F-score，并用569条复杂事实子集做原子事实分析。
  legend: >-
    来源：SimpleVQA arXiv:2502.13059 Sections 2.1-2.5 and 3.1-3.3, Figures 2-4, and Appendix G; official
    SimpleVQA/SimpleVQA repository。实线箭头表示论文或官方资料明确支持的主流程。
