meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierCode 1.1 Build Process
  description: Official-post-aligned task construction, rubric hardening, private release, and version 1.1 evaluation flow.
  legend: >-
    Solid arrows follow Cognition's dated 2026-06-08 construction post and 2026-07-07 version 1.1 update. Cognition
    discloses no paper, public repository, task bundle, base-commit list, or grader implementation.
