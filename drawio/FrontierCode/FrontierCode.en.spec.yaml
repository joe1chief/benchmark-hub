      no paper, repo, task, or grader dump
      only disclosed stages/counts shown
    type: document
    size: xl
    position:
      x: 40
      'y': 120
  - id: maintainers
    label: |-
      Recruit 20+ repository maintainers
      from 36 flagship open-source repos
      over 40 expert hours per task
    type: database
    size: xl
    position:
      x: 300
      'y': 120
  - id: task_selection
    label: |-
      Select realistic repository work
      multi-PR chains or free-form requests
      concise brief + codebase guidelines
    type: process
    size: xl
    position:
      x: 560
      'y': 120
  - id: rubric_design
    label: |-
      Define mergeability criteria
      behavior · regression · build/lint/style
      tests · scope · quality; mark blockers
    type: process
    size: xl
    position:
      x: 820
      'y': 120
  - id: verifier_ensemble
    label: |-
      Assign criterion-specific grading
      classical/command · reverse-classical
      scope · adaptive classical (mutagent)
      LLM prompt
    type: process
    size: xl
    position:
      x: 1080
      'y': 120
  - id: quality_control
    label: |-
      Harden and calibrate every rubric
      fix wrong + alternate-valid cases
      Devin hacks; four solutions, 0–100%
      staged review
    type: process
    size: xl
    position:
      x: 1340
      'y': 120
  - id: private_release
    label: |-
      Private Extended 150
      Main = hardest 100
      base commits + grader code withheld
      Diamond 50 deprecated in v1.1
    type: database
    size: xl
    position:
      x: 1340
      'y': 420
  - id: version_11
    label: |-
      Apply FrontierCode 1.1 grading
      audit 1,000+ criteria
      demote 75 blockers
      fair-internet prompt + classical verifier
    type: process
    size: xl
    position:
      x: 1080
      'y': 420
  - id: agent_runs
    label: |-
      Run agents with fair-internet rules
      docs allowed
      solution-bearing sources banned
      5 trials/effort; average then best
    type: process
    size: xl
    position:
      x: 820
      'y': 420
  - id: score
    label: |-
      Report pass rate + weighted rubric
      any blocker failure → score 0
      unfair internet use → run score 0
    type: terminal
    size: xl
    position:
      x: 560
      'y': 420
