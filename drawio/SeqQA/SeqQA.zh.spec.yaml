meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SeqQA 构建与评测流程
  description: >-
    SeqQA是LAB-Bench中的序列操作类别，包含750道多项选择题和15个子任务，覆盖DNA、RNA、蛋白质、PCR、限制性内切酶、开放阅读框、克隆及序列基本性质。大多数题目由程序生成，任务专用脚本和BioPython计算理想答案，干扰项则是确定性的近似错误或错误变换，例如偏移的片段长度、截断的开放阅读框、邻近氨基酸或扰动后的GC含量。官方发布把公开数据与受保护测试或金丝雀部分分开。论文基线使用零样本思维链、不允许工具，并提供明确放弃选项；文本补全被解析为选项。Accuracy为正确数除以总题数，Precision为正确数除以作答数，Coverage为作答数除以总题数。结果按子任务、三次运行报告，并与人类研究者比较。
  legend: >-
    来源：LAB-Bench arXiv:2407.10362 Sections 2-4 and Appendix SeqQA task descriptions; official Future-House/LAB-Bench
    repository。实线箭头表示论文或官方资料明确支持的主流程。
