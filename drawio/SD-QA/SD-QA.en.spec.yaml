meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SD-QA Build and Evaluation Process
  description: >-
    SD-QA augments TyDi QA with more than 68,000 human-recorded spoken questions in Arabic, Bengali, English, Kiswahili,
    and Korean, spanning 24 language varieties and 255 speakers. It uses native TyDi QA questions rather than
    translations, takes the original TyDi QA development set as test, samples development items from training, and
    removes those items from the text training data; no spoken training set is provided. Recordings, gold and ASR
    transcripts, speaker metadata, contexts, and answers are packaged by language, dialect, and split. Evaluation covers
    ASR with word error rate, passage selection and minimal-answer selection with TyDi QA F1, and robustness or fairness
    comparisons across dialects and speaker populations.
  legend: >-
    Source: SD-QA arXiv:2109.12072 Sections 2-3 and official ffaisal93/SD-QA data and baseline layout. Solid arrows show
    the main flow explicitly supported by the paper or official documentation.
