  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VMQA5 Build and Evaluation Process
  description: >-
    The local VMQA5 label refers to SecureBio's single-choice VMQA reported for Gemini 2.5 Deep Think, an early VCT
    variant. Public reporting identifies the provider, single-choice format, and use as a CBRN capability proxy, but
    does not disclose a distinct VMQA5 dataset construction procedure, item count, or split. The faithful public flow is
    therefore limited to receiving the protected external set, prompting the model with its text and any image, parsing
    one option, exact scoring, and model comparison. The final 322-question multiple-response VCT paper provides
    lineage, not interchangeable release details.
  legend: >-
    Source: SecureBio model-report index entry for Gemini 2.5 Deep Think VMQA single-choice; successor VCT
    arXiv:2504.16137 for provenance only. Solid arrows show the main flow explicitly supported by the paper or official
    documentation.
