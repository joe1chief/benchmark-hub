  title: VMQA5 构建与评测流程
  description: >-
    本地VMQA5标签指Gemini 2.5 Deep
    Think报告使用的SecureBio单选VMQA，即VCT早期变体。公开资料只确认提供方、单选格式以及其作为CBRN能力代理评测的用途，并未披露独立的VMQA5构建流程、题目数或切分。因此可忠实公开的流程仅包括接收受保护外部题集、向模型提供文字及可能的图像、解析一个选项、严格评分和模型比较。最终322题多选VCT论文只提供谱系背景，不能当作同一版本细节。
  legend: >-
    来源：SecureBio model-report index entry for Gemini 2.5 Deep Think VMQA single-choice; successor VCT arXiv:2504.16137
    for provenance only。实线箭头表示论文或官方资料明确支持的主流程。
