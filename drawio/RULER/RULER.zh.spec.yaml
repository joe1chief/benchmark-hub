meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RULER 论文对齐的构建与评测过程
  description: >-
    按 COLM 2024 论文呈现四类长上下文行为任务、13 项代表性配置、六档上下文长度的样本生成，以及基于召回的准确率与
    有效上下文长度计算。
  legend: >-
    实线表示论文流程；虚线隔离来源、论文期实现、发布、当前代码漂移与许可边界。RULERv2 和后续生成器修复不回填到论文流程。
nodes:
  - id: source_evidence
    label: |-
      COLM 2024 · arXiv 2404.06654v3
      PDF SHA256 8a4bc6ca28d8
      论文期 Git dbc6a83c2f60
      当前 Git 38da79d79519
    type: document
    size: xl
    position: { x: 20, y: 300 }
    style: { fontSize: 8 }
  - id: benchmark_design
    label: |-
      可配置合成输入
      设置序列长度
      设置任务复杂度
      控制目标规模与噪声
    type: process
    size: xl
    position: { x: 260, y: 300 }
    style: { fontSize: 9 }
  - id: retrieval
    label: |-
      检索 · 八项配置
      S-NIAH 3 · MK-NIAH 3
      MV-NIAH 1 · MQ-NIAH 1
      干扰上下文中的针
    type: process
    size: xl
    position: { x: 500, y: 0 }
    style: { fontSize: 9 }
  - id: multihop
    label: |-
      多跳追踪 · 一项配置
      变量追踪
      一条链 · 四跳
      返回五个变量名
    type: process
    size: xl
    position: { x: 500, y: 180 }
    style: { fontSize: 9 }
  - id: aggregation
    label: |-
      聚合 · 两项配置
      CWE：10 个常见词各 30 次
      非常见词各 3 次
      FWE：Zeta alpha 2.0
    type: process
    size: xl
    position: { x: 500, y: 420 }
    style: { fontSize: 9 }
  - id: qa
    label: |-
      问答 · 两项配置
      SQuAD 单跳
      HotpotQA 多跳
      加入干扰段落
    type: process
    size: xl
    position: { x: 500, y: 600 }
    style: { fontSize: 9 }
  - id: task_suite
    label: |-
      论文任务套件
      13 项代表性配置
      四类行为能力
      依据相关性研究筛选
    type: database
    size: xl
    position: { x: 740, y: 300 }
    style: { fontSize: 9 }
  - id: length_grid
    label: |-
      长度网格
      4K · 8K · 16K
      32K · 64K · 128K
      按模型支持长度评测
    type: document
    size: xl
    position: { x: 980, y: 600 }
    style: { fontSize: 9 }
  - id: prompt_contract
    label: |-
      提示合同
      套用模型与任务模板
      指令 · 上下文 · 查询
      追加任务回答前缀
      “不解释”措辞仅属特定模板
    type: document
    size: xl
    position: { x: 980, y: 80 }
    style: { fontSize: 9 }
  - id: generate
    label: |-
      生成每个任务—长度组合
      每个长度 500 条样本
      自动生成评测输入
      没有固定行级划分
    type: process
    size: xl
    position: { x: 1460, y: 300 }
    style: { fontSize: 9 }
  - id: direct_answer
    label: |-
      通用提示路线
      不前置单条任务示例
      套用模型与任务模板
      追加任务回答前缀
    type: process
    size: xl
    position: { x: 1220, y: 0 }
    style: { fontSize: 9 }
  - id: vt_cwe_one_shot
    label: |-
      VT 与 CWE 路线
      前置一条任务示例
      再给测试查询
      追加任务回答前缀
    type: process
    size: xl
    position: { x: 1220, y: 180 }
    style: { fontSize: 9 }
  - id: inference
    label: |-
      模型推理 · 17 个模型
      15 个开源 + GPT-4 + Gemini-1.5
      论文：vLLM · BF16 · 八张 A100
      论文：贪心解码
      快照：Llama2 走 vLLM · GPT/Gemini 走 API
    type: process
    size: xl
    position: { x: 1700, y: 300 }
    style: { fontSize: 8 }
  - id: recall_metric
    label: |-
      基于召回的准确率
      检查目标是否出现
      逐样本逐任务计算
      覆盖每个上下文长度
    type: process
    size: xl
    position: { x: 1940, y: 300 }
    style: { fontSize: 9 }
  - id: aggregate_scores
    label: |-
      聚合结果
      每长度平均 13 项任务
      长度权重递增与递减
      计算加权平均
    type: process
    size: xl
    position: { x: 2180, y: 300 }
    style: { fontSize: 9 }
  - id: effective_length
    label: |-
      有效上下文长度
      高于 85.6% 的最大长度
      阈值为 Llama2-7B 的 4K 得分
      与声明长度比较
    type: terminal
    size: xl
    position: { x: 2420, y: 300 }
    style: { fontSize: 9 }
  - id: paper_snapshot
    label: |-
      论文期实现快照
      Git dbc6a83c2f60 · 2024-08-01
      synthetic.yaml 含 13 个名称
      Llama2 走 vLLM · GPT 走 OpenAI · Gemini API
    type: document
    size: xl
    position: { x: 740, y: 820 }
    style: { fontSize: 8 }
  - id: current_drift
    label: |-
      论文后的仓库漂移
      当前 38da79d79519 · 2026-06-25
      2025 年生成器修复
      新增 RULERv2 分支指引
    type: document
    size: xl
    position: { x: 980, y: 820 }
    style: { fontSize: 8 }
  - id: license_boundary
    label: |-
      仓库许可
      Apache-2.0
      适用于代码快照
      数据由配置生成
    type: document
    size: xl
    position: { x: 1220, y: 820 }
    style: { fontSize: 9 }
  - id: release_boundary
    label: |-
      发布边界
      按配置动态生成
      论文每组合报告 500 条
      没有不可变行级划分
    type: document
    size: xl
    position: { x: 1460, y: 820 }
    style: { fontSize: 9 }
