meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PaperQA Build and Evaluation Process
  description: >-
    Paper-v3 reconstruction of academic-figure sourcing, STEM annotation, independent review, consensus, fixed-release
    packaging, and the official MathVista evaluation pipeline used by PaperQA.
  legend: >-
    Solid arrows are disclosed construction or evaluation stages. Dashed arrows identify fixed evidence, release drift,
    licensing, and extractor reproducibility boundaries; they are not extra benchmark stages.
nodes:
