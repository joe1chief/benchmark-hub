      arXiv 2310.02255v3 · PDF ee5a616e9481
      Git 53d525874bdd
      HF 2b6ad69445fb
    type: document
    size: xl
    position:
      x: 120
      'y': 100
  - id: coverage_gap
    label: |-
      Identify the Scientific Gap
      Academic-figure scientific reasoning
      Remains unaddressed by existing sources
      Need visually grounded math reasoning
      Add the PaperQA source dataset
    type: document
    size: xl
    position:
      x: 380
      'y': 100
  - id: paper_sources
    label: |-
      Source August 2023 Papers
      Use papers released on Hugging Face
      Take informative tables and figures
      Include charts from academic papers
    type: database
    size: xl
    position:
      x: 640
      'y': 100
  - id: author_questions
    label: |-
      Manually Annotate Questions
      Graduate students in STEM fields
      Ground each question in its illustration
      Target scientific reasoning
    type: document
    size: xl
    position:
      x: 900
      'y': 100
  - id: independent_review
    label: |-
      Independently Review Each Dataset
      Three reviewers annotate answers
      Apply the two-step consistency process
      Compare reviewer answer labels
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: agreement
    label: |-
      Measure Cross-review Agreement
      736 new questions across three sets
      99.2 percent answer consistency
      Six disagreements in total
    type: process
    size: xl
    position:
      x: 1420
      'y': 100
  - id: consensus
    label: |-
      Resolve the Six Disagreements
      Entire review team discusses each case
      Refine ambiguous answer labels
      Reach consensus per example
    type: process
    size: xl
    position:
      x: 1680
      'y': 100
  - id: metadata
    label: |-
      Attach Fine-grained Metadata
      Question and answer types · language
      Source · category · task · grade
      Context and reasoning skills
    type: database
    size: xl
    position:
      x: 1940
      'y': 100
  - id: paper_scope
    label: |-
      Paper-v3 PaperQA Scope
      107 academic-illustration examples
      Figure question answering · college
      Scientific and statistical reasoning
    type: database
    size: xl
    position:
      x: 2200
      'y': 100
  - id: fixed_release
    label: |-
      Package the Fixed Official Release
      108 PaperQA rows in released JSON
      testmini 19 · test 89
      Images · questions · choices · metadata
    type: database
    size: xl
    position:
      x: 1940
      'y': 360
  - id: split_policy
    label: |-
      Apply the MathVista Split Policy
      testmini supports development
      Test answers remain withheld
      Approximate the full source distribution
    type: process
    size: xl
    position:
      x: 2200
      'y': 360
  - id: response_generation
    label: |-
      Generate a Model Response
      Pass the image separately
      Type-aware hint · question · choices
      Optional caption and OCR context
    type: process
    size: xl
    position:
      x: 1680
      'y': 360
  - id: extraction_gate
    label: |-
      Rule-based Extraction?
      Exact choice or number
      Optional quoted regex
      Else use the LLM
    type: decision
    size: xl
    position:
      x: 1420
      'y': 360
  - id: direct_extract
    label: |-
      Use Direct Extraction
      Return an exact choice string
      Parse integer or floating response
      Regex only with quick_extract
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: llm_extract
    label: |-
      Use the Five-demo LLM Extractor
      Append query and model response
      Paper uses GPT-4 for short answers
      Above 99.5 percent on 200 trials
    type: process
    size: xl
    position:
      x: 1160
      'y': 500
  - id: normalize
    label: |-
      Normalize the Extracted Answer
      Letter or nearest choice by edit distance
      Integer · rounded float · list string
      Compare with safe exact equality
    type: process
    size: xl
    position:
      x: 900
      'y': 360
  - id: report
    label: |-
      Report Deterministic Accuracy
      Count exact normalized matches
      Break down by source and metadata
      PaperQA remains a MathVista subset
    type: terminal
    size: xl
    position:
      x: 640
      'y': 360
  - id: release_boundary
    label: |-
      Paper-to-release Count Boundary
      Paper v3 states 107 PaperQA examples
      Fixed JSON contains 108: 19 plus 89
      The primary flow preserves both facts
    type: document
    size: xl
    position:
      x: 2460
      'y': 100
  - id: license_boundary
    label: |-
      License and Use Boundary
      New contributions: CC BY-SA 4.0
      Images and questions retain copyrights
      Test use allowed; training prohibited
    type: document
    size: xl
    position:
      x: 1940
      'y': 780
  - id: extractor_boundary
    label: |-
      Extractor Reproducibility Boundary
      Paper names GPT-4, not a checkpoint
      Code reads AZURE_OPENAI_MODEL
      Endpoint and deployment are external
    type: document
    size: xl
    position:
      x: 1160
      'y': 780
