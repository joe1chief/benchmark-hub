    对齐论文的 CheXGenBench 构建流程：选择 11 个 T2I 模型，用 MIMIC-CXR 和 LLaVA-Rad 增强标注 标准化训练，生成合成胸片后评估保真度、模式覆盖、隐私风险、下游实用性，并发布
