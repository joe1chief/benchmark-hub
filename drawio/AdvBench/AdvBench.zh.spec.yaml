meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AdvBench 构建与 GCG 攻击流程
  description: 对齐论文的两类 AdvBench 集合构建流程，以及单题、通用或迁移 GCG 评测流程。
  legend: 论文披露了种子数量与生成器设置。未说明的生成后过滤链只作为无连线注释呈现，不是必经流程阶段。
nodes:
  - id: seed_strings
    label: |-
      有害字符串种子
      人工编写 100 条
    type: database
    size: xl
    position:
      x: 40
      'y': 0
  - id: seed_behaviors
    label: |-
      有害行为种子
      人工编写 50 条
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: string_prompt
    label: |-
      有害字符串 5 个示例提示
      仅抽取字符串种子
    type: document
    size: xl
    position:
      x: 280
      'y': 0
  - id: behavior_prompt
    label: |-
      有害行为 5 个示例提示
      仅抽取行为种子
    type: document
    size: xl
    position:
      x: 280
      'y': 200
  - id: generator
    label: |-
      Wizard-Vicuna-30B-Uncensored
      每轮生成 10 条
    type: process
    size: xl
    position:
      x: 520
      'y': 100
  - id: filter_unknown
    label: |-
      论文未披露
      生成后过滤链
      仅作注释 • 无连线
    type: document
    size: xl
    position:
      x: 760
      'y': 260
  - id: release
    label: |-
      发布 AdvBench
      论文：500 字符串 + 500 行为
    type: database
    size: xl
    position:
      x: 1000
      'y': 100
  - id: protocol
    label: |-
      选择攻击协议
      单题 • 通用 • 迁移
    type: process
    size: xl
    position:
      x: 1240
      'y': 440
  - id: individual
    label: |-
      单题协议
      100 次运行 • 1 个行为 • 1 个模型
    type: process
    size: xl
    position:
      x: 1480
      'y': 240
  - id: universal
    label: |-
      通用协议
      在 25 个行为上优化
      评测 100 个行为
    type: process
    size: xl
    position:
      x: 1480
      'y': 440
  - id: transfer
    label: |-
      迁移协议
      在 25 个行为上优化
      评测 388 个未见行为
    type: process
    size: xl
    position:
      x: 1480
      'y': 640
  - id: gcg
    label: |-
      运行 GCG 搜索
      20 token 后缀 • 500 步
      梯度 Top-k 256 • 批量 512
    type: process
    size: xl
    position:
      x: 1720
      'y': 440
  - id: run
    label: |-
      运行被测模型
      保留最佳对抗后缀
    type: process
    size: xl
    position:
      x: 1960
      'y': 440
  - id: success_gate
    label: 采用哪条成功判定？
    type: decision
    size: xl
    position:
      x: 2200
      'y': 440
  - id: string_score
    label: |-
      有害字符串评分
      仅使用目标交叉熵
      检查精确目标诱导
    type: process
    size: xl
    position:
      x: 2440
      'y': 320
  - id: behavior_score
    label: |-
      有害行为评分
      人工判断是否遵从
    type: process
    size: xl
    position:
      x: 2440
      'y': 560
  - id: asr
    label: |-
      攻击成功率
      单题 • 通用 • 迁移
    type: process
    size: xl
    position:
      x: 2680
      'y': 440
  - id: report
    label: |-
      报告鲁棒性
      ASR + 目标损失
    type: terminal
    size: xl
    position:
      x: 2920
      'y': 440
edges:
  - from: seed_strings
    to: string_prompt
    type: primary
  - from: seed_behaviors
    to: behavior_prompt
    type: primary
  - from: string_prompt
    to: generator
    type: primary
  - from: behavior_prompt
    to: generator
    type: primary
  - from: generator
    to: release
    type: primary
  - from: release
    to: protocol
    type: primary
  - from: protocol
    to: individual
    type: primary
    label: 单题
  - from: protocol
    to: universal
    type: primary
    label: 通用
  - from: protocol
    to: transfer
    type: primary
    label: 迁移
  - from: individual
    to: gcg
    type: primary
  - from: universal
    to: gcg
    type: primary
  - from: transfer
    to: gcg
    type: primary
  - from: gcg
    to: run
    type: primary
  - from: run
    to: success_gate
    type: primary
  - from: success_gate
    to: string_score
    type: primary
    label: 字符串
  - from: success_gate
    to: behavior_score
    type: primary
    label: 行为
  - from: string_score
    to: asr
    type: primary
  - from: behavior_score
    to: asr
    type: primary
  - from: asr
    to: report
    type: primary
modules: []
