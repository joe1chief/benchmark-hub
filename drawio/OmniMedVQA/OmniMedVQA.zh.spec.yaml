meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OmniMedVQA 构建、发布与评测流程
  description: 对齐论文 v2 从 73 个医学分类数据集构建 OmniMedVQA 的过程、双分数零样本评测，以及独立标出的 HF 混合访问与代码实现边界。
  legend: >-
    固定证据为 arXiv:2402.09181v2、OpenGVLab/Multi-Modality-Arena 的 bd2999a3be2b 与 Hugging Face 的
    1ba51c28fc07。实线表示构建或评测主流程；虚线表示证据与访问边界。
nodes:
  - id: evidence
    label: |-
      固定一手证据
      arXiv v2 · 5704bd6b4f4d
      Git bd2999a3be2b
      HF 1ba51c28fc07
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: scope
    label: |-
      界定医学问答范围
      73 个分类数据集
      使用真实医学图像
      12 种模态 · 20 多个解剖区域
    type: process
    size: xl
    position:
      x: 300
      'y': 40
  - id: inventory
    label: |-
      盘点源数据访问条件
      42 个完全开放数据集
      31 个受限访问数据集
      保留来源与原始使用条款
    type: database
    size: xl
    position:
      x: 580
      'y': 40
  - id: coverage
    label: |-
      映射医学覆盖范围
      记录模态与解剖区域
      使用原始分类标签
      保留真实场景语义
    type: process
    size: xl
    position:
      x: 860
      'y': 40
  - id: templates
    label: |-
      设计逐数据集问答模板
      转换原始类别信息
      增加模态与解剖问题
      统计各模板候选图像量
    type: document
    size: xl
    position:
      x: 1140
      'y': 40
  - id: balance
    label: |-
      执行反比例采样
      大模板采用更小采样比例
      平衡各问题类别
      降低重复问答偏差
    type: process
    size: xl
    position:
      x: 1420
      'y': 40
  - id: types
    label: |-
      归入五类问题
      模态识别 · 解剖识别
      疾病诊断 · 病灶分级
      其他生物属性
    type: process
    size: xl
    position:
      x: 1700
      'y': 40
  - id: rewrite
    label: |-
      使用 ChatGPT-3.5 改写
      改变表达方式与句法
      保持原始答案不变
      增加语言多样性
    type: process
    size: xl
    position:
      x: 1980
      'y': 40
  - id: options
    label: |-
      生成错误候选项
      GPT-3.5 生成干扰项
      每题提供两至四个选项
      形成多项选择问答
    type: document
    size: xl
    position:
      x: 2260
      'y': 40
  - id: qc
    label: |-
      执行人工双重检查
      检查数据集有效性
      核验问题与选项
      保留医学语义
    type: process
    size: xl
    position:
      x: 2540
      'y': 40
  - id: paper_release
    label: |-
      定稿 OmniMedVQA
      118,010 张图像 · 127,995 条问答
      12 种模态 · 20 多个解剖区域
      五类问题
    type: database
    size: xl
    position:
      x: 2820
      'y': 40
  - id: hf_package
    label: |-
      发布混合访问数据包
      42 个开放源随包提供图像
      31 个受限源仅提供问答与相对路径
      HF 单一 ZIP · 10,698,178,715 字节
    type: database
    size: xl
    position:
      x: 3100
      'y': 40
  - id: eval_scope
    label: |-
      执行论文零样本评测
      八个通用领域 LVLM
      四个医学专用 LVLM
      分别报告两种指标
    type: process
    size: xl
    position:
      x: 3100
      'y': 440
  - id: prompt
    label: |-
      构建图像问题提示
      插入两至四个选项
      声明仅有一个正确答案
      要求只选择一个选项
    type: process
    size: xl
    position:
      x: 2820
      'y': 440
  - id: score_gate
    label: |-
      选择评测路线
      生成回答或选项似然
    type: decision
    size: xl
    position:
      x: 2540
      'y': 440
  - id: qa_score
    label: |-
      计算问答分数
      生成自由文本回答
      与候选项计算相似度
      选择最相似选项
    type: process
    size: xl
    position:
      x: 2180
      'y': 300
  - id: prefix_score
    label: |-
      计算前缀分数
      把视觉特征前缀到文本嵌入
      逐问题选项计算分数
      选择最高似然选项
    type: process
    size: xl
    position:
      x: 2180
      'y': 600
  - id: ground_truth
    label: |-
      对照标准答案
      判断所选选项
      计算问答准确率
      分别保留两种分数
    type: process
    size: xl
    position:
      x: 1820
      'y': 440
  - id: report
    label: |-
      报告零样本准确率
      按五类问题与总体汇总
      分模态报告结果
      区分全量表与仅开放数据表
    type: terminal
    size: xl
    position:
      x: 1500
      'y': 440
  - id: access_boundary
    label: |-
      访问与许可边界
      全量基准含 42 个开放 + 31 个受限源
      受限图像需要另行获取
      每个源数据集许可仍然适用
    type: document
    size: xl
    position:
      x: 980
      'y': 240
  - id: snapshot_boundary
    label: |-
      Hugging Face 快照边界
      修订 1ba51c28fc07 · 无门禁
      ZIP SHA-256 12245e0f99af
      未独立重计 10.7 GB 载荷
    type: document
    size: xl
    position:
      x: 980
      'y': 480
  - id: code_boundary
    label: |-
      发布代码边界
      Git bd2999a3be2b · 分模型脚本
      需要本地数据路径与模型权重
      宽泛异常处理可能跳过推理行
    type: document
    size: xl
    position:
      x: 980
      'y': 720
