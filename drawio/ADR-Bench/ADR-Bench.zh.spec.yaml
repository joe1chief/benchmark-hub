meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ADR-Bench 构建流程
  description: 基于 arXiv:2512.20491 对齐的 ADR-Bench 构建与评估流程。
  legend: 实线表示 query 构建和报告评估主流程；虚线表示 review、修订，以及通用/专业领域差异化评估路径。
nodes:
  - id: scenarios
    label: |-
      真实用户场景
      商业研究
      政策、软件、法律、金融
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: query_draft
    label: |-
      专家起草 query
      领域专家编写
      初始中文任务
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: filtering
    label: |-
      多轮测试
      筛选并修订 query
      保证适合 Deep Research
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: tracks
    label: |-
      评估双轨
      通用领域
      金融与法律专业领域
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: human_eval
    label: |-
      通用领域人工评审
      双盲配对比较
      四个质量子维度
    type: user
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_rubrics
    label: |-
      专业领域 rubrics
      专家设计任务和标准
      多轮交叉验证
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: reports
    label: |-
      模型研究报告
      每个 query 生成报告
      按对应协议评分
    type: process
    size: xl
    position:
      x: 1080
      'y': 160
  - id: ranking
    label: |-
      ADR-Bench 结果
      Elo 评分与维度分
      Deep Research 能力排名
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: scenarios
    to: query_draft
    type: primary
  - from: query_draft
    to: filtering
    type: data
    label: 初稿 queries
  - from: filtering
    to: query_draft
    type: optional
    label: 修订不适合任务
  - from: filtering
    to: tracks
    type: primary
    label: 最终 query 集
  - from: tracks
    to: human_eval
    type: primary
  - from: tracks
    to: expert_rubrics
    type: primary
  - from: human_eval
    to: reports
    type: data
  - from: expert_rubrics
    to: reports
    type: data
  - from: reports
    to: ranking
    type: primary
modules: []
