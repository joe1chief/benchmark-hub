meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TiC-LM 构建与评测流程
  description: >-
    TiC-LM用resiliparse处理2013年5月至2024年7月的114个月度Common
    Crawl转储，采用RefinedWeb式过滤，并只在每个月内部执行模糊去重，确保未来数据不会影响过去；同时刻意不使用依赖未来数据训练的质量分类器。最终形成2.9万亿token的TiC-CC训练语料，以及按时间组织的CC、Wikipedia、新闻、StackExchange和代码文档评测。持续模型按月顺序学习，可结合回放或正则化，并与周期性重训oracle比较；指标包括时间困惑度、后向/同分布/前向性能、遗忘与迁移，以及静态DCLM
    Core任务。
  legend: 来源：TiC-LM arXiv:2504.02107, Sections 2-4; official apple/ml-tic-lm repository。实线箭头表示论文或官方资料明确支持的主流程。
