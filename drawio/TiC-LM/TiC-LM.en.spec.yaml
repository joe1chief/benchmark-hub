meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: TiC-LM Build and Evaluation Process
  description: >-
    TiC-LM processes 114 monthly Common Crawl dumps from May 2013 through July 2024 with resiliparse, RefinedWeb-style
    filtering, and fuzzy deduplication confined within each month so future data cannot affect the past. It deliberately
    avoids a future-dependent learned quality classifier. The result is the 2.9-trillion-token TiC-CC training corpus
    plus chronological CC, Wikipedia, news, StackExchange, and code-documentation evaluations. Continual models consume
    months in order, optionally with replay or regularization, and are compared with periodic-retraining oracles.
    Evaluation reports temporal perplexity, backward/in-distribution/forward performance, forgetting and transfer, plus
    static DCLM Core tasks.
  legend: >-
    Source: TiC-LM arXiv:2504.02107, Sections 2-4; official apple/ml-tic-lm repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
