meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: "SPEED-Bench 构建与评测流程"
  description: "SPEED-Bench由质量集、吞吐集和统一测量框架组成。质量集把18个公开来源归入11类，用text-embedding-3-large嵌入候选提示，并通过贪心选择与局部交换最小化两两相似度，每类保留80条，共880条。吞吐集从8个真实数据来源抽样，按低熵、混合熵和高熵分组，再通过截断或中性后缀填充构造1k、2k、8k、16k和32k输入长度桶；每个桶的每一类含512条。框架在SGLang、vLLM和TensorRT-LLM外部统一分词和提示格式，并发发起请求，报告条件接受率、接受长度、总体TPS、用户TPS、延迟与加速比。"
  legend: "来源：SPEED-Bench arXiv:2604.09557 Sections 4-7 and Appendix B; official nvidia/SPEED-Bench dataset and measurement framework。实线箭头表示论文或官方资料明确支持的主流程。"
