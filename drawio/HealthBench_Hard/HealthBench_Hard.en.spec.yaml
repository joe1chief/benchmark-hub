meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthBench Hard Build Process
  description: Paper-, release-, and runner-aligned selection of HealthBench Hard plus the inherited signed-rubric scoring path.
  legend: >-
    Solid arrows show disclosed construction and evaluation. Dashed arrows identify pinned evidence and the
    public/private artifact boundary; optional later runner flags are not part of the paper protocol.
nodes:
  - id: evidence
    label: |-
      Primary evidence
      arXiv:2505.08775v1
      data 40ee1968 · runner 652c89d0
    type: document
    size: xl
    position:
      x: 40
      'y': 96
  - id: full
    label: |-
      Full HealthBench source
      5,000 conversations · 48,562 criteria
      signed points −10 to 10
    type: database
    size: xl
    position:
      x: 304
      'y': 96
  - id: models
    label: |-
      Five provider models
      o3 · Grok 3 · Gemini 2.5 Pro
      Claude 3.7 extended thinking
      Llama 4 Maverick
    type: process
    size: xl
    position:
      x: 568
      'y': 96
  - id: score_candidates
    label: |-
      Score every example
      grade each criterion met / not met
      signed sum / positive maximum
    type: process
    size: xl
    position:
      x: 832
      'y': 96
  - id: all_zero
    label: |-
      Drop no-positive-score cases
      no model earns a positive score
      about 1.5% removed
    type: process
    size: xl
    position:
      x: 1096
      'y': 96
  - id: average
    label: |-
      Average across providers
      avoid one-family adversarial selection
      take the lowest 1,000
    type: process
    size: xl
    position:
      x: 1360
      'y': 96
  - id: hard_set
    label: |-
      Public HealthBench Hard rows:
      release 2025-05-08-21-00-10
      SHA: b0320430 · 1,000 rows
    type: database
    size: xl
    position:
      x: 1624
      'y': 96
  - id: inference
    label: |-
      Generate evaluated response
      full conversation in context
      answer the final user message
    type: process
    size: xl
    position:
      x: 1624
      'y': 384
  - id: grade
    label: |-
      Reference rubric grader
      GPT-4.1-2025-04-14
      criterion-by-criterion JSON boolean
    type: process
    size: xl
    position:
      x: 1360
      'y': 384
  - id: example_score
    label: |-
      Raw example score
      sum met signed points / positive maximum
      negative criteria can lower the score
    type: process
    size: xl
    position:
      x: 1096
      'y': 384
  - id: aggregate
    label: |-
      HealthBench Hard score
      mean over 1,000 · clip to [0,1]
      axis slices use the same rule
    type: terminal
    size: xl
    position:
      x: 832
      'y': 384
  - id: artifact_boundary
    label: |-
      Artifact boundary
      selection score matrix not in public rows
      small private held-out set retained
      optional GPT-5.4/length flags added later
    type: document
    size: xl
    position:
      x: 568
      'y': 384
