meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Claw-Eval 构建流程
  description: 与论文 v3 及固定官方发布对齐的 Claw-Eval 流程：原创与兼容任务先完成环境和评分项实现，再经第二位作者复核与前沿模型试跑，最后进入三阶段可审计评测协议。
  legend: 实线表示构建与评测主流程；执行结束后，三类证据才汇入评审阶段。
nodes:
  - id: evidence_boundary
    label: |-
      论文与固定官方发布
      arXiv 2604.06132v3 §§3.1–3.3
      GitHub d3f02d4
      HF 数据集 ca978fd
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: original
    label: |-
      编写原创任务
      300 项中的 250 项 • 83.3%
      覆盖三类任务组
      定义能力与提示
    type: database
    size: xl
    position:
      x: 340
      'y': 40
  - id: compatibility
    label: |-
      改编 50 项兼容任务
      OfficeQA 10 • PinchBench 14
      FinanceQA 12 • OneMillion 5
      Video-MME 5 • LongVideo 4
      保留原提示与评分标准
    type: database
    size: xl
    position:
      x: 340
      'y': 400
  - id: task_design
    label: |-
      逐项定义任务
      目标能力与提示
      所需工具／资产
      起草初始评分计划
    type: document
    size: xl
    position:
      x: 640
      'y': 220
  - id: environment
    label: |-
      实现运行环境
      沙箱资产 • 模拟服务
      按需配置模拟用户
      接入三阶段生命周期
    type: process
    size: xl
    position:
      x: 940
      'y': 80
  - id: rubrics
    label: |-
      形式化评分项
      确定性检查
      LLM／VLM 判断项
      每项绑定可观测证据
    type: process
    size: xl
    position:
      x: 940
      'y': 360
  - id: review_pilot
    label: |-
      第二位作者复核
      正确性 • 完整性 • 泄漏
      用多个前沿模型试跑
      修订或移除未通过任务
    type: user
    size: xl
    position:
      x: 1240
      'y': 220
  - id: release
    label: |-
      发布 300 项人工核验任务
      通用 161 • 多模态 101
      多轮 38 • 9 个类别
      2,159 项评分 • 均值 7.2
    type: database
    size: xl
    position:
      x: 1540
      'y': 220
  - id: setup
    label: |-
      阶段 1：准备
      每次运行使用全新 Docker 沙箱
      注入任务资源
      隐藏评分产物
    type: process
    size: xl
    position:
      x: 1840
      'y': 220
  - id: execute
    label: |-
      阶段 2：执行
      系统工具 + 任务专属工具
      记录完整智能体上下文
      可选受控工具错误
    type: terminal
    size: xl
    position:
      x: 2140
      'y': 220
  - id: trace
    label: |-
      证据 1：执行轨迹
      工具调用 + 观察结果
      存在智能体视野之外
    type: document
    size: xl
    position:
      x: 2440
      'y': 20
  - id: audit_logs
    label: |-
      证据 2：服务审计日志
      真实请求 + 参数
      检测缺失／禁止副作用
    type: document
    size: xl
    position:
      x: 2440
      'y': 220
  - id: snapshot
    label: |-
      证据 3：环境快照
      文件 • 服务状态 • 产物
      执行后校验器输出
    type: document
    size: xl
    position:
      x: 2440
      'y': 420
  - id: judge
    label: |-
      阶段 3：评审
      终止后才注入评分器
      执行确定性与语义检查
      融合三类证据
    type: process
    size: xl
    position:
      x: 2740
      'y': 220
  - id: score
    label: |-
      0.8 完成度 + 0.2 鲁棒性
      再乘安全门控
      通过阈值 ≥ 0.75 • 三次试验
      平均分 • Pass@3 • Pass³
    type: terminal
    size: xl
    position:
      x: 3040
      'y': 220
