meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AInsteinBench Build Process
  description: >-
    Paper-aligned scientific coding benchmark construction and evaluation workflow for AInsteinBench, based on
    arXiv:2512.21373.
  legend: >-
    Solid arrows show repository-to-task construction and executable evaluation; dashed arrows mark feature-ablation and
    expert review feedback paths.
nodes:
  - id: repositories
    label: |-
      Scientific repositories
      PySCF, Qiskit, RDKit
      AMReX, OpenMM, Einstein Toolkit
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: pr_crawl
    label: |-
      Pull request crawl
      issue description, base commit
      fix patch and test updates
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: feature_ablation
    label: |-
      Feature task synthesis
      ablate scientific modules
      add test-relevant API docs
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: environment
    label: |-
      Environment rebuild
      historical dependencies
      isolated Docker tests
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: filtering
    label: |-
      Fail-to-pass filtering
      base pass, patched fail
      fixed patch pass
    type: decision
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_review
    label: |-
      Domain expert review
      scientific relevance
      test strength and difficulty tiers
    type: user
    size: xl
    position:
      x: 820
      'y': 250
  - id: dataset
    label: |-
      AInsteinBench tasks
      244 problems
      real PRs plus feature implementations
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: agent_eval
    label: |-
      Coding-agent evaluation
      inspect, edit, run tests
      solve rate and failure analysis
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: repositories
    to: pr_crawl
    type: primary
  - from: repositories
    to: feature_ablation
    type: data
  - from: pr_crawl
    to: environment
    type: primary
  - from: feature_ablation
    to: environment
    type: data
  - from: environment
    to: filtering
    type: primary
  - from: filtering
    to: expert_review
    type: primary
  - from: expert_review
    to: filtering
    type: optional
    label: strengthen or relax tests
  - from: expert_review
    to: dataset
    type: primary
  - from: dataset
    to: agent_eval
    type: primary
modules: []
