meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SoMe Build and Evaluation Process
  description: >-
    SoMe defines eight social-media agent tasks in post-centered, user-centered, and comprehensive classes. It collects
    public data from 32 social platforms and external sites through commercial data, Weibo crawling, and open datasets,
    yielding 9,164,284 posts, 6,591 user profiles, and 25,686 fact-check reports. Qwen2.5-VL-72B produces image and
    video captions and OCR; GPT-4o produces ASR transcripts. Template rules derive queries and ground truths for
    user-behavior prediction, comment simulation, and recommendation without editing the observed outcomes. Qwen3-32B
    supports multi-round human-LLM annotation for event detection, streaming summarization, emotion analysis, and social
    QA, while misinformation data merges LIAR-RAW and RAWFC. Ten professional annotators manually filter and verify all
    generated ground truths. The final set has 17,869 queries. A platform exposes eight MCP-compatible tools for data
    access and analysis. Agents receive task queries, call tools, and reason over noisy long-context social data. Three
    open-ended tasks use LLM semantic comparison; the other five use LLM extraction followed by ground-truth accuracy.
    All tasks report normalized scores and task completion rate, then average across the eight tasks.
  legend: >-
    Source: SoMe arXiv:2512.14720 Section 3, Tables 1-2, Section 4, and Appendices; official LivXue/SoMe repository.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
