meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIG-Bench Hard 构建流程
  description: 基于 arXiv:2210.09261v1，展示真正 BBH 的任务筛选、数据打包、人工 CoT 示例、直接作答与 CoT 并行评测、答案抽取和精确匹配聚合。
  legend: 上行构建 BBH；下方两支并行比较直接作答与思维链提示。
nodes:
  - id: bigbench
    label: |-
      BIG-Bench 评测池
      209 个评测任务
      数据与元数据覆盖不均
    type: database
    size: xl
    position:
      x: 40
      'y': 140
  - id: structure_filter
    label: |-
      结构条件筛选
      移除 >3 子任务者：209 → 187
      移除 <103 样本者：187 → 130
    type: process
    size: xl
    position:
      x: 320
      'y': 140
  - id: baseline_filter
    label: |-
      可比较评测任务
      要求人类基线：130 → 85
      保留选择题 / 精确匹配：85 → 78
    type: process
    size: xl
    position:
      x: 600
      'y': 140
  - id: hardness_filter
    label: |-
      难度与范围复核
      移除模型超过人类者：78 → 36
      移除 13 个极难 / 超范围者：36 → 23
    type: process
    size: xl
    position:
      x: 880
      'y': 140
  - id: dataset
    label: |-
      打包 BIG-Bench Hard
      23 个任务 • 27 个子任务
      6,511 个评测样本
    type: database
    size: xl
    position:
      x: 1160
      'y': 140
  - id: examples
    label: |-
      各任务样本数
      通常每任务 250 题
      例外：187 • 146 • 178 题
    type: document
    size: xl
    position:
      x: 1440
      'y': 140
  - id: human_cot
    label: |-
      人工 CoT 示例
      每任务三个
      推理过程 + 最终答案格式
    type: user
    size: xl
    position:
      x: 1720
      'y': 140
  - id: answer_only
    label: |-
      少样本直接作答提示
      使用同一批 BBH 任务示例
      直接输出最终答案
    type: process
    size: xl
    position:
      x: 1560
      'y': 440
  - id: cot_prompt
    label: |-
      少样本思维链提示
      使用三个人工 CoT 示例
      先推理再给出最终答案
    type: process
    size: xl
    position:
      x: 1880
      'y': 440
  - id: decode
    label: |-
      PaLM • InstructGPT • Codex
      贪心解码 • 温度 = 0
      使用同一批评测样本
    type: process
    size: xl
    position:
      x: 1720
      'y': 700
  - id: extract
    label: |-
      确定性抽取
      读取 “the answer is” 之后的文本
      按任务归一化
    type: process
    size: xl
    position:
      x: 1440
      'y': 700
  - id: score
    label: |-
      BBH 评分
      精确匹配 + 任务准确率
      23 个任务无权平均
    type: process
    size: xl
    position:
      x: 1160
      'y': 700
  - id: report
    label: |-
      对比直接作答与 CoT
      对照平均人类表现
      分析模型规模效应
    type: terminal
    size: xl
    position:
      x: 880
      'y': 700
edges:
  - from: bigbench
    to: structure_filter
    type: primary
  - from: structure_filter
    to: baseline_filter
    type: primary
  - from: baseline_filter
    to: hardness_filter
    type: primary
  - from: hardness_filter
    to: dataset
    type: primary
  - from: dataset
    to: examples
    type: primary
  - from: examples
    to: human_cot
    type: primary
  - from: human_cot
    to: answer_only
    type: primary
    style:
      exitX: 0.25
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: human_cot
    to: cot_prompt
    type: primary
    style:
      exitX: 0.75
      exitY: 1
      entryX: 0.5
      entryY: 0
  - from: answer_only
    to: decode
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.25
      entryY: 0
  - from: cot_prompt
    to: decode
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.75
      entryY: 0
  - from: decode
    to: extract
    type: primary
  - from: extract
    to: score
    type: primary
  - from: score
    to: report
    type: primary
modules: []
