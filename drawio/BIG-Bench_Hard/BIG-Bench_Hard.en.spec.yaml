  title: BIG-Bench Extra Hard Build Process
  description: >-
    Paper-aligned construction of BIG-Bench Extra Hard as a successor to saturated BIG-Bench Hard, replacing 23 BBH
    tasks with harder counterparts, iterating against reference models, creating BBEH Mini, and evaluating with harmonic
    mean accuracy, based on arXiv:2502.19187.
  legend: Solid arrows show BBEH task construction and evaluation; dashed arrows mark semi-adversarial difficulty iteration.
