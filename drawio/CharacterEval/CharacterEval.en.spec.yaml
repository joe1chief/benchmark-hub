meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CharacterEval Build Process
  description: >-
    ACL-paper-aligned construction and evaluation of Chinese role-playing conversations: GPT-4 plot division and
    extraction, structural filtering, human quality control, profile and MBTI enrichment, the paper-version split,
    twelve subjective metrics judged by CharacterRM, and a separate MBTI personality back-test.
  legend: Solid arrows show construction and evaluation; dashed arrows carry profiles and human labels as data.
