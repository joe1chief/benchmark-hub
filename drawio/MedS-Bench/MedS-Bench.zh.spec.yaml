meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MedS-Bench 构建与评测流程
  description: 对齐论文与官方平台，展示把现有医学数据集整合为指令化临床任务、控制评测集泄漏、成本感知抽样、 任务专属指标及动态榜单的完整流程。
  legend: 论文 v2 内部存在冲突：第 2.1 节与图 1 写 28 个来源数据集、52 项任务，图 3 却写 39 个数据集；维护 README 也写 39，固定发布快照还有额外任务计数漂移。
nodes:
  - id: scope
    label: |-
      定义临床评测范围
      超越多项选择问答
      选择 11 类临床任务
      覆盖知识回忆与上下文检索
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: sources
    label: |-
      整合现有来源
      论文版包含 28 个数据集
      临床文本 · 考试 · 论文
      医学知识资源
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: tasks
    label: |-
      组织论文版基准
      11 个高层任务类别
      52 项不同任务
      约 30 万条样本
    type: database
    size: xl
    position:
      x: 500
      'y': 40
  - id: format
    label: |-
      重构每个数据集
      转为指令提示问答结构
      规范化输入与输出
      保留原数据集语义
    type: process
    size: xl
    position:
      x: 740
      'y': 40
  - id: definitions
    label: |-
      手工编写任务定义
      说明所需输出
      提供统一指令合同
      支持异构临床任务
    type: user
    size: xl
    style:
      fontSize: 9
    position:
      x: 980
      'y': 40
  - id: skills
    label: |-
      分类所需能力
      八类需回忆模型知识
      三类从给定上下文检索
      记录任务与词元统计
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: split
    label: |-
      建立评测划分
      使用现有训练测试划分
      否则随机按 9 比 1 划分
      保留测试部分
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: leakage
    label: |-
      防止提示泄漏
      示例中排除测试样本
      从训练数据抽取演示
      测试标准答案保持隐藏
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: sample
    label: |-
      构建评测切片
      多选题使用完整测试集
      对其他大型基准做成本抽样
      指定场景约抽 1,500 条
    type: process
    size: xl
    position:
      x: 1220
      'y': 420
  - id: dataset
    label: |-
      定稿论文版 MedS-Bench
      11 类临床任务
      28 个来源数据集 · 52 项任务
      指令与标准答案记录
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: models
    label: |-
      评测六个主流大模型
      GPT-4 · Claude-3.5
      Llama 3 · Mistral · InternLM 2
      医学模型 MEDITRON
    type: process
    size: xl
    position:
      x: 740
      'y': 420
  - id: prompts
    label: |-
      保留提示合同冲突
      第 2.3 节：多选零样本，其余三样本
      附录 A.1：全部评测均为三样本
      固定 eval.py 默认：三样本
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: metrics
    label: |-
      按输出合同评分
      封闭决策使用准确率
      标签任务用精确率召回率与 F1
      生成任务用 BLEU 与 ROUGE
    type: process
    size: xl
    position:
      x: 260
      'y': 420
  - id: platform
    label: |-
      维护动态榜单
      提交模型或 Hugging Face 链接
      或提交结果 CSV
      扩展并刷新测试集
    type: terminal
    size: xl
    position:
      x: 20
      'y': 420
  - id: count_boundary
    label: |-
      计数与发布边界
      论文第 2.1 节/图 1：28 数据集 · 52 任务
      论文图 3 与 README：39 数据集
      SPLIT 53 个任务文件 · HF main 32 个
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 980
      'y': 760
  - id: prompt_boundary
    label: |-
      提示复现边界
      论文不同章节的多选样本数冲突
      固定代码不会自动选择零样本
      必须显式记录实际评测样本设置
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 500
      'y': 760
  - id: rights_boundary
    label: |-
      访问与权利边界
      代码 LICENSE 声明 CC BY-SA
      README 无许可声明
      HF 基准卡无许可字段 · 来源条款仍适用
    type: document
    size: xl
    position:
      x: 20
      'y': 760
edges:
  - from: scope
    to: sources
    type: primary
  - from: sources
    to: tasks
    type: primary
  - from: tasks
    to: format
    type: primary
  - from: format
    to: definitions
    type: primary
  - from: definitions
    to: skills
    type: primary
  - from: skills
    to: split
    type: primary
  - from: split
    to: leakage
    type: primary
  - from: leakage
    to: sample
    type: primary
  - from: sample
    to: dataset
    type: primary
  - from: dataset
    to: models
    type: primary
  - from: models
    to: prompts
    type: primary
  - from: prompts
    to: metrics
    type: primary
  - from: metrics
    to: platform
    type: primary
  - from: dataset
    to: count_boundary
    type: secondary
    style:
      dashed: true
  - from: prompts
    to: prompt_boundary
    type: secondary
    style:
      dashed: true
  - from: platform
    to: rights_boundary
    type: secondary
    style:
      dashed: true
modules: []
