meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: HealthSearchQA 构建流程
  description: 对齐 arXiv 预印本、Nature 最终论文和官方仅问题补充表的版本化构建与抽样人工评测流程。
  legend: 实线表示构建和评测；虚线表示固定版本证据、预印本到最终版的修订以及独立的非医学评分分支。
nodes:
  - id: evidence
    label: |-
      一手证据
      arXiv:2212.13138v1
      Nature s41586-023-06291-2
      ESM SHA a89f6639
    type: document
    size: xl
    position:
      x: 40
      'y': 360
  - id: seeds
    label: |-
      消费者健康种子表
      医学病症 + 症状
    type: document
    size: xl
    position:
      x: 304
      'y': 360
  - id: retrieve
    label: |-
      公开搜索引擎生成问题
      所有用户输入种子词时展示
    type: process
    size: xl
    position:
      x: 568
      'y': 360
  - id: preprint
    label: |-
      arXiv v1 快照
      3,375 条仅问题查询
      人评区间：100 次 bootstrap
    type: document
    size: xl
    position:
      x: 832
      'y': 360
  - id: artifact_boundary
    label: |-
      Nature 最终修订
      3,173 条问题 · 1,000 次 bootstrap
      取代预印本计数
    type: document
    size: xl
    position:
      x: 1096
      'y': 360
  - id: release
    label: |-
      官方 ESM 工作簿
      全部 3,173 题 · 研究样本 140 题
      仅问题 · 无答案
    type: database
    size: xl
    position:
      x: 1360
      'y': 360
  - id: sample
    label: |-
      不重叠人工研究样本
      100 HealthSearchQA · 20 LiveQA
      20 MedicationQA · 与调优集不重叠
    type: process
    size: xl
    position:
      x: 1624
      'y': 360
  - id: answers
    label: |-
      比较答案来源
      医生参考 · Flan-PaLM
      Med-PaLM 回答
    type: process
    size: xl
    position:
      x: 1888
      'y': 360
  - id: blind
    label: |-
      盲法临床审核
      评分时来源隐藏
      9 名医生之一评每个答案
    type: user
    size: xl
    position:
      x: 2152
      'y': 360
  - id: clinician_axes
    label: |-
      医生评分 · 12 轴
      共识 · 伤害 · 理解
      偏差及其他安全与质量轴
    type: process
    size: xl
    position:
      x: 2416
      'y': 96
  - id: lay_axes
    label: |-
      普通用户评分
      5 名非医学评分者
      意图匹配 · 帮助程度
    type: user
    size: xl
    position:
      x: 2416
      'y': 624
  - id: bootstrap
    label: |-
      研究估计
      1,000 次 bootstrap
      95% 百分位区间
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 360
edges:
  - from: evidence
    to: seeds
    type: data
  - from: seeds
    to: retrieve
    type: primary
  - from: retrieve
    to: preprint
    type: primary
  - from: preprint
    to: artifact_boundary
    type: data
  - from: artifact_boundary
    to: release
    type: primary
  - from: release
    to: sample
    type: primary
  - from: sample
    to: answers
    type: primary
  - from: answers
    to: blind
    type: primary
  - from: blind
    to: clinician_axes
    type: primary
  - from: blind
    to: lay_axes
    type: secondary
  - from: clinician_axes
    to: bootstrap
    type: primary
  - from: lay_axes
    to: bootstrap
    type: secondary
modules: []
