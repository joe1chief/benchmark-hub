meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AGIEval 构建流程
  description: 基于 arXiv:2304.06364 对齐的 AGIEval 基准构建与评估流程。
  legend: 实线表示考试题到基准构建和模型评估主流程；虚线表示题型过滤和人类表现参考路径。
nodes:
  - id: exam_pool
    label: |-
      官方考试池
      高考、SAT、LSAT
      GMAT、GRE、AMC、AIME
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: exam_selection
    label: |-
      考试选择
      标准化高质量考试
      强调人类推理和真实场景
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: objective_filter
    label: |-
      客观题过滤
      移除主观题
      保留选择题和填空题
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: data_collection
    label: |-
      数据来源收集
      公开考试题源
      LSAT、LogiQA、MATH、JEC-QA
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: dataset
    label: |-
      AGIEval 数据集
      8,062 道题
      中英双语覆盖
    type: database
    size: xl
    position:
      x: 820
      'y': 160
  - id: human_baselines
    label: |-
      人类表现基线
      平均和顶尖考生
      缩放到任务分数
    type: user
    size: xl
    position:
      x: 1080
      'y': 70
  - id: model_eval
    label: |-
      模型评估
      零样本、少样本
      chain-of-thought 提示
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: metrics_release
    label: |-
      结果与发布
      accuracy、EM、F1
      公开输出和代码
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: exam_pool
    to: exam_selection
    type: primary
  - from: exam_selection
    to: objective_filter
    type: data
    label: 选定考试
  - from: objective_filter
    to: exam_selection
    type: optional
    label: 移除主观题
  - from: objective_filter
    to: data_collection
    type: primary
  - from: data_collection
    to: dataset
    type: primary
  - from: dataset
    to: human_baselines
    type: data
  - from: dataset
    to: model_eval
    type: primary
  - from: human_baselines
    to: metrics_release
    type: data
  - from: model_eval
    to: metrics_release
    type: primary
modules: []
