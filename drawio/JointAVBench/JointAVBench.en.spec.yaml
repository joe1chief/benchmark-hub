meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: JointAVBench Build Process
  description: >-
    Paper-v2-aligned construction from 1,046 usable SF20K films through separate visual and audio caption lanes,
    task-conditioned QA synthesis, four general and three task-specific checks, human rating and correction, label
    auditing, and the official multiple-choice evaluation protocol.
  legend: >-
    Solid arrows follow the construction and evaluation path; dashed data arrows mark evidence, release, and drift
    boundaries. Paper v2 is the protocol authority, while fixed Git and Hugging Face revisions bound public artifacts.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Fixed Revisions
      arXiv:2512.12772v2 · 14 May 2026
      ICLR 2026 · OpenReview Zg1YH8R5GG
      Git dbd84e1 · HF ae27ad8
      Paper v2 Is Protocol Authority
    type: document
    size: xl
    position:
      x: 20
      'y': 20
  - id: taxonomy
    label: |-
      Define Strict Joint-AV Taxonomy
      15 Tasks · 5 Cognitive Dimensions
      4 Audio Types · 3 Scene Spans
      Every Answer Requires Audio + Video
    type: document
    size: xl
    position:
      x: 300
      'y': 20
  - id: films
    label: |-
      Curate SF20K Film Sources
      1,072 Professionally Produced Movies
      Remove Unavailable + Grayscale Videos
      Retain 1,046 Usable Films
    type: database
    size: xl
    position:
      x: 580
      'y': 20
  - id: scenes
    label: |-
      Identify Coherent Scenes
      PySceneDetect Splits Long Videos
      Merge Highly Similar Neighbors
      Preserve Rich Within-scene Context
    type: process
    size: xl
    position:
      x: 860
      'y': 20
  - id: visual
    label: |-
      Visual-caption Lane
      Qwen2.5-VL · 1 fps · Every Scene
      Static Objects + Characters
      Motion + Shot Transitions
    type: process
    size: xl
    position:
      x: 1140
      'y': 0
  - id: audio_base
    label: |-
      Audio-caption Lane
      Whisper-v3 Speech + Precise Timestamps
      Qwen2.5-Omni: Vocal / Sound / Music
      Sound + Music Initially Co-generated
    type: process
    size: xl
    position:
      x: 1140
      'y': 340
  - id: audio_refine
    label: |-
      Qwen2.5 Audio Refinement
      Separate Music from Sound Events
      Align Vocal Traits with Transcripts
      Remove Hallucination + Redundancy
    type: process
    size: xl
    position:
      x: 1420
      'y': 340
  - id: qa
    label: |-
      Task-conditioned Qwen2.5 QA
      Templates for Temporal / Plot Relations
      LLM Curation for General Tasks
      Question + Answer + Brief Explanation
    type: process
    size: xl
    position:
      x: 1700
      'y': 170
  - id: scope
    label: |-
      Enforce Task Inputs and Span
      Only Required Scene + Modality Descriptions
      Single / Multi: High-quality Scenes Only
      Full-scene: All Scene Descriptions
      Verify Multi-scene Information Intervals
    type: process
    size: xl
    position:
      x: 1980
      'y': 170
  - id: qa_pool
    label: |-
      Collected QA Pool
      9,109 QA Pairs
      Question · Answer · Explanation
    type: database
    size: xl
    position:
      x: 2260
      'y': 170
  - id: general_qc
    label: |-
      General QC · Qwen2.5 CoT
      Input: QA Pair + Explanation Only
      Modality · Format · Content · Speculation
      Reject Uni-modal or Unsupported Answers
    type: process
    size: xl
    position:
      x: 2540
      'y': 20
  - id: specific_qc
    label: |-
      Task-specific QC
      Sequence Check: VSSR / MPO
      Ambiguity Check: SPL / SOER
      Audio-signal Check: Sound Event / Music
    type: process
    size: xl
    position:
      x: 2540
      'y': 340
  - id: distractors
    label: |-
      Generate after QA Filtering
      Three Plausible Incorrect Distractors
      Wrong Detail · Temporal / Spatial Shift
      Form Four-option MCQs
    type: process
    size: xl
    position:
      x: 2820
      'y': 170
  - id: automated
    label: |-
      Three-stage Automated Output
      3,974 Four-option MCQs
      Question · Explanation · Video / Segment
    type: database
    size: xl
    position:
      x: 3100
      'y': 170
  - id: human_rating
    label: |-
      Human Annotator Rating + Correction
      Answer + Information Correctness
      Audio-visual Dependency + Difficulty
      If Gold Is a Distractor, Correct the Label
    type: user
    size: xl
    position:
      x: 3100
      'y': 650
  - id: human_filter
    label: |-
      Human Retention Decision
      Accepted: Retain Directly
      Pending: Select Further by Ratings
      Discard Wrong Answers; Then Other Criteria
      17.4% Removed for Incorrect Answers
    type: process
    size: xl
    position:
      x: 2820
      'y': 650
  - id: label_audit
    label: |-
      Post-audit Answer-label Refinement
      Strong External LLM Selects Independently
      Majority with Original Human Annotation
      No Majority → Keep Human Label
      No Removal; Recompute Reported Results
    type: process
    size: xl
    position:
      x: 2540
      'y': 650
  - id: dataset
    label: |-
      Audited JointAVBench
      2,853 MCQs · 71.8% Retained
      Mean Video Duration: 97.2 Seconds
      15 Tasks · Audio Type · Scene Span
    type: database
    size: xl
    position:
      x: 2260
      'y': 650
  - id: eval_setup
    label: |-
      Paper Evaluation Protocol
      Randomly Shuffle Four Options
      Question Text Only · Unified 32 Frames
      Official Model Defaults Where Applicable
    type: process
    size: xl
    position:
      x: 1980
      'y': 650
  - id: parser
    label: |-
      Git dbd84e1 Output Parser
      Collect Regex / Prefix / Option-text Matches
      One-word Fallback · Unique A–D Only
      Exact Match to Shuffled Gold Prefix
    type: process
    size: xl
    position:
      x: 1700
      'y': 650
  - id: report
    label: |-
      Report Accuracy
      Overall + Per Task
      Per Audio Type + Scene Span
    type: terminal
    size: xl
    position:
      x: 1420
      'y': 650
  - id: artifact_boundary
    label: |-
      Gated Dataset / Video Boundary
      HF ae27ad: Research or Education Use
      Low-resolution Clips + YouTube Originals
      No Standalone Clip Redistribution
      HF Card Metadata: CC BY-SA 4.0
    type: document
    size: xl
    position:
      x: 860
      'y': 650
  - id: drift
    label: |-
      Paper / Code / Metadata Drift
      Paper Appendix H: CC BY-NC-SA 4.0
      Git dbd84e1 Code: Apache 2.0
      README Top 56.2% Is Stale
      Paper v2 Reports 65.3% · Authority
    type: document
    size: xl
    position:
      x: 580
      'y': 650
