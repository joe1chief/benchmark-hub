meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VoiceBench — 语音数据构建、鲁棒性与指标流程
  description: >-
    VoiceBench 论文 v3 改造七个能力数据集，样本数分别为636/200/553/455/3,074/345/520。能力评测与鲁棒性评测是并行的基准组成部分。CommonEval 和 SD-QA
    使用真实口语指令；仅合成能力路径会由 GPT-4o 规范化 TTS 文本、用 Google TTS 生成音频、人工核验正确性与30秒时长限制，并在需要时改写文本。鲁棒性种子受来源约束：AlpacaEval
    提供速度、年龄、音量、音高、环境、内容错误与合成口音变体（使用 Google/Melo TTS），SD-QA 提供真实口音语音。评测比较真实文本输入（T.）与语音输入（S.），并使用任务特定指标。论文报告 Overall
    列，但论文和官方评测代码都未公开其聚合公式。
  legend: >-
    来源：arXiv:2410.17196v3, Sections 3.1-3.2, Tables 2-3, and the official repository
    https://github.com/MatthewCYM/VoiceBench. The paper defines capability and robustness as parallel benchmark
    components. GPT-4o text normalization, Google TTS, manual correctness validation, rewriting when needed, and the
    30-second cap apply to the synthetic path; CommonEval and SD-QA use real speech. Table 3 reports an Overall column,
    but neither the paper nor the official evaluation code publishes its aggregation formula.。实线箭头表示论文或官方资料明确支持的主流程。
