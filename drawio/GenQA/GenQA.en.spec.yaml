      arXiv:2512.13961v2
      OLMES repo 5a51f502
    type: document
    size: xl
    position:
      x: 40
      'y': 300
  - id: pool
    label: |-
      Pool 23K benchmark scores
      70 external open-weight models
      compare task-level model rankings
    type: database
    size: xl
    position:
      x: 300
      'y': 300
  - id: cluster
    label: |-
      Ward hierarchical clustering
      merge evaluations that rank models alike
    type: process
    size: xl
    position:
      x: 560
      'y': 300
  - id: align
    label: |-
      Align clusters with task format
      split single-token MC into STEM/non-STEM
    type: process
    size: xl
    position:
      x: 820
      'y': 300
  - id: rc_branch
    label: |-
      Rank-choice / continuation branch
      HellaSwag · WinoGrande · LAMBADA
      BasicSkills nested six-subtask suite
    type: process
    size: xl
    position:
      x: 1080
      'y': 80
  - id: gen_branch
    label: |-
      Generative short-answer branch
      DROP · Jeopardy · NaturalQs
      SQuAD · CoQA
    type: process
    size: xl
    position:
      x: 1080
      'y': 520
  - id: eval_rc
    label: |-
      Run rank-choice / continuation
      5-shot; LAMBADA 0-shot greedy
      per-char · raw · per-token variants
    type: process
    size: xl
    position:
      x: 1340
      'y': 80
  - id: eval_gen
    label: |-
      Generate short answers
      5-shot; CoQA uses 0-shot context
      T 0 · top-p 1 · max 100/50 tokens
    type: process
    size: xl
    position:
      x: 1340
      'y': 520
  - id: task_score
    label: |-
      Score nine suite entries
      rank/continuation: accuracy variant
      short answers: F1 vs answer banks
      BasicSkills: macro over six subtasks
    type: process
    size: xl
    position:
      x: 1640
      'y': 300
  - id: macro
    label: |-
      Macro-average the nine entries
      report OlmoBaseEval GenQA
