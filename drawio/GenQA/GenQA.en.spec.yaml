    type: terminal
    size: xl
    position:
      x: 1900
      'y': 300
  - id: limitation
    label: |-
      Published boundary
      answer banks can miss valid answers
      Gen2MC is separate from GenQA
      no standalone GenQA dataset
    type: document
    size: xl
    position:
      x: 2160
      'y': 300
