meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OlmoBaseEval GenQA Build Process
  description: Source-aligned clustering, nine-entry suite assembly, task-specific evaluation, and macro aggregation.
  legend: >-
    Dashed arrows mark evidence or a published limitation; solid arrows follow the Olmo 3 report and OLMES
    olmo3:base:gen configuration. GenQA is a capability cluster, not a standalone dataset.
nodes:
