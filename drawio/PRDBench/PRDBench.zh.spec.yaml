meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PRDBench 构建与评测流程
  description: 对齐论文 v3 的智能体驱动 PRD 构建、至少五轮人机修订、专用 PRDJudge 训练，以及开发到调试的评测闭环， 并显式标注固定发布计数与开放边界。
  legend: 实线表示论文披露的构建、评判器训练或评测步骤；虚线表示固定证据及发布、模型或接口边界，不是额外流程步骤。
nodes:
  - id: source_evidence
    label: |-
      固定官方证据
      arXiv 2510.24358v3
      PDF c9b6ac8d4e97
      Git 050bbcbd1332
      HF 9eaa70817b22
    type: document
    size: xl
    style:
      fontSize: 9
    position:
      x: 20
      'y': 40
  - id: seed_sources
    label: |-
      筛选真实项目种子
      内部 AI 产品开发请求
      公开 CS 课程结课项目
      CS 学位论文复现任务
    type: database
    size: xl
    position:
      x: 280
      'y': 40
  - id: eligibility
    label: |-
      应用两条准入规则
      可完全使用 Python 实现
      所有关联数据均公开
      保留真实场景多样性
    type: process
    size: xl
    position:
      x: 540
      'y': 40
  - id: domain_sampling
    label: |-
      领域标注与采样
      GPT-4 标注候选领域
      保证稀有领域覆盖
      选出 20 领域的 50 个任务
    type: process
    size: xl
    position:
      x: 800
      'y': 40
  - id: prd_initialization
    label: |-
      初始化标准化 PRD
      使用 Claude Code 等代码智能体
      写明需求与功能细节
      数据要求与接口
    type: document
    size: xl
    position:
      x: 1060
      'y': 40
  - id: aaa_outline
    label: |-
      生成指标大纲
      GPT-4.1 使用 AAA 方法
      Arrange 文件与环境
      Act 后 Assert 预期结果
    type: process
    size: xl
    position:
      x: 1320
      'y': 40
  - id: scaffold
    label: |-
      生成代码脚手架
      SOTA 代码智能体设计模块
      固定便于标注的接口
      算法实现可暂不完全正确
    type: process
    size: xl
    position:
      x: 1580
      'y': 40
  - id: criteria_scheme
    label: |-
      扩展评测标准方案
      细化每个评分点
      增加测试接口与工件
      命令及预期输出
    type: database
    size: xl
    position:
      x: 1840
      'y': 40
  - id: human_inspection
    label: |-
      人工测试检查
      在脚手架上运行测试
      检查接口兼容性
      核对输出是否符合 PRD
    type: process
    size: xl
    position:
      x: 2100
      'y': 40
  - id: repair_loop
    label: |-
      智能体修复与细化
      标注员提供定向反馈
      修改脚手架或评测标准
      再次执行人工检查
    type: process
    size: xl
    position:
      x: 2360
      'y': 40
  - id: inclusion_gate
    label: |-
      执行纳入门槛
      至少完成五轮修订
      所有检查问题均解决
      否则继续循环
    type: process
    size: xl
    position:
      x: 2620
      'y': 40
  - id: remove_scaffold
    label: |-
      移除生成脚手架
      保留 PRD 与评测标准方案
      保留测试工件和数据
      要求从零实现代码
    type: document
    size: xl
    position:
      x: 2880
      'y': 40
  - id: benchmark_release
    label: |-
      完成论文口径 PRDBench
      50 个 Python 项目·20 个领域
      论文 v3 共 1,258 个指标
      单测 408·交互 732·文件 118
    type: database
    size: xl
    style:
      fontSize: 9
    position:
      x: 3140
      'y': 40
  - id: development_round
    label: |-
      第一轮：开发
      读取 PRD 与详细测试计划
      在 src 中实现完整项目
      不提出中间问题
    type: process
    size: xl
    position:
      x: 3140
      'y': 560
  - id: judge_inputs
    label: |-
      PRDJudge 逐指标评测
      PRD + 详细测试计划
      提交代码 + 测试工件
      六种工具增强操作
    type: process
    size: xl
    position:
      x: 2880
      'y': 560
  - id: test_type_gate
    label: |-
      选择披露的测试类型
      原样执行测试命令
      比较日志、状态或文件
      形成指标证据
    type: process
    size: xl
    position:
      x: 2620
      'y': 560
  - id: unit_test
    label: |-
      单元测试分支
      运行给定 pytest 命令
      检查接口与断言
      论文 v3：408 个指标
    type: process
    size: xl
    position:
      x: 2360
      'y': 360
  - id: shell_interaction
    label: |-
      Shell 交互分支
      回放模拟用户输入
      比较实际与预期日志
      论文 v3：732 个指标
    type: process
    size: xl
    position:
      x: 2360
      'y': 560
  - id: file_comparison
    label: |-
      文件比较分支
      执行文件生成命令
      与参考结果比较
      论文 v3：118 个指标
    type: process
    size: xl
    position:
      x: 2360
      'y': 760
  - id: metric_report
    label: |-
      写入逐指标报告
      2 通过·1 部分通过·0 失败
      保留每项解释
      保存 round1 或 round2 JSONL
    type: document
    size: xl
    position:
      x: 2100
      'y': 560
  - id: debug_round
    label: |-
      第二轮：调试
      读取第一轮扣分报告
      针对失败标准修改代码
      重跑同一 PRDJudge 流程
    type: process
    size: xl
    position:
      x: 1840
      'y': 560
  - id: final_score
    label: |-
      报告 DEV 与 DEBUG 分数
      单项目为平均分除以 2
      对有效项目求平均
      比较调试增益
    type: terminal
    size: xl
    position:
      x: 1580
      'y': 560
  - id: judge_candidates
    label: |-
      收集评判轨迹
      Qwen3-Coder-480B-A3B 评判
      来自 11 个代码智能体
      每个智能体随机 8 个项目
    type: database
    size: xl
    position:
      x: 1840
      'y': 1080
  - id: human_labels
    label: |-
      建立人工真值
      两名标注员独立评分
      分歧交由资深标注员裁决
      三级分数：0、1、2
    type: process
    size: xl
    position:
      x: 2100
      'y': 1080
  - id: exact_match_filter
    label: |-
      按最终分数一致性过滤
      初始 2,147 条轨迹
      保留 1,742 条人工一致轨迹
      排除幻觉式推理
    type: process
    size: xl
    position:
      x: 2360
      'y': 1080
  - id: tool_filter
    label: |-
      应用规则化工具过滤
      移除过长轨迹
      移除无效工具调用
      最终保留 911 条轨迹
    type: process
    size: xl
    position:
      x: 2620
      'y': 1080
  - id: finetune_prdjudge
    label: |-
      微调 PRDJudge
      Qwen3-Coder-30B-A3B + LoRA
      秩 16·1 轮·学习率 2e-4
      预热 0.03·8 张 H800
    type: process
    size: xl
    style:
      fontSize: 9
    position:
      x: 2880
      'y': 1080
  - id: count_boundary
    label: |-
      固定发布计数边界
      Git/HF 快照实际为 1,259
      单测 408·交互 732·文件 119
      论文 v3 报告 1,258
    type: document
    size: xl
    position:
      x: 3140
      'y': 1480
  - id: code_boundary
    label: |-
      公开发布边界
      50 份 PRD、计划与测试工件
      Git 77f22c9b·HF 4994faf2
      README 声称 MIT 但无 LICENSE
      HF 卡片未声明许可证
    type: document
    size: xl
    position:
      x: 2880
      'y': 1480
  - id: model_boundary
    label: |-
      评判模型边界
      论文披露训练配方
      未发布 PRDJudge 检查点
      运行时依赖模型端点
    type: document
    size: xl
    position:
      x: 2360
      'y': 1480
edges:
  - from: source_evidence
    to: seed_sources
    type: secondary
    style:
      dashed: true
  - from: seed_sources
    to: eligibility
    type: primary
  - from: eligibility
    to: domain_sampling
    type: primary
  - from: domain_sampling
    to: prd_initialization
    type: primary
  - from: prd_initialization
    to: aaa_outline
    type: primary
  - from: aaa_outline
    to: scaffold
    type: primary
  - from: scaffold
    to: criteria_scheme
    type: primary
  - from: criteria_scheme
    to: human_inspection
    type: primary
  - from: human_inspection
    to: repair_loop
    type: primary
  - from: repair_loop
    to: inclusion_gate
    type: primary
  - from: inclusion_gate
    to: repair_loop
    type: primary
    waypoints:
      - x: 2740
        'y': 280
      - x: 2480
        'y': 280
  - from: inclusion_gate
    to: remove_scaffold
    type: primary
  - from: remove_scaffold
    to: benchmark_release
    type: primary
  - from: benchmark_release
    to: development_round
    type: primary
  - from: development_round
    to: judge_inputs
    type: primary
  - from: judge_inputs
    to: test_type_gate
    type: primary
  - from: test_type_gate
    to: unit_test
    type: primary
  - from: test_type_gate
    to: shell_interaction
    type: primary
  - from: test_type_gate
    to: file_comparison
    type: primary
  - from: unit_test
    to: metric_report
    type: primary
  - from: shell_interaction
    to: metric_report
    type: primary
  - from: file_comparison
    to: metric_report
    type: primary
  - from: metric_report
    to: debug_round
    type: primary
  - from: debug_round
    to: judge_inputs
    type: primary
    waypoints:
      - x: 1960
        'y': 940
      - x: 3000
        'y': 940
  - from: metric_report
    to: final_score
    type: primary
  - from: benchmark_release
    to: judge_candidates
    type: primary
    waypoints:
      - x: 3400
        'y': 100
      - x: 3400
        'y': 280
      - x: 3380
        'y': 1000
      - x: 1960
        'y': 1000
  - from: judge_candidates
    to: human_labels
    type: primary
  - from: human_labels
    to: exact_match_filter
    type: primary
  - from: exact_match_filter
    to: tool_filter
    type: primary
  - from: tool_filter
    to: finetune_prdjudge
    type: primary
  - from: finetune_prdjudge
    to: judge_inputs
    type: primary
  - from: development_round
    to: count_boundary
    type: secondary
    style:
      dashed: true
  - from: count_boundary
    to: code_boundary
    type: secondary
    style:
      dashed: true
  - from: finetune_prdjudge
    to: model_boundary
    type: secondary
    style:
      dashed: true
modules: []
