meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LongBench Build Process
  description: >-
    Paper-v2/ACL reconstruction of the original bilingual LongBench: six independently constructed task families, the
    standardized 4,750-example release, the 3,668-example even-length LongBench-E branch, and the pinned official
    prompt, truncation, post-processing, metric, and aggregation contract.
  legend: >-
    Solid arrows show paper-backed construction or evaluation flow. Dashed data arrows show the optional LongBench-E
    branch and release/version evidence. LongBench means the original 21-dataset benchmark; LongBench v2 is a separate
    503-question benchmark and is not imported into this process.
nodes:
  - id: evidence
    label: |-
      Freeze Original LongBench Evidence
      arXiv 2308.14508v2 · ACL 2024
      THUDM/LongBench @ 2e00731f
      HF Dataset @ 5e628be4
    type: document
    size: xl
    position:
      x: 40
      'y': 448
  - id: source_splits
    label: |-
      Fix Public-task Source Splits
      Paper: Public Tasks Use Test Sets
      VCSUM Is the Stated Exception
      Repo Note Says Validation or Test
    type: database
    size: xl
    position:
      x: 352
      'y': 448
  - id: route
    label: Route into Six Task Families
    type: decision
    size: xl
    position:
      x: 664
      'y': 448
  - id: single_doc
    label: |-
      Single-document QA · 750
      NarrativeQA 200 · Qasper 200
      MultiField EN 150 · ZH 200
      Reformat Public Data as Plain Text
      Three PhD Annotators Build MultiField
    type: process
    size: xl
    position:
      x: 976
      'y': 0
    style:
      fontSize: 9
  - id: multi_doc
    label: |-
      Multi-document QA · 800
      Hotpot · 2Wiki · MuSiQue: 200 Each
      2–4 Evidence + Full Passages + Distractors
      Randomize Passage Order
      DuReader 200 · Related + Arbitrary to 20 Docs
    type: process
    size: xl
    position:
      x: 976
      'y': 176
  - id: summarization
    label: |-
      Summarization · 800
      GovReport · QMSum · MultiNews · VCSUM
      200 Examples per Dataset
      First Three Use ZeroSCROLLS Templates
      VCSUM Uses Own Template + Long Segments
    type: process
    size: xl
    position:
      x: 976
      'y': 352
  - id: fewshot
    label: |-
      Few-shot Learning · 800
      TREC · TriviaQA · SAMSum · LSHT
      200 Target Queries per Dataset
      Sample Train Demonstrations
      Ranges 100–600 · 2–24 · 10–100 · 10–40
    type: process
    size: xl
    position:
      x: 976
      'y': 528
    style:
      fontSize: 9
  - id: synthetic
    label: |-
      Synthetic Tasks · 600
      Retrieval EN/ZH · PassageCount
      200 Examples per Dataset
      30 Passages + GPT-3.5 Summary
      Count: M 17–50 · N 2–M · Shuffle
    type: process
    size: xl
    position:
      x: 976
      'y': 704
    style:
      fontSize: 9
  - id: code
    label: |-
      Code Completion · 1,000
      LCC 500 · RepoBench-P 500
      Sample LCC Next-line Tasks
      XF-F · Oracle-Filled RepoBench-P
      Shuffle Gold + Cross-file Snippets
    type: process
    size: xl
    position:
      x: 976
      'y': 880
  - id: schema
    label: |-
      Standardize Candidate Records
      input · context · answers · length
      dataset · language · all_classes · _id
      EN/Code Words · ZH Characters
      length Counts the First Three Fields
    type: process
    size: xl
    position:
      x: 1320
      'y': 448
    style:
      fontSize: 9
  - id: standard_release
    label: |-
      Random-sample Standard LongBench
      21 Datasets · 4,750 Test Examples
      14 English · 5 Chinese · 2 Code
      Six Categories · Natural Length Mix
      Paper Mean 6,711 Words EN · 13,386 Chars ZH
    type: database
    size: xl
    position:
      x: 1640
      'y': 448
    style:
      fontSize: 9
  - id: release_drift
    label: |-
      Preserve Version Drift
      Paper/HF Mean EN 6,711 / 6,666.63 Words
      Paper/HF Mean ZH 13,386 / 13,338.71 Chars
      Repo Root v2 · Original Moved to LongBench/
      THUDM Dataset URL Redirects to zai-org
    type: document
    size: xl
    position:
      x: 1960
      'y': 240
    style:
      fontSize: 9
  - id: publication
    label: |-
      Public-release Boundary
      Repo Code Carries MIT License
      HF Card Has No License Metadata
      README Has a Static Official Board
      No Submission or Versioned Leaderboard
    type: document
    size: xl
    position:
      x: 2280
      'y': 240
    style:
      fontSize: 9
  - id: e_select
    label: |-
      Select 13 English / Code Datasets
      Qasper · MultiField-en · Hotpot · 2Wiki
      GovReport · MultiNews · TREC · TriviaQA
      SAMSum · Count · Retrieval-en
      LCC · RepoBench-P
    type: process
    size: xl
    position:
      x: 1960
      'y': 680
    style:
      fontSize: 9
  - id: e_bins
    label: |-
      Uniform-sample by Word Count
      0–4k · 4–8k · 8k+
      At Most 100 per Dataset and Bin
      Qasper 100/100/24 · MultiField 67/70/13
      MultiNews 100/100/94
    type: process
    size: xl
    position:
      x: 2280
      'y': 680
    style:
      fontSize: 9
  - id: e_release
    label: |-
      Release LongBench-E · Even Length
      3,668 Examples across 13 Datasets
      Ten Other Datasets Have 100 per Bin
      Same Record Schema and Task Metrics
    type: database
    size: xl
    position:
      x: 2600
      'y': 680
  - id: eval_set
    label: |-
      Choose Evaluation Set
      Standard LongBench or LongBench-E
      Run Each Dataset Separately
    type: process
    size: xl
    position:
      x: 2600
      'y': 1120
  - id: prompts
    label: |-
      Apply Dataset-specific Prompt
      Insert input and context Fields
      Many Templates Repeat Instructions around Context
      Output Caps 32 · 64 · 128 · 512 Tokens
    type: process
    size: xl
    position:
      x: 2280
      'y': 1120
  - id: truncate
    label: |-
      Tokenize with Candidate Tokenizer
      If Prompt Length Exceeds Model Limit M
      Keep First M/2 + Last M/2 Tokens
      Remove the Middle before Chat Wrapping
    type: process
    size: xl
    position:
      x: 1960
      'y': 1120
  - id: wrappers
    label: |-
      Add Model-specific Chat Wrapper
      Except TREC · TriviaQA · SAMSum · LSHT
      Also Except LCC · RepoBench-P
      These Six Stay Completion-style
    type: process
    size: xl
    position:
      x: 1640
      'y': 1120
  - id: decode
    label: |-
      Generate up to Dataset Output Cap
      Greedy Decoding · No Sampling
      One Prediction per Test Record
      SAMSum Also Stops at Newline
    type: process
    size: xl
    position:
      x: 1320
      'y': 1120
  - id: postprocess
    label: |-
      Apply Official Post-processing
      XGen Drops Assistant · InternLM Cuts at eoa
      First Line for Four Few-shot Tasks
      First Non-comment Line for Code
      Compare against Every Reference Answer
    type: process
    size: xl
    position:
      x: 1000
      'y': 1120
  - id: metrics
    label: |-
      Dispatch the Dataset Metric
      QA F1 · ROUGE-L
      Paper CLS · Evaluator Gives 1/n Labels
      Paper EM · Evaluator Scores Matching Digits
      Code Edit Similarity
    type: process
    size: xl
    position:
      x: 680
      'y': 1120
  - id: dataset_score
    label: |-
      Compute Dataset Score (%)
      Max Metric over Reference Answers
      Mean over Dataset · Multiply by 100
      LongBench-E Also Splits by Length Bin
    type: formula
    size: xl
    position:
      x: 360
      'y': 1120
  - id: aggregate
    label: |-
      Aggregate Paper Results
      Mean Datasets within Each Category
      Overall = Mean of Six Category Means
      EN / ZH Views Include Code in Both
    type: formula
    size: xl
    position:
      x: 40
      'y': 1120
  - id: leaderboard
    label: |-
      Report 21 Dataset Scores
      Six Category Means · EN · ZH · Overall
      LongBench-E 0–4k · 4–8k · 8k+
      Publish Tables in the Official README
    type: terminal
    size: xl
    position:
      x: 40
      'y': 1440
