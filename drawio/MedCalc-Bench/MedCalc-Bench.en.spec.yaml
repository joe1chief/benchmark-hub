meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: MedCalc-Bench-Verified Dataset Construction
  description: >-
    Paper-disclosed evaluation and training construction from 55 popular MDCalc tasks and Open-Patients through
    GPT-assisted note filtering and attribute extraction; the evaluation branch adds medical review and missing-note
    completion, while the parallel training branch keeps GPT-4 extractions unverified. Both feed the later Verified
    lineage.
  legend: >-
    Solid arrows show construction dependencies or release lineage. The evaluation split follows Appendix A plus the
    official version-1.0 CSV (11 template and 10 clinician calculators); main-paper §2.2 reverses those counts. Paper
    training reports 40 calculators, while the original-release CSV has 41 IDs due to one HOMA-IR row. Dashed notes mark
    these source conflicts; downstream inference, parsing, and scoring are outside the figure.
