meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Vending-Bench 智能体环境循环与评分流程
  description: >-
    Vending-Bench把基础LLM智能体循环与3万token上下文、便笺/键值/向量记忆、远程经营工具、实体操作子智能体、供应商邮件模拟，以及每日需求、费用和时间推进组合起来。每次运行以500美元起步、每日收取2美元，重复5次，并在达到2000条消息或连续10天无法缴费破产时停止；多数运行约消耗2500万token。主指标是最终净资产：手头现金、机器内现金与按批发价计值的未售库存之和；余额、销量、工具使用、运行方差与失败轨迹作为诊断。
  legend: 来源：Vending-Bench arXiv:2502.15840 and official Andon Labs evaluation page。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
  - id: config
