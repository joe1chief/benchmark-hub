meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Vending-Bench Agent-Environment Loop and Scoring
  description: >-
    Vending-Bench couples a basic LLM agent loop with a 30K-token context, scratchpad/key-value/vector memories, remote
    business tools, a physical-operation sub-agent, simulated supplier email, and daily demand, fee, and time dynamics.
    Runs start with USD 500, charge a USD 2 daily fee, repeat five times, and stop at 2,000 messages or bankruptcy after
    ten consecutive unpaid-fee days; most consume about 25M tokens. The primary score is final net worth: cash on hand
    plus cash in the machine plus unsold inventory valued at wholesale cost. Balance, units sold, tool use, run
    variance, and failure traces are secondary diagnostics.
  legend: >-
    Source: Vending-Bench arXiv:2502.15840 and official Andon Labs evaluation page. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
