  source: generated
  layout: horizontal
  routing: orthogonal
  title: WorldTravel Data, Webscape, Task, and Evaluation Pipeline
  description: >-
    Based on arXiv 2602.08367v1, separates dual-source collection, webpage and expert-task synthesis, unique-solution
    quality control, and automated hard/soft-constraint evaluation.
  legend: >-
    Rows one and two are parallel Webscape and task-synthesis branches; later rows cover quality control, the benchmark
    unit, and runtime evaluation. The isolated card marks an author-linked repository with static pages but no public
    tasks or evaluation code. Edges carry no text.
