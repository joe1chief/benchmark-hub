  title: CiteEval Build Process
  description: >-
    Paper-aligned construction flow for CiteEval: LFQA queries and retrieved contexts are used to generate cited RAG
    responses, which receive statement-level human context attribution, citation edits, and ratings before model-based
    CiteEval-Auto metrics are validated and used for RAG benchmarking.
