meta:
  profile: academic-paper
  theme: academic-color
  source: generated
  layout: horizontal
  routing: orthogonal
  title: CiteBench Human-Annotation Benchmark Construction
  description: >-
    Full LFQA pool, paper-disclosed response preprocessing, and three full-response blind annotation passes that judge
    statements in context before the 200/1,000 metric split.
  legend: >-
    Each blind pass receives the complete response/sample and proceeds statement by statement with all context visible.
    Only Retrieval statements receive citation edits and ratings; User, Response, and Parametric statements are N/A.
