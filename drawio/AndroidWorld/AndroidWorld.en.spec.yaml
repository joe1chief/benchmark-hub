meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AndroidWorld Build Process
  description: >-
    Paper-aligned dynamic Android agent benchmark construction and online reward-evaluation workflow, based on
    arXiv:2405.14573.
  legend: >-
    Solid arrows show task generation, agent-environment interaction, and reward evaluation; dashed arrows mark
    controlled seeding and teardown for reproducibility.
nodes:
  - id: apps
    label: |-
      Real Android apps
      20 apps on Pixel 6
      Android 13 fixed setup
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: taskeval
    label: |-
      TaskEval templates
      116 programmatic tasks
      app-specific logic
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: params
    label: |-
      Random parameters
      natural-language goals
      millions of variants
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: initialize
    label: |-
      Initialize task state
      app data and OS time
      seed-controlled setup
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: observations
    label: |-
      Android observations
      screenshot and a11y tree
      AndroidEnv plus ADB
    type: database
    size: xl
    position:
      x: 820
      'y': 70
  - id: agent
    label: |-
      Agent action loop
      JSON click/type/scroll
      M3A and SeeAct baselines
    type: terminal
    size: xl
    position:
      x: 820
      'y': 250
  - id: reward
    label: |-
      Durable reward checks
      files, DB rows, settings
      UI validation when needed
    type: decision
    size: xl
    position:
      x: 1080
      'y': 160
  - id: report
    label: |-
      Success-rate analysis
      baseline and human SR
      seed robustness
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: apps
    to: taskeval
    type: primary
  - from: taskeval
    to: params
    type: primary
  - from: params
    to: initialize
    type: primary
  - from: initialize
    to: observations
    type: data
  - from: observations
    to: agent
    type: primary
  - from: agent
    to: reward
    type: primary
  - from: reward
    to: observations
    type: optional
    label: continue until done
  - from: reward
    to: report
    type: primary
  - from: report
    to: initialize
    type: optional
    label: teardown and next seed
modules: []
