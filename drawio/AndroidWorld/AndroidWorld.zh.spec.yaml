meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AndroidWorld 构建流程
  description: 基于 arXiv:2405.14573 重绘的 AndroidWorld 动态移动端 Agent 基准构建与在线 reward 评测流程。
  legend: 实线表示任务生成、Agent-环境交互和 reward 评测主流程；虚线表示受控随机种子和 teardown 复现机制。
nodes:
  - id: apps
    label: |-
      真实 Android 应用
      Pixel 6 上 20 个应用
      固定 Android 13 环境
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: taskeval
    label: |-
      TaskEval 模板
      116 个程序化任务
      应用专属逻辑
    type: document
    size: xl
    position:
      x: 300
      'y': 70
  - id: params
    label: |-
      随机任务参数
      生成自然语言目标
      支持海量变体
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: initialize
    label: |-
      初始化任务状态
      应用数据与系统时间
      随机种子受控
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: observations
    label: |-
      Android 观测
      截图与无障碍树
      AndroidEnv 加 ADB
    type: database
    size: xl
    position:
      x: 820
      'y': 70
  - id: agent
    label: |-
      Agent 动作循环
      JSON 点击/输入/滚动
      M3A 与 SeeAct 基线
    type: terminal
    size: xl
    position:
      x: 820
      'y': 250
  - id: reward
    label: |-
      持久 reward 判定
      文件、数据库、设置
      必要时检查 UI
    type: decision
    size: xl
    position:
      x: 1080
      'y': 160
  - id: report
    label: |-
      成功率分析
      基线与人类 SR
      随机种子鲁棒性
    type: database
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: apps
    to: taskeval
    type: primary
  - from: taskeval
    to: params
    type: primary
  - from: params
    to: initialize
    type: primary
  - from: initialize
    to: observations
    type: data
  - from: observations
    to: agent
    type: primary
  - from: agent
    to: reward
    type: primary
  - from: reward
    to: observations
    type: optional
    label: 继续直到完成
  - from: reward
    to: report
    type: primary
  - from: report
    to: initialize
    type: optional
    label: 清理并换种子
modules: []
