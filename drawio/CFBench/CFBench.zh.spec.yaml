  title: CFBench 构建流程
  description: >-
    基于论文对齐 CFBench：从在线日志和 NLP 任务中挖掘真实指令，抽取并扩展原子约束形成 10 类约束体系， 平衡场景和约束得到样本，人工修订指令、答案和检查清单，再用 GPT-4o 按 checkpoint 评判
    CSR、ISR、PSR。
  legend: 实线箭头表示约束体系构建、样本组装、人工修订、清单评判和指标计算。
