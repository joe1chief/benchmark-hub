meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CoQA Build Process
  description: >-
    Paper-aligned CoQA workflow: multi-entity passages from seven domains are split by passage, qualified workers hold
    paired conversations with paraphrased questions and rationale-grounded free-form answers, three additional Dev/Test
    answers produce four references, and systems are evaluated with normalized macro word-overlap F1.
  legend: >-
    Solid arrows show passage curation, paired questioner/answerer collection, multi-answer verification, and
    evaluation.
nodes:
  - id: domains
    label: |-
      Seven Text Domains
      Stories / Literature / Exams / News
      Wikipedia / Reddit / Science
    type: database
    size: xl
    position:
      x: 40
      'y': 240
  - id: passage_filter
    label: |-
      CoreNLP Passage Selection
      Multiple Entities / Events / Pronouns
      Truncate to about 200 Words
    type: process
    size: xl
    position:
      x: 300
      'y': 240
  - id: split
    label: |-
      Passage-level Split
      In-domain: 100 Dev + 100 Test Each
      Reddit / Science: 100 Test Each
    type: database
    size: xl
    position:
      x: 560
      'y': 240
  - id: qualify
    label: |-
      AMT Qualification
      57% of 960 Workers Pass
    type: user
    size: large
    position:
      x: 820
      'y': 240
  - id: pair
    label: |-
      ParlAI Real-time Pair
      Questioner + Answerer
      Shared Conversation History
    type: process
    size: xl
    position:
      x: 1060
      'y': 240
  - id: questioner
    label: |-
      Questioner
      Ask Context-dependent Questions
      Alert on Exact Passage Words
    type: user
    size: xl
    position:
      x: 1340
      'y': 60
  - id: answerer
    label: |-
      Answerer
      Highlight Rationale Span
      Edit Copy into Free-form Answer
    type: user
    size: xl
    position:
      x: 1340
      'y': 420
  - id: corpus
    label: |-
      CoQA Corpus
      8,399 Conversations
      127K Turns / 15.2 per Passage
    type: database
    size: xl
    position:
      x: 1620
      'y': 240
  - id: references
    label: |-
      Dev / Test Answer Game
      Three Additional Answers
      Four References per Question
    type: user
    size: xl
    position:
      x: 1900
      'y': 240
  - id: prediction
    label: |-
      Conversational QA System
      Passage + Gold Answer History
      Predict Next Free-form Answer
    type: process
    size: xl
    position:
      x: 2180
      'y': 240
  - id: metric
    label: |-
      Macro Word-overlap F1
      Ignore Articles + Punctuation
      Average over Four References
    type: terminal
    size: xl
    position:
      x: 2460
      'y': 240
edges:
  - from: domains
    to: passage_filter
    type: primary
  - from: passage_filter
    to: split
    type: primary
  - from: split
    to: qualify
    type: primary
  - from: qualify
    to: pair
    type: primary
  - from: pair
    to: questioner
    type: primary
  - from: pair
    to: answerer
    type: primary
  - from: questioner
    to: corpus
    type: primary
  - from: answerer
    to: corpus
    type: primary
  - from: corpus
    to: references
    type: primary
  - from: references
    to: prediction
    type: primary
  - from: prediction
    to: metric
    type: primary
modules: []
