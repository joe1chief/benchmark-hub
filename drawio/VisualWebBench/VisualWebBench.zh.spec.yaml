meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VisualWebBench — 七类任务构建与指标流程
  description: >-
    VisualWebBench 从 SimilarWeb 的12个领域、87个子领域出发，在各子领域排名前五的网站中人工选择代表性网站，并排除 Mind2Web 或 WebArena
    已使用的网站，最终覆盖139个网站。Playwright
    以1280像素宽渲染截图，七条任务产线共构造1,534个样本。核验与整理工作由两名作者分工协作完成；论文没有定义逐样本双人签核门。七类数量为134/314/46/245/413/281/101。
  legend: >-
    来源：arXiv:2404.05955v1, Sections 3.1-3.4 and Appendix B; official dataset:
    https://huggingface.co/datasets/visualwebbench/VisualWebBench. Section 3.2 specifies representative websites
    selected from each subdomain's top five, while Section 3.1 and the official dataset report 139 websites. Appendix B
    specifies collaborative verification and curation with a division of tasks by two authors, not a per-sample
    two-signature gate.。实线箭头表示论文或官方资料明确支持的主流程。
