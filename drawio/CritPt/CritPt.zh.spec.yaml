meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CritPt 研究挑战构建与评测流程
  description: 对齐 arXiv v4、官方仓库与数据修订版，展示问题构建、质量复核、完整挑战评测、检查点分析、物理定制判分与五次运行汇总。
  legend: 实线表示论文流程；两条分支区分公开的 70 个完整挑战流程与论文中的 187 个顺序检查点评测。
nodes:
  - id: evidence_boundary
    label: |-
      证据边界
      arXiv 2509.26574v4
      论文版本日期 2026-05-08
      仓库 17c2545 · 数据 9b9fc84
    type: document
    size: xl
    position:
      x: 40
      'y': 230
  - id: experts
    label: |-
      50 多位活跃物理研究者
      30 多家机构 · 11 个研究领域
      问题源于各自真实研究
    type: database
    size: xl
    position:
      x: 320
      'y': 230
  - id: author
    label: |-
      至少 1 小时的基准设计培训后命题
      提供详细解答，含推导和代码
      附数据、参考文献和备选解法
    type: process
    size: xl
    position:
      x: 600
      'y': 230
  - id: criteria
    label: |-
      仅需公开知识，但答案不可搜索
      开放式、抗猜测的最终答案
      明示单位并采用机器可验证格式
    type: process
    size: xl
    position:
      x: 880
      'y': 230
  - id: iterative_review
    label: |-
      迭代复核至少 3 轮，最多 10 轮
      联合分析模型响应、歧义和漏洞
      不按模型挑题，保证长期公平
    type: process
    size: xl
    position:
      x: 1160
      'y': 230
  - id: expert_review
    label: |-
      相关领域同行评审
      额外核对推导，科学写作专家润色
      每题平均 40 多个专家小时
    type: process
    size: xl
    position:
      x: 1440
      'y': 230
  - id: checkpoints
    label: |-
      将每个复合挑战拆成
      2—4 个模块化检查点
      保留研究深度和步骤依赖
    type: process
    size: xl
    position:
      x: 1720
      'y': 230
  - id: release
    label: |-
      71 个挑战 · 190 个检查点
      1 个公开样例含解答
      70 个测试挑战答案保持私有
    type: database
    size: xl
    position:
      x: 2000
      'y': 230
  - id: eval_level
    label: 论文分别评测两级任务
    type: decision
    size: xl
    position:
      x: 2280
      'y': 230
  - id: challenge_run
    label: |-
      70 个完整挑战，无中间监督
      基础 · 代码 · 代码加网页配置
      每个挑战做 5 次独立运行
    type: process
    size: xl
    position:
      x: 2560
      'y': 80
  - id: checkpoint_run
    label: |-
      187 个测试检查点，顺序多轮评测
      自行承接前序模型响应
      或注入前序专家答案
    type: process
    size: xl
    position:
      x: 2560
      'y': 380
  - id: solve
    label: |-
      第一步：自由形式解答与推导
      第二步：抽取答案并填入代码模板
    type: process
    size: xl
    position:
      x: 2840
      'y': 80
  - id: checkpoint_solve
    label: |-
      检查点先生成自由形式推理
      再抽取最终答案并填入代码模板
    type: process
    size: xl
    position:
      x: 2840
      'y': 380
  - id: batch
    label: |-
      提交一个完整 70 题答案批次
      缺失或不匹配的题目 ID 会被拒绝
      24 小时内最多提交 10 次
    type: document
    size: xl
    position:
      x: 3120
      'y': 80
  - id: grade
    label: |-
      物理定制自动判分
      数值容差；精确值取 12 位有效数字
      SymPy 等价；函数采用精选用例
      所有分量均匹配才算正确
    type: process
    size: xl
    position:
      x: 3400
      'y': 80
  - id: checkpoint_grade
    label: |-
      论文内部的检查点判分
      数值 · 符号 · 函数检查
      官方未公开检查点评分端点
    type: process
    size: xl
    position:
      x: 3400
      'y': 380
  - id: metrics
    label: |-
      平均准确率：5 次独立运行
      挑战级：覆盖 70 个测试挑战
      检查点级：覆盖 187 个测试检查点
      稳定解出：至少 4/5 次正确
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 230
edges:
  - from: evidence_boundary
    to: experts
    type: primary
  - from: experts
    to: author
    type: primary
  - from: author
    to: criteria
    type: primary
  - from: criteria
    to: iterative_review
    type: primary
  - from: iterative_review
    to: expert_review
    type: primary
  - from: expert_review
    to: checkpoints
    type: primary
  - from: checkpoints
    to: release
    type: primary
  - from: release
    to: eval_level
    type: primary
  - from: eval_level
    to: challenge_run
    type: primary
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: eval_level
    to: checkpoint_run
    type: primary
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: challenge_run
    to: solve
    type: primary
  - from: solve
    to: batch
    type: primary
  - from: batch
    to: grade
    type: primary
  - from: grade
    to: metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.25
  - from: checkpoint_run
    to: checkpoint_solve
    type: primary
  - from: checkpoint_solve
    to: checkpoint_grade
    type: primary
  - from: checkpoint_grade
    to: metrics
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.75
modules: []
