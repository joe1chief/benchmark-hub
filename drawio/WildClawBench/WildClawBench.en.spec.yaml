meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildClawBench Executable-Task Curation and Four-Harness Evaluation
  description: >-
    WildClawBench packages each task as a Markdown/YAML specification, workspace assets, rubric, executable grader, and
    post-exit hidden grading materials. Eight researchers and experts iterate through frontier-model pilots, a >=0.2
    pairwise-gap gate, joint trace/grader review, and stability/reproducibility rechecks to retain 60 executable tasks.
    At runtime the same tasks fan out to OpenClaw, Claude Code, Codex, and Hermes in isolated Docker environments;
    timeout preserves partial artifacts, hidden ground truth is mounted only after exit, and up to three evidence
    channels feed rubric and task-count-weighted scoring.
  legend: >-
    Source: WildClawBench arXiv:2605.10912v1 (2026-05-11), Sections 3.1-3.4, Figure 4, Tables 1-2; official repository
    https://github.com/internlm/WildClawBench, May-2026 release. The benchmark compares four practical harness
    configurations with their own system prompts, tool schemas, and context; it does not impose one identical system
    prompt.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
