meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Belebele 构建流程
  description: 基于 arXiv:2308.16884v2，展示英文编写、质量检查、专家翻译、独立校对、条件式 IndicXlit 转写及测试评测。
  legend: 实线表示所有语言共用路径；虚线表示仅五种语言进入的转写支路。
nodes:
  - id: flores
    label: |-
      FLORES-200 平行段落
      488 个不同段落
      Wikinews • Wikijunior • WikiVoyage
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: guidelines
    label: |-
      编写前先应用指南
      仅依赖段落 • 无需外部知识
      干扰项可信 • 无歧义和捷径
    type: document
    size: xl
    position:
      x: 320
      'y': 180
  - id: authoring
    label: |-
      五轮英文 MCQ 编写
      四个选项 • 仅一个正确答案
      供应方依据每轮反馈修订
    type: user
    size: xl
    position:
      x: 600
      'y': 180
  - id: human_qa
    label: |-
      每轮人工抽样检查
      检查难度和歧义
      将发现反馈到下一轮
    type: user
    size: xl
    position:
      x: 880
      'y': 40
  - id: automatic_qa
    label: |-
      自动捷径检查
      词汇重叠 • 答案长度 • 词袋模型
      比较正确项与干扰项特征分布
    type: process
    size: xl
    position:
      x: 880
      'y': 320
  - id: english_set
    label: |-
      最终英文题集
      末轮过滤约 20%
      488 个段落上的 900 题
    type: database
    size: xl
    position:
      x: 1160
      'y': 180
  - id: translate
    label: |-
      专家人工翻译
      仅翻译问题和答案 • 禁止机器翻译
      歧义表达与既有 FLORES 段落对齐
    type: process
    size: xl
    position:
      x: 1160
      'y': 520
  - id: proofread
    label: |-
      独立校对
      第二位标注者编辑每条翻译
      保持与本地化段落的配对
    type: user
    size: xl
    position:
      x: 880
      'y': 520
  - id: indic_condition
    label: |-
      印地语 • 孟加拉语 • 乌尔都语
      尼泊尔语 • 僧伽罗语？
      仅这五种语言需要拉丁文字变体
    type: decision
    size: xl
    position:
      x: 600
      'y': 520
  - id: transliterate
    label: |-
      条件式 IndicXlit 支路
      标注者将本族文字转为拉丁文字
      复核问题、答案与段落配对
    type: process
    size: xl
    position:
      x: 600
      'y': 760
  - id: dataset
    label: |-
      Belebele 平行测试集
      122 个变体 • 115 种语言 • 29 种文字
      27 个语系 • 109,800 行
    type: database
    size: xl
    position:
      x: 320
      'y': 520
  - id: metric
    label: |-
      仅测试用四选一任务
      按语言变体计算准确率
      随机基线 = 25%
    type: terminal
    size: xl
    position:
      x: 40
      'y': 520
edges:
  - from: flores
    to: guidelines
    type: primary
  - from: guidelines
    to: authoring
    type: primary
  - from: authoring
    to: human_qa
    type: primary
  - from: authoring
    to: automatic_qa
    type: primary
  - from: human_qa
    to: english_set
    type: primary
  - from: automatic_qa
    to: english_set
    type: primary
  - from: english_set
    to: translate
    type: primary
  - from: translate
    to: proofread
    type: primary
  - from: proofread
    to: indic_condition
    type: primary
  - from: indic_condition
    to: transliterate
    type: optional
  - from: indic_condition
    to: dataset
    type: primary
  - from: transliterate
    to: dataset
    type: optional
  - from: dataset
    to: metric
    type: primary
modules: []
