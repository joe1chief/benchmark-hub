meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LogicVista 构建与评测流程
  description: 按论文 v1 复原 448 道视觉逻辑多项选择题的构建流程，并区分固定版本公开仓库中的字段与类别漂移，补齐已发布 GPT-4 答案抽取和准确率计算路径。
  legend: >-
    实线表示论文明确的数据集构建或已发布评测器的直通评分路径；虚线表示未充分公开的模型推理、存在缺陷的回退代码和结果发布边界。 中间一排无连线卡片是相互独立的发布工件审计发现。凡论文与官方仓库提交
    e5795f17189ce1243231250af7d8c112ae2c5a57 不一致之处均分开呈现。
nodes:
  - id: source_banks
    label: |-
      固定仓库 · 9 个来源题库
      AssessmentDay 261
      Practice Aptitude Tests 86
      Assess.ly 26 · JobTestPrep 25
      其余 5 个题库 · 共 50
    type: database
    size: xl
    position:
      x: 80
      'y': 104
    style:
      fontSize: 9
  - id: access_controls
    label: |-
      通过访问门槛降低泄漏
      许可 · 注册 · 付费
      获得研究使用授权
      论文：专有/封闭来源
    type: process
    size: xl
    position:
      x: 352
      'y': 104
  - id: manual_collection
    label: |-
      5 名标注者 · 历时 3 个月
      收集视觉推理题
      摘取图像与金标答案
      整理可获得的解释
    type: user
    size: xl
    position:
      x: 624
      'y': 104
  - id: item_annotation
    label: |-
      构建每道视觉多选题
      图像 + 问题
      选项内嵌于文本/图像
      人工编写理由
      来源名称 + 来源网址
    type: document
    size: xl
    position:
      x: 896
      'y': 104
  - id: quality_review
    label: |-
      交叉核验答案解释
      多轮标注复核
      人工验证字段
      避免真实场景捷径
    type: process
    size: xl
    position:
      x: 1168
      'y': 104
  - id: skill_axis
    label: |-
      每题仅属一类推理技能
      归纳 107 · 演绎 93
      数值 95 · 空间 79
      机械 74 · 合计 448
    type: process
    size: xl
    position:
      x: 1440
      'y': 32
  - id: paper_capabilities
    label: |-
      论文能力标签可重叠
      图示 330 · OCR 234
      模式 105 · 图形 67
      表格 70 · 3D 形状 45
      谜题 256 · 序列 76 · 物理 69
    type: process
    size: xl
    position:
      x: 1440
      'y': 256
    style:
      fontSize: 9
  - id: paper_release
    label: |-
      论文数据集
      448 道英文视觉多选题
      图像 + 问题 + 金标
      人工理由
      未报告数据划分
    type: database
    size: xl
    position:
      x: 1712
      'y': 144
  - id: repo_snapshot
    label: |-
      固定公开仓库
      dataset.json + 448 个 PNG
      样本 ID 为 0 至 447
      无划分清单/发布标签
    type: database
    size: xl
    position:
      x: 1984
      'y': 144
  - id: released_schema
    label: |-
      固定 JSON 结构
      imagename · question · answer
      reasoning · skill · 宽/细能力字段
      liscenced 是字符串字段
      样本 220：sourceli,nk 键名错误
    type: document
    size: xl
    position:
      x: 1984
      'y': 536
    style:
      fontSize: 9
  - id: taxonomy_drift
    label: |-
      发布审计 · 类别漂移
      宽类：图示 236 · OCR 125
      图示 + OCR 87
      11 个互斥细类标签
      两套口径都合计 448
    type: document
    size: xl
    position:
      x: 1712
      'y': 536
  - id: content_drift
    label: |-
      发布审计 · 内容漂移
      44 条理由为空
      样本 382：问题与答案为空
      3 条多选项金标字符串
      论文宣称理由完整
    type: document
    size: xl
    position:
      x: 1440
      'y': 536
    style:
      fontSize: 9
  - id: rights_drift
    label: |-
      发布审计 · 权利边界
      公开仓库 · Apache-2.0
      liscenced 字符串：true 161 · false 287
      论文/项目页：已许可来源
      图像权利范围仍不明确
    type: document
    size: xl
    position:
      x: 1168
      'y': 536
    style:
      fontSize: 9
  - id: missing_construction
    label: |-
      发布审计 · 构建细节缺失
      无纳入/排除规则
      无去重/拒绝数量
      无一致性统计
      无来源留出策略
    type: document
    size: xl
    position:
      x: 896
      'y': 536
    style:
      fontSize: 9
  - id: eval_drift
    label: |-
      发布审计 · 评测器缺陷
      capability 字段不匹配
      作者本机数据路径
      修复分支未置 success
      重试引用未定义 prompt
    type: document
    size: xl
    position:
      x: 624
      'y': 536
    style:
      fontSize: 9
  - id: candidate_input
    label: |-
      候选多模态模型输入
      图像 + 问题
      选项内嵌于图像/文本
      提示词与生成参数未公开
    type: process
    size: xl
    position:
      x: 1984
      'y': 928
    style:
      fontSize: 9
  - id: raw_output
    label: |-
      模型自由文本输出
      字母 · 数字 · 句子
      已发布答案 JSON 输入脚本
    type: document
    size: xl
    position:
      x: 1712
      'y': 928
  - id: answer_extractor
    label: |-
      已发布 GPT-4 答案抽取器
      model = gpt-4 · temp = 0.2
      提示：问题 + 原始回答
      无独立选项字段
    type: process
    size: xl
    position:
      x: 1440
      'y': 928
  - id: structured_parse
    label: |-
      Pydantic 答案解析器
      输出 choices 列表
      允许字母或数字
      无法恢复选项 → ZZZZZ
    type: process
    size: xl
    position:
      x: 1168
      'y': 928
  - id: parse_valid
    label: |-
      结构化解析有效？
      是 → 精确匹配
      否 → 回退路径
    type: decision
    size: xl
    position:
      x: 896
      'y': 928
  - id: repair_retry
    label: |-
      论文协议 vs 固定代码回退
      论文：携验证反馈重新抽取
      代码：OutputFixing 解析同一输出
      success 未置位 · prompt 未定义
      最终回退 choices = ZZZZZ
    type: process
    size: xl
    position:
      x: 624
      'y': 1192
    style:
      fontSize: 9
  - id: exact_match
    label: |-
      归一化并精确集合匹配
      两个列表均小写后排序
      按“逗号 + 空格”切分金标
      仅完全一致判正确
    type: process
    size: xl
    position:
      x: 624
      'y': 928
  - id: item_score
    label: |-
      逐题二值评分
      正确为 1 · 否则为 0
      空输出 + 空金标可判 1 分
    type: process
    size: xl
    position:
      x: 352
      'y': 928
  - id: aggregate_accuracy
    label: |-
      汇总准确率（%）
      100 × 正确数 / 分组样本数
      总体 N = 448
      按技能与论文能力报告
    type: process
    size: xl
    position:
      x: 80
      'y': 928
  - id: results_boundary
    label: |-
      论文/项目页静态结果
      标题称 8 个 MLLM
      表中列出 16 个配置
      约五选一随机基线
      无人类基线 · 无实时排行榜
    type: terminal
    size: xl
    position:
      x: 80
      'y': 1192
    style:
      fontSize: 9
edges:
  - from: source_banks
    to: access_controls
    type: primary
  - from: access_controls
    to: manual_collection
    type: primary
  - from: manual_collection
    to: item_annotation
    type: primary
  - from: item_annotation
    to: quality_review
    type: primary
  - from: quality_review
    to: skill_axis
    type: primary
  - from: quality_review
    to: paper_capabilities
    type: primary
  - from: skill_axis
    to: paper_release
    type: primary
  - from: paper_capabilities
    to: paper_release
    type: primary
  - from: paper_release
    to: repo_snapshot
    type: primary
  - from: repo_snapshot
    to: released_schema
    type: primary
  - from: released_schema
    to: candidate_input
    type: secondary
  - from: candidate_input
    to: raw_output
    type: secondary
  - from: raw_output
    to: answer_extractor
    type: primary
  - from: answer_extractor
    to: structured_parse
    type: primary
  - from: structured_parse
    to: parse_valid
    type: primary
  - from: parse_valid
    to: repair_retry
    type: secondary
  - from: repair_retry
    to: exact_match
    type: secondary
  - from: parse_valid
    to: exact_match
    type: primary
  - from: exact_match
    to: item_score
    type: primary
  - from: item_score
    to: aggregate_accuracy
    type: primary
  - from: aggregate_accuracy
    to: results_boundary
    type: secondary
modules: []
