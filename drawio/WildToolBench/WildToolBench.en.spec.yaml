meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WildToolBench Multi-Task Session Construction, DAG QC, and Evaluation
  description: >-
    WildToolBench analyzes large-scale real-user tool-use logs to derive scenarios and three challenges: compositional
    tool orchestration, hidden-intention inference through dialogue, and adaptive policy switching under instruction
    transitions. Raw logs are not released; uniformly sampled examples guide a controlled User Agent that varies syntax,
    style, background, length, and difficulty. The benchmark collects 1,600+ public APIs into 400 cleaned tool lists
    with broad parameter-type coverage and five-expert repair. Each of 256 sessions contains four linked tasks: one of
    four first-task types followed by three dependency-bearing tasks based on partial omission, coreference, or
    long-range context. Assistant trajectories undergo automatic error checks, five-expert correction, then human DAG
    annotation. Nine experts work for one month; repeated 20% reviews and four QC iterations resolve conflicts, rewrite
    overly organized dialogue, enrich intent switches, and fix calls until sampled error is zero and conflicts are
    resolved. The final 1,024 tasks cover 8 major and 24 subcategories, averaging 5.27 turns per session and 1.92
    tool-call steps. Evaluation reports Task Accuracy, all-four Session Accuracy, Optimal Path Rate, and Accomplishment
    Progress Rate.
  legend: >-
    Source: WildToolBench, Benchmarking LLM Tool-Use in the Wild, arXiv:2604.06185v1 (2026-02-13; ICLR 2026), Sections
    3.1-3.6, Sections 4.1-4.2, the dependency-DAG algorithm appendix, and Appendix C; official repository
    https://github.com/yupeijei1997/WildToolBench. Hard identity guard: WildToolBench is not WildBench arXiv:2406.04770
    and is unrelated to https://github.com/allenai/WildBench. Count units must remain explicit: 256 scenarios/sessions x
    4 linked tasks = 1,024 tasks; the four tasks are not independent rows. API counts are reported as 1,600+ collected
    public APIs, approximately 1,600 APIs retained across 400 tool lists. The human dependency DAG is annotated only
    after trajectory correction, and the 62% -> 78% -> 86% -> 94% -> 100% sequence is a QC progression, not a model
    score.. Solid arrows show the main flow explicitly supported by the paper or official documentation.
