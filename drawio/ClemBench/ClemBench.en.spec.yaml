  title: clembench-2024 Build Process
  description: >-
    Paper-era clembench flow: reusable game specifications generate fresh instances for offline self-play; formal play
    and normalized game quality form clemscore, while expert and translated reference-game studies validate the design.
  legend: Solid arrows follow the May 2024 paper; the dashed branch records later v3.0 repository drift.
