meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VideoReasonBench State-Transition Build and Dual Evaluation
  description: >-
    VideoReasonBench defines six demonstrations whose observable operations transform partly hidden latent states. A
    video engine samples initial states and 5-14 operations, then renders Number/Circle/Cup with Matplotlib, File with
    command-line screenshots, and Card/Chip with manual real-world recordings. A question engine uses six skill
    templates across three levels and the exact transition traces to generate answers, yielding 240 videos and 1,440
    questions. Except Predict Operation, responses are judged against ground truth by a Qwen2.5-72B text-only judge.
    Predict Operation has no unique ground truth: an LLM extracts operations, the benchmark replays them with the same
    state-transition functions, and success requires reaching the target state. Accuracy is reported by level alongside
    thinking-budget, vision-reliance, and complexity analyses.
  legend: >-
    Source: VideoReasonBench arXiv:2505.23359 and official llyx97/video_reason_bench repository. Solid arrows show the
    main flow explicitly supported by the paper or official documentation.
