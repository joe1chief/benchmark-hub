meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VideoReasonBench 状态转移构建与双路评测流程
  description: >-
    VideoReasonBench定义6类演示，要求可观察操作改变部分隐藏的潜在状态。视频引擎采样初始状态与5至14个操作：Number/Circle/Cup用Matplotlib渲染，File用命令行截图，Card/Chip用人工实拍。问题引擎依据三级6项技能模板和精确状态转移轨迹自动生成答案，最终得到240个视频与1440道题。除预测操作外，回答由Qwen2.5-72B纯文本裁判对照真值判断。预测操作没有唯一真值：先由LLM抽取操作，再用视频引擎相同的状态转移函数重放，只有到达目标状态才算成功。按层级报告准确率，并分析思考预算、视觉依赖与复杂度。
  legend: 来源：VideoReasonBench arXiv:2505.23359 and official llyx97/video_reason_bench repository。实线箭头表示论文或官方资料明确支持的主流程。
