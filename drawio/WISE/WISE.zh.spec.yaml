meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: WISE 论文版构建与评测流程
  description: >-
    论文从教材、百科与公共参考资料、常识题集及LLM辅助候选中构建1000条知识密集型文生图提示，覆盖25个子域。人工标注者改写或淘汰候选，确保可视觉作答、只有一个可推断目标、事实稳定、措辞自然、预期视觉线索明确，并核对提示、答案与解释的一致性。数据定稿后，表4给出描述性文化分布审计：全量WISE中全球/中性、西方、非西方分别为56.6%、22.6%、20.8%；文化常识子集中分别为17.75%、41.50%、40.75%。论文未规定通过阈值，也未规定再平衡回路。生成图像由GPT-4o-2024-05-13对一致性、真实感与审美质量分别按0至2分评分，WiScore=(0.7C+0.2R+0.1A)/2。本条目固定采用论文协议，不采用仓库后续默认的二元WISE_Verified协议。
  legend: >-
    来源：WISE arXiv:2503.07265v4, Section 3.1 and Tables 3-4 for sourcing, quality control, and the descriptive
    cultural-distribution audit; Section 3.2 Equation (1) and Appendices D-E for WiScore; Appendices H-I for seed and
    human validation; official repository https://github.com/PKU-YuanGroup/WISE. Version pin: this entry follows the
    paper WiScore protocol, not the repository-default WISE_Verified maintenance protocol. Table 4 is an audit, not a
    build gate.。实线箭头表示论文或官方资料明确支持的主流程。
