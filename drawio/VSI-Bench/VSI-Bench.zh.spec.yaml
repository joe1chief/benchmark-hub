meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VSI-Bench 构建与混合指标评测流程
  description: >-
    VSI-Bench统一ScanNet、ScanNet++与ARKitScenes验证集中的视频和三维物体元数据。七项任务由元数据模板自动生成，路线规划题由人工标注；迭代式人在回路复核会把低质量视频、源标注错误、模板问题与歧义问答回溯到源头修正。最终发布288个视频、5000多组问答与8项任务。选择题采用准确率，数值题采用平均相对准确率，认知地图提示仅作为分析干预。
  legend: >-
    来源：VSI-Bench arXiv:2412.14171, benchmark construction and evaluation sections; official nyu-visionx/VSI-Bench
    dataset。实线箭头表示论文或官方资料明确支持的主流程。
