meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: OCRBench 构建与评测流程
  description: 对齐论文 v7 与固定发布物，区分 29 数据集大规模实验和人工校正的 1,000 条 OCRBench，随后展示发布代码中的归一化、包含式判断与五组件求和。
  legend: 虚线表示论文的 FullTest 大规模实验路径，并非已证明的紧凑版选样流程；实线表示 1,000 条 OCRBench 发布物的构建与评测合同。
nodes:
  - id: study_sources
    label: |-
      汇集论文大规模实验数据
      29 个公开 OCR 相关数据集
      文本识别 · VQA · 文档
      KIE · HMER
    type: database
    size: xl
    position:
      x: 20
      'y': 420
  - id: artifact_gate
    label: |-
      对应哪一种
      论文产物？
    type: decision
    size: xl
    position:
      x: 260
      'y': 420
  - id: semantic_controls
    label: |-
      构造语义对照数据
      使用 IIIT5K 词典
      ST：3,000 张单词图像
      NST：打乱同一批字符
    type: process
    size: xl
    position:
      x: 500
      'y': 0
  - id: broad_filter
    label: |-
      准备 FullTest 实验池
      删除答案少于四个符号的问题
      部分大型数据集抽取 3,000 条
      不据此推断紧凑版选样规则
    type: process
    size: xl
    position:
      x: 740
      'y': 0
  - id: broad_study
    label: |-
      执行 29 数据集实验
      FullTest JSON · 论文表 1–2
      分数据集统计包含式准确率
      区别于 1,000 条发布版
    type: terminal
    size: xl
    position:
      x: 980
      'y': 0
  - id: compact_contract
    label: |-
      定义紧凑版 OCRBench
      五组件采用固定配额
      1,000 条图像—问题—答案
      论文未给出逐项选样算法
    type: document
    size: xl
    position:
      x: 500
      'y': 420
  - id: component_gate
    label: |-
      分配五个组件的
      固定配额
    type: decision
    size: xl
    position:
      x: 740
      'y': 420
  - id: recognition
    label: |-
      文本识别 · 300
      规则 · 不规则 · 艺术字
      手写 · 数字串 · 非语义文本
      六类各 50
    type: database
    size: xl
    position:
      x: 980
      'y': 140
  - id: scene_vqa
    label: |-
      场景文本 VQA · 200
      STVQA · TextVQA
      ESTVQA 英文 · OCRVQA
      四个来源各 50
    type: database
    size: xl
    position:
      x: 980
      'y': 280
  - id: doc_vqa
    label: |-
      文档 VQA · 200
      DocVQA · ChartQA 增强题
      ChartQA 人工题 · InfographicVQA
      四个来源各 50
    type: database
    size: xl
    position:
      x: 980
      'y': 420
  - id: kie
    label: |-
      关键信息提取 · 200
      SROIE 67 · FUNSD 66 · POIE 67
      询问给定键对应的值
      保留多个正确答案候选
    type: database
    size: xl
    position:
      x: 980
      'y': 560
  - id: hmer
    label: |-
      手写数学表达式识别 · 100
      HME100K 图像
      识别手写数学表达式
      要求输出 LaTeX
    type: database
    size: xl
    position:
      x: 980
      'y': 700
  - id: prompting
    label: |-
      保留任务专属问题
      英文 · 中文 · 数字串提示
      KIE 增加直接读图指令
      保留 HMER 的 LaTeX 合同
    type: document
    size: xl
    position:
      x: 1220
      'y': 420
  - id: verify
    label: |-
      人工核验全部 1,000 条
      修正不准确答案
      补充其他正确答案候选
      检查固定组件配额
    type: process
    size: xl
    position:
      x: 1460
      'y': 420
  - id: release
    label: |-
      发布 OCRBench 数据与图像
      JSON 字段：类型 · 数据集 · 问题
      答案 · 图像路径 · ID
      Hugging Face 公开镜像 1,000 条
    type: database
    size: xl
    position:
      x: 1700
      'y': 420
  - id: infer
    label: |-
      执行多模态模型零样本推理
      输入单张图像及其问题
      保留自由文本预测
      论文未统一生成参数
    type: process
    size: xl
    position:
      x: 1940
      'y': 420
  - id: normalize
    label: |-
      应用发布版归一化
      非 HMER：小写 + 去首尾空白
      展平换行
      HMER：删空格/换行，不转小写
      逐个测试备选标准答案
    type: process
    size: xl
    position:
      x: 2180
      'y': 420
  - id: containment
    label: |-
      按发布代码赋予二元单题得分
      任一归一化标准答案
      为预测文本子串 → 1
      否则 → 0
    type: process
    size: xl
    position:
      x: 2420
      'y': 420
  - id: score
    label: |-
      汇总五组件正确数
      文本识别 300 · 场景 VQA 200
      文档 VQA 200 · KIE 200
      HMER 100
      总分：0–1,000
    type: terminal
    size: xl
    position:
      x: 2660
      'y': 420
  - id: source_boundary
    label: |-
      来源与发布边界
      arXiv v7 4cc667… · 仓库 86d091…
      JSON df7595… · HF 92a54b…
      存在短答案候选
      MIT 代码 · 数据沿用上游条款
    type: document
    size: xl
    position:
      x: 2900
      'y': 680
