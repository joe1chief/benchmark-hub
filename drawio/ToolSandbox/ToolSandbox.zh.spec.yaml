meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ToolSandbox 构建与评测流程
  description: >-
    ToolSandbox定义跨11个领域的34个有状态工具和内置用户模拟器。两名内部专家先创建自包含的单工具种子场景，再组合和分支为多工具、多轮、状态依赖、规范化与信息不足变体。每个场景明确初始数据库状态、用户任务、可用工具、里程碑DAG和可选minefield。第二名专家以智能体身份实际执行全部场景，检查可行性与标注，并在多个模型智能体上至少迭代四轮。最终1032个场景按拓扑顺序把数据库快照匹配到里程碑，使用精确、ROUGE-L或AST感知相似度并进行几何聚合；触发任何minefield都会将得分置零。
  legend: >-
    来源：ToolSandbox arXiv:2408.04682, Sections 3-4 and Appendix A; official apple/ToolSandbox
    repository。实线箭头表示论文或官方资料明确支持的主流程。
