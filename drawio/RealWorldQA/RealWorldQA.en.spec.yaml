  title: "RealWorldQA Build and Evaluation Process"
  description: "RealWorldQA has no accompanying benchmark paper. The xAI dataset card documents an initial release of 765 anonymized real-world images, including images taken from vehicles and other real-world scenes, with one question and an easily verifiable answer per image. It describes the goal as real-world understanding and releases the data under CC BY-ND 4.0, but does not disclose image sourcing proportions, question-authoring procedure, annotator counts, quality-control stages, prompt formatting, or an official answer parser. The diagram therefore shows only those confirmed stages and marks simple answer accuracy as the public evaluation convention rather than inventing a hidden construction pipeline."
  legend: "Source: xAI official Hugging Face dataset card Introduction and release metadata; no accompanying paper or detailed annotation protocol is published. Solid arrows show the main flow explicitly supported by the paper or official documentation."
