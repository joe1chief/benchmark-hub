meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIRD-SQL 构建流程
  description: 基于 arXiv:2305.03111，对齐论文的 BIRD-SQL 数据库收集、双盲 SQL 标注、专家审核和执行效率评测流程。
  legend: 实线表示数据集构建与评测主流程；虚线表示外部知识记录和专家共识回路。
nodes:
  - id: db_sources
    label: |-
      真实数据库来源
      Kaggle、CTU、开放表
      噪声大值域 schema
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: db_curation
    label: |-
      数据库整理
      95 个数据库 / 37 个领域
      schema 与值描述文件
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: annotator_gate
    label: |-
      标注者准入
      专家培训与考试
      只保留合格人员
    type: user
    size: xl
    position:
      x: 300
      'y': 250
  - id: question_annotation
    label: |-
      问题标注
      使用数据库描述
      记录外部知识证据
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: sql_annotation
    label: |-
      双盲 SQL 标注
      两名 SQL 标注者独立完成
      执行并比较结果
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_review
    label: |-
      专家审核
      SQL 有效性
      文本-知识-SQL 对齐
      选择高效标准答案
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: splits
    label: |-
      BIRD-SQL 数据集
      12,751 个 text-SQL 对
      69 训 / 11 验 / 15 测数据库
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      评测协议
      EX、VA、R-VES
      正确性与执行效率
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: db_sources
    to: db_curation
    type: primary
  - from: db_curation
    to: question_annotation
    type: primary
  - from: annotator_gate
    to: question_annotation
    type: data
  - from: question_annotation
    to: sql_annotation
    type: primary
  - from: sql_annotation
    to: expert_review
    type: primary
  - from: expert_review
    to: sql_annotation
    type: optional
    label: 结果不一致时共识审核
  - from: expert_review
    to: splits
    type: primary
  - from: question_annotation
    to: splits
    type: optional
    label: 记录知识证据
  - from: splits
    to: evaluation
    type: primary
modules: []
