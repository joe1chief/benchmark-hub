meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: BIRD-SQL Build Process
  description: >-
    Paper-aligned database collection, double-blind SQL annotation, expert examination, and execution-efficiency
    evaluation workflow for BIRD-SQL, based on arXiv:2305.03111.
  legend: >-
    Solid arrows show dataset construction and evaluation; dashed arrows mark external-knowledge recording and expert
    consensus loops.
nodes:
  - id: db_sources
    label: |-
      Real database sources
      Kaggle, CTU, open tables
      noisy large-value schemas
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: db_curation
    label: |-
      Database curation
      95 DBs / 37 domains
      schema and value descriptions
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: annotator_gate
    label: |-
      Annotator entrance
      expert teaching and exams
      retain qualified workers
    type: user
    size: xl
    position:
      x: 300
      'y': 250
  - id: question_annotation
    label: |-
      Question annotation
      use DB descriptions
      collect external knowledge evidence
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: sql_annotation
    label: |-
      Double-blind SQL annotation
      two independent SQL writers
      execute and compare results
    type: process
    size: xl
    position:
      x: 820
      'y': 70
  - id: expert_review
    label: |-
      Expert examination
      SQL validness
      text-knowledge-SQL alignment
      choose efficient ground truth
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: splits
    label: |-
      BIRD-SQL dataset
      12,751 text-SQL pairs
      69 train / 11 dev / 15 test DBs
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      Evaluation protocol
      EX, VA and R-VES
      accuracy plus execution efficiency
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: db_sources
    to: db_curation
    type: primary
  - from: db_curation
    to: question_annotation
    type: primary
  - from: annotator_gate
    to: question_annotation
    type: data
  - from: question_annotation
    to: sql_annotation
    type: primary
  - from: sql_annotation
    to: expert_review
    type: primary
  - from: expert_review
    to: sql_annotation
    type: optional
    label: consensus when results differ
  - from: expert_review
    to: splits
    type: primary
  - from: question_annotation
    to: splits
    type: optional
    label: recorded knowledge evidence
  - from: splits
    to: evaluation
    type: primary
modules: []
