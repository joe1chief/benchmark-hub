  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: InteractiveBench Build Process
  description: >-
    Paper-aligned five-testbed framework: three Interactive Proofs use hidden truth and task-specific verifier loops,
    while two Interactive Games evaluate long-horizon strategic utility under their own horizons and termination rules.
  legend: >-
    Solid parallel lanes are distinct paper testbeds, not sequential stages. Each testbed reports its own metrics; the
    paper does not define a unified five-testbed aggregate.
