  title: OmniBench Build and Evaluation Process
  description: >-
    Paper- and source-aligned construction, iterative tri-modal necessity checking, publication, and evaluation of the
    1,142-question OmniBench, with released parser, packaging, task-count, and license boundaries shown explicitly.
  legend: >-
    Fixed evidence: arXiv:2409.15272v6, multimodal-art-projection/OmniBench at 1f14e7f49c9a, and the Hugging Face
    dataset at 84dc3923e0f6. Solid arrows are data or evaluation flow; dashed arrows mark evidence and source drift.
