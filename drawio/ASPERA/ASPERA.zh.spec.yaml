meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA 与 Asper-Bench 构建及评测流程
  description: 按论文呈现可执行助理任务的交互式构建，以及面向多组闭源/开源模型的 CCK 与原语选择两套评测协议。
  legend: 论文 v1 库统计被显式标注，因为当前官方仓库 README 报告了不同的实现清单。候选程序无异常执行且全部参考 EP 的全部断言通过，任务才成功。
nodes:
  - id: library
    label: |-
      ASPERA 助理库 • 论文 v1
      7 个数据库 • 69 个原语
      49 个函数 • 20 个类
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: query_mode
    label: 选择查询入口
    type: decision
    size: xl
    position:
      x: 320
      'y': 180
  - id: human_query
    label: |-
      人工编写查询
      LLM 生成参考 AEP
    type: user
    size: xl
    position:
      x: 600
      'y': 20
  - id: joint_query
    label: |-
      LLM 联合生成查询与 AEP
      开发者提供聚焦指令
    type: process
    size: xl
    position:
      x: 600
      'y': 340
  - id: bias_controls
    label: |-
      多样性与偏差控制
      历史查询 • 聚焦指令
      生成后过滤
    type: process
    size: xl
    position:
      x: 880
      'y': 340
  - id: aep
    label: |-
      生成参考 AEP
      库文档 + 每种程序 5 个 ICE
      开发者执行并编辑
    type: process
    size: xl
    position:
      x: 1160
      'y': 180
  - id: sip
    label: |-
      生成 SIP
      初始化动态环境状态
      开发者执行并编辑
    type: process
    size: xl
    position:
      x: 1440
      'y': 180
  - id: ep
    label: |-
      生成 EP
      断言返回 • 目标 • 副作用
      支持多个合法结果
    type: process
    size: xl
    position:
      x: 1720
      'y': 180
  - id: lead_author
    label: |-
      首席作者质量复核
      执行任务并修正 LLM 输出
    type: user
    size: xl
    position:
      x: 2000
      'y': 180
  - id: confirm
    label: |-
      两位具同类专业经验的标注员
      在误差分析中确认数据质量
    type: user
    size: xl
    position:
      x: 2280
      'y': 180
  - id: release
    label: |-
      发布 Asper-Bench
      共 250 题
      信息查询 71 • 状态修改 179
    type: database
    size: xl
    position:
      x: 2560
      'y': 180
  - id: models
    label: |-
      评测闭源与开源模型
      o1 • GPT • Gemini
      Mistral • Qwen • Gemma
    type: process
    size: xl
    position:
      x: 2560
      'y': 700
  - id: setting
    label: 选择评测设置
    type: decision
    size: xl
    position:
      x: 2280
      'y': 700
  - id: cck
    label: |-
      完整代码库知识 CCK
      完整库文档 + 5 个 AEP ICE
    type: document
    size: xl
    position:
      x: 2000
      'y': 540
  - id: ps
    label: |-
      原语选择 PS
      遍历模块 • 选择导入或 None
      使用 1 个 ICE 生成
    type: process
    size: xl
    position:
      x: 2000
      'y': 860
  - id: candidate
    label: |-
      生成候选 AEP
      将 Asper-Bench 查询转为 Python
    type: process
    size: xl
    position:
      x: 1720
      'y': 700
  - id: single_trial
    label: |-
      单次尝试
      不进行自调试迭代
    type: document
    size: xl
    position:
      x: 1440
      'y': 700
  - id: reference_runs
    label: |-
      运行每组参考 SIP / EP
      条件查询可使用
      多个 SIP / EP 对
    type: process
    size: xl
    position:
      x: 1160
      'y': 700
  - id: execute
    label: |-
      初始化并捕获执行前状态
      执行候选 AEP
    type: process
    size: xl
    position:
      x: 880
      'y': 700
  - id: assertions
    label: |-
      执行 EP 断言
      返回 • 目标 • 合法结果
      禁止非预期副作用
    type: process
    size: xl
    position:
      x: 600
      'y': 700
  - id: metric
    label: |-
      任务成功
      无执行异常
      每个参考 EP 的
      全部断言均通过
    type: process
    size: xl
    position:
      x: 320
      'y': 600
  - id: ps_metric
    label: |-
      原语选择指标
      微平均 F1 • 精确率 • 召回率
      对照参考 AEP 原语
    type: process
    size: xl
    position:
      x: 320
      'y': 820
  - id: report
    label: |-
      报告程序合成质量
      任务成功率 + PS 指标
    type: terminal
    size: xl
    position:
      x: 40
      'y': 700
edges:
  - from: library
    to: query_mode
    type: primary
  - from: query_mode
    to: human_query
    type: primary
  - from: query_mode
    to: joint_query
    type: primary
  - from: human_query
    to: aep
    type: primary
  - from: joint_query
    to: bias_controls
    type: primary
  - from: bias_controls
    to: aep
    type: primary
  - from: aep
    to: sip
    type: primary
  - from: sip
    to: ep
    type: primary
  - from: ep
    to: lead_author
    type: primary
  - from: lead_author
    to: confirm
    type: primary
  - from: confirm
    to: release
    type: primary
  - from: release
    to: models
    type: primary
  - from: models
    to: setting
    type: primary
  - from: setting
    to: cck
    type: primary
  - from: setting
    to: ps
    type: primary
  - from: cck
    to: candidate
    type: primary
  - from: ps
    to: candidate
    type: primary
  - from: candidate
    to: single_trial
    type: primary
  - from: single_trial
    to: reference_runs
    type: primary
  - from: reference_runs
    to: execute
    type: primary
  - from: execute
    to: assertions
    type: primary
  - from: assertions
    to: metric
    type: primary
  - from: ps
    to: ps_metric
    type: secondary
  - from: metric
    to: report
    type: primary
  - from: ps_metric
    to: report
    type: secondary
modules: []
