meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ASPERA 构建流程
  description: 基于 arXiv:2507.15501，对齐 ASPERA/Asper-Bench 的助手库模拟、人机协同任务生成、质量控制和 task-success 评测流程。
  legend: 实线表示 ASPERA 任务构造与执行评测主流程；虚线表示开发者调控和偏差缓解循环。
nodes:
  - id: assistant_library
    label: |-
      助手库模拟
      7 个数据库
      69 个 Python 原语
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: aep_generation
    label: |-
      查询与 AEP 生成
      GPT-4o 加示例
      复杂组合程序
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: bias_control
    label: |-
      多样性控制
      历史查询提示
      focus 指令与过滤
    type: decision
    size: xl
    position:
      x: 300
      'y': 250
  - id: sip_generation
    label: |-
      SIP 生成
      初始化模拟状态
      动态用户数据库
    type: process
    size: xl
    position:
      x: 560
      'y': 70
  - id: ep_generation
    label: |-
      EP 生成
      执行 SIP 与 AEP
      断言目标和副作用
    type: process
    size: xl
    position:
      x: 560
      'y': 250
  - id: human_qc
    label: |-
      开发者调控
      IDE 中运行与编辑程序
      标注者确认质量
    type: user
    size: xl
    position:
      x: 820
      'y': 160
  - id: dataset
    label: |-
      Asper-Bench 数据集
      250 个任务
      AEP、SIP、EP 标注
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluator
    label: |-
      ASPERA 评测器
      完整或部分代码库知识
      断言通过即任务成功
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: assistant_library
    to: aep_generation
    type: primary
  - from: assistant_library
    to: sip_generation
    type: data
  - from: aep_generation
    to: bias_control
    type: optional
    label: 缓解重复偏差
  - from: bias_control
    to: aep_generation
    type: optional
    label: 调整 focus
  - from: aep_generation
    to: sip_generation
    type: primary
  - from: sip_generation
    to: ep_generation
    type: primary
  - from: ep_generation
    to: human_qc
    type: primary
  - from: human_qc
    to: aep_generation
    type: optional
    label: 执行并编辑输出
  - from: human_qc
    to: dataset
    type: primary
  - from: dataset
    to: evaluator
    type: primary
modules: []
