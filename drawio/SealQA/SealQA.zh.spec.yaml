meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: SealQA 构建与评测流程
  description: >-
    SealQA由6位NLP研究者历时8个月构建，平均每题投入超过1小时。题目均有唯一明确答案，覆盖高级推理、消歧、时间追踪、跨语言检索和错误前提识别五类，并附支持网页、解释、新鲜度和预期检索冲突或无用标签；题目持续迭代直至前沿模型反复失败。至少两名研究生审查URL、答案正确性和清晰度，再由专家批准；可能变化的题目记录生效年份和下次复审日期。Seal-0含111题，在带浏览的前沿非推理模型多次测试中保持0%表现；Seal-Hard扩展到254题。LongSeal为这254题各配一个金标准来源和50个困难负例。评测使用可调用搜索工具或注入搜索结果的设置，LongSeal从12、20或30篇文档中随机放置金文档，并由GPT-4o-mini把回答判为正确、错误或未作答，再报告准确率及类别分解。
  legend: 来源：SealQA arXiv:2506.01062 Sections 2-4 and Appendices A-C; official vtllms/sealqa dataset。实线箭头表示论文或官方资料明确支持的主流程。
