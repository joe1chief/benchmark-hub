  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ChartQA 构建流程
  description: 对齐论文的 ChartQA 构建流程：从四个网站来源收集真实图表，配套人工问题和基于摘要的 T5 生成问题， 清洗并划分数据，同时用 ChartOCR 抽取表格供多模态问答模型评测。
  legend: 实线箭头表示图表收集、问答生成、清洗、划分和模型评测流程。
