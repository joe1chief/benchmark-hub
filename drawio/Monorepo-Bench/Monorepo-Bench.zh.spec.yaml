meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Monorepo-Bench 构建与评测流程
  description: 严格按照 GPT-5.3-Codex 系统卡披露内容，展示大型内部仓库中人工编写的拉取请求式任务、每样本一次智能体运行， 以及全部隐藏测试通过才成功的 pass@1 门槛。
  legend: 实线复现系统卡的评测主流程与二元结果，虚线表示系统卡未披露的信息或公开工件边界。第 5.1.3.1 节没有说明浏览、 推理强度、上下文压缩或轮数预算，因此不把相邻网络安全评测的设置移植到 Monorepo-Bench。
nodes:
  - id: scope
    label: |-
      定义 AI 自我改进评测
      真实软件与研究工程
      拉取请求式贡献
      大型内部仓库
    type: document
    size: xl
    position:
      x: 128
      'y': 48
  - id: curate
    label: |-
      策划贡献任务
      复现真实拉取请求式改动
      任务数量与选择方法未披露
      仅使用内部仓库
    type: database
    size: xl
    position:
      x: 368
      'y': 48
  - id: human_assets
    label: |-
      编写任务工件
      提示 · 线索 · 单元测试
      全部由人工编写
      测试保持隐藏
    type: document
    size: xl
    position:
      x: 608
      'y': 48
  - id: checkout
    label: |-
      准备单个评测样本
      签出代码环境
      使用改动前分支
      从所需改动之前开始
    type: process
    size: xl
    position:
      x: 848
      'y': 48
  - id: prompt
    label: |-
      提供改动请求
      提示描述所需修改
      线索是否及如何提供未披露
      不暴露隐藏测试
    type: document
    size: xl
    position:
      x: 1088
      'y': 48
  - id: rollout
    label: |-
      执行一次智能体运行
      检查代码库
      使用命令行工具
      使用 Python
    type: process
    size: xl
    position:
      x: 1328
      'y': 48
  - id: modify
    label: |-
      修改代码库内文件
      实现所需改动
      产出候选修改
      工作直至完成
    type: process
    size: xl
    position:
      x: 1568
      'y': 48
  - id: completion
    label: |-
      完成智能体运行
      固定最终修改
      把候选补丁交给判分器
    type: process
    size: xl
    position:
      x: 1568
      'y': 464
  - id: hidden_tests
    label: |-
      隐藏单元测试判分
      运行任务专用测试
      人工编写检查项
      完成后对修改判分
    type: process
    size: xl
    position:
      x: 1328
      'y': 464
  - id: gate
    label: 全部隐藏测试均通过？
    type: decision
    size: xl
    position:
      x: 1088
      'y': 464
  - id: success
    label: |-
      通过：本次运行成功
      二元样本结果 = 1
      全部任务专用测试通过
    type: terminal
    size: xl
    position:
      x: 848
      'y': 464
  - id: failure
    label: |-
      失败：本次运行不成功
      至少一个测试未通过
      未报告部分得分
      二元样本结果 = 0
    type: terminal
    size: xl
    position:
      x: 1088
      'y': 720
  - id: pass1
    label: |-
      汇总二元样本结果
      一个样本 = 一次智能体运行
      图中纵轴：pass@1
      越高越好
    type: process
    size: xl
    position:
      x: 608
      'y': 464
  - id: figure
    label: |-
      系统卡 Figure 8
      GPT-5.1-Codex-Max 53%
      GPT-5.2-Thinking 无浏览 55% · GPT-5.2-Codex 55%
      GPT-5.3-Codex 56%
    type: terminal
    size: xl
    position:
      x: 368
      'y': 464
  - id: undisclosed
    label: |-
      未披露的协议细节
      任务权重 · 误差线方法
      运行预算 · 工具限制
      模型生成设置
    type: document
    size: xl
    position:
      x: 368
      'y': 256
  - id: source_boundary
    label: |-
      内部源边界
      无公开仓库或数据集
      无任务工件或许可证
      无公开排行榜
    type: document
    size: xl
    position:
      x: 608
      'y': 256
  - id: metric_boundary
    label: |-
      报告边界
      任务数量与选择漏斗
      图中有误差线但未定义
      未披露分母细节
    type: document
    size: xl
    position:
      x: 128
      'y': 464
