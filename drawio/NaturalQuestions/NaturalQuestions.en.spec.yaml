meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Natural Questions Build Process
  description: >-
    Paper-aligned Natural Questions workflow: real aggregated Google queries are filtered and paired with a top-five
    Wikipedia result, annotators classify question validity then select long, short, yes/no, or null answers, and
    single-annotation training plus five-way development/test data support consensus precision, recall, and F1.
  legend: >-
    Solid arrows show query sampling, Wikipedia pairing, three-stage annotation, release splits, consensus labeling, and
    evaluation.
nodes:
  - id: queries
    label: |-
      Real Google Queries
      Anonymized + Aggregated
      Issued by Multiple Users
    type: database
    size: xl
    position:
      x: 40
      'y': 200
  - id: query_filter
    label: |-
      Question Heuristics
      ≥8 Words; Fact-seeking Forms
      Exclude Non-questions / How-to
    type: process
    size: xl
    position:
      x: 300
      'y': 200
  - id: wikipedia
    label: |-
      Run Google Search
      Keep if Wikipedia Is in Top 5
      Pair Query with Page
    type: process
    size: xl
    position:
      x: 560
      'y': 200
  - id: question_stage
    label: |-
      Stage 1: Question Check
      Good Fact Question or Bad
      Judge before Seeing Page
    type: user
    size: xl
    position:
      x: 820
      'y': 200
  - id: long_stage
    label: |-
      Stage 2: Long Answer
      Earliest Smallest HTML Box
      Paragraph / Table / List or NULL
    type: process
    size: xl
    position:
      x: 1080
      'y': 200
  - id: short_stage
    label: |-
      Stage 3: Short Answer
      Entity Span(s) in Long Answer
      Yes / No / No Short Answer
    type: process
    size: xl
    position:
      x: 1340
      'y': 200
  - id: release
    label: |-
      Natural Questions Release
      Train 307,373: Single Annotation
      Dev 7,830 / Test 7,842: Five-way
    type: database
    size: xl
    position:
      x: 1600
      'y': 200
  - id: consensus
    label: |-
      Five-way Consensus (β=2)
      ≥2 Non-null → Match Any Answer
      <2 Non-null → Predict NULL
    type: process
    size: xl
    position:
      x: 1860
      'y': 200
  - id: model
    label: |-
      QA System
      Predict Long Answer
      Predict Short Answer or NULL
    type: process
    size: xl
    position:
      x: 2120
      'y': 200
  - id: score
    label: |-
      Separate Long / Short Results
      Precision / Recall / F1
      Answer vs Abstention Quality
    type: terminal
    size: xl
    position:
      x: 2380
      'y': 200
edges:
  - from: queries
    to: query_filter
    type: primary
  - from: query_filter
    to: wikipedia
    type: primary
  - from: wikipedia
    to: question_stage
    type: primary
  - from: question_stage
    to: long_stage
    type: primary
  - from: long_stage
    to: short_stage
    type: primary
  - from: short_stage
    to: release
    type: primary
  - from: release
    to: consensus
    type: primary
  - from: consensus
    to: model
    type: primary
  - from: model
    to: score
    type: primary
modules: []
