meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: CURE-Bench 已公开的构建与评测流程
  description: 对齐官网、固定版 starter kit 与 TxAgent v1，展示生成依据、竞赛阶段、双赛道、提交格式、已披露评测方案及非公开边界。
  legend: 实线区分 CURE 复用的 TxAgent 基础与竞赛执行；虚线表示专家有效性复核。不得把 TxAgent 规模迁移为 CURE 规模，官网两种任务计数也互相冲突。
nodes:
  - id: evidence_boundary
    label: |-
      无独立 CURE 论文
      OpenReview rD9YGynuT8
      源码 5eada4b · 套件 679b08d
      TxAgent 依据 2503.10970v1
      无固定公开数据修订版
    type: document
    size: xl
    position:
      x: 40
      'y': 220
  - id: scope
    label: |-
      治疗决策范围
      患者 · 疾病 · 药物
      治疗 · 安全 · 药品信息
    type: database
    size: xl
    position:
      x: 320
      'y': 220
  - id: taxonomy_boundary
    label: |-
      官网列出 12 个具名任务族
      评估段写 13 类任务
      两种计数未协调
    type: document
    size: xl
    position:
      x: 600
      'y': 220
  - id: questiongen
    label: |-
      TxAgent QuestionGen
      文档 → 抽取 → 问题与答案
      检查知识依据、可解性、合理性
      仅已验证问题进入下一步
    type: process
    size: xl
    position:
      x: 880
      'y': 70
  - id: tracegen
    label: |-
      TxAgent TraceGen
      已验证问题 + ToolUniverse
      辅助者 · 工具提供者 · 解题者
      核查答案、调用和轨迹
    type: process
    size: xl
    position:
      x: 1160
      'y': 220
  - id: toolgen
    label: |-
      TxAgent ToolGen
      生成 ToolUniverse
      API 文档 → 规格 → 检查器测试
      人工验证后才纳入工具库
    type: process
    size: xl
    position:
      x: 880
      'y': 370
  - id: dataset_boundary
    label: |-
      官网仅称有“数千”样例
      精确数量、提示、筛选和划分
      均未公开
    type: database
    size: xl
    position:
      x: 1440
      'y': 220
  - id: phase
    label: |-
      第一阶段：验证集与测试集
      第二阶段最终测试集：私有
      规模和不可变数据版本均缺失
    type: document
    size: xl
    position:
      x: 1720
      'y': 220
  - id: track
    label: 两条竞赛赛道
    type: decision
    size: xl
    position:
      x: 2000
      'y': 220
  - id: internal
    label: |-
      赛道一：仅使用内部参数
      禁止外部工具、API 或检索
      返回答案和推理轨迹
    type: process
    size: xl
    position:
      x: 2280
      'y': 70
  - id: agentic
    label: |-
      赛道二：生物医学工具由 ToolUniverse 提供
      推理轨迹须包含工具日志
      可用外部实时信息
    type: process
    size: xl
    position:
      x: 2280
      'y': 370
  - id: submission
    label: |-
      三种题型
      选择题 · 开放式选择题 · 开放式题
      CSV：ID · 预测 · 推理 · 选项
      ZIP 元数据：模型 · 赛道 · Token · 工具
    type: document
    size: xl
    position:
      x: 2560
      'y': 220
  - id: metrics
    label: |-
      正确性：直接 · 累积 · 开放式
      鲁棒性：改写 · 选项顺序
      效率：Token 与工具用量
    type: process
    size: xl
    position:
      x: 2840
      'y': 220
  - id: judge
    label: |-
      协作式智能体裁判
      用检索核查事实性
      评估临床相关性与治疗适宜性
    type: process
    size: xl
    position:
      x: 3120
      'y': 70
  - id: experts
    label: |-
      前 5—10 名：专家有效性复核
      临床医生 · 研究者 · 药师
      可因指标投机取消资格
    type: user
    size: xl
    position:
      x: 3120
      'y': 370
  - id: ranking
    label: |-
      最终排名：预定义加权总分
      具体权重和裁判设置未公开
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 220
