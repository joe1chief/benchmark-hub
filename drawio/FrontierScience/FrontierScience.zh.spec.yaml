meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: FrontierScience 构建流程
  description: 按论文对齐的双轨专家命题、评审、固定黄金集发布与分轨裁判协议。
  legend: 上支为奥赛轨，下支为研究轨；两支按 arXiv:2601.21165v1 构建并汇入固定版本开源黄金集，论文披露裁判提示但未发布评测器或解析器实现。
nodes:
  - id: evidence
    label: |-
      证据：arXiv:2601.21165v1
      HF 黄金集 @ 25ed67db · 160 行
      无公开评测仓库或解析器代码
    type: document
    size: xl
    position:
      x: 40
      'y': 260
  - id: olympiad_authors
    label: |-
      奥赛作者池：42 位专家
      国际奖牌得主或国家队教练
      共 108 枚：金 45 · 银 37 · 铜 26
    type: process
    size: xl
    position:
      x: 300
      'y': 80
  - id: research_authors
    label: |-
      研究作者池：45 位博士科学家
      博士生、博后或教授
      真实研究子问题，至少需 3–5 小时
    type: process
    size: xl
    position:
      x: 300
      'y': 440
  - id: olympiad_tasks
    label: |-
      创作全新、自包含奥赛任务
      难度至少达到国际奥赛水平
      数值/表达式或可模糊匹配字符串答案
    type: document
    size: xl
    position:
      x: 560
      'y': 80
  - id: research_tasks
    label: |-
      创作全新、真实的研究子问题
      完整满分解答 + 元数据
      独立客观评分项合计 10 分
    type: document
    size: xl
    position:
      x: 560
      'y': 440
  - id: olympiad_review
    label: |-
      用内部 OpenAI 模型筛难
      至少 1 次独立评审 + 整体评审
      作者与评审达成一致，否则丢弃
    type: process
    size: xl
    position:
      x: 820
      'y': 80
  - id: research_review
    label: |-
      按内部模型评分标准得分筛难
      至少 2 次独立评审 + 元评审
      作者与评审达成一致，否则丢弃
    type: process
    size: xl
    position:
      x: 820
      'y': 440
  - id: gold_release
    label: |-
      500+ → 100 奥赛题；200+ → 60 研究题
      HF 字段：problem · answer · subject
      task_group_id；研究 answer 存评分标准
    type: database
    size: xl
    position:
      x: 1080
      'y': 260
  - id: olympiad_grade
    label: |-
      裁判提示：题目 + 尝试答案 + 参考答案
      GPT-5 高；末行需为
      VERDICT: CORRECT / INCORRECT
      无浏览；20 次试验取平均准确率
    type: process
    size: xl
    position:
      x: 1340
      'y': 80
  - id: research_grade
    label: |-
      裁判提示：题目 + 尝试答案 + 10 分标准
      GPT-5 高；末行需为
      VERDICT: 2.5 或 VERDICT: 8
      无浏览；≥7/10 成功；30 次试验取平均
    type: process
    size: xl
    position:
      x: 1340
      'y': 440
  - id: report
    label: |-
      分轨报告平均准确率
      奥赛判断等价 · 研究以 ≥7 为成功
      裁判/解析器实现未发布
    type: terminal
    size: xl
    position:
      x: 1600
      'y': 260
edges:
  - from: evidence
    to: olympiad_authors
    type: primary
  - from: evidence
    to: research_authors
    type: primary
  - from: olympiad_authors
    to: olympiad_tasks
    type: primary
  - from: research_authors
    to: research_tasks
    type: primary
  - from: olympiad_tasks
    to: olympiad_review
    type: primary
  - from: research_tasks
    to: research_review
    type: primary
  - from: olympiad_review
    to: gold_release
    type: primary
  - from: research_review
    to: gold_release
    type: primary
  - from: gold_release
    to: olympiad_grade
    type: primary
  - from: gold_release
    to: research_grade
    type: primary
  - from: olympiad_grade
    to: report
    type: primary
  - from: research_grade
    to: report
    type: primary
modules: []
