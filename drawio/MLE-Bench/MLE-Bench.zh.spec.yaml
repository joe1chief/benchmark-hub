meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MLE-Bench 构建流程
  description: >-
    论文明确给出 Meta Kaggle 的 5,673 个已结束竞赛题池、排除社区竞赛并人工筛查 586 个候选、入选与复杂度标准、75 个测试加 7 个开发竞赛、使用原测试集或通常按 10%
    重切并做分布核验、离线说明/数据/本地评分器、私有榜单快照、只检查格式的校验服务、24 小时 Docker 三种子运行、GPT-4o 规则检查、Dolos 对照前 50 笔记本及 60% 人审阈值，以及相对人类的奖牌指标。
  legend: 来源：Sections 2-3 and Appendices A.1-A.5。实线箭头表示论文或官方资料明确支持的主流程。
nodes:
  - id: pool
    label: |-
      Meta Kaggle 题池
      5,673 个已结束竞赛
    type: database
    size: xl
    position:
      x: 40
      'y': 180
  - id: screen
    label: |-
      排除社区竞赛
      人工筛查 586 个
    type: process
    size: large
    position:
      x: 280
      'y': 180
  - id: criteria
    label: |-
      选择门槛
      现代 ML + 任务清晰
      本地指标 + 数据可用
    type: process
    size: xl
    position:
      x: 520
      'y': 180
  - id: selection
    label: |-
      基准入选
      75 测试 + 7 开发
      低 / 中 / 高：22 / 38 / 15
    type: database
    size: xl
    position:
      x: 760
      'y': 180
  - id: split
    label: |-
      数据集重建
      使用公开测试集或重切训练集
      通常 10% 测试 + 分布核验
    type: process
    size: xl
    position:
      x: 1000
      'y': 180
  - id: package
    label: |-
      离线竞赛包
      任务说明 + 数据
      私有榜单快照
    type: document
    size: xl
    position:
      x: 1240
      'y': 180
  - id: grading
    label: |-
      本地评分合同
      竞赛原指标
      校验服务：只查格式
    type: process
    size: xl
    position:
      x: 1480
      'y': 180
  - id: environment
    label: |-
      受控 Docker 运行
      24 小时 / A10 / 36 vCPU
      三个随机种子
    type: process
    size: xl
    position:
      x: 1720
      'y': 180
  - id: agent
    label: |-
      模型 + Agent 框架
      训练 / 调试 / 预测
      生成 submission.csv
    type: process
    size: xl
    position:
      x: 1960
      'y': 180
  - id: validation
    label: |-
      提交校验
      CSV 格式正确？
    type: process
    size: large
    position:
      x: 2200
      'y': 180
  - id: audit
    label: |-
      是否存在取消资格的完整性违规？
      Dolos >60% → 取消资格并人工复核
      GPT-4o 告警 → 人工复核；确认违规则取消资格
    type: decision
    size: xl
    position:
      x: 2680
      'y': 180
  - id: compare
    label: |-
      达到奖牌线？
      本地评分
      对照私有榜单
    type: decision
    size: large
    position:
      x: 2440
      'y': 180
  - id: metrics
    label: |-
      铜 / 银 / 金牌
      任意奖牌率 + 原始分
      可选 pass@k
    type: terminal
    size: xl
    position:
      x: 2920
      'y': 180
  - id: disqualified
    label: |-
      取消该次尝试资格
      不计入报告结果
    type: terminal
    size: xl
    position:
      x: 2680
      'y': 500
edges:
  - from: pool
    to: screen
    type: primary
  - from: screen
    to: criteria
    type: primary
  - from: criteria
    to: selection
    type: primary
  - from: selection
    to: split
    type: primary
  - from: split
    to: package
    type: primary
  - from: package
    to: grading
    type: primary
  - from: grading
    to: environment
    type: primary
  - from: environment
    to: agent
    type: primary
  - from: agent
    to: validation
    type: primary
  - from: validation
    to: compare
    type: primary
  - from: compare
    to: audit
    type: primary
    label: 是 · 奖牌候选
    labelPosition: center
  - from: audit
    to: metrics
    type: primary
    label: 否 · 无违规 / 告警为误报
    labelPosition: center
  - from: compare
    to: metrics
    type: primary
    label: 否 · 仅记录原始分
    labelPosition: center
    waypoints:
      - x: 2440
        'y': 390
      - x: 2920
        'y': 390
  - from: audit
    to: disqualified
    type: optional
    label: 是 · >60% 或确认规则违规
    labelPosition: center
modules: []
