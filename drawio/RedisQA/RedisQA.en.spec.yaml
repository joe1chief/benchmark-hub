meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: RedisQA Build and Evaluation Process
  description: >-
    The catalog item RedisQA corresponds to ReDis-QA, not a QuarkMed-created benchmark. The paper collects 1,360
    high-quality multiple-choice questions covering 205 rare diseases, annotates each item with disease and
    question-property metadata, and reports the distribution across symptoms, causes, affected populations, related
    disorders, diagnosis, and other properties. It also builds ReCOP from NORD rare-disease reports by splitting each
    report into property-aligned chunks. Models are scored by multiple-choice accuracy in direct and retrieval-augmented
    settings, with retrieved ReCOP evidence additionally supporting traceable explanations.
  legend: >-
    Source: ReDis-QA arXiv:2408.08422 dataset-construction and evaluation sections, cross-checked against
    guan-wang/ReDis-QA and ReCOP dataset cards; the catalog ID RedisQA is a casing variant of ReDis-QA. Solid arrows
    show the main flow explicitly supported by the paper or official documentation.
