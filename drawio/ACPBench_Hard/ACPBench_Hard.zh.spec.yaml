meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: ACPBench Hard 构建流程
  description: 基于 arXiv:2503.24378 对齐的 ACPBench Hard 构建与评估流程。
  legend: 实线表示基准构建和评估主流程；虚线表示验证器反馈和按任务类型执行的答案校验。
nodes:
  - id: domains
    label: |-
      规划领域
      13 个 PDDL 领域
      继承自 ACPBench
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: tasks
    label: |-
      原子规划推理任务
      7 类 ACP 任务
      追加 next action
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: planner
    label: |-
      符号规划支持
      当前状态作为初始状态
      高质量 planner + 备选 planner
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: questions
    label: |-
      开放式自然语言问题
      模板化 PDDL 转文本
      生成式答案格式
    type: document
    size: xl
    position:
      x: 560
      'y': 160
  - id: answers
    label: |-
      保存符号答案
      可执行动作、状态变化
      计划、事实、landmarks
    type: database
    size: xl
    position:
      x: 820
      'y': 160
  - id: validators
    label: |-
      任务级验证器
      解析模型生成答案
      按任务规则校验正确性
    type: decision
    size: xl
    position:
      x: 1080
      'y': 70
  - id: model_eval
    label: |-
      LLM 评测
      回答各类生成式任务
      不再提供多选项
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: release
    label: |-
      ACPBench Hard 结果
      按任务统计 accuracy
      诊断规划推理能力
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: domains
    to: tasks
    type: primary
  - from: domains
    to: planner
    type: data
  - from: tasks
    to: questions
    type: primary
  - from: planner
    to: questions
    type: primary
    label: 状态与计划
  - from: questions
    to: answers
    type: primary
  - from: answers
    to: validators
    type: data
  - from: questions
    to: model_eval
    type: primary
  - from: model_eval
    to: validators
    type: primary
    label: 生成答案
  - from: validators
    to: release
    type: primary
modules: []
