meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: VideoEval-Pro Curation Filters and Open-Answer Evaluation
  description: >-
    VideoEval-Pro collects 5,562 multiple-choice questions from Video-MME, MLVU, LVBench, and LongVideoBench, discards
    distractors to form free-response short answers, and filters sequentially: video duration over ten minutes, original
    answer-option average at most five words, Gemini 2.0 Flash answerability without options, and removal of items
    Gemini can solve from one random frame in both MCQ and open form. The final set contains 465 videos and 1,289 QA
    pairs across local/holistic perception/reasoning. Models are tested with 32-512 frames; GPT-4o-0806 labels each
    response Correct, Incorrect, or Not Attempted, and the Correct proportion is reported along with task-scope scores
    and frame-scaling behavior.
  legend: >-
    Source: VideoEval-Pro arXiv:2505.14640, benchmark construction and evaluation sections; official TIGER-Lab release.
    Solid arrows show the main flow explicitly supported by the paper or official documentation.
