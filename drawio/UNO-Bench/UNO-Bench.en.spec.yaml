meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: UNO-Bench Build and Evaluation Process
  description: >-
    UNO-Bench jointly measures uni-modal and omni-modal intelligence across 44 task types and five modality
    combinations. The authors human-curate 1,250 omni-modal samples and verify that 98 percent are solvable across
    modalities, then add 2,480 enhanced uni-modal samples for a 3,730-sample suite. It includes multiple-choice and
    multi-step open-ended questions. A compressed evaluation set accelerates public-benchmark evaluation while
    preserving reported consistency. A general scoring model supports six question formats and is human-validated at
    95-percent scoring accuracy. Results compare uni-modal and omni-modal scores to analyze the paper's compositional
    law and bottleneck effect.
  legend: >-
    Source: UNO-Bench arXiv:2510.18915; official meituan-longcat/UNO-Bench repository. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
