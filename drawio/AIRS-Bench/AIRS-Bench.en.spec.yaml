meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench Build Process
  description: Paper-aligned AI research-agent task construction and evaluation workflow for AIRS-Bench, based on arXiv:2602.06855.
  legend: >-
    Solid arrows show task sourcing, packaging, and harness evaluation; dashed arrows mark SOTA verification and
    hidden-label preparation paths.
nodes:
  - id: sources
    label: |-
      Paper and leaderboard sources
      PapersWithCode SOTA results
      2020 to 2025 ML papers
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: filter
    label: |-
      Dataset filtering
      HuggingFace availability
      train and test splits
    type: decision
    size: xl
    position:
      x: 300
      'y': 70
  - id: manual_create
    label: |-
      Manual task creation
      verify metric and splits
      update SOTA when needed
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: select20
    label: |-
      Benchmark selection
      about 100 candidates
      choose 20 tasks in 7 categories
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: metadata
    label: |-
      metadata.yaml
      problem, dataset, metric
      SOTA score and paper fields
    type: document
    size: xl
    position:
      x: 820
      'y': 70
  - id: task_files
    label: |-
      Task files
      project_description
      prepare and evaluate scripts
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: datasets
    label: |-
      Prepared data
      train split visible
      test labels hidden from agent
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      Agent evaluation
      AIRA-dojo and MLGym
      24h GPU runs and normalized score
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: sources
    to: filter
    type: primary
  - from: filter
    to: manual_create
    type: primary
  - from: manual_create
    to: filter
    type: optional
    label: verify SOTA and splits
  - from: manual_create
    to: select20
    type: primary
  - from: select20
    to: metadata
    type: primary
  - from: select20
    to: task_files
    type: data
  - from: metadata
    to: datasets
    type: primary
  - from: task_files
    to: datasets
    type: data
  - from: datasets
    to: evaluation
    type: primary
modules: []
