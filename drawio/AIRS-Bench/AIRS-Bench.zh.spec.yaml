meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AIRS-Bench 构建流程
  description: 基于 arXiv:2602.06855 对齐的 AIRS-Bench 科研 agent 任务构建与评估流程。
  legend: 实线表示任务来源、打包和 harness 评估主流程；虚线表示 SOTA 校验与隐藏标签准备路径。
nodes:
  - id: sources
    label: |-
      论文与榜单来源
      PapersWithCode SOTA 结果
      2020 至 2025 ML 论文
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: filter
    label: |-
      数据集筛选
      HuggingFace 可用
      有 train/test 划分
    type: decision
    size: xl
    position:
      x: 300
      'y': 70
  - id: manual_create
    label: |-
      人工创建任务
      核验 metric 与 split
      必要时更新 SOTA
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: select20
    label: |-
      基准任务选择
      约 100 个候选
      选 7 类中的 20 个任务
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: metadata
    label: |-
      metadata.yaml
      problem、dataset、metric
      SOTA 分数和论文信息
    type: document
    size: xl
    position:
      x: 820
      'y': 70
  - id: task_files
    label: |-
      任务文件
      project_description
      prepare 与 evaluate 脚本
    type: document
    size: xl
    position:
      x: 820
      'y': 250
  - id: datasets
    label: |-
      准备后的数据
      train split 可见
      test 标签对 agent 隐藏
    type: database
    size: xl
    position:
      x: 1080
      'y': 160
  - id: evaluation
    label: |-
      agent 评估
      AIRA-dojo 与 MLGym
      24h GPU 运行和 normalized score
    type: terminal
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: sources
    to: filter
    type: primary
  - from: filter
    to: manual_create
    type: primary
  - from: manual_create
    to: filter
    type: optional
    label: 核验 SOTA 与 split
  - from: manual_create
    to: select20
    type: primary
  - from: select20
    to: metadata
    type: primary
  - from: select20
    to: task_files
    type: data
  - from: metadata
    to: datasets
    type: primary
  - from: task_files
    to: datasets
    type: data
  - from: datasets
    to: evaluation
    type: primary
modules: []
