  title: UNICBench 构建与评测流程
  description: >-
    UNICBench统一图像、文档和音频计数：5300张图像含5508题，872份文档含5888题，2069段音频含2905题。构建者建立准确计数真值，标注三级能力分类与难度，并冻结各模态的切分和匹配规则。评测固定提示、随机种子与解码设置，以确定性规则解析数值答案，执行模态适配匹配，并按模态、能力和难度分层报告精确成功率、绝对误差与平方误差。论文在统一协议下评测45个MLLM。
  legend: 来源：UNICBench arXiv:2603.00595; official WeChatCV/UnicBench repository。实线箭头表示论文或官方资料明确支持的主流程。
