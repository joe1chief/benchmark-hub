meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MATH Build Process
  description: >-
    Paper-aligned MATH workflow: collect 12,500 competition problems from AMC 10, AMC 12, AIME, and related AoPS
    sources; categorize them into seven subjects and AoPS difficulty levels 1-5; encode problems and solutions in
    consistent LaTeX and Asymptote; attach a full step-by-step solution and boxed final answer; split 7,500 training and
    5,000 test problems; optionally pretrain the evaluated model on the separate Khan Academy plus Mathematica AMPS
    corpus; generate an answer; parse boxed content; normalize equivalent forms; and report accuracy.
  legend: The upper flow constructs MATH; the lower auxiliary branch is optional AMPS model pretraining.
