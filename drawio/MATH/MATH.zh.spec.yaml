meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MATH 构建流程
  description: >-
    依据论文重绘的 MATH 流程：从 AMC 10、AMC 12、AIME 及相关 AoPS 来源收集 12,500 道竞赛题，按七个科目 与 AoPS 1 至 5 级难度分类；使用一致的 LaTeX 与 Asymptote
    编码题目和解答，为每题附逐步解与 boxed 最终 答案；划分 7,500 道训练题和 5,000 道测试题；被测模型可选择在独立的 Khan Academy 加 Mathematica AMPS 辅助语料上预训练；生成答案后抽取
    boxed 内容、归一化等价形式，并以准确率评分。
  legend: 上方主线构建 MATH；下方辅助分支表示可选的 AMPS 模型预训练。
nodes:
  - id: sources
    label: 数学竞赛来源
    type: database
    size: large
    position:
      x: 40
      'y': 220
  - id: collect
    label: 收集12500题
    type: document
    size: large
    position:
      x: 240
      'y': 220
  - id: subjects
    label: 七个数学科目
    type: process
    size: large
    position:
      x: 440
      'y': 220
  - id: levels
    label: AoPS难度1至5
    type: process
    size: large
    position:
      x: 640
      'y': 220
  - id: format
    label: LaTeX与Asy
    type: process
    size: large
    position:
      x: 840
      'y': 220
  - id: solutions
    label: 逐步解与框选答案
    type: process
    size: large
    position:
      x: 1040
      'y': 220
  - id: split
    label: 数据集划分
    type: decision
    size: large
    position:
      x: 1240
      'y': 220
  - id: train
    label: 训练集7500题
    type: document
    size: large
    position:
      x: 1440
      'y': 100
  - id: test
    label: 测试集5000题
    type: document
    size: large
    position:
      x: 1440
      'y': 300
  - id: amps
    label: AMPS辅助语料
    type: database
    size: large
    position:
      x: 1240
      'y': 500
  - id: setup
    label: 训练或少样本设置
    type: process
    size: large
    position:
      x: 1680
      'y': 180
  - id: generate
    label: 生成最终答案
    type: process
    size: large
    position:
      x: 1900
      'y': 260
  - id: parse
    label: 抽取框选内容
    type: process
    size: large
    position:
      x: 2120
      'y': 260
  - id: normalize
    label: 归一化等价形式
    type: process
    size: large
    position:
      x: 2340
      'y': 260
  - id: score
    label: 准确率
    type: terminal
    size: large
    position:
      x: 2560
      'y': 260
edges:
  - from: sources
    to: collect
    type: primary
  - from: collect
    to: subjects
    type: primary
  - from: subjects
    to: levels
    type: primary
  - from: levels
    to: format
    type: primary
  - from: format
    to: solutions
    type: primary
  - from: solutions
    to: split
    type: primary
  - from: split
    to: train
    type: primary
  - from: split
    to: test
    type: primary
  - from: train
    to: setup
    type: primary
  - from: amps
    to: setup
    type: optional
    waypoints:
      - x: 1440
        'y': 620
      - x: 1640
        'y': 620
      - x: 1640
        'y': 260
  - from: setup
