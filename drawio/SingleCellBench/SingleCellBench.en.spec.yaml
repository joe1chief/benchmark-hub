  routing: orthogonal
  title: SingleCellBench Build and Evaluation Process
  description: >-
    SingleCellBench is a LatchBio evaluation variant documented only in the Claude Sonnet 5 system card, not in a
    standalone benchmark paper. The card says it contains 195 problems that test analysis of single-cell RNA-sequencing
    data across standard workflows including cell-type labeling, differential-expression analysis, and batch-effect
    correction. It reports aggregate model scores for the variant. The source does not disclose how the 195 problems
    were sourced or annotated, dataset splits, prompt and tool setup, reference-answer format, per-item scoring rubric,
    or aggregation formula. The diagram therefore separates the few disclosed task-scope facts from an explicit
    undisclosed-method boundary instead of inventing a build process.
  legend: >-
    Source: Claude Sonnet 5 System Card Section 8.14.2 LatchBio Bioinformatics, p.142. Solid arrows show the main flow
    explicitly supported by the paper or official documentation.
