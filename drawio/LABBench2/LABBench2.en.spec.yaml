meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: LABBench2 Build Process
  description: >-
    Paper-v2-aligned construction of 1,912 biology-research evaluation rows through six separately evidenced task
    pipelines, exact release and input-mode boundaries, tag-routed verification, and downstream reporting.
  legend: >-
    The six construction boxes are independent pipelines with task-specific quality controls. FigQA2 and TableQA2 counts
    include separate retrieval, full-paper PDF, and image rows for the same 101/100 underlying questions.
nodes:
  - id: evidence
    label: |-
      Primary Evidence + Fixed Revisions
      arXiv:2604.09554v2 · 2026-05-05
      Git c028ecdc · 2026-05-07
      HF 27d12d72 · 2026-03-13
      Official Leaderboard Checked 2026-07-21
    type: document
    size: xl
    position:
      x: 24
      'y': 0
  - id: scope
    label: |-
      Define Five Research Families
      Literature 1,287 · Data Access 86
      Molecular Biology 400 · Protocols 125
      Experiment Planning 14 · Total 1,912
      Open-response Retrieval and File Tasks
    type: document
    size: xl
    position:
      x: 24
      'y': 640
  - id: literature_pipeline
    label: |-
      Expert Literature · 1,137 Rows
      LitQA3 168 · Patent 121 · Trial 120
      Supp 125 · Fig 101×3 · Table 100×3
      PhD Contractors · Custom Platform
      Source-only · Multi-round Review
    type: user
    size: xl
    position:
      x: 480
      'y': 0
  - id: sourcequality_pipeline
    label: |-
      SourceQualQA · 150 Rows
      100 Open Systematic Reviews
      Causal Q · Excluded Study · Rationale
      File Mode: Excluded-study PDF
      Expert Answerability Check
    type: process
    size: xl
    position:
      x: 480
      'y': 240
  - id: dbqa_pipeline
    label: |-
      DbQA2 · 86 Rows
      LLM-scan 1,000 Recent bioRxiv Papers
      Rank Sources by Representation · Curate and Add
      43 Sources → Internal + Contracted Expert Questions
      Multi-round Review and Revision
    type: process
    size: xl
    position:
      x: 480
      'y': 480
  - id: seqqa_pipeline
    label: |-
      SeqQA2 · 400 · 20 Templates
      20 Designed/Real Variants Each
      Preserve Mode + Validator Parameters
      Build 20 Verifier Families
    type: process
    size: xl
    position:
      x: 480
      'y': 720
  - id: protocol_pipeline
    label: |-
      ProtocolQA2 · 125 Rows
      protocols.io · STAR · Expert Protocols
      Some Expert Protocols Are Unpublished
      Expert Injects One Clear Failure
      Scenario + Result · Request One Error
    type: user
    size: xl
    position:
      x: 480
      'y': 960
  - id: cloning_pipeline
    label: |-
      CloningQA · 14 Rows
      Restriction · Gibson · Golden Gate
      Design DNA/Enzymes + Full Steps
      Parseable DSL for In-silico Checks
      Construction Provenance/QC Unreported
    type: process
    size: xl
    position:
      x: 480
      'y': 1200
  - id: dataset
    label: |-
      Release LABBench2 · 1,912 Eval Rows
      Five Families · 1,287+86+400+125+14
      HF all + 15 Configs · Split: train
      Auto-gated Parquet · Public GCS Files
      ideal · sources · mode · grader metadata
    type: database
    size: xl
    position:
      x: 936
      'y': 600
  - id: document_modes
    label: |-
      Document and Retrieval Modes
      Fig: inject/PDF/image · 101 Each
      Table: inject/PDF/image · 100 Each
      Lit/Patent/Trial/Supp/Db: inject
      SourceQuality + ProtocolQA2: file
    type: process
    size: xl
    position:
      x: 1392
      'y': 360
  - id: sequence_modes
    label: |-
      Sequence Delivery Modes
      SeqQA2: inject 400 · file 400
      retrieve 200
      Cloning: inject/file/retrieve · 14 Each
      Honor mode · Retrieval Is Not an Alias
    type: process
    size: xl
    position:
      x: 1392
      'y': 840
  - id: evaluate
    label: |-
      Run Official Evaluation Harness
      Base Systems: No Tools
      Tools: Web Search + Code Execution
      Route Prompts · Files · Retrieval
      HybridEvaluator Dispatches by Tag
    type: process
    size: xl
    position:
      x: 1848
      'y': 600
  - id: semantic_judge
    label: |-
      General Semantic LLM Judge
      LitQA3 · Patent · Trial · SourceQuality · Protocol
      Claude Sonnet 4.5 · Temperature 0
      Accept Semantic or Numeric Equivalence
      Correct 1 · Incorrect / Unsure / Judge Error 0
    type: process
    size: xl
    position:
      x: 2304
      'y': 0
  - id: dbqa_judge
    label: |-
      DbQA2 Recall LLM Judge
      Recall = Matched Expected / Total Expected
      Numeric Values within ±5% Unless Exact Is Required
      Recall ≥ 0.95 → 1
      Lower Recall / Unsure / Judge Error → 0
    type: process
    size: xl
    position:
      x: 2304
      'y': 240
  - id: numeric_judge
    label: |-
      Numeric LLM Judge
      FigQA2* · TableQA2* · SuppQA2
      Absolute or Relative Difference < 1e-6
      Honor Explicit Output-format Requirements
      Correct 1 · Otherwise / Unsure / Judge Error 0
    type: process
    size: xl
    position:
      x: 2304
      'y': 480
  - id: seqqa_verifier
    label: |-
      SeqQA2 Deterministic Verifier
      Parse [answer] via answer_regex
      Merge validator_params + Fields
      Run One of 20 Verifier Families
      Parse/File/Validator Failure → 0
    type: process
    size: xl
    position:
      x: 2304
      'y': 720
  - id: cloning_verifier
    label: |-
      CloningQA DSL Verifier
      Parse + Execute [protocol]
      Similarity = 1 − Levenshtein / Max Length
      Pass ≥ 0.95 · Rotation-aware
      Optional Digest Check · Failure → 0
    type: process
    size: xl
    position:
      x: 2304
      'y': 960
  - id: score
    label: |-
      Compute Evaluation Metrics
      Overall = Correct / (Completed + Runtime Failures)
      Attempted = Correct / Completed
      Every Runtime Failure Counts 0
      Break Down by Family · Mode · Type · Base/Tools
    type: terminal
    size: xl
    position:
      x: 2760
      'y': 480
  - id: leaderboard
    label: |-
      Official Live Leaderboard
      Macro-mean over 15 Sub-benchmarks
      Repeat Runs Averaged · Standard-error Whiskers
      Aggregate Comparison Requires Coverage ≥ 14/15
      9 Models · 201 Runs Observed 2026-07-21
    type: terminal
    size: xl
    position:
      x: 3216
      'y': 240
  - id: release_drift
    label: |-
      Release and Result Drift
      v1 / OpenReview 1,883 → arXiv v2 1,912
      2026-03-13: Replace 150 SourceQuality
      inject → file · 03-23 Runner Fix
      Blog 1,892 + HF Paper ID Are Stale
    type: document
    size: xl
    position:
      x: 3216
      'y': 840
  - id: artifact_boundary
    label: |-
      Artifact and Disclosure Boundary
      Auto-gated Tasks · Public Harness/GCS
      train Is a Split Name, Not Training Use
      No Reported Split/Dedup/Contamination
      Cloning Provenance and QC Unreported
    type: document
    size: xl
    position:
      x: 3672
      'y': 480
