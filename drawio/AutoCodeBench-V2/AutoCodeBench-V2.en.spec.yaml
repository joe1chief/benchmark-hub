meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: AutoCodeBench-V2 Build Process
  description: >-
    Paper-aligned AutoCodeGen workflow for the AutoCodeBench series: multilingual seed extraction, sandbox-backed test
    generation, reverse problem generation, three-stage filtering, series subset creation, and Pass@1 evaluation, based
    on arXiv:2508.09101.
  legend: Solid arrows show automated benchmark construction and evaluation; dashed arrows mark sandbox and quality feedback.
nodes:
  - id: seeds
    label: |-
      Stack-Edu seeds
      GitHub educational code
      function, class, file levels
    type: database
    size: xl
    position:
      x: 40
      'y': 160
  - id: solutions
    label: |-
      Solution generation
      DeepSeek-V3 few-shot
      self-contained code
    type: process
    size: xl
    position:
      x: 300
      'y': 70
  - id: sandbox
    label: |-
      Sandbox validation
      20+ languages
      executability check
    type: terminal
    size: xl
    position:
      x: 300
      'y': 250
  - id: tests
    label: |-
      Test functions
      public <=3 cases
      private 7+ edge cases
    type: process
    size: xl
    position:
      x: 560
      'y': 160
  - id: problem_generation
    label: |-
      Reverse problem generation
      language and I/O specs
      no solution hints
    type: document
    size: xl
    position:
      x: 820
      'y': 70
  - id: filtering
    label: |-
      Three-stage filtering
      10-sample difficulty
      R1 critic and tagging
    type: decision
    size: xl
    position:
      x: 820
      'y': 250
  - id: benchmark
    label: |-
      AutoCodeBench
      3,920 problems
      20 languages / 14 categories
    type: database
    size: xl
    position:
      x: 1080
      'y': 70
  - id: series
    label: |-
      Series variants
      ACB-Lite by pass counts
      ACB-Complete for base LMs
    type: database
    size: xl
    position:
      x: 1080
      'y': 250
  - id: evaluation
    label: |-
      Evaluation
      Pass@1
      30+ LLMs, standard prompt
    type: process
    size: xl
    position:
      x: 1340
      'y': 160
edges:
  - from: seeds
    to: solutions
    type: primary
  - from: solutions
    to: sandbox
    type: primary
  - from: sandbox
    to: tests
    type: primary
  - from: tests
    to: problem_generation
    type: primary
  - from: problem_generation
    to: filtering
    type: primary
  - from: filtering
    to: benchmark
    type: primary
  - from: benchmark
    to: series
    type: primary
  - from: series
    to: evaluation
    type: primary
  - from: sandbox
    to: solutions
    type: optional
    label: repair failures
  - from: filtering
    to: problem_generation
    type: optional
    label: discard or regenerate
modules: []
