    type: primary
    style:
      exitX: 0.33
      exitY: 1
      exitDx: 0
      exitDy: 0
      entryX: 0.5
      entryY: 0
      entryDx: 0
      entryDy: 0
  - from: version_tags
    to: private_window
    type: primary
    waypoints:
      - x: 2600
        'y': 880
      - x: 2600
        'y': 1240
  - from: public_release
    to: current_snapshot
    type: primary
    waypoints:
      - x: 2160
        'y': 1000
      - x: 2160
        'y': 1040
      - x: 1920
        'y': 1040
  - from: private_window
    to: current_snapshot
    type: primary
    waypoints:
      - x: 2120
        'y': 1240
      - x: 2120
        'y': 1160
      - x: 1920
