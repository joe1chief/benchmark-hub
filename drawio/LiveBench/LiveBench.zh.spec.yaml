    to: release_boundary
    type: data
    style:
      exitX: 1
      exitY: 0.5
      exitDx: 0
      exitDy: 0
      entryX: 0
      entryY: 0.5
      entryDx: 0
      entryDy: 0
modules:
  - id: construction
    label: 构建
    color: $primaryLight
  - id: maintenance
    label: 更新
    color: $secondaryLight
  - id: evaluation
    label: 评测
    color: $accentLight
  - id: aggregation
    label: 聚合
    color: $primaryLight
  - id: evidence_boundary
    label: 证据
    color: $surface
