      entryY: 0
      entryDx: 0
      entryDy: 0
  - from: update_select
    to: regenerate
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      exitDx: 0
      exitDy: 0
      entryX: 0
      entryY: 0.5
      entryDx: 0
      entryDy: 0
  - from: regenerate
    to: version_tags
