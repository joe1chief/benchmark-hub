meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: DreamBench++ 构建流程
  description: 对齐论文与发布版本的图像策展、GPT-4o 提示生成、个性化生成和人类对齐评测流程。
  legend: 实线表示核心数据与裁判流程；虚线把发布边界和独立人工评分与 GPT 评分分开。
nodes:
  - id: evidence_boundary
    label: |-
      证据边界
      arXiv 2406.16855v2
      仓库 66ca27e5
      HF 版本 459b0649
      data.zip 提交 d5b0c8a2
    type: document
    size: xl
    position:
      x: 40
      'y': 250
  - id: keywords
    label: |-
      候选主体关键词
      GPT-4o 生成 200
      Unsplash 热词 200
      去重后由 7 位标注员扩展
      扩展后约 300 个关键词
    type: process
    size: xl
    position:
      x: 300
      'y': 250
  - id: sources
    label: |-
      获取候选参考图
      Unsplash · Rawpixel
      Google 搜索
      获授权个人贡献
      核验学术使用版权状态
    type: database
    size: xl
    position:
      x: 560
      'y': 250
  - id: sam
    label: |-
      SAM 自动筛选
      移除主体面积过小的图像
    type: process
    size: xl
    position:
      x: 820
      'y': 250
  - id: human_qc
    label: |-
      7 位标注员质量控制
      移除噪声背景和 NSFW
      裁剪并居中主体
      每个关键词保留两张图
      丢弃无合适图像的关键词
    type: process
    size: xl
    position:
      x: 1080
      'y': 250
  - id: balance
    label: |-
      补强非写实风格
      动漫 · 素描 · 国画
      艺术作品 · 游戏卡通
      平衡主体类别与图像风格
    type: process
    size: xl
    position:
      x: 1340
      'y': 250
  - id: prompts
    label: |-
      GPT-4o 每图生成 9 个提示
      PartiPrompts 少样本 · 人工校准
      写实 4 + 非写实 3 + 想象 2
      600 + 450 + 300 = 1,350 个提示
    type: document
    size: xl
    position:
      x: 1600
      'y': 250
  - id: release
    label: |-
      核心发布集 · 150 张图
      动物 45 · 人物 20 · 物体 65
      风格 20 · 写实 120 + 非写实 30
      150 个说明文件 · 每图 9 个提示
    type: database
    size: xl
    position:
      x: 1860
      'y': 250
  - id: release_boundary
    label: |-
      发布边界
      无训练、验证或测试划分
      输出与评分存于未版本化 Drive
      不属于固定 HF 核心集
    type: terminal
    size: xl
    position:
      x: 2120
      'y': 650
  - id: methods
    label: |-
      论文评测的七种方法
      TI · DB · DB-LoRA
      BLIP-Diffusion · Emu2
      IP-Adapter Plus-H · ViT-G
      SD1.5 / SDXL
    type: process
    size: xl
    position:
      x: 2120
      'y': 250
  - id: generation
    label: |-
      1,350 × 7 = 9,450 张目标输出
      默认 100 步 · 引导系数 7.5
      Emu2：50 步 · 引导系数 3
      IP-Adapter 比例 0.6 · 种子 42
    type: process
    size: xl
    position:
      x: 2380
      'y': 250
  - id: meta
    label: |-
      人工编写 CP / PF 元提示
      任务 · 量表 · 原始 0–4 · 格式
      GPT-4o-2024-05-13
      温度 1 · 最多重试 3 次
    type: document
    size: xl
    position:
      x: 2640
      'y': 250
  - id: prefill
    label: |-
      静态总结规划 assistant prefill
      每个实例一次评分调用
      非动态两次调用规划
    type: process
    size: xl
    position:
      x: 2900
      'y': 250
  - id: dimensions
    label: |-
      两个独立评分维度
      CP：参考图 + 生成图
      PF：文本 + 生成图
    type: decision
    size: xl
    position:
      x: 3160
      'y': 250
  - id: concept
    label: |-
      概念保持
      主体：形状 · 颜色 · 纹理 · 面部
      风格：色调 · 笔触 · 纹理
      风格表现
    type: document
    size: xl
    position:
      x: 3420
      'y': 90
  - id: following
    label: |-
      提示遵循
      相关性 · 准确性
      完整性 · 上下文
      不输入参考图
    type: document
    size: xl
    position:
      x: 3420
      'y': 410
  - id: gpt_score
    label: |-
      每个维度原始 0–4 分
      报告均值 / 4，映射到 0–1
      full / full2 / full3 三次运行
      汇总均值 ± 标准差
    type: terminal
    size: xl
    position:
      x: 3680
      'y': 250
  - id: human
    label: |-
      独立人工评分
      7 位受训标注员 · 同一量表
      GPT 与人工评分隔离
      每个实例至少 2 个人工评分
    type: process
    size: xl
    position:
      x: 3680
      'y': 650
  - id: agreement
    label: |-
      区间 Krippendorff alpha
      H-H 按方法及 CP / PF 计算
      G-H = 各人工组结果均值
      Pearson 分开报告
    type: process
    size: xl
    position:
      x: 3940
      'y': 330
  - id: report
    label: |-
      指标对齐报告
      比较 GPT-4o、DINO、CLIP-I/T
      alpha / Pearson 属于验证分析
      不是逐图基准得分
    type: terminal
    size: xl
    position:
      x: 4200
      'y': 330
edges:
  - from: evidence_boundary
    to: keywords
    type: primary
  - from: keywords
    to: sources
    type: primary
  - from: sources
    to: sam
    type: primary
  - from: sam
    to: human_qc
    type: primary
  - from: human_qc
    to: balance
    type: primary
  - from: balance
    to: prompts
    type: primary
  - from: prompts
    to: release
    type: primary
  - from: release
    to: release_boundary
    type: optional
  - from: release
    to: methods
    type: primary
  - from: methods
    to: generation
    type: primary
  - from: generation
    to: meta
    type: primary
  - from: meta
    to: prefill
    type: primary
  - from: prefill
    to: dimensions
    type: primary
  - from: dimensions
    to: concept
    type: primary
    label: 概念保持
    labelPosition: center
  - from: dimensions
    to: following
    type: primary
    label: 提示遵循
    labelPosition: center
  - from: concept
    to: gpt_score
    type: primary
  - from: following
    to: gpt_score
    type: primary
  - from: generation
    to: human
    type: optional
  - from: gpt_score
    to: agreement
    type: primary
  - from: human
    to: agreement
    type: primary
  - from: agreement
    to: report
    type: primary
modules: []
