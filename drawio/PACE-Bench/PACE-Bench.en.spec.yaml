meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: PACE-Bench Construction, Validation, and Release
  description: >-
    Paper-v2 and fixed-source alignment for strict Local/Global proxy selection, held-out-model validation, and the
    separate fit-all release of four weighted target proxies.
  legend: >-
    Primary edges separate LOOCV validation from fit-all publication. Dashed edges isolate fixed evidence,
    paper-versus-code SVD behavior, release identity, unresolved content, and mixed upstream licenses.
nodes:
  - id: evidence
    label: |-
      Fixed Primary Evidence
      arXiv 2607.02032v2 · 0af39b8c953f
      Git dc2ef80e00ad · a42cd03e0977
      HF ce177cfe25bc · c7fbf603d2d6
    type: document
    size: xl
    position:
      x: 20
      'y': 40
  - id: targets
    label: |-
      Evaluate Four Agentic Targets
      GAIA 165 · SWE-Bench Verified 500
      SWE-Bench Multimodal 102
      SWT-Bench 430 · 14 Models
      OpenHands Index
    type: database
    size: xl
    position:
      x: 260
      'y': 40
  - id: sources
    label: |-
      19 Non-agentic Benchmarks
      Instance Scores · 11 Capabilities
      lm-evaluation-harness
      Official Code · Multimodal Signals
    type: database
    size: xl
    position:
      x: 500
      'y': 220
  - id: matrices
    label: |-
      Build Source and Target Matrices
      X: Model by Source-instance Scores
      P: Per-target-instance Agent Scores
      Drop Near-zero-variance Columns
    type: database
    size: xl
    position:
      x: 740
      'y': 40
  - id: protocol_gate
    label: |-
      Choose Protocol
      Held-out Validation
      or Fit-all Publication
    type: decision
    size: xl
    position:
      x: 980
      'y': 40
  - id: loocv
    label: |-
      Run Strict Model LOOCV
      Hold Out One of 14 Models
      Select and Fit on the Other 13
      Aggregate 14 Held-out Predictions
    type: process
    size: xl
    position:
      x: 1220
      'y': 40
  - id: global_basis
    label: |-
      Form the Paper Global SVD Basis
      Thin SVD of Calibration-only X
      Retain Right-singular Geometry V
      Method Excludes Held-out Model
    type: process
    size: xl
    position:
      x: 1460
      'y': 40
  - id: code_boundary
    label: |-
      Paper-code SVD Boundary
      Paper Excludes Held-out Model
      cli.py Vt_full Uses All 14 X Rows
      Target Y Uses Training Fold Only
    type: document
    size: xl
    position:
      x: 1700
      'y': 40
  - id: signals
    label: |-
      Score Every Candidate Instance
      Relevance: Absolute Spearman rho
      Leverage h: Squared V-loading Sum
      rho: Calibration Models Only
    type: process
    size: xl
    position:
      x: 1460
      'y': 400
  - id: selection_gate
    label: |-
      Split Strict Budget C
      Local Budget C_L
      Global Budget C_G
    type: decision
    size: xl
    position:
      x: 1220
      'y': 400
  - id: local
    label: |-
      Select Local Subset L
      Rank by Absolute Spearman rho
      Recompute SVD on Selected X_L
      Build Target-adapted Local Basis
    type: process
    size: xl
    position:
      x: 980
      'y': 280
  - id: global
    label: |-
      Select Global Subset G
      Rank by h Times Absolute rho
      Use Global Source-pool Geometry
      Balance Information and Relevance
    type: process
    size: xl
    position:
      x: 980
      'y': 520
  - id: union
    label: |-
      C Unique Composite Instances
      Union L and G · C_L:C_G Ratio
      Extend Each Ranking Past Overlap
      Stop at C = 100 per Target
    type: database
    size: xl
    position:
      x: 740
      'y': 400
  - id: embeddings
    label: |-
      Embed Calibration/Held-out Models
      Local SVD Coordinates for L
      Global Pseudoinverse Coordinates
      Keep the Two Views Separate
    type: process
    size: xl
    position:
      x: 500
      'y': 400
  - id: bootstrap
    label: |-
      Bootstrap Target after Selection
      Resample Items with Replacement
      B = 300 · Seed 42
      Pool Noisy Target Means for Fitting
    type: process
    size: xl
    position:
      x: 260
      'y': 400
  - id: goal_gate
    label: |-
      Prediction Goal
      Absolute Score
      or Pairwise Order
    type: decision
    size: xl
    position:
      x: 20
      'y': 400
  - id: absolute
    label: |-
      Goal A: Released Implementation
      SVD Coordinates
      Spearman Weights · Intercept OLS
      Bootstrapped Target Means
      Paper: Raw C-vector Predictor
    type: process
    size: xl
    position:
      x: 20
      'y': 700
  - id: pairwise
    label: |-
      Goal B: Pairwise Preference
      Ordered Model-score Differences
      Fit Ridge Logistic Regressors
      Reuse Goal A Instance Selection
    type: process
    size: xl
    position:
      x: 260
      'y': 920
  - id: ensemble
    label: |-
      Ensemble Local + Global Paths
      Lambda Blends Held-out Predictions
      Tune Split Ranks + Target Mixture
      Keep Strict 100-instance Union
    type: process
    size: xl
    position:
      x: 500
      'y': 800
  - id: report
    label: |-
      Auto-tuned LOOCV · C=100
      MAE 3.80% · Spearman 0.81
      Pearson 0.74
      Pairwise Accuracy 84.37%
      Target Cost Below 1 Percent
      Aggregated Held-out Labels
    type: terminal
    size: xl
    position:
      x: 740
      'y': 800
  - id: fit_all
    label: |-
      Materialize Fit-all PACE-Bench
      Fixed Hyperparameters
      Use All 14 Models
      No Held-out Prediction
      Fit Per-path Weights · Four Targets
    type: process
    size: xl
    position:
      x: 1700
      'y': 1050
  - id: hf_release
    label: |-
      Weighted JSONL Files · Images
      GAIA 100 · SWE 100 · MM 105
      SWT 107 · Prompt/Answer/Metric
      Weight · 12 Selected Sources
      from 19 Candidates
    type: database
    size: xl
    position:
      x: 1460
      'y': 1050
  - id: release_boundary
    label: |-
      Validation and Identity Boundary
      LOOCV Is Not Fit-all Evaluation
      100 Unique Composite Keys/File
      Five MM · Seven SWT
      H/G Duplicate Rows
    type: document
    size: xl
    position:
      x: 1220
      'y': 1050
  - id: content_boundary
    label: |-
      Published-content Boundary
      405 of 412 Rows Resolved
      Seven Rows Unresolved
      after Upstream Drift · Identity
      Benchmark Subdir Instance ID
    type: document
    size: xl
    position:
      x: 980
      'y': 1050
  - id: license_boundary
    label: |-
      Openness and License Boundary
      HF Declares mixed-upstream
      Upstream Terms Kept per Instance
      Git: No LICENSE
      No Tagged Release
    type: document
    size: xl
    position:
      x: 740
      'y': 1050
