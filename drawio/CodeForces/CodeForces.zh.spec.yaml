meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: 证据边界明确的 Codeforces 评测流程
  description: 依据官方来源将 Codeforces 作为可配置评测平台，而不虚构固定基准、划分、提示、判题器或指标。
  legend: 实线表示必须冻结的协议决策；在线/离线判题和两类聚合方式保持为明确备选分支。
nodes:
  - id: evidence
    label: |-
      证据边界
      无独立论文 • 无固定数据集
      官方 API 文档 + Blog 20762
    type: document
    size: xl
    position:
      x: 40
      'y': 240
  - id: platform
    label: |-
      Codeforces 平台
      公开比赛 + 题库
      持续更新
    type: database
    size: xl
    position:
      x: 320
      'y': 240
  - id: objects
    label: |-
      官方 API 对象
      Problem • Contest • Submission
      RanklistRow + RatingChange
    type: document
    size: xl
    position:
      x: 600
      'y': 240
  - id: identity
    label: |-
      不是固定基准
      无标准题数、划分
      提示、尝试预算或得分
    type: process
    size: xl
    position:
      x: 880
      'y': 240
  - id: selection
    label: |-
      冻结报告选题
      比赛时间窗 • 题目子集
      污染 + 资格规则
    type: process
    size: xl
    position:
      x: 1160
      'y': 240
  - id: protocol
    label: |-
      冻结模型协议
      提示 • 语言 • 尝试预算
      工具 • 采样 • 时间预算
    type: process
    size: xl
    position:
      x: 1440
      'y': 240
  - id: model
    label: |-
      生成完整程序
      保留尝试顺序
      记录每个提交候选
    type: process
    size: xl
    position:
      x: 1720
      'y': 240
  - id: judge_route
    label: 选择判题路径
    type: decision
    size: xl
    position:
      x: 2000
      'y': 240
  - id: online
    label: |-
      官方在线提交
      Codeforces 隐藏测试 + 评测器
      平台限制与判定
    type: process
    size: xl
    position:
      x: 2280
      'y': 80
  - id: offline
    label: |-
      报告自有离线评测器
      报告自有测试 + 沙箱
      必须详述；并非标准协议
    type: process
    size: xl
    position:
      x: 2280
      'y': 400
  - id: outcome
    label: |-
      逐提交结果
      判定 • testset • passedTestCount
      时间 + 内存消耗
    type: document
    size: xl
    position:
      x: 2560
      'y': 240
  - id: aggregation_route
    label: 选择聚合方式
    type: decision
    size: xl
    position:
      x: 2840
      'y': 240
  - id: fixed_metric
    label: |-
      固定题集指标
      准确率或 Pass@k
      仅在报告定义后使用
    type: document
    size: xl
    position:
      x: 3120
      'y': 80
  - id: contest_metric
    label: |-
      比赛指标
      得分 • 罚时 • 排名 • 等级分
      仅在报告定义后使用
    type: document
    size: xl
    position:
      x: 3120
      'y': 400
  - id: report
    label: |-
      完整披露的评测报告
      选题 + 协议 + 判题 + 指标
      只比较相同冻结协议
    type: terminal
    size: xl
    position:
      x: 3400
      'y': 240
edges:
  - from: evidence
    to: platform
    type: primary
  - from: platform
    to: objects
    type: primary
  - from: objects
    to: identity
    type: primary
  - from: identity
    to: selection
    type: primary
  - from: selection
    to: protocol
    type: primary
  - from: protocol
    to: model
    type: primary
  - from: model
    to: judge_route
    type: primary
  - from: judge_route
    to: online
    type: primary
  - from: judge_route
    to: offline
    type: primary
  - from: online
    to: outcome
    type: primary
  - from: offline
    to: outcome
    type: primary
  - from: outcome
    to: aggregation_route
    type: primary
  - from: aggregation_route
    to: fixed_metric
    type: primary
  - from: aggregation_route
    to: contest_metric
    type: primary
  - from: fixed_metric
    to: report
    type: primary
  - from: contest_metric
    to: report
    type: primary
modules: []
