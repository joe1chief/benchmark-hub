  title: OneMillion-Bench Build and Evaluation Process
  description: >-
    Paper-v1-aligned expert task creation, adversarial filtering, rubric scoring, and economic-value reporting, with the
    fixed public dataset and its README evaluator shown as a separate release boundary.
  legend: >-
    The benchmark contains 400 tasks: 40 Global and 40 Chinese tasks in each of five domains. Dashed edges mark evidence
    or release drift rather than the primary construction and evaluation flow.
