meta:
  profile: academic-paper
  source: edited
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: MT-Bench-101 构建与评测流程
  description: 按论文、数据集和评测器固定版本展示 MT-Bench-101：从对话能力归纳与全票筛选，到黄金上下文评分、解析失败处理及论文分层聚合。
  legend: 实线表示论文记录的构建或评测路径；虚线表示证据、审计、验证或实现边界。图中分别标注论文协议与固定 OpenCompass 版本的实际行为。
nodes:
  - id: evidence
    label: |-
      证据与版本固定点
      论文 2402.14762v3
      数据仓库 bc18b3e2
      OpenCompass 分支 da7b1c3a
      JSONL SHA-256 1a1e433a…d80
    type: document
    size: xl
    position:
      x: 40
      'y': 280
  - id: dialogue_sources
    label: |-
      归纳细粒度能力
      检查 ShareGPT 与 RealChat
      分析人类与 LLM 对话
      融入教育心理学
    type: database
    size: xl
    position:
      x: 320
      'y': 280
  - id: taxonomy
    label: |-
      三层能力分类法
      感知性 · 适应性 · 交互性
      记忆 · 理解 · 抗干扰
      改述 · 反思 · 推理 · 提问
    type: process
    size: xl
    position:
      x: 600
      'y': 280
  - id: task_catalog
    label: |-
      定义 13 项第三层任务
      CM · AR · SI · TS · CC · CR · FR
      SC · SA · MR · GR · IC · PI
      30 个主题 · 每任务至少 10 个
    type: document
    size: xl
    position:
      x: 880
      'y': 280
  - id: generation_prompts
    label: |-
      构建任务专属 GPT-4 提示
      统一的初始指令
      各任务独有规则
      人工编写示例
    type: document
    size: xl
    position:
      x: 1160
      'y': 280
  - id: generate
    label: |-
      生成候选对话
      GPT-4 每任务生成超过 1,000 条
      遵循指定能力约束
      覆盖主题清单
    type: process
    size: xl
    position:
      x: 1440
      'y': 280
  - id: screen
    label: |-
      应用五类筛选准则
      任务规则与主题多样性
      删除近似重复
      排除实时或 2022 年后知识
      拒绝常识错误、冒犯与隐私信息
    type: user
    size: xl
    position:
      x: 1720
      'y': 280
  - id: curation_gate
    label: |-
      五名标注员是否
      全部通过该候选？
    type: decision
    size: xl
    position:
      x: 2000
      'y': 280
  - id: release
    label: |-
      发布 MT-Bench-101
      1,388 个英文对话
      4,208 个历史轮次 · 13 项任务
      公开 · Apache-2.0
    type: database
    size: xl
    position:
      x: 2280
      'y': 120
  - id: discard
    label: |-
      拒绝该候选
      任一标注员均可阻止保留
      不采用多数票通过
      各类拒绝数量未公开
    type: terminal
    size: xl
    position:
      x: 2280
      'y': 480
  - id: release_audit
    label: |-
      固定发布物审计
      结构为 task、id、history
      ID 1–1388 · 每对话 2–7 轮
      重复历史：SI 1138 与 1142
    type: document
    size: xl
    position:
      x: 2560
      'y': 20
  - id: turn_gate
    label: |-
      该任务是否从第二轮
      开始直接评测？
    type: decision
    size: xl
    position:
      x: 2560
      'y': 280
  - id: skip_first
    label: |-
      跳过首轮评测
      FR · CR · AR · SA · SC · CM
      593 个对话各减少一个评测项
      从第二轮开始
    type: process
    size: xl
    position:
      x: 2840
      'y': 80
  - id: all_turns
    label: |-
      从第一轮开始评测
      CC · GR · IC · MR · PI · SI · TS
      保留全部已发布轮次
      不排除首轮
    type: process
    size: xl
    position:
      x: 2840
      'y': 480
  - id: evaluation_items
    label: |-
      构造 3,615 个评测项
      4,208 轮 − 593 个首轮
      黄金历史 + 当前用户输入
      仅评分最新回答
    type: database
    size: xl
    position:
      x: 3120
      'y': 280
  - id: candidate_response
    label: |-
      生成候选回答
      使用人工筛选的黄金上下文
      避免自生成历史误差累积
      仅推理最后一个回答
    type: process
    size: xl
    position:
      x: 3400
      'y': 280
  - id: judge
    label: |-
      任务专属 GPT-4 评审
      给出 1–10 分及理由
      输出 Rating: [[score]]
      论文温度为 0.6
    type: process
    size: xl
    position:
      x: 3680
      'y': 280
  - id: judge_drift
    label: |-
      固定 OpenCompass 实现边界
      gpt-4-1106-preview · 温度 0.8
      与论文温度 0.6 不同
      MR/GR 提示加入参考对话
    type: document
    size: xl
    position:
      x: 3680
      'y': 20
  - id: parse_gate
    label: |-
      正则能否找到
      方括号整数？
    type: decision
    size: xl
    position:
      x: 3960
      'y': 280
  - id: dialogue_minimum
    label: |-
      汇总成功解析的轮次分数
      对话分数取轮次最低值
      一轮失败即可拉低整段对话
      仅成功解析的轮次参与
    type: process
    size: xl
    position:
      x: 4240
      'y': 100
  - id: invalid_policy
    label: |-
      跳过无效评审输出
      当前版本不检查 1–10 范围
      无有效轮次的对话会消失
      全部无效则触发断言
    type: terminal
    size: xl
    position:
      x: 4240
      'y': 500
  - id: task_mean
    label: |-
      计算各任务分数
      对话最低分的无权平均
      13 项任务各得到一个值
      对话缺失会缩小分母
    type: process
    size: xl
    position:
      x: 4520
      'y': 100
  - id: paper_average
    label: |-
      计算论文 Avg.
      13 项任务分数的宏平均
      每项任务权重相同
      公开汇总器不输出该值
    type: process
    size: xl
    position:
      x: 4800
      'y': 100
  - id: human_validation
    label: |-
      验证自动评分
      随机 100 个对话 · 五名专家
      人工分数采用多数意见
      自动-人工 87% · 人工内部 80%
    type: user
    size: xl
    position:
      x: 4520
      'y': 500
  - id: implementation_boundary
    label: |-
      解析与报告边界
      正则读取第一个 [整数]
      无效输出降低实际覆盖率
      代码仅输出任务分，不输出 Avg.
    type: document
    size: xl
    position:
      x: 4800
      'y': 500
  - id: report
    label: |-
      报告能力画像
      论文比较 21 个 LLM
      分析任务与对话轮次
      结果来自论文表格而非实时榜单
    type: terminal
    size: xl
    position:
      x: 5080
      'y': 280
edges:
  - from: evidence
    to: dialogue_sources
    type: data
  - from: dialogue_sources
    to: taxonomy
    type: primary
  - from: taxonomy
    to: task_catalog
    type: primary
  - from: task_catalog
    to: generation_prompts
    type: primary
  - from: generation_prompts
    to: generate
    type: primary
  - from: generate
    to: screen
    type: primary
  - from: screen
    to: curation_gate
    type: primary
  - from: curation_gate
    to: release
    type: primary
    label: 五人全部通过
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: curation_gate
    to: discard
    type: optional
    label: 任一标注员拒绝
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: release
    to: release_audit
    type: optional
  - from: release
    to: turn_gate
    type: primary
  - from: turn_gate
    to: skip_first
    type: primary
    label: 是，六项直接评测任务
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: turn_gate
    to: all_turns
    type: primary
    label: 否，七项全轮次任务
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: skip_first
    to: evaluation_items
    type: primary
  - from: all_turns
    to: evaluation_items
    type: primary
  - from: evaluation_items
    to: candidate_response
    type: primary
  - from: candidate_response
    to: judge
    type: primary
  - from: judge
    to: judge_drift
    type: optional
  - from: judge
    to: parse_gate
    type: primary
  - from: parse_gate
    to: dialogue_minimum
    type: primary
    label: 成功解析方括号整数
    style:
      exitX: 1
      exitY: 0.25
      entryX: 0
      entryY: 0.5
  - from: parse_gate
    to: invalid_policy
    type: optional
    label: 无方括号整数
    style:
      exitX: 1
      exitY: 0.75
      entryX: 0
      entryY: 0.5
  - from: dialogue_minimum
    to: task_mean
    type: primary
  - from: task_mean
    to: paper_average
    type: primary
  - from: paper_average
    to: report
    type: primary
  - from: judge
    to: human_validation
    type: optional
  - from: human_validation
    to: report
    type: optional
  - from: invalid_policy
    to: implementation_boundary
    type: optional
  - from: task_mean
    to: implementation_boundary
    type: optional
modules: []
