meta:
  profile: academic-paper
  source: generated
  theme: academic-color
  layout: horizontal
  routing: orthogonal
  title: Pare-Bench Build and Evaluation Process
  description: >-
    Paper-v1 reconstruction of stateful app modeling, four-stage scenario generation, oracle retries, author
    verification, active-user evaluation, and proactive-assistant metrics.
  legend: >-
    Solid arrows are disclosed construction or evaluation stages. Dashed arrows identify fixed evidence, generator,
    app-count, release, and metric-name boundaries; they are not extra benchmark stages.
nodes:
  - id: source_evidence
    label: |-
      Fixed Official Evidence
      arXiv 2604.00842v1 · PDF 259caaeaa7d3
      Git 261149914a9e · tar c0c5aa90099a
      full.txt SHA 50b6d79aae2f
    type: document
    size: xl
    position:
      x: 120
      'y': 100
  - id: extend_are
    label: |-
      Extend the ARE Platform
      Reuse apps · scenarios · verification
      Add active user simulator agents
      Preserve shared persistent state
    type: document
    size: xl
    position:
      x: 380
      'y': 100
  - id: app_scope
    label: |-
      Define the Paper-v1 App Scope
      9 FSM apps across four domains
      System · Agent UI · FileSystem
      Core apps appear in Table 5
    type: database
    size: xl
    position:
      x: 640
      'y': 100
  - id: fsm_model
    label: |-
      Model Each User App as an FSM
      Screens become states
      Navigation and forms are transitions
      Track active and background apps
    type: process
    size: xl
    position:
      x: 900
      'y': 100
  - id: asymmetry
    label: |-
      Enforce Interface Asymmetry
      User sees state-dependent actions
      Assistant receives flat app APIs
      Both modify one shared environment
    type: process
    size: xl
    position:
      x: 1160
      'y': 100
  - id: scenario_schema
    label: |-
      Define Three Scenario Components
      Initial app states and seed data
      Environment and oracle event flow
      Final-state validation criteria
    type: document
    size: xl
    position:
      x: 1420
      'y': 100
  - id: generation_agent
    label: |-
      Launch the Generation Agent
      Code agent based on Claude Agent SDK
      Read-only Pare codebase context
      Require selected target apps
    type: process
    size: xl
    position:
      x: 1680
      'y': 100
  - id: description
    label: |-
      Stage 1 · Generate the Story
      Write a natural-language scenario
      Ground a latent user goal
      Specify realistic app context
    type: document
    size: xl
    position:
      x: 1940
      'y': 100
  - id: uniqueness
    label: |-
      Unique Story?
      LLM description check
    type: decision
    size: xl
    position:
      x: 2200
      'y': 100
  - id: app_state
    label: |-
      Stage 2 · Populate App State
      Generate init_and_populate_apps
      Seed contacts · mail · calendar data
      Establish the scenario context
    type: database
    size: xl
    position:
      x: 2460
      'y': 100
  - id: event_flow
    label: |-
      Stage 3 · Build the Event Flow
      Generate build_event_flow
      Schedule environment events
      Add oracle user and agent actions
    type: process
    size: xl
    position:
      x: 2460
      'y': 360
  - id: validation
    label: |-
      Stage 4 · Generate Validation
      Define final-state conditions
      Check required completion actions
      Bind the task-success oracle
    type: process
    size: xl
    position:
      x: 2200
      'y': 360
  - id: oracle_run
    label: Oracle Checks Pass?
    type: decision
    size: xl
    position:
      x: 1940
      'y': 360
  - id: human_review
    label: |-
      Paper §5: Authors Verify Every Candidate
      Check story coherence
      Check validation criteria correctness
      Check event content realism
    type: process
    size: xl
    position:
      x: 1680
      'y': 360
  - id: retry_router
    label: |-
      Route Failed Oracle Check
      Stage 2 app state · Stage 3 events
      Stage 4 validation
      Retry only the failed stage
    type: process
    size: xl
    position:
      x: 2200
      'y': 660
  - id: release
    label: |-
      Finalize Pare-Bench
      143 scenarios across four domains
      Context · goal · timing · orchestration
      Optional failures and noise supported
    type: database
    size: xl
    position:
      x: 1420
      'y': 360
  - id: eval_config
    label: |-
      Fix the Paper Evaluation Setup
      Four runs · GPT-5-mini user
      Maximum 10 turns · user one iteration
      Observe 5 · execute 10 iterations
    type: document
    size: xl
    position:
      x: 1420
      'y': 600
  - id: user_sim
    label: |-
      Active User Simulator
      Acts first each turn
      Current-state tools only
      Accept · reject · or gather context
    type: user
    size: xl
    position:
      x: 900
      'y': 600
  - id: observe
    label: |-
      Assistant Observe Mode
      Receive user action and notifications
      Read-only tools
      Wait or propose assistance
    type: process
    size: xl
    position:
      x: 640
      'y': 600
  - id: interaction_gate
    label: |-
      Proposal Outcome?
      Accept · reject · gather
      Or task end / turn limit
    type: decision
    size: xl
    position:
      x: 380
      'y': 600
  - id: execute
    label: |-
      Assistant Execute Mode
      Complete cross-app flat API
      Perform approved task only
      Then begin the next user turn
    type: process
    size: xl
    position:
      x: 380
      'y': 360
  - id: final_oracle
    label: |-
      Final-state Oracle
      Check fulfilled user goals
      Record proposals and acceptances
      Count read actions and turns
    type: process
    size: xl
    position:
      x: 120
      'y': 600
  - id: robustness
    label: |-
      Choose Environment Condition
      Baseline: no injected failure or noise
      Tool failure 0.1 · 0.2 · 0.4
      Poisson noise 2 · 4 · 6 events/min
      Noise interleaves scenario events
    type: process
    size: xl
    position:
      x: 1160
      'y': 600
  - id: metrics
    label: |-
      Report Four-run Metrics
      Success@4 · Success⁴
      Success · proposal rates
      Acceptance · mean read-only actions
    type: terminal
    size: xl
    position:
      x: 120
      'y': 360
  - id: generator_boundary
    label: |-
      Generator Reproducibility Boundary
      Paper names Claude Agent SDK only
      Checkpoints are not disclosed
      Paper build_event_flow · code build_events_flow
    type: document
    size: xl
    position:
      x: 1940
      'y': 900
  - id: app_boundary
    label: |-
      App-count Documentation Boundary
      Paper Table 5: 9 FSM plus 3 core
      README: 9 domain plus 2 core
      FileSystem is omitted from README count
    type: document
    size: xl
    position:
      x: 640
      'y': 900
  - id: release_boundary
    label: |-
      Fixed-release Boundary
      Git 261149914a9e · MIT
      143 scenario files · 143 full entries
      full.txt SHA 50b6d79aae2f
      No official HF dataset is linked
    type: document
    size: xl
    position:
      x: 1420
      'y': 900
  - id: metric_boundary
    label: |-
      Fixed Metric-semantics Boundary
      Paper: Success@k · Successᵏ
      Code: Pass@k · Passᵏ after null filtering
      Passᵏ may use fewer than k valid runs
      Read Actions sums user and assistant calls
    type: document
    size: xl
    position:
      x: 120
      'y': 900
